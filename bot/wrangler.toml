# Бот курса на Cloudflare Workers. Выкладывает его workflow «Бот на Cloudflare» (.github/workflows/bot.yml),
# инструкция — docs/bot_guide.md. Секреты (TELEGRAM_BOT_TOKEN, GITHUB_TOKEN, WEBHOOK_SECRET, ADMIN_CHAT_ID)
# workflow передаёт сам из GitHub Secrets, в этот файл их не пишите.
name = "espanol-cada-dia-bot"
main = "src/index.js"
compatibility_date = "2025-09-01"
workers_dev = true

[triggers]
crons = ["0 * * * *"]  # каждый час; публикует только в часы PUBLISH_HOURS по TIMEZONE

[vars]
PUBLISH_HOURS = "9,15"  # во сколько по Киеву выходят уроки (два поста в день)
REMIND_DAYS = "3,6"     # в какие дни бот сам предлагает повторить слова: 0 — вс, 3 — ср, 6 — сб
REMIND_HOUR = "19"      # во сколько по Киеву
WORDS_HOURS = "8,19"   # «Мои слова» (/palabras, только автор): в какие часы по Киеву бот зовёт заниматься (утро, вечер)
WORDS_PER_DAY = "10"    # новых слов в каждую смену
CHOICES = "4"           # вариантов перевода на карточке повторения (можно 6)
TIMEZONE = "Europe/Kyiv"
GITHUB_REPO = "JudithPena/Espa-ol-cada-d-a"
GITHUB_BRANCH = "ccr-f4c9bfd6-txio5n"
PUBLISH_WORKFLOW = "publish.yml"

[[kv_namespaces]]
binding = "SRS"
id = "KV_NAMESPACE_ID"  # workflow подставляет id хранилища «espanol-cada-dia-srs»

[assets]
directory = "./public"  # озвучка слов: public/audio/*.mp3
