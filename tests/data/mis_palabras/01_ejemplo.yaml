# Образец для тестов: так выглядят карточки «Моих слов» (content/mis_palabras/).
lang: es
words:
  - word: echar de menos
    ru: скучать (по кому-то, чему-то)
    ipa: /eˈtʃaɾ ðe ˈmenos/
    say: эча́р де ме́нос
    pron: "d между гласными звучит мягко, почти как th в английском _this_."
    meaning: "Скучать по кому-то или чему-то, когда этого не хватает. Спрягается только echar, а de menos не меняется."
    examples:
      - "Echo de menos a mi familia. — Я скучаю по своей семье."
      - "¿Me has echado de menos? — Ты по мне скучал?"
      - "En Madrid echo de menos el mar. — В Мадриде мне не хватает моря."
    origin: "Буквально «счесть недостающим»: echar — «бросать», de menos — «меньше, в недостаче». Отсюда и второе значение — «заметить, что чего-то нет»: Eché de menos las llaves."
    register: "Нейтральное, годится и для разговора, и для письма. Типично для Испании."
    synonyms:
      - word: extrañar
        pair: ["Echo de menos mi casa.", "Extraño mi casa."]
        diff:
          - "extrañar — обычное слово в Латинской Америке"
          - "в Испании extrañar чаще значит «удивлять»: Me extraña. — Меня удивляет."
    analogs:
      - "to miss — то же значение, но miss ещё и «опоздать, промахнуться»"
      - "to long for — сильнее: «тосковать»"
    dialogue:
      - "Ana: ¿Qué tal en Londres? | Как тебе в Лондоне?"
      - "Pablo: Bien, pero echo de menos el sol. | Хорошо, но скучаю по солнцу."
      - "Ana: ¡Y nosotros te echamos de menos a ti! | А мы скучаем по тебе!"
    cefr: "A2 — нужно, чтобы говорить о чувствах, но это выражение из трёх слов."
    frequency: "Очень частое в разговоре и переписке, особенно в Испании."
    collocations:
      - "echar mucho de menos — очень скучать"
      - "echar de menos a alguien — скучать по кому-то"
      - "se te echa de menos — по тебе скучают"
    collocation_example: "Te echo mucho de menos. — Я очень по тебе скучаю."
    trap: "Перед человеком нужен предлог a: Echo de menos **a** mi madre. Не путайте с echar a perder — «испортить»."

  - word: subtle
    lang: en
    ru: тонкий, едва заметный
    ipa: /ˈsʌt.əl/
    say: са́тл
    pron: "Буква b не читается, как в _debt_ и _doubt_."
    meaning: "Едва заметный, тонкий; о человеке — проницательный, деликатный."
    examples:
      - "There is a subtle difference. — Есть тонкая разница."
      - "She gave me a subtle hint. — Она тонко мне намекнула."
    origin: "Из латинского subtilis — «тонко сотканный»: sub — «под», tela — «ткань». Немая b вернулась в написание в XVI веке, когда слова «подправляли» под латынь."
    register: "Нейтральное, частое и в речи, и в текстах."
    synonyms:
      - word: slight
        pair: ["There is a subtle change.", "There is a slight change."]
        diff:
          - "slight — просто «небольшой», без оттенка изящества"
    analogs:
      - "sutil — то же значение, даже корень тот же"
    dialogue:
      - "A: Did you notice the change? | Ты заметил перемену?"
      - "B: Yes, it was subtle, but I saw it. | Да, она едва заметна, но я увидел."
    cefr: "B2 — абстрактное слово с немой буквой."
    frequency: "Частое в книгах, статьях и обзорах."
    collocations:
      - "a subtle difference — тонкая разница"
      - "a subtle hint — тонкий намёк"
      - "subtle humour — тонкий юмор"
    collocation_example: "I love his subtle humour. — Обожаю его тонкий юмор."
    trap: "Не произносите b. И не путайте с suttle — такого слова нет."
