name: Сайт курса

# Собирает сайт (python -m espanol site) и выкладывает на Cloudflare Pages: https://espanolcadadia.pages.dev
# Нужны те же секреты, что и боту: CLOUDFLARE_API_TOKEN (с правом «Cloudflare Pages: Edit») и CLOUDFLARE_ACCOUNT_ID.
# Пока их нет, workflow ничего не делает.
# Рабочая ветка выкладывается на основной адрес; ветки claude/** — отдельным предпросмотром
# (https://<имя-ветки>.espanolcadadia.pages.dev), основной сайт при этом не меняется.

on:
  push:
    branches: [ccr-f4c9bfd6-txio5n, "claude/**"]
    paths:
      - "content/**"
      - "espanol/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

concurrency:
  group: site-deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  PROJECT: espanolcadadia

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Настроен ли Cloudflare
        id: check
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::Cloudflare не настроен (нет CLOUDFLARE_API_TOKEN или CLOUDFLARE_ACCOUNT_ID в Secrets) — сайт не выкладываю."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.check.outputs.ready == 'true'

      - uses: actions/setup-python@v6
        if: steps.check.outputs.ready == 'true'
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v5
        if: steps.check.outputs.ready == 'true'
        with:
          node-version: "22"

      # Озвучка сайта (espanol/site_audio.py): записи нейроголосами хранятся в кэше между сборками,
      # поэтому записываются только новые слова. Первая сборка записывает всё (~3000 фраз, несколько минут).
      - name: Кэш озвучки
        if: steps.check.outputs.ready == 'true'
        uses: actions/cache@v4
        with:
          path: .cache/site-audio
          key: site-audio-${{ github.run_id }}
          restore-keys: site-audio-

      - name: Сборка сайта
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          if [ "$GITHUB_REF_NAME" = "ccr-f4c9bfd6-txio5n" ]; then
            python -m espanol site --audio-cache .cache/site-audio -o _site/index.html | tee build.log
          else
            # тестовая версия: то же самое, но с меткой «тест» в шапке
            python -m espanol site --preview --audio-cache .cache/site-audio -o _site/index.html | tee build.log
          fi
          grep "Озвучка сайта" build.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: Проверить бюджет Cloudflare после копирования аудио
        if: steps.check.outputs.ready == 'true'
        run: |
          python -m espanol.site_budget _site | tee site-budget.json
          cat site-budget.json >> "$GITHUB_STEP_SUMMARY"

      - name: Проект на Cloudflare Pages
        if: steps.check.outputs.ready == 'true'
        run: |
          # Проект создаётся один раз; если он уже есть, команда сообщит об этом и мы идём дальше.
          npx --yes wrangler@4 pages project create "$PROJECT" --production-branch main || echo "Проект уже существует или не создался: смотрим на выкладку ниже."

      - name: Выложить сайт
        if: steps.check.outputs.ready == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = "ccr-f4c9bfd6-txio5n" ]; then
            BRANCH=main
            TITLE="Сайт выложен"
          else
            BRANCH="$GITHUB_REF_NAME"
            TITLE="Предпросмотр выложен (основной сайт не изменился)"
          fi
          set -euo pipefail
          npx --yes wrangler@4 pages deploy _site --project-name "$PROJECT" --branch "$BRANCH" --commit-dirty=true | tee deploy.log
          {
            echo "### $TITLE"
            grep -oE 'https://[a-zA-Z0-9.-]+\.pages\.dev' deploy.log | head -1
            if [ "$BRANCH" != main ]; then
              ALIAS=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
              echo "Постоянный адрес этой ветки: https://$ALIAS.$PROJECT.pages.dev"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
