name: Проверка курса

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Проверка словаря и лимитов Telegram
        run: python -m espanol validate
      - name: Тесты
        run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Тесты бота на Cloudflare
        run: |
          python -m espanol bot-data --no-audio
          node --test bot/test/*.test.js
