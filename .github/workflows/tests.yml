name: Проверка курса

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Проверка словаря и лимитов Telegram
        run: python -m espanol validate
      - name: Тесты
        run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Новые проверки политики трёх жизней
        run: node --test tests/site_grammar_policy.test.cjs
      - name: Плеер грамматики и распределение вариантов ответа
        run: node --test tests/site_grammar.test.cjs
      - name: Уроки основного курса на сайте (сценарии, проверка ответов)
        run: node --test tests/site_course.test.cjs
      - name: Тесты бота на Cloudflare
        run: |
          python -m espanol bot-data --no-audio
          node --test bot/test/*.test.js

  grammar-browser-pr34:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/grammar-three-lives-review-20261111'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site and real Chromium test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Build the actual grammar website
        run: python -m espanol site
      - name: Run Chromium at 320, 390, 768, and 1280px
        run: python tests/grammar_pr34_browser.py
      - name: Keep screenshots and JSON evidence in Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-pr34-chromium-screenshots
          path: docs/grammar_pr34_browser/
          if-no-files-found: warn
      - name: Save screenshots and results to the current PR branch
        if: false # The validated merge job will save the final snapshots to avoid racing pushes
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/grammar_pr34_browser/
          if ! git diff --cached --quiet; then
            git commit -m "test(grammar): archive PR 34 Chromium visual evidence [skip ci]"
            git push origin HEAD:fix/grammar-three-lives-review-20261111
          fi

  grammar-merge-audit-pr34:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/grammar-three-lives-review-20261111'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect merge conflicts with current PR base
        run: |
          git fetch origin claude/charming-cerf-bzze60
          set +e
          git -c user.name="PR audit" -c user.email="audit@localhost" merge --no-commit --no-ff origin/claude/charming-cerf-bzze60
          status=$?
          echo "Merge exit: $status"
          echo "Unmerged paths:"
          git diff --name-only --diff-filter=U
          echo "Conflict markers (redacted to 240 lines each):"
          for p in espanol/grammar_player.js tests/site_grammar.test.cjs espanol/site_template.html docs/site_grammar_guide.md; do
            if git ls-files --unmerged -- "$p" | grep -q .; then
              echo "::group::$p"
              python - "$p" <<'PY'
          import sys
          lines=open(sys.argv[1]).read().splitlines()
          markers=[i for i,x in enumerate(lines) if x.startswith(('<<<<<<<','=======','>>>>>>>'))]
          for at in markers[:45]:
              print(f'{at+1}: ' + ' | '.join(f'{j+1}:{lines[j][:180]}' for j in range(max(at-2,0),min(at+3,len(lines)))))
          PY
              echo "::endgroup::"
            fi
          done
          git merge --abort >/dev/null 2>&1 || true
          exit 0

  grammar-merge-preview-pr34:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/grammar-three-lives-review-20261111'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Merge into current PR branch without committing
        id: merge
        run: |
          git fetch origin claude/charming-cerf-bzze60
          if git merge-base --is-ancestor origin/claude/charming-cerf-bzze60 HEAD; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Target branch already integrated; no merge commit needed."
            exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          git -c user.name="PR integration audit" -c user.email="audit@localhost" merge --no-ff --no-commit origin/claude/charming-cerf-bzze60 || true
          python tools/resolve_pr34_merge.py
          test -z "$(git diff --name-only --diff-filter=U)"
      - name: Export merged code for independent review
        if: always()
        run: |
          tar -czf /tmp/pr34_merged_source.tar.gz espanol/grammar_player.js espanol/site_template.html tests/site_grammar.test.cjs tests/site_grammar_policy.test.cjs content/grammar/
      - name: Archive merged source for independent tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr34-merged-source
          path: /tmp/pr34_merged_source.tar.gz
      - name: Install project dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate the combined grammar and all repository tests
        run: |
          python -m espanol validate
          python -m pytest -q
          node --test tests/site_grammar_policy.test.cjs tests/site_grammar.test.cjs tests/site_course.test.cjs
      - name: Build the merged website
        run: python -m espanol site
      - name: Install browser and run real Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          python tests/grammar_pr34_browser.py
      - name: Preserve merged-run browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-pr34-merged-preview
          path: docs/grammar_pr34_browser/
          if-no-files-found: warn
      - name: Commit verified merge to current PR branch (do not merge the PR)
        if: steps.merge.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/grammar_pr34_browser/ || true
          git diff --check
          git commit -m "Merge latest grammar target into PR 34 after validated conflict resolution"
          git push origin HEAD:fix/grammar-three-lives-review-20261111
