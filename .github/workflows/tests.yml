name: Проверка курса

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Проверка словаря и лимитов Telegram
        run: python -m espanol validate
      - name: Тесты
        run: pytest -q
