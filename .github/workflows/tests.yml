name: Проверка курса

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - name: Схема данных и методический линтер грамматики
        run: |
          python tools/grammar_schema_docs.py --check
          python -m espanol grammar-lint --report /tmp/grammar-lint-summary.md --json-out /tmp/grammar-lint-findings.json
          python -m espanol grammar-lint 5
          python -m espanol grammar-lint 13
          python -m espanol grammar-lint 8
          python -m espanol grammar-lint 2 --report /tmp/unit2-lint-summary.md --json-out /tmp/unit2-lint-findings.json
          python -m espanol grammar-lint 14 --report /tmp/unit14-lint-summary.md --json-out /tmp/unit14-lint-findings.json
          python -c "from pathlib import Path; print(Path('/tmp/unit14-lint-summary.md').read_text())"
          python -c "from pathlib import Path; print(Path('/tmp/unit2-lint-summary.md').read_text())"
      - name: Сопоставимый исходный линтер юнита 14 (та же версия правил)
        run: |
          git fetch --depth=1 origin aec374162c5ae0c44f0150308a4831c2773c58d6
          cp content/grammar/014_gentilicios.json /tmp/unit14-current.json
          trap 'cp /tmp/unit14-current.json content/grammar/014_gentilicios.json' EXIT
          git show aec374162c5ae0c44f0150308a4831c2773c58d6:content/grammar/014_gentilicios.json > content/grammar/014_gentilicios.json
          python -m espanol grammar-lint 14 --report /tmp/unit14-before-lint-summary.md --json-out /tmp/unit14-before-lint-findings.json
          python -c "from pathlib import Path; print(Path('/tmp/unit14-before-lint-summary.md').read_text())"
      - name: Архив диагностик грамматического линтера
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-linter-diagnostics
          path: |
            /tmp/grammar-lint-summary.md
            /tmp/grammar-lint-findings.json
            /tmp/unit2-lint-summary.md
            /tmp/unit2-lint-findings.json
            /tmp/unit14-lint-summary.md
            /tmp/unit14-lint-findings.json
            /tmp/unit14-before-lint-summary.md
            /tmp/unit14-before-lint-findings.json
          if-no-files-found: warn
      - name: Проверка словаря и лимитов Telegram
        run: python -m espanol validate
      - name: Локальная сборка грамматического сайта без публикации
        run: python -m espanol site
      - name: Тесты
        run: python -m pytest -q
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Новые проверки политики трёх жизней
        run: node --test tests/site_grammar_policy.test.cjs
      - name: Плеер грамматики и распределение вариантов ответа
        run: node --test tests/site_grammar.test.cjs
      - name: Этап 3 — контекстные ударения и альтернативные ответы
        run: node --test tests/grammar_stage3.test.cjs
      - name: Статические данные, кеш, ошибки сети и сохранность прогресса
        run: |
          python -m espanol.site_budget site
          node --test tests/site_static_data.test.cjs
      - name: Уроки основного курса на сайте (сценарии, проверка ответов)
        run: node --test tests/site_course.test.cjs
      - name: Тесты бота на Cloudflare
        run: |
          python -m espanol bot-data --no-audio
          node --test bot/test/*.test.js

  grammar-browser-pr34:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/grammar-three-lives-review-20261111'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install site and real Chromium test dependencies
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Build the actual grammar website
        run: python -m espanol site
      - name: Run Chromium at 320, 390, 768, and 1280px
        run: python tests/grammar_pr34_browser.py
      - name: Keep screenshots and JSON evidence in Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-pr34-chromium-screenshots
          path: docs/grammar_pr34_browser/
          if-no-files-found: warn
      - name: Save screenshots and results to the current PR branch
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Capture corrected PR34 screenshots')
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/grammar_pr34_browser/
          if ! git diff --cached --quiet; then
            git commit -m "test(grammar): archive PR 34 Chromium visual evidence [skip ci]"
            git push origin HEAD:fix/grammar-three-lives-review-20261111
          fi

  grammar-immediate-feedback-browser:
    if: github.event_name == 'pull_request' && (github.head_ref == 'fix/grammar-immediate-feedback-20261111' || github.head_ref == 'audit/grammar-schema-linter-20261111' || github.head_ref == 'audit/fable-stage3-recovered-20261111' || github.head_ref == 'audit/fable-stage4-unit07-20261111' || github.head_ref == 'audit/fable-stage5-unit05-20261111' || github.head_ref == 'audit/fable-stage6-unit13-20261111' || github.head_ref == 'audit/fable-stage7-unit08-20261111' || github.head_ref == 'audit/fable-stage8-unit02-20261111')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies and real Playwright Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          # Ubuntu 24.04 runners supply the shared libraries; skip flaky apt mirrors.
          python -m playwright install chromium
      - name: Build local website without deploying
        run: python -m espanol site
      - name: Chromium regression (320, 390, 768, 1280px; 1, 5, 7, 8, 13, 15, 38, 45)
        run: python tests/grammar_immediate_feedback_browser.py
      - name: Archive screenshots and machine results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-immediate-feedback-browser
          path: docs/grammar_immediate_feedback_browser/
          if-no-files-found: warn

  static-data-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chromium test dependencies
        run: |
          pip install -r requirements.txt playwright
          python -m playwright install --with-deps chromium
      - name: Build without publication and test actual JSON loading
        run: |
          python -m espanol site
          python -m espanol.site_budget site
          git worktree add --detach /tmp/ecd-site-baseline HEAD^
          (cd /tmp/ecd-site-baseline && python -m espanol site -o /tmp/ecd-site-before/index.html)
          python tests/site_static_browser.py --site site --baseline /tmp/ecd-site-before --report /tmp/site-static-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: static-data-browser
          path: /tmp/site-static-browser.json

  grammar-unit14-browser:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/fable-stage9-unit14-20261112'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies and real Chromium
        run: |
          python -m pip install -r requirements.txt playwright
          python -m playwright install chromium
      - name: Build site locally without publishing
        run: python -m espanol site
      - name: Stage 9 — unit 14 Chromium 320/390/768/1280px, answers, lives, revisions
        run: python tests/grammar_unit14_browser.py
      - name: Archive unit 14 Chromium evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grammar-unit14-chromium
          path: docs/grammar_unit14_browser/
          if-no-files-found: warn
