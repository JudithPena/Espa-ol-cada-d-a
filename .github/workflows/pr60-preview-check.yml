name: PR60 — проверить опубликованный предпросмотр

on:
  push:
    branches: ["codex/split-static-learning-data"]
    paths:
      - "tests/site_preview_browser.py"
      - ".github/workflows/pr60-preview-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install real Chromium
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test immutable full-audio deployment (no publication)
        run: python tests/site_preview_browser.py --url https://c9c554ea.espanolcadadia.pages.dev --report /tmp/pr60-live-browser.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr60-live-browser
          path: /tmp/pr60-live-browser.json
