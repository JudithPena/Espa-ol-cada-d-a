name: Тест урока в личку

# Отправляет урок не в канал, а в личный чат тому, кто последним написал боту
# (например, /start в @Eduardo_maestro_bot). Прогресс публикации не меняется.
# «канал» — повторно опубликовать уже вышедший урок (например, если пост удалили, чтобы исправить).
on:
  workflow_dispatch:
    inputs:
      lesson:
        description: "Номер урока (вводный — 0)"
        default: "8"
      rich:
        description: "Новый формат: пост-статья с картинками и аудио внутри"
        type: boolean
        default: true
      target:
        description: "Куда отправить"
        type: choice
        options: [личка, канал]
        default: личка
      edit:
        description: "Номер поста, чтобы исправить его, а не отправлять новый (из ссылки t.me/espanol_cada_dia/160)"
        default: ""

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Шрифт для эмодзи на картинках
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji

      - name: Установить зависимости
        run: pip install -r requirements.txt

      - name: Отправить урок в личный чат
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_REVIEW_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}  # личка автора, когда бот на Cloudflare
          ENABLE_AUDIO: ${{ vars.ENABLE_AUDIO || '1' }}
          LESSON: ${{ inputs.lesson }}
          RICH: ${{ inputs.rich }}
          TARGET: ${{ inputs.target }}
          EDIT: ${{ inputs.edit }}
        run: |
          args=()
          [ "$TARGET" != "канал" ] && args+=(--chat auto)
          [ -n "$EDIT" ] && args+=(--edit "$EDIT")
          [ "$RICH" = "true" ] && args+=(--rich)
          python -m espanol send "$LESSON" "${args[@]}"
