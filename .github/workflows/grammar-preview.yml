name: Грамматика — отправить в личку
# Юнит 1: редактура под Telegram, ответ раскрывается нажатием на каждый вопрос.

on:
  workflow_dispatch:
    inputs:
      unit:
        description: "Постоянный ID юнита из content/grammar.json"
        required: true
        default: "001_el_hijo_la_hija"
  push:
    branches: [ccr-f4c9bfd6-txio5n]
    paths: [".github/workflows/grammar-preview.yml"]

permissions:
  contents: read

concurrency:
  group: grammar-private-preview
  cancel-in-progress: false

jobs:
  send:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[grammar-preview:001_el_hijo_la_hija]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Отправить юнит одной статьёй Rich Message только автору
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          ADMIN_CHAT_ID: ${{ secrets.TELEGRAM_REVIEW_CHAT_ID }}
          UNIT: ${{ inputs.unit || '001_el_hijo_la_hija' }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from "node:fs";
          import { sendGrammarPreview } from "./bot/src/grammar.js";
          const posts = JSON.parse(readFileSync("content/grammar.json", "utf8"));
          const matches = posts.filter(p => p.id === process.env.UNIT);
          if (matches.length !== 1) throw new Error("Юнит не найден или ID неоднозначен");
          const result = await sendGrammarPreview(process.env, matches[0]);
          console.log("Одна статья принята Telegram; message_id=" + result.message_id);
          console.log("Плановая очередь не изменена.");
          JS
