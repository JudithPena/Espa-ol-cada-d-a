# Загадки для викторин. Слово, которое звучит почти как русское («la tortilla» — «тортилья»),
# бессмысленно спрашивать «Как по-испански «тортилья»?» — ответ подсказывает сам вопрос.
# Для таких слов вопрос — загадка, а варианты ответа испанские. Похожие слова находит
# espanol/quizgen.py (looks_alike); если для такого слова загадки нет, опроса по нему не будет.

# Еда и напитки
la tortilla: "Как в Испании называют омлет из картошки и яиц?"
la paella: "Какое блюдо из риса с морепродуктами готовят в Валенсии?"
la tapa: "Как в Испании называют маленькую закуску к напитку в баре?"
