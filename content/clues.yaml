el café: "Какой горячий напиток пьют утром, чтобы проснуться?"
el vino: "Какой напиток делают из винограда?"
la tostada: "Как называется поджаренный ломтик хлеба, который в Испании едят на завтрак?"
la fruta: "Как одним словом назвать яблоки, апельсины и бананы?"

