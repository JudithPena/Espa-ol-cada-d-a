# Тема 9 «Описание людей». Правила — docs/repaso_guide.md.
words:
  - es: la lección
    pron: "c перед c: «кθ», ударение на последнем слоге: «лэкθьо́н»."
    meaning: "Урок (в учебнике, в курсе)."
    examples:
      - "Es la lección de gramática. — Это урок грамматики."
    collocations:
      - "dar una lección — проучить"
    trap: "Урок в школе как занятие — la clase. Lección — урок в учебнике."

  - es: el tema
    meaning: "Тема. Мужского рода, хотя на -a."
    examples:
      - "Es el tema de la familia. — Это тема «Семья»."
    collocations:
      - "cambiar de tema — сменить тему"
    trap: "el tema — исключение: на -a, но мужского рода, как el problema."

  - es: el vocabulario
    pron: "v — как b: «бокабула́рьо»."
    meaning: "Лексика, словарный запас."
    examples:
      - "Es la lección de vocabulario. — Это урок лексики."
    collocations:
      - "el vocabulario nuevo — новая лексика"
    trap: "Словарь как книга — el diccionario."

  - es: la gramática
    pron: "Ударение на ma: «грама́тика»."
    meaning: "Грамматика."
    examples:
      - "Es la lección de gramática. — Это урок грамматики."
    collocations:
      - "la regla de gramática — правило грамматики"
    trap: "Знак ударения: gramática."

  - es: el diálogo
    pron: "Ударение на первом a: «дья́лого»."
    meaning: "Диалог."
    examples:
      - "Escucha el diálogo. — Послушай диалог."
    collocations:
      - "el diálogo en el café — диалог в кафе"
    trap: "Знак ударения: diálogo."

  - es: la lectura
    meaning: "Чтение; текст для чтения."
    examples:
      - "Es la lección de lectura. — Это урок чтения."
    collocations:
      - "la lectura rápida — быстрое чтение"
    trap: "Не «лекция»: лекция — la conferencia или la clase."

  - es: la práctica
    pron: "Ударение на первом слоге: «пра́ктика»."
    meaning: "Практика."
    examples:
      - "Es la lección de práctica. — Это практический урок."
    collocations:
      - "en la práctica — на практике"
    trap: "la práctica (практика) со знаком, practica (тренируйся) без."

  - es: el test
    meaning: "Тест."
    examples:
      - "En la lección hay un test. — В уроке есть тест."
    collocations:
      - "hacer un test — пройти тест"
    trap: "Множественное — los tests."

  - es: el chico / la chica
    pron: "ch — «ч»."
    meaning: "Парень, мальчик / девушка, девочка."
    examples:
      - "Es un chico alto. — Это высокий парень."
      - "La chica es alta y rubia. — Девушка высокая и светловолосая."
    collocations:
      - "los chicos — ребята"
    trap: "chico как прилагательное — «маленький» (в Латинской Америке)."

  - es: alto/a
    meaning: "Высокий, высокая. Ещё — громкий: en voz alta."
    examples:
      - "Pablo es alto. — Пабло высокий."
      - "Mi hermana es alta. — Моя сестра высокая."
    collocations:
      - "en voz alta — вслух"
    trap: "Согласуется с человеком: él es alto, ella es alta."

  - es: bajo/a
    pron: "j — «х»: «ба́хо»."
    meaning: "Невысокий, низкий. Ещё — тихий: en voz baja."
    examples:
      - "Mi padre es bajo. — Мой отец невысокий."
    collocations:
      - "en voz baja — тихо, вполголоса"
    trap: "bajo — ещё и «под»: bajo la mesa."

  - es: joven
    pron: "j — «х», v — как b: «хо́бэн»."
    meaning: "Молодой, молодая — одна форма."
    examples:
      - "Mi madre es joven. — Моя мама молодая."
    collocations:
      - "los jóvenes — молодёжь"
    trap: "Во множественном появляется знак: jóvenes."

  - es: rubio/a
    meaning: "Светловолосый, блондин(ка)."
    examples:
      - "Ana es rubia. — Ана блондинка."
    collocations:
      - "pelo rubio — светлые волосы"
    trap: "rubio — светлые волосы, а не «рыжий» (pelirrojo)."

  - es: moreno/a
    meaning: "Темноволосый; смуглый, загорелый."
    examples:
      - "Pablo es moreno. — Пабло брюнет."
    collocations:
      - "ponerse moreno — загореть"
    trap: "moreno — и брюнет, и загорелый: Estoy moreno — «Я загорел»."

  - es: guapo/a
    pron: "gu перед a — «гуа»."
    meaning: "Красивый, красивая — о человеке."
    examples:
      - "Tu hermana es muy guapa. — Твоя сестра очень красивая."
    collocations:
      - "¡qué guapo! — какой красивый!"
    trap: "О вещах и местах — bonito: una casa bonita, а guapo — о людях."

  - es: delgado/a
    meaning: "Худой, стройный."
    examples:
      - "Es alto y delgado. — Он высокий и худой."
    collocations:
      - "estar delgado — похудеть, быть худым сейчас"
    trap: "Противоположное — gordo «толстый», но вежливее — un poco grueso."

  - es: simpático/a
    pron: "Ударение на pa: «симпа́тико»."
    meaning: "Милый, приятный, дружелюбный — о характере, а не о внешности."
    examples:
      - "Mi profesor es muy simpático. — Мой преподаватель очень приятный."
    collocations:
      - "caer simpático — нравиться (о человеке)"
    trap: "simpático — о характере! «Симпатичный» внешне — guapo."

  - es: antipático/a
    meaning: "Неприятный, недружелюбный."
    examples:
      - "El camarero es antipático. — Официант неприятный."
    collocations:
      - "muy antipático — очень неприятный"
    trap: "О характере, не о внешности."

  - es: inteligente
    pron: "g перед e — «х»: «интэлихэ́нтэ»."
    meaning: "Умный, умная — одна форма."
    examples:
      - "Mi hija es muy inteligente. — Моя дочь очень умная."
    collocations:
      - "muy inteligente — очень умный"
    trap: "Одна форма для обоих родов: él es inteligente, ella es inteligente."

  - es: divertido/a
    pron: "v — как b: «дибэрти́до»."
    meaning: "Весёлый; забавный, интересный."
    examples:
      - "Mi primo es muy divertido. — Мой двоюродный брат очень весёлый."
    collocations:
      - "una película divertida — весёлый фильм"
    trap: "divertido — «весёлый», а не «разведённый» (divorciado)."

  - es: serio/a
    meaning: "Серьёзный."
    examples:
      - "Mi padre es serio. — Мой отец серьёзный."
    collocations:
      - "¿en serio? — серьёзно?"
    trap: "¿En serio? — «Правда?» — очень частая реакция в разговоре."

  - es: tímido/a
    pron: "Ударение на первом слоге: «ти́мидо»."
    meaning: "Застенчивый, робкий."
    examples:
      - "Es un chico tímido. — Это застенчивый парень."
    collocations:
      - "muy tímido — очень застенчивый"
    trap: "Знак ударения: tímido."

  - es: trabajador/a
    pron: "j — «х»: «трабахадо́р»."
    meaning: "Трудолюбивый; как существительное — работник."
    examples:
      - "Ana es muy trabajadora. — Ана очень трудолюбивая."
    collocations:
      - "los trabajadores — работники"
    trap: "Женский род — trabajadora, с -a."

  - es: "¿Cómo es...?"
    meaning: "Какой (какая) он / она? — о внешности и характере."
    examples:
      - "¿Cómo es tu hermana? — Какая твоя сестра?"
      - "¿Cómo es tu profesor? Es simpático. — Какой твой преподаватель? Приятный."
    collocations:
      - "¿cómo está? — как он (себя чувствует)?"
    trap: "¿Cómo es? — какой человек по сути (ser), ¿Cómo está? — как он сейчас (estar)."

  - es: muy
    pron: "uy — одним слогом: «муй»."
    meaning: "Очень — перед прилагательным и наречием."
    examples:
      - "Es muy alto. — Он очень высокий."
      - "Muy bien. — Очень хорошо."
    collocations:
      - "muy bien — очень хорошо"
    trap: "Без прилагательного — mucho: Me gusta mucho, а не me gusta muy."

  - es: bastante
    meaning: "Довольно, достаточно."
    examples:
      - "Es bastante alto. — Он довольно высокий."
    collocations:
      - "bastante bien — довольно хорошо"
    trap: "Перед существительным согласуется в числе: bastantes libros."

  - es: "¿De qué color es?"
    meaning: "Какого это цвета?"
    examples:
      - "¿De qué color es tu mochila? Es roja. — Какого цвета твой рюкзак? Красный."
    collocations:
      - "el color — цвет"
    trap: "el color — мужского рода, хотя «краска» — la pintura."

  - es: rojo/a
    pron: "r в начале раскатистое, j — «х»: «ро́хо»."
    meaning: "Красный."
    examples:
      - "La mochila es roja. — Рюкзак красный."
    collocations:
      - "el vino tinto — красное вино (не rojo!)"
    trap: "Красное вино — vino tinto. Рыжий — pelirrojo."

  - es: azul
    pron: "z — как th в think: «аθу́ль»."
    meaning: "Синий, голубой — одна форма."
    examples:
      - "La puerta es azul. — Дверь синяя."
    collocations:
      - "azul claro — голубой"
    trap: "Голубой — azul claro, синий — azul oscuro."

  - es: verde
    pron: "v — как b: «бэ́рдэ»."
    meaning: "Зелёный; о фруктах — незрелый."
    examples:
      - "La mochila es verde. — Рюкзак зелёный."
    collocations:
      - "estar verde — быть незрелым, неопытным"
    trap: "Одна форма для обоих родов."

  - es: amarillo/a
    pron: "ll — как «й»: «амари́йо»."
    meaning: "Жёлтый."
    examples:
      - "El taxi es amarillo. — Такси жёлтое."
    collocations:
      - "la prensa amarilla — жёлтая пресса"
    trap: "Не путайте с marrón «коричневый»."

  - es: blanco/a
    meaning: "Белый."
    examples:
      - "La casa es blanca. — Дом белый."
    collocations:
      - "el vino blanco — белое вино"
    trap: "Не путайте с «бланк»: бланк — el formulario."

  - es: negro/a
    meaning: "Чёрный."
    examples:
      - "Mi gato es negro. — Мой кот чёрный."
    collocations:
      - "el café solo — чёрный кофе (не negro)"
    trap: "Чёрный кофе — café solo."

  - es: marrón
    pron: "rr — раскатистое, ударение на последнем слоге."
    meaning: "Коричневый — одна форма."
    examples:
      - "La mesa es marrón. — Стол коричневый."
    collocations:
      - "zapatos marrones — коричневые туфли"
    trap: "О глазах и волосах — не marrón: глаза — marrones, но волосы — castaño."

  - es: el ojo
    pron: "j — «х»: «о́хо»."
    meaning: "Глаз."
    examples:
      - "Tiene los ojos azules. — У него голубые глаза."
    collocations:
      - "¡ojo! — осторожно!"
    trap: "¡Ojo! — «Внимание! Осторожно!», а не просто «глаз»."

  - es: el pelo
    meaning: "Волосы — в единственном числе."
    examples:
      - "Tiene el pelo largo. — У неё длинные волосы."
    collocations:
      - "tomar el pelo — подшучивать, разыгрывать"
    trap: "Волосы — el pelo, в единственном: tiene el pelo rubio."

  - es: largo/a
    meaning: "Длинный."
    examples:
      - "Tiene el pelo largo. — У неё длинные волосы."
    collocations:
      - "a lo largo de — вдоль"
    trap: "largo — «длинный», а не «большой» (grande)."

  - es: corto/a
    meaning: "Короткий."
    examples:
      - "Tiene el pelo corto. — У него короткие волосы."
    collocations:
      - "un texto corto — короткий текст"
    trap: "О росте — bajo, а corto — о длине."

  - es: castaño/a
    pron: "ñ — «нь»: «каста́ньо»."
    meaning: "Каштановый — о волосах и глазах."
    examples:
      - "Tiene el pelo castaño. — У неё каштановые волосы."
    collocations:
      - "ojos castaños — карие глаза"
    trap: "О волосах — castaño, а не marrón."

  - es: llevar
    pron: "ll — как «й», v — как b: «йэба́р»."
    meaning: "Носить (одежду, очки); нести; везти."
    examples:
      - "Llevo gafas. — Я ношу очки."
      - "Ana lleva una mochila. — Ана носит рюкзак."
    collocations:
      - "llevar gafas — носить очки"
    trap: "Носить очки — llevar gafas, а не usar gafas (в Латинской Америке usar 🌎)."

  - es: mejor
    pron: "j — «х»: «мэхо́р»."
    meaning: "Лучший; лучше."
    examples:
      - "Es mi mejor amigo. — Это мой лучший друг."
      - "Mi hermana es mi mejor amiga. — Моя сестра — моя лучшая подруга."
    collocations:
      - "a lo mejor — может быть"
    trap: "Не más bueno, а mejor: Es mejor que…"
