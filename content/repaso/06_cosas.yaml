# Тема 6 «Вещи вокруг нас». Правила — docs/repaso_guide.md.
words:
  - es: "¿Qué es esto?"
    meaning: "Что это? — о вещи, которую видите или держите."
    examples:
      - "¿Qué es esto? Es un libro. — Что это? Это книга."
      - "¿Qué es esto? ¿Una llave? — Что это? Ключ?"
    collocations:
      - "¿qué es eso? — что это (там)?"
    trap: "esto — о вещи рядом с вами, eso — о вещи подальше или у собеседника."

  - es: un / una
    meaning: "Какой-то один, одна — неопределённый артикль: un — мужской род, una — женский. Ставят, когда предмет упоминают впервые."
    examples:
      - "Es una llave. — Это ключ."
      - "Es un libro. — Это книга."
    collocations:
      - "un poco — немного"
    trap: "Род артикля — по слову, а не по переводу: una llave, хотя «ключ» в русском мужского рода."

  - es: el libro
    meaning: "Книга."
    examples:
      - "Es un libro. — Это книга."
      - "¿Es tu libro? — Это твоя книга?"
    collocations:
      - "leer un libro — читать книгу"
    trap: "el libro — мужского рода. «Библиотека» — la biblioteca, а librería — книжный магазин."

  - es: el cuaderno
    pron: "cu — «ку», ue — одним слогом: «куадэ́рно»."
    meaning: "Тетрадь."
    examples:
      - "Es un cuaderno. — Это тетрадь."
      - "¿Es tu cuaderno? — Это твоя тетрадь?"
    collocations:
      - "escribir en el cuaderno — писать в тетради"
    trap: "Мужского рода: el cuaderno, хотя «тетрадь» — женского."

  - es: el bolígrafo
    pron: "Ударение на li: «боли́графо»."
    meaning: "Ручка (шариковая). Коротко — el boli."
    examples:
      - "Es un bolígrafo. — Это ручка."
      - "¿Es tu bolígrafo? — Это твоя ручка?"
    collocations:
      - "el boli — ручка (разговорное)"
    trap: "В Латинской Америке ручка — la pluma или el lapicero 🌎."

  - es: la mochila
    pron: "ch — «ч»: «мочи́ла»."
    meaning: "Рюкзак."
    examples:
      - "Es una mochila. — Это рюкзак."
      - "¿Es tu mochila? — Это твой рюкзак?"
    collocations:
      - "ir de mochila — путешествовать с рюкзаком"
    trap: "Женского рода: la mochila, хотя «рюкзак» — мужского."

  - es: la llave
    pron: "ll — как «й», v — как b: «йя́бэ»."
    meaning: "Ключ (от двери). Ещё — кран: la llave del agua."
    examples:
      - "Es una llave. — Это ключ."
      - "¿Es tu llave? — Это твой ключ?"
    collocations:
      - "la llave de casa — ключ от дома"
    trap: "Женского рода: la llave. «Ключ к решению» — la clave."

  - es: la mesa
    meaning: "Стол."
    examples:
      - "Es una mesa. — Это стол."
      - "¿Una mesa o una silla? — Стол или стул?"
    collocations:
      - "poner la mesa — накрыть на стол"
    trap: "Женского рода: la mesa. «Письменный стол» — el escritorio."

  - es: la silla
    pron: "ll — как «й»: «си́йя»."
    meaning: "Стул."
    examples:
      - "Es una silla. — Это стул."
      - "¿Una mesa o una silla? — Стол или стул?"
    collocations:
      - "la silla de ruedas — инвалидное кресло"
    trap: "Женского рода: la silla. «Кресло» — el sillón."

  - es: el día
    pron: "Ударение на i (знак над í): «ди́а»."
    meaning: "День. Мужского рода, хотя оканчивается на -a."
    examples:
      - "¡Buenos días! — Доброе утро!"
      - "Es un día. — Это день."
    collocations:
      - "todos los días — каждый день"
    trap: "el día — исключение: на -a, но мужского рода. Поэтому buenos días."

  - es: la foto
    meaning: "Фотография — сокращение от la fotografía, поэтому женского рода, хотя на -o."
    examples:
      - "Es una foto. — Это фотография."
      - "¿Es tu foto? — Это твоя фотография?"
    collocations:
      - "hacer una foto — сфотографировать"
    trap: "la foto — исключение: на -o, но женского рода. Так же la moto, la radio."

  - es: el mapa
    meaning: "Карта (географическая). Мужского рода, хотя на -a."
    examples:
      - "Es un mapa. — Это карта."
      - "¿El mapa o la foto? — Карта или фотография?"
    collocations:
      - "el mapa de España — карта Испании"
    trap: "el mapa — исключение мужского рода. Игральная карта — la carta."

  - es: o
    meaning: "Или."
    examples:
      - "¿El o la? — El или la?"
      - "¿Café o chocolate? — Кофе или шоколад?"
    collocations:
      - "o… o… — или… или…"
    trap: "Перед словами на o- и ho- o меняется на u: uno u otro — «тот или другой»."

  - es: el ordenador
    meaning: "Компьютер — так в Испании. В Латинской Америке — la computadora 🌎."
    examples:
      - "Es un ordenador. — Это компьютер."
      - "¿Es tu ordenador? — Это твой компьютер?"
    collocations:
      - "el ordenador portátil — ноутбук"
    trap: "В Испании — el ordenador, в Латинской Америке — la computadora."

  - es: el móvil
    pron: "Ударение на первом слоге (знак над ó), v — как b: «мо́биль»."
    meaning: "Мобильный телефон — в Испании. В Латинской Америке — el celular 🌎."
    examples:
      - "Es mi móvil. — Это мой мобильный."
      - "¿Es tu móvil? — Это твой мобильный?"
    collocations:
      - "el número de móvil — номер мобильного"
    trap: "Знак ударения: móvil. Во множественном — móviles."

  - es: la puerta
    pron: "ue — одним слогом: «пуэ́рта»."
    meaning: "Дверь."
    examples:
      - "Es una puerta. — Это дверь."
      - "¿La puerta o la ventana? — Дверь или окно?"
    collocations:
      - "abrir la puerta — открыть дверь"
    trap: "puerta — дверь, puerto — порт. Не путайте окончания."

  - es: la ventana
    pron: "v — как b: «бэнта́на»."
    meaning: "Окно."
    examples:
      - "Es una ventana. — Это окно."
      - "¿La puerta o la ventana? — Дверь или окно?"
    collocations:
      - "abrir la ventana — открыть окно"
    trap: "Женского рода: la ventana, хотя «окно» — среднего."

  - es: el reloj
    pron: "j в конце почти не слышна: «рэло́(х)»."
    meaning: "Часы — наручные или настенные. Одно слово в единственном числе."
    examples:
      - "Es mi reloj. — Это мои часы."
      - "¿Es tu reloj? — Это твои часы?"
    collocations:
      - "el reloj de pulsera — наручные часы"
    trap: "По-испански часы — в единственном числе: el reloj, а не los relojes (это несколько часов)."

  - es: la lámpara
    pron: "Ударение на первом слоге: «ла́мпара»."
    meaning: "Лампа, светильник."
    examples:
      - "Es una lámpara. — Это лампа."
      - "¿Una lámpara o un reloj? — Лампа или часы?"
    collocations:
      - "encender la lámpara — включить лампу"
    trap: "Знак ударения на первом a: lámpara."

  - es: los / las
    meaning: "Артикль во множественном числе: los — мужской род, las — женский."
    examples:
      - "los libros, las mesas — книги, столы"
      - "Los libros y las llaves. — Книги и ключи."
    collocations:
      - "los dos — оба"
    trap: "Смешанная группа — los: los chicos — и мальчики, и мальчики с девочками."

  - es: unos / unas
    meaning: "Несколько, какие-то — множественное от un / una."
    examples:
      - "unos cuadernos — несколько тетрадей"
      - "Hay unas llaves. — Тут какие-то ключи."
    collocations:
      - "unos días — несколько дней"
    trap: "Перед числом unos значит «примерно»: unos diez — «около десяти»."

  - es: hay
    pron: "h не читается: «ай»."
    meaning: "Есть, имеется — о том, что где-то находится. Одна форма для единственного и множественного числа."
    examples:
      - "En la mesa hay un libro. — На столе книга."
      - "Hay dos sillas. — Тут два стула."
    collocations:
      - "no hay — нет (чего-то)"
    trap: "После hay не ставят el/la: hay un libro, а не hay el libro."

  - es: "¿Qué hay en...?"
    meaning: "Что есть в / на …? — что там находится."
    examples:
      - "¿Qué hay en la mochila? — Что в рюкзаке?"
      - "¿Qué hay en la mesa? — Что на столе?"
    collocations:
      - "¿qué hay? — что нового? (разговорное приветствие)"
    trap: "en — и «в», и «на»: en la mesa — на столе, en la mochila — в рюкзаке."

  - es: el lápiz
    pron: "Ударение на первом слоге, z — как th в think: «ла́пиθ»."
    meaning: "Карандаш."
    examples:
      - "Es un lápiz. — Это карандаш."
      - "¿Un lápiz o un bolígrafo? — Карандаш или ручка?"
    collocations:
      - "a lápiz — карандашом"
    trap: "Во множественном z меняется на c: los lápices."

  - es: la botella
    pron: "ll — как «й»: «ботэ́йя»."
    meaning: "Бутылка."
    examples:
      - "Hay una botella en la mesa. — На столе бутылка."
    collocations:
      - "una botella de agua — бутылка воды"
    trap: "Из чего бутылка или что в ней — de: una botella de vino."

  - es: las gafas
    meaning: "Очки — всегда во множественном числе."
    examples:
      - "¿Hay gafas en la mochila? — В рюкзаке есть очки?"
      - "Hay unas gafas en la mesa. — На столе очки."
    collocations:
      - "las gafas de sol — солнечные очки"
    trap: "Только во множественном: las gafas. В Латинской Америке — los lentes 🌎."

  - es: el dinero
    meaning: "Деньги — в единственном числе."
    examples:
      - "No hay dinero. — Нет денег."
      - "¿Hay dinero en la mochila? — В рюкзаке есть деньги?"
    collocations:
      - "mucho dinero — много денег"
    trap: "В единственном числе: el dinero es, а не los dineros son."
