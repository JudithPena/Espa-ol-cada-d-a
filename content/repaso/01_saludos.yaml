# Тема 1 «¡Hola! Приветствия». Правила — docs/repaso_guide.md.
words:
  - es: buenos días
    pron: "ue — одним слогом «уэ». В días ударение на i (знак над í)."
    meaning: "Доброе утро, добрый день — так здороваются до обеда, примерно до двух часов."
    examples:
      - "¡Buenos días, María! — Доброе утро, Мария!"
      - "Buenos días, Pablo. — Доброе утро, Пабло."
    collocations:
      - "dar los buenos días — поздороваться утром"
    trap: "Всегда во множественном: buenos días, а не buen día (buen día говорят в Аргентине 🌎)."

  - es: buenas tardes
    meaning: "Добрый день, добрый вечер — после обеда и до темноты. В Испании обедают поздно, поэтому tarde начинается часа в два."
    examples:
      - "¡Buenas tardes, Pablo! — Добрый день, Пабло!"
      - "Buenas tardes, Ana. — Добрый вечер, Ана."
    collocations:
      - "por la tarde — днём, после обеда"
    trap: "tardes — женского рода, поэтому buenas, а не buenos. И tarde — ещё «поздно»: Es tarde — «Поздно»."

  - es: buenas noches
    pron: "ch — «ч»: «но́чэс»."
    meaning: "Добрый вечер (поздно, когда стемнело) и спокойной ночи — одна фраза для обоих случаев."
    examples:
      - "Buenas noches, Ana. — Спокойной ночи, Ана."
      - "¡Buenas noches, Carlos! — Добрый вечер, Карлос!"
    collocations:
      - "por la noche — вечером, ночью"
    trap: "Когда здороваются поздно вечером, тоже говорят buenas noches — не только на прощание."

  - es: adiós
    pron: "Ударение на последнем слоге: «адьо́с»."
    meaning: "До свидания, пока. Звучит немного окончательно — так прощаются, когда скоро не увидятся."
    examples:
      - "¡Adiós, Carlos! — Пока, Карлос!"
      - "Adiós, María. — До свидания, Мария."
    collocations:
      - "decir adiós — попрощаться"
    trap: "Если увидитесь скоро, естественнее hasta luego: испанцы говорят его даже незнакомым в магазине."

  - es: hasta luego
    pron: "h не читается: «а́ста». ue — одним слогом."
    meaning: "До встречи, пока. Самое частое прощание в Испании — даже если больше не увидитесь."
    examples:
      - "¡Hasta luego, Lucía! — До встречи, Лусия!"
      - "Gracias, hasta luego. — Спасибо, до свидания."
    collocations:
      - "hasta pronto — до скорого"
      - "hasta la vista — до встречи"
    trap: "Не читайте h: «а́ста луэ́го». В быстрой речи часто звучит «аста луэго» слитно."

  - es: hasta mañana
    pron: "h не читается, ñ — «нь»: «а́ста манья́на»."
    meaning: "До завтра."
    examples:
      - "¡Hasta mañana, Pablo! — До завтра, Пабло!"
      - "Adiós, hasta mañana. — Пока, до завтра."
    collocations:
      - "hasta el lunes — до понедельника"
    trap: "hasta — «до», а не «пока»: hasta mañana — буквально «до завтра»."

  - es: "¿Qué tal?"
    pron: "qu — «к»: «кэ таль». l мягче русского «л»."
    meaning: "Как дела? Неформальный вопрос при встрече; часто это почти приветствие, долгого ответа не ждут."
    examples:
      - "¡Hola, Ana! ¿Qué tal? — Привет, Ана! Как дела?"
      - "¿Qué tal, Pablo? — Как дела, Пабло?"
    collocations:
      - "¿qué tal estás? — как ты?"
      - "¿qué tal el día? — как прошёл день?"
    trap: "Вопрос пишут с двумя знаками: ¿Qué tal? Перевёрнутый ¿ стоит в начале."

  - es: bien
    pron: "ie — одним слогом: «бьен»."
    meaning: "Хорошо. Обычный ответ на ¿Qué tal?"
    examples:
      - "Bien, gracias. — Хорошо, спасибо."
      - "¿Qué tal? Bien. — Как дела? Хорошо."
    collocations:
      - "muy bien — очень хорошо"
      - "está bien — ладно, хорошо"
    trap: "bien — наречие «хорошо», bueno — прилагательное «хороший». Как дела? — Bien, а не Bueno."

  - es: muy bien
    meaning: "Очень хорошо. Ещё — «молодец!», похвала."
    examples:
      - "Muy bien, gracias. — Очень хорошо, спасибо."
      - "¿Qué tal? Muy bien. — Как дела? Очень хорошо."
    collocations:
      - "¡muy bien! — молодец!"
    trap: "muy — «очень» перед прилагательным и наречием: muy bien. «Очень много» — mucho, а не muy mucho."

  - es: regular
    meaning: "Так себе, неважно — средний ответ на ¿Qué tal?"
    examples:
      - "¿Qué tal? Regular. — Как дела? Так себе."
      - "Regular, gracias. — Неважно, спасибо."
    collocations:
      - "más o menos — более-менее"
    trap: "По-испански regular — не «регулярный», а «так себе»."

  - es: mal
    pron: "l в конце мягче русского «л»: «маль»."
    meaning: "Плохо."
    examples:
      - "¿Qué tal? Mal. — Как дела? Плохо."
      - "Mal, muy mal. — Плохо, очень плохо."
    collocations:
      - "muy mal — очень плохо"
      - "no está mal — неплохо"
    trap: "mal — «плохо», malo — «плохой». No está mal — «неплохо», полезная фраза."

  - es: "¿Y tú?"
    pron: "y здесь — отдельное слово «и»: «и ту»."
    meaning: "А ты? — возвращаем вопрос собеседнику."
    examples:
      - "Bien, ¿y tú? — Хорошо, а ты?"
      - "Muy bien, gracias. ¿Y tú? — Очень хорошо, спасибо. А ты?"
    collocations:
      - "¿y usted? — а вы?"
    trap: "tú (ты) — со знаком ударения; tu без знака — «твой»."

  - es: tú
    pron: "Со знаком ударения: tú — «ты»."
    meaning: "Ты. В Испании на «ты» говорят очень многие — даже с незнакомыми ровесниками."
    examples:
      - "¿Y tú? — А ты?"
      - "¿Tú, Pablo? — Ты, Пабло?"
    collocations:
      - "tratar de tú — обращаться на «ты»"
    trap: "tú (ты) и tu (твой) звучат одинаково, различает их только знак ударения."

  - es: usted
    pron: "d в конце почти не слышно: «устэ́»."
    meaning: "Вы — вежливо, одному человеку. Глагол с usted — как с «он, она»."
    examples:
      - "¿Y usted? — А вы?"
      - "¿Cómo está usted? — Как вы поживаете?"
    collocations:
      - "tratar de usted — обращаться на «вы»"
    trap: "Глагол с usted — в форме 3-го лица: usted está, а не usted estás."

  - es: "¿Cómo estás?"
    pron: "Ударение в estás — на последнем слоге (знак над á)."
    meaning: "Как ты? Как поживаешь? — вопрос другу о самочувствии."
    examples:
      - "¡Hola, Ana! ¿Cómo estás? — Привет, Ана! Как ты?"
      - "¿Cómo estás, Pablo? — Как ты, Пабло?"
    collocations:
      - "¿cómo estás? — как ты?"
    trap: "Здесь глагол estar, а не ser: состояние спрашивают с estar."

  - es: "¿Cómo está usted?"
    meaning: "Как вы поживаете? — вежливо, одному человеку."
    examples:
      - "Buenos días, señor García. ¿Cómo está usted? — Доброе утро, сеньор Гарсия. Как вы поживаете?"
    collocations:
      - "¿cómo están ustedes? — как вы (несколько человек)?"
    trap: "С usted глагол без -s: ¿Cómo está?, а не ¿Cómo estás usted?"

  - es: "¿Y usted?"
    meaning: "А вы? — возвращаем вопрос, когда говорим на «вы»."
    examples:
      - "Bien, gracias. ¿Y usted? — Хорошо, спасибо. А вы?"
    collocations:
      - "¿y tú? — а ты?"
    trap: "Не смешивайте: если собеседник на «вы» — ¿Y usted?, а не ¿Y tú?"

  - es: el señor
    pron: "ñ — «нь»: «сэньо́р»."
    meaning: "Господин, сеньор; мужчина. Перед фамилией — el señor García, а в обращении без артикля: señor García."
    examples:
      - "Buenos días, señor García. — Доброе утро, сеньор Гарсия."
      - "¿El señor López? — Сеньор Лопес?"
    collocations:
      - "señoras y señores — дамы и господа"
    trap: "Обращаясь к человеку, артикль не нужен: ¡Hola, señor López! Говоря о нём — с артиклем: el señor López."

  - es: la señora
    pron: "ñ — «нь»: «сэньо́ра»."
    meaning: "Госпожа, сеньора; женщина. Señorita — девушка (сейчас говорят реже)."
    examples:
      - "Buenas tardes, señora López. — Добрый день, сеньора Лопес."
      - "¿La señora García? — Сеньора Гарсия?"
    collocations:
      - "señoras y señores — дамы и господа"
    trap: "Как и с señor: в обращении без артикля, в рассказе о ней — la señora."

  - es: por favor
    pron: "v — как b: «пор фабо́р»."
    meaning: "Пожалуйста — когда просим."
    examples:
      - "Un café, por favor. — Кофе, пожалуйста."
      - "Un chocolate, por favor. — Шоколад, пожалуйста."
    collocations:
      - "¿me ayudas, por favor? — поможешь, пожалуйста?"
    trap: "Только для просьбы. «Пожалуйста» в ответ на «спасибо» — de nada."

  - es: muchas gracias
    meaning: "Большое спасибо."
    examples:
      - "Muchas gracias, señora. — Большое спасибо, сеньора."
      - "¡Muchas gracias, Pablo! — Большое спасибо, Пабло!"
    collocations:
      - "muchísimas gracias — огромное спасибо"
    trap: "gracias — женского рода и множественного числа, поэтому muchas, а не muchos."

  - es: de nada
    meaning: "Не за что — ответ на «спасибо»."
    examples:
      - "Gracias. De nada. — Спасибо. Не за что."
      - "Muchas gracias. ¡De nada! — Большое спасибо. Не за что!"
    collocations:
      - "no hay de qué — не за что (вежливее)"
    trap: "На «спасибо» не отвечают por favor: только de nada."

  - es: perdón
    pron: "Ударение на последнем слоге: «пэрдо́н»."
    meaning: "Извините, простите — когда задели кого-то или хотите что-то спросить."
    examples:
      - "Perdón, ¿el hotel? — Извините, где гостиница?"
      - "¡Perdón, señora! — Простите, сеньора!"
    collocations:
      - "perdona — прости (на «ты»)"
      - "perdone — простите (на «вы»)"
    trap: "Чтобы обратиться к незнакомому, в Испании чаще говорят perdone или disculpe."

  - es: vale
    pron: "v — как b: «ба́лэ»."
    meaning: "Ладно, хорошо, окей — очень частое слово в Испании."
    examples:
      - "¿Un café? Vale. — Кофе? Давай."
      - "Vale, gracias. — Хорошо, спасибо."
    collocations:
      - "¡vale, vale! — ладно-ладно!"
      - "¿vale? — договорились?"
    trap: "vale — типично испанское. В Латинской Америке скажут okay или está bien 🌎."
