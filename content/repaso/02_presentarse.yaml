# Тема 2 «Me llamo… Знакомство». Правила — docs/repaso_guide.md.
words:
  - es: me llamo...
    pron: "ll в Испании звучит как «й»: «мэ йя́мо» (в учебнике — «лья́мо»)."
    meaning: "Меня зовут… Буквально «я себя называю»: me — «себя», llamo — «называю»."
    examples:
      - "Hola, me llamo Ana. — Привет, меня зовут Ана."
      - "Me llamo Pablo. ¿Y tú? — Меня зовут Пабло. А тебя?"
    collocations:
      - "me llamo… y soy de… — меня зовут… и я из…"
    trap: "Не говорите Me llamo es Ana: нужно просто Me llamo Ana. Можно и Soy Ana — «Я Ана»."

  - es: "¿Cómo te llamas?"
    meaning: "Как тебя зовут? — на «ты»."
    examples:
      - "Hola, ¿cómo te llamas? — Привет, как тебя зовут?"
      - "Me llamo Ana. ¿Y tú, cómo te llamas? — Меня зовут Ана. А тебя как зовут?"
    collocations:
      - "¿cómo se llama? — как его/её зовут?"
    trap: "Вопрос начинается с cómo «как», а не qué «что»: ¿Cómo te llamas?"

  - es: "¿Cómo se llama usted?"
    meaning: "Как вас зовут? — вежливо, на «вы»."
    examples:
      - "Perdón, ¿cómo se llama usted? — Извините, как вас зовут?"
      - "Buenos días. ¿Cómo se llama usted? — Добрый день. Как вас зовут?"
    collocations:
      - "¿cómo se llama ella? — как её зовут?"
    trap: "С usted — se llama, как с «он, она», а не te llamas."

  - es: encantado/a
    meaning: "Очень приятно — при знакомстве. Мужчина говорит encantado, женщина — encantada: окончание по тому, кто говорит."
    examples:
      - "Encantada, Pablo. — Очень приятно, Пабло."
      - "Me llamo Carlos. Encantado. — Меня зовут Карлос. Очень приятно."
    collocations:
      - "encantado de conocerte — рад познакомиться"
    trap: "Окончание зависит от говорящего, а не от собеседника: Ана говорит encantada любому."

  - es: mucho gusto
    meaning: "Очень приятно — при знакомстве; одна форма для всех, мужчин и женщин."
    examples:
      - "Mucho gusto, señora. — Очень приятно, сеньора."
      - "Me llamo Ana. Mucho gusto. — Меня зовут Ана. Очень приятно."
    collocations:
      - "el gusto es mío — мне тоже очень приятно"
    trap: "Не путайте с me gusta — «мне нравится». gusto здесь — «удовольствие»."

  - es: igualmente
    pron: "gu перед a — «гуа»: «игуальмэ́нтэ»."
    meaning: "Взаимно, мне тоже — ответ на «очень приятно» или на пожелание."
    examples:
      - "Encantado. Igualmente. — Очень приятно. Взаимно."
      - "Mucho gusto, Ana. Igualmente. — Очень приятно, Ана. Мне тоже."
    collocations:
      - "¡igualmente! — и тебе того же!"
    trap: "Отвечают и на пожелания: ¡Buen día! — ¡Igualmente! («И вам!»)."

  - es: yo
    pron: "y — как «й»: «йо»."
    meaning: "Я. В испанском «я» часто опускают: окончание глагола и так показывает лицо."
    examples:
      - "Yo, Ana. ¿Y tú? — Я Ана. А ты?"
      - "¿Yo? Bien, gracias. — Я? Хорошо, спасибо."
    collocations:
      - "yo también — я тоже"
      - "yo tampoco — я тоже нет"
    trap: "Me llamo Ana — без yo: это обычно. Yo me llamo Ana звучит с ударением на «я»."

  - es: él
    pron: "Со знаком ударения: él — «он»; el без знака — артикль."
    meaning: "Он."
    examples:
      - "¿Él? Es Pablo. — Он? Это Пабло."
      - "Él se llama Carlos. — Его зовут Карлос."
    collocations:
      - "él y ella — он и она"
    trap: "él (он) и el (артикль) различает только знак ударения."

  - es: ella
    pron: "ll — как «й»: «э́йя»."
    meaning: "Она."
    examples:
      - "¿Ella? Es Ana. — Она? Это Ана."
      - "Ella se llama María. — Её зовут Мария."
    collocations:
      - "ella y yo — она и я"
    trap: "Не читайте ll как «л»: «эйя», а не «элла»."

  - es: ser
    meaning: "Быть, являться — о том, кто вы, откуда, какой вы по сути. Формы: soy, eres, es."
    examples:
      - "¿Quién es? ¿Es Pablo? — Кто это? Это Пабло?"
      - "Yo soy Ana. — Я Ана."
    collocations:
      - "ser de… — быть из…"
    trap: "В испанском два «быть»: ser — кто вы и какой, estar — как вы и где. ¿Cómo estás? — с estar."

  - es: llamarse
    pron: "ll — как «й»: «йяма́рсэ»."
    meaning: "Называться, зваться. Формы: me llamo, te llamas, se llama."
    examples:
      - "Me llamo Ana. — Меня зовут Ана."
      - "Ella se llama María. — Её зовут Мария."
    collocations:
      - "¿cómo se llama esto? — как это называется?"
    trap: "Глагол возвратный: se в начале формы обязателен — se llama, а не llama."

  - es: "¿Quién es?"
    pron: "qu — «к», ie — одним слогом: «кьен эс»."
    meaning: "Кто это? — о человеке. Так же спрашивают, кто звонит в дверь."
    examples:
      - "¿Quién es? ¿Es Pablo? — Кто это? Это Пабло?"
      - "¿Quién es ella? — Кто она?"
    collocations:
      - "¿quién eres? — кто ты?"
    trap: "Про вещь спрашивают ¿Qué es? — «Что это?», а про человека — ¿Quién es?"
