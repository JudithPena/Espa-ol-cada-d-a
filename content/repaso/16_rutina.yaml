# Тема 16 «Мой день». Правила — docs/repaso_guide.md.
words:
  - es: despertarse
    meaning: "Просыпаться. e → ie: me despierto."
    examples:
      - "Me despierto a las siete. — Я просыпаюсь в семь."
    collocations:
      - "el despertador — будильник"
    trap: "Проснуться — despertarse, а встать с кровати — levantarse."

  - es: levantarse
    pron: "v — как b: «лэбанта́рсэ»."
    meaning: "Вставать (с кровати)."
    examples:
      - "Me levanto a las siete y cuarto. — Я встаю в четверть восьмого."
    collocations:
      - "levantarse temprano — вставать рано"
    trap: "Без se — «поднимать»: levantar la mano."

  - es: ducharse
    pron: "ch — «ч»: «дуча́рсэ»."
    meaning: "Принимать душ."
    examples:
      - "Me ducho por la mañana. — Я принимаю душ утром."
    collocations:
      - "darse una ducha — принять душ"
    trap: "Возвратный: me ducho, а не ducho."

  - es: lavarse
    pron: "v — как b: «лаба́рсэ»."
    meaning: "Мыться, умываться. Что моют — без «свой»: me lavo las manos."
    examples:
      - "Me lavo por la mañana. — Я умываюсь утром."
    collocations:
      - "lavarse los dientes — чистить зубы"
    trap: "Части тела — с артиклем, а не с mi: me lavo las manos, а не mis manos."

  - es: el diente
    pron: "ie — одним слогом: «дьэ́нтэ»."
    meaning: "Зуб."
    examples:
      - "Me lavo los dientes. — Я чищу зубы."
    collocations:
      - "el cepillo de dientes — зубная щётка"
    trap: "«Чистить зубы» — lavarse los dientes, буквально «мыть зубы»."

  - es: vestirse
    pron: "v — как b. e → i: me visto."
    meaning: "Одеваться."
    examples:
      - "Me visto y salgo de casa. — Я одеваюсь и выхожу из дома."
    collocations:
      - "vestirse de negro — одеться в чёрное"
    trap: "e меняется на i: me visto, а не me vesto."

  - es: salir
    meaning: "Выходить, уходить; ходить куда-то развлечься. Форма «я» — salgo."
    examples:
      - "Salgo de casa a las ocho. — Я выхожу из дома в восемь."
    collocations:
      - "salir con alguien — встречаться с кем-то"
      - "la salida — выход"
    trap: "Откуда выходят — de: salgo de casa. Форма «я» — salgo, с g."

  - es: peinarse
    pron: "ei — одним слогом: «пэйна́рсэ»."
    meaning: "Причёсываться."
    examples:
      - "Me peino por la mañana. — Я причёсываюсь утром."
    collocations:
      - "el peine — расчёска"
    trap: "Возвратный: me peino."

  - es: afeitarse
    pron: "ei — одним слогом: «афэйта́рсэ»."
    meaning: "Бриться."
    examples:
      - "Mi padre se afeita todos los días. — Мой отец бреется каждый день."
    collocations:
      - "la maquinilla de afeitar — бритва"
    trap: "Возвратный: me afeito."

  - es: poder
    meaning: "Мочь. o → ue: puedo, puedes, puede."
    examples:
      - "¿Puedes hablar más despacio? — Ты можешь говорить медленнее?"
      - "No puedo hoy. — Сегодня я не могу."
    collocations:
      - "¿se puede? — можно?"
    trap: "o меняется на ue: puedo, а не podo."

  - es: volver
    pron: "v — как b: «больбэ́р». o → ue: vuelvo."
    meaning: "Возвращаться."
    examples:
      - "Vuelvo a casa a las seis. — Я возвращаюсь домой в шесть."
    collocations:
      - "volver a + инфинитив — снова сделать"
    trap: "Volver a hacer — «сделать снова»: vuelvo a leer — «перечитываю»."

  - es: dormir
    meaning: "Спать. o → ue: duermo."
    examples:
      - "Duermo ocho horas. — Я сплю восемь часов."
    collocations:
      - "el dormitorio — спальня"
    trap: "Уснуть — dormirse: me duermo."

  - es: acostarse
    meaning: "Ложиться спать. o → ue: me acuesto."
    examples:
      - "Me acuesto a las once. — Я ложусь спать в одиннадцать."
    collocations:
      - "acostarse tarde — поздно ложиться"
    trap: "o меняется на ue: me acuesto."

  - es: pedir
    meaning: "Просить; заказывать (в кафе). e → i: pido."
    examples:
      - "Pido un café con leche. — Я заказываю кофе с молоком."
    collocations:
      - "pedir ayuda — просить помощи"
    trap: "Спросить — preguntar, а попросить — pedir."

  - es: preferir
    meaning: "Предпочитать. e → ie: prefiero."
    examples:
      - "Prefiero el té. — Я предпочитаю чай."
    collocations:
      - "prefiero + инфинитив — предпочитаю делать"
    trap: "e меняется на ie: prefiero."

  - es: temprano
    meaning: "Рано."
    examples:
      - "Me levanto temprano. — Я встаю рано."
    collocations:
      - "muy temprano — очень рано"
    trap: "Противоположное — tarde «поздно»."

  - es: después
    pron: "ue — одним слогом, ударение на последнем слоге: «дэспуэ́с»."
    meaning: "Потом, после."
    examples:
      - "Desayuno y después me ducho. — Я завтракаю, а потом принимаю душ."
    collocations:
      - "después de — после (чего-то)"
    trap: "Знак ударения: después."

  - es: luego
    pron: "ue — одним слогом: «луэ́го»."
    meaning: "Потом, затем."
    examples:
      - "Primero desayuno, luego me visto. — Сначала завтракаю, потом одеваюсь."
    collocations:
      - "hasta luego — до встречи"
    trap: "luego и después часто взаимозаменяемы."

  - es: más tarde
    meaning: "Позже."
    examples:
      - "Te llamo más tarde. — Я позвоню тебе позже."
    collocations:
      - "un poco más tarde — чуть позже"
    trap: "Не путайте с la tarde «вторая половина дня»."

  - es: antes de
    meaning: "Перед, до — во времени."
    examples:
      - "antes de dormir — перед сном"
      - "Me ducho antes de desayunar. — Я принимаю душ перед завтраком."
    collocations:
      - "antes — раньше"
    trap: "После antes de — инфинитив: antes de comer."

  - es: después de
    meaning: "После."
    examples:
      - "después de comer — после обеда"
    collocations:
      - "después de clase — после занятий"
    trap: "После después de — инфинитив: después de trabajar."

  - es: a veces
    pron: "v — как b, c перед e — как th: «а бэ́θэс»."
    meaning: "Иногда."
    examples:
      - "A veces ceno tarde. — Иногда я поздно ужинаю."
    collocations:
      - "muchas veces — много раз, часто"
    trap: "una vez — один раз, a veces — иногда."

  - es: nunca
    meaning: "Никогда."
    examples:
      - "Nunca me levanto tarde. — Я никогда не встаю поздно."
      - "No bebo nunca café. — Я никогда не пью кофе."
    collocations:
      - "casi nunca — почти никогда"
    trap: "Если nunca после глагола, нужен no: No como nunca carne."
