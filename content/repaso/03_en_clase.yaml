# Тема 3 «Язык занятий». Правила — docs/repaso_guide.md.
words:
  - es: escucha
    pron: "ch — «ч»: «эску́ча»."
    meaning: "Послушай, слушай — просьба на «ты». Глагол — escuchar «слушать»."
    examples:
      - "Escucha, por favor. — Послушай, пожалуйста."
      - "Escucha y repite. — Слушай и повторяй."
    collocations:
      - "escuchar música — слушать музыку"
    trap: "escuchar — слушать, а oír — слышать. Escucha — «послушай!»."

  - es: repite
    meaning: "Повтори — на «ты». Глагол — repetir «повторять»."
    examples:
      - "Escucha y repite. — Слушай и повторяй."
      - "Repite, por favor. — Повтори, пожалуйста."
    collocations:
      - "repite la palabra — повтори слово"
    trap: "В repite нет -r: это просьба. «Повторять» — repetir."

  - es: lee
    pron: "Две e читаются отдельно: «лэ́э»."
    meaning: "Прочитай, читай — на «ты». Глагол — leer «читать»."
    examples:
      - "Lee, por favor. — Прочитай, пожалуйста."
      - "Escucha y lee. — Слушай и читай."
    collocations:
      - "lee el texto — прочитай текст"
    trap: "Не сливайте две e в одну: «лэ-э»."

  - es: escribe
    meaning: "Напиши, пиши — на «ты». Глагол — escribir «писать»."
    examples:
      - "Escribe, por favor. — Напиши, пожалуйста."
      - "Lee y escribe. — Читай и пиши."
    collocations:
      - "escribe la palabra — напиши слово"
    trap: "b читается как обычное «б», но мягче между гласными. Не путайте с describe — «опиши»."

  - es: traduce
    pron: "c перед e в Испании — как th в think: «траду́θэ»."
    meaning: "Переведи — на «ты». Глагол — traducir «переводить»."
    examples:
      - "Traduce, por favor. — Переведи, пожалуйста."
      - "Lee y traduce. — Прочитай и переведи."
    collocations:
      - "traduce al español — переведи на испанский"
    trap: "На какой язык — al: traducir al español, а не en español."

  - es: responde
    meaning: "Ответь, отвечай — на «ты». Глагол — responder «отвечать»."
    examples:
      - "Responde, por favor. — Ответь, пожалуйста."
      - "Escucha y responde. — Послушай и ответь."
    collocations:
      - "responde a la pregunta — ответь на вопрос"
    trap: "На что отвечают — с a: responder a la pregunta."

  - es: la palabra
    meaning: "Слово."
    examples:
      - "Lee la palabra. — Прочитай слово."
      - "Escribe la palabra, por favor. — Напиши слово, пожалуйста."
    collocations:
      - "la palabra nueva — новое слово"
      - "en otras palabras — другими словами"
    trap: "la palabra — женского рода. «Даю слово» — doy mi palabra."

  - es: la pregunta
    meaning: "Вопрос."
    examples:
      - "Lee la pregunta. — Прочитай вопрос."
      - "Escucha la pregunta y responde. — Послушай вопрос и ответь."
    collocations:
      - "hacer una pregunta — задать вопрос"
    trap: "Задать вопрос — hacer una pregunta, а не dar una pregunta."

  - es: la respuesta
    pron: "ue — одним слогом: «рэспуэ́ста»."
    meaning: "Ответ."
    examples:
      - "Escribe la respuesta. — Напиши ответ."
      - "¿La respuesta? Sí. — Ответ? Да."
    collocations:
      - "la respuesta correcta — правильный ответ"
    trap: "r в начале слова раскатистое: «р-рэспуэста»."

  - es: el texto
    pron: "x — «кс»: «тэ́ксто»."
    meaning: "Текст."
    examples:
      - "Lee el texto. — Прочитай текст."
      - "Traduce el texto, por favor. — Переведи текст, пожалуйста."
    collocations:
      - "un texto corto — короткий текст"
    trap: "Мужского рода: el texto. Сообщение в телефоне — el mensaje."

  - es: la traducción
    pron: "c перед c читается «кθ»: «традукθьо́н»; ударение на последнем слоге."
    meaning: "Перевод."
    examples:
      - "Lee la traducción. — Прочитай перевод."
      - "¿La traducción? No. — Перевод? Нет."
    collocations:
      - "la traducción al ruso — перевод на русский"
    trap: "Две c: первая — «к», вторая — «θ». Женского рода, как все слова на -ción."

  - es: la tarea
    meaning: "Задание; домашнее задание."
    examples:
      - "Escribe la tarea. — Напиши задание."
      - "Lee la tarea, por favor. — Прочитай задание, пожалуйста."
    collocations:
      - "hacer la tarea — делать задание"
      - "los deberes — домашнее задание (в Испании)"
    trap: "Домашку в Испании чаще называют los deberes; tarea — любое задание."

  - es: el repaso
    meaning: "Повторение пройденного. Отсюда и команда бота /repaso."
    examples:
      - "El repaso, por favor. — Повторение, пожалуйста."
      - "Lee el texto: es el repaso. — Прочитай текст: это повторение."
    collocations:
      - "hacer un repaso — повторить материал"
    trap: "repaso — повторение материала, а «повтор (слова)» — repetición."

  - es: "¿Cómo se dice... en español?"
    meaning: "Как сказать … по-испански? — главный вопрос на уроке."
    examples:
      - "¿Cómo se dice «спасибо» en español? — Как сказать «спасибо» по-испански?"
      - "Perdón, ¿cómo se dice «собака» en español? — Извините, как сказать «собака» по-испански?"
    collocations:
      - "¿cómo se dice en ruso? — как это по-русски?"
    trap: "По-испански — en español, с en: hablar en español."

  - es: "¿Qué significa...?"
    meaning: "Что значит …? — спрашиваем значение слова."
    examples:
      - "¿Qué significa «perro»? — Что значит «perro»?"
      - "Perdón, ¿qué significa «vale»? — Извините, что значит «vale»?"
    collocations:
      - "¿qué quiere decir? — что это значит?"
    trap: "Не ¿Qué es significa?: просто ¿Qué significa…?"

  - es: No entiendo.
    pron: "ie — одним слогом: «энтьэ́ндо»."
    meaning: "Я не понимаю."
    examples:
      - "Perdón, no entiendo. — Извините, я не понимаю."
      - "No entiendo. Otra vez, por favor. — Не понимаю. Ещё раз, пожалуйста."
    collocations:
      - "no te entiendo — я тебя не понимаю"
    trap: "Глагол entender меняет e на ie: entiendo, entiendes. «Я не понял» — No entendí."

  - es: Más despacio, por favor.
    pron: "c перед i — как th в think: «дэспа́θьо»."
    meaning: "Помедленнее, пожалуйста."
    examples:
      - "No entiendo. Más despacio, por favor. — Не понимаю. Помедленнее, пожалуйста."
    collocations:
      - "despacio — медленно"
    trap: "despacio — «медленно», а не «пространство» (espacio)."

  - es: Otra vez, por favor.
    pron: "v — как b, z — как th в think: «о́тра бэθ»."
    meaning: "Ещё раз, пожалуйста."
    examples:
      - "No entiendo. Otra vez, por favor. — Не понимаю. Ещё раз, пожалуйста."
    collocations:
      - "una vez — один раз"
    trap: "Без артикля: otra vez, а не una otra vez."

  - es: "¿Cómo se escribe?"
    meaning: "Как это пишется?"
    examples:
      - "¿Cómo se escribe «perro»? — Как пишется «perro»?"
      - "Perdón, ¿cómo se escribe? — Извините, как это пишется?"
    collocations:
      - "se escribe con… — пишется с…"
    trap: "Ответ часто такой: Se escribe con b / con v — «пишется с b / с v»: на слух их не различить."

  - es: practica
    pron: "Ударение на первом слоге: «пра́ктика»."
    meaning: "Тренируйся, практикуйся — на «ты». Глагол — practicar."
    examples:
      - "Lee, escucha y practica. — Читай, слушай и тренируйся."
    collocations:
      - "practicar el español — практиковать испанский"
    trap: "practica (тренируйся) и la práctica (практика) различает знак ударения."
