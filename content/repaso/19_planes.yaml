# Тема 19 «Планы». Правила — docs/repaso_guide.md.
words:
  - es: el plan
    meaning: "План."
    examples:
      - "¿Tienes planes para el sábado? — У тебя есть планы на субботу?"
    collocations:
      - "hacer planes — строить планы"
    trap: "Планы на что-то — para: planes para el sábado."

  - es: esta noche
    pron: "ch — «ч»."
    meaning: "Сегодня вечером, сегодня ночью."
    examples:
      - "Esta noche voy al cine. — Сегодня вечером я иду в кино."
    collocations:
      - "esta mañana — сегодня утром"
    trap: "Не hoy noche, а esta noche."

  - es: pasado mañana
    pron: "ñ — «нь»."
    meaning: "Послезавтра."
    examples:
      - "Pasado mañana es sábado. — Послезавтра суббота."
    collocations:
      - "anteayer — позавчера"
    trap: "Буквально «прошедшее завтра» — послезавтра."

  - es: la semana que viene
    pron: "ie — одним слогом: «бьэ́нэ»."
    meaning: "На следующей неделе."
    examples:
      - "La semana que viene voy a Madrid. — На следующей неделе я еду в Мадрид."
    collocations:
      - "el mes que viene — в следующем месяце"
    trap: "Без предлога: la semana que viene voy…"

  - es: el año que viene
    meaning: "В следующем году."
    examples:
      - "El año que viene voy a España. — В следующем году я поеду в Испанию."
    collocations:
      - "el año pasado — в прошлом году"
    trap: "Без предлога, как и la semana que viene."

  - es: próximo/a
    pron: "x — «кс», ударение на первом слоге: «про́ксимо»."
    meaning: "Следующий."
    examples:
      - "el próximo lunes — в следующий понедельник"
      - "La próxima semana trabajo. — На следующей неделе я работаю."
    collocations:
      - "la próxima vez — в следующий раз"
    trap: "Знак ударения: próximo."

  - es: visitar
    pron: "v — как b: «бисита́р»."
    meaning: "Посещать, навещать."
    examples:
      - "Voy a visitar a mis abuelos. — Я собираюсь навестить бабушку и дедушку."
    collocations:
      - "visitar un museo — посетить музей"
    trap: "Людей навещают с a: visitar a mis padres."

  - es: descansar
    meaning: "Отдыхать."
    examples:
      - "El domingo voy a descansar. — В воскресенье я буду отдыхать."
    collocations:
      - "¡que descanses! — отдыхай!"
    trap: "Отдых в отпуске — las vacaciones, а descansar — просто отдыхать."

  - es: la fiesta
    pron: "ie — одним слогом: «фьэ́ста»."
    meaning: "Праздник, вечеринка."
    examples:
      - "El sábado hay una fiesta. — В субботу вечеринка."
    collocations:
      - "una fiesta de cumpleaños — день рождения (праздник)"
    trap: "Ir de fiesta — «пойти тусоваться»."

  - es: quedar
    pron: "qu — «к»: «кэда́р»."
    meaning: "Встречаться, договариваться о встрече; ещё — оставаться, сидеть (об одежде)."
    examples:
      - "Quedo con mis amigos. — Я встречаюсь с друзьями."
    collocations:
      - "quedar con alguien — встретиться с кем-то"
    trap: "С кем — con: quedo con Ana."

  - es: tener que
    meaning: "Быть должным, нужно (кому-то) — + инфинитив."
    examples:
      - "Tengo que trabajar. — Мне нужно работать."
    collocations:
      - "tienes que venir — ты должен прийти"
    trap: "После tener que — инфинитив: tengo que estudiar."

  - es: hay que
    meaning: "Нужно, надо — всем, вообще, без «кто»."
    examples:
      - "Hay que comprar pan. — Нужно купить хлеб."
    collocations:
      - "no hay que — не нужно"
    trap: "Hay que — без лица: «надо». Tengo que — «мне надо»."

  - es: comprar
    meaning: "Покупать."
    examples:
      - "Tengo que comprar pan. — Мне нужно купить хлеб."
    collocations:
      - "ir de compras — ходить по магазинам"
    trap: "Покупки — las compras: hacer la compra — купить продукты."

  - es: lo siento
    pron: "ie — одним слогом: «сьэ́нто»."
    meaning: "Мне жаль, извини — когда отказываетесь или сочувствуете."
    examples:
      - "Lo siento, no puedo. — Извини, не могу."
    collocations:
      - "lo siento mucho — мне очень жаль"
    trap: "Lo siento — сожаление; чтобы обратиться — perdón."

  - es: "¡Genial!"
    pron: "g перед e — «х»: «хэнья́ль»."
    meaning: "Отлично! Здорово!"
    examples:
      - "¿Quedamos el sábado? ¡Genial! — Встретимся в субботу? Отлично!"
    collocations:
      - "una idea genial — гениальная идея"
    trap: "g читается как «х»: «хеньяль»."

  - es: otro día
    meaning: "В другой раз."
    examples:
      - "Lo siento, hoy no puedo. Otro día. — Извини, сегодня не могу. В другой раз."
    collocations:
      - "otra vez — ещё раз"
    trap: "Без артикля: otro día, а не un otro día."

  - es: "¿Quedamos...?"
    meaning: "Встретимся …? — предложение встретиться."
    examples:
      - "¿Quedamos a las ocho? — Встретимся в восемь?"
    collocations:
      - "¿dónde quedamos? — где встретимся?"
    trap: "¿Quedamos? — «Встретимся?», а не «Останемся?»."

  - es: "¡Perfecto!"
    meaning: "Отлично! Идеально!"
    examples:
      - "¿A las ocho? ¡Perfecto! — В восемь? Отлично!"
    collocations:
      - "perfecto, gracias — отлично, спасибо"
    trap: "В разговоре Perfecto — просто «договорились, отлично»."

  - es: el viaje
    pron: "v — как b, j — «х»: «бья́хэ»."
    meaning: "Путешествие, поездка."
    examples:
      - "¡Buen viaje! — Счастливого пути!"
    collocations:
      - "hacer un viaje — совершить поездку"
    trap: "Глагол — viajar, существительное — el viaje."

  - es: las vacaciones
    pron: "v — как b, c перед i — как th."
    meaning: "Отпуск, каникулы — всегда во множественном."
    examples:
      - "En agosto estoy de vacaciones. — В августе я в отпуске."
    collocations:
      - "irse de vacaciones — уехать в отпуск"
    trap: "Только во множественном: las vacaciones. «В отпуске» — de vacaciones."

  - es: conocer
    pron: "c перед e — как th. Форма «я» — conozco."
    meaning: "Знакомиться; знать (людей, места)."
    examples:
      - "Quiero conocer España. — Хочу побывать в Испании."
      - "Conozco a Ana. — Я знаком с Аной."
    collocations:
      - "encantado de conocerte — рад познакомиться"
    trap: "Знать факт — saber, знать человека или место — conocer. Людей — с a."
