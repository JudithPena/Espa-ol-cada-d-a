# Тема 15 «Время и дни». Правила — docs/repaso_guide.md.
words:
  - es: el lunes
    meaning: "Понедельник. Дни недели пишутся с маленькой буквы."
    examples:
      - "El lunes trabajo. — В понедельник я работаю."
    collocations:
      - "los lunes — по понедельникам"
    trap: "«В понедельник» — el lunes, без предлога."

  - es: el martes
    meaning: "Вторник."
    examples:
      - "El martes voy al cine. — Во вторник я иду в кино."
    collocations:
      - "martes y trece — испанская «пятница, 13»"
    trap: "Во множественном не меняется: los martes."

  - es: el miércoles
    pron: "ie — одним слогом, ударение на mier: «мьэ́рколэс»."
    meaning: "Среда."
    examples:
      - "El miércoles voy al cine. — В среду я иду в кино."
    collocations:
      - "los miércoles — по средам"
    trap: "Знак ударения: miércoles."

  - es: el jueves
    pron: "j — «х», ue — одним слогом: «хуэ́бэс»."
    meaning: "Четверг."
    examples:
      - "El jueves ceno con mis amigos. — В четверг я ужинаю с друзьями."
    collocations:
      - "los jueves — по четвергам"
    trap: "Не путайте с jugar «играть»."

  - es: el viernes
    pron: "v — как b, ie — один слог: «бьэ́рнэс»."
    meaning: "Пятница."
    examples:
      - "El viernes voy al bar. — В пятницу я иду в бар."
    collocations:
      - "el viernes por la noche — в пятницу вечером"
    trap: "Во множественном не меняется: los viernes."

  - es: el sábado
    pron: "Ударение на первом слоге: «са́бадо»."
    meaning: "Суббота."
    examples:
      - "El sábado voy a la playa. — В субботу я еду на пляж."
    collocations:
      - "los sábados — по субботам"
    trap: "Знак ударения: sábado."

  - es: el domingo
    meaning: "Воскресенье."
    examples:
      - "El domingo como con mi familia. — В воскресенье я обедаю с семьёй."
    collocations:
      - "los domingos — по воскресеньям"
    trap: "В воскресенье в Испании многие магазины закрыты."

  - es: la semana
    meaning: "Неделя."
    examples:
      - "Trabajo cinco días a la semana. — Я работаю пять дней в неделю."
    collocations:
      - "la semana que viene — на следующей неделе"
    trap: "«В неделю» — a la semana: dos veces a la semana."

  - es: "¿Qué hora es?"
    meaning: "Который час?"
    examples:
      - "¿Qué hora es? Son las tres. — Который час? Три часа."
    collocations:
      - "es la una — час"
    trap: "Час — es la una, остальное — son las…: son las dos."

  - es: la hora
    pron: "h не читается: «о́ра»."
    meaning: "Час; время на часах."
    examples:
      - "Una hora. — Один час."
    collocations:
      - "a la hora — вовремя"
    trap: "Время вообще — el tiempo, время на часах — la hora."

  - es: y media
    meaning: "Половина — «… и тридцать»."
    examples:
      - "Son las tres y media. — Половина четвёртого."
    collocations:
      - "a las dos y media — в половине третьего"
    trap: "Час — тот, что прошёл: las tres y media = 3:30."

  - es: y cuarto
    pron: "cu — «ку»: «куа́рто»."
    meaning: "Четверть — «… и пятнадцать»."
    examples:
      - "Son las cinco y cuarto. — Четверть шестого."
    collocations:
      - "a las ocho y cuarto — в четверть девятого"
    trap: "cuarto — ещё и «комната» и «четвёртый»."

  - es: menos cuarto
    meaning: "Без четверти."
    examples:
      - "Son las seis menos cuarto. — Без четверти шесть."
    collocations:
      - "las dos menos diez — без десяти два"
    trap: "Называют следующий час: 5:45 — las seis menos cuarto."

  - es: menos
    meaning: "Без, минус; меньше."
    examples:
      - "Son las dos menos diez. — Без десяти два."
    collocations:
      - "más o menos — более-менее"
    trap: "Más o menos — «так себе, примерно»."

  - es: en punto
    meaning: "Ровно (о времени)."
    examples:
      - "Son las ocho en punto. — Ровно восемь."
    collocations:
      - "a las nueve en punto — ровно в девять"
    trap: "Не «в точке»: en punto — «ровно»."

  - es: "¿A qué hora...?"
    meaning: "Во сколько …?"
    examples:
      - "¿A qué hora comes? — Во сколько ты обедаешь?"
    collocations:
      - "a las tres — в три"
    trap: "Во сколько — с a: ¿A qué hora?, и ответ — a las tres."

  - es: por la mañana
    meaning: "Утром."
    examples:
      - "Por la mañana bebo café. — Утром я пью кофе."
    collocations:
      - "mañana por la mañana — завтра утром"
    trap: "С точным временем — de la mañana: a las nueve de la mañana."

  - es: por la tarde
    meaning: "Днём, после обеда; вечером (пока светло)."
    examples:
      - "Por la tarde estudio. — Днём я учусь."
    collocations:
      - "a las cinco de la tarde — в пять вечера"
    trap: "С часом — de la tarde: a las cinco de la tarde."

  - es: por la noche
    pron: "ch — «ч»."
    meaning: "Вечером, ночью."
    examples:
      - "Por la noche veo la tele. — Вечером я смотрю телевизор."
    collocations:
      - "a las diez de la noche — в десять вечера"
    trap: "Сегодня вечером — esta noche."

  - es: la clase
    meaning: "Урок, занятие; класс."
    examples:
      - "La clase empieza a las nueve. — Урок начинается в девять."
    collocations:
      - "ir a clase — идти на занятие"
    trap: "На урок — a clase, без артикля."

  - es: empezar
    pron: "z — как th: «эмпэθа́р». e → ie: empiezo."
    meaning: "Начинать(ся)."
    examples:
      - "La clase empieza a las nueve. — Урок начинается в девять."
    collocations:
      - "empezar a + инфинитив — начать делать"
    trap: "e меняется на ie: empieza, а не empeza."

  - es: terminar
    meaning: "Заканчивать(ся)."
    examples:
      - "La clase termina a las diez. — Урок заканчивается в десять."
    collocations:
      - "terminar de + инфинитив — закончить делать"
    trap: "Закончить делать — terminar de: termino de comer."

  - es: cerrar
    pron: "c перед e — как th, rr — раскатистое: «θэрра́р». e → ie: cierro."
    meaning: "Закрывать(ся)."
    examples:
      - "La tienda cierra a las nueve. — Магазин закрывается в девять."
    collocations:
      - "cerrar la puerta — закрыть дверь"
    trap: "e меняется на ie: cierra."

  - es: todos los días
    meaning: "Каждый день."
    examples:
      - "Estudio español todos los días. — Я учу испанский каждый день."
    collocations:
      - "todas las semanas — каждую неделю"
    trap: "С артиклем: todos los días, а не todos días."

  - es: de... a...
    meaning: "С … до … (о времени)."
    examples:
      - "de lunes a viernes — с понедельника по пятницу"
      - "Trabajo de nueve a cinco. — Я работаю с девяти до пяти."
    collocations:
      - "desde… hasta… — с… до… (книжнее)"
    trap: "С часами — de nueve a cinco, без артикля, хотя a las nueve с ним."

  - es: abierto/a
    meaning: "Открытый, открыто."
    examples:
      - "El museo está abierto. — Музей открыт."
    collocations:
      - "abierto 24 horas — открыто круглосуточно"
    trap: "С estar: está abierto."

  - es: cerrado/a
    pron: "c перед e — как th, rr — раскатистое."
    meaning: "Закрытый, закрыто."
    examples:
      - "La tienda está cerrada. — Магазин закрыт."
    collocations:
      - "cerrado por vacaciones — закрыто на отпуск"
    trap: "С estar: está cerrado."
