# Тема 23 «Финал». Правила — docs/repaso_guide.md.
words:
  - es: la cosa
    meaning: "Вещь, дело."
    examples:
      - "Tengo muchas cosas en la mochila. — У меня в рюкзаке много вещей."
    collocations:
      - "otra cosa — другое дело"
    trap: "¿Qué cosa? — «Что-что?», разговорное."

  - es: pasear
    meaning: "Гулять."
    examples:
      - "Paseo por el parque. — Я гуляю по парку."
    collocations:
      - "dar un paseo — прогуляться"
    trap: "Где гуляют — por: paseo por la ciudad."

  - es: "¡Enhorabuena!"
    pron: "h не читается, ue — «уэ»: «энорабуэ́на»."
    meaning: "Поздравляю! — с успехом, достижением."
    examples:
      - "¡Enhorabuena! Has terminado el test. — Поздравляю! Ты закончил тест."
    collocations:
      - "dar la enhorabuena — поздравить"
    trap: "С праздником поздравляют ¡Felicidades!, с успехом — ¡Enhorabuena!"

  - es: "¡Mucha suerte!"
    pron: "ue — одним слогом: «суэ́ртэ»."
    meaning: "Удачи!"
    examples:
      - "Mañana tengo un examen. ¡Mucha suerte! — Завтра у меня экзамен. Удачи!"
    collocations:
      - "tener suerte — везти"
    trap: "«Мне везёт» — tengo suerte."
