# Тема 12 «Город». Правила — docs/repaso_guide.md.
words:
  - es: la ciudad
    pron: "c перед i — как th, d в конце почти не слышно: «θьуда́»."
    meaning: "Город."
    examples:
      - "Madrid es una ciudad grande. — Мадрид — большой город."
    collocations:
      - "el centro de la ciudad — центр города"
    trap: "Женского рода, как все слова на -dad: la ciudad."

  - es: la calle
    pron: "ll — как «й»: «ка́йе»."
    meaning: "Улица."
    examples:
      - "Vivo en una calle pequeña. — Я живу на маленькой улице."
      - "¿Dónde está la calle Mayor? — Где улица Майор?"
    collocations:
      - "en la calle — на улице"
    trap: "«На улице» — en la calle, с en."

  - es: el parque
    pron: "qu — «к»: «па́ркэ»."
    meaning: "Парк."
    examples:
      - "El parque está cerca de mi casa. — Парк недалеко от моего дома."
    collocations:
      - "el parque del Retiro — парк Ретиро в Мадриде"
    trap: "Не «паркет»: паркет — el parqué."

  - es: la tienda
    pron: "ie — одним слогом: «тьэ́нда»."
    meaning: "Магазин; ещё — палатка."
    examples:
      - "La tienda está en la plaza. — Магазин на площади."
    collocations:
      - "la tienda de ropa — магазин одежды"
    trap: "Большой магазин — el supermercado или los grandes almacenes."

  - es: el supermercado
    meaning: "Супермаркет. Разговорно — el súper."
    examples:
      - "El supermercado está cerca. — Супермаркет рядом."
    collocations:
      - "ir al súper — сходить в супермаркет"
    trap: "Мужского рода, как mercado."

  - es: la farmacia
    pron: "c перед i — как th: «фарма́θья»."
    meaning: "Аптека. В Испании её узнают по зелёному кресту."
    examples:
      - "¿Hay una farmacia por aquí? — Здесь поблизости есть аптека?"
    collocations:
      - "la farmacia de guardia — дежурная аптека"
    trap: "Аптекарь — el farmacéutico."

  - es: el banco
    meaning: "Банк; ещё — скамейка."
    examples:
      - "El banco está en la calle Mayor. — Банк на улице Майор."
      - "Hay un banco en el parque. — В парке есть скамейка."
    collocations:
      - "sacar dinero del banco — снять деньги в банке"
    trap: "banco — и банк, и скамейка: смысл понятен из ситуации."

  - es: el museo
    meaning: "Музей."
    examples:
      - "El museo del Prado está en Madrid. — Музей Прадо в Мадриде."
    collocations:
      - "ir al museo — пойти в музей"
    trap: "Ударение на e: «мусэ́о»."

  - es: la estación
    pron: "c перед i — как th: «эстаθьо́н»."
    meaning: "Вокзал; станция; время года."
    examples:
      - "La estación está lejos. — Вокзал далеко."
    collocations:
      - "la estación de tren — железнодорожный вокзал"
      - "las cuatro estaciones — четыре времени года"
    trap: "estación — ещё и «время года»: la estación favorita."

  - es: la parada
    meaning: "Остановка (автобуса, такси)."
    examples:
      - "La parada está aquí. — Остановка здесь."
    collocations:
      - "la parada de autobús — автобусная остановка"
    trap: "Не «парад»: парад — el desfile."

  - es: el cine
    pron: "c перед i — как th: «θи́нэ»."
    meaning: "Кино; кинотеатр."
    examples:
      - "El cine está cerca de la plaza. — Кинотеатр недалеко от площади."
    collocations:
      - "ir al cine — пойти в кино"
    trap: "Фильм — la película, а el cine — кинотеатр или кино как искусство."

  - es: el bar
    meaning: "Бар, кафе — в Испании это обычное место, где пьют кофе, едят тапас и завтракают."
    examples:
      - "El bar está en la plaza. — Бар на площади."
    collocations:
      - "tomar algo en un bar — выпить что-нибудь в баре"
    trap: "Испанский bar — не только алкоголь: туда ходят и за утренним кофе."

  - es: la biblioteca
    meaning: "Библиотека."
    examples:
      - "Estudio en la biblioteca. — Я занимаюсь в библиотеке."
    collocations:
      - "sacar un libro de la biblioteca — взять книгу в библиотеке"
    trap: "biblioteca — библиотека, а librería — книжный магазин."

  - es: el mercado
    meaning: "Рынок."
    examples:
      - "El mercado está en el centro. — Рынок в центре."
    collocations:
      - "el mercado de San Miguel — рынок Сан-Мигель в Мадриде"
    trap: "Мужского рода: el mercado."

  - es: el aeropuerto
    pron: "ae — два слога, ue — один: «аэропуэ́рто»."
    meaning: "Аэропорт."
    examples:
      - "El aeropuerto está lejos de la ciudad. — Аэропорт далеко от города."
    collocations:
      - "ir al aeropuerto — ехать в аэропорт"
    trap: "aero + puerto «порт»: «воздушный порт»."

  - es: ir
    meaning: "Идти, ехать. Неправильный: voy, vas, va, vamos, vais, van."
    examples:
      - "Voy a la tienda. — Я иду в магазин."
      - "¿Vas al cine? — Ты идёшь в кино?"
    collocations:
      - "ir a pie — идти пешком"
      - "ir en metro — ехать на метро"
    trap: "Куда — a: voy a Madrid. На чём — en: voy en tren, но пешком — a pie."

  - es: "¿Adónde vas?"
    pron: "v — как b: «адо́ндэ бас»."
    meaning: "Куда ты идёшь?"
    examples:
      - "¿Adónde vas? Voy al parque. — Куда ты идёшь? В парк."
    collocations:
      - "¿adónde va usted? — куда вы идёте?"
    trap: "Куда — adónde (с a), где — dónde: ¿Dónde estás?"

  - es: a
    meaning: "В, на (куда); к. С el сливается: a + el = al."
    examples:
      - "Voy a la tienda. — Я иду в магазин."
      - "Voy al parque. — Я иду в парк."
    collocations:
      - "a casa — домой"
    trap: "a + el = al: voy al cine, а не a el cine."

  - es: con
    meaning: "С (вместе с)."
    examples:
      - "Voy al cine con mi amiga. — Я иду в кино с подругой."
      - "Voy al parque con Ana. — Я иду в парк с Аной."
    collocations:
      - "conmigo — со мной"
      - "contigo — с тобой"
    trap: "Со мной — conmigo, с тобой — contigo, а не con mí, con ti."

  - es: el metro
    meaning: "Метро; ещё — метр."
    examples:
      - "Voy al trabajo en metro. — Я езжу на работу на метро."
    collocations:
      - "la estación de metro — станция метро"
    trap: "На чём ехать — en: en metro."

  - es: el autobús
    pron: "au — один слог, ударение на последнем: «аутобу́с»."
    meaning: "Автобус."
    examples:
      - "Voy en autobús. — Я еду на автобусе."
    collocations:
      - "la parada de autobús — остановка автобуса"
    trap: "Множественное — autobuses, без знака ударения."

  - es: el coche
    pron: "ch — «ч»: «ко́чэ»."
    meaning: "Машина, автомобиль — так в Испании."
    examples:
      - "Voy al trabajo en coche. — Я езжу на работу на машине."
    collocations:
      - "conducir un coche — водить машину"
    trap: "В Латинской Америке — el carro или el auto 🌎."

  - es: el tren
    meaning: "Поезд."
    examples:
      - "Voy a Barcelona en tren. — Я еду в Барселону на поезде."
    collocations:
      - "el tren de alta velocidad (AVE) — скоростной поезд"
    trap: "Множественное — trenes."

  - es: la bici
    pron: "c перед i — как th: «би́θи»."
    meaning: "Велосипед — сокращение от la bicicleta."
    examples:
      - "Voy en bici. — Я еду на велосипеде."
    collocations:
      - "montar en bici — кататься на велосипеде"
    trap: "Женского рода: la bici."

  - es: a pie
    pron: "ie — одним слогом: «а пьэ»."
    meaning: "Пешком."
    examples:
      - "Voy al trabajo a pie. — Я хожу на работу пешком."
    collocations:
      - "ir a pie — идти пешком"
    trap: "Пешком — a pie, а не en pie (en pie — «стоя»)."

  - es: el trabajo
    pron: "j — «х»: «траба́хо»."
    meaning: "Работа."
    examples:
      - "Voy al trabajo en metro. — Я езжу на работу на метро."
    collocations:
      - "buscar trabajo — искать работу"
    trap: "trabajo — и работа, и место работы, и «труд»."

  - es: perdone
    meaning: "Извините — вежливо, чтобы обратиться к незнакомому."
    examples:
      - "Perdone, ¿dónde está el museo? — Извините, где музей?"
    collocations:
      - "perdona — прости (на «ты»)"
    trap: "На «вы» — perdone, на «ты» — perdona."

  - es: por aquí
    meaning: "Поблизости, здесь; сюда."
    examples:
      - "¿Hay una farmacia por aquí? — Здесь поблизости есть аптека?"
    collocations:
      - "por aquí, por favor — сюда, пожалуйста"
    trap: "Por aquí — не «через здесь», а «где-то здесь, поблизости»."

  - es: todo recto
    meaning: "Прямо — когда объясняют дорогу."
    examples:
      - "Todo recto y a la derecha. — Прямо и направо."
    collocations:
      - "sigue todo recto — иди прямо"
    trap: "«Прямо» в пути — todo recto, а не derecho (это «право» и в Латинской Америке «прямо» 🌎)."

  - es: a la derecha
    pron: "ch — «ч»: «дэрэ́ча»."
    meaning: "Направо, справа."
    examples:
      - "El banco está a la derecha. — Банк справа."
    collocations:
      - "gira a la derecha — поверни направо"
    trap: "derecha (направо) похоже на derecho «прямо»; запомните: derecha — правая сторона."

  - es: a la izquierda
    pron: "z — как th, qu — «к»: «иθкьэ́рда»."
    meaning: "Налево, слева."
    examples:
      - "La farmacia está a la izquierda. — Аптека слева."
    collocations:
      - "gira a la izquierda — поверни налево"
    trap: "Длинное слово — запомните по частям: iz-quier-da."

  - es: primero/a
    meaning: "Первый. Перед существительным мужского рода — primer: el primer día."
    examples:
      - "Es la primera calle a la derecha. — Это первая улица направо."
    collocations:
      - "primero — сначала"
    trap: "el primer piso, а не el primero piso."

  - es: segundo/a
    meaning: "Второй; ещё — секунда."
    examples:
      - "Es la segunda calle a la izquierda. — Это вторая улица налево."
    collocations:
      - "un segundo — секунду"
    trap: "Un segundo — «секунду!», когда просят подождать."

  - es: el barrio
    pron: "rr — раскатистое: «ба́рьо»."
    meaning: "Район, квартал."
    examples:
      - "Mi barrio es tranquilo. — Мой район спокойный."
    collocations:
      - "el barrio antiguo — старый квартал"
    trap: "barrio — район в бытовом смысле, а административный — el distrito."

  - es: tranquilo/a
    pron: "qu — «к»: «транки́ло»."
    meaning: "Спокойный, тихий. ¡Tranquilo! — «Спокойно!»."
    examples:
      - "Es un barrio tranquilo. — Это тихий район."
    collocations:
      - "¡tranquilo! — спокойно, не волнуйся!"
    trap: "¡Tranquila! — женщине, ¡Tranquilo! — мужчине."

  - es: mucho/a
    meaning: "Много — перед существительным согласуется: muchos bares, mucha gente."
    examples:
      - "muchos bares — много баров"
      - "En el centro hay mucha gente. — В центре много людей."
    collocations:
      - "muchas gracias — большое спасибо"
    trap: "Согласуется с существительным: mucha gente, а не mucho gente."

  - es: la gente
    pron: "g перед e — «х»: «хэ́нтэ»."
    meaning: "Люди — в единственном числе."
    examples:
      - "En el centro hay mucha gente. — В центре много людей."
    collocations:
      - "la gente joven — молодёжь"
    trap: "Глагол в единственном: la gente es simpática, а не son."
