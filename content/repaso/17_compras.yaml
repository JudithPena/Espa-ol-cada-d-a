# Тема 17 «Покупки». Правила — docs/repaso_guide.md.
words:
  - es: la ropa
    meaning: "Одежда — в единственном числе."
    examples:
      - "La tienda de ropa está en el centro. — Магазин одежды в центре."
    collocations:
      - "la tienda de ropa — магазин одежды"
    trap: "Одежда — la ropa, в единственном: la ropa es cara."

  - es: la camisa
    meaning: "Рубашка."
    examples:
      - "Llevo una camisa blanca. — На мне белая рубашка."
    collocations:
      - "una camisa de manga corta — рубашка с коротким рукавом"
    trap: "camisa — рубашка, camiseta — футболка."

  - es: la camiseta
    meaning: "Футболка; майка."
    examples:
      - "Llevo una camiseta blanca. — На мне белая футболка."
    collocations:
      - "la camiseta del equipo — футболка команды"
    trap: "Не путайте с camisa «рубашка»."

  - es: los pantalones
    meaning: "Брюки — обычно во множественном числе."
    examples:
      - "Llevo pantalones negros. — На мне чёрные брюки."
    collocations:
      - "los pantalones cortos — шорты"
    trap: "Обычно во множественном: los pantalones."

  - es: la falda
    meaning: "Юбка."
    examples:
      - "Llevo una falda azul. — На мне синяя юбка."
    collocations:
      - "una falda larga — длинная юбка"
    trap: "Женского рода: la falda."

  - es: el vestido
    pron: "v — как b: «бэсти́до»."
    meaning: "Платье."
    examples:
      - "Es un vestido muy bonito. — Это очень красивое платье."
    collocations:
      - "el vestido de novia — свадебное платье"
    trap: "Не «вестибюль»: vestido — платье, от vestirse «одеваться»."

  - es: el jersey
    pron: "j — «х», ey — «эй»: «хэрсэ́й»."
    meaning: "Свитер — так в Испании."
    examples:
      - "Llevo un jersey azul. — На мне синий свитер."
    collocations:
      - "un jersey de lana — шерстяной свитер"
    trap: "Во множественном — jerséis. В Латинской Америке — el suéter 🌎."

  - es: los zapatos
    pron: "z — как th: «θапа́тос»."
    meaning: "Туфли, ботинки."
    examples:
      - "Llevo zapatos negros. — На мне чёрные туфли."
    collocations:
      - "la tienda de zapatos — обувной магазин"
    trap: "Кроссовки — las zapatillas."

  - es: la chaqueta
    pron: "ch — «ч», qu — «к»: «чакэ́та»."
    meaning: "Куртка, пиджак."
    examples:
      - "Llevo una chaqueta negra. — На мне чёрная куртка."
    collocations:
      - "la chaqueta de cuero — кожаная куртка"
    trap: "Пальто — el abrigo, а chaqueta — короче."

  - es: el abrigo
    meaning: "Пальто."
    examples:
      - "Llevo un abrigo largo. — На мне длинное пальто."
    collocations:
      - "un abrigo largo — длинное пальто"
    trap: "Ещё значит «укрытие»: al abrigo de — «под защитой»."

  - es: los vaqueros
    pron: "v — как b, qu — «к»: «бакэ́рос»."
    meaning: "Джинсы — так в Испании; буквально «ковбойские»."
    examples:
      - "Llevo vaqueros y una camiseta. — На мне джинсы и футболка."
    collocations:
      - "unos vaqueros — джинсы (одни)"
    trap: "В Латинской Америке — los jeans 🌎."

  - es: las zapatillas
    pron: "ll — как «й»: «θапати́йяс»."
    meaning: "Кроссовки; тапочки."
    examples:
      - "Llevo zapatillas para correr. — Я ношу кроссовки для бега."
    collocations:
      - "las zapatillas de deporte — спортивные кроссовки"
    trap: "И кроссовки, и домашние тапки — zapatillas."

  - es: gris
    meaning: "Серый — одна форма."
    examples:
      - "Llevo un jersey gris. — На мне серый свитер."
    collocations:
      - "un día gris — пасмурный день"
    trap: "Во множественном — grises."

  - es: la talla
    pron: "ll — как «й»: «та́йя»."
    meaning: "Размер одежды."
    examples:
      - "¿Qué talla es? — Какой это размер?"
    collocations:
      - "la talla M — размер M"
    trap: "Размер обуви — el número: ¿Qué número calzas?"

  - es: treinta
    pron: "ei — одним слогом: «трэ́йнта»."
    meaning: "Тридцать. 31 — treinta y uno (раздельно)."
    examples:
      - "Son treinta euros. — Это тридцать евро."
    collocations:
      - "treinta y uno — тридцать один"
    trap: "С 31 числа пишутся через y раздельно: treinta y dos."

  - es: cuarenta
    pron: "cu — «ку»: «куарэ́нта»."
    meaning: "Сорок."
    examples:
      - "Son cuarenta euros. — Это сорок евро."
    collocations:
      - "cuarenta y cinco — сорок пять"
    trap: "Не путайте с catorce (14)."

  - es: cincuenta
    pron: "c перед i — как th, ue — «уэ»: «θинкуэ́нта»."
    meaning: "Пятьдесят."
    examples:
      - "Son cincuenta euros. — Это пятьдесят евро."
    collocations:
      - "los años cincuenta — пятидесятые годы"
    trap: "Не путайте с quince (15)."

  - es: sesenta
    meaning: "Шестьдесят."
    examples:
      - "Mi padre tiene sesenta años. — Моему отцу шестьдесят лет."
    collocations:
      - "sesenta minutos — шестьдесят минут"
    trap: "sesenta (60) и setenta (70) легко спутать на слух."

  - es: setenta
    meaning: "Семьдесят."
    examples:
      - "Mi abuelo tiene setenta años. — Моему дедушке семьдесят лет."
    collocations:
      - "setenta y siete — семьдесят семь"
    trap: "setenta (70) ≠ sesenta (60)."

  - es: ochenta
    pron: "ch — «ч»: «очэ́нта»."
    meaning: "Восемьдесят."
    examples:
      - "Mi abuela tiene ochenta años. — Моей бабушке восемьдесят лет."
    collocations:
      - "los años ochenta — восьмидесятые"
    trap: "Не путайте с ocho (8)."

  - es: noventa
    pron: "v — как b: «нобэ́нта»."
    meaning: "Девяносто."
    examples:
      - "Son noventa euros. — Это девяносто евро."
    collocations:
      - "los años noventa — девяностые"
    trap: "Не путайте с nueve (9)."

  - es: cien
    pron: "c перед i — как th: «θьен»."
    meaning: "Сто. С 101 — ciento: ciento uno."
    examples:
      - "Son cien euros. — Это сто евро."
    collocations:
      - "cien por cien — на сто процентов"
    trap: "Ровно сто — cien, дальше — ciento: ciento veinte."

  - es: este/esta
    meaning: "Этот, эта — рядом со мной."
    examples:
      - "Esta camiseta es bonita. — Эта футболка красивая."
      - "Este jersey es gris. — Этот свитер серый."
    collocations:
      - "esta noche — сегодня вечером"
    trap: "esto — «это» без существительного: ¿Qué es esto?"

  - es: ese/esa
    meaning: "Этот, тот — рядом с собеседником."
    examples:
      - "Esa falda es bonita. — Та юбка красивая."
    collocations:
      - "eso es — именно так"
    trap: "Eso es — «вот именно», частая реакция."

  - es: aquel/aquella
    pron: "qu — «к», ll — «й»: «акэ́ль, акэ́йя»."
    meaning: "Тот, та — далеко от обоих."
    examples:
      - "Aquel vestido es muy bonito. — То платье очень красивое."
    collocations:
      - "en aquel momento — в тот момент"
    trap: "aquel — ещё и о далёком прошлом: aquel año — «в тот год»."

  - es: ahí
    pron: "h не читается, ударение на последнем: «аи́»."
    meaning: "Там — рядом с собеседником."
    examples:
      - "Tu móvil está ahí. — Твой телефон там (рядом с тобой)."
    collocations:
      - "por ahí — где-то там"
    trap: "aquí — здесь, ahí — у тебя, allí — далеко."

  - es: "¿Cuánto cuesta...?"
    pron: "ue — одним слогом: «куэ́ста»."
    meaning: "Сколько стоит …?"
    examples:
      - "¿Cuánto cuesta esta camiseta? — Сколько стоит эта футболка?"
    collocations:
      - "¿cuánto cuestan? — сколько стоят?"
    trap: "О нескольких — cuestan: ¿Cuánto cuestan los zapatos?"

  - es: costar
    meaning: "Стоить. o → ue: cuesta."
    examples:
      - "Cuesta veinte euros. — Стоит двадцать евро."
    collocations:
      - "me cuesta + инфинитив — мне трудно"
    trap: "Me cuesta hablar — «мне трудно говорить»."

  - es: caro/a
    meaning: "Дорогой (по цене)."
    examples:
      - "Es muy caro. — Это очень дорого."
    collocations:
      - "salir caro — обойтись дорого"
    trap: "«Дорогой друг» — querido amigo, а не caro."

  - es: barato/a
    meaning: "Дешёвый."
    examples:
      - "Es una camiseta barata. — Это дешёвая футболка."
    collocations:
      - "lo barato sale caro — скупой платит дважды"
    trap: "Lo barato sale caro — пословица «дешёвое обходится дорого»."

  - es: el precio
    pron: "c перед i — как th: «прэ́θьо»."
    meaning: "Цена."
    examples:
      - "¿Cuál es el precio? — Какая цена?"
    collocations:
      - "a buen precio — по хорошей цене"
    trap: "Не путайте с premio «приз»."

  - es: el céntimo
    pron: "c перед e — как th: «θэ́нтимо»."
    meaning: "Цент — сотая часть евро."
    examples:
      - "Cuesta dos euros y cincuenta céntimos. — Стоит два евро пятьдесят центов."
    collocations:
      - "sin un céntimo — без гроша"
    trap: "Знак ударения: céntimo."

  - es: mil
    meaning: "Тысяча. Не меняется: dos mil."
    examples:
      - "Cuesta mil euros. — Стоит тысячу евро."
    collocations:
      - "mil gracias — огромное спасибо"
    trap: "Без un: mil, а не un mil. И dos mil, а не dos miles."

  - es: probarse
    meaning: "Примерять (одежду). o → ue: me pruebo."
    examples:
      - "¿Puedo probarme esta camisa? — Можно примерить эту рубашку?"
    collocations:
      - "probar — пробовать (еду)"
    trap: "С se — примерить, без se — попробовать: pruebo la paella."

  - es: el probador
    meaning: "Примерочная."
    examples:
      - "¿Dónde está el probador? — Где примерочная?"
    collocations:
      - "los probadores — примерочные"
    trap: "От probarse «примерять»."

  - es: claro
    meaning: "Конечно; ещё — светлый, ясный."
    examples:
      - "¿Puedo probarme esto? Claro. — Можно примерить? Конечно."
    collocations:
      - "¡claro que sí! — конечно!"
      - "azul claro — голубой"
    trap: "Claro — и «конечно», и «светлый» о цвете."

  - es: me queda bien / me queda grande
    pron: "qu — «к»: «мэ кэ́да»."
    meaning: "Сидит хорошо / мне велико — об одежде."
    examples:
      - "Esta camisa me queda bien. — Эта рубашка мне хорошо сидит."
      - "Este jersey me queda grande. — Этот свитер мне велик."
    collocations:
      - "me queda pequeño — мне мало"
    trap: "О нескольких — quedan: me quedan grandes."

  - es: me lo llevo / me la llevo
    pron: "ll — как «й»: «мэ ло йэ́бо»."
    meaning: "Беру (это) — решение купить. lo — о слове мужского рода, la — женского."
    examples:
      - "Me la llevo. — Беру её (футболку)."
    collocations:
      - "me los llevo — беру их"
    trap: "Род — по вещи: el jersey → me lo llevo, la falda → me la llevo."

  - es: pagar
    meaning: "Платить."
    examples:
      - "¿Puedo pagar con tarjeta? — Можно заплатить картой?"
    collocations:
      - "pagar en efectivo — платить наличными"
    trap: "Платить за что-то — без por: pago la camiseta."

  - es: la tarjeta
    pron: "j — «х»: «тархэ́та»."
    meaning: "Карта (банковская); открытка, визитка."
    examples:
      - "Pago con tarjeta. — Я плачу картой."
    collocations:
      - "la tarjeta de crédito — кредитная карта"
    trap: "Карта города — el mapa, а tarjeta — пластиковая."
