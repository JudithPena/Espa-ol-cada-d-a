# Тема 20 «Здоровье». Правила — docs/repaso_guide.md.
words:
  - es: el cuerpo
    pron: "cu — «ку», ue — одним слогом: «куэ́рпо»."
    meaning: "Тело."
    examples:
      - "Me lavo el cuerpo. — Я мою тело."
    collocations:
      - "las partes del cuerpo — части тела"
    trap: "Не путайте с cuero «кожа (материал)»."

  - es: la cabeza
    pron: "z — как th: «кабэ́θа»."
    meaning: "Голова."
    examples:
      - "La cabeza, el brazo, la pierna. — Голова, рука, нога."
    collocations:
      - "el dolor de cabeza — головная боль"
    trap: "«Голова болит» — me duele la cabeza, а не mi cabeza duele."

  - es: el brazo
    pron: "z — как th: «бра́θо»."
    meaning: "Рука — вся, от плеча."
    examples:
      - "Tiene los brazos largos. — У него длинные руки."
    collocations:
      - "con los brazos abiertos — с распростёртыми объятиями"
    trap: "Кисть — la mano, вся рука — el brazo."

  - es: la mano
    meaning: "Кисть руки, рука. Женского рода, хотя на -o."
    examples:
      - "Me lavo las manos. — Я мою руки."
    collocations:
      - "a mano — вручную"
    trap: "la mano — исключение: на -o, но женского рода."

  - es: la pierna
    pron: "ie — одним слогом: «пьэ́рна»."
    meaning: "Нога — от бедра до щиколотки."
    examples:
      - "Tiene las piernas largas. — У неё длинные ноги."
    collocations:
      - "las piernas largas — длинные ноги"
    trap: "Ступня — el pie, а pierna — вся нога."

  - es: el pie
    pron: "ie — одним слогом: «пьэ»."
    meaning: "Ступня, нога ниже щиколотки."
    examples:
      - "Voy a pie. — Я иду пешком."
    collocations:
      - "a pie — пешком"
    trap: "Пешком — a pie, буквально «на ногах»."

  - es: la espalda
    meaning: "Спина."
    examples:
      - "Tengo la espalda cansada. — У меня устала спина."
    collocations:
      - "dar la espalda — повернуться спиной"
    trap: "Не путайте с espada «меч»."

  - es: el estómago
    pron: "Ударение на to: «эсто́маго»."
    meaning: "Желудок, живот."
    examples:
      - "No como mucho: tengo el estómago pequeño. — Я ем немного: у меня маленький желудок."
    collocations:
      - "el dolor de estómago — боль в животе"
    trap: "Знак ударения: estómago."

  - es: doler
    meaning: "Болеть — устроен как gustar: me duele la cabeza, me duelen los pies. o → ue."
    examples:
      - "Me duele la cabeza. — У меня болит голова."
      - "Me duelen los pies. — У меня болят ноги."
    collocations:
      - "el dolor — боль"
    trap: "Как gustar: болит одно — duele, несколько — duelen."

  - es: "¿Qué te duele?"
    pron: "ue — одним слогом: «дуэ́лэ»."
    meaning: "Что у тебя болит?"
    examples:
      - "¿Qué te duele? Me duele la espalda. — Что у тебя болит? Спина."
    collocations:
      - "¿qué le duele? — что у вас болит?"
    trap: "Вежливо — ¿Qué le duele?"

  - es: la garganta
    meaning: "Горло."
    examples:
      - "Me duele la garganta. — У меня болит горло."
    collocations:
      - "el dolor de garganta — боль в горле"
    trap: "Женского рода: la garganta."

  - es: la muela
    pron: "ue — одним слогом: «муэ́ла»."
    meaning: "Коренной зуб."
    examples:
      - "Me duelen las muelas. — У меня болят зубы."
    collocations:
      - "la muela del juicio — зуб мудрости"
    trap: "Передний зуб — el diente, коренной — la muela."

  - es: tener hambre
    pron: "h не читается: «а́мбрэ»."
    meaning: "Хотеть есть, быть голодным."
    examples:
      - "Tengo mucha hambre. — Я очень голоден."
    collocations:
      - "tener un hambre de lobo — быть голодным как волк"
    trap: "hambre — женского рода, поэтому mucha hambre (хотя el hambre)."

  - es: tener sed
    meaning: "Хотеть пить."
    examples:
      - "Tengo sed. ¿Hay agua? — Хочу пить. Есть вода?"
    collocations:
      - "mucha sed — сильная жажда"
    trap: "С tener: tengo sed, а не estoy sed."

  - es: tener sueño
    pron: "ue — «уэ», ñ — «нь»: «суэ́ньо»."
    meaning: "Хотеть спать."
    examples:
      - "Tengo mucho sueño. — Я очень хочу спать."
    collocations:
      - "el sueño — сон; мечта"
    trap: "sueño — и «сон», и «мечта»."

  - es: tener frío / tener calor
    meaning: "Мёрзнуть / быть жарко — о человеке."
    examples:
      - "Tengo frío. — Мне холодно."
      - "¿Tienes calor? — Тебе жарко?"
    collocations:
      - "hace frío — холодно (о погоде)"
    trap: "Человеку — tengo frío, погоде — hace frío."

  - es: tener fiebre
    pron: "ie — одним слогом: «фьэ́брэ»."
    meaning: "Температурить, иметь жар."
    examples:
      - "Mi hijo tiene fiebre. — У моего сына температура."
    collocations:
      - "fiebre alta — высокая температура"
    trap: "Температура в градусах — la temperatura, жар — la fiebre."

  - es: tener miedo
    pron: "ie — одним слогом: «мьэ́до»."
    meaning: "Бояться."
    examples:
      - "Tengo miedo de los perros. — Я боюсь собак."
    collocations:
      - "dar miedo — пугать"
    trap: "Чего боятся — de: miedo de los perros."

  - es: el resfriado
    meaning: "Простуда."
    examples:
      - "Tengo un resfriado. — У меня простуда."
    collocations:
      - "estar resfriado — быть простуженным"
    trap: "Грипп — la gripe."

  - es: el niño / la niña
    pron: "ñ — «нь»: «ни́ньо»."
    meaning: "Ребёнок; мальчик / девочка."
    examples:
      - "El niño tiene fiebre. — У ребёнка температура."
    collocations:
      - "los niños — дети"
    trap: "Дети вообще — los niños, свои дети — los hijos."

  - es: "¿Qué le pasa?"
    meaning: "Что с вами? — вежливо, например у врача."
    examples:
      - "¿Qué le pasa? Me duele la garganta. — Что с вами? У меня болит горло."
    collocations:
      - "¿qué te pasa? — что с тобой?"
    trap: "Вежливо — le, на «ты» — te."

  - es: "¿Desde cuándo?"
    meaning: "С каких пор? С какого времени?"
    examples:
      - "¿Desde cuándo tiene fiebre? Desde el lunes. — С каких пор у вас температура? С понедельника."
    collocations:
      - "desde hace dos días — уже два дня"
    trap: "«Уже два дня» — desde hace dos días."

  - es: la pastilla
    pron: "ll — как «й»: «пасти́йя»."
    meaning: "Таблетка."
    examples:
      - "Tome una pastilla. — Примите таблетку."
    collocations:
      - "una pastilla para el dolor — таблетка от боли"
    trap: "От чего — para: pastilla para la cabeza."

  - es: tome
    meaning: "Примите — вежливая просьба (врач — пациенту)."
    examples:
      - "Tome una pastilla. — Примите таблетку."
    collocations:
      - "toma — возьми, держи (на «ты»)"
    trap: "Toma! — «На, держи!» на «ты»."

  - es: la receta
    pron: "c перед e — как th: «рэθэ́та»."
    meaning: "Рецепт — и от врача, и кулинарный."
    examples:
      - "El médico escribe una receta. — Врач выписывает рецепт."
    collocations:
      - "con receta — по рецепту"
    trap: "receta — и для лекарства, и для блюда."

  - es: "¡Que te mejores! / ¡Que se mejore!"
    pron: "j — «х»: «мэхо́рэс»."
    meaning: "Выздоравливай! / Выздоравливайте!"
    examples:
      - "Tengo un resfriado. ¡Que te mejores! — У меня простуда. Выздоравливай!"
    collocations:
      - "mejorar — улучшать(ся)"
    trap: "После que — subjuntivo: que te mejores, а не que te mejoras."
