# Тема 22 «Pretérito perfecto». Правила — docs/repaso_guide.md.
words:
  - es: haber
    pron: "h не читается, b — мягкое: «абэ́р»."
    meaning: "Вспомогательный глагол для прошедшего времени: he, has, ha + причастие: he comido — «я поел»."
    examples:
      - "He comido. — Я поел."
      - "¿Has visto la película? — Ты видел фильм?"
    collocations:
      - "hay — есть (форма haber)"
    trap: "«Иметь» в обычном смысле — tener; haber только помогает строить время."

  - es: esta mañana
    meaning: "Сегодня утром."
    examples:
      - "Esta mañana he desayunado tarde. — Сегодня утром я поздно позавтракал."
    collocations:
      - "esta tarde — сегодня днём"
    trap: "С esta mañana, hoy, esta semana в Испании — pretérito perfecto: he comido."

  - es: esta semana
    meaning: "На этой неделе."
    examples:
      - "Esta semana he trabajado mucho. — На этой неделе я много работал."
    collocations:
      - "este mes — в этом месяце"
    trap: "«На этой неделе» — без предлога: esta semana."

  - es: ya
    pron: "y — как «й»: «йа»."
    meaning: "Уже."
    examples:
      - "Ya he comido. — Я уже поел."
    collocations:
      - "ya está — готово"
    trap: "Ya — ещё и «ну да, понятно» в разговоре."

  - es: todavía no
    pron: "v — как b, ударение на í: «тодаби́а»."
    meaning: "Ещё не."
    examples:
      - "Todavía no he comido. — Я ещё не ел."
    collocations:
      - "todavía — ещё, всё ещё"
    trap: "Можно и в конце: No he comido todavía."

  - es: alguna vez
    meaning: "Когда-нибудь — в вопросах об опыте."
    examples:
      - "¿Has estado alguna vez en España? — Ты когда-нибудь был в Испании?"
    collocations:
      - "nunca — никогда (ответ)"
    trap: "Ответ «никогда» — nunca: No he estado nunca."

  - es: una vez / muchas veces
    pron: "v — как b, z/c — как th."
    meaning: "Один раз / много раз."
    examples:
      - "He estado en Madrid una vez. — Я был в Мадриде один раз."
      - "He visto la película muchas veces. — Я много раз видел этот фильм."
    collocations:
      - "dos veces — два раза"
    trap: "Во множественном z → c: vez — veces."

  - es: probar
    meaning: "Пробовать. o → ue: pruebo."
    examples:
      - "¿Has probado la paella? — Ты пробовал паэлью?"
    collocations:
      - "probarse — примерять"
    trap: "Попробовать еду — probar, примерить одежду — probarse."

  - es: el mar
    meaning: "Море."
    examples:
      - "Me gusta el mar. — Я люблю море."
    collocations:
      - "el mar Mediterráneo — Средиземное море"
    trap: "Рыбаки и поэты говорят la mar — это не ошибка, а традиция."

  - es: primer
    meaning: "Первый — перед существительным мужского рода."
    examples:
      - "mi primer año — мой первый год"
      - "el primer día — первый день"
    collocations:
      - "el primer piso — второй этаж"
    trap: "Перед мужским существительным — primer, перед женским — primera: la primera vez."

  - es: entender
    meaning: "Понимать. e → ie: entiendo."
    examples:
      - "Ya entiendo mucho. — Я уже многое понимаю."
    collocations:
      - "no entiendo — не понимаю"
    trap: "e меняется на ie: entiendo."
