# Тема 4 «Числа и возраст». Правила — docs/repaso_guide.md.
words:
  - es: cero
    pron: "c перед e в Испании — как th в think: «θэ́ро»."
    meaning: "Ноль."
    examples:
      - "Cero, uno, dos. — Ноль, один, два."
    collocations:
      - "empezar de cero — начать с нуля"
    trap: "c перед e — не «ц» и не «к»: «θэро» (в Латинской Америке — «сэро» 🌎)."

  - es: uno
    meaning: "Один. Перед существительным мужского рода — un: un café; женского — una: una casa."
    examples:
      - "Uno, dos, tres. — Один, два, три."
      - "Un café, por favor. — Один кофе, пожалуйста."
    collocations:
      - "uno a uno — по одному"
    trap: "Перед существительным uno сокращается: un perro, а не uno perro."

  - es: dos
    meaning: "Два."
    examples:
      - "Dos, tres, cuatro. — Два, три, четыре."
      - "Uno, dos, tres. — Один, два, три."
    collocations:
      - "los dos — оба"
    trap: "«Оба» — los dos (о мужчинах или смешанной паре) и las dos (о женщинах)."

  - es: tres
    meaning: "Три."
    examples:
      - "Uno, dos, tres. — Один, два, три."
      - "Tres, por favor. — Три, пожалуйста."
    collocations:
      - "a las tres — в три часа"
    trap: "r после t — короткий удар языка, не раскатистое rr."

  - es: cuatro
    pron: "cu — «ку»: «куа́тро»."
    meaning: "Четыре."
    examples:
      - "Tres, cuatro, cinco. — Три, четыре, пять."
    collocations:
      - "cuatro por cuatro — внедорожник (4×4)"
    trap: "Не путайте с cuarto — «четвёртый; четверть; комната»."

  - es: cinco
    pron: "c перед i — как th в think, вторая c — «к»: «θи́нко»."
    meaning: "Пять."
    examples:
      - "Cuatro, cinco. — Четыре, пять."
      - "Cinco, por favor. — Пять, пожалуйста."
    collocations:
      - "cinco estrellas — пять звёзд"
    trap: "Две c читаются по-разному: перед i — [θ], перед o — «к»."

  - es: seis
    pron: "ei — одним слогом: «сэйс»."
    meaning: "Шесть."
    examples:
      - "Cinco, seis, siete. — Пять, шесть, семь."
    collocations:
      - "a las seis — в шесть часов"
    trap: "Не «сэис» в два слога: ei сливается в «эй»."

  - es: siete
    pron: "ie — одним слогом: «сьэ́тэ»."
    meaning: "Семь."
    examples:
      - "Seis, siete, ocho. — Шесть, семь, восемь."
    collocations:
      - "siete días — семь дней"
    trap: "Не путайте siete (7) и sesenta (60)."

  - es: ocho
    pron: "ch — «ч»: «о́чо»."
    meaning: "Восемь."
    examples:
      - "Siete, ocho, nueve. — Семь, восемь, девять."
    collocations:
      - "a las ocho — в восемь часов"
    trap: "Не путайте ocho (8) и ochenta (80)."

  - es: nueve
    pron: "ue — одним слогом, v — как b: «нуэ́бэ»."
    meaning: "Девять."
    examples:
      - "Ocho, nueve, diez. — Восемь, девять, десять."
    collocations:
      - "a las nueve — в девять часов"
    trap: "nueve (девять) похоже на nuevo «новый» — следите за окончанием."

  - es: diez
    pron: "ie — одним слогом, z — как th в think: «дьэθ»."
    meaning: "Десять."
    examples:
      - "Nueve, diez. — Девять, десять."
    collocations:
      - "las diez — десять часов"
    trap: "Во множественном z меняется на c: los dieces (о десятках, оценках)."

  - es: "¿Cuántos años tienes?"
    pron: "ñ — «нь»: «а́ньос». cu — «ку»."
    meaning: "Сколько тебе лет? Буквально «сколько лет ты имеешь?»."
    examples:
      - "¿Cuántos años tienes? Tengo diez años. — Сколько тебе лет? Мне десять."
    collocations:
      - "tengo … años — мне … лет"
    trap: "Возраст — с tener: Tengo 20 años, а не Soy 20 años. И не забудьте тильду: años (годы), а не anos!"

  - es: el año
    pron: "ñ — «нь»: «а́ньо»."
    meaning: "Год."
    examples:
      - "Tengo diez años. — Мне десять лет."
    collocations:
      - "el año pasado — в прошлом году"
      - "¡feliz año nuevo! — с Новым годом!"
    trap: "Без тильды ano — совсем другое, неприличное слово. Пишите año."

  - es: tener
    meaning: "Иметь. Формы: tengo, tienes, tiene. С этим глаголом говорят и о возрасте."
    examples:
      - "Tengo diez años. — Мне десять лет."
      - "¿Tienes café? — У тебя есть кофе?"
    collocations:
      - "tener … años — быть … лет"
      - "tener que — быть должным"
    trap: "Форма «я» — tengo, с g. Возраст, голод, жажда — с tener: tengo hambre."

  - es: once
    pron: "c перед e — как th в think: «о́нθэ»."
    meaning: "Одиннадцать."
    examples:
      - "Diez, once, doce. — Десять, одиннадцать, двенадцать."
    collocations:
      - "a las once — в одиннадцать"
    trap: "Не путайте с английским once «однажды»: здесь это число 11."

  - es: doce
    pron: "c перед e — как th в think: «до́θэ»."
    meaning: "Двенадцать."
    examples:
      - "Once, doce, trece. — Одиннадцать, двенадцать, тринадцать."
    collocations:
      - "las doce uvas — двенадцать виноградин в Новый год"
    trap: "В Испании в Новый год под каждый из двенадцати ударов часов съедают по виноградине."

  - es: trece
    pron: "c перед e — как th в think: «трэ́θэ»."
    meaning: "Тринадцать."
    examples:
      - "Doce, trece, catorce. — Двенадцать, тринадцать, четырнадцать."
    collocations:
      - "martes y trece — испанская «пятница, 13»"
    trap: "В Испании несчастливый день — не пятница, а вторник, 13-е."

  - es: catorce
    pron: "c перед e — как th: «като́рθэ»."
    meaning: "Четырнадцать."
    examples:
      - "Trece, catorce, quince. — Тринадцать, четырнадцать, пятнадцать."
    collocations:
      - "el catorce de febrero — 14 февраля"
    trap: "Не путайте с cuarenta (40)."

  - es: quince
    pron: "qu — «к», c перед e — как th: «ки́нθэ»."
    meaning: "Пятнадцать."
    examples:
      - "Catorce, quince. — Четырнадцать, пятнадцать."
    collocations:
      - "quince días — две недели (так говорят в Испании)"
    trap: "quince días — не только «15 дней», но и обычное «две недели»."

  - es: veinte
    pron: "v — как b, ei — одним слогом: «бэ́йнтэ»."
    meaning: "Двадцать."
    examples:
      - "Tengo veinte años. — Мне двадцать лет."
    collocations:
      - "veintiuno — двадцать один (пишется слитно)"
    trap: "21–29 пишутся одним словом: veintidós, veintitrés."

  - es: dieciséis
    pron: "Ударение на последнем слоге: «дьэθисэ́йс»."
    meaning: "Шестнадцать — буквально «десять и шесть»."
    examples:
      - "Tengo dieciséis años. — Мне шестнадцать лет."
    collocations:
      - "dieci + число — от 16 до 19"
    trap: "Пишется слитно и со знаком ударения: dieciséis."

  - es: diecisiete
    meaning: "Семнадцать — «десять и семь»."
    examples:
      - "Dieciséis, diecisiete. — Шестнадцать, семнадцать."
    collocations:
      - "diecisiete años — семнадцать лет"
    trap: "Слитно: diecisiete, а не diez y siete."

  - es: dieciocho
    meaning: "Восемнадцать — «десять и восемь». С восемнадцати лет в Испании совершеннолетие."
    examples:
      - "Tengo dieciocho años. — Мне восемнадцать лет."
    collocations:
      - "mayor de dieciocho — старше восемнадцати"
    trap: "Слитно: dieciocho."

  - es: diecinueve
    pron: "ue — одним слогом, v — как b."
    meaning: "Девятнадцать — «десять и девять»."
    examples:
      - "Dieciocho, diecinueve, veinte. — Восемнадцать, девятнадцать, двадцать."
    collocations:
      - "diecinueve años — девятнадцать лет"
    trap: "Слитно: diecinueve."

  - es: el número
    pron: "Ударение на первом слоге: «ну́мэро»."
    meaning: "Номер; число."
    examples:
      - "¿Cuál es tu número? — Какой у тебя номер?"
      - "Mi número es el cinco. — Мой номер — пятый."
    collocations:
      - "el número de teléfono — номер телефона"
    trap: "Знак ударения: número. Без него numero — «нумерую»."

  - es: el teléfono
    pron: "Ударение на втором слоге: «тэлэ́фоно»."
    meaning: "Телефон. Мобильный в Испании — el móvil."
    examples:
      - "¿Cuál es tu teléfono? — Какой у тебя телефон?"
      - "Mi teléfono es el seis, dos, tres… — Мой телефон: шесть, два, три…"
    collocations:
      - "el número de teléfono — номер телефона"
      - "el móvil — мобильный (в Испании)"
    trap: "В Испании мобильный — el móvil, в Латинской Америке — el celular 🌎."

  - es: mi
    meaning: "Мой, моя — перед существительным. Во множественном — mis."
    examples:
      - "Mi número es el cinco. — Мой номер — пятый."
      - "Es mi teléfono. — Это мой телефон."
    collocations:
      - "mis amigos — мои друзья"
    trap: "mi (мой) без знака, mí (меня, мне) со знаком: para mí — «для меня»."

  - es: tu
    meaning: "Твой, твоя — перед существительным. Во множественном — tus."
    examples:
      - "¿Cuál es tu teléfono? — Какой у тебя телефон?"
      - "¿Es tu número? — Это твой номер?"
    collocations:
      - "tus amigos — твои друзья"
    trap: "tu (твой) без знака, tú (ты) со знаком."

  - es: su
    meaning: "Его, её; ваш (при usted); их. Во множественном — sus."
    examples:
      - "¿Cuál es su teléfono? — Какой у вас (у него) телефон?"
      - "Es su número. — Это его номер."
    collocations:
      - "sus amigos — его / её / ваши друзья"
    trap: "su многозначно: если непонятно, чьё, говорят el número de él — «его номер»."

  - es: "¿Cuál es...?"
    pron: "cu — «ку»: «куа́ль эс»."
    meaning: "Какой …? — когда выбираем из многих: номер, адрес, имя."
    examples:
      - "¿Cuál es tu número? — Какой у тебя номер?"
      - "¿Cuál es su teléfono? — Какой у вас телефон?"
    collocations:
      - "¿cuál es tu nombre? — как твоё имя?"
    trap: "Перед es — cuál, а не qué: ¿Cuál es tu número?, а не ¿Qué es tu número?"
