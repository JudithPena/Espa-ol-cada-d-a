# Тема 5 «Страны и языки». Правила — docs/repaso_guide.md.
words:
  - es: "¿De dónde eres?"
    meaning: "Откуда ты? — на «ты». На «вы» — ¿De dónde es usted?"
    examples:
      - "¿De dónde eres, Iván? — Откуда ты, Иван?"
      - "¿De dónde eres? Soy de España. — Откуда ты? Я из Испании."
    collocations:
      - "¿de dónde es usted? — откуда вы?"
    trap: "de стоит в начале вопроса: ¿De dónde eres?, а не ¿Dónde eres de?"

  - es: soy de...
    meaning: "Я из … — о стране или городе, откуда вы родом."
    examples:
      - "Soy de España. — Я из Испании."
      - "Soy de Madrid. — Я из Мадрида."
    collocations:
      - "soy de aquí — я местный"
    trap: "Откуда вы — с ser: Soy de Ucrania. Где вы сейчас — с estar: Estoy en España."

  - es: Ucrania
    pron: "Ударение на ra: «укра́нья»."
    meaning: "Украина."
    examples:
      - "Soy de Ucrania. — Я из Украины."
      - "¿De dónde eres? De Ucrania. — Откуда ты? Из Украины."
    collocations:
      - "Kiev, Ucrania — Киев, Украина"
    trap: "Без артикля: Soy de Ucrania, а не de la Ucrania."

  - es: México
    pron: "x здесь читается как j — хриплое «х»: «мэ́хико»."
    meaning: "Мексика."
    examples:
      - "Soy de México. — Я из Мексики."
    collocations:
      - "Ciudad de México — Мехико"
    trap: "Пишется с x по старой традиции, а читается «мэхико»."

  - es: Argentina
    pron: "g перед e — хриплое «х»: «архэнти́на»."
    meaning: "Аргентина."
    examples:
      - "Soy de Argentina. — Я из Аргентины."
    collocations:
      - "Buenos Aires, Argentina — Буэнос-Айрес"
    trap: "g перед e и i читается как «х»: «архентина», а не «аргентина»."

  - es: Colombia
    pron: "ia — одним слогом: «коло́мбья»."
    meaning: "Колумбия."
    examples:
      - "Soy de Colombia. — Я из Колумбии."
    collocations:
      - "Bogotá, Colombia — Богота"
    trap: "Пишется с o: Colombia, а не «Columbia»."

  - es: Francia
    pron: "c перед i — как th в think: «фра́нθья»."
    meaning: "Франция."
    examples:
      - "Soy de Francia. — Я из Франции."
    collocations:
      - "París, Francia — Париж"
    trap: "c перед i — не «ц»: «франθья»."

  - es: Alemania
    meaning: "Германия."
    examples:
      - "Soy de Alemania. — Я из Германии."
    collocations:
      - "Berlín, Alemania — Берлин"
    trap: "Германия по-испански — Alemania, не Germania."

  - es: Italia
    meaning: "Италия."
    examples:
      - "Soy de Italia. — Я из Италии."
    collocations:
      - "Roma, Italia — Рим"
    trap: "Ударение на ta: «ита́лья»."

  - es: Inglaterra
    pron: "rr — раскатистое: «инглатэ́рра»."
    meaning: "Англия. Великобритания — el Reino Unido."
    examples:
      - "Soy de Inglaterra. — Я из Англии."
    collocations:
      - "Londres, Inglaterra — Лондон"
    trap: "Inglaterra — только Англия; Великобритания — el Reino Unido."

  - es: Estados Unidos
    meaning: "США — буквально «Соединённые Штаты»."
    examples:
      - "Soy de Estados Unidos. — Я из США."
    collocations:
      - "EE. UU. — сокращение «США»"
    trap: "Можно и с артиклем: los Estados Unidos. Сокращение пишут EE. UU."

  - es: China
    pron: "ch — «ч»: «чи́на»."
    meaning: "Китай."
    examples:
      - "Soy de China. — Я из Китая."
    collocations:
      - "Pekín, China — Пекин"
    trap: "Не путайте с china (с маленькой буквы) — «китаянка»."

  - es: también
    pron: "Ударение на последнем слоге: «тамбье́н»."
    meaning: "Тоже, также — когда соглашаемся с утверждением."
    examples:
      - "Soy de Ucrania. Yo también. — Я из Украины. Я тоже."
      - "Soy de España. ¿Tú también? — Я из Испании. Ты тоже?"
    collocations:
      - "yo también — я тоже"
    trap: "На отрицание отвечают tampoco: No soy de aquí. — Yo tampoco («Я тоже нет»)."

  - es: ucraniano/a
    meaning: "Украинец / украинка; украинский. Национальность пишется с маленькой буквы."
    examples:
      - "Iván es ucraniano. Olga es ucraniana. — Иван украинец. Ольга украинка."
      - "Soy ucraniana. — Я украинка."
    collocations:
      - "la comida ucraniana — украинская кухня"
    trap: "С маленькой буквы: ucraniano, а не Ucraniano."

  - es: español/a
    pron: "ñ — «нь»: «эспаньо́ль»."
    meaning: "Испанец / испанка; испанский."
    examples:
      - "Pablo es español. — Пабло испанец."
      - "Ana es española. — Ана испанка."
    collocations:
      - "la tortilla española — испанская тортилья"
    trap: "Женский род — española, с a на конце (не «españolа» без ударения)."

  - es: mexicano/a
    pron: "x — как хриплое «х»: «мэхика́но»."
    meaning: "Мексиканец / мексиканка; мексиканский."
    examples:
      - "Diego es mexicano. — Диего мексиканец."
    collocations:
      - "la comida mexicana — мексиканская кухня"
    trap: "Как и México, пишется с x, а читается с «х»."

  - es: argentino/a
    pron: "g перед e — «х»: «архэнти́но»."
    meaning: "Аргентинец / аргентинка; аргентинский."
    examples:
      - "Carlos es argentino. — Карлос аргентинец."
    collocations:
      - "el tango argentino — аргентинское танго"
    trap: "С маленькой буквы, как все национальности."

  - es: colombiano/a
    meaning: "Колумбиец / колумбийка; колумбийский."
    examples:
      - "María es colombiana. — Мария колумбийка."
    collocations:
      - "el café colombiano — колумбийский кофе"
    trap: "С маленькой буквы: colombiano."

  - es: francés/a
    pron: "c перед e — как th: «франθэ́с». У женского рода знака нет: francesa."
    meaning: "Француз / француженка; французский."
    examples:
      - "Pierre es francés. — Пьер француз."
    collocations:
      - "el francés — французский язык"
    trap: "Знак ударения пропадает в женском роде: francés — francesa."

  - es: alemán/a
    meaning: "Немец / немка; немецкий."
    examples:
      - "Hugo es alemán. — Уго немец."
    collocations:
      - "el alemán — немецкий язык"
    trap: "Женский род без знака: alemana."

  - es: inglés/a
    meaning: "Англичанин / англичанка; английский."
    examples:
      - "Es inglés. — Он англичанин."
    collocations:
      - "el inglés — английский язык"
    trap: "Женский род без знака: inglesa."

  - es: italiano/a
    meaning: "Итальянец / итальянка; итальянский."
    examples:
      - "Marco es italiano. — Марко итальянец."
    collocations:
      - "la comida italiana — итальянская кухня"
    trap: "С маленькой буквы: italiano."

  - es: americano/a
    meaning: "Американец / американка. В Латинской Америке americano — житель всей Америки, а о США чаще говорят estadounidense."
    examples:
      - "Es americano. — Он американец."
    collocations:
      - "un café americano — американо (кофе)"
    trap: "Точнее о жителе США — estadounidense 🌎."

  - es: chino/a
    pron: "ch — «ч»."
    meaning: "Китаец / китаянка; китайский."
    examples:
      - "Li es chino. — Ли китаец."
    collocations:
      - "el chino — китайский язык"
    trap: "Me suena a chino — «для меня это китайская грамота»."

  - es: hablar
    pron: "h не читается: «абла́р»."
    meaning: "Говорить, разговаривать. Формы: hablo, hablas, habla."
    examples:
      - "Hablo español. — Я говорю по-испански."
      - "¿Hablas inglés? — Ты говоришь по-английски?"
    collocations:
      - "hablar con alguien — говорить с кем-то"
    trap: "Знать язык — без предлога: Hablo español. Hablar en español — «говорить на испанском» сейчас, в разговоре."

  - es: el español
    meaning: "Испанский язык. Его ещё называют castellano — «кастильский»."
    examples:
      - "Hablo un poco de español. — Я немного говорю по-испански."
    collocations:
      - "el castellano — испанский (кастильский) язык"
    trap: "Языки пишут с маленькой буквы: el español."

  - es: el ucraniano
    meaning: "Украинский язык."
    examples:
      - "Hablo ucraniano y español. — Я говорю по-украински и по-испански."
    collocations:
      - "en ucraniano — на украинском"
    trap: "С маленькой буквы и мужского рода: el ucraniano."

  - es: el inglés
    meaning: "Английский язык."
    examples:
      - "Hablo inglés, pero no hablo francés. — Я говорю по-английски, но не по-французски."
    collocations:
      - "en inglés — по-английски"
    trap: "С маленькой буквы: el inglés."

  - es: un poco
    meaning: "Немного. «Немного испанского» — un poco de español."
    examples:
      - "Hablo un poco de español. — Я немного говорю по-испански."
      - "Un poco, gracias. — Немного, спасибо."
    collocations:
      - "un poco de… — немного (чего-то)"
    trap: "Перед существительным нужен de: un poco de español."

  - es: pero
    pron: "Одна r — короткий удар: «пэ́ро». С rr (perro) — «собака»!"
    meaning: "Но."
    examples:
      - "Hablo inglés, pero no hablo francés. — Я говорю по-английски, но не по-французски."
    collocations:
      - "pero bueno — ну ладно"
    trap: "pero (но) и perro (собака) различаются только r — rr."

  - es: e
    meaning: "И — вместо y перед словами на i- и hi-, чтобы два «и» не слились."
    examples:
      - "Hablo español e inglés. — Я говорю по-испански и по-английски."
    collocations:
      - "padre e hijo — отец и сын"
    trap: "Только перед звуком «и»: español e inglés, но España y Francia."

  - es: "¿Dónde vives?"
    pron: "v — как b: «би́бэс»."
    meaning: "Где ты живёшь?"
    examples:
      - "¿Dónde vives? Vivo en Madrid. — Где ты живёшь? Я живу в Мадриде."
    collocations:
      - "¿dónde vive usted? — где вы живёте?"
    trap: "dónde со знаком — вопрос «где?»; donde без знака — «где» в утверждении."

  - es: vivir
    pron: "Обе v — как b: «биби́р»."
    meaning: "Жить. Формы: vivo, vives, vive."
    examples:
      - "Vivo en Madrid. — Я живу в Мадриде."
      - "¿Dónde vives? — Где ты живёшь?"
    collocations:
      - "vivir en… — жить в…"
    trap: "Где живут — en: vivo en España, а не vivo a España."

  - es: en
    meaning: "В, на — о месте: en Madrid, en casa."
    examples:
      - "Vivo en Madrid. — Я живу в Мадриде."
      - "Vivo en España. — Я живу в Испании."
    collocations:
      - "en casa — дома"
      - "en el hotel — в гостинице"
    trap: "Куда идут — a, а не en: Voy a Madrid. Где находятся — en: Estoy en Madrid."

  - es: el amigo / la amiga
    meaning: "Друг / подруга."
    examples:
      - "Es mi amigo Pablo. — Это мой друг Пабло."
      - "Mi amiga vive en Madrid. — Моя подруга живёт в Мадриде."
    collocations:
      - "un buen amigo — хороший друг"
    trap: "mi amiga — и «моя подруга», и «моя знакомая»: по-испански дружба часто шире, чем в русском."
