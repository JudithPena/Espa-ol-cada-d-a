# Тема 14 «Хобби». Правила — docs/repaso_guide.md.
words:
  - es: el tiempo libre
    pron: "ie — одним слогом: «тьэ́мпо»."
    meaning: "Свободное время."
    examples:
      - "En mi tiempo libre veo la tele. — В свободное время я смотрю телевизор."
    collocations:
      - "¿qué haces en tu tiempo libre? — что ты делаешь в свободное время?"
    trap: "tiempo — и «время», и «погода»: Hace buen tiempo — «Хорошая погода»."

  - es: bailar
    pron: "ai — одним слогом: «байла́р»."
    meaning: "Танцевать."
    examples:
      - "Ana baila muy bien. — Ана очень хорошо танцует."
    collocations:
      - "bailar flamenco — танцевать фламенко"
    trap: "Не путайте с bajar «спускаться»."

  - es: cantar
    meaning: "Петь."
    examples:
      - "Mi hermana canta muy bien. — Моя сестра очень хорошо поёт."
    collocations:
      - "cantar una canción — спеть песню"
    trap: "Песня — la canción, певец — el cantante."

  - es: viajar
    pron: "v — как b, j — «х»: «бьяха́р»."
    meaning: "Путешествовать, ездить."
    examples:
      - "Viajo mucho en tren. — Я много езжу на поезде."
    collocations:
      - "viajar en tren — ездить на поезде"
    trap: "Путешествие — el viaje: ¡Buen viaje! — «Счастливого пути!»."

  - es: nadar
    meaning: "Плавать."
    examples:
      - "Nado mucho. — Я много плаваю."
    collocations:
      - "nadar en la piscina — плавать в бассейне"
    trap: "Не путайте с nada «ничего»."

  - es: correr
    pron: "rr — раскатистое: «коррэ́р»."
    meaning: "Бегать; бежать."
    examples:
      - "Corro en el parque. — Я бегаю в парке."
    collocations:
      - "salir a correr — выйти на пробежку"
    trap: "Почта — Correos, а не «бег»."

  - es: ver
    pron: "v — как b: «бэр»."
    meaning: "Смотреть, видеть. Форма «я» — veo."
    examples:
      - "Veo la tele. — Я смотрю телевизор."
      - "¿Ves el museo? — Ты видишь музей?"
    collocations:
      - "ver una película — смотреть фильм"
      - "¡nos vemos! — увидимся!"
    trap: "Форма «я» — veo, с e: veo la tele."

  - es: gustar
    meaning: "Нравиться. Устроен наоборот: me gusta el café — «мне нравится кофе» (кофе — подлежащее)."
    examples:
      - "Me gusta el café. — Мне нравится кофе."
      - "Me gustan los perros. — Мне нравятся собаки."
    collocations:
      - "gustar mucho — очень нравиться"
    trap: "Если нравится несколько вещей — gustan: me gustan los gatos."

  - es: me gusta
    meaning: "Мне нравится — об одной вещи или действии."
    examples:
      - "Me gusta el café. — Мне нравится кофе."
      - "Me gusta bailar. — Я люблю танцевать."
    collocations:
      - "me gustan + мн. ч. — мне нравятся"
    trap: "Не Yo gusto el café: только Me gusta el café."

  - es: "¿Te gusta...?"
    meaning: "Тебе нравится …? Ты любишь …?"
    examples:
      - "¿Te gusta bailar? — Ты любишь танцевать?"
      - "¿Te gusta la paella? — Тебе нравится паэлья?"
    collocations:
      - "¿te gustan…? — тебе нравятся…?"
    trap: "С артиклем: ¿Te gusta el fútbol?, а не ¿Te gusta fútbol?"

  - es: le gusta
    meaning: "Ему, ей, вам (usted) нравится."
    examples:
      - "A Pablo le gusta cocinar. — Пабло любит готовить."
    collocations:
      - "a ella le gusta — ей нравится"
    trap: "С именем — a + имя: A Ana le gusta, а не Ana le gusta."

  - es: nos / os / les gusta
    meaning: "Нам / вам / им нравится."
    examples:
      - "Nos gusta viajar. — Нам нравится путешествовать."
      - "¿Os gusta el cine? — Вам нравится кино?"
    collocations:
      - "a nosotros nos gusta — нам нравится"
    trap: "Глагол по-прежнему зависит от того, что нравится: nos gustan los perros."

  - es: el deporte
    meaning: "Спорт."
    examples:
      - "Me gusta el deporte. — Я люблю спорт."
    collocations:
      - "hacer deporte — заниматься спортом"
    trap: "Заниматься спортом — hacer deporte, а не practicar deporte (тоже можно, но реже)."

  - es: el fútbol
    pron: "Ударение на первом слоге: «фу́тболь»."
    meaning: "Футбол."
    examples:
      - "Me gusta el fútbol. — Мне нравится футбол."
    collocations:
      - "el partido de fútbol — футбольный матч"
    trap: "Играть в — jugar al: juego al fútbol."

  - es: el baloncesto
    pron: "c перед e — как th: «балонθэ́сто»."
    meaning: "Баскетбол — буквально «мяч-корзина»."
    examples:
      - "Me gusta el baloncesto. — Мне нравится баскетбол."
    collocations:
      - "jugar al baloncesto — играть в баскетбол"
    trap: "В Латинской Америке — el básquetbol 🌎."

  - es: la película
    pron: "Ударение на li: «пэли́кула»."
    meaning: "Фильм."
    examples:
      - "Me gusta ver películas. — Я люблю смотреть фильмы."
    collocations:
      - "ver una película — смотреть фильм"
    trap: "Фильм — la película, а el cine — кинотеатр."

  - es: la serie
    meaning: "Сериал."
    examples:
      - "Veo una serie española. — Я смотрю испанский сериал."
    collocations:
      - "una serie de… — ряд…"
    trap: "Женского рода: la serie."

  - es: la playa
    pron: "y — как «й»: «пла́я»."
    meaning: "Пляж; отдых на море."
    examples:
      - "Me gusta la playa. — Я люблю пляж."
    collocations:
      - "ir a la playa — поехать на море"
    trap: "На море отдыхать — ir a la playa, а не al mar."

  - es: la montaña
    pron: "ñ — «нь»: «монта́нья»."
    meaning: "Гора; горы (отдых в горах)."
    examples:
      - "¿Playa o montaña? — Море или горы?"
    collocations:
      - "ir a la montaña — поехать в горы"
    trap: "В единственном числе la montaña часто значит «горы» как место отдыха: ir a la montaña."

  - es: "¿Y a ti?"
    meaning: "А тебе? — возвращаем вопрос с gustar."
    examples:
      - "Me gusta el fútbol. ¿Y a ti? — Мне нравится футбол. А тебе?"
    collocations:
      - "¿y a usted? — а вам?"
    trap: "С gustar — ¿Y a ti?, а не ¿Y tú?"

  - es: a mí también
    meaning: "Мне тоже (нравится) — согласие с утверждением."
    examples:
      - "Me gusta el cine. A mí también. — Мне нравится кино. Мне тоже."
    collocations:
      - "yo también — я тоже (с обычными глаголами)"
    trap: "С gustar — a mí también, с другими глаголами — yo también."

  - es: tampoco
    meaning: "Тоже не — согласие с отрицанием."
    examples:
      - "No me gusta el fútbol. A mí tampoco. — Мне не нравится футбол. Мне тоже нет."
    collocations:
      - "yo tampoco — я тоже нет"
    trap: "На отрицание не отвечают también: только tampoco."

  - es: a mí sí / a mí no
    meaning: "А мне да / а мне нет — несогласие."
    examples:
      - "No me gusta bailar. A mí sí. — Я не люблю танцевать. А я люблю."
    collocations:
      - "yo sí / yo no — а я да / а я нет"
    trap: "Знак над sí обязателен: a mí sí."

  - es: me encanta
    meaning: "Мне очень нравится, обожаю — сильнее, чем me gusta."
    examples:
      - "Me encanta la paella. — Обожаю паэлью."
    collocations:
      - "me encantan — обожаю (о нескольких)"
    trap: "С encantar не говорят mucho: me encanta, а не me encanta mucho."

  - es: no... nada
    meaning: "Совсем не; ничего."
    examples:
      - "No me gusta nada. — Мне совсем не нравится."
    collocations:
      - "no hay nada — ничего нет"
    trap: "Двойное отрицание — норма: No veo nada."

  - es: hacer
    pron: "h не читается, c перед e — как th: «аθэ́р»."
    meaning: "Делать. Форма «я» — hago."
    examples:
      - "¿Qué haces? — Что ты делаешь?"
    collocations:
      - "hacer deporte — заниматься спортом"
      - "hace calor — жарко"
    trap: "Форма «я» — hago, с g."

  - es: "¿Qué te gusta hacer?"
    meaning: "Что ты любишь делать?"
    examples:
      - "¿Qué te gusta hacer? Me gusta leer. — Что ты любишь делать? Читать."
    collocations:
      - "¿qué haces en tu tiempo libre? — что ты делаешь в свободное время?"
    trap: "После gusta — инфинитив: me gusta leer."

  - es: el fin de semana
    meaning: "Выходные."
    examples:
      - "El fin de semana voy a la playa. — На выходных я еду на пляж."
    collocations:
      - "¡buen fin de semana! — хороших выходных!"
    trap: "«На выходных» — el fin de semana, без предлога."

  - es: jugar
    pron: "j — «х»: «хуга́р». u → ue: juego, juegas."
    meaning: "Играть (в игры, спорт)."
    examples:
      - "Juego al fútbol. — Я играю в футбол."
    collocations:
      - "jugar al tenis — играть в теннис"
    trap: "На инструменте — tocar, а не jugar: toco la guitarra."

  - es: buscar
    meaning: "Искать."
    examples:
      - "Busco mi móvil. — Я ищу свой телефон."
    collocations:
      - "buscar trabajo — искать работу"
    trap: "Без предлога: busco el libro, а не busco por el libro."

  - es: el intercambio
    meaning: "Обмен; языковой обмен — встреча, где говорят на двух языках по очереди."
    examples:
      - "Busco un intercambio de español. — Ищу языковой обмен по испанскому."
    collocations:
      - "intercambio de idiomas — языковой обмен"
    trap: "В Испании intercambio — популярный способ практиковать язык."

  - es: practicar
    meaning: "Практиковать, тренировать."
    examples:
      - "Quiero practicar español. — Хочу практиковать испанский."
    collocations:
      - "practicar deporte — заниматься спортом"
    trap: "Перед e пишется qu: practiqué."

  - es: difícil
    pron: "c перед i — как th, ударение на fi: «дифи́θиль»."
    meaning: "Трудный, сложный."
    examples:
      - "El español no es difícil. — Испанский не трудный."
    collocations:
      - "es difícil + инфинитив — трудно делать"
    trap: "Знак ударения: difícil. Противоположное — fácil."

  - es: la idea
    pron: "Ударение на e: «идэ́а»."
    meaning: "Идея."
    examples:
      - "¡Qué buena idea! — Какая хорошая идея!"
    collocations:
      - "no tengo ni idea — понятия не имею"
    trap: "Ni idea — «понятия не имею»."
