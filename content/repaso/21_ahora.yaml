# Тема 21 «Прямо сейчас». Правила — docs/repaso_guide.md.
words:
  - es: ahora mismo
    meaning: "Прямо сейчас."
    examples:
      - "Ahora mismo estoy comiendo. — Прямо сейчас я ем."
    collocations:
      - "voy ahora mismo — иду прямо сейчас"
    trap: "Ahora mismo voy — «уже иду», хотя иногда это «скоро»."

  - es: en este momento
    meaning: "В данный момент."
    examples:
      - "En este momento estoy trabajando. — В данный момент я работаю."
    collocations:
      - "en ese momento — в тот момент"
    trap: "Официальнее, чем ahora."

  - es: esperar
    meaning: "Ждать; надеяться."
    examples:
      - "Estoy esperando el autobús. — Я жду автобус."
      - "Espero a mi amiga. — Я жду подругу."
    collocations:
      - "espera un momento — подожди минутку"
    trap: "Человека ждут с a: espero a Ana. Ещё — «надеяться»: espero que sí."

  - es: "¿Diga?"
    meaning: "Алло? — ответ на звонок в Испании."
    examples:
      - "¿Diga? Hola, soy Ana. — Алло? Привет, это Ана."
    collocations:
      - "¿dígame? — алло? слушаю (вежливее)"
    trap: "Только в Испании; в Мексике — ¿Bueno?, в других странах — ¿Aló? 🌎."

  - es: el examen
    pron: "x — «кс»: «экса́мэн»."
    meaning: "Экзамен."
    examples:
      - "Estoy estudiando para el examen. — Я готовлюсь к экзамену."
    collocations:
      - "aprobar un examen — сдать экзамен"
    trap: "Во множественном появляется знак: exámenes."

  - es: oye
    pron: "y — как «й»: «о́йэ»."
    meaning: "Слушай — чтобы привлечь внимание (на «ты»)."
    examples:
      - "Oye, ¿qué estás haciendo? — Слушай, что ты делаешь?"
    collocations:
      - "oiga — послушайте (на «вы»)"
    trap: "От oír «слышать». На «вы» — oiga."

  - es: luego te llamo
    meaning: "Я тебе перезвоню (позже)."
    examples:
      - "Ahora no puedo, luego te llamo. — Сейчас не могу, перезвоню тебе."
    collocations:
      - "te llamo mañana — позвоню тебе завтра"
    trap: "llamar — и «звонить», и «звать»."
