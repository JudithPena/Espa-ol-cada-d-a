# Тема 0 «Старт и произношение». Правила — docs/repaso_guide.md.
words:
  - es: "¡Hola!"
    pron: "h в испанском никогда не читается: «о́ла», а не «хо́ла»."
    meaning: "Самое частое приветствие: «привет» другу и «здравствуйте» незнакомому. Подходит в любое время дня."
    examples:
      - "¡Hola, Ana! — Привет, Ана!"
      - "¡Hola, Pablo! — Привет, Пабло!"
    collocations:
      - "¡Hola! ¿Qué tal? — Привет! Как дела?"
      - "¡Hola a todos! — Всем привет!"
    trap: "В испанском восклицание пишут с двумя знаками: ¡Hola! Перевёрнутый ¡ стоит в начале."

  - es: la casa
    meaning: "Дом, жилище. En casa — «дома»."
    examples:
      - "Sí, la casa. — Да, дом."
      - "¿La casa? No, el hotel. — Дом? Нет, гостиница."
    collocations:
      - "en casa — дома"
      - "a casa — домой"
    trap: "c перед a читается как «к». Не путайте с caza (с z) — «охота»."

  - es: el café
    pron: "Ударение на последнем слоге, его показывает знак: café."
    meaning: "Кофе и кафе — одно слово. Un café — «чашка кофе»."
    examples:
      - "¿Café? Sí. — Кофе? Да."
      - "¿Café? No. — Кофе? Нет."
    collocations:
      - "un café con leche — кофе с молоком"
      - "un café solo — чёрный кофе, эспрессо"
    trap: "В испанском el café — мужского рода, как и в русском «кофе»."

  - es: el taxi
    meaning: "Такси. В Испании свободное такси узнают по зелёному огоньку."
    examples:
      - "¿El taxi? Sí. — Такси? Да."
      - "¿Taxi? No, no. — Такси? Нет-нет."
    collocations:
      - "coger un taxi — взять такси (в Испании)"
      - "la parada de taxis — стоянка такси"
    trap: "x между гласными читается как «кс»: «та́кси». В Латинской Америке «взять такси» — tomar un taxi 🌎."

  - es: el hotel
    pron: "h не читается: «отэ́ль». Ударение на последнем слоге."
    meaning: "Гостиница, отель."
    examples:
      - "¿El hotel? Sí. — Гостиница? Да."
      - "¿La casa? No, el hotel. — Дом? Нет, гостиница."
    collocations:
      - "un hotel barato — недорогая гостиница"
      - "en el hotel — в гостинице"
    trap: "Не произносите h: не «хотэль», а «отэль»."

  - es: la música
    pron: "Ударение на первом слоге (знак над ú): «му́сика». s всегда глухая, как русское «с»."
    meaning: "Музыка."
    examples:
      - "¿Música? ¡Sí! — Музыка? Да!"
      - "¿Música? No. — Музыка? Нет."
    collocations:
      - "escuchar música — слушать музыку"
      - "música clásica — классическая музыка"
    trap: "s между гласными не звонкая: «му́сика», а не «му́зика»."

  - es: sí
    pron: "Со знаком ударения: sí — «да». Без него si — «если»."
    meaning: "Да — ответ на вопрос."
    examples:
      - "¿Café? Sí. — Кофе? Да."
      - "Sí, sí, el hotel. — Да-да, гостиница."
    collocations:
      - "creo que sí — думаю, да"
      - "¡claro que sí! — конечно, да!"
    trap: "sí (да) и si (если) звучат одинаково, но пишутся по-разному: знак ударения различает слова."

  - es: "no"
    meaning: "Нет; не. Одно слово и для ответа «нет», и для отрицания перед глаголом."
    examples:
      - "¿Café? No. — Кофе? Нет."
      - "No, no, la casa. — Нет-нет, дом."
    collocations:
      - "creo que no — думаю, нет"
      - "no sé — не знаю"
    trap: "Отрицание no всегда стоит прямо перед глаголом: No sé, а не Sé no."

  - es: el jamón
    pron: "j — хриплое [x], как русское «х», но глубже: «хамо́н». Ударение на последнем слоге."
    meaning: "Хамон — вяленый свиной окорок, символ испанской кухни."
    examples:
      - "¿Jamón? ¡Sí! — Хамон? Да!"
      - "¿Jamón? ¿Queso? ¡Sí! — Хамон? Сыр? Да!"
    collocations:
      - "jamón ibérico — хамон из иберийской свиньи"
      - "un bocadillo de jamón — бутерброд с хамоном"
    trap: "Во множественном знак ударения пропадает: los jamones."

  - es: el queso
    pron: "qu читается как «к», u не читается: «кэ́со»."
    meaning: "Сыр."
    examples:
      - "¿Queso? Sí. — Сыр? Да."
      - "Queso, jamón, paella. — Сыр, хамон, паэлья."
    collocations:
      - "queso manchego — сыр манчего"
      - "un bocadillo de queso — бутерброд с сыром"
    trap: "Не читайте u: не «кузсо», а «кэсо». Так же que, qui — «кэ», «ки»."

  - es: la guitarra
    pron: "gu перед i читается как «г», u не читается. rr — раскатистое «р-р»: «гита́рра»."
    meaning: "Гитара — испанская гитара родом из Андалусии."
    examples:
      - "¿La guitarra? ¡Sí! — Гитара? Да!"
      - "¡Música! ¡Guitarra! — Музыка! Гитара!"
    collocations:
      - "tocar la guitarra — играть на гитаре"
      - "la guitarra española — испанская (классическая) гитара"
    trap: "«Играть на инструменте» — tocar, а не jugar: tocar la guitarra."

  - es: la paella
    pron: "ll в Испании звучит как «й»: «паэ́йя». a и e — два слога: pa-e-lla."
    meaning: "Паэлья — рис с морепродуктами, мясом или овощами, родом из Валенсии."
    examples:
      - "¿Paella? ¡Sí! — Паэлья? Да!"
      - "¡Hola, España! ¡Paella! — Привет, Испания! Паэлья!"
    collocations:
      - "paella valenciana — валенсийская паэлья (с курицей и кроликом)"
      - "paella de marisco — паэлья с морепродуктами"
    trap: "Не «паэ́лла» с «л»: ll звучит как «й». В Валенсии паэлью едят на обед, а не на ужин."

  - es: la tortilla
    pron: "ll — как «й»: «торти́йя»."
    meaning: "В Испании — омлет с картофелем (tortilla de patatas). В Мексике tortilla — кукурузная лепёшка 🌎."
    examples:
      - "¿Tortilla? Sí. — Тортилья? Да."
      - "¿Tortilla? No, paella. — Тортилья? Нет, паэлья."
    collocations:
      - "tortilla de patatas — испанский омлет с картофелем"
      - "tortilla francesa — простой омлет"
    trap: "Испанская tortilla — не лепёшка, а толстый омлет с картошкой."

  - es: España
    pron: "ñ — «нь»: «эспа́нья»."
    meaning: "Испания. Название страны пишется с большой буквы и без артикля."
    examples:
      - "¡Hola, España! — Привет, Испания!"
      - "España: paella, tortilla, jamón. — Испания: паэлья, тортилья, хамон."
    collocations:
      - "en España — в Испании"
      - "de España — из Испании"
    trap: "Без артикля: España, а не la España. Буква ñ — отдельная буква алфавита."

  - es: mañana
    pron: "ñ — «нь»: «манья́на»."
    meaning: "Завтра. С артиклем la mañana — «утро»: por la mañana — «утром»."
    examples:
      - "¿Mañana? Sí. — Завтра? Да."
      - "Mañana, paella. — Завтра — паэлья."
    collocations:
      - "hasta mañana — до завтра"
      - "por la mañana — утром"
    trap: "mañana (завтра) и la mañana (утро) — одно слово. «Завтра утром» — mañana por la mañana."

  - es: gracias
    pron: "c перед i в Испании — как английское th в think: «гра́θиас»; в Латинской Америке — «гра́сиас» 🌎."
    meaning: "Спасибо."
    examples:
      - "¿Café? Sí, gracias. — Кофе? Да, спасибо."
      - "No, gracias. — Нет, спасибо."
    collocations:
      - "muchas gracias — большое спасибо"
      - "gracias por… — спасибо за…"
    trap: "Слово всегда во множественном: gracias, а не gracia (gracia — «изящество, остроумие»)."

  - es: la cerveza
    pron: "c перед e и z в Испании — как th в think: «θэрбэ́θа». v читается как b."
    meaning: "Пиво. Una caña — маленький бокал разливного пива."
    examples:
      - "¿Cerveza? Sí, gracias. — Пиво? Да, спасибо."
      - "¿Cerveza? No, gracias. — Пиво? Нет, спасибо."
    collocations:
      - "una cerveza, por favor — пиво, пожалуйста"
      - "una cerveza sin alcohol — безалкогольное пиво"
    trap: "v читается как b: «сэрбэса», а не «сэрвэса»."

  - es: la plaza
    pron: "z в Испании — как th в think: «пла́θа»."
    meaning: "Площадь. Plaza Mayor — главная площадь города."
    examples:
      - "¿La plaza? Sí. — Площадь? Да."
      - "¿El hotel? ¿La plaza? — Гостиница? Площадь?"
    collocations:
      - "la Plaza Mayor — главная площадь"
      - "en la plaza — на площади"
    trap: "«На площади» — en la plaza, с en. plaza — ещё и «место»: plaza de garaje — место в гараже."

  - es: el chocolate
    pron: "ch — «ч»: «чокола́тэ»."
    meaning: "Шоколад; горячий шоколад — напиток."
    examples:
      - "¿Chocolate? ¡Sí, gracias! — Шоколад? Да, спасибо!"
      - "¿Café? No, chocolate. — Кофе? Нет, шоколад."
    collocations:
      - "chocolate con churros — горячий шоколад с чуррос"
      - "chocolate negro — тёмный шоколад"
    trap: "Последняя e читается чётко: «чоколатэ», без «ь» на конце."

  - es: el perro
    pron: "rr — раскатистое «р-р», несколько ударов языка: «пэ́рро»."
    meaning: "Собака, пёс. Собака-девочка — la perra."
    examples:
      - "¿El perro? Sí. — Собака? Да."
      - "¡Hola, perro! — Привет, пёс!"
    collocations:
      - "un perro grande — большая собака"
      - "pasear al perro — гулять с собакой"
    trap: "pero (одна r) — «но», perro (rr) — «собака». Раскатистое rr различает слова."

  - es: el vino
    pron: "v читается как b: «би́но»."
    meaning: "Вино. Vino tinto — красное, vino blanco — белое."
    examples:
      - "¿Vino? Sí, gracias. — Вино? Да, спасибо."
      - "¿Vino? No, cerveza. — Вино? Нет, пиво."
    collocations:
      - "vino tinto — красное вино"
      - "una copa de vino — бокал вина"
    trap: "Красное вино — vino tinto, а не vino rojo. И v — как b: «бино»."
