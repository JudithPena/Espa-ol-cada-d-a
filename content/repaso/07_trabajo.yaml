# Тема 7 «Профессии». Правила — docs/repaso_guide.md.
words:
  - es: "¿A qué te dedicas?"
    meaning: "Чем ты занимаешься? Кем работаешь? Буквально «чему ты себя посвящаешь»."
    examples:
      - "¿A qué te dedicas? Soy profesora. — Кем ты работаешь? Я учительница."
    collocations:
      - "¿a qué se dedica usted? — чем вы занимаетесь?"
    trap: "Ответ — с ser и без артикля: Soy médico, а не Soy un médico."

  - es: el profesor / la profesora
    meaning: "Преподаватель, учитель(ница) — и в школе, и в университете."
    examples:
      - "Soy profesora. — Я учительница."
      - "Mi amigo es profesor. — Мой друг — преподаватель."
    collocations:
      - "el profesor de español — преподаватель испанского"
    trap: "О профессии — без артикля: Es profesor, а не Es un profesor."

  - es: el médico / la médica
    pron: "Ударение на первом слоге: «мэ́дико»."
    meaning: "Врач."
    examples:
      - "Soy médico. — Я врач."
      - "Ella es médica. — Она врач."
    collocations:
      - "ir al médico — пойти к врачу"
    trap: "Знак ударения: médico. Без него medico — «лечу»."

  - es: el/la estudiante
    meaning: "Студент, студентка; ученик. Одна форма, род показывает артикль."
    examples:
      - "Soy estudiante. — Я студент."
      - "Ana es estudiante. — Ана студентка."
    collocations:
      - "estudiante de español — изучающий испанский"
    trap: "Нет формы «estudianta»: la estudiante."

  - es: el camarero / la camarera
    meaning: "Официант, официантка."
    examples:
      - "Es camarero. — Он официант."
      - "¡Camarero, un café, por favor! — Официант, кофе, пожалуйста!"
    collocations:
      - "el camarero del restaurante — официант ресторана"
    trap: "В Латинской Америке — el mesero 🌎."

  - es: el ingeniero / la ingeniera
    pron: "g перед e — хриплое «х»: «инхэнье́ро»."
    meaning: "Инженер."
    examples:
      - "Soy ingeniera. — Я инженер."
      - "Mi amigo es ingeniero. — Мой друг — инженер."
    collocations:
      - "ingeniero informático — инженер-программист"
    trap: "g читается как «х»: «инхеньеро», а не «инженеро»."

  - es: el programador / la programadora
    meaning: "Программист, программистка."
    examples:
      - "Soy programador. — Я программист."
    collocations:
      - "programar — программировать"
    trap: "Женский род — programadora, с -a."

  - es: trabajar
    pron: "j — хриплое «х»: «трабаха́р»."
    meaning: "Работать. Формы: trabajo, trabajas, trabaja."
    examples:
      - "Trabajo en una oficina. — Я работаю в офисе."
      - "¿Dónde trabajas? — Где ты работаешь?"
    collocations:
      - "trabajar de… — работать кем-то"
    trap: "Кем работаете — de: Trabajo de camarero."

  - es: estudiar
    meaning: "Учиться; изучать. Формы: estudio, estudias, estudia."
    examples:
      - "Estudio español. — Я изучаю испанский."
      - "¿Estudias o trabajas? — Ты учишься или работаешь?"
    collocations:
      - "estudiar en la universidad — учиться в университете"
    trap: "Изучать язык — без предлога: estudio español."

  - es: el hospital
    pron: "h не читается: «оспита́ль»."
    meaning: "Больница."
    examples:
      - "Trabajo en un hospital. — Я работаю в больнице."
    collocations:
      - "estar en el hospital — лежать в больнице"
    trap: "h не читается: «оспиталь», а не «хоспиталь»."

  - es: la escuela
    pron: "ue — одним слогом: «эскуэ́ла»."
    meaning: "Школа."
    examples:
      - "Trabajo en una escuela. — Я работаю в школе."
    collocations:
      - "la escuela de idiomas — языковая школа"
    trap: "В Испании школу чаще называют el colegio."

  - es: la oficina
    pron: "c перед i — как th в think: «офиθи́на»."
    meaning: "Офис, контора."
    examples:
      - "Trabajo en una oficina. — Я работаю в офисе."
    collocations:
      - "la oficina de correos — почта"
    trap: "Женского рода: la oficina."

  - es: el restaurante
    pron: "au — одним слогом: «рэстаура́нтэ»."
    meaning: "Ресторан."
    examples:
      - "Trabajo en un restaurante. — Я работаю в ресторане."
    collocations:
      - "ir al restaurante — пойти в ресторан"
    trap: "На конце -e: restaurante, а не «restaurant»."

  - es: la universidad
    pron: "v — как b, d в конце почти не слышно: «унибэрсида́»."
    meaning: "Университет."
    examples:
      - "Estudio en la universidad. — Я учусь в университете."
    collocations:
      - "ir a la universidad — ходить в университет"
    trap: "Женского рода, как все слова на -dad: la universidad."

  - es: nosotros / nosotras
    meaning: "Мы. nosotras — только о женщинах."
    examples:
      - "Nosotros trabajamos en Madrid. — Мы работаем в Мадриде."
      - "Nosotras estudiamos español. — Мы (женщины) изучаем испанский."
    collocations:
      - "nosotros también — мы тоже"
    trap: "Если в группе хотя бы один мужчина — nosotros."

  - es: vosotros / vosotras
    pron: "v — как b: «босо́трос»."
    meaning: "Вы — группе, неформально. Так говорят только в Испании."
    examples:
      - "¿Vosotros trabajáis? — Вы работаете?"
      - "¿Vosotras estudiáis español? — Вы (девушки) изучаете испанский?"
    collocations:
      - "¿y vosotros? — а вы?"
    trap: "В Латинской Америке vosotros не говорят: всем — ustedes 🌎."

  - es: ellos
    pron: "ll — как «й»: «э́йос»."
    meaning: "Они — мужчины или смешанная группа."
    examples:
      - "Ellos trabajan en un hospital. — Они работают в больнице."
    collocations:
      - "ellos y ellas — они (все)"
    trap: "Хотя бы один мужчина в группе — ellos."

  - es: ellas
    pron: "ll — как «й»: «э́йас»."
    meaning: "Они — только женщины."
    examples:
      - "Ellas estudian español. — Они изучают испанский."
    collocations:
      - "ellas también — они тоже"
    trap: "Только если в группе одни женщины."

  - es: ustedes
    meaning: "Вы — вежливо, группе. Глагол — как с «они»."
    examples:
      - "¿Ustedes trabajan en Madrid? — Вы работаете в Мадриде?"
    collocations:
      - "¿y ustedes? — а вы?"
    trap: "Глагол с ustedes — в форме «они»: ustedes trabajan."

  - es: el/la periodista
    meaning: "Журналист, журналистка — одна форма на -ista."
    examples:
      - "Es periodista. — Он журналист."
    collocations:
      - "el periódico — газета"
    trap: "Нет формы «periodisto»: el periodista — мужчина."

  - es: el abogado / la abogada
    pron: "b и g между гласными — мягкие."
    meaning: "Юрист, адвокат."
    examples:
      - "Mi amiga es abogada. — Моя подруга — юрист."
    collocations:
      - "el abogado defensor — защитник"
    trap: "abogado — любой юрист, не только адвокат в суде."

  - es: el enfermero / la enfermera
    meaning: "Медбрат, медсестра."
    examples:
      - "Ella es enfermera. — Она медсестра."
    collocations:
      - "enfermo — больной"
    trap: "Не путайте с enfermo — «больной»."

  - es: el cocinero / la cocinera
    pron: "c перед i — как th в think: «коθинэ́ро»."
    meaning: "Повар."
    examples:
      - "Es cocinero en un restaurante. — Он повар в ресторане."
    collocations:
      - "la cocina — кухня"
    trap: "Шеф-повар — el chef или el jefe de cocina."

  - es: mucho
    pron: "ch — «ч»: «му́чо»."
    meaning: "Много; очень (с глаголом)."
    examples:
      - "Trabajo mucho. — Я много работаю."
      - "Mucho gusto. — Очень приятно."
    collocations:
      - "muchas gracias — большое спасибо"
    trap: "Перед прилагательным — muy: muy bien. После глагола — mucho: trabajo mucho."

  - es: escuchar
    pron: "ch — «ч»: «эскуча́р»."
    meaning: "Слушать."
    examples:
      - "Escucho música. — Я слушаю музыку."
      - "¿Escuchas música en el móvil? — Ты слушаешь музыку на телефоне?"
    collocations:
      - "escuchar música — слушать музыку"
    trap: "Слушать что-то — без предлога: escucho música, а не escucho a la música."

  - es: cocinar
    pron: "c перед i — как th: «коθина́р»."
    meaning: "Готовить еду."
    examples:
      - "Cocino paella. — Я готовлю паэлью."
      - "¿Cocinas mucho? — Ты много готовишь?"
    collocations:
      - "cocinar bien — хорошо готовить"
    trap: "Готовить урок или документ — preparar, а cocinar — только еду."
