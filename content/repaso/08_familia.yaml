# Тема 8 «Семья». Правила — docs/repaso_guide.md.
words:
  - es: la familia
    pron: "ia — одним слогом: «фами́лья»."
    meaning: "Семья."
    examples:
      - "Mi familia es de Kiev. — Моя семья из Киева."
      - "Es una foto de mi familia. — Это фотография моей семьи."
    collocations:
      - "la familia grande — большая семья"
    trap: "familia — «семья», а не «фамилия». Фамилия — el apellido."

  - es: el padre
    meaning: "Отец. Разговорно — papá."
    examples:
      - "Mi padre es médico. — Мой отец врач."
      - "¿Tu padre trabaja? — Твой отец работает?"
    collocations:
      - "papá — папа"
    trap: "los padres — не «отцы», а «родители»."

  - es: la madre
    meaning: "Мать. Разговорно — mamá."
    examples:
      - "Mi madre es profesora. — Моя мама учительница."
    collocations:
      - "mamá — мама"
      - "¡madre mía! — боже мой!"
    trap: "¡Madre mía! — частое восклицание удивления, а не обращение к маме."

  - es: los padres
    meaning: "Родители — множественное от padre."
    examples:
      - "Mis padres viven en Madrid. — Мои родители живут в Мадриде."
    collocations:
      - "los padres de Ana — родители Аны"
    trap: "Родственники — los parientes, а не los padres."

  - es: el hermano / la hermana
    pron: "h не читается: «эрма́но»."
    meaning: "Брат / сестра. los hermanos — братья и сёстры вместе."
    examples:
      - "Mi hermana es estudiante. — Моя сестра студентка."
      - "Tengo un hermano. — У меня есть брат."
    collocations:
      - "el hermano mayor — старший брат"
    trap: "¿Tienes hermanos? — спрашивают и о братьях, и о сёстрах."

  - es: el hijo / la hija
    pron: "h не читается, j — «х»: «и́хо»."
    meaning: "Сын / дочь. los hijos — дети (сыновья и дочери)."
    examples:
      - "Tengo dos hijos. — У меня двое детей."
      - "Mi hija tiene cinco años. — Моей дочери пять лет."
    collocations:
      - "el hijo único — единственный ребёнок"
    trap: "«Дети» в семье — los hijos; дети вообще — los niños."

  - es: "¿Tienes hermanos?"
    meaning: "У тебя есть братья и сёстры?"
    examples:
      - "¿Tienes hermanos? Sí, una hermana. — У тебя есть братья или сёстры? Да, сестра."
    collocations:
      - "no tengo hermanos — у меня нет братьев и сестёр"
    trap: "Множественное hermanos — и братья, и сёстры вместе."

  - es: el abuelo / la abuela
    pron: "ue — одним слогом: «абуэ́ло»."
    meaning: "Дедушка / бабушка. los abuelos — дедушка и бабушка."
    examples:
      - "Mi abuela es de Kiev. — Моя бабушка из Киева."
      - "Mis abuelos viven en España. — Мои бабушка и дедушка живут в Испании."
    collocations:
      - "los abuelos — бабушка и дедушка"
    trap: "Внук — el nieto, внучка — la nieta."

  - es: el tío / la tía
    pron: "Ударение на i (знак): «ти́о»."
    meaning: "Дядя / тётя. В разговоре в Испании tío — ещё и «чувак»."
    examples:
      - "Mi tía vive en Madrid. — Моя тётя живёт в Мадриде."
    collocations:
      - "¡tío! — чувак! (разговорное)"
    trap: "¡Oye, tío! между друзьями — не «дядя», а «чувак, слушай»."

  - es: el primo / la prima
    meaning: "Двоюродный брат / сестра."
    examples:
      - "Mi primo es de Barcelona. — Мой двоюродный брат из Барселоны."
    collocations:
      - "los primos — двоюродные братья и сёстры"
    trap: "Испанское primo — не «первый» (primero)."

  - es: el marido
    meaning: "Муж."
    examples:
      - "Mi marido es ingeniero. — Мой муж инженер."
    collocations:
      - "el esposo — супруг (официальнее)"
    trap: "«Женатая пара» — el matrimonio, а marido — только муж."

  - es: la mujer
    pron: "j — «х»: «мухэ́р»."
    meaning: "Жена; женщина."
    examples:
      - "Mi mujer es médica. — Моя жена врач."
      - "Es una mujer de Madrid. — Это женщина из Мадрида."
    collocations:
      - "la esposa — супруга (официальнее)"
    trap: "mi mujer — «моя жена», una mujer — «женщина»."

  - es: el novio / la novia
    pron: "v — как b: «но́бьо»."
    meaning: "Парень / девушка в паре; жених / невеста."
    examples:
      - "Mi novia es italiana. — Моя девушка итальянка."
    collocations:
      - "los novios — жених и невеста; влюблённая пара"
    trap: "novio — не «новичок». Новичок — el principiante."

  - es: el gato
    meaning: "Кот, кошка. Кошка-девочка — la gata."
    examples:
      - "Tengo un gato. — У меня есть кот."
    collocations:
      - "dar gato por liebre — обмануть («подсунуть кота вместо зайца»)"
    trap: "В Мадриде los gatos — ещё прозвище коренных мадридцев."

  - es: nuestro/a
    pron: "ue — одним слогом: «нуэ́стро»."
    meaning: "Наш, наша. Согласуется с предметом: nuestra casa, nuestros padres."
    examples:
      - "Es nuestra casa. — Это наш дом."
      - "Nuestro padre es médico. — Наш отец врач."
    collocations:
      - "nuestra familia — наша семья"
    trap: "Род — по предмету, а не по тем, кто «мы»: nuestra casa."

  - es: vuestro/a
    pron: "v — как b, ue — одним слогом: «буэ́стро»."
    meaning: "Ваш, ваша — когда «вы» на «ты» (группе). Только в Испании."
    examples:
      - "¿Es vuestra casa? — Это ваш дом?"
    collocations:
      - "vuestros padres — ваши родители"
    trap: "Вежливое «ваш» (usted, ustedes) — su: su casa."

  - es: mayor
    pron: "y — как «й»: «майо́р»."
    meaning: "Старший; пожилой. Una persona mayor — пожилой человек."
    examples:
      - "Mi hermano mayor es médico. — Мой старший брат врач."
    collocations:
      - "las personas mayores — пожилые люди"
    trap: "О возрасте человека вежливо — mayor, а не viejo «старый»."

  - es: pequeño/a
    pron: "ñ — «нь»: «пэкэ́ньо»."
    meaning: "Маленький; младший."
    examples:
      - "Mi hermana pequeña tiene cinco años. — Моей младшей сестре пять лет."
      - "Es una casa pequeña. — Это маленький дом."
    collocations:
      - "de pequeño — в детстве"
    trap: "De pequeño — «в детстве», буквально «будучи маленьким»."

  - es: mira
    meaning: "Смотри, посмотри — на «ты». Ещё — «слушай» в начале фразы."
    examples:
      - "Mira, es mi familia. — Смотри, это моя семья."
    collocations:
      - "¡mira! — смотри!"
    trap: "Mira в начале фразы часто значит «слушай, понимаешь»: Mira, no sé."
