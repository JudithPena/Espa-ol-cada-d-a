# Тема 13 «Еда». Правила — docs/repaso_guide.md.
words:
  - es: el agua
    pron: "gu перед a — «гуа»: «а́гуа»."
    meaning: "Вода. Женского рода, но в единственном числе с артиклем el: el agua fría."
    examples:
      - "Agua, por favor. — Воды, пожалуйста."
    collocations:
      - "agua con gas — газированная вода"
      - "agua sin gas — вода без газа"
    trap: "el agua, но agua fría и las aguas: el ставят только для звучания перед ударным a."

  - es: el té
    pron: "Со знаком: té — «чай»; te без знака — «тебя, тебе»."
    meaning: "Чай."
    examples:
      - "Un té, por favor. — Чай, пожалуйста."
    collocations:
      - "té verde — зелёный чай"
    trap: "té (чай) и te (тебя) различает знак."

  - es: la leche
    pron: "ch — «ч»: «лэ́чэ»."
    meaning: "Молоко."
    examples:
      - "Un café con leche, por favor. — Кофе с молоком, пожалуйста."
    collocations:
      - "leche de vaca — коровье молоко"
    trap: "Женского рода: la leche, хотя «молоко» — среднего."

  - es: el zumo
    pron: "z — как th в think: «θу́мо»."
    meaning: "Сок — так в Испании. В Латинской Америке — el jugo 🌎."
    examples:
      - "un zumo de naranja — апельсиновый сок"
    collocations:
      - "zumo natural — свежевыжатый сок"
    trap: "Из чего сок — de: zumo de manzana."

  - es: el refresco
    meaning: "Газировка, прохладительный напиток."
    examples:
      - "Un refresco, por favor. — Газировку, пожалуйста."
    collocations:
      - "un refresco de naranja — апельсиновая газировка"
    trap: "Не «освежитель» (ambientador)."

  - es: el café con leche
    meaning: "Кофе с молоком — самый частый утренний кофе в Испании."
    examples:
      - "Un café con leche, por favor. — Кофе с молоком, пожалуйста."
    collocations:
      - "un cortado — эспрессо с каплей молока"
    trap: "Капучино в Испании заказывают реже: café con leche — это и есть «латте»."

  - es: el pan
    meaning: "Хлеб."
    examples:
      - "Pan con queso, por favor. — Хлеб с сыром, пожалуйста."
    collocations:
      - "pan con tomate — хлеб с помидором (каталонский завтрак)"
    trap: "Багет в Испании — la barra de pan."

  - es: la carne
    meaning: "Мясо."
    examples:
      - "¿Carne o pescado? — Мясо или рыба?"
    collocations:
      - "carne de cerdo — свинина"
    trap: "Женского рода: la carne."

  - es: el pescado
    meaning: "Рыба как еда."
    examples:
      - "Pescado, por favor. — Рыбу, пожалуйста."
    collocations:
      - "pescado a la plancha — рыба на гриле"
    trap: "Живая рыба — el pez, на тарелке — el pescado."

  - es: el pollo
    pron: "ll — как «й»: «по́йо»."
    meaning: "Курица (как еда); цыплёнок."
    examples:
      - "Pollo con arroz. — Курица с рисом."
    collocations:
      - "pollo asado — жареная курица"
    trap: "Живая курица — la gallina."

  - es: el arroz
    pron: "rr — раскатистое, z — как th: «арро́θ»."
    meaning: "Рис."
    examples:
      - "Pollo con arroz. — Курица с рисом."
    collocations:
      - "arroz con leche — рисовый пудинг"
    trap: "Множественное — arroces (с c)."

  - es: la ensalada
    meaning: "Салат."
    examples:
      - "Una ensalada, por favor. — Салат, пожалуйста."
    collocations:
      - "ensalada mixta — салат из свежих овощей"
    trap: "Салат-латук (растение) — la lechuga."

  - es: la fruta
    meaning: "Фрукты — в единственном числе как «фрукты вообще»."
    examples:
      - "En la mesa hay fruta. — На столе фрукты."
    collocations:
      - "fruta de temporada — сезонные фрукты"
    trap: "Ем фрукты — como fruta (в единственном)."

  - es: el huevo
    pron: "h не читается, ue — «уэ»: «уэ́бо»."
    meaning: "Яйцо."
    examples:
      - "Huevo con jamón. — Яйцо с хамоном."
    collocations:
      - "huevos fritos — яичница"
    trap: "h не читается: «уэбо»."

  - es: la manzana
    pron: "z — как th: «манθа́на»."
    meaning: "Яблоко; ещё — квартал (группа домов)."
    examples:
      - "Una manzana, por favor. — Яблоко, пожалуйста."
    collocations:
      - "zumo de manzana — яблочный сок"
    trap: "manzana — и яблоко, и городской квартал."

  - es: la naranja
    pron: "j — «х»: «нара́нха»."
    meaning: "Апельсин; оранжевый (цвет)."
    examples:
      - "un zumo de naranja — апельсиновый сок"
    collocations:
      - "media naranja — «половинка», вторая половинка"
    trap: "Mi media naranja — «моя вторая половинка»."

  - es: el plátano
    pron: "Ударение на первом слоге: «пла́тано»."
    meaning: "Банан — так в Испании."
    examples:
      - "Un plátano, por favor. — Банан, пожалуйста."
    collocations:
      - "el plátano de Canarias — канарский банан"
    trap: "В Латинской Америке чаще говорят el banano или la banana 🌎."

  - es: el tomate
    meaning: "Помидор."
    examples:
      - "Pan con tomate. — Хлеб с помидором."
    collocations:
      - "salsa de tomate — томатный соус"
    trap: "Ударение на ma: «тома́тэ»."

  - es: la patata
    meaning: "Картофель — так в Испании. В Латинской Америке — la papa 🌎."
    examples:
      - "Tortilla de patatas. — Тортилья с картофелем."
    collocations:
      - "patatas fritas — картошка фри; чипсы"
    trap: "patatas fritas — и фри, и чипсы."

  - es: la verdura
    pron: "v — как b."
    meaning: "Овощи — обычно во множественном: las verduras."
    examples:
      - "Sopa de verdura. — Овощной суп."
    collocations:
      - "sopa de verduras — овощной суп"
    trap: "Не путайте с verde «зелёный»."

  - es: la sopa
    meaning: "Суп."
    examples:
      - "Una sopa, por favor. — Суп, пожалуйста."
    collocations:
      - "sopa de pollo — куриный суп"
    trap: "Суп «едят»: comer sopa или tomar sopa, но не beber."

  - es: comer
    meaning: "Есть; обедать (в Испании — около 14–15 часов)."
    examples:
      - "Como en casa. — Я обедаю дома."
      - "¿Qué comes? — Что ты ешь?"
    collocations:
      - "comer fuera — есть вне дома"
    trap: "comer без объекта часто значит «обедать»: ¿Comemos juntos? — «Пообедаем вместе?»."

  - es: beber
    meaning: "Пить."
    examples:
      - "Bebo agua. — Я пью воду."
    collocations:
      - "algo de beber — что-нибудь попить"
    trap: "В кафе чаще говорят tomar: ¿Qué quieres tomar?"

  - es: leer
    meaning: "Читать. Формы: leo, lees, lee."
    examples:
      - "Leo un libro. — Я читаю книгу."
    collocations:
      - "leer en voz alta — читать вслух"
    trap: "Две e читаются раздельно: «лэ-эр»."

  - es: aprender
    meaning: "Учить, учиться чему-то."
    examples:
      - "Aprendo español. — Я учу испанский."
    collocations:
      - "aprender a + инфинитив — научиться делать"
    trap: "Научиться делать — aprender a: aprendo a cocinar."

  - es: abrir
    meaning: "Открывать."
    examples:
      - "Abro la ventana. — Я открываю окно."
    collocations:
      - "abrir la puerta — открыть дверь"
    trap: "Противоположное — cerrar «закрывать»."

  - es: escribir
    meaning: "Писать."
    examples:
      - "Escribo en el cuaderno. — Я пишу в тетради."
    collocations:
      - "escribir a alguien — написать кому-то"
    trap: "Кому — a: escribo a mi madre."

  - es: el desayuno
    pron: "y — как «й»: «дэсаю́но»."
    meaning: "Завтрак."
    examples:
      - "El desayuno es a las ocho. — Завтрак в восемь."
    collocations:
      - "desayuno continental — континентальный завтрак"
    trap: "Испанский завтрак часто лёгкий: кофе и тост."

  - es: la comida
    meaning: "Обед (главная еда дня); еда вообще."
    examples:
      - "La comida es a las dos. — Обед в два."
    collocations:
      - "comida rápida — фастфуд"
    trap: "В Испании la comida — обед, и он поздно: в 14–15 часов."

  - es: la cena
    pron: "c перед e — как th: «θэ́на»."
    meaning: "Ужин — в Испании поздно, около 21–22 часов."
    examples:
      - "La cena es a las nueve. — Ужин в девять."
    collocations:
      - "la cena de Navidad — рождественский ужин"
    trap: "Ужинают в Испании очень поздно: 21–22 часа — нормально."

  - es: desayunar
    meaning: "Завтракать."
    examples:
      - "Desayuno café con leche. — На завтрак я пью кофе с молоком."
    collocations:
      - "desayunar fuerte — плотно позавтракать"
    trap: "Что едят на завтрак — без предлога: desayuno pan."

  - es: cenar
    pron: "c перед e — как th: «θэна́р»."
    meaning: "Ужинать."
    examples:
      - "Ceno a las nueve. — Я ужинаю в девять."
    collocations:
      - "cenar fuera — ужинать вне дома"
    trap: "Что на ужин — без предлога: ceno pescado."

  - es: normalmente
    meaning: "Обычно."
    examples:
      - "Normalmente como en casa. — Обычно я обедаю дома."
    collocations:
      - "por lo general — как правило"
    trap: "Ударение на me: «нормальмэ́нтэ»."

  - es: bueno/a
    pron: "ue — одним слогом: «буэ́но»."
    meaning: "Хороший; вкусный (о еде). Перед существительным мужского рода — buen: un buen día."
    examples:
      - "La paella es muy buena. — Паэлья очень вкусная."
    collocations:
      - "¡buen provecho! — приятного аппетита!"
    trap: "un buen libro, а не un bueno libro."

  - es: querer
    meaning: "Хотеть; любить. Формы: quiero, quieres, quiere."
    examples:
      - "Quiero un café. — Я хочу кофе."
      - "¿Quieres agua? — Хочешь воды?"
    collocations:
      - "te quiero — я тебя люблю"
    trap: "e меняется на ie: quiero, а не quero."

  - es: tomar
    meaning: "Брать; в кафе — пить, есть."
    examples:
      - "¿Qué quieres tomar? — Что будешь пить (есть)?"
    collocations:
      - "tomar algo — выпить что-нибудь"
    trap: "Tomar algo в баре — «выпить что-нибудь», чаще всего кофе или пиво."

  - es: para mí
    pron: "Со знаком: mí — «меня, мне»."
    meaning: "Мне — буквально «для меня», когда заказываете."
    examples:
      - "Para mí, un té. — Мне чай."
    collocations:
      - "para ti — тебе (для тебя)"
    trap: "Со знаком: para mí. mi без знака — «мой»."

  - es: algo
    meaning: "Что-нибудь, что-то."
    examples:
      - "¿Algo más? — Что-нибудь ещё?"
      - "¿Quieres algo? — Хочешь что-нибудь?"
    collocations:
      - "algo de beber — что-нибудь попить"
    trap: "В отрицании — nada: No quiero nada."

  - es: el bocadillo
    pron: "ll — как «й»: «бокади́йо»."
    meaning: "Бутерброд из багета — типичный испанский перекус."
    examples:
      - "Un bocadillo de jamón, por favor. — Бутерброд с хамоном, пожалуйста."
    collocations:
      - "bocadillo de calamares — бутерброд с кальмарами"
    trap: "Сэндвич из тостового хлеба — el sándwich."

  - es: la cuenta
    pron: "ue — одним слогом: «куэ́нта»."
    meaning: "Счёт (в кафе); счёт в банке."
    examples:
      - "La cuenta, por favor. — Счёт, пожалуйста."
    collocations:
      - "darse cuenta — понять, заметить"
    trap: "La cuenta, por favor — главная фраза в конце ужина."

  - es: "¿Cuánto es?"
    meaning: "Сколько с меня? Сколько стоит?"
    examples:
      - "¿Cuánto es? Cinco euros. — Сколько с меня? Пять евро."
    collocations:
      - "¿cuánto cuesta? — сколько стоит?"
    trap: "Об одной вещи — ¿Cuánto cuesta?, о счёте — ¿Cuánto es?"

  - es: el euro
    pron: "eu — одним слогом: «э́уро»."
    meaning: "Евро."
    examples:
      - "Son cinco euros. — Пять евро."
    collocations:
      - "un euro — один евро"
    trap: "Во множественном — euros: cinco euros."

  - es: la tostada
    meaning: "Тост, поджаренный хлеб — типичный испанский завтрак."
    examples:
      - "Desayuno una tostada con tomate. — На завтрак я ем тост с помидором."
    collocations:
      - "tostada con aceite — тост с оливковым маслом"
    trap: "В Мексике tostada — хрустящая кукурузная лепёшка 🌎."

  - es: tarde
    meaning: "Поздно. С артиклем la tarde — «вторая половина дня»."
    examples:
      - "Ceno tarde. — Я ужинаю поздно."
    collocations:
      - "llegar tarde — опоздать"
    trap: "tarde (поздно) и la tarde (день после обеда) — одно слово."

  - es: la tapa
    meaning: "Тапа — небольшая закуска к напитку в баре."
    examples:
      - "Una tapa de tortilla, por favor. — Тапу тортильи, пожалуйста."
    collocations:
      - "ir de tapas — ходить по барам и есть тапас"
    trap: "tapa — ещё и «крышка». Ir de tapas — обходить несколько баров."
