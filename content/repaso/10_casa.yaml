# Тема 10 «Дом». Правила — docs/repaso_guide.md.
words:
  - es: el piso
    meaning: "Квартира (в Испании); этаж."
    examples:
      - "Vivo en un piso grande. — Я живу в большой квартире."
      - "Es un piso pequeño. — Это маленькая квартира."
    collocations:
      - "el primer piso — второй этаж (первый над землёй)"
    trap: "В Латинской Америке квартира — el departamento 🌎. А el suelo — «пол»."

  - es: la habitación
    pron: "h не читается, c перед i — как th: «абитаθьо́н»."
    meaning: "Комната; спальня; номер в гостинице."
    examples:
      - "Mi piso tiene dos habitaciones. — В моей квартире две комнаты."
      - "Es mi habitación. — Это моя комната."
    collocations:
      - "una habitación doble — двухместный номер"
    trap: "Женского рода, как все слова на -ción: la habitación."

  - es: el dormitorio
    meaning: "Спальня."
    examples:
      - "El dormitorio es pequeño. — Спальня маленькая."
    collocations:
      - "el dormitorio principal — главная спальня"
    trap: "dormitorio — спальня, а не «общежитие» (residencia)."

  - es: el salón
    pron: "Ударение на последнем слоге."
    meaning: "Гостиная."
    examples:
      - "El salón es grande. — Гостиная большая."
    collocations:
      - "en el salón — в гостиной"
    trap: "Не «салон красоты»: это el salón de belleza."

  - es: la cocina
    pron: "c перед i — как th: «коθи́на»."
    meaning: "Кухня (комната и блюда страны)."
    examples:
      - "La cocina es pequeña. — Кухня маленькая."
      - "Mi madre está en la cocina. — Мама на кухне."
    collocations:
      - "la cocina española — испанская кухня"
    trap: "cocina — ещё и плита: la cocina de gas."

  - es: el baño
    pron: "ñ — «нь»: «ба́ньо»."
    meaning: "Ванная; туалет."
    examples:
      - "¿Dónde está el baño? — Где туалет?"
    collocations:
      - "darse un baño — принять ванну"
    trap: "Спросить туалет в кафе: ¿Dónde está el baño? или ¿Los servicios?"

  - es: el balcón
    meaning: "Балкон."
    examples:
      - "Mi piso tiene un balcón. — В моей квартире есть балкон."
    collocations:
      - "salir al balcón — выйти на балкон"
    trap: "Ударение на последнем слоге: balcón."

  - es: grande
    meaning: "Большой, большая. Перед существительным — gran и значит «великий»: un gran hombre."
    examples:
      - "Es una casa grande. — Это большой дом."
    collocations:
      - "un gran amigo — большой друг"
    trap: "un hombre grande — крупный мужчина, un gran hombre — великий человек."

  - es: la cama
    meaning: "Кровать."
    examples:
      - "La cama es grande. — Кровать большая."
    collocations:
      - "ir a la cama — идти спать"
    trap: "Не путайте с la casa «дом»."

  - es: el sofá
    pron: "Ударение на последнем слоге."
    meaning: "Диван."
    examples:
      - "En el salón hay un sofá. — В гостиной есть диван."
    collocations:
      - "sentarse en el sofá — сесть на диван"
    trap: "Знак ударения: sofá. Множественное — sofás."

  - es: el armario
    meaning: "Шкаф."
    examples:
      - "El armario está en el dormitorio. — Шкаф в спальне."
    collocations:
      - "salir del armario — совершить каминг-аут"
    trap: "Мужского рода: el armario."

  - es: la estantería
    pron: "Ударение на í: «эстантэри́а»."
    meaning: "Полка, стеллаж."
    examples:
      - "En la estantería hay libros. — На полке есть книги."
    collocations:
      - "una estantería de libros — книжный стеллаж"
    trap: "Знак ударения: estantería."

  - es: la nevera
    pron: "v — как b: «нэбэ́ра»."
    meaning: "Холодильник."
    examples:
      - "La nevera está en la cocina. — Холодильник на кухне."
    collocations:
      - "en la nevera — в холодильнике"
    trap: "Ещё говорят el frigorífico. В Латинской Америке — el refrigerador 🌎."

  - es: la tele
    meaning: "Телевизор — сокращение от la televisión."
    examples:
      - "La tele está en el salón. — Телевизор в гостиной."
    collocations:
      - "ver la tele — смотреть телевизор"
    trap: "Смотреть телевизор — ver la tele."

  - es: la ducha
    pron: "ch — «ч»: «ду́ча»."
    meaning: "Душ."
    examples:
      - "El baño tiene ducha. — В ванной есть душ."
    collocations:
      - "darse una ducha — принять душ"
    trap: "Принять душ — darse una ducha или ducharse."

  - es: estar
    meaning: "Находиться; быть (где-то, в каком-то состоянии). Формы: estoy, estás, está."
    examples:
      - "Estoy en casa. — Я дома."
      - "El baño está en el piso. — Ванная в квартире."
    collocations:
      - "estar bien — быть в порядке"
    trap: "Где находится — всегда estar: Madrid está en España, а не es en España."

  - es: "¿Dónde está...?"
    meaning: "Где находится …?"
    examples:
      - "¿Dónde está el baño? — Где туалет?"
      - "¿Dónde está mi móvil? — Где мой телефон?"
    collocations:
      - "¿dónde están? — где они?"
    trap: "С hay не спрашивают «где»: ¿Dónde está?, а не ¿Dónde hay el baño?"

  - es: encima de
    pron: "c перед i — как th: «энθи́ма»."
    meaning: "На, поверх."
    examples:
      - "El libro está encima de la mesa. — Книга на столе."
    collocations:
      - "por encima de — над"
    trap: "Не забывайте de: encima de la mesa. С el — encima del: encima del sofá."

  - es: debajo de
    pron: "j — «х»: «дэба́хо»."
    meaning: "Под."
    examples:
      - "El gato está debajo de la cama. — Кот под кроватью."
    collocations:
      - "debajo del sofá — под диваном"
    trap: "de + el = del: debajo del sofá."

  - es: al lado de
    meaning: "Рядом с."
    examples:
      - "La silla está al lado de la mesa. — Стул рядом со столом."
    collocations:
      - "al lado — рядом"
    trap: "de + el = del: al lado del sofá."

  - es: delante de
    meaning: "Перед."
    examples:
      - "La mesa está delante del sofá. — Стол перед диваном."
    collocations:
      - "delante — впереди"
    trap: "delante de — в пространстве; «перед» во времени — antes de."

  - es: detrás de
    meaning: "За, позади."
    examples:
      - "El gato está detrás de la puerta. — Кот за дверью."
    collocations:
      - "detrás — сзади"
    trap: "Знак ударения: detrás."

  - es: entre
    meaning: "Между; среди."
    examples:
      - "entre la cama y el armario — между кроватью и шкафом"
      - "La mesa está entre las sillas. — Стол между стульями."
    collocations:
      - "entre amigos — среди друзей"
    trap: "После entre — yo и tú, а не mí, ti: entre tú y yo."

  - es: cerca de
    pron: "c перед e — как th: «θэ́рка»."
    meaning: "Близко от, недалеко."
    examples:
      - "Vivo cerca de la plaza. — Я живу недалеко от площади."
    collocations:
      - "muy cerca — очень близко"
    trap: "Не путайте с cerda — «свинья»."

  - es: lejos de
    pron: "j — «х»: «лэ́хос»."
    meaning: "Далеко от."
    examples:
      - "El hotel está lejos de la plaza. — Гостиница далеко от площади."
    collocations:
      - "a lo lejos — вдали"
    trap: "de + el = del: lejos del hotel."

  - es: aquí
    pron: "qu — «к», ударение на последнем слоге: «аки́»."
    meaning: "Здесь, тут."
    examples:
      - "Estoy aquí. — Я здесь."
      - "Aquí hay un sofá. — Здесь есть диван."
    collocations:
      - "por aquí — здесь, поблизости"
    trap: "Знак ударения: aquí."

  - es: allí
    pron: "ll — как «й»: «айи́»."
    meaning: "Там."
    examples:
      - "El baño está allí. — Ванная там."
    collocations:
      - "por allí — там, в той стороне"
    trap: "Ещё говорят allá — «туда, там» (дальше и неопределённее)."

  - es: el centro
    pron: "c перед e — как th: «θэ́нтро»."
    meaning: "Центр."
    examples:
      - "Vivo en el centro. — Я живу в центре."
    collocations:
      - "el centro comercial — торговый центр"
    trap: "«В центре» — en el centro, с артиклем."

  - es: nuevo/a
    pron: "ue — одним слогом, v — как b: «нуэ́бо»."
    meaning: "Новый."
    examples:
      - "Es un piso nuevo. — Это новая квартира."
    collocations:
      - "¿qué hay de nuevo? — что нового?"
    trap: "Перед существительным — «другой, ещё один»: un nuevo piso — новая (другая) квартира."

  - es: viejo/a
    pron: "v — как b, j — «х»: «бьэ́хо»."
    meaning: "Старый."
    examples:
      - "Es una casa vieja. — Это старый дом."
    collocations:
      - "un viejo amigo — старый друг"
    trap: "О людях вежливее mayor: mi abuela es mayor."

  - es: bonito/a
    meaning: "Красивый, симпатичный — о вещах и местах."
    examples:
      - "Es un piso muy bonito. — Это очень красивая квартира."
    collocations:
      - "¡qué bonito! — как красиво!"
    trap: "О людях — guapo: un chico guapo, а bonito — о вещах."

  - es: cómodo/a
    pron: "Ударение на первом слоге: «ко́модо»."
    meaning: "Удобный."
    examples:
      - "El sofá es muy cómodo. — Диван очень удобный."
    collocations:
      - "estar cómodo — чувствовать себя удобно"
    trap: "Не «комод»: комод — la cómoda."

  - es: "¿cuántos? / ¿cuántas?"
    pron: "cu — «ку»."
    meaning: "Сколько? — согласуется с существительным: cuántos libros, cuántas sillas."
    examples:
      - "¿Cuántas sillas hay? — Сколько стульев?"
      - "¿Cuántos años tienes? — Сколько тебе лет?"
    collocations:
      - "¿cuánto? — сколько (чего-то неисчисляемого)?"
    trap: "Род — по существительному: ¿cuántas habitaciones?"

  - es: mamá / papá
    pron: "Ударение на последнем слоге."
    meaning: "Мама / папа."
    examples:
      - "Mamá, ¿dónde está papá? — Мама, где папа?"
    collocations:
      - "mis papás — мои родители (Латинская Америка 🌎)"
    trap: "Знак ударения обязателен: papa без знака — «картошка» (в Латинской Америке) или Папа Римский."
