# Тема 11 «Ser и estar». Правила — docs/repaso_guide.md.
words:
  - es: hoy
    pron: "h не читается: «ой»."
    meaning: "Сегодня."
    examples:
      - "Hoy estoy bien. — Сегодня у меня всё хорошо."
      - "Hoy estoy en casa. — Сегодня я дома."
    collocations:
      - "hoy en día — в наши дни"
    trap: "h не читается: «ой». «Сегодня вечером» — esta noche, а не hoy noche."

  - es: cansado/a
    meaning: "Уставший. С estar: estoy cansado."
    examples:
      - "Estoy muy cansada. — Я очень устала."
    collocations:
      - "estar cansado de — устать от"
    trap: "С estar — «устал сейчас». Es cansado — «он утомительный»."

  - es: contento/a
    meaning: "Довольный, радостный."
    examples:
      - "Hoy estoy contento. — Сегодня я доволен."
    collocations:
      - "estar contento con — быть довольным чем-то"
    trap: "С estar: está contenta, а не es contenta."

  - es: triste
    meaning: "Грустный — одна форма."
    examples:
      - "Hoy estoy triste. — Сегодня мне грустно."
    collocations:
      - "una película triste — грустный фильм"
    trap: "Человек сейчас — está triste; грустная история — es triste."

  - es: nervioso/a
    pron: "v — как b: «нэрбьо́со»."
    meaning: "Взволнованный, нервный."
    examples:
      - "Estoy nerviosa. — Я волнуюсь."
    collocations:
      - "ponerse nervioso — занервничать"
    trap: "estar nervioso — волноваться сейчас, ser nervioso — нервный по характеру."

  - es: enfermo/a
    meaning: "Больной."
    examples:
      - "Hoy estoy enfermo. — Сегодня я болен."
    collocations:
      - "ponerse enfermo — заболеть"
    trap: "С estar: estoy enfermo. Медсестра — enfermera."

  - es: ocupado/a
    meaning: "Занятой; занятый (о месте)."
    examples:
      - "Hoy estoy muy ocupado. — Сегодня я очень занят."
    collocations:
      - "el baño está ocupado — туалет занят"
    trap: "С estar: está ocupado."

  - es: aburrido/a
    pron: "rr — раскатистое: «абурри́до»."
    meaning: "С estar — скучающий («мне скучно»), с ser — скучный."
    examples:
      - "Estoy aburrido. — Мне скучно."
      - "El texto es aburrido. — Текст скучный."
    collocations:
      - "estar aburrido — скучать"
    trap: "Estoy aburrido — «мне скучно», Soy aburrido — «я скучный человек»!"

  - es: ahora
    pron: "h не читается: «ао́ра»."
    meaning: "Сейчас."
    examples:
      - "Ahora estoy en casa. — Сейчас я дома."
    collocations:
      - "ahora mismo — прямо сейчас"
      - "hasta ahora — пока, до скорого"
    trap: "Ahora en Испании может значить и «чуть позже»: Ahora voy — «сейчас иду»."

  - es: siempre
    pron: "ie — одним слогом: «сьэ́мпрэ»."
    meaning: "Всегда."
    examples:
      - "Siempre estoy cansado. — Я всегда уставший."
    collocations:
      - "como siempre — как всегда"
      - "para siempre — навсегда"
    trap: "Навсегда — para siempre, а не por siempre."

  - es: "¿Qué te pasa?"
    meaning: "Что с тобой? Что случилось?"
    examples:
      - "¿Qué te pasa? Estás triste. — Что с тобой? Ты грустный."
    collocations:
      - "¿qué pasa? — что происходит?"
    trap: "С te — о человеке: ¿Qué te pasa? Без te — вообще: ¿Qué pasa?"

  - es: "¿Por qué?"
    meaning: "Почему? — вопрос, раздельно и со знаком."
    examples:
      - "¿Por qué estás triste? — Почему ты грустный?"
    collocations:
      - "¿y por qué no? — а почему бы и нет?"
    trap: "Вопрос — por qué (раздельно, со знаком), ответ — porque (слитно, без знака)."

  - es: porque
    meaning: "Потому что — слитно, без знака."
    examples:
      - "Estoy cansado porque trabajo mucho. — Я устал, потому что много работаю."
    collocations:
      - "porque sí — просто так"
    trap: "porque (потому что) ≠ por qué (почему?)."

  - es: el jefe / la jefa
    pron: "j — «х»: «хэ́фэ»."
    meaning: "Начальник, начальница."
    examples:
      - "Mi jefe es muy simpático. — Мой начальник очень приятный."
    collocations:
      - "el jefe de cocina — шеф-повар"
    trap: "Женский род — jefa, с -a."

  - es: "¡Qué bien!"
    meaning: "Как здорово! — радостная реакция."
    examples:
      - "Estoy contento. ¡Qué bien! — Я доволен. Как здорово!"
    collocations:
      - "¡qué pena! — как жаль!"
    trap: "¡Qué + прилагательное! — «Какой …!»: ¡Qué bonito! — «Как красиво!»."
