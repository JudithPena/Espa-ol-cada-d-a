# Тема 18 «Погода и даты». Правила — docs/repaso_guide.md.
words:
  - es: "¿Qué tiempo hace?"
    meaning: "Какая погода?"
    examples:
      - "¿Qué tiempo hace hoy? Hace sol. — Какая сегодня погода? Солнечно."
    collocations:
      - "hace buen tiempo — хорошая погода"
    trap: "Погода — с hacer: hace calor, а не es calor."

  - es: hace calor
    pron: "h не читается, c перед e — как th: «а́θэ»."
    meaning: "Жарко."
    examples:
      - "Hoy hace mucho calor. — Сегодня очень жарко."
    collocations:
      - "tener calor — человеку жарко"
    trap: "Погоде жарко — hace calor, мне жарко — tengo calor."

  - es: hace frío
    meaning: "Холодно."
    examples:
      - "En Kiev hace frío. — В Киеве холодно."
    collocations:
      - "tener frío — мёрзнуть"
    trap: "Мне холодно — tengo frío, а не estoy frío."

  - es: hace sol
    meaning: "Солнечно."
    examples:
      - "Hoy hace sol. — Сегодня солнечно."
    collocations:
      - "tomar el sol — загорать"
    trap: "Солнечно — hace sol, а не está sol."

  - es: hace viento
    pron: "v — как b, ie — одним слогом: «бьэ́нто»."
    meaning: "Ветрено."
    examples:
      - "Hoy hace mucho viento. — Сегодня очень ветрено."
    collocations:
      - "hace mucho viento — сильный ветер"
    trap: "Много ветра — mucho viento, а не muy viento."

  - es: hace buen tiempo / hace mal tiempo
    meaning: "Хорошая / плохая погода."
    examples:
      - "Hoy hace buen tiempo. — Сегодня хорошая погода."
    collocations:
      - "con buen tiempo — в хорошую погоду"
    trap: "buen и mal — перед tiempo без -o: buen tiempo."

  - es: llover
    pron: "ll — как «й», v — как b. o → ue: llueve."
    meaning: "Идти (о дожде)."
    examples:
      - "Hoy llueve. — Сегодня идёт дождь."
    collocations:
      - "la lluvia — дождь"
    trap: "Только в 3-м лице: llueve. «Дождь» как предмет — la lluvia."

  - es: nevar
    pron: "v — как b. e → ie: nieva."
    meaning: "Идти (о снеге)."
    examples:
      - "En Kiev nieva mucho. — В Киеве много снега."
    collocations:
      - "la nieve — снег"
    trap: "Только в 3-м лице: nieva."

  - es: la estación del año
    meaning: "Время года."
    examples:
      - "¿Cuál es tu estación del año favorita? — Какое твоё любимое время года?"
    collocations:
      - "las cuatro estaciones — четыре времени года"
    trap: "estación — ещё и «вокзал»."

  - es: la primavera
    pron: "v — как b."
    meaning: "Весна."
    examples:
      - "En primavera hace buen tiempo. — Весной хорошая погода."
    collocations:
      - "en primavera — весной"
    trap: "«Весной» — en primavera, с en."

  - es: el verano
    pron: "v — как b: «бэра́но»."
    meaning: "Лето."
    examples:
      - "En verano voy a la playa. — Летом я езжу на море."
    collocations:
      - "las vacaciones de verano — летний отпуск"
    trap: "«Летом» — en verano."

  - es: el otoño
    pron: "ñ — «нь»: «ото́ньо»."
    meaning: "Осень."
    examples:
      - "En otoño llueve mucho. — Осенью часто идёт дождь."
    collocations:
      - "en otoño — осенью"
    trap: "Мужского рода: el otoño."

  - es: el invierno
    pron: "n перед v — [m], v — как b: «имбьэ́рно»."
    meaning: "Зима."
    examples:
      - "En invierno hace frío. — Зимой холодно."
    collocations:
      - "en invierno — зимой"
    trap: "Мужского рода: el invierno."

  - es: está nublado
    meaning: "Облачно, пасмурно."
    examples:
      - "Hoy está nublado. — Сегодня пасмурно."
    collocations:
      - "la nube — облако"
    trap: "Здесь estar, а не hacer: está nublado."

  - es: favorito/a
    pron: "v — как b."
    meaning: "Любимый."
    examples:
      - "Mi estación favorita es el verano. — Моё любимое время года — лето."
    collocations:
      - "mi color favorito — мой любимый цвет"
    trap: "Согласуется: estación favorita, color favorito."

  - es: el mes
    meaning: "Месяц."
    examples:
      - "Un mes tiene treinta días. — В месяце тридцать дней."
    collocations:
      - "el mes que viene — в следующем месяце"
    trap: "Во множественном — meses."

  - es: "¿Cuándo?"
    pron: "cu — «ку»: «куа́ндо»."
    meaning: "Когда?"
    examples:
      - "¿Cuándo vuelves a casa? — Когда ты вернёшься домой?"
    collocations:
      - "¿desde cuándo? — с каких пор?"
    trap: "В вопросе — со знаком: cuándo; в утверждении — cuando."

  - es: enero
    meaning: "Январь. Месяцы пишутся с маленькой буквы."
    examples:
      - "En enero hace frío. — В январе холодно."
    collocations:
      - "en enero — в январе"
    trap: "С маленькой буквы: enero."

  - es: febrero
    meaning: "Февраль."
    examples:
      - "En febrero hace frío. — В феврале холодно."
    collocations:
      - "el catorce de febrero — 14 февраля"
    trap: "С маленькой буквы: febrero."

  - es: marzo
    pron: "z — как th: «ма́рθо»."
    meaning: "Март."
    examples:
      - "En marzo empieza la primavera. — В марте начинается весна."
    collocations:
      - "en marzo — в марте"
    trap: "z перед o — как th: «марθо»."

  - es: abril
    meaning: "Апрель."
    examples:
      - "En abril llueve mucho. — В апреле много дождей."
    collocations:
      - "en abril — в апреле"
    trap: "Ударение на последнем слоге: «абри́ль»."

  - es: mayo
    pron: "y — как «й»: «ма́йо»."
    meaning: "Май."
    examples:
      - "En mayo hace buen tiempo. — В мае хорошая погода."
    collocations:
      - "en mayo — в мае"
    trap: "С маленькой буквы: mayo."

  - es: junio
    pron: "j — «х»: «ху́ньо»."
    meaning: "Июнь."
    examples:
      - "En junio hace calor. — В июне жарко."
    collocations:
      - "en junio — в июне"
    trap: "junio (июнь) и julio (июль) легко спутать."

  - es: julio
    pron: "j — «х»: «ху́льо»."
    meaning: "Июль."
    examples:
      - "En julio voy a la playa. — В июле я еду на море."
    collocations:
      - "en julio — в июле"
    trap: "julio (июль) ≠ junio (июнь)."

  - es: agosto
    meaning: "Август — в Испании главный месяц отпусков."
    examples:
      - "En agosto muchas tiendas cierran. — В августе многие магазины закрываются."
    collocations:
      - "en agosto — в августе"
    trap: "В августе многие испанцы в отпуске: города пустеют."

  - es: septiembre
    pron: "ie — одним слогом."
    meaning: "Сентябрь. Можно писать и setiembre."
    examples:
      - "En septiembre empieza la escuela. — В сентябре начинается школа."
    collocations:
      - "en septiembre — в сентябре"
    trap: "Оба написания верны: septiembre и setiembre."

  - es: octubre
    meaning: "Октябрь."
    examples:
      - "En octubre llueve. — В октябре идут дожди."
    collocations:
      - "en octubre — в октябре"
    trap: "С маленькой буквы: octubre."

  - es: noviembre
    pron: "v — как b, ie — одним слогом."
    meaning: "Ноябрь."
    examples:
      - "En noviembre hace frío. — В ноябре холодно."
    collocations:
      - "en noviembre — в ноябре"
    trap: "С маленькой буквы: noviembre."

  - es: diciembre
    pron: "c перед i — как th: «диθьэ́мбрэ»."
    meaning: "Декабрь."
    examples:
      - "En diciembre nieva. — В декабре идёт снег."
    collocations:
      - "en diciembre — в декабре"
    trap: "c — как th: «диθьэмбрэ»."

  - es: el cumpleaños
    pron: "ñ — «нь»: «кумплэа́ньос»."
    meaning: "День рождения — одно слово, не меняется во множественном."
    examples:
      - "Mi cumpleaños es en mayo. — Мой день рождения в мае."
    collocations:
      - "la fiesta de cumpleaños — день рождения (праздник)"
    trap: "Одна форма: el cumpleaños, los cumpleaños."

  - es: la fecha
    pron: "ch — «ч»: «фэ́ча»."
    meaning: "Дата, число."
    examples:
      - "¿Qué fecha es hoy? — Какое сегодня число?"
    collocations:
      - "la fecha de nacimiento — дата рождения"
    trap: "Дату пишут так: el 5 de mayo — «5 мая»."

  - es: el grado
    meaning: "Градус."
    examples:
      - "Hoy hace treinta grados. — Сегодня тридцать градусов."
    collocations:
      - "bajo cero — ниже нуля"
    trap: "Мороз — bajo cero: cinco grados bajo cero."

  - es: el clima
    meaning: "Климат. Мужского рода, хотя на -a."
    examples:
      - "El clima de España es bueno. — Климат Испании хороший."
    collocations:
      - "el cambio climático — изменение климата"
    trap: "el clima — исключение: на -a, но мужского рода."

  - es: el norte
    meaning: "Север."
    examples:
      - "En el norte llueve mucho. — На севере много дождей."
    collocations:
      - "al norte de — к северу от"
    trap: "«На севере» — en el norte."

  - es: el sur
    meaning: "Юг."
    examples:
      - "En el sur hace calor. — На юге жарко."
    collocations:
      - "al sur de — к югу от"
    trap: "«На юге» — en el sur."

  - es: casi
    meaning: "Почти."
    examples:
      - "Casi nunca llueve. — Почти никогда не идёт дождь."
    collocations:
      - "casi siempre — почти всегда"
    trap: "Не путайте с caso «случай»."
