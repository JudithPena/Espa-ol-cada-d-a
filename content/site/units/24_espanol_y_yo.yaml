  - id: lectura
    kind: reading
    title: "Tres estudiantes, tres historias"
    goal: понять три истории учеников и написать свою
    version: 2
    allow: [América, Latina, cuando]
    vocab:
      - "🎵 la canción [канθьо́н] — песня {pl: canciones} :: Escucho canciones en español. — Я слушаю песни на испанском."
      - "🧑‍🤝‍🧑 el compañero / la compañera [компанье́ро, компанье́ра] — товарищ, коллега, одноклассник :: Practico con mis compañeros de clase. — Я практикуюсь с одногруппниками."
      - "🔁 a menudo [а мэну́до] — часто :: Veo series a menudo. — Я часто смотрю сериалы."
      - "📜 la historia [исто́рья] — история, рассказ :: Es una historia muy bonita. — Это очень красивая история."
    blocks:
      - learn: [la canción, el compañero / la compañera, a menudo, la historia]
      - "Три ученика рассказывают, зачем им испанский и что им трудно."
      - reading:
          id: historias
          title: Tres estudiantes, tres historias
          text: |
            Olga tiene treinta y cuatro años y es de Odesa. Vive en Valencia desde hace tres años. Estudia español porque trabaja en un hospital y necesita hablar con la gente. Le cuesta la gramática, pero entiende casi todo. Practica todos los días con sus compañeros de trabajo.

            Tom es inglés y tiene veinte años. Hace seis meses que estudia español en la universidad. Quiere aprender español para viajar por América Latina. Le cuestan mucho los verbos. Para practicar, ve series a menudo y escucha canciones en español.

            Li es de China y vive en Madrid desde septiembre. Estudia español para trabajar en un restaurante. Ya sabe cocinar muy bien, pero todavía no conoce bien la ciudad. Le cuesta la pronunciación: ¡la erre es muy difícil! Su consejo: «Lo mejor es hablar mucho y no tener miedo de los errores».
          translation: |
            Ольге тридцать четыре года, она из Одессы. Она живёт в Валенсии уже три года. Учит испанский, потому что работает в больнице и ей нужно разговаривать с людьми. Ей трудно даётся грамматика, но она понимает почти всё. Каждый день практикуется с коллегами.

            Том — англичанин, ему двадцать лет. Он учит испанский в университете уже шесть месяцев. Он хочет выучить испанский, чтобы путешествовать по Латинской Америке. Ему очень трудно даются глаголы. Для практики он часто смотрит сериалы и слушает песни на испанском.

            Ли из Китая и с сентября живёт в Мадриде. Он учит испанский, чтобы работать в ресторане. Он уже очень хорошо умеет готовить, но ещё плохо знает город. Ему трудно даётся произношение: звук «р» очень трудный! Его совет: «Лучше всего много говорить и не бояться ошибок».
      - sort:
          title: "¿Quién?"
          source: historias
          groups:
            "Olga": [vive en Valencia, trabaja en un hospital]
            "Tom": [estudia en la universidad, ve series a menudo]
            "Li": [sabe cocinar muy bien, vive en Madrid desde septiembre]
      - choose:
          title: Что сказано в тексте?
          source: historias
          items:
            - q: "¿Cuánto tiempo hace que Tom estudia español?"
              options: "Seis meses. | Tres años. | Desde septiembre."
              explain: "Hace seis meses que estudia español en la universidad."
              skill: desde_hace
            - q: "¿Para qué estudia español Li?"
              options: "Para trabajar en un restaurante. | Para viajar por América Latina. | Porque trabaja en un hospital."
              explain: "Estudia español para trabajar en un restaurante. Путешествовать хочет Том, а в больнице работает Ольга."
              skill: para_porque
            - q: "¿Qué le cuesta a Olga?"
              options: "La gramática. | La pronunciación. | Los verbos."
              explain: "Le cuesta la gramática, pero entiende casi todo."
              skill: me_cuesta
            - q: "¿Quién practica español en el trabajo?"
              options: "Olga. | Tom. | Li."
              explain: "Olga: Practica todos los días con sus compañeros de trabajo."
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: historias
          items:
            - q: "¿Desde cuándo vive Li en Madrid?"
              a: "Desde septiembre | (Li) vive en Madrid desde septiembre | Vive (en Madrid) desde septiembre"
              explain: "Li … vive en Madrid desde septiembre."
              skill: desde_hace
            - q: "Как в тексте сказано «не бояться ошибок»?"
              a: "no tener miedo de los errores"
              explain: "Lo mejor es hablar mucho y no tener miedo de los errores."
      - choose:
          title: Новые слова
          free: true
          rule: none
          items:
            - say: "Escucho canciones a menudo."
              options: "Я часто слушаю песни. | Я иногда пою песни. | Я никогда не слушаю песни."
              explain: "A menudo — «часто», canciones — «песни»."
              noaudio: {q: "Что значит «Escucho canciones a menudo»?", options: "Я часто слушаю песни. | Я иногда пою песни. | Я никогда не слушаю песни."}
            - q: "Mis ___ de clase son de China y de Italia."
              options: "compañeros | consejos | errores"
              explain: "Compañeros de clase — одногруппники."
            - q: "La ___ de Olga es muy bonita: vive en Valencia y trabaja en un hospital."
              options: "historia | letra | dirección"
              explain: "La historia — история, рассказ о человеке."
      - compose:
          title: Mi historia
          free: true
          rule: none
          skill: [desde_hace, para_porque, me_cuesta]
          items:
            - q: "Напишите свою историю, 4–5 фраз: кто вы и откуда · давно ли учите испанский · зачем · что вам трудно · что вам помогает."
              format: "Me llamo… Hace … que estudio español…"
              words: [25, 90]
              sentences: 4
              checks:
                - label: "давно ли: есть desde или hace"
                  any: [desde, hace]
                - label: "зачем: есть para или porque"
                  any: [para, porque]
                - label: "что трудно: me cuesta или me cuestan"
                  any: [me cuesta, me cuestan]
              sample: "Me llamo Irina y soy de Leópolis. Hace un año que estudio español. Estudio español porque vivo en Madrid y para hablar con la gente. Me cuesta entender a la gente cuando habla rápido. Para practicar, veo series en español."
              sample_ru: "Меня зовут Ирина, я из Львова. Я учу испанский уже год. Учу испанский, потому что живу в Мадриде, и чтобы разговаривать с людьми. Мне трудно понимать людей, когда они говорят быстро. Для практики я смотрю сериалы на испанском."

