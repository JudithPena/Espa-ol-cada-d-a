              write: "Tengo treinta años | Treinta (años) | Tengo 30 años | 30 (años)"
              format: возраст
              mistakes:
                "soy treinta años": "Возраст — с глаголом **tener**: Tengo treinta años."
            - say: "¿De dónde es? | Откуда вы?"
              task: "Вы из Украины."
              write: "Soy de Ucrania | (Yo) soy [ucraniano/ucraniana] | De Ucrania"
              format: откуда вы
            - say: "¿Cuánto tiempo hace que estudia español? | Как давно вы учите испанский?"
              task: "Вы учите испанский год."
              write: "Hace un año | Hace un año que estudio español | Estudio español desde hace un año | Desde hace un año | Un año"
              format: срок
              skill: desde_hace
              mistakes:
