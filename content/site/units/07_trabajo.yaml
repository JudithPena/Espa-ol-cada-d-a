id: trabajo
number: 7
level: A0
title: Профессии и работа
goals:
  - рассказать, кем и где вы работаете или учитесь
  - спрягать глаголы на -ar во всех лицах
  - говорить «мы», «вы» и «они»

lessons:
  - id: vocab1
    kind: vocab
    title: ¿A qué te dedicas?
    goal: спросить, кем человек работает, и назвать профессию
    version: 3
    vocab:
      - "💼 ¿A qué te dedicas? [а кэ тэ дэди́кас] — чем ты занимаешься? кем работаешь?"
      - "👨‍🏫 el profesor / la profesora [профэсо́р, профэсо́ра] — преподаватель, учитель(ница)"
      - "👩‍⚕️ el médico / la médica [мэ́дико, мэ́дика] — врач"
      - "🎓 el/la estudiante [эстудья́нтэ] — студент, студентка"
      - "🍽 el camarero / la camarera [камарэ́ро, камарэ́ра] — официант, официантка"
      - "👷 el ingeniero / la ingeniera [инхэнье́ро, инхэнье́ра] — инженер"
      - "💻 el programador / la programadora [програмадо́р, програмадо́ра] — программист(ка)"
    blocks:
      - "Посмотрите на примеры: чего в них не хватает по сравнению с фразой «Es un libro»?"
      - examples:
          items:
            - "¿A qué te dedicas? Soy profesora. — Кем ты работаешь? Я учительница."
            - "Pablo es médico. — Пабло врач."
      - learn: ["¿A qué te dedicas?", el profesor / la profesora, el médico / la médica, el/la estudiante]
      - rule:
          id: no_article
          text: "Если профессию называют после глагола **ser**, то артикль не ставится: _Soy profesora._ _Pablo es médico._ _Ana es estudiante._ Сказать `Soy una profesora` — ошибка."
      - choose:
          title: Как сказать?
          skill: profession
          items:
            - q: "Я учительница."
              options: "Soy profesora. | Soy una profesora. | Soy profesor."
              explain: "После ser профессию называют без артикля; женщина — profesora."
            - lines: ["Pablo: ¿A qué te dedicas?"]
              q: "Вы студент."
              options: "Soy estudiante. | Soy un estudiante. | Eres estudiante."
      - learn: [el camarero / la camarera, el ingeniero / la ingeniera, el programador / la programadora]
      - tip:
          id: fem
          text: |
            Женский род профессий образуется знакомым способом.
            1. **-o** меняется на **-a**: médic**a**, camarer**a**, ingenier**a**.
            2. После согласной добавляется **-a**: profesor**a**, programador**a**.
            3. **estudiante** — одно слово для всех, меняется только артикль: _el estudiante, la estudiante_.
      - sort:
          title: Кто это — Пабло или Ана?
          skill: profession
          groups:
            "👨 Pablo es…": [médico, profesor, ingeniero]
            "👩 Ana es…": [camarera, programadora, médica]
            "👫 и Пабло, и Ана": [estudiante]
      - write:
          title: Traduce
          format: фраза о профессии по-испански
          rule: no_article
          skill: profession
          items:
            - q: "Я программист."
              a: "Soy programador | Soy programadora | Yo soy programador | Yo soy programadora"
              explain: "По-русски род не виден: мужчина скажет programador, женщина — programadora."
              mistakes: {"soy un programador": "После ser профессию называют без артикля: **Soy programador**.", "soy una programadora": "После ser профессию называют без артикля: **Soy programadora**."}
            - q: "Она врач."
              a: "Es médica | Ella es médica"
              mistakes: {"ella es médico": "О женщине — médic**a**: Ella es médica.", "es médico": "О женщине — médic**a**: Es médica.", "es una médica": "После ser профессию называют без артикля: **Es médica**."}
            - q: "Карлос официант."
              a: "Carlos es camarero"
              mistakes: {"carlos es un camarero": "После ser профессию называют без артикля: **Carlos es camarero**."}
      - choose:
          title: Послушайте и выберите
          skill: profession
          items:
            - say: "Ella es médica."
              options: "Она врач. | Он врач. | Она учительница."
              noaudio: {q: "Что значит «Ella es médica.»?", options: "Она врач. | Он врач. | Она учительница."}
            - say: "Soy camarero."
              options: "Я официант. | Я официантка. | Он официант."
              noaudio: {q: "Что значит «Soy camarero.»?", options: "Я официант. | Я официантка. | Он официант."}

  - id: vocab2
    kind: vocab
    title: ¿Dónde trabajas?
    goal: сказать, где вы работаете или учитесь
    version: 2
    vocab:
      - "🛠 trabajar [трабаха́р] — работать {forms: trabajo trabajas trabaja} :: Trabajo en una oficina. — Я работаю в офисе."
      - "📚 estudiar [эстудья́р] — учиться; изучать {forms: estudio estudias estudia} :: Estudio español. — Я изучаю испанский."
      - "🏥 el hospital [оспита́ль] — больница"
      - "🏫 la escuela [эскуэ́ла] — школа"
      - "🏢 la oficina [офиθи́на] — офис"
      - "🍴 el restaurante [рэстаура́нтэ] — ресторан"
      - "🏛 la universidad [унибэрсида́д] — университет"
    blocks:
      - text:
          id: en_place
          text: "Чтобы сказать, где вы работаете или учитесь, поставьте перед местом **en**: _Trabajo en una oficina._ _Estudio en la universidad._"
      - learn: [trabajar, estudiar]
      - tip: "**Estudiar** — и «учиться», и «изучать». _Estudio en la universidad_ — «я учусь в университете», а _Estudio español_ — «я изучаю испанский»."
      - choose:
          title: Traduce
          skill: trabajar_en
          items:
            - q: "Estudio español."
              options: "Я изучаю испанский. | Я учусь в Испании. | Я говорю по-испански."
      - learn: [el hospital, la escuela, la oficina, el restaurante, la universidad]
      - match:
          title: Соедините пары
          pairs:
            - "el hospital — больница"
            - "la escuela — школа"
            - "la oficina — офис"
            - "el restaurante — ресторан"
            - "la universidad — университет"
      - choose:
          title: Responde
          skill: trabajar_en
          items:
            - q: "Marta es profesora. ¿Dónde trabaja?"
              options: "Trabaja en una escuela. | Trabaja en un hospital. | Trabaja en un restaurante."
            - q: "Javier es médico. ¿Dónde trabaja?"
              options: "Trabaja en un hospital. | Trabaja en una escuela. | Estudia en la universidad."
            - say: "Pablo es camarero. Trabaja en un restaurante."
              options: "Пабло официант в ресторане. | Пабло повар в ресторане. | Пабло работает в офисе."
              noaudio: {q: "Что значит «Pablo es camarero. Trabaja en un restaurante»?", options: "Пабло официант в ресторане. | Пабло повар в ресторане. | Пабло работает в офисе."}
      - write:
          title: Traduce
          format: фраза по-испански
          rule: en_place
          skill: trabajar_en
          items:
            - q: "Я работаю в офисе."
              a: "Trabajo en una oficina | Trabajo en la oficina | Yo trabajo en una oficina | Yo trabajo en la oficina"
              mistakes: {"trabajo en oficina": "Перед местом нужен артикль: en **una** oficina.", "trabajo una oficina": "Перед местом нужно **en**: trabajo **en** una oficina."}
            - q: "Ана учится в университете."
              a: "Ana estudia en la universidad | Ana estudia en una universidad"
              mistakes: {"ana estudio en la universidad": "Estudio — «я учусь». Об Ане — **estudia**."}
    forms: [estudias, trabajas]

  - id: presente
    kind: grammar
    title: "Мы, вы, они: глаголы на -ar"
    goal: сказать «мы работаем», «вы говорите», «они учатся»
    version: 3
    unlocks: [present_ar]
    vocab:
      - "👫 nosotros / nosotras [носо́трос, носо́трас] — мы"
      - "👥 vosotros / vosotras [босо́трос, босо́трас] — вы (группе, неформально)"
      - "👨‍👨‍👦 ellos [э́йос] — они (мужчины или смешанная группа)"
      - "👩‍👩‍👧 ellas [э́йас] — они (только женщины)"
      - "🎩 ustedes [устэ́дэс] — вы (вежливо, группе)"
    blocks:
      - "Посмотрите на один глагол в разных лицах. Какая часть не меняется, а какая меняется?"
      - examples:
          items:
            - "Yo trabajo en una oficina. — Я работаю в офисе."
            - "Nosotros trabajamos en un restaurante. — Мы работаем в ресторане."
            - "Ellos trabajan en casa. — Они работают дома."
      - learn: [nosotros / nosotras, vosotros / vosotras, ellos, ellas, ustedes]
      - compare:
          id: pronouns
          title: Мы и вы
          cards:
            - head: nosotros / nosotras
              label: «мы»
              tone: blue
              text: '**nosotras** — если в группе только женщины; если есть хоть один мужчина — **nosotros**.'
              ex: ["Nosotros hablamos ucraniano.", "Nosotras somos estudiantes."]
            - head: vosotros / vosotras
              label: неформальное «вы»
              tone: sun
              text: 'Так обращаются к друзьям и знакомым. Правило то же: **vosotras** — только женщинам.'
              ex: ["¿Vosotros habláis inglés?"]
      - compare:
          title: Они и вежливое «вы»
          cards:
            - head: ellos / ellas
              label: «они»
              tone: mint
              text: '**ellas** — только женщины, иначе **ellos**.'
              ex: ["Ellos son médicos.", "Ellas son profesoras."]
            - head: ustedes
              label: вежливое «вы» группе
              tone: rose
              text: 'Глагол — как с **ellos**: _ustedes trabajan_, _ustedes son_.'
              ex: ["¿Ustedes hablan español?"]
      - choose:
          title: Кто это?
          skill: pronouns_plural
          items:
            - q: "Лусия и Ольга говорят о себе: «мы»."
              options: "nosotras | nosotros | ellas"
            - q: "Вы говорите о Диего и Ане: «они»."
              options: "ellos | ellas | nosotros"
              explain: "В группе есть мужчина (Диего), поэтому ellos."
            - q: "Вы вежливо обращаетесь к двум сеньорам."
              options: "ustedes | vosotros | usted"
      - header: Окончания -ar
      - rule:
          id: ar
          text: "Отбросьте у глагола **-ar** и добавьте окончание лица: **-o, -as, -a, -amos, -áis, -an**. Из trabajar — trabaj**o**, trabaj**amos**, trabaj**an**; из hablar — habl**amos**; из estudiar — estudi**áis**."
      - conjugation:
          verb: trabajar
          ru: работать
      - more:
          title: 🌎 А в Латинской Америке?
          text: "**Vosotros** там не используют: к любой группе — и к друзьям, и к незнакомым — обращаются **ustedes**: _¿Ustedes son estudiantes?_"
      - write:
          title: Вставьте форму глагола
          format: одна форма глагола
          skill: present_ar
          items:
            - "Nosotros ___ (hablar) español. => hablamos"
            - "¿Vosotros ___ (estudiar) inglés? => estudiáis"
            - "Ellas ___ (trabajar) en una oficina. => trabajan"
            - q: "Ustedes ___ (hablar) muy bien."
              a: hablan
              explain: "С ustedes — та же форма, что с ellos: hablan."
      - header: "Глагол ser полностью"
      - conjugation:
          verb: ser
          ru: быть
          highlight: false
          forms: [soy, eres, es, somos, sois, son]
      - "**Ser** спрягается не по правилу — формы нужно запомнить: _Nosotros somos estudiantes._ _¿Vosotros sois de Madrid?_ _Ellas son médicas._"
      - choose:
          title: Выберите форму ser
          skill: ser_forms
          items:
            - q: "Nosotras ___ estudiantes."
              options: "somos | son | sois"
            - q: "¿Vosotros ___ de Madrid?"
              options: "sois | son | somos"
            - q: "Ellas ___ médicas."
              options: "son | sois | es"
      - choose:
          title: Послушайте и выберите
          skill: present_ar
          items:
            - say: "Nosotros trabajamos en una oficina."
              options: "Мы работаем в офисе. | Они работают в офисе. | Вы работаете в офисе."
              noaudio: {q: "Что значит «Nosotros trabajamos en una oficina.»?", options: "Мы работаем в офисе. | Они работают в офисе. | Вы работаете в офисе."}
            - say: "¿Vosotros habláis inglés?"
              options: "Вы (друзья) говорите по-английски? | Они говорят по-английски? | Мы говорим по-английски?"
              noaudio: {q: "Что значит «¿Vosotros habláis inglés?»?", options: "Вы (друзья) говорите по-английски? | Они говорят по-английски? | Мы говорим по-английски?"}

  - id: lectura
    kind: reading
    title: Mis amigos y su trabajo
    goal: понять текст о том, кто где работает
    version: 3
    vocab:
      - "📰 el/la periodista [пэрьоди́ста] — журналист(ка)"
      - "⚖️ el abogado / la abogada [абога́до, абога́да] — юрист, адвокат"
      - "💉 el enfermero / la enfermera [энфэрмэ́ро, энфэрмэ́ра] — медбрат, медсестра"
      - "👨‍🍳 el cocinero / la cocinera [коθинэ́ро, коθинэ́ра] — повар"
      - "💪 mucho [му́чо] — много :: Trabajo mucho. — Я много работаю."
    blocks:
      - learn: [el/la periodista, el abogado / la abogada, el enfermero / la enfermera, el cocinero / la cocinera, mucho]
      - match:
          title: Соедините пары
          pairs:
            - "el periodista — журналист"
            - "la abogada — юрист"
            - "la enfermera — медсестра"
            - "el cocinero — повар"
      - reading:
          id: marta
          title: Mis amigos y su trabajo
          text: |
            Me llamo Marta y soy profesora. Trabajo en una escuela en Sevilla.

            Mi amigo Javier es médico y trabaja en un hospital. Su amiga Rosa también trabaja en el hospital: es enfermera.

            Mis amigas Laura y Carmen son periodistas. Trabajan en Madrid, pero viven en Toledo.

            Mi amigo Diego es estudiante. Estudia en la universidad y también trabaja: es camarero en un restaurante.

            ¿Y yo? Yo trabajo mucho, pero también estudio. ¡Estudio inglés!
          translation: |
            Меня зовут Марта, я учительница. Работаю в школе в Севилье.

            Мой друг Хавьер — врач, работает в больнице. Его подруга Роса тоже работает в больнице: она медсестра.

            Мои подруги Лаура и Кармен — журналистки. Работают в Мадриде, но живут в Толедо.

            Мой друг Диего — студент. Учится в университете и ещё работает: он официант в ресторане.

            А я? Я много работаю, но и учусь тоже. Изучаю английский!
      - more:
          title: el periodista, la periodista
          text: "**Periodista** заканчивается на `-a`, но слово одно для мужчин и женщин, меняется только артикль: _Pablo es periodista._ _Laura y Carmen son periodistas._"
      - choose:
          title: Responde
          source: marta
          rule: none
          skill: trabajar_en
          items:
            - q: "¿Dónde trabaja Javier?"
              options: "En un hospital. | En una escuela. | En un restaurante."
            - q: "¿Qué es Rosa?"
              options: "Es enfermera. | Es médica. | Es periodista."
            - q: "¿Dónde viven Laura y Carmen?"
              options: "En Toledo. | En Madrid. | En Sevilla."
              explain: "Trabajan en Madrid, pero viven en Toledo."
            - q: "Марта говорит: «Yo trabajo ___, pero también estudio»."
              options: "mucho | muy | también"
              explain: "Trabajo mucho — «я много работаю». Muy ставят перед словом-описанием: muy bien."
            - q: "¿Diego trabaja o estudia?"
              options: "Estudia y también trabaja. | Estudia, pero no trabaja. | Trabaja, pero no estudia."
      - choose:
          title: Послушайте и выберите
          free: true
          skill: profession
          items:
            - say: "Rosa es enfermera y trabaja en un hospital."
              options: "Роса медсестра и работает в больнице. | Роса врач и работает в больнице. | Роса медсестра и работает в школе."
              noaudio: {q: "Что значит «Rosa es enfermera y trabaja en un hospital.»?", options: "Роса медсестра и работает в больнице. | Роса врач и работает в больнице. | Роса медсестра и работает в школе."}
            - say: "Trabajo mucho."
              options: "Я много работаю. | Я много учусь. | Я немного работаю."
              noaudio: {q: "Что значит «Trabajo mucho.»?", options: "Я много работаю. | Я много учусь. | Я немного работаю."}
    forms: [viven]
    quiz:
      - q: ¿Dónde trabajan Laura y Carmen?
        options: "En Madrid. | En Toledo. | En Sevilla."
        source: marta
        skill: trabajar_en
        explain: "В тексте сказано: Trabajan en Madrid, pero viven en Toledo. Значит, работают они в Мадриде, а живут в Толедо."
      - q: ¿Qué estudia Marta?
        options: "inglés | español | francés"
        explain: "¡Estudio inglés! — Марта изучает английский."
        source: marta

  - id: dialogo
    kind: dialogue
    title: ¿Sois estudiantes?
    goal: обратиться к группе людей на «вы» — vosotros и ustedes
    version: 3
    blocks:
      - "Это разговор на вечеринке. Посмотрите, как обращаются к группе людей."
      - dialogue:
          id: party
          lines:
            - "Lucía: Hola, ¿sois estudiantes? | Привет, вы студенты?"
            - "Diego: Sí, somos estudiantes. Estudiamos en la universidad. ¿Y vosotras? | Да, мы студенты. Учимся в университете. А вы?"
            - "Lucía: Nosotras trabajamos. Yo soy abogada y Olga es enfermera. | Мы работаем. Я юрист, а Ольга медсестра."
            - "Diego: ¿Dónde trabajáis? | Где вы работаете?"
            - "Olga: Lucía trabaja en una oficina y yo trabajo en un hospital. | Лусия работает в офисе, а я в больнице."
            - "Diego: ¿Y habláis inglés? | А вы говорите по-английски?"
            - "Olga: Sí, hablamos inglés y un poco de francés. ¿Y vosotros? | Да, говорим по-английски и немного по-французски. А вы?"
            - "Diego: Nosotros hablamos inglés y estudiamos alemán. | Мы говорим по-английски и учим немецкий."
      - choose:
          title: Responde
          source: party
          items:
            - q: "¿Qué es Olga?"
              options: "Es enfermera. | Es abogada. | Es estudiante."
              explain: "Lucía: Yo soy abogada y Olga es enfermera."
            - q: "¿Dónde trabaja Lucía?"
              options: "En una oficina. | En un hospital. | En la universidad."
            - q: "¿Qué estudian Diego y su amigo?"
              options: "Alemán. | Inglés. | Francés."
              explain: "Diego: Nosotros hablamos inglés y estudiamos alemán."
      - choose:
          title: Что ответить?
          free: true
          skill: ser_forms
          items:
            - lines: ["Diego: ¿Sois estudiantes?"]
              q: "Вы с подругой — студентки."
              options: "Sí, somos estudiantes. | Sí, sois estudiantes. | Sí, son estudiantes."
              explain: "О себе и подруге — «мы»: somos."
      - write:
          title: "Скажите вежливо: ustedes вместо vosotros"
          format: вопрос по-испански
          free: true
          skill: pronouns_plural
          items:
            - "¿Sois estudiantes? => ¿Ustedes son estudiantes? | ¿Son ustedes estudiantes? | ¿Son estudiantes?"
            - "¿Habláis inglés? => ¿Ustedes hablan inglés? | ¿Hablan ustedes inglés? | ¿Hablan inglés?"
      - build:
          title: "Скажите вежливо: ustedes вместо vosotros"
          free: true
          skill: pronouns_plural
          items:
            - es: "¿Dónde trabajan ustedes?"
              ru: "¿Dónde trabajáis? → вежливо: «Где вы работаете?»"
              extra: [trabajáis]

  - id: practica
    kind: practice
    title: Глаголы на -ar
    goal: рассказать, кто чем занимается, — работаем, учимся, готовим
    version: 3
    vocab:
      - "🎧 escuchar [эскуча́р] — слушать :: Escucho música. — Я слушаю музыку."
      - "🍳 cocinar [коθина́р] — готовить (еду)"
    blocks:
      - write:
          title: Исправьте ошибку
          format: исправленная фраза целиком
          skill: present_ar
