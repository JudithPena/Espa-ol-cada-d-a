id: me_encuentro_mal
number: 36
level: A2
title: Me encuentro mal — мне нехорошо
goals:
  - рассказать, что болит и как вы себя чувствуете
  - понять совет врача и посоветовать самому
  - вежливо попросить: me gustaría, ¿podría…?
  - купить лекарство в аптеке

# Тема 13 карты A2: вежливое условное — me gustaría, podrías, deberías; doler (повторение); здоровье, аптека.
# Миссия — приём у врача и аптека. В A1 (тема 20) уже были тело, doler, tener fiebre, el resfriado, la pastilla,
# tome, la receta, ¡Que se mejore!
lessons:
  - id: consulta
    kind: listening
    title: "¿Qué le pasa?"
    goal: понять на слух разговор у врача
    version: 2
    # Карта экранов: docs/site_slide_maps/36_me_encuentro_mal.md
    unlocks: [conditional]
    vocab:
      - "🤒 encontrarse [энконтра́рсэ] — чувствовать себя :: Hoy me encuentro mal. — Сегодня мне нехорошо."
      - "😷 la tos [тос] — кашель :: Tengo mucha tos. — У меня сильный кашель."
      - "🤧 la gripe [гри́пэ] — грипп :: Tengo la gripe. — У меня грипп."
      - "🧴 el jarabe [хара́бэ] — сироп (лекарство) :: Tome este jarabe para la tos. — Принимайте этот сироп от кашля."
      - "😣 el dolor [доло́р] — боль :: Tengo dolor de garganta. — У меня болит горло."
      - "😵 mareado/a [марэа́до, марэа́да] — с головокружением :: Estoy mareada. — У меня кружится голова."
      - "☝️ deber [дэбэ́р] — быть должным (debería — стоило бы) :: Deberías descansar. — Тебе стоило бы отдохнуть."
    blocks:
      - "Том заболел и пришёл к врачу. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: medica
          hidden: true
          lines:
            - "Médica: Buenos días. Pase, pase. ¿Qué le pasa? | Доброе утро. Проходите, проходите. Что с вами?"
            - "Tom: Me encuentro muy mal. Tengo tos y mucho dolor de garganta. | Мне очень плохо. Кашель и сильно болит горло."
            - "Médica: ¿Desde cuándo? | С каких пор?"
            - "Tom: Desde el lunes. Y anoche tuve fiebre: treinta y ocho y medio. | С понедельника. А вчера вечером была температура: тридцать восемь с половиной."
            - "Médica: ¿Le duele la cabeza? ¿Está mareado? | Голова болит? Кружится?"
            - "Tom: Me duele un poco la cabeza, pero no estoy mareado. | Голова немного болит, но не кружится."
            - "Médica: Es la gripe. Debería quedarse en casa tres o cuatro días y beber mucha agua. Tome este jarabe para la tos tres veces al día. | Это грипп. Вам стоило бы побыть дома три-четыре дня и пить много воды. Принимайте этот сироп от кашля три раза в день."
            - "Tom: Muchas gracias. | Большое спасибо."
            - "Médica: De nada. ¡Que se mejore! | Не за что. Выздоравливайте!"
      - choose:
          title: Что вы поняли?
          source: medica
          items:
            - q: "Что болит у Тома?"
              options: "La garganta. | El estómago. | La espalda."
              explain: "Том говорит о горле — garganta."
            - q: "С какого дня он болеет?"
              options: "Desde el lunes. | Desde ayer. | Desde el domingo."
              explain: "Tom: Desde el lunes."
      - learn: [encontrarse, la tos, la gripe, el jarabe, el dolor, mareado/a]
      - learn: [deber]
      - choose:
          title: Детали разговора
          source: medica
          items:
            - q: "¿Tuvo fiebre Tom anoche?"
              options: "Sí, treinta y ocho y medio. | No, no tuvo fiebre. | Sí, treinta y siete."
              explain: "Tom: Anoche tuve fiebre: treinta y ocho y medio."
            - q: "¿Está mareado?"
              options: "No, solo le duele un poco la cabeza. | Sí, mucho. | No, pero le duele el estómago."
              explain: "Tom: Me duele un poco la cabeza, pero no estoy mareado."
            - q: "¿Qué tiene Tom?"
              options: "La gripe. | Un resfriado. | Dolor de estómago."
              explain: "Médica: Es la gripe."
            - q: "¿Qué debería hacer Tom?"
              options: "Quedarse en casa y beber mucha agua. | Ir al trabajo y descansar después. | Tomar el jarabe una vez a la semana."
              explain: "Médica: Debería quedarse en casa tres o cuatro días y beber mucha agua."
      - text:
          id: notice
          slide: new
          text: "Врач советует вежливо: **debería** quedarse en casa — «вам стоило бы остаться дома». Это **condicional** — форма для мягких советов и вежливых просьб."
      - examples:
          items:
            - "**Debería** quedarse en casa. — Вам стоило бы остаться дома."
            - "**Me gustaría** un jarabe para la tos. — Я бы хотел сироп от кашля."
            - "¿**Podría** repetir? — Не могли бы вы повторить?"
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "la tos — кашель"
            - "la gripe — грипп"
            - "el jarabe — сироп"
            - "el dolor — боль"
            - "mareado — с головокружением"
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: sintomas
          rule: none
          items:
            - say: "Me encuentro mal: tengo tos y fiebre."
              a: "Me encuentro mal: tengo tos y fiebre"
              explain: "Me encuentro mal — «мне нехорошо»."
              noaudio: {q: "Напишите по-испански: «Мне нехорошо: у меня кашель и температура».", a: "Me encuentro mal: tengo tos y fiebre | Me encuentro mal, tengo tos y fiebre"}
      - choose:
          title: Что ответить врачу?
          free: true
          skill: sintomas
          rule: none
          items:
            - lines: ["Médica: ¿Qué le pasa?"]
              q: "Скажите, что вам нехорошо и болит голова."
              options: "Me encuentro mal y me duele la cabeza. | Me encuentro mal y me duelo la cabeza. | Me encuentro mal y tengo la cabeza."
              explain: "Болит — me duele la cabeza: doler работает как gustar."
            - say: "Tome este jarabe tres veces al día."
              options: "Принимайте этот сироп три раза в день. | Купите этот сироп в аптеке. | Этот сироп нужно пить раз в три дня."
              explain: "Tome — «принимайте»; tres veces al día — «три раза в день»."
              noaudio: {q: "Что значит «Tome este jarabe tres veces al día»?", options: "Принимайте этот сироп три раза в день. | Купите этот сироп в аптеке. | Этот сироп нужно пить раз в три дня."}
      - build:
          title: Соберите фразу
          free: true
          skill: sintomas
          rule: none
          items:
            - es: "Tengo tos y me duele la garganta."
              ru: "У меня кашель и болит горло."
              extra: [duelo]
            - es: "Hoy me encuentro mejor, pero estoy un poco mareado."
              ru: "Сегодня мне лучше, но немного кружится голова."

  - id: condicional
    kind: grammar
    title: "Me gustaría, ¿podría…?, deberías"
    goal: вежливо попросить и мягко посоветовать
    version: 2
    vocab:
      - "🗣 aconsejar [аконсэха́р] — советовать :: El médico me aconseja descansar. — Врач советует мне отдохнуть."
    blocks:
      - "Condicional делает речь мягче: не «хочу», а «я бы хотел»; не «можешь?», а «не мог бы ты?»; не «ты должен», а «тебе стоило бы»."
      - learn: [aconsejar]
      - table:
          id: usos
          title: Вежливая просьба и мягкий совет
          rows:
            - ["me gustaría + инфинитив", "Me gustaría hablar con la médica. — Я бы хотел поговорить с врачом."]
            - ["¿podría(s) + инфинитив?", "¿Podrías cerrar la ventana? — Не мог бы ты закрыть окно?"]
            - ["debería(s) + инфинитив", "Deberías descansar más. — Тебе стоило бы больше отдыхать."]
      - table:
          id: formas
          slide: new
          title: Как образуется condicional
          rows:
            - ["инфинитив + -ía, -ías, -ía, -íamos, -íais, -ían", "hablaría, comería, viviría"]
            - ["poder → podr-", "podría, podrías, podríamos"]
            - ["tener → tendr-, querer → querr-", "tendría, querría"]
            - ["hacer → har-, decir → dir-", "haría, diría"]
            - ["salir → saldr-, venir → vendr-, poner → pondr-, saber → sabr-", "saldría, vendría, pondría, sabría"]
      - write:
          title: Поставьте в condicional
          format: одна форма глагола
          accents: strict
          skill: condicional
          rule: formas
          items:
            - q: "Me (gustar) ___ un café, por favor."
              a: "gustaría"
              explain: "Gustar → me gustaría."
              mistakes:
                "gustaria": "Нужен знак ударения: gustar**í**a."
            - q: "(tú, deber) ___ dormir más."
              a: "Deberías"
              explain: "Tú — deberías."
            - q: "¿(usted, poder) ___ hablar más despacio?"
              a: "Podría"
              explain: "Poder → `podr-` + `-ía`: podría."
              mistakes:
                "podería": "У poder особая основа: **podría**."
            - q: "¿(tú, poder) ___ ayudarme con la maleta?"
              a: "Podrías"
              explain: "Tú — podrías."
            - q: "Yo no (decir) ___ eso."
              a: "diría"
              explain: "Decir → `dir-` + `-ía`: diría."
      - choose:
          title: Как сказать вежливо?
          skill: condicional
          rule: usos
          items:
            - q: "Вы в магазине. Как вежливо сказать, что хотите посмотреть свитер?"
              options: "Me gustaría ver ese jersey. | Me gusta ver ese jersey. | Me gustó ver ese jersey."
              explain: "Я бы хотел — me gustaría."
            - q: "Как спросить у друга совета?"
              options: "¿Qué me aconsejas? | ¿Qué me aconsejo? | ¿Qué te aconsejas?"
              explain: "Ты мне советуешь — me aconsejas."
            - q: "Друг всё время устаёт. Как мягко посоветовать ему больше спать?"
              options: "Deberías dormir más. | Debes a dormir más. | Dormirías más."
              explain: "Мягкий совет — deberías + инфинитив."
            - say: "Deberías ir al médico: tienes muy mala cara."
              options: "Тебе стоило бы сходить к врачу: ты плохо выглядишь. | Тебе нужно было сходить к врачу вчера. | Ты ходил к врачу? Выглядишь лучше."
              explain: "Deberías ir — «тебе стоило бы пойти»; tener mala cara — «плохо выглядеть»."
              noaudio: {q: "Что значит «Deberías ir al médico: tienes muy mala cara»?", options: "Тебе стоило бы сходить к врачу: ты плохо выглядишь. | Тебе нужно было сходить к врачу вчера. | Ты ходил к врачу? Выглядишь лучше."}
      - build:
          title: Соберите фразу
          skill: condicional
          rule: usos
          items:
            - es: "Me gustaría hablar con la médica, por favor."
              ru: "Я бы хотел поговорить с врачом, пожалуйста."
              extra: [gusta]
            - es: "¿Podrías hablar más despacio?"
              ru: "Не мог бы ты говорить помедленнее?"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: condicional
          rule: usos
          items:
            - q: "Тебе стоило бы отдохнуть."
              a: "Deberías descansar | (Tú) deberías descansar"
              explain: "Мягкий совет — deberías."
            - q: "Не могли бы вы мне помочь? (на «вы»)"
              a: "¿Podría ayudarme? | ¿Me podría ayudar? | ¿Podría ayudarme, por favor? | ¿Me podría ayudar, por favor?"
              explain: "Вежливая просьба — ¿podría…?"
              mistakes:
                "podrías ayudarme": "Podrías — на «ты». На «вы» — **¿Podría…?**"
      - compose:
          title: Вежливо
          skill: condicional
          rule: usos
          items:
            - q: "Напишите две вежливые просьбы и один мягкий совет — с me gustaría, ¿podría(s)…? и deberías."
              format: "Me gustaría… ¿Podrías…? Deberías…"
              words: [10, 50]
              sentences: 2
              checks:
                - label: "me gustaría…"
                  any: [gustaría]
                - label: "¿podría…? или ¿podrías…?"
                  any: [podría, podrías]
                - label: "debería(s)…"
                  any: [debería, deberías, deberíamos]
              sample: "Me gustaría una mesa para dos. ¿Podrías llamar al restaurante? Y deberías salir antes: hay mucho tráfico."
              sample_ru: "Я бы хотел столик на двоих. Не мог бы ты позвонить в ресторан? И тебе стоило бы выйти пораньше: много машин."
    quiz:
      - q: "Me ___ ir a la playa este fin de semana."
        options: "gustaría | gusto | gustarías"
        explain: "Я бы хотел — me gustaría."
        skill: condicional
      - q: "¿___ cerrar la puerta, por favor? (на «ты»)"
        options: "Podrías | Podría | Puedería"
        explain: "Tú — podrías."
        skill: condicional

  - id: consejos
    kind: dialogue
    title: "Deberías descansar"
    goal: понять совет о здоровье и дать совет другу
    version: 2
    vocab:
      - "🥗 sano/a [са́но, са́на] — здоровый; полезный :: Como sano: mucha fruta y verdura. — Я питаюсь здорово: много фруктов и овощей."
      - "❤️ la salud [салу́д] — здоровье :: El deporte es bueno para la salud. — Спорт полезен для здоровья."
      - "🏃 el ejercicio [эхэрθи́θьо] — физические упражнения :: Hago ejercicio tres veces por semana. — Я занимаюсь спортом три раза в неделю."
      - "🤯 el estrés [эстрэ́с] — стресс :: Tengo mucho estrés en el trabajo. — У меня много стресса на работе."
    blocks:
      - learn: [sano/a, la salud, el ejercicio, el estrés]
      - "Диего жалуется Ольге — она медсестра."
      - dialogue:
          id: olga
          lines:
            - "Diego: Olga, esta semana duermo muy mal y siempre estoy cansado. | Ольга, на этой неделе я очень плохо сплю и всё время уставший."
            - "Olga: ¿Tienes mucho trabajo? | У тебя много работы?"
            - "Diego: Sí, mucho. Y tomo cinco cafés al día. | Да, много. И пью пять чашек кофе в день."
            - "Olga: Es el estrés. No deberías tomar tanto café. Y deberías hacer ejercicio: es muy bueno para la salud. | Это стресс. Тебе не стоило бы пить столько кофе. И тебе стоило бы заниматься спортом: это очень полезно для здоровья."
            - "Diego: Es que no tengo tiempo… | Просто у меня нет времени…"
            - "Olga: Entonces pasea media hora al día. Y apaga el móvil una hora antes de dormir. Es importante dormir ocho horas. | Тогда гуляй полчаса в день. И выключай телефон за час до сна. Важно спать восемь часов."
      - choose:
          title: Что советует Ольга?
          source: olga
          skill: consejos_salud
          items:
            - q: "¿Qué problema tiene Diego?"
              options: "Duerme mal y está cansado. | Le duele la cabeza. | Tiene fiebre y tos."
              explain: "Diego: Esta semana duermo muy mal y siempre estoy cansado."
            - q: "¿Qué no debería hacer Diego?"
              options: "Tomar tanto café. | Hacer ejercicio. | Dormir ocho horas."
              explain: "Olga: No deberías tomar tanto café."
            - q: "¿Qué tiene que hacer una hora antes de dormir?"
              options: "Apagar el móvil. | Tomar un café. | Pasear media hora."
              explain: "Olga: Y apaga el móvil una hora antes de dormir."
      - table:
          id: aconsejar
          slide: new
          title: Как посоветовать
          rows:
            - ["deberías + инфинитив — мягко", "Deberías hacer ejercicio. — Тебе стоило бы заниматься спортом."]
            - ["no deberías + инфинитив", "No deberías tomar tanto café. — Не стоило бы пить столько кофе."]
            - ["tienes que + инфинитив — твёрдо", "Tienes que ir al médico. — Тебе нужно к врачу."]
            - ["es importante + инфинитив", "Es importante dormir ocho horas. — Важно спать восемь часов."]
            - ["императив — прямо", "Pasea media hora al día. — Гуляй полчаса в день."]
      - choose:
          title: Какой совет подходит?
          free: true
          skill: consejos_salud
          rule: aconsejar
          items:
            - lines: ["Ana: Siempre tengo mucho estrés en el trabajo."]
              q: "Посоветуйте ей больше отдыхать."
              options: "Deberías descansar más. | Deberías trabajar más. | Descansaste mucho."
              explain: "Мягкий совет — deberías + инфинитив."
            - lines: ["Pablo: Me duele mucho la muela desde hace una semana."]
              q: "Скажите твёрдо, что ему нужно к врачу."
              options: "Tienes que ir al médico. | Podrías ir al cine. | Me gustaría ir al médico."
              explain: "Твёрдый совет — tienes que…"
            - say: "Es importante comer sano y hacer ejercicio."
              options: "Важно правильно питаться и заниматься спортом. | Важно много есть и мало двигаться. | Здоровая еда важнее спорта."
              explain: "Comer sano — «правильно питаться»; hacer ejercicio — «заниматься спортом»."
              noaudio: {q: "Что значит «Es importante comer sano y hacer ejercicio»?", options: "Важно правильно питаться и заниматься спортом. | Важно много есть и мало двигаться. | Здоровая еда важнее спорта."}
      - write:
          title: Посоветуйте
          format: совет по-испански
          free: true
          skill: consejos_salud
          rule: aconsejar
          items:
            - q: "Другу: «Тебе не стоило бы пить столько кофе»."
              a: "No deberías tomar tanto café | No deberías beber tanto café"
              explain: "No deberías + инфинитив; tanto café."
              mistakes:
                "no deberías tomar tan café": "Перед существительным — **tanto**: tanto café."
            - q: "Другу: «Тебе стоило бы заниматься спортом»."
              a: "Deberías hacer ejercicio | Deberías hacer deporte"
              explain: "Hacer ejercicio — заниматься физическими упражнениями."
      - build:
          title: Соберите фразу
          free: true
          skill: consejos_salud
          rule: aconsejar
          items:
            - es: "El deporte es muy bueno para la salud."
              ru: "Спорт очень полезен для здоровья."
              extra: [sano]
      - compose:
          title: Совет другу
          free: true
          skill: consejos_salud
          rule: aconsejar
          items:
            - q: "Друг пишет: «Всё время устаю и плохо сплю». Дайте ему два-три совета: deberías, tienes que, es importante или императив."
              format: "Deberías… Es importante… No deberías…"
              words: [10, 50]
              sentences: 2
              checks:
                - label: "совет: deberías, tienes que, es importante…"
                  any: [deberías, debería, tienes que, es importante, lo mejor es]
              sample: "Deberías dormir más y hacer ejercicio. No deberías tomar café por la tarde. Y es importante apagar el móvil antes de dormir."
              sample_ru: "Тебе стоило бы больше спать и заниматься спортом. Не стоит пить кофе после обеда. И важно выключать телефон перед сном."

  - id: farmacia
    kind: dialogue
    title: "¿Tiene algo para la tos?"
    goal: купить лекарство и понять, как его принимать
    version: 2
    vocab:
      - "🧴 la crema [кре́ма] — крем, мазь :: Ponte esta crema dos veces al día. — Мажь этот крем два раза в день."
      - "💧 las gotas [го́тас] — капли :: Tome diez gotas antes de dormir. — Принимайте десять капель перед сном."
      - "🙅 no hace falta [но а́θэ фа́льта] — не нужно :: No hace falta receta. — Рецепт не нужен."
      - "🩹 la tirita [тири́та] — пластырь :: ¿Tiene tiritas? — У вас есть пластыри?"
    forms: [ponte]
    blocks:
      - learn: [la crema, las gotas, no hace falta, la tirita]
      - "Ирина в аптеке."
      - dialogue:
          id: en_la_farmacia
          lines:
            - "Farmacéutico: Buenas tardes. ¿Qué necesita? | Добрый день. Что вам нужно?"
            - "Irina: Buenas tardes. Me gustaría algo para el dolor de cabeza. | Добрый день. Мне бы что-нибудь от головной боли."
            - "Farmacéutico: ¿Tiene fiebre? | У вас температура?"
            - "Irina: No, solo dolor de cabeza. | Нет, только голова болит."
