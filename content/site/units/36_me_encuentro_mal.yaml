  - id: lectura
    kind: reading
    title: "Consejos para el invierno"
    goal: понять советы о здоровье и добавить свой
    version: 2
    vocab:
      - "🦠 contagiar [контахья́р] — заразить :: Con gripe puedes contagiar a tus compañeros. — С гриппом можно заразить коллег."
      - "🍊 la vitamina [битами́на] — витамин :: Las naranjas tienen mucha vitamina C. — В апельсинах много витамина C."
      - "⭐ sobre todo [со́брэ то́до] — особенно, прежде всего :: Lávate las manos, sobre todo antes de comer. — Мой руки, особенно перед едой."
    forms: [lávate, quédate]
    blocks:
      - learn: [contagiar, la vitamina, sobre todo]
      - "Ольга, медсестра, пишет в блоге больницы."
      - reading:
          id: invierno
          title: Consejos para el invierno
          text: |
            Soy enfermera y en invierno veo a mucha gente con gripe o resfriado. Aquí tenéis mis consejos.

            Primero, lávate las manos a menudo, sobre todo antes de comer. Segundo, come fruta y verdura todos los días: las naranjas tienen mucha vitamina C. Tercero, duerme siete horas o más. Cuarto, haz ejercicio, pero no cuando tienes fiebre.

            Y una cosa más: si tienes gripe, quédate en casa. No deberías ir al trabajo, porque puedes contagiar a tus compañeros. Si te encuentras muy mal o tienes fiebre alta más de tres días, ve al médico.
          translation: |
            Я медсестра, и зимой вижу много людей с гриппом или простудой. Вот мои советы.

            Во-первых, часто мойте руки, особенно перед едой. Во-вторых, ешьте фрукты и овощи каждый день: в апельсинах много витамина C. В-третьих, спите семь часов или больше. В-четвёртых, занимайтесь спортом, но не тогда, когда у вас температура.

            И ещё одно: если у вас грипп, оставайтесь дома. Не стоит ходить на работу, потому что можно заразить коллег. Если вам очень плохо или высокая температура держится больше трёх дней, идите к врачу.
      - choose:
          title: Что советует Ольга?
          source: invierno
          items:
            - q: "¿Cuándo es importante lavarse las manos?"
              options: "Sobre todo antes de comer. | Sobre todo después de dormir. | Solo por la noche."
              explain: "…lávate las manos a menudo, sobre todo antes de comer."
            - q: "¿Por qué son buenas las naranjas?"
              options: "Tienen mucha vitamina C. | Son baratas. | Se comen en invierno."
              explain: "…las naranjas tienen mucha vitamina C."
            - q: "¿Qué no deberías hacer si tienes gripe?"
              options: "Ir al trabajo. | Quedarte en casa. | Dormir mucho."
              explain: "No deberías ir al trabajo, porque puedes contagiar a tus compañeros."
              skill: consejos_salud
            - q: "¿Cuándo hay que ir al médico?"
              options: "Si tienes fiebre alta más de tres días. | Si tienes un poco de tos. | Si no duermes ocho horas."
              explain: "Si te encuentras muy mal o tienes fiebre alta más de tres días, ve al médico."
      - sort:
          title: Стоит или не стоит?
          source: invierno
          skill: consejos_salud
          groups:
            "стоит": ["lavarse las manos", "comer fruta y verdura", "dormir siete horas"]
            "не стоит": ["ir al trabajo con gripe", "hacer ejercicio con fiebre"]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: invierno
          items:
            - q: "¿Cuántas horas hay que dormir?"
              a: "Siete horas o más | Siete o más | Siete horas"
              explain: "…duerme siete horas o más."
            - q: "Как в тексте сказано «оставайся дома»?"
              a: "quédate en casa"
              explain: "Quédate — инструкция на «ты» от quedarse."
              skill: imperativo_tu
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "Si tienes gripe, quédate en casa: puedes contagiar a tus compañeros."
              options: "Если у тебя грипп, оставайся дома: можешь заразить коллег. | Если у тебя грипп, иди на работу и предупреди коллег. | У коллег грипп, поэтому оставайся дома."
              explain: "Contagiar — «заразить»."
              noaudio: {q: "Что значит «Si tienes gripe, quédate en casa: puedes contagiar a tus compañeros»?", options: "Если у тебя грипп, оставайся дома: можешь заразить коллег. | Если у тебя грипп, иди на работу и предупреди коллег. | У коллег грипп, поэтому оставайся дома."}
      - compose:
          title: Ваш совет
          free: true
          rule: none
          skill: consejos_salud
          items:
            - q: "Добавьте к блогу Ольги свой совет на зиму: что делать и чего не делать. Две-три фразы."
              format: "Es importante… Deberías… No deberías…"
              words: [10, 50]
              sentences: 2
              checks:
                - label: "совет: deberías, es importante, tienes que, императив…"
                  any: [deberías, debería, es importante, tienes que, lo mejor es, bebe, come, duerme, haz, toma, lávate]
              sample: "Es importante beber mucha agua, también en invierno. Y deberías salir a pasear cuando hace sol."
              sample_ru: "Важно пить много воды — и зимой тоже. А ещё стоит выходить гулять, когда солнечно."

