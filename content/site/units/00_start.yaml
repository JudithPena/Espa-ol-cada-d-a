id: start
number: 0
level: A0
title: Старт
goals:
  - понимать, как устроен курс и как с ним заниматься
  - читать испанские слова по правилам и ставить ударение

lessons:
  - id: intro
    kind: intro
    title: ¡Hola! Добро пожаловать
    vocab:
      - "👋 ¡Hola! [о́ла] — привет; здравствуйте"
    blocks:
      - |
        Это канал для тех, кто начинает учить испанский **с полного нуля**. Каждый день здесь выходит один короткий пост, на который нужно 5–10 минут. Маленькими шагами мы дойдём до уровня **A1**: вы сможете познакомиться и рассказать о себе, заказать еду в кафе, спросить дорогу, поговорить о семье, о погоде и о своих планах.
      - header: Как устроен курс
      - list:
          - "👣 **Маленькие шаги**: в каждом посте будет не больше 4–8 новых слов."
          - "📚 **Лексика**: новые слова вы увидите в живых примерах и услышите в озвучке."
          - "📐 **Грамматика**: сначала мы смотрим на примеры, и только потом читаем правило, чтобы вы сами заметили закономерность."
          - "💬 **Диалоги** и 📖 **тексты** составлены только из тех слов, которые вы уже знаете."
          - "🧠 **Тесты** проходят прямо в канале, в виде викторин."
          - "🔁 **Повторение**: каждое слово возвращается через 1, 3, 7, 14 и 30 дней, пока оно не закрепится в памяти."
      - header: Постепенное погружение
      - |
        Сначала всё объясняется по-русски. Чем больше слов вы знаете, тем больше испанского становится в постах: сначала на испанский переходят подписи и задания, а потом появляются тексты и вопросы на испанском. Каждый такой шаг мы делаем только тогда, когда нужные слова уже пройдены.
      - header: Как заниматься, чтобы запоминать
      - list:
          - "Читайте испанские примеры **вслух** и повторяйте за диктором, когда слушаете аудио."
          - "Скрытый текст ||вот такой|| — это ответы и переводы. Сначала попробуйте вспомнить ответ сами, а потом нажмите на скрытый текст, чтобы проверить себя."
          - "Отвечайте на тесты по памяти, потому что попытка вспомнить закрепляет слово лучше, чем перечитывание."
          - "Пишите в комментариях, даже если делаете ошибки. Без собственной речи язык не заговорит."
      - tip: "В курсе мы учим испанский язык Испании. Если в Латинской Америке говорят иначе, то рядом будет значок 🌎."
      - "Первое слово у вас уже есть. Завтра мы разберём гласные и ударение. **¡Hola!**"

  - id: vowels
    kind: phonetics
    title: Гласные и ударение
    goal: прочитать слово и найти в нём ударение
    vocab:
      - "🏠 la casa [ка́са] — дом"
      - "🚕 el taxi [та́кси] — такси"
      - "✅ sí [си] — да"
      - "❌ no [но] — нет; не"
      - "☕ el café [кафэ́] — кофе; кафе"
      - "🏨 el hotel [отэ́ль] — гостиница, отель"
      - "🎵 la música [му́сика] — музыка"
    blocks:
      - "Хорошая новость: испанские слова читаются так же, как пишутся. Выучите несколько правил — и сможете прочитать любое слово."
      - |
        Гласных всего пять: `a` `e` `i` `o` `u`. Самое главное: **гласные всегда звучат чётко**, даже без ударения. По-русски мы пишем «молоко», а говорим «малако́», но в испанском так не бывает: `o` всегда читается как «о», а `a` — как «а». Буква `e` звучит как русское «э»: café [кафэ́], hotel [отэ́ль].
      - learn: [la casa, el taxi, sí, "no"]
      - choose:
          title: Что вы услышали?
          items:
            - say: "la casa"
              options: "la casa | la case"
              explain: "Безударная `a` звучит чётко, как «а»: [ка́са]."
            - say: "el taxi"
              options: "el taxi | el texi | el toxi"
      - header: Где ударение?
      - rule: |
          1. Если слово заканчивается на гласную или на согласные `n` и `s`, то ударение падает на **предпоследний** слог: **ca**sa, **ta**xi, **ho**la, **Car**men, **Car**los.
          2. Если слово заканчивается на любую другую согласную, то ударение падает на **последний** слог: ho**tel**, Ma**drid**, Isa**bel**.
          3. Если над гласной стоит значок ´, то ударение падает именно туда, даже когда первые два правила говорят иначе: ca**fé**, **mú**sica, An**drés**.
      - learn: [el café, el hotel, la música]
      - choose:
          title: Где ударение?
          items:
            - q: "hotel"
              options: "ho-TEL | HO-tel"
              explain: "Слово заканчивается на `l` — не на гласную и не на `n` или `s`, поэтому ударение на последнем слоге."
            - q: "casa"
              options: "CA-sa | ca-SA"
              explain: "Слово заканчивается на гласную, поэтому ударение на предпоследнем слоге."
            - q: "Carmen"
              options: "CAR-men | car-MEN"
              explain: "Слово заканчивается на `n`, поэтому ударение на предпоследнем слоге."
            - q: "Madrid"
              options: "ma-DRID | MA-drid"
              explain: "Слово заканчивается на `d`, поэтому ударение на последнем слоге."
      - compare:
          style: small
          title: Значок ´ меняет смысл
          cards:
            - head: sí
              label: да
            - head: "`si`"
              say: false
              label: если
          note: "Поэтому **sí** со значком означает «да», а `si` без значка — «если»."
      - note: "Маленькие слова **el** и **la** перед существительными называются артиклями. Они показывают род слова: **el** ставится перед словами мужского рода (el café, el hotel, el taxi), а **la** — перед словами женского рода (la casa, la música). Поэтому учите каждое новое слово сразу вместе с артиклем."
      - match:
          title: Соедините пары
          pairs:
            - "la casa — дом"
            - "el café — кофе"
            - "el hotel — гостиница"
            - "la música — музыка"
            - "sí — да"
            - "no — нет"
      - write:
          title: Послушайте и напишите
          format: слово по-испански
          items:
            - say: "la casa"
              a: "la casa | casa"
            - say: "la música"
              a: "la música | música"
              explain: "Ударение падает на `ú`, хотя слово кончается на гласную, поэтому над `ú` нужен значок: música."
    quiz:
      - q: Где ударение в слове «hotel»?
        options: "ho-TEL | HO-tel"
        explain: "Слово заканчивается на согласную `l`, а не на `n` или `s`, поэтому ударение падает на последний слог."
      - q: Где ударение в слове «música»?
        options: "MÚ-si-ca | mu-SI-ca | mu-si-CA"
        explain: "Значок ´ всегда показывает, на какой слог падает ударение. Здесь он стоит над буквой `ú`."

  - id: consonants1
    kind: phonetics
    title: "Согласные: `h`, `j`, `g`, `qu`, `ll`, `ñ`"
    goal: прочитать слова с буквами h, j, g, qu, ll и ñ
    vocab:
      - "🍖 el jamón [хамо́н] — хамон (вяленый окорок)"
      - "🧀 el queso [кэ́со] — сыр"
      - "🎸 la guitarra [гита́рра] — гитара"
      - "🥘 la paella [паэ́йя] — паэлья"
      - "🥔 la tortilla [торти́йя] — тортилья (омлет с картофелем)"
      - "🇪🇸 España [эспа́нья] — Испания"
      - "🌅 mañana [манья́на] — завтра; утро"
    blocks:
      - "Большинство испанских согласных читается почти так же, как в русском языке. Разберём первую половину исключений."
      - table:
          rows:
            - ["`h`", "никогда не читается, как будто её нет: **hola** [о́ла], **hotel** [отэ́ль], **Hugo** [у́го]"]
            - ["`j`", "читается как русское «х»: **jamón** [хамо́н], **Juan** [хуа́н], **Javier** [хабье́р]"]
            - ["`g` + `e`, `i`", "тоже читается как «х»: **Jorge** [хо́рхэ], **Sergio** [сэ́рхио]. Во всех остальных случаях `g` читается как «г»: **Diego** [дьэ́го], **Málaga** [ма́лага]"]
      - learn: [el jamón]
      - choose:
          title: Буквы и звуки
          items:
            - q: "Какая буква никогда не читается?"
              options: "`h` | `j` | `g`"
              explain: "Буква `h` никогда не читается: hola [о́ла], hotel [отэ́ль]."
            - say: "el jamón"
              q: "Как пишется слово, которое вы услышали?"
              options: "el jamón | el hamón | el gamón"
              explain: "Звук «х» перед `a` пишется буквой `j`. Буква `h` не читается, а `g` перед `a` читается как «г»."
      - table:
          rows:
            - ["`gu` + `e`, `i`", "читается как «г», а буква `u` при этом не читается: **guitarra** [гита́рра], **Miguel** [мигэ́ль]"]
            - ["`qu` + `e`, `i`", "читается как «к», и буква `u` здесь тоже не читается: **queso** [кэ́со], **Raquel** [ракэ́ль]"]
      - learn: [el queso, la guitarra]
      - choose:
          title: Как пишется слово, которое вы услышали?
          items:
            - say: "el queso"
              options: "el queso | el cueso | el keso"
              explain: "«Кэ» пишется `que`: буква `u` здесь не читается."
            - say: "la guitarra"
              options: "la guitarra | la gitarra | la jitarra"
              explain: "«Ги» пишется `gui`: без `u` сочетание `gi` читалось бы как «хи»."
      - table:
          rows:
            - ["`ll`", "читается как «й»: **paella** [паэ́йя], **tortilla** [торти́йя], **Sevilla** [сэби́йя], **Mallorca** [майо́рка]"]
            - ["`ñ`", "читается как «нь»: **España** [эспа́нья], **mañana** [манья́на]"]
      - learn: [la paella, la tortilla, España, mañana]
      - choose:
          title: Как пишется слово, которое вы услышали?
          items:
            - say: "España"
              options: "España | Espana | Espanya"
              explain: "Звук «нь» — это одна буква `ñ`."
      - match:
          title: Соедините пары
          pairs:
            - "el jamón — хамон"
            - "el queso — сыр"
            - "la guitarra — гитара"
            - "la tortilla — омлет с картофелем"
            - "mañana — завтра"
      - write:
          title: Послушайте и напишите
          format: слово по-испански
          items:
            - say: "mañana"
              a: "mañana"
              explain: "«Нь» — это буква `ñ`: mañana."
            - say: "el jamón"
              a: "el jamón | jamón"
    quiz:
      - q: Какая буква в испанском никогда не читается?
        options: "`h` | `j` | `ñ`"
        explain: "Буква `h` никогда не читается, поэтому hola читается [о́ла], а hotel читается [отэ́ль]."

  - id: consonants2
    kind: phonetics
    title: "Согласные: `c`, `z`, `ch`, `r`, `v`"
    goal: прочитать слова с буквами c, z, ch, r и v
    vocab:
      - "🙏 gracias [гра́θиас] — спасибо"
      - "🍺 la cerveza [θэрбэ́θа] — пиво"
      - "⛲ la plaza [пла́θа] — площадь"
      - "🍫 el chocolate [чокола́тэ] — шоколад"
      - "🐶 el perro [пэ́рро] — собака"
      - "🍷 el vino [би́но] — вино"
    blocks:
      - "Разберём вторую половину исключений — и после этого вы сможете прочитать любое испанское слово."
      - table:
          rows:
            - ["`c` + `e`, `i` и `z`", "читаются как межзубный звук, похожий на английское `th` в слове `think`: **gracias** [гра́θиас], **cerveza** [θэрбэ́θа], **plaza** [пла́θа], **Barcelona** [барθэло́на]"]
            - ["`c` + `a`, `o`, `u`", "читается как «к»: **casa** [ка́са], **café** [кафэ́], **música** [му́сика]"]
            - ["`ch`", "читается как «ч»: **chocolate** [чокола́тэ], **Sánchez** [са́нчэθ]"]
      - more:
          title: 🌎 А в Латинской Америке?
          text: "Там `c` перед `e` и `i`, а также `z` произносят как обычное «с»: gracias [гра́сиас], cerveza [сэрбэ́са], plaza [пла́са]. Вас поймут при любом варианте."
      - learn: [gracias, la cerveza, la plaza, el chocolate]
      - choose:
          title: Как пишется слово, которое вы услышали?
          items:
            - say: "gracias"
              options: "gracias | grasias | gracas"
              explain: "Межзубный звук перед `i` пишется буквой `c`; буква `s` читается как обычное «с»."
            - say: "el chocolate"
              options: "el chocolate | el cocolate | el socolate"
              explain: "«Ч» пишется `ch`, а «к» перед `o` пишется `c`."
      - table:
          rows:
            - ["`r` и `rr`", "одна `r` в середине слова — одно короткое касание языком: **Sara** [са́ра], **Mario** [ма́рио], **Carmen** [ка́рмэн]. А двойная `rr` и `r` в начале слова — раскатистое «рр»: **perro** [пэ́рро], **guitarra** [гита́рра], **Rosa** [ро́са]"]
            - ["`v` и `b`", "обе буквы читаются примерно как русское «б»: **vino** [би́но], **cerveza** [θэрбэ́θа], **Valencia** [бале́нθиа], **Bilbao** [бильба́о]"]
      - learn: [el perro, el vino]
      - choose:
          title: Буквы и звуки
          items:
            - q: "В каком имени звучит раскатистое «рр»?"
              options: "Rosa | Sara | Mario"
              explain: "`r` в начале слова читается раскатисто, как `rr`. В середине слова одна `r` — короткое касание."
            - q: "В каком слове первый звук — «б»?"
              options: "vino | casa | queso"
              explain: "Буква `v` читается почти как «б»: vino [би́но]."
      - match:
          title: Соедините пары
          pairs:
            - "gracias — спасибо"
            - "la cerveza — пиво"
            - "la plaza — площадь"
            - "el perro — собака"
            - "el vino — вино"
      - write:
          title: Послушайте и напишите
          format: слово по-испански
          items:
            - say: "el chocolate"
              a: "el chocolate | chocolate"
            - say: "la plaza"
              a: "la plaza | plaza"
              explain: "Межзубный звук перед `a` пишется буквой `z`: перед `a` буква `c` читалась бы как «к»."

  - id: quiz
    kind: quiz
    title: Читаем по-испански
    goal: прочитать и понять первые двадцать слов
    blocks:
      - match:
          title: Соедините пары
          pairs:
            - "la plaza — площадь"
            - "el perro — собака"
            - "la guitarra — гитара"
            - "gracias — спасибо"
            - "mañana — завтра"
            - "la casa — дом"
      - write:
          title: Послушайте и напишите
          format: слово по-испански
          items:
            - say: "la guitarra"
              a: "la guitarra | guitarra"
              explain: "«Ги» пишется `gui`, раскатистое «рр» — `rr`."
            - say: "el queso"
              a: "el queso | queso"
              explain: "«Кэ» пишется `que`."
    quiz:
      - q: Как пишется слово, которое звучит [гита́рра]?
        options: "guitarra | gitarra | jitarra"
        explain: "В сочетаниях `gue` и `gui` буква `u` не читается, поэтому мы говорим [гита́рра]."
      - q: Как пишется слово, которое звучит [хамо́н]?
        options: "jamón | hamón | gamón"
        explain: "Буква `j` читается как русское «х», поэтому jamón звучит как [хамо́н]."
      - q: Где ударение в слове «café»?
        options: "ca-FÉ | CA-fé"
        explain: "Значок ударения ´ стоит над буквой `é`, поэтому ударение падает на последний слог."
      - q: В каком слове есть звук «нь»?
        options: "mañana | música | casa"
        explain: "Буква `ñ` читается как «нь», поэтому mañana звучит как [манья́на]."
      - q: Что значит «sí»?
        options: "да | нет | если"
        explain: "Со значком ударения sí означает «да», а `si` без значка означает «если»."
