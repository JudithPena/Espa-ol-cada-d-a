id: descripcion
number: 9
level: A1
title: ¿Cómo es? Описание людей
goals:
  - описать внешность и характер человека
  - согласовывать прилагательные в роде и числе
  - называть цвета

lessons:
  - id: curso
    kind: vocab
    title: Уровень A1 — больше испанского
    goal: понимать испанские названия частей урока
    version: 2
    vocab:
      - "📖 la lección [лэкθьо́н] — урок"
      - "🗂 el tema [тэ́ма] — тема"
      - "📚 el vocabulario [бокабула́рьо] — лексика, словарный запас"
      - "📐 la gramática [грама́тика] — грамматика"
      - "💬 el diálogo [дья́лого] — диалог"
      - "📖 la lectura [лэкту́ра] — чтение"
      - "✍️ la práctica [пра́ктика] — практика"
      - "🧠 el test [тэст] — тест {pl: los tests}"
    blocks:
      - "🎉 **Добро пожаловать на уровень A1!** Испанского становится больше. Начнём со слов, которыми называют части урока."
      - learn: [la lección, el tema, el vocabulario, la gramática]
      - rule:
          id: tema
          text: |
            1. **tema** мужского рода, хотя заканчивается на `-a`: _el tema_, _un tema_, _el tema de la lección_.
            2. Такие слова вы уже встречали: **el día**, **el mapa**. Так же ведут себя **el problema** («проблема») и **el idioma** («язык»).
      - choose:
          title: ¿El o la?
          skill: gender
          items:
            - q: "___ tema de la lección"
              options: "el | la"
              explain: "Tema — исключение: на -a, но мужского рода."
            - q: "___ gramática"
              options: "la | el"
      - learn: [el diálogo, la lectura, la práctica, el test]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la lección — урок"
            - "el vocabulario — лексика"
            - "el diálogo — диалог"
            - "la lectura — чтение"
            - "la práctica — практика"
      - tip: "**práctica** и **practica** различаются только ударением. Со значком — существительное «практика»: _la práctica_. Без значка — глагол «тренируется», «тренируйся»: _Ana practica español._"
      - choose:
          title: Со значком или без?
          skill: accent_meaning
          items:
            - q: "Ana ___ español en casa."
              options: "practica | práctica"
              explain: "Здесь нужен глагол «тренируется» — без значка: practica."
            - q: "la ___ de gramática"
              options: "práctica | practica"
              explain: "После la — существительное «практика», со значком: práctica."
      - write:
          title: Traduce
          format: слова по-испански
          rule: none
          skill: class_words
          items:
            - "урок грамматики => la lección de gramática | una lección de gramática"
            - "тест по лексике => el test de vocabulario | un test de vocabulario"
      - build:
          title: Соберите фразу
          rule: none
          skill: class_words
          items:
            - "¿Cuál es el tema de la lección? — Какая тема урока?"
    forms: [problema, idioma]

  - id: vocab1
    kind: vocab
    title: Внешность
    goal: описать внешность — высокий, светловолосый, красивый
    version: 2
    vocab:
      - "🧑 el chico / la chica [чи́ко, чи́ка] — парень, мальчик / девушка, девочка"
      - "🦒 alto/a [а́льто, а́льта] — высокий / высокая"
      - "🐭 bajo/a [ба́хо, ба́ха] — невысокий, низкий"
      - "🌱 joven [хо́бэн] — молодой, молодая {pos: adj, pl: jóvenes}"
      - "👱 rubio/a [ру́бьо, ру́бья] — светловолосый, блондин(ка)"
      - "👩🏻‍🦱 moreno/a [морэ́но, морэ́на] — темноволосый; смуглый"
      - "😍 guapo/a [гуа́по, гуа́па] — красивый / красивая"
      - "🧍 delgado/a [дэльга́до, дэльга́да] — худой, стройный"
    blocks:
      - "У прилагательных, как у национальностей, обычно две формы: **-o** — о мужчине, **-a** — о женщине."
      - learn: [el chico / la chica, alto/a, bajo/a, joven]
      - compare:
          id: adj_o_a
          cards:
            - head: alto → alta
              label: -o → -a
              tone: blue
              ex: ["Pablo es alto. — Пабло высокий.", "Ana es alta. — Ана высокая."]
            - head: joven
              label: одна форма для всех
              tone: mint
              ex: ["Pablo es joven.", "Ana es joven."]
      - more:
          title: moreno — тёмные волосы или смуглая кожа?
          text: "В Испании **moreno** обычно значит «темноволосый», но так говорят и о смуглом или загорелом человеке: _Carlos es moreno_ — «темноволосый» или «смуглый». Что имеется в виду, понятно из ситуации."
      - choose:
          title: Выберите форму
          skill: adj_gender
          items:
            - q: "Ana es ___ (невысокая)."
              options: "baja | bajo | bajas"
            - q: "El chico es ___ (молодой)."
              options: "joven | jóvena | jóvenes"
      - learn: [rubio/a, moreno/a, guapo/a, delgado/a]
      - sort:
          title: Кто это — Пабло или Ана?
          rule: adj_o_a
          skill: adj_gender
          groups:
            "👨 Pablo es…": [alto, rubio, delgado]
            "👩 Ana es…": [baja, morena, guapa]
            "👫 оба": [joven]
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Он высокий. => Es alto | Él es alto"
            - "Она блондинка. => Es rubia | Ella es rubia"
            - "Девушка очень красивая. => La chica es muy guapa"
          rule: adj_o_a
          skill: adj_gender

  - id: vocab2
    kind: vocab
    title: Характер
    goal: описать характер человека
    version: 2
    vocab:
      - "😊 simpático/a [симпа́тико, симпа́тика] — милый, приятный, дружелюбный"
      - "😒 antipático/a [антипа́тико, антипа́тика] — неприятный"
      - "🧠 inteligente [интэлихэ́нтэ] — умный, умная {pos: adj}"
      - "😄 divertido/a [дибэрти́до, дибэрти́да] — весёлый; забавный"
      - "😐 serio/a [сэ́рьо, сэ́рья] — серьёзный"
      - "🙈 tímido/a [ти́мидо, ти́мида] — застенчивый"
      - "💪 trabajador/a [трабахадо́р, трабахадо́ра] — трудолюбивый"
    blocks:
      - "Испанцы очень ценят, когда человек **simpático**: это и «милый», и «открытый», и «приятный в общении»."
      - more:
          title: trabajador — trabajadora
          text: "**trabajador** родственно глаголу **trabajar**. Хотя оно кончается на согласную, у него есть женская форма на `-a`, как у profesor**a**: _Carmen es muy trabajadora._"
      - learn: [simpático/a, antipático/a, inteligente, divertido/a]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "simpático — приятный, дружелюбный"
            - "antipático — неприятный"
            - "inteligente — умный"
            - "divertido — весёлый"
      - learn: [serio/a, tímido/a, trabajador/a]
      - choose:
          title: Выберите слово
          rule: none
          skill: adj_gender
          items:
            - q: "Carmen trabaja mucho. Es muy ___."
              options: "trabajadora | trabajador | tímida"
            - say: "Mi hermano es divertido, pero un poco tímido."
              options: "Мой брат весёлый, но немного застенчивый. | Мой брат серьёзный, но очень весёлый. | Моя сестра весёлая и застенчивая."
              noaudio: {q: "Что значит «Mi hermano es divertido, pero un poco tímido»?", options: "Мой брат весёлый, но немного застенчивый. | Мой брат серьёзный, но очень весёлый. | Моя сестра весёлая и застенчивая."}
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Она очень умная. => Es muy inteligente | Ella es muy inteligente"
            - "Лусия немного застенчивая. => Lucía es un poco tímida"
            - "Мой отец серьёзный. => Mi padre es serio"
          rule: none
          skill: adj_gender


  - id: concordancia
    kind: grammar
    title: "Alto, alta, altos, altas"
    goal: согласовать прилагательное — alto, alta, altos, altas
    version: 2
    vocab:
      - "❓ ¿Cómo es...? [ко́мо эс] — какой (какая) он / она? :: ¿Cómo es tu hermana? — Какая твоя сестра?"
      - "➕ muy [муй] — очень"
      - "↗️ bastante [баста́нтэ] — довольно, достаточно :: Es bastante alto. — Он довольно высокий."
    blocks:
      - "Посмотрите, как меняются прилагательные, и найдите две разные группы."
      - examples:
          items:
            - "Mis hermanos son altos. Mis primas son altas. — Мои братья высокие. Мои двоюродные сёстры высокие."
            - "Carlos es inteligente. Lucía es inteligente. — Карлос умный. Лусия умная."
      - rule:
          id: agreement
          text: |
            1. Прилагательное на **-o** меняется по роду и числу — четыре формы: alt**o**, alt**a**, alt**os**, alt**as**.
            2. На **-e** или согласную — одна форма для обоих родов: _un chico inteligente_, _una chica inteligente_. Кроме национальностей и слов на `-or`: _española_, _trabajadora_.
            3. Во множественном числе: после гласной **-s**, после согласной **-es**: _inteligentes_, _jóvenes_, _mayores_. В **jóvenes** появляется значок: ударение остаётся на том же слоге.
      - sort:
          title: Кто такой?
          skill: adj_agreement
          groups:
            "mi hermano es…": [alto, simpático]
            "mi hermana es…": [alta, simpática]
            "mis hermanos son…": [altos, simpáticos]
            "mis hermanas son…": [altas, simpáticas]
      - write:
          title: Поставьте прилагательное в нужную форму
          format: одно прилагательное в нужной форме
          rule: agreement
          skill: adj_agreement
          items:
            - "Mi madre es (alto) ___ => alta"
            - "Mis amigos son (simpático) ___ => simpáticos"
            - "Las chicas son (joven) ___ => jóvenes"
            - "Lucía y Ana son (trabajador) ___ => trabajadoras"
            - "Es una chica muy (inteligente) ___ => inteligente"
      - learn: ["¿Cómo es...?", muy, bastante]
      - note:
          id: como_es
          text: "**¿Cómo es?** — о постоянных качествах, «какой он?»: _¿Cómo es tu padre?_ А **¿Cómo estás?** — о самочувствии, «как ты?». Эту разницу мы скоро разберём подробно."
      - choose:
          title: Как спросить?
          skill: como_es
          items:
            - q: "Какая твоя мама? (её характер)"
              options: "¿Cómo es tu madre? | ¿Cómo está tu madre? | ¿Qué es tu madre?"
              explain: "О постоянных качествах — ¿Cómo es...? ¿Cómo está...? — о самочувствии."
      - rule:
          id: after_noun
          text: "Прилагательное обычно стоит **после** существительного: _un amigo simpático_ — «приятный друг», _una chica alta_ — «высокая девушка»."
      - build:
          title: Соберите фразу
          skill: adj_agreement
          items:
            - es: "Tengo unas amigas muy divertidas."
              ru: "У меня очень весёлые подруги."
              extra: [divertidos]
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Он довольно серьёзный. => Es bastante serio | Él es bastante serio"
          rule: none
          skill: adj_gender

  - id: colores
    kind: vocab
    title: Цвета
    goal: сказать, какого цвета предмет
    version: 2
    vocab:
      - "🎨 ¿De qué color es? [дэ кэ коло́р эс] — какого это цвета? {forms: color colores}"
      - "🔴 rojo/a [ро́хо, ро́ха] — красный"
      - "🔵 azul [аθу́ль] — синий, голубой {pos: adj}"
      - "🟢 verde [бэ́рдэ] — зелёный {pos: adj}"
      - "🟡 amarillo/a [амари́льо, амари́лья] — жёлтый"
      - "⚪ blanco/a [бла́нко, бла́нка] — белый"
      - "⚫ negro/a [нэ́гро, нэ́гра] — чёрный"
      - "🟤 marrón [марро́н] — коричневый {pos: adj}"
    blocks:
      - learn: ["¿De qué color es?", rojo/a, azul, verde]
      - write:
          title: "¿De qué color es?"
          format: цвет по-испански
          skill: adj_agreement
          items:
            - "🐸 => verde | es verde"
            - "🍅 => rojo | es rojo"
      - learn: [amarillo/a, blanco/a, negro/a, marrón]
      - text:
          id: colors
          text: "Цвета — тоже прилагательные. На **-o** — четыре формы: _un bolígrafo rojo_, _una mochila roja_, _unas sillas rojas_. На **-e** или согласную — одна форма для обоих родов, во множественном числе **-s** или **-es**: _una puerta verde_, _unas llaves azules_, _una mesa marrón_."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "amarillo — жёлтый"
            - "blanco — белый"
            - "negro — чёрный"
            - "marrón — коричневый"
            - "azul — синий"
      - write:
          title: Поставьте цвет в нужную форму
          format: один цвет в нужной форме
          rule: colors
          skill: adj_agreement
          items:
            - "Las sillas son (blanco) ___ => blancas"
            - "una mochila (rojo) ___ => roja"
            - "unas llaves (azul) ___ => azules"
      - choose:
          title: "¿De qué color es?"
          rule: colors
          skill: adj_agreement
          items:
            - q: "🧀 ¿De qué color es el queso?"
              options: "Es amarillo. | Es amarilla. | Es azul."
              explain: "Queso мужского рода — amarillo."
            - q: "☕ ¿De qué color es el café?"
              options: "Es negro o marrón. | Es negra o marrona. | Es verde."

  - id: ojos
    kind: grammar
    title: Глаза и волосы
    goal: описать глаза и волосы человека
    version: 2
    vocab:
      - "👁 el ojo [о́хо] — глаз"
      - "💇 el pelo [пэ́ло] — волосы"
      - "📏 largo/a [ла́рго, ла́рга] — длинный"
      - "✂️ corto/a [ко́рто, ко́рта] — короткий"
      - "🌰 castaño/a [каста́ньо, каста́нья] — каштановый (о волосах)"
      - "👓 llevar [льеба́р] — носить (одежду, очки) :: Llevo gafas. — Я ношу очки."
    blocks:
      - "Глаза и волосы испанцы описывают с глаголом **tener**: не «у него голубые глаза», а «он имеет голубые глаза»."
      - learn: [el ojo, el pelo, largo/a, corto/a, castaño/a]
      - examples:
          items:
            - "Tengo los ojos azules. — У меня голубые глаза."
            - "Ana tiene el pelo largo y rubio. — У Аны длинные светлые волосы."
      - rule:
          id: ojos
          text: |
            1. **tener** + **los ojos** / **el pelo** + цвет или длина: _Tiene los ojos verdes._ _Tengo el pelo largo._
            2. **el pelo** — в единственном числе (все волосы в целом), поэтому и прилагательное в единственном: _el pelo corto_, _el pelo castaño_.
            3. **los ojos** — во множественном, поэтому _los ojos azules_, _los ojos negros_.
      - choose:
          title: Как сказать?
          skill: appearance
          items:
            - q: "У него короткие волосы."
              options: "Tiene el pelo corto. | Es el pelo corto. | Tiene los pelos cortos."
            - q: "У Пабло каштановые волосы."
              options: "Pablo tiene el pelo castaño. | Pablo tiene el pelo castaña. | Pablo es el pelo castaño."
              explain: "Pelo — мужского рода и в единственном числе: el pelo castaño."
            - q: "У Аны голубые глаза."
              options: "Ana tiene los ojos azules. | Ana tiene los ojos azul. | Ana es los ojos azules."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "У неё зелёные глаза. => Tiene los ojos verdes | Ella tiene los ojos verdes"
            - "У меня короткие чёрные волосы. => Tengo el pelo corto y negro | Tengo el pelo negro y corto"
          rule: ojos
          skill: appearance

      - learn: [llevar]
      - "Глагол **llevar** («носить») спрягается, как **hablar**: _Llevo gafas._ _¿Llevas gafas?_ _Mi abuelo lleva gafas._"
      - mission:
          id: airport
          title: Встреча в аэропорту
          text: "Вы встречаете в аэропорту Мадрида друга вашей подруги — Оскара. Вы его ещё не видели, поэтому подруга описывает его по телефону."
      - choose:
          free: true
          skill: appearance
          items:
            - say: "Óscar es alto y rubio. Tiene los ojos azules y lleva gafas."
              q: "Какой Оскар?"
              options: "высокий блондин с голубыми глазами, в очках | невысокий брюнет с голубыми глазами | высокий блондин с зелёными глазами, без очков"
              noaudio: {q: "«Óscar es alto y rubio. Tiene los ojos azules y lleva gafas.» Какой Оскар?", options: "высокий блондин с голубыми глазами, в очках | невысокий брюнет с голубыми глазами | высокий блондин с зелёными глазами, без очков"}
      - write:
          free: true
          rule: ojos
          skill: appearance
          items:
            - q: "Опишите себя в ответ (вы — Лусия): «Я невысокая, у меня длинные чёрные волосы»."
              a: "Soy baja y tengo el pelo largo y negro | Soy baja, tengo el pelo largo y negro | Soy baja y tengo el pelo negro y largo"
              format: фраза по-испански
      - build:
          free: true
          skill: adj_agreement
          items:
            - es: "Llevo una mochila roja."
              ru: "Добавьте: «У меня (я ношу) красный рюкзак»."
              extra: [rojo]

  - id: lectura
    kind: reading
    title: Mi mejor amiga
    goal: понять описание человека
    version: 2
    vocab:
      - "🥇 mejor [мэхо́р] — лучший {pos: adj} :: mi mejor amigo — мой лучший друг"
    blocks:
      - learn: [mejor]
      - reading:
          id: laura
          title: Mi mejor amiga
          text: |
            Mi mejor amiga se llama Laura. Es de Málaga, pero vive en Madrid. Tiene veinte años y es estudiante.

            Laura es alta y delgada. Tiene el pelo largo y castaño y los ojos verdes. Lleva gafas.

            Es muy inteligente y divertida, pero un poco tímida.

            Su novio, Hugo, es periodista. Es moreno, bajo y muy simpático. ¡Y es muy trabajador!
          translation: |
            Мою лучшую подругу зовут Лаура. Она из Малаги, но живёт в Мадриде. Ей двадцать лет, она студентка.

            Лаура высокая и стройная. У неё длинные каштановые волосы и зелёные глаза. Она носит очки.

            Она очень умная и весёлая, но немного застенчивая.

            Её парень Уго — журналист. Он темноволосый, невысокий и очень приятный. И очень трудолюбивый!
      - choose:
          title: Responde
          source: laura
          rule: none
          items:
            - q: "Кто такая Лаура?"
              options: "Mi mejor amiga. | Mi hermana. | Mi profesora."
              explain: "Mi mejor amiga se llama Laura. — Лаура — лучшая подруга."
            - q: "¿De qué color son los ojos de Laura?"
              options: "Son verdes. | Son azules. | Son negros."
            - q: "¿Qué es Hugo?"
              options: "Es periodista. | Es estudiante. | Es profesor."
            - q: "¿Cómo es Laura?"
