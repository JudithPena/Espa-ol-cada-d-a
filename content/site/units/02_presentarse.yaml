id: presentarse
number: 2
level: A0
title: Me llamo… Знакомство
goals:
  - представиться и спросить имя
  - сказать «очень приятно» и ответить
  - говорить «я», «ты», «он», «она» и «вы» с глаголом «быть»

lessons:
  - id: vocab
    kind: vocab
    title: Как тебя зовут?
    vocab:
      - "🏷 me llamo... [мэ лья́мо] — меня зовут... :: Hola, me llamo Ana. — Привет, меня зовут Ана."
      - "❓ ¿Cómo te llamas? [ко́мо тэ лья́мас] — как тебя зовут? :: Hola, ¿cómo te llamas? — Привет, как тебя зовут?"
      - "❓ ¿Cómo se llama usted? [ко́мо сэ лья́ма устэ́д] — как вас зовут? :: Perdón, ¿cómo se llama usted? — Извините, как вас зовут?"
      - "😊 encantado/a [энканта́до, энканта́да] — очень приятно (о себе: мужчина / женщина) :: Encantada, Pablo. — Очень приятно, Пабло."
      - "🤝 mucho gusto [му́чо гу́сто] — очень приятно :: Mucho gusto, señora. — Очень приятно, сеньора."
      - "🔁 igualmente [игуальмэ́нтэ] — взаимно; мне тоже"
    blocks:
      - |
        Сегодня мы учимся знакомиться. Обратите внимание на слова **encantado** и **encantada**: окончание зависит от того, **кто говорит**.
        Если говорит мужчина, то он скажет _encantado_: Пабло скажет _Encantado, Ana_, а Карлос скажет _Encantado, señora_.
        Если говорит женщина, то она скажет _encantada_: Ана скажет _Encantada, Pablo_, а Лусия скажет _Encantada, señor García_.
        А фраза **mucho gusto** подходит всем, и мужчинам, и женщинам: _Mucho gusto, Ana_ или _Mucho gusto, señora López_. Ответить на знакомство можно словом **igualmente**, то есть «взаимно»: _Igualmente, Pablo_.
      - examples:
          title: Как это звучит в жизни
          items:
            - "Hola, me llamo Pablo. ¿Y tú? — Привет, меня зовут Пабло. А тебя?"
            - "Me llamo Ana. Encantada. — Меня зовут Ана. Очень приятно."
            - "Mucho gusto, Ana. — Очень приятно, Ана."
      - exercise:
          title: Ваша очередь
          items:
            - "Представьтесь => Me llamo..."
            - "Спросите имя у друга => ¿Cómo te llamas?"
            - "Спросите имя у пожилой сеньоры => ¿Cómo se llama usted?"
            - "Вам сказали «Encantado». Ответьте => Igualmente. / Encantado (Encantada)."

  - id: grammar
    kind: grammar
    title: "Я, ты, он, она: глагол ser"
    vocab:
      - "🙋 yo [йо] — я"
      - "👨 él [эль] — он"
      - "👩 ella [э́йя] — она"
      - "🟰 ser [сэр] — быть, являться {forms: soy eres es}"
      - "🏷 llamarse [льяма́рсэ] — называться, зваться {forms: llamo llamas llama}"
      - "🤔 ¿Quién es? [кьен эс] — кто это? :: ¿Quién es? ¿Es Pablo? — Кто это? Это Пабло?"
    blocks:
      - "Посмотрите на примеры и подумайте: что в испанском есть такого, чего нет в русском?"
      - examples:
          items:
            - "Yo soy Ana. — Я Ана."
            - "Tú eres Pablo. — Ты Пабло."
            - "Él es Carlos. — Он Карлос."
            - "Ella es Lucía. — Она Лусия."
            - "Usted es el señor García. — Вы сеньор Гарсия."
      - rule: |
          В русском языке глагол «быть» в настоящем времени мы пропускаем и говорим просто «я Ана». А в испанском глагол **ser** («быть») нужен всегда: _Soy Ana_ значит «Я Ана», _Eres Pablo_ значит «Ты Пабло», а _Es Lucía_ значит «Это Лусия».
          Кроме того, у каждого лица своя форма глагола. Когда речь идёт о «я», используется форма **soy**: _Yo soy Ana_, _Soy Carlos_. Когда речь идёт о «ты», используется форма **eres**: _Tú eres Pablo_, _¿Eres Lucía?_ А когда речь идёт о «он», «она» или «вы», используется форма **es**: _Él es Carlos_, _Ella es María_, _Usted es el señor García_.
      - table:
          title: "ser — быть"
          rows:
            - ["yo", "**soy**"]
            - ["tú", "**eres**"]
            - ["él / ella / usted", "**es**"]
      - table:
          title: "llamarse — зваться (букв. «называть себя»)"
          rows:
            - ["yo", "**me llamo**"]
            - ["tú", "**te llamas**"]
            - ["él / ella / usted", "**se llama**"]
      - note: |
          Со словом **usted** («вы») глагол стоит в той же форме, что и с **él** и **ella**. Поэтому _Usted es la señora López_ строится так же, как _Ella es Lucía_, а _¿Cómo se llama usted?_ строится так же, как _¿Cómo se llama él?_
          Местоимения обычно опускают, потому что форма глагола и так показывает, кто говорит. Поэтому _Soy Ana_ звучит естественнее, чем _Yo soy Ana_. Точно так же обычно говорят _Me llamo Pablo_, _¿Eres Lucía?_ и _Es Carlos_.
          А **yo** и **tú** оставляют тогда, когда хотят подчеркнуть разницу между людьми: _Yo soy Ana, ¿y tú?_ значит «Я Ана, а ты?», _Yo me llamo Pablo, ¿y tú?_ значит «Меня зовут Пабло, а тебя?», а _Tú eres Carlos y yo soy Lucía_ значит «Ты Карлос, а я Лусия».
      - tip: "Слово **él** со значком означает «он»: _Él es Carlos_, _¿Quién es él?_ А без значка **el** служит артиклем: _el café_, _el perro_, _el señor García_. Точно так же **sí** со значком означает «да»: _Sí, soy Ana_, а `si` без значка означает «если»."
      - exercise:
          title: Вставьте пропущенное слово
          items:
            - "Yo ___ Pablo. => soy"
            - "¿Tú ___ Ana? => eres"
            - "Ella ___ María. => es"
            - "¿Cómo ___ llamas? => te"
            - "Él ___ llama Carlos. => se"
            - "Usted ___ el señor López, ¿no? => es"
      - culture: |
          У испанцев **две фамилии**: первую фамилию человек получает от отца, а вторую получает от матери. Например, полное имя Пикассо звучит так: Pablo Ruiz Picasso. Здесь Ruiz — это фамилия его отца, а Picasso — это фамилия его матери.
          Если у родителей Carlos López Martínez и Carmen Ruiz García родится сын Pablo, то его будут звать Pablo López Ruiz.
          Женщины после свадьбы фамилию не меняют, поэтому Carmen Ruiz García так и остаётся Carmen Ruiz García.

  - id: dialogue
    kind: dialogue
    title: На вечеринке
    blocks:
      - "В этих диалогах нет новых слов: в них только то, что вы уже знаете. Сначала прочитайте их вслух, а потом послушайте аудио."
      - dialogue:
          lines:
            - "Pablo: ¡Hola! Me llamo Pablo. ¿Y tú? ¿Cómo te llamas? | Привет! Меня зовут Пабло. А тебя? Как тебя зовут?"
            - "Ana: Hola, Pablo. Me llamo Ana. | Привет, Пабло. Меня зовут Ана."
            - "Pablo: Encantado, Ana. | Очень приятно, Ана."
            - "Ana: Encantada. Perdón, ¿quién es ella? | Очень приятно. Извини, а кто она?"
            - "Pablo: Es Lucía. ¡Lucía! | Это Лусия. Лусия!"
            - "Lucía: ¡Hola! ¿Qué tal? | Привет! Как дела?"
            - "Ana: Muy bien. Soy Ana. Mucho gusto. | Очень хорошо. Я Ана. Очень приятно."
            - "Lucía: Igualmente, Ana. | Взаимно, Ана."
      - dialogue:
          title: В гостинице
          lines:
            - "Recepcionista: Buenas noches. ¿Cómo se llama usted? | Добрый вечер. Как вас зовут?"
            - "Carlos: Me llamo Carlos López. | Меня зовут Карлос Лопес."
            - "Recepcionista: Muchas gracias, señor López. ¡Buenas noches! | Большое спасибо, сеньор Лопес. Доброй ночи!"
      - exercise:
          title: Поняли?
          items:
            - "Почему Пабло говорит encantado, а Ана — encantada? => Потому что Пабло мужчина, а Ана женщина"
            - "Кто такая Лусия? => подруга, которую Пабло знакомит с Аной"
            - "Почему администратор говорит ¿Cómo se llama usted?, а не ¿Cómo te llamas? => Потому что ситуация официальная, а в такой ситуации говорят на «вы»"
      - task: "Представьтесь в комментариях по-испански: поздоровайтесь и назовите своё имя. Потом ответьте кому-нибудь из участников фразой **Mucho gusto** или **Encantado / Encantada**."

  - id: listening
    kind: listening
    title: Кто есть кто?
    blocks:
      - "Это задание на слух. Сначала **послушайте аудио** (оно ниже) два-три раза, а потом ответьте на вопросы в опросах. Текст спрятан, поэтому откройте его только в конце, когда захотите себя проверить."
      - dialogue:
          hidden: true
          lines:
            - "Profesora: Buenos días. Me llamo Elena. ¿Y usted? ¿Cómo se llama? | Доброе утро. Меня зовут Елена. А вас? Как вас зовут?"
            - "Iván: Me llamo Iván. | Меня зовут Иван."
            - "Profesora: Encantada, Iván. ¿Y ella? ¿Quién es? | Очень приятно, Иван. А она? Кто это?"
            - "Iván: Es Olga. | Это Ольга."
            - "Olga: Hola. Sí, soy Olga. Mucho gusto. | Здравствуйте. Да, я Ольга. Очень приятно."
            - "Profesora: Igualmente, Olga. | Взаимно, Ольга."
    quiz:
      - q: Как зовут преподавательницу?
        options: "Elena | Olga | Ana"
        explain: "Преподавательница говорит о себе Me llamo Elena, то есть «Меня зовут Елена». А Olga — это имя ученицы."
      - q: Как Иван отвечает на вопрос «¿Quién es?»
        options: "Es Olga. | Soy Olga. | Me llamo Iván."
        explain: "Иван говорит о другом человеке, поэтому он отвечает Es Olga, то есть «Это Ольга». А Soy Olga сказала бы о себе сама Ольга."
      - q: Что говорит Ольга при знакомстве?
        options: "Mucho gusto. | Igualmente. | Encantado."
      - q: Почему преподавательница говорит «encantada», а не «encantado»?
        options: "Она женщина | Она говорит с женщиной | Это вежливая форма"
        explain: "Окончание зависит от того, кто говорит. Елена говорит о себе, а она женщина, поэтому говорит encantada. Мужчина сказал бы encantado."

  - id: quiz
    kind: quiz
    title: Знакомство
    blocks:
      - "Это тест по теме «Знакомство»."
      - cando:
          - "представиться: Me llamo... / Soy..."
          - "спросить имя на «ты» и на «вы»"
          - "ответить на знакомство: Encantado, Mucho gusto, Igualmente"
          - "сказать, кто это: ¿Quién es? — Es..."
    quiz:
      - q: Как сказать «Меня зовут Ана»?
        options: "Me llamo Ana. | Soy llamo Ana. | Me llamas Ana."
        explain: "«Меня зовут» по-испански будет me llamo, то есть дословно «я называю себя». Глагол soy здесь не нужен, а llamas относится к «ты»."
      - q: "Tú ___ Pablo."
        options: "eres | soy | es"
        explain: "С tú глагол ser имеет форму eres: Tú eres Pablo. Форма soy нужна для yo, а форма es нужна для él, ella и usted."
      - q: "Ella ___ Lucía."
        options: "es | eres | soy"
        explain: "С ella, так же как с él и usted, глагол ser имеет форму es: Ella es Lucía, Él es Carlos."
      - q: Что скажет женщина при знакомстве?
        options: "Encantada. | Encantado. | Igualmente, señor."
        explain: "Окончание зависит от того, кто говорит. Женщина скажет encantada, а мужчина скажет encantado."
      - q: Как вежливо спросить имя?
        options: "¿Cómo se llama usted? | ¿Cómo te llamas? | ¿Quién eres?"
        explain: "Вопрос ¿Cómo se llama usted? задают на «вы». А ¿Cómo te llamas? и ¿Quién eres? звучат на «ты»."
