id: presentarse
number: 2
level: A0
title: Me llamo… Знакомство
goals:
  - представиться и спросить имя
  - сказать «очень приятно» и ответить
  - говорить «я», «ты», «он», «она» и «вы» с глаголом «быть»

lessons:
  - id: vocab
    kind: vocab
    title: Как тебя зовут?
    goal: представиться, спросить имя и ответить «очень приятно»
    vocab:
      - "🏷 me llamo... [мэ лья́мо] — меня зовут... :: Hola, me llamo Ana. — Привет, меня зовут Ана."
      - "❓ ¿Cómo te llamas? [ко́мо тэ лья́мас] — как тебя зовут? :: Hola, ¿cómo te llamas? — Привет, как тебя зовут?"
      - "❓ ¿Cómo se llama usted? [ко́мо сэ лья́ма устэ́д] — как вас зовут? :: Perdón, ¿cómo se llama usted? — Извините, как вас зовут?"
      - "😊 encantado/a [энканта́до, энканта́да] — очень приятно (о себе: мужчина / женщина) :: Encantada, Pablo. — Очень приятно, Пабло."
      - "🤝 mucho gusto [му́чо гу́сто] — очень приятно :: Mucho gusto, señora. — Очень приятно, сеньора."
      - "🔁 igualmente [игуальмэ́нтэ] — взаимно; мне тоже"
    blocks:
      - "Пабло и Ана знакомятся на вечеринке."
      - dialogue:
          title: Как это звучит в жизни
          lines:
            - "Pablo: Hola, me llamo Pablo. ¿Y tú? | Привет, меня зовут Пабло. А тебя?"
            - "Ana: Me llamo Ana. Encantada. | Меня зовут Ана. Очень приятно."
            - "Pablo: Mucho gusto, Ana. | Очень приятно, Ана."
      - learn: [me llamo..., "¿Cómo te llamas?", "¿Cómo se llama usted?"]
      - compare:
          title: Как спросить имя
          cards:
            - head: ¿Cómo te llamas?
              label: на «ты»
              tone: blue
              text: Ровеснику, другу, коллеге.
              ex: ["Hola, ¿cómo te llamas? — Привет, как тебя зовут?"]
            - head: ¿Cómo se llama usted?
              label: на «вы»
              tone: sun
              text: Пожилому человеку, незнакомому в официальной обстановке.
              ex: ["Perdón, ¿cómo se llama usted? — Извините, как вас зовут?"]
      - choose:
          title: Как спросить?
          items:
            - q: "Вы знакомитесь с пожилой сеньорой."
              options: "¿Cómo se llama usted? | ¿Cómo te llamas? | ¿Cómo está usted?"
              explain: "С сеньорой говорят на «вы»: ¿Cómo se llama usted? А ¿Cómo está usted? — это «как вы поживаете?»."
            - lines: ["Ana: Hola, ¿cómo te llamas?"]
              q: "Вас зовут Пабло."
              options: "Me llamo Pablo. | Te llamas Pablo. | ¿Cómo te llamas?"
              explain: "О себе говорят me llamo — «меня зовут». Te llamas — «тебя зовут»."
      - write:
          title: Представьтесь
          format: фраза по-испански
          items:
            - q: "Вас зовут Лусия. Представьтесь."
              a: "Me llamo Lucía | Hola, me llamo Lucía"
      - learn: [encantado/a, mucho gusto, igualmente]
      - compare:
          title: «Очень приятно»
          lead: Окончание слова encantado зависит от того, **кто говорит**.
          cards:
            - head: encantado
              label: говорит мужчина
              tone: blue
              ex: ["Encantado, Ana. — Очень приятно, Ана."]
            - head: encantada
              label: говорит женщина
              tone: rose
              ex: ["Encantada, Pablo. — Очень приятно, Пабло."]
            - head: mucho gusto
              label: подходит всем
              tone: mint
              ex: ["Mucho gusto, señora. — Очень приятно, сеньора."]
          note: "Ответить на знакомство можно словом **igualmente** — «взаимно»: _Igualmente, Pablo._"
      - choose:
          title: Что ответить?
          items:
            - lines: ["Pablo: Hola, me llamo Pablo."]
              q: "Вы — Ана."
              options: "Encantada, Pablo. | Encantado, Pablo. | De nada, Pablo."
              explain: "Ана — женщина и говорит о себе, поэтому encantada."
            - lines: ["Ana: Encantada."]
              q: "Вы — Пабло."
              options: "Igualmente. | Encantada. | Por favor."
              explain: "На «очень приятно» отвечают igualmente — «взаимно». Пабло мог бы сказать и encantado, но не encantada."
      - build:
          title: Соберите фразу
          items:
            - "Hola, me llamo Ana. ¿Y tú? — Привет, меня зовут Ана. А тебя?"

  - id: grammar
    kind: grammar
    title: "Я, ты, он, она: глагол ser"
    goal: сказать, кто есть кто, — soy, eres, es
    vocab:
      - "🙋 yo [йо] — я"
      - "👨 él [эль] — он"
      - "👩 ella [э́йя] — она"
      - "🟰 ser [сэр] — быть, являться {forms: soy eres es}"
      - "🏷 llamarse [льяма́рсэ] — называться, зваться {forms: llamo llamas llama}"
      - "🤔 ¿Quién es? [кьен эс] — кто это? :: ¿Quién es? ¿Es Pablo? — Кто это? Это Пабло?"
    blocks:
      - "Посмотрите на примеры. Что в испанском есть такого, чего нет в русском?"
      - examples:
          items:
            - "Yo soy Ana. — Я Ана."
            - "Tú eres Pablo. — Ты Пабло."
            - "Él es Carlos. — Он Карлос."
            - "Ella es Lucía. — Она Лусия."
            - "Usted es el señor García. — Вы сеньор Гарсия."
      - learn: [yo, él, ella, ser]
      - rule: |
          В русском глагол «быть» в настоящем времени пропускают: «я Ана». А в испанском глагол **ser** нужен всегда: _Soy Ana_ — «Я Ана», _Es Lucía_ — «Это Лусия».
          У каждого лица своя форма: «я» — **soy**, «ты» — **eres**, «он», «она» и вежливое «вы» — **es**.
      - table:
          title: "ser — быть"
          rows:
            - ["yo", "**soy**"]
            - ["tú", "**eres**"]
            - ["él / ella / usted", "**es**"]
      - write:
          title: Вставьте форму ser
          format: форма глагола
          items:
            - "Yo ___ Pablo. => soy"
            - "¿Tú ___ Ana? => eres"
            - "Ella ___ María. => es"
            - q: "Usted ___ el señor López, ¿no?"
              a: es
              explain: "С usted глагол стоит в той же форме, что с él и ella: es."
      - compare:
          style: small
          title: Значок меняет смысл
          cards:
            - head: él
              label: он
            - head: el
              label: артикль
              say: false
          note: "_Él es Carlos_ — «Он Карлос», а _el café_, _el señor García_ — артикль. Так же **sí** — «да», а `si` — «если»."
      - choose:
          title: él или el?
          items:
            - q: "___ es Carlos. — Он Карлос."
              options: "Él | El"
            - q: "Es ___ señor García."
              options: "el | él"
      - learn: [llamarse, "¿Quién es?"]
      - table:
          title: "llamarse — зваться (букв. «называть себя»)"
          rows:
            - ["yo", "**me llamo**"]
            - ["tú", "**te llamas**"]
            - ["él / ella / usted", "**se llama**"]
      - more:
          title: Почему часто без yo и tú?
          text: |
            Форма глагола и так показывает, кто говорит, поэтому _Soy Ana_ звучит естественнее, чем _Yo soy Ana_, а _Me llamo Pablo_ — чем _Yo me llamo Pablo_.
            **Yo** и **tú** оставляют, когда хотят подчеркнуть разницу между людьми: _Yo soy Ana, ¿y tú?_ — «Я Ана, а ты?»
      - choose:
          title: Вставьте слово
          items:
            - q: "¿Cómo ___ llamas?"
              options: "te | se | me"
              explain: "«Ты» — te llamas: ¿Cómo te llamas?"
            - q: "Él ___ llama Carlos."
              options: "se | te | me"
              explain: "«Он», «она», «вы» — se llama."
            - lines: ["Ana: ¿Quién es?"]
              q: "Ана показывает на фото Карлоса."
              options: "Es Carlos. | Soy Carlos. | Eres Carlos."
              explain: "О другом человеке говорят es: Es Carlos — «Это Карлос». Soy Carlos сказал бы сам Карлос."
      - more:
          title: Две фамилии
          text: |
            У испанцев **две фамилии**: первая — от отца, вторая — от матери. Полное имя Пикассо — Pablo Ruiz Picasso: Ruiz — фамилия отца, Picasso — фамилия матери.
            Женщины после свадьбы фамилию не меняют: Carmen Ruiz García так и остаётся Carmen Ruiz García.

  - id: dialogue
    kind: dialogue
    title: На вечеринке
    goal: понять разговор при знакомстве и ответить собеседнику
    blocks:
      - "В этих диалогах только знакомые слова."
      - dialogue:
          lines:
            - "Pablo: ¡Hola! Me llamo Pablo. ¿Y tú? ¿Cómo te llamas? | Привет! Меня зовут Пабло. А тебя? Как тебя зовут?"
            - "Ana: Hola, Pablo. Me llamo Ana. | Привет, Пабло. Меня зовут Ана."
            - "Pablo: Encantado, Ana. | Очень приятно, Ана."
            - "Ana: Encantada. Perdón, ¿quién es ella? | Очень приятно. Извини, а кто она?"
            - "Pablo: Es Lucía. ¡Lucía! | Это Лусия. Лусия!"
            - "Lucía: ¡Hola! ¿Qué tal? | Привет! Как дела?"
            - "Ana: Muy bien. Soy Ana. Mucho gusto. | Очень хорошо. Я Ана. Очень приятно."
            - "Lucía: Igualmente, Ana. | Взаимно, Ана."
      - choose:
          title: Поняли?
          items:
            - q: "Почему Пабло говорит encantado, а Ана — encantada?"
              options: "Пабло — мужчина, Ана — женщина. | Ана говорит на «вы». | Пабло старше Аны."
              explain: "Окончание зависит от того, кто говорит: мужчина — encantado, женщина — encantada."
            - q: "Кто такая Лусия?"
              options: "подруга, которую Пабло знакомит с Аной | сестра Аны | администратор гостиницы"
      - dialogue:
          title: В гостинице
          lines:
            - "Recepcionista: Buenas noches. ¿Cómo se llama usted? | Добрый вечер. Как вас зовут?"
            - "Carlos: Me llamo Carlos López. | Меня зовут Карлос Лопес."
            - "Recepcionista: Muchas gracias, señor López. ¡Buenas noches! | Большое спасибо, сеньор Лопес. Доброй ночи!"
      - choose:
          title: Поняли?
          items:
            - q: "Почему администратор говорит ¿Cómo se llama usted?, а не ¿Cómo te llamas?"
              options: "Ситуация официальная, поэтому на «вы». | Карлос — его старый друг. | Он не расслышал имя."
      - mission:
          title: Новая соседка
          text: "Вы — Лусия. В подъезде с вами знакомится новая соседка. Ответьте ей."
      - choose:
          items:
            - lines: ["Ana: ¡Hola! Me llamo Ana. ¿Y tú?"]
              options: "Me llamo Lucía. | Se llama Lucía. | ¿Cómo te llamas?"
              explain: "О себе — me llamo. Se llama — «её (его) зовут»."
            - lines: ["Ana: Encantada, Lucía."]
              options: "Igualmente, Ana. | Encantado, Ana. | De nada, Ana."
              explain: "Лусия — женщина, поэтому не encantado; лучший ответ — igualmente."
            - lines: ["Ana: ¿Y él? ¿Quién es?"]
              q: "Рядом с вами Пабло."
              options: "Es Pablo. | Soy Pablo. | Eres Pablo."
      - build:
          items:
            - es: "Perdón, ¿cómo se llama usted?"
              ru: "К вам подошёл пожилой сосед. Спросите, как его зовут: «Извините, как вас зовут?»"
              extra: [te]

  - id: listening
    kind: listening
    title: Кто есть кто?
    goal: понять на слух, кого как зовут
    blocks:
      - "Сначала послушайте разговор два-три раза. Текст спрятан: откройте его, только когда захотите себя проверить."
      - dialogue:
          hidden: true
          lines:
            - "Profesora: Buenos días. Me llamo Elena. ¿Y usted? ¿Cómo se llama? | Доброе утро. Меня зовут Елена. А вас? Как вас зовут?"
            - "Iván: Me llamo Iván. | Меня зовут Иван."
            - "Profesora: Encantada, Iván. ¿Y ella? ¿Quién es? | Очень приятно, Иван. А она? Кто это?"
            - "Iván: Es Olga. | Это Ольга."
            - "Olga: Hola. Sí, soy Olga. Mucho gusto. | Здравствуйте. Да, я Ольга. Очень приятно."
            - "Profesora: Igualmente, Olga. | Взаимно, Ольга."
      - match:
          title: Кто есть кто?
          pairs:
            - "Elena — преподавательница"
            - "Iván — ученик"
            - "Olga — ученица"
    quiz:
      - q: Как зовут преподавательницу?
        options: "Elena | Olga | Ana"
        explain: "Преподавательница говорит о себе Me llamo Elena, то есть «Меня зовут Елена». А Olga — это имя ученицы."
      - q: Как Иван отвечает на вопрос «¿Quién es?»
        options: "Es Olga. | Soy Olga. | Me llamo Iván."
        explain: "Иван говорит о другом человеке, поэтому он отвечает Es Olga, то есть «Это Ольга». А Soy Olga сказала бы о себе сама Ольга."
      - q: Что говорит Ольга при знакомстве?
        options: "Mucho gusto. | Igualmente. | Encantado."
      - q: Почему преподавательница говорит «encantada», а не «encantado»?
        options: "Она женщина | Она говорит с женщиной | Это вежливая форма"
        explain: "Окончание зависит от того, кто говорит. Елена говорит о себе, а она женщина, поэтому говорит encantada. Мужчина сказал бы encantado."

  - id: quiz
    kind: quiz
    title: Знакомство
    blocks:
      - "Это тест по теме «Знакомство»."
      - cando:
          - "представиться: Me llamo... / Soy..."
          - "спросить имя на «ты» и на «вы»"
          - "ответить на знакомство: Encantado, Mucho gusto, Igualmente"
          - "сказать, кто это: ¿Quién es? — Es..."
    quiz:
      - q: Как сказать «Меня зовут Ана»?
        options: "Me llamo Ana. | Soy llamo Ana. | Me llamas Ana."
        explain: "«Меня зовут» по-испански будет me llamo, то есть дословно «я называю себя». Глагол soy здесь не нужен, а llamas относится к «ты»."
      - q: "Tú ___ Pablo."
        options: "eres | soy | es"
        explain: "С tú глагол ser имеет форму eres: Tú eres Pablo. Форма soy нужна для yo, а форма es нужна для él, ella и usted."
      - q: "Ella ___ Lucía."
        options: "es | eres | soy"
        explain: "С ella, так же как с él и usted, глагол ser имеет форму es: Ella es Lucía, Él es Carlos."
      - q: Что скажет женщина при знакомстве?
        options: "Encantada. | Encantado. | Igualmente, señor."
        explain: "Окончание зависит от того, кто говорит. Женщина скажет encantada, а мужчина скажет encantado."
      - q: Как вежливо спросить имя?
        options: "¿Cómo se llama usted? | ¿Cómo te llamas? | ¿Quién eres?"
        explain: "Вопрос ¿Cómo se llama usted? задают на «вы». А ¿Cómo te llamas? и ¿Quién eres? звучат на «ты»."
