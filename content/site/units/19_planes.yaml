id: planes
number: 19
level: A1
title: Планы
goals:
  - рассказать о планах на вечер, выходные и лето
  - сказать, что нужно сделать
  - пригласить, согласиться и вежливо отказаться

lessons:
  - id: cuando
    kind: vocab
    title: Сегодня вечером, на следующей неделе
    goal: сказать, когда — сегодня вечером, послезавтра, на следующей неделе
    version: 3
    vocab:
      - "📝 el plan [план] — план :: ¿Tienes planes para el sábado? — У тебя есть планы на субботу?"
      - "🌙 esta noche [э́ста но́чэ] — сегодня вечером"
      - "⏭ pasado mañana [паса́до манья́на] — послезавтра"
      - "📅 la semana que viene [ла сэма́на кэ бьэ́нэ] — на следующей неделе"
      - "📆 el año que viene [эль а́ньо кэ бьэ́нэ] — в следующем году"
      - "➡️ próximo/a [про́ксимо, про́ксима] — следующий :: el próximo lunes — в следующий понедельник"
    blocks:
      - "Тема — будущее. Часть слов «когда?» вы уже знаете: **mañana** — «завтра», **el fin de semana** — «выходные», **luego** — «потом»."
      - learn: [el plan, esta noche, pasado mañana]
      - choose:
          title: Traduce
          skill: future_time
          items:
            - q: "Pasado mañana es sábado."
              options: "Послезавтра суббота. | Завтра суббота. | Сегодня суббота."
      - learn: [la semana que viene, el año que viene, próximo/a]
      - match:
          title: Соедините пары
          pairs:
            - "esta noche — сегодня вечером"
            - "pasado mañana — послезавтра"
            - "la semana que viene — на следующей неделе"
            - "el año que viene — в следующем году"
            - "el próximo lunes — в следующий понедельник"
      - write:
          title: Traduce
          format: когда — по-испански, без предлога
          skill: future_time
          items:
            - q: "в следующую пятницу"
              a: "el próximo viernes | el viernes próximo"
              mistakes: {"en el próximo viernes": "Предлог не нужен: **el próximo viernes**.", "el próxima viernes": "viernes — мужского рода: el **próximo** viernes."}
            - "сегодня вечером => esta noche"
      - note:
          id: para
          text: "**para** — «для» или «на»: _planes para el sábado_ — «планы на субботу». Вы знаете его по _para mí_ — «для меня»."
      - build:
          title: Соберите фразу
          skill: future_time
          items:
            - es: "¿Qué planes tienes para el fin de semana?"
              ru: "Какие у тебя планы на выходные?"
              extra: [por]
      - choose:
          title: Послушайте и выберите
          skill: future_time
          items:
            - say: "Esta noche ceno con mis padres."
              options: "Сегодня вечером я ужинаю с родителями. | Завтра вечером я ужинаю с родителями. | Сегодня вечером я обедаю с родителями."
              noaudio: {q: "Что значит «Esta noche ceno con mis padres.»?", options: "Сегодня вечером я ужинаю с родителями. | Завтра вечером я ужинаю с родителями. | Сегодня вечером я обедаю с родителями."}
            - say: "La semana que viene no trabajo."
              options: "На следующей неделе я не работаю. | На этой неделе я не работаю. | На следующей неделе я работаю."
              noaudio: {q: "Что значит «La semana que viene no trabajo.»?", options: "На следующей неделе я не работаю. | На этой неделе я не работаю. | На следующей неделе я работаю."}

  - id: ir_a
    kind: grammar
    title: "Voy a + инфинитив: ближайшее будущее"
    goal: рассказать о планах — voy a + инфинитив
    version: 3
    vocab:
      - "🏛 visitar [бисита́р] — посещать, навещать"
      - "🛋 descansar [дэсканса́р] — отдыхать"
      - "🎉 la fiesta [фьэ́ста] — праздник, вечеринка"
      - "🤝 quedar [кэда́р] — встречаться, договариваться о встрече :: Quedo con mis amigos. — Я встречаюсь с друзьями."
    blocks:
      - "Как сказать «я собираюсь…» или «я буду…»? Найдите в примерах знакомый глагол."
      - examples:
          items:
            - "Esta noche voy a ver una película. — Сегодня вечером я буду смотреть фильм."
            - "¿Qué vas a hacer el sábado? — Что ты будешь делать в субботу?"
      - compare:
          id: ir_a_inf
          cards:
            - head: ir + a + инфинитив
              say: false
              label: собираюсь, буду
              tone: blue
              text: 'По лицам меняется только **ir**, инфинитив — всегда тот же. **a** пропускать нельзя: _Voy a cocinar_, а не `Voy cocinar`.'
              ex: ["Voy a trabajar.", "Hoy va a nevar.", "En agosto vamos a ir a Málaga."]
      - choose:
          title: Как сказать?
          skill: ir_a_inf
          items:
            - q: "Я буду готовить."
              options: "Voy a cocinar. | Voy cocinar. | Voy de cocinar."
      - write:
          title: Вставьте ir + a
          format: форма ir + a
          skill: ir_a_inf
          items:
            - q: "(yo) ___ estudiar."
              a: "voy a"
              mistakes: {"voy": "После ir нужно **a**: voy a estudiar."}
            - "¿Qué ___ hacer (tú) esta noche? => vas a"
            - "Mañana ___ llover. => va a"
            - q: "Ellos ___ ver una película."
              a: "van a"
              mistakes: {"vamos a": "vamos — «мы». Они — **van a**."}
      - learn: [visitar, descansar, la fiesta, quedar]
      - note:
          id: personal_a
          text: "Если после глагола стоит **человек**, перед ним ставят **a**: _Visito **a** mis abuelos._ _Quiero ver **a** Ana._ Перед местом или вещью — нет: _Visito el museo._"
      - choose:
          title: Выберите
          skill: personal_a
          items:
            - q: "Я навещаю бабушку и дедушку."
              options: "Visito a mis abuelos. | Visito mis abuelos. | Visito de mis abuelos."
            - q: "Мы посещаем музей."
              options: "Visitamos el museo. | Visitamos al museo. | Visitamos a museo."
      - write:
          title: Traduce
          format: фраза по-испански
          rule: ir_a_inf
          skill: ir_a_inf
          items:
            - q: "Завтра я буду отдыхать."
              a: "Mañana voy a descansar | Voy a descansar mañana"
              mistakes: {"mañana voy descansar": "После ir нужно **a**: voy a descansar."}
            - q: "Мы собираемся путешествовать."
              a: "Vamos a viajar | (Nosotros) vamos a viajar"
              mistakes: {"vamos viajar": "После ir нужно **a**: vamos a viajar."}
            - q: "В субботу я встречаюсь с друзьями. (quedar)"
              a: "El sábado voy a quedar con mis amigos | El sábado quedo con mis amigos | Voy a quedar con mis amigos el sábado"
            - q: "Мы пойдём на вечеринку."
              a: "Vamos a ir a la fiesta | Vamos a la fiesta"
      - choose:
          title: Послушайте и выберите
          skill: ir_a_inf
          items:
            - say: "Vamos a descansar en casa."
              options: "Мы будем отдыхать дома. | Мы отдыхаем дома. | Они будут отдыхать дома."
              noaudio: {q: "Что значит «Vamos a descansar en casa.»?", options: "Мы будем отдыхать дома. | Мы отдыхаем дома. | Они будут отдыхать дома."}
            - say: "¿Qué vas a hacer el sábado?"
              options: "Что ты будешь делать в субботу? | Что ты делал в субботу? | Что ты делаешь по субботам?"
              noaudio: {q: "Что значит «¿Qué vas a hacer el sábado?»?", options: "Что ты будешь делать в субботу? | Что ты делал в субботу? | Что ты делаешь по субботам?"}

      - write:
          title: Напишите по-испански
          bank: true
          skill: personal_a
          format: фраза по-испански
          items:
            - q: "Скажите: «В субботу я навещу бабушку»."
              a: "El sábado voy a visitar a mi abuela | El sábado visito a mi abuela"
              mistakes: {"el sábado voy a visitar mi abuela": "Перед человеком — **a**: visitar **a** mi abuela."}
            - q: "Скажите: «Я хочу увидеть Ану»."
              a: "(Yo) quiero ver a Ana"
              mistakes: {"quiero ver ana": "Перед человеком — **a**: ver **a** Ana."}
            - q: "Скажите: «Мы собираемся посетить музей»."
              a: "(Nosotros) vamos a visitar el museo"
              mistakes: {"vamos a visitar a el museo": "Перед местом a не нужна: visitar **el** museo."}
      - choose:
          title: Выберите
          bank: true
          skill: personal_a
          items:
            - q: "Mañana voy a visitar ___."
              options: "a mis abuelos | mis abuelos | al mis abuelos"
              explain: "Перед человеком — a: visitar a mis abuelos."

  - id: tener_que
    kind: grammar
    title: "Tengo que: что нужно сделать"
    goal: сказать, что нужно сделать, — tengo que, hay que
    version: 3
    vocab:
      - "❗ tener que [тэнэ́р кэ] — быть должным, нужно (кому-то) {forms: tengo tienes tiene tenemos tienen} :: Tengo que trabajar. — Мне нужно работать."
      - "📌 hay que [ай кэ] — нужно, надо (всем, вообще) :: Hay que comprar pan. — Нужно купить хлеб."
      - "🛒 comprar [компра́р] — покупать"
    blocks:
      - learn: [tener que, hay que, comprar]
      - compare:
          id: tener_hay
          cards:
            - head: tener que
              label: нужно конкретному человеку
              tone: blue
              text: '**tener** меняется по лицам.'
              ex: ["Tengo que cocinar.", "Ana tiene que ir al banco."]
            - head: hay que
              label: надо вообще, всем
              tone: sun
              text: '**hay** никогда не меняется.'
              ex: ["Hay que beber mucha agua.", "Hay que cerrar la ventana."]
      - choose:
          title: Как сказать?
          skill: tener_que
          items:
            - q: "Ане нужно сходить в банк."
              options: "Ana tiene que ir al banco. | Ana hay que ir al banco. | Ana tiene ir al banco."
            - q: "Надо (всем) пить много воды."
              options: "Hay que beber mucha agua. | Hay beber mucha agua. | Tiene que beber mucha agua."
      - write:
          title: Traduce
          format: фраза по-испански
          skill: tener_que
          items:
            - q: "Нам нужно купить хлеб."
              a: "Tenemos que comprar pan | (Nosotros) tenemos que comprar pan"
              mistakes: {"hay que comprar pan": "Нужно конкретно нам — **tenemos que**.", "tenemos comprar pan": "После tener нужно **que**: tenemos que comprar."}
            - q: "Мне нужно позвонить маме. (llamar — звонить)"
              a: "Tengo que llamar a mi madre | (Yo) tengo que llamar a [mi madre/mamá]"
              mistakes: {"tengo que llamar mi madre": "Перед человеком — **a**: llamar a mi madre."}
      - rule:
          id: sin_que
          text: "После **quiero**, **puedo**, **prefiero** инфинитив идёт без **que**: _Quiero descansar._ _Hoy no puedo ir._"
      - choose:
          title: Выберите
          skill: tener_que
          items:
            - q: "Hoy no puedo ___."
              options: "ir | que ir | a ir"
      - choose:
          title: Послушайте и выберите
          skill: tener_que
          items:
            - say: "Tengo que trabajar mañana."
              options: "Мне нужно работать завтра. | Я хочу работать завтра. | Мне не нужно работать завтра."
              noaudio: {q: "Что значит «Tengo que trabajar mañana.»?", options: "Мне нужно работать завтра. | Я хочу работать завтра. | Мне не нужно работать завтра."}
            - say: "Hay que comprar pan."
              options: "Нужно купить хлеб. | Я покупаю хлеб. | Хлеба нет."
              noaudio: {q: "Что значит «Hay que comprar pan.»?", options: "Нужно купить хлеб. | Я покупаю хлеб. | Хлеба нет."}

  - id: invitacion
    kind: dialogue
    title: Пойдём в кино?
    goal: пригласить, согласиться и вежливо отказаться
    version: 3
    vocab:
      - "😔 lo siento [ло сьэ́нто] — мне жаль, извини"
      - "🔁 otro día [о́тро ди́а] — в другой раз"
      - "🤩 ¡Genial! [хэнья́ль] — отлично! здорово!"
      - "🤝 ¿Quedamos...? [кэда́мос] — встретимся...? :: ¿Quedamos a las ocho? — Встретимся в восемь?"
      - "👍 ¡Perfecto! [пэрфэ́кто] — отлично! идеально!"
    blocks:
      - learn: [lo siento, otro día]
      - choose:
          title: Что ответить?
          skill: invite
          items:
            - lines: ["Pablo: ¿Quieres ir al cine esta noche?"]
              q: "Вы не можете: нужно заниматься."
              options: "Lo siento, no puedo. Tengo que estudiar. | Sí, claro. Tengo que estudiar. | Lo siento, hay que estudiar."
      - learn: ["¡Genial!", "¿Quedamos...?", "¡Perfecto!"]
      - sort:
          title: Согласие или отказ?
          skill: invite
          groups:
            "✅ да": ["¡Genial!", "¡Perfecto!", "Sí, claro."]
            "❌ нет": ["Lo siento, no puedo.", "Otro día."]
      - dialogue:
          id: no_puedo
          title: Отказ
          lines:
            - "Pablo: Hola, Lucía. ¿Quieres ir al cine esta noche? | Привет, Лусия. Хочешь пойти в кино сегодня вечером?"
            - "Lucía: Lo siento, esta noche no puedo. Tengo que estudiar. | Извини, сегодня вечером не могу. Мне нужно заниматься."
            - "Pablo: Vale, otro día. | Ладно, в другой раз."
      - dialogue:
          id: genial
          title: Согласие
          lines:
            - "Pablo: ¿Y el sábado? ¿Qué vas a hacer? | А в субботу? Что будешь делать?"
            - "Lucía: El sábado no tengo planes. | В субботу у меня нет планов."
            - "Pablo: ¿Vamos al cine el sábado? | Пойдём в кино в субботу?"
            - "Lucía: ¡Genial! ¿A qué hora quedamos? | Отлично! Во сколько встретимся?"
            - "Pablo: ¿Quedamos a las siete delante del cine? | Встретимся в семь перед кинотеатром?"
            - "Lucía: ¡Perfecto! Nos vemos ahí. ¡Hasta el sábado! | Отлично! Там и встретимся. До субботы!"
      - choose:
          title: Responde
          items:
            - q: "¿Por qué Lucía no puede ir al cine esta noche?"
              options: "Porque tiene que estudiar. | Porque está enferma. | Porque no le gusta el cine."
              source: no_puedo
            - q: "¿Dónde quedan?"
              options: "Delante del cine, a las siete. | En casa de Lucía, a las siete. | Delante del cine, a las ocho."
              source: genial
      - mission:
          id: beach
          title: Приглашение на выходные
          text: "Вы хотите позвать Диего на пляж в воскресенье. Встретиться можно в десять перед вокзалом."
      - build:
          source: beach
          skill: invite
          items:
            - es: "¿Quieres ir a la playa el domingo?"
              ru: "Пригласите Диего: «Хочешь пойти на пляж в воскресенье?»"
              extra: [vas]
      - choose:
          source: beach
          skill: invite
          items:
            - lines: ["Diego: ¡Genial! ¿A qué hora quedamos?"]
              options: "¿Quedamos a las diez delante de la estación? | ¿Quedamos a las diez en la estación de tren mañana? | Lo siento, no puedo."
              explain: "Вы договорились на воскресенье в десять перед вокзалом: ¿Quedamos a las diez delante de la estación?"
      - choose:
          title: Послушайте и выберите
          free: true
          skill: invite
          items:
            - say: "Lo siento, no puedo."
              options: "Извини, я не могу. | Извини, я не хочу. | Конечно, могу."
              noaudio: {q: "Что значит «Lo siento, no puedo.»?", options: "Извини, я не могу. | Извини, я не хочу. | Конечно, могу."}
            - say: "¿Quedamos a las ocho?"
              options: "Встретимся в восемь? | Ты придёшь в восемь? | Встречаемся в девять?"
              noaudio: {q: "Что значит «¿Quedamos a las ocho?»?", options: "Встретимся в восемь? | Ты придёшь в восемь? | Встречаемся в девять?"}

      - write:
          title: Напишите по-испански
          bank: true
          skill: invite
          format: фраза по-испански
          items:
            - q: "Пригласите Ану в кино в пятницу."
              a: "(Ana, )¿quieres ir al cine el viernes? | ¿Vamos al cine el viernes?"
            - q: "Откажитесь: «Извини, я не могу. Давай в другой день»."
              a: "Lo siento, no puedo. Otro día | Lo siento, no puedo. ¿Otro día?"
            - q: "Согласитесь: «Отлично! Во сколько встречаемся?»"
              a: "¡[Genial/Perfecto]! ¿A qué hora quedamos?"

  - id: lectura
    kind: reading
    title: Планы на лето
    goal: понять письмо о планах на отпуск
    version: 3
    vocab:
      - "🧳 el viaje [бья́хэ] — путешествие, поездка"
      - "🏝 las vacaciones [бакаθьо́нэс] — отпуск, каникулы"
      - "🤝 conocer [коноθэ́р] — знакомиться; знать (людей, места)"
    blocks:
      - learn: [el viaje, las vacaciones, conocer]
      - "Наталья пишет школьной подруге Ольге о планах на отпуск."
      - reading:
          id: natalia
          title: ¡Nos vamos de viaje!
          text: |
            ¡Hola, Olga! ¿Qué tal?

            Tengo una noticia: ¡en agosto voy a viajar a España con mi novio! Vamos a estar dos semanas. La fecha del viaje: del cinco al diecinueve de agosto.

            Primero vamos a visitar Madrid: queremos ver el museo del Prado y el parque del Retiro. Después vamos a ir a Valencia, porque mi novio quiere comer una paella de verdad. Y luego vamos a descansar en la playa. En agosto el clima es muy bueno para la playa, pero hace mucho calor.

            ¿Tú vas a estar en Valencia en agosto? ¡Quiero conocer a tu marido! Y tú vas a conocer a mi novio, Andrés: es alto, tiene el pelo castaño y es muy simpático. ¡Y en otoño tienes que visitar Kiev!

            Un beso,
            Natalia
          translation: |
            Привет, Ольга! Как дела?

            У меня новость: в августе я еду в Испанию с моим парнем! Мы будем там две недели. Даты поездки: с пятого по девятнадцатое августа.

            Сначала мы посетим Мадрид: хотим посмотреть музей Прадо и парк Ретиро. Потом поедем в Валенсию, потому что мой парень хочет попробовать настоящую паэлью. А потом будем отдыхать на пляже. В августе для пляжа очень хорошая погода, но очень жарко.

            Ты будешь в Валенсии в августе? Я хочу познакомиться с твоим мужем! А ты познакомишься с моим парнем, Андресом: он высокий, у него каштановые волосы, и он очень приятный. А осенью тебе нужно приехать в Киев!

            Целую,
            Наталья
      - more:
          title: Новые слова письма
          text: "**la noticia** — «новость», **de verdad** — «настоящий» (_una paella de verdad_), **un beso** — «поцелуй»: так испанцы заканчивают письма друзьям, как мы пишем «целую»."
      - choose:
          title: Responde
          source: natalia
          rule: none
          items:
            - q: "¿Cuándo va a viajar Natalia a España?"
              options: "En agosto. | En julio. | En mayo."
            - q: "¿Dónde va a estar Natalia en las vacaciones?"
              options: "En España. | En casa. | En Kiev."
            - q: "¿Con quién va de viaje?"
              options: "Con su novio. | Con Olga. | Con su familia."
            - q: "¿Por qué van a ir a Valencia?"
              options: "Porque su novio quiere comer una paella. | Porque quieren ver el Prado. | Porque tienen una casa allí."
            - q: "¿A quién quiere conocer Natalia?"
              options: "Al marido de Olga. | Al jefe de Olga. | A sus abuelos."
      - sort:
          title: Что где?
          source: natalia
          rule: none
          groups:
            "Madrid": [el museo del Prado, el parque del Retiro]
            "Valencia": [una paella de verdad]
      - choose:
          title: Послушайте и выберите
          free: true
          skill: ir_a_inf
          items:
            - say: "Vamos a conocer Sevilla."
