id: planes
number: 19
level: A1
title: Планы
goals:
  - рассказать о планах на вечер, выходные и лето
  - сказать, что нужно сделать
  - пригласить, согласиться и вежливо отказаться

lessons:
  - id: cuando
    kind: vocab
    title: Сегодня вечером, на следующей неделе
    goal: сказать, когда — сегодня вечером, послезавтра, на следующей неделе
    vocab:
      - "📝 el plan [план] — план :: ¿Tienes planes para el sábado? — У тебя есть планы на субботу?"
      - "🌙 esta noche [э́ста но́чэ] — сегодня вечером"
      - "⏭ pasado mañana [паса́до манья́на] — послезавтра"
      - "📅 la semana que viene [ла сэма́на кэ бьэ́нэ] — на следующей неделе"
      - "📆 el año que viene [эль а́ньо кэ бьэ́нэ] — в следующем году"
      - "➡️ próximo/a [про́ксимо, про́ксима] — следующий :: el próximo lunes — в следующий понедельник"
    blocks:
      - "Тема — будущее. Часть слов «когда?» вы уже знаете: **mañana** — «завтра», **el fin de semana** — «выходные», **luego** — «потом»."
      - learn: [el plan, esta noche, pasado mañana]
      - choose:
          title: Traduce
          items:
            - q: "Pasado mañana es sábado."
              options: "Послезавтра суббота. | Завтра суббота. | Сегодня суббота."
      - learn: [la semana que viene, el año que viene, próximo/a]
      - match:
          title: Соедините пары
          pairs:
            - "esta noche — сегодня вечером"
            - "pasado mañana — послезавтра"
            - "la semana que viene — на следующей неделе"
            - "el año que viene — в следующем году"
            - "el próximo lunes — в следующий понедельник"
      - note: "**para** — «для» или «на»: _planes para el sábado_ — «планы на субботу». Вы знаете его по _para mí_ — «для меня»."
      - write:
          title: Traduce
          format: по-испански
          items:
            - "в следующую пятницу => el próximo viernes"
            - "сегодня вечером => esta noche"
      - build:
          title: Соберите фразу
          items:
            - es: "¿Qué planes tienes para el fin de semana?"
              ru: "Какие у тебя планы на выходные?"
              extra: [por]

  - id: ir_a
    kind: grammar
    title: "Voy a + инфинитив: ближайшее будущее"
    goal: рассказать о планах — voy a + инфинитив
    vocab:
      - "🏛 visitar [бисита́р] — посещать, навещать"
      - "🛋 descansar [дэсканса́р] — отдыхать"
      - "🎉 la fiesta [фьэ́ста] — праздник, вечеринка"
      - "🤝 quedar [кэда́р] — встречаться, договариваться о встрече :: Quedo con mis amigos. — Я встречаюсь с друзьями."
    blocks:
      - "Как сказать «я собираюсь…» или «я буду…»? Найдите в примерах знакомый глагол."
      - examples:
          items:
            - "Esta noche voy a ver una película. — Сегодня вечером я буду смотреть фильм."
            - "¿Qué vas a hacer el sábado? — Что ты будешь делать в субботу?"
      - compare:
          cards:
            - head: ir + a + инфинитив
              say: false
              label: собираюсь, буду
              tone: blue
              text: 'По лицам меняется только **ir**, инфинитив — всегда тот же. **a** пропускать нельзя: _Voy a cocinar_, а не `Voy cocinar`.'
              ex: ["Voy a trabajar.", "Hoy va a nevar.", "En agosto vamos a ir a Málaga."]
      - choose:
          title: Как сказать?
          items:
            - q: "Я буду готовить."
              options: "Voy a cocinar. | Voy cocinar. | Voy de cocinar."
      - learn: [visitar, descansar, la fiesta, quedar]
      - note: "Если после глагола стоит **человек**, перед ним ставят **a**: _Visito **a** mis abuelos._ _Quiero ver **a** Ana._ Перед местом или вещью — нет: _Visito el museo._"
      - choose:
          title: Выберите
          items:
            - q: "Я навещаю бабушку и дедушку."
              options: "Visito a mis abuelos. | Visito mis abuelos. | Visito de mis abuelos."
            - q: "Мы посещаем музей."
              options: "Visitamos el museo. | Visitamos al museo. | Visitamos a museo."
      - write:
          title: Вставьте ir + a
          format: форма ir + a
          items:
            - "(yo) ___ estudiar. => voy a"
            - "¿Qué ___ hacer (tú) esta noche? => vas a"
            - "Mañana ___ llover. => va a"
            - "Ellos ___ quedar con sus amigos. => van a"
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Завтра я буду отдыхать. => Mañana voy a descansar"
            - "Мы собираемся путешествовать. => Vamos a viajar"

  - id: tener_que
    kind: grammar
    title: "Tengo que: что нужно сделать"
    goal: сказать, что нужно сделать, — tengo que, hay que
    vocab:
      - "❗ tener que [тэнэ́р кэ] — быть должным, нужно (кому-то) :: Tengo que trabajar. — Мне нужно работать."
      - "📌 hay que [ай кэ] — нужно, надо (всем, вообще) :: Hay que comprar pan. — Нужно купить хлеб."
      - "🛒 comprar [компра́р] — покупать"
    blocks:
      - learn: [tener que, hay que, comprar]
      - compare:
          cards:
            - head: tener que
              label: нужно конкретному человеку
              tone: blue
              text: '**tener** меняется по лицам.'
              ex: ["Tengo que cocinar.", "Ana tiene que ir al banco."]
            - head: hay que
              label: надо вообще, всем
              tone: sun
              text: '**hay** никогда не меняется.'
              ex: ["Hay que beber mucha agua.", "Hay que cerrar la ventana."]
      - choose:
          title: Как сказать?
          items:
            - q: "Ане нужно сходить в банк."
              options: "Ana tiene que ir al banco. | Ana hay que ir al banco. | Ana tiene ir al banco."
            - q: "Надо (всем) пить много воды."
              options: "Hay que beber mucha agua. | Hay beber mucha agua. | Tiene que beber mucha agua."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Нам нужно купить хлеб. => Tenemos que comprar pan"
            - "Мне нужно позвонить маме. (llamar a mi madre) => Tengo que llamar a mi madre"
      - rule: "После **quiero**, **puedo**, **prefiero** инфинитив идёт без **que**: _Quiero descansar._ _Hoy no puedo ir._"
      - choose:
          title: Выберите
          items:
            - q: "Hoy no puedo ___."
              options: "ir | que ir | a ir"

  - id: invitacion
    kind: dialogue
    title: Пойдём в кино?
    goal: пригласить, согласиться и вежливо отказаться
    vocab:
      - "😔 lo siento [ло сьэ́нто] — мне жаль, извини"
      - "🔁 otro día [о́тро ди́а] — в другой раз"
      - "🤩 ¡Genial! [хэнья́ль] — отлично! здорово!"
      - "🤝 ¿Quedamos...? [кэда́мос] — встретимся...? :: ¿Quedamos a las ocho? — Встретимся в восемь?"
      - "👍 ¡Perfecto! [пэрфэ́кто] — отлично! идеально!"
    blocks:
      - learn: [lo siento, otro día]
      - choose:
          title: Что ответить?
          items:
            - lines: ["Pablo: ¿Quieres ir al cine esta noche?"]
              q: "Вы не можете: нужно заниматься."
              options: "Lo siento, no puedo. Tengo que estudiar. | Sí, claro. Tengo que estudiar. | Lo siento, hay que estudiar."
      - learn: ["¡Genial!", "¿Quedamos...?", "¡Perfecto!"]
      - sort:
          title: Согласие или отказ?
          groups:
            "✅ да": ["¡Genial!", "¡Perfecto!", "Sí, claro."]
            "❌ нет": ["Lo siento, no puedo.", "Otro día."]
      - dialogue:
          title: Отказ
          lines:
            - "Pablo: Hola, Lucía. ¿Quieres ir al cine esta noche? | Привет, Лусия. Хочешь пойти в кино сегодня вечером?"
            - "Lucía: Lo siento, esta noche no puedo. Tengo que estudiar. | Извини, сегодня вечером не могу. Мне нужно заниматься."
            - "Pablo: Vale, otro día. | Ладно, в другой раз."
      - dialogue:
          title: Согласие
          lines:
            - "Pablo: ¿Y el sábado? ¿Qué vas a hacer? | А в субботу? Что будешь делать?"
            - "Lucía: El sábado no tengo planes. | В субботу у меня нет планов."
            - "Pablo: ¿Vamos al cine el sábado? | Пойдём в кино в субботу?"
            - "Lucía: ¡Genial! ¿A qué hora quedamos? | Отлично! Во сколько встретимся?"
            - "Pablo: ¿Quedamos a las siete delante del cine? | Встретимся в семь перед кинотеатром?"
            - "Lucía: ¡Perfecto! Hasta el sábado. | Отлично! До субботы."
      - choose:
          title: Responde
          items:
            - q: "¿Por qué Lucía no puede ir al cine esta noche?"
              options: "Porque tiene que estudiar. | Porque está enferma. | Porque no le gusta el cine."
            - q: "¿Dónde quedan?"
              options: "Delante del cine, a las siete. | En casa de Lucía, a las siete. | Delante del cine, a las ocho."
      - mission:
          title: Приглашение на выходные
          text: "Вы хотите позвать Диего на пляж в воскресенье. Встретиться можно в десять перед вокзалом."
      - build:
          items:
            - es: "¿Quieres ir a la playa el domingo?"
              ru: "Пригласите Диего: «Хочешь пойти на пляж в воскресенье?»"
              extra: [vas]
      - choose:
          items:
            - lines: ["Diego: ¡Genial! ¿A qué hora quedamos?"]
              options: "¿Quedamos a las diez delante de la estación? | ¿Quedamos a las diez en la estación de tren mañana? | Lo siento, no puedo."
              explain: "Вы договорились на воскресенье в десять перед вокзалом: ¿Quedamos a las diez delante de la estación?"

  - id: lectura
    kind: reading
    title: Планы на лето
    goal: понять письмо о планах на отпуск
    vocab:
      - "🧳 el viaje [бья́хэ] — путешествие, поездка"
      - "🏝 las vacaciones [бакаθьо́нэс] — отпуск, каникулы"
      - "🤝 conocer [коноθэ́р] — знакомиться; знать (людей, места)"
    blocks:
      - "Ирина пишет подруге о своих планах на отпуск."
      - learn: [el viaje, las vacaciones, conocer]
      - reading:
          title: ¡Nos vamos de viaje!
          text: |
            ¡Hola, Ana! ¿Qué tal?

            Tengo una noticia: ¡en agosto voy a viajar a España con mi novio! Vamos a estar dos semanas.

            Primero vamos a visitar Madrid: queremos ver el museo del Prado y el parque del Retiro. Después vamos a ir a Valencia, porque mi novio quiere comer una paella de verdad. Y luego vamos a descansar en la playa.

            ¿Tú vas a estar en Madrid en agosto? ¡Quiero conocer a tu familia!

            Un beso,
            Irina
          translation: |
            Привет, Ана! Как дела?

            У меня новость: в августе я еду в Испанию с моим парнем! Мы будем там две недели.

            Сначала мы посетим Мадрид: хотим посмотреть музей Прадо и парк Ретиро. Потом поедем в Валенсию, потому что мой парень хочет попробовать настоящую паэлью. А потом будем отдыхать на пляже.

            Ты будешь в Мадриде в августе? Я хочу познакомиться с твоей семьёй!

            Целую,
            Ирина
      - more:
          title: Новые слова письма
          text: "**la noticia** — «новость», **de verdad** — «настоящий» (_una paella de verdad_), **un beso** — «поцелуй»: так испанцы заканчивают письма друзьям, как мы пишем «целую»."
      - choose:
          title: Responde
          items:
            - q: "¿Cuándo va a viajar Irina a España?"
              options: "En agosto. | En julio. | En mayo."
            - q: "¿Con quién va a viajar?"
              options: "Con su novio. | Con Ana. | Con su familia."
            - q: "¿Por qué van a ir a Valencia?"
              options: "Porque su novio quiere comer una paella. | Porque quieren ver el Prado. | Porque la familia de Ana vive allí."
      - sort:
          title: Что где?
          groups:
            "Madrid": [el museo del Prado, el parque del Retiro]
            "Valencia": [una paella de verdad]
    forms: [noticia, verdad, beso]
    quiz:
      - q: ¿Cuántas semanas van a estar en España?
        options: "dos | una | tres"
      - q: ¿Qué van a hacer después de Valencia?
        options: "descansar en la playa | visitar Madrid | comer en Valencia"

  - id: quiz
    kind: quiz
    title: Планы
    blocks:
      - "Пришло время проверить себя: это тест по теме «Планы»."
      - cando:
          - "рассказать о планах: voy a + инфинитив"
          - "сказать, что нужно сделать: tengo que, hay que"
          - "пригласить, согласиться и отказаться"
    quiz:
      - q: "Mañana ___ visitar a mis abuelos."
        options: "voy a | voy | voy de"
        explain: "О планах говорят по схеме ir + a + инфинитив, и предлог a пропускать нельзя: voy a visitar, vamos a comer."
      - q: "¿Qué ___ hacer el sábado? (ты)"
        options: "vas a | va a | vas"
        explain: "Вопрос обращён к «ты», поэтому нужна форма vas, а после неё обязательно идёт a: vas a hacer."
      - q: Как сказать «Мне нужно работать»?
        options: "Tengo que trabajar. | Hay que trabajo. | Tengo trabajar."
        explain: "Если что-то нужно сделать конкретному человеку, говорят tener que + инфинитив: tengo que trabajar, tienes que estudiar."
      - q: Как вежливо отказаться?
        options: "Lo siento, no puedo. | ¡Genial! | ¡Perfecto!"
      - q: Что значит «la semana que viene»?
        options: "на следующей неделе | на этой неделе | на прошлой неделе"
