  - id: quiz
    kind: quiz
    title: Планы
    goal: рассказать о планах, сказать, что нужно сделать, пригласить и ответить
    version: 3
    check: soft
    blocks:
      - "Это тест по теме «Планы»."
      - cando:
          - "рассказать о планах: voy a + инфинитив"
          - "сказать, что нужно сделать: tengo que, hay que"
          - "пригласить, согласиться и отказаться"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "esta noche — сегодня вечером"
            - "descansar — отдыхать"
            - "comprar — покупать"
            - "lo siento — мне жаль"
            - "las vacaciones — отпуск"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          items:
            - q: "Скажите: «В субботу я буду отдыхать»"
              a: "El sábado voy a descansar | (Yo) voy a descansar el sábado | El sábado (yo) voy a descansar"
              skill: ir_a_inf
              mistakes: {"el sabado voy descansar": "После ir — **a** перед инфинитивом: voy **a** descansar."}
            - q: "Откажитесь: «Извини, не могу: мне нужно работать»"
              a: "Lo siento, no puedo: tengo que trabajar | Lo siento, no puedo. Tengo que trabajar | Lo siento, tengo que trabajar"
              skill: tener_que
              mistakes: {"lo siento no puedo tengo trabajar": "«Нужно» — **tengo que**: tengo que trabajar."}
    quiz:
      - q: "Mañana ___ visitar a mis abuelos."
        options: "voy a | voy | voy de"
        explain: "О планах говорят по схеме ir + a + инфинитив, и предлог a пропускать нельзя: voy a visitar, vamos a comer."
        skill: ir_a_inf
      - q: "¿Qué ___ hacer el sábado? (ты)"
        options: "vas a | va a | vas"
        explain: "Вопрос обращён к «ты», поэтому нужна форма vas, а после неё обязательно идёт a: vas a hacer."
        skill: ir_a_inf
      - q: Как сказать «Мне нужно работать»?
        options: "Tengo que trabajar. | Hay que trabajo. | Tengo trabajar."
        explain: "Если что-то нужно сделать конкретному человеку, говорят tener que + инфинитив: tengo que trabajar, tienes que estudiar."
        skill: tener_que
      - q: Как вежливо отказаться?
        options: "Lo siento, no puedo. | ¡Genial! | ¡Perfecto!"
        skill: invite
      - q: Что значит «la semana que viene»?
        options: "на следующей неделе | на этой неделе | на прошлой неделе"
        skill: future_time
