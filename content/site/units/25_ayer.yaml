          title: Вспомним
          skills: [desde_hace, saber_conocer, para_porque]
          n: 2
      - mission:
          id: oficina
          title: Понедельник в офисе
          text: "Понедельник, утро. В субботу вы ездили с друзьями в Толедо, а в воскресенье остались дома и ничего не делали. Коллега Лусия расспрашивает вас о выходных."
      - chat:
          id: lucia
          title: В офисе
          with: Lucía
          skill: fui_fue
          turns:
            - say: "¡Hola! ¿Qué tal el fin de semana? | Привет! Как выходные?"
              build: "Muy bien, gracias. ¿Y tú?"
              ru: "Очень хорошо, спасибо. А ты?"
            - say: "Bien, muy tranquilo. ¿Qué hiciste el sábado? | Хорошо, очень спокойно. Что ты делал в субботу?"
              task: "В субботу вы ездили в Толедо с друзьями."
              write: "Fui a Toledo con mis amigos | El sábado fui a Toledo con mis amigos | Fui a Toledo con [unos/los] amigos | Fui a Toledo | El sábado fui a Toledo"
              format: куда и с кем
              mistakes:
                "voy a toledo con mis amigos": "Voy — настоящее время. О субботе — **fui**."
                "fui en toledo con mis amigos": "Куда — с предлогом **a**: fui **a** Toledo."
            - say: "¡Qué bien! ¿Y qué tal fue? | Здорово! И как всё прошло?"
              task: "Вам очень понравилось."
              choose: "Fue genial. | Fui genial. | Estuve genial."
              explain: "Поездка — «она»: fue genial. Fui и estuve — формы «я»."
            - say: "¿Y qué visitasteis? | А что вы посетили?"
              task: "Вы с друзьями посетили собор и музей."
              skill: pret_ar
              write: "Visitamos la catedral y un museo | Visitamos la catedral y el museo | La catedral y [un/el] museo"
              format: что вы посетили
              mistakes:
                "visitasteis la catedral y un museo": "Visitasteis — «вы посетили». О себе с друзьями — **visitamos**."
                "visité la catedral y un museo": "Вы были с друзьями, поэтому «мы»: **visitamos**."
            - say: "¿Y el domingo? ¿Qué hiciste? | А в воскресенье? Что ты делал?"
              task: "В воскресенье вы остались дома и ничего не делали."
              skill: pret_irregular
              write: "Me quedé en casa y no hice nada | El domingo me quedé en casa y no hice nada | Estuve en casa y no hice nada | El domingo estuve en casa y no hice nada | Me quedé en casa | No hice nada | El domingo no hice nada | Estuve en casa"
              format: где были и что делали
              mistakes:
                "me quedo en casa y no hago nada": "Это настоящее время. О воскресенье — **me quedé** и **no hice** nada."
            - say: "Yo también. ¿Viste el partido anoche? | Я тоже. Ты смотрел вчера матч?"
              task: "Ответьте от себя: что вы делали вчера вечером."
              skill: pret_er_ir
              compose:
                format: "Sí, … / No, …"
                words: [2, 25]
                checks:
                  - label: "начинается с Sí или No"
                    starts: ["sí", "no"]
                  - label: "есть глагол в прошедшем времени: vi, cené, salí, me acosté…"
                    any: [vi, vimos, cené, salí, acosté, leí, estudié, trabajé, quedé, estuve, fui, hice, descansé, cociné]
                sample: "No, no vi el partido. Cené y me acosté temprano."
                sample_ru: "Нет, матч я не смотрел. Поужинал и рано лёг спать."
            - say: "¡Fue un partido increíble! | Матч был потрясающий!"
