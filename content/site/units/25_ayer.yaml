  - id: ir_ser
    kind: grammar
    title: "Fui, fue: глаголы ir и ser"
    goal: сказать, куда вы ходили, и оценить — «было здорово»
    version: 2
    vocab:
      - "🏘 el pueblo [пуэ́бло] — деревня, городок :: Fuimos a un pueblo de la montaña. — Мы ездили в горную деревню."
      - "🌾 el campo [ка́мпо] — сельская местность, природа за городом :: Pasé el domingo en el campo. — Я провёл воскресенье за городом."
      - "🖼 la exposición [экспосиθьо́н] — выставка {pl: exposiciones} :: Vimos una exposición de fotos. — Мы посмотрели выставку фотографий."
      - "🤩 increíble [инкрэи́бле] — невероятный, потрясающий :: El concierto fue increíble. — Концерт был потрясающий."
      - "💬 ¿Qué tal fue? [кэ таль фуэ́] — как всё прошло? :: ¿Qué tal fue la fiesta? — Как прошла вечеринка?"
    blocks:
      - "Самые нужные глаголы в прошедшем времени неправильные. Форму **fui** вы уже знаете. Вот остальные формы глагола ir."
      - conjugation:
          id: ir
          verb: ir
          ru: "ходить, ездить — в прошлом"
          highlight: false
          forms: [fui, fuiste, fue, fuimos, fuisteis, fueron]
      - compare:
          id: ir_ser
          style: small
          title: Один набор форм — два глагола
          cards:
            - head: Fui al cine.
              label: "ir: я ходил"
            - head: Fue genial.
              label: "ser: было здорово"
          note: "У глаголов **ir** и **ser** формы прошедшего времени одинаковые. Различить легко: после _fui a…_ стоит место — это ir; _fue_ + «какой» — это ser."
      - learn: [el pueblo, el campo, "¿Qué tal fue?"]
      - write:
          title: Вставьте форму ir или ser
          format: одна форма глагола
          skill: fui_fue
          rule: ir
          items:
            - q: "El domingo (nosotros, ir) ___ al campo."
              a: "fuimos"
              explain: "Nosotros — fuimos."
            - q: "¿Adónde (tú, ir) ___ ayer?"
              a: "fuiste"
              explain: "Tú — fuiste."
              mistakes:
                "fuistes": "В форме «ты» на конце нет `s`: **fuiste**."
            - q: "Mis padres (ir) ___ a un pueblo de la montaña."
              a: "fueron"
              explain: "Ellos — fueron."
            - q: "La película (ser) ___ muy divertida."
              a: "fue"
              explain: "Ser, она — fue: «фильм был очень весёлый»."
              mistakes:
                "fué": "Короткие формы fue и fui пишутся без знака ударения."
      - choose:
          title: Ir или ser?
          skill: fui_fue
          rule: ir_ser
          items:
            - q: "Ayer **fui** al médico. Какой это глагол?"
              options: "ir — «ходил» | ser — «был»"
              explain: "Fui al… — куда: это ir."
            - q: "La fiesta **fue** muy divertida. Какой это глагол?"
              options: "ser — «была» | ir — «ходила»"
              explain: "Fue + какая (divertida) — это ser."
      - learn: [la exposición, increíble]
      - choose:
          title: Что сказать?
          skill: fui_fue
          rule: ir_ser
          items:
            - lines: ["Ana: Ayer fui a una exposición de fotos."]
              q: "Спросите, как всё прошло."
              options: "¿Qué tal fue? | ¿Qué tal estás? | ¿Qué hiciste?"
              explain: "¿Qué tal fue? — «как всё прошло?». ¿Qué tal estás? — «как ты?»."
            - lines: ["Pablo: ¿Qué tal fue el concierto?"]
              q: "Вам очень понравилось."
              options: "Fue increíble. | Fui increíble. | Fueron increíble."
              explain: "Концерт — «он»: fue increíble. Fui — «я был»."
      - choose:
          title: Послушайте
          skill: fui_fue
          rule: ir
          items:
            - say: "¿Adónde fuiste el domingo?"
              options: "Куда ты ездил в воскресенье? | Куда ты едешь в воскресенье? | Где ты был в воскресенье?"
              explain: "Fuiste — «ты ездил»; adónde — «куда»."
              noaudio: {q: "Что значит «¿Adónde fuiste el domingo?»", options: "Куда ты ездил в воскресенье? | Куда ты едешь в воскресенье? | Где ты был в воскресенье?"}
      - build:
          title: Соберите фразу
          skill: fui_fue
          rule: ir
          items:
            - es: "El sábado fuimos a una exposición de fotos."
              ru: "В субботу мы ходили на выставку фотографий."
              alt: ["Fuimos a una exposición de fotos el sábado."]
              extra: [fue]
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: fui_fue
          rule: ir_ser
          items:
            - q: "Концерт был потрясающий."
              a: "El concierto fue increíble"
              explain: "Концерт — «он»: fue."
              mistakes:
                "el concierto fui increíble": "Fui — форма «я». Концерт — «он»: **fue**."
                "el concierto es increíble": "Es — настоящее время. Концерт уже прошёл: **fue**."
      - compose:
          title: О себе
          skill: fui_fue
          rule: ir_ser
          items:
            - q: "¿Adónde fuiste el fin de semana pasado y qué tal fue? Напишите две фразы."
              format: "Fui a… Fue…"
              words: [4, 30]
              checks:
                - label: "куда: fui a… или fuimos a…"
                  any: [fui a, fui al, fuimos a, fuimos al, fui de, fuimos de]
                - label: "оценка: fue…"
                  any: [fue]
              sample: "Fui a la playa con mis amigos. Fue genial."
              sample_ru: "Я ездил на пляж с друзьями. Было здорово."
    quiz:
      - q: "El concierto ___ increíble."
        options: "fue | fui | fueron"
        explain: "Концерт — «он», ser: fue increíble."
        skill: fui_fue
      - q: "— ¿Adónde ___ ayer? — Fui al cine."
        options: "fuiste | fue | fui"
        explain: "Вопрос к «ты»: fuiste. В ответе — fui."
        skill: fui_fue

  - id: irregulares
    kind: grammar
    title: "Hice, estuve, tuve"
    goal: сказать, что вы делали, где были и что вам пришлось сделать
    version: 2
    blocks:
      - "Ещё три частых глагола с особыми формами: hacer, estar и tener. Форму **hiciste** вы знаете по вопросу _¿Qué hiciste?_"
      - conjugation:
          id: hacer
          verb: hacer
          ru: "делать — в прошлом"
          highlight: false
          forms: [hice, hiciste, hizo, hicimos, hicisteis, hicieron]
      - conjugation:
          id: estar
          verb: estar
          ru: "быть, находиться — в прошлом"
          highlight: false
          forms: [estuve, estuviste, estuvo, estuvimos, estuvisteis, estuvieron]
      - conjugation:
          id: tener
          verb: tener
          ru: "иметь — в прошлом; tuve que… — «мне пришлось»"
          highlight: false
          forms: [tuve, tuviste, tuvo, tuvimos, tuvisteis, tuvieron]
      - note:
          id: sin_tilde
          text: "У этих трёх глаголов новая основа (**hic-**, **estuv-**, **tuv-**) и общие окончания без знаков ударения: -e, -iste, -o, -imos, -isteis, -ieron. В форме «он» у hacer пишется `z`: **hizo**."
      - write:
          title: Поставьте глагол в прошедшее время
          format: одна форма глагола
          skill: pret_irregular
          rule: sin_tilde
          items:
            - q: "Ayer (yo, hacer) ___ la cena."
              a: "hice"
              explain: "Yo — hice."
              mistakes:
                "hací": "У hacer особая основа: **hice**, а не `hací`."
            - q: "¿Qué (hacer) ___ Pablo el sábado?"
              a: "hizo"
              explain: "Él — hizo, с буквой z."
              mistakes:
                "hico": "В форме «он» пишется `z`: **hizo** — иначе читалось бы [ико]."
            - q: "El fin de semana (yo, estar) ___ en casa de mis abuelos."
              a: "estuve"
              explain: "Yo — estuve."
              mistakes:
                "esté": "У estar особая основа: **estuve**."
            - q: "¿Dónde (tú, estar) ___ anoche?"
              a: "estuviste"
              explain: "Tú — estuviste."
            - q: "Ayer (yo, tener) ___ mucho trabajo."
              a: "tuve"
              explain: "Yo — tuve."
              mistakes:
                "tení": "У tener особая основа: **tuve**."
            - q: "Ana no fue a la fiesta: (tener) ___ que estudiar."
              a: "tuvo"
              explain: "Ella — tuvo: tuvo que estudiar — «ей пришлось заниматься»."
      - sort:
          title: Какой это глагол?
          skill: pret_irregular
          rule: sin_tilde
          groups:
            "ir": [fui al cine, fuimos a la playa]
            "estar": [estuve en casa, estuvo enfermo]
            "hacer": [hice la cena, no hicimos nada]
            "tener": [tuve un examen, tuvieron que trabajar]
      - choose:
          title: Послушайте
          skill: pret_irregular
          items:
            - say: "El sábado estuvimos en un pueblo muy bonito."
              options: "В субботу мы были в очень красивом городке. | В субботу мы поедем в очень красивый городок. | В субботу они были в очень красивом городке."
              explain: "Estuvimos — «мы были»."
              noaudio: {q: "Что значит «El sábado estuvimos en un pueblo muy bonito»?", options: "В субботу мы были в очень красивом городке. | В субботу мы поедем в очень красивый городок. | В субботу они были в очень красивом городке."}
            - say: "Tuve que trabajar todo el domingo."
              options: "Мне пришлось работать всё воскресенье. | Я хочу работать в воскресенье. | У меня есть работа в воскресенье."
              explain: "Tuve que + инфинитив — «мне пришлось»."
              noaudio: {q: "Что значит «Tuve que trabajar todo el domingo»?", options: "Мне пришлось работать всё воскресенье. | Я хочу работать в воскресенье. | У меня есть работа в воскресенье."}
      - build:
          title: Соберите фразу
          skill: pret_irregular
          items:
            - es: "El domingo no hice nada."
              ru: "В воскресенье я ничего не делал."
              alt: ["No hice nada el domingo."]
            - es: "¿Dónde estuviste el fin de semana pasado?"
              ru: "Где ты был в прошлые выходные?"
              extra: [fuiste]
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: pret_irregular
          items:
            - q: "В субботу я был дома."
              a: "El sábado estuve en casa | Estuve en casa el sábado | (Yo) el sábado estuve en casa"
              explain: "«Был где-то» — estuve."
              mistakes:
                "el sábado fui en casa": "«Был где-то» — **estuve**: estuve en casa. А fui a… — «ходил, ездил куда-то»."
                "el sábado estoy en casa": "Estoy — настоящее время. О субботе — **estuve**."
            - q: "Мне пришлось работать."
              a: "Tuve que trabajar | (Yo) tuve que trabajar"
              explain: "Tuve que + инфинитив."
              mistakes:
                "tuve trabajar": "Между tuve и инфинитивом нужно **que**: tuve **que** trabajar."
                "tengo que trabajar": "Tengo que — «мне нужно» сейчас. «Пришлось» — **tuve que**."
      - compose:
          title: О себе
          skill: pret_irregular
          rule: sin_tilde
          items:
            - q: "¿Dónde estuviste y qué hiciste el fin de semana pasado? Напишите две-три фразы."
              format: "El sábado fui… El domingo estuve…"
              words: [6, 40]
              sentences: 2
              checks:
                - label: "есть fui, estuve, hice или tuve (или форма «мы»)"
                  any: [fui, estuve, hice, tuve, fuimos, estuvimos, hicimos, tuvimos]
              sample: "El sábado fui al campo con mi familia. El domingo estuve en casa y no hice nada."
              sample_ru: "В субботу я ездил за город с семьёй. В воскресенье был дома и ничего не делал."
    quiz:
      - q: "Ayer ___ que trabajar hasta las diez."
        options: "tuve | estuve | fui"
        explain: "«Пришлось» — tuve que + инфинитив."
        skill: pret_irregular
      - q: "¿Qué ___ Pablo el sábado?"
        options: "hizo | hice | hiciste"
        explain: "Pablo — «он»: hizo."
        skill: pret_irregular

  - id: lectura
    kind: reading
    title: "Un fin de semana en Toledo"
    goal: понять письмо о выходных и написать о своих
    version: 2
    vocab:
      - "⛪ la catedral [катэдра́ль] — собор {pl: catedrales} :: Visitamos la catedral. — Мы посетили собор."
      - "🏛 antiguo/a [анти́гуо, анти́гуа] — старинный, древний :: Toledo es una ciudad muy antigua. — Толедо — очень древний город."
      - "🎁 el recuerdo [рэкуэ́рдо] — сувенир; воспоминание :: Compré un recuerdo para mi madre. — Я купил сувенир для мамы."
      - "🏁 por último [пор у́льтимо] — напоследок, в конце :: Por último tomamos un café. — Напоследок мы выпили кофе."
      - "🛒 hacer la compra [аθэ́р ла ко́мпра] — ходить за продуктами :: El domingo hice la compra. — В воскресенье я сходил за продуктами."
      - "🤗 un abrazo [абра́θо] — обнимаю (в конце письма) :: Un abrazo, Irina. — Обнимаю, Ирина."
    blocks:
      - learn: [la catedral, antiguo/a, el recuerdo, por último, hacer la compra, un abrazo]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la catedral — собор"
            - "antiguo — старинный"
            - "el recuerdo — сувенир"
            - "por último — напоследок"
            - "hacer la compra — ходить за продуктами"
            - "un abrazo — обнимаю"
      - "Ирина пишет подруге Ольге о выходных."
      - reading:
          id: toledo
          title: Un fin de semana en Toledo
          text: |
            ¡Hola, Olga! ¿Qué tal? Este fin de semana fue genial.

            El sábado fui a Toledo con Diego y sus amigos. Fuimos en tren y llegamos a las diez. Primero visitamos la catedral: es muy antigua y muy bonita. Después paseamos por el centro y comimos en un restaurante pequeño. ¡La comida fue increíble! Por la tarde vimos una exposición y yo compré un recuerdo para mi madre. Por último tomamos un café en una plaza y volvimos a Madrid a las nueve.

            El domingo me quedé en casa. Por la mañana hice la compra, cociné y estudié español. Por la noche vi una película con mi compañera de piso. Me acosté temprano porque hoy tengo clase.

            ¿Y tú? ¿Qué hiciste? ¿Trabajaste el sábado?

            Un abrazo,
            Irina
          translation: |
            Привет, Ольга! Как дела? Эти выходные были отличные.

            В субботу я ездила в Толедо с Диего и его друзьями. Мы поехали на поезде и приехали в десять. Сначала посетили собор: он очень старинный и очень красивый. Потом гуляли по центру и пообедали в маленьком ресторане. Еда была потрясающая! Днём мы посмотрели выставку, и я купила сувенир для мамы. Напоследок выпили кофе на площади и вернулись в Мадрид в девять.

            В воскресенье я осталась дома. Утром сходила за продуктами, готовила и учила испанский. Вечером посмотрела фильм с соседкой по квартире. Легла рано, потому что сегодня у меня занятие.

            А ты? Что ты делала? Работала в субботу?

            Обнимаю,
            Ирина
      - choose:
