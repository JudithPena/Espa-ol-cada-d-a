id: ayer
number: 25
level: A2
title: "¿Qué hiciste ayer? — что ты делал вчера"
goals:
  - рассказать, что вы делали вчера и в выходные
  - спросить другого, как прошли выходные, и оценить — «было здорово»
  - образовывать прошедшее время (pretérito indefinido) правильных глаголов и ir, ser, hacer, estar, tener
  - написать другу сообщение о выходных

# Тема 2 карты A2 (docs/a2_c2_curriculum_map.md): pretérito indefinido — правильные глаголы, ir / ser, hacer, estar, tener;
# маркеры ayer, anoche, el sábado pasado. Особые основы остальных глаголов (pude, vine, dije…) — в теме 26.
lessons:
  - id: finde
    kind: listening
    title: "¿Qué tal el fin de semana?"
    goal: понять на слух рассказ о выходных и спросить «что ты делал?»
    version: 2
    # Карта экранов: docs/site_slide_maps/25_ayer.md
    # формы прошедшего времени из разговора: до правила они даются готовыми словами
    forms: [hice, fuiste, fuimos, nadé, comí, descansé, trabajé, visteis, vimos, gustó, saliste, cené, acosté]
    vocab:
      - "⏪ ayer [айе́р] — вчера :: Ayer fui al cine. — Вчера я ходил в кино."
      - "🌃 anoche [ано́че] — вчера вечером; прошлой ночью :: Anoche cené en casa. — Вчера вечером я ужинал дома."
      - "⏮ anteayer [антэайе́р] — позавчера :: Anteayer fui al médico. — Позавчера я ходил к врачу."
      - "📆 pasado/a [паса́до, паса́да] — прошлый :: El sábado pasado fui a la playa. — В прошлую субботу я ездил на пляж."
      - "❓ ¿Qué hiciste? [кэ иθи́стэ] — что ты делал? что ты сделал? :: ¿Qué hiciste ayer? — Что ты делал вчера?"
      - "🚶 fui [фуи́] — я ходил, я ездил :: El sábado fui a la playa. — В субботу я ездил на пляж."
    blocks:
      - "Понедельник, утро в офисе. Лусия и Пабло рассказывают друг другу о выходных. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: lunes
          hidden: true
          lines:
            - "Pablo: ¡Hola, Lucía! ¿Qué tal el fin de semana? | Привет, Лусия! Как выходные?"
            - "Lucía: ¡Muy bien! El sábado fui a la playa con mis amigas. | Отлично! В субботу я ездила на пляж с подругами."
            - "Pablo: ¡Qué bien! ¿Y qué hiciste allí? | Здорово! И что ты там делала?"
            - "Lucía: Nadé mucho, comí paella y descansé. ¿Y tú? ¿Qué hiciste? | Много плавала, ела паэлью и отдыхала. А ты? Что ты делал?"
            - "Pablo: El sábado trabajé todo el día. Pero ayer fui al cine con Ana. | В субботу я весь день работал. Но вчера ходил в кино с Аной."
            - "Lucía: ¿Qué película visteis? | Какой фильм вы смотрели?"
            - "Pablo: Vimos una película española. Me gustó mucho. | Мы посмотрели испанский фильм. Мне очень понравился."
            - "Lucía: ¿Y anoche? ¿Saliste? | А вчера вечером? Ты куда-нибудь ходил?"
            - "Pablo: No, anoche cené en casa y me acosté temprano. | Нет, вчера вечером я поужинал дома и рано лёг спать."
      - choose:
          title: Что вы поняли?
          source: lunes
          items:
            - q: "Куда Лусия ездила в субботу?"
              options: "A la playa. | Al cine. | A la montaña."
              explain: "Лусия говорит о субботе: a la playa con mis amigas."
            - q: "С кем Пабло ходил в кино?"
              options: "Con Ana. | Con Lucía. | Con sus amigas."
              explain: "Пабло называет Ану: al cine con Ana. С подругами ездила на пляж Лусия."
      - learn: [ayer, anoche, anteayer, pasado/a]
      - text:
          id: notice
          text: "Всё это уже случилось и закончилось — вчера, в субботу. Для таких событий в испанском есть отдельное прошедшее время. Посмотрите на глаголы."
      - examples:
          items:
            - "El sábado **fui** a la playa. — В субботу я **ездила** на пляж."
            - "Ayer **fui** al cine. — Вчера я **ходил** в кино."
            - "Anoche **cené** en casa. — Вчера вечером я **поужинал** дома."
      - sort:
          title: Когда это?
          free: true
          skill: past_markers
          rule: notice
          groups:
            "уже прошло": [ayer, anoche, el sábado pasado, la semana pasada]
            "сейчас или впереди": [hoy, ahora mismo, mañana, la semana que viene]
      - match:
          title: Соедините пары
          free: true
          skill: past_markers
          rule: none
          pairs:
            - "ayer — вчера"
            - "anoche — вчера вечером"
            - "anteayer — позавчера"
            - "el sábado pasado — в прошлую субботу"
            - "la semana pasada — на прошлой неделе"
            - "el año pasado — в прошлом году"
      - learn: ["¿Qué hiciste?", fui]
      - choose:
          title: Детали разговора
          source: lunes
          items:
            - q: "Что Пабло делал в субботу?"
              options: "Работал весь день. | Ходил в кино. | Ездил на пляж."
              explain: "Pablo: El sábado trabajé todo el día."
            - q: "Когда Пабло ходил в кино?"
              options: "Ayer. | Anoche. | El sábado."
              explain: "Pablo: Pero ayer fui al cine con Ana. В субботу он работал, а вчера вечером был дома."
            - q: "Что Пабло делал вчера вечером?"
              options: "Поужинал дома и рано лёг спать. | Ходил в кино с Аной. | Работал допоздна."
              explain: "Pablo: Anoche cené en casa y me acosté temprano."
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: fui_fue
          rule: notice
          items:
            - say: "Ayer fui al cine."
              a: "Ayer fui al cine"
              explain: "Fui — «я ходил»; al = a + el."
              noaudio: {q: "Напишите по-испански: «Вчера я ходил в кино».", a: "Ayer fui al cine | Fui al cine ayer"}
      - choose:
          title: Что ответить?
          free: true
          skill: fui_fue
          rule: notice
          items:
            - lines: ["Lucía: ¿Qué hiciste el sábado?"]
              q: "В субботу вы ездили на пляж."
              options: "Fui a la playa. | Voy a la playa. | Voy a ir a la playa."
              explain: "Fui — это уже было. Voy — «иду сейчас», voy a ir — «собираюсь пойти»."
            - say: "¿Qué hiciste anoche?"
              options: "Что ты делал вчера вечером? | Что ты делаешь сегодня вечером? | Что ты будешь делать завтра?"
              explain: "¿Qué hiciste? — «что ты делал?», anoche — «вчера вечером»."
              noaudio: {q: "Что значит «¿Qué hiciste anoche?»", options: "Что ты делал вчера вечером? | Что ты делаешь сегодня вечером? | Что ты будешь делать завтра?"}
      - build:
          title: Соберите фразу
          free: true
          skill: fui_fue
          rule: none
          items:
            - "¿Qué hiciste ayer? — Что ты делал вчера?"
            - es: "El sábado pasado fui a la montaña."
              ru: "В прошлую субботу я ездил в горы."
              alt: ["Fui a la montaña el sábado pasado."]
              extra: [voy]
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          free: true
          skill: fui_fue
          rule: notice
          items:
            - q: "Вчера я ходил в музей."
              a: "Ayer fui al museo | Fui al museo ayer | (Yo) ayer fui al museo"
              explain: "Fui al museo: a + el = al."
              mistakes:
                "ayer voy al museo": "Voy — настоящее время. О вчерашнем — **fui**."
                "ayer fui a el museo": "a + el сливаются: fui **al** museo."
                "ayer fui en el museo": "Куда — с предлогом **a**: fui **al** museo."
      - sort:
          title: Кто это сказал?
          source: lunes
          groups:
            "Lucía": ["Fui a la playa con mis amigas.", "Nadé mucho y comí paella."]
            "Pablo": ["Trabajé todo el día.", "Anoche cené en casa."]

  - id: verbos_ar
    kind: grammar
    title: "Hablé, hablaste, habló: глаголы на -ar"
    goal: рассказать о вчерашнем дне глаголами на -ar — trabajé, cené, descansé
    version: 2
    unlocks: [preterite]
    forms: [toda, todas, encantó, encantaron]
    vocab:
      - "🛬 llegar [йега́р] — приезжать, приходить :: Ayer llegué tarde a casa. — Вчера я поздно пришёл домой."
      - "🕰 pasar [паса́р] — проводить (время); происходить :: Pasé el domingo en casa. — Я провёл воскресенье дома."
      - "🏡 quedarse [кэда́рсэ] — оставаться :: Anoche me quedé en casa. — Вчера вечером я остался дома."
      - "💌 invitar [инбита́р] — приглашать :: Ana me invitó a su fiesta. — Ана пригласила меня на вечеринку."
      - "🥾 la excursión [экскурсьо́н] — экскурсия, поход {pl: excursiones} :: El sábado fui de excursión. — В субботу я ходил в поход."
      - "🎤 el concierto [конθье́рто] — концерт :: Fui a un concierto. — Я ходил на концерт."
    blocks:
      - "Пабло рассказывал о субботе и вечере. Что общего у глаголов в его фразах?"
      - examples:
          items:
            - "El sábado **trabajé** todo el día. — В субботу я **работал** весь день."
            - "Anoche **cené** en casa. — Вчера вечером я **поужинал** дома."
            - "Lucía **nadó** mucho. — Лусия много **плавала**."
      - conjugation:
          id: ar
          verb: hablar
          ru: "говорить — в прошлом (pretérito indefinido)"
          forms: [hablé, hablaste, habló, hablamos, hablasteis, hablaron]
      - note:
          id: acento
          text: "Ударение падает на окончание, поэтому в формах «я» и «он, она» нужен знак: **hablé**, **habló**. Без него получится настоящее время: `hablo` — «я говорю», а **habló** — «он говорил»."
      - more:
          title: Почему llegué, а не `llegé`?
          text: |
            В форме «я» некоторые глаголы меняют букву, чтобы звук остался прежним:
            **-gar → -gué**: _llegar → llegué_, _pagar → pagué_, _jugar → jugué_.
            **-car → -qué**: _buscar → busqué_, _practicar → practiqué_, _tocar → toqué_.
            **-zar → -cé**: _empezar → empecé_.
            Остальные формы обычные: _llegaste, llegó, llegamos…_
      - write:
          title: Поставьте глагол в прошедшее время
          format: одна форма глагола
          accents: strict
          skill: pret_ar
          rule: ar
          items:
            - q: "Ayer (yo, trabajar) ___ mucho."
              a: "trabajé"
              explain: "Yo — окончание -é: trabajé."
              mistakes:
                "trabaje": "В форме «я» нужен знак ударения: trabaj**é**."
                "trabajo": "Trabajo — настоящее время. Вчера — **trabajé**."
            - q: "¿(tú, cenar) ___ en casa anoche?"
              a: "cenaste"
              explain: "Tú — окончание -aste: cenaste."
              mistakes:
                "cenas": "Cenas — настоящее время. Вчера вечером — **cenaste**."
            - q: "Lucía (hablar) ___ con su madre ayer."
              a: "habló"
              explain: "Él, ella — окончание -ó: habló."
              mistakes:
                "hablo": "Без знака это «я говорю». «Она говорила» — habl**ó**."
                "habla": "Habla — настоящее время. Вчера — **habló**."
            - q: "El sábado (nosotros, desayunar) ___ en un bar."
              a: "desayunamos"
              explain: "Nosotros — -amos: форма такая же, как в настоящем; время подсказывает el sábado."
            - q: "¿(vosotros, comprar) ___ el pan?"
              a: "comprasteis"
              explain: "Vosotros — окончание -asteis: comprasteis."
            - q: "Mis amigos (estudiar) ___ toda la tarde."
              a: "estudiaron"
              explain: "Ellos — окончание -aron: estudiaron."
              mistakes:
                "estudian": "Estudian — настоящее время. В прошлом — **estudiaron**."
      - choose:
          title: Сейчас или вчера?
          skill: pret_ar
          rule: acento
          items:
            - say: "Habló con el jefe."
              options: "Он поговорил с начальником. | Я говорю с начальником. | Он говорит с начальником."
              explain: "Habló — ударение на конце: «он поговорил». Hablo — «я говорю»."
              noaudio: {q: "Что значит «Habló con el jefe»?", options: "Он поговорил с начальником. | Я говорю с начальником. | Он говорит с начальником."}
            - q: "Какая фраза — о прошлом?"
              options: "Compré un libro. | Compro un libro. | Voy a comprar un libro."
              explain: "Compré — прошедшее время: «я купил». Compro — «покупаю», voy a comprar — «собираюсь купить»."
      - learn: [llegar, pasar, quedarse]
      - write:
          title: Форма «я»
          format: одна форма глагола
          accents: strict
          skill: pret_ar
          rule: acento
          items:
            - q: "Ayer (yo, llegar) ___ tarde al trabajo."
              a: "llegué"
              explain: "Llegar → llegué: буква u сохраняет звук [г]."
              mistakes:
                "llegé": "Перед `e` нужна `u`, иначе читалось бы [х]: lleg**u**é."
                "llegue": "В форме «я» нужен знак ударения: llegu**é**."
            - q: "El domingo (yo, quedarse) me ___ en casa."
              a: "quedé"
              explain: "Quedarse → me quedé: местоимение me стоит перед глаголом."
            - q: "Anoche (yo, pasar) ___ dos horas en el parque."
              a: "pasé"
              explain: "Pasar → pasé."
      - learn: [invitar, la excursión, el concierto]
      - note:
          id: gusto
          text: "«Мне понравилось» — тоже прошедшее время: **Me gustó** la película. Если понравилось несколько вещей — **Me gustaron** las canciones. Так же **me encantó** и **me encantaron** — «очень понравилось»."
      - choose:
          title: Выберите форму
          skill: pret_ar
          rule: gusto
          items:
            - q: "El concierto me ___ mucho."
              options: "gustó | gustaron | gusté"
              explain: "Концерт один — me gustó."
            - q: "Las canciones me ___ mucho."
              options: "gustaron | gustó | gustamos"
              explain: "Песен много — me gustaron."
            - lines: ["Ana: El sábado fui de excursión a la montaña."]
              q: "Спросите, с кем."
              options: "¿Con quién fuiste? | ¿Con quién vas? | ¿Quién eres?"
              explain: "О прошлом — fuiste: «с кем ты ходила?»."
              skill: fui_fue
      - build:
          title: Соберите фразу
          skill: pret_ar
          rule: ar
          items:
            - es: "Ana me invitó a un concierto."
              ru: "Ана пригласила меня на концерт."
              extra: [invita]
            - es: "Anoche me quedé en casa y descansé."
              ru: "Вчера вечером я остался дома и отдыхал."
              alt: ["Anoche descansé y me quedé en casa."]
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: pret_ar
          rule: ar
          items:
            - q: "Вчера я работал весь день."
              a: "Ayer trabajé todo el día | Trabajé todo el día ayer | (Yo) ayer trabajé todo el día"
              explain: "Trabajé — «я работал»."
              mistakes:
                "ayer trabajo todo el día": "Trabajo — настоящее время. Вчера — **trabajé**."
                "ayer trabaje todo el dia": "В форме «я» нужен знак ударения: trabaj**é**. И знак в слове d**í**a."
            - q: "Мы поужинали в ресторане."
              a: "Cenamos en un restaurante | Cenamos en el restaurante | (Nosotros) cenamos en [un/el] restaurante"
              explain: "Cenamos — «мы поужинали»: форма как в настоящем времени."
      - compose:
          title: О себе
          skill: pret_ar
          rule: ar
          items:
            - q: "¿Qué hiciste ayer? Напишите две фразы о вчерашнем дне с глаголами на -ar: trabajar, estudiar, cocinar, cenar, hablar, descansar…"
              format: "Ayer trabajé… Después…"
              words: [5, 30]
              sentences: 2
              checks:
                - label: "есть глагол в форме «я»: trabajé, estudié, cené, hablé…"
                  any: [trabajé, estudié, cociné, cené, hablé, descansé, desayuné, compré, escuché, tomé, paseé, llegué, practiqué, visité, nadé, bailé, canté, viajé, quedé, pasé, jugué, toqué, busqué, pagué, esperé, levanté, acosté, duché, empecé, terminé, invité, necesité, olvidé]
              sample: "Ayer trabajé hasta las seis. Después cené con mi familia y descansé."
              sample_ru: "Вчера я работал до шести. Потом поужинал с семьёй и отдыхал."
    quiz:
      - q: "Ayer mis padres ___ en un restaurante."
        options: "cenaron | cenan | cenó"
        explain: "Mis padres — они: -aron. Cenan — настоящее время, cenó — «он поужинал»."
        skill: pret_ar
      - q: "Какая форма значит «он говорил»?"
        options: "habló | hablo | hablé"
        explain: "Habló — он, она; hablé — я; hablo — «я говорю» сейчас."
        skill: pret_ar

  - id: verbos_er_ir
    kind: grammar
    title: "Comí, comiste, comió: глаголы на -er и -ir"
    goal: рассказать о прошлом глаголами на -er и -ir — comí, salí, volví, vi
    version: 2
    vocab:
      - "⚽ el partido [парти́до] — матч, игра :: Anoche vi el partido. — Вчера вечером я смотрел матч."
      - "🏆 ganar [гана́р] — выигрывать; зарабатывать :: Mi equipo ganó. — Моя команда выиграла."
      - "😞 perder [пэрдэ́р] — проигрывать; терять :: Perdimos el partido. — Мы проиграли матч."
      - "👥 el equipo [эки́по] — команда :: Es mi equipo favorito. — Это моя любимая команда."
      - "📩 el mensaje [мэнса́хэ] — сообщение :: Recibí tu mensaje. — Я получил твоё сообщение."
      - "📬 recibir [рэθиби́р] — получать :: Ayer recibí un mensaje de Ana. — Вчера я получил сообщение от Аны."
      - "🎟 la entrada [энтра́да] — входной билет; вход :: Compré dos entradas para el concierto. — Я купил два билета на концерт."
    blocks:
      - "У глаголов на -er и -ir окончания прошедшего времени общие. Сравните с настоящим."
      - conjugation:
          id: er_ir
          verb: comer
          ru: "есть — в прошлом; так же vivir, salir, escribir"
          forms: [comí, comiste, comió, comimos, comisteis, comieron]
      - compare:
          id: ar_er
          style: small
          title: Сравните окончания
          cards:
            - head: hablé
              label: "-ar: я"
            - head: comí
              label: "-er, -ir: я"
            - head: habló
              label: "-ar: он, она"
            - head: comió
              label: "-er, -ir: он, она"
          note: "У глаголов на -ir форма «мы» совпадает с настоящим временем: **vivimos** — «мы живём» и «мы жили». У глаголов на -er — нет: _comemos_ — «едим», **comimos** — «мы поели»."
      - write:
          title: Поставьте глагол в прошедшее время
          format: одна форма глагола
          accents: strict
          skill: pret_er_ir
          rule: er_ir
          items:
            - q: "Ayer (yo, comer) ___ en casa de mis padres."
              a: "comí"
              explain: "Yo — окончание -í: comí."
              mistakes:
                "comi": "В форме «я» нужен знак ударения: com**í**."
                "como": "Como — настоящее время. Вчера — **comí**."
                "comé": "Окончание -é — у глаголов на -ar. У comer — com**í**."
            - q: "¿A qué hora (tú, salir) ___ de casa?"
              a: "saliste"
              explain: "Tú — окончание -iste: saliste."
            - q: "Carlos (volver) ___ a casa muy tarde."
              a: "volvió"
              explain: "Él — окончание -ió: volvió. В прошедшем времени корень не меняется: не vuelv-."
              mistakes:
                "vuelvió": "Чередование `o → ue` есть только в настоящем времени. В прошлом — **volvió**."
                "volvio": "Нужен знак ударения: volvi**ó**."
            - q: "El sábado (nosotros, comer) ___ paella."
              a: "comimos"
              explain: "Nosotros — -imos: comimos (в настоящем — comemos)."
              mistakes:
                "comemos": "Comemos — настоящее время. В прошлом — **comimos**."
            - q: "Mis amigos (escribir) ___ en español."
              a: "escribieron"
              explain: "Ellos — окончание -ieron: escribieron."
            - q: "¿(vosotros, beber) ___ vino en la cena?"
              a: "bebisteis"
              explain: "Vosotros — окончание -isteis: bebisteis."
      - learn: [el partido, ganar, perder, el equipo]
      - conjugation:
          id: ver
          verb: ver
          ru: "видеть, смотреть — в прошлом: без знаков ударения"
          highlight: false
          forms: [vi, viste, vio, vimos, visteis, vieron]
      - choose:
          title: Выберите форму
