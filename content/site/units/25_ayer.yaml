              noaudio: {q: "Что значит «Perdimos el partido»?", options: "Мы проиграли матч. | Мы проигрываем матч. | Они проиграли матч."}
      - learn: [el mensaje, recibir, la entrada]
      - match:
          title: Вопрос — ответ
