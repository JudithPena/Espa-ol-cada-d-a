            - es: "Un día, mientras paseaba por el parque, encontré una cartera."
              ru: "Однажды, когда я гулял в парке, я нашёл кошелёк."
              extra: [encontraba]
            - es: "Entonces la llevé a la policía."
              ru: "Тогда я отнёс его в полицию."
      - compose:
          title: Короткая история
