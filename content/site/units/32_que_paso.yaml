  - id: lectura
    kind: reading
    title: "Un día de mala suerte"
    goal: понять рассказ о неудачном дне и ответить автору
    version: 2
    vocab:
      - "⏰ el despertador [дэспэртадо́р] — будильник :: El despertador no sonó. — Будильник не зазвонил."
      - "😴 dormirse [дорми́рсэ] — проспать; заснуть :: Me dormí y llegué tarde. — Я проспал и опоздал."
      - "❗ importante [импорта́нтэ] — важный :: Tenía un examen importante. — У меня был важный экзамен."
      - "😖 horrible [орри́блэ] — ужасный :: Fue un día horrible. — Это был ужасный день."
      - "🚪 entrar [энтра́р] — входить, войти :: Entré en la clase. — Я вошёл в аудиторию."
    blocks:
      - learn: [el despertador, dormirse, importante, horrible, entrar]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "el despertador — будильник"
            - "dormirse — проспать"
            - "importante — важный"
            - "horrible — ужасный"
            - "entrar — входить"
      - "Том, студент из Англии, пишет в блоге о своём неудачном понедельнике."
      - reading:
          id: mala_suerte
          title: Un día de mala suerte
          text: |
            El lunes pasado fue un día horrible. Tenía un examen muy importante a las nueve, pero el despertador no sonó y me dormí. Cuando me desperté, ¡eran las ocho y media!

            Salí de casa muy rápido. Llovía mucho y, claro, no tenía paraguas. Mientras corría a la parada del autobús, me caí en la calle y se rompió la pantalla de mi móvil.

            Por fin llegué a la universidad, muy mojado y muy nervioso. Entré en la clase y, de repente, vi que no había nadie. Entonces llegó un compañero y me dijo: «¿No has leído el mensaje de la profesora? Hoy no hay examen: está enferma».

            Al final volví a casa, me duché y dormí toda la mañana. El examen fue el jueves… y todo salió bien.
          translation: |
            Прошлый понедельник был ужасным днём. В девять у меня был очень важный экзамен, но будильник не зазвонил, и я проспал. Когда я проснулся, было полдевятого!

            Я быстро вышел из дома. Шёл сильный дождь, и, конечно, зонта у меня не было. Пока я бежал на остановку, я упал на улице, и у телефона разбился экран.

            Наконец я добрался до университета, весь мокрый и очень взволнованный. Вошёл в аудиторию и вдруг увидел, что там никого нет. Тут пришёл однокурсник и сказал: «Ты не читал сообщение преподавательницы? Сегодня экзамена нет: она заболела».

            В итоге я вернулся домой, принял душ и проспал всё утро. Экзамен был в четверг… и всё прошло хорошо.
      - choose:
          title: Что сказано в тексте?
          source: mala_suerte
          items:
            - q: "¿Por qué se durmió Tom?"
              options: "Porque el despertador no sonó. | Porque estaba enfermo. | Porque llovía mucho."
              explain: "…el despertador no sonó y me dormí."
            - q: "¿Qué pasó mientras corría a la parada?"
              options: "Se cayó en la calle. | Perdió el autobús y fue a la universidad a pie. | Vio a la profesora en la calle."
              explain: "Mientras corría a la parada del autobús, me caí en la calle."
              skill: estaba_gerundio
            - q: "¿Qué vio cuando entró en la clase?"
              options: "Que no había nadie. | Que todos estaban en el examen. | Que la profesora estaba enferma."
              explain: "Entré en la clase y, de repente, vi que no había nadie."
              skill: fondo_hechos
            - q: "¿Cuándo fue el examen al final?"
              options: "El jueves. | El lunes. | El martes."
              explain: "El examen fue el jueves… y todo salió bien."
      - sort:
          title: Обстановка или событие?
          source: mala_suerte
          skill: fondo_hechos
          groups:
            "обстановка": ["llovía mucho", "no tenía paraguas", "eran las ocho y media"]
            "событие": ["el despertador no sonó", "me caí en la calle", "volví a casa"]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: mala_suerte
          items:
            - q: "¿Qué hora era cuando Tom se despertó?"
              a: "Eran las ocho y media | Las ocho y media"
              explain: "Cuando me desperté, ¡eran las ocho y media!"
              skill: fondo_hechos
            - q: "Как в тексте сказано «Тут пришёл однокурсник»?"
              a: "Entonces llegó un compañero"
              explain: "Entonces — «тогда, и тут»."
              skill: conectores
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "El despertador no sonó y me dormí."
              options: "Будильник не зазвонил, и я проспал. | Будильник зазвонил, но я спал дальше. | Я проснулся раньше будильника."
              explain: "No sonó — «не зазвонил»; me dormí — «я проспал»."
              noaudio: {q: "Что значит «El despertador no sonó y me dormí»?", options: "Будильник не зазвонил, и я проспал. | Будильник зазвонил, но я спал дальше. | Я проснулся раньше будильника."}
      - compose:
          title: Ответ Тому
          free: true
          rule: none
          skill: [conectores, fondo_hechos]
          items:
            - q: "Напишите Тому комментарий: отреагируйте на его историю и коротко расскажите похожий случай из своей жизни. Три-четыре фразы."
              format: "¡Qué mala suerte, Tom! A mí también…"
              words: [15, 70]
              sentences: 2
              checks:
                - label: "реакция: ¡Qué mala suerte!, ¡Qué susto!, ¡Menos mal!"
                  any: [qué mala suerte, qué susto, menos mal]
                - label: "ваш случай: что случилось (perdí, me caí, llegué…)"
                  any: [fui, fue, estuve, tuve, hice, vi, perdí, perdió, llegué, llegó, salí, olvidé, me dormí, me caí, se rompió, no sonó, pasó, encontré]
              sample: "¡Qué mala suerte, Tom! A mí también me pasó una vez: me dormí y perdí el tren a Sevilla. Al final llegué tarde, pero por suerte mis amigos me esperaron."
              sample_ru: "Как не повезло, Том! Со мной тоже однажды такое было: я проспал и опоздал на поезд в Севилью. В итоге приехал поздно, но, к счастью, друзья меня дождались."

