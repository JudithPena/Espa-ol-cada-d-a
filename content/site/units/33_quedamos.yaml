              options: "Quedar el sábado. | Cancelar la cena para siempre. | Cenar el viernes más tarde."
              explain: "¿Te viene bien el sábado?"
              skill: quedar_cita
      - mission:
          id: llamar
          title: Договориться по телефону
          text: "На следующий день вы звоните Диего, чтобы договориться о встрече в выходные."
      - chat:
          id: diego
          title: Звонок Диего
          with: Diego
          turns:
            - say: "¿Diga? | Алло?"
              task: "Поздоровайтесь и спросите, что он делает."
              skill: estar_ahora
              write: "Hola(,) Diego. ¿Qué [estás haciendo/haces]? | Hola. ¿Qué [estás haciendo/haces]? | Hola(,) Diego(,) soy yo. ¿Qué [estás haciendo/haces]?"
              format: приветствие и вопрос
              mistakes:
                "hola diego qué eres haciendo": "Что делаешь сейчас — с **estar**: ¿Qué estás haciendo?"
            - say: "Estoy cocinando. ¿Y tú? | Готовлю. А ты?"
              task: "Ответьте от себя, что вы делаете прямо сейчас."
              skill: estar_ahora
              compose:
                format: "Estoy…"
                words: [2, 20]
                checks:
                  - label: "estoy + герундий"
                    re: "\\b(estoy|estamos)\\b \\w+(ando|iendo|yendo)\\b|\\bme estoy \\w+(ando|iendo)\\b"
                sample: "Estoy en casa, estoy leyendo un libro."
                sample_ru: "Я дома, читаю книгу."
            - say: "Oye, ¿te apetece hacer algo este fin de semana? | Слушай, хочешь чем-нибудь заняться в эти выходные?"
              task: "Предложите пойти в кино в субботу — с ¿Por qué no…?"
              skill: proponer
              write: "¿Por qué no vamos al cine el sábado? | Sí, ¿por qué no vamos al cine el sábado? | ¿Por qué no vamos el sábado al cine?"
              format: предложение
              mistakes:
                "por qué no ir al cine el sábado": "После ¿Por qué no…? — форма «мы»: **vamos**."
            - say: "El sábado no puedo: es que voy a una boda. ¿Qué tal el domingo? | В субботу не могу: я иду на свадьбу. Как насчёт воскресенья?"
              task: "Согласитесь: в воскресенье вам удобно."
              skill: quedar_cita
              choose: "Vale, el domingo me viene bien. | Vale, el domingo me vengo bien. | ¡Qué pena! El domingo me viene bien."
              explain: "Удобно — me viene bien; ¡Qué pena! — когда жаль, а здесь вы согласны."
            - say: "¿A qué hora quedamos? | Во сколько встретимся?"
              task: "Предложите встретиться в шесть у входа в кино."
              skill: quedar_cita
              write: "¿Qué tal a las seis en la puerta del cine? | ¿Quedamos a las seis en la puerta del cine? | (Quedamos) a las seis en la puerta del cine | A las seis(,) en la puerta del cine"
              format: время и место
              mistakes:
                "en las seis en la puerta del cine": "Время — с **a**: a las seis."
            - say: "Perfecto. ¡Nos vemos el domingo! | Отлично. Увидимся в воскресенье!"
      - compose:
          title: Отказ и новый план
          free: true
          rule: none
          skill: [rechazar, proponer, quedar_cita]
          items:
            - q: "Подруга пишет: «¿Te apetece ir al cine el viernes?» Ответьте: откажитесь, объясните причину и предложите свой план — что, где и во сколько."
              format: "Lo siento, el viernes no puedo: es que… ¿Qué tal si…?"
              words: [15, 70]
              checks:
                - label: "отказ: lo siento, no puedo…"
                  any: [lo siento, no puedo, qué pena]
                - label: "причина: es que…"
                  any: [es que, porque]
                - label: "новый план: ¿Qué tal si…?, ¿Por qué no…?, ¿Te viene bien…?"
                  any: [qué tal si, qué tal, por qué no, te viene bien, te apetece, quedamos]
                - label: "время: a las…"
                  any: [a las, a la una, por la mañana, por la tarde, por la noche]
              sample: "¡Hola, Ana! Lo siento, el viernes no puedo: es que tengo que trabajar hasta las nueve. ¿Qué tal si vamos al cine el sábado? ¿Quedamos a las seis en la puerta del cine?"
              sample_ru: "Привет, Ана! Извини, в пятницу не могу: мне нужно работать до девяти. Может, сходим в кино в субботу? Встретимся в шесть у входа в кинотеатр?"

