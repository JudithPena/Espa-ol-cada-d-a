id: en_clase
number: 3
level: A0
title: Язык занятий
goals:
  - понимать задания на испанском
  - спросить, как сказать или что значит слово
  - сказать, что не понимаете, и попросить повторить

lessons:
  - id: vocab1
    kind: vocab
    title: Задания по-испански
    goal: понять задание на испанском — escucha, lee, escribe, traduce
    version: 3
    # Карта экранов: docs/site_slide_maps/03_en_clase.md
    vocab:
      - "👂 escucha [эску́ча] — послушай, слушай :: Escucha, por favor. — Послушай, пожалуйста."
      - "🔁 repite [рэпи́тэ] — повтори :: Escucha y repite. — Слушай и повторяй."
      - "📖 lee [лэ́э] — прочитай, читай"
      - "✍️ escribe [эскри́бэ] — напиши, пиши"
      - "🔄 traduce [траду́θэ] — переведи"
      - "💬 responde [рэспо́ндэ] — ответь, отвечай"
    blocks:
      - "Этими словами дают задания: над упражнением часто стоит **Escucha y repite** — «Послушай и повтори» или **Traduce** — «Переведи»."
      - learn: [escucha, repite, lee]
      - choose:
          title: Что это?
          skill: class_commands
          items:
            - img: escucha
              options: "escucha | lee | repite"
            - img: lee
              options: "lee | escucha | repite"
      - learn: [escribe, traduce, responde]
      - tip: "Все эти команды звучат на «ты»: в Испании к ученикам обращаются на «ты» в любом возрасте. _Escucha, Pablo_ («Послушай, Пабло»), _Lee, por favor_ («Прочитай, пожалуйста»), _Responde, Carmen_ («Ответь, Кармен»)."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "escucha — послушай"
            - "repite — повтори"
            - "lee — прочитай"
            - "escribe — напиши"
            - "traduce — переведи"
            - "responde — ответь"
      - choose:
          title: "Послушайте: что нужно сделать?"
          rule: none
          skill: class_commands
          items:
            - say: "Lee y traduce."
              q: "Что нужно сделать?"
              options: "Прочитай и переведи. | Послушай и повтори. | Напиши и переведи."
              noaudio: {q: "Что значит «Lee y traduce.»?", options: "Прочитай и переведи. | Послушай и повтори. | Напиши и переведи."}
            - say: "Escribe y responde."
              q: "Что нужно сделать?"
              options: "Напиши и ответь. | Прочитай и ответь. | Напиши и переведи."
              noaudio: {q: "Что значит «Escribe y responde.»?", options: "Напиши и ответь. | Прочитай и ответь. | Напиши и переведи."}
      - write:
          title: Как это сказать?
          format: две команды по-испански
          rule: none
          skill: class_commands
          items:
            - q: "Послушай и повтори."
              a: "Escucha y repite | Escucha y repite, por favor"
              mistakes:
                "lee y repite": "Lee — «прочитай». «Послушай» — **escucha**."
                "escucha y responde": "Responde — «ответь». «Повтори» — **repite**."
                "escucha repite": "Между двумя командами нужно **y** — «и»: escucha y repite."

      - write:
          title: Напишите по-испански
          bank: true
          skill: class_commands
          format: команда по-испански
          items:
            - q: "Как сказать «Слушай!»?"
              a: "Escucha"
            - q: "Скажите: «Повтори, пожалуйста»."
              a: "Repite, por favor | Por favor, repite"

  - id: vocab2
    kind: vocab
    title: Слова для занятий
    goal: понимать слова на уроке — вопрос, ответ, текст, перевод
    version: 3
    vocab:
      - "🔤 la palabra [пала́бра] — слово"
      - "❓ la pregunta [прэгу́нта] — вопрос"
      - "💡 la respuesta [рэспуэ́ста] — ответ"
      - "📄 el texto [тэ́ксто] — текст"
      - "🔄 la traducción [традукθьо́н] — перевод"
      - "📝 la tarea [тарэ́а] — задание; домашнее задание"
      - "🔁 el repaso [рэпа́со] — повторение"
    blocks:
      - "Эти слова часто стоят в заголовках: **Repaso** — «повторение», **Traducción** — «перевод», **Tarea** — «задание»."
      - more:
          title: "Как печатать `ñ`, `¿` и `á` на телефоне"
          text: |
            Зажмите нужную клавишу и выберите знак в появившемся меню: `ñ` — на клавише `n`, `¿` — на `?`, `¡` — на `!`, `á`, `é`, `í`, `ó`, `ú` — на самой гласной.
            Удобнее всего добавить в телефон испанскую раскладку. А в заданиях на сайте под полем ответа есть кнопки с этими буквами.

      - learn: [la palabra, la pregunta, la respuesta]
      - choose:
          title: Traduce
          skill: class_words
          items:
            - q: "la pregunta y la respuesta"
              options: "вопрос и ответ | ответ и вопрос | слово и ответ"
      - learn: [el texto, la traducción, la tarea, el repaso]
      - match:
          title: Соедините пары
          pairs:
            - "el texto — текст"
            - "la traducción — перевод"
            - "la tarea — задание"
            - "el repaso — повторение"
            - "la palabra — слово"
      - choose:
          title: "Послушайте: что нужно сделать?"
          skill: class_commands
          items:
            - say: "Lee el texto."
              q: "Что нужно сделать?"
              options: "Прочитай текст. | Напиши текст. | Переведи текст."
              noaudio: {q: "Что значит «Lee el texto.»?", options: "Прочитай текст. | Напиши текст. | Переведи текст."}
            - say: "Escribe la palabra."
              q: "Что нужно сделать?"
              options: "Напиши слово. | Прочитай слово. | Повтори слово."
              noaudio: {q: "Что значит «Escribe la palabra.»?", options: "Напиши слово. | Прочитай слово. | Повтори слово."}
      - write:
          title: Напишите с артиклем
          format: el или la + слово
          skill: class_words
          items:
            - "вопрос => la pregunta"
            - "перевод => la traducción"
            - "задание => la tarea"
  - id: dialogue
    kind: dialogue
    title: Если вы не поняли
    goal: сказать, что не понимаете, попросить повторить и объяснить слово
    version: 4
    allow: [mochila]   # в «Что ответить?» ученик нарочно не знает этого слова: оно вводится позже
    vocab:
      - "🤷 No entiendo. [но энтьэ́ндо] — я не понимаю."
      - "🤔 No sé. [но сэ] — не знаю."
      - "🔁 Otra vez, por favor. [о́тра бэθ пор фабо́р] — ещё раз, пожалуйста."
      - "🐢 Más despacio, por favor. [мас дэспа́θьо пор фабо́р] — помедленнее, пожалуйста."
      - "🗣 ¿Cómo se dice... en español? [ко́мо сэ ди́θэ эн эспанъо́ль] — как сказать ... по-испански? :: ¿Cómo se dice «спасибо» en español? — Как сказать «спасибо» по-испански?"
      - "❔ ¿Qué significa...? [кэ сигнифи́ка] — что значит...? :: ¿Qué significa «perro»? — Что значит «perro»?"
      - "🔡 ¿Cómo se escribe? [ко́мо сэ эскри́бэ] — как это пишется?"
    blocks:
      - "Эти фразы — спасательный круг: с ними можно учиться прямо в разговоре."
      - learn: [No entiendo., No sé., "Otra vez, por favor.", "Más despacio, por favor."]
      - choose:
          title: Что вы скажете?
          skill: ask_in_class
          items:
            - q: "Собеседник говорит слишком быстро."
              options: "Más despacio, por favor. | Otra vez, por favor. | De nada."
              explain: "Más despacio — «помедленнее»."
            - q: "Вы хотите услышать фразу ещё раз."
              options: "Otra vez, por favor. | Más despacio, por favor. | Muchas gracias."
              explain: "Otra vez — «ещё раз»."
            - q: "Вам задали вопрос. Вы его поняли, но ответа не знаете."
              options: "No sé. | No entiendo. | Otra vez, por favor."
              explain: "No entiendo — «не понимаю» (вопрос, слово); No sé — «не знаю» (ответ)."
      - learn: ["¿Cómo se dice... en español?", "¿Qué significa...?", "¿Cómo se escribe?"]
      - dialogue:
          id: lesson
          title: На уроке
          lines:
            - "Profesora: Buenos días. Escucha y repite: la casa. | Доброе утро. Слушай и повторяй: la casa."
            - "Iván: La casa. | La casa."
            - "Profesora: ¡Muy bien! Lee, por favor: el perro. | Очень хорошо! Прочитай, пожалуйста: el perro."
            - "Olga: Perdón, ¿qué significa «perro»? | Извините, что значит «perro»?"
            - "Profesora: «Perro» es «собака». | «Perro» — это «собака»."
            - "Iván: No entiendo. Más despacio, por favor. | Не понимаю. Помедленнее, пожалуйста."
            - "Profesora: Vale. Otra vez: el pe-rro. | Хорошо. Ещё раз: el pe-rro."
            - "Olga: ¿Cómo se escribe? | Как это пишется?"
            - "Profesora: `P-E-R-R-O`. | П-Е-Р-Р-О."
            - "Iván: ¿Cómo se dice «спасибо» en español? | Как сказать «спасибо» по-испански?"
            - "Olga: ¡Gracias! | Gracias!"
            - "Profesora: ¡Muy bien! | Очень хорошо!"
      - choose:
          title: Поняли?
          source: lesson
          skill: ask_in_class
          items:
            - q: "Что спросила Ольга о слове perro?"
              options: "¿Qué significa «perro»? | ¿Cómo se dice «perro»? | ¿Cómo estás?"
              explain: "Ольга не знала, что значит слово: ¿Qué significa «perro»?"
            - q: "Что сказал Иван, когда не понял?"
              options: "No entiendo. Más despacio, por favor. | Otra vez, por favor. | Muy bien, gracias."
              explain: "Iván: No entiendo. Más despacio, por favor. — Иван просит говорить помедленнее."
      - note:
          id: en_espanol
          text: "Выражение **en español** означает «по-испански», дословно «на испанском»: _¿Cómo se dice «собака» en español?_ — «Как сказать „собака“ по-испански?», _Responde en español_ — «Ответь по-испански»."
      - choose:
          title: Что ответить?
          free: true
          skill: ask_in_class
          items:
            - lines: ["Profesora: Lee, por favor: la mochila."]
              q: "Вы не понимаете, что значит слово mochila. Спросите об этом."
              options: "Perdón, ¿qué significa «mochila»? | ¿Cómo se dice «mochila» en español? | ¿Cómo se escribe «mochila»?"
              explain: "О значении слова спрашивают ¿Qué significa...? А ¿Cómo se dice...? — как сказать по-испански, ¿Cómo se escribe? — как пишется."
            - lines: ["Profesora: Escribe la palabra: «Málaga»."]
              q: "Вы не знаете, как пишется это слово. Спросите."
              options: "¿Cómo se escribe? | ¿Qué significa? | ¿Cómo se dice en español?"
              explain: "Как пишется — ¿Cómo se escribe? ¿Qué significa? спрашивают о значении."
              rule: none
            - q: "Вы хотите узнать, как по-испански «спасибо»."
              options: "¿Cómo se dice «спасибо» en español? | ¿Qué significa «спасибо»? | ¿Cómo se escribe «спасибо»?"
              explain: "Как сказать по-испански — ¿Cómo se dice... en español? А ¿Qué significa...? спрашивают о значении испанского слова."
      - choose:
          title: Послушайте и выберите
          free: true
          skill: ask_in_class
          items:
            - say: "Más despacio, por favor."
              q: "О чём вас просят?"
              options: "Говорить помедленнее. | Повторить ещё раз. | Написать слово."
              noaudio: {q: "Что значит «Más despacio, por favor»?", options: "Говорить помедленнее. | Повторить ещё раз. | Написать слово."}
            - say: "¿Cómo se escribe?"
              q: "Что у вас спросили?"
              options: "Как это пишется? | Что это значит? | Как сказать по-испански?"
              noaudio: {q: "Что значит «¿Cómo se escribe?»?", options: "Как это пишется? | Что это значит? | Как сказать по-испански?"}
      - build:
          title: Соберите фразу
          free: true
          rule: none
          skill: ask_in_class
          items:
            - es: "No entiendo. Otra vez, por favor."
              ru: "Я не понимаю. Ещё раз, пожалуйста."

  - id: alfabeto
    kind: vocab
    title: Алфавит
    goal: назвать букву по-испански и записать фамилию, которую диктуют по буквам
    version: 2
    # Аудит MYTHOS (PRG-04, U00-03): вопрос ¿Cómo se escribe? есть с этой темы, а названий букв не было.
    allow: [a, e, i, o, u, be, ce, de, efe, ge, hache, jota, ka, ele, eme, ene, eñe, pe, cu, erre, ese, te, uve, doble, equis, griega, ye, zeta, Kovalenko, Ruiz, Vega, Hugo]
    vocab:
      - "🪪 el apellido [апэйи́до] — фамилия :: ¿Y el apellido? — Vega. — А фамилия? — Вега."
    blocks:
      - "В Испании имя, фамилию и адрес часто диктуют по буквам. У каждой буквы есть название — нажмите, чтобы послушать."
      - compare:
          style: small
          title: "`A` — `I`"
          cards:
            - {head: a, label: "`A a`"}
            - {head: be, label: "`B b`"}
            - {head: ce, label: "`C c`"}
            - {head: de, label: "`D d`"}
            - {head: e, label: "`E e`"}
            - {head: efe, label: "`F f`"}
            - {head: ge, label: "`G g`"}
            - {head: hache, label: "`H h`"}
            - {head: i, label: "`I i`"}
      - choose:
          title: Как называется буква?
          skill: alphabet
          items:
            - q: "Как называется буква `H`?"
              options: "hache | jota | ge"
              explain: "`h` не читается, но название у неё есть: hache."
            - say: "ge"
              q: "Какую букву назвали?"
              options: "`G` | `J` | `H`"
              noaudio: {q: "Какая буква называется «ge»?", options: "`G` | `J` | `H`"}
      - compare:
          style: small
          title: "`J` — `Q`"
          cards:
            - {head: jota, label: "`J j`"}
            - {head: ka, label: "`K k`"}
            - {head: ele, label: "`L l`"}
            - {head: eme, label: "`M m`"}
            - {head: ene, label: "`N n`"}
            - {head: eñe, label: "`Ñ ñ`"}
            - {head: o, label: "`O o`"}
            - {head: pe, label: "`P p`"}
            - {head: cu, label: "`Q q`"}
      - choose:
          title: Как называется буква?
          skill: alphabet
          items:
            - q: "Как называется буква `Ñ`?"
              options: "eñe | ene | eme"
            - say: "jota"
              q: "Какую букву назвали?"
              options: "`J` | `G` | `H`"
              noaudio: {q: "Какая буква называется «jota»?", options: "`J` | `G` | `H`"}
      - compare:
          style: small
          title: "`R` — `Z`"
          cards:
            - {head: erre, label: "`R r`"}
            - {head: ese, label: "`S s`"}
            - {head: te, label: "`T t`"}
            - {head: u, label: "`U u`"}
            - {head: uve, label: "`V v`"}
            - {head: uve doble, label: "`W w`"}
            - {head: equis, label: "`X x`"}
            - {head: i griega, label: "`Y y`"}
            - {head: zeta, label: "`Z z`"}
          note: "Букву **y** называют и **ye**. Две буквы `rr` диктуют по одной: _pe, e, erre, erre, o_ — perro."
      - choose:
          title: ¿Cómo se escribe?
          skill: alphabet
          items:
            - q: "¿Cómo se escribe «hola»?"
              options: "hache, o, ele, a | o, ele, a | jota, o, ele, a"
              explain: "`h` не читается, но пишется: hache, o, ele, a."
            - q: "Как называется буква `V`?"
              options: "uve | be | u"
              explain: "`b` и `v` звучат одинаково, а называются по-разному: be и uve."
      - learn: [el apellido]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "el apellido — фамилия"
            - "¿Cómo se escribe? — как это пишется?"
      - "Ольга записывается на курс в языковой школе. Секретарь просит продиктовать фамилию."
      - dialogue:
          id: secretaria
          title: В секретариате школы
          hidden: true
          lines:
            - "Secretaria: Buenos días. ¿Cómo te llamas? | Доброе утро. Как тебя зовут?"
            - "Olga: Me llamo Olga. Olga Kovalenko. | Меня зовут Ольга. Ольга Коваленко."
            - "Secretaria: ¿Y el apellido? ¿Cómo se escribe? | А фамилия? Как она пишется?"
            - "Olga: Ka, o, uve, a, ele, e, ene, ka, o. | К, О, В, А, Л, Е, Н, К, О."
            - "Secretaria: Más despacio, por favor. | Помедленнее, пожалуйста."
            - "Olga: Ka… o… uve… a… ele… e… ene… ka… o. | К… О… В… А… Л… Е… Н… К… О."
            - "Secretaria: ¡Muy bien! Gracias, Olga. | Отлично! Спасибо, Ольга."
      - write:
          title: Запишите фамилию
          source: secretaria
          skill: alphabet
          format: фамилия латиницей
          items:
            - q: "Как пишется фамилия Ольги?"
              a: "Kovalenko"
              mistakes: {"kobalenko": "Ольга говорит **uve** — это `v`: Kovalenko.", "covalenko": "Первая буква — **ka**: `k`."}
      - choose:
          title: Responde
          source: secretaria
          items:
            - q: "О чём секретарь просит Ольгу?"
              options: "Говорить помедленнее. | Сказать имя ещё раз. | Написать фамилию самой."
              evidence: "Más despacio, por favor."
      - write:
          title: Послушайте и напишите
          format: фамилия латиницей
          free: true
          skill: alphabet
          items:
            - say: "erre, u, i, zeta"
              q: "Какую фамилию продиктовали?"
              a: "Ruiz"
              noaudio: {q: "Фамилию диктуют так: erre, u, i, zeta. Напишите её.", a: "Ruiz"}
            - say: "uve, e, ge, a"
              q: "Какую фамилию продиктовали?"
              a: "Vega"
              mistakes: {"bega": "Сказали **uve** — это `v`: Vega."}
              noaudio: {q: "Фамилию диктуют так: uve, e, ge, a. Напишите её.", a: "Vega"}
      - build:
          title: Продиктуйте по буквам
          free: true
          skill: alphabet
          items:
            - es: "hache, u, ge, o"
              ru: "Продиктуйте имя «Hugo» по буквам."
              extra: [jota, uve]

  - id: practice
    kind: practice
    title: Practica en español
    goal: понять задание по-испански и спросить о незнакомом слове
    version: 4
    vocab:
      - "🏋️ practica [пра́ктика] — тренируйся, практикуйся"
    # Практикум начинается заданием; карточка practica — перед миссией.
    blocks:
      - choose:
          title: Escucha y traduce
          skill: class_commands
          items:
            - say: "Escucha y repite la palabra."
              q: "Что нужно сделать?"
              options: "Послушай и повтори слово. | Прочитай и повтори слово. | Послушай и переведи слово."
              noaudio: {q: "Что значит «Escucha y repite la palabra.»?", options: "Послушай и повтори слово. | Прочитай и повтори слово. | Послушай и переведи слово."}
            - say: "Lee el texto y responde."
              q: "Что нужно сделать?"
              options: "Прочитай текст и ответь. | Напиши текст и ответь. | Прочитай текст и переведи."
              noaudio: {q: "Что значит «Lee el texto y responde.»?", options: "Прочитай текст и ответь. | Напиши текст и ответь. | Прочитай текст и переведи."}
      - write:
