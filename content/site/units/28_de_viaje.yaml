  - id: ir_irse
    kind: grammar
    title: "Voy, me voy: ir, irse и предлоги пути"
    goal: сказать, куда вы едете, откуда, на чём и когда уезжаете
    version: 2
    vocab:
      - "🚪 irse [и́рсэ] — уходить, уезжать :: Me voy mañana. — Я уезжаю завтра."
      - "↪️ pasar por [паса́р пор] — проезжать через; заходить {forms: paso pasas pasa pasamos pasan} :: El tren pasa por Córdoba. — Поезд идёт через Кордову."
      - "🛩 el avión [абьо́н] — самолёт {pl: aviones} :: Vamos a Canarias en avión. — Мы летим на Канары самолётом."
      - "➡️ directo/a [дирэ́кто, дирэ́кта] — прямой :: Es un vuelo directo. — Это прямой рейс."
    blocks:
      - compare:
          id: ir_irse
          title: Ехать или уезжать?
          cards:
            - head: Voy a Sevilla.
              label: "ir a — еду куда-то"
              tone: blue
              ex: ["Mañana vamos a la playa. — Завтра мы едем на пляж."]
            - head: Me voy.
              label: "irse — ухожу, уезжаю отсюда"
              tone: sun
              ex: ["¿Ya te vas? — Ты уже уходишь?", "Se fue ayer. — Он уехал вчера."]
          note: "**Irse** — тот же глагол ir с местоимением: _me voy, te vas, se va, nos vamos, os vais, se van_. Главное в нём — что человек покидает место."
      - learn: [irse]
      - choose:
          title: Ir или irse?
          skill: ir_irse
          rule: ir_irse
          items:
            - q: "Es muy tarde. ¡___!"
              options: "Me voy | Voy | Voy a"
              explain: "«Ухожу отсюда» — me voy."
            - q: "Este verano ___ a Italia."
              options: "voy | me voy de | se va"
              explain: "Названо, куда: voy a Italia."
            - q: "— ¿Dónde está Carlos? — ___ hace una hora."
              options: "Se fue | Fue | Se va"
              explain: "«Он ушёл» час назад — se fue."
            - say: "¿Ya te vas?"
              options: "Ты уже уходишь? | Ты уже идёшь? | Ты уже пришёл?"
              explain: "Te vas — «ты уходишь» (irse)."
              noaudio: {q: "Что значит «¿Ya te vas?»", options: "Ты уже уходишь? | Ты уже идёшь? | Ты уже пришёл?"}
      - table:
          id: preposiciones
          slide: new
          title: Предлоги пути
          rows:
            - ["**a**", "куда", "Voy **a** Sevilla."]
            - ["**de**", "откуда", "Salgo **de** Madrid."]
            - ["**en**", "на чём; где", "Viajo **en** tren. Estoy **en** el hotel."]
            - ["**por**", "через, по", "El tren pasa **por** Córdoba. Paseo **por** el centro."]
            - ["**para**", "в сторону (о транспорте)", "el tren **para** Sevilla"]
      - learn: [pasar por, directo/a, el avión]
      - write:
          title: Вставьте предлог
          format: a, de, en, por или para
          skill: preposiciones_viaje
          rule: preposiciones
          items:
            - q: "Mañana voy ___ Sevilla."
              a: "a"
              explain: "Куда — a."
              mistakes:
                "en": "Куда — предлог **a**: voy a Sevilla. En — «где»: estoy en Sevilla."
            - q: "Salgo ___ Madrid a las diez."
              a: "de"
              explain: "Откуда — de."
            - q: "Siempre viajo ___ tren."
              a: "en"
              explain: "На чём — en: en tren, en avión, en coche."
              mistakes:
                "con": "С транспортом — **en**: en tren."
            - q: "El tren no es directo: pasa ___ Córdoba."
              a: "por"
              explain: "Через — por."
            - q: "¿A qué hora sale el tren ___ Valencia?"
              a: "para | a"
              explain: "Поезд «в сторону» города — para Valencia."
              mistakes:
                "de": "El tren de Valencia — это поезд **из** Валенсии. Поезд туда — **para** Valencia."
            - q: "Ahora estamos ___ el aeropuerto."
              a: "en"
              explain: "Где — en."
              mistakes:
                "a": "Где — предлог **en**: estamos en el aeropuerto."
      - choose:
          title: Послушайте
          skill: ir_irse
          rule: ir_irse
          items:
            - say: "Se fueron ayer por la mañana."
              options: "Они уехали вчера утром. | Они приехали вчера утром. | Они уезжают завтра утром."
              explain: "Se fueron — «они уехали» (irse в прошедшем времени)."
              noaudio: {q: "Что значит «Se fueron ayer por la mañana»?", options: "Они уехали вчера утром. | Они приехали вчера утром. | Они уезжают завтра утром."}
            - q: "¿El vuelo es directo? — No, ___ Madrid."
              options: "pasa por | se va de | sale a"
              explain: "Не прямой — значит, идёт через Мадрид: pasa por Madrid."
              skill: preposiciones_viaje
              rule: preposiciones
      - build:
          title: Соберите фразу
          skill: ir_irse
          rule: ir_irse
          items:
            - es: "Mañana me voy a Sevilla en tren."
              ru: "Завтра я уезжаю в Севилью на поезде."
              alt: ["Me voy a Sevilla en tren mañana.", "Me voy mañana a Sevilla en tren."]
            - es: "Este vuelo no pasa por Madrid: es directo."
              ru: "Этот рейс не идёт через Мадрид: он прямой."
              skill: preposiciones_viaje
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: ir_irse
          rule: ir_irse
          items:
            - q: "Я уезжаю завтра."
              a: "Me voy mañana | Mañana me voy | (Yo) me voy mañana"
              explain: "Уезжать — irse: me voy."
              mistakes:
                "voy mañana": "«Уезжаю» (отсюда) — **me voy**: без me получается «еду завтра» — и хочется спросить, куда."
            - q: "Мы едем в Валенсию на машине."
              a: "Vamos a Valencia en coche | (Nosotros) vamos a Valencia en coche | Vamos en coche a Valencia"
              explain: "Куда — a, на чём — en."
              skill: preposiciones_viaje
              rule: preposiciones
              mistakes:
                "vamos en valencia en coche": "Куда — **a** Valencia; en — только про транспорт: en coche."
      - compose:
          title: О себе
          skill: preposiciones_viaje
          rule: preposiciones
          items:
            - q: "¿Cómo vas al trabajo o a clase? Напишите две фразы: на чём едете, откуда и во сколько выходите, через что проезжаете."
              format: "Voy al trabajo en… Salgo de casa a las…"
              words: [7, 40]
              sentences: 2
              checks:
                - label: "куда: voy a… / voy al…"
                  any: [voy a, voy al, vamos a, vamos al]
                - label: "на чём: en metro, en coche… или a pie"
                  any: [en metro, en autobús, en coche, en tren, en bici, a pie, en taxi]
                - label: "откуда или через что: salgo de… / paso por…"
                  any: [salgo de, paso por, salimos de, pasamos por]
              sample: "Voy al trabajo en metro. Salgo de casa a las ocho y paso por el centro."
              sample_ru: "Я езжу на работу на метро. Выхожу из дома в восемь и проезжаю через центр."
    quiz:
      - q: "Viajamos ___ avión."
        options: "en | con | por"
        explain: "На чём — en: en avión."
        skill: preposiciones_viaje
      - q: "— ¿Te quedas? — No, ___: mañana trabajo."
        options: "me voy | voy | fui"
        explain: "«Ухожу» — me voy."
        skill: ir_irse

  - id: hotel
    kind: dialogue
    title: En el hotel
    goal: заселиться в гостиницу и сказать, что что-то не работает
    version: 2
    allow: [Koval, Oleg]
    forms: [tercero, tercera, tercer, cuarta, quinta]
    vocab:
      - "📒 la reserva [рэсэ́рба] — бронь, бронирование :: Tengo una reserva. — У меня есть бронь."
      - "🏷 a nombre de [а но́мбрэ дэ] — на имя :: una reserva a nombre de Ana López — бронь на имя Аны Лопес"
      - "🛏 individual / doble [индибидуа́ль, до́бле] — одноместный / двухместный :: una habitación doble — двухместный номер"
      - "✅ incluido/a [инклуи́до, инклуи́да] — включённый (в цену) :: El desayuno está incluido. — Завтрак включён."
      - "🏢 la planta [пла́нта] — этаж :: Mi habitación está en la segunda planta. — Мой номер на втором этаже."
      - "🛗 el ascensor [асθэнсо́р] — лифт {pl: ascensores} :: ¿Hay ascensor? — Есть лифт?"
      - "⚙️ funcionar [фунθьона́р] — работать (о технике) :: La ducha no funciona. — Душ не работает."
      - "🔄 cambiar [камбья́р] — менять :: ¿Puedo cambiar de habitación? — Можно поменять номер?"
    blocks:
      - "Ирина приехала в Севилью и заселяется в гостиницу."
      - dialogue:
          id: recepcion
          title: У стойки
          lines:
            - "Recepcionista: Buenas tardes. ¿Tiene una reserva? | Добрый день. У вас есть бронь?"
            - "Irina: Sí, a nombre de Irina Koval. | Да, на имя Ирины Коваль."
            - "Recepcionista: Un momento… Aquí está. Una habitación individual para dos noches, ¿verdad? | Минуту… Вот она. Одноместный номер на две ночи, верно?"
            - "Irina: Sí. ¿El desayuno está incluido? | Да. Завтрак включён?"
            - "Recepcionista: Sí, es de siete a diez, en la planta baja. | Да, с семи до десяти, на первом этаже."
            - "Irina: Perfecto. ¿Hay ascensor? | Прекрасно. Лифт есть?"
            - "Recepcionista: Claro, está al lado de la puerta. Su habitación es la 305, en la tercera planta. | Конечно, он рядом с дверью. Ваш номер 305, на третьем этаже."
            - "Irina: Muchas gracias. | Большое спасибо."
            - "Recepcionista: Aquí tiene la llave. ¿Me deja su pasaporte, por favor? | Вот ключ. Дадите ваш паспорт, пожалуйста?"
            - "Irina: Sí, aquí lo tiene. | Да, вот он."
      - learn: [la reserva, a nombre de, individual / doble, incluido/a, la planta, el ascensor]
      - choose:
          title: Поняли?
          source: recepcion
          skill: hotel
          items:
            - q: "¿Para cuántas noches es la reserva?"
              options: "Para dos noches. | Para tres noches. | Para una noche."
              explain: "Una habitación individual para dos noches."
            - q: "¿Dónde es el desayuno?"
              options: "En la planta baja. | En la tercera planta. | En la habitación."
              explain: "Es de siete a diez, en la planta baja. На третьем этаже — номер."
            - q: "¿Qué número tiene la habitación?"
              options: "305 | 350 | 503"
              explain: "Su habitación es la 305 — trescientos cinco."
            - q: "¿Qué le piden a Irina?"
              options: "El pasaporte. | La tarjeta. | La llave."
              explain: "¿Me deja su pasaporte, por favor? Ключ она, наоборот, даёт."
      - note:
          id: plantas
          text: "Этажи считают порядковыми словами: _la primera planta, la segunda, la tercera, la cuarta, la quinta_. **La planta baja** — этаж на уровне улицы; первый этаж по-испански — тот, что над ним."
      - choose:
          title: Что сказать?
          free: true
          skill: hotel
          rule: none
          items:
            - lines: ["Recepcionista: ¿Tiene una reserva?"]
              q: "У вас бронь на имя Олега Коваля."
              options: "Sí, a nombre de Oleg Koval. | Sí, me llamo la reserva. | Sí, el nombre es reserva."
              explain: "Бронь «на имя» — a nombre de…"
            - say: "Su habitación está en la segunda planta."
              options: "Ваш номер на втором этаже. | Ваш номер на первом этаже. | Ваш номер рядом с лифтом."
              explain: "La segunda planta — «второй этаж»."
              noaudio: {q: "Что значит «Su habitación está en la segunda planta»?", options: "Ваш номер на втором этаже. | Ваш номер на первом этаже. | Ваш номер рядом с лифтом."}
            - q: "Вас двое. Какой номер вы попросите?"
              options: "Una habitación doble. | Una habitación individual. | Una planta doble."
              explain: "Doble — на двоих, individual — на одного."
      - "Через час Ирина снова у стойки."
      - dialogue:
          id: problema
          slide: new
          title: Проблема
          lines:
            - "Irina: Perdone, la ducha de mi habitación no funciona. | Извините, в моём номере не работает душ."
            - "Recepcionista: Lo siento mucho. ¿Quiere cambiar de habitación? | Мне очень жаль. Хотите поменять номер?"
            - "Irina: Sí, por favor. | Да, пожалуйста."
            - "Recepcionista: Tiene la 207, en la segunda planta. Aquí tiene la llave. | У вас 207-й, на втором этаже. Вот ключ."
      - learn: [funcionar, cambiar]
      - choose:
          title: Поняли?
          source: problema
          skill: hotel
          items:
            - q: "¿Qué problema tiene Irina?"
              options: "La ducha no funciona. | No hay ascensor. | No encuentra la llave."
              explain: "Irina: La ducha de mi habitación no funciona."
            - q: "¿Qué habitación tiene ahora?"
              options: "La 207. | La 305. | La 270."
              explain: "Tiene la 207, en la segunda planta."
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "la reserva — бронь"
            - "la planta — этаж"
            - "el ascensor — лифт"
            - "incluido — включён"
            - "funcionar — работать"
            - "cambiar — менять"
      - build:
          title: Соберите фразу
          free: true
          skill: hotel
          rule: none
          items:
            - "Tengo una reserva a nombre de Ana López. — У меня бронь на имя Аны Лопес."
            - es: "¿El desayuno está incluido?"
              ru: "Завтрак включён?"
              alt: ["¿Está incluido el desayuno?"]
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          free: true
          skill: hotel
          rule: none
          items:
            - q: "Телевизор не работает."
              a: "La tele no funciona | No funciona la tele | La televisión no funciona | No funciona la televisión"
              explain: "О технике — funcionar: no funciona."
              mistakes:
                "la tele no trabaja": "Trabajar — о людях. О технике — **funcionar**: la tele no funciona."
            - q: "Спросите: «Можно поменять номер?»"
              a: "¿Puedo cambiar de habitación? | ¿Puedo cambiar la habitación? | ¿Podemos cambiar de habitación?"
              explain: "Cambiar de habitación — «поменять номер»."
    quiz:
      - q: "Tengo una reserva ___ Carlos Ruiz."
        options: "a nombre de | con nombre | de llamar"
        explain: "Бронь на имя — a nombre de."
        skill: hotel
        free: true
      - q: "El ascensor no ___: tenemos que subir a pie."
        options: "funciona | trabaja | cambia"
        explain: "О технике — funcionar."
        skill: hotel
        free: true

  - id: lectura
    kind: reading
    title: "Opiniones: dos hoteles"
    goal: понять отзывы о гостиницах и написать свой
    version: 2
    allow: [Luna]
    vocab:
      - "✨ limpio/a [ли́мпьо, ли́мпья] — чистый :: La habitación está muy limpia. — Номер очень чистый."
      - "🧹 sucio/a [су́θьо, су́θья] — грязный :: El baño está sucio. — Ванная грязная."
      - "🔊 el ruido [руи́до] — шум :: Hay mucho ruido en la calle. — На улице очень шумно."
      - "🤝 amable [ама́бле] — любезный, приветливый :: El camarero es muy amable. — Официант очень любезный."
      - "👍 recomendar [рэкомэнда́р] — советовать, рекомендовать :: Te recomiendo este hotel. — Советую тебе эту гостиницу."
      - "🛎 el/la recepcionista [рэθэпθьони́ста] — администратор гостиницы"
      - "💬 la opinión [опиньо́н] — мнение; отзыв {pl: opiniones} :: Hay muchas opiniones de este hotel. — Об этой гостинице много отзывов."
    blocks:
      - learn: [limpio/a, sucio/a, el ruido, amable]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "limpio — чистый"
            - "sucio — грязный"
            - "el ruido — шум"
            - "amable — любезный"
      - learn: [recomendar, el/la recepcionista, la opinión]
      - choose:
          title: Новые слова
          rule: none
          items:
            - q: "— ¿Conoces un buen hotel en Sevilla? — Sí, te ___ el Hotel Sol."
              options: "recomiendo | encuentro | dejo"
              explain: "Recomendar — «советовать»: te recomiendo."
            - q: "He leído muchas ___ de este hotel: a todos les gusta."
              options: "opiniones | reservas | llegadas"
              explain: "Las opiniones — отзывы."
      - "Перед поездкой Ирина читает отзывы о двух гостиницах Севильи."
      - reading:
          id: opiniones
          title: Opiniones
          text: |
            **Hotel Sol.** Olga, de Valencia:
            Estuvimos tres noches en este hotel y nos gustó mucho. La habitación es pequeña, pero muy limpia y tranquila. El desayuno está incluido y es muy bueno. La recepcionista fue muy amable: nos recomendó un restaurante cerca del hotel. El centro está a diez minutos a pie. ¡Lo recomiendo!

            **Hotel Luna.** Tom, de Londres:
            El hotel está en el centro, pero mi habitación no me gustó. La ducha no funcionó el primer día y me cambiaron de habitación por la tarde. Por la noche hubo mucho ruido en la calle y no pude dormir. El desayuno no está incluido: cuesta ocho euros. No voy a volver.
          translation: |
            **Отель «Соль».** Ольга, из Валенсии:
            Мы провели в этой гостинице три ночи, и нам очень понравилось. Номер маленький, но очень чистый и тихий. Завтрак включён, и он очень хороший. Администратор была очень любезна: посоветовала нам ресторан рядом с гостиницей. До центра десять минут пешком. Рекомендую!

            **Отель «Луна».** Том, из Лондона:
            Гостиница в центре, но мой номер мне не понравился. В первый день не работал душ, и днём меня переселили в другой номер. Ночью на улице было очень шумно, и я не мог уснуть. Завтрак не включён: он стоит восемь евро. Больше не приеду.
      - sort:
          title: О какой гостинице это сказано?
          source: opiniones
          groups:
            "Hotel Sol": [desayuno incluido, habitación limpia, recepcionista amable]
            "Hotel Luna": [ruido por la noche, la ducha no funcionó, desayuno a ocho euros]
      - choose:
          title: Что сказано в отзывах?
          source: opiniones
          items:
            - q: "¿Cuántas noches estuvo Olga en el hotel?"
              options: "Tres. | Dos. | Diez."
              explain: "Estuvimos tres noches en este hotel. Десять — это минуты до центра."
            - q: "¿Qué hizo la recepcionista del Hotel Sol?"
              options: "Recomendó un restaurante. | Cambió la habitación. | Preparó el desayuno."
              explain: "La recepcionista fue muy amable: nos recomendó un restaurante cerca del hotel."
            - q: "¿Por qué Tom no pudo dormir?"
              options: "Porque hubo mucho ruido en la calle. | Porque la habitación es pequeña. | Porque la ducha no funcionó."
              explain: "Por la noche hubo mucho ruido en la calle y no pude dormir. Душ — другая его проблема."
            - q: "¿Quién recomienda su hotel?"
              options: "Olga. | Tom. | Olga y Tom."
              explain: "Olga: ¡Lo recomiendo! Tom: No voy a volver."
      - write:
          title: Ответьте по отзывам
          format: короткий ответ по-испански
          source: opiniones
          items:
            - q: "¿Cuánto cuesta el desayuno en el Hotel Luna?"
              a: "Ocho euros | Cuesta ocho euros | 8 euros | Cuesta 8 euros"
              explain: "El desayuno no está incluido: cuesta ocho euros."
            - q: "Как Ольга пишет «Рекомендую (эту гостиницу)!»?"
              a: "Lo recomiendo"
              explain: "El hotel → lo: ¡Lo recomiendo!"
              skill: lo_la
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "La habitación es pequeña, pero muy limpia."
              options: "Номер маленький, но очень чистый. | Номер большой, но очень грязный. | Номер маленький и очень шумный."
              explain: "Pequeña — «маленькая», limpia — «чистая»."
              noaudio: {q: "Что значит «La habitación es pequeña, pero muy limpia»?", options: "Номер маленький, но очень чистый. | Номер большой, но очень грязный. | Номер маленький и очень шумный."}
            - q: "El baño está muy ___: quiero cambiar de habitación."
              options: "sucio | limpio | amable"
              explain: "Менять номер хочется, когда ванная грязная — sucio."
      - compose:
          title: Ваш отзыв
          free: true
          rule: none
          skill: hotel
          items:
            - q: "Напишите отзыв о гостинице или квартире, где вы останавливались, — настоящий или выдуманный, 4–5 фраз: сколько ночей · какой номер · что понравилось или нет · советуете ли вы это место."
              format: "Estuve … noches en… La habitación…"
              words: [25, 100]
              sentences: 3
              checks:
                - label: "сколько были: estuve / estuvimos … noches (días)"
                  any: [estuve, estuvimos]
                - label: "какое место: limpio, tranquilo, pequeño, ruido, amable…"
                  any: [limpio, limpia, sucio, sucia, tranquilo, tranquila, ruido, amable, cómodo, cómoda, bonito, bonita, pequeño, pequeña, grande, caro, barato]
                - label: "итог: lo recomiendo, me gustó…"
                  any: [lo recomiendo, la recomiendo, no lo recomiendo, me gustó, nos gustó, no me gustó, voy a volver]
              sample: "Estuve dos noches en el Hotel Sol de Sevilla. La habitación es pequeña, pero limpia y tranquila. El desayuno está incluido. La recepcionista es muy amable. Lo recomiendo."
              sample_ru: "Я провёл две ночи в отеле «Соль» в Севилье. Номер маленький, но чистый и тихий. Завтрак включён. Администратор очень любезная. Рекомендую."

  - id: mision
    kind: practice
    title: Билет и заселение
    goal: купить билет на вокзале и заселиться в гостиницу
    version: 2
    allow: [Koval, Oleg, Atención]
    blocks:
      - review:
          title: Вспомним
          skills: [perf_indef, participios, experiencia_detalle]
          n: 2
      - mission:
          id: taquilla
          title: На вокзале
          text: "Вы — Олег Коваль. Вам нужно в Валенсию: завтра утром туда, а обратно позже. Купите билет в кассе."
      - chat:
          id: empleado
          title: В кассе
          with: Empleado
          skill: billete
          turns:
            - say: "Buenos días. ¿Adónde viaja? | Добрый день. Куда едете?"
              task: "Вам нужно в Валенсию."
              write: "A Valencia | A Valencia, por favor | Voy a Valencia | (Quiero) un billete para Valencia(, por favor) | Un billete a Valencia(, por favor)"
              format: куда
              mistakes:
                "en valencia": "Куда — с предлогом **a**: a Valencia."
            - say: "¿Para cuándo? | На когда?"
              task: "На завтра, на утро."
              write: "Para mañana por la mañana | Mañana por la mañana | Para mañana"
              format: когда
            - say: "Hay un tren a las nueve y cuarto y otro a las once. ¿Cuál prefiere? | Есть поезд в девять пятнадцать и ещё один в одиннадцать. Какой предпочитаете?"
              task: "Вы выбираете поезд в девять пятнадцать."
              choose: "El de las nueve y cuarto. | El de las once. | El de las nueve y media."
              explain: "Y cuarto — «пятнадцать минут»: las nueve y cuarto — 9:15."
              skill: horario
            - say: "¿De ida o de ida y vuelta? | В одну сторону или туда и обратно?"
              build: "De ida y vuelta, por favor."
              ru: "Туда и обратно, пожалуйста."
            - say: "Son cuarenta y dos euros. | С вас сорок два евро."
              task: "Спросите, с какой платформы отправляется поезд."
              write: "¿De qué andén sale (el tren)? | ¿De qué andén sale el tren para Valencia?"
              format: вопрос
              mistakes:
                "qué andén sale el tren": "«С какой платформы» — **¿De qué andén…?**, с предлогом de."
            - say: "Del andén tres. ¡Buen viaje! | С третьей платформы. Счастливого пути!"
      - "Вы уже на вокзале. Звучит объявление. Послушайте его два раза: текста нет."
      - dialogue:
          id: aviso
          hidden: true
          title: Объявление на вокзале
          lines:
            - "Megafonía: Atención, por favor. El tren con destino a Valencia tiene veinte minutos de retraso. Sale del andén siete. | Внимание, пожалуйста. Поезд на Валенсию задерживается на двадцать минут. Он отправляется с седьмой платформы."
      - choose:
          title: Что объявили?
          source: aviso
          skill: horario
          items:
            - q: "¿Qué pasa con el tren a Valencia?"
              options: "Tiene veinte minutos de retraso. | Está cancelado. | Sale diez minutos antes."
              explain: "…tiene veinte minutos de retraso."
            - q: "¿De qué andén sale ahora?"
              options: "Del siete. | Del tres. | Del veinte."
              explain: "Sale del andén siete — не с третьей, как сказали в кассе."
      - mission:
          id: llegada
          title: В гостинице
          text: "Вечером вы в гостинице в Валенсии. У вас бронь на имя Олега Коваля: одноместный номер на две ночи. Администратор что-то перепутала — поправьте её."
      - chat:
          id: recepcion
          title: Заселение
          with: Recepcionista
          skill: hotel
          turns:
            - say: "Buenas noches. ¿Tiene una reserva? | Добрый вечер. У вас есть бронь?"
              task: "Да, на имя Олега Коваля."
              write: "Sí, a nombre de Oleg Koval | Sí, tengo una reserva a nombre de Oleg Koval | A nombre de Oleg Koval | Tengo una reserva a nombre de Oleg Koval"
              format: на чьё имя
            - say: "Una habitación doble para tres noches, ¿verdad? | Двухместный номер на три ночи, верно?"
              task: "Нет: одноместный номер на две ночи."
              write: "No, individual para dos noches | No, una habitación individual para dos noches | No, una individual para dos noches | No, (es) individual(,) para dos noches"
              format: какой номер и на сколько
              mistakes:
                "no doble para dos noches": "Номер на одного — **individual**."
            - say: "Perdone. Aquí está: individual, dos noches. ¿Me deja su pasaporte? | Простите. Вот она: одноместный, две ночи. Дадите ваш паспорт?"
              task: "Дайте паспорт."
              choose: "Sí, aquí lo tiene. | Sí, aquí la tiene. | Sí, aquí los tiene."
              explain: "El pasaporte → lo: aquí lo tiene."
              skill: lo_la
            - say: "Gracias. Su habitación es la 412, en la cuarta planta. | Спасибо. Ваш номер 412, на четвёртом этаже."
              task: "Спросите, включён ли завтрак."
              write: "¿El desayuno está incluido? | ¿Está incluido el desayuno?"
              format: вопрос
            - say: "Sí, es de siete a diez, en la planta baja. | Да, с семи до десяти, на первом этаже."
              task: "Задайте ещё один вопрос о гостинице — любой: ¿Hay…? ¿Dónde está…? ¿A qué hora…?"
              compose:
                format: "¿Hay…? / ¿Dónde está…? / ¿A qué hora…?"
                words: [2, 15]
                checks:
                  - label: "вопрос начинается с Hay, Dónde, A qué hora, Puedo, Cuánto или Tiene"
                    starts: [hay, dónde, a qué hora, puedo, cuánto, tiene, tienen, cuál, cómo, el, la, está]
                sample: "¿Hay ascensor?"
                sample_ru: "Есть лифт?"
            - say: "Claro. ¡Buenas noches! | Конечно. Доброй ночи!"

