id: de_viaje
number: 28
level: A2
title: De viaje — в поездке
goals:
  - купить билет на поезд и понять расписание
  - понять объявление на вокзале и в аэропорту
  - заселиться в гостиницу и решить небольшую проблему
  - не повторять слово: lo, la, los, las

# Тема 5 карты A2: вокзал, аэропорт, гостиница; lo, la, los, las; ir / irse; предлоги a, de, en, por, para.
lessons:
  - id: estacion
    kind: listening
    title: "Un billete para Sevilla"
    goal: купить билет на поезд и понять расписание
    version: 2
    # Карта экранов: docs/site_slide_maps/28_de_viaje.md
    vocab:
      - "🎫 el billete [бийе́тэ] — билет (на транспорт) :: Un billete para Sevilla, por favor. — Один билет до Севильи, пожалуйста."
      - "🔁 de ida y vuelta [дэ и́да и буэ́льта] — туда и обратно :: Un billete de ida y vuelta. — Билет туда и обратно."
      - "🚉 el andén [андэ́н] — платформа, перрон {pl: andenes} :: El tren sale del andén cinco. — Поезд отправляется с пятой платформы."
      - "🗓 el horario [ора́рьо] — расписание :: ¿Dónde está el horario de trenes? — Где расписание поездов?"
      - "🛫 la salida [сали́да] — отправление; выход :: La salida es a las diez. — Отправление в десять."
      - "🛬 la llegada [йега́да] — прибытие :: La llegada es a las doce y media. — Прибытие в половине первого."
      - "⏱ el minuto [мину́то] — минута :: El tren sale en diez minutos. — Поезд отправляется через десять минут."
      - "👋 ¡Buen viaje! [буэ́н бья́хэ] — счастливого пути!"
    blocks:
      - "Ирина покупает билет на вокзале в Мадриде. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: taquilla
          hidden: true
          lines:
            - "Irina: Buenos días. Un billete para Sevilla, por favor. | Добрый день. Один билет до Севильи, пожалуйста."
            - "Empleado: ¿Para hoy? | На сегодня?"
            - "Irina: No, para mañana por la mañana. | Нет, на завтра на утро."
            - "Empleado: Hay un tren a las ocho y media y otro a las diez. | Есть поезд в половине девятого и ещё один в десять."
            - "Irina: El de las diez, por favor. | Тот, что в десять, пожалуйста."
            - "Empleado: ¿De ida o de ida y vuelta? | В одну сторону или туда и обратно?"
            - "Irina: De ida y vuelta. Vuelvo el domingo por la tarde. | Туда и обратно. Возвращаюсь в воскресенье днём."
            - "Empleado: Muy bien. Son setenta y cuatro euros. ¿Paga con tarjeta? | Хорошо. С вас семьдесят четыре евро. Платите картой?"
            - "Irina: Sí. ¿De qué andén sale el tren? | Да. С какой платформы отправляется поезд?"
            - "Empleado: Del andén cinco. Aquí tiene su billete. ¡Buen viaje! | С пятой платформы. Вот ваш билет. Счастливого пути!"
      - choose:
          title: Что вы поняли?
          source: taquilla
          items:
            - q: "¿Adónde va Irina?"
              options: "A Sevilla. | A Valencia. | A Granada."
              explain: "Irina называет город в первой же фразе: …para Sevilla."
            - q: "¿Cuándo viaja?"
              options: "Mañana por la mañana. | Hoy. | El domingo."
              explain: "Irina: No, para mañana por la mañana. В воскресенье она возвращается."
      - learn: [el billete, de ida y vuelta, el andén, "¡Buen viaje!"]
      - choose:
          title: Детали разговора
          source: taquilla
          skill: billete
          items:
            - q: "¿A qué hora sale su tren?"
              options: "A las diez. | A las ocho y media. | A las cinco."
              explain: "Irina: El de las diez, por favor. Пять — это номер платформы."
            - q: "¿Qué billete compra?"
              options: "De ida y vuelta. | De ida. | Dos billetes de ida."
              explain: "Irina: De ida y vuelta. Vuelvo el domingo."
            - q: "¿Cuánto cuesta el billete?"
              options: "Setenta y cuatro euros. | Sesenta y cuatro euros. | Setenta euros."
              explain: "Empleado: Son setenta y cuatro euros."
            - q: "¿De qué andén sale el tren?"
              options: "Del cinco. | Del diez. | Del cuatro."
              explain: "Empleado: Del andén cinco."
      - learn: [el horario, la salida, la llegada, el minuto]
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "la salida — отправление"
            - "la llegada — прибытие"
            - "el horario — расписание"
            - "el andén — платформа"
            - "el billete — билет"
            - "el minuto — минута"
      - "Вот расписание утренних поездов из Мадрида."
      - table:
          id: horario
          title: Horario
          rows:
            - ["**Tren para**", "**Salida**", "**Llegada**", "**Andén**"]
            - ["Sevilla", "08:30", "11:02", "3"]
            - ["Valencia", "09:15", "11:05", "7"]
            - ["Barcelona", "09:40", "12:10", "2"]
            - ["Sevilla", "10:00", "12:35", "5"]
      - choose:
          title: Посмотрите в расписание
          free: true
          skill: horario
          rule: horario
          items:
            - q: "¿A qué hora llega a Sevilla el tren de las diez?"
              options: "12:35 | 11:02 | 12:10"
              explain: "Строка Sevilla — Salida 10:00 — Llegada 12:35."
            - q: "¿De qué andén sale el tren para Valencia?"
              options: "Del siete. | Del cinco. | Del dos."
              explain: "Valencia — Andén 7."
            - q: "Son las nueve y media. ¿Qué tren sale en diez minutos?"
              options: "El de Barcelona. | El de Valencia. | El de Sevilla."
              explain: "9:30 + 10 minutos = 9:40: это поезд на Барселону."
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: billete
          rule: none
          items:
            - say: "Un billete de ida y vuelta, por favor."
              a: "Un billete de ida y vuelta, por favor"
              noaudio: {q: "Напишите по-испански: «Один билет туда и обратно, пожалуйста».", a: "Un billete de ida y vuelta, por favor | Por favor, un billete de ida y vuelta"}
      - choose:
          title: Что ответить?
          free: true
          skill: billete
          rule: none
          items:
            - lines: ["Empleado: ¿De ida o de ida y vuelta?"]
              q: "Вам нужен билет только туда."
              options: "De ida, por favor. | De ida y vuelta, por favor. | Del andén cinco, por favor."
              explain: "Только туда — de ida."
            - lines: ["Empleado: Aquí tiene su billete. ¡Buen viaje!"]
              q: "Поблагодарите."
              options: "Muchas gracias. | De nada. | Igualmente."
              explain: "Вам дали билет и пожелали хорошей дороги — muchas gracias. Igualmente подошло бы, если бы кассир тоже уезжал."
      - build:
          title: Соберите вопрос
          free: true
          skill: billete
          rule: none
          items:
            - "¿De qué andén sale el tren para Sevilla? — С какой платформы отправляется поезд на Севилью?"
      - write:
          title: Спросите по-испански
          format: вопрос по-испански
          free: true
          skill: horario
          rule: none
          items:
            - q: "Во сколько отправляется поезд на Валенсию?"
              a: "¿A qué hora sale el tren para Valencia? | ¿A qué hora sale el tren a Valencia? | ¿A qué hora sale el tren de Valencia?"
              explain: "¿A qué hora sale…? — «во сколько отправляется?»; el tren para Valencia — «поезд на Валенсию»."
              mistakes:
                "qué hora sale el tren para valencia": "«Во сколько» — **¿A qué hora…?**, с предлогом a."

  - id: lo_la
    kind: grammar
    title: "Lo, la, los, las"
    goal: заменить уже названную вещь коротким словом — lo tengo, no la encuentro
    version: 2
    forms: [comprarlo, buscarla]
    vocab:
      - "🧳 la maleta [мале́та] — чемодан :: Mi maleta es azul. — Мой чемодан синий."
      - "🛂 el pasaporte [пасапо́ртэ] — паспорт :: ¿Tienes el pasaporte? — Паспорт у тебя?"
      - "🔎 encontrar [энконтра́р] — находить :: No encuentro mis llaves. — Я не могу найти ключи."
      - "📥 dejar [дэха́р] — оставлять; давать на время :: He dejado el móvil en casa. — Я оставил телефон дома."
      - "👜 el bolso [бо́льсо] — сумка :: Las llaves están en mi bolso. — Ключи в моей сумке."
    blocks:
      - "Лусия и Пабло собираются в поездку. Какими короткими словами они заменяют вещи, чтобы не повторяться?"
      - dialogue:
          id: maletas
          title: Перед выходом
          lines:
            - "Lucía: ¿Tienes los billetes? | Билеты у тебя?"
            - "Pablo: Sí, los tengo en la mochila. | Да, они у меня в рюкзаке."
            - "Lucía: ¿Y tu pasaporte? | А твой паспорт?"
            - "Pablo: No lo encuentro. ¿Lo has visto? | Не могу его найти. Ты его видела?"
            - "Lucía: Sí, lo has dejado en la mesa. ¿Y mi maleta? | Да, ты оставил его на столе. А мой чемодан?"
            - "Pablo: La he llevado al coche esta mañana. | Я отнёс его в машину сегодня утром."
      - learn: [la maleta, el pasaporte, encontrar, dejar, el bolso]
      - choose:
          title: Поняли?
          source: maletas
          items:
            - q: "¿Dónde están los billetes?"
              options: "En la mochila. | En la mesa. | En el coche."
              explain: "Pablo: Sí, los tengo en la mochila."
            - q: "¿Dónde ha dejado Pablo el pasaporte?"
              options: "En la mesa. | En la mochila. | En la maleta."
              explain: "Lucía: Lo has dejado en la mesa."
      - compare:
          id: lo_la
          slide: new
          title: Вместо названной вещи
          lead: "Короткое слово стоит **перед глаголом** и согласуется с вещью, которую заменяет."
          cards:
            - head: lo
              label: el billete
              tone: blue
              ex: ["Lo tengo. — Он у меня."]
            - head: la
              label: la maleta
              tone: rose
              ex: ["No la encuentro. — Не могу его найти."]
            - head: los
              label: los billetes
              tone: blue
              ex: ["Los he comprado. — Я их купил."]
            - head: las
              label: las llaves
              tone: rose
              ex: ["¿Las has visto? — Ты их видел?"]
          note: "Отрицание **no** стоит перед этим словом: _No lo tengo_. Во времени «he comprado» — перед **he**: _Lo he comprado_. Так же говорят о людях: _¿Conoces a Carmen? — Sí, la conozco._"
      - more:
          title: А с инфинитивом?
          text: "Если есть инфинитив, слово можно поставить в начало или прикрепить к инфинитиву — смысл один: _Lo voy a comprar_ = _Voy a comprarlo_; _La tengo que buscar_ = _Tengo que buscarla_."
      - sort:
          title: Каким словом заменить?
          free: true
          skill: lo_la
          rule: lo_la
          groups:
            "lo": [el pasaporte, el bolso]
            "la": [la maleta, la tarjeta]
            "los": [los billetes, los zapatos]
            "las": [las gafas, las llaves]
      - write:
          title: Вставьте lo, la, los или las
          format: lo, la, los или las
          free: true
          skill: lo_la
          rule: lo_la
          items:
            - q: "— ¿Tienes la maleta? — Sí, ___ tengo."
              a: "la"
              explain: "La maleta → la."
              mistakes:
                "lo": "La maleta — женского рода: **la** tengo."
            - q: "— ¿Has comprado los billetes? — Sí, ___ he comprado."
              a: "los"
              explain: "Los billetes → los."
            - q: "— ¿Ves el andén? — No, no ___ veo."
              a: "lo"
              explain: "El andén → lo."
              mistakes:
                "la": "El andén — мужского рода: no **lo** veo."
            - q: "— ¿Dónde están las llaves? — No ___ encuentro."
              a: "las"
              explain: "Las llaves → las."
            - q: "— ¿Conoces a mis padres? — No, no ___ conozco."
              a: "los"
              explain: "Mis padres → los."
            - q: "— ¿Conoces a Carmen? — Sí, ___ conozco."
              a: "la"
              explain: "Carmen — женщина: la conozco."
      - choose:
          title: Где стоит слово?
          free: true
          skill: lo_la
          rule: lo_la
          items:
            - q: "Какая фраза правильная?"
              options: "No lo tengo. | No tengo lo. | Lo no tengo."
              explain: "Сначала no, потом lo, потом глагол: No lo tengo."
            - say: "No la encuentro."
              options: "Я не могу её найти. | Я не хочу её искать. | Я её не жду."
              explain: "Encontrar — «находить»: no la encuentro."
              noaudio: {q: "Что значит «No la encuentro»?", options: "Я не могу её найти. | Я не хочу её искать. | Я её не жду."}
            - lines: ["Lucía: ¿Has visto mi bolso?"]
              q: "Вы видели его на диване."
              options: "Sí, lo he visto en el sofá. | Sí, la he visto en el sofá. | Sí, he visto lo en el sofá."
              explain: "El bolso → lo; слово стоит перед he."
      - build:
          title: Соберите фразу
          free: true
          skill: lo_la
          rule: lo_la
          items:
            - es: "No encuentro mi pasaporte."
              ru: "Я не могу найти свой паспорт."
              rule: none
            - es: "¿Dónde lo has dejado?"
              ru: "Где ты его оставил?"
              extra: [la]
      - write:
          title: Скажите по-испански
          format: короткая фраза
          free: true
          skill: lo_la
          rule: lo_la
          items:
            - q: "О билетах: «Я купил их вчера»."
              a: "Los compré ayer | Ayer los compré | (Yo) los compré ayer"
              explain: "Los billetes → los; слово стоит перед глаголом."
              mistakes:
                "compré los ayer": "Слово стоит перед глаголом: **Los compré** ayer."
                "lo compré ayer": "Билетов несколько: **los** compré."
            - q: "О чемодане (la maleta): «Я его не вижу»."
              a: "No la veo | (Yo) no la veo"
              explain: "La maleta → la; no — перед la."
              mistakes:
                "no lo veo": "La maleta — женского рода: no **la** veo."
                "no veo la": "Слово стоит перед глаголом: no **la veo**."
    quiz:
      - q: "— ¿Tienes las llaves? — Sí, ___ tengo en el bolso."
        options: "las | los | la"
        explain: "Las llaves → las."
        skill: lo_la
        free: true
      - q: "— ¿Has dejado el pasaporte en el hotel? — No, ___ en la maleta."
        options: "lo tengo | tengo lo | la tengo"
        explain: "El pasaporte → lo, перед глаголом: lo tengo."
        skill: lo_la
        free: true

  - id: aeropuerto
    kind: listening
    title: En el aeropuerto
    goal: понять объявление о рейсе и зарегистрироваться на рейс
    version: 2
    allow: [UX, VY, IB, Atención]
    vocab:
      - "✈️ el vuelo [буэ́ло] — рейс; полёт :: Mi vuelo sale a las diez. — Мой рейс вылетает в десять."
      - "🎯 el destino [дэсти́но] — место назначения :: el vuelo con destino a Madrid — рейс в Мадрид"
      - "🧳 el equipaje [экипа́хэ] — багаж :: ¿Tiene equipaje? — У вас есть багаж?"
      - "🏷 facturar [фактура́р] — сдавать в багаж; регистрировать :: Quiero facturar una maleta. — Я хочу сдать чемодан."
      - "🎟 la tarjeta de embarque [тархэ́та дэ эмба́ркэ] — посадочный талон"
      - "🚪 la puerta de embarque [пуэ́рта дэ эмба́ркэ] — выход на посадку :: ¿Cuál es la puerta de embarque? — Какой выход на посадку?"
      - "⏰ el retraso [рэтра́со] — опоздание, задержка :: El vuelo tiene una hora de retraso. — Рейс задерживается на час."
      - "🚫 cancelado/a [канθэла́до, канθэла́да] — отменённый :: El vuelo está cancelado. — Рейс отменён."
    blocks:
      - learn: [el vuelo, el destino, la puerta de embarque, el retraso, cancelado/a]
      - "Табло вылетов в аэропорту Валенсии."
      - table:
          id: salidas
          title: Salidas
          rows:
            - ["**Vuelo**", "**Destino**", "**Salida**", "**Puerta**", ""]
            - ["`UX 1045`", "Madrid", "10:40", "`B12`", ""]
            - ["`VY 2231`", "Barcelona", "11:05", "`A4`", "con retraso"]
            - ["`IB 3920`", "Sevilla", "11:30", "`C7`", "cancelado"]
      - choose:
          title: Посмотрите на табло
          skill: aeropuerto
          rule: salidas
          items:
            - q: "¿De qué puerta sale el vuelo con destino a Madrid?"
              options: "De la B12. | De la A4. | De la C7."
              explain: "Madrid — Puerta B12."
            - q: "¿Qué vuelo está cancelado?"
              options: "El de Sevilla. | El de Barcelona. | El de Madrid."
              explain: "Sevilla — cancelado. Рейс на Барселону только задерживается."
      - "А теперь объявления. Послушайте их два раза: текста нет."
      - dialogue:
          id: avisos
          hidden: true
          title: Объявления
          lines:
            - "Megafonía: Atención, por favor. El vuelo UX 1045 con destino a Madrid sale de la puerta B12. | Внимание, пожалуйста. Рейс UX 1045 в Мадрид отправляется от выхода B12."
            - "Megafonía: El vuelo VY 2231 con destino a Barcelona tiene una hora de retraso. | Рейс VY 2231 в Барселону задерживается на час."
            - "Megafonía: El vuelo IB 3920 con destino a Sevilla está cancelado. | Рейс IB 3920 в Севилью отменён."
      - choose:
          title: Что объявили?
          source: avisos
          skill: aeropuerto
          items:
            - q: "¿Cuánto retraso tiene el vuelo a Barcelona?"
              options: "Una hora. | Media hora. | Diez minutos."
              explain: "…con destino a Barcelona tiene una hora de retraso."
            - q: "¿Qué pasa con el vuelo a Sevilla?"
              options: "Está cancelado. | Tiene retraso. | Sale de otra puerta."
              explain: "El vuelo … con destino a Sevilla está cancelado."
            - q: "Su vuelo sale a las 11:05 y tiene una hora de retraso. ¿A qué hora sale ahora?"
              options: "A las doce y cinco. | A las once y cinco. | A las diez y cinco."
              explain: "11:05 + una hora = 12:05."
      - learn: [el equipaje, facturar, la tarjeta de embarque]
      - "У стойки регистрации."
      - dialogue:
          id: mostrador
          title: Регистрация на рейс
          lines:
            - "Empleado: Buenos días. Su pasaporte, por favor. | Добрый день. Ваш паспорт, пожалуйста."
            - "Irina: Aquí lo tiene. | Вот он."
            - "Empleado: ¿Va a facturar equipaje? | Будете сдавать багаж?"
            - "Irina: Sí, una maleta. El bolso lo llevo conmigo. | Да, один чемодан. Сумку я беру с собой."
            - "Empleado: Muy bien. Aquí tiene su tarjeta de embarque. Puerta B12. | Хорошо. Вот ваш посадочный талон. Выход B12."
            - "Irina: Gracias. ¿El vuelo sale a su hora? | Спасибо. Рейс вылетает вовремя?"
            - "Empleado: Sí, no hay retraso. ¡Buen viaje! | Да, задержки нет. Счастливого пути!"
      - choose:
          title: Поняли?
          source: mostrador
          skill: aeropuerto
          items:
            - q: "¿Qué equipaje factura Irina?"
              options: "Una maleta. | Un bolso. | Una maleta y un bolso."
              explain: "Irina: Sí, una maleta. El bolso lo llevo conmigo."
            - q: "¿Tiene retraso su vuelo?"
              options: "No, sale a su hora. | Sí, una hora. | Está cancelado."
              explain: "Empleado: Sí, no hay retraso."
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "el vuelo — рейс"
            - "el equipaje — багаж"
            - "la tarjeta de embarque — посадочный талон"
            - "la puerta de embarque — выход на посадку"
            - "el retraso — задержка"
            - "cancelado — отменён"
      - choose:
          title: Что ответить?
          free: true
          skill: aeropuerto
          rule: none
          items:
            - lines: ["Empleado: ¿Va a facturar equipaje?"]
              q: "У вас только сумка, сдавать нечего."
              options: "No, solo llevo un bolso. | Sí, una maleta. | No, no tengo pasaporte."
              explain: "Сдавать нечего — No; solo llevo un bolso — «у меня только сумка»."
            - lines: ["Empleado: Su pasaporte, por favor."]
