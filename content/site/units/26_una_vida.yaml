  - id: hace_anos
    kind: grammar
    title: "Hace dos años: сколько времени назад"
    goal: сказать, сколько времени назад что-то случилось
    version: 2
    vocab:
      - "🕐 hace poco [а́θэ по́ко] — недавно :: Me mudé hace poco. — Я недавно переехал."
      - "🕰 hace mucho [а́θэ му́чо] — давно :: Estuve en México hace mucho. — Я был в Мексике давно."
      - "🔚 último/a [у́льтимо, у́льтима] — последний :: ¿Cuándo fue la última vez? — Когда это было в последний раз?"
      - "🥇 por primera vez [пор примэ́ра бэθ] — впервые, в первый раз :: En 2019 fui a España por primera vez. — В 2019 году я впервые съездил в Испанию."
    blocks:
      - "Слово **hace** вы знаете: _Hace un año que estudio español_ — «я учу испанский уже год». С прошедшим временем оно значит другое — «тому назад»."
      - compare:
          id: hace
          title: Назад или уже?
          cards:
            - head: hace + срок
              say: false
              label: "назад — действие закончилось"
              tone: blue
              ex: ["Llegué a Madrid hace dos años. — Я приехал в Мадрид два года назад.", "Me casé hace un mes. — Я женился месяц назад."]
            - head: desde hace + срок
              say: false
              label: "уже — действие продолжается"
              tone: sun
              ex: ["Vivo en Madrid desde hace dos años. — Я живу в Мадриде уже два года.", "Estoy casado desde hace un mes. — Я женат уже месяц."]
          note: "Подсказка — время глагола: с прошедшим (_llegué, me casé_) — просто **hace**; с настоящим (_vivo, estoy_) — **desde hace**."
      - sort:
          title: Назад или уже?
          skill: hace_atras
          groups:
            "назад": ["Llegué hace un mes.", "Me mudé hace dos años.", "Nos casamos hace diez años."]
            "уже": ["Vivo aquí desde hace un mes.", "Trabajo aquí desde hace dos años.", "Estudio español desde hace un año."]
      - write:
          title: hace или desde hace?
          format: hace или desde hace
          skill: hace_atras
          items:
            - q: "Conocí a Diego ___ dos años."
              a: "hace"
              explain: "Conocí — прошедшее время, событие случилось: hace dos años — «два года назад»."
              mistakes:
                "desde hace": "Conocí — законченное событие: «познакомился два года назад» — просто **hace**."
            - q: "Conozco a Diego ___ dos años."
              a: "desde hace"
              explain: "Conozco — настоящее время, знакомство продолжается: desde hace."
              mistakes:
                "hace": "Conozco — настоящее время: знаком «уже два года» — **desde hace**."
            - q: "Me mudé a esta casa ___ seis meses."
              a: "hace"
              explain: "Me mudé — прошедшее время: hace seis meses."
              mistakes:
                "desde hace": "Me mudé — законченное событие: просто **hace**."
            - q: "Trabajo en este hospital ___ seis meses."
              a: "desde hace"
              explain: "Trabajo — настоящее время: desde hace."
              mistakes:
                "hace": "Trabajo — настоящее время: «уже шесть месяцев» — **desde hace**."
      - learn: [hace poco, hace mucho, último/a, por primera vez]
      - choose:
          title: Что ответить?
          skill: hace_atras
          items:
            - lines: ["Irina: ¿Cuándo llegaste a España?"]
              q: "Вы приехали три года назад."
              options: "Hace tres años. | Desde hace tres años. | En tres años."
              explain: "«Три года назад» — hace tres años. En tres años значит «через три года»."
            - say: "Estuve en México hace mucho."
              options: "Я был в Мексике давно. | Я давно живу в Мексике. | Я скоро поеду в Мексику."
              explain: "Estuve — «я был», hace mucho — «давно»."
              noaudio: {q: "Что значит «Estuve en México hace mucho»?", options: "Я был в Мексике давно. | Я давно живу в Мексике. | Я скоро поеду в Мексику."}
            - q: "Mi hermana se casó ___: la boda fue en septiembre."
              options: "hace poco | hace mucho | por primera vez"
              explain: "Свадьба была совсем недавно — hace poco."
            - say: "¿Cuándo fuiste al cine por última vez?"
              options: "Когда ты в последний раз ходил в кино? | Когда ты впервые пошёл в кино? | Когда ты пойдёшь в кино?"
              explain: "Por última vez — «в последний раз»; por primera vez — «впервые»."
              noaudio: {q: "Что значит «¿Cuándo fuiste al cine por última vez?»", options: "Когда ты в последний раз ходил в кино? | Когда ты впервые пошёл в кино? | Когда ты пойдёшь в кино?"}
      - build:
          title: Соберите фразу
          skill: hace_atras
          items:
            - es: "En 2019 fui a España por primera vez."
              ru: "В 2019 году я впервые съездил в Испанию."
              alt: ["Fui a España por primera vez en 2019."]
            - es: "Mis padres se casaron hace treinta años."
              ru: "Мои родители поженились тридцать лет назад."
              alt: ["Hace treinta años mis padres se casaron."]
              extra: [desde]
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: hace_atras
          items:
            - q: "Я приехал в Мадрид два года назад."
              a: "Llegué a Madrid hace dos años | Hace dos años llegué a Madrid | (Yo) llegué a Madrid hace dos años"
              explain: "Llegué — прошедшее время, поэтому просто hace dos años."
              mistakes:
                "llegué a madrid desde hace dos años": "С прошедшим временем — просто **hace**: llegué hace dos años."
                "llegué a madrid dos años hace": "Hace стоит перед сроком: **hace** dos años."
            - q: "Мы познакомились недавно."
              a: "Nos conocimos hace poco | Hace poco nos conocimos | (Nosotros) nos conocimos hace poco"
              explain: "Nos conocimos — «мы познакомились»; hace poco — «недавно»."
      - compose:
          title: О себе
          skill: hace_atras
          rule: hace
          items:
            - q: "¿Cuándo empezaste a estudiar español? ¿Cuándo fuiste al cine por última vez? Ответьте двумя фразами с hace."
              format: "Empecé a estudiar español hace…"
              words: [8, 35]
              sentences: 2
              checks:
                - label: "есть hace + срок"
                  re: "hace (un|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|\\w+|\\d+) (dia|dias|semana|semanas|mes|meses|año|años)|hace poco|hace mucho"
                - label: "глагол в прошедшем времени: empecé, fui…"
                  any: [empecé, fui, estuve, vi]
              sample: "Empecé a estudiar español hace un año. Fui al cine hace dos semanas."
              sample_ru: "Я начал учить испанский год назад. В кино я ходил две недели назад."
    quiz:
      - q: "Llegué a Madrid ___ dos años."
        options: "hace | desde hace | desde"
        explain: "Llegué — законченное событие: hace dos años — «два года назад»."
        skill: hace_atras
      - q: "Vivo en Madrid ___ dos años."
        options: "desde hace | hace | en"
        explain: "Vivo — настоящее время, действие продолжается: desde hace."
        skill: desde_hace

  - id: otros_irregulares
    kind: grammar
    title: "Pude, quise, vine, dije"
    goal: сказать, что вы не смогли, захотели, пришли и что вам сказали
    version: 2
    unlocks: [preterite_irregular]
    vocab:
      - "🚶‍♂️ venir [бэни́р] — приходить, приезжать (сюда) :: ¿Vienes a la fiesta? — Ты придёшь на вечеринку?"
      - "🗣 decir [дэθи́р] — говорить, сказать :: ¿Qué dices? — Что ты говоришь?"
      - "✅ la verdad [бэрда́д] — правда :: Es verdad. — Это правда."
      - "📰 la noticia [ноти́θья] — новость :: Tengo una noticia. — У меня есть новость."
      - "🏁 por fin [пор фин] — наконец, наконец-то :: ¡Por fin es viernes! — Наконец-то пятница!"
    blocks:
      - "Два новых глагола — venir и decir. В настоящем времени у них особая форма «я»: **vengo**, **digo**."
      - learn: [venir, decir]
      - compare:
          id: presente
          style: small
          cards:
            - head: vengo
              label: я прихожу
            - head: vienes
              label: ты приходишь
            - head: digo
              label: я говорю
            - head: dices
              label: ты говоришь
          note: "Остальные формы: _viene, venimos, venís, vienen_ и _dice, decimos, decís, dicen_."
      - choose:
          title: Выберите форму
          skill: pret_irregular_dos
          rule: presente
          items:
            - q: "— ¿Vienes a la fiesta? — Sí, ___ con mi hermana."
              options: "vengo | vieno | veno"
              explain: "Форма «я» у venir — vengo."
            - q: "Siempre (yo) ___ la verdad."
              options: "digo | deco | dico"
              explain: "Форма «я» у decir — digo."
      - text:
          id: fuertes
          slide: new
          text: "В прошедшем времени у этих глаголов, а ещё у poder и querer, — новая основа и окончания без знаков ударения, как у _tuve_ и _estuve_."
      - table:
          id: tabla
          rows:
            - ["poder", "**pud-**", "pude, pudiste, pudo, pudimos, pudisteis, pudieron"]
            - ["querer", "**quis-**", "quise, quisiste, quiso, quisimos, quisisteis, quisieron"]
            - ["venir", "**vin-**", "vine, viniste, vino, vinimos, vinisteis, vinieron"]
            - ["decir", "**dij-**", "dije, dijiste, dijo, dijimos, dijisteis, **dijeron**"]
      - more:
          title: Почему dijeron, а не `dijieron`?
          text: "После `j` в окончании «они» буква `i` пропадает: **dijeron**. А слово **vino** значит и «он пришёл», и «вино» — смысл ясен из фразы: _Pablo vino a casa_ и _un vino español_."
      - write:
          title: Поставьте глагол в прошедшее время
          format: одна форма глагола
          skill: pret_irregular_dos
          rule: tabla
          items:
            - q: "Ayer no (yo, poder) ___ ir a clase."
              a: "pude"
              explain: "Yo — pude."
              mistakes:
                "podí": "У poder особая основа: **pude**."
                "pudé": "Окончание без знака ударения: **pude**."
            - q: "Mi hermano no (querer) ___ venir a la fiesta."
              a: "quiso"
              explain: "Él — quiso. No quiso — «не захотел, отказался»."
              mistakes:
                "querió": "У querer особая основа: **quiso**."
            - q: "¿A qué hora (tú, venir) ___ a casa anoche?"
              a: "viniste"
              explain: "Tú — viniste."
              mistakes:
                "veniste": "Основа в прошедшем времени — vin-: **viniste**."
            - q: "¿Qué (decir) ___ la profesora?"
              a: "dijo"
              explain: "Ella — dijo."
              mistakes:
                "dició": "У decir особая основа: **dijo**."
                "dijó": "Окончание без знака ударения: **dijo**."
            - q: "Mis amigos (decir) ___ la verdad."
              a: "dijeron"
              explain: "Ellos — dijeron, без i после j."
              mistakes:
                "dijieron": "После `j` буква `i` пропадает: **dijeron**."
            - q: "El sábado no (nosotros, poder) ___ salir."
              a: "pudimos"
              explain: "Nosotros — pudimos."
      - learn: [la verdad, la noticia, por fin]
      - choose:
          title: Послушайте
          skill: pret_irregular_dos
          rule: tabla
          items:
            - say: "No pude venir porque tuve que trabajar."
              options: "Я не смог прийти, потому что мне пришлось работать. | Я не хочу приходить, потому что работаю. | Он не пришёл, потому что работал."
              explain: "No pude — «я не смог»; tuve que — «мне пришлось»."
              noaudio: {q: "Что значит «No pude venir porque tuve que trabajar»?", options: "Я не смог прийти, потому что мне пришлось работать. | Я не хочу приходить, потому что работаю. | Он не пришёл, потому что работал."}
            - say: "Por fin me dijo la verdad."
              options: "Наконец он сказал мне правду. | Наконец я сказал ему правду. | Он всегда говорит мне правду."
              explain: "Me dijo — «он сказал мне»; por fin — «наконец»."
              noaudio: {q: "Что значит «Por fin me dijo la verdad»?", options: "Наконец он сказал мне правду. | Наконец я сказал ему правду. | Он всегда говорит мне правду."}
      - match:
          title: Вопрос — ответ
          skill: pret_irregular_dos
          rule: tabla
          pairs:
            - "¿Por qué no viniste? — No pude: tuve un examen."
            - "¿Qué te dijo Ana? — Me dijo una noticia."
            - "¿Vino Carlos a la fiesta? — No, no quiso venir."
            - "¿Pudisteis ver el partido? — Sí, lo vimos en un bar."
      - build:
          title: Соберите фразу
          skill: pret_irregular_dos
          rule: tabla
          items:
            - es: "Ayer no pude ir a clase."
              ru: "Вчера я не смог пойти на занятие."
              alt: ["No pude ir a clase ayer."]
              extra: [puedo]
            - es: "Mi abuelo vino a Madrid por primera vez."
              ru: "Мой дедушка впервые приехал в Мадрид."
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: pret_irregular_dos
          rule: tabla
          items:
            - q: "Что он сказал?"
              a: "¿Qué dijo? | ¿Qué dijo él? | ¿Él qué dijo?"
              explain: "Él — dijo."
              mistakes:
                "qué dice": "Dice — настоящее время: «что он говорит?». В прошлом — **dijo**."
            - q: "Я не смог прийти."
              a: "No pude venir | (Yo) no pude venir"
              explain: "No pude + инфинитив."
              mistakes:
                "no puedo venir": "No puedo — «не могу» сейчас. «Не смог» — **no pude**."
      - compose:
          title: О себе
          skill: pret_irregular_dos
          rule: tabla
          items:
            - q: "Что вы не смогли сделать на прошлой неделе и почему? Напишите одну-две фразы."
              format: "La semana pasada no pude… porque…"
              words: [6, 35]
              checks:
                - label: "есть no pude + действие"
                  re: "no pude (\\w+(ar|er|ir)|ir)\\b"
                - label: "причина: porque…"
                  any: [porque]
              sample: "La semana pasada no pude ir a clase porque tuve mucho trabajo."
              sample_ru: "На прошлой неделе я не смог пойти на занятие, потому что у меня было много работы."
    quiz:
      - q: "— ¿Qué te ___ el médico? — Que tengo que descansar."
        options: "dijo | dije | dició"
        explain: "El médico — «он»: dijo."
        skill: pret_irregular_dos
      - q: "Ayer mis amigos no ___ venir."
        options: "pudieron | pudo | podieron"
        explain: "Mis amigos — они: pudieron, основа pud-."
        skill: pret_irregular_dos

  - id: lectura
    kind: reading
    title: "La vida de mi abuelo"
    goal: понять рассказ о жизни человека и написать биографию близкого
    version: 2
    vocab:
      - "🧒 de niño / de niña [дэ ни́ньо, дэ ни́нья] — в детстве :: De niño viví en un pueblo. — В детстве я жил в деревне."
      - "🏙 la capital [капита́ль] — столица {pl: capitales} :: Madrid es la capital de España. — Мадрид — столица Испании."
      - "🚦 al principio [аль принθи́пьо] — сначала, поначалу :: Al principio fue difícil. — Поначалу было трудно."
      - "🚀 el éxito [э́ксито] — успех :: El restaurante tuvo mucho éxito. — Ресторан имел большой успех."
    blocks:
      - learn: [de niño / de niña, la capital, al principio, el éxito]
      - choose:
          title: Новые слова
          rule: none
          items:
            - q: "Kiev es la ___ de Ucrania."
              options: "capital | catedral | vida"
              explain: "La capital — столица."
            - say: "Al principio fue muy difícil."
              options: "Поначалу было очень трудно. | В конце было очень трудно. | Сейчас очень трудно."
              explain: "Al principio — «сначала, поначалу»; fue — «было»."
              noaudio: {q: "Что значит «Al principio fue muy difícil»?", options: "Поначалу было очень трудно. | В конце было очень трудно. | Сейчас очень трудно."}
            - q: "___ viví en un pueblo pequeño; ahora vivo en la capital."
              options: "De niño | Por último | Por fin"
              explain: "De niño — «в детстве»: раньше жил в деревне, теперь — в столице."
            - q: "La película tuvo mucho ___: la vio todo el mundo."
              options: "éxito | error | consejo"
              explain: "Tener éxito — «иметь успех». Todo el mundo — «все»."
      - "Диего рассказывает о своём дедушке из Мексики."
      - reading:
          id: abuelo
          title: La vida de mi abuelo
          text: |
            Mi abuelo Miguel nació en 1940 en un pueblo pequeño del norte de México. De niño no pudo ir mucho a la escuela porque tuvo que trabajar en el campo con su padre.

            A los dieciséis años se mudó a la capital para buscar trabajo. Primero trabajó en un mercado y después en un restaurante. Allí conoció a mi abuela, Rosa. Se casaron en 1965 y tuvieron cuatro hijos.

            En 1980 mis abuelos abrieron su restaurante. Al principio fue muy difícil, pero trabajaron mucho y el restaurante tuvo éxito.

            Mi abuelo se jubiló hace quince años. Hace dos años vino a Madrid por primera vez para ver a su familia. Me dijo: «Diego, en la vida hay que trabajar, pero también hay que viajar». Ahora quiere aprender inglés. ¡Y tiene ochenta y seis años!
          translation: |
            Мой дедушка Мигель родился в 1940 году в маленькой деревне на севере Мексики. В детстве он не смог много ходить в школу, потому что ему пришлось работать в поле с отцом.

            В шестнадцать лет он переехал в столицу искать работу. Сначала работал на рынке, а потом в ресторане. Там он познакомился с моей бабушкой Росой. Они поженились в 1965 году, и у них родилось четверо детей.

            В 1980 году бабушка с дедушкой открыли свой ресторан. Поначалу было очень трудно, но они много работали, и ресторан стал успешным.

            Дедушка вышел на пенсию пятнадцать лет назад. Два года назад он впервые приехал в Мадрид повидать семью. Он сказал мне: «Диего, в жизни нужно работать, но нужно и путешествовать». Теперь он хочет выучить английский. А ему восемьдесят шесть лет!
      - choose:
          title: Что сказано в тексте?
          source: abuelo
          items:
            - q: "¿Por qué no pudo ir mucho a la escuela?"
              options: "Porque tuvo que trabajar en el campo. | Porque se mudó a la capital. | Porque no quiso estudiar."
              explain: "De niño no pudo ir mucho a la escuela porque tuvo que trabajar en el campo con su padre."
              skill: pret_irregular_dos
            - q: "¿Qué hizo a los dieciséis años?"
              options: "Se mudó a la capital. | Se casó con Rosa. | Abrió un restaurante."
              explain: "A los dieciséis años se mudó a la capital para buscar trabajo."
              skill: etapas
            - q: "¿Dónde conoció a su mujer?"
              options: "En un restaurante. | En un mercado. | En su pueblo."
              explain: "Primero trabajó en un mercado y después en un restaurante. Allí conoció a mi abuela."
              skill: etapas
            - q: "¿Cuándo se jubiló?"
              options: "Hace quince años. | Hace dos años. | En 1980."
              explain: "Mi abuelo se jubiló hace quince años. Два года назад он приехал в Мадрид."
              skill: hace_atras
            - q: "¿Qué quiere hacer ahora?"
              options: "Aprender inglés. | Abrir otro restaurante. | Volver a su pueblo."
              explain: "Ahora quiere aprender inglés."
      - sort:
          title: До 1970 года или после?
          source: abuelo
          groups:
            "antes de 1970": [nació en un pueblo, se mudó a la capital, se casó con Rosa]
            "después de 1970": [abrió su restaurante, se jubiló, vino a Madrid]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: abuelo
          items:
            - q: "¿Cuántos hijos tuvieron los abuelos?"
              a: "Cuatro | Tuvieron cuatro hijos | Cuatro hijos | 4"
              explain: "Se casaron en 1965 y tuvieron cuatro hijos."
            - q: "Как в тексте сказано «поначалу было очень трудно»?"
              a: "Al principio fue muy difícil"
              explain: "Al principio fue muy difícil, pero trabajaron mucho."
      - compose:
          title: Биография
          free: true
          rule: none
          skill: [vida, etapas, hace_atras]
          items:
            - q: "Напишите биографию человека из вашей семьи или известного человека, 5–6 фраз: где и когда родился · где вырос · что делал · когда женился или переехал · что с ним сейчас."
              format: "Mi abuela nació en… A los … años…"
              words: [35, 120]
