              checks:
                - label: "рождение: nació en…"
                  any: [nació, nací]
                - label: "год или возраст: en 1965, a los veinte años"
                  re: "(en (1|2)\\d\\d\\d|en mil|en dos mil|a los \\w+( y \\w+)? años|a los \\d+ años)"
                - label: "ещё события: creció, estudió, trabajó, se casó, se mudó, tuvo…"
