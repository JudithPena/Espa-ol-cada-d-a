              sample: "Mi abuela Olga nació en 1950 en un pueblo de Ucrania. Creció allí y a los dieciocho años se mudó a Kiev para estudiar. Trabajó en una escuela muchos años. Se casó en 1975 y tuvo dos hijos. Se jubiló hace diez años y ahora vive con mi familia."
              sample_ru: "Моя бабушка Ольга родилась в 1950 году в деревне на Украине. Она выросла там, а в восемнадцать лет переехала в Киев учиться. Много лет работала в школе. Вышла замуж в 1975 году, у неё двое детей. Десять лет назад она вышла на пенсию и теперь живёт с моей семьёй."

  - id: mision
    kind: practice
    title: Расскажите о себе
    goal: понять рассказ человека о его жизни и рассказать о своей
    version: 2
    blocks:
      - review:
          title: Вспомним
          skills: [pret_ar, pret_irregular, fui_fue]
          n: 2
      - "Первое занятие в языковой школе. Преподавательница Кармен рассказывает о себе. Послушайте её два раза: текста нет."
      - dialogue:
          id: carmen
          hidden: true
          title: Кармен о себе
          lines:
            - "Carmen: ¡Hola a todos! Me llamo Carmen. Nací en Sevilla en 1985. Estudié en la universidad de Granada. A los veinticinco años me mudé a Madrid. Empecé a trabajar en esta escuela hace diez años. Hace tres años me casé y el año pasado tuve una hija. | Всем привет! Меня зовут Кармен. Я родилась в Севилье в 1985 году. Училась в университете Гранады. В двадцать пять лет переехала в Мадрид. В этой школе начала работать десять лет назад. Три года назад я вышла замуж, а в прошлом году у меня родилась дочь."
      - choose:
          title: Что рассказала Кармен?
          source: carmen
          items:
            - q: "¿En qué año nació Carmen?"
              options: "En 1985. | En 1995. | En 1975."
              explain: "Nací en Sevilla en 1985 — mil novecientos ochenta y cinco."
              skill: anos
            - q: "¿Dónde estudió?"
              options: "En Granada. | En Sevilla. | En Madrid."
              explain: "Estudié en la universidad de Granada. В Севилье она родилась, в Мадрид переехала позже."
            - q: "¿Cuándo empezó a trabajar en la escuela?"
              options: "Hace diez años. | Hace tres años. | A los veinticinco años."
              explain: "Empecé a trabajar en esta escuela hace diez años."
              skill: hace_atras
            - q: "¿Qué pasó el año pasado?"
              options: "Tuvo una hija. | Se casó. | Se mudó a Madrid."
              explain: "Hace tres años me casé y el año pasado tuve una hija."
      - mission:
          id: clase
          title: Теперь вы
          text: "Теперь Кармен расспрашивает учеников. Отвечайте от себя — о своей настоящей жизни. В конце спросите её сами."
      - chat:
          id: entrevista
          title: На занятии
          with: Carmen
          skill: vida
          turns:
            - say: "Y tú, ¿dónde naciste? | А ты где родился?"
              task: "Ответьте о себе."
              compose:
                format: "Nací en…"
                words: [3, 15]
                checks:
                  - label: "есть Nací en…"
                    any: [nací en]
                sample: "Nací en Kiev."
                sample_ru: "Я родился в Киеве."
            - say: "¿Y en qué año? | А в каком году?"
              task: "Назовите год своего рождения."
              skill: anos
              compose:
                format: "En mil novecientos…"
                words: [1, 12]
                checks:
                  - label: "назван год — цифрами или словами"
                    re: "(1|2)\\d\\d\\d|mil novecientos|dos mil"
                sample: "En mil novecientos noventa."
                sample_ru: "В тысяча девятьсот девяностом."
            - say: "¿Dónde creciste? | Где ты вырос?"
              task: "Скажите, где вы выросли."
              skill: etapas
              compose:
                format: "Crecí en…"
                words: [2, 20]
                checks:
                  - label: "есть Crecí en… или En…"
                    any: [crecí en, en]
                sample: "Crecí en un pueblo cerca de Kiev."
                sample_ru: "Я вырос в деревне недалеко от Киева."
            - say: "¿Cuándo empezaste a estudiar español? | Когда ты начал учить испанский?"
              task: "Ответьте с hace или назовите год."
              skill: hace_atras
              compose:
                format: "Empecé hace…"
                words: [2, 20]
                checks:
                  - label: "когда: hace… или en + год"
                    any: [hace, en]
                sample: "Empecé hace un año."
                sample_ru: "Я начал год назад."
            - say: "¿Y por qué viniste a esta escuela? | А почему ты пришёл в эту школу?"
              task: "Назовите причину или цель."
              skill: para_porque
              compose:
                format: "Porque… / Para…"
                words: [2, 25]
                checks:
                  - label: "есть porque или para"
                    any: [porque, para]
                sample: "Porque quiero hablar mejor."
                sample_ru: "Потому что хочу говорить лучше."
            - say: "¡Muy bien! Ahora pregunta tú. | Очень хорошо! Теперь спрашивай ты."
              task: "Спросите Кармен, где она родилась (на «ты»)."
              write: "¿Dónde naciste? | (Y tú,) ¿dónde naciste? | ¿Dónde naciste tú? | Carmen, ¿dónde naciste?"
              format: вопрос
              mistakes:
                "dónde nació": "Nació — форма «он, она» и вежливое «вы». На «ты» — **naciste**."
                "dónde nací": "Nací — «я родился». Вопрос к «ты» — **naciste**."
            - say: "Nací en Sevilla, en 1985. | Я родилась в Севилье, в 1985 году."
      - compose:
          title: Mi vida
          free: true
          rule: none
          skill: [vida, hace_atras]
          items:
            - q: "Расскажите о своей жизни в пяти фразах: где и когда родились · где выросли · что изучали или где работали · важное событие и когда оно было · что делаете сейчас."
              format: "Nací en… en… Crecí en…"
              words: [30, 120]
              sentences: 4
              checks:
                - label: "рождение: Nací en…"
                  any: [nací]
                - label: "год или возраст: en 1990, a los veinte años"
                  re: "(en (1|2)\\d\\d\\d|en mil|en dos mil|a los \\w+( y \\w+)? años|a los \\d+ años)"
                - label: "сколько времени назад: hace…"
                  any: [hace]
                - label: "ещё событие: crecí, estudié, empecé, me mudé, me casé, tuve…"
                  any: [crecí, estudié, empecé, terminé, me mudé, me casé, tuve, conocí, trabajé, viví, vine, fui]
              sample: "Nací en Kiev en 1990. Crecí allí y estudié en la universidad. A los veintidós años empecé a trabajar en una oficina. Hace dos años me mudé a Valencia. Ahora estudio español y trabajo en un hotel."
              sample_ru: "Я родился в Киеве в 1990 году. Вырос там и учился в университете. В двадцать два года начал работать в офисе. Два года назад переехал в Валенсию. Сейчас учу испанский и работаю в гостинице."

