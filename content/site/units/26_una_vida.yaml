id: una_vida
number: 26
level: A2
title: Una vida — рассказ о жизни
goals:
  - рассказать, где и когда человек родился, вырос, женился, переехал
  - называть годы и понимать их на слух
  - сказать, сколько времени назад что-то случилось — hace dos años
  - рассказать коротко о своей жизни и о жизни близкого человека

# Тема 3 карты A2: биография. Indefinido: nacer, casarse, morir; особые основы (pude, quise, vine, dije); годы и сотни;
# a los 20 años, hace dos años (назад) в отличие от desde hace (уже) из темы 24.
lessons:
  - id: picasso
    kind: reading
    title: "La vida de Picasso"
    goal: понять короткую биографию и сказать, где вы родились
    version: 2
    # Карта экранов: docs/site_slide_maps/26_una_vida.md
    allow: [Guernica]
    vocab:
      - "🌱 la vida [би́да] — жизнь :: Es la historia de su vida. — Это история его жизни."
      - "👶 nacer [наθэ́р] — рождаться :: Nací en Kiev. — Я родился в Киеве."
      - "🕯 morir [мори́р] — умирать :: Picasso murió en 1973. — Пикассо умер в 1973 году."
      - "🌍 el mundo [му́ндо] — мир, свет :: Es famoso en todo el mundo. — Он знаменит во всём мире."
      - "🎨 el pintor / la pintora [пинто́р, пинто́ра] — художник, художница :: Picasso es un pintor español. — Пикассо — испанский художник."
      - "🖌 pintar [пинта́р] — писать красками, рисовать :: Pintó muchos cuadros. — Он написал много картин."
      - "🖼 el cuadro [куа́дро] — картина :: Es un cuadro de Picasso. — Это картина Пикассо."
      - "⭐ famoso/a [фамо́со, фамо́са] — знаменитый, известный :: Es una pintora muy famosa. — Это очень известная художница."
    blocks:
      - learn: [la vida, nacer, morir, el mundo]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "nacer — рождаться"
            - "morir — умирать"
            - "la vida — жизнь"
            - "el mundo — мир"
      - learn: [el pintor / la pintora, pintar, el cuadro, famoso/a]
      - choose:
          title: Новые слова
          rule: none
          items:
            - q: "Picasso es un ___ muy famoso."
              options: "pintor | cuadro | mundo"
              explain: "El pintor — художник. El cuadro — то, что он пишет."
            - say: "Es un cuadro muy famoso."
              options: "Это очень известная картина. | Это очень известный художник. | Это очень старая картина."
              explain: "El cuadro — «картина», famoso — «известный»."
              noaudio: {q: "Что значит «Es un cuadro muy famoso»?", options: "Это очень известная картина. | Это очень известный художник. | Это очень старая картина."}
      - "Биография — это цепочка дат и событий. Прочитайте, как прошла жизнь Пикассо."
      - reading:
          id: picasso
          title: La vida de Picasso
          text: |
            Pablo Picasso es uno de los pintores más famosos del mundo. Nació en Málaga, en el sur de España, en 1881. Su padre fue pintor y profesor. Pablo empezó a pintar muy joven: a los ocho años pintó su primer cuadro.

            En 1895 la familia fue a vivir a Barcelona. En 1904 Picasso fue a vivir a París. Allí conoció a muchos pintores y pintó cuadros muy famosos. En 1937 pintó el «Guernica», su cuadro más famoso.

            Picasso vivió en Francia muchos años y nunca volvió a vivir en España. Murió en 1973, a los noventa y un años.
          translation: |
            Пабло Пикассо — один из самых знаменитых художников мира. Он родился в Малаге, на юге Испании, в 1881 году. Его отец был художником и преподавателем. Пабло начал рисовать очень рано: в восемь лет он написал свою первую картину.

            В 1895 году семья переехала жить в Барселону. В 1904 году Пикассо уехал жить в Париж. Там он познакомился со многими художниками и написал очень известные картины. В 1937 году он написал «Гернику» — свою самую знаменитую картину.

            Пикассо много лет жил во Франции и больше не вернулся жить в Испанию. Он умер в 1973 году, в девяносто один год.
      - choose:
          title: Что сказано в тексте?
          source: picasso
          skill: vida
          items:
            - q: "¿Dónde nació Picasso?"
              options: "En Málaga. | En Barcelona. | En París."
              explain: "Nació en Málaga, en el sur de España. В Барселону и Париж он переехал позже."
            - q: "¿Qué hizo Picasso a los ocho años?"
              options: "Pintó su primer cuadro. | Fue a vivir a Barcelona. | Conoció a muchos pintores."
              explain: "A los ocho años pintó su primer cuadro."
            - q: "¿En qué año pintó el «Guernica»?"
              options: "En 1937. | En 1904. | En 1973."
              explain: "En 1937 pintó el «Guernica». В 1904 году он уехал в Париж, в 1973-м умер."
            - q: "¿Cuántos años vivió Picasso?"
              options: "Noventa y uno. | Ochenta y uno. | Setenta y tres."
              explain: "Murió en 1973, a los noventa y un años."
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: picasso
          skill: vida
          items:
            - q: "¿En qué año nació Picasso?"
              a: "En 1881 | Nació en 1881 | Picasso nació en 1881 | 1881"
              explain: "Nació en Málaga … en 1881."
            - q: "Как в тексте сказано «он умер в 1973 году»?"
              a: "Murió en 1973"
              explain: "Murió en 1973, a los noventa y un años."
              mistakes:
                "morió en 1973": "У morir в форме «он» корень меняется: **murió**."
      - text:
          id: naci
          slide: new
          text: "О себе говорят **nací** — «я родился, я родилась»: _Nací en Kiev._ О другом человеке — **nació**: _Mi madre nació en Odesa._ Спросить можно так: _¿Dónde naciste?_"
      - choose:
          title: Что ответить?
          free: true
          skill: vida
          rule: naci
          items:
            - lines: ["Diego: ¿Dónde naciste?"]
              q: "Вы родились в Киеве."
              options: "Nací en Kiev. | Nació en Kiev. | Naciste en Kiev."
              explain: "О себе — nací. Nació — «он родился», naciste — «ты родился»."
            - q: "Mi abuelo ___ en 1940 y ___ en 2015."
              options: "nació … murió | nací … morí | nace … muere"
              explain: "О дедушке — формы «он»: nació, murió."
      - build:
          title: Соберите фразу
          free: true
          skill: vida
          rule: naci
          items:
            - es: "Picasso nació en Málaga en 1881."
              ru: "Пикассо родился в Малаге в 1881 году."
              alt: ["Picasso nació en 1881 en Málaga."]
            - es: "Es uno de los pintores más famosos del mundo."
              ru: "Он один из самых знаменитых художников мира."
      - compose:
          title: О себе
          free: true
          skill: vida
          rule: naci
          items:
            - q: "¿Dónde naciste? Ответьте о себе одной фразой."
              format: "Nací en…"
              words: [3, 15]
              checks:
                - label: "начинается с Nací en…"
                  starts: [nací en, yo nací en]
              sample: "Nací en Kiev."
              sample_ru: "Я родился в Киеве."

  - id: anos
    kind: vocab
    title: "Годы: mil novecientos noventa"
    goal: назвать год и понять его на слух
    version: 2
    # сотни и числа 21–29 показаны в таблицах урока
    forms: [trescientos, trescientas, cuatrocientos, cuatrocientas, seiscientos, seiscientas, ochocientos, ochocientas,
            veintiuno, veintiún, veintidós, veintitrés, veinticuatro, veinticinco, veintiséis, veintisiete, veintiocho, veintinueve]
    vocab:
      - "💯 ciento [θье́нто] — сто (перед другим числом) :: ciento veinte — сто двадцать"
      - "2️⃣ doscientos/as [досθье́нтос] — двести :: doscientos euros — двести евро"
      - "5️⃣ quinientos/as [киньэ́нтос] — пятьсот :: quinientos años — пятьсот лет"
      - "7️⃣ setecientos/as [сэтэθье́нтос] — семьсот"
      - "9️⃣ novecientos/as [нобэθье́нтос] — девятьсот :: mil novecientos — тысяча девятьсот"
      - "📅 ¿En qué año? [эн кэ а́ньо] — в каком году? :: ¿En qué año naciste? — В каком году ты родился?"
      - "🏛 el siglo [си́гло] — век, столетие :: Picasso es un pintor del siglo veinte. — Пикассо — художник двадцатого века."
    blocks:
      - "Чтобы назвать год, нужны сотни. Большинство образуется просто: число + `cientos`. Три формы — особые."
      - table:
          id: cientos
          title: Сотни
          rows:
            - ["100", "cien (**ciento** uno, ciento veinte)"]
            - ["200", "doscientos"]
            - ["300", "trescientos"]
            - ["400", "cuatrocientos"]
            - ["500", "**quinientos**"]
            - ["600", "seiscientos"]
            - ["700", "**setecientos**"]
            - ["800", "ochocientos"]
            - ["900", "**novecientos**"]
      - learn: [ciento, doscientos/as, quinientos/as, setecientos/as, novecientos/as]
      - match:
          title: Соедините пары
          skill: anos
          rule: cientos
          pairs:
            - "200 — doscientos"
            - "500 — quinientos"
            - "700 — setecientos"
            - "900 — novecientos"
            - "120 — ciento veinte"
      - write:
          title: Напишите число словами
          format: число словами
          skill: anos
          rule: cientos
          items:
            - q: "500"
              a: "quinientos"
              explain: "Особая форма: quinientos."
              mistakes:
                "cincocientos": "У пятисот особая форма: **quinientos**."
            - q: "900"
              a: "novecientos"
              explain: "Особая форма: novecientos, от nueve."
              mistakes:
                "nuevecientos": "Особая форма: **nove**cientos, без `ue`."
            - q: "150"
              a: "ciento cincuenta"
              explain: "Перед другим числом — ciento: ciento cincuenta."
              mistakes:
                "cien cincuenta": "Перед другим числом cien превращается в **ciento**: ciento cincuenta."
      - rule:
          id: anos
          slide: new
          text: |
            Год читается как обычное число — тысячи, сотни, десятки: 1995 — **mil novecientos noventa y cinco**, 2024 — **dos mil veinticuatro**.
            Перед mil слово «один» не нужно: _mil novecientos_, а не «un mil».
            Числа от 21 до 29 пишутся в одно слово: _veintiuno, veintidós, veintitrés, veinticuatro, veinticinco, veintiséis, veintisiete, veintiocho, veintinueve_.
      - choose:
          title: Какой это год?
          skill: anos
          rule: anos
          items:
            - q: "mil novecientos ochenta y cinco"
              options: "1985 | 1895 | 1958"
              explain: "Mil — 1000, novecientos — 900, ochenta y cinco — 85."
            - q: "dos mil veintidós"
              options: "2022 | 2012 | 2202"
              explain: "Dos mil — 2000, veintidós — 22."
            - say: "mil ochocientos ochenta y uno"
              options: "1881 | 1981 | 1818"
              explain: "Mil ochocientos — 1800, ochenta y uno — 81: год рождения Пикассо."
              noaudio: {q: "Какой это год: «mil ochocientos ochenta y uno»?", options: "1881 | 1981 | 1818"}
      - write:
          title: Запишите год цифрами
          format: год цифрами
          answer: number
          skill: anos
          rule: anos
          items:
            - say: "mil novecientos noventa y dos"
              a: "1992"
              noaudio: {q: "Запишите цифрами: mil novecientos noventa y dos", a: "1992"}
            - say: "dos mil diez"
              a: "2010"
              noaudio: {q: "Запишите цифрами: dos mil diez", a: "2010"}
            - say: "mil novecientos setenta y tres"
              a: "1973"
              noaudio: {q: "Запишите цифрами: mil novecientos setenta y tres", a: "1973"}
            - say: "dos mil veinticinco"
              a: "2025"
              noaudio: {q: "Запишите цифрами: dos mil veinticinco", a: "2025"}
      - write:
          title: Напишите год словами
          format: год словами
          skill: anos
          rule: anos
          items:
            - q: "2020"
              a: "dos mil veinte"
              explain: "Dos mil + veinte."
            - q: "1999"
              a: "mil novecientos noventa y nueve"
              explain: "Mil + novecientos + noventa y nueve."
              mistakes:
                "mil nuevecientos noventa y nueve": "Девятьсот — **novecientos**, без `ue`."
                "un mil novecientos noventa y nueve": "Перед mil слово un не нужно: **mil** novecientos…"
      - learn: ["¿En qué año?", el siglo]
      - choose:
          title: Что ответить?
          skill: anos
          rule: anos
          items:
            - lines: ["Diego: ¿En qué año naciste?"]
              q: "Вы родились в 1990 году."
              options: "Nací en mil novecientos noventa. | Nació en mil novecientos noventa. | Nací en mil nuevecientos noventa."
              explain: "О себе — nací; девятьсот — novecientos."
              skill: vida
            - q: "1937 — ¿qué siglo es?"
              options: "El siglo veinte. | El siglo diecinueve. | El siglo dieciocho."
              explain: "Годы 1901–2000 — двадцатый век: el siglo veinte."
      - build:
          title: Соберите вопрос
          skill: vida
          rule: none
          items:
            - "¿En qué año naciste? — В каком году ты родился?"
      - compose:
          title: О себе
          skill: anos
          rule: anos
          items:
            - q: "¿En qué año naciste? Ответьте фразой и напишите год словами."
              format: "Nací en mil novecientos…"
              words: [4, 14]
              checks:
                - label: "начинается с Nací en…"
                  starts: [nací en, yo nací en]
                - label: "год словами: mil novecientos… или dos mil…"
                  any: [mil novecientos, dos mil]
              sample: "Nací en mil novecientos noventa."
              sample_ru: "Я родился в тысяча девятьсот девяностом году."
    quiz:
      - q: "Как сказать «500»?"
        options: "quinientos | cincocientos | cincuenta"
        explain: "Особая форма: quinientos. Cincuenta — это 50."
        skill: anos
      - q: "mil novecientos sesenta y seis"
        options: "1966 | 1976 | 1696"
        explain: "Novecientos — 900, sesenta y seis — 66."
        skill: anos

  - id: etapas
    kind: vocab
    title: Этапы жизни
    goal: рассказать о главных событиях в жизни человека — вырос, переехал, женился
    version: 2
    vocab:
      - "🌳 crecer [крэθэ́р] — расти, вырастать :: Crecí en un pueblo. — Я вырос в деревне."
      - "🚚 mudarse [муда́рсэ] — переезжать :: Me mudé a Madrid en 2020. — Я переехал в Мадрид в 2020 году."
      - "💍 casarse [каса́рсэ] — жениться, выходить замуж :: Mis padres se casaron en 1988. — Мои родители поженились в 1988 году."
      - "👰 la boda [бо́да] — свадьба :: Fue una boda muy bonita. — Это была очень красивая свадьба."
      - "🌴 jubilarse [хубила́рсэ] — выходить на пенсию :: Mi abuela se jubiló en 2010. — Моя бабушка вышла на пенсию в 2010 году."
      - "🎂 a los... años [а лос а́ньос] — в … лет :: A los veinte años empecé a trabajar. — В двадцать лет я начал работать."
    blocks:
      - "Лусия показывает Ирине фотографию бабушки и дедушки."
      - dialogue:
          id: abuelos
          title: Бабушка Кармен
          lines:
            - "Irina: ¿Quién es esta señora? | Кто эта женщина?"
            - "Lucía: Es mi abuela Carmen. Nació en un pueblo de Andalucía en 1945. | Это моя бабушка Кармен. Она родилась в деревне в Андалусии в 1945 году."
            - "Irina: ¿Y creció allí? | И выросла там?"
            - "Lucía: Sí, creció en el pueblo, pero a los dieciocho años se mudó a Madrid para trabajar. | Да, выросла в деревне, но в восемнадцать лет переехала в Мадрид работать."
            - "Irina: ¿Y tu abuelo? | А твой дедушка?"
            - "Lucía: Mi abuelo Antonio es de Madrid. Se conocieron en 1966 en una fiesta y se casaron un año después. | Мой дедушка Антонио — из Мадрида. Они познакомились в 1966 году на вечеринке и поженились через год."
            - "Irina: ¡Qué bonito! ¿Tuvieron muchos hijos? | Как красиво! У них было много детей?"
            - "Lucía: Tres: mi madre y mis dos tíos. Mi abuela trabajó en una tienda hasta 2010. Ese año se jubiló. | Трое: моя мама и двое моих дядей. Бабушка работала в магазине до 2010 года. В тот год она вышла на пенсию."
            - "Irina: ¿Y ahora? | А сейчас?"
            - "Lucía: Ahora viaja mucho. ¡El año pasado fue a México! | Сейчас она много путешествует. В прошлом году ездила в Мексику!"
      - learn: [crecer, mudarse, casarse, la boda, jubilarse, a los... años]
      - choose:
          title: Поняли?
          source: abuelos
          skill: etapas
          items:
            - q: "¿Dónde nació la abuela de Lucía?"
              options: "En un pueblo de Andalucía. | En Madrid. | En México."
              explain: "Lucía: Nació en un pueblo de Andalucía en 1945."
            - q: "¿Para qué se mudó a Madrid?"
              options: "Para trabajar. | Para estudiar. | Para casarse."
              explain: "A los dieciocho años se mudó a Madrid para trabajar."
            - q: "¿En qué año se casaron los abuelos?"
              options: "En 1967. | En 1966. | En 1945."
              explain: "Se conocieron en 1966 … y se casaron un año después — то есть в 1967-м."
            - q: "¿Qué hizo la abuela en 2010?"
              options: "Se jubiló. | Se mudó a Madrid. | Fue a México."
              explain: "Trabajó en una tienda hasta 2010. Ese año se jubiló."
      - compare:
          id: cuando
          slide: new
          title: Когда это случилось
          cards:
            - head: en 1966
              label: в 1966 году
              tone: blue
              ex: ["Se conocieron en 1966. — Они познакомились в 1966 году."]
            - head: a los 18 años
              label: в 18 лет
              tone: sun
              ex: ["A los dieciocho años se mudó a Madrid. — В восемнадцать лет она переехала в Мадрид."]
            - head: un año después
              label: через год
              tone: mint
              ex: ["Se casaron un año después. — Они поженились через год."]
          note: "**Conocer** в прошедшем времени значит «познакомиться»: _Conocí a mi marido en 2015_ — «Я познакомилась с мужем в 2015 году»."
      - match:
          title: Соедините пары
          free: true
          skill: etapas
          rule: none
          pairs:
            - "nacer — родиться"
            - "crecer — вырасти"
            - "casarse — пожениться"
            - "mudarse — переехать"
            - "jubilarse — выйти на пенсию"
            - "la boda — свадьба"
      - write:
          title: Поставьте глагол в прошедшее время
          format: одна форма глагола
          accents: strict
          free: true
          skill: etapas
          rule: cuando
          items:
            - q: "Mi hermana (casarse) se ___ en 2019."
              a: "casó"
              explain: "Ella — se casó."
              mistakes:
                "caso": "Нужен знак ударения: se cas**ó**. Без него — «я женюсь»."
            - q: "A los veinte años (yo, empezar) ___ a trabajar."
              a: "empecé"
              explain: "Empezar → empecé: перед e буква z меняется на c."
              mistakes:
                "empezé": "Перед `e` пишется `c`: empe**c**é."
            - q: "Mis padres se (conocer) ___ en la universidad."
              a: "conocieron"
              explain: "Ellos — se conocieron: «познакомились»."
            - q: "Mi abuelo (jubilarse) se ___ a los sesenta y cinco años."
              a: "jubiló"
              explain: "Él — se jubiló."
            - q: "(yo, crecer) ___ en una ciudad pequeña."
              a: "crecí"
              explain: "Yo — crecí."
      - choose:
          title: Послушайте
          free: true
          skill: etapas
          rule: cuando
          items:
            - say: "Me casé a los treinta años."
              options: "Я женился в тридцать лет. | Я женюсь через тридцать лет. | Он женился тридцать лет назад."
              explain: "Me casé — «я женился»; a los treinta años — «в тридцать лет»."
              noaudio: {q: "Что значит «Me casé a los treinta años»?", options: "Я женился в тридцать лет. | Я женюсь через тридцать лет. | Он женился тридцать лет назад."}
            - say: "Fue una boda muy bonita."
