id: hoy_y_ayer
number: 27
level: A2
title: Hoy y ayer — сегодня и вчера
goals:
  - выбирать между «he comido» и «comí» по слову времени
  - рассказать, что вы уже сделали и чего ещё не сделали
  - расспросить об опыте и уточнить подробности — «¿Has estado…? — Sí, estuve en 2019»
  - написать открытку из поездки

# Тема 4 карты A2: pretérito perfecto и indefinido в контрасте; ya, todavía no, alguna vez, nunca; поездки и опыт.
lessons:
  - id: granada
    kind: listening
    title: "¿Qué tal en Granada?"
    goal: понять на слух, что человек сделал сегодня, а что — вчера
    version: 2
    # Карта экранов: docs/site_slide_maps/27_hoy_y_ayer.md
    vocab:
      - "🎁 el regalo [рэга́ло] — подарок :: He comprado un regalo para mi madre. — Я купил подарок маме."
      - "🏛 el monumento [монумэ́нто] — памятник, достопримечательность :: La Alhambra es un monumento muy famoso. — Альгамбра — очень известный памятник."
      - "🧳 el/la turista [тури́ста] — турист, туристка :: Hay muchos turistas. — Здесь много туристов."
      - "⏳ todavía [тодаби́а] — ещё, до сих пор :: Todavía estoy en Granada. — Я ещё в Гранаде."
      - "⌚ tener tiempo [тэнэ́р тье́мпо] — иметь время, успевать :: Hoy no he tenido tiempo. — Сегодня я не успел."
    blocks:
      - "Лусия с подругой уехала в Гранаду. Ей звонит Карлос. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: llamada
          hidden: true
          lines:
            - "Carlos: ¡Hola, Lucía! ¿Qué tal en Granada? | Привет, Лусия! Как там в Гранаде?"
            - "Lucía: ¡Genial! Llegamos ayer por la tarde. | Отлично! Мы приехали вчера днём."
            - "Carlos: ¿Y qué habéis hecho hoy? | И что вы сегодня делали?"
            - "Lucía: Esta mañana hemos visitado la Alhambra. Es un monumento increíble, pero hay muchos turistas. | Сегодня утром мы посетили Альгамбру. Это потрясающий памятник, но там много туристов."
            - "Carlos: ¿Y habéis probado las tapas? | А тапас вы попробовали?"
            - "Lucía: ¡Claro! Anoche cenamos en un bar de tapas. Comimos muy bien. | Конечно! Вчера вечером мы ужинали в тапас-баре. Очень вкусно поели."
            - "Carlos: ¿Ya has comprado mi regalo? | Ты уже купила мне подарок?"
            - "Lucía: Todavía no. Hoy no he tenido tiempo. | Ещё нет. Сегодня я не успела."
            - "Carlos: ¿Cuándo volvéis? | Когда вы возвращаетесь?"
            - "Lucía: El domingo. Mañana vamos a ver la catedral. ¡Hasta el domingo! | В воскресенье. Завтра пойдём смотреть собор. До воскресенья!"
      - choose:
          title: Что вы поняли?
          source: llamada
          items:
            - q: "¿Dónde está Lucía?"
              options: "En Granada. | En Sevilla. | En Madrid."
              explain: "Carlos: ¿Qué tal en Granada?"
            - q: "¿Cuándo vuelve Lucía?"
              options: "El domingo. | Mañana. | Esta tarde."
              explain: "Lucía: El domingo. Завтра они только идут в собор."
      - learn: [el regalo, el monumento, el/la turista, todavía, tener tiempo]
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "el regalo — подарок"
            - "el monumento — памятник"
            - "el turista — турист"
            - "todavía — ещё"
            - "tener tiempo — иметь время"
      - choose:
          title: Детали разговора
          source: llamada
          skill: perf_indef
          items:
            - q: "¿Cuándo llegaron a Granada?"
              options: "Ayer por la tarde. | Esta mañana. | Anoche."
              explain: "Lucía: Llegamos ayer por la tarde."
            - q: "¿Qué han hecho esta mañana?"
              options: "Han visitado la Alhambra. | Han visto la catedral. | Han comprado regalos."
              explain: "Esta mañana hemos visitado la Alhambra. Собор — завтра, подарок ещё не куплен."
            - q: "¿Cuándo cenaron en un bar de tapas?"
              options: "Anoche. | Hoy. | El domingo."
              explain: "Anoche cenamos en un bar de tapas."
            - q: "¿Ha comprado Lucía el regalo de Carlos?"
              options: "No, todavía no. | Sí, lo compró ayer. | Sí, esta mañana."
              explain: "Lucía: Todavía no. Hoy no he tenido tiempo."
      - text:
          id: notice
          slide: new
          text: "В одном разговоре — два прошедших времени. Какое выбрать, подсказывает слово времени. Сравните."
      - examples:
          items:
            - "**Esta mañana** hemos visitado la Alhambra. — **Сегодня утром** мы посетили Альгамбру."
            - "**Hoy** no he tenido tiempo. — **Сегодня** я не успела."
            - "Llegamos **ayer**. — Мы приехали **вчера**."
            - "**Anoche** cenamos en un bar. — **Вчера вечером** мы ужинали в баре."
      - sort:
          title: Сегодня или вчера?
          source: llamada
          skill: perf_indef
          groups:
            "сегодня: he…, hemos…": ["Hemos visitado la Alhambra.", "No he tenido tiempo."]
            "вчера: -é, -amos": ["Llegamos por la tarde.", "Cenamos en un bar de tapas."]
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: perf_indef
          rule: notice
          items:
            - say: "Hoy no he tenido tiempo."
              a: "Hoy no he tenido tiempo"
              explain: "He tenido — «у меня (сегодня) было»: tener → tenido."
              noaudio: {q: "Напишите по-испански: «Сегодня у меня не было времени».", a: "Hoy no he tenido tiempo"}
      - choose:
          title: Что ответить?
          free: true
          skill: perf_indef
          rule: notice
          items:
            - lines: ["Carlos: ¿Ya has comprado el regalo?"]
              q: "Вы ещё не купили."
              options: "Todavía no. | Sí, todavía. | No, nunca."
              explain: "«Ещё нет» — todavía no. Nunca — «никогда»."
            - lines: ["Carlos: ¿Qué has hecho hoy?"]
              q: "Сегодня вы посетили музей."
              options: "He visitado un museo. | Visité un museo ayer. | Voy a visitar un museo."
              explain: "О сегодняшнем дне — he visitado."
      - build:
          title: Соберите фразу
          free: true
          skill: perf_indef
          rule: notice
          items:
            - "¿Qué habéis hecho hoy? — Что вы сегодня делали?"
            - es: "Todavía no he comprado el regalo."
              ru: "Я ещё не купил подарок."
              alt: ["No he comprado el regalo todavía."]

  - id: participios
    kind: grammar
    title: "He dicho, he vuelto, he roto"
    goal: рассказать, что вы уже сделали сегодня, с неправильными причастиями
    version: 2
    vocab:
      - "💥 romper [ромпэ́р] — ломать, разбивать, рвать :: He roto un vaso. — Я разбил стакан."
      - "🥛 el vaso [ба́со] — стакан :: Un vaso de agua, por favor. — Стакан воды, пожалуйста."
    blocks:
      - "Время «he comido» вы знаете: **haber** + причастие. У нескольких частых глаголов причастие неправильное — его нужно запомнить."
      - table:
          id: irregulares
          title: Неправильные причастия
          rows:
            - ["hacer", "**hecho**", "He hecho la compra."]
            - ["ver", "**visto**", "¿Has visto mi móvil?"]
            - ["decir", "**dicho**", "No me ha dicho la verdad."]
            - ["volver", "**vuelto**", "Todavía no ha vuelto."]
            - ["escribir", "**escrito**", "He escrito un mensaje."]
            - ["abrir", "**abierto**", "¿Quién ha abierto la ventana?"]
            - ["romper", "**roto**", "He roto un vaso."]
      - learn: [romper, el vaso]
      - match:
          title: Глагол — причастие
          skill: participios
          rule: irregulares
          pairs:
            - "decir — dicho"
            - "volver — vuelto"
            - "romper — roto"
            - "escribir — escrito"
            - "abrir — abierto"
            - "hacer — hecho"
      - write:
          title: Вставьте причастие
          format: причастие
          skill: participios
          rule: irregulares
          items:
            - q: "Hoy he (escribir) ___ tres mensajes."
              a: "escrito"
              explain: "Escribir → escrito."
              mistakes:
                "escribido": "У escribir причастие неправильное: **escrito**."
            - q: "¿Has (ver) ___ mis llaves?"
              a: "visto"
              explain: "Ver → visto."
              mistakes:
                "vido": "У ver причастие неправильное: **visto**."
            - q: "Carlos todavía no ha (volver) ___."
              a: "vuelto"
              explain: "Volver → vuelto."
              mistakes:
                "volvido": "У volver причастие неправильное: **vuelto**."
            - q: "¿Quién ha (abrir) ___ la puerta?"
              a: "abierto"
              explain: "Abrir → abierto."
              mistakes:
                "abrido": "У abrir причастие неправильное: **abierto**."
            - q: "¡He (romper) ___ un vaso!"
              a: "roto"
              explain: "Romper → roto."
              mistakes:
                "rompido": "У romper причастие неправильное: **roto**."
            - q: "No me has (decir) ___ la verdad."
              a: "dicho"
              explain: "Decir → dicho."
              mistakes:
                "decido": "У decir причастие неправильное: **dicho**."
      - compare:
          id: ya
          slide: new
          title: Уже, ещё нет, никогда
          cards:
            - head: Ya he comido.
              label: уже
              tone: mint
            - head: Todavía no he comido.
              label: ещё не
              tone: sun
            - head: Nunca he estado en México.
              label: никогда
              tone: blue
          note: "**Ya**, **todavía no** и **nunca** стоят перед глаголом, а между _he_ и причастием ничего не ставится: _Ya he comido_, а не «he ya comido»."
      - choose:
          title: Послушайте
          skill: participios
          rule: ya
          items:
            - say: "Todavía no ha vuelto del trabajo."
              options: "Он ещё не вернулся с работы. | Он уже вернулся с работы. | Он никогда не возвращается с работы."
              explain: "Todavía no ha vuelto — «ещё не вернулся»."
              noaudio: {q: "Что значит «Todavía no ha vuelto del trabajo»?", options: "Он ещё не вернулся с работы. | Он уже вернулся с работы. | Он никогда не возвращается с работы."}
            - say: "¿Ya has hecho la compra?"
              options: "Ты уже сходил за продуктами? | Ты ещё не сходил за продуктами? | Ты пойдёшь за продуктами?"
              explain: "¿Ya has hecho…? — «ты уже сделал…?»."
              noaudio: {q: "Что значит «¿Ya has hecho la compra?»", options: "Ты уже сходил за продуктами? | Ты ещё не сходил за продуктами? | Ты пойдёшь за продуктами?"}
            - q: "Где стоит ya?"
              options: "Ya he visto esta película. | He ya visto esta película. | He visto ya esta película no."
              explain: "Ya — перед he: между he и причастием ничего не ставят."
      - build:
          title: Соберите фразу
          skill: participios
          rule: ya
          items:
            - es: "Todavía no he escrito el mensaje."
              ru: "Я ещё не написал сообщение."
              alt: ["No he escrito el mensaje todavía."]
            - es: "¿Quién ha roto este vaso?"
              ru: "Кто разбил этот стакан?"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: participios
          rule: ya
          items:
            - q: "Я уже сделал задание."
              a: "Ya he hecho la tarea | (Yo) ya he hecho la tarea | He hecho la tarea ya"
              explain: "Ya + he hecho."
              mistakes:
                "ya he hacido la tarea": "У hacer причастие неправильное: **hecho**."
                "he ya hecho la tarea": "Между he и причастием ничего не ставят: **Ya he hecho**."
            - q: "Он ещё не вернулся."
              a: "Todavía no ha vuelto | (Él) todavía no ha vuelto | No ha vuelto todavía"
              explain: "Todavía no + ha vuelto."
              mistakes:
                "todavía no ha volvido": "У volver причастие неправильное: **vuelto**."
      - compose:
          title: О себе
          skill: participios
          rule: ya
          items:
            - q: "¿Qué has hecho hoy? Напишите две фразы: что вы сегодня уже сделали и чего ещё не сделали."
              format: "Hoy ya he… Todavía no he…"
              words: [6, 35]
              sentences: 2
              checks:
                - label: "уже сделали: ya he… или hoy he…"
                  any: [ya he, hoy he, he]
                - label: "ещё не сделали: todavía no he…"
                  any: [todavía no he, no he]
              sample: "Hoy ya he desayunado y he trabajado. Todavía no he hecho la compra."
              sample_ru: "Сегодня я уже позавтракал и поработал. За продуктами ещё не сходил."
    quiz:
      - q: "¿Has ___ a tus padres hoy?"
        options: "visto | vido | veído"
        explain: "Ver → visto."
        skill: participios
      - q: "Какая фраза правильная?"
        options: "Todavía no he vuelto. | No he todavía vuelto. | Todavía no he volvido."
        explain: "Todavía no стоит перед he; причастие от volver — vuelto."
        skill: participios

  - id: contraste
    kind: grammar
    title: "Hoy he comido — ayer comí"
    goal: выбрать прошедшее время по слову времени
    version: 2
    vocab:
      - "📈 últimamente [ультимамэ́нтэ] — в последнее время :: Últimamente he trabajado mucho. — В последнее время я много работаю."
      - "⏱ hasta ahora [а́ста ао́ра] — до сих пор, пока что :: Hasta ahora no he tenido problemas. — Пока у меня не было проблем."
      - "📆 el otro día [эль о́тро ди́а] — на днях, недавно :: El otro día vi a Carlos. — На днях я видел Карлоса."
      - "⚠️ el problema [пробле́ма] — проблема (мужского рода!) :: No hay problema. — Нет проблем."
    blocks:
      - compare:
          id: dos_tiempos
          title: Какое время выбрать
          cards:
            - head: he comido
              say: false
              label: период ещё идёт
              tone: sun
              text: "hoy, esta mañana, esta semana, este año, últimamente, hasta ahora"
              ex: ["Hoy he comido paella. — Сегодня я ел паэлью."]
            - head: comí
              say: false
              label: период закончился
              tone: blue
              text: "ayer, anoche, el lunes, la semana pasada, en 2020, hace dos días, el otro día"
              ex: ["Ayer comí paella. — Вчера я ел паэлью."]
          note: "«Сегодня» ещё не закончилось, «эта неделя» тоже — поэтому **he comido**. «Вчера» и «прошлая неделя» уже позади — поэтому **comí**."
      - learn: [últimamente, hasta ahora, el otro día, el problema]
      - sort:
          title: С каким временем?
          skill: perf_indef
          groups:
            "he comido": [hoy, esta semana, este año, últimamente, hasta ahora]
            "comí": [ayer, anoche, el otro día, la semana pasada, hace dos días]
      - choose:
          title: Выберите форму
          skill: perf_indef
          items:
            - q: "Ayer ___ a Carlos en el metro."
              options: "vi | he visto | veo"
              explain: "Ayer — период закончился: vi."
            - q: "Esta semana ___ mucho."
              options: "he trabajado | trabajé | trabajo"
              explain: "Esta semana ещё идёт: he trabajado."
            - q: "En 2019 ___ a México."
              options: "fui | he ido | voy"
              explain: "En 2019 — год закончился: fui."
            - q: "Este año ___ dos veces a la playa."
              options: "he ido | fui | voy"
              explain: "Este año ещё идёт: he ido."
            - q: "Hasta ahora no he tenido ___ con el coche."
              options: "problemas | regalos | turistas"
              explain: "No he tenido problemas — «у меня не было проблем»."
              rule: none
            - q: "Últimamente no ___ a mis amigos."
              options: "he visto | vi | veo"
              explain: "Últimamente — «в последнее время», период не закрыт: he visto."
      - write:
          title: Скажите о другом дне
          format: одна форма глагола (одно или два слова)
          skill: perf_indef
          items:
            - q: "Hoy he comido en casa. → Ayer ___ en casa."
              a: "comí"
              explain: "Ayer → comí."
              mistakes:
                "he comido": "Ayer — период закончился: **comí**."
            - q: "Ayer vi una película. → Esta semana ___ dos películas."
              a: "he visto"
              explain: "Esta semana → he visto."
              mistakes:
                "vi": "Esta semana ещё идёт: **he visto**."
            - q: "El lunes fui al médico. → Hoy ___ al médico."
              a: "he ido"
              explain: "Hoy → he ido: причастие от ir — ido."
              mistakes:
                "fui": "Hoy ещё не закончилось: **he ido**."
            - q: "Esta mañana he hablado con Ana. → Anoche ___ con Ana."
              a: "hablé"
              explain: "Anoche → hablé."
              mistakes:
                "he hablado": "Anoche — период закончился: **hablé**."
      - choose:
          title: Послушайте
          skill: perf_indef
          items:
            - say: "Esta semana he tenido mucho trabajo."
              options: "На этой неделе у меня было много работы. | На прошлой неделе у меня было много работы. | На следующей неделе у меня будет много работы."
              explain: "Esta semana + he tenido: неделя ещё идёт."
              noaudio: {q: "Что значит «Esta semana he tenido mucho trabajo»?", options: "На этой неделе у меня было много работы. | На прошлой неделе у меня было много работы. | На следующей неделе у меня будет много работы."}
            - say: "El otro día fui a una exposición."
              options: "На днях я ходил на выставку. | Сегодня я ходил на выставку. | На днях я пойду на выставку."
              explain: "El otro día — «на днях» в прошлом: fui."
              noaudio: {q: "Что значит «El otro día fui a una exposición»?", options: "На днях я ходил на выставку. | Сегодня я ходил на выставку. | На днях я пойду на выставку."}
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: perf_indef
          items:
            - q: "Сегодня я не завтракал."
              a: "Hoy no he desayunado | (Yo) hoy no he desayunado | No he desayunado hoy"
              explain: "Hoy → no he desayunado."
              mistakes:
                "hoy no desayuné": "В Испании о сегодняшнем дне говорят **he desayunado**: день ещё не закончился."
            - q: "Вчера я не завтракал."
              a: "Ayer no desayuné | (Yo) ayer no desayuné | No desayuné ayer"
              explain: "Ayer → no desayuné."
              mistakes:
                "ayer no he desayunado": "Ayer — период закончился: **desayuné**."
      - compose:
          title: О себе
          skill: perf_indef
          rule: dos_tiempos
          items:
            - q: "Напишите две фразы: что вы делали вчера и что сделали сегодня."
              format: "Ayer… Hoy he…"
              words: [6, 35]
              sentences: 2
              checks:
                - label: "вчера: ayer или anoche"
                  any: [ayer, anoche]
                - label: "сегодня: hoy, esta mañana или esta tarde"
                  any: [hoy, esta mañana, esta tarde]
                - label: "о сегодняшнем — he + причастие"
                  re: "\\bhe \\w+(ado|ido|to|cho)\\b"
              sample: "Ayer trabajé hasta las ocho. Hoy he descansado y he leído un libro."
              sample_ru: "Вчера я работал до восьми. Сегодня я отдыхал и читал книгу."
    quiz:
      - q: "Anoche ___ una película muy buena."
        options: "vimos | hemos visto | vemos"
        explain: "Anoche — период закончился: vimos."
        skill: perf_indef
      - q: "Hoy ___ temprano."
        options: "me he levantado | me levanté | me levanto mañana"
        explain: "Hoy ещё идёт: me he levantado."
        skill: perf_indef

  - id: experiencias
    kind: dialogue
    title: "¿Has estado alguna vez en…?"
    goal: расспросить об опыте и уточнить, когда и как это было
    version: 2
    vocab:
      - "🗺 el país [паи́с] — страна {pl: países} :: España es un país muy bonito. — Испания — очень красивая страна."
      - "✈️ el extranjero [экстранхэ́ро] — заграница :: Nunca he vivido en el extranjero. — Я никогда не жил за границей."
      - "🏝 la isla [и́сла] — остров :: Mallorca es una isla. — Майорка — это остров."
