  - id: lectura
    kind: reading
    title: "Una semana en Andalucía"
    goal: понять письмо из путешествия и написать открытку
    version: 2
    vocab:
      - "🎭 el espectáculo [эспэкта́куло] — представление, шоу :: Vimos un espectáculo increíble. — Мы посмотрели потрясающее представление."
      - "💃 el flamenco [фламэ́нко] — фламенко :: Me encanta el flamenco. — Я обожаю фламенко."
      - "✨ precioso/a [прэθьо́со, прэθьо́са] — прекрасный, очень красивый :: Sevilla es una ciudad preciosa. — Севилья — прекрасный город."
    blocks:
      - learn: [el espectáculo, el flamenco, precioso/a]
      - "Лусия пишет Пабло из Севильи."
      - reading:
          id: andalucia
          title: Una semana en Andalucía
          text: |
            ¡Hola, Pablo!

            Te escribo desde Sevilla. Esta semana hemos visto muchas cosas. El lunes llegamos a Granada y visitamos la Alhambra. El martes fuimos a Córdoba en tren: es una ciudad antigua y preciosa. Allí comimos en un restaurante muy famoso.

            Ayer llegamos a Sevilla. Por la noche vimos un espectáculo de flamenco. ¡Me encantó!

            Hoy hemos paseado por el centro y hemos subido a la Giralda. Hace mucho calor: ¡treinta y ocho grados! Todavía no hemos visto la catedral: vamos mañana. Y todavía no he comprado regalos, pero he hecho muchas fotos.

            Volvemos el domingo. ¿Y tú? ¿Qué has hecho esta semana?

            Un abrazo,
            Lucía
          translation: |
            Привет, Пабло!

            Пишу тебе из Севильи. На этой неделе мы много всего увидели. В понедельник приехали в Гранаду и посетили Альгамбру. Во вторник поехали в Кордову на поезде: это старинный и прекрасный город. Там мы пообедали в очень известном ресторане.

            Вчера мы приехали в Севилью. Вечером посмотрели представление фламенко. Мне очень понравилось!

            Сегодня мы гуляли по центру и поднялись на Хиральду. Очень жарко: тридцать восемь градусов! Собор мы ещё не видели: пойдём завтра. И подарков я ещё не купила, зато сделала много фотографий.

            Возвращаемся в воскресенье. А ты? Что ты делал на этой неделе?

            Обнимаю,
            Лусия
      - choose:
          title: Что сказано в письме?
          source: andalucia
          skill: perf_indef
          items:
            - q: "¿Qué hicieron el martes?"
              options: "Fueron a Córdoba. | Visitaron la Alhambra. | Llegaron a Sevilla."
              explain: "El martes fuimos a Córdoba en tren. Альгамбра была в понедельник, Севилья — вчера."
            - q: "¿Qué vio Lucía ayer por la noche?"
              options: "Un espectáculo de flamenco. | La catedral. | Una exposición de fotos."
              explain: "Por la noche vimos un espectáculo de flamenco."
            - q: "¿Qué han hecho hoy?"
              options: "Han paseado por el centro. | Han visto la catedral. | Han comprado regalos."
              explain: "Hoy hemos paseado por el centro y hemos subido a la Giralda. Собор и подарки — ещё нет."
            - q: "¿Cuándo vuelven?"
              options: "El domingo. | Mañana. | El martes."
              explain: "Volvemos el domingo."
      - sort:
          title: Уже сделали или ещё нет?
          source: andalucia
          groups:
            "ya": [visitar la Alhambra, subir a la Giralda, hacer fotos]
            "todavía no": [ver la catedral, comprar regalos]
      - write:
          title: Ответьте по письму
          format: короткий ответ по-испански
          source: andalucia
          items:
            - q: "¿Cómo fueron a Córdoba?"
              a: "En tren | Fueron en tren | Fueron a Córdoba en tren"
              explain: "El martes fuimos a Córdoba en tren."
            - q: "Как в письме сказано «мы ещё не видели собор»?"
              a: "Todavía no hemos visto la catedral"
              explain: "Todavía no hemos visto la catedral: vamos mañana."
              skill: participios
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "Es una ciudad antigua y preciosa."
              options: "Это старинный и прекрасный город. | Это новый и красивый город. | Это большой и известный город."
              explain: "Antigua — «старинная», preciosa — «прекрасная»."
              noaudio: {q: "Что значит «Es una ciudad antigua y preciosa»?", options: "Это старинный и прекрасный город. | Это новый и красивый город. | Это большой и известный город."}
      - compose:
          title: Открытка
          free: true
          rule: none
          skill: [perf_indef, participios]
          items:
            - q: "Вы в путешествии — настоящем или выдуманном. Напишите другу открытку, 5–6 фраз: где вы · что было вчера или в первый день · что вы сделали сегодня · чего ещё не сделали."
              format: "¡Hola! Te escribo desde…"
              words: [30, 120]
              sentences: 4
              checks:
                - label: "вчера или день недели: ayer, anoche, el lunes…"
                  any: [ayer, anoche, el lunes, el martes, el miércoles, el jueves, el viernes, el sábado, el domingo]
                - label: "сегодня: hoy или esta mañana + he… / hemos…"
                  re: "\\b(he|hemos) \\w+(ado|ido|to|cho)\\b"
                - label: "ещё нет: todavía no…"
                  any: [todavía no]
              sample: "¡Hola, Ana! Te escribo desde Valencia. Llegué ayer por la tarde y cené paella. Hoy he paseado por el centro y he visto la catedral. Todavía no he ido a la playa. Vuelvo el domingo. Un abrazo."
              sample_ru: "Привет, Ана! Пишу тебе из Валенсии. Я приехал вчера днём и поужинал паэльей. Сегодня гулял по центру и видел собор. На пляж ещё не ходил. Возвращаюсь в воскресенье. Обнимаю."

