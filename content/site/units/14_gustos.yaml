id: gustos
number: 14
level: A1
title: Мне нравится
goals:
  - рассказать о хобби и свободном времени
  - сказать, что нравится и что нет
  - согласиться или не согласиться с собеседником

lessons:
  - id: vocab1
    kind: vocab
    title: Свободное время
    goal: сказать, чем вы занимаетесь в свободное время
    version: 2
    vocab:
      - "🕊 el tiempo libre [тьэ́мпо ли́брэ] — свободное время"
      - "💃 bailar [байла́р] — танцевать"
      - "🎤 cantar [канта́р] — петь"
      - "🧳 viajar [бьяха́р] — путешествовать"
      - "🏊 nadar [нада́р] — плавать"
      - "🏃 correr [коррэ́р] — бегать"
      - "📺 ver [бэр] — смотреть, видеть {forms: veo ves ve vemos} :: Veo la tele. — Я смотрю телевизор."
    blocks:
      - text:
          id: regular
          text: "Что вы делаете в свободное время? Почти все глаголы урока правильные, и вы уже умеете их спрягать: bailo, bailas, baila; corro, corres, corre."
      - learn: [el tiempo libre, bailar, cantar, viajar]
      - choose:
          title: Послушайте и выберите
          skill: hobbies
          items:
            - say: "Mi hermana baila muy bien."
              options: "Моя сестра очень хорошо танцует. | Моя сестра очень хорошо поёт. | Моя сестра много путешествует."
              noaudio: {q: "Что значит «Mi hermana baila muy bien»?", options: "Моя сестра очень хорошо танцует. | Моя сестра очень хорошо поёт. | Моя сестра много путешествует."}
      - learn: [nadar, correr, ver]
      - note:
          id: ver
          text: "**ver** неправильный в форме «я»: **veo**, а дальше **ves**, **ve**, **vemos**: _Veo la tele._ _¿Ves el autobús?_"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "bailar — танцевать"
            - "cantar — петь"
            - "viajar — путешествовать"
            - "nadar — плавать"
            - "correr — бегать"
            - "ver — смотреть"
      - write:
          title: Traduce
          format: фраза по-испански
          skill: hobbies
          items:
            - {q: "В свободное время я пою и танцую.", a: "En mi tiempo libre canto y bailo | Canto y bailo en mi tiempo libre | En el tiempo libre canto y bailo", rule: regular}
            - {q: "Мы много путешествуем.", a: "Viajamos mucho", rule: regular}
            - {q: "Они бегают в парке.", a: "Corren en el parque | Ellos corren en el parque", rule: regular}
            - q: "Я смотрю телевизор."
              a: "Veo la tele"
              rule: ver
              mistakes: {"vo la tele": "У ver форма «я» — **veo**."}

  - id: gustar
    kind: grammar
    title: "Me gusta, me gustan"
    goal: сказать, что вам нравится и что нет
    version: 2
    vocab:
      - "❤️ gustar [густа́р] — нравиться {forms: gusta gustan}"
      - "🙂 me gusta [мэ гу́ста] — мне нравится :: Me gusta el café. — Мне нравится кофе."
      - "❓ ¿Te gusta...? [тэ гу́ста] — тебе нравится...? :: ¿Te gusta bailar? — Ты любишь танцевать?"
      - "👤 le gusta [лэ гу́ста] — ему, ей, вам (usted) нравится"
      - "👥 nos / os / les gusta [нос, ос, лэс] — нам / вам / им нравится"
    blocks:
      - "**gustar** устроен как русское «нравиться»: тот, кому нравится, отвечает на вопрос «кому?». Когда говорят **gusta**, а когда **gustan**?"
      - examples:
          items:
            - "Me gusta el café. — Мне нравится кофе."
            - "Me gustan los perros. — Мне нравятся собаки."
            - "¿Te gusta bailar? — Тебе нравится танцевать?"
      - learn: [gustar, me gusta, "¿Te gusta...?"]
      - compare:
          id: gusta_gustan
          cards:
            - head: gusta
              label: одна вещь или действие
              tone: blue
              ex: ["Me gusta el vino.", "Me gusta cantar."]
            - head: gustan
              label: много вещей
              tone: sun
              ex: ["Me gustan los gatos.", "¿Te gustan las manzanas?"]
      - sort:
          title: Gusta или gustan?
          skill: gustar
          groups:
            "me gusta…": [el café, bailar, la música]
            "me gustan…": [los perros, las tapas, los libros]
      - learn: [le gusta, nos / os / les gusta]
      - table:
          id: le_gusta
          rows:
            - ["мне", "**me** gusta / gustan"]
            - ["тебе", "**te** gusta / gustan"]
            - ["ему, ей, вам (usted)", "**le** gusta / gustan"]
            - ["нам", "**nos** gusta / gustan"]
            - ["вам (vosotros)", "**os** gusta / gustan"]
            - ["им, вам (ustedes)", "**les** gusta / gustan"]
      - note:
          id: a_ana
          text: "Если называете человека по имени или говорите, кто он вам, перед ним ставится **a**, а **le** остаётся: _A Ana le gusta la música._ _A mi madre le gusta cocinar._ Перед существительным нужен артикль даже о вещи вообще: _Me gusta **la** fruta._"
      - write:
          title: "¿Gusta o gustan?"
          format: gusta или gustan
          rule: gusta_gustan
          skill: gustar
          items:
            - "Me ___ el chocolate. => gusta"
            - q: "Me ___ las tapas."
              a: "gustan"
              mistakes: {"gusta": "Тапас много — **gustan**."}
            - "¿Te ___ viajar? => gusta"
            - q: "A mi padre le ___ los coches."
              a: "gustan"
              mistakes: {"gusta": "Нравятся машины — их много: **gustan**."}
            - "Nos ___ la paella. => gusta"
      - choose:
          title: Выберите
          skill: gustar_pron
          items:
            - q: "A mi madre ___ cocinar."
              options: "le gusta | la gusta | me gusta"
            - q: "Как спросить «Тебе нравится танцевать?»"
              options: "¿Te gusta bailar? | ¿Te gustan bailar? | ¿Tú gusta bailar?"
            - q: "Я люблю фрукты."
              options: "Me gusta la fruta. | Me gusta fruta. | Me gustan fruta."
              explain: "Перед существительным нужен артикль, даже когда речь о фруктах вообще: la fruta."

  - id: vocab2
    kind: vocab
    title: Спорт, кино, природа
    goal: рассказать, что вам нравится — спорт, кино, отдых
    version: 2
    vocab:
      - "🏅 el deporte [дэпо́ртэ] — спорт"
      - "⚽ el fútbol [фу́тболь] — футбол"
      - "🏀 el baloncesto [балонθэ́сто] — баскетбол"
      - "🎞 la película [пэли́кула] — фильм"
      - "📺 la serie [сэ́рьэ] — сериал"
      - "🏖 la playa [пла́я] — пляж; море (отдых)"
      - "⛰ la montaña [монта́нья] — гора; горы"
    blocks:
      - learn: [el deporte, el fútbol, el baloncesto]
      - choose:
          title: Что ответить?
          skill: gustar
          items:
            - lines: ["Diego: ¿Te gusta el fútbol?"]
              q: "Вам нравится футбол."
              options: "Sí, me gusta. | Sí, me gustan. | Sí, te gusta."
      - learn: [la película, la serie, la playa, la montaña]
      - culture: "**¿Playa o montaña?** — классика испанской беседы: где вы любите отдыхать, на море или в горах? А **el fútbol** в Испании почти религия 😉"
      - match:
          title: Соедините пары
          pairs:
            - "la película — фильм"
            - "la serie — сериал"
            - "la playa — пляж"
            - "la montaña — горы"
            - "el baloncesto — баскетбол"
      - write:
          title: Traduce
          format: фраза по-испански
          skill: gustar
          items:
            - q: "Мне нравится спорт."
              a: "Me gusta el deporte"
              mistakes: {"me gusta deporte": "Перед существительным нужен артикль: me gusta **el** deporte."}
            - q: "Мне нравятся сериалы."
              a: "Me gustan las series"
              mistakes: {"me gusta las series": "Сериалов много — **gustan**.", "me gustan series": "Перед существительным нужен артикль: **las** series."}
            - "Тебе нравятся горы? => ¿Te gusta la montaña? | ¿Te gustan las montañas?"

  - id: tambien
    kind: grammar
    title: "A mí también, a mí tampoco"
    goal: согласиться или не согласиться с собеседником
    version: 2
    vocab:
      - "❓ ¿Y a ti? [и а ти] — а тебе?"
      - "👍 a mí también [а ми тамбье́н] — мне тоже (нравится)"
      - "👎 tampoco [тампо́ко] — тоже не :: A mí tampoco. — Мне тоже нет."
      - "↔️ a mí sí / a mí no [а ми си, а ми но] — а мне да / а мне нет"
      - "😍 me encanta [мэ энка́нта] — мне очень нравится, обожаю {forms: encanta encantan}"
      - "🚫 no... nada [но... на́да] — совсем не; ничего :: No me gusta nada. — Мне совсем не нравится."
    blocks:
      - learn: ["¿Y a ti?", a mí también, tampoco, a mí sí / a mí no]
      - compare:
          id: tambien
          title: Мне тоже — а мне нет
          cards:
            - head: a mí también
              label: ему нравится — и вам
              tone: mint
              ex: ["Me gusta el cine. — A mí también."]
            - head: a mí tampoco
              label: ему не нравится — и вам нет
              tone: blue
              ex: ["No me gusta el fútbol. — A mí tampoco."]
            - head: a mí no
              label: ему нравится — а вам нет
              tone: rose
              ex: ["Me gusta la playa. — A mí no."]
            - head: a mí sí
              label: ему не нравится — а вам да
              tone: sun
              ex: ["No me gusta el queso. — A mí sí."]
      - choose:
          title: Что ответить?
          skill: agree
          items:
            - lines: ["Ana: Me gusta viajar. ¿Y a ti?"]
              q: "Вам тоже нравится."
              options: "A mí también. | A mí tampoco. | A mí sí."
            - lines: ["Ana: No me gustan los gatos."]
              q: "Вам тоже нет."
              options: "A mí tampoco. | A mí también. | A mí no."
              explain: "Согласие с отрицанием — tampoco: «мне тоже нет»."
            - lines: ["Ana: Me gusta bailar."]
              q: "А вам нет."
              options: "A mí no. | A mí tampoco. | A mí sí."
            - lines: ["Ana: No me gusta el té."]
              q: "А вам нравится."
              options: "A mí sí. | A mí también. | A mí no."
      - learn: [me encanta, no... nada]
      - table:
          id: scale
          title: От «обожаю» до «терпеть не могу»
          rows:
            - ["😍", "me encanta"]
            - ["😊", "me gusta mucho"]
            - ["🙂", "me gusta"]
            - ["😕", "no me gusta mucho"]
            - ["😖", "no me gusta nada"]
      - choose:
          title: Выберите
          skill: encanta
          items:
            - q: "😖 Футбол — это ужас!"
              options: "No me gusta nada el fútbol. | No me gusta mucho el fútbol. | Me encanta el fútbol."
      - write:
          title: Traduce
          format: фраза по-испански
          skill: encanta
          items:
            - q: "Обожаю шоколад."
              a: "Me encanta el chocolate"
              mistakes: {"me encanta chocolate": "Перед существительным нужен артикль: me encanta **el** chocolate."}

  - id: dialogo
    kind: dialogue
    title: ¿Qué te gusta hacer?
    goal: расспросить о хобби и рассказать о своих
    version: 2
    vocab:
      - "🛠 hacer [аθэ́р] — делать"
      - "❓ ¿Qué te gusta hacer? [кэ тэ гу́ста аθэ́р] — что ты любишь делать?"
      - "📅 el fin de semana [фин дэ сэма́на] — выходные {pl: los fines de semana}"
      - "⚽ jugar [хуга́р] — играть {forms: juego juegas juega} :: Juego al fútbol. — Я играю в футбол."
    blocks:
      - learn: [hacer, "¿Qué te gusta hacer?", el fin de semana, jugar]
      - "Лусия и Диего знакомятся на языковом обмене."
      - dialogue:
          id: lucia
          lines:
            - "Lucía: Diego, ¿qué te gusta hacer en tu tiempo libre? | Диего, что ты любишь делать в свободное время?"
            - "Diego: Me encanta el deporte. Juego al fútbol el fin de semana. ¿Y a ti? ¿Te gusta el fútbol? | Обожаю спорт. По выходным играю в футбол. А тебе? Нравится футбол?"
            - "Lucía: No, no me gusta nada. | Нет, совсем не нравится."
            - "Diego: ¿Y qué te gusta? | А что тебе нравится?"
            - "Lucía: Me gusta leer y ver películas. Y me encanta viajar. | Мне нравится читать и смотреть фильмы. И обожаю путешествовать."
            - "Diego: ¡A mí también! ¿Playa o montaña? | Мне тоже! Море или горы?"
            - "Lucía: Montaña. No me gusta la playa. | Горы. Я не люблю пляж."
            - "Diego: ¿No? A mí sí. ¡Me encanta nadar! | Нет? А я люблю. Обожаю плавать!"
      - note:
          id: jugar_al
          text: "**jugar al fútbol** — «играть в футбол»: после **jugar** — **a**, а **a** + **el** = **al**: _¿Juegas al baloncesto?_"
      - choose:
          title: Responde
          source: lucia
          rule: none
          items:
            - q: "¿Qué hace Diego el fin de semana?"
              options: "Juega al fútbol. | Ve películas. | Viaja."
            - q: "¿Qué le gusta a Lucía?"
              options: "Leer, ver películas y viajar. | El fútbol y la playa. | Nadar y bailar."
      - choose:
          title: Выберите
          free: true
          rule: jugar_al
          skill: hobbies
          items:
            - q: "Juego ___ fútbol."
              options: "al | el | a la"
      - mission:
          id: exchange
          title: Языковой обмен
          text: "Вы на встрече языкового обмена. Вы любите читать и плавать, обожаете горы и совсем не любите футбол. Диего расспрашивает вас."
      - choose:
          source: exchange
          items:
            - lines: ["Diego: ¿Qué te gusta hacer en tu tiempo libre?"]
              options: "Me gusta leer y nadar. | Me gustan leer y nadar. | Te gusta leer y nadar."
              explain: "Действия — gusta, даже если их два."
              skill: gustar
            - lines: ["Diego: Me encanta el fútbol. ¿Y a ti?"]
              options: "A mí no. No me gusta nada. | A mí también. | A mí tampoco."
              skill: agree
      - write:
          source: exchange
          skill: gustar
          items:
            - q: "Diego: ¿Playa o montaña?"
              a: "Montaña | La montaña | Me gusta la montaña | Me encanta la montaña"
              format: ответ по-испански
      - build:
          source: exchange
          skill: encanta
          items:
            - es: "No me gusta nada el fútbol."
              ru: "Скажите: «Мне совсем не нравится футбол»."
              extra: [gustan]

  - id: lectura
    kind: reading
    title: Анкета для языкового обмена
    goal: понять анкету и рассказать, что любит человек
    version: 2
    vocab:
      - "🔍 buscar [буска́р] — искать"
      - "🔄 el intercambio [интэрка́мбьо] — обмен; языковой обмен"
      - "🏋️ practicar [практика́р] — практиковать, тренировать"
      - "🧗 difícil [дифи́θиль] — трудный, сложный {pos: adj}"
      - "💡 la idea [идэ́а] — идея"
    blocks:
      - learn: [buscar, el intercambio, practicar, difícil, la idea]
      - "Марта ищет партнёра для языкового обмена."
      - reading:
          id: marta
          title: Busco intercambio
          text: |
            ¡Hola! Me llamo Marta y tengo diecinueve años. Soy de Granada, pero vivo en Barcelona. Estudio en la universidad.

            En mi tiempo libre me gusta mucho leer y viajar. Me encantan las películas y las series ucranianas. También me gusta bailar, pero no me gusta nada el fútbol.

            Hablo español e inglés y aprendo ucraniano. ¡El ucraniano es muy difícil! Busco un intercambio: yo practico ucraniano y tú practicas español. ¿Te gusta la idea?
          translation: |
            Привет! Меня зовут Марта, мне девятнадцать лет. Я из Гранады, но живу в Барселоне. Учусь в университете.

            В свободное время очень люблю читать и путешествовать. Обожаю украинские фильмы и сериалы. Ещё люблю танцевать, но совсем не люблю футбол.

            Говорю по-испански и по-английски, учу украинский. Украинский очень трудный! Ищу языковой обмен: я практикую украинский, а ты — испанский. Нравится идея?
      - choose:
          title: Responde
          source: marta
          items:
            - q: "¿De dónde es Marta?"
              options: "De Granada. | De Barcelona. | De Madrid."
            - q: "¿Qué busca Marta?"
              options: "Un intercambio. | Un piso. | Un trabajo."
            - q: "¿Cómo es el ucraniano para Marta?"
              options: "Muy difícil. | Muy bonito. | Muy aburrido."
            - q: "¿Qué practica Marta?"
              options: "Ucraniano. | Español. | Inglés."
            - q: "¿Qué pregunta Marta?"
              options: "¿Te gusta la idea? | ¿Te gusta el fútbol? | ¿De dónde eres?"
      - sort:
          title: Что Марта любит, а что нет?
          source: marta
          groups:
            "😊 le gusta": [leer, viajar, bailar, las series]
            "😖 no le gusta": [el fútbol]

  - id: quiz
    kind: quiz
    title: Мне нравится
    goal: рассказать о хобби, сказать, что нравится, и согласиться или не согласиться
    version: 2
    check: soft
    blocks:
      - "Тест по теме «Мне нравится»."
      - cando:
          - "рассказать о хобби: En mi tiempo libre leo, bailo..."
          - "сказать, что нравится: me gusta, me gustan, me encanta"
          - "согласиться или нет: a mí también, a mí tampoco, a mí sí, a mí no"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "bailar — танцевать"
            - "la playa — пляж"
            - "el fin de semana — выходные"
            - "a mí también — мне тоже"
            - "buscar — искать"
    quiz:
      - q: "Me ___ los perros."
        options: "gustan | gusta | gusto"
        skill: gustar
      - q: "A mi madre ___ gusta bailar."
        options: "le | la | me"
        skill: gustar_pron
      - q: "— No me gusta el café. — A mí ___"
        options: "tampoco | también | sí también"
        explain: "Если вы соглашаетесь с отрицательной фразой, то нужно сказать tampoco: «A mí tampoco» значит «мне тоже нет»."
        skill: agree
      - q: Как сказать «Обожаю путешествовать»?
        options: "Me encanta viajar. | Me encantan viajar. | Encanto viajar."
        skill: encanta
      - q: Как спросить «Что ты любишь делать?»
        options: "¿Qué te gusta hacer? | ¿Qué haces gusta? | ¿Qué te gustas hacer?"
        skill: hobbies
