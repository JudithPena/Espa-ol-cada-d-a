  - id: lectura
    kind: reading
    title: "Carta de Olga"
    goal: понять письмо о себе для работодателя и написать своё
    version: 2
    vocab:
      - "✉️ la carta de presentación [ка́рта дэ прэсэнтаθьо́н] — сопроводительное письмо :: Escribo una carta de presentación. — Я пишу сопроводительное письмо."
      - "🏥 el hospital infantil [оспита́ль инфанти́ль] — детская больница :: Trabajo en un hospital infantil. — Я работаю в детской больнице."
    blocks:
      - learn: [la carta de presentación, el hospital infantil]
      - "Ольга хочет перейти в детскую больницу и пишет сопроводительное письмо."
      - reading:
          id: carta_olga
          title: Carta de presentación
          text: |
            Me llamo Olga y soy enfermera. Estudié la carrera en la universidad de Odesa desde dos mil diez hasta dos mil catorce. Después trabajé durante cinco años en un hospital de Odesa.

            En dos mil diecinueve dejé de trabajar allí y vine a España. Primero hice un curso de español y aprobé el examen. Desde dos mil veinte trabajo en un hospital de Valencia, en el turno de mañana.

            Sigo estudiando español por las tardes. Soy responsable y me gusta mucho trabajar con niños: por eso me gustaría trabajar en su hospital infantil. Hablo ucraniano, inglés y español.
          translation: |
            Меня зовут Ольга, я медсестра. Я училась в университете Одессы с две тысячи десятого по две тысячи четырнадцатый год. Потом пять лет работала в больнице в Одессе.

            В две тысячи девятнадцатом я ушла оттуда и приехала в Испанию. Сначала прошла курс испанского и сдала экзамен. С две тысячи двадцатого года работаю в больнице в Валенсии, в утреннюю смену.

            По вечерам продолжаю учить испанский. Я ответственная и очень люблю работать с детьми, поэтому хотела бы работать в вашей детской больнице. Говорю по-украински, по-английски и по-испански.
      - choose:
          title: Что пишет Ольга?
          source: carta_olga
          items:
            - q: "¿Cuántos años trabajó Olga en Odesa?"
              options: "Cinco años. | Cuatro años. | Dos años."
              explain: "Después trabajé durante cinco años en un hospital de Odesa."
              skill: plazos
            - q: "¿Qué hizo primero en España?"
              options: "Un curso de español. | Un curso de enfermera. | Trabajar en un hotel."
              explain: "Primero hice un curso de español y aprobé el examen."
            - q: "¿Desde cuándo trabaja en Valencia?"
              options: "Desde dos mil veinte. | Desde dos mil diecinueve. | Desde dos mil catorce."
              explain: "Desde dos mil veinte trabajo en un hospital de Valencia."
              skill: plazos
            - q: "¿Por qué quiere trabajar en el hospital infantil?"
              options: "Porque le gusta trabajar con niños. | Porque el sueldo es mejor. | Porque está cerca de su casa."
              explain: "…me gusta mucho trabajar con niños: por eso me gustaría trabajar en su hospital infantil."
      - sort:
          title: Тогда или сейчас?
          source: carta_olga
          skill: perifrasis
          groups:
            "тогда": ["estudió en Odesa", "trabajó cinco años en Odesa", "hizo un curso de español"]
            "сейчас": ["trabaja en Valencia", "sigue estudiando español"]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: carta_olga
          items:
            - q: "¿En qué turno trabaja Olga ahora?"
              a: "En el turno de mañana | De mañana | En el de mañana"
              explain: "…en el turno de mañana."
            - q: "Как в письме сказано «Я всё ещё учу испанский»?"
              a: "Sigo estudiando español"
              explain: "Seguir + герундий."
              skill: perifrasis
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "En dos mil diecinueve dejé de trabajar allí y vine a España."
              options: "В 2019 году я ушла с той работы и приехала в Испанию. | В 2019 году я начала работать в Испании. | Я продолжаю работать там с 2019 года."
              explain: "Dejé de trabajar — «перестала работать»; vine — «приехала»."
              skill: perifrasis
              noaudio: {q: "Что значит «En dos mil diecinueve dejé de trabajar allí y vine a España»?", options: "В 2019 году я ушла с той работы и приехала в Испанию. | В 2019 году я начала работать в Испании. | Я продолжаю работать там с 2019 года."}
      - compose:
          title: Ваше письмо
          free: true
          rule: none
          skill: [plazos, perifrasis, experiencia_trabajo]
          items:
            - q: "Напишите короткое сопроводительное письмо, 50–90 слов: кто вы, где учились, где и когда работали, что делаете сейчас и почему хотите эту работу."
              format: "Me llamo… Estudié… Desde… hasta… trabajé… Ahora… Me gustaría…"
              words: [40, 120]
              sentences: 4
              checks:
                - label: "учёба: estudié…, la carrera, un curso…"
                  any: [estudié, la carrera, un curso, el instituto]
                - label: "опыт и сроки: trabajé…, desde…, durante…"
                  any: [trabajé, desde, durante]
                - label: "сейчас: trabajo…, sigo…"
                  any: [trabajo, sigo, ahora]
                - label: "почему: me gustaría…, porque…"
                  any: [me gustaría, porque, por eso]
              sample: "Me llamo Pablo y soy cocinero. Estudié en una escuela de cocina en Madrid desde 2012 hasta 2014. Después trabajé durante cuatro años en un hotel de Málaga. Desde 2019 trabajo en un restaurante del centro y sigo haciendo cursos de cocina. Soy responsable y me gusta aprender: por eso me gustaría trabajar en su restaurante."
              sample_ru: "Меня зовут Пабло, я повар. Учился в кулинарной школе в Мадриде с 2012 по 2014 год. Потом четыре года работал в гостинице в Малаге. С 2019 года работаю в ресторане в центре и продолжаю проходить кулинарные курсы. Я ответственный и люблю учиться, поэтому хотел бы работать в вашем ресторане."

  - id: mision
    kind: practice
    title: Собеседование
    goal: понять объявление о работе и пройти собеседование
    version: 2
    forms: [hacerle]
    blocks:
      - review:
          title: Вспомним
          skills: [superlativo, sin_nombre, posesivos]
          n: 2
      - "Вы слушаете голосовое сообщение из языковой школы. Послушайте: текста нет."
      - dialogue:
          id: oferta_trabajo
          hidden: true
          title: Сообщение из школы
          lines:
            - "Secretaria: Hola, le llamo de la escuela de idiomas. Hemos leído su currículum y nos gustaría hacerle una entrevista. ¿Puede venir el jueves a las once? Es un trabajo de lunes a viernes, de cuatro a ocho de la tarde. | Здравствуйте, звоню из языковой школы. Мы прочитали ваше резюме и хотели бы пригласить вас на собеседование. Можете прийти в четверг в одиннадцать? Работа с понедельника по пятницу, с четырёх до восьми вечера."
      - choose:
          title: Что в сообщении?
          source: oferta_trabajo
          items:
            - q: "¿Para qué llaman?"
              options: "Para hacerle una entrevista. | Para cancelar una entrevista. | Para hablar del sueldo."
              explain: "…nos gustaría hacerle una entrevista."
            - q: "¿Cuándo es la entrevista?"
              options: "El jueves a las once. | El lunes a las cuatro. | El viernes a las ocho."
              explain: "¿Puede venir el jueves a las once?"
            - q: "¿Cuál es el horario del trabajo?"
              options: "De lunes a viernes, de cuatro a ocho. | De lunes a jueves, de once a cuatro. | Los fines de semana, por la tarde."
              explain: "Es un trabajo de lunes a viernes, de cuatro a ocho de la tarde."
              skill: plazos
      - mission:
          id: entrevista_escuela
          title: Собеседование
          text: "Четверг, одиннадцать часов. Вы на собеседовании в языковой школе. Отвечайте о себе."
      - chat:
          id: entrevista_chat
          title: Собеседование
          with: Carmen
          turns:
            - say: "Buenos días. Hemos leído su currículum. ¿Qué estudió? | Доброе утро. Мы прочитали ваше резюме. Что вы изучали?"
              task: "Ответьте от себя: что и где вы изучали."
              skill: estudios
              compose:
                format: "Estudié… en…"
                words: [3, 25]
                checks:
                  - label: "estudié…, la carrera, un curso…"
                    any: [estudié, la carrera, un curso, el instituto, la universidad]
                sample: "Estudié la carrera de Historia en la universidad de Kiev."
                sample_ru: "Я окончил исторический факультет Киевского университета."
            - say: "¿Y tiene experiencia como profesor? | А у вас есть опыт преподавания?"
              task: "Скажите: да, три года работали в школе, с 2018 по 2021 год."
              skill: plazos
              write: "Sí, trabajé tres años en una escuela, desde 2018 hasta 2021 | Sí, trabajé en una escuela desde 2018 hasta 2021 | Sí, durante tres años trabajé en una escuela"
              format: опыт
              mistakes:
                "sí trabajo tres años en una escuela desde 2018 hasta 2021": "Срок закончен — **trabajé**."
            - say: "¿Y qué hace ahora? | А чем вы занимаетесь сейчас?"
              task: "Ответьте от себя: что вы делаете сейчас (с seguir или desde)."
              skill: perifrasis
              compose:
                format: "Ahora sigo… / Desde… trabajo…"
                words: [3, 30]
                checks:
                  - label: "сейчас: sigo…, desde…, trabajo…"
                    any: [sigo, sigue, desde, trabajo, estudio, ahora]
                sample: "Ahora sigo estudiando español y trabajo en una tienda por la mañana."
                sample_ru: "Сейчас продолжаю учить испанский и по утрам работаю в магазине."
            - say: "El trabajo es de cuatro a ocho. ¿Le viene bien? | Работа с четырёх до восьми. Вам удобно?"
              task: "Ответьте: да, удобно."
              skill: quedar_cita
              choose: "Sí, me viene muy bien. | Sí, me vengo muy bien. | Sí, le viene muy bien."
              explain: "Мне удобно — me viene bien."
            - say: "¿Cuándo puede empezar? | Когда вы можете начать?"
              task: "Скажите, что можете начать в понедельник."
              skill: perifrasis
              write: "Puedo empezar el lunes | (Puedo empezar) el lunes que viene | El lunes"
              format: когда
            - say: "Perfecto. Le llamamos esta semana. ¡Muchas gracias! | Отлично. Позвоним вам на этой неделе. Большое спасибо!"
      - compose:
          title: Резюме
          free: true
          rule: none
          skill: [plazos, estudios, perifrasis]
          items:
            - q: "Напишите короткое резюме в три части: Estudios (что и когда вы изучали), Experiencia (где работали, с какого по какое время), Idiomas (какие языки знаете)."
              format: "Estudios: … Experiencia: desde… hasta… Idiomas: …"
              words: [20, 90]
              checks:
                - label: "Estudios"
                  any: [estudios, estudié, la carrera, el instituto, curso]
                - label: "Experiencia: desde… hasta…"
                  any: [experiencia, desde, hasta, durante]
                - label: "Idiomas"
                  any: [idiomas, hablo, inglés, español, ucraniano]
              sample: "Estudios: carrera de Historia, universidad de Kiev (2008–2013). Curso de español en Madrid (2022). Experiencia: profesor de historia en un instituto de Kiev, desde 2013 hasta 2021. Desde 2022: dependiente en una tienda de ropa en Madrid. Idiomas: ucraniano, inglés y español."
              sample_ru: "Образование: исторический факультет, Киевский университет (2008–2013). Курс испанского в Мадриде (2022). Опыт: учитель истории в школе в Киеве, с 2013 по 2021 год. С 2022 года — продавец в магазине одежды в Мадриде. Языки: украинский, английский и испанский."

