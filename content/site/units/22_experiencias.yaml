id: experiencias
number: 22
level: A1
title: Что вы сделали сегодня?
goals:
  - рассказать, что вы сделали сегодня и на этой неделе
  - спросить о жизненном опыте: «Ты когда-нибудь…?»
  - образовывать причастия: hablado, comido, vivido

lessons:
  - id: perfecto
    kind: grammar
    title: "He comido: прошедшее время"
    goal: рассказать, что вы сделали сегодня — he comido, he visto
    version: 3
    unlocks: [participle]
    vocab:
      - "🔧 haber [абэ́р] — вспомогательный глагол (иметь)"
      - "🌅 esta mañana [э́ста манья́на] — сегодня утром"
      - "🗓 esta semana [э́ста сэма́на] — на этой неделе"
      - "✅ ya [йа] — уже :: Ya he comido. — Я уже поел."
      - "⏳ todavía no [тодаби́а но] — ещё не :: Todavía no he comido. — Я ещё не ел."
    blocks:
      - learn: [haber, esta mañana, esta semana]
      - "Первое прошедшее время! Из каких двух слов состоит глагол в каждой фразе?"
      - examples:
          items:
            - "Hoy he trabajado mucho. — Сегодня я много работал."
            - "¿Has comido? — Ты поел?"
            - "Esta semana hemos visto dos películas. — На этой неделе мы посмотрели два фильма."
      - conjugation:
          verb: haber
          ru: вспомогательный глагол
          highlight: false
          forms: [he, has, ha, hemos, habéis, han]
      - compare:
          id: perfect
          title: haber + причастие
          lead: 'Сначала **haber** в нужной форме, за ним причастие. Причастие не меняется ни по лицам, ни по роду: _he comido, has comido, hemos comido_.'
          cards:
            - head: -ar → -ado
              say: false
              label: hablar → hablado
              tone: blue
              ex: ["He trabajado.", "Has desayunado."]
            - head: -er, -ir → -ido
              say: false
              label: comer → comido
              tone: sun
              ex: ["Ha comido.", "Hemos vivido en Madrid."]
          note: "Это время — о том, что произошло **в период, который ещё не закончился**: _hoy, esta mañana, esta semana, este año_."
      - write:
          title: Образуйте причастие
          format: причастие
          rule: perfect
          skill: participle
          items:
            - "trabajar => trabajado"
            - {q: "comer", a: "comido", mistakes: {"comado": "-er → **-ido**: comido."}}
            - {q: "vivir", a: "vivido", mistakes: {"vivado": "-ir → **-ido**: vivido."}}
      - write:
          title: haber + причастие
          format: haber + причастие
          rule: perfect
          skill: perfect
          items:
            - q: "Hoy (yo) ___ (estudiar) mucho."
              a: "he estudiado"
              mistakes: {"ha estudiado": "ha — «он, она». «Я» — **he** estudiado.", "estudiado": "Нужен и haber: **he** estudiado."}
            - q: "Esta semana nosotros ___ (comer) en casa."
              a: "hemos comido"
              mistakes: {"hemos comiendo": "Нужно причастие: hemos **comido**."}
            - "Esta mañana (yo) ___ (desayunar) en un bar. => he desayunado"
      - header: Неправильные причастия
      - table:
          id: irregular
          title: Неправильные причастия
          rows:
            - ["hacer", "**hecho**"]
            - ["ver", "**visto**"]
            - ["escribir", "**escrito**"]
            - ["volver", "**vuelto**"]
            - ["abrir", "**abierto**"]
      - "Эти пять причастий — не по правилу: _¿Qué has hecho hoy?_ _Hemos visto una película._ _Ana ha escrito un texto._ _Pablo ha vuelto a casa._ _¿Has abierto la ventana?_"
      - write:
          title: Образуйте причастие
          format: причастие
          skill: participle
          items:
            - {q: "hacer", a: "hecho", mistakes: {"hacido": "hacer — неправильное: **hecho**."}}
            - {q: "ver", a: "visto", mistakes: {"vido": "ver — неправильное: **visto**."}}
            - {q: "escribir", a: "escrito", mistakes: {"escribido": "escribir — неправильное: **escrito**."}}
            - {q: "volver", a: "vuelto", mistakes: {"volvido": "volver — неправильное: **vuelto**."}}
      - learn: [ya, todavía no]
      - note:
          id: nada_entre
          text: "Между **haber** и причастием ничего не ставят: **no**, **ya**, **todavía no** и возвратные местоимения — перед **haber**: _Ya he hecho la tarea._ _Todavía no hemos visto la película._ _Hoy me he levantado a las siete._"
      - more:
          title: 🌎 А в Латинской Америке?
          text: "Даже о сегодняшнем там чаще говорят другим прошедшим временем, которое изучают на A2: вместо _Hoy he trabajado mucho_ — `Hoy trabajé mucho`. Но время с **haber** там тоже все понимают."

      - choose:
          title: Как сказать?
          skill: perfect
          items:
            - q: "Я ещё не ел."
              options: "Todavía no he comido. | He todavía no comido. | No he todavía comido."
            - q: "Мы уже видели этот фильм."
              options: "Ya hemos visto esta película. | Hemos ya visto esta película. | Ya hemos vido esta película."
            - q: "Сегодня я встал в семь."
              options: "Hoy me he levantado a las siete. | Hoy he me levantado a las siete. | Hoy he levantado me a las siete."
      - choose:
          title: Послушайте и выберите
          skill: perfect
          items:
            - say: "Esta mañana he comido fruta."
              options: "Сегодня утром я ел фрукты. | Сегодня утром я ем фрукты. | Сегодня вечером я ел фрукты."
              noaudio: {q: "Что значит «Esta mañana he comido fruta.»?", options: "Сегодня утром я ел фрукты. | Сегодня утром я ем фрукты. | Сегодня вечером я ел фрукты."}
            - say: "Todavía no he visto la película."
              options: "Я ещё не посмотрел фильм. | Я уже посмотрел фильм. | Я никогда не смотрел фильмы."
              noaudio: {q: "Что значит «Todavía no he visto la película.»?", options: "Я ещё не посмотрел фильм. | Я уже посмотрел фильм. | Я никогда не смотрел фильмы."}
  - id: experiencia
    kind: grammar
    title: ¿Has estado en España?
    goal: спросить о жизненном опыте и ответить — «да, два раза», «нет, никогда»
    version: 3
    vocab:
      - "❓ alguna vez [алгу́на бэθ] — когда-нибудь :: ¿Has estado alguna vez en España? — Ты когда-нибудь был в Испании?"
      - "🔁 una vez / muchas veces [у́на бэθ, му́час бэ́θэс] — один раз / много раз"
      - "😋 probar [проба́р] — пробовать :: ¿Has probado la paella? — Ты пробовал паэлью?"
      - "🌊 el mar [мар] — море"
    blocks:
      - learn: [alguna vez, una vez / muchas veces]
      - "Как спросить «Ты когда-нибудь…?» и ответить «да, два раза» или «нет, никогда»?"
      - compare:
          id: alguna_vez
          cards:
            - head: ¿… alguna vez…?
              label: вопрос об опыте
              tone: blue
              ex: ["¿Has estado alguna vez en Sevilla?"]
            - head: una vez, dos veces
              label: да — сколько раз
              tone: mint
              ex: ["Sí, una vez.", "Sí, muchas veces."]
            - head: nunca
              label: нет, никогда
              tone: rose
              ex: ["No, nunca.", "Nunca he estado en Cancún."]
      - learn: [probar, el mar]
      - note:
          id: he_estado
          text: "«Я был в…» о поездках — **he estado en**, с **estar**: _He estado en Madrid._ _Carmen ha estado en París._"
      - choose:
          title: Как сказать?
          skill: experience
          items:
            - q: "Я был в Мадриде."
              options: "He estado en Madrid. | He sido en Madrid. | Estoy en Madrid."
            - lines: ["Diego: ¿Has probado alguna vez la paella?"]
              q: "Вы пробовали её много раз."
              options: "Sí, muchas veces. | Sí, mucho veces. | No, nunca."
              rule: alguna_vez
      - write:
          title: Traduce
          format: фраза по-испански
          rule: alguna_vez
          skill: experience
          items:
            - q: "Я никогда не пробовал паэлью."
              a: "Nunca he probado la paella | No he probado [nunca la paella/la paella nunca]"
              mistakes: {"no he nunca probado la paella": "Между haber и причастием ничего не ставят: **nunca he probado**."}
            - q: "Мы видели этот фильм три раза."
              a: "Hemos visto la película tres veces | Hemos visto esta película tres veces"
              mistakes: {"hemos visto la película tres vez": "Много раз — **veces**: tres veces.", "hemos vido la película tres veces": "ver — неправильное: **visto**."}
      - mission:
          id: interview
          title: Интервью о путешествиях
          text: "Ана пишет статью о путешествиях и расспрашивает вас. Вы были в Испании один раз, пробовали хамон много раз, а море никогда не видели."
      - choose:
          source: interview
          skill: experience
          items:
            - lines: ["Ana: ¿Has estado alguna vez en España?"]
              options: "Sí, una vez. | Sí, muchas veces. | No, nunca."
            - lines: ["Ana: ¿Has probado el jamón?"]
              options: "Sí, muchas veces. | No, nunca. | Sí, una vez."
      - write:
          source: interview
          skill: experience
          items:
            - q: "Ana: ¿Has visto el mar?"
              a: "No, nunca | No, nunca he visto el mar | Nunca he visto el mar | No, nunca lo he visto"
              format: ответ по-испански
      - build:
          source: interview
          skill: perfect
          items:
            - es: "Este año he estudiado mucho español."
              ru: "Ana: ¿Y el español? — «В этом году я много занимался испанским»."
              extra: [estudiando]
      - choose:
          title: Послушайте и выберите
          free: true
          skill: experience
          items:
            - say: "¿Has estado alguna vez en España?"
              options: "Ты когда-нибудь был в Испании? | Ты был в Испании вчера? | Ты хочешь поехать в Испанию?"
              noaudio: {q: "Что значит «¿Has estado alguna vez en España?»?", options: "Ты когда-нибудь был в Испании? | Ты был в Испании вчера? | Ты хочешь поехать в Испанию?"}
            - say: "He probado la paella muchas veces."
              options: "Я много раз пробовал паэлью. | Я один раз пробовал паэлью. | Я никогда не пробовал паэлью."
              noaudio: {q: "Что значит «He probado la paella muchas veces.»?", options: "Я много раз пробовал паэлью. | Я один раз пробовал паэлью. | Я никогда не пробовал паэлью."}

  - id: lectura
    kind: reading
    title: Мой год с испанским
    goal: понять текст о том, чему научился человек, и что он собирается делать
    version: 3
    vocab:
      - "🥇 primer [примэ́р] — первый (перед сущ. м. р.) :: mi primer año — мой первый год"
      - "💡 entender [энтэндэ́р] — понимать (`e → ie`) :: Ya entiendo mucho. — Я уже многое понимаю."
    blocks:
      - learn: [primer, entender]
      - "Этот текст — про вас. Всё, о чём в нём говорится, вы уже умеете."
      - reading:
          id: my_year
          title: Mi primer año con el español
          text: |
            Este año he aprendido mucho. He estudiado español casi todos los días: he leído textos, he escuchado música en español y he hecho muchas tareas. Los fines de semana hago un repaso del vocabulario. En clase escribo las respuestas en español y casi nunca necesito la traducción.

            He aprendido a hablar de muchos temas: de mi familia, de mi casa y de mi ciudad. Ya puedo pedir un café en un bar, comprar ropa en una tienda y preguntar dónde está la estación. En la tienda entiendo palabras como «la talla» o «el probador».

            Todavía no hablo muy bien, pero ya entiendo mucho. ¡Y el español me encanta!

            El año que viene voy a viajar a España. Voy a hablar con la gente, voy a probar las tapas y voy a visitar muchas ciudades.
          translation: |
            В этом году я многому научился. Я занимался испанским почти каждый день: читал тексты, слушал музыку на испанском и сделал много заданий. По выходным повторяю лексику. На занятиях пишу ответы по-испански, и перевод мне почти никогда не нужен.

            Я научился говорить на многие темы: о семье, о доме и о городе. Я уже могу заказать кофе в баре, купить одежду в магазине и спросить, где вокзал. В магазине понимаю такие слова, как «размер» или «примерочная».

            Я ещё не очень хорошо говорю, но понимаю уже много. И я обожаю испанский!

            В следующем году я поеду в Испанию. Буду разговаривать с людьми, попробую тапас и посещу много городов.
      - more:
          title: preguntar, entender
          text: "**preguntar** — «спрашивать», спрягается как hablar: _Quiero preguntar dónde está el museo._ **entender** — «понимать», `e` → `ie`, как querer: _¿Me entiendes?_ Вы знаете его по фразе _No entiendo_."
      - choose:
          title: Responde
          source: my_year
          rule: none
          items:
            - q: "¿Es su primer año con el español?"
              options: "Sí, es su primer año. | No, es su segundo año. | No, estudia español en la universidad."
            - q: "¿Qué puede hacer ya?"
              options: "Pedir un café, comprar ropa, preguntar dónde está la estación. | Hablar muy bien y entender todo. | Nada: todavía no entiende."
            - q: "¿Qué va a hacer el año que viene?"
              options: "Va a viajar a España. | Va a estudiar inglés. | Va a vivir en México."
      - sort:
          title: Уже сделал или только собирается?
          source: my_year
          rule: none
          groups:
            "✅ ya ha…": [estudiado español, leído textos, escuchado música]
            "🔜 va a…": [viajar a España, probar las tapas]
      - choose:
          title: Послушайте и выберите
          free: true
          skill: perfect
          items:
            - say: "Este año he aprendido mucho."
              options: "В этом году я многому научился. | В прошлом году я многому научился. | В этом году я мало учился."
              noaudio: {q: "Что значит «Este año he aprendido mucho.»?", options: "В этом году я многому научился. | В прошлом году я многому научился. | В этом году я мало учился."}
            - say: "Ahora entiendo casi todo."
              options: "Теперь я понимаю почти всё. | Теперь я понимаю мало. | Теперь я всё говорю."
              noaudio: {q: "Что значит «Ahora entiendo casi todo.»?", options: "Теперь я понимаю почти всё. | Теперь я понимаю мало. | Теперь я всё говорю."}
    forms: [preguntar]
    quiz:
      - q: ¿Habla muy bien español?
        options: "Todavía no, pero entiende mucho. | Sí, habla muy bien. | No entiende nada."
        source: my_year
      - q: ¿Adónde va a viajar el año que viene?
        options: "a España | a México | a Argentina"
        source: my_year

  - id: quiz
    kind: quiz
    title: Прошедшее время
    goal: рассказать, что вы сделали сегодня, спросить об опыте и образовать причастия
    version: 3
    check: soft
    blocks:
      - "Это тест по теме «Что вы сделали сегодня?»."
      - cando:
          - "рассказать, что вы сделали сегодня: _He trabajado, he comido, he visto una película..._"
          - "спросить о жизненном опыте и ответить: _¿Has estado alguna vez en Sevilla? Sí, dos veces. No, nunca._"
          - "образовывать причастия, в том числе неправильные: hecho, visto, escrito, vuelto, abierto"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "esta semana — на этой неделе"
            - "ya — уже"
            - "probar — пробовать"
            - "el mar — море"
            - "entender — понимать"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          items:
            - q: "Скажите: «Я уже позавтракал»"
              a: "Ya he desayunado | (Yo) ya he desayunado | He desayunado ya"
              skill: perfect
              mistakes: {"ya desayune": "Сегодняшнее — **he desayunado** (haber + причастие)."}
            - q: "Спросите: «Ты когда-нибудь был в Мадриде?»"
              a: "¿Has estado alguna vez en Madrid? | ¿Alguna vez has estado en Madrid? | ¿Has estado en Madrid alguna vez?"
              skill: experience
    quiz:
      - q: "Hoy ___ mucho. (я работал)"
        options: "he trabajado | ha trabajado | he trabajando"
        skill: perfect
      - q: Причастие от «hacer»
        options: "hecho | hacido | hacedo"
        skill: participle
      - q: "¿___ visto la película? (ты)"
        options: "Has | Ha | He"
        skill: perfect
      - q: Как сказать «Я никогда не был в Мексике»?
        options: "Nunca he estado en México. | Nunca estoy en México. | Nunca he sido México."
        skill: experience
      - q: "Todavía no ___ (yo, comer)."
        options: "he comido | he comiendo | como"
        skill: perfect
