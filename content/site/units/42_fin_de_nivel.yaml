  - id: fin
    kind: finale
    title: "¡Enhorabuena! Уровень A2"
    goal: увидеть, чему вы научились на уровне A2, и выбрать, что делать дальше
    version: 2
    vocab:
      - "🏆 ¡Lo has conseguido! [ло ас консэги́до] — у тебя получилось! ты добился своего!"
      - "💪 ¡Sigue así! [си́гэ аси́] — так держать! продолжай в том же духе!"
    blocks:
      - "**¡Enhorabuena!** Вы прошли уровень **A2**: девятнадцать тем, больше ста сорока уроков и почти пятьсот новых слов и выражений. Теперь вы умеете рассказывать о прошлом, сравнивать, советовать и договариваться."
      - learn: ["¡Lo has conseguido!", "¡Sigue así!"]
      - cando:
          - "рассказать о прошлом — что сделали, как было раньше и что случилось: _Ayer fui al médico. De niña vivía en Kiev. Mientras paseaba, empezó a llover._"
          - "сравнить людей, места и времена: _Antes había menos coches que ahora._"
          - "договориться о встрече, предложить и вежливо отказаться: _¿Quedamos el viernes? El jueves no puedo, es que tengo clase._"
          - "дать совет и инструкцию, объяснить дорогу: _Deberías descansar. Gire a la derecha._"
          - "объясниться у врача и в аптеке, вернуть покупку: _Me encuentro mal. Quería cambiar esta camisa._"
          - "рассказать о работе, учёбе, планах и мечтах: _Pienso estudiar en España. Me gustaría vivir cerca del mar._"
          - "рассказать о своей стране и понять, чем испанский Испании отличается от мексиканского: _En México se dice «carro»._"
      - header:
          slide: new
          text: Что дальше?
      - list:
          - "🔁 **Повторяйте**: во вкладке «Повторить» — слова и «Фразы и конструкции» уровней A0–A2."
          - "📚 **Читайте**: адаптированные книги уровня A2 и «Разбор книг» на главной."
          - "🎬 **Смотрите и слушайте**: сериалы и видео с испанскими субтитрами; на главной есть «Разбор видео»."
          - "💬 **Говорите**: в языковом обмене вы уже можете рассказать о себе, о прошлом и о планах."
          - "📝 **Проверьте уровень**: Институт Сервантеса проводит международный экзамен DELE A2. Этот курс — хорошая подготовка, но сам по себе он сертификата не даёт."
          - "🚀 **Дальше — B1**: сослагательное наклонение, будущее время, связный рассказ и письма."
