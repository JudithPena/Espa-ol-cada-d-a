          text: |
            ¡Hola, Irina! ¿Qué tal por Madrid? Yo estoy muy cansada: esta semana he trabajado muchísimo en el hospital.

            El sábado que viene es mi cumpleaños y voy a hacer una cena en casa. Si podéis venir, Diego y tú podéis dormir aquí: mi piso nuevo es más grande que el antiguo. Li va a cocinar: ¡cocina mejor que nadie!

            Otra cosa: necesito el libro que te dejé para un examen. ¿Me lo puedes devolver?

            Un beso,
            Olga
          translation: |
            Привет, Ирина! Как там в Мадриде? А я очень устала: на этой неделе ужасно много работала в больнице.

            В следующую субботу у меня день рождения, и я устраиваю ужин дома. Если сможете приехать, вы с Диего можете переночевать у меня: моя новая квартира больше старой. Готовить будет Ли — он готовит лучше всех!

            И ещё: мне нужна для экзамена книга, которую я тебе давала. Можешь мне её вернуть?

            Целую,
            Ольга
