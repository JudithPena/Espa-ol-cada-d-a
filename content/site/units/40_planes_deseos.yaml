  - id: lectura
    kind: reading
    title: "Las doce uvas"
    goal: понять текст о новогодней традиции
    version: 2
    vocab:
      - "🔔 la campanada [кампана́да] — удар колокола, часов :: Se oyen las doce campanadas. — Слышны двенадцать ударов часов."
      - "🕛 la medianoche [мэдьяно́чэ] — полночь :: A medianoche comemos las uvas. — В полночь мы едим виноград."
      - "📜 la tradición [традиθьо́н] — традиция :: Es una tradición muy antigua. — Это очень старая традиция."
    blocks:
      - learn: [la campanada, la medianoche, la tradición]
      - "Текст из учебного журнала об одной новогодней традиции."
      - reading:
          id: uvas
          title: Las doce uvas
          text: |
            En España, la última noche del año se llama Nochevieja. Mucha gente la pasa en casa con la familia y ve en la tele la Puerta del Sol de Madrid.

            A medianoche se oyen las doce campanadas del reloj de la Puerta del Sol. Con cada campanada, la gente come una uva. Si comes las doce a tiempo, vas a tener suerte todo el año. ¡Pero no es fácil: hay que comer muy rápido!

            Es una tradición de hace más de cien años. Después de las uvas, todos dicen «¡Feliz Año Nuevo!», y muchos jóvenes salen de fiesta hasta la mañana.
          translation: |
            В Испании последняя ночь года называется Nochevieja. Многие проводят её дома с семьёй и смотрят по телевизору площадь Пуэрта-дель-Соль в Мадриде.

            В полночь часы на Пуэрта-дель-Соль бьют двенадцать раз. С каждым ударом люди съедают по виноградине. Если успеешь съесть все двенадцать, весь год будет удачным. Но это непросто: есть нужно очень быстро!

            Этой традиции больше ста лет. После винограда все говорят «С Новым годом!», а многие молодые люди идут гулять до утра.
      - choose:
          title: Что сказано в тексте?
          source: uvas
          items:
            - q: "¿Dónde pasa mucha gente la Nochevieja?"
              options: "En casa, con la familia. | En la Puerta del Sol. | En un restaurante."
              explain: "Mucha gente la pasa en casa con la familia…"
            - q: "¿Qué pasa si comes las doce uvas a tiempo?"
              options: "Vas a tener suerte todo el año. | Vas a comer muy rápido. | Vas a salir de fiesta."
              explain: "Si comes las doce a tiempo, vas a tener suerte todo el año."
              skill: si_presente
            - q: "¿Cuántos años tiene la tradición?"
              options: "Más de cien. | Unos veinte. | Más de mil."
              explain: "Es una tradición de hace más de cien años."
            - q: "¿Qué hacen muchos jóvenes después?"
              options: "Salen de fiesta hasta la mañana. | Duermen. | Comen más uvas."
              explain: "…muchos jóvenes salen de fiesta hasta la mañana."
              skill: fiestas
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: uvas
          items:
            - q: "¿Cuántas campanadas se oyen a medianoche?"
              a: "Doce | Doce campanadas | Se oyen doce campanadas"
              explain: "A medianoche se oyen las doce campanadas."
            - q: "¿Qué dice la gente después de las uvas?"
              a: "¡Feliz Año Nuevo! | Feliz Año Nuevo"
              explain: "…todos dicen «¡Feliz Año Nuevo!»."
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "Si comes las doce uvas a tiempo, vas a tener suerte."
              options: "Если успеешь съесть двенадцать виноградин, тебе повезёт. | Если ешь виноград медленно, тебе повезёт. | Двенадцать виноградин едят, чтобы не опоздать."
              explain: "Si comes… vas a tener suerte — «если съешь…, тебе повезёт»."
              skill: si_presente
              noaudio: {q: "Что значит «Si comes las doce uvas a tiempo, vas a tener suerte»?", options: "Если успеешь съесть двенадцать виноградин, тебе повезёт. | Если ешь виноград медленно, тебе повезёт. | Двенадцать виноградин едят, чтобы не опоздать."}
      - compose:
          title: Ваша традиция
          free: true
          rule: none
          skill: [fiestas, si_presente]
          items:
            - q: "Расскажите о новогодней или праздничной традиции вашей страны: что делают и что, по поверью, будет, если…"
              format: "En mi país, en Nochevieja… Si…, vas a…"
              words: [15, 70]
              sentences: 2
              checks:
                - label: "традиция: en Nochevieja, en Navidad, la gente…"
                  any: [nochevieja, navidad, año nuevo, la gente, tradición, celebramos]
                - label: "si + настоящее"
                  re: "\\bsi \\w+"
              sample: "En mi país, en Nochevieja la gente cena mucho y a las doce todos abren los regalos. Si llevas ropa nueva esa noche, vas a tener un buen año."
              sample_ru: "В моей стране в новогоднюю ночь много едят, а в полночь все открывают подарки. Если надеть в эту ночь что-то новое, год будет хорошим."

  - id: mision
    kind: practice
    title: План отпуска
    goal: договориться о поездке и написать план отпуска
    version: 2
    forms: [resérvalo]
    blocks:
      - review:
          title: Вспомним
          skills: [caracter, ser_estar_adj, caer_parecer]
          n: 2
      - "Ольга прислала голосовое сообщение. Послушайте: текста нет."
      - dialogue:
          id: audio_olga
          hidden: true
          title: Сообщение от Ольги
          lines:
            - "Olga: ¡Hola, Irina! He encontrado un hotel en Mallorca: cincuenta euros la noche, muy cerca de la playa. Yo prefiero ir del diez al diecisiete de julio. Si te parece bien, lo reservo hoy. ¡Tengo muchas ganas de ir! | Привет, Ирина! Я нашла гостиницу на Майорке: пятьдесят евро за ночь, совсем рядом с пляжем. Я бы поехала с десятого по семнадцатое июля. Если ты не против, забронирую сегодня. Мне очень хочется поехать!"
      - choose:
          title: Что в сообщении?
          source: audio_olga
          items:
            - q: "¿Cuánto cuesta el hotel?"
              options: "Cincuenta euros la noche. | Quince euros la noche. | Cincuenta euros la semana."
              explain: "…cincuenta euros la noche."
            - q: "¿Qué días prefiere Olga?"
              options: "Del diez al diecisiete de julio. | Del diecisiete al diez de agosto. | Del uno al diez de julio."
              explain: "Yo prefiero ir del diez al diecisiete de julio."
              skill: plazos
            - q: "¿Qué va a hacer Olga si a Irina le parece bien?"
              options: "Reservar el hotel hoy. | Comprar los billetes mañana. | Llamar al hotel."
              explain: "Si te parece bien, lo reservo hoy."
              skill: si_presente
      - mission:
          id: plan
          title: План отпуска
          text: "Вечером Ольга звонит, чтобы обсудить поездку."
      - chat:
          id: olga_chat
          title: Разговор с Ольгой
          with: Olga
          turns:
            - say: "¿Has oído mi mensaje? ¿Qué te parece el hotel? | Ты слышала моё сообщение? Как тебе гостиница?"
              task: "Скажите, что гостиница кажется вам отличной."
              skill: caer_parecer
              write: "Me parece genial | Me parece muy bien | Me parece perfecto | El hotel me parece genial"
              format: мнение
            - say: "¿Y te viene bien del diez al diecisiete de julio? | А тебе удобно с десятого по семнадцатое июля?"
              task: "Ответьте: да, если на работе дадут отпуск в июле, — скажите это через si: «если у меня будет отпуск в июле»."
              skill: si_presente
              write: "Sí, si tengo vacaciones en julio | Sí, si tengo vacaciones en el trabajo | Si tengo vacaciones en julio, sí"
              format: условие
              mistakes:
                "sí si tendré vacaciones en julio": "После si — настоящее время: si **tengo** vacaciones."
            - say: "Vale. Entonces, ¿reservo el hotel? | Хорошо. Тогда бронировать гостиницу?"
              task: "Скажите: да, забронируй её."
              skill: imperativo_tu
              write: "Sí, resérvalo | Sí, resérvalo(,) por favor | Sí, resérvalo hoy"
              format: ответ
              mistakes:
                "sí reservalo": "Почти: нужен знак ударения — res**é**rvalo."
            - say: "¿Y qué piensas hacer allí? | А что ты собираешься там делать?"
              task: "Ответьте от себя: что собираетесь делать (pienso…, me gustaría…, tengo ganas de…)."
              skill: planes
              compose:
                format: "Pienso… Me gustaría… Tengo ganas de…"
                words: [3, 30]
                checks:
                  - label: "планы: pienso, me gustaría, tengo ganas de, quiero…"
                    any: [pienso, me gustaría, tengo ganas de, quiero, voy a]
                sample: "Pienso nadar mucho y me gustaría visitar Palma."
                sample_ru: "Собираюсь много плавать и хотела бы посмотреть Пальму."
            - say: "¡Yo tengo muchas ganas de ir! | Мне очень хочется поехать!"
              task: "Скажите, что вам тоже."
              skill: planes
              choose: "¡Yo también! | ¡Yo tampoco! | ¡A mí no!"
              explain: "Тоже (в утверждении) — yo también; tampoco — «тоже нет»."
            - say: "¡Va a ser genial! | Будет здорово!"
      - compose:
          title: План отпуска
          free: true
          rule: none
          skill: [planes, si_presente, deseos]
          items:
            - q: "Напишите план отпуска, 60–100 слов: куда и когда вы поедете · с кем · что собираетесь делать · чего очень хочется · что сделаете, если будет плохая погода."
              format: "Este verano pienso ir a… del… al… con… Tengo ganas de… Si llueve…"
              words: [45, 130]
              sentences: 4
              checks:
                - label: "куда и когда: pienso ir a…, voy a ir…"
                  any: [pienso ir, voy a ir, me gustaría ir, vamos a ir, pensamos ir]
                - label: "желание: tengo ganas de, me gustaría…"
                  any: [tengo ganas de, me gustaría, sueño con, espero]
                - label: "условие: si…"
                  re: "\\bsi \\w+"
              sample: "Este verano pienso ir a Mallorca con mi amiga Olga, del diez al diecisiete de julio. Ya hemos reservado un hotel cerca de la playa. Tengo muchas ganas de nadar en el mar y de comer pescado fresco. También me gustaría visitar Palma y su catedral. Si llueve, vamos a ir a los museos o a un café del centro."
              sample_ru: "Этим летом собираюсь на Майорку с подругой Ольгой, с десятого по семнадцатое июля. Мы уже забронировали гостиницу у пляжа. Очень хочется поплавать в море и поесть свежей рыбы. Ещё хотела бы посмотреть Пальму и её собор. Если пойдёт дождь, пойдём в музеи или в кафе в центре."

