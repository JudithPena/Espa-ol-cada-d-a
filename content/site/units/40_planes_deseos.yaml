id: planes_deseos
number: 40
level: A2
title: Planes y deseos — планы и желания
goals:
  - рассказать о планах на отпуск и праздники
  - сказать, чего хочется и о чём мечтаете
  - поставить условие: «если…, то…»
  - понять, как в Испании празднуют Новый год и Рождество

# Тема 17 карты A2: pensar + инфинитив, me gustaría; si + настоящее; планы, праздники. Миссия — план отпуска.
# В A1 (тема 19) уже были voy a + инфинитив, tengo que, quedar; в теме 36 — me gustaría.
lessons:
  - id: verano
    kind: listening
    title: "¿Qué piensas hacer en verano?"
    goal: понять на слух разговор о планах на лето
    version: 2
    # Карта экранов: docs/site_slide_maps/40_planes_deseos.md
    vocab:
      - "💭 pensar [пэнса́р] — думать; собираться (pensar + инфинитив) :: Pienso ir a Mallorca en verano. — Летом я собираюсь на Майорку."
      - "😋 tener ganas de [тэнэ́р га́нас дэ] — очень хотеть :: Tengo ganas de ver a mi familia. — Мне очень хочется увидеть семью."
      - "📅 reservar [рэсэрба́р] — бронировать :: Reservé el hotel por internet. — Я забронировал гостиницу через интернет."
      - "🐷 ahorrar [аорра́р] — копить, экономить :: Este año quiero ahorrar dinero. — В этом году хочу накопить денег."
      - "🌠 el deseo [дэсэ́о] — желание :: Mi deseo es viajar por el mundo. — Моё желание — путешествовать по миру."
    forms: [cómprame]
    blocks:
      - "Диего и Ирина говорят о лете. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: planes_verano
          hidden: true
          lines:
            - "Diego: Irina, ¿qué piensas hacer en verano? | Ирина, что ты собираешься делать летом?"
            - "Irina: Pienso ir a Mallorca con Olga, si encontramos vuelos baratos. ¿Y tú? | Думаю поехать на Майорку с Ольгой, если найдём дешёвые билеты. А ты?"
            - "Diego: Tengo muchas ganas de ver a mi familia. Me gustaría ir a México en agosto, pero los vuelos son carísimos. | Очень хочется увидеть семью. Я бы поехал в Мексику в августе, но билеты страшно дорогие."
            - "Irina: ¿Y por qué no reservas ahora? En enero son más baratos. | А почему не забронируешь сейчас? В январе они дешевле."
            - "Diego: Es verdad. Si encuentro algo barato esta semana, lo reservo. Y voy a ahorrar un poco cada mes. | Это правда. Если найду что-то дешёвое на этой неделе, забронирую. И буду понемногу откладывать каждый месяц."
            - "Irina: ¡Buena idea! Y si vas a México, cómprame un recuerdo. | Хорошая мысль! И если поедешь в Мексику, купи мне сувенир."
            - "Diego: ¡Claro! | Конечно!"
      - choose:
          title: Что вы поняли?
          source: planes_verano
          items:
            - q: "Куда Ирина собирается летом?"
              options: "A Mallorca. | A México. | A Granada."
              explain: "Ирина называет Mallorca."
            - q: "Чего очень хочется Диего?"
              options: "Ver a su familia. | Ir a la playa. | Comprar un regalo."
              explain: "Diego: Tengo muchas ganas de ver a mi familia."
      - learn: [pensar, tener ganas de, reservar, ahorrar, el deseo]
      - choose:
          title: Детали разговора
          source: planes_verano
          items:
            - q: "¿Con quién va a ir Irina a Mallorca?"
              options: "Con Olga. | Con Diego. | Con su familia."
              explain: "Irina: Pienso ir a Mallorca con Olga."
            - q: "¿Qué problema tienen los vuelos a México?"
              options: "Son carísimos. | No hay vuelos en agosto. | Son muy largos."
              explain: "Diego: …los vuelos son carísimos."
            - q: "¿Cuándo son más baratos los vuelos?"
              options: "En enero. | En agosto. | En verano."
              explain: "Irina: En enero son más baratos."
            - q: "¿Qué va a hacer Diego si encuentra algo barato?"
              options: "Lo va a reservar. | Lo va a pensar. | Va a llamar a su familia."
              explain: "Diego: Si encuentro algo barato esta semana, lo reservo."
      - text:
          id: notice
          slide: new
          text: "О планах говорят по-разному: **pienso** ir — «собираюсь», **tengo ganas de** ver — «очень хочется», **me gustaría** ir — «я бы поехал». А условие — **si** + настоящее время: _si encuentro algo barato, lo reservo_."
      - examples:
          items:
            - "**Pienso** ir a Mallorca. — Я собираюсь на Майорку."
            - "**Tengo ganas de** ver a mi familia. — Мне очень хочется увидеть семью."
            - "**Si** encuentro algo barato, lo reservo. — Если найду что-то дешёвое, забронирую."
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "pensar — собираться (что-то сделать)"
            - "tener ganas de — очень хотеть"
            - "reservar — бронировать"
            - "ahorrar — копить"
            - "el deseo — желание"
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: planes
          rule: notice
          items:
            - say: "Pienso ir a la playa si hace buen tiempo."
              a: "Pienso ir a la playa si hace buen tiempo"
              explain: "Pienso ir — «собираюсь пойти»; si hace buen tiempo — «если будет хорошая погода»."
              noaudio: {q: "Напишите по-испански: «Я собираюсь на пляж, если будет хорошая погода» (с pensar).", a: "Pienso ir a la playa si hace buen tiempo"}
      - choose:
          title: Что ответить?
          free: true
          skill: planes
          rule: notice
          items:
            - lines: ["Lucía: ¿Qué piensas hacer este fin de semana?"]
              q: "Скажите, что собираетесь отдохнуть дома."
              options: "Pienso descansar en casa. | Pienso que descanso en casa. | Pienso de descansar en casa."
              explain: "Собираюсь — pensar + инфинитив, без предлога."
            - say: "Tengo muchas ganas de ver el mar."
              options: "Мне очень хочется увидеть море. | Я давно видел море. | Мне не хочется на море."
              explain: "Tengo ganas de — «очень хочется»."
              noaudio: {q: "Что значит «Tengo muchas ganas de ver el mar»?", options: "Мне очень хочется увидеть море. | Я давно видел море. | Мне не хочется на море."}
      - build:
          title: Соберите фразу
          free: true
          skill: planes
          rule: notice
          items:
            - es: "Este año quiero ahorrar para ir a México."
              ru: "В этом году я хочу накопить на поездку в Мексику."
              extra: [por]
            - es: "Si encuentro un vuelo barato, lo reservo."
              ru: "Если найду дешёвый билет, забронирую."

  - id: si
    kind: grammar
    title: "Si llueve, nos quedamos en casa"
    goal: поставить условие и сказать, что будет
    version: 2
    vocab:
      - "↩️ si no [си но] — если нет; иначе :: Llámame esta tarde; si no, te llamo yo. — Позвони мне сегодня; если нет — позвоню я."
      - "🎯 seguro/a [сэгу́ро, сэгу́ра] — уверенный; надёжный :: ¿Estás seguro? — Ты уверен?"
    blocks:
      - learn: [si no, seguro/a]
      - table:
          id: si
          title: "Si + настоящее время"
          rows:
            - ["si + настоящее, настоящее", "Si llueve, nos quedamos en casa. — Если пойдёт дождь, мы останемся дома."]
            - ["si + настоящее, ir a + инфинитив", "Si tengo dinero, voy a viajar. — Если будут деньги, поеду путешествовать."]
            - ["si + настоящее, инструкция", "Si tienes tiempo, llámame. — Если будет время, позвони мне."]
      - note:
          id: si_presente
          text: "После **si** в таком условии — настоящее время, даже если речь о будущем: _si **llueve** mañana_ — «если завтра пойдёт дождь». Если условие стоит первым, после него ставят запятую."
      - choose:
          title: Выберите форму
          skill: si_presente
          rule: si_presente
          items:
            - q: "Si ___ buen tiempo, vamos a la playa."
              options: "hace | hizo | hacía"
              explain: "После si — настоящее время: hace."
            - q: "Si tienes tiempo, ___ a mi casa esta noche."
              options: "ven | vienes a | viniste"
              explain: "Si + настоящее, инструкция: ven."
            - q: "Llega antes de las ocho; si ___, perdemos el tren."
              options: "no | sí | nunca"
              explain: "Si no — «если нет, иначе»."
            - q: "Si mañana ___, no voy a salir."
              options: "llueve | llovió | llovía"
              explain: "Si + настоящее даже о будущем: llueve."
            - say: "Si encuentro un piso más barato, me cambio de barrio."
              options: "Если найду квартиру подешевле, перееду в другой район. | Я нашёл квартиру подешевле и переехал. | Если бы я нашёл квартиру, я бы переехал."
              explain: "Si encuentro — «если найду»; me cambio — «перееду»."
              noaudio: {q: "Что значит «Si encuentro un piso más barato, me cambio de barrio»?", options: "Если найду квартиру подешевле, перееду в другой район. | Я нашёл квартиру подешевле и переехал. | Если бы я нашёл квартиру, я бы переехал."}
      - write:
          title: Поставьте глагол
          format: одна форма глагола
          skill: si_presente
          rule: si
          items:
            - q: "Si (tú, estar) ___ cansado, descansa un poco."
              a: "estás"
              explain: "После si — настоящее время: estás."
            - q: "Si (nosotros, tener) ___ dinero, vamos a viajar a México."
              a: "tenemos"
              explain: "Si + настоящее: tenemos."
            - q: "Llámame esta tarde; si ___, te llamo yo mañana."
              a: "no"
              explain: "Si no — «если нет»: Llámame esta tarde; si no, te llamo yo."
            - q: "Si (llover) ___, vamos al cine."
              a: "llueve"
              explain: "Si + настоящее: llueve."
              mistakes:
                "llueva": "После si в таком условии — настоящее время: **llueve**."
      - build:
          title: Соберите фразу
          skill: si_presente
          rule: si
          items:
            - es: "Si tienes tiempo, llámame esta noche."
              ru: "Если будет время, позвони мне сегодня вечером."
              extra: [tendrás]
            - es: "Llámame hoy; si no, te llamo yo."
              ru: "Позвони мне сегодня; если нет — позвоню я."
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: si_presente
          rule: si
          items:
            - q: "Если будет хорошая погода, мы пойдём в парк."
              a: "Si hace buen tiempo, vamos al parque | Si hace buen tiempo, vamos a ir al parque"
              explain: "Si + hace…"
              mistakes:
                "si hará buen tiempo vamos al parque": "После si — настоящее время: si **hace** buen tiempo."
      - compose:
          title: Если…
          skill: si_presente
          rule: si
          items:
            - q: "Напишите два условия о своих планах: что вы сделаете, если будет время, деньги или хорошая погода."
              format: "Si tengo tiempo… Si hace buen tiempo…"
              words: [10, 50]
              sentences: 2
              checks:
                - label: "si + настоящее: si tengo, si hace…"
                  re: "\\bsi (tengo|tenemos|hace|llueve|puedo|podemos|encuentro|hay|estoy|vienes|tienes|quieres)\\b"
              sample: "Si tengo tiempo el sábado, voy a visitar a mis padres. Si hace buen tiempo, vamos a comer en el campo."
              sample_ru: "Если в субботу будет время, съезжу к родителям. Если будет хорошая погода, пообедаем на природе."
    quiz:
      - q: "Si ___ tiempo, te llamo."
        options: "tengo | tuve | tenía"
        explain: "Si + настоящее: tengo."
        skill: si_presente
      - q: "— ¿Estás ___? — Sí, claro."
        options: "seguro | idea | segura de"
        explain: "Уверен — seguro."

  - id: deseos
    kind: grammar
    title: "Me gustaría, sueño con…"
    goal: сказать о желаниях и мечтах
    version: 2
    vocab:
      - "🌙 soñar [соньа́р] — мечтать (soñar con — мечтать о); видеть сон :: Sueño con vivir en la playa. — Я мечтаю жить у моря."
      - "📅 algún día [альгу́н ди́а] — когда-нибудь :: Algún día voy a ir a México. — Когда-нибудь я поеду в Мексику."
    blocks:
      - learn: [soñar, algún día]
      - "Esperar вы знаете как «ждать». С инфинитивом это ещё и «надеяться»: _Espero aprobar_ — «надеюсь сдать»."
      - table:
          id: deseos
          title: Желания и мечты
          rows:
            - ["quiero + инфинитив — хочу", "Quiero aprender a cocinar. — Хочу научиться готовить."]
            - ["me gustaría + инфинитив — хотел бы", "Me gustaría vivir en Barcelona. — Я бы хотел жить в Барселоне."]
            - ["tengo ganas de + инфинитив — очень хочется", "Tengo ganas de ver a mis amigos. — Очень хочется увидеть друзей."]
            - ["espero + инфинитив — надеюсь", "Espero encontrar trabajo este año. — Надеюсь найти работу в этом году."]
            - ["sueño con + инфинитив — мечтаю", "Sueño con tener una casa en el campo. — Мечтаю о доме за городом."]
      - note:
          id: con
          text: "Soñar — **con**: _sueño con viajar_; tener ganas — **de**: _tengo ganas de viajar_. С quiero, me gustaría, espero, pienso — инфинитив без предлога."
      - choose:
          title: Выберите предлог
          skill: deseos
          rule: con
          items:
            - q: "Sueño ___ vivir en una casa grande."
              options: "con | de | a"
              explain: "Soñar con."
            - q: "Tengo ganas ___ ir de vacaciones."
              options: "de | con | —"
              explain: "Tener ganas de."
            - q: "Espero ___ aprobar el examen."
              options: "— | de | a"
              explain: "Esperar + инфинитив без предлога."
            - say: "Algún día me gustaría vivir cerca del mar."
              options: "Когда-нибудь я хотел бы жить у моря. | Однажды я жил у моря. | Мне не нравится жить у моря."
              explain: "Algún día — «когда-нибудь»; me gustaría vivir — «хотел бы жить»."
              noaudio: {q: "Что значит «Algún día me gustaría vivir cerca del mar»?", options: "Когда-нибудь я хотел бы жить у моря. | Однажды я жил у моря. | Мне не нравится жить у моря."}
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: deseos
          rule: deseos
          items:
            - q: "Я мечтаю жить в Испании."
              a: "Sueño con vivir en España | (Yo) sueño con vivir en España"
              explain: "Soñar con + инфинитив."
              mistakes:
                "sueño de vivir en españa": "Soñar — с предлогом **con**: sueño con vivir…"
            - q: "Надеюсь найти работу."
              a: "Espero encontrar trabajo | Espero encontrar un trabajo"
              explain: "Esperar + инфинитив."
      - build:
          title: Соберите фразу
          skill: deseos
          rule: deseos
          items:
            - es: "Algún día me gustaría vivir en el campo."
              ru: "Когда-нибудь я хотел бы жить за городом."
              extra: [gusta]
      - compose:
          title: Мои мечты
          skill: [deseos, planes]
          rule: deseos
          items:
            - q: "О чём вы мечтаете? Что хотели бы сделать когда-нибудь? Две-три фразы."
              format: "Sueño con… Algún día me gustaría… Espero…"
              words: [10, 50]
              sentences: 2
              checks:
                - label: "мечта или желание: sueño con, me gustaría, quiero, espero…"
                  any: [sueño con, me gustaría, quiero, espero, tengo ganas de]
              sample: "Sueño con tener una casa pequeña cerca del mar. Algún día me gustaría hablar español muy bien. Este año espero aprobar el examen."
              sample_ru: "Мечтаю о маленьком доме у моря. Когда-нибудь хотел бы очень хорошо говорить по-испански. В этом году надеюсь сдать экзамен."
    quiz:
      - q: "Mi hermano sueña ___ viajar por todo el mundo."
        options: "con | de | en"
        explain: "Soñar con."
        skill: deseos
      - q: "Что значит «algún día»?"
        options: "когда-нибудь | однажды в прошлом | каждый день"
        explain: "Algún día — когда-нибудь (в будущем)."
        skill: deseos

  - id: fiestas
    kind: dialogue
    title: "¿Cómo celebráis la Navidad?"
    goal: рассказать о праздниках и выходных
    version: 2
    vocab:
      - "🎄 la Navidad [набида́д] — Рождество :: En Navidad cenamos con toda la familia. — На Рождество ужинаем всей семьёй."
      - "🎆 la Nochevieja [ночэбье́ха] — новогодняя ночь (31 декабря) :: ¿Dónde pasas la Nochevieja? — Где встречаешь Новый год?"
      - "👑 los Reyes Magos [рэ́йэс ма́гос] — волхвы; праздник 6 января :: Los niños esperan a los Reyes Magos. — Дети ждут волхвов."
      - "🎉 celebrar [θэлэбра́р] — праздновать :: ¿Cómo celebras tu cumpleaños? — Как ты празднуешь день рождения?"
      - "🌉 el puente [пуэ́нтэ] — мост; длинные выходные :: En diciembre hay un puente. — В декабре длинные выходные."
      - "🍇 las uvas [у́бас] — виноград {forms: uva} :: En Nochevieja comemos doce uvas. — В новогоднюю ночь едим двенадцать виноградин."
    forms: [comerlas]
    blocks:
      - learn: [la Navidad, la Nochevieja, los Reyes Magos, celebrar, el puente, las uvas]
      - "Том спрашивает Лусию об испанских праздниках."
      - dialogue:
          id: navidad
          lines:
            - "Tom: Lucía, ¿cómo celebráis la Navidad en España? | Лусия, как вы празднуете Рождество в Испании?"
            - "Lucía: El veinticuatro de diciembre cenamos con toda la familia. Es una cena muy larga. | Двадцать четвёртого декабря ужинаем всей семьёй. Ужин очень долгий."
            - "Tom: ¿Y en Nochevieja? | А в новогоднюю ночь?"
            - "Lucía: En Nochevieja comemos doce uvas a las doce de la noche. ¡Hay que comerlas muy rápido! | В новогоднюю ночь едим двенадцать виноградин в полночь. Их нужно есть очень быстро!"
            - "Tom: ¿Y cuándo abrís los regalos? | А когда открываете подарки?"
            - "Lucía: Muchos niños abren los regalos el seis de enero: es el día de los Reyes Magos. | Многие дети открывают подарки шестого января: это день волхвов."
            - "Tom: ¿Y tienes vacaciones? | А у тебя будут выходные?"
            - "Lucía: Pocas. Pero en diciembre hay dos puentes y pienso ir a la montaña. | Немного. Но в декабре двое длинных выходных, и я собираюсь в горы."
      - choose:
          title: Что сказано?
          source: navidad
          skill: fiestas
          items:
            - q: "¿Qué hace la familia de Lucía el veinticuatro de diciembre?"
              options: "Cenan todos juntos. | Comen doce uvas. | Abren los regalos."
              explain: "Lucía: El veinticuatro de diciembre cenamos con toda la familia."
            - q: "¿Qué comen en Nochevieja a las doce?"
              options: "Doce uvas. | Una cena muy larga. | Fruta y queso."
              explain: "Lucía: En Nochevieja comemos doce uvas a las doce de la noche."
            - q: "¿Cuándo abren muchos niños los regalos?"
              options: "El seis de enero. | El veinticuatro de diciembre. | El uno de enero."
              explain: "Lucía: Muchos niños abren los regalos el seis de enero."
            - q: "¿Qué piensa hacer Lucía en los puentes de diciembre?"
              options: "Ir a la montaña. | Ir a la playa. | Trabajar en casa."
              explain: "Lucía: …pienso ir a la montaña."
              skill: planes
      - note:
          id: puente
          slide: new
          text: "**El puente** — «мост», но в Испании так называют и длинные выходные: если праздник во вторник, многие берут выходной и в понедельник. _Este puente pienso ir a la playa._"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          free: true
          skill: fiestas
          rule: puente
          items:
