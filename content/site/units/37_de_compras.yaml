id: de_compras
number: 37
level: A2
title: De compras — за покупками
goals:
  - поменять или вернуть покупку
  - сравнить и выбрать самое лучшее
  - выбрать вещь, не повторяя её название
  - сказать, чья это вещь

# Тема 14 карты A2: el más…, -ísimo; este / ese без существительного; el mío / la mía; одежда, техника.
# Миссия — обмен покупки. В A1 (тема 17) уже были одежда, este / ese / aquel перед существительным, precios,
# probarse, me queda bien / grande, me lo llevo, pagar con tarjeta.
lessons:
  - id: cambiar
    kind: listening
    title: "Quería cambiar esta chaqueta"
    goal: понять на слух обмен покупки в магазине
    version: 2
    # Карта экранов: docs/site_slide_maps/37_de_compras.md
    vocab:
      - "🧾 el tique [ти́кэ] — чек (в магазине пишут и `ticket`) :: ¿Tiene el tique? — Чек у вас есть?"
      - "🤏 estrecho/a [эстрэ́чо, эстрэ́ча] — узкий, тесный :: La chaqueta me queda estrecha. — Куртка мне тесная."
      - "↔️ ancho/a [а́нчо, а́нча] — широкий, свободный :: Los pantalones me quedan anchos. — Брюки мне широки."
      - "💳 la caja [ка́ха] — касса :: Pase por caja, por favor. — Пройдите на кассу, пожалуйста."
      - "🛍 el dependiente / la dependienta [дэпэндье́нтэ, дэпэндье́нта] — продавец, продавщица :: La dependienta es muy amable. — Продавщица очень любезная."
    blocks:
      - "Ирина пришла в магазин поменять куртку. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: chaqueta
          hidden: true
          lines:
            - "Dependienta: Hola, buenas tardes. ¿Qué necesita? | Здравствуйте. Что вам нужно?"
            - "Irina: Hola. Quería cambiar esta chaqueta. La compré el sábado, pero me queda estrecha. | Здравствуйте. Я хотела бы поменять эту куртку. Купила в субботу, но она мне тесная."
            - "Dependienta: ¿Tiene el tique? | Чек у вас есть?"
            - "Irina: Sí, aquí está. Es la treinta y ocho. ¿Tiene la cuarenta? | Да, вот он. Это тридцать восьмой размер. А сороковой у вас есть?"
            - "Dependienta: En negro, no. Pero tenemos esta en azul y esa en gris, en la cuarenta. | В чёрном нет. Но есть вот эта в синем и та в сером, сорокового размера."
            - "Irina: Me pruebo la azul… Sí, esta me queda muy bien. Me la llevo. | Примерю синюю… Да, эта сидит очень хорошо. Беру."
            - "Dependienta: Muy bien. Pase por caja, por favor. | Хорошо. Пройдите, пожалуйста, на кассу."
      - choose:
          title: Что вы поняли?
          source: chaqueta
          items:
            - q: "Что Ирина хочет сделать?"
              options: "Cambiar una chaqueta. | Comprar unos pantalones. | Devolver un jersey."
              explain: "Irina: Quería cambiar esta chaqueta."
            - q: "Когда она купила куртку?"
              options: "El sábado. | Ayer. | Hace un mes."
              explain: "Irina: La compré el sábado."
      - learn: [el tique, estrecho/a, ancho/a, la caja, el dependiente / la dependienta]
      - choose:
          title: Детали разговора
          source: chaqueta
          items:
            - q: "¿Qué problema tiene la chaqueta?"
              options: "Le queda estrecha. | Le queda ancha. | Está rota."
              explain: "Irina: …me queda estrecha."
            - q: "¿Qué pide la dependienta?"
              options: "El tique. | La tarjeta. | El nombre de Irina."
              explain: "Dependienta: ¿Tiene el tique?"
            - q: "¿Qué chaqueta se lleva Irina?"
              options: "La azul, en la talla cuarenta. | La negra, en la talla cuarenta. | La gris, en la treinta y ocho."
              explain: "Irina: Me pruebo la azul… Sí, esta me queda muy bien. Me la llevo."
            - q: "¿Adónde tiene que ir al final?"
              options: "A la caja. | Al probador. | A otra tienda."
              explain: "Dependienta: Pase por caja, por favor."
      - text:
          id: notice
          slide: new
          text: "Ирина говорит **quería cambiar** — imperfecto звучит мягче, чем quiero: «я бы хотела». А продавщица не повторяет слово chaqueta: **esta** en azul, **esa** en gris, и Ирина отвечает: **la azul**."
      - examples:
          items:
            - "**Quería** cambiar esta chaqueta. — Я бы хотела поменять эту куртку."
            - "Tenemos **esta** en azul y **esa** en gris. — Есть вот эта в синем и та в сером."
            - "Me pruebo **la azul**. — Примерю синюю."
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "el tique — чек"
            - "estrecho — тесный"
            - "ancho — широкий"
            - "la caja — касса"
            - "el dependiente — продавец"
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: devolver
          rule: notice
          items:
            - say: "Quería cambiar estos pantalones: me quedan anchos."
              a: "Quería cambiar estos pantalones: me quedan anchos"
              explain: "Me quedan anchos — «мне широки»."
              noaudio: {q: "Напишите по-испански: «Я бы хотел поменять эти брюки: они мне широки».", a: "Quería cambiar estos pantalones: me quedan anchos | Quería cambiar estos pantalones, me quedan anchos"}
      - choose:
          title: Что сказать?
          free: true
          skill: devolver
          rule: notice
          items:
            - lines: ["Dependiente: Hola, ¿qué necesita?"]
              q: "Вежливо скажите, что хотели бы вернуть этот свитер."
              options: "Quería devolver este jersey. | Quiero que devuelvo este jersey. | Devolví este jersey."
              explain: "Вежливо — quería + инфинитив."
            - say: "La talla cuarenta me queda un poco estrecha."
              options: "Сороковой размер мне немного тесен. | Сороковой размер мне велик. | Сорокового размера нет."
              explain: "Me queda estrecha — «мне тесно»."
              noaudio: {q: "Что значит «La talla cuarenta me queda un poco estrecha»?", options: "Сороковой размер мне немного тесен. | Сороковой размер мне велик. | Сорокового размера нет."}
      - build:
          title: Соберите фразу
          free: true
          skill: devolver
          rule: notice
          items:
            - es: "Quería cambiar esta chaqueta: me queda estrecha."
              ru: "Я бы хотела поменять эту куртку: она мне тесная."
              extra: [quiero]
            - es: "¿Tiene el tique? Pase por caja, por favor."
              ru: "Чек у вас есть? Пройдите на кассу, пожалуйста."

  - id: el_mas
    kind: grammar
    title: "El más barato, carísimo"
    goal: выбрать лучшее и сказать «очень-очень»
    version: 2
    unlocks: [superlative]
    vocab:
      - "👔 elegante [элега́нтэ] — элегантный :: Es el vestido más elegante de la tienda. — Это самое элегантное платье в магазине."
      - "⭐ la calidad [калида́д] — качество :: Es caro, pero de muy buena calidad. — Дорого, но очень хорошего качества."
      - "🏷 las rebajas [рэба́хас] — распродажа (сезонная) :: En enero hay rebajas. — В январе распродажи."
      - "😋 rico/a [ри́ко, ри́ка] — вкусный (о еде); богатый :: La paella está muy rica. — Паэлья очень вкусная."
    blocks:
      - learn: [elegante, la calidad, las rebajas, rico/a]
      - table:
          id: el_mas
          title: Самый
          rows:
            - ["el / la + más + прилагательное + de", "Es la tienda más barata del barrio. — Это самый дешёвый магазин в районе."]
            - ["el / la + menos + прилагательное + de", "Es el móvil menos caro de la tienda. — Это самый недорогой телефон в магазине."]
            - ["el mejor / el peor + de", "Es el mejor restaurante de la ciudad. — Это лучший ресторан в городе."]
      - note:
          id: de
          text: "После «самый» место называют с **de**, а не en: _la más barata **del** barrio_ — «самая дешёвая в районе»."
      - choose:
          title: Выберите слово
          skill: superlativo
          rule: el_mas
          items:
            - q: "Es la camisa ___ cara de la tienda."
              options: "más | mejor | muy"
              explain: "Самая дорогая — la más cara."
            - q: "Es el ___ restaurante de la ciudad: la comida es increíble."
              options: "mejor | más bueno | más"
              explain: "Лучший — el mejor."
            - q: "Es caro, pero de muy buena ___."
              options: "calidad | rebaja | talla"
              explain: "Хорошего качества — de buena calidad."
            - q: "Madrid es la ciudad más grande ___ España."
              options: "de | en | que"
              explain: "После «самый» — de: la más grande de España."
      - table:
          id: isimo
          slide: new
          title: "-ísimo — «очень-очень»"
          rows:
            - ["caro → carísimo", "Este abrigo es carísimo. — Это пальто страшно дорогое."]
            - ["barato → baratísimo", "En rebajas todo está baratísimo. — На распродаже всё очень дёшево."]
            - ["bueno → buenísimo", "La sopa está buenísima. — Суп очень вкусный."]
            - ["rico → riquísimo, largo → larguísimo", "Перед -ísimo `c` → `qu`, `g` → `gu`."]
            - ["fácil → facilísimo", "Знак ударения уходит: всё ударение на -ísimo."]
      - write:
          title: Скажите «очень-очень»
          format: одно слово
          accents: strict
          skill: superlativo
          rule: isimo
          items:
            - q: "Este jersey es (caro) ___."
              a: "carísimo"
              explain: "Caro → carísimo."
              mistakes:
                "carisimo": "Нужен знак ударения: car**í**simo."
            - q: "La sopa está (bueno) ___."
              a: "buenísima"
              explain: "La sopa — женский род: buenísima."
              mistakes:
                "buenísimo": "La sopa — женский род: buen**ísima**."
            - q: "El examen fue (fácil) ___."
              a: "facilísimo"
              explain: "Fácil → facilísimo: знак ударения уходит."
              mistakes:
                "fácilísimo": "Ударение одно — на -ísimo: **facilísimo**."
            - q: "Las tapas de este bar están (rico) ___."
              a: "riquísimas"
              explain: "Rico → riquísimo: `c` → `qu`."
              mistakes:
                "ricísimas": "Перед -ísimo `c` → `qu`: **riquísimas**."
      - choose:
          title: Послушайте
          skill: superlativo
          rule: isimo
          items:
            - say: "Este abrigo es carísimo, pero es el mejor de la tienda."
              options: "Это пальто очень дорогое, но лучшее в магазине. | Это пальто дешёвое и лучшее в магазине. | Это пальто дороже всех, но хуже всех."
              explain: "Carísimo — «очень дорогой»; el mejor de la tienda — «лучший в магазине»."
              noaudio: {q: "Что значит «Este abrigo es carísimo, pero es el mejor de la tienda»?", options: "Это пальто очень дорогое, но лучшее в магазине. | Это пальто дешёвое и лучшее в магазине. | Это пальто дороже всех, но хуже всех."}
      - build:
          title: Соберите фразу
          skill: superlativo
          rule: el_mas
          items:
            - es: "Es la tienda más barata del barrio."
              ru: "Это самый дешёвый магазин в районе."
              extra: [en]
            - es: "En rebajas todo está baratísimo."
              ru: "На распродаже всё очень дёшево."
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: superlativo
          rule: de
          items:
            - q: "Это самое элегантное платье в магазине."
              a: "Es el vestido más elegante de la tienda"
              explain: "Самый — el más…; в магазине — de la tienda."
              mistakes:
                "es el vestido más elegante en la tienda": "После «самый» — **de**: de la tienda."
      - compose:
          title: Лучшее в моём городе
          skill: superlativo
          rule: el_mas
          items:
            - q: "Расскажите о лучшем в вашем городе: лучший ресторан, самый красивый парк, самое дешёвое место для покупок. Две-три фразы."
              format: "El mejor restaurante de mi ciudad… El parque más bonito…"
              words: [12, 60]
              sentences: 2
              checks:
                - label: "самый: el mejor, la más…, el más…"
                  any: [el mejor, la mejor, los mejores, las mejores, el más, la más, los más, las más, el menos, la menos]
              sample: "El mejor restaurante de mi ciudad está en el centro: la comida está buenísima. El parque más bonito es el Retiro, y la calle más barata para comprar ropa es la calle del mercado."
              sample_ru: "Лучший ресторан моего города — в центре: еда там очень вкусная. Самый красивый парк — Ретиро, а самая дешёвая улица для покупок одежды — улица у рынка."
    quiz:
      - q: "Es el móvil ___ barato de la tienda."
        options: "más | muy | mucho"
        explain: "Самый дешёвый — el más barato."
        skill: superlativo
      - q: "Esta paella está (rico) ___."
        options: "riquísima | ricísima | muy riquísima"
        explain: "Rico → riquísima: `c` → `qu`."
        skill: superlativo

  - id: cual
    kind: grammar
    title: "¿Cuál prefieres? — El azul"
    goal: выбрать вещь, не повторяя её название
    version: 2
    vocab:
      - "〰️ de rayas [дэ ра́яс] — в полоску :: Me gusta la camisa de rayas. — Мне нравится рубашка в полоску."
      - "🏁 de cuadros [дэ куа́дрос] — в клетку :: Busco una falda de cuadros. — Ищу юбку в клетку."
      - "🌸 rosa [ро́са] — розовый :: Me llevo la camiseta rosa. — Беру розовую футболку."
    forms: [cuáles]
    blocks:
      - learn: [de rayas, de cuadros, rosa]
      - table:
          id: sin_nombre
          title: Без существительного
          rows:
            - ["este, ese, aquel", "¿Qué jersey te gusta? — Este. — Какой свитер тебе нравится? — Этот."]
            - ["el / la + цвет или прилагательное", "¿La camisa blanca o la azul? — La azul. — Белую рубашку или синюю? — Синюю."]
            - ["el / la + de…", "Me gusta el de rayas. — Мне нравится тот, что в полоску."]
      - note:
          id: cual
          text: "**¿Cuál?** — «какой из них?», когда выбирают из нескольких; во множественном числе — **¿Cuáles?** _¿Cuál prefieres, este o ese?_ А с существительным спрашивают **¿Qué…?**: _¿Qué talla tiene?_"
      - choose:
          title: Выберите слово
          skill: sin_nombre
          rule: sin_nombre
          items:
            - q: "— ¿Qué zapatos te gustan? — ___ negros."
              options: "Los | Las | El"
              explain: "Los zapatos — los negros."
            - q: "— ¿La falda de rayas o la de cuadros? — ___ de cuadros."
              options: "La | El | Lo"
              explain: "La falda — la de cuadros."
            - q: "¿___ prefieres, este o ese?"
              options: "Cuál | Qué | Cómo"
              explain: "Выбор из нескольких — ¿Cuál?"
      - write:
          title: Ответьте без существительного
          format: два-три слова
          skill: sin_nombre
          rule: sin_nombre
          items:
            - q: "— ¿Qué camiseta quieres? — Белую."
              a: "La blanca"
              explain: "La camiseta → la blanca."
              mistakes:
                "el blanco": "Camiseta — женский род: **la blanca**."
            - q: "— ¿Qué pantalones te pruebas? — Чёрные."
              a: "Los negros"
              explain: "Los pantalones → los negros."
            - q: "Мне нравится та, что в полоску (о рубашке)."
              a: "Me gusta la de rayas"
              explain: "La camisa → la de rayas."
      - choose:
          title: Послушайте
          skill: sin_nombre
          rule: sin_nombre
          items:
            - say: "No me gusta este, prefiero el de cuadros."
              options: "Этот мне не нравится, я предпочитаю тот, что в клетку. | Мне нравится этот, в клетку. | Мне не нравятся вещи в клетку."
              explain: "El de cuadros — «тот, что в клетку»."
              noaudio: {q: "Что значит «No me gusta este, prefiero el de cuadros»?", options: "Этот мне не нравится, я предпочитаю тот, что в клетку. | Мне нравится этот, в клетку. | Мне не нравятся вещи в клетку."}
      - build:
          title: Соберите фразу
          skill: sin_nombre
          rule: cual
          items:
            - es: "¿Cuál prefieres, la azul o la rosa?"
              ru: "Какую выбираешь: синюю или розовую?"
              extra: [qué]
      - compose:
          title: В магазине с другом
          skill: sin_nombre
          rule: sin_nombre
          items:
            - q: "Вы с другом выбираете одежду. Спросите, какая вещь ему нравится, и скажите, какую берёте вы, — не повторяя название вещи."
              format: "¿Cuál te gusta más? Yo me llevo el…"
              words: [8, 45]
              sentences: 2
              checks:
                - label: "вопрос: ¿Cuál…?"
                  any: [cuál, cuáles]
                - label: "без существительного: el azul, la de rayas, este…"
                  any: [el de, la de, los de, las de, este, esta, ese, esa, el azul, la azul, el negro, la negra, el blanco, la blanca, el rojo, la roja, el verde, la verde, el gris, la gris, la rosa, el rosa]
              sample: "¿Cuál te gusta más, la camisa blanca o la de rayas? Yo me llevo la de rayas: es más bonita."
              sample_ru: "Какая тебе больше нравится — белая рубашка или в полоску? Я беру в полоску: она красивее."
    quiz:
      - q: "— ¿Qué chaqueta te llevas? — ___ gris."
        options: "La | El | Lo"
        explain: "La chaqueta — la gris."
        skill: sin_nombre
      - q: "¿___ son tus zapatos, los negros o los marrones?"
        options: "Cuáles | Cuál | Qué"
        explain: "Выбор во множественном числе — ¿Cuáles?"
        skill: sin_nombre

  - id: mio_tuyo
    kind: grammar
    title: "Es mío. ¿Y el tuyo?"
    goal: сказать, чья это вещь, не повторяя её
    version: 2
    vocab:
      - "🙋 mío/a [ми́о, ми́а] — мой (без существительного) :: Este móvil es mío. — Этот телефон мой."
      - "👉 tuyo/a [ту́йо, ту́я] — твой (без существительного) :: ¿Es tuya esta maleta? — Это твой чемодан?"
      - "👥 suyo/a [су́йо, су́я] — его, её, их; ваш (usted) :: Esta maleta no es mía: es suya. — Этот чемодан не мой: он её."
    blocks:
      - learn: [mío/a, tuyo/a, suyo/a]
      - table:
          id: posesivos
          title: Чьё?
          rows:
            - ["мой", "el mío, la mía, los míos, las mías"]
            - ["твой", "el tuyo, la tuya, los tuyos, las tuyas"]
            - ["его, её, их; ваш (usted)", "el suyo, la suya, los suyos, las suyas"]
            - ["наш, ваш (vosotros)", "el nuestro, la nuestra…; el vuestro, la vuestra…"]
      - note:
          id: es_mio
          text: "После ser артикль обычно не нужен: _Este móvil es **mío**_ — «этот телефон мой». С артиклем говорят, когда сравнивают или выбирают: _Mi coche es blanco y **el tuyo** es rojo_."
      - write:
          title: Вставьте местоимение
          format: одно-два слова
          skill: posesivos
          rule: posesivos
          items:
            - q: "— ¿Es tu bolígrafo? — Sí, es ___."
              a: "mío"
              explain: "После ser — без артикля: es mío."
              mistakes:
                "el mío": "После ser артикль обычно не нужен: es **mío**."
            - q: "Mi coche es blanco y ___ (твой) es rojo."
              a: "el tuyo"
              explain: "Сравниваем — с артиклем: el tuyo."
            - q: "Mis padres viven en Madrid. ¿Y ___ (твои)?"
              a: "los tuyos"
              explain: "Los padres → los tuyos."
            - q: "Esta maleta no es de Ana: ___ (её) es azul."
              a: "la suya"
              explain: "La maleta de Ana → la suya."
      - choose:
          title: Выберите форму
          skill: posesivos
          rule: es_mio
          items:
            - q: "— ¿Estas llaves son tuyas? — Sí, son ___."
              options: "mías | mía | míos"
