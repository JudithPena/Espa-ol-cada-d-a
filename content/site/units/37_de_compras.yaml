  - id: tecnica
    kind: dialogue
    title: "Ya no funcionan"
    goal: вернуть или поменять технику, которая сломалась
    version: 2
    vocab:
      - "💻 el portátil [порта́тиль] — ноутбук :: Mi portátil es muy lento. — Мой ноутбук очень медленный."
      - "🔌 el cargador [каргадо́р] — зарядка, зарядное устройство :: ¿Tienes un cargador para el móvil? — У тебя есть зарядка для телефона?"
      - "🛡 la garantía [гаранти́а] — гарантия :: Tiene dos años de garantía. — На него гарантия два года."
      - "🎧 los auriculares [аурикула́рэс] — наушники :: Estos auriculares no funcionan. — Эти наушники не работают."
    forms: [ayudarle]
    blocks:
      - learn: [el portátil, el cargador, la garantía, los auriculares]
      - "Диего вернулся в магазин техники."
      - dialogue:
          id: auriculares
          lines:
            - "Dependiente: Buenos días. ¿En qué puedo ayudarle? | Доброе утро. Чем могу помочь?"
            - "Diego: Hola. Compré estos auriculares hace una semana y ya no funcionan. | Здравствуйте. Я купил эти наушники неделю назад, а они уже не работают."
            - "Dependiente: ¿Tiene el tique? | Чек есть?"
            - "Diego: Sí, aquí está. | Да, вот."
            - "Dependiente: Tienen dos años de garantía. ¿Quiere otros iguales o prefiere el dinero? | На них гарантия два года. Хотите такие же или вернуть деньги?"
            - "Diego: Prefiero otros, pero de mejor calidad. ¿Cuáles son los mejores? | Лучше другие, но качественнее. Какие самые лучшие?"
            - "Dependiente: Estos son buenísimos, pero cuestan treinta euros más. | Эти очень хорошие, но стоят на тридцать евро дороже."
            - "Diego: Vale, me los llevo. ¿Y tienen cargadores para el portátil? | Хорошо, беру. А зарядки для ноутбука у вас есть?"
            - "Dependiente: Sí, están allí, al lado de los móviles. | Да, вон там, рядом с телефонами."
      - choose:
          title: Что сказано?
          source: auriculares
          skill: devolver
          items:
            - q: "¿Qué problema tienen los auriculares?"
              options: "Ya no funcionan. | Le quedan pequeños. | Son muy caros."
              explain: "Diego: …y ya no funcionan."
            - q: "¿Cuántos años de garantía tienen?"
              options: "Dos años. | Una semana. | Un año."
              explain: "Dependiente: Tienen dos años de garantía."
            - q: "¿Qué prefiere Diego?"
              options: "Otros auriculares de mejor calidad. | Su dinero. | Unos auriculares iguales."
              explain: "Diego: Prefiero otros, pero de mejor calidad."
            - q: "¿Dónde están los cargadores?"
              options: "Al lado de los móviles. | En la caja. | En otra tienda."
              explain: "Dependiente: Sí, están allí, al lado de los móviles."
      - note:
          id: ya_no_funciona
          slide: new
          text: "Если вещь сломалась, говорят: **no funciona** — «не работает», **está roto/a** — «сломан(а)». **Ya no funciona** — «уже не работает» (раньше работала)."
      - write:
          title: Скажите в магазине
          format: фраза по-испански
          free: true
          skill: devolver
          rule: ya_no_funciona
          items:
            - q: "Я купил этот ноутбук неделю назад, и он уже не работает."
              a: "Compré este portátil hace una semana y ya no funciona | Compré este portátil hace una semana(,) y ya no funciona"
              explain: "Hace una semana — неделю назад; ya no funciona — уже не работает."
              mistakes:
                "compré este portátil hace una semana y ya no funcionan": "Portátil — один: ya no **funciona**."
            - q: "Зарядка сломана."
              a: "El cargador está roto"
              explain: "Сломан — está roto."
              mistakes:
                "el cargador es roto": "Состояние — с **estar**: está roto."
      - choose:
          title: Послушайте
          free: true
          skill: devolver
          rule: ya_no_funciona
          items:
            - say: "Este portátil tiene dos años de garantía."
              options: "На этот ноутбук гарантия два года. | Этому ноутбуку два года. | Этот ноутбук сломался через два года."
              explain: "Dos años de garantía — «гарантия два года»."
              noaudio: {q: "Что значит «Este portátil tiene dos años de garantía»?", options: "На этот ноутбук гарантия два года. | Этому ноутбуку два года. | Этот ноутбук сломался через два года."}
      - build:
          title: Соберите фразу
          free: true
          skill: devolver
          rule: ya_no_funciona
          items:
            - es: "Estos auriculares ya no funcionan."
              ru: "Эти наушники уже не работают."
              extra: [funciona]

  - id: lectura
    kind: reading
    title: "Opiniones de clientes"
    goal: понять отзывы о покупке и написать свой
    version: 2
    vocab:
      - "🧑‍💼 el cliente / la clienta [клье́нтэ, клье́нта] — покупатель, клиент :: Los clientes están contentos. — Покупатели довольны."
      - "⭐ la estrella [эстрэ́йя] — звезда :: El hotel tiene cinco estrellas. — У гостиницы пять звёзд."
    blocks:
      - learn: [el cliente / la clienta, la estrella]
      - "Отзывы покупателей о ноутбуке в интернет-магазине."
      - reading:
          id: opiniones
          title: Opiniones de clientes
          text: |
            Cinco estrellas. Lucía: Es el mejor portátil que he tenido. Es ligerísimo y la batería dura muchísimo: diez horas. ¡Y no es carísimo! Lo llevo a la universidad todos los días.

            Tres estrellas. Pablo: La pantalla es buenísima, pero el portátil es un poco lento y hace mucho ruido. Mi portátil de antes era más rápido.

            Una estrella. Ana: ¡Horrible! Lo compré hace un mes y ya no funciona. La tienda me lo ha cambiado, pero el nuevo tiene el mismo problema. Quiero mi dinero.
          translation: |
            Пять звёзд. Лусия: Это лучший ноутбук из всех, что у меня были. Очень лёгкий, и батарея держит очень долго — десять часов. И он совсем не дорогой! Ношу его в университет каждый день.

            Три звезды. Пабло: Экран отличный, но ноутбук немного медленный и сильно шумит. Мой прежний был быстрее.

            Одна звезда. Ана: Ужасно! Купила месяц назад, а он уже не работает. Магазин мне его поменял, но у нового та же проблема. Хочу вернуть деньги.
      - choose:
          title: Что пишут покупатели?
          source: opiniones
          items:
            - q: "¿A quién le gusta más el portátil?"
              options: "A Lucía. | A Pablo. | A Ana."
              explain: "Lucía: Es el mejor portátil que he tenido. — пять звёзд."
              skill: superlativo
            - q: "¿Cuántas estrellas tiene la opinión de Pablo?"
              options: "Tres. | Cinco. | Una."
              explain: "Tres estrellas. Pablo: …"
            - q: "¿Qué clienta quiere su dinero?"
              options: "Ana. | Lucía. | Ninguna."
              explain: "Ana: Quiero mi dinero."
            - q: "¿Cuánto dura la batería, para Lucía?"
              options: "Diez horas. | Dos horas. | Un mes."
              explain: "…la batería dura muchísimo: diez horas."
            - q: "¿Qué no le gusta a Pablo?"
              options: "Es lento y hace mucho ruido. | La pantalla es mala. | Es carísimo."
              explain: "Pablo: …es un poco lento y hace mucho ruido."
            - q: "¿Qué quiere Ana?"
              options: "Su dinero. | Otro portátil igual. | Un cargador nuevo."
              explain: "Ana: Quiero mi dinero."
              skill: devolver
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: opiniones
          items:
            - q: "¿Cómo era el portátil de antes de Pablo?"
              a: "Más rápido | Era más rápido | Su portátil de antes era más rápido"
              explain: "Mi portátil de antes era más rápido."
              skill: comparar
            - q: "Как Лусия говорит, что батарея держит очень долго?"
              a: "la batería dura muchísimo"
              explain: "Muchísimo — «очень-очень много»."
              skill: superlativo
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "Es el mejor portátil que he tenido: ligerísimo y rapidísimo."
              options: "Это лучший ноутбук из всех, что у меня были: очень лёгкий и очень быстрый. | Это мой первый ноутбук: лёгкий и быстрый. | У меня был ноутбук получше, но тяжелее."
              explain: "El mejor que he tenido — «лучший из тех, что у меня были»."
              skill: superlativo
              noaudio: {q: "Что значит «Es el mejor portátil que he tenido: ligerísimo y rapidísimo»?", options: "Это лучший ноутбук из всех, что у меня были: очень лёгкий и очень быстрый. | Это мой первый ноутбук: лёгкий и быстрый. | У меня был ноутбук получше, но тяжелее."}
      - compose:
          title: Ваш отзыв
          free: true
          rule: none
          skill: [superlativo, comparar]
          items:
            - q: "Напишите отзыв о вещи, которую вы купили: сколько звёзд, что хорошо, что плохо, советуете ли. Три-пять фраз."
              format: "Cuatro estrellas. Es el mejor… pero… Lo recomiendo."
              words: [20, 80]
              sentences: 3
              checks:
                - label: "оценка: estrellas"
                  any: [estrella, estrellas]
                - label: "самый, -ísimo: el mejor, carísimo…"
                  re: "\\b(el|la|los|las) (mejor|mejores|peor|peores|más|menos)\\b|\\b\\w+ísim(o|a|os|as)\\b"
                - label: "совет: lo recomiendo, no lo recomiendo…"
                  any: [recomiendo, recomendamos, deberías, compra]
              sample: "Cuatro estrellas. Compré estos auriculares hace un mes. Son comodísimos y se oyen muy bien, pero la batería dura poco: solo cinco horas. Son más baratos que otros, por eso los recomiendo."
              sample_ru: "Четыре звезды. Купил эти наушники месяц назад. Очень удобные, слышно отлично, но батарея держит мало — всего пять часов. Они дешевле других, поэтому советую."

