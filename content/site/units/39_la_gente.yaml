  - id: lectura
    kind: reading
    title: "Mi compañera de piso"
    goal: понять рассказ о человеке и написать о своём друге
    version: 2
    vocab:
      - "🏠 el compañero / la compañera de piso [компанье́ро дэ пи́со] — сосед, соседка по квартире :: Mi compañera de piso es de Italia. — Моя соседка по квартире из Италии."
      - "🎭 la amistad [амиста́д] — дружба :: Nuestra amistad es muy importante para mí. — Наша дружба очень важна для меня."
    blocks:
      - learn: [el compañero / la compañera de piso, la amistad]
      - "Том пишет в блоге о соседке по квартире."
      - reading:
          id: sara
          title: Mi compañera de piso
          text: |
            Vivo en Madrid con Sara, mi compañera de piso. Es de Valencia y estudia en la universidad. Al principio no nos llevábamos muy bien: ella se levantaba muy temprano y yo escuchaba música por la noche. Discutíamos mucho por la cocina.

            Pero poco a poco la conocí mejor. Sara es muy sincera y generosa: cuando estoy enfermo, me hace la comida, y siempre me ayuda con el español. Es más paciente que mis profesores.

            Ahora somos muy buenos amigos. No nos parecemos nada: ella es tranquila y yo soy muy nervioso. Pero me cae genial. Este año ella está un poco preocupada por los exámenes, por eso yo cocino y lavo los platos. ¡Nuestra amistad me ha cambiado!
          translation: |
            Я живу в Мадриде с Сарой, соседкой по квартире. Она из Валенсии и учится в университете. Сначала мы не очень ладили: она вставала очень рано, а я слушал музыку по ночам. Мы часто ссорились из-за кухни.

            Но постепенно я узнал её лучше. Сара очень искренняя и щедрая: когда я болею, она готовит мне еду и всегда помогает с испанским. Она терпеливее моих преподавателей.

            Теперь мы очень хорошие друзья. Мы совсем не похожи: она спокойная, а я очень нервный. Но она мне страшно нравится. В этом году она немного волнуется из-за экзаменов, поэтому готовлю и мою посуду я. Наша дружба меня изменила!
      - choose:
          title: Что пишет Том?
          source: sara
          items:
            - q: "¿Quién es Sara?"
              options: "La compañera de piso de Tom. | La novia de Tom. | La profesora de Tom."
              explain: "Vivo en Madrid con Sara, mi compañera de piso."
            - q: "¿Qué ha cambiado a Tom?"
              options: "Su amistad con Sara. | Su trabajo. | La universidad."
              explain: "¡Nuestra amistad me ha cambiado!"
            - q: "¿Por qué discutían al principio?"
              options: "Por la cocina. | Por el dinero. | Por los exámenes."
              explain: "Discutíamos mucho por la cocina."
              skill: relaciones
            - q: "¿Cómo es Sara?"
              options: "Sincera, generosa y paciente. | Nerviosa y muy seria. | Seria y un poco antipática."
              explain: "Sara es muy sincera y generosa… Es más paciente que mis profesores."
              skill: caracter
            - q: "¿Se parecen Tom y Sara?"
              options: "No: ella es tranquila y él es nervioso. | Sí, mucho. | Sí: los dos son muy tranquilos."
              explain: "No nos parecemos nada: ella es tranquila y yo soy muy nervioso."
              skill: caracter
            - q: "¿Cómo está Sara este año?"
              options: "Un poco preocupada por los exámenes. | Muy enfadada con Tom por la música de la noche. | Muy aburrida."
              explain: "Este año ella está un poco preocupada por los exámenes."
              skill: ser_estar_adj
      - sort:
          title: Характер или состояние?
          source: sara
          skill: ser_estar_adj
          groups:
            "es": ["sincera", "generosa", "tranquila"]
            "está": ["preocupada", "enfermo (Tom)"]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: sara
          items:
            - q: "¿Dónde estudia Sara?"
              a: "En la universidad | Estudia en la universidad"
              explain: "Es de Valencia y estudia en la universidad."
            - q: "Как Том говорит, что Сара ему очень нравится?"
              a: "me cae genial"
              explain: "Me cae genial — «она мне страшно нравится»."
              skill: caer_parecer
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "Al principio no nos llevábamos bien, pero ahora somos muy buenos amigos."
              options: "Сначала мы не ладили, но теперь мы очень хорошие друзья. | Сначала мы дружили, а теперь поссорились. | Мы всегда были хорошими друзьями."
              explain: "No nos llevábamos bien — «мы не ладили»."
              skill: caracter
              noaudio: {q: "Что значит «Al principio no nos llevábamos bien, pero ahora somos muy buenos amigos»?", options: "Сначала мы не ладили, но теперь мы очень хорошие друзья. | Сначала мы дружили, а теперь поссорились. | Мы всегда были хорошими друзьями."}
      - compose:
          title: Мой друг
          free: true
          rule: none
          skill: [caracter, ser_estar_adj, caer_parecer]
          items:
            - q: "Напишите о друге или подруге, 50–90 слов: как вы познакомились · какой у него характер · похожи ли вы · ладите ли · как у него дела сейчас."
              format: "Mi mejor amiga se llama… Nos conocimos… Es… Nos llevamos… Ahora está…"
              words: [40, 120]
              sentences: 4
              checks:
                - label: "характер: es…"
                  any: [es, son]
                - label: "состояние: está…"
                  any: [está, están]
                - label: "отношения: nos llevamos, nos parecemos, me cae…"
                  any: [nos llevamos, nos parecemos, me cae, nos conocimos, nos conocemos]
              sample: "Mi mejor amiga se llama Marta. Nos conocimos en la universidad hace diez años. Es muy alegre y generosa, pero un poco nerviosa. No nos parecemos mucho: yo soy más tranquila. Pero nos llevamos genial y hablamos todos los días. Ahora está muy contenta: tiene un trabajo nuevo en Barcelona."
              sample_ru: "Мою лучшую подругу зовут Марта. Мы познакомились в университете десять лет назад. Она очень весёлая и щедрая, но немного нервная. Мы не очень похожи: я спокойнее. Но мы отлично ладим и разговариваем каждый день. Сейчас она очень довольна: у неё новая работа в Барселоне."

