id: la_gente
number: 39
level: A2
title: La gente — люди
goals:
  - описать характер и настроение человека
  - различать «какой он» и «как он сейчас»: ser и estar
  - сказать, как вы ладите и на кого похожи
  - дать оценку: кто вам нравится и что вы думаете о людях

# Тема 16 карты A2: ser / estar с прилагательными; parecerse, llevarse bien; me parece + прилагательное;
# характер и чувства. Миссия — рассказ о друге. В A1 (темы 9, 11) уже были внешность, simpático, tímido,
# divertido, contento, cansado, ser / estar.
lessons:
  - id: amiga
    kind: listening
    title: "Nos llevamos muy bien"
    goal: понять на слух рассказ о друге
    version: 2
    # Карта экранов: docs/site_slide_maps/39_la_gente.md
    vocab:
      - "🤝 llevarse bien [льэба́рсэ бьэн] — ладить :: Me llevo muy bien con mi hermana. — Я очень хорошо лажу с сестрой."
      - "👯 parecerse [парэθэ́рсэ] — быть похожим :: Me parezco a mi madre. — Я похож на маму."
      - "🎁 generoso/a [хэнэро́со, хэнэро́са] — щедрый :: Es muy generosa con sus amigos. — Она очень щедрая с друзьями."
      - "🧘 paciente [паθье́нтэ] — терпеливый :: Mi profesor es muy paciente. — Мой учитель очень терпеливый."
      - "😄 alegre [але́грэ] — весёлый, жизнерадостный {forms: alegres} :: Es una chica muy alegre. — Она очень весёлая девушка."
      - "🧠 el carácter [кара́ктэр] — характер :: Tiene buen carácter. — У него хороший характер."
    forms: [parezco, pareces, parece, parecemos, parecen]
    blocks:
      - "Диего спрашивает Ирину о её подруге. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: natalia
          hidden: true
          lines:
            - "Diego: Irina, ¿quién es la chica de la foto? | Ирина, кто эта девушка на фото?"
            - "Irina: Es Natalia, mi mejor amiga. Nos conocemos desde la escuela. | Это Наталья, моя лучшая подруга. Мы знаем друг друга со школы."
            - "Diego: ¿Y cómo es? | А какая она?"
            - "Irina: Es muy alegre y generosa: siempre ayuda a todo el mundo. Y es más paciente que yo. | Она очень весёлая и щедрая: всегда всем помогает. И терпеливее меня."
            - "Diego: ¿Os parecéis? | Вы похожи?"
            - "Irina: No mucho: ella es rubia y alta. Pero tenemos el mismo carácter, por eso nos llevamos tan bien. | Не очень: она светлая и высокая. Но характер у нас одинаковый, поэтому мы так хорошо ладим."
            - "Diego: ¿Y qué tal está ahora? | А как у неё сейчас дела?"
            - "Irina: Un poco triste: ella vive en Odesa y no nos vemos mucho. | Немного грустит: она живёт в Одессе, и мы редко видимся."
      - choose:
          title: Что вы поняли?
          source: natalia
          items:
            - q: "Кто такая Наталья?"
              options: "Su mejor amiga. | Su hermana. | Su compañera de trabajo."
              explain: "Irina: Es Natalia, mi mejor amiga."
            - q: "С каких пор они знакомы?"
              options: "Desde la escuela. | Desde el año pasado. | Desde la universidad."
              explain: "Irina: Nos conocemos desde la escuela."
      - learn: [llevarse bien, parecerse, generoso/a, paciente, alegre, el carácter]
      - choose:
          title: Детали разговора
          source: natalia
          items:
            - q: "¿Cómo es Natalia?"
              options: "Alegre, generosa y paciente. | Seria, tímida y trabajadora. | Alegre, pero muy impaciente."
              explain: "Irina: Es muy alegre y generosa… Y es más paciente que yo."
            - q: "¿Se parecen?"
              options: "No mucho: Natalia es rubia y alta. | Sí, mucho: las dos son rubias y muy altas. | No: Natalia es morena y baja."
              explain: "Irina: No mucho: ella es rubia y alta."
            - q: "¿Por qué se llevan tan bien?"
              options: "Porque tienen el mismo carácter. | Porque viven en una ciudad pequeña. | Porque trabajan juntas."
              explain: "Irina: …tenemos el mismo carácter, por eso nos llevamos tan bien."
            - q: "¿Cómo está Natalia ahora?"
              options: "Un poco triste. | Muy alegre y muy contenta. | Muy nerviosa."
              explain: "Irina: Un poco triste: ella vive en Odesa y no nos vemos mucho."
      - text:
          id: notice
          slide: new
          text: "Ирина говорит о характере с **ser**: _es alegre_, _es paciente_. А о настроении сейчас — с **estar**: _está un poco triste_. **Llevarse bien** и **parecerse** — возвратные: _nos llevamos bien_, _¿os parecéis?_"
      - examples:
          items:
            - "Natalia **es** muy alegre. — Наталья очень весёлая (по характеру)."
            - "Ahora **está** un poco triste. — Сейчас ей немного грустно."
            - "**Nos llevamos** muy bien. — Мы очень хорошо ладим."
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "generoso — щедрый"
            - "paciente — терпеливый"
            - "alegre — весёлый"
            - "el carácter — характер"
            - "llevarse bien — ладить"
            - "parecerse — быть похожим"
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: caracter
          rule: notice
          items:
            - say: "Nos llevamos muy bien porque tenemos el mismo carácter."
              a: "Nos llevamos muy bien porque tenemos el mismo carácter"
              explain: "Llevarse bien — «ладить»."
              noaudio: {q: "Напишите по-испански: «Мы очень хорошо ладим, потому что у нас одинаковый характер».", a: "Nos llevamos muy bien porque tenemos el mismo carácter"}
      - choose:
          title: Что ответить?
          free: true
          skill: caracter
          rule: notice
          items:
            - lines: ["Diego: ¿Te pareces a tu padre?"]
              q: "Скажите: да, очень."
              options: "Sí, me parezco mucho a él. | Sí, me parece mucho a mi padre. | Sí, parezco mucho a él."
              explain: "Parecerse — возвратный: me parezco a…"
            - say: "Mi hermano es muy paciente, pero hoy está muy nervioso."
              options: "Мой брат очень терпеливый, но сегодня он очень нервничает. | Мой брат очень нервный, но сегодня спокойный. | Мой брат сегодня очень терпелив."
              explain: "Es paciente — характер; está nervioso — состояние сейчас."
              noaudio: {q: "Что значит «Mi hermano es muy paciente, pero hoy está muy nervioso»?", options: "Мой брат очень терпеливый, но сегодня он очень нервничает. | Мой брат очень нервный, но сегодня спокойный. | Мой брат сегодня очень терпелив."}
      - build:
          title: Соберите фразу
          free: true
          skill: caracter
          rule: notice
          items:
            - es: "Me llevo muy bien con mi hermana."
              ru: "Я очень хорошо лажу с сестрой."
              extra: [llevamos]
            - es: "Es una chica alegre y generosa."
              ru: "Она весёлая и щедрая девушка."

  - id: ser_estar
    kind: grammar
    title: "Es aburrido o está aburrido?"
    goal: "различать характер и состояние: ser и estar"
    version: 2
    vocab:
      - "🧠 listo/a [ли́сто, ли́ста] — умный (ser); готовый (estar) :: Es muy lista. — Она очень умная. Ya estoy listo. — Я уже готов."
      - "😟 preocupado/a [прэокупа́до, прэокупа́да] — обеспокоенный :: Estoy preocupada por mi hijo. — Я волнуюсь за сына."
      - "😠 enfadado/a [энфада́до, энфада́да] — сердитый :: ¿Por qué estás enfadado? — Почему ты сердишься?"
      - "😌 orgulloso/a [оргульо́со, оргульо́са] — гордый :: Estoy muy orgullosa de ti. — Я очень горжусь тобой."
    blocks:
      - learn: [listo/a, preocupado/a, enfadado/a, orgulloso/a]
      - compare:
          id: ser_estar
          title: Ser и estar с прилагательными
          cards:
            - head: ser
              say: false
              label: "какой человек вообще: характер"
              tone: blue
              ex: ["Ana es muy alegre. — Ана очень весёлая (по характеру)."]
            - head: estar
              say: false
              label: "какой он сейчас: настроение, состояние"
              tone: sun
              ex: ["Ana está triste hoy. — Ане сегодня грустно."]
      - choose:
          title: Ser или estar?
          skill: ser_estar_adj
          rule: ser_estar
          items:
            - q: "Mi abuelo ___ muy generoso: siempre nos ayuda."
              options: "es | está | estaba"
              explain: "Характер — ser."
            - q: "Hoy no puedo salir: ___ muy cansada."
              options: "estoy | soy | somos"
              explain: "Состояние сейчас — estar."
            - q: "¿Por qué ___ enfadado? ¿Qué ha pasado?"
              options: "estás | eres | estamos"
              explain: "Сердиться — состояние: estás enfadado."
      - table:
          id: cambia
          slide: new
          title: Меняется смысл
          rows:
            - ["ser aburrido — скучный (человек, фильм)", "estar aburrido — скучать (сейчас)"]
            - ["ser listo — умный", "estar listo — готовый"]
            - ["ser malo — плохой", "estar malo — больной (разг.)"]
            - ["ser rico — богатый", "estar rico — вкусный (о еде)"]
      - choose:
          title: Что это значит?
          skill: ser_estar_adj
          rule: cambia
          items:
            - q: "La paella ___ muy rica."
              options: "está | es | estaban"
              explain: "Вкусная (сейчас, эта паэлья) — está rica."
            - q: "Esta película ___ aburrida: no me gusta."
              options: "es | está | estoy"
              explain: "Скучный фильм — es aburrida."
            - q: "¿___ listo? Nos vamos ya."
              options: "Estás | Eres | Estabais"
              explain: "Готов — estar listo."
            - say: "Mi hermana es muy lista, pero hoy está preocupada por el examen."
              options: "Моя сестра очень умная, но сегодня волнуется из-за экзамена. | Моя сестра готова к экзамену и не волнуется. | Моя сестра волнуется, потому что она не очень умная."
              explain: "Es lista — умная; está preocupada — волнуется сейчас."
              noaudio: {q: "Что значит «Mi hermana es muy lista, pero hoy está preocupada por el examen»?", options: "Моя сестра очень умная, но сегодня волнуется из-за экзамена. | Моя сестра готова к экзамену и не волнуется. | Моя сестра волнуется, потому что она не очень умная."}
      - write:
          title: Ser или estar
          format: одна форма
          skill: ser_estar_adj
          rule: cambia
          items:
            - q: "Mi madre (estar) ___ muy orgullosa de mí."
              a: "está"
              explain: "Чувство сейчас — estar."
              mistakes:
                "es": "Гордость сейчас — чувство: **está** orgullosa."
            - q: "Tom (ser) ___ muy listo: aprende rápido."
              a: "es"
              explain: "Умный — ser listo."
              mistakes:
                "está": "Está listo — «готов». Умный — **es** listo."
            - q: "Los niños (estar) ___ aburridos: quieren salir."
              a: "están"
              explain: "Скучают сейчас — están aburridos."
      - build:
          title: Соберите фразу
          skill: ser_estar_adj
          rule: ser_estar
          items:
            - es: "Normalmente es muy alegre, pero hoy está triste."
              ru: "Обычно он очень весёлый, но сегодня грустный."
              extra: [son]
      - compose:
          title: О себе
          skill: ser_estar_adj
          rule: ser_estar
          items:
            - q: "Опишите себя: какой вы по характеру и какое у вас настроение сегодня. Две фразы."
              format: "Soy… Hoy estoy…"
              words: [6, 40]
              sentences: 2
              checks:
                - label: "характер: soy…"
                  any: [soy]
                - label: "состояние сейчас: estoy…"
                  any: [estoy]
              sample: "Soy bastante tranquila y paciente. Hoy estoy un poco cansada, pero contenta: es viernes."
              sample_ru: "Я довольно спокойная и терпеливая. Сегодня я немного устала, но довольна: пятница."
    quiz:
      - q: "Esta sopa ___ muy rica."
        options: "está | es | estoy"
        explain: "Вкусная (о еде) — estar rico."
        skill: ser_estar_adj
      - q: "Mi jefe ___ muy serio, pero simpático."
        options: "es | está | estuvo"
        explain: "Характер — ser."
        skill: ser_estar_adj

  - id: me_cae
    kind: grammar
    title: "Me cae bien, me parece simpático"
    goal: сказать, кто вам нравится как человек и что вы о ком думаете
    version: 2
    vocab:
      - "😊 caer bien / caer mal [каэ́р бьэн, маль] — нравиться / не нравиться (о людях) :: Tu hermano me cae muy bien. — Твой брат мне очень симпатичен."
      - "🤔 parecer [парэθэ́р] — казаться :: Me parece muy simpático. — Он мне кажется очень симпатичным."
      - "🗣 sincero/a [синθэ́ро, синθэ́ра] — искренний, честный :: Es una amiga muy sincera. — Она очень искренняя подруга."
      - "🎩 educado/a [эдука́до, эдука́да] — вежливый, воспитанный :: Tus hijos son muy educados. — Твои дети очень вежливые."
    blocks:
      - learn: ["caer bien / caer mal", parecer, sincero/a, educado/a]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "caer bien — нравиться (о людях)"
            - "caer mal — не нравиться (о людях)"
            - "parecer — казаться"
            - "sincero — искренний"
            - "educado — вежливый"
      - table:
          id: como_gustar
          title: Как gustar
          rows:
            - ["me cae bien / me caen bien", "Ana me cae muy bien. — Ана мне очень нравится (как человек)."]
            - ["me parece + прилагательное", "Tu jefe me parece muy serio. — Твой начальник кажется мне очень серьёзным."]
            - ["me parece que…", "Me parece que está enfadado. — Мне кажется, что он сердится."]
      - note:
          id: cae_bien
          text: "О людях испанцы чаще говорят не _me gusta_, а **me cae bien**: _me gusta_ о человеке звучит как «он мне нравится» в романтическом смысле. Как и gustar: _me cae bien Ana_, но _me caen bien tus amigos_."
      - choose:
          title: Выберите форму
          skill: caer_parecer
          rule: como_gustar
          items:
            - q: "Tus amigos me ___ muy bien."
              options: "caen | cae | caigo"
              explain: "Tus amigos — мн. ч.: me caen."
            - q: "¿Qué te ___ mi novio?"
              options: "parece | pareces | parezco"
              explain: "Что ты думаешь о… — ¿Qué te parece…?"
            - q: "Me parece ___ no está contento con su trabajo."
              options: "que | de | como"
              explain: "Me parece que… — «мне кажется, что…»"
            - say: "Tu compañero me cae bien: es muy educado y sincero."
              options: "Твой коллега мне симпатичен: он очень вежливый и искренний. | Твой коллега мне не нравится: он невежливый и не очень искренний. | Мне кажется, твой коллега не очень искренний."
              explain: "Me cae bien — «он мне симпатичен»."
              noaudio: {q: "Что значит «Tu compañero me cae bien: es muy educado y sincero»?", options: "Твой коллега мне симпатичен: он очень вежливый и искренний. | Твой коллега мне не нравится: он невежливый и не очень искренний. | Мне кажется, твой коллега не очень искренний."}
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: caer_parecer
          rule: como_gustar
          items:
            - q: "Твоя сестра мне очень нравится (как человек)."
              a: "Tu hermana me cae muy bien | Me cae muy bien tu hermana"
              explain: "О людях — me cae bien."
              mistakes:
                "tu hermana me caes muy bien": "Сестра — она: me **cae** bien."
            - q: "Он кажется мне очень серьёзным."
              a: "Me parece muy serio | (Él) me parece muy serio"
              explain: "Me parece + прилагательное."
            - q: "Мне кажется, что она грустит."
              a: "Me parece que está triste | Me parece que (ella) está triste"
              explain: "Me parece que + estar."
      - build:
          title: Соберите фразу
          skill: caer_parecer
          rule: cae_bien
          items:
            - es: "Tus amigos me caen muy bien."
              ru: "Твои друзья мне очень нравятся."
              extra: [cae]
      - compose:
          title: Ваше мнение
          skill: caer_parecer
          rule: como_gustar
          items:
            - q: "Расскажите о двух людях из вашей жизни: кто вам симпатичен и каким он вам кажется."
              format: "Mi vecino me cae… Me parece…"
              words: [8, 45]
              sentences: 2
              checks:
                - label: "me cae / me caen…"
                  any: [me cae, me caen]
                - label: "me parece…"
                  any: [me parece, me parecen]
              sample: "Mi nueva compañera de trabajo me cae muy bien: es alegre y educada. Mi vecino me parece un poco serio, pero es muy amable."
              sample_ru: "Моя новая коллега мне очень симпатична: она весёлая и вежливая. Сосед кажется мне немного серьёзным, но он очень любезный."
    quiz:
      - q: "Tus padres me ___ muy bien."
        options: "caen | cae | gustan mucho"
        explain: "О людях, мн. ч. — me caen bien."
        skill: caer_parecer
      - q: "¿Qué te ___ la nueva profesora?"
        options: "parece | parecen | pareces"
        explain: "¿Qué te parece + ед. ч.?"
        skill: caer_parecer

  - id: pareja
    kind: dialogue
    title: "¿Cómo os conocisteis?"
    goal: "рассказать об отношениях: знакомство, ссоры, свадьба"
    version: 2
    vocab:
      - "💑 la pareja [парэ́ха] — пара; партнёр :: Vivo con mi pareja. — Я живу со своим партнёром."
      - "😍 enamorarse [энаморарсэ] — влюбиться :: Me enamoré de él en un viaje. — Я влюбилась в него в поездке."
      - "🗯 discutir [дискути́р] — спорить, ссориться :: A veces discutimos, pero nos queremos. — Иногда мы ссоримся, но любим друг друга."
      - "💔 separarse [сэпара́рсэ] — расстаться, развестись :: Mis tíos se separaron el año pasado. — Мои дядя и тётя развелись в прошлом году."
      - "🤞 la confianza [конфья́нθа] — доверие :: En una pareja, la confianza es muy importante. — В паре очень важно доверие."
    blocks:
      - learn: [la pareja, enamorarse, discutir, separarse, la confianza]
      - "Олга спрашивает Лусию о её женихе Пабло."
      - dialogue:
          id: lucia_pablo
          lines:
            - "Olga: Lucía, ¿cómo os conocisteis Pablo y tú? | Лусия, как вы с Пабло познакомились?"
            - "Lucía: En un viaje a Granada, hace cuatro años. Estábamos en el mismo grupo. | В поездке в Гранаду, четыре года назад. Мы были в одной группе."
            - "Olga: ¿Y te enamoraste el primer día? | И ты влюбилась в первый же день?"
            - "Lucía: ¡No! Al principio me parecía un poco serio. Pero luego me cayó muy bien: es muy sincero y divertido. | Нет! Сначала он мне казался немного серьёзным. Но потом очень понравился: он очень искренний и весёлый."
            - "Olga: ¿Y nunca discutís? | И вы никогда не ссоритесь?"
            - "Lucía: Claro que sí, a veces. Pero tenemos mucha confianza y siempre hablamos de todo. | Конечно, иногда. Но мы очень доверяем друг другу и всегда обо всём говорим."
            - "Olga: ¡Qué bonito! ¿Y cuándo es la boda? | Как мило! А когда свадьба?"
            - "Lucía: En junio. ¡Te invito! | В июне. Приглашаю тебя!"
      - choose:
          title: Что сказано?
          source: lucia_pablo
          skill: relaciones
          items:
            - q: "¿Dónde se conocieron Lucía y Pablo?"
              options: "En un viaje a Granada. | En el trabajo. | En la universidad."
              explain: "Lucía: En un viaje a Granada, hace cuatro años."
            - q: "¿Qué le parecía Pablo al principio?"
              options: "Un poco serio. | Muy divertido. | Muy tímido."
              explain: "Lucía: Al principio me parecía un poco serio."
              skill: caer_parecer
