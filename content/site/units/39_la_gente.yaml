              a: "Nos conocimos en Madrid | (Nosotros) nos conocimos en Madrid"
              explain: "Познакомились — nos conocimos."
              mistakes:
                "conocimos en madrid": "«Познакомились друг с другом» — с местоимением: **nos** conocimos."
            - q: "Они расстались в прошлом году."
              a: "Se separaron el año pasado | El año pasado se separaron"
              explain: "Расстались — se separaron."
      - choose:
          title: Послушайте
          free: true
          skill: relaciones
          rule: reciprocos
          items:
            - say: "Nos conocimos en un viaje y nos enamoramos ese mismo verano."
