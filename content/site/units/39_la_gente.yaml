              explain: "Nos enamoramos — «мы влюбились»; ese mismo verano — «тем же летом»."
              noaudio: {q: "Что значит «Nos conocimos en un viaje y nos enamoramos ese mismo verano»?", options: "Мы познакомились в поездке и влюбились тем же летом. | Мы ездили в поездку и тем же летом поссорились. | Мы познакомились давно, а влюбились друг в друга гораздо позже."}
      - build:
          title: Соберите фразу
          free: true
          skill: relaciones
          rule: reciprocos
          items:
            - es: "En una pareja, la confianza es muy importante."
              ru: "В паре очень важно доверие."
      - compose:
          title: Как они познакомились
          free: true
          skill: [relaciones, fondo_hechos]
          rule: reciprocos
          items:
            - q: "Расскажите, как познакомились вы с другом или подругой (или ваши родители): где, когда, какое было первое впечатление."
              format: "Nos conocimos en… Al principio me parecía…"
              words: [15, 70]
