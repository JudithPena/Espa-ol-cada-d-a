      - note:
          id: reciprocos
          slide: new
          text: "«Друг друга» по-испански — возвратное местоимение во множественном числе: **nos** conocimos — «мы познакомились», **os** conocisteis — «вы познакомились», **se** separaron — «они расстались»."
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          free: true
          skill: relaciones
          rule: reciprocos
          items:
