id: hora
number: 15
level: A1
title: Время и дни недели
goals:
  - назвать дни недели
  - спросить и сказать, который час
  - договориться о времени: во сколько что начинается и заканчивается

lessons:
  - id: dias
    kind: vocab
    title: Дни недели
    goal: назвать дни недели и сказать «в понедельник» и «по понедельникам»
    version: 3
    vocab:
      - "1️⃣ el lunes [лу́нэс] — понедельник"
      - "2️⃣ el martes [ма́ртэс] — вторник"
      - "3️⃣ el miércoles [мьэ́рколэс] — среда"
      - "4️⃣ el jueves [хуэ́бэс] — четверг"
      - "5️⃣ el viernes [бьэ́рнэс] — пятница"
      - "6️⃣ el sábado [са́бадо] — суббота"
      - "7️⃣ el domingo [доми́нго] — воскресенье"
      - "🗓 la semana [сэма́на] — неделя"
    blocks:
      - "Дни недели пишутся с маленькой буквы: **lunes**, **martes**, **sábado**."
      - learn: [el lunes, el martes, el miércoles, el jueves]
      - choose:
          title: Выберите
          skill: days
          items:
            - q: "Какой день идёт после miércoles?"
              options: "jueves | martes | lunes"
      - learn: [el viernes, el sábado, el domingo, la semana]
      - match:
          title: Соедините пары
          pairs:
            - "el lunes — понедельник"
            - "el martes — вторник"
            - "el viernes — пятница"
            - "el sábado — суббота"
            - "el domingo — воскресенье"
            - "la semana — неделя"
      - compare:
          id: el_los
          cards:
            - head: el lunes
              label: в (этот) понедельник
              tone: blue
              ex: ["El lunes voy al médico."]
            - head: los lunes
              label: по понедельникам
              tone: sun
              ex: ["Los lunes trabajo en casa."]
          note: "Предлог не нужен: _el lunes_, а не `en el lunes`. Дни на `-s` во множественном не меняются: _los martes_; а _sábado_ и _domingo_ получают `-s`: _los sábados_, _los domingos_."
      - choose:
          title: Выберите
          skill: days
          items:
            - q: "Каждую субботу я езжу в горы."
              options: "Los sábados voy a la montaña. | El sábado voy a la montaña. | En sábado voy a la montaña."
            - say: "El domingo comemos con mis padres."
              options: "В воскресенье мы обедаем с родителями. | По воскресеньям мы ужинаем с родителями. | В субботу мы обедаем с родителями."
              noaudio: {q: "Что значит «El domingo comemos con mis padres»?", options: "В воскресенье мы обедаем с родителями. | По воскресеньям мы ужинаем с родителями. | В субботу мы обедаем с родителями."}
      - write:
          title: Traduce
          format: день недели с артиклем
          skill: days
          items:
            - q: "в среду"
              a: "el miércoles"
              mistakes: {"en el miércoles": "Предлог не нужен: **el miércoles**."}
            - q: "по воскресеньям"
              a: "los domingos"
              mistakes: {"los domingo": "domingo во множественном получает -s: **los domingos**.", "el domingo": "el domingo — «в это воскресенье». По воскресеньям — **los domingos**."}
            - q: "Сегодня понедельник."
              a: "Hoy es lunes | Es lunes"
              format: фраза по-испански
              rule: none
              mistakes: {"hoy es el lunes": "После **hoy es** день называют без артикля: Hoy es lunes."}

  - id: hora
    kind: grammar
    title: ¿Qué hora es?
    goal: сказать и понять на слух, который час
    version: 3
    vocab:
      - "🕐 ¿Qué hora es? [кэ о́ра эс] — который час?"
      - "⏱ la hora [о́ра] — час; время (на часах)"
      - "🎯 en punto [эн пу́нто] — ровно"
      - "🕧 y media [и мэ́дья] — половина (… и тридцать)"
      - "🕒 y cuarto [и куа́рто] — четверть (… и пятнадцать)"
      - "🕘 menos cuarto [мэ́нос куа́рто] — без четверти"
      - "➖ menos [мэ́нос] — без, минус"
    blocks:
      - "Почему в первом примере **es la**, а во втором **son las**?"
      - examples:
          items:
            - "Es la una. — Час."
            - "Son las dos. — Два часа."
      - learn: ["¿Qué hora es?", la hora, en punto]
      - rule:
          id: es_son
          text: "Час — один, поэтому **Es la una**. Все остальные часы — множественное число: **Son las…**: _Son las dos_, _Son las diez en punto_."
      - choose:
          title: "¿Qué hora es?"
          skill: time
          items:
            - q: "1:00"
              options: "Es la una. | Son las una. | Es una."
            - q: "Как спросить «Который час?»"
              options: "¿Qué hora es? | ¿Qué es la hora? | ¿Cómo es la hora?"
      - learn: [y media, y cuarto, menos cuarto, menos]
      - compare:
          id: y_menos
          cards:
            - head: y
              say: false
              label: до половины — прибавляем
              tone: blue
              ex: ["Son las ocho y cinco. — 8:05", "Son las dos y cuarto. — 2:15", "Son las tres y media. — 3:30"]
            - head: menos
              say: false
              label: после половины — вычитаем из следующего часа
              tone: sun
              ex: ["Son las diez menos cinco. — 9:55", "Son las cinco menos cuarto. — 4:45"]
      - write:
          title: "¿Qué hora es?"
          format: время словами
          skill: time
          items:
            - {q: "7:00", a: "Son las siete | Son las siete en punto", rule: es_son}
            - q: "1:30"
              a: "Es la una y media"
              rule: es_son
              mistakes: {"son las una y media": "Час один — **Es la una** y media."}
            - q: "10:15"
              a: "Son las diez y cuarto | Son las diez y quince"
              explain: "В Испании обычно говорят **y cuarto**; y quince тоже верно."
            - q: "4:25"
              a: "Son las cuatro y veinticinco"
              explain: "Десятки и 21–29 вы знаете с темы «Числа»: y veinticinco — «двадцать пять минут»."
            - q: "6:35"
              a: "Son las siete menos veinticinco"
              explain: "После половины — минуты до следующего часа: без двадцати пяти семь."
            - q: "5:45"
              a: "Son las seis menos cuarto"
              explain: "После половины минуты вычитают из следующего часа: шесть без четверти."
              mistakes: {"son las cinco menos cuarto": "Cinco menos cuarto — это 4:45. Для 5:45 вычитаем из шести: **Son las seis menos cuarto**."}
            - q: "3:50"
              a: "Son las cuatro menos diez"
              mistakes: {"son las tres menos diez": "Tres menos diez — это 2:50. Для 3:50 вычитаем из четырёх: **Son las cuatro menos diez**."}
      - choose:
          title: Послушайте и выберите
          skill: time_ear
          items:
            - say: "Son las nueve menos cuarto."
              options: "8:45 | 9:15 | 9:45"
              noaudio: {q: "Который час: «Son las nueve menos cuarto»?", options: "8:45 | 9:15 | 9:45"}
              explain: "Nueve menos cuarto — без четверти девять, то есть 8:45."

  - id: a_que_hora
    kind: grammar
    title: ¿A qué hora...?
    goal: сказать, во сколько что-то начинается и заканчивается
    version: 3
    vocab:
      - "❓ ¿A qué hora...? [а кэ о́ра] — во сколько...? :: ¿A qué hora comes? — Во сколько ты обедаешь?"
      - "📚 la clase [кла́сэ] — урок, занятие"
      - "▶️ empezar [эмпэθа́р] — начинать(ся) {forms: empieza empiezan} :: La clase empieza a las nueve. — Урок начинается в девять."
      - "⏹ terminar [тэрмина́р] — заканчивать(ся)"
      - "🌅 por la mañana [пор ла манья́на] — утром"
      - "🌇 por la tarde [пор ла та́рдэ] — днём, после обеда; вечером"
      - "🌙 por la noche [пор ла но́чэ] — вечером, ночью"
    blocks:
      - "Как сказать, **во сколько** что-то происходит? Найдите маленькое слово перед временем."
      - examples:
          items:
            - "¿A qué hora comes? Como a las dos. — Во сколько ты обедаешь? В два."
            - "La clase empieza a las nueve y termina a las once. — Урок начинается в девять и заканчивается в одиннадцать."
      - learn: ["¿A qué hora...?", la clase, empezar, terminar]
      - rule:
          id: a_las
          text: "«Во сколько?» — **a** + время: _Como **a la una**._ _La clase empieza **a las dos**._"
      - note:
          id: empieza
          text: "**empezar** меняет гласную в корне: _La clase empieza_, _Las clases empiezan_. Почему — разберём в следующей теме."
      - choose:
          title: Выберите
          rule: a_las
          skill: a_que_hora
          items:
            - q: "La clase empieza ___ las nueve."
              options: "a | en | de"
      - learn: [por la mañana, por la tarde, por la noche]
      - compare:
          id: de_por
          cards:
            - head: a las siete de la mañana
              label: точное время + часть суток
              tone: blue
              ex: ["Ceno a las nueve de la noche."]
            - head: por la mañana
              label: просто «утром», без точного времени
              tone: mint
              ex: ["Por la tarde voy al parque."]
      - choose:
          title: Выберите
          skill: a_que_hora
          items:
            - q: "☀️ 10:00 — ¿por la mañana, por la tarde o por la noche?"
              options: "Por la mañana. | Por la tarde. | Por la noche."
            - q: "🌙 23:00 — ¿por la mañana, por la tarde o por la noche?"
              options: "Por la noche. | Por la tarde. | Por la mañana."
            - q: "Ceno a las nueve ___ noche."
              options: "de la | por la | en la"
            - q: "___ la mañana trabajo y por la tarde estudio."
              options: "Por | De | A"
      - write:
          title: Traduce
          format: фраза по-испански
          skill: a_que_hora
          items:
            - q: "Я завтракаю в семь утра."
              a: "Desayuno a las siete de la mañana | (Yo) desayuno a las siete( de la mañana)"
              mistakes: {"desayuno a las siete por la mañana": "С точным временем — **de la mañana**: a las siete de la mañana."}
            - q: "Занятие заканчивается в час."
              a: "La clase termina a la una"
              rule: a_las
              mistakes: {"la clase termina a las una": "Час один: **a la una**."}
      - build:
          title: Соберите фразу
          rule: a_las
          skill: a_que_hora
          items:
            - es: "¿A qué hora empieza la película?"
              ru: "Во сколько начинается фильм?"
              extra: [en]
      - choose:
          title: Послушайте и выберите
          skill: a_que_hora
          items:
            - say: "Ceno a las nueve de la noche."
              options: "Я ужинаю в девять вечера. | Я ужинаю в девять утра. | Я обедаю в девять вечера."
              noaudio: {q: "Что значит «Ceno a las nueve de la noche.»?", options: "Я ужинаю в девять вечера. | Я ужинаю в девять утра. | Я обедаю в девять вечера."}
            - say: "¿A qué hora terminas?"
              options: "Во сколько ты заканчиваешь? | Во сколько ты начинаешь? | Сколько сейчас времени?"
              noaudio: {q: "Что значит «¿A qué hora terminas?»?", options: "Во сколько ты заканчиваешь? | Во сколько ты начинаешь? | Сколько сейчас времени?"}

  - id: horarios
    kind: dialogue
    title: Часы работы
    goal: узнать часы работы и понять ответ
    version: 3
    vocab:
      - "🔒 cerrar [θэрра́р] — закрывать(ся) {forms: cierra cierran}"
      - "🟢 abierto/a [абьэ́рто, абьэ́рта] — открытый, открыто"
      - "🔴 cerrado/a [θэрра́до, θэрра́да] — закрытый, закрыто"
      - "🔁 todos los días [то́дос лос ди́ас] — каждый день"
      - "↔️ de... a... [дэ... а...] — с... до... :: de lunes a viernes — с понедельника по пятницу"
    blocks:
      - learn: [cerrar, abierto/a, cerrado/a]
      - choose:
          title: Выберите
          skill: opening_hours
          items:
            - q: "Los lunes el museo está ___. (закрыт)"
              options: "cerrado | abierto | cierra"
            - q: "La farmacia está ___. (открыта)"
              options: "abierta | abierto | cerrada"
      - learn: [todos los días, de... a...]
      - "Уго звонит в музей. Как он спрашивает о часах работы?"
      - dialogue:
          id: museo
          lines:
            - "Hugo: Buenos días. ¿A qué hora abre el museo? | Доброе утро. Во сколько открывается музей?"
            - "Recepcionista: Abre a las diez de la mañana. | Открывается в десять утра."
            - "Hugo: ¿Y a qué hora cierra? | А во сколько закрывается?"
            - "Recepcionista: Cierra a las ocho de la tarde. | Закрывается в восемь вечера."
            - "Hugo: ¿Abre todos los días? | Он работает каждый день?"
            - "Recepcionista: De martes a domingo. Los lunes está cerrado. | Со вторника по воскресенье. По понедельникам закрыт."
            - "Hugo: ¡Vaya! Hoy es lunes. | Вот как! Сегодня понедельник."
            - "Recepcionista: Sí, pero mañana está abierto. | Да, но завтра открыт."
            - "Hugo: Vale, gracias. ¡Hasta luego! | Хорошо, спасибо. До свидания!"
      - culture: "Во многих испанских городах магазины закрываются на обед примерно с 14 до 17 часов — это время **la siesta**. Зато вечером работают до 21–22 часов."
      - choose:
          title: Responde
          source: museo
          items:
            - q: "¿A qué hora abre el museo?"
              options: "A las diez de la mañana. | A las ocho de la tarde. | A las doce."
            - q: "¿Abre el museo todos los días?"
              options: "No, de martes a domingo. | Sí, todos los días. | Sí, de lunes a domingo."
            - q: "¿Qué día está cerrado?"
              options: "El lunes. | El martes. | El domingo."
      - mission:
          id: library
          title: Библиотека в субботу
          text: "Вы хотите позаниматься в библиотеке в выходные. Позвоните и узнайте часы работы."
      - choose:
          source: library
          skill: opening_hours
          items:
            - lines: ["Recepcionista: Los sábados abre a las nueve y media y cierra a las dos."]
              q: "Когда библиотека работает в субботу?"
              options: "с 9:30 до 14:00 | с 9:30 до 2 часов ночи | с 10:30 до 14:00"
      - write:
          source: library
          skill: opening_hours
          items:
            - q: "Спросите: «А в воскресенье она открыта?»"
              a: "¿Y el domingo está abierta? | ¿Está abierta el domingo? | ¿Y el domingo? ¿Está abierta? | ¿Abre el domingo? | ¿Y el domingo abre?"
              format: вопрос по-испански
              explain: "La biblioteca женского рода — abierta."
              mistakes: {"¿y el domingo está abierto?": "La biblioteca — женского рода: **abierta**.", "¿está abierto el domingo?": "La biblioteca — женского рода: **abierta**."}
      - choose:
          source: library
          items:
            - lines: ["Recepcionista: No, los domingos está cerrada."]
              options: "Vale, gracias. ¡Hasta el sábado! | ¡Qué bien! Voy el domingo. | De nada."
      - choose:
          title: Послушайте и выберите
          free: true
          skill: opening_hours
          items:
            - say: "El museo está cerrado los lunes."
              options: "По понедельникам музей закрыт. | По понедельникам музей открыт. | По воскресеньям музей закрыт."
              noaudio: {q: "Что значит «El museo está cerrado los lunes.»?", options: "По понедельникам музей закрыт. | По понедельникам музей открыт. | По воскресеньям музей закрыт."}
            - say: "Abre de lunes a viernes."
              options: "Открыто с понедельника по пятницу. | Открыто с пятницы по понедельник. | Закрыто с понедельника по пятницу."
              noaudio: {q: "Что значит «Abre de lunes a viernes.»?", options: "Открыто с понедельника по пятницу. | Открыто с пятницы по понедельник. | Закрыто с понедельника по пятницу."}
    forms: [siesta]

  - id: escucha
    kind: listening
    title: Который час?
    goal: понимать время на слух
    version: 2
    blocks:
      - write:
          title: Послушайте и запишите
          format: время цифрами, например 7:30
          answer: time
          skill: time_ear
          items:
            - say: "Son las tres y media."
              a: "3:30 | 15:30"
              noaudio: {q: "Запишите цифрами: Son las tres y media.", a: "3:30 | 15:30"}
            - say: "Es la una y cuarto."
              a: "1:15 | 13:15"
              noaudio: {q: "Запишите цифрами: Es la una y cuarto.", a: "1:15 | 13:15"}
            - say: "Son las nueve menos cuarto."
              a: "8:45 | 20:45"
              noaudio: {q: "Запишите цифрами: Son las nueve menos cuarto.", a: "8:45 | 20:45"}
              explain: "Nueve menos cuarto — без четверти девять: 8:45."
            - say: "Son las once en punto."
              a: "11:00 | 23:00 | 11"
              noaudio: {q: "Запишите цифрами: Son las once en punto.", a: "11:00 | 23:00 | 11"}
            - say: "Son las siete menos diez."
              a: "6:50 | 18:50"
              noaudio: {q: "Запишите цифрами: Son las siete menos diez.", a: "6:50 | 18:50"}
              explain: "Siete menos diez — без десяти семь: 6:50."

  - id: quiz
    kind: quiz
    title: Время и дни недели
    goal: назвать дни недели, сказать, который час, и договориться о времени
    version: 3
    check: soft
    blocks:
      - "Тест по теме «Время и дни недели»."
      - cando:
          - "назвать дни недели и сказать «в понедельник», «по понедельникам»"
          - "сказать, который час: Son las tres y media"
          - "спросить и сказать, во сколько: ¿A qué hora...? — A las..."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "el jueves — четверг"
            - "la semana — неделя"
            - "en punto — ровно"
            - "terminar — заканчивать(ся)"
            - "cerrado — закрыто"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          items:
            - q: "Скажите: «Занятие начинается в девять утра»."
              a: "La clase empieza a las nueve( de la mañana)"
              skill: a_que_hora
              mistakes: {"la clase empieza en las nueve": "«Во сколько» — **a las**: a las nueve."}
            - q: "Спросите: «Во сколько закрывается аптека?»"
              a: "¿A qué hora cierra la farmacia? | ¿La farmacia a qué hora cierra?"
              skill: a_que_hora
              mistakes: {"a que hora cerra la farmacia": "у cerrar `e` меняется на `ie`: **cierra**."}
    quiz:
      - q: Как сказать «1:00»?
        options: "Es la una. | Son las una. | Es una."
        skill: time
      - q: "10:45 — ..."
        options: "Son las once menos cuarto. | Son las diez y cuarto. | Son las diez menos cuarto."
        skill: time
      - q: Как сказать «по субботам»?
        options: "los sábados | el sábado | en sábado"
        skill: days
      - q: "La clase empieza ___ las nueve."
        options: "a | en | de"
        skill: a_que_hora
      - q: Какой день идёт после «miércoles»?
        options: "jueves | martes | viernes"
        skill: days
