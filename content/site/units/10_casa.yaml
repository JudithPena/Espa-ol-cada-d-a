id: casa
number: 10
level: A1
title: Мой дом
goals:
  - описать квартиру или дом
  - сказать, где что находится
  - различать hay и está

lessons:
  - id: vocab1
    kind: vocab
    title: Комнаты
    goal: назвать комнаты в квартире
    version: 3
    vocab:
      - "🏢 el piso [пи́со] — квартира; этаж"
      - "🚪 la habitación [абитаθьо́н] — комната; спальня"
      - "🛏 el dormitorio [дормито́рьо] — спальня"
      - "🐘 grande [гра́ндэ] — большой {pos: adj}"
      - "🛋 el salón [сало́н] — гостиная"
      - "🍳 la cocina [коθи́на] — кухня"
      - "🛁 el baño [ба́ньо] — ванная; туалет"
      - "🌇 el balcón [балько́н] — балкон"
    blocks:
      - "В Испании большинство людей живёт не в отдельных домах, а в квартирах. Квартира по-испански — **el piso**."
      - more:
          title: cocina, cocinar, cocinero
          text: "**la cocina** («кухня») родственна **cocinar** («готовить») и **cocinero** («повар»): _Cocino en la cocina._ А в Латинской Америке квартиру обычно называют **el departamento** или **el apartamento**, а спальню — **el cuarto**."
      - learn: [el piso, la habitación, el dormitorio, grande]
      - choose:
          title: Traduce
          skill: home_words
          items:
            - q: "El piso tiene tres habitaciones."
              options: "В квартире три комнаты. | В квартире три этажа. | В доме три квартиры."
      - learn: [el salón, la cocina, el baño, el balcón]
      - choose:
          title: "¿Qué es?"
          skill: home_words
          items:
            - img: el baño
              options: "el baño | la cocina | el salón"
            - img: la cocina
              options: "la cocina | el baño | el dormitorio"
            - img: el balcón
              options: "el balcón | el salón | el piso"
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "большая гостиная => un salón grande | el salón grande"
            - "Моя спальня маленькая. => Mi dormitorio es pequeño | Mi habitación es pequeña"
            - "У нас нет балкона. => No tenemos balcón | Nosotros no tenemos balcón | No hay balcón"
          skill: home_words
      - choose:
          title: Послушайте и выберите
          skill: home_words
          items:
            - say: "El piso tiene dos dormitorios."
              options: "В квартире две спальни. | В квартире три спальни. | В квартире две кухни."
              noaudio: {q: "Что значит «El piso tiene dos dormitorios.»?", options: "В квартире две спальни. | В квартире три спальни. | В квартире две кухни."}
            - say: "La cocina es grande."
              options: "Кухня большая. | Кухня маленькая. | Гостиная большая."
              noaudio: {q: "Что значит «La cocina es grande.»?", options: "Кухня большая. | Кухня маленькая. | Гостиная большая."}
    forms: [departamento, apartamento, cuarto]

  - id: vocab2
    kind: vocab
    title: Мебель и техника
    goal: назвать мебель и сказать, что есть в комнате
    version: 3
    vocab:
      - "🛏 la cama [ка́ма] — кровать"
      - "🛋 el sofá [софа́] — диван"
      - "🚪 el armario [арма́рьо] — шкаф"
      - "📚 la estantería [эстантэри́а] — полка, стеллаж"
      - "🧊 la nevera [нэбэ́ра] — холодильник"
      - "📺 la tele [тэ́лэ] — телевизор (сокр. от la televisión)"
      - "🚿 la ducha [ду́ча] — душ"
    blocks:
      - learn: [la cama, el sofá, el armario, la estantería]
      - choose:
          title: "¿Qué es?"
          skill: home_words
          items:
            - img: el armario
              options: "el armario | la estantería | la cama"
            - img: la estantería
              options: "la estantería | el armario | el sofá"
      - learn: [la nevera, la tele, la ducha]
      - choose:
          title: "¿Qué hay en...?"
          skill: hay
          items:
            - q: "¿Qué hay en la cocina?"
              options: "Hay una nevera. | Hay una ducha. | Hay una cama."
            - q: "¿Qué hay en el baño?"
              options: "Hay una ducha. | Hay un sofá. | Hay una nevera."
      - match:
          title: Соедините пары
          pairs:
            - "la nevera — холодильник"
            - "la tele — телевизор"
            - "la ducha — душ"
            - "el sofá — диван"
            - "la cama — кровать"
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "В спальне кровать и шкаф. => En el dormitorio hay una cama y un armario | Hay una cama y un armario en el dormitorio"
          skill: hay
      - build:
          title: Соберите фразу
          skill: hay
          items:
            - es: "En el salón hay un sofá y una tele."
              ru: "В гостиной диван и телевизор."
              alt: ["Hay un sofá y una tele en el salón."]
      - choose:
          title: Послушайте и выберите
          skill: home_words
          items:
            - say: "Hay una ducha en el baño."
              options: "В ванной есть душ. | В ванной нет душа. | На кухне есть душ."
              noaudio: {q: "Что значит «Hay una ducha en el baño.»?", options: "В ванной есть душ. | В ванной нет душа. | На кухне есть душ."}
            - say: "Hay una tele en la cocina."
              options: "На кухне есть телевизор. | В гостиной есть телевизор. | На кухне нет телевизора."
              noaudio: {q: "Что значит «Hay una tele en la cocina.»?", options: "На кухне есть телевизор. | В гостиной есть телевизор. | На кухне нет телевизора."}
    forms: [televisión]

  - id: estar
    kind: grammar
    title: "¿Dónde está? Глагол estar"
    goal: спросить и сказать, где что находится
    version: 3
    vocab:
      - "📍 estar [эста́р] — находиться; быть (где-то)"
      - "❓ ¿Dónde está...? [до́ндэ эста́] — где находится...? :: ¿Dónde está el baño? — Где туалет?"
      - "⬆️ encima de [энθи́ма дэ] — на, поверх"
      - "⬇️ debajo de [дэба́хо дэ] — под"
      - "↔️ al lado de [аль ла́до дэ] — рядом с"
    blocks:
      - "Какой глагол испанцы используют, когда говорят, **где** что-то находится?"
      - examples:
          items:
            - "¿Dónde está el libro? Está en la mesa. — Где книга? На столе."
            - "¿Dónde estás? Estoy en la cocina. — Где ты? Я на кухне."
      - learn: [estar, "¿Dónde está...?"]
      - rule:
          id: estar
          text: "Где кто-то или что-то находится — всегда глагол **estar**: о людях (_Estoy en casa_), о предметах (_El sofá está en el salón_), о городах (_Málaga está en Andalucía_)."
      - conjugation:
          verb: estar
          ru: находиться
          forms: [estoy, estás, está, estamos, estáis, están]
      - write:
          title: Вставьте форму estar
          format: одна форма глагола estar
          skill: estar_location
          items:
            - "Nosotros ___ en casa. => estamos"
            - "¿Dónde ___ (tú)? => estás"
            - "Mis padres ___ en Sevilla. => están"
      - learn: [encima de, debajo de, al lado de]
      - table:
          id: where
          title: Где?
          rows:
            - ["**en**", "«в» или «на»: _en la mesa_, _en la cocina_"]
            - ["**encima de**", "«на, поверх»: _encima de la cama_, _encima del armario_"]
            - ["**debajo de**", "«под»: _debajo de la mesa_, _debajo del sofá_"]
            - ["**al lado de**", "«рядом с»: _al lado de la ventana_, _al lado del baño_"]
      - note: "**de** + **el** = **del**: _debajo del sofá_, _al lado del armario_. С **la** слияния нет: _al lado de la puerta_."
      - choose:
          title: Где?
          skill: prepositions
          items:
            - img: debajo de
              q: "¿Dónde está el gato?"
              options: "debajo de | encima de | al lado de"
            - img: al lado de
              q: "¿Dónde está el gato?"
              options: "al lado de | debajo de | encima de"
      - write:
          title: Responde
          format: фраза по-испански
          skill: [estar_location, prepositions]
          items:
            - q: "🐱 под 🛏 — ¿Dónde está el gato?"
              a: "Está debajo de la cama | Debajo de la cama | El gato está debajo de la cama"
              mistakes: {"es debajo de la cama": "Где кто-то находится — **está**: Está debajo de la cama.", "hay debajo de la cama": "Где находится известный кот — **está**: Está debajo de la cama."}
            - q: "📕 на 🛋 — ¿Dónde está el libro?"
              a: "Está encima del sofá | [Está/El libro está] [encima del/en el] sofá | [Encima del/En el] sofá"
              mistakes: {"está encima de el sofá": "de + el сливаются: encima **del** sofá.", "encima de el sofá": "de + el сливаются: encima **del** sofá."}
              explain: "de + el = del: encima del sofá."
      - choose:
          title: Послушайте и выберите
          skill: estar_location
          items:
            - say: "Estamos en casa."
              options: "Мы дома. | Они дома. | Вы дома."
              noaudio: {q: "Что значит «Estamos en casa.»?", options: "Мы дома. | Они дома. | Вы дома."}
            - say: "¿Dónde está el libro?"
              options: "Где книга? | Что это за книга? | Где книги?"
              noaudio: {q: "Что значит «¿Dónde está el libro?»?", options: "Где книга? | Что это за книга? | Где книги?"}

  - id: preposiciones
    kind: grammar
    title: Перед, за, между
    goal: описать, где стоят вещи — перед, за, между, близко, далеко
    version: 3
    vocab:
      - "▶️ delante de [дэла́нтэ дэ] — перед"
      - "◀️ detrás de [дэтра́с дэ] — за, позади"
      - "↔️ entre [э́нтрэ] — между :: entre la cama y el armario — между кроватью и шкафом"
      - "🤏 cerca de [θэ́рка дэ] — близко от, недалеко"
      - "🛫 lejos de [лэ́хос дэ] — далеко от"
    blocks:
      - text:
          id: prep_de
          text: "Ещё пять слов про «где». Четыре из них — с **de**, а после **entre** **de** не ставится: _entre la puerta y la ventana_."
      - learn: [delante de, detrás de, entre]
      - choose:
          title: Где?
          rule: prep_de
          skill: prepositions
          items:
            - img: detrás de
              q: "¿Dónde está el gato?"
              options: "detrás de | delante de | entre"
            - img: entre
              q: "¿Dónde está el gato?"
              options: "entre | delante de | detrás de"
      - learn: [cerca de, lejos de]
      - choose:
          title: Выберите
          rule: prep_de
          skill: prepositions
          items:
            - q: "Kiev está ___ Madrid."
              options: "lejos de | cerca de | entre"
            - say: "Mi casa está cerca de la universidad."
              options: "Мой дом недалеко от университета. | Мой дом далеко от университета. | Мой дом рядом со школой."
              noaudio: {q: "Что значит «Mi casa está cerca de la universidad»?", options: "Мой дом недалеко от университета. | Мой дом далеко от университета. | Мой дом рядом со школой."}
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - q: "Кот за диваном."
              a: "El gato está detrás del sofá | Está detrás del sofá"
              mistakes: {"el gato está detrás de el sofá": "de + el сливаются: detrás **del** sofá.", "el gato es detrás del sofá": "Где кто-то находится — **está**."}
            - "Стул перед окном. => La silla está delante de la ventana | Está delante de la ventana"
            - q: "Ванная между кухней и спальней."
              a: "El baño está entre la cocina y el dormitorio | Está entre la cocina y el dormitorio"
              mistakes: {"el baño está entre de la cocina y el dormitorio": "После **entre** de не ставят: entre la cocina y el dormitorio."}
          rule: prep_de
          skill: prepositions
      - choose:
          title: Послушайте и выберите
          skill: prepositions
          items:
            - say: "La silla está detrás de la mesa."
              options: "Стул за столом. | Стул перед столом. | Стул на столе."
              noaudio: {q: "Что значит «La silla está detrás de la mesa.»?", options: "Стул за столом. | Стул перед столом. | Стул на столе."}
    forms: [mí]

  - id: hay_esta
    kind: grammar
    title: Hay или está?
    goal: выбрать hay или está
    version: 3
    vocab:
      - "📌 aquí [аки́] — здесь, тут"
      - "👉 allí [айи́] — там"
    blocks:
      - "Сравните две пары. Когда говорят **hay**, а когда **está**?"
      - examples:
          items:
            - "En el salón hay un sofá. — В гостиной есть диван."
            - "El sofá está al lado de la ventana. — Диван (стоит) у окна."
      - compare:
          id: hay_esta
          cards:
            - head: hay
              label: «есть» — новое
              tone: blue
              text: 'Сообщаем, что где-то **есть** предмет. После **hay** — un/una, число или слово без артикля. **Hay** не меняется.'
              ex: ["En la cocina hay una nevera.", "En mi casa hay dos baños."]
            - head: está / están
              label: «где» — уже известное
              tone: sun
              text: 'Говорим, **где** находится то, о чём уже знают. Перед ним — el/la, mi или имя. Один — **está**, несколько — **están**.'
              ex: ["La cama está en el dormitorio.", "Mis llaves están en la mochila."]
      - write:
          title: "¿Hay o está?"
          format: одно слово — hay, está или están
          skill: hay_esta
          items:
            - "En mi casa ___ dos baños. => hay"
            - "El baño ___ al lado del dormitorio. => está"
            - "¿Dónde ___ las gafas? => están"
            - "En la mesa ___ unas gafas. => hay"
            - "¿___ una nevera en la cocina? => hay"
            - "La nevera ___ en la cocina. => está"
      - learn: [aquí, allí]
      - choose:
          title: Что ответить?
          rule: hay_esta
          skill: hay_esta
          items:
            - lines: ["Ana: Perdón, ¿hay un baño aquí?"]
              q: "Туалет — вон там."
              options: "Sí, el baño está allí. | Sí, hay el baño allí. | Sí, está un baño allí."
              explain: "Где находится известный предмет — está; после hay артикль el не ставят."
      - choose:
          title: Послушайте и выберите
          skill: hay_esta
          items:
            - say: "Aquí está el baño."
              options: "Ванная здесь. | Ванная там. | Здесь есть ванная."
              noaudio: {q: "Что значит «Aquí está el baño.»?", options: "Ванная здесь. | Ванная там. | Здесь есть ванная."}
            - say: "Las llaves están allí."
              options: "Ключи вон там. | Ключи здесь. | Там есть ключи."
              noaudio: {q: "Что значит «Las llaves están allí.»?", options: "Ключи вон там. | Ключи здесь. | Там есть ключи."}

  - id: lectura
    kind: reading
    title: Mi piso
    goal: понять описание квартиры и описать свою
    version: 3
    vocab:
      - "✨ nuevo/a [нуэ́бо, нуэ́ба] — новый"
      - "🏚 viejo/a [бьэ́хо, бьэ́ха] — старый"
      - "🌸 bonito/a [бони́то, бони́та] — красивый, симпатичный (о вещах, местах)"
      - "🛋 cómodo/a [ко́модо, ко́мода] — удобный"
      - "🏙 el centro [θэ́нтро] — центр"
      - "🔢 ¿cuántos? / ¿cuántas? [куа́нтос, куа́нтас] — сколько? (м. р. / ж. р.) :: ¿Cuántas sillas hay? — Сколько стульев?"
    blocks:
      - learn: [nuevo/a, viejo/a, bonito/a, cómodo/a]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "nuevo — новый"
            - "viejo — старый"
            - "bonito — красивый"
            - "cómodo — удобный"
      - learn: [el centro, "¿cuántos? / ¿cuántas?"]
      - choose:
          title: Выберите
          items:
            - q: "¿___ sillas hay en el salón?"
              options: "Cuántas | Cuántos"
              explain: "Silla женского рода — cuántas."
      - reading:
          id: sara
          title: Mi piso
          text: |
            Me llamo Sara y vivo en un piso pequeño en el centro de Madrid. El piso es viejo, pero muy bonito.

            Tiene dos habitaciones: mi dormitorio y un salón. En el salón hay un sofá azul muy cómodo, una mesa y cuatro sillas. La tele está delante del sofá.

            La cocina es pequeña, pero tiene una nevera nueva. El baño está al lado de la cocina.

            No tengo balcón, pero hay dos ventanas grandes. ¡Mi gato está en la ventana todo el día!
          translation: |
            Меня зовут Сара, я живу в маленькой квартире в центре Мадрида. Квартира старая, но очень красивая.

            В ней две комнаты: моя спальня и гостиная. В гостиной очень удобный синий диван, стол и четыре стула. Телевизор стоит перед диваном.

            Кухня маленькая, но в ней новый холодильник. Ванная рядом с кухней.

            Балкона у меня нет, но есть два больших окна. Мой кот весь день сидит на окне!
      - more:
          title: todo el día
          text: "**todo el día** — «весь день»: _Trabajo todo el día._ _Mi gato está en la ventana todo el día._"
      - choose:
          title: Responde
          source: sara
          rule: none
          items:
            - q: "¿Dónde está el piso de Sara?"
              options: "En el centro de Madrid. | Lejos de Madrid. | En Sevilla."
            - q: "¿Cómo es el piso?"
              options: "Pequeño y viejo, pero muy bonito. | Grande y nuevo. | Pequeño y nuevo, pero no es bonito."
            - q: "¿Dónde está la tele?"
              options: "Delante del sofá. | Detrás del sofá. | En la cocina."
              skill: prepositions
            - q: "¿Cuántas habitaciones tiene el piso?"
              options: "dos | tres | una"
              explain: "Tiene dos habitaciones: mi dormitorio y un salón."
            - q: "¿Qué es nuevo en la cocina?"
              options: "la nevera | la mesa | la ventana"
              explain: "La cocina es pequeña, pero tiene una nevera nueva."
      - mission:
          id: diego
          title: Диего в гостях
          text: "Ваш друг Диего впервые пришёл к вам. Квартира у вас небольшая: две комнаты, кухня, ванная рядом с кухней, балкона нет. Ответьте на его вопросы."
      - choose:
          source: diego
          skill: hay_esta
          items:
            - lines: ["Diego: ¿Cuántas habitaciones hay?"]
              options: "Hay dos habitaciones. | Están dos habitaciones. | Es dos habitaciones."
            - lines: ["Diego: ¿Dónde está el baño?"]
              options: "Está al lado de la cocina. | Hay al lado de la cocina. | Es al lado de la cocina."
      - write:
          free: true
          skill: hay
          items:
            - q: "Diego: ¿Tienes balcón? — Ответьте: «Нет, балкона нет»."
              a: "No, no tengo balcón | No, no hay balcón | No tengo balcón | No hay balcón"
              format: ответ по-испански
      - choose:
          title: Послушайте и выберите
          free: true
          skill: home_words
          items:
            - say: "Mi piso es pequeño, pero muy bonito."
              options: "Моя квартира маленькая, но очень красивая. | Моя квартира большая и очень красивая. | Моя квартира маленькая и старая."
              noaudio: {q: "Что значит «Mi piso es pequeño, pero muy bonito.»?", options: "Моя квартира маленькая, но очень красивая. | Моя квартира большая и очень красивая. | Моя квартира маленькая и старая."}
            - say: "Vivo en el centro."
              options: "Я живу в центре. | Я работаю в центре. | Я живу далеко от центра."
              noaudio: {q: "Что значит «Vivo en el centro.»?", options: "Я живу в центре. | Я работаю в центре. | Я живу далеко от центра."}
    forms: [todo]

  - id: escucha
    kind: listening
    title: ¿Dónde están mis llaves?
    goal: понять на слух, где лежат вещи
    version: 3
    vocab:
      - "👩‍👦 mamá / papá [мама́, папа́] — мама / папа"
    blocks:
