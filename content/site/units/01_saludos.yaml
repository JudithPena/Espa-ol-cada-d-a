              explain: "Lucía: Regular... — у Лусии вечером дела так себе."
            - q: "Лусия и сеньор Гарсия говорят на «ты» или на «вы»?"
              options: "на «вы» | на «ты»"
              explain: "Лусия спрашивает ¿Cómo está usted?, а сеньор Гарсия отвечает ¿Y usted? — это вежливое «вы»."
              skill: tu_usted
      - choose:
          title: Что ответить?
          free: true
          skill: polite
          items:
            - lines: ["Pablo: ¿Café?"]
              options: "¡Sí, por favor! | ¡De nada! | ¡Perdón!"
              explain: "Когда вам что-то предлагают и вы согласны, говорят sí, por favor — «да, пожалуйста»."
            - lines: ["Pablo: ¿Chocolate?"]
              options: "¡Vale! | ¡De nada! | ¡No pasa nada!"
              explain: "_Vale_ здесь значит «давай»: так соглашаются, когда вам что-то предлагают."
            - lines: ["Lucía: ¡Perdón, Pablo!"]
              options: "No pasa nada. | De nada. | ¡Muchas gracias!"
              explain: "На извинение можно ответить _No pasa nada_ — «ничего страшного». _De nada_ говорят в ответ на благодарность."
              mistakes:
                "De nada.": "_De nada_ говорят в ответ на благодарность. На извинение отвечают _No pasa nada_ — «ничего страшного»."

