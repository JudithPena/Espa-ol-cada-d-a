      - note:
          id: un_cafe
          text: |
            Слово **vale** испанцы очень любят: оно значит «ладно», «хорошо» или «договорились». На вопрос _¿Café?_ можно ответить _Vale_, то есть «давай», а на _¡Hasta mañana!_ — _¡Vale!_, то есть «договорились!».
            Ещё запомните фразу _Un café, por favor_ — «Один кофе, пожалуйста». Так же можно попросить вино или шоколад: _Un vino, por favor_, _Un chocolate, por favor_. Слово **un** — «один» — мы разберём позже.
      - more:
          title: 🌎 А в Латинской Америке?
          text: "Слово **vale** там почти не говорят, а вместо него говорят _está bien_, что тоже значит «хорошо» или «ладно»: на вопрос _¿Café?_ отвечают _Sí, está bien_."
      - write:
          title: Попросите в кафе
          format: короткая фраза
          free: true
          skill: polite
          items:
            - q: "Напишите по-испански: «Один кофе, пожалуйста»."
              a: "Un café, por favor | Por favor, un café | Hola, un café, por favor | Buenos días, un café, por favor | Buenas tardes, un café, por favor"
              explain: "Un café, por favor — «Один кофе, пожалуйста»: так просят одну чашку кофе."
              mistakes:
                "el cafe por favor": "В готовой фразе — **un** café: un значит «один», так просят одну чашку. И в слове caf**é** есть знак ударения."
                "el café por favor": "В готовой фразе — **un** café: un значит «один», так просят одну чашку."
                "un cafe por favor": "Почти! В слове caf**é** есть знак ударения."
                "cafe por favor": "Добавьте слово **un** — «один»: un café, por favor. И в слове caf**é** есть знак ударения."
                "café por favor": "Добавьте слово **un** — «один»: un café, por favor."
      - dialogue:
          id: evening
          title: Вечером
          voices: {Señor García: m}
          lines:
            - "Señor García: Buenas tardes, Lucía. | Добрый вечер, Лусия."
