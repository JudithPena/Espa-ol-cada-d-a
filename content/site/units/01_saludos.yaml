id: saludos
number: 1
level: A0
title: ¡Hola! Приветствия
goals:
  - поздороваться и попрощаться в любое время суток
  - спросить, как дела, и ответить
  - выбрать «ты» или «вы»

# Сценарий уроков сайта (docs/site_lessons_guide.md): слова порциями (learn), задания сразу после
# своей порции, в конце урока — разговор, где нужно ответить собеседнику.
lessons:
  - id: vocab1
    kind: vocab
    title: Привет и пока
    goal: здороваться утром, днём и вечером и прощаться
    version: 2
    # Карта экранов: docs/site_slide_maps/01_saludos.md
    vocab:
      - "☀️ buenos días [буэ́нос ди́ас] — доброе утро; добрый день (до обеда) :: ¡Buenos días, María! — Доброе утро, Мария!"
      - "🌇 buenas tardes [буэ́нас та́рдэс] — добрый день; добрый вечер (после обеда) :: ¡Buenas tardes, Pablo! — Добрый день, Пабло!"
      - "🌙 buenas noches [буэ́нас но́чэс] — доброй ночи; добрый вечер (поздно) :: Buenas noches, Ana. — Спокойной ночи, Ана."
      - "👋 adiós [адьо́с] — до свидания; пока :: ¡Adiós, Carlos! — Пока, Карлос!"
      - "🔜 hasta luego [а́ста луэ́го] — до встречи; пока :: ¡Hasta luego, Lucía! — До встречи, Лусия!"
      - "📅 hasta mañana [а́ста манья́на] — до завтра :: ¡Hasta mañana, Pablo! — До завтра, Пабло!"
    blocks:
      - "В испанском приветствие зависит от времени суток. Только **¡Hola!** подходит всегда, и его можно сочетать с другими приветствиями: _¡Hola, buenos días!_, _¡Hola, buenas tardes!_"
      - learn: [buenos días, buenas tardes, buenas noches]
      - header: Когда что говорить
      - list:
          id: day
          items:
          - "☀️ С утра и до обеда говорят **buenos días**. В Испании обедают около 14:00, поэтому так здороваются почти до двух часов дня: _¡Buenos días!_, _¡Buenos días, María!_"
          - "🌇 После обеда и до темноты говорят **buenas tardes**: _¡Buenas tardes!_, _¡Buenas tardes, Carlos!_"
          - "🌙 Поздно вечером и перед сном говорят **buenas noches**. Этой фразой и здороваются вечером, и прощаются перед сном: _¡Buenas noches!_, _Buenas noches, Ana._"
      - choose:
          title: Что вы скажете?
          skill: greeting_time
          items:
            - q: "13:30. Вы заходите в магазин в Мадриде."
              options: "¡Buenos días! | ¡Buenas tardes! | ¡Buenas noches!"
              explain: "В Испании обедают около 14:00, поэтому до обеда, даже в половине второго, говорят buenos días."
            - q: "18:00. Соседка возвращается домой с работы."
              options: "¡Buenas tardes! | ¡Buenos días! | ¡Buenas noches!"
              explain: "После обеда и до темноты говорят buenas tardes."
            - q: "23:00. Вы желаете семье спокойной ночи."
              options: "¡Buenas noches! | ¡Buenas tardes! | ¡Buenos días!"
              explain: "Поздно вечером и перед сном говорят buenas noches."
      - write:
          title: Поздоровайтесь
          format: приветствие по-испански
          skill: greeting_time
          items:
            - q: "☀️ 9:00. Вы входите в офис. Поздоровайтесь по времени суток."
              a: "Buenos días | Hola, buenos días"
              explain: "До обеда здороваются словами buenos días."
              mistakes:
                "hola": "_Hola_ здесь уместно. В этом задании назовите утреннее приветствие."
                "buenas dias": "Почти: días — слово мужского рода, поэтому **buenos** días. А «добрый вечер» — **buenas** tardes."
                "buenas días": "Почти: días — слово мужского рода, поэтому **buenos** días. А «добрый вечер» — **buenas** tardes."
                "buenas tardes": "Buenas tardes говорят после обеда. А в 9:00 обед ещё не наступил."
            - q: "🌇 17:00. Вы встречаете соседа. Поздоровайтесь по времени суток."
              a: "Buenas tardes | Hola, buenas tardes"
              explain: "После обеда и до темноты здороваются словами buenas tardes."
              mistakes:
                "hola": "_Hola_ здесь уместно. В этом задании назовите приветствие для времени после обеда."
                "buenos tardes": "Почти: tardes — слово женского рода, поэтому **buenas** tardes. А **buenos** — только в buenos días."
                "buenos días": "Buenos días говорят до обеда, около 14:00 в Испании обедают. В 17:00 — buenas tardes."
      - learn: [adiós, hasta luego, hasta mañana]
      - tip:
          id: hasta
          text: |
            Слово **hasta** значит «до». Поэтому _hasta luego_ дословно означает «до потом», то есть «до встречи», а _hasta mañana_ означает «до завтра»: _¡Hasta luego, Pablo!_, _¡Hasta mañana, Carmen!_
            А **adiós** значит «до свидания» или «пока»: _¡Adiós, Carlos!_, _¡Adiós, María!_
      - choose:
          title: Как попрощаться?
          skill: farewell
          items:
            - q: "Вы уходите с работы, а завтра снова придёте."
              options: "¡Hasta mañana! | ¡Hasta luego! | ¡Buenos días!"
              explain: "Hasta mañana значит «до завтра»: вы увидитесь завтра."
            - q: "Вы уходите на обед и вернётесь через час."
              options: "¡Hasta luego! | ¡Hasta mañana! | ¡Buenas noches!"
              explain: "Hasta luego значит «до встречи»: вы увидитесь сегодня же."
            - say: "¡Adiós, Carlos!"
              options: "¡Adiós, Carlos! | ¡Hola, Carlos! | ¡Hasta luego, Carlos!"
              noaudio: {q: "Какая фраза значит «До свидания, Карлос!»?", options: "¡Adiós, Carlos! | ¡Hola, Carlos! | ¡Hasta luego, Carlos!"}
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "buenos días — доброе утро"
            - "buenas tardes — добрый день (после обеда)"
            - "hasta luego — до встречи"
            - "hasta mañana — до завтра"
            - "adiós — до свидания"
      - dialogue:
          id: porch
          title: Вечером у подъезда
          lines:
            - "Pablo: ¡Hola, Lucía! ¡Buenas tardes! | Привет, Лусия! Добрый вечер!"
            - "Lucía: ¡Buenas tardes, Pablo! | Добрый вечер, Пабло!"
            - "Pablo: ¡Hasta mañana, Lucía! | До завтра, Лусия!"
            - "Lucía: ¡Adiós, Pablo! | Пока, Пабло!"
      - choose:
          title: Ответьте Пабло
          free: true
          rule: none
          items:
            - lines: ["Pablo: ¡Buenas noches, Lucía!"]
              q: "23:00. Пабло здоровается с вами в подъезде."
              options: "¡Buenas noches, Pablo! | ¡Buenos días, Pablo! | ¡Buenas tardes, Pablo!"
              explain: "На приветствие отвечают тем же приветствием: поздно вечером — buenas noches."
              skill: greeting_time
              rule: day
            - lines: ["Pablo: ¡Hasta mañana!"]
              q: "Пабло уходит домой."
              options: "¡Adiós, Pablo! | ¡Hola, Pablo! | ¡Buenos días, Pablo!"
              explain: "Пабло прощается, поэтому и вы прощаетесь: adiós или hasta mañana."
              skill: farewell
              rule: hasta

  - id: vocab2
    kind: vocab
    title: "¿Qué tal? Как дела?"
    goal: спросить, как дела, и ответить в одно-два слова
    version: 2
    vocab:
      - "❓ ¿Qué tal? [кэ таль] — как дела? :: ¡Hola, Ana! ¿Qué tal? — Привет, Ана! Как дела?"
      - "🙂 bien [бьен] — хорошо :: Bien, gracias. — Хорошо, спасибо."
      - "😀 muy bien [муй бьен] — очень хорошо :: Muy bien, gracias. — Очень хорошо, спасибо."
      - "😐 regular [рэгула́р] — так себе, неважно"
      - "😕 mal [маль] — плохо"
      - "🙋 ¿Y tú? [и ту] — а ты? :: Bien, ¿y tú? — Хорошо, а ты?"
    blocks:
      - "После приветствия обычно спрашивают, как дела. Отвечать подробно не принято: хватит одного-двух слов."
      - dialogue:
          id: short
          title: Короткий разговор
          lines:
            - "Lucía: ¡Hola! ¿Qué tal? | Привет! Как дела?"
            - "Pablo: Muy bien, gracias. ¿Y tú? | Очень хорошо, спасибо. А ты?"
            - "Lucía: Bien. | Хорошо."
      - learn: ["¿Qué tal?", muy bien, bien, regular, mal]
      - table:
          id: scale
          title: От лучшего к худшему
          rows:
            - ["😀", "**muy bien** значит «очень хорошо»: _¡Muy bien!_ или _Muy bien, gracias._"]
            - ["🙂", "**bien** значит «хорошо»: _Bien, gracias._"]
            - ["😐", "**regular** значит «так себе»: _Regular..._ или _Regular, gracias._"]
            - ["😕", "**mal** значит «плохо»: _Mal..._ или _Muy mal._"]
      - choose:
          title: Как у вас дела?
          free: true
          skill: how_are_you
          items:
            - q: "😐 Дела так себе. Что ответить на ¿Qué tal?"
              options: "Regular. | Muy bien. | Mal."
              explain: "Regular значит «так себе»: не хорошо и не плохо."
            - q: "😀 У вас всё отлично."
              options: "Muy bien, gracias. | Bien, gracias. | Regular, gracias."
              explain: "Muy bien значит «очень хорошо», а bien — просто «хорошо»."
            - q: "😕 У вас болит голова, всё плохо."
              options: "Mal... | Regular... | Bien..."
      - learn: ["¿Y tú?"]
      - tip:
          id: y_tu
          text: |
            Слово **y** значит «и» или «а».
            В значении «а» оно помогает вежливо вернуть вопрос собеседнику: _¿Y tú?_ — «А ты?», _Bien, ¿y tú?_ — «Хорошо, а ты?»
            В вопросе _¿Y tú?_ слово **tú** означает «ты» и пишется со знаком ударения.
            В значении «и» оно соединяет слова: _Carmen y Carlos_ — «Кармен и Карлос», _el queso y el vino_ — «сыр и вино».
      - choose:
          title: Что ответить?
          free: true
          skill: how_are_you
          items:
            - lines: ["Lucía: ¡Hola, Pablo! ¿Qué tal?"]
              options: "Bien, gracias. ¿Y tú? | ¿Qué tal? ¿Y tú? | ¡Adiós! ¿Y tú?"
              explain: "Сначала отвечают, как дела, а потом возвращают вопрос: ¿Y tú?"
      - write:
          title: Ответьте и спросите в ответ
          format: ответ и вопрос «а ты?» по-испански
          free: true
          rule: y_tu
          skill: how_are_you
          items:
            - q: "Друг спрашивает: ¿Qué tal? У вас всё хорошо."
              a: "Bien, gracias. ¿Y tú? | Bien, ¿y tú? | Bien, gracias, ¿y tú? | Muy bien, gracias. ¿Y tú? | Muy bien, ¿y tú?"
              explain: "Ответ — bien, а вопрос в ответ — ¿Y tú?"
              mistakes:
                "bien gracias": "Ответ верный, а вопрос в ответ забыли: добавьте **¿y tú?** — «а ты?»."
                "bien": "Ответ верный, а вопрос в ответ забыли: добавьте **¿y tú?** — «а ты?»."
                # Ключи mistakes сравниваются без ударений: эти четыре ловят «¿y tu?» без знака (верные ответы проверяются раньше).
                "Bien, ¿y tú?": "Почти! Слово **tú** — «ты» — пишется со знаком ударения: **¿Y tú?** Без знака это другое слово."
                "Bien, gracias. ¿Y tú?": "Почти! Слово **tú** — «ты» — пишется со знаком ударения: **¿Y tú?** Без знака это другое слово."
                "Muy bien, ¿y tú?": "Почти! Слово **tú** — «ты» — пишется со знаком ударения: **¿Y tú?** Без знака это другое слово."
                "Muy bien, gracias. ¿Y tú?": "Почти! Слово **tú** — «ты» — пишется со знаком ударения: **¿Y tú?** Без знака это другое слово."
      - build:
          title: Соберите фразу
          free: true
          skill: how_are_you
          items:
            - {es: "¡Hola, Ana! ¿Qué tal?", ru: "Привет, Ана! Как дела?", rule: none}
            - {es: "Muy bien, gracias. ¿Y tú?", ru: "Очень хорошо, спасибо. А ты?", rule: y_tu}

  - id: grammar
    kind: grammar
    title: «Ты» и «вы». Знаки ¿? и ¡!
    goal: выбрать «ты» или «вы» и правильно записать вопрос и восклицание
    version: 2
    vocab:
      - "🧑 tú [ту] — ты"
      - "🎩 usted [устэ́д] — вы (вежливо, одному человеку)"
      - "💬 ¿Cómo estás? [ко́мо эста́с] — как ты? как поживаешь?"
      - "💬 ¿Cómo está usted? [ко́мо эста́ устэ́д] — как вы поживаете?"
      - "🙋 ¿Y usted? [и устэ́д] — а вы?"
      - "👨 el señor [сэньо́р] — господин, сеньор :: Buenos días, señor García. — Доброе утро, сеньор Гарсия."
      - "👩 la señora [сэньо́ра] — госпожа, сеньора :: Buenas tardes, señora López. — Добрый день, сеньора Лопес."
    blocks:
      - "Посмотрите на два разговора. Чем они отличаются?"
      - dialogue:
          id: friend
          title: С другом
          lines:
            - "Lucía: ¡Hola, Pablo! ¿Cómo estás? | Привет, Пабло! Как ты?"
            - "Pablo: Bien, gracias. ¿Y tú? | Хорошо, спасибо. А ты?"
      - dialogue:
          id: neighbour
          title: С пожилым соседом
          join: true
          lines:
            - "Lucía: Buenos días, señor García. ¿Cómo está usted? | Доброе утро, сеньор Гарсия. Как вы поживаете?"
            - "Señor García: Muy bien, gracias. ¿Y usted? | Очень хорошо, спасибо. А вы?"
      - learn: [tú, usted, el señor, la señora]
      - header: Ты или вы?
      - compare:
          id: tu_usted
          cards:
            - head: tú
              label: «ты»
              tone: blue
              text: С друзьями, родными, коллегами и ровесниками. В Испании на «ты» переходят очень быстро.
              ex:
                - "¿Y tú, Pablo? — А ты, Пабло?"
                - "Bien, ¿y tú? — Хорошо, а ты?"
            - head: usted
              label: вежливое «вы» одному человеку
              tone: sun
              text: С пожилыми людьми и с незнакомыми людьми в официальной обстановке.
              ex:
                - "¿Y usted, señor García? — А вы, сеньор Гарсия?"
                - "Buenas tardes, señora. — Добрый день, сеньора."
      - learn: ["¿Cómo estás?", "¿Cómo está usted?", "¿Y usted?"]
      - compare:
          style: small
          title: Один вопрос — две формы
          cards:
            - head: ¿Cómo estás?
              label: как ты?
            - head: ¿Cómo está usted?
              label: как вы поживаете?
      - compare:
          join: true
          cards:
            - head: ¿Qué tal?
              label: подходит в обоих случаях
              tone: mint
              text: В этом вопросе нет ни «ты», ни «вы», поэтому его можно задать и другу, и сеньоре.
              ex:
                - "¡Hola, Pablo! ¿Qué tal? — Привет, Пабло! Как дела?"
                - "Buenos días, señora López. ¿Qué tal? — Доброе утро, сеньора Лопес. Как дела?"
      - sort:
          title: Другу или сеньору Гарсии?
          free: true
          rule: tu_usted
          skill: tu_usted
          groups:
            "🧑 другу (tú)": ["¿Cómo estás?", "¿Y tú?", "Bien, ¿y tú?"]
            "🎩 сеньору (usted)": ["¿Cómo está usted?", "¿Y usted?", "Muy bien, ¿y usted?"]
      - choose:
          title: Что ответить?
          free: true
          rule: tu_usted
          skill: tu_usted
          items:
            - lines: ["Señor García: Buenos días, Lucía. ¿Cómo está usted?"]
              options: "Muy bien, gracias. ¿Y usted? | Muy bien, gracias. ¿Y tú? | ¿Cómo estás?"
              explain: "С сеньором Гарсией говорят на «вы», поэтому вопрос в ответ — ¿Y usted?"
            - lines: ["Pablo: ¡Hola! ¿Cómo estás?"]
              options: "Bien, gracias. ¿Y tú? | Bien, gracias. ¿Y usted? | ¿Cómo está usted?"
              explain: "Пабло — друг, с ним говорят на «ты»: ¿Y tú?"
            - q: "Вы здороваетесь с пожилым соседом. Его фамилия — Гарсия."
              options: "Buenos días, señor García. | Buenos días, señora García. | ¡Hola, García! ¿Qué tal?"
              explain: "К мужчине обращаются señor, к женщине — señora. С пожилым соседом говорят вежливо и называют его по фамилии с señor."
      - header: Перевёрнутые знаки
      - compare:
          id: marks
          lead: В испанском вопрос и восклицание выделяют знаками с двух сторон, а знак в начале фразы переворачивают.
          cards:
            - head: ¿ … ?
              label: Вопрос
              tone: blue
              text: Перед вопросом ставится ¿, а после него ставится ?
              ex:
                - "¿Qué tal?"
                - "¿Cómo estás?"
            - head: ¡ … !
              label: Восклицание
              tone: sun
              text: Перед восклицанием ставится ¡, а после него ставится !
              ex:
                - "¡Hola!"
                - "¡Hasta mañana!"
      - compare:
          join: true
          style: small
          title: Сравните значение
          cards:
            - head: Sí.
              label: Да.
            - head: ¿Sí?
              label: Да?
            - head: ¡Sí!
              label: Да!
          note: Поэтому уже по первому знаку видно, вопрос это или восклицание.
      - choose:
          title: Где написано правильно?
          free: true
          skill: marks
          items:
            - q: "Вопрос «Как дела?»"
              options: "¿Qué tal? | Qué tal? | ¿Qué tal¿"
              explain: "В начале вопроса стоит перевёрнутый знак ¿, в конце — обычный ?"
            - q: "Восклицание «Доброе утро!»"
              options: "¡Buenos días! | Buenos días! | !Buenos días¡"
              explain: "В начале восклицания стоит перевёрнутый знак ¡, в конце — обычный !"
      - build:
          title: Соберите фразу
          free: true
          rule: tu_usted
          skill: tu_usted
          items:
            - es: "¡Buenas tardes, señora! ¿Cómo está usted?"
              ru: "Добрый день, сеньора! Как вы поживаете?"
              extra: [estás]

  - id: dialogue
    kind: dialogue
    title: Утро в офисе
    goal: поблагодарить, извиниться и попросить кофе
    version: 3
    vocab:
      - "🙏 por favor [пор фабо́р] — пожалуйста (просьба) :: Un café, por favor. — Кофе, пожалуйста. {forms: un}"
      - "🙏 muchas gracias [му́час гра́θиас] — большое спасибо"
      - "🤝 de nada [дэ на́да] — не за что"
      - "🙇 perdón [пэрдо́н] — извините, простите"
      - "👌 vale [ба́лэ] — ладно, хорошо, окей"
      - "🙂 no pasa nada [но па́са на́да] — ничего страшного (ответ на извинение) :: ¡Perdón! No pasa nada. — Простите! Ничего страшного."
    # Урок начинается разговором: слова — из него, вопросы к разговору — с кнопкой «Показать диалог» (source).
    blocks:
      - "Лусия и Пабло работают в одном офисе в Мадриде."
      - dialogue:
          id: morning
          title: Утром
          lines:
            - "Lucía: ¡Buenos días, Pablo! | Доброе утро, Пабло!"
            - "Pablo: ¡Hola, Lucía! ¿Qué tal? | Привет, Лусия! Как дела?"
            - "Lucía: Muy bien, gracias. ¿Y tú? | Очень хорошо, спасибо. А ты?"
            - "Pablo: Bien. ¿Café? | Хорошо. Кофе?"
            - "Lucía: ¡Vale! ¡Muchas gracias, Pablo! | Давай! Большое спасибо, Пабло!"
            - "Pablo: De nada. | Не за что."
      - learn: [por favor, muchas gracias, de nada]
      - match:
          title: Соедините пары
          free: true
          pairs:
            - "por favor — пожалуйста (просьба)"
