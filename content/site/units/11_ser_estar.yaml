id: ser_estar
number: 11
level: A1
title: ¿Cómo estás? Состояния
goals:
  - рассказать о своём самочувствии и настроении
  - понимать разницу между ser и estar
  - спросить «почему?» и объяснить причину

lessons:
  - id: vocab
    kind: vocab
    title: Как вы себя чувствуете?
    goal: рассказать, как вы себя чувствуете сегодня
    version: 3
    vocab:
      - "📅 hoy [ой] — сегодня :: Hoy estoy bien. — Сегодня у меня всё хорошо."
      - "😴 cansado/a [канса́до, канса́да] — уставший"
      - "😃 contento/a [контэ́нто, контэ́нта] — довольный, радостный"
      - "😢 triste [три́стэ] — грустный {pos: adj}"
      - "😬 nervioso/a [нэрбьо́со, нэрбьо́са] — взволнованный, нервный"
      - "🤒 enfermo/a [энфэ́рмо, энфэ́рма] — больной"
      - "⏳ ocupado/a [окупа́до, окупа́да] — занятой"
      - "🥱 aburrido/a [абурри́до, абурри́да] — скучающий; скучный"
    blocks:
      - "На вопрос **¿Cómo estás?** теперь можно ответить подробнее: **estar** + слово, которое описывает состояние."
      - learn: [hoy, cansado/a, contento/a, triste]
      - choose:
          title: "¿Cómo estás?"
          skill: estar_state
          items:
            - q: "😴 Пабло не спал всю ночь. Что он скажет?"
              options: "Estoy cansado. | Estoy contento. | Estoy triste."
            - q: "😢 Лучший друг Пабло уехал в другую страну. Что он скажет?"
              options: "Estoy triste. | Estoy contento. | Estoy cansado."
            - q: "😃 У Пабло отличная новость. Что он скажет?"
              options: "Estoy contento. | Estoy cansado. | Estoy triste."
      - tip:
          id: agree
          text: "Это прилагательные, поэтому они согласуются: _Pablo está cansado_, _Ana está cansada_, _Estamos cansados_. **triste** по родам не меняется: _Pablo está triste_, _Ana está triste_."
      - learn: [nervioso/a, enfermo/a, ocupado/a, aburrido/a]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "nervioso — взволнованный"
            - "enfermo — больной"
            - "ocupado — занятой"
            - "aburrido — скучающий"
            - "contento — довольный"
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - q: "Я (женщина) сегодня устала."
              a: "Hoy estoy cansada | Estoy cansada hoy"
              mistakes: {"hoy soy cansada": "Состояние сейчас — **estar**: Hoy estoy cansada.", "hoy estoy cansado": "Говорит женщина — cansad**a**."}
            - "Моя сестра болеет. => Mi hermana está enferma"
            - "Мы очень заняты. => Estamos muy ocupados | Estamos muy ocupadas"
          rule: agree
          skill: estar_state
      - choose:
          title: Послушайте и выберите
          skill: estar_state
          items:
            - say: "Hoy estoy muy cansada."
              options: "Сегодня я очень устала. | Сегодня я очень занята. | Сегодня я очень довольна."
              noaudio: {q: "Что значит «Hoy estoy muy cansada.»?", options: "Сегодня я очень устала. | Сегодня я очень занята. | Сегодня я очень довольна."}
            - say: "Pablo está enfermo."
              options: "Пабло болеет. | Пабло устал. | Пабло нервничает."
              noaudio: {q: "Что значит «Pablo está enfermo.»?", options: "Пабло болеет. | Пабло устал. | Пабло нервничает."}

  - id: gramatica
    kind: grammar
    title: Ser или estar?
    goal: выбрать ser или estar
    version: 3
    vocab:
      - "⏰ ahora [ао́ра] — сейчас :: Ahora estoy en casa. — Сейчас я дома."
      - "♾ siempre [сьэ́мпрэ] — всегда"
    blocks:
      - "В испанском два глагола «быть»: **ser** и **estar**. Посмотрите на пары: в чём разница?"
      - examples:
          items:
            - "Pablo es alto. — Пабло высокий."
            - "Pablo está cansado. — Пабло устал."
            - "Ana es médica. — Ана — врач."
            - "Ana está en el hospital. — Ана в больнице."
      - compare:
          id: ser_estar
          cards:
            - head: SER
              say: false
              label: кто это и какой он по сути
              tone: blue
              text: имя, профессия, откуда и национальность, внешность, характер
              ex: ["Soy Carmen.", "Ana es médica.", "Somos de Kiev.", "Eres muy simpática."]
            - head: ESTAR
              say: false
              label: где и в каком состоянии сейчас
              tone: sun
              text: где находится человек или вещь, самочувствие, настроение
              ex: ["Estoy en Madrid.", "Pablo está cansado.", "¿Estás triste?"]
      - sort:
          title: "Ser или estar?"
          skill: ser_estar
          groups:
            "ser": [médica, alto, de Kiev, simpática]
            "estar": [cansado, en Madrid, enfermo, contenta]
      - learn: [ahora, siempre]
      - "Иногда от глагола зависит смысл: **ser aburrido** — «быть скучным человеком», **estar aburrido** — «скучать прямо сейчас»."
      - examples:
          items:
            - "Pablo es aburrido. — Пабло скучный (человек)."
            - "Pablo está aburrido. — Пабло скучно (сейчас)."
            - "Mi abuelo siempre es muy serio, pero ahora está contento. — Мой дедушка всегда очень серьёзный, но сейчас доволен."
      - choose:
          title: "¿Ser o estar?"
          skill: ser_estar
          items:
            - q: "Hoy Pablo ___ aburrido: no hay tele en casa."
              options: "está | es"
              explain: "Пабло скучно сейчас — это состояние: está."
            - q: "Mi abuelo siempre ___ muy serio."
              options: "es | está"
              explain: "Siempre — постоянная черта характера: es."
      - write:
          title: "¿Ser o estar?"
          format: одна форма — ser или estar
          rule: ser_estar
          skill: ser_estar
          items:
            - "Yo ___ de Ucrania. => soy"
            - "Ahora (yo) ___ en la oficina. => estoy"
            - "Mi hermana ___ muy simpática. => es"
            - "Hoy mi hermana ___ triste. => está"
            - "Nosotros ___ estudiantes. => somos"
            - "¿Dónde ___ tus padres? => están"
      - choose:
          title: Послушайте и выберите
          skill: ser_estar
          items:
            - say: "Mi hermana es simpática, pero hoy está triste."
              options: "Моя сестра симпатичная, но сегодня грустная. | Моя сестра грустная, но сегодня симпатичная. | Моя сестра всегда грустная."
              noaudio: {q: "Что значит «Mi hermana es simpática, pero hoy está triste.»?", options: "Моя сестра симпатичная, но сегодня грустная. | Моя сестра грустная, но сегодня симпатичная. | Моя сестра всегда грустная."}
            - say: "¿Dónde estás ahora?"
              options: "Где ты сейчас? | Как ты сейчас? | Кто ты?"
              noaudio: {q: "Что значит «¿Dónde estás ahora?»?", options: "Где ты сейчас? | Как ты сейчас? | Кто ты?"}

  - id: dialogo
    kind: dialogue
    title: ¿Qué te pasa?
    goal: спросить, что случилось, и объяснить причину
    version: 3
    vocab:
      - "❓ ¿Qué te pasa? [кэ тэ па́са] — что с тобой? что случилось?"
      - "❓ ¿Por qué? [пор кэ] — почему?"
      - "💡 porque [по́ркэ] — потому что :: Estoy cansado porque trabajo mucho. — Я устал, потому что много работаю."
      - "👔 el jefe / la jefa [хэ́фэ, хэ́фа] — начальник, начальница"
      - "🎉 ¡Qué bien! [кэ бьен] — как здорово!"
    blocks:
      - learn: ["¿Qué te pasa?", "¿Por qué?", porque]
      - compare:
          id: porque
          cards:
            - head: ¿por qué?
              label: «почему?» — раздельно и с ударением
              tone: blue
              ex: ["¿Por qué estás triste?"]
            - head: porque
              label: «потому что» — слитно, без ударения
              tone: mint
              ex: ["Porque estoy muy cansado."]
      - choose:
          title: Por qué или porque?
          skill: porque
          items:
            - q: "Как спросить «Почему ты грустный?»"
              options: "¿Por qué estás triste? | ¿Porque estás triste? | ¿Qué estás triste?"
            - q: "— ¿Por qué estudias español? — ___ mi novia vive en Sevilla."
              options: "Porque | Por qué | Qué"
      - learn: [el jefe / la jefa, ¡Qué bien!]
      - dialogue:
          id: pablo
          lines:
            - "Ana: Hola, Pablo. ¿Qué tal? | Привет, Пабло. Как дела?"
            - "Pablo: Regular. | Так себе."
            - "Ana: ¿Qué te pasa? ¿Estás enfermo? | Что с тобой? Ты заболел?"
            - "Pablo: No, no estoy enfermo. Estoy cansado. | Нет, не заболел. Я устал."
            - "Ana: ¿Por qué? | Почему?"
            - "Pablo: Porque trabajo mucho. Y mi jefe es muy antipático. | Потому что много работаю. И мой начальник очень неприятный."
            - "Ana: Vaya... | Вот как..."
            - "Pablo: ¿Y tú? ¿Qué tal? | А ты? Как дела?"
            - "Ana: ¡Muy bien! Estoy muy contenta: ¡tengo un piso nuevo! | Отлично! Я очень довольна: у меня новая квартира!"
            - "Pablo: ¡Qué bien! ¿Dónde está? | Как здорово! Где она?"
            - "Ana: En el centro, cerca de la universidad. ¡Y es muy bonito! | В центре, недалеко от университета. И очень красивая!"
      - more:
          title: ¡Vaya!
          text: "**¡Vaya!** — «вот как», «ну и ну»: так говорят, услышав неожиданную или неприятную новость. _Estoy enfermo. — ¡Vaya!_"
      - choose:
          title: Responde
          source: pablo
          rule: none
          items:
            - q: "¿Cómo está Pablo?"
              options: "Está cansado. | Está enfermo. | Está contento."
            - q: "¿Por qué está cansado?"
              options: "Porque trabaja mucho. | Porque está enfermo. | Porque tiene un piso nuevo."
              explain: "Pablo: Porque trabajo mucho. Y mi jefe es muy antipático."
              skill: porque
            - q: "¿Cómo es el jefe de Pablo?"
              options: "Es muy antipático. | Es muy simpático. | Está cansado."
              explain: "Pablo: Y mi jefe es muy antipático."
              skill: ser_estar
            - q: "¿Por qué está contenta Ana?"
              options: "Porque tiene un piso nuevo. | Porque su jefe es simpático. | Porque está en Sevilla."
      - choose:
          title: Что ответить?
          free: true
          rule: none
          items:
            - lines: ["Ana: ¿Qué te pasa?"]
              q: "Пабло заболел. Что он ответит?"
              options: "Estoy enfermo. | Estoy contento. | ¡Qué bien!"
              explain: "¿Qué te pasa? — «что с тобой?»: отвечают, что случилось."
            - lines: ["Ana: ¡Tengo un piso nuevo!"]
              options: "¡Qué bien! | ¿Qué te pasa? | Porque."
      - build:
          title: Соберите фразу
          free: true
          rule: porque
          skill: porque
          items:
            - es: "Estoy cansado porque trabajo mucho."
              ru: "Я устал, потому что много работаю."
              extra: [qué]
      - choose:
          title: Послушайте и выберите
          free: true
          skill: porque
          items:
            - say: "¿Qué te pasa?"
              options: "Что с тобой? | Как тебя зовут? | Где ты?"
              noaudio: {q: "Что значит «¿Qué te pasa?»?", options: "Что с тобой? | Как тебя зовут? | Где ты?"}
            - say: "Estoy contento porque tengo un piso nuevo."
              options: "Я рад, потому что у меня новая квартира. | Я рад, потому что у меня новая работа. | Я устал, потому что у меня новая квартира."
              noaudio: {q: "Что значит «Estoy contento porque tengo un piso nuevo.»?", options: "Я рад, потому что у меня новая квартира. | Я рад, потому что у меня новая работа. | Я устал, потому что у меня новая квартира."}
    forms: [vaya]

  - id: practica
    kind: practice
    title: Ser и estar на практике
    goal: рассказать о себе и о других с ser и estar
    version: 2
    blocks:
      - write:
          title: "¿Ser o estar?"
          format: одна форма — ser или estar
          skill: ser_estar
          items:
            - "Madrid ___ en España. => está"
            - "Lucía ___ española, de Sevilla. => es"
            - "¿Por qué ___ (tú) nervioso? => estás"
            - "Mis abuelos ___ mayores. => son"
            - "Vosotros ___ muy divertidos. => sois"
      - write:
          title: Исправьте ошибку
          format: исправленная фраза целиком
          skill: ser_estar
          items:
            - "`Soy` cansado. => Estoy cansado"
            - "Mi padre `está` ingeniero. => Mi padre es ingeniero"
            - "¿Dónde `es` el baño? => ¿Dónde está el baño?"
      - mission:
          id: call
          title: Звонок маме
          text: "Вы — Лусия. Вы в Барселоне по работе и очень устали: работы много. Ваш новый начальник — очень приятный человек. Звонит мама."
      - choose:
          source: call
          skill: estar_location
          items:
            - lines: ["Madre: Hola, Lucía. ¿Dónde estás?"]
              options: "Estoy en Barcelona. | Soy en Barcelona. | Es en Barcelona."
      - write:
          source: call
          skill: [estar_state, porque]
          items:
            - q: "Madre: ¿Cómo estás? — Ответьте: вы устали, потому что много работаете."
              a: "Estoy cansada porque trabajo mucho | Estoy muy cansada porque trabajo mucho"
              mistakes: {"estoy cansado porque trabajo mucho": "Вы — Лусия: cansad**a**.", "soy cansada porque trabajo mucho": "Состояние — **estar**: estoy cansada.", "estoy cansada por qué trabajo mucho": "«Потому что» — **porque**, слитно и без ударения."}
              format: ответ по-испански
      - choose:
          source: call
          skill: ser_estar
          items:
            - lines: ["Madre: ¿Y cómo es tu jefe?"]
              options: "Es muy simpático. | Está muy simpático. | Estoy muy simpática."
              explain: "Характер — ser: es simpático."
      - build:
          free: true
          skill: ser_estar
          items:
            - es: "Somos de Kiev, pero ahora estamos en Barcelona."
              ru: "Скажите о себе и коллеге: «Мы из Киева, но сейчас мы в Барселоне»."
              extra: [son]

  - id: quiz
    kind: quiz
    title: Ser и estar
    goal: рассказать о самочувствии, выбрать ser или estar и объяснить причину
    version: 3
    check: soft
    blocks:
      - "Это тест по теме «Состояния. Ser и estar»."
      - cando:
          - "рассказать о своём самочувствии и настроении: Estoy cansado. Estoy contenta. Estoy enfermo."
          - "выбрать между ser и estar"
          - "спросить ¿Por qué? и ответить Porque..."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "contento — довольный"
            - "enfermo — больной"
            - "ocupado — занятой"
            - "ahora — сейчас"
            - "siempre — всегда"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          items:
            - q: "Скажите: «Сегодня я очень занят(а)»."
              a: "Hoy estoy muy ocupado | Hoy estoy muy ocupada | Estoy muy [ocupado/ocupada] hoy"
              skill: estar_state
              mistakes: {"hoy soy muy ocupado": "Состояние сейчас — **estoy**: Hoy estoy muy ocupado."}
            - q: "Спросите друга: «Почему ты грустный?»"
              a: "¿Por qué estás triste? | ¿Por qué tú estás triste?"
              skill: porque
              mistakes: {"porque estas triste": "Вопрос «почему?» — два слова со значком: **¿Por qué…?**", "por que eres triste": "Состояние сейчас — **estás** triste."}
    quiz:
      - q: "Hoy ___ muy cansada."
        options: "estoy | soy | es"
        explain: "Здесь говорится о том, как человек себя чувствует сейчас, поэтому нужен глагол estar: Hoy estoy muy cansada."
        skill: estar_state
      - q: "Mi madre ___ profesora."
        options: "es | está | estoy"
        explain: "Профессию называют с глаголом ser, поэтому правильно сказать: Mi madre es profesora."
        skill: ser_estar
      - q: "¿Dónde ___ la universidad?"
        options: "está | es | hay"
        explain: "Если вы спрашиваете, где находится известное место или вещь, то нужен глагол estar: ¿Dónde está...?"
        skill: ser_estar
      - q: Как сказать «почему»?
        options: "¿Por qué? | ¿Porque? | ¿Qué?"
        explain: "Вопрос «почему?» пишется в два слова и с ударением: ¿Por qué? А porque без ударения значит «потому что»."
        skill: porque
      - q: "Pablo ___ alto y moreno."
        options: "es | está | están"
        explain: "Внешность — это постоянное качество человека, поэтому её описывают с глаголом ser: Pablo es alto y moreno."
        skill: ser_estar
