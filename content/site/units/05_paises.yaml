id: paises
number: 5
level: A0
title: Страны, национальности, языки
goals:
  - сказать, откуда вы, и спросить собеседника
  - назвать национальность в мужском и женском роде
  - рассказать, на каких языках вы говорите и где живёте

lessons:
  - id: vocab1
    kind: vocab
    title: ¿De dónde eres?
    vocab:
      - "🌍 ¿De dónde eres? [дэ до́ндэ э́рэс] — откуда ты? :: ¿De dónde eres, Iván? — Откуда ты, Иван?"
      - "📍 soy de... [сой дэ] — я из... :: Soy de España. — Я из Испании."
      - "🇺🇦 Ucrania [укра́нья] — Украина"
      - "🇲🇽 México [мэ́хико] — Мексика"
      - "🇦🇷 Argentina [архэнти́на] — Аргентина"
      - "🇨🇴 Colombia [коло́мбья] — Колумбия"
      - "🇫🇷 Francia [фра́нθья] — Франция"
    blocks:
      - "Откуда вы? Обычно этот вопрос задают сразу после вопроса об имени, почти в любом знакомстве. Если вы с человеком на «ты», то спросите **¿De dónde eres?**, а если на «вы», то спросите **¿De dónde es usted?** Чтобы ответить, скажите **soy de** и назовите страну: _Soy de Ucrania._ _Soy de España._"
      - examples:
          items:
            - "¿De dónde eres? — Откуда ты?"
            - "Soy de Ucrania. ¿Y tú? — Я из Украины. А ты?"
            - "Soy de México. — Я из Мексики."
            - "¿De dónde es usted? — Откуда вы?"
            - "Ella es de Colombia. — Она из Колумбии."
      - tip: "Слово **México** пишется через букву `x`, но читается [мэ́хико], потому что это старое написание звука «х». Оно сохранилось в названии страны: _Soy de México._ _¿Eres de México?_ _Carlos es de México._"
      - exercise:
          title: Traduce
          items:
            - "Я из Украины. => Soy de Ucrania."
            - "Откуда ты? => ¿De dónde eres?"
            - "Карлос из Аргентины. => Carlos es de Argentina."
            - "Откуда вы, сеньора? => ¿De dónde es usted, señora?"

  - id: vocab2
    kind: vocab
    title: Ещё страны
    vocab:
      - "🇩🇪 Alemania [алема́нья] — Германия"
      - "🇮🇹 Italia [ита́лья] — Италия"
      - "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra [инглатэ́рра] — Англия"
      - "🇺🇸 Estados Unidos [эста́дос уни́дос] — США"
      - "🇨🇳 China [чи́на] — Китай"
      - "➕ también [тамбье́н] — тоже, также :: Soy de Ucrania. Yo también. — Я из Украины. Я тоже."
    blocks:
      - "Сегодня вы узнаете ещё пять стран и одно очень полезное слово **también**, которое значит «тоже»."
      - examples:
          items:
            - "Marco es de Italia. — Марко из Италии."
            - "Li es de China. — Ли из Китая."
            - "Tom es de Inglaterra. — Том из Англии."
            - "¿Eres de Alemania? — No, soy de Francia. — Ты из Германии? — Нет, я из Франции."
      - tip: "Если собеседник говорит что-то о себе, а у вас так же, то ответьте коротко: **yo también**, то есть «я тоже». Если речь о ком-то другом, то поставьте **también** после его имени: _Soy de Ucrania. — Yo también._ _Carlos es de México. — Ana también._ _Marco es de Italia y Pablo también._"
      - exercise:
          title: Responde
          items:
            - "¿De dónde es Marco? => Es de Italia."
            - "¿De dónde es Li? => Es de China."
            - "¿De dónde eres tú? => Soy de..."
            - "Soy de España. ¿Y tú? (вы тоже) => Yo también."

  - id: nacionalidad
    kind: grammar
    title: "Национальности: ucraniano — ucraniana"
    vocab:
      - "🇺🇦 ucraniano/a [укранья́но, укранья́на] — украинец / украинка :: Iván es ucraniano. Olga es ucraniana. — Иван украинец. Ольга украинка."
      - "🇪🇸 español/a [эспаньо́ль, эспаньо́ла] — испанец / испанка; испанский :: Pablo es español. — Пабло испанец."
      - "🇲🇽 mexicano/a [мэхика́но] — мексиканец / мексиканка"
      - "🇦🇷 argentino/a [архэнти́но] — аргентинец / аргентинка"
      - "🇨🇴 colombiano/a [коломбья́но] — колумбиец / колумбийка"
      - "🇮🇹 italiano/a [италья́но] — итальянец / итальянка"
      - "🇺🇸 americano/a [амэрика́но] — американец / американка"
      - "🇨🇳 chino/a [чи́но] — китаец / китаянка"
      - "🇫🇷 francés/a [франθэ́с, франθэ́са] — француз / француженка; французский"
      - "🇩🇪 alemán/a [алема́н, алема́на] — немец / немка; немецкий"
      - "🇬🇧 inglés/a [ингле́с, ингле́са] — англичанин / англичанка; английский"
    blocks:
      - "Сегодня вы узнаете, как назвать национальность человека. Сравните пары примеров. Как меняется слово, когда речь идёт о женщине?"
      - examples:
          items:
            - "Iván es ucraniano. — Иван украинец."
            - "Olga es ucraniana. — Ольга украинка."
            - "Pablo es español. — Пабло испанец."
            - "Lucía es española. — Лусия испанка."
            - "Pierre es francés. — Пьер француз."
            - "Marie es francesa. — Мари француженка."
      - rule: |
          1. Если национальность в мужском роде заканчивается на **-o**, то в женском роде **-o** меняется на **-a**: ucranian**a**, mexican**a**, argentin**a**, colombian**a**, italian**a**, american**a**, chin**a**. _Iván es ucraniano y Olga es ucraniana._ _Marco es italiano y Clara es italiana._
          2. Если национальность в мужском роде заканчивается на согласную, то в женском роде к ней добавляется **-a**: из español получается español**a**. _Pablo es español y Lucía es española._ _Carlos es español y Carmen es española._
          3. Если на последнем слоге стоит значок ударения, как в словах francés, alemán и inglés, то в женском роде он пропадает: frances**a**, aleman**a**, ingles**a**. Значок больше не нужен, потому что в слове появляется ещё один слог, и ударение по общему правилу и так падает на предпоследний слог: fran**ce**sa, ale**ma**na, in**gle**sa. _Pierre es francés y Marie es francesa._ _Hans es alemán y Emma es inglesa._
          4. Национальности пишутся **с маленькой буквы**, а названия стран пишутся с большой: _Soy ucraniana, de Ucrania._ _Diego es argentino, de Argentina._ _Carmen es española, de España._
      - note: "Официально жителей США называют `estadounidense`, но в разговоре чаще говорят **americano** и **americana**: _Él es americano._ _Ella es americana._ _¿Eres americano?_"
      - exercise:
          title: Responde
          items:
            - "Ana es de México. Es ___ => mexicana"
            - "Diego es de Argentina. Es ___ => argentino"
            - "Carmen es de España. Es ___ => española"
            - "Iván es de Ucrania. Es ___ => ucraniano"
            - "Marie es de Francia. Es ___ => francesa"
            - "Hans es de Alemania. Es ___ => alemán"
            - "Emma es de Inglaterra. Es ___ => inglesa"
            - "Li es de China. Es ___ => chino"
      - task: "Напишите в комментариях несколько фраз о себе: **Me llamo... Soy de... Soy ucraniano / ucraniana**. Если у вас другая национальность, то назовите свою."
    allow: [Marie, Hans, Emma]

  - id: idiomas
    kind: grammar
    title: ¿Hablas español?
    vocab:
      - "🗣 hablar [абла́р] — говорить, разговаривать {forms: hablo hablas habla} :: Hablo español. — Я говорю по-испански."
      - "🇪🇸 el español [эспаньо́ль] — испанский язык"
      - "🇺🇦 el ucraniano [укранья́но] — украинский язык"
      - "🇬🇧 el inglés [ингле́с] — английский язык"
      - "🤏 un poco [ун по́ко] — немного {pos: phrase} :: Hablo un poco de español. — Я немного говорю по-испански."
      - "↔️ pero [пэ́ро] — но :: Hablo inglés, pero no hablo francés. — Я говорю по-английски, но не по-французски."
      - "➕ e [э] — и (перед словами на `i-`, `hi-`) :: Hablo español e inglés. — Я говорю по-испански и по-английски."
    blocks:
      - "Посмотрите на примеры. Как по-испански называется язык и чем это слово похоже на национальность?"
      - examples:
          items:
            - "¿Hablas inglés? — Ты говоришь по-английски?"
            - "Sí, hablo inglés y un poco de francés. — Да, я говорю по-английски и немного по-французски."
            - "Pierre habla francés. — Пьер говорит по-французски."
            - "Li habla chino e inglés. — Ли говорит по-китайски и по-английски."
      - rule: |
          1. Язык называется так же, как национальность в мужском роде, и перед ним ставится артикль **el**: **el español, el ucraniano, el inglés, el francés, el alemán, el italiano, el chino**. Сравните: _Pablo es español_ значит «Пабло испанец», а _el español_ значит «испанский язык». Так же _Pierre es francés_ значит «Пьер француз», а _el francés_ значит «французский язык».
          2. Если язык стоит сразу после глагола **hablar**, то артикль не нужен: _Hablo español._ _¿Hablas inglés?_ _Li habla chino._
      - table:
          title: "hablar — говорить"
          rows:
            - ["yo", "habl**o**"]
            - ["tú", "habl**as**"]
            - ["él / ella / usted", "habl**a**"]
      - note: "Союз **y** значит «и». Если следующее слово начинается на звук «и», то вместо **y** говорят и пишут **e**, чтобы два звука «и» не слились в один: _español e inglés_, _francés e italiano_, _Hablo ucraniano e inglés._ Если же следующее слово начинается с другого звука, то остаётся **y**: _inglés y español_, _italiano y francés_."
      - exercise:
          title: Traduce
          items:
            - "Ты говоришь по-английски? => ¿Hablas inglés?"
            - "Да, немного. => Sí, un poco."
            - "Я говорю по-украински и по-испански. => Hablo ucraniano y español."
            - "Марко говорит по-итальянски и по-английски. => Marco habla italiano e inglés."
            - "Я не говорю по-китайски. => No hablo chino."
    allow: []

  - id: lectura
    kind: reading
    title: Друзья со всего мира
    vocab:
      - "🏡 ¿Dónde vives? [до́ндэ би́бэс] — где ты живёшь?"
      - "🏠 vivir [биби́р] — жить {forms: vivo vives vive}"
      - "📍 en [эн] — в, на :: Vivo en Madrid. — Я живу в Мадриде."
      - "🤝 el amigo / la amiga [ами́го, ами́га] — друг / подруга"
    blocks:
      - "Это ваш первый настоящий текст! Все слова в нём вы уже знаете, а новые слова собраны в списке ниже, перед текстом. Прочитайте текст вслух, потом послушайте аудио и ответьте на вопросы."
      - reading:
          title: Mis amigos
          text: |
            Hola. Me llamo Iván. Soy ucraniano, de Kiev, pero vivo en Madrid. Hablo ucraniano, inglés y un poco de español.

            Mi amiga se llama Sofía. Es argentina, de Buenos Aires. Sofía habla español e italiano.

            Mi amigo Pierre es francés. Él también vive en Madrid. Habla francés, español y un poco de ucraniano. ¡Muy bien, Pierre!
          translation: |
            Привет. Меня зовут Иван. Я украинец, из Киева, но живу в Мадриде. Говорю по-украински, по-английски и немного по-испански.

            Мою подругу зовут Софья. Она аргентинка, из Буэнос-Айреса. Софья говорит по-испански и по-итальянски.

            Мой друг Пьер — француз. Он тоже живёт в Мадриде. Говорит по-французски, по-испански и немного по-украински. Молодец, Пьер!
      - exercise:
          title: Responde
          items:
            - "¿De dónde es Iván? => Es de Ucrania, de Kiev."
            - "¿Dónde vive Iván? => Vive en Madrid."
            - "¿Sofía es mexicana? => No, es argentina."
            - "¿Pierre habla ucraniano? => Sí, un poco."
      - note: "**Mis amigos** значит «мои друзья». Это множественное число от **mi amigo**. О том, как образуется множественное число, мы поговорим совсем скоро."
    forms: [mis, amigos]
    quiz:
      - q: ¿De dónde es Sofía?
        options: "De Argentina. | De Francia. | De Ucrania."
      - q: ¿Dónde vive Pierre?
        options: "En Madrid. | En Kiev. | En Buenos Aires."

  - id: dialogo
    kind: dialogue
    title: В языковой школе
    blocks:
      - "В этом уроке новых слов нет: в диалоге только то, что вы уже знаете. Прочитайте диалог, послушайте его, а потом попробуйте разыграть вслух."
      - dialogue:
          lines:
            - "Pablo: ¡Hola! Me llamo Pablo. ¿Cómo te llamas? | Привет! Меня зовут Пабло. Как тебя зовут?"
            - "Irina: Hola, Pablo. Me llamo Irina. | Привет, Пабло. Меня зовут Ирина."
            - "Pablo: Encantado. ¿De dónde eres, Irina? | Очень приятно. Откуда ты, Ирина?"
            - "Irina: Soy de Ucrania, de Leópolis. ¿Y tú? | Я из Украины, из Львова. А ты?"
            - "Pablo: Yo soy mexicano. ¿Hablas inglés? | Я мексиканец. Ты говоришь по-английски?"
            - "Irina: Sí, hablo inglés y un poco de español. | Да, говорю по-английски и немного по-испански."
            - "Pablo: ¡Hablas muy bien! | Ты отлично говоришь!"
            - "Irina: Gracias. Pero más despacio, por favor. | Спасибо. Но помедленнее, пожалуйста."
            - "Pablo: ¡Vale! ¿Dónde vives? | Хорошо! Где ты живёшь?"
            - "Irina: Vivo en Madrid. ¿Y tú? | Живу в Мадриде. А ты?"
            - "Pablo: ¡Yo también! | Я тоже!"
      - exercise:
          title: Responde
          items:
            - "¿De dónde es Irina? => Es de Ucrania, de Leópolis."
            - "¿Pablo es español? => No, es mexicano."
            - "¿Qué habla Irina? => Inglés y un poco de español."
            - "¿Dónde vive Pablo? => En Madrid."
      - task: "Ответьте в комментариях на три вопроса: **¿De dónde eres? ¿Dónde vives? ¿Hablas inglés?**"

  - id: quiz
    kind: quiz
    title: Страны и языки
    blocks:
      - "Это тест по теме «Страны, национальности, языки». Проверьте, что вы запомнили."
      - cando:
          - "сказать, откуда вы: Soy de Ucrania"
          - "назвать национальность: ucraniano / ucraniana, español / española"
          - "рассказать о языках: Hablo ucraniano y un poco de español"
          - "сказать, где живёте: Vivo en..."
    quiz:
      - q: "Olga es de Ucrania. Es ___"
        options: "ucraniana | ucraniano | Ucrania"
        explain: "Ольга — женщина, поэтому нужна форма женского рода: ucraniana. А Ucrania — это название страны."
      - q: "Pierre es de Francia. Es ___"
        options: "francés | francesa | Francia"
        explain: "Пьер — мужчина, поэтому нужна форма мужского рода: francés. А форму francesa используют, когда говорят о женщине."
      - q: Как сказать «Я говорю по-испански и по-английски»?
        options: "Hablo español e inglés. | Hablo español y inglés. | Habla español e inglés."
        explain: "Слово inglés начинается на звук «и», поэтому перед ним вместо y говорят e: español e inglés."
      - q: "¿Dónde vives?"
        options: "Vivo en Madrid. | Soy de Madrid. | Hablo Madrid."
        explain: "Вопрос значит «Где ты живёшь?», поэтому отвечают vivo en и называют город. А soy de говорят, когда отвечают, откуда вы."
      - q: Какое слово пишется с большой буквы?
        options: "Alemania | alemán | alemana"
        explain: "Названия стран пишутся с большой буквы: Alemania. А национальности и языки пишутся с маленькой: alemán, alemana."

  - id: repaso
    kind: review
    title: Большое повторение
    blocks:
      - |
        Позади уже пять тем, а это больше сотни слов и фраз! Сегодня новых слов не будет, будет только повторение. Слова для него выбраны по системе интервальных повторений: это те слова, которые давно не встречались в текстах.
      - "Как заниматься: прочитайте слово, **скажите перевод вслух** и только потом откройте ответ. Если вы не вспомнили перевод, ничего страшного: это слово ещё вернётся."
