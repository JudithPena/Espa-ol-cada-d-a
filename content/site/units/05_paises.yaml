id: paises
number: 5
level: A0
title: Страны, национальности, языки
goals:
  - сказать, откуда вы, и спросить собеседника
  - назвать национальность в мужском и женском роде
  - рассказать, на каких языках вы говорите и где живёте

lessons:
  - id: vocab1
    kind: vocab
    title: ¿De dónde eres?
    goal: спросить, откуда человек, и ответить
    vocab:
      - "🌍 ¿De dónde eres? [дэ до́ндэ э́рэс] — откуда ты? :: ¿De dónde eres, Iván? — Откуда ты, Иван?"
      - "📍 soy de... [сой дэ] — я из... :: Soy de España. — Я из Испании."
      - "🇺🇦 Ucrania [укра́нья] — Украина"
      - "🇲🇽 México [мэ́хико] — Мексика"
      - "🇦🇷 Argentina [архэнти́на] — Аргентина"
      - "🇨🇴 Colombia [коло́мбья] — Колумбия"
      - "🇫🇷 Francia [фра́нθья] — Франция"
    blocks:
      - "Откуда вы? Этот вопрос задают почти в любом знакомстве — сразу после имени."
      - learn: ["¿De dónde eres?", soy de..., Ucrania]
      - examples:
          items:
            - "¿De dónde eres? — Откуда ты?"
            - "Soy de Ucrania. ¿Y tú? — Я из Украины. А ты?"
            - "¿De dónde es usted? — Откуда вы?"
      - choose:
          title: Что ответить?
          items:
            - lines: ["Pablo: ¿De dónde eres?"]
              q: "Вы из Украины."
              options: "Soy de Ucrania. | Es de Ucrania. | Eres de Ucrania."
              explain: "О себе — soy de: «я из»."
      - learn: [México, Argentina, Colombia, Francia]
      - tip: "**México** пишется через `x`, но читается [мэ́хико]: это старое написание звука «х», оно сохранилось в названии страны."
      - choose:
          title: Послушайте и выберите
          items:
            - say: "Soy de Colombia."
              options: "Я из Колумбии. | Я из Мексики. | Я из Аргентины."
            - say: "Carlos es de Argentina."
              options: "Карлос из Аргентины. | Карлос из Франции. | Карлос из Колумбии."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Я из Мексики. => Soy de México"
            - "Ана из Франции. => Ana es de Francia"
      - build:
          title: Соберите фразу
          items:
            - es: "¿De dónde es usted, señora?"
              ru: "Откуда вы, сеньора?"
              extra: [eres]

  - id: vocab2
    kind: vocab
    title: Ещё страны
    goal: назвать ещё пять стран и сказать «я тоже»
    vocab:
      - "🇩🇪 Alemania [алема́нья] — Германия"
      - "🇮🇹 Italia [ита́лья] — Италия"
      - "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra [инглатэ́рра] — Англия"
      - "🇺🇸 Estados Unidos [эста́дос уни́дос] — США"
      - "🇨🇳 China [чи́на] — Китай"
      - "➕ también [тамбье́н] — тоже, также :: Soy de Ucrania. Yo también. — Я из Украины. Я тоже."
    blocks:
      - learn: [Alemania, Italia, Inglaterra, Estados Unidos, China]
      - match:
          title: Соедините пары
          pairs:
            - "Alemania — Германия"
            - "Italia — Италия"
            - "Inglaterra — Англия"
            - "Estados Unidos — США"
            - "China — Китай"
      - choose:
          title: Responde
          items:
            - lines: ["Marco: Hola, soy Marco. Soy de Italia."]
              q: "¿De dónde es Marco?"
              options: "Es de Italia. | Soy de Italia. | Es de Inglaterra."
              explain: "О другом человеке — es de: «он из»."
            - lines: ["Tom: Me llamo Tom. Soy de Inglaterra."]
              q: "¿De dónde es Tom?"
              options: "Es de Inglaterra. | Es de Estados Unidos. | Es de Alemania."
      - learn: [también]
      - tip: "Если у вас так же, как у собеседника, ответьте коротко: **yo también** — «я тоже». О другом человеке — **también** после имени: _Carlos es de México. — Ana también._"
      - choose:
          title: Что ответить?
          items:
            - lines: ["Ana: Soy de Ucrania. ¿Y tú?"]
              q: "Вы тоже из Украины."
              options: "Yo también. | Tú también. | Soy también."
      - write:
          title: Закончите фразу
          format: слово по-испански
          items:
            - q: "Marco es de Italia y Clara ___. (Клара тоже из Италии)"
              a: "también"

  - id: nacionalidad
    kind: grammar
    title: "Национальности: ucraniano — ucraniana"
    goal: назвать национальность мужчины и женщины
    vocab:
      - "🇺🇦 ucraniano/a [укранья́но, укранья́на] — украинец / украинка :: Iván es ucraniano. Olga es ucraniana. — Иван украинец. Ольга украинка."
      - "🇲🇽 mexicano/a [мэхика́но] — мексиканец / мексиканка"
      - "🇦🇷 argentino/a [архэнти́но] — аргентинец / аргентинка"
      - "🇨🇴 colombiano/a [коломбья́но] — колумбиец / колумбийка"
      - "🇮🇹 italiano/a [италья́но] — итальянец / итальянка"
      - "🇺🇸 americano/a [амэрика́но] — американец / американка"
      - "🇨🇳 chino/a [чи́но] — китаец / китаянка"
      - "🇪🇸 español/a [эспаньо́ль, эспаньо́ла] — испанец / испанка; испанский :: Pablo es español. — Пабло испанец."
      - "🇫🇷 francés/a [франθэ́с, франθэ́са] — француз / француженка; французский"
      - "🇩🇪 alemán/a [алема́н, алема́на] — немец / немка; немецкий"
      - "🇬🇧 inglés/a [ингле́с, ингле́са] — англичанин / англичанка; английский"
    blocks:
      - "Сравните пары. Как меняется слово, когда речь идёт о женщине?"
      - examples:
          items:
            - "Iván es ucraniano. — Иван украинец."
            - "Olga es ucraniana. — Ольга украинка."
      - learn: [ucraniano/a, mexicano/a, argentino/a, colombiano/a]
      - compare:
          cards:
            - head: -o → -a
              say: false
              label: мужчина → женщина
              tone: blue
              text: Если национальность в мужском роде заканчивается на **-o**, то в женском **-o** меняется на **-a**.
              ex: ["Iván es ucraniano. — Иван украинец.", "Olga es ucraniana. — Ольга украинка."]
      - write:
          title: Закончите фразу
          format: национальность
          items:
            - "Ana es de México. Es ___ => mexicana"
            - "Diego es de Argentina. Es ___ => argentino"
            - "Sofía es de Colombia. Es ___ => colombiana"
      - learn: [italiano/a, americano/a, chino/a]
      - more:
          title: "americano или `estadounidense`?"
          text: "Официально жителей США называют `estadounidense`, но в разговоре чаще говорят **americano** и **americana**: _Él es americano._ _Ella es americana._"
      - choose:
          title: Выберите форму
          items:
            - q: "Li es de China. Es ___."
              options: "chino | china | China"
              explain: "Ли — мужчина: chino. China с большой буквы — страна."
            - q: "Clara es de Italia. Es ___."
              options: "italiana | italiano | Italia"
      - header: Если на конце согласная
      - learn: [español/a, francés/a, alemán/a, inglés/a]
      - compare:
          cards:
            - head: + -a
              say: false
              label: на согласную
              tone: sun
              text: Если национальность заканчивается на согласную, то в женском роде добавляется **-a**.
              ex: ["Pablo es español. — Пабло испанец.", "Lucía es española. — Лусия испанка."]
            - head: francés → francesa
              label: значок пропадает
              tone: rose
              text: В женском роде появляется ещё один слог, ударение по общему правилу падает на предпоследний — и значок не нужен.
              ex: ["Pierre es francés. — Пьер француз.", "Marie es francesa. — Мари француженка."]
      - write:
          title: Закончите фразу
          format: национальность
          accents: strict
          items:
            - "Carmen es de España. Es ___ => española"
            - q: "Marie es de Francia. Es ___"
              a: francesa
              explain: "В женском роде значок пропадает: francés — francesa."
            - q: "Hans es de Alemania. Es ___"
              a: alemán
              explain: "Ударение на последнем слоге, слово кончается на `n` — значок нужен: alemán."
            - "Emma es de Inglaterra. Es ___ => inglesa"
      - note: "Национальности пишутся **с маленькой буквы**, а страны — с большой: _Soy ucraniana, de Ucrania._ _Diego es argentino, de Argentina._"
    allow: [Marie, Hans, Emma]

  - id: idiomas
    kind: grammar
    title: ¿Hablas español?
    goal: сказать, на каких языках вы говорите
    vocab:
      - "🗣 hablar [абла́р] — говорить, разговаривать {forms: hablo hablas habla} :: Hablo español. — Я говорю по-испански."
      - "🇪🇸 el español [эспаньо́ль] — испанский язык"
      - "🇺🇦 el ucraniano [укранья́но] — украинский язык"
      - "🇬🇧 el inglés [ингле́с] — английский язык"
      - "🤏 un poco [ун по́ко] — немного {pos: phrase} :: Hablo un poco de español. — Я немного говорю по-испански."
      - "↔️ pero [пэ́ро] — но :: Hablo inglés, pero no hablo francés. — Я говорю по-английски, но не по-французски."
      - "➕ e [э] — и (перед словами на `i-`, `hi-`) :: Hablo español e inglés. — Я говорю по-испански и по-английски."
    blocks:
      - "Посмотрите на примеры. Как называется язык и чем это слово похоже на национальность?"
      - examples:
          items:
            - "¿Hablas inglés? — Ты говоришь по-английски?"
            - "Pierre habla francés. — Пьер говорит по-французски."
      - learn: [hablar, el español, el ucraniano, el inglés]
      - rule: |
          1. Язык называется как национальность в мужском роде, с артиклем **el**: **el español, el ucraniano, el inglés, el francés**. _Pablo es español_ — «Пабло испанец», а _el español_ — «испанский язык».
          2. Сразу после **hablar** артикль не нужен: _Hablo español._ _¿Hablas inglés?_ _Li habla chino._
      - table:
          title: "hablar — говорить"
          rows:
            - ["yo", "habl**o**"]
            - ["tú", "habl**as**"]
            - ["él / ella / usted", "habl**a**"]
      - choose:
          title: Как сказать?
          items:
            - q: "Я говорю по-украински."
              options: "Hablo ucraniano. | Hablo ucraniana. | Hablo Ucrania."
              explain: "Язык — как национальность в мужском роде: ucraniano. Ucrania — страна."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Я говорю по-испански. => Hablo español"
            - "Ты говоришь по-английски? => ¿Hablas inglés? | Hablas inglés"
            - "Пьер говорит по-французски. => Pierre habla francés"
      - learn: [un poco, pero, e]
      - note: "Союз **y** значит «и». Если следующее слово начинается на звук «и», то вместо **y** говорят **e**: _español e inglés_, _francés e italiano_. Перед другими звуками остаётся **y**: _inglés y español_."
      - choose:
          title: y или e?
          items:
            - q: "Hablo español ___ inglés."
              options: "e | y"
              explain: "Inglés начинается на звук «и», поэтому e."
            - q: "Hablo inglés ___ español."
              options: "y | e"
              explain: "Español начинается не на «и», поэтому y."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Да, немного. => Sí, un poco"
            - "Я не говорю по-китайски. => No hablo chino"
      - build:
          title: Соберите фразу
          items:
            - "Hablo inglés, pero no hablo francés. — Я говорю по-английски, но не по-французски."

  - id: lectura
    kind: reading
    title: Друзья со всего мира
    goal: понять короткий текст о людях — откуда они, где живут, на каких языках говорят
    vocab:
      - "🏠 vivir [биби́р] — жить {forms: vivo vives vive}"
      - "📍 en [эн] — в, на :: Vivo en Madrid. — Я живу в Мадриде."
      - "🏡 ¿Dónde vives? [до́ндэ би́бэс] — где ты живёшь?"
      - "🤝 el amigo / la amiga [ами́го, ами́га] — друг / подруга"
    blocks:
      - learn: [vivir, en, "¿Dónde vives?", el amigo / la amiga]
      - choose:
          title: Что ответить?
          items:
            - lines: ["Ana: ¿Dónde vives?"]
              options: "Vivo en Madrid. | Soy de Madrid. | Hablo Madrid."
              explain: "Где живёте — vivo en. Soy de — откуда вы."
      - reading:
          title: Mis amigos
          text: |
            Hola. Me llamo Iván. Soy ucraniano, de Kiev, pero vivo en Madrid. Hablo ucraniano, inglés y un poco de español.

            Mi amiga se llama Sofía. Es argentina, de Buenos Aires. Sofía habla español e italiano.

            Mi amigo Pierre es francés. Él también vive en Madrid. Habla francés, español y un poco de ucraniano. ¡Muy bien, Pierre!
          translation: |
            Привет. Меня зовут Иван. Я украинец, из Киева, но живу в Мадриде. Говорю по-украински, по-английски и немного по-испански.

            Мою подругу зовут Софья. Она аргентинка, из Буэнос-Айреса. Софья говорит по-испански и по-итальянски.

            Мой друг Пьер — француз. Он тоже живёт в Мадриде. Говорит по-французски, по-испански и немного по-украински. Молодец, Пьер!
      - choose:
          title: Responde
          items:
            - q: "¿Dónde vive Iván?"
              options: "Vive en Madrid. | Vive en Kiev. | Vive en Buenos Aires."
            - q: "¿Sofía es mexicana?"
              options: "No, es argentina. | Sí, es mexicana. | No, es francesa."
            - q: "¿Pierre habla ucraniano?"
              options: "Sí, un poco. | No, no habla ucraniano. | Sí, muy bien."
      - note: "**Mis amigos** значит «мои друзья» — это множественное число от **mi amigo**. Множественное число мы разберём совсем скоро."
    forms: [mis, amigos]
    quiz:
      - q: ¿De dónde es Sofía?
        options: "De Argentina. | De Francia. | De Ucrania."
      - q: ¿Dónde vive Pierre?
        options: "En Madrid. | En Kiev. | En Buenos Aires."

  - id: dialogo
    kind: dialogue
    title: В языковой школе
    goal: рассказать о себе — откуда вы, где живёте, на каких языках говорите
    blocks:
      - "В диалоге только знакомые слова."
      - dialogue:
          lines:
            - "Pablo: ¡Hola! Me llamo Pablo. ¿Cómo te llamas? | Привет! Меня зовут Пабло. Как тебя зовут?"
            - "Irina: Hola, Pablo. Me llamo Irina. | Привет, Пабло. Меня зовут Ирина."
            - "Pablo: Encantado. ¿De dónde eres, Irina? | Очень приятно. Откуда ты, Ирина?"
            - "Irina: Soy de Ucrania, de Leópolis. ¿Y tú? | Я из Украины, из Львова. А ты?"
            - "Pablo: Yo soy mexicano. ¿Hablas inglés? | Я мексиканец. Ты говоришь по-английски?"
            - "Irina: Sí, hablo inglés y un poco de español. | Да, говорю по-английски и немного по-испански."
            - "Pablo: ¡Hablas muy bien! | Ты отлично говоришь!"
            - "Irina: Gracias. Pero más despacio, por favor. | Спасибо. Но помедленнее, пожалуйста."
            - "Pablo: ¡Vale! ¿Dónde vives? | Хорошо! Где ты живёшь?"
            - "Irina: Vivo en Madrid. ¿Y tú? | Живу в Мадриде. А ты?"
            - "Pablo: ¡Yo también! | Я тоже!"
      - choose:
          title: Responde
          items:
            - q: "¿Pablo es español?"
              options: "No, es mexicano. | Sí, es español. | No, es argentino."
            - q: "¿Qué habla Irina?"
              options: "Inglés y un poco de español. | Español e italiano. | Francés e inglés."
            - q: "¿Dónde vive Pablo?"
              options: "En Madrid. | En Leópolis. | En México."
      - mission:
          title: Анкета языкового обмена
          text: "Вы — Марко, итальянец. Живёте в Мадриде, говорите по-итальянски и немного по-испански. Ирина хочет найти партнёра для языкового обмена и задаёт вам вопросы."
      - choose:
          items:
            - lines: ["Irina: ¿De dónde eres, Marco?"]
              options: "Soy de Italia. | Soy italiana. | Es de Italia."
              explain: "Марко — мужчина: soy de Italia или soy italiano. Italiana — о женщине."
      - write:
          items:
            - q: "Irina: ¿Dónde vives?"
              a: "Vivo en Madrid | En Madrid"
              format: ответ по-испански
      - build:
          items:
            - es: "Hablo italiano y un poco de español."
              ru: "Irina: ¿Hablas español? — Ответьте: «Я говорю по-итальянски и немного по-испански»."
              extra: [e]

  - id: quiz
    kind: quiz
    title: Страны и языки
    blocks:
      - "Это тест по теме «Страны, национальности, языки». Проверьте, что вы запомнили."
      - cando:
          - "сказать, откуда вы: Soy de Ucrania"
          - "назвать национальность: ucraniano / ucraniana, español / española"
          - "рассказать о языках: Hablo ucraniano y un poco de español"
          - "сказать, где живёте: Vivo en..."
    quiz:
      - q: "Olga es de Ucrania. Es ___"
        options: "ucraniana | ucraniano | Ucrania"
        explain: "Ольга — женщина, поэтому нужна форма женского рода: ucraniana. А Ucrania — это название страны."
      - q: "Pierre es de Francia. Es ___"
        options: "francés | francesa | Francia"
        explain: "Пьер — мужчина, поэтому нужна форма мужского рода: francés. А форму francesa используют, когда говорят о женщине."
      - q: Как сказать «Я говорю по-испански и по-английски»?
        options: "Hablo español e inglés. | Hablo español y inglés. | Habla español e inglés."
        explain: "Слово inglés начинается на звук «и», поэтому перед ним вместо y говорят e: español e inglés."
      - q: "¿Dónde vives?"
        options: "Vivo en Madrid. | Soy de Madrid. | Hablo Madrid."
        explain: "Вопрос значит «Где ты живёшь?», поэтому отвечают vivo en и называют город. А soy de говорят, когда отвечают, откуда вы."
      - q: Какое слово пишется с большой буквы?
        options: "Alemania | alemán | alemana"
        explain: "Названия стран пишутся с большой буквы: Alemania. А национальности и языки пишутся с маленькой: alemán, alemana."

  - id: repaso
    kind: review
    title: Большое повторение
    goal: проверить себя по темам 1–5 — приветствия, знакомство, числа, страны
    blocks:
      - "Позади пять тем — больше сотни слов и фраз. Сегодня новых слов нет, только повторение."
      - match:
          title: Соедините пары
          pairs:
            - "buenas noches — доброй ночи"
            - "¿Cómo te llamas? — как тебя зовут?"
            - "la pregunta — вопрос"
            - "catorce — 14"
            - "Alemania — Германия"
      - choose:
