  - id: quiz
    kind: quiz
    title: Страны и языки
    goal: сказать, откуда вы, назвать национальность и рассказать о языках
    version: 3
    check: soft
    blocks:
      - "Это тест по теме «Страны, национальности, языки». Проверьте, что вы запомнили."
      - cando:
          - "сказать, откуда вы: Soy de Ucrania"
          - "назвать национальность: ucraniano / ucraniana, español / española"
          - "рассказать о языках: Hablo ucraniano y un poco de español"
          - "сказать, где живёте: Vivo en..."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "¿De dónde eres? — откуда ты?"
            - "también — тоже"
            - "Italia — Италия"
            - "pero — но"
            - "un poco — немного"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          items:
            - q: "Вы — Ольга. Скажите: «Я украинка, из Киева»."
              a: "Soy ucraniana, de Kiev | (Yo) soy ucraniana(,) de Kiev | Soy de Kiev, soy ucraniana"
              skill: nationality
              mistakes: {"soy ucraniano de kiev": "Ольга — женщина: **ucraniana**."}
            - q: "Спросите друга, говорит ли он по-английски."
              a: "¿Hablas inglés? | ¿Tú hablas inglés? | ¿Hablas inglés tú?"
              skill: hablar_lang
              mistakes: {"hablas el ingles": "Сразу после hablar артикль не нужен: **¿Hablas inglés?**"}
    quiz:
      - q: "Olga es de Ucrania. Es ___"
        options: "ucraniana | ucraniano | Ucrania"
        explain: "Ольга — женщина, поэтому нужна форма женского рода: ucraniana. А Ucrania — это название страны."
        skill: nationality
      - q: "Pierre es de Francia. Es ___"
        options: "francés | francesa | Francia"
        explain: "Пьер — мужчина, поэтому нужна форма мужского рода: francés. А форму francesa используют, когда говорят о женщине."
        skill: nationality
      - q: Как сказать «Я говорю по-испански и по-английски»?
        options: "Hablo español e inglés. | Hablo español y inglés. | Habla español e inglés."
        explain: "Слово inglés начинается на звук «и», поэтому перед ним вместо y говорят e: español e inglés."
        skill: y_e
      - q: "¿Dónde vives?"
        options: "Vivo en Madrid. | Soy de Madrid. | Hablo Madrid."
        explain: "Вопрос значит «Где ты живёшь?», поэтому отвечают vivo en и называют город. А soy de говорят, когда отвечают, откуда вы."
        skill: vivir_en
      - q: Какое слово пишется с большой буквы?
        options: "Alemania | alemán | alemana"
        explain: "Названия стран пишутся с большой буквы: Alemania. А национальности и языки пишутся с маленькой: alemán, alemana."
        skill: nationality

