id: compras
number: 17
level: A1
title: Покупки
goals:
  - назвать одежду и описать её
  - считать до тысячи и понимать цены
  - купить вещь в магазине: спросить размер, примерить, заплатить

lessons:
  - id: ropa1
    kind: vocab
    title: Одежда
    goal: назвать одежду и описать её цвет
    version: 2
    vocab:
      - "👚 la ropa [ро́па] — одежда"
      - "👔 la camisa [ками́са] — рубашка"
      - "👕 la camiseta [камисэ́та] — футболка"
      - "👖 los pantalones [пантало́нэс] — брюки"
      - "👗 la falda [фа́льда] — юбка"
      - "👗 el vestido [бэсти́до] — платье"
      - "🧶 el jersey [хэрсэ́й] — свитер {pl: jerséis}"
      - "👞 los zapatos [θапа́тос] — туфли, ботинки"
      - "🧥 la chaqueta [чакэ́та] — куртка, пиджак"
      - "🧥 el abrigo [абри́го] — пальто"
      - "👖 los vaqueros [бакэ́рос] — джинсы"
      - "👟 las zapatillas [θапати́йяс] — кроссовки; тапочки"
      - "🩶 gris [грис] — серый {pos: adj}"
      - "📏 la talla [та́йя] — размер (одежды)"
    blocks:
      - learn: [la ropa, la camisa, la camiseta, los pantalones, la falda]
      - choose:
          title: Traduce
          skill: clothes
          items:
            - q: "Llevo una camiseta blanca."
              options: "На мне белая футболка. | На мне белая рубашка. | На мне белая юбка."
      - learn: [el vestido, el jersey, los zapatos, la chaqueta, el abrigo]
      - match:
          title: Соедините пары
          pairs:
            - "el vestido — платье"
            - "el jersey — свитер"
            - "los zapatos — туфли"
            - "la chaqueta — куртка"
            - "el abrigo — пальто"
      - rule:
          id: color_after
          text: |
            1. Цвет ставится **после** названия одежды: _una camiseta amarilla_, _un vestido azul_.
            2. Цвет согласуется с вещью в роде и числе: _una falda blanca_, _unos zapatos marrones_, _unas camisetas negras_. Цвета на `-e` или согласную по родам не меняются: _un vestido verde_, _una falda verde_.
      - more:
          title: 🌎 А в Латинской Америке?
          text: "Свитер там — **el suéter**, куртка в Мексике — **la chamarra**, в Аргентине — **la campera**."
      - choose:
          title: Выберите
          skill: adj_agreement
          items:
            - q: "Ana lleva una falda ___. (красную)"
              options: "roja | rojo | rojas"
      - learn: [los vaqueros, las zapatillas, gris, la talla]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la ropa — одежда"
            - "los vaqueros — джинсы"
            - "las zapatillas — кроссовки"
            - "la talla — размер"
            - "la camiseta — футболка"
      - write:
          title: Traduce
          format: вещь и цвет по-испански
          rule: color_after
          skill: [clothes, adj_agreement]
          items:
            - q: "белая рубашка"
              a: "una camisa blanca | la camisa blanca"
              mistakes: {"una camisa blanco": "camisa — женского рода: una camisa **blanca**.", "una blanca camisa": "Цвет ставится после вещи: una camisa **blanca**."}
            - q: "синие брюки"
              a: "unos pantalones azules | los pantalones azules"
              mistakes: {"unos pantalones azul": "Брюки — во множественном: **azules**.", "los pantalones azul": "Брюки — во множественном: **azules**."}
            - "чёрное платье => un vestido negro | el vestido negro"
            - q: "серая куртка"
              a: "una chaqueta gris | la chaqueta gris"
              mistakes: {"una chaqueta grisa": "gris по родам не меняется: una chaqueta **gris**."}
            - q: "белые кроссовки"
              a: "unas zapatillas blancas | las zapatillas blancas"
              mistakes: {"unas zapatillas blancos": "zapatillas — женского рода: **blancas**."}
    forms: [suéter, chamarra, campera, jeans]

  - id: numeros
    kind: grammar
    title: Сотни и тысяча
    goal: назвать цену до тысячи и понять её на слух
    version: 3
    # Аудит MYTHOS (PRG-02, U17-04): десятки перенесены в тему 04 (numeros/decenas); здесь — десятки в ценах,
    # сотни (раньше в уроке precios) и женский род сотен (doscientas camisetas).
    vocab:
      - "🔢 mil [миль] — тысяча {pos: num}"
    forms: [ciento, doscientos, doscientas, trescientos, trescientas, cuatrocientos, quinientos, quinientas, seiscientos, setecientos, ochocientos, novecientos]
    blocks:
      - "Десятки вы знаете с темы «Числа и возраст». В магазине нужны и числа побольше."
      - choose:
          title: Послушайте и выберите
          skill: [numbers_ear, tens]
          items:
            - say: "Son cuarenta y cinco euros."
              options: "45 € | 54 € | 40 €"
              noaudio: {q: "Сколько это: «Son cuarenta y cinco euros»?", options: "45 € | 54 € | 40 €"}
            - say: "Son noventa y nueve euros."
              options: "99 € | 19 € | 90 €"
              noaudio: {q: "Сколько это: «Son noventa y nueve euros»?", options: "99 € | 19 € | 90 €"}
      - table:
          id: hundreds
          title: Сотни
          rows:
            - ["101", "ciento uno"]
            - ["200", "doscientos"]
            - ["300", "trescientos"]
            - ["400", "cuatrocientos"]
            - ["500", "**quinientos**"]
            - ["600", "seiscientos"]
            - ["700", "**setecientos**"]
            - ["800", "ochocientos"]
            - ["900", "**novecientos**"]
            - ["1000", "mil"]
      - rule:
          id: cientos
          text: |
            1. Ровно сто — **cien**; если дальше есть число — **ciento**: _ciento uno_, _ciento veinte_.
            2. Остальные сотни: число + `-cientos`: _doscientos_, _trescientos_.
            3. Выделенные сотни — не по правилу: **quinientos**, **setecientos**, **novecientos**.
            4. Со словом женского рода сотни меняют окончание на `-as`: _doscientas camisetas_, _quinientas faldas_.
      - learn: [mil]
      - write:
          title: Напишите словами
          format: число словами
          rule: cientos
          skill: big_numbers
          items:
            - q: "500"
              a: "quinientos"
              mistakes: {"cincocientos": "500 — не по правилу: **quinientos**."}
            - q: "150"
              a: "ciento cincuenta"
              mistakes: {"cien cincuenta": "Если после ста есть число — **ciento**: ciento cincuenta."}
            - q: "700"
              a: "setecientos"
              mistakes: {"sietecientos": "700 — не по правилу: **setecientos**."}
            - q: "200 футболок"
              a: "doscientas camisetas"
              mistakes: {"doscientos camisetas": "camiseta — женского рода: **doscientas** camisetas."}
      - choose:
          title: Послушайте и выберите
          rule: cientos
          skill: [numbers_ear, big_numbers]
          items:
            - say: "Son ciento cincuenta euros."
              options: "150 € | 115 € | 105 €"
              noaudio: {q: "Сколько это: «Son ciento cincuenta euros»?", options: "150 € | 115 € | 105 €"}
            - say: "Son mil doscientos euros."
              options: "1200 € | 1020 € | 200 €"
              noaudio: {q: "Сколько это: «Son mil doscientos euros»?", options: "1200 € | 1020 € | 200 €"}
      - write:
          title: Послушайте и запишите цифрами
          format: число цифрами
          answer: number
          skill: [numbers_ear, big_numbers]
          items:
            - say: "trescientos cuarenta"
              a: "340"
              noaudio: {q: "Запишите цифрами: trescientos cuarenta", a: "340"}
            - say: "quinientos noventa"
              a: "590"
              noaudio: {q: "Запишите цифрами: quinientos noventa", a: "590"}

  - id: demostrativos
    kind: grammar
    title: "Este, ese, aquel"
    goal: показать на вещь — этот, тот, вон тот
    version: 2
    vocab:
      - "👇 este/esta [э́стэ, э́ста] — этот, эта (рядом со мной) {pos: adj, pl: estos estas}"
      - "👉 ese/esa [э́сэ, э́са] — этот, тот (рядом с вами) {pos: adj, pl: esos esas}"
      - "🔭 aquel/aquella [акэ́ль, акэ́йя] — тот, та (далеко) {pos: adj, pl: aquellos aquellas}"
      - "📍 ahí [аи́] — там (рядом с вами)"
    blocks:
      - learn: [este/esta, ese/esa, aquel/aquella, ahí]
      - "В магазине всё время показывают на вещи. Чем отличаются три слова?"
      - compare:
          id: este_ese
          cards:
            - head: este / esta
              label: рядом со мной — aquí
              tone: blue
              ex: ["Me gusta esta camisa."]
            - head: ese / esa
              label: рядом с вами — ahí
              tone: mint
              ex: ["¿Y esa falda?"]
            - head: aquel / aquella
              label: далеко от нас — allí
              tone: sun
              ex: ["Aquel abrigo es muy bonito."]
          note: "Все они согласуются с вещью: **estos, estas, esos, esas, aquellos, aquellas**. Во множественном мужского рода — **estos** и **esos**: _estos pantalones_."
      - more:
          title: esto и eso
          text: "Если не знаем, что это за предмет, говорим **esto** (рядом со мной) или **eso** (рядом с вами): _¿Qué es esto?_ — эту фразу вы знаете с начала курса."
      - write:
          title: Вставьте слово
          format: este, ese, aquel… в нужной форме
          rule: este_ese
          skill: demonstratives
          items:
            - "___ camiseta (рядом со мной) => esta"
            - q: "___ zapatos (рядом со мной)"
              a: "estos"
              mistakes: {"estes": "Мужской род во множественном — **estos**."}
            - "___ chaqueta (у тебя) => esa"
            - "___ vaqueros (у тебя) => esos"
            - "___ vestido (далеко) => aquel"
      - choose:
          title: Выберите
          rule: este_ese
          skill: demonstratives
          items:
            - q: "«esa falda» — где юбка?"
              options: "ahí — рядом с вами | aquí — рядом со мной | allí — далеко"
      - choose:
          title: Что ответить?
          rule: este_ese
          skill: demonstratives
          items:
            - lines: ["Dependienta: ¿Qué camisa quiere?"]
              q: "Вы показываете на рубашку далеко, на витрине."
              options: "Aquella camisa. | Esta camisa. | Esa camisa."
    forms: [eso]

  - id: precios
    kind: grammar
    title: ¿Cuánto cuesta?
    goal: спросить цену и понять ответ на слух
    version: 3
    vocab:
      - "💶 ¿Cuánto cuesta...? [куа́нто куэ́ста] — сколько стоит...? :: ¿Cuánto cuesta esta camiseta? — Сколько стоит эта футболка?"
      - "💰 costar [коста́р] — стоить"
      - "🏷 el precio [прэ́θьо] — цена"
      - "💸 caro/a [ка́ро, ка́ра] — дорогой"
      - "🏷 barato/a [бара́то, бара́та] — дешёвый"
      - "🪙 el céntimo [θэ́нтимо] — цент (сотая часть евро)"
    blocks:
      - learn: ["¿Cuánto cuesta...?", costar, el precio]
      - text:
          id: cuesta
          text: "Одна вещь — **cuesta**, несколько — **cuestan**: **costar** меняет `o` на `ue`, как **poder**."
      - choose:
          title: Выберите
          skill: prices
          items:
            - q: "¿Cuánto ___ estos zapatos?"
              options: "cuestan | cuesta | costan"
            - q: "Как спросить «Сколько стоит этот свитер?»"
              options: "¿Cuánto cuesta este jersey? | ¿Cuánto cuestan este jersey? | ¿Cuánto cuesta esto jersey?"
      - learn: [caro/a, barato/a]
      - choose:
          title: Выберите
          skill: [prices, adj_agreement]
          items:
            - q: "Estos zapatos son muy ___. (дорогие)"
              options: "caros | caras | baratos"
      - learn: [el céntimo]
      - write:
          title: Спросите цену
          format: вопрос по-испански
          rule: cuesta
          skill: prices
          items:
            - q: "Сколько стоит эта рубашка?"
              a: "¿Cuánto cuesta esta camisa? | ¿Cuánto cuesta la camisa?"
              mistakes: {"cuanto cuestan esta camisa": "Одна вещь — **cuesta**: ¿Cuánto cuesta esta camisa?"}
            - q: "Сколько стоят эти брюки?"
              a: "¿Cuánto cuestan estos pantalones? | ¿Cuánto cuestan los pantalones?"
              mistakes: {"cuanto cuesta estos pantalones": "Брюки — los pantalones, их несколько: **cuestan**."}
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "el precio — цена"
            - "caro — дорогой"
            - "barato — дешёвый"
            - "el céntimo — цент"
      - choose:
          title: Послушайте и выберите
          skill: [numbers_ear, prices]
          items:
            - say: "Cuesta ciento cincuenta euros."
              options: "150 € | 115 € | 105 €"
              noaudio: {q: "Сколько стоит: «Cuesta ciento cincuenta euros»?", options: "150 € | 115 € | 105 €"}
            - say: "Cuestan setenta y cinco euros."
              options: "75 € | 65 € | 57 €"
              noaudio: {q: "Сколько стоят: «Cuestan setenta y cinco euros»?", options: "75 € | 65 € | 57 €"}
            - say: "Un euro con ochenta."
              options: "1,80 € | 1,08 € | 8,10 €"
              noaudio: {q: "Сколько это: «Un euro con ochenta»?", options: "1,80 € | 1,08 € | 8,10 €"}

  - id: tienda
    kind: dialogue
    title: В магазине одежды
    goal: купить вещь — спросить размер, примерить, заплатить
    version: 3
    vocab:
      - "🪞 probarse [проба́рсэ] — примерять :: ¿Puedo probarme esta camisa? — Можно примерить эту рубашку?"
      - "🚪 el probador [пробадо́р] — примерочная"
      - "👌 claro [кла́ро] — конечно"
      - "👗 me queda bien / me queda grande [мэ кэ́да] — сидит хорошо / мне велико"
      - "🛍 me lo llevo / me la llevo [мэ ло льэ́бо] — беру (это)"
      - "💳 pagar [пага́р] — платить"
      - "💳 la tarjeta [тархэ́та] — карта (банковская)"
      - "🧩 necesitar [нэθэсита́р] — нуждаться; быть нужным :: Necesito una talla más pequeña. — Мне нужен размер поменьше."
    blocks:
      - learn: [probarse, el probador, claro]
      - choose:
          title: Traduce
          skill: shopping
          items:
            - q: "¿Puedo probarme esta camisa?"
              options: "Можно примерить эту рубашку? | Можно купить эту рубашку? | Где примерочная?"
            - q: "Sí, claro."
              options: "Да, конечно. | Нет, спасибо. | Да, пожалуйста."
      - learn: [me queda bien / me queda grande, me lo llevo / me la llevo, pagar, la tarjeta]
      - "Этот диалог — готовый сценарий для любого магазина."
      - dialogue:
          id: clara
          lines:
            - "Dependienta: Hola, buenas tardes. ¿Qué busca? | Здравствуйте. Что вы ищете?"
            - "Clara: Busco una camiseta blanca. | Ищу белую футболку."
            - "Dependienta: ¿Qué talla tiene? | Какой у вас размер?"
            - "Clara: La treinta y ocho. | Тридцать восьмой."
            - "Dependienta: Aquí tiene: estas camisetas son muy bonitas. | Вот, пожалуйста: эти футболки очень красивые."
            - "Clara: ¿Puedo probarme esta? | Можно примерить эту?"
            - "Dependienta: Sí, claro. El probador está allí. | Да, конечно. Примерочная вон там."
            - "Dependienta: ¿Qué tal? | Ну как?"
            - "Clara: Me queda un poco grande. ¿Tiene una talla más pequeña? | Немного великовата. У вас есть размер поменьше?"
            - "Dependienta: Sí, aquí tiene la treinta y seis. | Да, вот тридцать шестой."
            - "Clara: ¡Me queda muy bien! ¿Cuánto cuesta? | Сидит отлично! Сколько стоит?"
            - "Dependienta: Doce euros con noventa. | Двенадцать девяносто."
            - "Clara: ¡Qué barata! Me la llevo. ¿Puedo pagar con tarjeta? | Какая дешёвая! Беру. Можно заплатить картой?"
            - "Dependienta: Sí, claro. | Да, конечно."
      - note:
          id: lo_la
          text: "**me la llevo** — «беру её»: о вещи женского рода (_la camiseta_). О вещи мужского рода — **me lo llevo** (_el jersey_)."
      - choose:
          title: Responde
          source: clara
          rule: none
          items:
            - q: "¿Dónde está el probador?"
              options: "Allí. | Aquí. | No hay probador."
            - q: "¿Cuánto cuesta la camiseta de Clara?"
              options: "Doce euros con noventa. | Treinta y ocho euros. | Treinta y seis euros."
      - choose:
          title: Выберите
          free: true
          rule: lo_la
          skill: shopping
          items:
            - q: "Вы берёте свитер (el jersey)."
              options: "Me lo llevo. | Me la llevo. | Me llevo."
      - mission:
          id: jacket
          title: Покупаем куртку
          text: "Вы в магазине в Мадриде. Вам нужна серая куртка, ваш размер — сороковой. Первая куртка велика, вторая сидит хорошо. Платите картой."
      - choose:
          source: jacket
          skill: shopping
          items:
            - lines: ["Dependienta: Hola. ¿Qué busca?"]
              options: "Busco una chaqueta gris. | Busco un chaqueta gris. | Busco una chaqueta grisa."
            - lines: ["Dependienta: ¿Qué talla tiene?"]
              options: "La cuarenta. | Cuarenta euros. | Tengo cuarenta años."
      - write:
          source: jacket
          skill: shopping
          items:
            - q: "Dependienta: ¿Qué tal? — Скажите, что куртка вам немного велика."
              a: "Me queda un poco grande | Me queda grande"
              format: фраза по-испански
      - learn: [necesitar]
      - choose:
          title: Выберите
          free: true
          skill: necesitar
          items:
            - q: "Как сказать «Мне нужна куртка»?"
              options: "Necesito una chaqueta. | Necesita una chaqueta. | Necesito un chaqueta."
              explain: "О себе — **necesito**; la chaqueta — женского рода: una chaqueta."
      - write:
          source: jacket
          skill: necesitar
          items:
            - q: "Попросите размер поменьше: «Мне нужен размер поменьше»."
              a: "Necesito una talla más pequeña | (Yo) necesito una talla más pequeña | ¿Tiene una talla más pequeña?"
              format: фраза по-испански
              mistakes: {"necesito un talla mas pequeña": "la talla — женского рода: **una** talla más **pequeña**.", "necesito una talla mas pequeño": "talla — женского рода: más **pequeña**."}
              explain: "necesitar — правильный глагол на -ar: necesito, necesitas, necesita."
      - choose:
          source: jacket
          skill: numbers_ear
          items:
            - say: "Esta cuesta cincuenta y nueve euros."
              q: "Сколько стоит вторая куртка?"
              options: "59 € | 95 € | 69 €"
              noaudio: {q: "Сколько стоит вторая куртка: «Esta cuesta cincuenta y nueve euros»?", options: "59 € | 95 € | 69 €"}
      - build:
          source: jacket
          skill: shopping
          items:
            - es: "Me la llevo. ¿Puedo pagar con tarjeta?"
              ru: "Скажите: «Беру. Можно заплатить картой?»"
              extra: [lo]

  - id: quiz
