id: compras
number: 17
level: A1
title: Покупки
goals:
  - назвать одежду и описать её
  - считать до тысячи и понимать цены
  - купить вещь в магазине: спросить размер, примерить, заплатить

lessons:
  - id: ropa1
    kind: vocab
    title: Одежда
    goal: назвать одежду и описать её цвет
    vocab:
      - "👚 la ropa [ро́па] — одежда"
      - "👔 la camisa [ками́са] — рубашка"
      - "👕 la camiseta [камисэ́та] — футболка"
      - "👖 los pantalones [пантало́нэс] — брюки"
      - "👗 la falda [фа́льда] — юбка"
      - "👗 el vestido [бэсти́до] — платье"
      - "🧶 el jersey [хэрсэ́й] — свитер {pl: jerséis}"
      - "👞 los zapatos [θапа́тос] — туфли, ботинки"
      - "🧥 la chaqueta [чакэ́та] — куртка, пиджак"
      - "🧥 el abrigo [абри́го] — пальто"
      - "👖 los vaqueros [бакэ́рос] — джинсы"
      - "👟 las zapatillas [θапати́йяс] — кроссовки; тапочки"
      - "🩶 gris [грис] — серый {pos: adj}"
      - "📏 la talla [та́йя] — размер (одежды)"
    blocks:
      - "Тема — покупки. Начнём с одежды и сразу описываем вещи цветами."
      - learn: [la ropa, la camisa, la camiseta, los pantalones, la falda]
      - choose:
          title: Traduce
          items:
            - q: "Llevo una camiseta blanca."
              options: "На мне белая футболка. | На мне белая рубашка. | На мне белая юбка."
      - learn: [el vestido, el jersey, los zapatos, la chaqueta, el abrigo]
      - match:
          title: Соедините пары
          pairs:
            - "el vestido — платье"
            - "el jersey — свитер"
            - "los zapatos — туфли"
            - "la chaqueta — куртка"
            - "el abrigo — пальто"
      - rule: |
          1. Цвет ставится **после** названия одежды: _una camiseta amarilla_, _un vestido azul_.
          2. Цвет согласуется с вещью в роде и числе: _una falda blanca_, _unos zapatos marrones_, _unas camisetas negras_. Цвета на `-e` или согласную по родам не меняются: _un vestido verde_, _una falda verde_.
      - more:
          title: 🌎 А в Латинской Америке?
          text: "Свитер там — **el suéter**, джинсы — **los jeans**, куртка в Мексике — **la chamarra**, в Аргентине — **la campera**."
      - choose:
          title: Выберите
          items:
            - q: "Ana lleva una falda ___. (красную)"
              options: "roja | rojo | rojas"
      - learn: [los vaqueros, las zapatillas, gris, la talla]
      - write:
          title: Traduce
          format: вещь и цвет по-испански
          items:
            - "белая рубашка => una camisa blanca | la camisa blanca"
            - "синие брюки => unos pantalones azules | los pantalones azules"
            - "чёрное платье => un vestido negro | el vestido negro"
            - "серая куртка => una chaqueta gris | la chaqueta gris"
            - "белые кроссовки => unas zapatillas blancas | las zapatillas blancas"
    forms: [suéter, chamarra, campera, jeans]

  - id: numeros
    kind: vocab
    title: Числа до 100
    goal: назвать возраст и цену до ста и понять их на слух
    vocab:
      - "3️⃣0️⃣ treinta [трэ́йнта] — тридцать {pos: num}"
      - "4️⃣0️⃣ cuarenta [куарэ́нта] — сорок {pos: num}"
      - "5️⃣0️⃣ cincuenta [θинкуэ́нта] — пятьдесят {pos: num}"
      - "6️⃣0️⃣ sesenta [сэсэ́нта] — шестьдесят {pos: num}"
      - "7️⃣0️⃣ setenta [сэтэ́нта] — семьдесят {pos: num}"
      - "8️⃣0️⃣ ochenta [очэ́нта] — восемьдесят {pos: num}"
      - "9️⃣0️⃣ noventa [нобэ́нта] — девяносто {pos: num}"
      - "💯 cien [θьен] — сто {pos: num}"
    forms: [veintiuno, veintidós, veintitrés, veinticuatro, veinticinco, veintiséis, veintisiete, veintiocho, veintinueve]
    blocks:
      - "Почти все десятки заканчиваются на `-enta`: cuarenta, cincuenta, sesenta. Кроме 20 и 30: veinte и treinta."
      - learn: [treinta, cuarenta, cincuenta, sesenta]
      - choose:
          title: Послушайте и выберите
          items:
            - say: "cincuenta"
              options: "50 | 15 | 5"
            - say: "cuarenta"
              options: "40 | 14 | 4"
      - learn: [setenta, ochenta, noventa, cien]
      - rule: |
          1. 21–29 — одним словом: veintiuno, veintidós, veintitrés… veintinueve.
          2. 31–99 — три слова, десятки и единицы соединяет **y**: treinta **y** uno, cuarenta **y** cinco.
          3. 100 — **cien**: _cien euros_, _cien años_.
      - write:
          title: Напишите словами
          format: число словами
          items:
            - "45 => cuarenta y cinco"
            - "27 => veintisiete"
            - "63 => sesenta y tres"
            - "99 => noventa y nueve"
      - write:
          title: Послушайте и запишите цифрами
          format: число цифрами
          items:
            - say: "setenta y dos"
              a: "72"
            - say: "ochenta y cinco"
              a: "85"

  - id: demostrativos
    kind: grammar
    title: "Este, ese, aquel"
    goal: показать на вещь — этот, тот, вон тот
    vocab:
      - "👇 este/esta [э́стэ, э́ста] — этот, эта (рядом со мной) {pos: adj, pl: estos estas}"
      - "👉 ese/esa [э́сэ, э́са] — этот, тот (рядом с вами) {pos: adj, pl: esos esas}"
      - "🔭 aquel/aquella [акэ́ль, акэ́йя] — тот, та (далеко) {pos: adj, pl: aquellos aquellas}"
      - "📍 ahí [аи́] — там (рядом с вами)"
    blocks:
      - "В магазине всё время показывают на вещи. Чем отличаются три слова?"
      - learn: [este/esta, ese/esa, aquel/aquella, ahí]
      - compare:
          cards:
            - head: este / esta
              label: рядом со мной — aquí
              tone: blue
              ex: ["Me gusta esta camisa."]
            - head: ese / esa
              label: рядом с вами — ahí
              tone: mint
              ex: ["¿Y esa falda?"]
            - head: aquel / aquella
              label: далеко от нас — allí
              tone: sun
              ex: ["Aquel abrigo es muy bonito."]
          note: "Все они согласуются с вещью: **estos, estas, esos, esas, aquellos, aquellas**. Во множественном мужского рода — **estos** и **esos**: _estos pantalones_."
      - more:
          title: esto и eso
          text: "Если не знаем, что это за предмет, говорим **esto** (рядом со мной) или **eso** (рядом с вами): _¿Qué es esto?_ — эту фразу вы знаете с начала курса."
      - write:
          title: Вставьте слово
          format: este, ese, aquel… в нужной форме
          items:
            - "___ camiseta (рядом со мной) => esta"
            - "___ zapatos (рядом со мной) => estos"
            - "___ chaqueta (у тебя) => esa"
            - "___ vaqueros (у тебя) => esos"
            - "___ vestido (далеко) => aquel"
      - choose:
          title: Что ответить?
          items:
            - lines: ["Dependienta: ¿Qué camisa quiere?"]
              q: "Вы показываете на рубашку далеко, на витрине."
              options: "Aquella camisa. | Esta camisa. | Esa camisa."
    forms: [eso]

  - id: precios
    kind: grammar
    title: ¿Cuánto cuesta?
    goal: спросить цену и понять ответ на слух
    vocab:
      - "💶 ¿Cuánto cuesta...? [куа́нто куэ́ста] — сколько стоит...? :: ¿Cuánto cuesta esta camiseta? — Сколько стоит эта футболка?"
      - "💰 costar [коста́р] — стоить"
      - "🏷 el precio [прэ́θьо] — цена"
      - "💸 caro/a [ка́ро, ка́ра] — дорогой"
      - "🏷 barato/a [бара́то, бара́та] — дешёвый"
      - "🪙 el céntimo [θэ́нтимо] — цент (сотая часть евро)"
      - "🔢 mil [миль] — тысяча {pos: num}"
    forms: [ciento, doscientos, doscientas, trescientos, cuatrocientos, quinientos, seiscientos, setecientos, ochocientos, novecientos]
    blocks:
      - "Одна вещь — **cuesta**, несколько — **cuestan**: **costar** меняет `o` на `ue`, как **poder**."
      - learn: ["¿Cuánto cuesta...?", costar, el precio]
      - choose:
          title: Выберите
          items:
            - q: "¿Cuánto ___ estos zapatos?"
              options: "cuestan | cuesta | costan"
      - learn: [caro/a, barato/a]
      - choose:
          title: Выберите
          items:
            - q: "Estos zapatos son muy ___. (дорогие)"
              options: "caros | caras | baratos"
      - learn: [el céntimo, mil]
      - table:
          title: Сотни
          rows:
            - ["101", "ciento uno"]
            - ["200", "doscientos"]
            - ["300", "trescientos"]
            - ["400", "cuatrocientos"]
            - ["500", "**quinientos**"]
            - ["600", "seiscientos"]
            - ["700", "**setecientos**"]
            - ["800", "ochocientos"]
            - ["900", "**novecientos**"]
            - ["1000", "mil"]
      - rule: |
          1. Ровно сто — **cien**; если дальше есть число — **ciento**: _ciento uno_, _ciento veinte_.
          2. Остальные сотни: число + `-cientos`: _doscientos_, _trescientos_.
          3. Выделенные сотни — не по правилу: **quinientos**, **setecientos**, **novecientos**.
      - write:
          title: Напишите словами
          format: число словами
          items:
            - "500 => quinientos"
            - "150 => ciento cincuenta"
            - "700 => setecientos"
      - choose:
          title: Послушайте и выберите
          items:
            - say: "Cuesta ciento cincuenta euros."
              options: "150 € | 115 € | 105 €"
            - say: "Cuestan setenta y cinco euros."
              options: "75 € | 65 € | 57 €"
            - say: "Un euro con ochenta."
              options: "1,80 € | 1,08 € | 8,10 €"

  - id: tienda
    kind: dialogue
    title: В магазине одежды
    goal: купить вещь — спросить размер, примерить, заплатить
    vocab:
      - "🪞 probarse [проба́рсэ] — примерять :: ¿Puedo probarme esta camisa? — Можно примерить эту рубашку?"
      - "🚪 el probador [пробадо́р] — примерочная"
      - "👌 claro [кла́ро] — конечно"
      - "👗 me queda bien / me queda grande [мэ кэ́да] — сидит хорошо / мне велико"
      - "🛍 me lo llevo / me la llevo [мэ ло льэ́бо] — беру (это)"
      - "💳 pagar [пага́р] — платить"
      - "💳 la tarjeta [тархэ́та] — карта (банковская)"
    blocks:
      - "Этот диалог — готовый сценарий для любого магазина."
      - learn: [probarse, el probador, claro]
      - choose:
          title: Traduce
          items:
            - q: "¿Puedo probarme esta camisa?"
              options: "Можно примерить эту рубашку? | Можно купить эту рубашку? | Где примерочная?"
      - learn: [me queda bien / me queda grande, me lo llevo / me la llevo, pagar, la tarjeta]
      - dialogue:
          lines:
            - "Dependienta: Hola, buenas tardes. ¿Qué busca? | Здравствуйте. Что вы ищете?"
            - "Clara: Busco una camiseta blanca. | Ищу белую футболку."
            - "Dependienta: ¿Qué talla tiene? | Какой у вас размер?"
            - "Clara: La treinta y ocho. | Тридцать восьмой."
            - "Dependienta: Aquí tiene: estas camisetas son muy bonitas. | Вот, пожалуйста: эти футболки очень красивые."
            - "Clara: ¿Puedo probarme esta? | Можно примерить эту?"
            - "Dependienta: Sí, claro. El probador está allí. | Да, конечно. Примерочная вон там."
            - "Dependienta: ¿Qué tal? | Ну как?"
            - "Clara: Me queda un poco grande. ¿Tiene una talla más pequeña? | Немного великовата. У вас есть размер поменьше?"
            - "Dependienta: Sí, aquí tiene la treinta y seis. | Да, вот тридцать шестой."
            - "Clara: ¡Me queda muy bien! ¿Cuánto cuesta? | Сидит отлично! Сколько стоит?"
            - "Dependienta: Doce euros con noventa. | Двенадцать девяносто."
            - "Clara: ¡Qué barata! Me la llevo. ¿Puedo pagar con tarjeta? | Какая дешёвая! Беру. Можно заплатить картой?"
            - "Dependienta: Sí, claro. | Да, конечно."
      - note: "**me la llevo** — «беру её»: о вещи женского рода (_la camiseta_). О вещи мужского рода — **me lo llevo** (_el jersey_)."
      - choose:
          title: Выберите
          items:
            - q: "Вы берёте свитер (el jersey)."
              options: "Me lo llevo. | Me la llevo. | Me llevo."
            - q: "¿Cuánto cuesta la camiseta de Clara?"
              options: "Doce euros con noventa. | Treinta y ocho euros. | Treinta y seis euros."
      - mission:
          title: Покупаем куртку
          text: "Вы в магазине в Мадриде. Вам нужна серая куртка, ваш размер — сороковой. Первая куртка велика, вторая сидит хорошо. Платите картой."
      - choose:
          items:
            - lines: ["Dependienta: Hola. ¿Qué busca?"]
              options: "Busco una chaqueta gris. | Busco un chaqueta gris. | Busco una chaqueta grisa."
            - lines: ["Dependienta: ¿Qué talla tiene?"]
              options: "La cuarenta. | Cuarenta euros. | Tengo cuarenta años."
      - write:
          items:
            - q: "Dependienta: ¿Qué tal? — Скажите, что куртка вам немного велика."
              a: "Me queda un poco grande | Me queda grande"
              format: фраза по-испански
      - choose:
          items:
            - say: "Esta cuesta cincuenta y nueve euros."
              q: "Сколько стоит вторая куртка?"
              options: "59 € | 95 € | 69 €"
      - build:
          items:
            - es: "Me la llevo. ¿Puedo pagar con tarjeta?"
              ru: "Скажите: «Беру. Можно заплатить картой?»"
              extra: [lo]

  - id: quiz
    kind: quiz
    title: Покупки
    blocks:
      - "Тест по теме «Покупки»."
      - cando:
          - "назвать одежду и её цвет"
          - "считать до тысячи и понимать цены"
          - "показать на вещь: este, ese, aquel"
          - "купить вещь: спросить размер, примерить, заплатить"
    quiz:
      - q: "¿Cuánto ___ estos zapatos?"
        options: "cuestan | cuesta | costan"
      - q: Как сказать «эта рубашка» (у меня в руках)?
        options: "esta camisa | esa camisa | este camisa"
      - q: Как будет 500?
        options: "quinientos | cincocientos | cincuenta"
      - q: Что значит «Me queda grande»?
        options: "мне велико | мне нравится | я беру"
      - q: "Mi padre tiene ___ años. (47)"
        options: "cuarenta y siete | cuatro y siete | cuarentaisiete"
