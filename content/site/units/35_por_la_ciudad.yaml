                  re: "\\b(visita|prueba|ve|ven|haz|toma|come|mira|sube|pasea|lleva|busca|compra)\\b"
              sample: "Cuando era pequeña, pasaba los veranos en el pueblo de mis abuelos. Era un pueblo muy tranquilo: había pocas casas, una plaza y muchos árboles. Un día, mientras jugaba con mis primos en la plaza, de repente empezó a llover y nos quedamos toda la tarde en casa de una vecina. Ahora el pueblo es más grande que antes y hay más tráfico, pero no es tan bonito como entonces. Si vas allí, visita la plaza y prueba el pan de la panadería: es el mejor del mundo."
              sample_ru: "Когда я была маленькой, я проводила лето в деревне у бабушки с дедушкой. Деревня была очень тихой: несколько домов, площадь и много деревьев. Однажды, когда мы с двоюродными братьями играли на площади, вдруг пошёл дождь, и мы весь вечер просидели у соседки. Теперь деревня больше, чем раньше, и машин больше, но она уже не такая красивая, как тогда. Если поедешь туда, сходи на площадь и попробуй хлеб из пекарни: он лучший в мире."
