      - reading:
          id: diego
          title: Mensaje de Diego
          text: |
            ¡Hola! ¿Qué tal por Madrid? Yo estoy en México, en casa de mis padres. Mi pueblo ha cambiado mucho: antes era muy pequeño y tranquilo, y ahora hay un centro comercial enorme.

            Ayer, mientras paseaba por la plaza, vi a mi profesora de la escuela. Está igual que antes: alta, delgada y muy simpática.

            Si vienes a México, ven a mi pueblo y prueba la comida de mi madre: es mejor que la comida de los restaurantes.

            Un abrazo,
            Diego
          translation: |
            Привет! Как там в Мадриде? Я в Мексике, у родителей. Мой посёлок очень изменился: раньше он был маленьким и тихим, а теперь здесь огромный торговый центр.

            Вчера, когда я гулял по площади, увидел свою школьную учительницу. Она всё такая же: высокая, худая и очень приветливая.

            Если приедешь в Мексику, приезжай ко мне в посёлок и попробуй мамину еду: она лучше, чем в ресторанах.

            Обнимаю,
            Диего
