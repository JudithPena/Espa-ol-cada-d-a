                - label: "сравнение: más / menos … que, tan … como"
                  re: "\\b(más|menos)\\b.*\\bque\\b|\\b(tan|tanto|tanta|tantos|tantas)\\b.*\\bcomo\\b|\\b(mejor|peor)\\b"
