      - dialogue:
          id: toledo
          hidden: true
          title: Поездка в Толедо
          lines:
            - "Irina: ¡Hola, Tom! ¿Qué tal el sábado en Toledo? | Привет, Том! Как суббота в Толедо?"
            - "Tom: Muy bien, pero tuve un pequeño problema. | Отлично, но была небольшая проблема."
            - "Irina: ¿Qué te pasó? | Что случилось?"
            - "Tom: Estaba paseando por el centro y, de repente, empezó a llover. No tenía paraguas y entré en un café. | Я гулял по центру, и вдруг пошёл дождь. Зонта у меня не было, и я зашёл в кафе."
            - "Tom: Allí conocí a una señora muy simpática. Cuando era joven, vivía en Madrid, en mi barrio. | Там я познакомился с очень милой женщиной. В молодости она жила в Мадриде, в моём районе."
            - "Irina: ¿Y cómo era el barrio entonces? | И каким тогда был район?"
            - "Tom: Ella dice que era más tranquilo que ahora y que no había tantos coches. | Она говорит, что спокойнее, чем сейчас, и машин было не так много."
            - "Irina: ¡Qué bien! ¿Te apetece volver a Toledo? | Здорово! Хочешь вернуться в Толедо?"
            - "Tom: Sí. ¿Por qué no vamos juntos el sábado que viene? | Да. Может, поедем вместе в следующую субботу?"
            - "Irina: Vale. ¡Pero lleva paraguas! | Давай. Только возьми зонт!"
