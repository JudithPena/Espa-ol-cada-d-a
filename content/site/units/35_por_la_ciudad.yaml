              words: [60, 160]
              sentences: 5
              checks:
                - label: "как было: era, había, vivía…"
                  re: "\\b\\w+(aba|abas|aban|ábamos)\\b|\\b(era|eras|eran|éramos|iba|ibas|iban|íbamos|había|tenía|tenían|teníamos|vivía|vivíamos|hacía|quería|podía|salía|comía|veía|veíamos|llovía|volvía|corría|bebía)\\b"
                - label: "что случилось: fui, vi, empezó, pasó…"
