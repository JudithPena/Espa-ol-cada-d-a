id: cosas
number: 6
level: A0
title: Вещи вокруг нас
goals:
  - назвать предметы вокруг себя
  - понимать род слов и выбирать артикль el, la, un, una
  - образовывать множественное число и говорить, что где есть

# Сценарий (docs/site_lessons_guide.md): одна грамматическая цель на цикл —
# ¿Qué es esto? → un / una → el / la → множественное число → hay → миссия «Комната Лусии».
lessons:
  - id: vocab1
    kind: vocab
    title: ¿Qué es esto?
    goal: спросить «Что это?» и назвать пять вещей
    version: 3
    vocab:
      - "❓ ¿Qué es esto? [кэ эс э́сто] — что это? :: ¿Qué es esto? Es un libro. — Что это? Это книга."
      - "📕 el libro [ли́бро] — книга"
      - "📓 el cuaderno [куадэ́рно] — тетрадь"
      - "🖊 el bolígrafo [боли́графо] — ручка"
      - "☝️ un / una [ун, у́на] — (какой-то) один, одна; неопределённый артикль :: Es una llave. — Это ключ."
      - "🎒 la mochila [мочи́ла] — рюкзак"
      - "🔑 la llave [лья́бэ] — ключ"
    blocks:
      - "Самый простой способ узнать новое слово: покажите на предмет и спросите **¿Qué es esto?** — «Что это?». В ответ вы услышите **Es un…** и название предмета."
      - learn: ["¿Qué es esto?", el libro, el cuaderno, el bolígrafo]
      - examples:
          id: que_es
          items:
            - "¿Qué es esto? Es un cuaderno. — Что это? Это тетрадь."
            - "¿Es un libro? No, es un cuaderno. — Это книга? Нет, это тетрадь."
      - choose:
          title: "¿Qué es esto?"
          skill: que_es_esto
          items:
            - img: el libro
              q: "¿Qué es esto?"
              options: "Es un libro. | Es un cuaderno. | Es un bolígrafo."
            - img: el bolígrafo
              q: "¿Qué es esto?"
              options: "Es un bolígrafo. | Es un libro. | Es un cuaderno."
      - learn: [la mochila, la llave, un / una]
      - examples:
          items:
            - "¿Qué es esto? Es una mochila. — Что это? Это рюкзак."
            - "¿Qué es esto? Es una llave. — Что это? Это ключ."
      - tip: "Заметили? Перед одними словами стоит **un**, а перед другими — **una**: _un libro, un cuaderno, un bolígrafo_, но _una mochila, una llave_. Это зависит от рода слова: в следующем уроке разберёмся, как его узнать."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "el libro — книга"
            - "el cuaderno — тетрадь"
            - "el bolígrafo — ручка"
            - "la mochila — рюкзак"
            - "la llave — ключ"
      - choose:
          title: Что ответить?
          rule: que_es
          skill: que_es_esto
          items:
            - img: el cuaderno
              lines: ["Ana: ¿Es un libro?"]
              options: "No, es un cuaderno. | Sí, es un libro. | No, es una llave."
              explain: "На картинке тетрадь, поэтому: No, es un cuaderno — «Нет, это тетрадь»."
      - write:
          title: "¿Qué es esto?"
          format: "фраза: Es un… / Es una…"
          skill: que_es_esto
          items:
            - img: la mochila
              a: "Es una mochila"
              mistakes: {"es un mochila": "Перед mochila — **una**, как в примере: Es una mochila.", "una mochila": "Ответьте целой фразой: **Es** una mochila — «Это рюкзак».", "es la mochila": "Когда отвечают «что это?», говорят **una**: Es una mochila."}
            - img: el cuaderno
              a: "Es un cuaderno"
              mistakes: {"es una cuaderno": "Перед cuaderno — **un**, как в примере: Es un cuaderno.", "un cuaderno": "Ответьте целой фразой: **Es** un cuaderno — «Это тетрадь».", "es el cuaderno": "Когда отвечают «что это?», говорят **un**: Es un cuaderno."}
            - img: la llave
              a: "Es una llave"
              mistakes: {"es un llave": "Перед llave — **una**, как в примере: Es una llave.", "una llave": "Ответьте целой фразой: **Es** una llave — «Это ключ»."}
      - choose:
          title: Послушайте и выберите
          skill: que_es_esto
          items:
            - say: "Es una llave."
              q: "Что это?"
              options: "Это ключ. | Это рюкзак. | Это книга."
              noaudio: {q: "Что значит «Es una llave.»?", options: "Это ключ. | Это рюкзак. | Это книга."}
            - say: "¿Es un libro? No, es un cuaderno."
              options: "Это книга? Нет, это тетрадь. | Это тетрадь? Нет, это книга. | Это книга? Да, это книга."
              noaudio: {q: "Что значит «¿Es un libro? No, es un cuaderno.»?", options: "Это книга? Нет, это тетрадь. | Это тетрадь? Нет, это книга. | Это книга? Да, это книга."}

  - id: genero
    kind: grammar
    title: "Мужской и женский род: el, la, un, una"
    goal: выбрать el или la, un или una по роду слова
    version: 3
    vocab:
      - "🍽️ la mesa [мэ́са] — стол"
      - "🪑 la silla [си́лья] — стул"
      - "📅 el día [ди́а] — день"
      - "🗺 el mapa [ма́па] — карта"
      - "🖼️ la foto [фо́то] — фотография"
      - "🔀 o [о] — или :: ¿El o la? — El или la?"
    blocks:
      - "Посмотрите на группы слов. Можно ли по окончанию угадать, какой нужен артикль?"
      - learn: [la mesa, la silla]
      - compare:
          id: o_a
          cards:
            - head: el … -o
              say: false
              label: мужской род
              tone: blue
              text: Если слово заканчивается на **-o**, то перед ним обычно ставится **el** или **un**.
              ex: [el libro, el cuaderno, un bolígrafo, un queso]
            - head: la … -a
              say: false
              label: женский род
              tone: rose
              text: Если слово заканчивается на **-a**, то перед ним обычно ставится **la** или **una**.
              ex: [la mesa, la silla, una mochila, una casa]
      - sort:
          title: Мужской или женский род?
          skill: gender
          groups:
            "un — мужской": [cuaderno, libro, bolígrafo, vino]
            "una — женский": [mesa, silla, mochila, casa]
      - compare:
          id: other
          cards:
            - head: el или la?
              say: false
              label: другие окончания
              tone: gray
              text: Если слово заканчивается на другую букву, то по окончанию род не угадать, и его нужно запомнить. Например, chocolate и llave оба заканчиваются на `-e`, но говорят el chocolate и la llave. Поэтому учите слова сразу **с артиклем**.
              ex: [el café, el hotel, el chocolate, la llave]
      - learn: [el día, el mapa, la foto]
      - compare:
          id: exceptions
          title: Исключения
          cards:
            - head: el día, el mapa
              label: на -a, но мужского рода
              tone: blue
              text: Слова día и mapa заканчиваются на `-a`, но они мужского рода.
              ex: [el día, un día, el mapa, un mapa de España]
            - head: la foto
              label: на -o, но женского рода
              tone: rose
              text: Слово foto заканчивается на `-o`, но оно женского рода, потому что это сокращение от `la fotografía`.
              ex: [la foto, una foto]
      - write:
          title: Un или una?
          format: одно слово — un или una
          skill: gender
          items:
            - q: "Es ___ silla."
              a: una
              explain: "Silla заканчивается на -a и женского рода: una silla."
              rule: o_a
            - q: "Es ___ mapa."
              a: un
              explain: "Mapa — исключение: на -a, но мужского рода, поэтому un mapa."
              rule: exceptions
            - q: "Es ___ llave."
              a: una
              explain: "Llave надо запомнить: la llave, una llave."
              rule: other
            - q: "Es ___ hotel."
              a: un
              explain: "Hotel мужского рода: el hotel, un hotel."
              rule: other
            - q: "Es ___ foto."
              a: una
              explain: "Foto — исключение: на -o, но женского рода, потому что это сокращение от `la fotografía`."
              rule: exceptions
      - header: Un или el?
      - table:
          id: un_el
          title: Артикли
          rows:
            - ["**un** и **una** ставятся, когда предмет появляется впервые: какой-то, один из многих", "**un** libro, **una** mesa, **un** mapa, **una** foto"]
            - ["**el** и **la** ставятся, когда речь о том самом, уже известном предмете", "**el** libro, **la** mesa, **el** mapa, **la** foto"]
      - examples:
          items:
            - "Es un libro. El libro es de Ana. — Это книга. Книга — Аны."
            - "Es una foto. La foto es de Pablo. — Это фотография. Фото — Пабло."
      - more:
          title: Что значит de?
          text: "Слово **de** показывает, кому что принадлежит. Сначала называют предмет, а потом через **de** называют владельца: _el libro de Ana_ — «книга Аны», _la mochila de Carlos_ — «рюкзак Карлоса»."
      - choose:
          title: Un или el?
          skill: el_vs_un
          items:
            - q: "Es un mapa. ___ mapa es de Carlos."
              options: "El | Un"
              explain: "Карта уже названа — это та самая карта, поэтому el."
            - q: "¿Qué es esto? Es ___ foto."
              options: "una | la"
              explain: "Предмет появляется в разговоре впервые, поэтому una."
            - q: "Es una mesa. ___ mesa es de Lucía."
              options: "La | Una"
              explain: "Стол уже назван — это тот самый стол, поэтому la."
      - learn: [o]
      - choose:
          title: Что ответить?
          rule: none
          skill: que_es_esto
          items:
            - img: el cuaderno
              q: "¿Es un libro o un cuaderno?"
              options: "Es un cuaderno. | Es un libro."
              explain: "O значит «или»: «Это книга или тетрадь?» — Это тетрадь."
      - write:
          title: ¿El o la?
          format: одно слово — el или la
          skill: gender
          items:
            - {q: "___ cuaderno", a: el, rule: o_a}
            - {q: "___ día", a: el, rule: exceptions}
            - {q: "___ silla", a: la, rule: o_a}
            - {q: "___ foto", a: la, rule: exceptions}
      - choose:
          title: Послушайте и выберите
          skill: gender
          items:
            - say: "la silla"
              q: "Какое слово вы услышали?"
              options: "la silla | el silla | una silla"
              noaudio: {q: "Что значит «la silla»?", options: "la silla | el silla | una silla"}
            - say: "el mapa"
              q: "Какое слово вы услышали?"
              options: "el mapa | la mapa | un mapa"
              noaudio: {q: "Что значит «el mapa»?", options: "el mapa | la mapa | un mapa"}

  - id: vocab2
    kind: vocab
    title: В комнате
    goal: назвать вещи в комнате вместе с артиклем
    version: 2
    vocab:
      - "🚪 la puerta [пуэ́рта] — дверь"
      - "🪟 la ventana [бэнта́на] — окно"
      - "💡 la lámpara [ла́мпара] — лампа"
      - "💻 el ordenador [ордэнадо́р] — компьютер"
      - "📱 el móvil [мо́биль] — мобильный телефон"
      - "⌚ el reloj [рэло́х] — часы"
    blocks:
      - "Посмотрите вокруг: что из этого есть рядом с вами прямо сейчас?"
      - learn: [la puerta, la ventana, la lámpara]
      - choose:
          title: "¿Qué es esto?"
          items:
            - img: la ventana
              options: "la ventana | la puerta | la lámpara"
            - img: la lámpara
              options: "la lámpara | la ventana | la puerta"
      - learn: [el ordenador, el móvil, el reloj]
      - tip: "В слове **reloj** последняя буква `j` почти не слышна, поэтому слово читается примерно как [рэло́]: _Es un reloj._ _Es el reloj de Carlos._"
      - more:
          title: 🌎 А в Латинской Америке?
          text: "Компьютер там называют **la computadora**, а мобильный телефон — **el celular**: _Es la computadora de Ana._ _Es el celular de Pablo._"
      - write:
          title: Напишите с артиклем
          format: el или la + слово
          rule: none
          skill: gender
          items:
            - img: el reloj
              a: "el reloj"
            - img: la puerta
              a: "la puerta"
            - img: el móvil
              a: "el móvil"
            - q: окно
              a: "la ventana"
            - q: компьютер
              a: "el ordenador"
      - choose:
          title: Послушайте и выберите
          rule: none
          items:
            - say: "Es el móvil de Pablo."
              options: "Это мобильный Пабло. | Это компьютер Пабло. | Это часы Пабло."
              noaudio: {q: "Что значит «Es el móvil de Pablo»?", options: "Это мобильный Пабло. | Это компьютер Пабло. | Это часы Пабло."}
      - build:
          title: Соберите фразу
          rule: none
          items:
            - es: "Es el reloj de Carlos."
              ru: "Это часы Карлоса."
              extra: [un]
    forms: [computadora, celular]

  - id: plural
    kind: grammar
    title: "Много вещей: los, las, hay"
    goal: сказать, сколько вещей и что где есть
    version: 2
    unlocks: [plural]
    vocab:
      - "👥 los / las [лос, лас] — артикль во множественном числе :: los libros, las mesas — книги, столы"
      - "👥 unos / unas [у́нос, у́нас] — несколько, какие-то :: unos cuadernos — несколько тетрадей"
      - "✏️ el lápiz [ла́пиθ] — карандаш"
      - "✅ hay [ай] — есть, имеется :: En la mesa hay un libro. — На столе (лежит) книга."
      - "❓ ¿Qué hay en...? [кэ ай эн] — что есть в / на...? :: ¿Qué hay en la mochila? — Что в рюкзаке?"
    blocks:
      - "Посмотрите, как меняются слова, когда предметов много. Видите три разных случая?"
      - table:
          rows:
            - ["el libro → los libro**s**", "la mesa → las mesa**s**"]
            - ["el reloj → los reloj**es**", "el móvil → los móvil**es**"]
            - ["el lápiz → los lápi**ces**", "буква `z` меняется на `c`, и добавляется `-es`"]
      - learn: [los / las, unos / unas, el lápiz]
      - compare:
          id: plural
          cards:
            - head: + -s
              say: false
              label: после гласной
              tone: blue
              text: Если слово заканчивается на гласную, то во множественном числе к нему добавляется `-s`.
              ex: [libros, mesas, cafés, llaves]
            - head: + -es
              say: false
              label: после согласной
              tone: sun
              text: Если слово заканчивается на согласную, то к нему добавляется `-es`.
              ex: [relojes, hoteles, móviles]
      - compare:
          join: true
          cards:
            - head: "`z` → `c` + `-es`"
              say: false
              label: "слова на `z`"
              tone: gray
              text: Если слово заканчивается на `z`, то `z` меняется на `c`, и добавляется `-es`. Из lápiz получается lápices.
              ex: [un lápiz, dos lápices]
      - compare:
          style: small
          title: Артикли тоже меняются
          cards:
            - head: los
              label: вместо el
            - head: las
              label: вместо la
            - head: unos
              label: вместо un
            - head: unas
              label: вместо una
      - match:
          title: Один и несколько
          skill: plural
          pairs:
            - "el libro — los libros"
            - "la mesa — las mesas"
            - "el reloj — los relojes"
            - "el lápiz — los lápices"
            - "una llave — unas llaves"
      - write:
          title: Множественное число
          format: артикль + слово во множественном числе
          rule: plural
          skill: plural
          items:
            - q: el cuaderno
              a: los cuadernos
              mistakes: {"las cuadernos": "Cuaderno — мужского рода, поэтому **los**: los cuadernos.", "los cuaderno": "Не хватает окончания: los cuaderno**s**."}
            - q: la ventana
              a: las ventanas
            - q: el móvil
              a: los móviles
              explain: "Móvil заканчивается на согласную, поэтому -es: móviles."
              mistakes: {"los movils": "Móvil кончается на согласную — добавляется **-es**: móviles.", "los móvils": "Móvil кончается на согласную — добавляется **-es**: móviles."}
            - q: un lápiz
              a: unos lápices
              explain: "`z` меняется на `c` и добавляется -es; un становится unos: unos lápices."
              mistakes: {"unos lapizes": "`z` меняется на `c`: lápi**ces**.", "unos lápizes": "`z` меняется на `c`: lápi**ces**.", "los lápices": "Было **un** lápiz, значит во множественном — **unos** lápices."}
            - q: el día
              a: los días
              explain: "Día мужского рода, хоть и на -a: el día — los días."
              mistakes: {"las días": "Día — мужского рода, хоть и на -a: **los** días."}
      - learn: [hay, "¿Qué hay en...?"]
      - header: "Hay — «есть, имеется»"
      - text:
          id: hay
          text: |
            1. Слово **hay** никогда не меняется: и об одном предмете, и о многих говорят **hay**. _Hay un libro._ _Hay dos libros._
            2. После **hay** обычно не ставят **el** и **la**, потому что **hay** сообщает о каком-то новом предмете. Поэтому говорят _hay un libro_, а не `hay el libro`.
            3. Если чего-то нет, то перед **hay** ставится **no**: _No hay ventanas._ _En la mesa no hay libros._
      - examples:
          items:
            - "En la mesa hay un ordenador y dos libros. — На столе компьютер и две книги."
            - "¿Qué hay en la mochila? Hay unas llaves. — Что в рюкзаке? Какие-то ключи."
      - choose:
          title: Hay + артикль
          skill: hay
          items:
            - q: "Hay ___ libro en la mesa."
              options: "un | el"
              explain: "После hay обычно не ставят el и la: hay сообщает о новом предмете, поэтому hay un libro."
            - q: "En la mochila ___ unas llaves."
              options: "hay | es"
              explain: "Когда говорят, что где-то что-то есть или лежит, используют hay."
            - lines: ["Ana: ¿Qué hay en la mochila?"]
              options: "Hay unas llaves. | Es unas llaves. | Hay las llaves."
              explain: "На ¿Qué hay en…? отвечают hay, и после hay — unas, а не las."
      - choose:
          title: Послушайте и выберите
          skill: hay
          items:
            - say: "En la mesa hay dos libros y un móvil."
              q: Что на столе?
              options: "две книги и мобильный | две книги и часы | книга и два мобильных"
              noaudio: {q: "«En la mesa hay dos libros y un móvil.» Что на столе?", options: "две книги и мобильный | две книги и часы | книга и два мобильных"}
            - say: "En la mochila no hay libros."
              q: Что вы услышали?
              options: "В рюкзаке нет книг. | В рюкзаке есть книги. | На столе нет книг."
              noaudio: {q: "Что значит «En la mochila no hay libros»?", options: "В рюкзаке нет книг. | В рюкзаке есть книги. | На столе нет книг."}
      - build:
          title: Соберите фразу
          skill: hay
          items:
            - es: "En la mesa hay un libro y dos bolígrafos."
              ru: "На столе книга и две ручки."
              alt: ["Hay un libro y dos bolígrafos en la mesa."]

  - id: lectura
    kind: reading
    title: ¿Qué hay en la mochila?
    goal: понять короткое описание и сказать, что где есть
    version: 3
    vocab:
      - "🍼 la botella [ботэ́лья] — бутылка"
      - "👓 las gafas [га́фас] — очки"
      - "💶 el dinero [дине́ро] — деньги"
    blocks:
      - learn: [la botella, las gafas, el dinero]
      - choose:
          title: "¿Qué es esto?"
          items:
            - img: la botella
              options: "Es una botella. | Es un móvil. | Es una llave."
      - reading:
          id: mochila
          title: La mochila de Ana
          text: |
            Ana tiene una mochila. ¿Qué hay en la mochila de Ana?

            Hay un libro, dos cuadernos, tres bolígrafos y un lápiz. También hay unas llaves, unas gafas y un móvil. Hay una botella, pero no hay dinero.

            ¿Y el ordenador? ¡No hay ordenador! El ordenador de Ana está en casa.
          translation: |
            У Аны есть рюкзак. Что в рюкзаке у Аны?

            Там книга, две тетради, три ручки и карандаш. Ещё там ключи, очки и мобильный. Есть бутылка, но нет денег.

            А компьютер? Компьютера нет! Компьютер Аны дома.
      - note: "**Está en casa** значит «находится дома». Глагол **está** мы подробно разберём позже, а пока запомните **en casa** как готовую фразу: _Ana está en casa._ _¿Dónde está el ordenador? En casa._"
      - choose:
          title: Responde
          source: mochila
          rule: none
          items:
            - q: "¿Cuántos cuadernos hay?"
              options: "Hay dos cuadernos. | Hay tres cuadernos. | Hay un cuaderno."
              explain: "Hay un libro, dos cuadernos… — в рюкзаке две тетради."
              skill: hay
            - q: "¿Hay dinero?"
              options: "No, no hay dinero. | Sí, hay dinero."
              explain: "Hay una botella, pero no hay dinero. — денег нет."
              skill: hay
            - q: "¿Dónde está el ordenador?"
              options: "En casa. | En la mochila. | En la mesa."
              explain: "El ordenador de Ana está en casa — компьютер дома."
      - sort:
          title: Что есть в рюкзаке Аны?
          source: mochila
          rule: none
          groups:
            "✅ hay": [unas llaves, unas gafas, una botella, un móvil]
            "❌ no hay": [dinero, ordenador]
      - choose:
          title: Послушайте и выберите
          free: true
          skill: hay
          items:
            - say: "En la mochila hay dos cuadernos."
              options: "В рюкзаке две тетради. | В рюкзаке нет тетрадей. | В рюкзаке три тетради."
              noaudio: {q: "Что значит «En la mochila hay dos cuadernos.»?", options: "В рюкзаке две тетради. | В рюкзаке нет тетрадей. | В рюкзаке три тетради."}
            - say: "No hay dinero."
              options: "Денег нет. | Деньги есть. | Денег много."
              noaudio: {q: "Что значит «No hay dinero.»?", options: "Денег нет. | Деньги есть. | Денег много."}
