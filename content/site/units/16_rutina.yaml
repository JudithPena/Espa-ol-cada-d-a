id: rutina
number: 16
level: A1
title: Мой день
goals:
  - рассказать о своём распорядке дня
  - использовать возвратные глаголы: «я встаю», «я одеваюсь»
  - спрягать глаголы с чередованием в корне

lessons:
  - id: manana
    kind: vocab
    title: Утро
    goal: рассказать, что вы делаете утром
    version: 3
    vocab:
      - "⏰ despertarse [дэспэрта́рсэ] — просыпаться {forms: despierto} :: Me despierto a las siete. — Я просыпаюсь в семь."
      - "🛏 levantarse [лэбанта́рсэ] — вставать :: Me levanto a las siete y cuarto. — Я встаю в четверть восьмого."
      - "🚿 ducharse [дуча́рсэ] — принимать душ"
      - "🧼 lavarse [лаба́рсэ] — мыться, умываться"
      - "🦷 el diente [дьэ́нтэ] — зуб :: Me lavo los dientes. — Я чищу зубы."
      - "👔 vestirse [бэсти́рсэ] — одеваться {forms: visto}"
      - "🚪 salir [сали́р] — выходить, уходить :: Salgo de casa a las ocho. — Я выхожу из дома в восемь."
    blocks:
      - "Что вы делаете утром? Обратите внимание на маленькое слово **me** перед глаголами."
      - learn: [despertarse, levantarse, ducharse]
      - choose:
          title: Послушайте и выберите
          skill: daily_routine
          items:
            - say: "Me levanto y me ducho."
              options: "Я встаю и принимаю душ. | Я просыпаюсь и завтракаю. | Я встаю и одеваюсь."
              noaudio: {q: "Что значит «Me levanto y me ducho»?", options: "Я встаю и принимаю душ. | Я просыпаюсь и завтракаю. | Я встаю и одеваюсь."}
      - learn: [lavarse, el diente, vestirse, salir]
      - tip:
          id: me_self
          text: "**me** здесь значит «себя»: _me levanto_ — «поднимаю себя», _me lavo_ — «мою себя». Такой глагол вы давно знаете: **me llamo** — «называю себя»."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "despertarse — просыпаться"
            - "levantarse — вставать"
            - "ducharse — принимать душ"
            - "vestirse — одеваться"
            - "salir — выходить"
      - write:
          title: Traduce
          format: фраза по-испански
          skill: daily_routine
          items:
            - q: "Я чищу зубы."
              a: "Me lavo los dientes | (Yo) me lavo los dientes"
              mistakes: {"lavo los dientes": "Зубы чистят себе — нужно **me**: Me lavo los dientes.", "me lavo mis dientes": "О частях тела говорят с артиклем, а не с mi: me lavo **los** dientes."}
            - q: "Я выхожу из дома в восемь."
              a: "Salgo de casa a las ocho | (Yo) salgo de casa a las ocho | A las ocho salgo de casa"
              rule: none
              mistakes: {"salo de casa a las ocho": "У salir форма «я» — **salgo**.", "me salgo de casa a las ocho": "salir не возвратный: **Salgo** de casa."}
      - build:
          title: Соберите фразу
          skill: daily_routine
          items:
            - es: "Me levanto, me ducho y me visto."
              ru: "Я встаю, принимаю душ и одеваюсь."
              extra: [te]

  - id: reflexivos
    kind: grammar
    title: "Me levanto, te levantas: возвратные глаголы"
    goal: сказать, кто что делает утром — me, te, se, nos, os
    version: 3
    unlocks: [reflexive]
    vocab:
      - "💇 peinarse [пэйна́рсэ] — причёсываться"
      - "🪒 afeitarse [афэйта́рсэ] — бриться"
    blocks:
      - learn: [peinarse, afeitarse]
      - "Посмотрите на один глагол в разных лицах. Что меняется вместе с окончанием?"
      - conjugation:
          verb: levantarse
          ru: вставать
      - rule:
          id: reflexive
          text: |
            1. Глаголы на `-se` — возвратные: действие человек делает над собой.
            2. Местоимение меняется по лицам — **me, te, se, nos, os, se** — и стоит **перед** глаголом: _me levanto_, _te duchas_, _se peina_.
            3. В инфинитиве оно присоединяется в конце и тоже меняется по лицам: _Quiero levantarme_, _¿Quieres ducharte?_
      - write:
          title: Вставьте местоимение
          format: me, te, se, nos или os
          skill: reflexive
          items:
            - "(yo) ___ ducho por la noche. => me"
            - "¿A qué hora ___ levantas? => te"
            - "Mi padre ___ afeita por la mañana. => se"
            - "Nosotros ___ levantamos a las seis. => nos"
            - "¿Vosotros ___ ducháis por la mañana? => os"
            - "Mis hermanas ___ peinan. => se"
      - note:
          id: lavar
          text: "Без **me** действие направлено на кого-то другого: _Me llamo Ana_ — «меня зовут Ана», _Llamo a Ana_ — «я звоню Ане»; _me lavo_ — «я умываюсь», _lavo el coche_ — «я мою машину»."
      - choose:
          title: Выберите
          skill: reflexive
          items:
            - q: "Я мою машину."
              options: "Lavo el coche. | Me lavo el coche. | Se lava el coche."
            - q: "Mañana quiero ___ a las seis."
              options: "levantarme | me levantar | levantarse"
              explain: "В инфинитиве местоимение в конце и по лицу: levantarme — «встать (мне)»."
              rule: reflexive
      - write:
          title: Напишите форму
          format: местоимение и глагол
          rule: reflexive
          skill: reflexive
          items:
            - q: "tú / ducharse"
              a: "te duchas"
              mistakes: {"duchas": "Возвратный глагол — с местоимением: **te** duchas."}
            - q: "ellos / levantarse"
              a: "se levantan"
            - q: "nosotros / ducharse"
              a: "nos duchamos"
      - choose:
          title: Послушайте и выберите
          skill: reflexive
          items:
            - say: "Nos levantamos a las siete."
              options: "Мы встаём в семь. | Они встают в семь. | Мы ложимся в семь."
              noaudio: {q: "Что значит «Nos levantamos a las siete.»?", options: "Мы встаём в семь. | Они встают в семь. | Мы ложимся в семь."}
            - say: "Me ducho por la mañana."
              options: "Я принимаю душ утром. | Я принимаю душ вечером. | Он принимает душ утром."
              noaudio: {q: "Что значит «Me ducho por la mañana.»?", options: "Я принимаю душ утром. | Я принимаю душ вечером. | Он принимает душ утром."}

  - id: irregulares
    kind: grammar
    title: "Quiero, puedo, pido: чередование в корне"
    goal: сказать «хочу, могу, прошу» — глаголы с чередованием в корне
    version: 3
    unlocks: [present_stem]
    vocab:
      - "⭐ preferir [прэфэри́р] — предпочитать"
      - "💪 poder [подэ́р] — мочь :: ¿Puedes hablar más despacio? — Ты можешь говорить медленнее?"
      - "🔙 volver [больбэ́р] — возвращаться :: Vuelvo a casa a las seis. — Я возвращаюсь домой в шесть."
      - "😴 dormir [дорми́р] — спать"
      - "🛌 acostarse [акоста́рсэ] — ложиться спать"
      - "🙋 pedir [пэди́р] — просить; заказывать"
    blocks:
      - "У некоторых глаголов гласная корня меняется, когда на неё падает ударение. Посмотрите, в каких лицах она **не** меняется."
      - conjugation:
          id: e_ie
          verb: querer
          ru: "хотеть (`e → ie`)"
      - learn: [preferir]
      - write:
          title: "`e` → `ie`"
          format: одна форма глагола
          rule: e_ie
          skill: stem_change
          items:
            - q: "ella / preferir"
              a: "prefiere"
              mistakes: {"prefere": "`e` → `ie` под ударением: **prefiere**."}
            - q: "vosotros / querer"
              a: "queréis"
              mistakes: {"quieréis": "У vosotros ударение на окончании — корень не меняется: **queréis**."}
      - learn: [poder, volver, dormir, acostarse]
      - conjugation:
          verb: poder
          ru: "мочь (`o → ue`)"
      - write:
          title: "`o` → `ue`"
          format: одна форма глагола
          skill: stem_change
          items:
            - q: "yo / poder"
              a: "puedo"
              mistakes: {"podo": "`o` → `ue` под ударением: **puedo**."}
            - "tú / volver => vuelves"
            - q: "nosotros / dormir"
              a: "dormimos"
              mistakes: {"duermimos": "У nosotros ударение на окончании — корень не меняется: **dormimos**."}
            - q: "yo / acostarse"
              a: "me acuesto"
              format: форма с местоимением
              mistakes: {"acuesto": "acostarse — возвратный: **me** acuesto.", "me acosto": "`o` → `ue` под ударением: **me acuesto**."}
      - learn: [pedir]
      - conjugation:
          verb: pedir
          ru: "просить (`e → i`)"
      - rule:
          id: boot
          text: "В формах **nosotros** и **vosotros** ударение падает на окончание, поэтому корень не меняется: quer**e**mos, p**o**demos, p**e**dimos. Если выделить изменённые формы в таблице, получится фигура, похожая на сапожок 👢."
      - more:
          title: Где вы такое уже видели
          text: "**tener** — _tienes_, **empezar** — _empieza_, **cerrar** — _cierra_, **despertarse** — _me despierto_, **vestirse** — _me visto_. А у **jugar** `u` превращается в `ue`: _juego_, _juegas_."

      - choose:
          title: Выберите форму
          skill: stem_change
          items:
            - q: "Ellos ___ una paella."
              options: "piden | pedien | peden"
            - q: "Vosotros ___ mucho."
              options: "dormís | duermís | duermen"
              explain: "У vosotros ударение на окончании — корень не меняется: dormís."
      - write:
          title: "`e` → `i`"
          format: форма глагола
          rule: boot
          skill: stem_change
          items:
            - q: "yo / pedir"
              a: "pido"
              mistakes: {"pedo": "`e` → `i` под ударением: **pido**."}
            - q: "nosotros / pedir"
              a: "pedimos"
              mistakes: {"pidimos": "У nosotros ударение на окончании — корень не меняется: **pedimos**."}
      - choose:
          title: Послушайте и выберите
          skill: stem_change
          items:
            - say: "No puedo ir hoy."
              options: "Я не могу пойти сегодня. | Я не хочу идти сегодня. | Ты не можешь пойти сегодня."
              noaudio: {q: "Что значит «No puedo ir hoy.»?", options: "Я не могу пойти сегодня. | Я не хочу идти сегодня. | Ты не можешь пойти сегодня."}
            - say: "¿Prefieres té o café?"
              options: "Ты предпочитаешь чай или кофе? | Ты хочешь чай или кофе? | Он предпочитает чай или кофе?"
              noaudio: {q: "Что значит «¿Prefieres té o café?»?", options: "Ты предпочитаешь чай или кофе? | Ты хочешь чай или кофе? | Он предпочитает чай или кофе?"}

  - id: orden
    kind: vocab
    title: Сначала, потом, иногда
    goal: связно рассказать о дне — сначала, потом, иногда, никогда
    version: 3
    vocab:
      - "🌄 temprano [тэмпра́но] — рано"
      - "➡️ luego [луэ́го] — потом, затем"
      - "➡️ después [дэспуэ́с] — потом, после"
      - "⏩ más tarde [мас та́рдэ] — позже"
      - "⏮ antes de [а́нтэс дэ] — перед, до :: antes de dormir — перед сном"
      - "⏭ después de [дэспуэ́с дэ] — после :: después de comer — после обеда"
      - "🎲 a veces [а бэ́θэс] — иногда"
      - "🚫 nunca [ну́нка] — никогда"
    blocks:
      - "Чтобы рассказ о дне звучал связно, нужны «сначала», «потом» и «иногда». **primero** — «сначала» — вы уже знаете."
      - learn: [temprano, luego, después, más tarde]
      - choose:
          title: Выберите
          skill: sequence
          items:
            - q: "Primero me ducho y ___ desayuno."
              options: "luego | temprano | más"
      - learn: [antes de, después de]
      - rule:
          id: antes_de
          text: "После **antes de** и **después de** глагол — в начальной форме: _antes de dormir_, _después de trabajar_."
      - choose:
          title: Выберите
          skill: sequence
          items:
            - q: "Leo antes de ___."
              options: "dormir | duermo | dormo"
      - learn: [a veces, nunca]
      - rule:
          id: nunca
          text: "**siempre** — всегда, **normalmente** — обычно, **a veces** — иногда, **nunca** — никогда. Если **nunca** стоит перед глаголом, **no** не нужно: _Nunca ceno tarde._"
      - choose:
          title: Как сказать?
          skill: sequence
          items:
            - q: "Он никогда не завтракает."
              options: "Nunca desayuna. | No nunca desayuna. | Nunca no desayuna."
      - write:
          title: Traduce
          format: фраза по-испански
          skill: sequence
          items:
            - q: "Я встаю рано."
              a: "Me levanto temprano | (Yo) me levanto temprano | Temprano me levanto"
              rule: none
              mistakes: {"levanto temprano": "levantarse — возвратный: **me** levanto."}
            - q: "После работы я иду в парк."
              a: "Después de trabajar, voy al parque | Después de trabajar voy al parque | Después del trabajo, voy al parque | Después del trabajo voy al parque | Voy al parque después de trabajar"
              rule: antes_de
              mistakes: {"después de trabajo voy al parque": "Можно **después de trabajar** (глагол в начальной форме) или **después del trabajo**."}
            - "Иногда мы ужинаем поздно. => A veces cenamos tarde | (Nosotros) a veces cenamos tarde | Cenamos tarde a veces"
            - {q: "Сегодня я ужинаю позже.", a: "Hoy ceno más tarde | Hoy (yo) ceno más tarde | Hoy [ceno más tarde/más tarde ceno]", rule: none}
      - choose:
          title: Послушайте и выберите
          skill: sequence
          items:
            - say: "A veces leo antes de dormir."
              options: "Иногда я читаю перед сном. | Я всегда читаю перед сном. | Иногда я читаю после работы."
              noaudio: {q: "Что значит «A veces leo antes de dormir.»?", options: "Иногда я читаю перед сном. | Я всегда читаю перед сном. | Иногда я читаю после работы."}
            - say: "Después de cenar, veo la tele."
              options: "После ужина я смотрю телевизор. | Перед ужином я смотрю телевизор. | После обеда я смотрю телевизор."
              noaudio: {q: "Что значит «Después de cenar, veo la tele.»?", options: "После ужина я смотрю телевизор. | Перед ужином я смотрю телевизор. | После обеда я смотрю телевизор."}

  - id: lectura
    kind: reading
    title: Обычный день
    goal: понять рассказ о распорядке дня
    version: 2
    blocks:
      - reading:
          id: carlos
          title: Un día de Carlos
          text: |
            Me llamo Carlos y soy enfermero. Trabajo en un hospital en Valencia.

            De lunes a viernes me despierto muy temprano, a las seis. Primero me ducho y me visto. Mis gafas están siempre encima de la mesa, al lado de la cama. Luego desayuno: un café con leche y una tostada. Salgo de casa a las siete y voy al hospital en bici.

            Trabajo de ocho a tres. Después de trabajar, vuelvo a casa y como con mi mujer. Por la tarde duermo un poco o juego al fútbol con mis amigos. A veces vamos al cine o tomamos un refresco en un bar.

            Cenamos a las nueve y media y después tomamos un té. Me acuesto a las once. Antes de dormir, leo un poco en la cama. ¡Y mi gato duerme debajo de la cama!

            ¡Y los sábados nunca me levanto temprano!
          translation: |
            Меня зовут Карлос, я медбрат. Работаю в больнице в Валенсии.

            С понедельника по пятницу я просыпаюсь очень рано, в шесть. Сначала принимаю душ и одеваюсь. Очки у меня всегда лежат на столе, рядом с кроватью. Потом завтракаю: кофе с молоком и тост. Выхожу из дома в семь и еду в больницу на велосипеде.

            Работаю с восьми до трёх. После работы возвращаюсь домой и обедаю с женой. Днём немного сплю или играю в футбол с друзьями. Иногда мы ходим в кино или пьём газировку в баре.

            Ужинаем в половине десятого, а потом пьём чай. Ложусь в одиннадцать. Перед сном немного читаю в кровати. А мой кот спит под кроватью!

            А по субботам я никогда не встаю рано!
      - choose:
          title: Responde
          source: carlos
          items:
            - q: "¿A qué hora se despierta Carlos?"
              options: "A las seis. | A las siete. | A las once."
            - q: "¿Cómo va al hospital?"
              options: "En bici. | En metro. | A pie."
            - q: "¿Se levanta temprano los sábados?"
              options: "No, nunca. | Sí, siempre. | A veces."
      - sort:
          title: Утром или вечером?
          source: carlos
          groups:
            "🌅 por la mañana": [se ducha, desayuna, va al hospital en bici]
            "🌙 por la noche": [cena, lee un poco, se acuesta]
    quiz:
      - q: ¿Qué desayuna Carlos?
        options: "un café con leche y una tostada | un té y fruta | nada"
        source: carlos
      - q: ¿De qué hora a qué hora trabaja?
        options: "de ocho a tres | de siete a dos | de nueve a cinco"
        source: carlos

  - id: practica
    kind: practice
    title: Расскажите о своём дне
    goal: рассказать о своём обычном дне
    version: 3
    blocks:
      - write:
          title: Вставьте форму глагола
          format: форма глагола; у возвратного — с местоимением
          skill: stem_change
          items:
            - q: "Nosotros ___ (acostarse) a las doce."
              a: "nos acostamos"
              skill: [reflexive, stem_change]
              mistakes: {"acostamos": "acostarse — возвратный: **nos** acostamos.", "nos acuestamos": "У nosotros корень не меняется: nos **acostamos**."}
            - "¿Tú ___ (poder) ir mañana? => puedes"
            - q: "Mi hermano ___ (dormir) mucho."
              a: "duerme"
              mistakes: {"dorme": "`o` → `ue` под ударением: **duerme**."}
            - q: "Ellas ___ (vestirse) muy bien."
              a: "se visten"
              skill: [reflexive, stem_change]
              mistakes: {"visten": "vestirse — возвратный: **se** visten.", "se vesten": "`e` → `i` под ударением: **se visten**."}
            - q: "Yo ___ (volver) a casa en metro."
              a: "vuelvo"
              mistakes: {"volvo": "`o` → `ue` под ударением: **vuelvo**."}
      - mission:
          id: ana_day
          title: Ваш день
          text: "Вы — Ана. Встаёте в семь, сначала принимаете душ, потом завтракаете. Работаете с восьми до трёх, ложитесь в одиннадцать. Диего расспрашивает вас о вашем дне."
      - choose:
          source: ana_day
          skill: reflexive
          items:
            - lines: ["Diego: ¿A qué hora te levantas?"]
              options: "Me levanto a las siete. | Te levantas a las siete. | Levanto a las siete."
      - write:
          source: ana_day
          skill: sequence
          items:
            - q: "Diego: ¿Qué haces por la mañana?"
              a: "Primero me ducho y luego desayuno | (Primero) me ducho[ y luego/ y después/, luego/, después/ y] desayuno"
              format: ответ по-испански
      - build:
          source: ana_day
          skill: daily_routine
          items:
            - es: "Trabajo de ocho a tres."
              ru: "Diego: ¿Y trabajas mucho? — «Работаю с восьми до трёх»."
              extra: [las]
      - write:
          source: ana_day
          skill: stem_change
          items:
            - q: "Diego: ¿A qué hora te acuestas?"
              a: "Me acuesto a las once | A las once"
              format: ответ по-испански

  - id: quiz
    kind: quiz
    title: Мой день
    goal: рассказать о распорядке дня, спрягать возвратные глаголы и глаголы с чередованием
    version: 3
    check: soft
    blocks:
      - "Тест по теме «Мой день»."
      - cando:
          - "рассказать о распорядке дня"
          - "спрягать возвратные глаголы: me levanto, te levantas, se levanta..."
          - "спрягать глаголы с чередованием: quiero, puedo, pido, vuelvo"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "despertarse — просыпаться"
            - "el diente — зуб"
            - "pedir — просить"
            - "a veces — иногда"
            - "temprano — рано"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          items:
            - q: "Скажите: «Я встаю в семь и принимаю душ»."
              a: "Me levanto a las siete y me ducho | (Yo) me levanto a las siete y me ducho | A las siete me levanto y me ducho"
              skill: reflexive
              mistakes: {"levanto a las siete y ducho": "Возвратные глаголы — с местоимением: **me** levanto, **me** ducho."}
            - q: "Скажите: «Мы ложимся поздно»."
              a: "Nos acostamos tarde | (Nosotros) nos acostamos tarde"
              skill: stem_change
              mistakes: {"nos acuestamos tarde": "У nosotros корень не меняется: **acostamos**."}
    quiz:
      - q: "Nosotros ___ levantamos a las siete."
        options: "nos | se | os"
        skill: reflexive
      - q: "¿A qué hora ___ (tú, volver) a casa?"
        options: "vuelves | volves | vuelvas"
        skill: stem_change
      - q: "Nosotros ___ (poder) ir mañana."
        options: "podemos | puedemos | pueden"
        explain: "В формах nosotros и vosotros ударение падает на окончание, поэтому корень не меняется: podemos, queremos, dormimos."
        skill: stem_change
      - q: Как сказать «перед сном»?
        options: "antes de dormir | después de dormir | antes dormir"
        skill: sequence
      - q: "Mi padre ___ por la mañana."
        options: "se afeita | afeita | se afeitan"
        skill: reflexive

