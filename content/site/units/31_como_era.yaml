            - "Diego: ¿Y ahora? | А сейчас?"
            - "Irina: Ahora está calvo y tiene barba blanca. Pero todavía es muy simpático. | Сейчас он лысый и с белой бородой. Но он всё такой же приветливый."
            - "Diego: ¿Y esta chica con gafas? | А эта девушка в очках?"
            - "Irina: Es mi abuela. De joven tenía el pelo largo y liso. | Это моя бабушка. В молодости у неё были длинные прямые волосы."
