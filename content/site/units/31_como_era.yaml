              options: "Alto y delgado, con bigote. | Bajo y calvo, con barba blanca. | Alto, con el pelo largo y liso."
              explain: "Irina: Era alto y delgado… y llevaba bigote."
            - q: "¿Cómo es ahora?"
              options: "Calvo, con barba blanca. | Alto, con el pelo rizado. | Delgado y con bigote."
              explain: "Irina: Ahora está calvo y tiene barba blanca."
            - q: "¿Quién lleva gafas en la foto?"
              options: "La abuela. | El abuelo. | Irina."
              explain: "Diego: ¿Y esta chica con gafas? — Irina: Es mi abuela."
            - q: "¿Cómo tenía el pelo la abuela de joven?"
              options: "Largo y liso. | Corto y rizado. | Negro y rizado."
              explain: "Irina: De joven tenía el pelo largo y liso."
      - table:
          id: retrato
          slide: new
          title: Как описать человека в прошлом
          rows:
            - ["**era** + какой", "Era alto y delgado. — Он был высоким и худым."]
            - ["**tenía** + волосы, глаза, возраст", "Tenía el pelo rizado. — У него были кудрявые волосы."]
            - ["**llevaba** + очки, усы, одежда", "Llevaba gafas. — Он носил очки."]
      - note:
          id: ahora_esta
          text: "Внешность и характер в прошлом описывают в imperfecto. А о том, как человек выглядит **сейчас**, после перемен, часто говорят с **estar**: _Ahora está calvo_ — «теперь он лысый»."
