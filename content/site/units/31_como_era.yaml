                - label: "сравнение: más / menos … que или tan … como"
                  re: "\\b(más|menos)\\b.*\\bque\\b|\\b(tan|tanto|tanta|tantos|tantas)\\b.*\\bcomo\\b|\\b(mejor|peor|mayor|menor)\\b"
                - label: "как сейчас: ahora…"
                  any: [ahora, hoy]
              sample: "Cuando yo era pequeño, mi ciudad era más pequeña y más tranquila que ahora. Había muchos parques y pocos coches, y no había centros comerciales. Ahora es una ciudad moderna: hay edificios altos, metro y mucho tráfico. La vida es más cómoda, pero también más cara. Para mí, antes era mejor, pero todavía me gusta mucho mi ciudad."
