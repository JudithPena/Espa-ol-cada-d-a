              noaudio: {q: "Что значит «De joven mi padre tenía el pelo largo y llevaba barba»?", options: "В молодости у папы были длинные волосы и борода. | Сейчас у папы длинные волосы и борода. | В молодости папа был лысым и с бородой."}
      - write:
