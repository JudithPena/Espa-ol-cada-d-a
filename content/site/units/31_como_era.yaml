  - id: lectura
    kind: reading
    title: "Mi ciudad, antes y ahora"
    goal: понять рассказ о том, как изменился город, и ответить автору
    version: 2
    vocab:
      - "🐘 enorme [эно́рмэ] — огромный :: Ahora mi ciudad es enorme. — Теперь мой город огромный."
      - "🏙 el rascacielos [раскаθьэ́лос] — небоскрёб {pl: los rascacielos} :: Hay muchos rascacielos. — Там много небоскрёбов."
      - "🛍 el centro comercial [θэ́нтро комэрθья́ль] — торговый центр {pl: los centros comerciales} :: Mis padres tienen un restaurante en un centro comercial. — У моих родителей ресторан в торговом центре."
      - "🌫 la contaminación [контаминаθьо́н] — загрязнение :: En la ciudad hay mucha contaminación. — В городе сильно загрязнён воздух."
      - "💨 el aire [а́йрэ] — воздух :: El aire no está tan limpio como antes. — Воздух не такой чистый, как раньше."
    blocks:
      - learn: [enorme, el rascacielos, el centro comercial, la contaminación, el aire]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "enorme — огромный"
            - "el rascacielos — небоскрёб"
            - "el centro comercial — торговый центр"
            - "la contaminación — загрязнение"
            - "el aire — воздух"
      - "Повар Ли пишет в блоге о городе, где вырос."
      - reading:
          id: ciudad
          title: Mi ciudad, antes y ahora
          text: |
            Nací en una ciudad del sur de China. Cuando yo era pequeño, mi ciudad era mucho más pequeña y tranquila que ahora. Casi todo el mundo iba en bici y había muy pocos coches. Las casas eran bajas y viejas, y en mi calle había un mercado enorme. Mis padres tenían allí un restaurante pequeño.

            Ahora mi ciudad es enorme. Hay rascacielos, centros comerciales y metro. La vida es más cómoda que antes, pero también más cara. Hay mucho tráfico y mucha contaminación: el aire no está tan limpio como antes.

            Mis padres todavía tienen el restaurante, pero ya no está en el mercado: ahora está en un centro comercial. Cuando vuelvo, mi ciudad es como otra ciudad. ¿Es mejor o peor? No lo sé. Es diferente.
          translation: |
            Я родился в городе на юге Китая. Когда я был маленьким, мой город был гораздо меньше и спокойнее, чем сейчас. Почти все ездили на велосипедах, а машин было совсем мало. Дома были низкие и старые, а на моей улице был огромный рынок. У моих родителей там был маленький ресторан.

            Теперь мой город огромный. Там небоскрёбы, торговые центры и метро. Жить стало удобнее, но и дороже. Много машин и сильное загрязнение: воздух не такой чистый, как раньше.

            У родителей всё ещё есть ресторан, но он больше не на рынке: теперь он в торговом центре. Когда я приезжаю, мой город кажется другим. Лучше он или хуже? Не знаю. Он другой.
      - choose:
          title: Что сказано в тексте?
          source: ciudad
          items:
            - q: "¿Cómo iba la gente antes?"
              options: "Casi todos en bici. | Casi todos en coche. | Casi todos en metro."
              explain: "Casi todo el mundo iba en bici y había muy pocos coches."
            - q: "¿Dónde estaba antes el restaurante de sus padres?"
              options: "En el mercado de su calle. | En un centro comercial. | En un rascacielos del centro."
              explain: "En mi calle había un mercado enorme. Mis padres tenían allí un restaurante pequeño."
            - q: "¿Cómo es la vida ahora?"
              options: "Más cómoda, pero más cara. | Más barata y más tranquila. | Tan cómoda como antes."
              explain: "La vida es más cómoda que antes, pero también más cara."
              skill: comparar
            - q: "Para Li, ¿su ciudad ahora es mejor o peor?"
              options: "No lo sabe: es diferente. | Es mucho mejor. | Es mucho peor."
              explain: "¿Es mejor o peor? No lo sé. Es diferente."
              skill: mejor_peor
      - sort:
          title: Antes или ahora?
          source: ciudad
          groups:
            "antes": ["muy pocos coches", "casas bajas y viejas", "un mercado enorme"]
            "ahora": ["rascacielos", "mucho tráfico", "centros comerciales"]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: ciudad
          items:
            - q: "¿Cómo está el aire ahora?"
              a: "No está tan limpio como antes | El aire no está tan limpio como antes | No tan limpio como antes | Menos limpio que antes"
              explain: "El aire no está tan limpio como antes."
              skill: tan_como
            - q: "Как в тексте сказано «гораздо меньше и спокойнее, чем сейчас»?"
              a: "mucho más pequeña y tranquila que ahora"
              explain: "Mucho más — «гораздо более»: mucho más pequeña y tranquila que ahora."
              skill: comparar
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "En el centro hay mucho tráfico y mucha contaminación."
              options: "В центре много машин и сильно загрязнён воздух. | В центре мало машин и чистый воздух. | В центре много машин, но воздух чистый."
              explain: "Mucho tráfico — «много машин»; mucha contaminación — «сильное загрязнение»."
              noaudio: {q: "Что значит «En el centro hay mucho tráfico y mucha contaminación»?", options: "В центре много машин и сильно загрязнён воздух. | В центре мало машин и чистый воздух. | В центре много машин, но воздух чистый."}
      - compose:
          title: Комментарий к блогу
          free: true
          rule: none
          skill: [comparar, mejor_peor]
          items:
            - q: "Напишите Ли комментарий: где вам нравится жить больше — в большом городе или в маленьком — и почему. Три-четыре фразы."
              format: "Hola, Li: a mí me gustan más…"
              words: [15, 70]
              sentences: 2
              checks:
                - label: "что нравится больше: me gusta más…, prefiero…"
                  any: [me gusta más, me gustan más, prefiero, mejor]
                - label: "почему: porque…"
                  any: [porque]
                - label: "сравнение: más / menos … que, tan … como"
                  any: [más, menos, tan, tanto, tanta, tantos, tantas]
              sample: "Hola, Li: a mí me gustan más las ciudades pequeñas, porque son más tranquilas y más baratas. Pero en las ciudades grandes hay más trabajo y más cosas que hacer."
              sample_ru: "Привет, Ли! Мне больше нравятся маленькие города: они спокойнее и дешевле. Но в больших городах больше работы и больше чем заняться."

