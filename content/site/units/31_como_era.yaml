id: como_era
number: 31
level: A2
title: Cómo era — каким всё было
goals:
  - описать место и человека в прошлом: era, tenía, había, llevaba
  - сравнить места, людей и вещи: más / menos… que
  - сказать, что одинаково, а что нет
  - рассказать, как изменился ваш город

# Тема 8 карты A2: imperfecto в описании; más / menos… que, tan… como, mejor / peor; дом, город, техника.
# Миссия — «мой город раньше и теперь». Imperfecto и indefinido вместе в рассказе — тема 32.
lessons:
  - id: mi_barrio
    kind: listening
    title: "¿Cómo era tu barrio?"
    goal: понять на слух, каким был район раньше и каким стал
    version: 2
    # Карта экранов: docs/site_slide_maps/31_como_era.md
    vocab:
      - "🏢 el edificio [эдифи́θьо] — здание :: Antes aquí no había edificios altos. — Раньше здесь не было высоких зданий."
      - "🆕 moderno/a [модэ́рно, модэ́рна] — современный :: Es un barrio muy moderno. — Это очень современный район."
      - "🏭 la fábrica [фа́брика] — фабрика, завод :: Mi abuelo trabajaba en una fábrica. — Мой дедушка работал на фабрике."
      - "🔊 ruidoso/a [руидо́со, руидо́са] — шумный :: Mi calle era muy ruidosa. — Моя улица была очень шумной."
      - "🚗 el tráfico [тра́фико] — движение машин :: Ahora hay mucho tráfico. — Сейчас очень много машин."
      - "🌳 el árbol [а́рболь] — дерево :: En mi calle había muchos árboles. — На моей улице было много деревьев."
    blocks:
      - "Лусия показывает Ирине район, где выросла. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: antes_aqui
          hidden: true
          lines:
            - "Irina: ¿Tú vivías aquí de pequeña? | Ты жила здесь в детстве?"
            - "Lucía: Sí, en esta calle. Pero el barrio era muy diferente. | Да, на этой улице. Но район был совсем другим."
            - "Irina: ¿Cómo era? | Каким он был?"
            - "Lucía: Era más tranquilo que ahora. Había menos tráfico y muchos árboles. | Спокойнее, чем сейчас. Машин было меньше, а деревьев много."
            - "Irina: ¿Y esos edificios modernos? | А эти современные здания?"
            - "Lucía: Antes aquí había una fábrica vieja. Mi abuelo trabajaba allí. | Раньше здесь была старая фабрика. Мой дедушка там работал."
            - "Irina: ¿Y qué te gusta más, el barrio de antes o el de ahora? | А что тебе больше нравится: район, каким он был, или нынешний?"
            - "Lucía: Ahora es más bonito, pero también más ruidoso y más caro. Para mí, antes era mejor. | Сейчас он красивее, но и шумнее, и дороже. По-моему, раньше было лучше."
      - choose:
          title: Что вы поняли?
          source: antes_aqui
          items:
            - q: "Где Лусия жила в детстве?"
              options: "En esta calle. | En otro barrio. | En un pueblo."
              explain: "Lucía: Sí, en esta calle."
            - q: "Каким, по словам Лусии, был район раньше?"
              options: "Más tranquilo. | Más bonito. | Más caro."
              explain: "Lucía: Era más tranquilo que ahora."
      - learn: [el edificio, moderno/a, la fábrica, ruidoso/a, el tráfico, el árbol]
      - choose:
          title: Детали разговора
          source: antes_aqui
          items:
            - q: "Что было на месте современных зданий?"
              options: "Una fábrica vieja. | Un parque con muchos árboles. | Una escuela pequeña."
              explain: "Lucía: Antes aquí había una fábrica vieja."
            - q: "Кто работал на фабрике?"
              options: "Su abuelo. | Su padre. | Lucía."
              explain: "Lucía: Mi abuelo trabajaba allí."
            - q: "Каким стал район сейчас?"
              options: "Más bonito, pero más ruidoso. | Más tranquilo y más barato. | Más moderno, pero menos caro."
              explain: "Lucía: Ahora es más bonito, pero también más ruidoso y más caro."
            - q: "Когда, по мнению Лусии, было лучше?"
              options: "Antes. | Ahora. | No lo sabe."
              explain: "Lucía: Para mí, antes era mejor."
      - text:
          id: notice
          slide: new
          text: "Лусия **сравнивает**: район был спокойнее, чем сейчас; машин было меньше; раньше было лучше. Для сравнения в испанском есть **más** — «более», **menos** — «менее» и **que** — «чем»."
      - examples:
          items:
            - "Era **más** tranquilo **que** ahora. — Он был спокойнее, чем сейчас."
            - "Había **menos** tráfico. — Машин было меньше."
            - "Antes era **mejor**. — Раньше было лучше."
      - sort:
          title: Как было и как стало
          source: antes_aqui
          rule: notice
          groups:
            "antes": ["había una fábrica", "había menos tráfico", "era más tranquilo"]
            "ahora": ["hay edificios modernos", "es más ruidoso", "es más caro"]
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "el edificio — здание"
            - "la fábrica — фабрика"
            - "el árbol — дерево"
            - "el tráfico — движение машин"
            - "ruidoso — шумный"
            - "moderno — современный"
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: comparar
          rule: notice
          items:
            - say: "Antes el barrio era más tranquilo."
              a: "Antes el barrio era más tranquilo"
              explain: "Más tranquilo — «спокойнее»."
              noaudio: {q: "Напишите по-испански: «Раньше район был спокойнее».", a: "Antes el barrio era más tranquilo | El barrio era más tranquilo antes"}
      - choose:
          title: Что ответить?
          free: true
          skill: comparar
          rule: notice
          items:
            - lines: ["Irina: ¿Cómo era tu calle?"]
              q: "Скажите, что она была шумнее, чем сейчас."
              options: "Era más ruidosa que ahora. | Es más ruidosa que antes. | Era menos ruidosa que ahora."
              explain: "Как было — era; «шумнее, чем сейчас» — más ruidosa que ahora."
            - say: "Ahora hay más edificios y menos árboles."
              options: "Теперь здесь больше зданий и меньше деревьев. | Раньше здесь было больше зданий и меньше деревьев. | Теперь здесь меньше зданий и больше деревьев."
              explain: "Ahora hay — «теперь есть»; más edificios — «больше зданий», menos árboles — «меньше деревьев»."
              noaudio: {q: "Что значит «Ahora hay más edificios y menos árboles»?", options: "Теперь здесь больше зданий и меньше деревьев. | Раньше здесь было больше зданий и меньше деревьев. | Теперь здесь меньше зданий и больше деревьев."}
      - build:
          title: Соберите фразу
          free: true
          skill: comparar
          rule: notice
          items:
            - es: "Antes había menos tráfico que ahora."
              ru: "Раньше машин было меньше, чем сейчас."
              extra: [más]
            - "Mi abuelo trabajaba en una fábrica. — Мой дедушка работал на фабрике."

  - id: mas_menos
    kind: grammar
    title: "Más grande que, menos caro que"
    goal: сравнить места, вещи и людей
    version: 2
    vocab:
      - "🐢 lento/a [ле́нто, ле́нта] — медленный :: El autobús es más lento que el metro. — Автобус медленнее, чем метро."
      - "👎 malo/a [ма́ло, ма́ла] — плохой :: El café de aquí es malo. — Кофе здесь плохой."
      - "📉 peor [пэо́р] — хуже :: Mi inglés es peor que mi español. — Мой английский хуже, чем мой испанский."
      - "👶 menor [мэно́р] — младше :: Mi hermana es menor que yo. — Моя сестра младше меня."
    forms: [rápida, rápidos, rápidas]
    blocks:
      - "Чтобы сравнить, ставим **más** или **menos** перед прилагательным, а после него — **que**."
      - table:
          id: mas_que
          title: Как сравнивать
          rows:
            - ["**más** … **que**", "Madrid es **más** grande **que** Valencia. — Мадрид больше Валенсии."]
            - ["**menos** … **que**", "El autobús es **menos** caro **que** el taxi. — Автобус дешевле такси."]
            - ["глагол + **más que**, **menos que**", "Ana trabaja **más que** yo. — Ана работает больше меня."]
      - note:
          id: que_yo
          text: "После **que** — _yo_ и _tú_, как в начале фразы: _Mi hermano es más alto que yo_. Прилагательное согласуется с тем, о ком говорят: _Mi hermana es más alta que yo_."
      - write:
          title: Сравните
          format: фраза по-испански
          skill: comparar
          rule: mas_que
          items:
            - q: "Madrid / grande / Valencia (+)"
              a: "Madrid es más grande que Valencia"
              explain: "(+) — más … que."
            - q: "El taxi / caro / el autobús (+)"
              a: "El taxi es más caro que el autobús"
              explain: "(+) — más … que."
            - q: "Mi hermana / alto / yo (+)"
              a: "Mi hermana es más alta que yo"
              explain: "Hermana — женский род: más alta."
              mistakes:
                "mi hermana es más alto que yo": "О сестре — женский род: más **alta**."
                "mi hermana es más alta que mí": "После que — **yo**: más alta que yo."
            - q: "El autobús / cómodo / el tren (−)"
              a: "El autobús es menos cómodo que el tren"
              explain: "(−) — menos … que."
      - learn: [lento/a, malo/a, peor, menor]
      - choose:
          title: Más или menos?
          skill: comparar
          rule: mas_que
          items:
            - q: "El metro es muy rápido; el autobús es ___ rápido que el metro."
              options: "menos | más | mejor"
              explain: "Автобус медленнее метро: menos rápido."
            - q: "El tren es más ___ que el avión."
              options: "lento | lenta | lentos"
              explain: "El tren — мужской род, единственное число: lento."
      - table:
          id: mejor_peor
          slide: new
          title: Особые формы
          rows:
            - ["bueno → **mejor**", "Este café es **mejor** que el café de casa. — Этот кофе лучше, чем дома."]
            - ["malo → **peor**", "Mi inglés es **peor** que mi español. — Мой английский хуже моего испанского."]
            - ["старше → **mayor**", "Mi hermano es **mayor** que yo. — Мой брат старше меня."]
            - ["младше → **menor**", "Mi hermana es **menor** que yo. — Моя сестра младше меня."]
      - note:
          id: no_mas_bueno
          text: "О качестве обычно говорят не «más bueno» и «más malo», а **mejor** и **peor**. **Mayor que** уже значит «старше, чем»: más перед ним не ставят."
      - choose:
          title: Выберите форму
          skill: mejor_peor
          rule: mejor_peor
          items:
            - q: "Mi hermano tiene veinte años y yo treinta: él es ___ que yo."
              options: "menor | mayor | peor"
              explain: "Двадцать меньше, чем тридцать: брат младше — menor."
            - q: "Este restaurante es muy bueno: es ___ que el restaurante de ayer."
              options: "mejor | más bueno | peor"
              explain: "О качестве — mejor."
            - q: "El café de este bar es muy ___: no me gusta nada."
              options: "malo | mala | peor"
              explain: "El café — мужской род: malo."
            - say: "Mi hermana es menor que yo."
              options: "Моя сестра младше меня. | Моя сестра старше меня. | Моя сестра ниже меня."
              explain: "Menor — «младше», mayor — «старше»; «ниже» — más baja."
              noaudio: {q: "Что значит «Mi hermana es menor que yo»?", options: "Моя сестра младше меня. | Моя сестра старше меня. | Моя сестра ниже меня."}
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: mejor_peor
          rule: mejor_peor
          items:
            - q: "Мой испанский хуже, чем мой английский."
              a: "Mi español es peor que mi inglés"
              explain: "Хуже — peor."
              mistakes:
                "mi español es más malo que mi inglés": "О качестве — **peor**, а не «más malo»."
            - q: "Мой брат старше меня."
              a: "Mi hermano es mayor que yo"
              explain: "Старше — mayor."
              mistakes:
                "mi hermano es más mayor que yo": "Mayor уже значит «старше»: **mayor que yo**."
                "mi hermano es mayor que mí": "После que — **yo**: mayor que yo."
      - build:
          title: Соберите фразу
          skill: comparar
          rule: mas_que
          items:
            - es: "El autobús es más lento que el metro."
              ru: "Автобус медленнее, чем метро."
              extra: [como]
            - es: "Ana trabaja más que yo."
              ru: "Ана работает больше меня."
              extra: [mí]
      - compose:
          title: О себе
          skill: [comparar, mejor_peor]
          rule: mejor_peor
          items:
            - q: "Сравните себя с братом, сестрой или другом: кто старше, кто выше, кто лучше готовит. Напишите две-три фразы."
              format: "Mi hermana es mayor que yo…"
              words: [8, 45]
              sentences: 2
              checks:
                - label: "сравнение: más, menos, mayor, menor, mejor, peor"
                  any: [más, menos, mayor, menor, mejor, peor]
                - label: "с кем: … que yo, que mi hermano…"
                  any: [que]
              sample: "Mi hermana es mayor que yo, pero yo soy más alto. Ella cocina mejor que yo, y yo hablo más idiomas."
              sample_ru: "Моя сестра старше меня, но я выше. Она готовит лучше меня, а я знаю больше языков."
    quiz:
      - q: "Mi hermano es más alto ___ yo."
        options: "que | como | de"
        explain: "Más … que."
        skill: comparar
      - q: "Mi español no es muy bueno: es ___ que mi inglés."
        options: "peor | más malo | menor"
        explain: "Хуже — peor; menor — «младше»."
        skill: mejor_peor

  - id: tan_como
    kind: grammar
    title: "Tan grande como, tanto como"
    goal: сказать, что одинаково, а что нет
    version: 2
    vocab:
      - "🟰 tan [тан] — так, такой (tan … como — такой же…, как) :: Mi hermano es tan alto como yo. — Мой брат такого же роста, как я."
      - "🔢 tanto/a [та́нто, та́нта] — столько (tanto … como — столько же…, сколько) :: No tengo tanto tiempo como antes. — У меня нет столько времени, сколько раньше."
      - "⚖️ igual [игуа́ль] — одинаковый {forms: iguales} :: Las dos casas son iguales. — Оба дома одинаковые."
      - "🤝 parecido/a [парэθи́до, парэθи́да] — похожий :: Tu pueblo es parecido a mi pueblo. — Твоя деревня похожа на мою."
    blocks:
      - "Когда сравнивают одинаковое, говорят **tan … como** — «такой же…, как». С отрицанием это мягкий способ сказать «меньше»."
      - learn: [tan, tanto/a, igual, parecido/a]
      - table:
          id: tan_como
          title: Одинаково или нет
          rows:
            - ["**tan** + прилагательное + **como**", "Mi hermano es **tan** alto **como** yo. — Брат такого же роста, как я."]
            - ["**no tan** … **como**", "Valencia no es **tan** grande **como** Madrid. — Валенсия не такая большая, как Мадрид."]
            - ["**tanto, tanta, tantos, tantas** + существительное", "No hay **tantos** coches **como** en Madrid. — Машин не так много, как в Мадриде."]
            - ["глагол + **tanto como**", "Ya no leo **tanto como** antes. — Я уже не читаю столько, сколько раньше."]
      - note:
          id: tanto
          text: "Перед прилагательным — **tan**, перед существительным — **tanto** в нужном роде и числе: _tanto tiempo_, _tanta gente_, _tantos coches_, _tantas tiendas_. После глагола — **tanto como**."
      - choose:
          title: Tan или tanto?
          skill: tan_como
          rule: tanto
          items:
            - q: "Mi piso no es ___ grande como tu piso."
              options: "tan | tanto | tanta"
              explain: "Перед прилагательным (grande) — tan."
            - q: "En mi pueblo no hay ___ gente como en Madrid."
              options: "tanta | tanto | tan"
              explain: "Gente — женский род: tanta gente."
            - q: "Antes no había ___ coches como ahora."
              options: "tantos | tantas | tan"
              explain: "Coches — мужской род, множественное число: tantos."
            - q: "Ya no trabajo ___ como antes."
              options: "tanto | tan | tanta"
              explain: "После глагола — tanto como."
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: tan_como
          rule: tan_como
          items:
            - q: "Моя сестра такого же роста, как я."
              a: "Mi hermana es tan alta como yo"
              explain: "Tan alta como yo: о сестре — alta."
              mistakes:
                "mi hermana es tan alto como yo": "О сестре — женский род: tan **alta** como yo."
                "mi hermana es tan alta que yo": "После tan — **como**, а не que."
            - q: "Мой район не такой шумный, как центр."
              a: "Mi barrio no es tan ruidoso como el centro"
              explain: "No tan … como."
            - q: "У меня нет столько времени, сколько раньше."
              a: "No tengo tanto tiempo como antes | Ya no tengo tanto tiempo como antes"
              explain: "Перед существительным — tanto: tanto tiempo."
              mistakes:
                "no tengo tan tiempo como antes": "Перед существительным — **tanto**: tanto tiempo."
      - choose:
          title: Послушайте
          skill: tan_como
          rule: tan_como
          items:
            - say: "Mi pueblo no es tan bonito como tu pueblo."
              options: "Моя деревня не такая красивая, как твоя. | Моя деревня такая же красивая, как твоя. | Твоя деревня не такая красивая, как моя."
              explain: "No es tan bonito como — «не такой красивый, как»."
              noaudio: {q: "Что значит «Mi pueblo no es tan bonito como tu pueblo»?", options: "Моя деревня не такая красивая, как твоя. | Моя деревня такая же красивая, как твоя. | Твоя деревня не такая красивая, как моя."}
            - q: "Что значит «Las dos ciudades son muy parecidas, pero no son iguales»?"
              options: "Эти два города очень похожи, но не одинаковые. | Эти два города совсем разные. | Эти два города одинаковые."
              explain: "Parecidas — «похожие», iguales — «одинаковые»."
      - build:
          title: Соберите фразу
          skill: tan_como
          rule: tan_como
          items:
            - es: "Valencia no es tan grande como Madrid."
              ru: "Валенсия не такая большая, как Мадрид."
              extra: [que]
            - es: "Ya no leo tanto como antes."
              ru: "Я уже не читаю столько, сколько раньше."
              extra: [tan]
      - compose:
          title: О себе
          skill: tan_como
          rule: tan_como
          items:
            - q: "Сравните ваш город с другим: что там так же, а что не так. Напишите две-три фразы с tan… como или tanto… como."
              format: "Mi ciudad no es tan… como…"
              words: [8, 45]
              sentences: 2
              checks:
                - label: "tan … como или tanto … como"
                  re: "\\b(tan|tanto|tanta|tantos|tantas)\\b.*\\bcomo\\b"
              sample: "Mi ciudad no es tan grande como Madrid, pero es tan bonita como Madrid. En mi ciudad no hay tantos turistas como aquí."
              sample_ru: "Мой город не такой большой, как Мадрид, но такой же красивый. В моём городе не так много туристов, как здесь."
    quiz:
      - q: "En verano no hace ___ calor en Bilbao como en Sevilla."
        options: "tanto | tan | tanta"
        explain: "Calor — существительное мужского рода: tanto calor."
        skill: tan_como
      - q: "Mi hermano es ___ alto como mi padre."
        options: "tan | tanto | más"
        explain: "Tan + прилагательное + como."
        skill: tan_como

  - id: personas
    kind: grammar
    title: "Era alto y llevaba bigote"
    goal: описать, как выглядел и каким был человек раньше
    version: 2
    vocab:
      - "🧔 la barba [ба́рба] — борода :: Mi abuelo tenía barba. — У дедушки была борода."
      - "👨 el bigote [биго́тэ] — усы :: Mi padre llevaba bigote. — Папа носил усы."
      - "👨‍🦲 calvo/a [ка́льбо, ка́льба] — лысый :: Ahora mi tío está calvo. — Сейчас мой дядя лысый."
