id: numeros
number: 4
level: A0
title: Числа и возраст
goals:
  - считать от 0 до 20
  - сказать и спросить возраст
  - продиктовать и записать номер телефона

lessons:
  - id: vocab1
    kind: vocab
    title: Числа от 0 до 5
    goal: считать от 0 до 5 и узнавать эти числа на слух
    version: 2
    vocab:
      - "0️⃣ cero [θэ́ро] — ноль {pos: num}"
      - "1️⃣ uno [у́но] — один {pos: num}"
      - "2️⃣ dos [дос] — два {pos: num}"
      - "3️⃣ tres [трэс] — три {pos: num}"
      - "4️⃣ cuatro [куа́тро] — четыре {pos: num}"
      - "5️⃣ cinco [θи́нко] — пять {pos: num}"
    blocks:
      - "Без чисел не назвать ни возраст, ни цену, ни номер телефона. Начнём с шести."
      - learn: [cero, uno, dos, tres]
      - tip: "Зацепки для памяти: **uno** — как карточная игра UNO, **dos** и **tres** похожи на «два» и «три», **cero** — как «зеро» в рулетке."
      - choose:
          title: Послушайте и выберите
          rule: none
          skill: numbers_ear
          items:
            - say: "tres"
              options: "3 | 2 | 0"
              noaudio: {q: "Какое это число: «tres»?", options: "3 | 2 | 0"}
            - say: "dos"
              options: "2 | 3 | 1"
              noaudio: {q: "Какое это число: «dos»?", options: "2 | 3 | 1"}
      - learn: [cuatro, cinco]
      - tip: "**Cuatro** напоминает «квартет» — четыре музыканта. А фразу _un café_ вы уже знаете: перед словом мужского рода **uno** сокращается до **un** — _un café_, _un vino_, _un taxi_."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "cero — 0"
            - "uno — 1"
            - "dos — 2"
            - "tres — 3"
            - "cuatro — 4"
            - "cinco — 5"
      - write:
          title: Напишите словом
          format: число словом
          rule: none
          skill: numbers
          items:
            - q: "5"
              a: cinco
              mistakes: {sinco: "Звук «θ» перед `i` пишется буквой `c`: cinco.", zinco: "Звук «θ» перед `i` пишется буквой `c`: cinco."}
            - q: "0"
              a: cero
              mistakes: {zero: "По-испански — **cero**: перед `e` звук «θ» пишется буквой `c`."}
            - q: "4"
              a: cuatro
              mistakes: {quatro: "«Куа» пишется `cua`: cuatro."}
            - "uno, dos, ___, cuatro, cinco => tres"

  - id: vocab2
    kind: vocab
    title: Числа от 6 до 10
    goal: считать до десяти и складывать числа по-испански
    version: 2
    vocab:
      - "6️⃣ seis [сэйс] — шесть {pos: num}"
      - "7️⃣ siete [сьэ́тэ] — семь {pos: num}"
      - "8️⃣ ocho [о́чо] — восемь {pos: num}"
      - "9️⃣ nueve [нуэ́бэ] — девять {pos: num}"
      - "🔟 diez [дьэθ] — десять {pos: num}"
    blocks:
      - learn: [seis, siete, ocho, nueve, diez]
      - tip: "**Seis** и **siete** похожи на «шесть» и «семь». **Ocho** — как «окт-» в «октаве» (восемь нот), **nueve** — как «нояб-» в «ноябре» (когда-то девятый месяц), **diez** — как «дек-» в «декаде» (десять дней)."
      - choose:
          title: Послушайте и выберите
          rule: none
          skill: numbers_ear
          items:
            - say: "siete"
              options: "7 | 6 | 10"
              noaudio: {q: "Какое это число: «siete»?", options: "7 | 6 | 10"}
            - say: "nueve"
              options: "9 | 2 | 10"
              noaudio: {q: "Какое это число: «nueve»?", options: "9 | 2 | 10"}
            - say: "seis"
              options: "6 | 7 | 3"
              noaudio: {q: "Какое это число: «seis»?", options: "6 | 7 | 3"}
      - header: Посчитайте
      - "Когда считают, слово **y** означает «плюс»: _dos y tres_ — «два плюс три», _seis y uno_ — «шесть плюс один»."
      - write:
          title: Responde
          format: число словом
          skill: numbers
          items:
            - "dos y tres => cinco"
            - "cuatro y cuatro => ocho"
            - "seis y tres => nueve"
            - "cinco y cinco => diez"

  - id: edad
    kind: grammar
    title: ¿Cuántos años tienes?
    goal: спросить, сколько человеку лет, и сказать свой возраст
    version: 2
    vocab:
      - "🤲 tener [тэнэ́р] — иметь {forms: tengo tienes tiene}"
      - "📆 el año [а́ньо] — год {forms: años}"
      - "❓ ¿Cuántos años tienes? [куа́нтос а́ньос тьэ́нэс] — сколько тебе лет?"
    blocks:
      - "Посмотрите, как испанцы говорят о возрасте. Какой глагол стоит там, где мы говорим «мне … лет»?"
      - examples:
          items:
            - "Tengo diez años. — Мне десять лет."
            - "¿Cuántos años tienes? — Сколько тебе лет?"
            - "El perro tiene cinco años. — Собаке пять лет."
      - learn: [tener, el año, "¿Cuántos años tienes?"]
      - rule:
          id: tener
          text: |
            В испанском возраст «имеют»: **Tengo diez años** дословно значит «Я имею десять лет». Для этого нужен глагол **tener** — «иметь».
            Форма зависит от лица, как у **ser**: «я» — **tengo**, «ты» — **tienes**, «он», «она», «вы» — **tiene**: _Pablo tiene siete años_, _¿Cuántos años tiene usted?_
      - table:
          title: "tener — иметь"
          rows:
            - ["yo", "**tengo**"]
            - ["tú", "**tienes**"]
            - ["él / ella / usted", "**tiene**"]
      - note: "**Años** — «годы», множественное число от **año**. Пишите всегда `ñ`: с простой `n` получится совсем другое слово. _El año_, _diez años_, _¿Cuántos años tienes?_"
      - choose:
          title: Что ответить?
          rule: tener
          skill: tener_age
          items:
            - lines: ["Profesora: ¿Cuántos años tienes?"]
              q: "Вам девять лет, вы на уроке в школе."
              options: "Tengo nueve años. | Tienes nueve años. | Soy nueve años."
              explain: "О себе — tengo. Возраст «имеют», поэтому не soy."
      - write:
          title: Traduce
          format: фраза о возрасте по-испански
          rule: tener
          skill: tener_age
          items:
            - q: "Мне семь лет."
              a: "Tengo siete años | Yo tengo siete años"
              mistakes:
                "soy siete años": "Возраст по-испански «имеют»: **tengo** siete años, а не soy."
                "tengo siete": "Не хватает слова **años** — «лет»: tengo siete años."
            - q: "Ей девять лет."
              a: "Tiene nueve años | Ella tiene nueve años"
              mistakes:
                "es nueve años": "Возраст по-испански «имеют»: **tiene** nueve años, а не es."
      - build:
          title: Соберите фразу
          skill: tener_age
          items:
            - "¿Cuántos años tiene usted? — Сколько вам лет?"
            - "El perro tiene tres años. — Собаке три года."

  - id: vocab3
    kind: vocab
    title: Числа от 11 до 15 и 20
    goal: считать до пятнадцати и сказать «двадцать»
    version: 2
    vocab:
      - "1️⃣1️⃣ once [о́нθэ] — одиннадцать {pos: num}"
      - "1️⃣2️⃣ doce [до́θэ] — двенадцать {pos: num}"
      - "1️⃣3️⃣ trece [трэ́θэ] — тринадцать {pos: num}"
      - "1️⃣4️⃣ catorce [като́рθэ] — четырнадцать {pos: num}"
      - "1️⃣5️⃣ quince [ки́нθэ] — пятнадцать {pos: num}"
      - "2️⃣0️⃣ veinte [бэ́йнтэ] — двадцать {pos: num}"
    blocks:
      - "Числа от 11 до 15 заканчиваются на **-ce**, как русские на «-надцать». Во многих слышно знакомое число: в **doce** — **dos**, в **trece** — **tres**, в **catorce** — **cuatro**."
      - learn: [once, doce, trece, catorce, quince]
      - choose:
          title: Послушайте и выберите
          rule: none
          skill: numbers_ear
          items:
            - say: "catorce"
              options: "14 | 4 | 13"
              noaudio: {q: "Какое это число: «catorce»?", options: "14 | 4 | 13"}
              explain: "Catorce — 14, а cuatro — 4. Числа от 11 до 15 кончаются на -ce."
            - say: "quince"
              options: "15 | 5 | 12"
              noaudio: {q: "Какое это число: «quince»?", options: "15 | 5 | 12"}
            - say: "doce"
              options: "12 | 2 | 11"
              noaudio: {q: "Какое это число: «doce»?", options: "12 | 2 | 11"}
      - learn: [veinte]
      - write:
          title: Responde
          format: число словом
          skill: numbers
          items:
            - "diez y cinco => quince"
            - "diez y uno => once"
            - "diez y diez => veinte"
      - write:
          title: Traduce
          format: фраза о возрасте по-испански
          skill: tener_age
          items:
            - "Мне двадцать лет. => Tengo veinte años | Yo tengo veinte años"
            - "Ему тринадцать лет. => Tiene trece años | Él tiene trece años"

  - id: dieci
    kind: grammar
    title: "16–19: «десять и шесть»"
    goal: сказать числа от 16 до 19
    version: 2
    vocab:
      - "1️⃣6️⃣ dieciséis [дьэθисэ́йс] — шестнадцать {pos: num}"
      - "1️⃣7️⃣ diecisiete [дьэθисьэ́тэ] — семнадцать {pos: num}"
      - "1️⃣8️⃣ dieciocho [дьэθио́чо] — восемнадцать {pos: num}"
      - "1️⃣9️⃣ diecinueve [дьэθинуэ́бэ] — девятнадцать {pos: num}"
    blocks:
      - "Посмотрите на эти числа внимательно. Из каких знакомых слов они собраны?"
      - learn: [dieciséis, diecisiete, dieciocho, diecinueve]
      - table:
          rows:
            - ["16", "diez y seis → **dieciséis**"]
            - ["17", "diez y siete → **diecisiete**"]
            - ["18", "diez y ocho → **dieciocho**"]
            - ["19", "diez y nueve → **diecinueve**"]
      - rule:
          id: dieci
          text: |
            1. Всё число пишется одним словом, а `y` превращается в `i`: diec**i**séis, diec**i**ocho.
            2. Буква `z` слова diez меняется на `c`: die**c**isiete, die**c**inueve.
            3. У **dieciséis** есть значок ударения: слово заканчивается на `s`, а ударение — на последнем слоге: dieci**séis**.
      - write:
          title: Напишите словом
          format: число словом
          accents: strict
          skill: numbers
          items:
            - "17 => diecisiete"
            - "19 => diecinueve"
            - q: "16"
              a: "dieciséis"
              explain: "Ударение на последнем слоге, а слово кончается на `s` — поэтому значок: dieciséis."
      - choose:
          title: Responde
          skill: numbers
          items:
            - q: "nueve y nueve"
              options: "dieciocho | diecinueve | dieciséis"
            - q: "quince y cinco"
              options: "veinte | diecinueve | doce"
            - say: "diecisiete"
              options: "17 | 16 | 7"
              skill: numbers_ear
              noaudio: {q: "Какое это число: «diecisiete»?", options: "17 | 16 | 7"}

  - id: decenas
    kind: vocab
    title: Десятки до 100
    goal: назвать любое число до ста — и возраст взрослого человека
    version: 2
    # Аудит MYTHOS (PRG-02, U04-01): десятки 30–100 раньше вводились только в теме 17 — до неё нельзя было
    # назвать свой возраст. Урок вставлен в тему 04; в теме 17 остались сотни и цены.
    vocab:
      - "3️⃣0️⃣ treinta [трэ́йнта] — тридцать {pos: num}"
      - "4️⃣0️⃣ cuarenta [куарэ́нта] — сорок {pos: num}"
      - "5️⃣0️⃣ cincuenta [θинкуэ́нта] — пятьдесят {pos: num}"
      - "6️⃣0️⃣ sesenta [сэсэ́нта] — шестьдесят {pos: num}"
      - "7️⃣0️⃣ setenta [сэтэ́нта] — семьдесят {pos: num}"
      - "8️⃣0️⃣ ochenta [очэ́нта] — восемьдесят {pos: num}"
      - "9️⃣0️⃣ noventa [нобэ́нта] — девяносто {pos: num}"
      - "💯 cien [θьен] — сто {pos: num}"
    forms: [veintiuno, veintiún, veintidós, veintitrés, veinticuatro, veinticinco, veintiséis, veintisiete, veintiocho, veintinueve]
    blocks:
      - text:
          id: enta
          text: "Почти все десятки заканчиваются на `-enta`: cuarenta, cincuenta, sesenta. Кроме 20 и 30: veinte и treinta."
      - learn: [treinta, cuarenta, cincuenta, sesenta]
      - choose:
          title: Послушайте и выберите
          rule: enta
          skill: numbers_ear
          items:
            - say: "cincuenta"
              options: "50 | 15 | 5"
              noaudio: {q: "Какое это число: cincuenta?", options: "50 | 15 | 5"}
            - say: "cuarenta"
              options: "40 | 14 | 4"
              noaudio: {q: "Какое это число: cuarenta?", options: "40 | 14 | 4"}
      - learn: [setenta, ochenta, noventa, cien]
      - match:
          title: Соедините пары
          rule: none
          skill: tens
          pairs:
            - "30 — treinta"
            - "60 — sesenta"
            - "70 — setenta"
            - "80 — ochenta"
            - "90 — noventa"
            - "100 — cien"
      - rule:
          id: tens_y
          text: |
            1. 21–29 — одним словом, как 16–19: veintiuno, veintidós, veintitrés… veintinueve.
            2. 31–99 — три слова, десятки и единицы соединяет **y**: treinta **y** uno, cuarenta **y** cinco.
            3. 100 — **cien**: _cien años_.
            4. Перед словом мужского рода **uno** теряет `-o`: _veintiún años_, _treinta y un años_.
      - choose:
          title: Послушайте и выберите
          rule: tens_y
          skill: numbers_ear
          items:
            - say: "veinticinco"
              options: "25 | 52 | 35"
              noaudio: {q: "Какое это число: veinticinco?", options: "25 | 52 | 35"}
            - say: "sesenta y siete"
              options: "67 | 76 | 57"
              noaudio: {q: "Какое это число: sesenta y siete?", options: "67 | 76 | 57"}
      - write:
          title: Напишите словами
          format: число словами
          rule: tens_y
          skill: tens
          items:
            - q: "45"
              a: "cuarenta y cinco"
              mistakes: {"cuarentaicinco": "31–99 — три слова: cuarenta **y** cinco.", "cuarenta cinco": "Десятки и единицы соединяет **y**: cuarenta y cinco."}
            - q: "27"
              a: "veintisiete"
              mistakes: {"veinte y siete": "21–29 — одним словом: **veintisiete**."}
            - "31 => treinta y uno"
            - "63 => sesenta y tres"
            - "99 => noventa y nueve"
            - "100 => cien"
      - write:
          title: Послушайте и запишите цифрами
          format: число цифрами
          answer: number
          skill: numbers_ear
          items:
            - say: "setenta y dos"
              a: "72"
              noaudio: {q: "Запишите цифрами: setenta y dos", a: "72"}
            - say: "ochenta y cinco"
              a: "85"
              noaudio: {q: "Запишите цифрами: ochenta y cinco", a: "85"}
            - say: "veintitrés"
              a: "23"
              noaudio: {q: "Запишите цифрами: veintitrés", a: "23"}
      - choose:
          title: Что ответить?
          rule: tens_y
          skill: tener_age
          items:
            - lines: ["Pablo: ¿Cuántos años tienes?"]
              q: "Вам тридцать один год."
              options: "Tengo treinta y un años. | Tengo treinta y uno años. | Tengo treinta uno años."
              explain: "Перед años **uno** теряет `-o`: treinta y un años, veintiún años."
      - write:
          title: Ответьте
          format: ответ по-испански
          rule: tens_y
          skill: tener_age
          items:
            - q: "Pablo: ¿Cuántos años tienes? — Вам тридцать два года."
              a: "Tengo treinta y dos años | (Yo) tengo treinta y dos años | Treinta y dos( años)"
              mistakes: {"tengo treinta dos años": "Десятки и единицы соединяет **y**: treinta **y** dos."}
            - q: "Lucía: ¿Cuántos años tiene el señor García? — Ему пятьдесят шесть."
              a: "Tiene cincuenta y seis años | (El señor García) tiene cincuenta y seis años | Cincuenta y seis( años)"
            - q: "Ana: ¿Cuántos años tienes? — Вам двадцать один год."
              a: "Tengo veintiún años | (Yo) tengo veintiún años | Veintiún años | Veintiuno"
              mistakes: {"tengo veintiuno años": "Перед años **uno** теряет `-o`: **veintiún** años.", "tengo veinte y uno años": "21 — одним словом, а перед años без -o: **veintiún** años."}

  - id: telefono
    kind: dialogue
    title: Номер телефона
    goal: продиктовать номер телефона и понять его на слух
    version: 2
    vocab:
      - "🔢 el número [ну́мэро] — номер; число"
      - "📞 el teléfono [тэлэ́фоно] — телефон"
      - "❓ ¿Cuál es...? [куа́ль эс] — какой...? (какой из)"
      - "👆 mi [ми] — мой, моя"
      - "👉 tu [ту] — твой, твоя"
      - "🫵 su [су] — его, её; ваш"
    blocks:
      - "В Испании номер телефона — девять цифр. Часто его читают по одной цифре: _seis, cinco, cero, dos..._"
      - learn: [el número, el teléfono, "¿Cuál es...?"]
      - dialogue:
          id: gym
          title: В спортзале
          lines:
            - "Recepcionista: Buenas tardes. ¿Cómo se llama usted? | Добрый день. Как вас зовут?"
            - "Ana: Me llamo Ana Torres. | Меня зовут Ана Торрес."
            - "Recepcionista: ¿Cuántos años tiene? | Сколько вам лет?"
            - "Ana: Tengo veinte años. | Мне двадцать лет."
            - "Recepcionista: ¿Cuál es su número de teléfono? | Какой у вас номер телефона?"
            - "Ana: Seis, cinco, cero, dos, ocho, uno, nueve, siete, tres. | 650 281 973."
            - "Recepcionista: Más despacio, por favor. | Помедленнее, пожалуйста."
            - "Ana: Seis, cinco, cero... dos, ocho, uno... nueve, siete, tres. | 650... 281... 973."
            - "Recepcionista: Muchas gracias, señora Torres. | Большое спасибо, сеньора Торрес."
      - choose:
          title: Responde
          source: gym
          items:
            - q: "¿Cuántos años tiene Ana?"
              options: "Tiene veinte años. | Tiene doce años. | Tiene quince años."
              explain: "Ana: Tengo veinte años. — Ане двадцать лет."
              skill: tener_age
            - q: "¿Cuál es el número de teléfono de Ana?"
              options: "650 281 973 | 650 281 937 | 560 281 973"
              explain: "Ana: Seis, cinco, cero, dos, ocho, uno, nueve, siete, tres. — 650 281 973."
              skill: phone
            - q: "Почему администратор говорит «Más despacio, por favor»?"
              options: "Ана диктует слишком быстро. | Ана не назвала имя. | Ана говорит на «ты»."
              explain: "Más despacio — «помедленнее»: Ана продиктовала номер слишком быстро."
      - learn: [mi, tu, su]
      - tip:
          id: mi_tu_su
          text: |
            **tu** без значка — «твой»: _tu número_, _tu teléfono_. А **tú** со значком — «ты»: _¿Y tú?_ Это как пара **el** и **él**.
            **su** — «его», «её» и вежливое «ваш»: _su número_ — «его номер», «её номер» или «ваш номер». Поэтому администратор спрашивает Ану на «вы»: _¿Cuál es su número de teléfono?_
      - choose:
          title: Как спросить?
          free: true
          skill: mi_tu_su
          items:
