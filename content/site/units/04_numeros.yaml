id: numeros
number: 4
level: A0
title: Числа и возраст
goals:
  - считать от 0 до 20
  - сказать и спросить возраст
  - продиктовать и записать номер телефона

lessons:
  - id: vocab1
    kind: vocab
    title: Числа от 0 до 5
    goal: считать от 0 до 5 и узнавать эти числа на слух
    vocab:
      - "0️⃣ cero [θэ́ро] — ноль {pos: num}"
      - "1️⃣ uno [у́но] — один {pos: num}"
      - "2️⃣ dos [дос] — два {pos: num}"
      - "3️⃣ tres [трэс] — три {pos: num}"
      - "4️⃣ cuatro [куа́тро] — четыре {pos: num}"
      - "5️⃣ cinco [θи́нко] — пять {pos: num}"
    blocks:
      - "Без чисел не назвать ни возраст, ни цену, ни номер телефона. Начнём с шести."
      - learn: [cero, uno, dos, tres]
      - tip: "Зацепки для памяти: **uno** — как карточная игра UNO, **dos** и **tres** похожи на «два» и «три», **cero** — как «зеро» в рулетке."
      - choose:
          title: Послушайте и выберите
          items:
            - say: "tres"
              options: "3 | 2 | 0"
            - say: "dos"
              options: "2 | 3 | 1"
      - learn: [cuatro, cinco]
      - tip: "**Cuatro** напоминает «квартет» — четыре музыканта. А фразу _un café_ вы уже знаете: перед словом мужского рода **uno** сокращается до **un** — _un café_, _un vino_, _un taxi_."
      - match:
          title: Соедините пары
          pairs:
            - "cero — 0"
            - "uno — 1"
            - "dos — 2"
            - "tres — 3"
            - "cuatro — 4"
            - "cinco — 5"
      - write:
          title: Напишите словом
          format: число словом
          items:
            - "5 => cinco"
            - "0 => cero"
            - "4 => cuatro"
            - "uno, dos, ___, cuatro, cinco => tres"

  - id: vocab2
    kind: vocab
    title: Числа от 6 до 10
    goal: считать до десяти и складывать числа по-испански
    vocab:
      - "6️⃣ seis [сэйс] — шесть {pos: num}"
      - "7️⃣ siete [сьэ́тэ] — семь {pos: num}"
      - "8️⃣ ocho [о́чо] — восемь {pos: num}"
      - "9️⃣ nueve [нуэ́бэ] — девять {pos: num}"
      - "🔟 diez [дьэθ] — десять {pos: num}"
    blocks:
      - learn: [seis, siete, ocho, nueve, diez]
      - tip: "**Seis** и **siete** похожи на «шесть» и «семь». **Ocho** — как «окт-» в «октаве» (восемь нот), **nueve** — как «нояб-» в «ноябре» (когда-то девятый месяц), **diez** — как «дек-» в «декаде» (десять дней)."
      - choose:
          title: Послушайте и выберите
          items:
            - say: "siete"
              options: "7 | 6 | 10"
            - say: "nueve"
              options: "9 | 2 | 10"
            - say: "seis"
              options: "6 | 7 | 3"
      - header: Посчитайте
      - "Когда считают, слово **y** означает «плюс»: _dos y tres_ — «два плюс три», _seis y uno_ — «шесть плюс один»."
      - write:
          title: Responde
          format: число словом
          items:
            - "dos y tres => cinco"
            - "cuatro y cuatro => ocho"
            - "seis y tres => nueve"
            - "cinco y cinco => diez"

  - id: edad
    kind: grammar
    title: ¿Cuántos años tienes?
    goal: спросить, сколько человеку лет, и сказать свой возраст
    vocab:
      - "🤲 tener [тэнэ́р] — иметь {forms: tengo tienes tiene}"
      - "📆 el año [а́ньо] — год {forms: años}"
      - "❓ ¿Cuántos años tienes? [куа́нтос а́ньос тьэ́нэс] — сколько тебе лет?"
    blocks:
      - "Посмотрите, как испанцы говорят о возрасте. Какой глагол стоит там, где мы говорим «мне … лет»?"
      - examples:
          items:
            - "Tengo diez años. — Мне десять лет."
            - "¿Cuántos años tienes? — Сколько тебе лет?"
            - "El perro tiene cinco años. — Собаке пять лет."
      - learn: [tener, el año, "¿Cuántos años tienes?"]
      - rule: |
          В испанском возраст «имеют»: **Tengo diez años** дословно значит «Я имею десять лет». Для этого нужен глагол **tener** — «иметь».
          Форма зависит от лица, как у **ser**: «я» — **tengo**, «ты» — **tienes**, «он», «она», «вы» — **tiene**: _Pablo tiene siete años_, _¿Cuántos años tiene usted?_
      - table:
          title: "tener — иметь"
          rows:
            - ["yo", "**tengo**"]
            - ["tú", "**tienes**"]
            - ["él / ella / usted", "**tiene**"]
      - note: "**Años** — «годы», множественное число от **año**. Пишите всегда `ñ`: с простой `n` получится совсем другое слово. _El año_, _diez años_, _¿Cuántos años tienes?_"
      - choose:
          title: Что ответить?
          items:
            - lines: ["Profesora: ¿Cuántos años tienes?"]
              q: "Вам девять лет, вы на уроке в школе."
              options: "Tengo nueve años. | Tienes nueve años. | Soy nueve años."
              explain: "О себе — tengo. Возраст «имеют», поэтому не soy."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - q: "Мне семь лет."
              a: "Tengo siete años"
            - q: "Ей девять лет."
              a: "Tiene nueve años | Ella tiene nueve años"
      - build:
          title: Соберите фразу
          items:
            - "¿Cuántos años tiene usted? — Сколько вам лет?"
            - "El perro tiene tres años. — Собаке три года."

  - id: vocab3
    kind: vocab
    title: Числа от 11 до 15 и 20
    goal: считать до пятнадцати и сказать «двадцать»
    vocab:
      - "1️⃣1️⃣ once [о́нθэ] — одиннадцать {pos: num}"
      - "1️⃣2️⃣ doce [до́θэ] — двенадцать {pos: num}"
      - "1️⃣3️⃣ trece [трэ́θэ] — тринадцать {pos: num}"
      - "1️⃣4️⃣ catorce [като́рθэ] — четырнадцать {pos: num}"
      - "1️⃣5️⃣ quince [ки́нθэ] — пятнадцать {pos: num}"
      - "2️⃣0️⃣ veinte [бэ́йнтэ] — двадцать {pos: num}"
    blocks:
      - "Числа от 11 до 15 заканчиваются на **-ce**, как русские на «-надцать». Во многих слышно знакомое число: в **doce** — **dos**, в **trece** — **tres**, в **catorce** — **cuatro**."
      - learn: [once, doce, trece, catorce, quince]
      - choose:
          title: Послушайте и выберите
          items:
            - say: "catorce"
              options: "14 | 4 | 13"
              explain: "Catorce — 14, а cuatro — 4. Числа от 11 до 15 кончаются на -ce."
            - say: "quince"
              options: "15 | 5 | 12"
            - say: "doce"
              options: "12 | 2 | 11"
      - learn: [veinte]
      - write:
          title: Responde
          format: число словом
          items:
            - "diez y cinco => quince"
            - "diez y uno => once"
            - "diez y diez => veinte"
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Мне двадцать лет. => Tengo veinte años"
            - "Ему тринадцать лет. => Tiene trece años | Él tiene trece años"

  - id: dieci
    kind: grammar
    title: "16–19: «десять и шесть»"
    goal: сказать числа от 16 до 19
    vocab:
      - "1️⃣6️⃣ dieciséis [дьэθисэ́йс] — шестнадцать {pos: num}"
      - "1️⃣7️⃣ diecisiete [дьэθисьэ́тэ] — семнадцать {pos: num}"
      - "1️⃣8️⃣ dieciocho [дьэθио́чо] — восемнадцать {pos: num}"
      - "1️⃣9️⃣ diecinueve [дьэθинуэ́бэ] — девятнадцать {pos: num}"
    blocks:
      - "Посмотрите на эти числа внимательно. Из каких знакомых слов они собраны?"
      - learn: [dieciséis, diecisiete, dieciocho, diecinueve]
      - table:
          rows:
            - ["16", "diez y seis → **dieciséis**"]
            - ["17", "diez y siete → **diecisiete**"]
            - ["18", "diez y ocho → **dieciocho**"]
            - ["19", "diez y nueve → **diecinueve**"]
      - rule: |
          1. Всё число пишется одним словом, а `y` превращается в `i`: diec**i**séis, diec**i**ocho.
          2. Буква `z` слова diez меняется на `c`: die**c**isiete, die**c**inueve.
          3. У **dieciséis** есть значок ударения: слово заканчивается на `s`, а ударение — на последнем слоге: dieci**séis**.
      - write:
          title: Напишите словом
          format: число словом
          accents: strict
          items:
            - "17 => diecisiete"
            - "19 => diecinueve"
            - q: "16"
              a: "dieciséis"
              explain: "Ударение на последнем слоге, а слово кончается на `s` — поэтому значок: dieciséis."
      - choose:
          title: Responde
          items:
            - q: "nueve y nueve"
              options: "dieciocho | diecinueve | dieciséis"
            - q: "quince y cinco"
              options: "veinte | diecinueve | doce"
            - say: "diecisiete"
              options: "17 | 16 | 7"

  - id: telefono
    kind: dialogue
    title: Номер телефона
    goal: продиктовать номер телефона и понять его на слух
    vocab:
      - "🔢 el número [ну́мэро] — номер; число"
      - "📞 el teléfono [тэлэ́фоно] — телефон"
      - "❓ ¿Cuál es...? [куа́ль эс] — какой...? (какой из)"
      - "👆 mi [ми] — мой, моя"
      - "👉 tu [ту] — твой, твоя"
      - "🫵 su [су] — его, её; ваш"
    blocks:
      - "В Испании номер телефона — девять цифр. Часто его читают по одной цифре: _seis, cinco, cero, dos..._"
      - learn: [el número, el teléfono, "¿Cuál es...?"]
      - dialogue:
          title: В спортзале
          lines:
            - "Recepcionista: Buenas tardes. ¿Cómo se llama usted? | Добрый день. Как вас зовут?"
            - "Ana: Me llamo Ana Torres. | Меня зовут Ана Торрес."
            - "Recepcionista: ¿Cuántos años tiene? | Сколько вам лет?"
            - "Ana: Tengo veinte años. | Мне двадцать лет."
            - "Recepcionista: ¿Cuál es su número de teléfono? | Какой у вас номер телефона?"
            - "Ana: Seis, cinco, cero, dos, ocho, uno, nueve, siete, tres. | 650 281 973."
            - "Recepcionista: Más despacio, por favor. | Помедленнее, пожалуйста."
            - "Ana: Seis, cinco, cero... dos, ocho, uno... nueve, siete, tres. | 650... 281... 973."
            - "Recepcionista: Muchas gracias, señora Torres. | Большое спасибо, сеньора Торрес."
      - choose:
          title: Responde
          items:
            - q: "¿Cuántos años tiene Ana?"
              options: "Tiene veinte años. | Tiene doce años. | Tiene quince años."
            - q: "¿Cuál es el número de teléfono de Ana?"
              options: "650 281 973 | 650 281 937 | 560 281 973"
            - q: "Почему администратор говорит «Más despacio, por favor»?"
              options: "Ана диктует слишком быстро. | Ана не назвала имя. | Ана говорит на «ты»."
      - learn: [mi, tu, su]
      - tip: |
          **tu** без значка — «твой»: _tu número_, _tu teléfono_. А **tú** со значком — «ты»: _¿Y tú?_ Это как пара **el** и **él**.
          **su** — «его», «её» и вежливое «ваш»: _su número_ — «его номер», «её номер» или «ваш номер». Поэтому администратор спрашивает Ану на «вы»: _¿Cuál es su número de teléfono?_
      - choose:
          title: Как спросить?
          items:
            - q: "Спросите номер телефона у друга."
              options: "¿Cuál es tu número de teléfono? | ¿Cuál es su número de teléfono? | ¿Cuál es mi número de teléfono?"
              explain: "С другом — на «ты»: tu número. Su número — «ваш номер», mi número — «мой номер»."
            - q: "Как правильно: «твой номер»?"
              options: "tu número | tú número"
              explain: "Tu без значка — «твой», tú со значком — «ты»."
      - write:
          title: Послушайте и запишите цифрами
          format: цифры
          items:
            - say: "seis, dos, nueve"
              a: "629 | 6 2 9"
            - say: "cero, uno, ocho"
              a: "018 | 0 1 8"
      - mission:
          title: Запись в языковую школу
          text: "Вы записываетесь в языковую школу. Администратор задаёт вопросы — ответьте ей."
      - choose:
          items:
            - lines: ["Recepcionista: ¿Cuántos años tiene?"]
              q: "Вам восемнадцать лет."
              options: "Tengo dieciocho años. | Tiene dieciocho años. | Soy dieciocho años."
            - lines: ["Recepcionista: ¿Cuál es su número de teléfono?"]
              q: "Ваш номер начинается на 650."
              options: "Mi número es seis, cinco, cero... | Su número es seis, cinco, cero... | Tu número es seis, cinco, cero..."
              explain: "О своём номере говорят mi número — «мой номер»."
      - write:
          items:
            - q: "Начните диктовать номер: «Мой номер — шесть, пять, ноль…»"
              a: "Mi número es seis, cinco, cero"
              format: фраза по-испански

  - id: dictado
    kind: listening
    title: Диктант чисел
    goal: понимать числа на слух
    blocks:
      - "Послушайте и запишите числа цифрами. Повторите урок через пару дней — числа будут даваться легче."
      - write:
          title: Послушайте и запишите цифрами
          format: число цифрами
          items:
            - say: "siete"
              a: "7"
            - say: "doce"
              a: "12"
            - say: "quince"
              a: "15"
              explain: "Quince — 15, а cinco — 5."
            - say: "diecinueve"
              a: "19"
            - say: "catorce"
              a: "14"
              explain: "Catorce — 14, а cuatro — 4."
      - choose:
          title: Какой номер вы услышали?
          items:
            - say: "seis, dos, nueve, cero, uno, ocho, tres, cuatro, cinco"
              options: "629 018 345 | 629 018 354 | 692 018 345"

  - id: quiz
    kind: quiz
    title: Числа и возраст
    blocks:
      - "Это тест по теме «Числа и возраст»."
      - cando:
          - "считать от 0 до 20"
          - "спросить и сказать возраст: ¿Cuántos años tienes? — Tengo... años."
          - "спросить и продиктовать номер телефона"
    quiz:
      - q: Какое это число — «catorce»?
        options: "14 | 4 | 40"
        explain: "Catorce значит 14. А 4 по-испански будет cuatro."
      - q: "¿Cuántos años tienes?"
        options: "Tengo veinte años. | Soy veinte años. | Tienes veinte años."
        explain: "В испанском возраст «имеют», поэтому о себе говорят Tengo veinte años, то есть дословно «Я имею двадцать лет». Глагол soy здесь не подходит."
      - q: "siete y ocho = ?"
        options: "quince | trece | diecisiete"
        explain: "Siete y ocho значит «семь плюс восемь», а это пятнадцать, то есть quince."
      - q: Как сказать «твой номер»?
        options: "tu número | tú número | su número"
        explain: "Слово tu без значка значит «твой», а tú со значком значит «ты». А su значит «его», «её» или «ваш»."
      - q: Как правильно пишется 16?
        options: "dieciséis | diez y seis | dieceseis"
        explain: "Числа от 16 до 19 пишутся одним словом, а у dieciséis есть значок ударения над `é`."
