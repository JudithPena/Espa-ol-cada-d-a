  - id: dictado
    kind: listening
    title: Диктант чисел
    goal: понимать числа на слух
    version: 2
    # Диктант начинается сразу заданием. Без звука — альтернатива: число словами (урок «без звука»).
    blocks:
      - write:
          title: Послушайте и запишите цифрами
          format: число цифрами
          answer: number
          skill: numbers_ear
          items:
            - say: "siete"
              a: "7"
              noaudio: {q: "Запишите цифрами: siete", a: "7"}
            - say: "doce"
              a: "12"
              noaudio: {q: "Запишите цифрами: doce", a: "12"}
            - say: "quince"
              a: "15"
              noaudio: {q: "Запишите цифрами: quince", a: "15"}
              explain: "Quince — 15, а cinco — 5."
            - say: "diecinueve"
              a: "19"
              noaudio: {q: "Запишите цифрами: diecinueve", a: "19"}
            - say: "catorce"
              a: "14"
              noaudio: {q: "Запишите цифрами: catorce", a: "14"}
              explain: "Catorce — 14, а cuatro — 4."
      - choose:
          title: Какой номер вы услышали?
          skill: [numbers_ear, phone]
          items:
            - say: "seis, dos, nueve, cero, uno, ocho, tres, cuatro, cinco"
              options: "629 018 345 | 629 018 354 | 692 018 345"
              noaudio: {q: "Какой номер записан словами: seis, dos, nueve, cero, uno, ocho, tres, cuatro, cinco?", options: "629 018 345 | 629 018 354 | 692 018 345"}

  - id: quiz
    kind: quiz
    title: Числа и возраст
    goal: считать до двадцати, сказать возраст и продиктовать номер телефона
    version: 2
    check: soft
    blocks:
      - "Это тест по теме «Числа и возраст»."
      - cando:
          - "считать от 0 до 20"
          - "спросить и сказать возраст: ¿Cuántos años tienes? — Tengo... años."
          - "спросить и продиктовать номер телефона"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "veinte — 20"
            - "once — 11"
            - "el año — год"
            - "el teléfono — телефон"
            - "mi — мой"
    quiz:
      - q: Какое это число — «catorce»?
        options: "14 | 4 | 40"
        explain: "Catorce значит 14. А 4 по-испански будет cuatro."
        skill: numbers
      - q: "¿Cuántos años tienes?"
        options: "Tengo veinte años. | Soy veinte años. | Tienes veinte años."
        explain: "В испанском возраст «имеют», поэтому о себе говорят Tengo veinte años, то есть дословно «Я имею двадцать лет». Глагол soy здесь не подходит."
        skill: tener_age
      - q: "siete y ocho = ?"
        options: "quince | trece | diecisiete"
        explain: "Siete y ocho значит «семь плюс восемь», а это пятнадцать, то есть quince."
        skill: numbers
      - q: Как сказать «твой номер»?
        options: "tu número | tú número | su número"
        explain: "Слово tu без значка значит «твой», а tú со значком значит «ты». А su значит «его», «её» или «ваш»."
        skill: mi_tu_su
      - q: Как правильно пишется 16?
        options: "dieciséis | diez y seis | dieceseis"
        explain: "Числа от 16 до 19 пишутся одним словом, а у dieciséis есть значок ударения над `é`."
        skill: numbers
