id: salud
number: 20
level: A1
title: Здоровье
goals:
  - назвать части тела
  - сказать, что болит, и описать самочувствие
  - объясниться у врача и в аптеке

lessons:
  - id: cuerpo
    kind: vocab
    title: Тело
    goal: назвать части тела
    version: 3
    vocab:
      - "🧍 el cuerpo [куэ́рпо] — тело"
      - "🗣 la cabeza [кабэ́θа] — голова"
      - "💪 el brazo [бра́θо] — рука (вся)"
      - "✋ la mano [ма́но] — кисть руки, рука"
      - "🦵 la pierna [пьэ́рна] — нога"
      - "🦶 el pie [пьэ] — ступня, нога (ниже щиколотки)"
      - "🔙 la espalda [эспа́льда] — спина"
      - "🫃 el estómago [эсто́маго] — желудок, живот"
    blocks:
      - learn: [el cuerpo, la cabeza, el brazo, la mano]
      - rule:
          id: mano
          text: "**la mano** женского рода, хотя кончается на `-o`: _la mano derecha_, _las manos pequeñas_. Обратный случай вы знаете: _el día_, _el mapa_."
      - choose:
          title: El или la?
          skill: body
          items:
            - q: "___ mano"
              options: "la | el"
            - q: "___ día"
              options: "el | la"
      - learn: [la pierna, el pie, la espalda, el estómago]
      - match:
          title: Соедините пары
          pairs:
            - "la cabeza — голова"
            - "el brazo — рука (вся)"
            - "la pierna — нога"
            - "la espalda — спина"
            - "el estómago — живот"
            - "el cuerpo — тело"
      - write:
          title: Traduce
          format: фраза по-испански
          rule: none
          skill: body
          items:
            - q: "две кисти рук и две ступни"
              a: "dos manos y dos pies"
              mistakes: {"dos manos y dos pie": "pie во множественном — **pies**."}
            - q: "Я мою руки."
              a: "Me lavo las manos | (Yo) me lavo las manos"
              mistakes: {"me lavo mis manos": "С частями тела — артикль, а не mi: me lavo **las** manos.", "lavo las manos": "Руки моют себе — нужно **me**: me lavo las manos."}
      - choose:
          title: Послушайте и выберите
          skill: body
          items:
            - say: "Tengo dos brazos y dos piernas."
              options: "У меня две руки и две ноги. | У меня две кисти и две ступни. | У меня две руки и два глаза."
              noaudio: {q: "Что значит «Tengo dos brazos y dos piernas.»?", options: "У меня две руки и две ноги. | У меня две кисти и две ступни. | У меня две руки и два глаза."}
            - say: "Me lavo la cabeza."
              options: "Я мою голову. | Я мою руки. | Я мою ноги."
              noaudio: {q: "Что значит «Me lavo la cabeza.»?", options: "Я мою голову. | Я мою руки. | Я мою ноги."}

  - id: doler
    kind: grammar
    title: Me duele la cabeza
    goal: сказать, что болит
    version: 3
    vocab:
      - "🤕 doler [долэ́р] — болеть :: Me duele la cabeza. — У меня болит голова."
      - "❓ ¿Qué te duele? [кэ тэ дуэ́лэ] — что у тебя болит?"
      - "🗣 la garganta [гарга́нта] — горло"
      - "🦷 la muela [муэ́ла] — коренной зуб :: Me duelen las muelas. — У меня болят зубы."
    blocks:
      - learn: [doler, "¿Qué te duele?"]
      - "**doler** («болеть») устроен как **gustar**: _me gusta_ — одно, _me gustan_ — много. Так и здесь."
      - compare:
          id: duele
          cards:
            - head: me duele
              label: болит одно
              tone: blue
              ex: ["Me duele la cabeza.", "¿Te duele la espalda?"]
            - head: me duelen
              label: болит несколько
              tone: rose
              ex: ["Me duelen los pies.", "Le duelen las piernas."]
          note: "У кого болит — **me, te, le, nos, os, les**. Человека называют с **a**, а **le** остаётся: _A Carlos le duele la cabeza._"
      - write:
          title: "¿Duele o duelen?"
          format: duele или duelen
          rule: duele
          skill: doler
          items:
            - "Me ___ el estómago. => duele"
            - {q: "Me ___ las piernas.", a: "duelen", mistakes: {"duele": "Ног две — **duelen**."}}
            - "¿Te ___ la cabeza? => duele"
            - {q: "A Ana le ___ los ojos.", a: "duelen", mistakes: {"duele": "Глаза — во множественном: **duelen**."}}
      - learn: [la garganta, la muela]
      - rule:
          id: articulo
          text: "С частями тела ставят артикль, а не «мой»: _Me duele **la** cabeza_, а не `Me duele mi cabeza`. _Me lavo **las** manos._"
      - choose:
          title: Как сказать?
          skill: doler
          items:
            - q: "У меня болит горло."
              options: "Me duele la garganta. | Me duele mi garganta. | Tengo duele la garganta."
            - q: "A mi madre ___ duelen las piernas."
              options: "le | la | me"
              rule: duele
            - lines: ["Ana: ¿Qué te duele?"]
              q: "У вас болит голова."
              options: "Me duele la cabeza. | Me duelen la cabeza. | Te duele la cabeza."
              rule: duele
      - write:
          title: Traduce
          format: фраза по-испански
          skill: doler
          items:
            - q: "У меня болят зубы."
              a: "Me duelen las muelas | (A mí) me duelen [las muelas/los dientes]"
              mistakes: {"me duele las muelas": "Зубов несколько — **duelen**.", "me duelen mis muelas": "С частями тела — артикль: **las** muelas."}
            - q: "У него болит спина."
              a: "Le duele la espalda | A él le duele la espalda"
              mistakes: {"le duele su espalda": "С частями тела — артикль: **la** espalda."}
      - choose:
          title: Послушайте и выберите
          skill: doler
          items:
            - say: "Me duele la garganta."
              options: "У меня болит горло. | У меня болит голова. | У меня болят зубы."
              noaudio: {q: "Что значит «Me duele la garganta.»?", options: "У меня болит горло. | У меня болит голова. | У меня болят зубы."}
            - say: "¿Qué te duele?"
              options: "Что у тебя болит? | Что с тобой? | Где ты?"
              noaudio: {q: "Что значит «¿Qué te duele?»?", options: "Что у тебя болит? | Что с тобой? | Где ты?"}

  - id: tener
    kind: grammar
    title: "Tengo hambre, tengo frío"
    goal: описать самочувствие — хочу есть, мне холодно, температура
    version: 3
    vocab:
      - "🍽 tener hambre [тэнэ́р а́мбрэ] — хотеть есть"
      - "🥤 tener sed [тэнэ́р сэд] — хотеть пить"
      - "😴 tener sueño [тэнэ́р суэ́ньо] — хотеть спать"
      - "🥶 tener frío / tener calor [фри́о, кало́р] — мёрзнуть / быть жарко"
      - "🤒 tener fiebre [тэнэ́р фьэ́брэ] — температурить"
      - "😱 tener miedo [тэнэ́р мьэ́до] — бояться"
      - "🤧 el resfriado [рэсфрья́до] — простуда"
      - "🧒 el niño / la niña [ни́ньо, ни́нья] — ребёнок; мальчик / девочка"
    blocks:
      - learn: [tener hambre, tener sed, tener sueño, tener frío / tener calor]
      - text:
          id: tengo_hambre
          text: "По-русски «мне холодно», «я хочу есть», а испанцы говорят «я **имею** холод», «я **имею** голод»."
      - choose:
          title: Что вы скажете?
          skill: tener_states
          items:
            - q: "Вы весь день на жаре без воды."
              options: "Tengo sed. | Estoy sed. | Quiero sed."
            - q: "Уже час ночи, глаза закрываются."
              options: "Tengo sueño. | Tengo hambre. | Estoy sueño."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "tener hambre — хотеть есть"
            - "tener sed — хотеть пить"
            - "tener sueño — хотеть спать"
            - "tener frío — мёрзнуть"
            - "tener calor — быть жарко"
      - learn: [tener fiebre, tener miedo, el resfriado, el niño / la niña]
      - match:
          title: Соедините пары
          pairs:
            - "tener fiebre — температурить"
            - "tener miedo — бояться"
            - "el resfriado — простуда"
            - "el niño — ребёнок"
      - rule:
          id: mucha_hambre
          text: "После **tener** — существительное, поэтому «очень» — **mucho/mucha**, а не muy: _Tengo **mucho** frío._ **hambre, sed, fiebre** женского рода: _Tengo **mucha** hambre._ Чего боитесь — **tener miedo de**: _Tengo miedo de los gatos._"
      - write:
          title: Traduce
          format: фраза по-испански
          skill: tener_states
          items:
            - q: "Я очень хочу есть."
              a: "Tengo mucha hambre | (Yo) tengo mucha hambre"
              mistakes: {"tengo mucho hambre": "hambre — женского рода: **mucha** hambre.", "tengo muy hambre": "После tener — существительное, поэтому **mucha**: tengo mucha hambre."}
            - q: "Мне очень холодно."
              a: "Tengo mucho frío | (Yo) tengo mucho frío"
              mistakes: {"tengo muy frío": "После tener — существительное, поэтому **mucho**: tengo mucho frío."}
            - q: "Он боится собак."
              a: "Tiene miedo de los perros | (Él) tiene miedo de los perros"
              mistakes: {"tiene miedo los perros": "Чего боятся — через **de**: tiene miedo de los perros."}
      - note:
          id: hace_tengo
          text: "Погода — **hace frío**: _En invierno hace frío._ Холодно лично вам — **tengo frío**: _Ana tiene frío._"
      - choose:
          title: Выберите
          skill: tener_states
          items:
            - q: "En invierno ___ mucho frío."
              options: "hace | tengo | es"
            - q: "Los niños ___ calor."
              options: "tienen | hacen | están"
      - choose:
          title: Послушайте и выберите
          skill: tener_states
          items:
            - say: "Tengo hambre."
              options: "Я хочу есть. | Я хочу пить. | Мне холодно."
              noaudio: {q: "Что значит «Tengo hambre.»?", options: "Я хочу есть. | Я хочу пить. | Мне холодно."}
            - say: "Tenemos mucho calor."
              options: "Нам очень жарко. | Нам очень холодно. | Им очень жарко."
              noaudio: {q: "Что значит «Tenemos mucho calor.»?", options: "Нам очень жарко. | Нам очень холодно. | Им очень жарко."}

  - id: medico
    kind: dialogue
    title: У врача
    goal: объяснить врачу, что болит, и понять его совет
    version: 2
    vocab:
      - "🩺 ¿Qué le pasa? [кэ лэ па́са] — что с вами? (вежливо)"
      - "📅 ¿Desde cuándo? [дэ́сдэ куа́ндо] — с каких пор? :: Desde el lunes. — С понедельника."
      - "💊 la pastilla [пасти́йя] — таблетка"
      - "💊 tome [то́мэ] — примите (вежливо) :: Tome una pastilla. — Примите таблетку."
      - "📄 la receta [рэθэ́та] — рецепт"
      - "🍀 ¡Que te mejores! / ¡Que se mejore! [кэ тэ мэхо́рэс, кэ сэ мэхо́рэ] — выздоравливай! / выздоравливайте!"
    blocks:
      - learn: ["¿Qué le pasa?", "¿Desde cuándo?"]
      - choose:
          title: Что ответить?
          skill: doctor
          items:
            - lines: ["Médica: ¿Desde cuándo?"]
              options: "Desde el lunes. | El lunes que viene. | A las nueve."
      - learn: [la pastilla, tome, la receta, ¡Que te mejores! / ¡Que se mejore!]
      - "Серхио заболел и пришёл к врачу."
      - dialogue:
          id: sergio
          lines:
            - "Médica: Buenos días. ¿Qué le pasa? | Добрый день. Что с вами?"
            - "Sergio: Me duele mucho la garganta y tengo fiebre. | У меня сильно болит горло и температура."
            - "Médica: ¿Desde cuándo? | С какого времени?"
            - "Sergio: Desde el lunes. Y estoy muy cansado. | С понедельника. И я очень устал."
            - "Médica: ¿Le duele la cabeza? | Голова болит?"
            - "Sergio: Sí, un poco. | Да, немного."
            - "Médica: Es un resfriado. Tome estas pastillas tres veces al día. | Это простуда. Принимайте эти таблетки три раза в день."
            - "Sergio: ¿Puedo ir a trabajar? | Мне можно ходить на работу?"
            - "Médica: No, tiene que descansar dos o tres días y beber mucha agua. Aquí tiene la receta. | Нет, нужно отдохнуть два-три дня и пить много воды. Вот рецепт."
            - "Sergio: Muchas gracias. | Большое спасибо."
            - "Médica: De nada. ¡Que se mejore! | Не за что. Выздоравливайте!"
      - more:
          title: tres veces al día
          text: "**vez** — «раз»: _una vez_, _dos veces_ (`z` → `c`, как lápiz — lápices). _tres veces al día_ — «три раза в день», _dos veces a la semana_ — «два раза в неделю»."
      - choose:
          title: Responde
          source: sergio
          rule: none
          items:
            - q: "¿Qué le duele a Sergio?"
              options: "La garganta y un poco la cabeza. | El estómago. | La espalda y las piernas."
            - q: "¿Puede ir a trabajar?"
              options: "No, tiene que descansar. | Sí, pero tiene que tomar pastillas. | Sí, el lunes."
      - mission:
          id: consulta
          title: На приёме
          text: "С понедельника у вас болит горло и температура. Вы у врача."
      - culture: "Испанскую аптеку легко найти по светящемуся **зелёному кресту**. Многие лекарства продают только по рецепту — **la receta**."
      - choose:
          source: consulta
          skill: [doctor, doler]
          items:
            - lines: ["Médica: Buenos días. ¿Qué le pasa?"]
              options: "Me duele la garganta y tengo fiebre. | Me duelen la garganta y estoy fiebre. | Tengo duele la garganta."
      - write:
          source: consulta
          skill: doctor
          items:
            - q: "Médica: ¿Desde cuándo?"
              a: "Desde el lunes"
              format: ответ по-испански
      - choose:
          source: consulta
          skill: doctor
          items:
            - say: "Tome una pastilla tres veces al día."
              q: "Как принимать таблетки?"
              options: "по одной три раза в день | по три один раз в день | одну в день"
              noaudio: {q: "Как принимать таблетки: «Tome una pastilla tres veces al día»?", options: "по одной три раза в день | по три один раз в день | одну в день"}
            - lines: ["Médica: Aquí tiene la receta. ¡Que se mejore!"]
              options: "Muchas gracias. | ¡Que te mejores! | De nada."
    forms: [vez]

  - id: quiz
    kind: quiz
    title: Здоровье
    goal: назвать части тела, сказать, что болит, описать самочувствие и объясниться у врача
    version: 3
    check: soft
    blocks:
      - "Это тест по теме «Здоровье»."
      - cando:
          - "назвать части тела"
          - "сказать, что болит: me duele, me duelen"
          - "описать самочувствие: tengo hambre, frío, fiebre"
          - "объясниться у врача"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la cabeza — голова"
            - "la espalda — спина"
            - "tener sueño — хотеть спать"
            - "la pastilla — таблетка"
            - "el niño — ребёнок"
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          items:
            - q: "Скажите врачу: «У меня болит горло и температура»"
              a: "Me duele la garganta y tengo fiebre | (A mí) me duele la garganta y tengo fiebre | Tengo fiebre y me duele la garganta"
              skill: doler
              mistakes: {"me duelo la garganta y tengo fiebre": "Болит горло — **me duele** la garganta."}
            - q: "Скажите: «Я хочу пить»"
              a: "Tengo sed | (Yo) tengo sed | Tengo mucha sed"
              skill: tener_states
              mistakes: {"quiero beber": "«Хочу пить» говорят через tener: **tengo sed**."}
    quiz:
      - q: "Me ___ los pies."
        options: "duelen | duele | duelo"
        explain: "Слово pies стоит во множественном числе, поэтому нужна форма duelen: me duelen los pies, но me duele la cabeza."
        skill: doler
      - q: Как сказать «Я хочу пить»?
        options: "Tengo sed. | Estoy sed. | Quiero sed."
        explain: "О самочувствии испанцы говорят с глаголом tener: tengo sed, tengo hambre, tengo sueño."
        skill: tener_states
      - q: "___ mano (артикль)"
        options: "la | el"
        answer: 0
        explain: "Слово mano женского рода, хотя оно заканчивается на -o, поэтому правильно говорить la mano и las manos."
        skill: body
      - q: Как сказать «У меня болит голова»?
        options: "Me duele la cabeza. | Me duele mi cabeza. | Tengo duele la cabeza."
        explain: "С частями тела испанцы ставят артикль, а не слово mi, поэтому правильно говорить me duele la cabeza."
        skill: doler
      - q: "Hoy ___ mucho frío y yo ___ frío."
        options: "hace / tengo | tengo / hace | es / estoy"
        explain: "Когда холодно на улице, говорят hace frío, а когда холодно лично вам, говорят tengo frío."
        skill: tener_states

  - id: repaso
    kind: review
    title: Повторение
