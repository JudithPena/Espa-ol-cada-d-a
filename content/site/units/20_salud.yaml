      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la chaqueta — куртка"
            - "barato — дешёвый"
            - "el invierno — зима"
            - "la semana que viene — на следующей неделе"
            - "la garganta — горло"
      - choose:
