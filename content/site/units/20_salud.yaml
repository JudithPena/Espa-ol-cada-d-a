id: salud
number: 20
level: A1
title: Здоровье
goals:
  - назвать части тела
  - сказать, что болит, и описать самочувствие
  - объясниться у врача и в аптеке

lessons:
  - id: cuerpo
    kind: vocab
    title: Тело
    goal: назвать части тела
    vocab:
      - "🧍 el cuerpo [куэ́рпо] — тело"
      - "🗣 la cabeza [кабэ́θа] — голова"
      - "💪 el brazo [бра́θо] — рука (вся)"
      - "✋ la mano [ма́но] — кисть руки, рука"
      - "🦵 la pierna [пьэ́рна] — нога"
      - "🦶 el pie [пьэ] — ступня, нога (ниже щиколотки)"
      - "🔙 la espalda [эспа́льда] — спина"
      - "🫃 el estómago [эсто́маго] — желудок, живот"
    blocks:
      - "Показывайте на себе каждую часть тела и называйте её вслух — так слова запоминаются гораздо быстрее."
      - learn: [el cuerpo, la cabeza, el brazo, la mano]
      - rule: "**la mano** женского рода, хотя кончается на `-o`: _la mano derecha_, _las manos pequeñas_. Обратный случай вы знаете: _el día_, _el mapa_."
      - choose:
          title: El или la?
          items:
            - q: "___ mano"
              options: "la | el"
      - learn: [la pierna, el pie, la espalda, el estómago]
      - match:
          title: Соедините пары
          pairs:
            - "la cabeza — голова"
            - "el brazo — рука (вся)"
            - "la pierna — нога"
            - "la espalda — спина"
            - "el estómago — живот"
      - write:
          title: Traduce
          format: по-испански
          items:
            - "две руки и две ноги (ступни) => dos manos y dos pies"
            - "Я мою руки. => Me lavo las manos"

  - id: doler
    kind: grammar
    title: Me duele la cabeza
    goal: сказать, что болит
    vocab:
      - "🤕 doler [долэ́р] — болеть :: Me duele la cabeza. — У меня болит голова."
      - "❓ ¿Qué te duele? [кэ тэ дуэ́лэ] — что у тебя болит?"
      - "🗣 la garganta [гарга́нта] — горло"
      - "🦷 la muela [муэ́ла] — коренной зуб :: Me duelen las muelas. — У меня болят зубы."
    blocks:
      - "**doler** («болеть») устроен как **gustar**: _me gusta_ — одно, _me gustan_ — много. Так и здесь."
      - learn: [doler, "¿Qué te duele?"]
      - compare:
          cards:
            - head: me duele
              label: болит одно
              tone: blue
              ex: ["Me duele la cabeza.", "¿Te duele la espalda?"]
            - head: me duelen
              label: болит несколько
              tone: rose
              ex: ["Me duelen los pies.", "Le duelen las piernas."]
          note: "У кого болит — **me, te, le, nos, os, les**. Человека называют с **a**, а **le** остаётся: _A Carlos le duele la cabeza._"
      - write:
          title: "¿Duele o duelen?"
          format: duele или duelen
          items:
            - "Me ___ el estómago. => duele"
            - "Me ___ las piernas. => duelen"
            - "¿Te ___ la cabeza? => duele"
            - "A Ana le ___ los ojos. => duelen"
      - learn: [la garganta, la muela]
      - rule: "С частями тела ставят артикль, а не «мой»: _Me duele **la** cabeza_, а не `Me duele mi cabeza`. _Me lavo **las** manos._"
      - choose:
          title: Как сказать?
          items:
            - q: "У меня болит горло."
              options: "Me duele la garganta. | Me duele mi garganta. | Tengo duele la garganta."
            - q: "A mi madre ___ duelen las piernas."
              options: "le | la | me"
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "У меня болят зубы. => Me duelen las muelas"
            - "У него болит спина. => Le duele la espalda | A él le duele la espalda"

  - id: tener
    kind: grammar
    title: "Tengo hambre, tengo frío"
    goal: описать самочувствие — хочу есть, мне холодно, температура
    vocab:
      - "🍽 tener hambre [тэнэ́р а́мбрэ] — хотеть есть"
      - "🥤 tener sed [тэнэ́р сэд] — хотеть пить"
      - "😴 tener sueño [тэнэ́р суэ́ньо] — хотеть спать"
      - "🥶 tener frío / tener calor [фри́о, кало́р] — мёрзнуть / быть жарко"
      - "🤒 tener fiebre [тэнэ́р фьэ́брэ] — температурить"
      - "😱 tener miedo [тэнэ́р мьэ́до] — бояться"
      - "🤧 el resfriado [рэсфрья́до] — простуда"
      - "🧒 el niño / la niña [ни́ньо, ни́нья] — ребёнок; мальчик / девочка"
    blocks:
      - "По-русски «мне холодно», «я хочу есть», а испанцы говорят «я **имею** холод», «я **имею** голод»."
      - learn: [tener hambre, tener sed, tener sueño, tener frío / tener calor]
      - choose:
          title: Что вы скажете?
          items:
            - q: "Вы весь день на жаре без воды."
              options: "Tengo sed. | Estoy sed. | Quiero sed."
            - q: "Уже час ночи, глаза закрываются."
              options: "Tengo sueño. | Tengo hambre. | Estoy sueño."
      - learn: [tener fiebre, tener miedo, el resfriado, el niño / la niña]
      - rule: "После **tener** — существительное, поэтому «очень» — **mucho/mucha**, а не muy: _Tengo **mucho** frío._ **hambre, sed, fiebre** женского рода: _Tengo **mucha** hambre._ Чего боитесь — **tener miedo de**: _Tengo miedo de los gatos._"
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "Я очень хочу есть. => Tengo mucha hambre"
            - "Мне очень холодно. => Tengo mucho frío"
            - "Он боится собак. => Tiene miedo de los perros"
      - note: "Погода — **hace frío**: _En invierno hace frío._ Холодно лично вам — **tengo frío**: _Ana tiene frío._"
      - choose:
          title: Выберите
          items:
            - q: "En invierno ___ mucho frío."
              options: "hace | tengo | es"
            - q: "Los niños ___ calor."
              options: "tienen | hacen | están"

  - id: medico
    kind: dialogue
    title: У врача
    goal: объяснить врачу, что болит, и понять его совет
    vocab:
      - "🩺 ¿Qué le pasa? [кэ лэ па́са] — что с вами? (вежливо)"
      - "📅 ¿Desde cuándo? [дэ́сдэ куа́ндо] — с каких пор? :: Desde el lunes. — С понедельника."
      - "💊 la pastilla [пасти́йя] — таблетка"
      - "💊 tome [то́мэ] — примите (вежливо) :: Tome una pastilla. — Примите таблетку."
      - "📄 la receta [рэθэ́та] — рецепт"
      - "🍀 ¡Que te mejores! / ¡Que se mejore! [кэ тэ мэхо́рэс, кэ сэ мэхо́рэ] — выздоравливай! / выздоравливайте!"
    blocks:
      - "Серхио заболел и пришёл к врачу. Такой разговор может пригодиться в поездке."
      - learn: ["¿Qué le pasa?", "¿Desde cuándo?"]
      - choose:
          title: Что ответить?
          items:
            - lines: ["Médica: ¿Desde cuándo?"]
              options: "Desde el lunes. | El lunes que viene. | A las nueve."
      - learn: [la pastilla, tome, la receta, ¡Que te mejores! / ¡Que se mejore!]
      - dialogue:
          lines:
            - "Médica: Buenos días. ¿Qué le pasa? | Добрый день. Что с вами?"
            - "Sergio: Me duele mucho la garganta y tengo fiebre. | У меня сильно болит горло и температура."
            - "Médica: ¿Desde cuándo? | С какого времени?"
            - "Sergio: Desde el lunes. Y estoy muy cansado. | С понедельника. И я очень устал."
            - "Médica: ¿Le duele la cabeza? | Голова болит?"
            - "Sergio: Sí, un poco. | Да, немного."
            - "Médica: Es un resfriado. Tome estas pastillas tres veces al día. | Это простуда. Принимайте эти таблетки три раза в день."
            - "Sergio: ¿Puedo ir a trabajar? | Мне можно ходить на работу?"
            - "Médica: No, tiene que descansar dos o tres días y beber mucha agua. Aquí tiene la receta. | Нет, нужно отдохнуть два-три дня и пить много воды. Вот рецепт."
            - "Sergio: Muchas gracias. | Большое спасибо."
            - "Médica: De nada. ¡Que se mejore! | Не за что. Выздоравливайте!"
      - more:
          title: tres veces al día
          text: "**vez** — «раз»: _una vez_, _dos veces_ (`z` → `c`, как lápiz — lápices). _tres veces al día_ — «три раза в день», _dos veces a la semana_ — «два раза в неделю»."
      - culture: "Испанскую аптеку легко найти по светящемуся **зелёному кресту**. Многие лекарства продают только по рецепту — **la receta**."
      - choose:
          title: Responde
          items:
            - q: "¿Qué le duele a Sergio?"
              options: "La garganta y un poco la cabeza. | El estómago. | La espalda y las piernas."
            - q: "¿Puede ir a trabajar?"
              options: "No, tiene que descansar. | Sí, pero tiene que tomar pastillas. | Sí, el lunes."
      - mission:
          title: На приёме
          text: "С понедельника у вас болит горло и температура. Вы у врача."
      - choose:
          items:
            - lines: ["Médica: Buenos días. ¿Qué le pasa?"]
              options: "Me duele la garganta y tengo fiebre. | Me duelen la garganta y estoy fiebre. | Tengo duele la garganta."
      - write:
          items:
            - q: "Médica: ¿Desde cuándo?"
              a: "Desde el lunes"
              format: ответ по-испански
      - choose:
          items:
            - say: "Tome una pastilla tres veces al día."
              q: "Как принимать таблетки?"
              options: "по одной три раза в день | по три один раз в день | одну в день"
            - lines: ["Médica: Aquí tiene la receta. ¡Que se mejore!"]
              options: "Muchas gracias. | ¡Que te mejores! | De nada."
    forms: [vez]

  - id: quiz
    kind: quiz
    title: Здоровье
    blocks:
      - "Пришло время проверить себя: это тест по теме «Здоровье»."
      - cando:
          - "назвать части тела"
          - "сказать, что болит: me duele, me duelen"
          - "описать самочувствие: tengo hambre, frío, fiebre"
          - "объясниться у врача"
    quiz:
      - q: "Me ___ los pies."
        options: "duelen | duele | duelo"
        explain: "Слово pies стоит во множественном числе, поэтому нужна форма duelen: me duelen los pies, но me duele la cabeza."
      - q: Как сказать «Я хочу пить»?
        options: "Tengo sed. | Estoy sed. | Quiero sed."
        explain: "О самочувствии испанцы говорят с глаголом tener: tengo sed, tengo hambre, tengo sueño."
      - q: "___ mano (артикль)"
        options: "la | el"
        answer: 0
        explain: "Слово mano женского рода, хотя оно заканчивается на -o, поэтому правильно говорить la mano и las manos."
      - q: Как сказать «У меня болит голова»?
        options: "Me duele la cabeza. | Me duele mi cabeza. | Tengo duele la cabeza."
        explain: "С частями тела испанцы ставят артикль, а не слово mi, поэтому правильно говорить me duele la cabeza."
      - q: "Hoy ___ mucho frío y yo ___ frío."
        options: "hace / tengo | tengo / hace | es / estoy"
        explain: "Когда холодно на улице, говорят hace frío, а когда холодно лично вам, говорят tengo frío."

  - id: repaso
    kind: review
    title: Повторение
    goal: проверить себя по темам 17–20 — покупки, погода, планы, здоровье
    blocks:
      - "Перед последними темами курса — пауза: задания по темам 17–20."
      - match:
          title: Соедините пары
          pairs:
            - "la chaqueta — куртка"
            - "barato — дешёвый"
            - "el invierno — зима"
            - "la semana que viene — на следующей неделе"
            - "la garganta — горло"
      - choose:
          title: Выберите
          items:
            - q: "¿Cuánto ___ estos zapatos?"
              options: "cuestan | cuesta | costan"
            - say: "Mañana va a llover y hace mucho frío."
              options: "Завтра будет дождь, и очень холодно. | Завтра будет снег, и очень жарко. | Сегодня дождь, а завтра холодно."
            - lines: ["Diego: ¿Vamos a la playa el sábado?"]
              q: "Вы не можете: нужно работать."
              options: "Lo siento, no puedo. Tengo que trabajar. | ¡Genial! Tengo que trabajar. | Hay que trabajar, ¡perfecto!"
      - write:
          title: Напишите по-испански
          format: фраза по-испански
          items:
            - "У меня болит голова. => Me duele la cabeza"
            - "Мой день рождения — двадцатого мая. => Mi cumpleaños es el veinte de mayo"
      - build:
          title: Соберите фразу
          items:
            - es: "Esta camiseta me queda muy bien."
              ru: "Эта футболка (у меня в руках) мне очень идёт."
              extra: [este]
