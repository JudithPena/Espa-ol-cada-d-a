              a: "Mi cumpleaños es el veinte de mayo"
              skill: dates
              mistakes: {"mi cumpleaños es en veinte de mayo": "С числом — **el**: el veinte de mayo; en — только с месяцем."}
      - build:
          title: Соберите фразу
          rule: none
          skill: [demonstratives, shopping]
          items:
            - es: "Esta camiseta me queda muy bien."
              ru: "Эта футболка (у меня в руках) мне очень идёт."
              extra: [este]
      - review:
          title: Повторим то, что пора
          skills: [clothes, big_numbers, demonstratives, prices, shopping, weather, seasons, dates, muy_mucho, future_time, ir_a_inf, personal_a, tener_que, invite]
          n: 3
