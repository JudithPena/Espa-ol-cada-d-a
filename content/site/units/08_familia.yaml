id: familia
number: 8
level: A0
title: Семья
goals:
  - рассказать о своей семье
  - говорить «мой», «твой», «наш»
  - спросить, есть ли у человека братья, сёстры, дети

lessons:
  - id: vocab1
    kind: vocab
    title: Моя семья
    goal: назвать родственников и сказать, кто у вас есть
    vocab:
      - "👨‍👩‍👧 la familia [фами́лья] — семья"
      - "👨 el padre [па́дрэ] — отец"
      - "👩 la madre [ма́дрэ] — мать"
      - "👦 el hermano / la hermana [эрма́но, эрма́на] — брат / сестра"
      - "👶 el hijo / la hija [и́хо, и́ха] — сын / дочь"
      - "👫 los padres [па́дрэс] — родители"
      - "❓ ¿Tienes hermanos? [тьэ́нэс эрма́нос] — у тебя есть братья и сёстры?"
      - "👴 el abuelo / la abuela [абуэ́ло, абуэ́ла] — дедушка / бабушка"
      - "🧔 el tío / la tía [ти́о, ти́а] — дядя / тётя"
      - "🧒 el primo / la prima [при́мо, при́ма] — двоюродный брат / сестра"
      - "💍 el marido [мари́до] — муж"
      - "👩 la mujer [мухэ́р] — жена; женщина"
      - "💑 el novio / la novia [но́бьо, но́бья] — парень / девушка (в паре); жених / невеста"
      - "🐱 el gato [га́то] — кот, кошка"
    blocks:
      - "О семье в испаноязычном мире говорят много и охотно — это одна из главных тем для разговора."
      - learn: [la familia, el padre, la madre, el hermano / la hermana, el hijo / la hija]
      - tip: "В слове **hijo** буква `h` не читается, как в **h**ola и **h**otel, а `j` читается как «х»: hi**j**o [и́хо], hi**j**a [и́ха]."
      - match:
          title: Соедините пары
          pairs:
            - "el padre — отец"
            - "la madre — мать"
            - "la hermana — сестра"
            - "el hijo — сын"
            - "la familia — семья"
      - learn: [los padres, "¿Tienes hermanos?"]
      - rule: |
          Если в группе есть и мужчины, и женщины, то всю группу называют словом мужского рода во множественном числе:
          1. **los padres** — «отец и мать», то есть «родители»: _Mis padres viven en Madrid._
          2. **los hermanos** — «братья», а также «брат и сестра»: _Tengo dos hermanos, Carlos y Marta._
          3. **los hijos** — «сыновья», а также «сын и дочь», «дети»: _Isabel tiene tres hijos: dos hijas y un hijo._
          Если в группе только женщины — женский род: _mis hermanas_, _las hijas de Ana_.
      - choose:
          title: Traduce
          items:
            - q: "Tengo dos hermanos, Carlos y Marta."
              options: "У меня брат и сестра, Карлос и Марта. | У меня два брата, Карлос и Марта. | У меня две сестры, Карлос и Марта."
              explain: "Marta — женщина, значит hermanos здесь «брат и сестра»."
            - q: "Los padres de Ana son médicos."
              options: "Родители Аны — врачи. | Отцы Аны — врачи. | Братья Аны — врачи."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "У меня есть брат. => Tengo un hermano"
            - "У тебя есть дети? => ¿Tienes hijos? | Tienes hijos"
      - learn: [el abuelo / la abuela, el tío / la tía, el primo / la prima]
      - write:
          title: "¿Quién es?"
          format: mi + слово
          items:
            - "el padre de mi padre => mi abuelo"
            - "la hermana de mi madre => mi tía"
            - "el hijo de mi tío => mi primo"
      - learn: [el marido, la mujer, el novio / la novia, el gato]
      - note: "**la mujer** — и «женщина», и «жена». О чьей-то семье — «жена»: _mi mujer_, _la mujer de Carlos_. В остальных случаях — «женщина»: _La mujer de la foto es mi madre._"
      - choose:
          title: Traduce
          items:
            - q: "La mujer de Carlos es médica."
              options: "Жена Карлоса — врач. | Мама Карлоса — врач. | Сестра Карлоса — врач."
            - q: "¿Tienes novia?"
              options: "У тебя есть девушка? | У тебя есть жена? | У тебя есть сестра?"
            - say: "Mi abuela tiene un gato."
              options: "У моей бабушки есть кот. | У моего дедушки есть кот. | У моей бабушки есть собака."

  - id: posesivos
    kind: grammar
    title: "Мой, твой, наш. Глагол tener"
    goal: сказать «мой, твой, наш» и «у нас есть»
    vocab:
      - "🏠 nuestro/a [нуэ́стро, нуэ́стра] — наш, наша"
      - "🏡 vuestro/a [буэ́стро, буэ́стра] — ваш, ваша (группе, неформально)"
    forms: [tus, sus]
    blocks:
      - "Посмотрите на пары. Что происходит со словами **mi, tu, su**, когда людей или предметов много?"
      - examples:
          items:
            - "mi hermano — mis hermanos — мой брат — мои братья"
            - "tu casa — tus casas — твой дом — твои дома"
            - "su hijo — sus hijos — его (её, ваш) сын — его (её, ваши) сыновья"
      - rule: "**mi, tu, su** по родам не меняются, но во множественном числе получают **-s**: _mi hermano, mi hermana_, но _mis hermanos_; _tu casa_, но _tus casas_."
      - write:
          title: Мой или мои?
          format: одно слово
          items:
            - "(yo) ___ hermanos => mis"
            - "(tú) ___ padres => tus"
            - "(yo) ___ familia => mi"
      - learn: [nuestro/a, vuestro/a]
      - rule: "**nuestro** и **vuestro** меняются и по роду, и по числу — у каждого четыре формы: _nuestro padre, nuestra madre, nuestros hijos, nuestras hijas_; _vuestro gato, vuestra casa, vuestros abuelos_."
      - choose:
          title: Выберите форму
          items:
            - q: "___ casa está en Sevilla. (наш)"
              options: "Nuestra | Nuestro | Nuestros"
              explain: "Casa женского рода — nuestra."
            - q: "___ abuelos viven en Málaga. (ваши, к друзьям)"
              options: "Vuestros | Vuestro | Vuestras"
      - write:
          title: Наш или ваш?
          format: одно слово
          items:
            - "(nosotros) ___ casa => nuestra"
            - "(vosotros) ___ perro => vuestro"
      - note: "**su** (и **sus**) — «его», «её», «их», а также «ваш» при **usted** и **ustedes**. Кого имеют в виду, понятно из контекста: _Ana y su marido_ — «Ана и её муж», _Señora López, ¿cómo se llama su hijo?_ — «как зовут вашего сына?»."
      - choose:
          title: Выберите слово
          items:
            - q: "Ana y ___ marido. (её)"
              options: "su | sus | tu"
      - header: "Глагол tener полностью"
      - conjugation:
          verb: tener
          ru: иметь
          highlight: false
          forms: [tengo, tienes, tiene, tenemos, tenéis, tienen]
      - examples:
          items:
            - "Tenemos un perro y dos gatos. — У нас собака и две кошки."
            - "¿Tenéis hijos? — У вас есть дети?"
      - write:
          title: Вставьте форму tener
          format: форма глагола
          items:
            - "Nosotros ___ dos hijos. => tenemos"
            - "¿Ellos ___ un gato? => tienen"
            - "¿Vosotros ___ hermanos? => tenéis"

  - id: lectura
    kind: reading
    title: La familia de Pablo
    goal: понять рассказ о семье и ответить на вопросы
    vocab:
      - "⬆️ mayor [майо́р] — старший; пожилой {pos: adj}"
      - "⬇️ pequeño/a [пэкэ́ньо, пэкэ́нья] — маленький; младший"
    blocks:
      - learn: [mayor, pequeño/a]
      - choose:
          title: Traduce
          items:
            - q: "Mi hermana mayor se llama Carmen."
              options: "Мою старшую сестру зовут Кармен. | Мою младшую сестру зовут Кармен. | Мою маленькую дочь зовут Кармен."
      - reading:
          title: Mi familia
          text: |
            Hola. Me llamo Pablo. Tengo diecisiete años y estudio en la escuela.

            Mi padre se llama Antonio. Es ingeniero y trabaja mucho. Mi madre se llama Isabel. Es profesora de inglés.

            Tengo una hermana y un hermano. Mi hermana mayor se llama Carmen. Tiene veinte años y estudia en la universidad. Mi hermano pequeño se llama Luis. Tiene doce años.

            Mis abuelos viven en Sevilla. Mi abuelo tiene un perro, Rufo. ¡Y nosotros tenemos un gato!

            Mi tía Elena vive en Argentina. Su marido es argentino. Tienen dos hijos: mis primos Diego y Sofía.
          translation: |
            Привет. Меня зовут Пабло. Мне семнадцать лет, я учусь в школе.

            Моего отца зовут Антонио. Он инженер и много работает. Маму зовут Исабель. Она преподаёт английский.

            У меня есть сестра и брат. Мою старшую сестру зовут Кармен. Ей двадцать лет, она учится в университете. Младшего брата зовут Луис. Ему двенадцать лет.

            Бабушка с дедушкой живут в Севилье. У дедушки есть собака Руфо. А у нас кот!

            Моя тётя Елена живёт в Аргентине. Её муж — аргентинец. У них двое детей — мои двоюродные брат и сестра Диего и София.
      - choose:
          title: Responde
          items:
            - q: "¿Qué es el padre de Pablo?"
              options: "Es ingeniero. | Es profesor. | Es médico."
            - q: "¿Dónde viven sus abuelos?"
              options: "En Sevilla. | En Argentina. | En Madrid."
            - q: "¿Diego y Sofía son hermanos de Pablo?"
              options: "No, son sus primos. | Sí, son sus hermanos. | No, son sus tíos."
            - q: "¿Cuántos años tiene Carmen?"
              options: "Tiene veinte años. | Tiene doce años. | Tiene diecisiete años."
    allow: [Rufo]
    quiz:
      - q: ¿Cuántos años tiene Luis?
        options: "doce | veinte | diecisiete"
      - q: ¿Quién tiene un perro?
        options: "el abuelo de Pablo | Pablo | la tía Elena"

  - id: dialogo
    kind: dialogue
    title: ¿Quién es?
    goal: показать семейное фото и рассказать, кто есть кто
    vocab:
      - "👀 mira [ми́ра] — смотри, посмотри"
    blocks:
      - "Лусия и Пабло смотрят семейные фотографии."
      - learn: [mira]
      - dialogue:
          lines:
            - "Pablo: Mira, Lucía: es mi familia. | Смотри, Лусия: это моя семья."
            - "Lucía: ¿Quién es? ¿Es tu padre? | Кто это? Твой отец?"
            - "Pablo: Sí, es mi padre, y ella es mi madre. | Да, это мой отец, а это мама."
            - "Lucía: ¿Y ella? ¿Es tu hermana? | А она? Твоя сестра?"
            - "Pablo: Sí, es Carmen. Tiene veinte años. | Да, это Кармен. Ей двадцать лет."
            - "Lucía: ¿Y el perro? | А собака?"
            - "Pablo: Es Rufo, el perro de mi abuelo. ¿Tienes hermanos, Lucía? | Это Руфо, собака моего дедушки. У тебя есть братья или сёстры, Лусия?"
            - "Lucía: No, no tengo hermanos. Pero tengo cuatro primos. | Нет. Но у меня четверо двоюродных."
            - "Pablo: ¿Y tienes novio? | А парень у тебя есть?"
            - "Lucía: ¡Pablo! | Пабло!"
      - choose:
          title: Responde
          items:
            - q: "¿Quién es Rufo?"
              options: "El perro del abuelo de Pablo. | El gato de Pablo. | El primo de Lucía."
            - q: "¿Lucía tiene hermanos?"
              options: "No, pero tiene cuatro primos. | Sí, tiene cuatro hermanos. | Sí, tiene una hermana."
      - note: "После **de** артикль **el** сливается с ним в одно слово **del**: _el perro del abuelo_, _la casa del profesor_. С **la** слияния нет: _la casa de la abuela_."
      - choose:
          title: del или de la?
          items:
            - q: "el perro ___ abuelo"
              options: "del | de el | de la"
              explain: "de + el всегда сливаются: del."
            - q: "la casa ___ abuela"
              options: "de la | del | de el"
      - choose:
          title: Что ответить?
          items:
            - lines: ["Lucía: ¿Tienes hermanos?"]
              q: "У вас есть сестра Марта."
              options: "Sí, tengo una hermana, Marta. | Sí, tienes una hermana, Marta. | Sí, es mi hermano Marta."
      - build:
          title: Соберите фразу
          items:
            - es: "Mira, es la casa de mi abuela."
              ru: "Смотри, это дом моей бабушки."
              extra: [del]
    allow: [Rufo]
    forms: [del]

  - id: escucha
    kind: listening
    title: Семья Ольги
    goal: понять на слух рассказ о семье
    blocks:
      - "Послушайте рассказ Ольги два раза. Текст спрятан: откройте его, когда ответите на вопросы."
      - dialogue:
          hidden: true
          lines:
            - "Olga: Hola, me llamo Olga. Soy ucraniana, de Odesa, pero vivo en Valencia. | Привет, меня зовут Ольга. Я украинка, из Одессы, но живу в Валенсии."
            - "Olga: Mi marido se llama Sergio. Es médico y trabaja en un hospital. | Моего мужа зовут Сергей. Он врач, работает в больнице."
            - "Olga: Tenemos dos hijos: Iván y Natalia. Iván tiene ocho años y Natalia tiene cinco. | У нас двое детей — Иван и Наталья. Ивану восемь лет, Наталье пять."
            - "Olga: Mis padres viven en Odesa. Mi madre es profesora y mi padre es ingeniero. | Мои родители живут в Одессы. Мама учительница, папа инженер."
      - choose:
          title: Responde
          items:
            - q: "¿Dónde vive Olga?"
              options: "En Valencia. | En Odesa. | En Kiev."
              explain: "Soy ucraniana, de Odesa, pero vivo en Valencia — родом из Одессы, а живёт в Валенсии."
            - q: "¿Qué es Sergio?"
              options: "Es médico. | Es ingeniero. | Es profesor."
    quiz:
      - q: ¿Cómo se llama el marido de Olga?
        options: "Sergio | Iván | Antonio"
      - q: ¿Cuántos hijos tienen Olga y Sergio?
        options: "dos | tres | uno"
      - q: ¿Cuántos años tiene Natalia?
        options: "cinco | ocho | quince"
      - q: ¿Dónde viven los padres de Olga?
        options: "En Odesa. | En Valencia. | En Kiev."

  - id: quiz
    kind: quiz
    title: Семья
    blocks:
      - "Сегодня у нас тест по теме «Семья»."
      - cando:
          - "назвать членов семьи"
          - "сказать «мой, твой, его, наш, ваш»: mi, tu, su, nuestro, vuestro"
          - "спросить ¿Tienes hermanos? и рассказать о своей семье"
    quiz:
      - q: Что значит «los padres»?
        options: "родители | отцы | братья"
        explain: "Мужской род во множественном числе называет всю группу, поэтому los padres обычно значит «отец и мать», то есть «родители»."
      - q: "___ abuelos viven en Sevilla. (мои)"
        options: "Mis | Mi | Nuestro"
        explain: "Слово abuelos стоит во множественном числе, поэтому «мои» тоже ставится во множественное число: mis abuelos."
      - q: "Nosotros ___ un gato."
        options: "tenemos | tienen | tengo"
        explain: "Для nosotros у глагола tener форма tenemos: Nosotros tenemos un gato."
      - q: Кто такая «la prima»?
        options: "двоюродная сестра | тётя | бабушка"
        explain: "La prima значит «двоюродная сестра». А «тётя» по-испански будет la tía, и «бабушка» будет la abuela."
      - q: "___ casa está en Sevilla. (наш)"
        options: "Nuestra | Nuestro | Nuestros"
        explain: "Слово casa женского рода, поэтому «наш» тоже ставится в женский род: nuestra casa."

  - id: repaso
    kind: review
    title: Итоги уровня A0
    goal: применить всё из A0 в четырёх жизненных ситуациях
    blocks:
      - "🎉 **Уровень A0 позади!** Прежде чем идти дальше, проверьте себя в четырёх ситуациях. Всё в них — из пройденных тем, нового нет."
      - mission:
          title: Новая коллега
          text: "Вы — Пабло, инженер из Мадрида. В офис пришла новая коллега. Познакомьтесь с ней."
      - choose:
          items:
            - lines: ["Ana: ¡Buenos días! Me llamo Ana. ¿Y tú?"]
              options: "Me llamo Pablo. Encantado. | Me llamo Pablo. Encantada. | Se llama Pablo. De nada."
              explain: "Пабло — мужчина: encantado."
            - lines: ["Ana: ¿De dónde eres?"]
              options: "Soy de Madrid. ¿Y tú? | Es de Madrid. ¿Y tú? | Soy Madrid. ¿Y tú?"
            - lines: ["Ana: ¿A qué te dedicas?"]
              options: "Soy ingeniero. | Soy un ingeniero. | Es ingeniero."
      - mission:
          title: Фото на телефоне
          text: "Ана показывает вам фото своей семьи и спрашивает о вашей. У вас есть сестра Марта, ей пятнадцать лет."
      - choose:
          items:
            - say: "Mira, es mi familia: mi padre, mi madre y mis dos hermanos."
              q: "Кто на фото у Аны?"
              options: "отец, мать и двое братьев (или брат и сестра) | отец, мать и две сестры | дедушка, бабушка и двое детей"
            - lines: ["Ana: ¿Tienes hermanos?"]
              options: "Sí, tengo una hermana. | Sí, tienes una hermana. | Sí, tengo un hermana."
      - write:
          items:
            - q: "Ana: ¿Cuántos años tiene tu hermana? — Ответьте: «Ей пятнадцать лет»."
              a: "Tiene quince años | Mi hermana tiene quince años"
              format: фраза по-испански
      - mission:
          title: Что в рюкзаке?
          text: "Вы помогаете Ане найти ключи. Ответьте ей."
      - choose:
          items:
            - lines: ["Ana: ¿Qué hay en la mesa?"]
              q: "На столе книга и два мобильных."
              options: "Hay un libro y dos móviles. | Es un libro y dos móviles. | Hay el libro y los móviles."
      - write:
          items:
            - q: "Ana: ¿Y en la mochila? — Скажите: «В рюкзаке — ключи»."
              a: "En la mochila hay unas llaves | Hay unas llaves | En la mochila hay llaves | Hay llaves en la mochila | Hay unas llaves en la mochila"
              format: фраза по-испански
      - mission:
          title: Номер телефона
          text: "Ана диктует свой номер. Запишите его, а потом назовите свой."
      - write:
          items:
            - say: "seis, cuatro, ocho, dos, cero, siete, uno, nueve, tres"
              q: "Запишите номер Аны цифрами."
              a: "648207193 | 648 207 193 | 6 4 8 2 0 7 1 9 3"
              format: цифры
      - build:
          items:
            - es: "Mi número es seis, cinco, cero, uno, dos."
              ru: "Продиктуйте: «Мой номер — шесть, пять, ноль, один, два…»"
              extra: [tu]
