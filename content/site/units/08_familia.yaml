id: familia
number: 8
level: A0
title: Семья
goals:
  - рассказать о своей семье
  - говорить «мой», «твой», «наш»
  - спросить, есть ли у человека братья, сёстры, дети

lessons:
  - id: vocab1
    kind: vocab
    title: Моя семья
    goal: назвать родственников и сказать, кто у вас есть
    version: 3
    vocab:
      - "👨‍👩‍👧 la familia [фами́лья] — семья"
      - "👨 el padre [па́дрэ] — отец"
      - "👩 la madre [ма́дрэ] — мать"
      - "👦 el hermano / la hermana [эрма́но, эрма́на] — брат / сестра"
      - "👶 el hijo / la hija [и́хо, и́ха] — сын / дочь"
      - "👫 los padres [па́дрэс] — родители"
      - "❓ ¿Tienes hermanos? [тьэ́нэс эрма́нос] — у тебя есть братья и сёстры?"
      - "👴 el abuelo / la abuela [абуэ́ло, абуэ́ла] — дедушка / бабушка"
    blocks:
      - "О семье в испаноязычном мире говорят много и охотно — это одна из главных тем для разговора."
      - learn: [la familia, el padre, la madre, el hermano / la hermana, el hijo / la hija]
      - tip: "В слове **hijo** буква `h` не читается, как в **h**ola и **h**otel, а `j` читается как «х»: hi**j**o [и́хо], hi**j**a [и́ха]."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "el padre — отец"
            - "la madre — мать"
            - "la hermana — сестра"
            - "el hijo — сын"
            - "la familia — семья"
      - learn: [los padres, "¿Tienes hermanos?"]
      - rule:
          id: group
          text: |
            Если в группе есть и мужчины, и женщины, то всю группу называют словом мужского рода во множественном числе:
            1. **los padres** — «отец и мать», то есть «родители»: _Mis padres viven en Madrid._
            2. **los hermanos** — «братья», а также «брат и сестра»: _Tengo dos hermanos, Carlos y Marta._
            3. **los hijos** — «сыновья», а также «сын и дочь», «дети»: _Isabel tiene tres hijos: dos hijas y un hijo._
            Если в группе только женщины — женский род: _mis hermanas_, _las hijas de Ana_.
      - choose:
          title: Traduce
          skill: family_plural
          items:
            - q: "Tengo dos hermanos, Carlos y Marta."
              options: "У меня брат и сестра, Карлос и Марта. | У меня два брата, Карлос и Марта. | У меня две сестры, Карлос и Марта."
              explain: "Marta — женщина, значит hermanos здесь «брат и сестра»."
            - lines: ["Ana: ¿Tienes hermanos?"]
              q: "У вас есть брат Карлос и сестра Марта."
              options: "Sí, tengo dos hermanos. | No, no tengo hermanos. | Sí, tengo dos hermanas."
              explain: "Брат и сестра вместе — hermanos: tengo dos hermanos."
            - q: "Los padres de Ana son médicos."
              options: "Родители Аны — врачи. | Отцы Аны — врачи. | Братья Аны — врачи."
      - write:
          title: Traduce
          format: фраза с tener по-испански
          rule: none
          skill: tener_have
          items:
            - q: "У меня есть брат."
              a: "Tengo un hermano | Yo tengo un hermano"
              mistakes: {"tengo una hermano": "Hermano — мужского рода: **un** hermano.", "tengo hermano": "Нужен артикль: tengo **un** hermano.", "hay un hermano": "«У меня есть» — **tengo**: Tengo un hermano. Hay говорят о предметах, которые где-то лежат."}
            - "У тебя есть дети? => ¿Tienes hijos? | Tienes hijos | ¿Tú tienes hijos?"
      - learn: [el abuelo / la abuela]
      - write:
          title: "¿Quién es?"
          format: mi + слово
          rule: none
          skill: family
          items:
            - "el padre de mi padre => mi abuelo"
            - "la madre de mi madre => mi abuela"
      - choose:
          title: Послушайте и выберите
          skill: family
          items:
            - say: "Mis padres viven en Madrid."
              options: "Мои родители живут в Мадриде. | Мой отец живёт в Мадриде. | Мои братья живут в Мадриде."
              noaudio: {q: "Что значит «Mis padres viven en Madrid.»?", options: "Мои родители живут в Мадриде. | Мой отец живёт в Мадриде. | Мои братья живут в Мадриде."}
            - say: "¿Tienes hijos?"
              options: "У тебя есть дети? | У тебя есть братья и сёстры? | У тебя есть родители?"
              noaudio: {q: "Что значит «¿Tienes hijos?»?", options: "У тебя есть дети? | У тебя есть братья и сёстры? | У тебя есть родители?"}

      - write:
          title: Напишите по-испански
          bank: true
          skill: family_plural
          items:
            - q: "Как сказать «родители»?"
              a: "los padres"
              format: слово с артиклем
            - q: "Скажите: «У меня есть брат и сестра» — одним словом «двое…»."
              a: "(Yo) tengo dos hermanos"
              format: фраза по-испански
              mistakes: {"tengo dos hermanas": "Брат и сестра вместе — мужской род: dos **hermanos**."}
            - q: "Как одним словом сказать «бабушка и дедушка»?"
              a: "los abuelos"
              format: слово с артиклем
      - choose:
          title: Выберите
          bank: true
          skill: family_plural
          items:
            - q: "Carlos y Marta son mis ___."
              options: "hermanos | hermanas | hermano"
              explain: "Брат и сестра вместе — мужской род, множественное число: hermanos."
      - write:
          title: Напишите по-испански
          bank: true
          skill: tener_have
          format: фраза по-испански
          items:
            - q: "Спросите: «У тебя есть дети?»"
              a: "¿Tienes hijos?"
            - q: "Скажите: «У меня есть сестра и два брата»."
              a: "(Yo) tengo una hermana y dos hermanos"
      - choose:
          title: Что ответить?
          bank: true
          skill: tener_have
          items:
            - lines: ["Ana: ¿Tienes hermanos?"]
              options: "No, no tengo hermanos. | No, no tienes hermanos. | No, no tiene hermanos."
              explain: "О себе — tengo."

  - id: posesivos
    kind: grammar
    title: "Ещё родные. Мой, твой, наш. Глагол tener"
    goal: назвать ещё родных и сказать «мой, твой, наш» и «у нас есть»
    version: 3
    vocab:
      - "🏠 nuestro/a [нуэ́стро, нуэ́стра] — наш, наша"
      - "🏡 vuestro/a [буэ́стро, буэ́стра] — ваш, ваша (группе, неформально)"
      - "🧔 el tío / la tía [ти́о, ти́а] — дядя / тётя"
      - "🧒 el primo / la prima [при́мо, при́ма] — двоюродный брат / сестра"
      - "💍 el marido [мари́до] — муж"
      - "👩 la mujer [мухэ́р] — жена; женщина"
      - "💑 el novio / la novia [но́бьо, но́бья] — парень / девушка (в паре); жених / невеста"
      - "🐱 el gato [га́то] — кот, кошка"
    forms: [tus, sus]
    blocks:
      - "Ещё несколько слов о семье."
      - learn: [el tío / la tía, el primo / la prima]
      - write:
          title: "¿Quién es?"
          format: mi + слово
          rule: none
          skill: family
          items:
            - "la hermana de mi madre => mi tía"
            - "el hijo de mi tío => mi primo"
      - learn: [el marido, la mujer, el novio / la novia, el gato]
      - note: "**la mujer** — и «женщина», и «жена». О чьей-то семье — «жена»: _mi mujer_, _la mujer de Carlos_. В остальных случаях — «женщина»: _La mujer de la foto es mi madre._"
      - choose:
          title: Traduce
          skill: family
          items:
            - q: "La mujer de Carlos es médica."
              options: "Жена Карлоса — врач. | Мама Карлоса — врач. | Сестра Карлоса — врач."
            - q: "Ana y su marido viven en Madrid."
              options: "Ана и её муж живут в Мадриде. | Ана и её брат живут в Мадриде. | Ана и её отец живут в Мадриде."
            - q: "¿Tienes novia?"
              options: "У тебя есть девушка? | У тебя есть жена? | У тебя есть сестра?"
            - say: "Mi abuela tiene un gato."
              options: "У моей бабушки есть кот. | У моего дедушки есть кот. | У моей бабушки есть собака."
              rule: none
              noaudio: {q: "Что значит «Mi abuela tiene un gato»?", options: "У моей бабушки есть кот. | У моего дедушки есть кот. | У моей бабушки есть собака."}
      - "Посмотрите на пары. Что происходит со словами **mi, tu, su**, когда людей или предметов много?"
      - examples:
          items:
            - "mi hermano — mis hermanos — мой брат — мои братья"
            - "tu casa — tus casas — твой дом — твои дома"
            - "su hijo — sus hijos — его (её, ваш) сын — его (её, ваши) сыновья"
      - rule:
          id: mis
          text: "**mi, tu, su** по родам не меняются, но во множественном числе получают **-s**: _mi hermano, mi hermana_, но _mis hermanos_; _tu casa_, но _tus casas_."
      - write:
          title: Мой или мои?
          format: одно слово
          skill: possessives
          items:
            - "(yo) ___ hermanos => mis"
            - "(tú) ___ padres => tus"
            - "(yo) ___ familia => mi"
      - learn: [nuestro/a, vuestro/a]
      - rule:
          id: nuestro
          text: "**nuestro** и **vuestro** меняются и по роду, и по числу — у каждого четыре формы: _nuestro padre, nuestra madre, nuestros hijos, nuestras hijas_; _vuestro gato, vuestra casa, vuestros abuelos_."
      - choose:
          title: Выберите форму
          skill: possessives
          items:
            - q: "___ casa está en Sevilla. (наш)"
              options: "Nuestra | Nuestro | Nuestros"
              explain: "Casa женского рода — nuestra."
            - q: "___ abuelos viven en Málaga. (ваши, к друзьям)"
              options: "Vuestros | Vuestro | Vuestras"
      - write:
          title: Наш или ваш?
          format: одно слово
          rule: nuestro
          skill: possessives
          items:
            - "(nosotros) ___ casa => nuestra"
            - "(vosotros) ___ perro => vuestro"
      - note: "**su** (и **sus**) — «его», «её», «их», а также «ваш» при **usted** и **ustedes**. Кого имеют в виду, понятно из контекста: _Ana y su marido_ — «Ана и её муж», _Señora López, ¿cómo se llama su hijo?_ — «как зовут вашего сына?»."
      - choose:
          title: Выберите слово
          skill: possessives
          items:
            - q: "Ana y ___ marido. (её)"
              options: "su | sus | tu"
      - header: "Глагол tener полностью"
      - conjugation:
          verb: tener
          ru: иметь
          highlight: false
          forms: [tengo, tienes, tiene, tenemos, tenéis, tienen]
      - examples:
          items:
            - "Tenemos un perro y dos gatos. — У нас собака и две кошки."
            - "¿Tenéis hijos? — У вас есть дети?"
      - write:
          title: Вставьте форму tener
          format: одна форма глагола tener
          skill: tener_forms
          items:
            - "Nosotros ___ dos hijos. => tenemos"
            - "¿Ellos ___ un gato? => tienen"
            - "¿Vosotros ___ hermanos? => tenéis"
      - choose:
          title: Послушайте и выберите
          skill: possessives
          items:
            - say: "Su marido es médico."
              options: "Её муж — врач. | Мой муж — врач. | Её брат — врач."
              noaudio: {q: "Что значит «Su marido es médico.»?", options: "Её муж — врач. | Мой муж — врач. | Её брат — врач."}

      - choose:
          title: Выберите
          bank: true
          skill: tener_forms
          items:
            - q: "Nosotros ___ dos gatos."
              options: "tenemos | tienen | tenéis"
              explain: "С nosotros — tenemos."
            - q: "¿Vosotros ___ hijos?"
              options: "tenéis | tienen | tenemos"
              explain: "С vosotros — tenéis."
      - write:
          title: Напишите по-испански
          bank: true
          skill: tener_forms
          items:
            - q: "Скажите: «У них есть собака»."
              a: "(Ellos) tienen un perro | (Ellas) tienen un perro"
              format: фраза по-испански

  - id: lectura
    kind: reading
    title: La familia de Álex
    goal: понять рассказ о семье и ответить на вопросы
    version: 3
    vocab:
      - "⬆️ mayor [майо́р] — старший; пожилой {pos: adj}"
      - "⬇️ pequeño/a [пэкэ́ньо, пэкэ́нья] — маленький; младший"
    blocks:
      - learn: [mayor, pequeño/a]
      - choose:
          title: Traduce
          skill: family
          items:
            - q: "Mi hermana mayor se llama Carmen."
              options: "Мою старшую сестру зовут Кармен. | Мою младшую сестру зовут Кармен. | Мою маленькую дочь зовут Кармен."
      - reading:
          id: pablo
          title: Mi familia
          text: |
            Hola. Me llamo Álex. Tengo diecisiete años y estudio en la escuela.

            Mi padre se llama Antonio. Es médico y trabaja mucho. Mi madre se llama Isabel. Es profesora de inglés.

            Tengo una hermana y un hermano. Mi hermana se llama Carmen. Tiene veinte años y estudia en la universidad. Mi hermano mayor se llama Pablo. Es ingeniero y trabaja en una oficina. Yo soy el pequeño de la familia.

            Mis abuelos viven en Sevilla. Mi abuelo tiene un perro, Rufo. ¡Y nosotros tenemos un gato!

            Mi tía Rosa vive en Argentina. Su marido es argentino. Tienen dos hijos: mis primos Luis y Sofía. Luis tiene trece años y Sofía, diez.
          translation: |
            Привет. Меня зовут Алекс. Мне семнадцать лет, я учусь в школе.

            Моего отца зовут Антонио. Он врач и много работает. Маму зовут Исабель. Она преподаёт английский.

            У меня есть сестра и брат. Сестру зовут Кармен. Ей двадцать лет, она учится в университете. Старшего брата зовут Пабло. Он инженер и работает в офисе. А я в семье младший.

            Бабушка с дедушкой живут в Севилье. У дедушки есть собака Руфо. А у нас кот!

            Моя тётя Роса живёт в Аргентине. Её муж — аргентинец. У них двое детей — мои двоюродные брат и сестра Луис и София. Луису тринадцать лет, а Софии — десять.
      - choose:
          title: Responde
          source: pablo
          items:
            - q: "¿Qué es el padre de Álex?"
              options: "Es médico. | Es ingeniero. | Es profesor."
              explain: "Mi padre se llama Antonio. Es médico. Ingeniero — его старший брат Пабло."
            - q: "¿Dónde viven sus abuelos?"
              options: "En Sevilla. | En Argentina. | En Madrid."
            - q: "¿Luis y Sofía son hermanos de Álex?"
              options: "No, son sus primos. | Sí, son sus hermanos. | No, son sus tíos."
              explain: "Tienen dos hijos: mis primos Luis y Sofía. — Луис и София — двоюродные брат и сестра Алекса."
              skill: family
            - q: "¿Quién es Pablo?"
              options: "El hermano mayor de Álex. | El hermano pequeño de Álex. | El primo de Álex."
              explain: "Mi hermano mayor se llama Pablo."
            - q: "¿Quién es el pequeño de la familia?"
              options: "Álex. | Pablo. | Carmen."
              explain: "Yo soy el pequeño de la familia. — говорит Алекс: ему семнадцать, Кармен двадцать, Пабло — старший брат."
              skill: family
            - q: "¿Cuántos años tiene Carmen?"
              options: "Tiene veinte años. | Tiene diecisiete años. | Tiene diez años."
      - choose:
          title: Послушайте и выберите
          free: true
          skill: family
          items:
            - say: "Mi hermano mayor se llama Pablo."
              options: "Моего старшего брата зовут Пабло. | Моего младшего брата зовут Пабло. | Моего двоюродного брата зовут Пабло."
              noaudio: {q: "Что значит «Mi hermano mayor se llama Pablo.»?", options: "Моего старшего брата зовут Пабло. | Моего младшего брата зовут Пабло. | Моего двоюродного брата зовут Пабло."}
            - say: "Mis abuelos viven en Sevilla."
              options: "Мои бабушка и дедушка живут в Севилье. | Мои родители живут в Севилье. | Мои дяди живут в Севилье."
              noaudio: {q: "Что значит «Mis abuelos viven en Sevilla.»?", options: "Мои бабушка и дедушка живут в Севилье. | Мои родители живут в Севилье. | Мои дяди живут в Севилье."}
    allow: [Rufo]
    quiz:
      - q: ¿Cuántos años tiene Álex?
        options: "diecisiete | veinte | doce"
        source: pablo
        skill: tener_age
      - q: ¿Quién tiene un perro?
        options: "el abuelo de Álex | Pablo | la tía Rosa"
        explain: "Mi abuelo tiene un perro, Rufo. ¡Y nosotros tenemos un gato!"
        source: pablo

  - id: dialogo
    kind: dialogue
    title: ¿Quién es?
    goal: показать семейное фото и рассказать, кто есть кто
    version: 3
    vocab:
      - "👀 mira [ми́ра] — смотри, посмотри"
    blocks:
      - learn: [mira]
      - "Лусия и Пабло смотрят семейные фотографии."
      - dialogue:
          id: photos
          lines:
            - "Pablo: Mira, Lucía: es mi familia. | Смотри, Лусия: это моя семья."
            - "Lucía: ¿Quién es? ¿Es tu padre? | Кто это? Твой отец?"
            - "Pablo: Sí, es mi padre, y ella es mi madre. | Да, это мой отец, а это мама."
            - "Lucía: ¿Y ella? ¿Es tu hermana? | А она? Твоя сестра?"
            - "Pablo: Sí, es Carmen. Tiene veinte años. | Да, это Кармен. Ей двадцать лет."
            - "Lucía: ¿Y el perro? | А собака?"
            - "Pablo: Es Rufo, el perro de mi abuelo. ¿Tienes hermanos, Lucía? | Это Руфо, собака моего дедушки. У тебя есть братья или сёстры, Лусия?"
            - "Lucía: No, no tengo hermanos. Pero tengo cuatro primos. | Нет. Но у меня четверо двоюродных."
            - "Pablo: ¿Y tienes novio? | А парень у тебя есть?"
            - "Lucía: ¡Pablo! | Пабло!"
      - choose:
          title: Responde
          source: photos
          items:
            - q: "¿Quién es Rufo?"
              options: "El perro de su abuelo. | El gato de Pablo. | El primo de Lucía."
            - q: "¿Lucía tiene hermanos?"
              options: "No, pero tiene cuatro primos. | Sí, tiene cuatro hermanos. | Sí, tiene una hermana."
              explain: "Lucía: No, no tengo hermanos. Pero tengo cuatro primos."
              skill: family
      - note:
          id: del
          text: "После **de** артикль **el** сливается с ним в одно слово **del**: _el perro del abuelo_, _la casa del profesor_. С **la** слияния нет: _la casa de la abuela_."
      - choose:
          title: del или de la?
          free: true
          skill: del
          items:
            - q: "el perro ___ abuelo"
              options: "del | de el | de la"
              explain: "de + el всегда сливаются: del."
            - q: "la casa ___ abuela"
              options: "de la | del | de el"
      - choose:
          title: Что ответить?
          free: true
          rule: none
          skill: tener_have
          items:
            - lines: ["Lucía: ¿Tienes hermanos?"]
              q: "У вас есть сестра Марта."
              options: "Sí, tengo una hermana, Marta. | Sí, tienes una hermana, Marta. | Sí, es mi hermano Marta."
      - choose:
          title: Послушайте и выберите
          free: true
          skill: family
          items:
            - say: "El perro de mi abuelo se llama Rufo."
              options: "Собаку моего дедушки зовут Руфо. | Кота моего дедушки зовут Руфо. | Моего дедушку зовут Руфо."
