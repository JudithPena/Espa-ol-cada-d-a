          title: Me llamo Beatriz
          text: |
            ¡Hola! Me llamo Beatriz. Soy de Valencia, pero vivo en Madrid. Soy profesora y trabajo en una escuela.

            Mi marido se llama Jorge. Él también es de Valencia. Es médico y trabaja en un hospital.

            Tenemos dos hijos: Inés y Mario. Inés tiene ocho años y Mario tiene cinco. Mis padres viven en Valencia.
