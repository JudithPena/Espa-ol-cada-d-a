        options: "Todavía vivo con mis padres. | Ya no vivo con mis padres. | Antes vivía con mis padres."
        explain: "И раньше, и сейчас — todavía."
        skill: ya_no_todavia

  - id: lectura
    kind: reading
    title: "Mi escuela"
    goal: понять рассказ о школе и написать о своей
    version: 2
    vocab:
      - "📚 la asignatura [асигнату́ра] — школьный предмет :: Mi asignatura favorita era la historia. — Моим любимым предметом была история."
      - "➗ las matemáticas [матэма́тикас] — математика :: Las matemáticas eran difíciles. — Математика была трудной."
      - "📏 estricto/a [эстри́кто, эстри́кта] — строгий, строгая :: La profesora era muy estricta. — Учительница была очень строгой."
      - "📝 los deberes [дэбэ́рэс] — домашнее задание (в школе) :: Hacía los deberes en la cocina. — Я делал уроки на кухне."
      - "🔔 el recreo [рэкрэ́о] — перемена :: En el recreo comíamos un bocadillo. — На перемене мы ели бутерброд."
      - "🏫 el patio [па́тьо] — школьный двор :: Jugábamos en el patio. — Мы играли во дворе."
    blocks:
      - learn: [la asignatura, las matemáticas, estricto/a, los deberes, el recreo, el patio]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la asignatura — школьный предмет"
            - "los deberes — домашнее задание"
            - "el recreo — перемена"
            - "el patio — школьный двор"
            - "estricto — строгий"
      - "Ольга вспоминает свою школу в Одессе."
      - reading:
          id: escuela
          title: Mi escuela
          text: |
            Cuando era pequeña, vivía en Odesa con mis padres, mi hermano y mi abuela. Mi escuela estaba muy cerca de casa, y por eso iba a pie con mi vecina Natalia. Las clases empezaban a las ocho y media.

            Mi asignatura favorita era la historia, pero las matemáticas no me gustaban nada. La profesora de matemáticas era muy estricta y nos ponía muchos deberes. En el recreo comíamos un bocadillo y jugábamos en el patio.

            Después de clase, comía con mi abuela y hacía los deberes en la cocina. Los fines de semana veía dibujos animados con mi hermano.

            Ahora vivo en Valencia y trabajo en un hospital. Ya no veo a Natalia, pero todavía hablamos por teléfono todas las semanas. ¡Y todavía me gusta la historia!
          translation: |
            Когда я была маленькой, я жила в Одессе с родителями, братом и бабушкой. Школа была совсем рядом с домом, поэтому я ходила туда пешком с соседкой Натальей. Уроки начинались в половине девятого.

            Моим любимым предметом была история, а математику я совсем не любила. Учительница математики была очень строгой и задавала нам много домашних заданий. На перемене мы ели бутерброды и играли во дворе.

            После уроков я обедала с бабушкой и делала уроки на кухне. По выходным смотрела с братом мультики.

            Сейчас я живу в Валенсии и работаю в больнице. С Натальей мы больше не видимся, но всё ещё каждую неделю говорим по телефону. И история мне всё ещё нравится!
      - choose:
          title: Что сказано в тексте?
          source: escuela
          items:
            - q: "¿Cómo iba Olga a la escuela?"
              options: "A pie, con su vecina. | En autobús, con su madre. | En bici, con su hermano."
              explain: "…iba a pie con mi vecina Natalia."
            - q: "¿Cómo era la profesora de matemáticas?"
              options: "Muy estricta. | Muy simpática. | Muy tímida."
              explain: "La profesora de matemáticas era muy estricta."
            - q: "¿Qué hacían en el recreo?"
              options: "Comían un bocadillo y jugaban en el patio. | Hacían los deberes de matemáticas en la cocina. | Veían dibujos animados con sus hermanos."
              explain: "En el recreo comíamos un bocadillo y jugábamos en el patio."
              skill: imperfecto_er_ir
            - q: "¿Qué hace Olga ahora?"
              options: "Trabaja en un hospital de Valencia. | Es profesora de historia en una escuela. | Vive con su abuela en Odesa."
              explain: "Ahora vivo en Valencia y trabajo en un hospital."
      - sort:
          title: Antes, todavía или ahora?
          source: escuela
          skill: ya_no_todavia
          groups:
            "antes": ["vivía en Odesa", "veía a Natalia"]
            "todavía": ["habla con Natalia por teléfono", "le gusta la historia"]
            "ahora": ["vive en Valencia", "trabaja en un hospital"]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: escuela
          items:
            - q: "¿Dónde hacía Olga los deberes?"
              a: "En la cocina | Los hacía en la cocina | Hacía los deberes en la cocina"
              explain: "…comía con mi abuela y hacía los deberes en la cocina."
            - q: "Как в тексте сказано «С Натальей я больше не вижусь»?"
              a: "Ya no veo a Natalia"
              explain: "Ya no veo a Natalia — «я больше не вижу Наталью»."
              skill: ya_no_todavia
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "Mi asignatura favorita era la historia."
              options: "Моим любимым предметом была история. | Мой любимый предмет — история. | Историю я никогда не любила."
              explain: "Era — «была»: речь о прошлом."
              skill: imperfecto_er_ir
              noaudio: {q: "Что значит «Mi asignatura favorita era la historia»?", options: "Моим любимым предметом была история. | Мой любимый предмет — история. | Историю я никогда не любила."}
      - compose:
          title: Моя школа
          free: true
          rule: none
          skill: [imperfecto_er_ir, imperfecto_ar]
          items:
            - q: "¿Cómo era tu escuela? Напишите 4–5 фраз: где она была и как вы туда ходили · какой предмет вы любили · каким был учитель · что вы делали на перемене."
              format: "Mi escuela estaba… Iba…"
              words: [25, 100]
              sentences: 3
              checks:
                - label: "где и как: estaba…, iba…"
                  any: [estaba, iba, íbamos]
