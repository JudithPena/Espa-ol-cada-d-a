                  any: [profesor, profesora, profesores, profesoras, recreo]
              sample: "Mi escuela estaba en el centro de Kiev y yo iba en autobús. Mi asignatura favorita era el inglés. El profesor de inglés era muy simpático, pero nos ponía muchos deberes. En el recreo jugábamos al fútbol en el patio."
              sample_ru: "Моя школа была в центре Киева, и я ездил туда на автобусе. Любимым предметом был английский. Учитель английского был очень приятным, но задавал нам много домашних заданий. На перемене мы играли во дворе в футбол."

