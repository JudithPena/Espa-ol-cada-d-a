id: de_pequeno
number: 30
level: A2
title: Cuando era pequeño — когда я был маленьким
goals:
  - рассказать, как вы жили и что обычно делали в детстве
  - описать себя и свою школу в прошлом
  - сравнить «раньше» и «сейчас» — ya no, todavía
  - отличать привычку в прошлом (jugaba) от разового события (jugué)

# Тема 7 карты A2: pretérito imperfecto — формы и привычка; antes / ahora; ya no, todavía; детство и школа.
# Imperfecto в описании и сравнения — тема 31; оба прошедших времени в одном рассказе — тема 32.
lessons:
  - id: infancia
    kind: listening
    title: "¿Cómo era tu vida?"
    goal: понять на слух рассказ о детстве
    version: 2
    # Карта экранов: docs/site_slide_maps/30_de_pequeno.md
    unlocks: [imperfect]
    vocab:
      - "🕰 cuando [куа́ндо] — когда (в рассказе, не в вопросе) :: Cuando era pequeño, vivía en un pueblo. — Когда я был маленьким, я жил в деревне."
      - "⏪ antes [а́нтэс] — раньше :: Antes la vida era más tranquila. — Раньше жизнь была спокойнее."
      - "🏘 el vecino / la vecina [бэθи́но, бэθи́на] — сосед, соседка :: Mis vecinos eran mis amigos. — Мои соседи были моими друзьями."
      - "📺 los dibujos animados [дибу́хос анима́дос] — мультфильмы :: Veía dibujos animados. — Я смотрел мультики."
      - "🧸 el juguete [хугэ́тэ] — игрушка :: No tenía muchos juguetes. — У меня было мало игрушек."
      - "😊 feliz [фэли́θ] — счастливый {forms: felices} :: Era un niño feliz. — Я был счастливым ребёнком."
    blocks:
      - "Ирина расспрашивает Диего о его детстве в Мексике. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: recuerdos
          hidden: true
          lines:
            - "Irina: Diego, ¿cómo era tu vida cuando eras pequeño? | Диего, какой была твоя жизнь, когда ты был маленьким?"
            - "Diego: Muy tranquila. Vivía en un pueblo de México con mis padres y mis abuelos. | Очень спокойной. Я жил в мексиканской деревне с родителями и бабушкой с дедушкой."
            - "Irina: ¿Tenías muchos amigos? | У тебя было много друзей?"
            - "Diego: Sí, todos mis vecinos eran mis amigos. Jugábamos al fútbol en la calle todas las tardes. | Да, все мои соседи были моими друзьями. Мы каждый вечер играли в футбол на улице."
            - "Irina: ¿Y veías mucho la tele? | А телевизор ты много смотрел?"
            - "Diego: No mucho. Solo los sábados por la mañana veía dibujos animados. | Не очень. Только по субботам утром смотрел мультики."
            - "Irina: ¿Tenías muchos juguetes? | У тебя было много игрушек?"
            - "Diego: No, pero tenía una bici roja. Iba a la escuela en bici. | Нет, но у меня был красный велосипед. Я ездил на нём в школу."
            - "Irina: ¿Eras feliz? | Ты был счастлив?"
            - "Diego: Sí, muy feliz. Antes la vida era más tranquila. | Да, очень. Раньше жизнь была спокойнее."
      - choose:
          title: Что вы поняли?
          source: recuerdos
          items:
            - q: "Где Диего жил в детстве?"
              options: "En un pueblo de México. | En la capital de México. | En Madrid."
              explain: "Diego называет un pueblo de México."
            - q: "С кем он жил?"
              options: "Con sus padres y sus abuelos. | Con sus tíos. | Con su hermano mayor."
              explain: "Diego: …con mis padres y mis abuelos."
      - learn: [cuando, antes, el vecino / la vecina, los dibujos animados, el juguete, feliz]
      - choose:
          title: Детали разговора
          source: recuerdos
          items:
            - q: "Кто были друзья Диего?"
              options: "Sus vecinos. | Sus primos. | Sus compañeros de trabajo."
              explain: "Diego: Todos mis vecinos eran mis amigos."
            - q: "Когда Диего смотрел мультики?"
              options: "Los sábados por la mañana. | Todas las tardes. | Los domingos por la noche."
              explain: "Diego: Solo los sábados por la mañana veía dibujos animados. Каждый вечер он играл в футбол."
            - q: "На чём он ездил в школу?"
              options: "En bici. | En autobús. | A pie."
              explain: "Diego: Tenía una bici roja. Iba a la escuela en bici."
            - q: "Какой, по словам Диего, была жизнь раньше?"
              options: "Más tranquila. | Más difícil. | Más aburrida."
              explain: "Diego: Antes la vida era más tranquila."
      - text:
          id: notice
          slide: new
          text: "Диего говорит не о разовых событиях, а о том, как всё было **обычно**: жил, играл каждый вечер, был счастлив. Для этого в испанском есть ещё одно прошедшее время."
      - examples:
          items:
            - "**Vivía** en un pueblo. — Я **жил** в деревне."
            - "**Jugábamos** al fútbol todas las tardes. — Мы **играли** в футбол каждый вечер."
            - "**Era** muy feliz. — Я **был** очень счастлив."
      - sort:
          title: Один раз или обычно?
          free: true
          skill: imperfecto_uso
          rule: notice
          groups:
            "один раз": ["Ayer jugué al fútbol.", "El sábado vi una película."]
            "обычно, раньше": ["De niño jugaba al fútbol.", "Los sábados veía dibujos animados."]
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "antes — раньше"
            - "el vecino — сосед"
            - "el juguete — игрушка"
            - "los dibujos animados — мультфильмы"
            - "feliz — счастливый"
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: imperfecto_uso
          rule: notice
          items:
            - say: "Cuando era pequeño, vivía en un pueblo."
              a: "Cuando era pequeño, vivía en un pueblo"
              explain: "Era — «я был», vivía — «я жил»."
              noaudio: {q: "Напишите по-испански: «Когда я был маленьким, я жил в деревне». Начните с Cuando era.", a: "Cuando era pequeño, vivía en un pueblo | Cuando era pequeña, vivía en un pueblo"}
      - choose:
          title: Что ответить?
          free: true
          skill: imperfecto_uso
          rule: notice
          items:
            - lines: ["Irina: ¿Eras feliz de niño?"]
              q: "Да, очень."
              options: "Sí, era muy feliz. | Sí, soy muy feliz de niño. | Sí, es muy feliz."
              explain: "О себе в детстве — era: «я был»."
            - say: "Antes vivía cerca del mar."
              options: "Раньше я жил рядом с морем. | Сейчас я живу рядом с морем. | Вчера я был на море."
              explain: "Antes — «раньше»; vivía — «жил» (долго, обычно)."
              noaudio: {q: "Что значит «Antes vivía cerca del mar»?", options: "Раньше я жил рядом с морем. | Сейчас я живу рядом с морем. | Вчера я был на море."}
      - build:
          title: Соберите фразу
          free: true
          skill: imperfecto_uso
          rule: notice
          items:
            - "Antes la vida era más tranquila. — Раньше жизнь была спокойнее."
            - es: "Cuando era pequeño, tenía una bici roja."
              ru: "Когда я был маленьким, у меня был красный велосипед."

  - id: verbos_ar
    kind: grammar
    title: "Jugaba, jugabas, jugaba: глаголы на -ar"
    goal: рассказать, что вы обычно делали в детстве, глаголами на -ar
    version: 2
    vocab:
      - "🖍 dibujar [дибуха́р] — рисовать :: De niña dibujaba mucho. — В детстве я много рисовала."
      - "⚽ la pelota [пэло́та] — мяч :: Jugábamos con una pelota. — Мы играли с мячом."
      - "🪆 la muñeca [мунье́ка] — кукла :: Mi hermana jugaba con muñecas. — Моя сестра играла в куклы."
      - "🚲 montar en bici [монта́р эн би́θи] — кататься на велосипеде {forms: monto montas monta montaba montábamos montaban} :: Montaba en bici todos los días. — Я каждый день катался на велосипеде."
    blocks:
      - "У всех глаголов на -ar это время образуется одинаково — без единого исключения."
      - conjugation:
          id: aba
          verb: jugar
          ru: "играть — раньше, обычно (pretérito imperfecto)"
          forms: [jugaba, jugabas, jugaba, jugábamos, jugabais, jugaban]
      - note:
          id: yo_el
          text: "Формы «я» и «он, она» **совпадают**: _jugaba_ — «я играл» и «он играл»; кто именно, ясно из разговора. Знак ударения — только в форме «мы»: _jugábamos_. Корень не меняется: _juego_, но **jugaba**; _empiezo_, но **empezaba**."
      - write:
          title: Поставьте глагол в imperfecto
          format: одна форма глагола
          accents: strict
          skill: imperfecto_ar
          rule: aba
          items:
            - q: "De niño (yo, jugar) ___ al fútbol todos los días."
              a: "jugaba"
              explain: "Yo — -aba: jugaba."
              mistakes:
                "juegaba": "В imperfecto корень не меняется: **jugaba**."
                "jugué": "Jugué — один раз. «Каждый день» — привычка: **jugaba**."
            - q: "¿(tú, estudiar) ___ mucho en la escuela?"
              a: "estudiabas"
              explain: "Tú — -abas: estudiabas."
            - q: "Mi hermana (bailar) ___ muy bien."
              a: "bailaba"
              explain: "Ella — -aba: bailaba."
            - q: "Mis padres (trabajar) ___ en una tienda."
              a: "trabajaban"
              explain: "Ellos — -aban: trabajaban."
            - q: "Mis amigos y yo (hablar) ___ mucho por teléfono."
              a: "hablábamos"
              explain: "Nosotros — -ábamos, со знаком ударения."
              mistakes:
                "hablabamos": "В форме «мы» нужен знак ударения: habl**á**bamos."
            - q: "¿(vosotros, cantar) ___ en la escuela?"
              a: "cantabais"
              explain: "Vosotros — -abais: cantabais."
      - learn: [dibujar, la pelota, la muñeca, montar en bici]
      - compare:
          id: marcas
          slide: new
          title: Слова-подсказки
          cards:
            - head: jugaba
              say: false
              label: "обычно, много раз"
              tone: sun
              text: "antes, de niño, siempre, todos los días, a menudo, los sábados"
              ex: ["De niño jugaba al fútbol. — В детстве я играл в футбол."]
            - head: jugué
              say: false
              label: "один раз, тогда-то"
              tone: blue
              text: "ayer, el sábado, una vez, en 2010, hace dos años"
              ex: ["Ayer jugué al fútbol. — Вчера я играл в футбол."]
      - sort:
          title: С каким временем?
          skill: imperfecto_uso
          rule: marcas
          groups:
            "jugaba": [de niño, todos los días, antes, a menudo]
            "jugué": [ayer, una vez, el sábado pasado, hace dos años]
      - choose:
          title: Выберите форму
          skill: imperfecto_uso
          rule: marcas
          items:
            - q: "Ayer ___ al fútbol con mis compañeros."
              options: "jugué | jugaba | juego"
              explain: "Ayer — один раз: jugué."
            - q: "De niño ___ al fútbol todos los días."
              options: "jugaba | jugué | juego"
              explain: "De niño, todos los días — привычка: jugaba."
            - q: "Antes mi madre ___ en un hospital; ahora trabaja en una farmacia."
              options: "trabajaba | trabajó | trabaja"
              explain: "Antes — как было раньше: trabajaba."
            - say: "De niña montaba en bici todos los días."
              options: "В детстве я каждый день каталась на велосипеде. | Вчера я каталась на велосипеде. | Я каждый день катаюсь на велосипеде."
              explain: "De niña … todos los días — привычка в прошлом: montaba."
              noaudio: {q: "Что значит «De niña montaba en bici todos los días»?", options: "В детстве я каждый день каталась на велосипеде. | Вчера я каталась на велосипеде. | Я каждый день катаюсь на велосипеде."}
      - build:
          title: Соберите фразу
          skill: imperfecto_ar
          rule: aba
          items:
            - es: "Mi hermana jugaba con muñecas y yo con una pelota."
              ru: "Моя сестра играла в куклы, а я — с мячом."
            - es: "Antes escuchábamos música todas las tardes."
              ru: "Раньше мы слушали музыку каждый вечер."
              extra: [escuchamos]
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: imperfecto_ar
          rule: aba
          items:
            - q: "В детстве я много рисовал."
              a: "De niño dibujaba mucho | De niña dibujaba mucho | Cuando era [pequeño/pequeña](,) dibujaba mucho | De [niño/niña] yo dibujaba mucho | Dibujaba mucho de [niño/niña]"
              explain: "Привычка в прошлом — dibujaba."
              mistakes:
                "de niño dibujé mucho": "Dibujé — один раз. «В детстве, много» — привычка: **dibujaba**."
            - q: "Раньше мы работали вместе с Аной."
              a: "Antes trabajábamos con Ana | Antes Ana y yo trabajábamos (juntos) | (Nosotros) antes trabajábamos con Ana"
              explain: "Nosotros — trabajábamos."
              mistakes:
                "antes trabajamos con ana": "Trabajamos — «работаем» или «поработали». «Раньше работали» — **trabajábamos**."
      - compose:
          title: О себе
          skill: imperfecto_ar
          rule: aba
          items:
            - q: "¿A qué jugabas de niño? Напишите две фразы о том, что вы обычно делали в детстве."
              format: "De niño jugaba… También…"
              words: [6, 35]
              sentences: 2
              checks:
                - label: "глагол на -aba: jugaba, montaba, dibujaba, cantaba…"
                  re: "\\b\\w+aba\\b|\\b\\w+abamos\\b"
              sample: "De niño jugaba al fútbol con mis vecinos. También montaba en bici y dibujaba mucho."
              sample_ru: "В детстве я играл в футбол с соседями. Ещё катался на велосипеде и много рисовал."
    forms: [juntos]
    quiz:
      - q: "Cuando era pequeña, mi abuela me ___ canciones."
        options: "cantaba | cantó | canta"
        explain: "Привычка в детстве: cantaba."
        skill: imperfecto_ar
      - q: "Какая форма значит «мы играли (раньше, обычно)»?"
        options: "jugábamos | jugamos | jugaban"
        explain: "Nosotros в imperfecto — jugábamos; jugaban — «они играли»."
        skill: imperfecto_ar

  - id: verbos_er_ir
    kind: grammar
    title: "Comía, vivía — и era, iba, veía"
    goal: рассказать, каким вы были, где жили и куда ходили в детстве
    version: 2
    vocab:
      - "🏞 había [аби́а] — было, имелось (от hay) :: En mi barrio había un parque. — В моём районе был парк."
      - "🍬 el caramelo [карамэ́ло] — конфета :: Mi abuelo me compraba caramelos. — Дедушка покупал мне конфеты."
      - "🥪 la merienda [мэрье́нда] — полдник :: La merienda era a las cinco. — Полдник был в пять."
      - "😈 travieso/a [трабье́со, трабье́са] — озорной, непослушный :: Era un niño muy travieso. — Я был очень озорным ребёнком."
    blocks:
      - "У глаголов на -er и -ir окончания общие, и везде — `í` со знаком ударения."
      - conjugation:
          id: ia
          verb: comer
          ru: "есть — раньше, обычно; так же vivir, tener, hacer"
          forms: [comía, comías, comía, comíamos, comíais, comían]
      - write:
          title: Поставьте глагол в imperfecto
          format: одна форма глагола
          accents: strict
          skill: imperfecto_er_ir
          rule: ia
          items:
            - q: "De niño (yo, vivir) ___ en un pueblo."
              a: "vivía"
              explain: "Yo — -ía: vivía."
              mistakes:
                "vivia": "Нужен знак ударения: viv**í**a."
                "viví": "Viví — законченный срок. «В детстве жил» как фон — **vivía**."
            - q: "¿(tú, tener) ___ muchos juguetes?"
              a: "tenías"
              explain: "Tú — -ías: tenías."
            - q: "Mi abuela (hacer) ___ un pan increíble."
              a: "hacía"
              explain: "Ella — -ía: hacía. В imperfecto hacer — правильный."
              mistakes:
                "hizo": "Hizo — один раз. «Пекла обычно» — **hacía**."
            - q: "Los domingos (nosotros, comer) ___ en casa de mis abuelos."
              a: "comíamos"
              explain: "Nosotros — -íamos: comíamos."
            - q: "Mis hermanos (dormir) ___ en una habitación pequeña."
              a: "dormían"
              explain: "Ellos — -ían: dormían. Корень не меняется."
              mistakes:
                "duermían": "В imperfecto корень не меняется: **dormían**."
      - table:
          id: tres
          slide: new
          title: Только три неправильных глагола
          rows:
            - ["**ser**", "era, eras, era, éramos, erais, eran"]
            - ["**ir**", "iba, ibas, iba, íbamos, ibais, iban"]
            - ["**ver**", "veía, veías, veía, veíamos, veíais, veían"]
      - learn: [había, el caramelo, la merienda, travieso/a]
      - note:
          id: habia
          text: "**Hay** в этом времени — **había**, и оно не меняется по числам: _Había un parque_ — «был парк», _Había muchos niños_ — «было много детей»."
      - write:
          title: Вставьте ser, ir, ver или haber
          format: одна форма глагола
          accents: strict
          skill: imperfecto_er_ir
          rule: tres
          items:
            - q: "De pequeño (yo, ser) ___ muy travieso."
              a: "era"
              explain: "Ser, yo — era."
              mistakes:
                "fui": "Fui — «я был» один раз или «ходил». Каким я был в детстве — **era**."
            - q: "Todos los veranos (nosotros, ir) ___ a la playa."
              a: "íbamos"
              explain: "Ir, nosotros — íbamos."
              mistakes:
                "ibamos": "В форме «мы» нужен знак ударения: **í**bamos."
            - q: "Los sábados mis hermanos (ver) ___ dibujos animados."
              a: "veían"
              explain: "Ver, ellos — veían."
            - q: "En mi calle (haber) ___ dos tiendas."
              a: "había"
              explain: "Hay → había, без изменения по числам."
              mistakes:
                "habían": "Había не меняется по числам: **había** dos tiendas."
            - q: "¿Cómo (ser) ___ tu escuela?"
              a: "era"
              explain: "Ser, él — era."
      - choose:
          title: Послушайте
          skill: imperfecto_er_ir
          rule: tres
          items:
            - say: "Cuando tenía diez años, iba a la escuela a pie."
              options: "Когда мне было десять лет, я ходил в школу пешком. | Десять лет назад я пошёл в школу. | Мне десять лет, и я хожу в школу пешком."
              explain: "Cuando tenía diez años — «когда мне было десять лет»; iba — «ходил»."
              noaudio: {q: "Что значит «Cuando tenía diez años, iba a la escuela a pie»?", options: "Когда мне было десять лет, я ходил в школу пешком. | Десять лет назад я пошёл в школу. | Мне десять лет, и я хожу в школу пешком."}
            - say: "En mi barrio no había ningún parque."
              options: "В моём районе не было ни одного парка. | В моём районе нет ни одного парка. | В моём районе был один парк."
              explain: "No había ningún… — «не было ни одного»."
              noaudio: {q: "Что значит «En mi barrio no había ningún parque»?", options: "В моём районе не было ни одного парка. | В моём районе нет ни одного парка. | В моём районе был один парк."}
            - q: "Mi abuelo siempre me ___ caramelos después de la merienda."
              options: "compraba | compró | compra"
              explain: "Siempre, в детстве — привычка: compraba."
              skill: imperfecto_uso
      - build:
          title: Соберите фразу
          skill: imperfecto_er_ir
          rule: tres
          items:
            - es: "Cuando tenía diez años, vivía en Odesa."
              ru: "Когда мне было десять лет, я жил в Одессе."
            - es: "En mi barrio había un parque muy grande."
              ru: "В моём районе был очень большой парк."
              alt: ["Había un parque muy grande en mi barrio."]
              extra: [hay]
      - write:
          title: Скажите по-испански
