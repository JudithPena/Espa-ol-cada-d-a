                words: [2, 20]
                checks:
                  - label: "во что играли: jugaba…, jugábamos…"
                    any: [jugaba, jugábamos]
                sample: "Jugábamos al fútbol en la calle todas las tardes."
                sample_ru: "Мы каждый вечер играли в футбол на улице."
            - say: "¿Y todavía vives con tus padres? | А ты всё ещё живёшь с родителями?"
              task: "Ответьте, что уже нет: теперь вы живёте в Мадриде."
              skill: ya_no_todavia
              write: "No, ya no. Ahora vivo en Madrid | Ya no. Ahora vivo en Madrid | No, ya no vivo con [ellos/mis padres]. Ahora vivo en Madrid | No, ahora vivo en Madrid"
              format: ответ
              mistakes:
                "no todavía no ahora vivo en madrid": "Todavía no — «ещё нет»: так говорят о том, что будет потом. Раньше да, сейчас нет — **ya no**."
            - say: "Yo de pequeña era muy traviesa: ¡no estudiaba nada! | Я в детстве была очень озорной: совсем не училась!"
              task: "Спросите на «вы», нравилась ли ей школа."
              skill: imperfecto_uso
              write: "¿Le gustaba la escuela? | ¿(Y) a usted le gustaba la escuela? | ¿No le gustaba la escuela?"
              format: вопрос
              mistakes:
                "te gustaba la escuela": "К бабушке подруги обращаются на «вы»: **¿Le gustaba** la escuela?"
                "le gustó la escuela": "Gustó — о разовом. Как было обычно, — **gustaba**."
            - say: "No mucho. ¡Prefería jugar en la calle! | Не очень. Мне больше нравилось играть на улице!"
              task: "Скажите, что раньше жизнь была спокойнее."
              skill: imperfecto_uso
              choose: "Antes la vida era más tranquila. | Antes la vida fue más tranquila. | Ahora la vida es más tranquila."
              explain: "Как было раньше, описывают в imperfecto: era."
            - say: "¡Es verdad! Bueno, ¿quieres más café? | Это правда! Ну что, хочешь ещё кофе?"
      - compose:
          title: Каким я был в десять лет
          free: true
          rule: none
          skill: [imperfecto_uso, ya_no_todavia]
          items:
            - q: "Напишите 5–6 фраз «Cuando tenía diez años…»: где и с кем вы жили · каким вы были · что обычно делали после школы и летом · что изменилось: ya no, todavía."
              format: "Cuando tenía diez años, vivía…"
              words: [30, 120]
              sentences: 4
              checks:
                - label: "начало: Cuando tenía diez años…"
                  any: ["cuando tenía", "tenía diez años", "a los diez años"]
                - label: "imperfecto: vivía, era, jugaba, iba…"
                  re: "\\b\\w+(aba|abas|aban|ábamos)\\b|\\b(era|eras|eran|éramos|iba|ibas|iban|íbamos|había|tenía|tenías|tenían|teníamos|vivía|vivías|vivían|vivíamos|hacía|hacían|hacíamos|quería|podía|sabía|salía|salíamos|comía|comíamos|veía|veían|veíamos|leía|escribía|llovía|prefería|dormía|volvía|volvíamos|conocía|ponía|corría|corríamos|bebía|aprendía)\\b"
                - label: "сравнение с сегодня: ya no, todavía или ahora"
                  any: ["ya no", todavía, ahora]
              sample: "Cuando tenía diez años, vivía en Odesa con mis padres y mi hermano. Era un niño bastante tímido, pero en casa era muy travieso. Después de la escuela jugaba al fútbol con mis vecinos o veía dibujos animados. En verano íbamos al mar. Ahora vivo en Madrid y ya no juego al fútbol, pero todavía me gustan los dibujos animados."
              sample_ru: "Когда мне было десять лет, я жил в Одессе с родителями и братом. Я был довольно застенчивым ребёнком, но дома очень озорным. После школы играл с соседями в футбол или смотрел мультики. Летом мы ездили на море. Сейчас я живу в Мадриде и больше не играю в футбол, но мультики мне всё ещё нравятся."

