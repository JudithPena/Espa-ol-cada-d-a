  - id: antes_ahora
    kind: grammar
    title: "Antes y ahora: ya no, todavía"
    goal: сравнить, как было раньше и как сейчас
    version: 2
    vocab:
      - "🔚 ya no [я но] — уже не, больше не :: Ya no vivo con mis padres. — Я больше не живу с родителями."
      - "✉️ la carta [ка́рта] — письмо (на бумаге) :: Antes escribíamos cartas. — Раньше мы писали письма."
      - "🎮 el videojuego [бидэохуэ́го] — видеоигра :: Mi hijo juega a los videojuegos. — Мой сын играет в видеоигры."
      - "🔀 diferente [дифэрэ́нтэ] — другой, не такой :: Ahora mi vida es muy diferente. — Теперь моя жизнь совсем другая."
      - "🚬 fumar [фума́р] — курить :: Antes fumaba mucho. — Раньше я много курил."
      - "🏋 el gimnasio [химна́сьо] — спортзал :: Ahora voy al gimnasio. — Теперь я хожу в спортзал."
    blocks:
      - "Чтобы сравнить прошлое и настоящее, ставим рядом два времени: как было — в imperfecto, как есть — в настоящем."
      - compare:
          id: antes_ahora
          title: "Antes и ahora"
          cards:
            - head: antes
              label: "как было: imperfecto"
              tone: sun
              ex: ["Antes vivía en Kiev. — Раньше я жил в Киеве."]
            - head: ahora
              label: "как есть: настоящее время"
              tone: blue
              ex: ["Ahora vivo en Madrid. — Сейчас я живу в Мадриде."]
      - learn: [ya no, la carta, el videojuego, diferente, fumar, el gimnasio]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la carta — письмо"
            - "el videojuego — видеоигра"
            - "fumar — курить"
            - "el gimnasio — спортзал"
            - "diferente — другой, не такой"
      - choose:
          title: Раньше или сейчас?
          skill: ya_no_todavia
          rule: antes_ahora
          items:
            - q: "Antes ___ cartas a mis amigos; ahora les escribo mensajes."
              options: "escribía | escribo | escribí"
              explain: "Antes — как было раньше: escribía."
            - q: "De niño no hacía deporte; ahora ___ al gimnasio tres veces por semana."
              options: "voy | iba | fui"
              explain: "Ahora — как есть сейчас: voy."
            - say: "Antes no había móviles."
              options: "Раньше не было мобильных телефонов. | Сейчас нет мобильных телефонов. | Раньше у меня не было мобильного."
              explain: "No había — «не было вообще»; «у меня не было» — no tenía."
              noaudio: {q: "Что значит «Antes no había móviles»?", options: "Раньше не было мобильных телефонов. | Сейчас нет мобильных телефонов. | Раньше у меня не было мобильного."}
      - compare:
          id: ya_no
          slide: new
          title: "Ya no и todavía"
          cards:
            - head: ya no
              label: "раньше да, сейчас нет"
              tone: rose
              ex: ["Ya no fumo. — Я больше не курю."]
            - head: todavía
              label: "и раньше, и сейчас"
              tone: mint
              ex: ["Todavía vivo aquí. — Я всё ещё живу здесь."]
          note: "Оба обычно стоят перед глаголом. Не путайте: **todavía no** — «ещё не» (будет потом), **ya no** — «уже не» (было раньше)."
      - write:
          title: Вставьте ya no или todavía
          format: ya no или todavía
          skill: ya_no_todavia
          rule: ya_no
          items:
            - q: "Antes Pablo fumaba mucho. Ahora no fuma: Pablo ___ fuma."
              a: "ya no"
              explain: "Раньше да, сейчас нет — ya no."
              mistakes:
                "todavía no": "Todavía no — «ещё не»: так говорят о том, что будет потом. Раньше курил, теперь нет — **ya no**."
            - q: "Ana vivía en Sevilla y ahora también vive allí: Ana ___ vive en Sevilla."
              a: "todavía"
              explain: "И раньше, и сейчас — todavía."
              mistakes:
                "ya": "Ya — «уже». И раньше, и сейчас — **todavía**."
            - q: "De niño jugaba a los videojuegos, pero ahora no: ___ juego a los videojuegos."
              a: "ya no"
              explain: "Раньше да, сейчас нет — ya no."
            - q: "Mi abuela tiene ochenta años y ___ monta en bici todos los días."
              a: "todavía"
              explain: "И раньше, и сейчас — todavía."
      - build:
          title: Соберите фразу
          skill: ya_no_todavia
          rule: ya_no
          items:
            - es: "Ya no vivo con mis padres."
              ru: "Я больше не живу с родителями."
              extra: [todavía]
            - es: "Antes escribíamos cartas y ahora escribimos mensajes."
              ru: "Раньше мы писали письма, а теперь пишем сообщения."
      - choose:
          title: Послушайте
          skill: ya_no_todavia
          rule: ya_no
          items:
            - say: "Mi barrio es muy diferente: ya no hay tiendas pequeñas."
              options: "Мой район стал совсем другим: маленьких магазинов больше нет. | Мой район почти не изменился: маленькие магазины всё ещё есть. | В моём районе никогда не было маленьких магазинов."
              explain: "Ya no hay — «больше нет»: раньше были, а теперь нет."
              noaudio: {q: "Что значит «Mi barrio es muy diferente: ya no hay tiendas pequeñas»?", options: "Мой район стал совсем другим: маленьких магазинов больше нет. | Мой район почти не изменился: маленькие магазины всё ещё есть. | В моём районе никогда не было маленьких магазинов."}
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: ya_no_todavia
          rule: antes_ahora
          items:
            - q: "Раньше я много курил, а теперь хожу в спортзал."
              a: "Antes fumaba mucho y ahora voy al gimnasio | Antes fumaba mucho, pero ahora voy al gimnasio | Antes fumaba mucho, ahora voy al gimnasio | Yo antes fumaba mucho y ahora voy al gimnasio"
              explain: "Как было — fumaba, как есть — voy."
              mistakes:
                "antes fumé mucho y ahora voy al gimnasio": "Как было раньше, обычно, — **fumaba**."
            - q: "Я больше не играю в видеоигры."
              a: "Ya no juego a (los) videojuegos | Ya no juego videojuegos | Yo ya no juego a los videojuegos"
              explain: "«Больше не» — ya no перед глаголом."
              mistakes:
                "todavía no juego a los videojuegos": "Todavía no — «ещё не». «Больше не» — **ya no**."
      - compose:
          title: О себе
          skill: ya_no_todavia
          rule: ya_no
          items:
            - q: "¿Qué hacías antes y ya no haces? ¿Qué haces todavía? Напишите две-три фразы."
              format: "Antes… Ya no… Todavía…"
              words: [8, 45]
              sentences: 2
              checks:
                - label: "раньше: imperfecto (vivía, jugaba, era, iba…)"
                  re: "\\b\\w+(aba|abas|aban|ábamos)\\b|\\b(era|eras|eran|éramos|iba|ibas|iban|íbamos|había|tenía|tenías|tenían|teníamos|vivía|vivías|vivían|vivíamos|hacía|hacían|hacíamos|quería|podía|sabía|salía|salíamos|comía|comíamos|veía|veían|veíamos|leía|escribía|llovía|prefería|dormía|volvía|volvíamos|conocía|ponía|corría|corríamos|bebía|aprendía)\\b"
                - label: "больше не: ya no…"
                  any: ["ya no"]
                - label: "всё ещё: todavía…"
                  any: [todavía]
              sample: "Antes fumaba y no hacía deporte. Ya no fumo: ahora voy al gimnasio. Todavía escribo cartas a mi abuela."
              sample_ru: "Раньше я курил и не занимался спортом. Теперь я не курю: хожу в спортзал. А бабушке я всё ещё пишу письма."
    quiz:
      - q: "Antes iba mucho al cine, pero ___ voy: no tengo tiempo."
        options: "ya no | todavía | ya"
