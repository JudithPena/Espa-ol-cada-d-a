  - id: lectura
    kind: reading
    title: "Mi país: México"
    goal: понять рассказ о стране и сравнить со своей
    version: 2
    allow: [tacos]   # блюдо из рассказа Диего: понятно из перевода, отдельной карточкой не вводим
    vocab:
      - "🏛 la pirámide [пира́мидэ] — пирамида :: En México hay pirámides muy antiguas. — В Мексике есть очень древние пирамиды."
      - "💀 el Día de Muertos [ди́а дэ муэ́ртос] — День мёртвых (праздник памяти в Мексике) :: El Día de Muertos se celebra en noviembre. — День мёртвых празднуют в ноябре."
      - "✨ especial [эспэθья́ль] — особый :: Es una fiesta muy especial. — Это очень особенный праздник."
    blocks:
      - learn: [la pirámide, el Día de Muertos, especial]
      - "Диего пишет для блога школы рассказ о своей стране."
      - reading:
          id: mexico
          title: Mi país, México
          text: |
            México está al sur de Estados Unidos y tiene más de cien millones de habitantes. La capital es la Ciudad de México, una de las ciudades más grandes del mundo. En mi país hay de todo: playas en el Caribe, desiertos en el norte, volcanes y montañas. En el sur hay pirámides muy antiguas.

            La comida mexicana es muy famosa. Se come mucho maíz: nuestras tortillas son de maíz, no de huevo y patata como en España. Mi plato favorito son los tacos de mi madre.

            La fiesta más especial es el Día de Muertos, el uno y el dos de noviembre. Las familias recuerdan a sus muertos con flores, comida y música. No es una fiesta triste: ¡es muy alegre! Cuando era pequeño, la celebraba con mis abuelos, y todavía me encanta.
          translation: |
            Мексика находится к югу от США, в ней больше ста миллионов жителей. Столица — Мехико, один из самых больших городов мира. В моей стране есть всё: пляжи на Карибском море, пустыни на севере, вулканы и горы. На юге — очень древние пирамиды.

            Мексиканская кухня очень известна. Едят много кукурузы: наши тортильи — из кукурузы, а не из яиц и картошки, как в Испании. Моё любимое блюдо — мамины такос.

            Самый особенный праздник — День мёртвых, первого и второго ноября. Семьи вспоминают своих умерших с цветами, едой и музыкой. Это не грустный праздник: он очень весёлый! В детстве я праздновал его с бабушкой и дедушкой и до сих пор его очень люблю.
      - choose:
          title: Что пишет Диего?
          source: mexico
          items:
            - q: "¿Dónde está México?"
              options: "Al sur de Estados Unidos. | Al norte de Estados Unidos. | En el sur de España."
              explain: "México está al sur de Estados Unidos."
              skill: geografia
            - q: "¿Qué hay en el norte de México?"
              options: "Desiertos. | Pirámides. | Playas del Caribe."
              explain: "…desiertos en el norte…"
              skill: geografia
            - q: "¿De qué son las tortillas mexicanas?"
              options: "De maíz. | De huevo y patata. | De pan."
              explain: "…nuestras tortillas son de maíz, no de huevo y patata como en España."
              skill: se_pasiva
            - q: "¿Cuál es la fiesta más especial para Diego?"
              options: "El Día de Muertos. | La Navidad. | El Año Nuevo."
              explain: "La fiesta más especial es el Día de Muertos…"
            - q: "¿Cómo es el Día de Muertos para Diego?"
              options: "Una fiesta alegre. | Una fiesta muy triste. | Una fiesta solo para niños."
              explain: "No es una fiesta triste: ¡es muy alegre!"
      - sort:
          title: Испания или Мексика?
          source: mexico
          skill: hispano
          groups:
            "Испания": ["tortilla de huevo y patata", "doce uvas en Nochevieja"]
            "Мексика": ["tortillas de maíz", "el Día de Muertos", "pirámides antiguas"]
      - write:
          title: Ответьте по тексту
          format: короткий ответ по-испански
          source: mexico
          items:
            - q: "¿Cuándo se celebra el Día de Muertos?"
              a: "El uno y el dos de noviembre | En noviembre | El 1 y el 2 de noviembre"
              explain: "…el uno y el dos de noviembre."
            - q: "Как в тексте сказано «В детстве я праздновал его с бабушкой и дедушкой»?"
              a: "Cuando era pequeño, la celebraba con mis abuelos"
              explain: "Imperfecto — как было обычно в детстве."
              skill: tiempos_a2
      - choose:
          title: Послушайте
          free: true
          rule: none
          items:
            - say: "En México hay de todo: playas, desiertos y volcanes."
              options: "В Мексике есть всё: пляжи, пустыни и вулканы. | В Мексике нет ни пляжей, ни вулканов. | В Мексике только пустыни."
              explain: "Hay de todo — «есть всё»."
              skill: geografia
              noaudio: {q: "Что значит «En México hay de todo: playas, desiertos y volcanes»?", options: "В Мексике есть всё: пляжи, пустыни и вулканы. | В Мексике нет ни пляжей, ни вулканов. | В Мексике только пустыни."}
      - compose:
          title: Сравните
          free: true
          rule: none
          skill: [hispano, se_pasiva]
          items:
            - q: "Сравните Мексику из текста Диего со своей страной: что похоже, что отличается. Три-четыре фразы."
              format: "En México… En mi país… pero…"
              words: [20, 80]
              sentences: 3
              checks:
                - label: "сравнение: más / menos… que, tan… como, pero…"
                  any: [más, menos, tan, tanto, pero, también, tampoco, igual]
                - label: "se come, se celebra…"
                  re: "\\bse (come|comen|celebra|celebran|dice|habla|bebe|cena)\\b"
              sample: "México es mucho más grande que mi país, pero los dos tenemos montañas y playas. En Ucrania no se come tanto maíz: se come más pan. Nosotros también recordamos a nuestros muertos, pero es un día más triste."
              sample_ru: "Мексика намного больше моей страны, но и у нас есть горы и пляжи. В Украине едят не так много кукурузы — больше хлеба. Мы тоже вспоминаем умерших, но этот день у нас грустнее."

