              write: "No, nunca, pero me gustaría (mucho) ir a México | No, nunca he estado, pero me gustaría (mucho) ir a México | No, nunca, pero me gustaría (mucho) viajar a México"
              format: ответ
              mistakes:
                "no nunca pero me gusta ir a méxico": "Желание — condicional: me **gustaría** ir a México."
            - say: "¡Gracias por tu ayuda! Nos vemos el viernes. | Спасибо за помощь! Увидимся в пятницу."
      - compose:
          title: Презентация страны
          free: true
          rule: none
          skill: [geografia, se_pasiva, tiempos_a2]
          items:
            - q: "Напишите презентацию своей страны, 80–110 слов: где она и какая там природа · сколько жителей · что едят и что празднуют · что вы любили там в детстве · что посоветуете посмотреть."
              format: "Mi país está en… Tiene… millones de habitantes. Se come… Se celebra… Cuando era pequeño/a… Os recomiendo…"
              words: [65, 150]
              sentences: 5
              checks:
                - label: "где: está en el…, al sur de…"
                  any: [en el norte, en el sur, en el este, en el oeste, en el centro, al norte, al sur, al este, al oeste, en la costa]
                - label: "что принято: se come, se celebra…"
                  re: "\\bse (come|comen|celebra|celebran|dice|habla|bebe|cena|toma)\\b"
                - label: "прошлое: cuando era…, pasaba, fui…"
                  any: [cuando era, de niño, de niña, de pequeño, de pequeña, pasaba, vivía, iba, celebraba, fui, he estado, he visto]
                - label: "совет: os recomiendo, tenéis que…"
                  any: [recomiendo, tenéis que, tienes que, tiene que, deberíais, deberías, podéis, hay que]
              sample: "Mi país es Ucrania. Está en el este de Europa y tiene más de treinta millones de habitantes. La capital, Kiev, está en el centro y tiene un río enorme. En el sur hay costa y playas, y en el oeste, montañas. Se come mucha sopa, pan y patatas, y el Año Nuevo se celebra con toda la familia. Cuando era pequeña, pasaba los veranos en el pueblo de mis abuelos: nadaba en el río y comía fruta todo el día. Os recomiendo visitar Leópolis: es una ciudad antigua y muy especial."
              sample_ru: "Моя страна — Украина. Она находится на востоке Европы, в ней больше тридцати миллионов жителей. Столица, Киев, — в центре, через неё течёт огромная река. На юге есть побережье и пляжи, на западе — горы. Едят много супа, хлеба и картошки, а Новый год празднуют всей семьёй. В детстве я проводила лето в деревне у бабушки с дедушкой: купалась в реке и целый день ела фрукты. Советую съездить во Львов: это старинный и совершенно особенный город."

