id: mundo_hispano
number: 41
level: A2
title: El mundo hispano — испаноязычный мир
goals:
  - понять, чем испанский в Испании отличается от испанского в Латинской Америке
  - рассказать, что где говорят, едят и празднуют: se dice, se come
  - описать страну: где она, какая природа, сколько людей
  - рассказать о своей стране, используя все пройденные времена

# Тема 18 карты A2: повторение времён; se dice, se come; различия Испании и Америки; география, традиции.
# Миссия — презентация своей страны. Курс учит норме Испании; слова Латинской Америки здесь — для понимания.
lessons:
  - id: palabras
    kind: listening
    title: "¿En México se dice «coche»?"
    goal: понять на слух разговор о словах Испании и Мексики
    version: 2
    # Карта экранов: docs/site_slide_maps/41_mundo_hispano.md
    vocab:
      - "🗣 el acento [аθэ́нто] — акцент; знак ударения :: Diego tiene acento mexicano. — У Диего мексиканский акцент."
      - "↔️ la diferencia [дифэрэ́нθья] — разница :: ¿Cuál es la diferencia? — В чём разница?"
      - "👅 la lengua [ле́нгуа] — язык; язык (орган) :: El español es la lengua de veinte países. — Испанский — язык двадцати стран."
      - "🤩 interesante [интэрэса́нтэ] — интересный :: ¡Qué interesante! — Как интересно!"
      - "🟰 mismo/a [ми́смо, ми́сма] — тот же самый, один и тот же :: Hablamos la misma lengua. — Мы говорим на одном языке."
      - "🌎 hispano/a [испа́но, испа́на] — испаноязычный (об Испании и Латинской Америке) :: El mundo hispano es muy grande. — Испаноязычный мир очень большой."
    blocks:
      - "Лусия и Диего сравнивают слова Испании и Мексики. Послушайте разговор два раза: текста пока нет."
      - dialogue:
          id: carro
          hidden: true
          lines:
            - "Lucía: Diego, ¿en México se dice «coche»? | Диего, в Мексике говорят «coche»?"
            - "Diego: No, en México decimos «carro». Y el móvil es el «celular». | Нет, в Мексике говорим «carro». А мобильный — «celular»."
            - "Lucía: ¡Qué interesante! ¿Y el ordenador? | Как интересно! А компьютер?"
            - "Diego: La computadora. Y el zumo es el «jugo». Pero nos entendemos sin problemas: es la misma lengua. | Computadora. А сок — jugo. Но мы понимаем друг друга без проблем: это один язык."
            - "Lucía: Es verdad. La mayor diferencia es el acento. | Правда. Самая большая разница — акцент."
            - "Diego: Y en México no se dice «vosotros»: siempre decimos «ustedes». | А в Мексике не говорят «vosotros»: всегда говорим «ustedes»."
            - "Lucía: ¡Por eso nos dices «ustedes» a mis amigos y a mí! | Так вот почему ты говоришь мне с друзьями «ustedes»!"
      - choose:
          title: Что вы поняли?
          source: carro
          items:
            - q: "Как в Мексике называют машину?"
              options: "Carro. | Coche. | Celular."
              explain: "Diego: En México decimos «carro»."
            - q: "А мобильный телефон?"
              options: "Celular. | Móvil. | Computadora."
              explain: "Diego: Y el móvil es el «celular»."
      - learn: [el acento, la diferencia, la lengua, mismo/a]
      - choose:
          title: Детали разговора
          source: carro
          items:
            - q: "¿Cómo se dice «zumo» en México?"
              options: "Jugo. | Carro. | Celular."
              explain: "Diego: Y el zumo es el «jugo»."
            - q: "¿Se entienden Lucía y Diego?"
              options: "Sí, sin problemas: es la misma lengua. | No, muy poco. | Solo cuando hablan inglés."
              explain: "Diego: Pero nos entendemos sin problemas: es la misma lengua."
            - q: "Para Lucía, ¿cuál es la mayor diferencia?"
              options: "El acento. | Las palabras. | La gramática."
              explain: "Lucía: La mayor diferencia es el acento."
            - q: "¿Qué no se dice en México?"
              options: "Vosotros. | Ustedes. | Nosotros."
              explain: "Diego: En México no se dice «vosotros»."
      - learn: [interesante, hispano/a]
      - match:
          title: Соедините пары
          free: true
          rule: none
          pairs:
            - "el acento — акцент"
            - "la diferencia — разница"
            - "la lengua — язык"
            - "mismo — тот же самый"
            - "interesante — интересный"
            - "hispano — испаноязычный"
      - compare:
          id: espana_mexico
          slide: new
          title: Испания и Мексика
          cards:
            - head: "coche, móvil, ordenador, zumo, vosotros"
              label: "в Испании (так учит наш курс)"
              tone: sun
              ex: ["¿Tenéis coche? — У вас (у вас всех) есть машина?"]
            - head: "carro, celular, computadora, jugo, ustedes"
              label: "в Мексике и многих странах Америки"
              tone: blue
              ex: ["¿Ustedes tienen carro? — У вас есть машина?"]
          note: "Это один язык: испанцы и мексиканцы понимают друг друга без проблем. Различаются некоторые слова и акцент."
      - sort:
          title: Испания или Мексика?
          free: true
          skill: hispano
          rule: espana_mexico
          groups:
            "в Испании": ["el coche", "el móvil", "el zumo", "el ordenador"]
            "в Мексике": ["el carro", "el celular", "el jugo", "la computadora"]
      - write:
          title: Диктант
          format: фраза по-испански
          free: true
          skill: hispano
          rule: espana_mexico
          items:
            - say: "En México se dice «carro» y en España, «coche»."
              a: "En México se dice carro y en España coche | En México se dice «carro» y en España, «coche»"
              explain: "Se dice — «говорят»."
              noaudio: {q: "Напишите по-испански: «В Мексике говорят carro, а в Испании — coche».", a: "En México se dice carro y en España coche | En México se dice carro y en España se dice coche"}
      - choose:
          title: Послушайте
          free: true
          skill: hispano
          rule: espana_mexico
          items:
            - say: "La mayor diferencia no son las palabras: es el acento."
              options: "Главная разница не в словах, а в акценте. | Слова и акцент совсем разные. | Разницы нет ни в словах, ни в акценте."
              explain: "La mayor diferencia — «самая большая разница»."
              noaudio: {q: "Что значит «La mayor diferencia no son las palabras: es el acento»?", options: "Главная разница не в словах, а в акценте. | Слова и акцент совсем разные. | Разницы нет ни в словах, ни в акценте."}
      - build:
          title: Соберите фразу
          free: true
          skill: hispano
          rule: espana_mexico
          items:
            - es: "Nos entendemos sin problemas: es la misma lengua."
              ru: "Мы понимаем друг друга без проблем: это один язык."
              extra: [idiomas]

  - id: se_dice
    kind: grammar
    title: "Se dice, se come, se celebra"
    goal: "рассказать, что принято в стране: что едят, как говорят, что празднуют"
    version: 2
    vocab:
      - "💬 hispanohablante [испаноабла́нтэ] — говорящий по-испански; испаноязычный {forms: hispanohablantes} :: Hay más de veinte países hispanohablantes. — Испаноязычных стран больше двадцати."
      - "⭐ típico/a [ти́пико, ти́пика] — типичный, традиционный :: La paella es un plato típico de Valencia. — Паэлья — традиционное блюдо Валенсии."
      - "🌽 el maíz [маи́θ] — кукуруза :: En México se come mucho maíz. — В Мексике едят много кукурузы."
    blocks:
      - learn: [hispanohablante, típico/a, el maíz]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "hispanohablante — говорящий по-испански"
            - "típico — традиционный"
            - "el maíz — кукуруза"
      - table:
          id: se_pasiva
          title: "Se + глагол: что принято"
          rows:
            - ["se + глагол (ед. ч.)", "En México se come mucho maíz. — В Мексике едят много кукурузы."]
            - ["se + глагол (мн. ч.)", "En España se comen doce uvas en Nochevieja. — В Испании в новогоднюю ночь едят двенадцать виноградин."]
            - ["¿Cómo se dice…?", "¿Cómo se dice «coche» en México? — Как в Мексике говорят «машина»?"]
            - ["se celebra", "El Día de Reyes se celebra el seis de enero. — День волхвов празднуют шестого января."]
      - note:
          id: se_numero
          text: "Как в вывесках (тема 35): глагол согласуется с тем, что едят или празднуют: _se come pan_, но _se comen tapas_; _se celebra la Navidad_, но _se celebran muchas fiestas_."
      - choose:
          title: Выберите форму
          skill: se_pasiva
          rule: se_numero
          items:
            - q: "En Argentina se ___ mucha carne."
              options: "come | comen | comes"
              explain: "Mucha carne — ед. ч.: se come."
            - q: "En España se ___ tapas en los bares."
              options: "comen | come | comemos"
              explain: "Tapas — мн. ч.: se comen."
            - q: "¿Cómo se ___ «móvil» en México?"
              options: "dice | dicen | decimos"
              explain: "¿Cómo se dice…?"
            - say: "En España se cena muy tarde: a las nueve o a las diez."
              options: "В Испании ужинают очень поздно: в девять или в десять. | В Испании ужинают рано: в шесть. | В Испании не ужинают, а только обедают."
              explain: "Se cena — «ужинают»."
              noaudio: {q: "Что значит «En España se cena muy tarde: a las nueve o a las diez»?", options: "В Испании ужинают очень поздно: в девять или в десять. | В Испании ужинают рано: в шесть. | В Испании не ужинают, а только обедают."}
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: se_pasiva
          rule: se_pasiva
          items:
            - q: "В Испании ужинают очень поздно."
              a: "En España se cena muy tarde"
              explain: "Se cena — «ужинают»."
            - q: "В Мексике говорят «celular»."
              a: "En México se dice celular | En México se dice «celular»"
              explain: "Se dice — «говорят»."
            - q: "Паэлья — традиционное блюдо Валенсии."
              a: "La paella es un plato típico de Valencia"
              explain: "Típico — традиционный, типичный."
      - build:
          title: Соберите фразу
          skill: se_pasiva
          rule: se_numero
          items:
            - es: "En Nochevieja se comen doce uvas."
              ru: "В новогоднюю ночь едят двенадцать виноградин."
              extra: [come]
      - compose:
          title: В моей стране
          skill: se_pasiva
          rule: se_pasiva
          items:
            - q: "Расскажите, что принято в вашей стране: что едят, когда обедают или ужинают, что празднуют. Две-три фразы с se."
              format: "En mi país se come… Se celebra…"
              words: [10, 50]
              sentences: 2
              checks:
                - label: "se come, se celebra, se dice…"
                  re: "\\bse (come|comen|cena|celebra|celebran|dice|bebe|habla|hablan|toma|hace)\\b"
              sample: "En Ucrania se come mucha sopa y mucho pan. Se cena a las siete. El Año Nuevo se celebra con toda la familia."
              sample_ru: "В Украине едят много супа и хлеба. Ужинают в семь. Новый год празднуют всей семьёй."
    quiz:
      - q: "En España se ___ muchas fiestas en verano."
        options: "celebran | celebra | celebramos"
        explain: "Muchas fiestas — мн. ч.: se celebran."
        skill: se_pasiva
      - q: "La tortilla de patatas es un plato ___ de España."
        options: "típico | típica | hispanohablante"
        explain: "Plato — мужской род: típico."

  - id: geografia
    kind: grammar
    title: "En el norte, en la costa"
    goal: описать, где страна и какая в ней природа
    version: 2
    vocab:
      - "🏖 la costa [ко́ста] — побережье :: Valencia está en la costa. — Валенсия на побережье."
      - "🏞 el río [ри́о] — река :: El río pasa por el centro de la ciudad. — Река течёт через центр города."
      - "🏜 el desierto [дэсье́рто] — пустыня :: En el norte de México hay desiertos. — На севере Мексики есть пустыни."
      - "🌋 el volcán [болька́н] — вулкан {pl: los volcanes} :: El Teide es un volcán. — Тейде — вулкан."
      - "👥 el habitante [абита́нтэ] — житель :: Madrid tiene más de tres millones de habitantes. — В Мадриде больше трёх миллионов жителей."
      - "🔢 el millón [мильо́н] — миллион {pl: los millones} :: España tiene unos cuarenta y ocho millones de habitantes. — В Испании около сорока восьми миллионов жителей."
    blocks:
      - learn: [la costa, el río, el desierto, el volcán, el habitante, el millón]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la costa — побережье"
            - "el río — река"
            - "el desierto — пустыня"
            - "el volcán — вулкан"
            - "el habitante — житель"
            - "el millón — миллион"
      - table:
          id: donde_esta
          title: Где это?
          rows:
            - ["en el norte, en el sur, en el este, en el oeste", "Bilbao está en el norte de España. — Бильбао на севере Испании."]
            - ["en el centro", "Madrid está en el centro de España. — Мадрид в центре Испании."]
            - ["en la costa", "Málaga está en la costa, en el sur. — Малага на побережье, на юге."]
            - ["al norte de… — севернее чего-то", "México está al sur de Estados Unidos. — Мексика к югу от США."]
      - note:
          id: millones
          text: "После **millón / millones** нужен **de**: _un millón **de** habitantes_, _tres millones **de** euros_. А mil — без de: _mil habitantes_."
      - choose:
          title: Где это?
          skill: geografia
          rule: donde_esta
          items:
            - q: "Bilbao está ___ norte de España."
              options: "en el | al | de"
              explain: "Внутри страны — en el norte de…"
            - q: "México está ___ sur de Estados Unidos."
              options: "al | en el | del"
              explain: "Снаружи, по отношению к другой стране — al sur de…"
            - q: "Madrid tiene más de tres millones ___ habitantes."
              options: "de | — | en"
              explain: "Millones de…"
              skill: geografia
            - say: "En las islas Canarias hay volcanes y playas muy bonitas."
              options: "На Канарских островах есть вулканы и очень красивые пляжи. | На Канарских островах нет пляжей, только вулканы. | Канарские острова находятся на севере."
              explain: "Islas Canarias — Канарские острова; volcanes — вулканы."
              noaudio: {q: "Что значит «En las islas Canarias hay volcanes y playas muy bonitas»?", options: "На Канарских островах есть вулканы и очень красивые пляжи. | На Канарских островах нет пляжей, только вулканы. | Канарские острова находятся на севере."}
      - write:
          title: Скажите по-испански
          format: фраза по-испански
          skill: geografia
          rule: millones
          items:
            - q: "Валенсия на побережье, на востоке Испании."
              a: "Valencia está en la costa, en el este de España | Valencia está en la costa este de España"
              explain: "En la costa, en el este de…"
            - q: "В Мексике больше ста миллионов жителей."
              a: "México tiene más de cien millones de habitantes | En México hay más de cien millones de habitantes"
              explain: "Millones de habitantes."
              mistakes:
                "méxico tiene más de cien millones habitantes": "После millones нужен **de**: millones de habitantes."
      - build:
          title: Соберите фразу
          skill: geografia
          rule: donde_esta
          items:
            - es: "El Teide es la montaña más alta de España."
              ru: "Тейде — самая высокая гора Испании."
              extra: [en]
      - compose:
          title: Моя страна на карте
          skill: geografia
          rule: donde_esta
          items:
            - q: "Опишите свою страну: где она, где столица, есть ли море, горы, реки, сколько примерно жителей."
              format: "Mi país está en… La capital… Tiene… millones de habitantes."
              words: [12, 60]
              sentences: 2
              checks:
                - label: "где: en el norte, en el centro, al sur de…"
                  any: [en el norte, en el sur, en el este, en el oeste, en el centro, al norte, al sur, al este, al oeste, en la costa]
                - label: "жители: millones de habitantes"
                  any: [millones, millón, habitantes]
              sample: "Ucrania está en el este de Europa. La capital, Kiev, está en el centro y tiene un río muy grande. En el sur hay costa y playas. Tiene más de treinta millones de habitantes."
              sample_ru: "Украина находится на востоке Европы. Столица, Киев, — в центре, через неё течёт большая река. На юге есть побережье и пляжи. Жителей — больше тридцати миллионов."
    quiz:
      - q: "Sevilla está ___ sur de España."
        options: "en el | al | del"
        explain: "Внутри страны — en el sur."
        skill: geografia
      - q: "Francia está ___ norte de España."
        options: "al | en el | del"
        explain: "Другая страна, снаружи — al norte de…"
        skill: geografia

  - id: tiempos
    kind: grammar
    title: "Todos los tiempos juntos"
    goal: выбрать нужное время в рассказе о стране и о себе
    version: 2
    blocks:
      - "В A2 вы прошли шесть способов говорить о времени. В рассказе о стране и о себе они встречаются вместе."
      - table:
          id: tiempos
          title: Какое время?
          rows:
            - ["presente — вообще, обычно, сейчас", "En México se come mucho maíz. — В Мексике едят много кукурузы."]
            - ["perfecto — сегодня, на этой неделе, в жизни", "Este año he viajado mucho. — В этом году я много путешествовал."]
            - ["indefinido — тогда-то, один раз", "En 2019 fui a México. — В 2019 году я ездил в Мексику."]
            - ["imperfecto — как было, обычно раньше", "De niño vivía en un pueblo. — В детстве я жил в деревне."]
            - ["ir a + инфинитив — планы", "El año que viene voy a ir a Argentina. — В следующем году я поеду в Аргентину."]
            - ["condicional — желание, совет", "Me gustaría vivir en Barcelona. — Я бы хотел жить в Барселоне."]
      - choose:
          title: Выберите время
          skill: tiempos_a2
          rule: tiempos
          items:
            - q: "En dos mil diecinueve ___ a México por primera vez."
              options: "fui | iba | he ido"
              explain: "Год — разовое событие в прошлом: fui."
            - q: "Cuando ___ pequeño, pasaba los veranos en la playa."
              options: "era | fui | he sido"
              explain: "Как было в детстве — era."
            - q: "Esta semana ___ dos películas mexicanas."
              options: "he visto | vi | veía"
              explain: "Esta semana — perfecto: he visto."
            - q: "El año que viene ___ a estudiar en Argentina."
              options: "voy | fui | iba"
              explain: "Планы — ir a + инфинитив: voy a estudiar."
            - q: "Algún día me ___ vivir un año en Latinoamérica."
              options: "gustaría | gustó | gustaba"
              explain: "Желание на будущее — me gustaría."
      - write:
          title: Поставьте глагол
          format: одна-две формы глагола
          skill: tiempos_a2
          rule: tiempos
          items:
            - q: "Ayer (yo, conocer) ___ a un chico de Colombia."
              a: "conocí"
              explain: "Ayer — indefinido: conocí."
            - q: "De niña (yo, vivir) ___ cerca del mar."
              a: "vivía"
              explain: "Как было — imperfecto: vivía."
            - q: "Hoy (nosotros, comer) ___ en un restaurante mexicano."
              a: "hemos comido"
              explain: "Hoy — perfecto: hemos comido."
              mistakes:
                "comimos": "Hoy в Испании — perfecto: **hemos comido**."
            - q: "En Colombia (hablar) ___ español."
              a: "se habla | hablan"
              explain: "Вообще, всегда — presente: se habla."
      - choose:
