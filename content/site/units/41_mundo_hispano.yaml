                sample: "Se come mucha sopa y mucho pan, y se toma mucho té."
                sample_ru: "Едят много супа и хлеба, пьют много чая."
            - say: "¡Qué interesante! ¿Y qué fiesta te gusta más? | Как интересно! А какой праздник тебе нравится больше всего?"
