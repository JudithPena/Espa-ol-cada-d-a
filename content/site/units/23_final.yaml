id: final
number: 23
level: A1
title: Финал
goals:
  - повторить весь курс
  - прочитать связный текст на испанском без словаря
  - проверить себя в итоговом тесте

lessons:
  - id: repaso
    kind: review
    title: "Большое повторение A1: неделя в Севилье"
    goal: провести неделю в испанском городе — от гостиницы до звонка домой — на материале всего курса
    version: 2
    blocks:
      - "Вы на финишной прямой! Новых слов нет: всё, что нужно, вы уже знаете. Проведите неделю в Севилье — шесть ситуаций подряд."
      - mission:
          id: hotel
          title: Гостиница
          text: "Вы прилетели в Севилью и приехали в гостиницу."
      - choose:
          source: hotel
          items:
            - lines: ["Recepcionista: Buenas tardes. ¿Cómo se llama usted?"]
              q: "Вас зовут Марта Лопес."
              options: "Me llamo Marta López. | Se llama Marta López. | Soy llamo Marta López."
              skill: me_llamo
            - lines: ["Recepcionista: Su habitación es la número doce, en el segundo piso."]
              q: "Какая у вас комната?"
              options: "№ 12 на втором этаже | № 12 на первом этаже | № 2 на двенадцатом этаже"
              skill: numbers
      - mission:
          id: camino
          title: Дорога в музей
          text: "Утром вы идёте в музей и спрашиваете дорогу у сеньоры."
      - build:
          source: camino
          skill: directions
          items:
            - es: "Perdone, ¿dónde está el museo?"
              ru: "Вежливо спросите: «Извините, где музей?»"
              extra: [perdona]
      - choose:
          source: camino
          skill: directions
          items:
            - say: "Todo recto y la segunda calle a la izquierda. Está cerca."
              q: "Как пройти?"
              options: "прямо и вторая улица налево, это близко | прямо и первая улица направо, это далеко | вторая улица направо, это близко"
              noaudio: {q: "Как пройти: «Todo recto y la segunda calle a la izquierda. Está cerca»?", options: "прямо и вторая улица налево, это близко | прямо и первая улица направо, это далеко | вторая улица направо, это близко"}
      - mission:
          id: comida
          title: Обед в баре
          text: "После музея вы голодны. Вы в баре."
      - choose:
          source: comida
          skill: order_food
          items:
            - lines: ["Camarero: Hola. ¿Qué quiere tomar?"]
              q: "Вы хотите пить и есть: сок и бутерброд с хамоном."
              options: "Un zumo y un bocadillo de jamón, por favor. | Tengo sed y un bocadillo, por favor. | Para mí, la cuenta, por favor."
      - write:
          source: comida
          skill: order_food
          items:
            - q: "Вы поели. Попросите счёт."
              a: "La cuenta, por favor | Perdone, la cuenta, por favor"
              format: фраза по-испански
      - mission:
          id: tienda
          title: Магазин
          text: "Вечером вы покупаете футболку в подарок брату."
      - choose:
          source: tienda
          items:
            - lines: ["Dependienta: ¿Qué busca?"]
              options: "Busco una camiseta para mi hermano. | Busco un camiseta para mi hermano. | Busco una camiseta de mi hermano."
              skill: shopping
            - say: "Esta cuesta veinticinco euros."
              q: "Сколько стоит футболка?"
              options: "25 € | 35 € | 52 €"
              noaudio: {q: "Сколько стоит футболка: «Esta cuesta veinticinco euros»?", options: "25 € | 35 € | 52 €"}
              skill: [numbers_ear, prices]
      - mission:
          id: farmacia
          title: Аптека
          text: "Утром у вас болит голова. Вы в аптеке."
      - write:
          source: farmacia
          skill: doler
          items:
            - q: "Скажите: «У меня болит голова»."
              a: "Me duele la cabeza | Me duele mucho la cabeza"
              format: фраза по-испански
              mistakes: {"me duele mi cabeza": "С частями тела — артикль: me duele **la** cabeza."}
      - choose:
          source: farmacia
          skill: doctor
          items:
            - lines: ["Farmacéutico: Tome una pastilla dos veces al día. ¡Que se mejore!"]
              options: "Muchas gracias. | ¡Que te mejores! | Lo siento."
      - mission:
          id: llamada
          title: Звонок домой
          text: "Вечером вы звоните маме и рассказываете о неделе: что вы уже сделали, что делаете сейчас и что будете делать завтра."
      - choose:
          source: llamada
          items:
            - lines: ["Madre: ¿Qué has hecho esta semana?"]
              options: "He visitado un museo y he comprado una camiseta. | Visito un museo y compro una camiseta. | Voy a visitar un museo."
              explain: "О том, что уже сделано на этой неделе, — haber + причастие."
              skill: perfect
            - lines: ["Madre: ¿Y qué estás haciendo ahora?"]
              options: "Estoy descansando en el hotel. | Descanso siempre en el hotel. | He descansado en el hotel."
              skill: estar_gerund
      - write:
          source: llamada
          skill: [ir_a_inf, transport]
          items:
            - q: "Madre: ¿Y mañana? — «Завтра я поеду в Мадрид на поезде»."
              a: "Mañana voy a ir a Madrid en tren | Voy a ir a Madrid en tren | Mañana voy a Madrid en tren"
              format: фраза по-испански
              mistakes: {"mañana voy a ir a madrid en el tren": "Перед транспортом артикль не ставят: **en tren**.", "mañana voy ir a madrid en tren": "После ir нужно **a**: voy a ir."}

  - id: lectura
    kind: reading
    title: Неделя в Мадриде
    goal: прочитать связный текст без словаря и найти в нём всё, что вы прошли
    version: 2
    vocab:
      - "📦 la cosa [ко́са] — вещь, дело"
      - "🚶 pasear [пасэа́р] — гулять :: Paseo por el parque. — Я гуляю по парку."
    blocks:
      - learn: [la cosa, pasear]
      - "Итоговый текст курса: в нём собрано почти всё, что вы прошли."
      - reading:
          id: madrid
          title: Una semana en Madrid
          text: |
            ¡Hola! Me llamo Irina y ahora mismo estoy en Madrid con mi novio. Es mi primer viaje a España.

            Esta semana hemos visto muchas cosas: hemos visitado el museo del Prado, hemos paseado por el parque del Retiro y hemos comido tapas en muchos bares. ¡Me encanta la comida española!

            Madrid es una ciudad muy grande y muy bonita. Hay mucha gente en las calles, también por la noche. Aquí la gente cena muy tarde, a las diez o a las once.

            Hoy hace mucho calor: ¡treinta y ocho grados! Por eso ahora estamos descansando en el hotel.

            Mañana vamos a ir a Toledo en tren. El sábado tenemos que volver a Kiev. ¡Pero el año que viene voy a volver a España!
          translation: |
            Привет! Меня зовут Ирина, и прямо сейчас я в Мадриде с моим парнем. Это моя первая поездка в Испанию.

            На этой неделе мы видели много всего: побывали в музее Прадо, погуляли по парку Ретиро и ели тапас во многих барах. Я обожаю испанскую еду!

            Мадрид — очень большой и очень красивый город. На улицах много людей, даже ночью. Здесь ужинают очень поздно, в десять или в одиннадцать.

            Сегодня очень жарко: тридцать восемь градусов! Поэтому сейчас мы отдыхаем в гостинице.

            Завтра мы поедем в Толедо на поезде. В субботу нам нужно возвращаться в Киев. Но в следующем году я снова поеду в Испанию!
      - more:
          title: por eso
          text: "**por eso** — «поэтому»: _Hoy hace mucho calor. Por eso estamos en el hotel._ _Me encanta España. Por eso estudio español._"
      - choose:
          title: Responde
          source: madrid
          rule: none
          items:
            - q: "¿Por qué están ahora en el hotel?"
              options: "Porque hace mucho calor. | Porque llueve. | Porque están enfermos."
              explain: "Hoy hace mucho calor: ¡treinta y ocho grados! Por eso ahora estamos descansando en el hotel."
            - q: "Что значит «Esta semana hemos visto muchas cosas»?"
              options: "На этой неделе мы видели много всего. | На этой неделе мы купили много вещей. | На этой неделе мы ничего не видели."
              explain: "cosa — и «вещь», и «дело»: muchas cosas — «много всего»."
            - q: "¿Qué ha visitado Irina esta semana?"
              options: "El museo del Prado y el parque del Retiro. | Toledo y Sevilla. | Muchos hoteles."
            - q: "¿Qué tiempo hace hoy?"
              options: "Hace mucho calor: treinta y ocho grados. | Hace frío y llueve. | Hace buen tiempo: veinte grados."
            - q: "¿Qué van a hacer mañana?"
              options: "Van a ir a Toledo en tren. | Van a volver a Kiev. | Van a descansar en el hotel."
      - sort:
          title: Найдите в тексте всё, что вы прошли
          source: madrid
          rule: none
          groups:
            "⚡ ahora (estar + герундий)": [estamos descansando]
            "✅ esta semana (haber)": [hemos visto, hemos paseado]
            "🔜 planes (ir a)": [vamos a ir, voy a volver]
            "❗ tener que": [tenemos que volver]
    forms: [eso]
    quiz:
      - q: ¿Qué le encanta a Irina?
        options: "la comida española | el calor | el tren"
        source: madrid
      - q: ¿A qué hora cena la gente en Madrid?
        options: "a las diez o a las once | a las siete | a las ocho"
        source: madrid

  - id: examen
    kind: final
    title: Итоговый тест A1
    goal: проверить грамматику всего курса — двенадцать вопросов
    version: 2
    # Контроль уровня A1 (docs/a0_a1_fixes_plan.md, раздел 4): порог 80 %, ошибки не переспрашиваются,
    # у каждого вопроса — навык: по ним экран результата показывает сильные и слабые темы со ссылками на уроки.
    check: control
    auto_quiz: 2
    blocks:
      - "Итоговый тест по всему курсу: двенадцать вопросов по грамматике. Чтобы завершить уровень A1, нужно 80 %."
      - choose:
          title: Итоговый тест A1
          items:
            - q: "— ¿Cómo te llamas? — ..."
              options: "Me llamo Irina. | Soy llamo Irina. | Mi llamo Irina."
              explain: "Глагол llamarse возвратный, поэтому перед ним ставится местоимение: _me llamo, te llamas, se llama_."
              skill: me_llamo
            - q: "Ella ___ ucraniana, pero ahora ___ en Madrid."
              options: "es / está | está / es | es / es"
              explain: "Когда говорят о происхождении, используют ser: _es ucraniana_. А когда говорят, где человек находится сейчас, используют estar: _está en Madrid_."
              skill: ser_estar
            - q: "En la mesa ___ dos libros."
              options: "hay | están | son"
              explain: "Если вы сообщаете, что где-то что-то есть, то используйте **hay**. Эта форма не меняется: _hay un libro, hay dos libros_."
              skill: hay
            - q: "Nosotros ___ en una oficina."
              options: "trabajamos | trabajan | trabajáis"
              explain: "С местоимением nosotros глагол на -ar получает окончание -amos: _trabajamos, hablamos, estudiamos_."
              skill: present_ar
            - q: "Mis hermanas son muy ___"
              options: "simpáticas | simpáticos | simpática"
              explain: "Прилагательное согласуется с существительным в роде и числе. Слово hermanas стоит в женском роде и во множественном числе, поэтому нужно _simpáticas_."
              skill: adj_agreement
            - q: "A mí me ___ las tapas."
              options: "encantan | encanta | encanto"
              explain: "Как и в случае с gustar, форма зависит от того, что нравится. Слово tapas стоит во множественном числе, поэтому нужно _me encantan_."
              skill: encanta
            - q: "¿Cuánto ___ estos zapatos?"
              options: "cuestan | cuesta | costan"
              explain: "У глагола costar в корне `o` превращается в `ue`, а слово zapatos стоит во множественном числе. Поэтому правильно сказать _cuestan_."
              skill: prices
            - q: "¿A qué hora ___ normalmente? (ты встаёшь)"
              options: "te levantas | se levanta | levantas te"
              explain: "Глагол levantarse возвратный. Если вы обращаетесь на «ты», то нужно местоимение te, и оно ставится перед глаголом: _te levantas_."
              skill: reflexive
            - q: "Hoy hace ___ frío."
              options: "mucho | muy | mucha"
              explain: "Здесь frío является существительным, поэтому перед ним ставится _mucho_: _hace mucho frío, hace mucho calor_. А muy ставится перед прилагательными: _muy bonito_."
              skill: muy_mucho
            - q: "Mañana ___ visitar el museo."
              options: "voy a | he | estoy"
              explain: "Если вы говорите о планах, то используйте ir a с инфинитивом: _Mañana voy a visitar el museo._"
              skill: ir_a_inf
            - q: "Ahora mismo ___ (yo, comer)."
              options: "estoy comiendo | estoy comer | soy comiendo"
              explain: "Если действие происходит прямо сейчас, то нужен глагол estar с герундием: _estoy comiendo_."
              skill: estar_gerund
            - q: "Esta semana ___ dos películas."
              options: "hemos visto | hemos vido | estamos visto"
              explain: "У глагола ver неправильное причастие **visto**, поэтому правильно сказать _hemos visto_."
              skill: participle

  - id: fin
    kind: finale
    title: ¡Enhorabuena!
    goal: увидеть, чему вы научились за курс, и выбрать, что делать дальше
    version: 2
    vocab:
      - "🎉 ¡Enhorabuena! [энорабуэ́на] — поздравляю! поздравляем!"
      - "🍀 ¡Mucha suerte! [му́ча суэ́ртэ] — удачи!"
    blocks:
      - "**¡Enhorabuena!** Вы прошли путь от первого **¡Hola!** до уровня **A1**: больше шестисот слов и выражений, двадцать три темы, сотни заданий — маленькими шагами, день за днём."
      - learn: ["¡Enhorabuena!", "¡Mucha suerte!"]
      - cando:
          - "познакомиться и рассказать о себе, о семье, о работе и учёбе: _Me llamo Ana, soy de Ucrania y trabajo en una oficina._"
          - "описать людей, свой дом и город: _Mi hermano es alto y moreno. Mi casa tiene tres habitaciones._"
          - "спросить дорогу и поехать на транспорте: _¿Dónde está la estación? Voy en metro._"
          - "заказать еду в кафе и сделать покупки: _Un café con leche, por favor. ¿Cuánto cuesta?_"
          - "договориться о встрече, рассказать о хобби и планах: _¿Quedamos mañana? Me gusta nadar. Voy a viajar a España._"
          - "рассказать, что вы сделали сегодня и что делаете сейчас: _Hoy he trabajado mucho. Ahora estoy descansando._"
          - "объясниться у врача: _Me duele la cabeza._"
      - header:
          slide: new
          text: Что дальше?
      - list:
          - "🔁 **Повторяйте**: во вкладке «Повторить» — слова и «Фразы и конструкции» из пройденных уроков."
          - "🎬 **Смотрите и слушайте**: сериалы и видео для начинающих с испанскими субтитрами, песни на испанском; на главной есть «Разбор видео»."
          - "💬 **Говорите**: найдите партнёра для языкового обмена — анкету о себе вы уже умеете написать."
          - "📝 **Проверьте уровень**: Институт Сервантеса проводит международный экзамен DELE A1. Курс даёт лексику и грамматику этого уровня; к экзамену отдельно тренируйте аудирование, письмо и устную речь."
          - "📚 **Переходите к A2**: прошедшие времена, сравнения, советы и инструкции."
      - choose:
          title: Последнее задание
          rule: none
          items:
            - lines: ["Profesora: ¡Enhorabuena! Ya has terminado las lecciones de A1."]
              options: "¡Muchas gracias! | ¡Que te mejores! | Lo siento."
            - q: "Как пожелать другу удачи?"
              options: "¡Mucha suerte! | ¡Que te mejores! | ¡Enhorabuena!"
