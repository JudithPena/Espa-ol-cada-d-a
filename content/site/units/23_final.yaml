id: final
number: 23
level: A1
title: Финал
goals:
  - повторить весь курс
  - прочитать связный текст на испанском без словаря
  - проверить себя в итоговом тесте

lessons:
  - id: repaso
    kind: review
    title: "Большое повторение A1: неделя в Севилье"
    goal: провести неделю в испанском городе — от гостиницы до звонка домой — на материале всего курса
    version: 2
    blocks:
      - "Вы на финишной прямой! Новых слов нет: всё, что нужно, вы уже знаете. Проведите неделю в Севилье — шесть ситуаций подряд."
      - mission:
          id: hotel
          title: Гостиница
          text: "Вы прилетели в Севилью и приехали в гостиницу."
      - choose:
          source: hotel
          items:
            - lines: ["Recepcionista: Buenas tardes. ¿Cómo se llama usted?"]
              q: "Вас зовут Марта Лопес."
              options: "Me llamo Marta López. | Se llama Marta López. | Soy llamo Marta López."
              skill: me_llamo
            - lines: ["Recepcionista: Su habitación es la número doce, en el segundo piso."]
              q: "Какая у вас комната?"
              options: "№ 12 на втором этаже | № 12 на первом этаже | № 2 на двенадцатом этаже"
              skill: numbers
      - mission:
          id: camino
          title: Дорога в музей
          text: "Утром вы идёте в музей и спрашиваете дорогу у сеньоры."
      - build:
          source: camino
          skill: directions
          items:
            - es: "Perdone, ¿dónde está el museo?"
              ru: "Вежливо спросите: «Извините, где музей?»"
              extra: [perdona]
      - choose:
          source: camino
          skill: directions
          items:
            - say: "Todo recto y la segunda calle a la izquierda. Está cerca."
              q: "Как пройти?"
              options: "прямо и вторая улица налево, это близко | прямо и первая улица направо, это далеко | вторая улица направо, это близко"
              noaudio: {q: "Как пройти: «Todo recto y la segunda calle a la izquierda. Está cerca»?", options: "прямо и вторая улица налево, это близко | прямо и первая улица направо, это далеко | вторая улица направо, это близко"}
      - mission:
          id: comida
          title: Обед в баре
          text: "После музея вы голодны. Вы в баре."
      - choose:
          source: comida
          skill: order_food
          items:
            - lines: ["Camarero: Hola. ¿Qué quiere tomar?"]
              q: "Вы хотите пить и есть: сок и бутерброд с хамоном."
              options: "Un zumo y un bocadillo de jamón, por favor. | Tengo sed y un bocadillo, por favor. | Para mí, la cuenta, por favor."
      - write:
          source: comida
          skill: order_food
          items:
            - q: "Вы поели. Попросите счёт."
              a: "La cuenta, por favor | Perdone, la cuenta, por favor"
              format: фраза по-испански
      - mission:
          id: tienda
          title: Магазин
          text: "Вечером вы покупаете футболку в подарок брату."
      - choose:
          source: tienda
          items:
            - lines: ["Dependienta: ¿Qué busca?"]
              options: "Busco una camiseta para mi hermano. | Busco un camiseta para mi hermano. | Busco una camiseta de mi hermano."
              skill: shopping
            - say: "Esta cuesta veinticinco euros."
              q: "Сколько стоит футболка?"
              options: "25 € | 35 € | 52 €"
              noaudio: {q: "Сколько стоит футболка: «Esta cuesta veinticinco euros»?", options: "25 € | 35 € | 52 €"}
              skill: [numbers_ear, prices]
      - mission:
          id: farmacia
          title: Аптека
          text: "Утром у вас болит голова. Вы в аптеке."
      - write:
          source: farmacia
          skill: doler
          items:
            - q: "Скажите: «У меня болит голова»."
              a: "Me duele la cabeza | Me duele mucho la cabeza"
              format: фраза по-испански
              mistakes: {"me duele mi cabeza": "С частями тела — артикль: me duele **la** cabeza."}
      - choose:
          source: farmacia
          skill: doctor
          items:
            - lines: ["Farmacéutico: Tome una pastilla dos veces al día. ¡Que se mejore!"]
              options: "Muchas gracias. | ¡Que te mejores! | Lo siento."
      - mission:
          id: llamada
          title: Звонок домой
          text: "Вечером вы звоните маме и рассказываете о неделе: что вы уже сделали, что делаете сейчас и что будете делать завтра."
      - choose:
          source: llamada
          items:
            - lines: ["Madre: ¿Qué has hecho esta semana?"]
              options: "He visitado un museo y he comprado una camiseta. | Visito un museo y compro una camiseta. | Voy a visitar un museo."
              explain: "О том, что уже сделано на этой неделе, — haber + причастие."
              skill: perfect
            - lines: ["Madre: ¿Y qué estás haciendo ahora?"]
              options: "Estoy descansando en el hotel. | Descanso siempre en el hotel. | He descansado en el hotel."
              skill: estar_gerund
      - write:
          source: llamada
          skill: [ir_a_inf, transport]
          items:
            - q: "Madre: ¿Y mañana? — «Завтра я поеду в Мадрид на поезде»."
              a: "Mañana voy a ir a Madrid en tren | Voy a ir a Madrid en tren | Mañana voy a Madrid en tren"
              format: фраза по-испански
              mistakes: {"mañana voy a ir a madrid en el tren": "Перед транспортом артикль не ставят: **en tren**.", "mañana voy ir a madrid en tren": "После ir нужно **a**: voy a ir."}

  - id: lectura
    kind: reading
    title: Неделя в Мадриде
    goal: прочитать связный текст без словаря и найти в нём всё, что вы прошли
    version: 3
    vocab:
      - "📦 la cosa [ко́са] — вещь, дело"
      - "🚶 pasear [пасэа́р] — гулять :: Paseo por el parque. — Я гуляю по парку."
    blocks:
      - learn: [la cosa, pasear]
      - "Итоговый текст курса: в нём собрано почти всё, что вы прошли."
      - reading:
          id: madrid
          title: Una semana en Madrid
          text: |
            ¡Hola! Me llamo Natalia y ahora mismo estoy en Madrid con mi novio. Es mi primer viaje a España.

            Esta semana hemos visto muchas cosas: hemos visitado el museo del Prado, hemos paseado por el parque del Retiro y hemos comido tapas en muchos bares. ¡Me encanta la comida española!

            Madrid es una ciudad muy grande y muy bonita. Hay mucha gente en las calles, también por la noche. Aquí la gente cena muy tarde, a las diez o a las once.

            Hoy hace mucho calor: ¡treinta y ocho grados! Por eso ahora estamos descansando en el hotel.

            Mañana vamos a ir a Toledo en tren. El sábado tenemos que volver a Kiev. ¡Pero el año que viene voy a volver a España!
          translation: |
            Привет! Меня зовут Наталья, и прямо сейчас я в Мадриде с моим парнем. Это моя первая поездка в Испанию.

            На этой неделе мы видели много всего: побывали в музее Прадо, погуляли по парку Ретиро и ели тапас во многих барах. Я обожаю испанскую еду!

            Мадрид — очень большой и очень красивый город. На улицах много людей, даже ночью. Здесь ужинают очень поздно, в десять или в одиннадцать.

            Сегодня очень жарко: тридцать восемь градусов! Поэтому сейчас мы отдыхаем в гостинице.

            Завтра мы поедем в Толедо на поезде. В субботу нам нужно возвращаться в Киев. Но в следующем году я снова поеду в Испанию!
      - more:
          title: por eso
          text: "**por eso** — «поэтому»: _Hoy hace mucho calor. Por eso estamos en el hotel._ _Me encanta España. Por eso estudio español._"
      - choose:
          title: Responde
          source: madrid
          rule: none
          items:
            - q: "¿Por qué están ahora en el hotel?"
              options: "Porque hace mucho calor. | Porque llueve. | Porque están enfermos."
              explain: "Hoy hace mucho calor: ¡treinta y ocho grados! Por eso ahora estamos descansando en el hotel."
            - q: "Что значит «Esta semana hemos visto muchas cosas»?"
              options: "На этой неделе мы видели много всего. | На этой неделе мы купили много вещей. | На этой неделе мы ничего не видели."
              explain: "cosa — и «вещь», и «дело»: muchas cosas — «много всего»."
            - q: "¿Qué ha visitado Natalia esta semana?"
              options: "El museo del Prado y el parque del Retiro. | Toledo y Sevilla. | Muchos hoteles."
            - q: "¿Qué tiempo hace hoy?"
              options: "Hace mucho calor: treinta y ocho grados. | Hace frío y llueve. | Hace buen tiempo: veinte grados."
            - q: "¿Qué van a hacer mañana?"
              options: "Van a ir a Toledo en tren. | Van a volver a Kiev. | Van a descansar en el hotel."
      - sort:
          title: Найдите в тексте всё, что вы прошли
          source: madrid
          rule: none
          groups:
            "⚡ ahora (estar + герундий)": [estamos descansando]
            "✅ esta semana (haber)": [hemos visto, hemos paseado]
            "🔜 planes (ir a)": [vamos a ir, voy a volver]
            "❗ tener que": [tenemos que volver]
      - choose:
          title: Послушайте и выберите
          free: true
          skill: weather
          items:
            - say: "Mañana vamos a ir a Toledo."
              options: "Завтра мы поедем в Толедо. | Вчера мы были в Толедо. | Завтра мы поедем в Мадрид."
              noaudio: {q: "Что значит «Mañana vamos a ir a Toledo.»?", options: "Завтра мы поедем в Толедо. | Вчера мы были в Толедо. | Завтра мы поедем в Мадрид."}
            - say: "Hoy hace mucho calor."
              options: "Сегодня очень жарко. | Сегодня очень холодно. | Сегодня немного жарко."
              noaudio: {q: "Что значит «Hoy hace mucho calor.»?", options: "Сегодня очень жарко. | Сегодня очень холодно. | Сегодня немного жарко."}
    forms: [eso]
    quiz:
      - q: ¿Qué le encanta a Natalia?
        options: "la comida española | el calor | el tren"
        source: madrid
      - q: ¿A qué hora cena la gente en Madrid?
        options: "a las diez o a las once | a las siete | a las ocho"
        source: madrid

  - id: examen
    kind: final
    title: Итоговый тест A1
    goal: показать всё, что умеете на уровне A1, — на слух, в чтении и своими словами
    version: 3
    # Контроль уровня A1 (аудит MYTHOS, этап 5: SYS-06, U23-01). 30 заданий: слух 6, чтение 4, ввод 8, сборка,
    # пересказ и исправление 4, выбор формы 8 — 15 навыков по 2 задания (14 из спецификации и анкета: урок
    # «Анкета» перенесён в A1, тема 10). У каждого задания есть вариант (variants): при пересдаче показывается он.
    # Порог 80 %, ошибки не переспрашиваются.
    check: control
    allow: [Alcalá, C]   # C/ Alcalá — так сокращают calle в адресе
    blocks:
      - "🏁 **Итоговый тест A1.** Чтобы завершить уровень, наберите 80 %."
      - choose:
          title: Послушайте и выберите
          items:
            - say: "Hoy no voy al trabajo: voy al médico y después a la farmacia."
              q: "Куда идёт говорящий?"
              options: "к врачу, потом в аптеку | на работу, потом в аптеку | в аптеку, потом к врачу"
              explain: "Сначала al médico — к врачу, потом a la farmacia — в аптеку. Al trabajo — на работу — сегодня нет."
              skill: ir_a
              noaudio: {q: "«Hoy no voy al trabajo: voy al médico y después a la farmacia.» Куда идёт говорящий?", options: "к врачу, потом в аптеку | на работу, потом в аптеку | в аптеку, потом к врачу"}
              variants:
                - say: "El sábado vamos al cine y después a un bar del centro."
                  q: "Куда идут говорящие в субботу?"
                  options: "в кино, потом в бар | в бар, потом в кино | в кино, потом в парк"
                  explain: "Vamos al cine y después a un bar — сначала в кино, потом в бар."
                  noaudio: {q: "«El sábado vamos al cine y después a un bar del centro.» Куда идут говорящие в субботу?", options: "в кино, потом в бар | в бар, потом в кино | в кино, потом в парк"}
      - write:
          title: Ответьте по-испански
          items:
            - q: "Ana: ¿Adónde vas? — Ответьте: вы идёте в банк, а потом — в супермаркет."
              a: "(Yo) (primero) voy al banco y [luego/después] (voy) al supermercado | (Yo) voy al banco y al supermercado"
              format: фраза по-испански
              skill: ir_a
              mistakes: {"voy a el banco y luego a el supermercado": "a + el = **al**: voy al banco, al supermercado.", "voy en el banco y luego en el supermercado": "Куда — **a**: voy al banco."}
              variants:
                - q: "Ana: ¿Adónde vas? — Ответьте: вы идёте в библиотеку, а потом — на рынок."
                  a: "(Yo) (primero) voy a la biblioteca y [luego/después] (voy) al mercado | (Yo) voy a la biblioteca y al mercado"
                  mistakes: {"voy al biblioteca y luego al mercado": "Biblioteca — женского рода: a **la** biblioteca.", "voy a la biblioteca y luego a el mercado": "a + el = **al**: al mercado."}
      - choose:
          title: Выберите
          items:
            - q: "— ¿___ un banco por aquí? — Sí, ___ al lado de la estación."
              options: "Hay / está | Está / hay | Hay / hay"
              explain: "Есть ли где-то что-то — hay. Где находится уже названный банк — está."
              skill: hay_esta
              variants:
                - q: "En mi barrio ___ dos supermercados, y uno ___ al lado de mi casa."
                  options: "hay / está | están / hay | hay / hay"
                  explain: "Сколько чего есть — hay. Где находится один из них — está."
            - q: "Ella ___ ucraniana, pero ahora ___ en Madrid."
              options: "es / está | está / es | es / es"
              explain: "Происхождение — ser: es ucraniana. Где человек сейчас — estar: está en Madrid."
              skill: ser_estar
              variants:
                - q: "Hoy ___ lunes y mis amigos ___ en la playa."
                  options: "es / están | está / son | es / son"
                  explain: "День недели — ser: hoy es lunes. Где люди находятся — estar: están en la playa."
            - q: "Tengo dos camisetas ___."
              options: "blancas | blancos | blanca"
              explain: "Camisetas — женского рода, множественное число: blancas."
              skill: adj_agreement
              variants:
                - q: "Pablo y Lucía son muy ___."
                  options: "trabajadores | trabajadoras | trabajador"
                  explain: "Мужчина и женщина вместе — мужской род, множественное число: trabajadores."
      - write:
          title: Ответьте по-испански
          items:
            - q: "Ana: ¿Dónde está el museo? — Ответьте: музей рядом с парком."
              a: "(El museo) está [al lado/cerca] del parque"
              format: фраза по-испански
              skill: hay_esta
              mistakes: {"hay al lado del parque": "Где находится музей — **está**: Está al lado del parque.", "está al lado de el parque": "de + el = **del**: al lado del parque.", "es al lado del parque": "Где находится — **estar**: está al lado del parque."}
              variants:
                - q: "Ana: ¿Hay una farmacia por aquí? — Ответьте: да, рядом с банком есть аптека."
                  a: "(Sí, )hay una (farmacia) [al lado/cerca] del banco | Sí, [al lado/cerca] del banco hay una (farmacia)"
                  mistakes: {"sí, está una farmacia al lado del banco": "Есть ли где-то что-то — **hay**: hay una farmacia.", "sí, hay una farmacia al lado de el banco": "de + el = **del**: al lado del banco."}
      - build:
          title: Соберите фразу
          items:
            - es: "Mis hermanas son altas y muy simpáticas."
              ru: "Мои сёстры высокие и очень симпатичные."
              extra: [altos, simpáticos]
              skill: adj_agreement
              variants:
                - es: "Tengo un coche rojo y dos bicis blancas."
                  ru: "У меня красная машина и два белых велосипеда."
                  extra: [roja, blancos]
      - write:
          title: Исправьте ошибку
          items:
            - q: "Исправьте ошибку: «Mi hermano es cansado hoy.»"
              a: "Mi hermano está cansado hoy | Hoy mi hermano está cansado"
              format: фраза по-испански
              skill: ser_estar
              mistakes: {"mi hermano es cansado hoy": "Состояние сейчас — **estar**: está cansado."}
              variants:
                - q: "Исправьте ошибку: «Marta está profesora.»"
                  a: "Marta es profesora"
                  mistakes: {"marta está profesora": "Профессия — **ser**: Marta es profesora."}
      - choose:
          title: Послушайте и выберите
          items:
            - say: "La clase empieza a las diez menos cuarto."
              q: "Во сколько начинается занятие?"
              options: "9:45 | 10:15 | 10:45"
              explain: "Diez menos cuarto — «десять без четверти», то есть 9:45."
              skill: [time, a_que_hora]
              noaudio: {q: "«La clase empieza a las diez menos cuarto.» Во сколько начинается занятие?", options: "9:45 | 10:15 | 10:45"}
              variants:
                - say: "El museo abre a las nueve y media y cierra a las seis."
                  q: "Во сколько открывается музей?"
                  options: "9:30 | 10:30 | 6:00"
                  explain: "Abre a las nueve y media — открывается в 9:30; cierra a las seis — закрывается в шесть."
                  noaudio: {q: "«El museo abre a las nueve y media y cierra a las seis.» Во сколько открывается музей?", options: "9:30 | 10:30 | 6:00"}
      - choose:
          title: Выберите
          items:
            - q: "Mis padres ___ en Sevilla y ___ mucho pescado."
              options: "viven / comen | vivís / coméis | vivimos / comemos"
              explain: "Mis padres — «они»: viven, comen."
              skill: present_er_ir
              variants:
                - q: "¿Vosotros ___ español en la escuela?"
                  options: "aprendéis | aprenden | aprendemos"
                  explain: "С vosotros у глагола на -er окончание -éis: aprendéis."
            - q: "A mis padres ___ mucho viajar."
              options: "les gusta | les gustan | le gusta"
              explain: "Нравится действие (viajar) — gusta. Нравится «им» — les: les gusta."
              skill: [gustar, gustar_pron]
              variants:
                - q: "¿A ti ___ las películas de miedo?"
                  options: "te gustan | te gusta | le gustan"
                  explain: "Películas — их много: gustan. «Тебе» — te: te gustan."
            - q: "En verano yo no ___ dormir bien."
              options: "puedo | podo | puedes"
              explain: "У poder в корне `o` → `ue`: puedo. Puedes — «ты можешь»."
              skill: stem_change
              variants:
                - q: "Mis hijos ___ a casa a las cinco."
                  options: "vuelven | volven | vuelve"
                  explain: "У volver в корне `o` → `ue`: vuelven. Hijos — их много, поэтому -en."
      - write:
          title: Ответьте по-испански
          items:
            - q: "Ana: ¿Te gusta el fútbol? — Ответьте: нет, но вам нравится баскетбол."
              a: "No, pero (a mí) me gusta el baloncesto"
              format: фраза по-испански
              skill: [gustar, gustar_pron]
              mistakes: {"no, pero me gusta baloncesto": "С gustar существительное идёт с артиклем: me gusta **el** baloncesto.", "no, pero me gustan el baloncesto": "Баскетбол — один: me **gusta**.", "no, pero yo gusto el baloncesto": "«Мне нравится» — **me gusta**."}
              variants:
                - q: "Ana: ¿Qué le gusta hacer a tu hermana? — Ответьте: ей нравится танцевать и петь."
                  a: "(A mi hermana) le gusta bailar y cantar | (A ella) le gusta bailar y cantar"
                  mistakes: {"le gustan bailar y cantar": "Нравятся действия (инфинитивы) — всё равно **gusta**: le gusta bailar y cantar.", "me gusta bailar y cantar": "О сестре — **le** gusta."}
            - q: "Ana: ¿A qué hora vuelves a casa? — Ответьте: вы возвращаетесь в семь."
              a: "(Yo) vuelvo (a casa) a las siete"
              format: фраза по-испански
              skill: stem_change
              mistakes: {"volvo a casa a las siete": "У volver в корне `o` → `ue`: vuelvo.", "vuelve a casa a las siete": "О себе — **vuelvo**."}
              variants:
                - q: "Camarero: ¿Qué quieren tomar? — Ответьте за себя и друга: мы хотим два кофе с молоком."
                  a: "(Nosotros) queremos dos cafés con leche(, por favor)"
                  mistakes: {"quieremos dos cafés con leche": "С nosotros корень не меняется: **queremos**.", "quiero dos cafés con leche": "За себя и друга — «мы»: **queremos**."}
      - write:
          title: Перескажите
          items:
            - q: "Перескажите о себе: «Mi hermano se levanta a las seis y se afeita.»"
              a: "(Yo) me levanto a las seis y me afeito"
