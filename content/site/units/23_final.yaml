      - reading:
          id: mensaje
          title: Laura escribe a Sara
          text: |
            ¡Hola, Sara! ¿Qué tal? Yo estoy bien, pero muy ocupada. Ahora mismo estoy esperando el autobús.

            Esta semana trabajo mucho. Me levanto a las siete, me ducho y desayuno un café con leche y una tostada. A las ocho y media salgo de casa. Como en la oficina y vuelvo a casa a las seis. Por la tarde leo o aprendo inglés.

            Hoy he terminado el trabajo temprano y he comprado unos zapatos. ¡Son muy bonitos! ¿Quedamos el sábado?

            Un beso,
            Laura
          translation: |
            Привет, Сара! Как дела? У меня всё хорошо, но я очень занята. Прямо сейчас я жду автобус.

            На этой неделе я много работаю. Встаю в семь, принимаю душ и завтракаю: кофе с молоком и тост. В половине девятого выхожу из дома. Обедаю в офисе и возвращаюсь домой в шесть. Вечером читаю или учу английский.

            Сегодня я рано закончила работу и купила туфли. Они очень красивые! Встретимся в субботу?

            Целую,
            Лаура
