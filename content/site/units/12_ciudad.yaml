id: ciudad
number: 12
level: A1
title: Город
goals:
  - назвать места в городе
  - сказать, куда и на чём вы едете
  - спросить дорогу и понять ответ

lessons:
  - id: vocab1
    kind: vocab
    title: Места в городе
    goal: назвать самые нужные места в городе
    version: 2
    vocab:
      - "🏙 la ciudad [θьуда́д] — город"
      - "🛣 la calle [ка́йе] — улица"
      - "🌳 el parque [па́ркэ] — парк"
      - "🛍 la tienda [тьэ́нда] — магазин"
      - "🛒 el supermercado [супэрмэрка́до] — супермаркет"
      - "💊 la farmacia [фарма́θья] — аптека"
      - "🏦 el banco [ба́нко] — банк"
      - "🖼 el museo [мусэ́о] — музей"
      - "🚉 la estación [эстаθьо́н] — вокзал; станция"
      - "🚏 la parada [пара́да] — остановка"
      - "🎬 el cine [θи́нэ] — кино; кинотеатр"
      - "🍷 el bar [бар] — бар, кафе"
      - "📚 la biblioteca [библьотэ́ка] — библиотека"
      - "🧺 el mercado [мэрка́до] — рынок"
      - "✈️ el aeropuerto [аэропуэ́рто] — аэропорт"
    blocks:
      - "Новая тема — город: аптека и банк, вокзал, кино и рынок."
      - learn: [la ciudad, la calle, el parque, la tienda, el supermercado]
      - tip: "В **calle** двойная `ll` читается как «й»: [ка́йе] — как в **paella** и **me llamo**."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la ciudad — город"
            - "la calle — улица"
            - "el parque — парк"
            - "la tienda — магазин"
            - "el supermercado — супермаркет"
      - learn: [la farmacia, el banco, el museo, la estación, la parada]
      - choose:
          title: "¿Dónde...?"
          skill: city_places
          items:
            - q: "Где покупают лекарства?"
              options: "En la farmacia. | En el banco. | En la parada."
            - q: "Где садятся на поезд?"
              options: "En la estación. | En el museo. | En la farmacia."
            - q: "Где ждут автобус?"
              options: "En la parada. | En el banco. | En el museo."
      - learn: [el cine, el bar, la biblioteca, el mercado, el aeropuerto]
      - note: "**el bar** в Испании — не ночной клуб, а обычное кафе, где завтракают, пьют кофе и едят тапас: _Hay un bar en la plaza._"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "el banco — банк"
            - "el museo — музей"
            - "el bar — бар, кафе"
            - "el aeropuerto — аэропорт"
            - "el cine — кинотеатр"
      - choose:
          title: "¿Dónde...?"
          rule: none
          skill: city_places
          items:
            - q: "Где смотрят фильмы?"
              options: "En el cine. | En la biblioteca. | En el mercado."
            - q: "Где берут книги?"
              options: "En la biblioteca. | En el bar. | En el aeropuerto."
            - q: "Где покупают фрукты на прилавках?"
              options: "En el mercado. | En el aeropuerto. | En el cine."
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - "В моём городе два супермаркета. => En mi ciudad hay dos supermercados | Hay dos supermercados en mi ciudad"
            - "Рядом с парком есть магазин. => Al lado del parque hay una tienda | Hay una tienda al lado del parque"
          rule: none
          skill: [city_places, hay]

  - id: ir
    kind: grammar
    title: "¿Adónde vas? Глагол ir"
    goal: сказать, куда вы идёте или едете
    version: 2
    vocab:
      - "🚶 ir [ир] — идти, ехать"
      - "❓ ¿Adónde vas? [адо́ндэ бас] — куда ты идёшь?"
      - "➡️ a [а] — в, на (куда); к :: Voy a la tienda. — Я иду в магазин."
      - "🤝 con [кон] — с :: Voy al cine con mi amiga. — Я иду в кино с подругой."
    blocks:
      - "Посмотрите на примеры с глаголом **ir** — «идти, ехать». Какой маленький предлог стоит после него?"
      - examples:
          items:
            - "¿Adónde vas? Voy a la farmacia. — Куда ты идёшь? В аптеку."
            - "Vamos al cine. — Мы идём в кино."
      - learn: [ir, "¿Adónde vas?", a, con]
      - conjugation:
          verb: ir
          ru: идти, ехать
          highlight: false
          forms: [voy, vas, va, vamos, vais, van]
      - write:
          title: Вставьте форму ir
          format: одна форма глагола ir
          skill: ir_a
          items:
            - "(yo) ___ al banco. => voy"
            - "Nosotros ___ a la biblioteca. => vamos"
            - "¿Adónde ___ (vosotros)? => vais"
      - compare:
          id: al
          cards:
            - head: a + el = al
              say: false
              label: куда
              tone: blue
              text: 'После **ir** — предлог **a**. С артиклем **el** они сливаются: **al**. С **la** — нет.'
              ex: ["Voy al cine.", "Vamos al parque.", "Voy a la farmacia."]
            - head: ¿dónde? / ¿adónde?
              label: где / куда
              tone: sun
              text: '**¿Dónde?** — «где?», с **estar**. **¿Adónde?** — «куда?», с **ir**.'
              ex: ["¿Dónde estás?", "¿Adónde vas?"]
      - choose:
          title: Выберите
          skill: ir_a
          items:
            - q: "Ellos van ___ museo."
              options: "al | a el | a la"
            - q: "¿___ estás? — En casa."
              options: "Dónde | Adónde"
            - q: "¿___ vas? — Al banco."
              options: "Adónde | Dónde"
            - lines: ["Ana: ¿Adónde vas?"]
              q: "Вы идёте в аптеку."
              options: "Voy a la farmacia. | Estoy en la farmacia. | Voy al farmacia."
              explain: "¿Adónde vas? — «куда ты идёшь?»: voy a… С la слияния нет — a la farmacia."
      - note: "**a casa** — «домой», **en casa** — «дома»: _Voy a casa._ _Estoy en casa._"
      - choose:
          title: Как сказать?
          skill: ir_a
          items:
            - q: "Я иду домой."
              options: "Voy a casa. | Voy en casa. | Estoy en casa."
      - build:
          title: Соберите фразу
          rule: al
          skill: ir_a
          items:
            - es: "Voy al cine con mi amiga."
              ru: "Я иду в кино с подругой."
              extra: [el]

  - id: transporte
    kind: vocab
    title: Транспорт
    goal: сказать, на чём вы едете
    version: 2
    vocab:
      - "🚇 el metro [мэ́тро] — метро"
      - "🚌 el autobús [аутобу́с] — автобус"
      - "🚗 el coche [ко́чэ] — машина, автомобиль"
      - "🚆 el tren [трэн] — поезд"
      - "🚲 la bici [би́θи] — велосипед (сокр. от la bicicleta)"
      - "🚶 a pie [а пьэ] — пешком"
      - "💼 el trabajo [траба́хо] — работа"
    blocks:
      - learn: [el metro, el autobús, el coche, el tren, la bici]
      - rule:
          id: en_transport
          text: "На чём вы едете — **en** + транспорт без артикля: _Voy en metro._ _Ana va en tren._ _Vamos en taxi._"
      - learn: [a pie, el trabajo]
      - rule:
          id: a_pie
          text: "А пешком — **a pie**: _Voy a pie._ _Vamos al parque a pie._"
      - more:
          title: 🌎 А в Латинской Америке?
          text: "Машину там называют **el carro** или **el auto**, автобус в Мексике — **el camión**, в Аргентине — **el colectivo**."
      - choose:
          title: Выберите
          skill: transport
          items:
            - q: "Voy al trabajo ___ metro."
              options: "en | a | con"
              rule: en_transport
            - q: "Vamos al parque ___: está cerca."
              options: "a pie | en pie | en coche"
              rule: a_pie
            - q: "Как сказать «на машине»?"
              options: "en coche | a coche | en el coche"
              rule: en_transport
            - q: "Как сказать «на поезде»?"
              options: "en tren | a tren | en el tren"
              rule: en_transport
            - say: "Ana va a la universidad en bici."
              options: "Ана ездит в университет на велосипеде. | Ана ездит в университет на автобусе. | Ана ходит в университет пешком."
              noaudio: {q: "Что значит «Ana va a la universidad en bici»?", options: "Ана ездит в университет на велосипеде. | Ана ездит в университет на автобусе. | Ана ходит в университет пешком."}
      - write:
          title: Traduce
          format: фраза по-испански
          items:
            - q: "Я еду на работу на автобусе."
              a: "Voy al trabajo en autobús | (Yo) voy [al trabajo en autobús/en autobús al trabajo]"
              rule: en_transport
              mistakes: {"voy al trabajo en el autobús": "Перед транспортом артикль не ставят: **en autobús**.", "voy a el trabajo en autobús": "a + el сливаются: **al** trabajo."}
            - q: "Мы идём в парк пешком."
              a: "Vamos al parque a pie | ([Nosotros/Nosotras]) vamos [al parque a pie/a pie al parque]"
              rule: a_pie
              mistakes: {"vamos al parque en pie": "Пешком — **a pie**."}
          skill: transport
    forms: [bicicleta, carro, auto, camión, colectivo]

  - id: direcciones
    kind: dialogue
    title: Как пройти?
    goal: спросить дорогу и понять ответ
    version: 2
    vocab:
      - "🙇 perdone [пэрдо́нэ] — извините (вежливо, чтобы обратиться)"
      - "📍 por aquí [пор аки́] — поблизости, здесь"
      - "⬆️ todo recto [то́до рэ́кто] — прямо"
      - "➡️ a la derecha [а ла дэрэ́ча] — направо, справа"
      - "⬅️ a la izquierda [а ла иθкьэ́рда] — налево, слева"
      - "1️⃣ primero/a [примэ́ро, примэ́ра] — первый"
      - "2️⃣ segundo/a [сэгу́ндо, сэгу́нда] — второй"
    blocks:
      - "Как вежливо начать разговор с незнакомым человеком: **Perdone, ¿hay... por aquí?**"
      - learn: [perdone, por aquí]
      - note:
          id: perdone
          text: "**perdón** — «простите», когда извиняются. **perdone** — «извините», чтобы вежливо обратиться к незнакомому человеку на «вы». К другу — **perdona**."
      - choose:
          title: Как обратиться?
          skill: directions
          items:
            - q: "Вы спрашиваете дорогу у пожилой сеньоры."
              options: "Perdone, ¿hay una farmacia por aquí? | Perdona, ¿hay una farmacia por aquí? | De nada, ¿hay una farmacia por aquí?"
              explain: "К незнакомому человеку — на «вы»: perdone. Perdona — к другу."
      - learn: [todo recto, a la derecha, a la izquierda, primero/a, segundo/a]
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "todo recto — прямо"
            - "a la derecha — направо"
            - "a la izquierda — налево"
            - "la primera calle — первая улица"
            - "la segunda calle — вторая улица"
      - dialogue:
          id: tom
          voices: {Señora: f}
          lines:
            - "Tom: Perdone, ¿hay una farmacia por aquí? | Извините, здесь поблизости есть аптека?"
            - "Señora: Sí, hay una farmacia en la calle Mayor. | Да, на улице Майор есть аптека."
            - "Tom: ¿Está lejos? | Это далеко?"
            - "Señora: No, está muy cerca. Todo recto y la primera calle a la derecha. | Нет, очень близко. Прямо и первая улица направо."
            - "Tom: ¿La primera a la derecha? | Первая направо?"
            - "Señora: Sí. La farmacia está al lado del banco. | Да. Аптека рядом с банком."
            - "Tom: ¿Y la estación de metro? | А станция метро?"
            - "Señora: La segunda calle a la izquierda, entre el cine y el supermercado. | Вторая улица налево, между кинотеатром и супермаркетом."
            - "Tom: ¡Muchas gracias! | Большое спасибо!"
            - "Señora: De nada. | Не за что."
      - choose:
          title: Поняли?
          source: tom
          skill: directions
          items:
            - q: "Как пройти к аптеке?"
              options: "Прямо и первая улица направо. | Прямо и вторая улица налево. | Первая улица налево."
            - q: "¿Dónde está la estación de metro?"
              options: "La segunda calle a la izquierda. | La primera calle a la derecha. | Al lado del banco."
      - mission:
          id: street
          title: Турист на вашей улице
          text: "Вы живёте на улице Майор и хорошо знаете район. Банк — прямо и вторая улица направо, аптека — между банком и кинотеатром. К вам подходит турист."
      - choose:
          source: street
          skill: directions
          items:
            - lines: ["Tom: Perdone, ¿hay un banco por aquí?"]
              options: "Sí, todo recto y la segunda calle a la derecha. | Sí, todo recto y la primera calle a la izquierda. | No, no hay bancos."
      - write:
          free: true
          skill: prepositions
          items:
            - q: "Tom: ¿Está lejos? — Ответьте: «Нет, очень близко»."
              a: "No, está muy cerca | No, muy cerca | No, está cerca"
              format: ответ по-испански
      - build:
          free: true
          skill: prepositions
          items:
            - es: "La farmacia está entre el banco y el cine."
              ru: "Tom: ¿Y la farmacia? — «Аптека между банком и кинотеатром»."
              extra: [de]
    forms: [perdona]

  - id: lectura
    kind: reading
    title: Mi barrio
    goal: понять описание района и рассказать о своём
    version: 2
    vocab:
      - "🏘 el barrio [ба́рьо] — район, квартал"
      - "😌 tranquilo/a [транки́ло, транки́ла] — спокойный, тихий"
      - "➕ mucho/a [му́чо, му́ча] — много (+ существительное) :: muchos bares — много баров"
      - "👥 la gente [хэ́нтэ] — люди"
    blocks:
      - learn: [el barrio, tranquilo/a, mucho/a, la gente]
      - text:
          id: gente
          text: "**la gente** («люди») — в единственном числе, поэтому и глагол рядом в единственном: _Hay mucha gente._ _La gente es muy simpática._"
      - choose:
          title: Выберите
          items:
            - q: "La gente ___ muy simpática."
              options: "es | son"
            - q: "En mi barrio hay ___ bares."
              options: "muchos | muchas | mucho"
      - reading:
          id: barrio
          title: Mi barrio
          text: |
            Me llamo Javier y vivo en Madrid, en un barrio del centro. Mi barrio es muy bonito, pero no es muy tranquilo: hay mucha gente, muchos bares y muchos restaurantes.

            En mi calle hay un supermercado, una farmacia y una tienda pequeña. Cerca de mi casa hay un parque y una biblioteca. La estación de metro está al lado del mercado.

            Voy al trabajo en metro. Mi amiga Clara vive lejos, en un barrio muy tranquilo. Ella va al trabajo en coche.
          translation: |
            Меня зовут Хавьер, я живу в Мадриде, в районе в центре. Мой район очень красивый, но не очень спокойный: много людей, много баров и ресторанов.

            На моей улице есть супермаркет, аптека и маленький магазин. Рядом с домом — парк и библиотека. Станция метро рядом с рынком.

            На работу я езжу на метро. Моя подруга Клара живёт далеко, в очень тихом районе. Она ездит на работу на машине.
      - choose:
          title: Responde
          source: barrio
          rule: none
          items:
            - q: "¿Es tranquilo el barrio de Javier?"
              options: "No, hay mucha gente. | Sí, es muy tranquilo. | Sí, no hay bares."
            - q: "¿Qué hay cerca de su casa?"
              options: "Un parque y una biblioteca. | Un museo y un cine. | El aeropuerto."
            - q: "¿Cómo va Clara al trabajo?"
              options: "En coche. | En metro. | A pie."
    quiz:
      - q: ¿Dónde está la estación de metro?
        options: "al lado del mercado | al lado del parque | en la calle de Javier"
        source: barrio
      - q: ¿Cómo es el barrio de Clara?
        options: "muy tranquilo | muy grande | muy bonito"
        source: barrio

  - id: quiz
    kind: quiz
    title: Город
    goal: назвать места в городе, сказать, куда и на чём вы едете, и спросить дорогу
    version: 2
    check: soft
    blocks:
      - "Это тест по теме «Город»."
      - cando:
          - "назвать места в городе"
          - "сказать, куда вы идёте: Voy al cine. Voy a la farmacia."
          - "сказать, на чём вы едете: Voy en metro. Voy en coche. Voy a pie."
          - "спросить дорогу и понять ответ"
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "la calle — улица"
            - "el banco — банк"
            - "el tren — поезд"
            - "a la izquierda — налево"
            - "el barrio — район"
    quiz:
      - q: "Mañana ___ al museo. (мы)"
        options: "vamos | van | vais"
        explain: "Местоимению nosotros («мы») соответствует форма vamos: Mañana vamos al museo."
        skill: ir_a
      - q: "Voy ___ parque."
        options: "al | a el | en el"
        explain: "Если после предлога a стоит артикль el, то они сливаются в одно слово al, поэтому правильно сказать: Voy al parque."
        skill: ir_a
      - q: Как сказать «на автобусе»?
        options: "en autobús | a autobús | en el autobús"
        explain: "Перед названием транспорта ставится предлог en, а артикль не нужен: en autobús, en metro, en coche."
        skill: transport
      - q: "¿___ vas? — Al banco."
        options: "Adónde | Dónde | Cómo"
        explain: "Здесь спрашивают «куда?», поэтому нужен вопрос ¿Adónde? А вопрос ¿Dónde? значит «где?»."
        skill: ir_a
      - q: Что значит «todo recto»?
        options: "прямо | направо | налево"
        skill: directions
      - q: Как вежливо обратиться к незнакомому человеку?
        options: "Perdone, ... | Perdón, ... | De nada, ..."
        explain: "Словом perdone вежливо обращаются к незнакомому человеку, а словом perdón извиняются."
        skill: directions

  - id: repaso
    kind: review
    title: Повторение
    goal: проверить себя по темам 9–12 — люди, дом, состояния, город
    version: 2
    blocks:
      - "Половина уровня A1 позади! Сегодня новых слов нет — только задания по темам 9–12."
      - match:
          title: Соедините пары
          rule: none
          pairs:
            - "alto — высокий"
            - "cansado — уставший"
            - "la nevera — холодильник"
            - "la farmacia — аптека"
            - "a la derecha — направо"
      - choose:
          title: Выберите
          rule: none
          items:
            - q: "Mi hermano ___ médico y ahora ___ en el hospital."
              options: "es / está | está / es | es / es"
              explain: "Профессия — ser, где находится — estar."
              skill: ser_estar
            - q: "En la cocina ___ una nevera nueva."
              options: "hay | está | es"
              skill: hay_esta
            - say: "Voy al trabajo en autobús, pero hoy voy a pie."
              options: "Обычно на автобусе, а сегодня пешком. | Обычно пешком, а сегодня на автобусе. | Сегодня на машине."
              noaudio: {q: "Что значит «Voy al trabajo en autobús, pero hoy voy a pie»?", options: "Обычно на автобусе, а сегодня пешком. | Обычно пешком, а сегодня на автобусе. | Сегодня на машине."}
              skill: transport
      - write:
          title: Напишите по-испански
          format: фраза по-испански
          rule: none
          items:
            - {q: "¿Dónde ___ las llaves?", a: "están", format: одна форма глагола, skill: hay_esta}
            - {q: "Мои подруги очень весёлые.", a: "Mis amigas son muy divertidas", skill: adj_agreement}
            - {q: "Я иду в банк.", a: "Voy al banco", skill: ir_a, mistakes: {"voy a el banco": "a + el сливаются: **al** banco."}}
