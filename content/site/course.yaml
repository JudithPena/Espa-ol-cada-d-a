# Общие настройки курса.
# Уроки сайта — самостоятельная копия уроков канала (с 4 ноября 2026), правится отдельно, на канал не влияет.
title: Español cada día

# Бот для повторений (bot/, docs/bot_guide.md): ссылок на бота в постах больше нет.
bot: Eduardo_maestro_bot

# Имена и роли в диалогах: разрешены в любом уроке, по ним выбирается голос озвучки.
names:
  female: [Ana, María, Lucía, Elena, Sofía, Marta, Laura, Carmen, Isabel, Paula, Clara,
           Julia, Olga, Irina, Natalia, Rosa, Sara, Inés, Beatriz, Raquel]
  male: [Pablo, Carlos, Javier, Diego, Juan, Daniel, Antonio, Miguel, Luis, Jorge, Alberto,
         Manuel, Iván, Sergio, Andrés, Tomás, Pedro, Álex, Hugo, Mario, Óscar, Raúl,
         Pierre, Tom, Marco, Li]

roles:
  Camarero: m
  Camarera: f
  Recepcionista: f
  Dependienta: f
  Dependiente: m
  Médica: f
  Médico: m
  Farmacéutico: m
  Profesora: f
  Profesor: m
  Secretaria: f
  Empleado: m
  Megafonía: f
  Abuela: f

# Фамилии и географические названия (кроме стран — их проходят как слова).
places: [García, López, Martínez, Ruiz, Gómez, Sánchez, Fernández, Pérez, Torres, Romero,
         Navarro, Molina, Madrid, Barcelona, Sevilla, Valencia, Granada, Málaga, Bilbao,
         Salamanca, Toledo, Córdoba, Kiev, Leópolis, Odesa, Aires, Lima, Bogotá,
         Cancún, Roma, París, Londres, Berlín, Picasso, Cervantes, Prado, Retiro, Mallorca,
         Tenerife, Ibiza, Andalucía, Galicia,
         Alhambra, Canarias, Giralda, Sagrada]   # A2: достопримечательности в текстах о поездках

# Латиница, которая не является испанскими словами.
meta_words: [Telegram, OK, emoji, CEFR, DELE, YouTube, Dreaming, Spanish,
             pretérito, indefinido, imperfecto, imperativo, internet]   # названия времён в объяснениях A2

settings:
  srs:
    intervals: [1, 3, 7, 14, 30, 60, 120]  # через сколько постов возвращать слово
    recall_size: 5      # слов в блоке «Вспомним» в обычном посте
    recall_min: 3       # если «созревших» слов меньше, добрать до стольких из давно не встречавшихся
    review_size: 16     # слов в посте-повторении
    review_quiz: 4      # автоопросов в посте-повторении
    quiz_auto: 4        # автоопросов по лексике в тесте
  max_polls: 8          # максимум опросов в одном посте
  max_new_words: 20     # не больше стольких новых слов за пост
  # Уроки, которые уходят в канал постом-статьёй (картинки, аудио и ответы внутри поста).
  # Список id уроков; all — все уроки.
  rich_posts: all
  # Темы, открытые на основном сайте (номера тем); остальные под замком «скоро откроется».
  # Открываем по одной, когда тема проработана. Предпросмотр (ветки claude/**) открыт целиком.
  site_open_units: null  # null — открыты все темы
