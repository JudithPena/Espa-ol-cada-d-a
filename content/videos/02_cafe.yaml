# Разбор видео №2. Правила рубрики — docs/video_guide.md.
id: cafe
title: Чёрный кофе без сахара
url: https://app.dreaming.com/spanish/watch?id=682c78e3d5fe0f842f640578
after: 19          # опираемся на уроки 0–19: всё, что уже вышло в канал
level: A1

# Междометия, которые звучат в видео.
allow: [Ah, Ay]

# Текст видео — 10 смысловых блоков: под каждым его новые слова (words, по полю es из vocab),
# пояснения (note) и перевод (ru, в посте спрятан). Реплики разных людей — через тире.
segments:
  - es: "— ¡Hola! — Hola, bienvenida. ¿Qué quieres tomar? — Quiero un café. — Perfecto. ¿Con leche o sin leche?"
    ru: "— Привет! — Привет, добро пожаловать. Что будешь пить? — Я хочу кофе. — Отлично. С молоком или без молока?"
    words: [bienvenido/a, querer, tomar, perfecto, sin, o]
    note:
      - "**Quiero** — это «я хочу», а **quieres** — «ты хочешь», формы глагола **querer**. Если вы хотите что-то заказать, назовите это сразу после глагола: _Quiero un café._ (Я хочу кофе.)"
      - "Глагол **tomar** значит «брать», а в кафе так говорят о напитках и еде: _¿Qué quieres tomar?_ (Что ты будешь пить?)"
      - "**Con** значит «с», а **sin** — «без»: _café con leche_ (кофе с молоком), _café sin leche_ (кофе без молока). Артикль после них здесь не нужен, потому что речь идёт о молоке вообще."
  - es: "— No. Leche no. Yo no tomo leche. — Ah, ok, ok. — Ay, no. Disculpa. Yo quiero café negro sin crema. Crema no."
    ru: "— Нет. Молока не надо. Я не пью молоко. — А, ладно, ладно. — Ой, нет. Извини. Я хочу чёрный кофе без сливок. Сливок не надо."
    words: [disculpa, negro, la crema]
    note:
      - "Чтобы коротко отказаться от чего-то, поставьте **no** после слова: _Leche no._ (Молока не надо.) _Crema no._ (Сливок не надо.) В полной фразе **no** стоит перед глаголом: _Yo no tomo leche._ (Я не пью молоко.)"
      - "Прилагательное обычно стоит **после** существительного: _café negro_ значит «чёрный кофе»."
  - es: "— Perdón. Espere un poco. — Pero este café está frío. Yo quiero un café negro caliente. — Ah, disculpa."
    ru: "— Простите. Подождите немного. — Но этот кофе холодный. Я хочу горячий чёрный кофе. — Ах, извини."
    words: [esperar, un poco, este, frío/a, caliente]
    note:
      - "**Espere** и **espera** значат «подождите» и «подожди», это формы глагола **esperar**. Если вы обращаетесь на «вы» (_usted_), говорите _Espere un poco_, а если на «ты» — _Espera un minuto_. В видео официантка говорит и так, и так."
      - "Когда говорят о состоянии, которое может измениться, используют **está**: _El café está frío._ (Кофе холодный.) _El café está caliente._ (Кофе горячий.)"
  - es: "— Toma. Café negro caliente. — No. Este café está muy, muy caliente. — Ok."
    ru: "— Держи. Горячий чёрный кофе. — Нет. Этот кофе очень-очень горячий. — Ладно."
    note:
      - "**Toma** — тоже форма глагола **tomar**. Так говорят, когда что-то протягивают: «на, держи»."
      - "Чтобы усилить слово, его можно повторить: _muy, muy caliente_ значит «очень-очень горячий»."
  - es: "— Está muy bien. Está muy dulce. Tiene mucha azúcar. No, no. Yo quiero un café negro caliente y sin azúcar. — Ah, ok."
    ru: "— Теперь нормально. Но он очень сладкий. В нём много сахара. Нет, нет. Я хочу горячий чёрный кофе без сахара. — А, ладно."
    words: [dulce, tener, mucha, el azúcar]
    note:
      - "**Tiene** значит «у него есть» или «в нём есть», это форма глагола **tener**: _Tiene mucha azúcar._ (В нём много сахара.) Форма для «ты» — **tienes**."
      - "Слово **mucho** согласуется с существительным: _mucho café_ (много кофе), но _mucha leche_ (много молока). Слово **azúcar** бывает и мужского, и женского рода, а в видео оно женского рода, поэтому звучит _mucha azúcar_."
  - es: "— ¿Sabe? — Muy bien. Perfecto. — Adiós. — Pero... Ahora que la taza es muy pequeña, yo quiero un café negro caliente, sin azúcar y en una taza grande."
    ru: "— Ну как на вкус? — Очень хорошо. Отлично. — До свидания. — Но... Теперь вот чашка очень маленькая. Я хочу горячий чёрный кофе без сахара и в большой чашке."
    words: [saber, ahora, que, la taza, pequeño/a, grande]
    note:
      - "Глагол **saber** значит «знать», но о еде и напитках он значит «иметь вкус». Поэтому _¿Sabe?_ здесь значит «Как на вкус?», а _¿Sabe bien?_ — «Вкусно?»"
      - "Сравните **es** и **está**. Если говорят о свойстве самой вещи, используют **es**: _La taza es muy pequeña._ (Чашка очень маленькая.) Если говорят о состоянии, которое меняется, используют **está**: _El café está frío._ (Кофе остыл.)"
      - "**Una** — женский род от **un**: говорят _un café_, но _una taza_, потому что слово _taza_ женского рода."
  - es: "— Bueno. Espera un minuto. — Sí, sí. Ok. — Aquí tienes. Café negro caliente, sin azúcar y en una taza grande. — Ah, gracias."
    ru: "— Ладно. Подожди минутку. — Да, да. Хорошо. — Вот, пожалуйста. Горячий чёрный кофе без сахара и в большой чашке. — Ах, спасибо."
    words: [bueno/a, el minuto, aquí]
    note:
      - "**Bueno** значит «хороший», но в начале ответа оно значит «ладно»: _Bueno. Espera un minuto._ (Ладно. Подожди минутку.)"
      - "**Aquí tienes** говорят, когда что-то подают или протягивают: «вот, пожалуйста». Дословно это значит «здесь у тебя есть»."
  - es: "— Está muy bueno. Muy bien. Adiós. — Mesera, mesera. ¿Dónde está el baño? — ¿El baño? Por allá."
    ru: "— Очень вкусно. Очень хорошо. До свидания. — Официантка, официантка! Где туалет? — Туалет? Вон там."
    words: [la mesera, "¿dónde?", el baño, allá]
    note:
      - "О еде и напитках _Está muy bueno_ значит «очень вкусно». Сравните: **bueno** — «хороший», а **bien** — «хорошо»."
      - "Чтобы спросить, где что-то находится, говорят **¿Dónde está...?**: _¿Dónde está el baño?_ (Где туалет?) Здесь тоже **está**, потому что речь идёт о месте."
  - es: "— Pero el baño está cerrado. El baño está en mantenimiento. — ¿Qué? — Adiós."
    ru: "— Но туалет закрыт. Туалет на ремонте. — Что? — До свидания."
    words: [cerrado/a, el mantenimiento]
    note: "Если что-то закрыто или находится на ремонте, это тоже состояние, поэтому говорят **está**: _El baño está cerrado._ (Туалет закрыт.) _El baño está en mantenimiento._ (Туалет на ремонте.)"
  - es: "— Está rico. ¿Qué es? — Café colombiano. Con crema. — Está rico."
    ru: "— Вкусно. Что это? — Колумбийский кофе. Со сливками. — Вкусно."
    words: [rico/a, colombiano/a]
    note: "Слово **rico** значит «богатый», а о еде — «вкусный»: _Está rico._ (Вкусно.) Слова о стране, как и другие прилагательные, стоят после существительного: _café colombiano_ (колумбийский кофе)."

vocab:
  - "🤗 bienvenido/a [бьенбэни́до, бьенбэни́да] — добро пожаловать :: Hola, bienvenida. — Привет, добро пожаловать."
  - "🙋 querer [кэрэ́р] — хотеть {forms: quiero quieres quiere} :: Quiero un café. — Я хочу кофе."
  - "☕ tomar [тома́р] — брать; пить (о напитках) {forms: tomo tomas toma} :: ¿Qué quieres tomar? — Что ты будешь пить?"
  - "👌 perfecto [пэрфэ́кто] — отлично, прекрасно"
  - "➖ sin [син] — без :: café sin leche — кофе без молока"
  - "🔀 o [о] — или :: ¿Con leche o sin leche? — С молоком или без?"
  - "🙇 disculpa [диску́льпа] — извини"
  - "⚫ negro [нэ́гро] — чёрный :: café negro — чёрный кофе"
  - "🍦 la crema [крэ́ма] — сливки"
  - "⏳ esperar [эспэра́р] — ждать {forms: espera espere} :: Espere un poco. — Подождите немного."
  - "🤏 un poco [ун по́ко] — немного"
  - "👉 este [э́стэ] — этот :: este café — этот кофе"
  - "🧊 frío/a [фри́о, фри́а] — холодный :: El café está frío. — Кофе холодный."
  - "🔥 caliente [калье́нтэ] — горячий"
  - "🍯 dulce [ду́льθэ] — сладкий"
  - "🤲 tener [тэнэ́р] — иметь {forms: tiene tienes} :: Tiene mucha azúcar. — В нём много сахара."
  - "📈 mucha [му́ча] — много; женский род от mucho :: mucha leche — много молока"
  - "🍬 el azúcar [аθу́кар] — сахар :: sin azúcar — без сахара"
  - "👅 saber [сабэ́р] — знать; иметь вкус {forms: sabe} :: ¿Sabe bien? — Вкусно?"
  - "🕐 ahora [ао́ра] — сейчас, теперь"
  - "🔗 que [кэ] — что (связывает части фразы)"
  - "☕ la taza [та́θа] — чашка"
  - "🐜 pequeño/a [пэкэ́ньо, пэкэ́нья] — маленький"
  - "🐘 grande [гра́ндэ] — большой"
  - "👍 bueno/a [буэ́но, буэ́на] — хороший; ладно (в начале ответа) :: Está muy bueno. — Очень вкусно."
  - "⏱ el minuto [мину́то] — минута :: Espera un minuto. — Подожди минутку."
  - "📌 aquí [аки́] — здесь :: Aquí tienes. — Вот, пожалуйста."
  - "💁 la mesera [мэсэ́ра] — официантка (в Мексике)"
  - "❓ ¿dónde? [до́ндэ] — где? :: ¿Dónde está el baño? — Где туалет?"
  - "🚻 el baño [ба́ньо] — туалет; ванная"
  - "👈 allá [айя́] — там :: Por allá. — Вон там."
  - "🔒 cerrado/a [θэрра́до, θэрра́да] — закрытый :: El baño está cerrado. — Туалет закрыт."
  - "🔧 el mantenimiento [мантэнимье́нто] — обслуживание, ремонт :: en mantenimiento — на ремонте"
  - "😋 rico/a [ри́ко, ри́ка] — вкусный (о еде); богатый :: Está rico. — Вкусно."
  - "🇨🇴 colombiano/a [коломбья́но, коломбья́на] — колумбийский"

blocks:
  - "Вторая часть рубрики — **разборы коротких видео** на испанском."
  - |
    **Как смотреть.** Сначала видео, потом разбор. Посмотрите видео целиком и не подглядывайте в текст: постарайтесь понять, какой кофе она хочет и что с ним каждый раз не так. Потом прочитайте разбор и посмотрите видео ещё раз.

    Смотреть лучше с **испанскими субтитрами**: так вы одновременно слышите и видите каждую фразу.
  - exercise:
      title: "Ответьте на вопросы"
      items:
        - "¿Qué quiere tomar? => Quiere un café negro, caliente y sin azúcar."
        - "¿Toma café con leche? => No, no toma leche."
        - "Официантка приносит кофе в третий раз. ¿Cómo está el café? => Está muy, muy caliente."
        - "¿Cómo está el café con azúcar? => Está muy dulce. Tiene mucha azúcar."
        - "¿Cómo es la taza? => Es muy pequeña."
        - "¿Dónde está el baño? => Está por allá, pero está cerrado."
  - exercise:
      title: Переведите
      items:
        - "Я хочу кофе без молока. => Quiero un café sin leche."
        - "Этот кофе холодный. => Este café está frío."
        - "Подожди минутку. => Espera un minuto."
        - "Где туалет? => ¿Dónde está el baño?"
  - task: "Представьте, что вы в кафе и официантка спрашивает вас: _¿Qué quieres tomar?_ Закажите свой кофе в комментариях по образцу: **Quiero un café... con... / sin... y en una taza...**"

quiz:
  - q: "Какой кофе она хочет в конце?"
    options: "Negro, caliente y sin azúcar | Con leche y con azúcar | Negro y frío"
    explain: "Она говорит: «Quiero un café negro caliente, sin azúcar y en una taza grande»."
  - q: "Как сказать «кофе без молока»?"
    options: "café sin leche | café con leche | café o leche"
    explain: "Sin значит «без», а con — «с»."
  - q: "Что значит «Este café está muy dulce»?"
    options: "Этот кофе очень сладкий. | Этот кофе очень горячий. | Этот кофе очень холодный."
  - q: "Почему она не может пойти в туалет?"
    options: "Está cerrado. | Está por allá. | Es muy pequeño."
    explain: "Туалет закрыт: «El baño está cerrado, está en mantenimiento»."
  - q: "«La taza ___ muy pequeña.» Какое слово пропущено?"
    options: "es | está | tiene"
    explain: "Размер — это свойство самой чашки, поэтому es."
