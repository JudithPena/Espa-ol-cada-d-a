blocks:
  - "Шестая часть рубрики — **разборы коротких видео** на испанском. После текста видео — раздел «📚 Грамматика из видео»."
  - |
    **Как смотреть.** Сначала видео, потом разбор. Посмотрите видео целиком и не подглядывайте в текст: постарайтесь понять, какие туфли она хочет и почему в конце ей снова нужно платить. Потом прочитайте разбор и посмотрите видео ещё раз.

    Смотреть лучше с **испанскими субтитрами**: так вы одновременно слышите и видите каждую фразу.
  - header: "📚 Грамматика из видео"
  - rule: |
      **1. Este, ese, esto, eso — «этот», «тот», «это».** Если вещь рядом с вами, говорят **este** (мужской род) или **esta** (женский род), а если вещей несколько, говорят **estos** или **estas**: _Esta es una tienda de zapatos._ (Это обувной магазин.) _Estos zapatos no son blancos._ (Эти туфли не белые.)
      Если вещь подальше от вас, например рядом с собеседником, говорят **ese**, **esa**, **esos**, **esas**: _¿Qué son esos?_ (А те что такое?) _Esa es una señora loca._ (Это одна сумасшедшая сеньора.)
      Если вещь не называют, говорят **esto** или **eso**: _Esto es blanco._ (Вот это белое.) _¿Qué fue eso?_ (Что это было?)
  - table:
      title: "Этот и тот"
      rows:
        - ["**este** / **esta**", "этот / эта (рядом со мной)"]
        - ["**estos** / **estas**", "эти (рядом со мной)"]
        - ["**ese** / **esa**", "тот / та (подальше)"]
        - ["**esos** / **esas**", "те (подальше)"]
        - ["**esto** / **eso**", "это / то (вещь не называем)"]
  - rule: |
      **2. Признак стоит в том же числе и роде, что и вещь.** Если вещей несколько, то и признак стоит во множественном числе: _zapato blanco_, но _zapatos blancos_; _tacón alto_, но _tacones altos_.
      Если слово женского рода, признак тоже стоит в женском роде: _una señora loca_ (сумасшедшая сеньора), _una mujer mayor_ (пожилая женщина). У слова **mayor** женской формы нет, поэтому оно не меняется.
  - table:
      title: "Одна вещь или несколько"
      rows:
        - ["zapato **blanco**", "zapatos **blancos**"]
        - ["tacón **alto**", "tacones **altos**"]
        - ["tacón **bajo**", "tacones **bajos**"]
  - rule: |
      **3. Sí перед глаголом — «да ...же».** Если поставить **sí** перед глаголом, фраза звучит как спор: «нет, всё именно так!». _Sí son blancos._ (Да белые же!) _Sí tienes tacones._ (Да есть у тебя каблуки!) _Pero sí pagué._ (Но я же заплатила!) _Eso sí es blanco._ (Вот это как раз белое.)
  - exercise:
      title: "Ответьте на вопросы"
      items:
        - "Что она ищет в начале видео? => Zapatos blancos."
        - "Почему ей не нравятся вторые туфли? => No son blancos. Son color crema."
        - "Какие каблуки она хочет? => Tacones altos."
        - "Какой размер ей нужен? => Talla siete."
        - "Сколько на самом деле стоят туфли? => Son ochenta dólares."
        - "Кто такая пожилая женщина? => Una señora loca. No trabaja en la tienda."
  - exercise:
      title: Переведите
      items:
        - "Я ищу туфли. => Busco zapatos."
        - "Я хочу белые туфли. => Quiero zapatos blancos."
        - "Сколько они стоят? => ¿Cuánto cuestan?"
        - "Это очень дорого. => Es muy caro."
        - "Это мой магазин. => Esta es mi tienda."
  - task: "Представьте, что вы в обувном магазине. Напишите в комментариях короткий диалог по образцу: **Busco zapatos. — ¿De qué color? — Blancos. Talla siete. — Mira estos. — ¿Cuánto cuestan? — Cincuenta dólares. — ¡Es muy caro!**"

quiz:
  - q: "Как сказать «эти туфли»?"
    options: "estos zapatos | esto zapatos | esta zapatos"
    explain: "Туфель несколько, и слово zapato мужского рода, поэтому estos: estos zapatos."
  - q: "Что значит «tacones altos»?"
    options: "высокие каблуки | низкие каблуки | белые туфли"
    explain: "Alto — «высокий», bajo — «низкий»."
  - q: "«Busco zapatos» значит…"
    options: "Я ищу туфли | Я покупаю туфли | Я продаю туфли"
  - q: "Сколько на самом деле стоят туфли в этом магазине?"
    options: "Ochenta dólares | Cien dólares | Cincuenta dólares"
    explain: "Хозяйка магазина говорит: «Son ochenta dólares»."
  - q: "Что значит «Es muy caro»?"
    options: "Это очень дорого | Это очень красиво | Это очень далеко"
