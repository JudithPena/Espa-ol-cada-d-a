blocks:
  - "Пятая часть рубрики — **разборы коротких видео** на испанском. После текста видео — раздел «📚 Грамматика из видео»."
  - |
    **Как смотреть.** Сначала видео, потом разбор. Посмотрите видео целиком и не подглядывайте в текст: постарайтесь понять, что ей нужно и почему у неё всё время ничего не получается. Потом прочитайте разбор и посмотрите видео ещё раз.

    Смотреть лучше с **испанскими субтитрами**: так вы одновременно слышите и видите каждую фразу.
  - header: "📚 Грамматика из видео"
  - rule: |
      **1. Hay и está — «есть» и «находится».** Если вы спрашиваете, есть ли где-то что-то вообще, говорят **hay**: _¿Dónde hay un baño?_ (Где здесь есть туалет?) _Arriba hay un baño._ (Наверху есть туалет.) _No hay nadie._ (Никого нет.)
      Если вы спрашиваете о конкретной вещи, про которую уже известно, говорят **está**: _¿Dónde está el baño?_ (Где туалет?) _El baño está allá._ (Туалет вон там.) Если вещей несколько, говорят **están**: _¿Dónde están las escaleras?_
      Подсказка: после **hay** обычно стоит _un_, _una_ или вообще ничего (_hay fila_), а перед **está** — _el_ или _la_ (_el baño está..._).
  - table:
      title: "Hay или está"
      rows:
        - ["**hay** un baño", "есть (какой-то) туалет"]
        - ["no **hay** nadie", "никого нет"]
        - ["el baño **está** allá", "туалет (тот самый) вон там"]
        - ["las escaleras **están** por allá", "лестница вон там"]
  - rule: |
      **2. Quiero + глагол и voy a + глагол.** Если сказать **quiero** и глагол в начальной форме, получится «хочу что-то сделать»: _Quiero ir al baño._ (Хочу в туалет.) _Quiero hacer pipí._ (Хочу пописать.)
      Если сказать **voy a** и глагол, получится «сейчас сделаю», «собираюсь»: _Voy a hacer pipí._ (Сейчас пописаю.) О «ты» говорят **vas a**: _Vas a hacer pipí en la cárcel._ (Пописаешь в тюрьме.)
  - table:
      title: "Хочу, собираюсь"
      rows:
        - ["**quiero** ir al baño", "хочу в туалет"]
        - ["**voy a** hacer pipí", "(я) сейчас пописаю"]
        - ["**vas a** hacer pipí", "(ты) пописаешь"]
  - rule: |
      **3. Повторим: estar и глагол на -iendo.** Как в разборе №4, это действие прямо сейчас: _¿Estás haciendo pipí?_ (Ты сейчас писаешь?) _No estoy haciendo pipí._ (Я не писаю.) У глагола **hacer** эта форма — **haciendo**.
  - exercise:
      title: "Ответьте на вопросы"
      items:
        - "Что она ест в начале видео? => Nachos. Es muy picante."
        - "Что она просит у официантки? => Agua."
        - "Почему она не может сходить в туалет в кафе? => Hay fila. Y arriba el baño está fuera de servicio."
        - "¿Cuánto cuesta un café en el Starbucks? => Son veinte dólares."
        - "Что говорит полицейский про улицу? => Hacer pipí aquí está prohibido."
        - "Куда полицейский хочет её отвезти? => A la cárcel."
  - exercise:
      title: Переведите
      items:
        - "Где туалет? => ¿Dónde está el baño?"
        - "Наверху есть туалет. => Arriba hay un baño."
        - "Сколько стоит кофе? => ¿Cuánto cuesta un café?"
        - "Я хочу в туалет. => Quiero ir al baño."
  - task: "Представьте, что вы в кафе и ищете туалет. Напишите в комментариях короткий диалог по образцу: **¿Hay un baño aquí? — Sí, arriba hay un baño. — ¿Dónde están las escaleras? — Están allá.**"

quiz:
  - q: "Как спросить «Где туалет?», если в кафе он точно есть?"
    options: "¿Dónde está el baño? | ¿Dónde hay el baño? | ¿Qué es el baño?"
    explain: "О конкретном месте, про которое известно, говорят está: ¿Dónde está el baño?"
  - q: "«Arriba ___ un baño.» — «Наверху есть туалет». Какое слово пропущено?"
    options: "hay | está | es"
    explain: "Есть ли где-то что-то вообще — hay: Arriba hay un baño."
  - q: "Что значит «fuera de servicio»?"
    options: "не работает | очень далеко | очень дорого"
  - q: "Сколько стоит кофе в «Старбаксе»?"
    options: "Veinte dólares | Diez dólares | Cinco dólares"
    explain: "Бариста говорит: «Son veinte dólares»."
  - q: "Что значит «¿Cuánto cuesta?»"
    options: "Сколько стоит? | Сколько времени? | Где это?"
