# Разбор видео №1. Правила рубрики — docs/video_guide.md.
id: desayuno
title: Что я ем утром
url: https://app.dreaming.com/spanish/watch?id=5e4d121caac87f3820954cb5
after: 13          # опираемся на уроки 0–13: всё, что уже вышло в канал
level: A1

# Имена и слова не по-испански, которые звучат в видео.
allow: [Europa, Alexa, stop]

# Текст видео по фразам: под каждой фразой — её новые слова (words, по полю es из vocab),
# пояснение (note) и перевод (ru, в посте спрятан).
segments:
  - es: "Hola, yo por la mañana a las 9... No, a las 8. A las 8 yo como huevo."
    ru: "Привет! Я утром в девять... Нет, в восемь. В восемь я ем яйца."
    words: [por la mañana, a las ocho / a las nueve, comer, el huevo]
    note: "**Como** — это «я ем», форма глагола **comer**. Перед _huevo_ нет артикля, потому что речь идёт о еде вообще: _Como huevo_ значит «я ем яйца», а не какое-то одно яйцо."
  - es: "Huevo. Yo como huevo y como pan. Yo como pan, pero no como pan solo. No, no, no."
    ru: "Яйца. Я ем яйца и ем хлеб. Я ем хлеб, но не ем просто хлеб. Нет, нет, нет."
    words: [el pan, pero, solo/a]
    note: "Чтобы сказать, что вы чего-то **не** делаете, поставьте **no** прямо перед глаголом: _No como pan solo._ (Я не ем просто хлеб.) Если вы отвечаете на вопрос «нет», то **no** звучит два раза: первое значит «нет», а второе стоит перед глаголом: _¿Comes pan solo? — No, no como pan solo._"
  - es: "Como pan, pero no pan solo. Como... Como pan con mermelada. Mermelada. Como pan con mermelada."
    ru: "Ем хлеб, но не просто хлеб. Ем... Ем хлеб с джемом. Джем. Ем хлеб с джемом."
    words: [con, la mermelada]
  - es: "Pan. Pan con mantequilla. Pero no como pan... pan con huevo. No, no como, no como pan con huevo."
    ru: "Хлеб. Хлеб со сливочным маслом. Но я не ем хлеб... хлеб с яйцом. Нет, не ем, не ем хлеб с яйцом."
    words: [la mantequilla]
  - es: "Como fruta. Como fruta, como fruta, pero no como pan. ¿Pan con fruta? No, no, no. Como fruta. Fruta sola. Como huevo solo."
    ru: "Я ем фрукты. Ем фрукты, ем фрукты, но не ем хлеб. Хлеб с фруктами? Нет, нет, нет. Ем фрукты. Просто фрукты. Ем просто яйца."
    words: [la fruta]
    note: "Слово **solo** согласуется с существительным, как и любое прилагательное. Поэтому говорят _huevo solo_ (просто яйца), но _fruta sola_ (просто фрукты), потому что слово _fruta_ женского рода."
  - es: "Pero no como pan. Pan solo no como. No, no. Como pan con mermelada y pan con mantequilla."
    ru: "Но не ем хлеб. Просто хлеб я не ем. Нет, нет. Ем хлеб с джемом и хлеб с маслом."
    note: "Преподаватель ставит в начало то, что для него главное, поэтому говорит _Pan solo no como_ вместо _No como pan solo_. Обе фразы значат одно и то же: «Просто хлеб я не ем». Сами начинайте с обычного порядка слов: _No como pan solo._"
  - es: "Por la mañana no como queso. Queso no como. No, no, no. No como jamón. Jamón no como. Y no como ensalada. Ensalada. No como ensalada. No, no."
    ru: "Утром я не ем сыр. Сыр я не ем. Нет, нет, нет. Не ем хамон. Хамон не ем. И не ем салат. Салат. Не ем салат. Нет, нет."
    words: [la ensalada]
  - es: "En Europa comen queso, comen jamón por la mañana. Por la mañana. Sí, sí, sí, sí. Pero yo no."
    ru: "В Европе едят сыр, едят хамон утром. Утром. Да, да, да, да. Но я — нет."
    words: [en]
    note: "**Comen** значит «едят»: так говорят о многих людях, здесь — о людях в Европе. Глагол меняет окончание, когда меняется тот, кто действует: _yo como_ (я ем), _tú comes_ (ты ешь), _comen_ (они едят)."
  - es: "Y yo tampoco como caca. No, no, no. Yo no como caca. No, no, no."
    ru: "И какашки я тоже не ем. Нет, нет, нет. Я не ем какашки. Нет, нет, нет."
    words: [tampoco, la caca]
    note: "Чтобы сказать «тоже не», используйте **tampoco**. Тогда второе **no** перед глаголом уже не нужно: _Tampoco como caca._ (Какашки я тоже не ем.)"
  - es: "Por la mañana yo bebo té. Té. Yo por la mañana bebo té. No bebo café. Café no bebo. No, no, no."
    ru: "Утром я пью чай. Чай. Я утром пью чай. Не пью кофе. Кофе я не пью. Нет, нет, нет."
    words: [beber, el té]
    note: "**Bebo** — это «я пью», форма глагола **beber**. Она образуется так же, как _como_ от _comer_: _yo bebo_ (я пью), _¿qué bebes?_ (что ты пьёшь?)."
  - es: "Bebo agua. Bebo agua y té. Pero no bebo café. Tampoco bebo leche. Leche yo no bebo."
    ru: "Пью воду. Пью воду и чай. Но не пью кофе. Молоко тоже не пью. Молоко я не пью."
    words: [el agua, la leche]
  - es: "Y tampoco bebo gasolina. No, no, no. No bebo gasolina, porque yo no soy un coche."
    ru: "И бензин тоже не пью. Нет, нет, нет. Не пью бензин, потому что я не машина."
    words: [la gasolina, porque, el coche]
  - es: "Yo no soy un coche. Yo soy una persona. Sí, sí."
    ru: "Я не машина. Я человек. Да, да."
    words: [una, la persona]
  - es: "Y tú, por la mañana, ¿tú qué comes? Y tú, ¿qué bebes por la mañana? Venga. Hasta luego."
    ru: "А ты что ешь утром? А ты что пьёшь утром? Давай! Пока!"
    words: [¡venga!]
    note: "**Comes** и **bebes** — это формы для «ты»: _¿Qué comes?_ (Что ты ешь?) _¿Qué bebes?_ (Что ты пьёшь?)."
  - es: "_После титров:_ Leche yo no bebo. Alexa, stop."
    ru: "Молоко я не пью. Алекса, стоп."

vocab:
  - "🌅 por la mañana [пор ла манья́на] — утром"
  - "🕗 a las ocho / a las nueve [а лас о́чо, а лас нуэ́бэ] — в восемь / в девять (часов)"
  - "🍽 comer [комэ́р] — есть {forms: como comes come comen} :: Como pan. — Я ем хлеб."
  - "🥤 beber [бэбэ́р] — пить {forms: bebo bebes bebe} :: Bebo agua. — Я пью воду."
  - "🥚 el huevo [уэ́бо] — яйцо"
  - "🍞 el pan [пан] — хлеб"
  - "➕ con [кон] — с :: pan con mermelada — хлеб с джемом"
  - "🔸 pero [пэ́ро] — но"
  - "📍 en [эн] — в :: en Europa — в Европе"
  - "🔹 una [у́на] — одна; женский род от un :: una persona — (один) человек"
  - "1️⃣ solo/a [со́ло, со́ла] — один; просто, без ничего :: fruta sola — просто фрукты"
  - "🍓 la mermelada [мэрмэла́да] — джем, варенье"
  - "🧈 la mantequilla [мантэки́йа] — сливочное масло"
  - "🍎 la fruta [фру́та] — фрукты"
  - "🥗 la ensalada [энсала́да] — салат"
  - "🍵 el té [тэ] — чай"
  - "💧 el agua [а́гуа] — вода"
  - "🥛 la leche [лэ́чэ] — молоко"
  - "🙅 tampoco [тампо́ко] — тоже не :: Tampoco bebo leche. — Молоко я тоже не пью."
  - "❓ porque [по́ркэ] — потому что"
  - "🚗 el coche [ко́чэ] — машина, автомобиль"
  - "🧑 la persona [пэрсо́на] — человек"
  - "⛽ la gasolina [гасоли́на] — бензин"
  - "💩 la caca [ка́ка] — какашка (детское слово; в видео это шутка)"
  - "👉 ¡venga! [бэ́нга] — давай! ну же!"

blocks:
  - "Новая рубрика — **разборы коротких видео** на испанском."
  - |
    **Как смотреть.** Выберите один из двух способов.

    **1. Сначала видео, потом разбор.** Посмотрите видео целиком и не подглядывайте в текст: постарайтесь понять, что он ест, а что не ест. Потом прочитайте разбор и посмотрите видео ещё раз.

    **2. Видео и разбор вместе.** Откройте видео на одном экране, например на компьютере, а этот пост — на другом, например на телефоне. Послушайте одну фразу, поставьте видео на паузу и найдите эту фразу в разборе. Прочитайте под ней новые слова и пояснение, а если что-то непонятно, откройте перевод. Потом включите видео дальше и так же идите от фразы к фразе.
  - exercise:
      title: "Ответьте на вопросы"
      items:
        - "¿Come pan solo? => No, no come pan solo. Come pan con mermelada y pan con mantequilla."
        - "¿Come pan con huevo? => No, no come pan con huevo."
        - "¿Come queso por la mañana? ¿Y jamón? => No, no come queso. Tampoco come jamón."
        - "¿Qué bebe por la mañana? => Bebe té y agua."
        - "¿Bebe café? => No, no bebe café. Tampoco bebe leche."
        - "¿Por qué no bebe gasolina? => Porque no es un coche, es una persona."
  - exercise:
      title: Переведите
      items:
        - "Утром я пью чай. => Por la mañana bebo té."
        - "Я ем хлеб с маслом. => Como pan con mantequilla."
        - "Я не пью кофе. => No bebo café."
        - "Молоко я тоже не пью. => Tampoco bebo leche."
  - task: "В конце видео преподаватель спрашивает вас: _Y tú, por la mañana, ¿qué comes? ¿Qué bebes?_ Ответьте ему в комментариях по образцу: **Por la mañana como... y bebo... No como... Tampoco bebo...**"

quiz:
  - q: "Что он пьёт по утрам?"
    options: "Té y agua | Café con leche | Leche y té"
    explain: "Он пьёт чай и воду, а кофе и молоко не пьёт."
  - q: "Как сказать «Я не ем сыр»?"
    options: "No como queso. | Como no queso. | No queso como no."
    explain: "Слово no ставится прямо перед глаголом."
  - q: "Что значит «pan con mantequilla»?"
    options: "хлеб с маслом | хлеб с джемом | хлеб с яйцом"
  - q: "«No bebo café. ___ bebo leche.» Какое слово пропущено?"
    options: "Tampoco | Pero | Porque"
    explain: "Чтобы сказать «тоже не», используют tampoco."
  - q: "Почему он не пьёт бензин?"
    options: "Porque es una persona. | Porque bebe café. | Porque come pan."
    explain: "Он говорит: «Yo no soy un coche. Yo soy una persona» — я не машина, я человек."
