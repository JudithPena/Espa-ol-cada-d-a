id: descripcion
number: 9
level: A1
title: ¿Cómo es? Описание людей
goals:
  - описать внешность и характер человека
  - согласовывать прилагательные в роде и числе
  - называть цвета

lessons:
  - id: curso
    kind: vocab
    title: Уровень A1 — больше испанского
    vocab:
      - "📖 la lección [лэкθьо́н] — урок"
      - "🗂 el tema [тэ́ма] — тема"
      - "📚 el vocabulario [бокабула́рьо] — лексика, словарный запас"
      - "📐 la gramática [грама́тика] — грамматика"
      - "💬 el diálogo [дья́лого] — диалог"
      - "📖 la lectura [лэкту́ра] — чтение"
      - "✍️ la práctica [пра́ктика] — практика"
      - "🧠 el test [тэст] — тест {pl: los tests}"
    blocks:
      - |
        🎉 **Добро пожаловать на уровень A1!** Мы делаем новый шаг погружения в язык: с этого поста заголовки тоже становятся испанскими. Вместо «Урок» и «Тема» вы увидите **Lección** и **Tema**, а вместо «Лексика», «Грамматика» и «Чтение» вы увидите **Vocabulario**, **Gramática** и **Lectura**.
      - rule: |
          1. Слово **tema** мужского рода, хотя оно заканчивается на `-a`. Поэтому говорят _el tema_, _un tema_, _el tema de la lección_.
          2. Такие слова вы уже встречали: это **el día** и **el mapa**. Например: _un día_, _el mapa de España_.
          3. Так же ведут себя слова **el problema** («проблема») и **el idioma** («язык»): _un problema_, _el idioma español_.
      - tip: "Слова **práctica** и **practica** различаются только ударением, но значат разное. Если над `a` стоит значок ´, то ударение падает на первый слог, и это существительное «практика»: **prác**tica, _la práctica_, _práctica de gramática_. Если значка нет, то ударение падает на второй слог, и это глагол «тренируется» или «тренируйся»: prac**ti**ca, _Ana practica español_, _¡Practica la gramática!_ Значит, значок ´ может изменить смысл слова."
      - exercise:
          title: Traduce
          items:
            - "урок грамматики => la lección de gramática"
            - "тест по лексике => el test de vocabulario"
            - "текст для чтения => un texto de lectura"
            - "Какая тема урока? => ¿Cuál es el tema de la lección?"
    forms: [problema, idioma]

  - id: vocab1
    kind: vocab
    title: Внешность
    vocab:
      - "🧑 el chico / la chica [чи́ко, чи́ка] — парень, мальчик / девушка, девочка"
      - "🦒 alto/a [а́льто, а́льта] — высокий / высокая"
      - "🐭 bajo/a [ба́хо, ба́ха] — невысокий, низкий"
      - "🌱 joven [хо́бэн] — молодой, молодая {pos: adj, pl: jóvenes}"
      - "👱 rubio/a [ру́бьо, ру́бья] — светловолосый, блондин(ка)"
      - "👩🏻‍🦱 moreno/a [морэ́но, морэ́на] — темноволосый; смуглый"
      - "😍 guapo/a [гуа́по, гуа́па] — красивый / красивая"
      - "🧍 delgado/a [дэльга́до, дэльга́да] — худой, стройный"
    blocks:
      - "Начинаем описывать людей. У прилагательных, как и у национальностей, обычно есть мужская и женская форма. Если в мужском роде прилагательное заканчивается на `-o`, то в женском роде оно заканчивается на `-a`: _Pablo es alto_, но _Ana es alta_; _Carlos es rubio_, но _Marta es rubia_. А у слова **joven** одна форма для обоих родов: _Pablo es joven_ и _Ana es joven_."
      - examples:
          items:
            - "Pablo es alto y moreno. — Пабло высокий и темноволосый."
            - "Ana es baja y rubia. — Ана невысокая и светловолосая."
            - "El chico es muy guapo. — Парень очень красивый."
            - "Mi abuela es mayor, pero mi abuelo es joven. — Моя бабушка пожилая, а дедушка молодой."
      - tip: "В Испании слово **moreno** обычно значит «темноволосый»: _Mi padre es moreno y mi madre es rubia_ — «Мой отец темноволосый, а мама светловолосая». Но так же говорят и о человеке со смуглой или загорелой кожей, поэтому фраза _Carlos es moreno_ может значить и «Карлос темноволосый», и «Карлос смуглый». Что имеется в виду, обычно понятно из ситуации."
      - exercise:
          title: Traduce
          items:
            - "Он высокий. => Es alto."
            - "Она блондинка. => Es rubia."
            - "Девушка очень красивая. => La chica es muy guapa."
            - "Мой брат худой и невысокий. => Mi hermano es delgado y bajo."

  - id: vocab2
    kind: vocab
    title: Характер
    vocab:
      - "😊 simpático/a [симпа́тико, симпа́тика] — милый, приятный, дружелюбный"
      - "😒 antipático/a [антипа́тико, антипа́тика] — неприятный"
      - "🧠 inteligente [интэлихэ́нтэ] — умный, умная {pos: adj}"
      - "😄 divertido/a [дибэрти́до, дибэрти́да] — весёлый; забавный"
      - "😐 serio/a [сэ́рьо, сэ́рья] — серьёзный"
      - "🙈 tímido/a [ти́мидо, ти́мида] — застенчивый"
      - "💪 trabajador/a [трабахадо́р, трабахадо́ра] — трудолюбивый"
    blocks:
      - "Теперь поговорим о характере. Испанцы очень ценят, когда человек **simpático**: это слово значит и «милый», и «открытый», и «приятный в общении»."
      - examples:
          items:
            - "Mi profesora es muy simpática. — Моя преподавательница очень приятная."
            - "Carlos es inteligente y trabajador. — Карлос умный и трудолюбивый."
            - "Mi hermano es divertido, pero un poco tímido. — Мой брат весёлый, но немного застенчивый."
      - tip: "Слово **trabajador** («трудолюбивый») родственно глаголу **trabajar** («работать»): _Carlos trabaja mucho, es muy trabajador_ — «Карлос много работает, он очень трудолюбивый». Хотя оно заканчивается на согласную, у него есть женская форма с окончанием `-a`, как у слов profesor**a** и programador**a**: _Carmen es trabajadora_, _Mi madre es muy trabajadora_."
      - exercise:
          title: Traduce
          items:
            - "Она очень умная. => Es muy inteligente."
            - "Мой отец серьёзный, а мама весёлая. => Mi padre es serio y mi madre es divertida."
            - "Сеньор Гарсия неприятный. => El señor García es antipático."
            - "Лусия немного застенчивая. => Lucía es un poco tímida."

  - id: concordancia
    kind: grammar
    title: "Alto, alta, altos, altas"
    vocab:
      - "❓ ¿Cómo es...? [ко́мо эс] — какой (какая) он / она? :: ¿Cómo es tu hermana? — Какая твоя сестра?"
      - "➕ muy [муй] — очень"
      - "↗️ bastante [баста́нтэ] — довольно, достаточно :: Es bastante alto. — Он довольно высокий."
    blocks:
      - "Посмотрите, как меняются прилагательные в этих примерах, и попробуйте найти две разные группы."
      - examples:
          items:
            - "Pablo es alto. Ana es alta. — Пабло высокий. Ана высокая."
            - "Mis hermanos son altos. Mis primas son altas. — Мои братья высокие. Мои двоюродные сёстры высокие."
            - "Carlos es inteligente. Lucía es inteligente. — Карлос умный. Лусия умная."
            - "Mis profesores son jóvenes. — Мои преподаватели молодые."
      - rule: |
          1. Если прилагательное заканчивается на **-o**, то оно меняется и по роду, и по числу, поэтому у него четыре формы: alt**o**, alt**a**, alt**os**, alt**as**. Например: _un chico simpático_, _una chica simpática_, _unos chicos simpáticos_, _unas chicas simpáticas_.
          2. Если прилагательное заканчивается на **-e** или на согласную, то у него одна форма для обоих родов: _un chico inteligente_ и _una chica inteligente_, _mi padre es joven_ и _mi madre es joven_. Исключение составляют национальности и слова на `-or`: у них есть женская форма на `-a`, например _español_ и _española_, _trabajador_ и _trabajadora_.
          3. Во множественном числе к прилагательному добавляется `-s`, если оно заканчивается на гласную, и `-es`, если оно заканчивается на согласную: _Mis amigas son inteligentes_, _Mis tíos son jóvenes_, _Mis abuelos son mayores_. Обратите внимание: в слове **jóvenes** появляется значок ´, потому что ударение остаётся на том же слоге.
          4. Прилагательное обычно ставится **после** существительного, а не перед ним, как в русском: _un amigo simpático_ — «приятный друг», _una chica alta_ — «высокая девушка», _un profesor joven_ — «молодой преподаватель».
      - note: "Вопрос **¿Cómo es?** задают о постоянных качествах, то есть спрашивают «какой он?»: _¿Cómo es tu padre?_ — «Какой у тебя отец?», _¿Cómo es tu profesor?_ — «Какой у тебя преподаватель?». А вопрос **¿Cómo estás?** задают о самочувствии, то есть спрашивают «как ты?»: _¿Cómo estás, Ana?_ — «Как ты, Ана?», _¿Cómo está usted?_ — «Как вы поживаете?». Эту разницу мы скоро разберём подробно."
      - exercise:
          title: Responde
          items:
            - "Mi madre es (alto) ___ => alta"
            - "Mis amigos son (simpático) ___ => simpáticos"
            - "Las chicas son (joven) ___ => jóvenes"
            - "Lucía y Ana son (trabajador) ___ => trabajadoras"
            - "Es una chica muy (inteligente) ___ => inteligente"
      - exercise:
          title: Traduce
          items:
            - "Какой твой брат? => ¿Cómo es tu hermano?"
            - "Он довольно серьёзный. => Es bastante serio."
            - "У меня очень весёлые подруги. => Tengo unas amigas muy divertidas."

  - id: colores
    kind: vocab
    title: Цвета
    vocab:
      - "🎨 ¿De qué color es? [дэ кэ коло́р эс] — какого это цвета? {forms: color colores}"
      - "🔴 rojo/a [ро́хо, ро́ха] — красный"
      - "🔵 azul [аθу́ль] — синий, голубой {pos: adj}"
      - "🟢 verde [бэ́рдэ] — зелёный {pos: adj}"
      - "🟡 amarillo/a [амари́льо, амари́лья] — жёлтый"
      - "⚪ blanco/a [бла́нко, бла́нка] — белый"
      - "⚫ negro/a [нэ́гро, нэ́гра] — чёрный"
      - "🟤 marrón [марро́н] — коричневый {pos: adj}"
    blocks:
      - "Названия цветов тоже являются прилагательными, поэтому они согласуются с существительным в роде и числе. Если цвет заканчивается на `-o`, то у него четыре формы: _un bolígrafo rojo_, _una mochila roja_, _unos libros rojos_, _unas sillas rojas_. Если цвет заканчивается на `-e` или на согласную, то форма одна для обоих родов, а во множественном числе добавляется `-s` или `-es`: _un libro verde_ и _una puerta verde_, _un móvil azul_ и _unas llaves azules_, _un perro marrón_ и _una mesa marrón_."
      - examples:
          items:
            - "La mochila es roja. — Рюкзак красный."
            - "El libro es azul. — Книга синяя."
            - "Las llaves son negras. — Ключи чёрные."
            - "¿De qué color es tu móvil? Es blanco. — Какого цвета твой телефон? Белый."
      - exercise:
          title: Responde
          items:
            - "🍷 ¿De qué color es el vino? => Es rojo (o blanco)."
            - "🧀 ¿De qué color es el queso? => Es amarillo."
            - "🐸 ¿De qué color es? => Es verde."
            - "☕ ¿De qué color es el café? => Es negro o marrón."
            - "Las sillas son (blanco) ___ => blancas"

  - id: ojos
    kind: grammar
    title: Глаза и волосы
    vocab:
      - "👁 el ojo [о́хо] — глаз"
      - "💇 el pelo [пэ́ло] — волосы"
      - "📏 largo/a [ла́рго, ла́рга] — длинный"
      - "✂️ corto/a [ко́рто, ко́рта] — короткий"
      - "🌰 castaño/a [каста́ньо, каста́нья] — каштановый (о волосах)"
      - "👓 llevar [льеба́р] — носить (одежду, очки) :: Llevo gafas. — Я ношу очки."
    blocks:
      - "Как описать глаза и волосы? Для этого испанцы используют глагол **tener**, то есть говорят не «у него голубые глаза», а «он имеет голубые глаза»."
      - examples:
          items:
            - "Tengo los ojos azules. — У меня голубые глаза."
            - "Ana tiene el pelo largo y rubio. — У Аны длинные светлые волосы."
            - "Mi padre tiene el pelo corto y castaño. — У моего отца короткие каштановые волосы."
            - "Javier lleva gafas. — Хавьер носит очки."
      - rule: |
          1. Чтобы описать глаза или волосы, возьмите глагол **tener**, затем **los ojos** или **el pelo**, а после них поставьте цвет или длину: _Tiene los ojos verdes_ — «У него зелёные глаза», _Tengo el pelo largo_ — «У меня длинные волосы», _Mi madre tiene el pelo rubio_ — «У моей мамы светлые волосы».
          2. Слово **el pelo** стоит в единственном числе, потому что оно означает все волосы в целом. Поэтому прилагательное после него тоже стоит в единственном числе: _el pelo corto_, _el pelo castaño_, _el pelo negro_.
          3. А слово **los ojos** стоит во множественном числе, поэтому и прилагательное ставится во множественное число: _los ojos azules_, _los ojos negros_, _los ojos marrones_.
          4. Глагол **llevar** («носить») правильный и заканчивается на `-ar`, поэтому он спрягается так же, как hablar: _Llevo gafas_ — «Я ношу очки», _¿Llevas gafas?_ — «Ты носишь очки?», _Mi abuelo lleva gafas_ — «Мой дедушка носит очки».
      - exercise:
          title: Traduce
          items:
            - "У неё зелёные глаза. => Tiene los ojos verdes."
            - "У меня короткие тёмные волосы. => Tengo el pelo corto y negro."
            - "Вы носите очки? (на «ты») => ¿Llevas gafas?"
            - "У моих братьев голубые глаза. => Mis hermanos tienen los ojos azules."
      - task: "Опишите себя в комментариях. Можно начать так: **Soy... Tengo los ojos... y el pelo...**"

  - id: lectura
    kind: reading
    title: Mi mejor amiga
    vocab:
      - "🥇 mejor [мэхо́р] — лучший {pos: adj} :: mi mejor amigo — мой лучший друг"
    blocks:
      - "Прочитайте описание и постарайтесь представить себе Лауру и Уго. А потом проверьте себя по вопросам."
      - reading:
          title: Mi mejor amiga
          text: |
            Mi mejor amiga se llama Laura. Es de Málaga, pero vive en Madrid. Tiene veinte años y es estudiante.

            Laura es alta y delgada. Tiene el pelo largo y castaño y los ojos verdes. Lleva gafas.

            Es muy inteligente y divertida, pero un poco tímida.

            Su novio, Hugo, es periodista. Es moreno, bajo y muy simpático. ¡Y es muy trabajador!
          translation: |
            Мою лучшую подругу зовут Лаура. Она из Малаги, но живёт в Мадриде. Ей двадцать лет, она студентка.

            Лаура высокая и стройная. У неё длинные каштановые волосы и зелёные глаза. Она носит очки.

            Она очень умная и весёлая, но немного застенчивая.

            Её парень Уго — журналист. Он темноволосый, невысокий и очень приятный. И очень трудолюбивый!
      - exercise:
          title: Responde
          items:
            - "¿Cómo es Laura? => Es alta y delgada; inteligente y divertida."
            - "¿De qué color son sus ojos? => Son verdes."
            - "¿Qué es Hugo? => Es periodista."
            - "¿Cómo es Hugo? => Es moreno, bajo y muy simpático."
    quiz:
      - q: ¿Cómo es el pelo de Laura?
        options: "largo y castaño | corto y rubio | largo y negro"
      - q: ¿Cómo es Hugo?
        options: "bajo y simpático | alto y serio | rubio y tímido"

  - id: escucha
    kind: listening
    title: ¿Quién es quién?
    blocks:
      - "Карина описывает трёх человек со свадебной фотографии. Послушайте её рассказ и ответьте на вопросы."
      - dialogue:
          hidden: true
          voices: {Karina: f}
          lines:
            - "Karina: Mira la foto. El chico alto y rubio es mi hermano Óscar. Es muy divertido. | Посмотри на фото. Высокий светловолосый парень — мой брат Оскар. Он очень весёлый."
            - "Karina: La chica morena es su mujer, Clara. Tiene los ojos negros y el pelo muy largo. | Темноволосая девушка — его жена Клара. У неё чёрные глаза и очень длинные волосы."
            - "Karina: El señor bajo es mi padre. Lleva gafas. Es serio, pero muy simpático. | Невысокий сеньор — мой отец. Он носит очки. Серьёзный, но очень приятный."
    allow: [Karina]
    quiz:
      - q: ¿Cómo es Óscar?
        options: "alto y rubio | bajo y moreno | alto y moreno"
      - q: ¿Quién es Clara?
        options: "la mujer de Óscar | la hermana de Karina | la madre de Karina"
      - q: ¿Quién lleva gafas?
        options: "el padre | Óscar | Clara"

  - id: quiz
    kind: quiz
    title: Описание людей
    blocks:
      - "Сегодня у нас тест по теме «Описание людей»."
      - cando:
          - "описать внешность: Es alto, rubio... Tiene los ojos azules"
          - "описать характер: Es simpática, inteligente..."
          - "согласовать прилагательные: alto, alta, altos, altas"
          - "назвать цвета"
    quiz:
      - q: "Mis hermanas son muy ___"
        options: "simpáticas | simpáticos | simpática"
        explain: "Слово hermanas женского рода и стоит во множественном числе, поэтому прилагательное тоже ставится в женский род и множественное число: simpáticas."
      - q: "Ana tiene los ojos ___"
        options: "verdes | verde | verdas"
        explain: "Слово ojos стоит во множественном числе, поэтому verde тоже ставится во множественное число. У verde одна форма для обоих родов, и к ней добавляется -s: verdes."
      - q: Как спросить «Какая твоя мама?»
        options: "¿Cómo es tu madre? | ¿Cómo está tu madre? | ¿Qué es tu madre?"
        explain: "Вопрос ¿Cómo es...? задают о постоянных качествах человека, а вопрос ¿Cómo está...? задают о самочувствии."
      - q: Как сказать «У него короткие волосы»?
        options: "Tiene el pelo corto. | Es el pelo corto. | Tiene los pelos cortos."
        explain: "Внешность описывают с глаголом tener, а слово pelo стоит в единственном числе, поэтому правильно сказать Tiene el pelo corto."
      - q: "Mis profesores son ___"
        options: "jóvenes | jóvens | joven"
        explain: "Слово joven заканчивается на согласную, поэтому во множественном числе к нему добавляется -es, а над o появляется значок ´: jóvenes."
