id: numeros
number: 4
level: A0
title: Числа и возраст
goals:
  - считать от 0 до 20
  - сказать и спросить возраст
  - продиктовать и записать номер телефона

lessons:
  - id: vocab1
    kind: vocab
    title: Числа от 0 до 5
    vocab:
      - "0️⃣ cero [θэ́ро] — ноль {pos: num}"
      - "1️⃣ uno [у́но] — один {pos: num}"
      - "2️⃣ dos [дос] — два {pos: num}"
      - "3️⃣ tres [трэс] — три {pos: num}"
      - "4️⃣ cuatro [куа́тро] — четыре {pos: num}"
      - "5️⃣ cinco [θи́нко] — пять {pos: num}"
    blocks:
      - "Числа относятся к самым нужным словам: без них не назвать ни возраст, ни цену, ни время, ни номер телефона. Сегодня мы выучим только шесть чисел."
      - tip: |
          Вот несколько зацепок для памяти. Слово **uno** звучит так же, как название карточной игры UNO. Слова **dos** и **tres** похожи на русские «два» и «три». Слово **cuatro** напоминает «квартет», то есть ансамбль из четырёх музыкантов. А слово **cero** похоже на «зеро» в рулетке.
          Фразу _un café_ вы уже знаете. Перед словом мужского рода **uno** сокращается до **un**: _un café_, _un vino_, _un taxi_, _un hotel_.
      - exercise:
          title: Traduce
          items:
            - "2 => dos"
            - "5 => cinco"
            - "0 => cero"
            - "4 => cuatro"
            - "uno, dos, ___, cuatro, cinco => tres"

  - id: vocab2
    kind: vocab
    title: Числа от 6 до 10
    vocab:
      - "6️⃣ seis [сэйс] — шесть {pos: num}"
      - "7️⃣ siete [сьэ́тэ] — семь {pos: num}"
      - "8️⃣ ocho [о́чо] — восемь {pos: num}"
      - "9️⃣ nueve [нуэ́бэ] — девять {pos: num}"
      - "🔟 diez [дьэθ] — десять {pos: num}"
    blocks:
      - "Ещё пять чисел. У многих есть «родственники» в русском и других языках."
      - tip: "Слова **seis** и **siete** похожи на русские «шесть» и «семь». Слово **ocho** напоминает «окт-» в слове «октава», а в октаве восемь нот. Слово **nueve** напоминает «нов-» в слове «ноябрь», потому что когда-то ноябрь был девятым месяцем года. А слово **diez** напоминает «дец-» в слове «декада», то есть десять дней."
      - header: Посчитайте
      - "Когда мы считаем, слово **y** означает «плюс»: _dos y tres_ значит «два плюс три», _cuatro y cuatro_ значит «четыре плюс четыре», а _seis y uno_ значит «шесть плюс один»."
      - exercise:
          title: Responde
          items:
            - "dos y tres => cinco"
            - "cuatro y cuatro => ocho"
            - "seis y tres => nueve"
            - "cinco y cinco => diez"
            - "siete y cero => siete"

  - id: edad
    kind: grammar
    title: ¿Cuántos años tienes?
    vocab:
      - "❓ ¿Cuántos años tienes? [куа́нтос а́ньос тьэ́нэс] — сколько тебе лет?"
      - "📆 el año [а́ньо] — год {forms: años}"
      - "🤲 tener [тэнэ́р] — иметь {forms: tengo tienes tiene}"
    blocks:
      - "Посмотрите, как испанцы говорят о возрасте. Какой глагол они используют там, где мы говорим «мне … лет»?"
      - examples:
          items:
            - "Tengo diez años. — Мне десять лет."
            - "¿Cuántos años tienes? — Сколько тебе лет?"
            - "El perro tiene cinco años. — Собаке пять лет."
            - "¿Cuántos años tiene usted? — Сколько вам лет?"
      - rule: |
          В испанском возраст «имеют». Поэтому фраза **Tengo diez años** дословно значит «Я имею десять лет», то есть «Мне десять лет». Для этого нужен глагол **tener**, который значит «иметь»: _Tengo ocho años_ значит «Мне восемь лет», _Carmen tiene cinco años_ значит «Кармен пять лет», а _El perro tiene dos años_ значит «Собаке два года».
          Форма глагола **tener**, как и у **ser**, зависит от лица. Когда речь идёт о «я», используется форма **tengo**: _Tengo seis años_. Когда речь идёт о «ты», используется форма **tienes**: _¿Tienes nueve años?_ А когда речь идёт о «он», «она» или «вы», используется форма **tiene**: _Pablo tiene siete años_, _¿Cuántos años tiene usted?_
      - table:
          title: "tener — иметь"
          rows:
            - ["yo", "**tengo**"]
            - ["tú", "**tienes**"]
            - ["él / ella / usted", "**tiene**"]
      - note: "Слово **años** означает «годы»: это множественное число от слова **año**, то есть «год». Обратите внимание на букву `ñ`: если написать вместо неё простую `n`, то получится совсем другое слово. Поэтому всегда пишите `ñ`: _el año_, _diez años_, _¿Cuántos años tienes?_"
      - exercise:
          title: Traduce
          items:
            - "Мне семь лет. => Tengo siete años."
            - "Сколько тебе лет? => ¿Cuántos años tienes?"
            - "Ей девять лет. => Tiene nueve años."
            - "Собаке три года. => El perro tiene tres años."
            - "Сколько вам лет? => ¿Cuántos años tiene usted?"

  - id: vocab3
    kind: vocab
    title: Числа от 11 до 15 и 20
    vocab:
      - "1️⃣1️⃣ once [о́нθэ] — одиннадцать {pos: num}"
      - "1️⃣2️⃣ doce [до́θэ] — двенадцать {pos: num}"
      - "1️⃣3️⃣ trece [трэ́θэ] — тринадцать {pos: num}"
      - "1️⃣4️⃣ catorce [като́рθэ] — четырнадцать {pos: num}"
      - "1️⃣5️⃣ quince [ки́нθэ] — пятнадцать {pos: num}"
      - "2️⃣0️⃣ veinte [бэ́йнтэ] — двадцать {pos: num}"
    blocks:
      - "Все числа от 11 до 15 заканчиваются на **-ce**, так же как русские числа от одиннадцати до девятнадцати заканчиваются на «-надцать»: on**ce**, do**ce**, tre**ce**, cator**ce**, quin**ce**. Во многих из них слышно знакомое число: в **doce** слышно **dos**, в **trece** слышно **tres**, а в **catorce** слышно **cuatro**. А **veinte** значит «двадцать», и это число нужно просто запомнить."
      - exercise:
          title: Responde
          items:
            - "diez y cinco => quince"
            - "diez y dos => doce"
            - "diez y uno => once"
            - "diez y diez => veinte"
            - "diez y cuatro => catorce"
      - exercise:
          title: Traduce
          items:
            - "Мне двадцать лет. => Tengo veinte años."
            - "Ему тринадцать лет. => Tiene trece años."

  - id: dieci
    kind: grammar
    title: "16–19: «десять и шесть»"
    vocab:
      - "1️⃣6️⃣ dieciséis [дьэθисэ́йс] — шестнадцать {pos: num}"
      - "1️⃣7️⃣ diecisiete [дьэθисьэ́тэ] — семнадцать {pos: num}"
      - "1️⃣8️⃣ dieciocho [дьэθио́чо] — восемнадцать {pos: num}"
      - "1️⃣9️⃣ diecinueve [дьэθинуэ́бэ] — девятнадцать {pos: num}"
    blocks:
      - "Посмотрите на эти числа внимательно. Из каких знакомых слов они собраны?"
      - rule: |
          Числа от 16 до 19 строятся по схеме «десять и шесть»: из _diez y seis_ получается **dieciséis**, из _diez y siete_ получается **diecisiete**, а из _diez y ocho_ получается **dieciocho**. При этом происходят три изменения.
          1. Всё число пишется одним словом, а `y` превращается в `i`: diec**i**séis, diec**i**ocho, diec**i**nueve.
          2. Буква `z` на конце слова diez меняется на `c`: die**c**iséis, die**c**isiete, die**c**inueve.
          3. У **dieciséis** появляется значок ударения, потому что слово заканчивается на `s`, а ударение падает на последний слог: dieci**séis**. Сравните: в слове seis всего один слог, поэтому значок там не нужен. А diecisiete и dieciocho заканчиваются на гласную, и ударение в них падает на предпоследний слог, как и положено по правилу, поэтому значка у них тоже нет.
      - table:
          rows:
            - ["16", "diez y seis → **dieciséis**"]
            - ["17", "diez y siete → **diecisiete**"]
            - ["18", "diez y ocho → **dieciocho**"]
            - ["19", "diez y nueve → **diecinueve**"]
      - exercise:
          title: Traduce
          items:
            - "17 => diecisiete"
            - "19 => diecinueve"
            - "16 => dieciséis"
            - "Мне восемнадцать лет. => Tengo dieciocho años."
      - exercise:
          title: Responde
          items:
            - "nueve y nueve => dieciocho"
            - "diez y siete => diecisiete"
            - "quince y cinco => veinte"

  - id: telefono
    kind: dialogue
    title: Номер телефона
    vocab:
      - "🔢 el número [ну́мэро] — номер; число"
      - "📞 el teléfono [тэлэ́фоно] — телефон"
      - "👆 mi [ми] — мой, моя"
      - "👉 tu [ту] — твой, твоя"
      - "🫵 su [су] — его, её; ваш"
      - "❓ ¿Cuál es...? [куа́ль эс] — какой...? (какой из)"
    blocks:
      - "В Испании номер телефона состоит из девяти цифр. Иногда его читают по одной цифре, а иногда парами, но сегодня мы будем читать по одной: _seis, cinco, cero, dos..._"
      - tip: |
          Слово **tu** без значка означает «твой»: _tu número_ значит «твой номер», а _tu teléfono_ значит «твой телефон». А **tú** со значком означает «ты»: _¿Y tú?_ значит «А ты?», а _Tú eres Pablo_ значит «Ты Пабло». Это похоже на пару **el** и **él**: _el teléfono_, но _Él es Carlos_.
          Слово **su** может значить «его», «её» и даже вежливое «ваш»: _su número_ значит «его номер», «её номер» или «ваш номер». Поэтому администратор в диалоге спрашивает Ану на «вы»: _¿Cuál es su número de teléfono?_
      - dialogue:
          title: В спортзале
          lines:
            - "Recepcionista: Buenas tardes. ¿Cómo se llama usted? | Добрый день. Как вас зовут?"
            - "Ana: Me llamo Ana Torres. | Меня зовут Ана Торрес."
            - "Recepcionista: ¿Cuántos años tiene? | Сколько вам лет?"
            - "Ana: Tengo veinte años. | Мне двадцать лет."
            - "Recepcionista: ¿Cuál es su número de teléfono? | Какой у вас номер телефона?"
            - "Ana: Seis, cinco, cero, dos, ocho, uno, nueve, siete, tres. | 650 281 973."
            - "Recepcionista: Más despacio, por favor. | Помедленнее, пожалуйста."
            - "Ana: Seis, cinco, cero... dos, ocho, uno... nueve, siete, tres. | 650... 281... 973."
            - "Recepcionista: Muchas gracias, señora Torres. | Большое спасибо, сеньора Торрес."
      - exercise:
          title: Responde
          items:
            - "¿Cómo se llama la señora? => Ana Torres."
            - "¿Cuántos años tiene? => Tiene veinte años."
            - "¿Cuál es su número de teléfono? => 650 281 973"
      - exercise:
          title: Traduce
          items:
            - "Какой у тебя номер телефона? => ¿Cuál es tu número de teléfono?"
            - "Мой номер… => Mi número es..."
      - task: "Придумайте номер телефона и напишите его в комментариях словами по-испански, начиная с фразы **Mi número es...**"

  - id: dictado
    kind: listening
    title: Диктант чисел
    blocks:
      - "Послушайте аудио и запишите числа цифрами. Потом проверьте себя: текст спрятан под спойлером. Повторите это упражнение через пару дней, и тогда числа будут даваться легче."
      - dialogue:
          hidden: true
          lines:
            - "Profesora: Número uno: siete. | 1) 7"
            - "Profesora: Número dos: doce. | 2) 12"
            - "Profesora: Número tres: quince. | 3) 15"
            - "Profesora: Número cuatro: diecinueve. | 4) 19"
            - "Profesora: Número cinco: catorce. | 5) 14"
            - "Profesora: Número seis: seis, dos, nueve, cero, uno, ocho, tres, cuatro, cinco. | 6) 629 018 345"
    quiz:
      - q: Что вы услышали под номером 3?
        options: "15 | 5 | 50"
        explain: "Quince значит 15, а cinco значит 5. Все числа от 11 до 15 заканчиваются на `-ce`."
      - q: Что вы услышали под номером 5?
        options: "14 | 4 | 40"
        explain: "Catorce значит 14, а cuatro значит 4. Слово catorce заканчивается на `-ce`, как и другие числа от 11 до 15."

  - id: quiz
    kind: quiz
    title: Числа и возраст
    blocks:
      - "Это тест по теме «Числа и возраст»."
      - cando:
          - "считать от 0 до 20"
          - "спросить и сказать возраст: ¿Cuántos años tienes? — Tengo... años."
          - "спросить и продиктовать номер телефона"
    quiz:
      - q: Какое это число — «catorce»?
        options: "14 | 4 | 40"
        explain: "Catorce значит 14. А 4 по-испански будет cuatro."
      - q: "¿Cuántos años tienes?"
        options: "Tengo veinte años. | Soy veinte años. | Tienes veinte años."
        explain: "В испанском возраст «имеют», поэтому о себе говорят Tengo veinte años, то есть дословно «Я имею двадцать лет». Глагол soy здесь не подходит."
      - q: "siete y ocho = ?"
        options: "quince | trece | diecisiete"
        explain: "Siete y ocho значит «семь плюс восемь», а это пятнадцать, то есть quince."
      - q: Как сказать «твой номер»?
        options: "tu número | tú número | su número"
        explain: "Слово tu без значка значит «твой», а tú со значком значит «ты». А su значит «его», «её» или «ваш»."
      - q: Как правильно пишется 16?
        options: "dieciséis | diez y seis | dieceseis"
        explain: "Числа от 16 до 19 пишутся одним словом, а у dieciséis есть значок ударения над `é`."
