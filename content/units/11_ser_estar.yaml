id: ser_estar
number: 11
level: A1
title: ¿Cómo estás? Состояния
goals:
  - рассказать о своём самочувствии и настроении
  - понимать разницу между ser и estar
  - спросить «почему?» и объяснить причину

lessons:
  - id: vocab
    kind: vocab
    title: Как вы себя чувствуете?
    vocab:
      - "📅 hoy [ой] — сегодня :: Hoy estoy bien. — Сегодня у меня всё хорошо."
      - "😴 cansado/a [канса́до, канса́да] — уставший"
      - "😃 contento/a [контэ́нто, контэ́нта] — довольный, радостный"
      - "😢 triste [три́стэ] — грустный {pos: adj}"
      - "😬 nervioso/a [нэрбьо́со, нэрбьо́са] — взволнованный, нервный"
      - "🤒 enfermo/a [энфэ́рмо, энфэ́рма] — больной"
      - "⏳ ocupado/a [окупа́до, окупа́да] — занятой"
      - "🥱 aburrido/a [абурри́до, абурри́да] — скучающий; скучный"
    blocks:
      - "Вы помните вопрос **¿Cómo estás?**, который значит «как ты?». Теперь вы сможете ответить на него подробнее: для этого нужен глагол **estar** и слово, которое описывает ваше состояние."
      - examples:
          items:
            - "¿Cómo estás? Estoy cansado. — Как ты? Я устал."
            - "Hoy Ana está muy contenta. — Сегодня Ана очень довольна."
            - "¿Estás triste? — Тебе грустно?"
            - "Mi padre está enfermo. — Мой отец болеет."
            - "Estamos muy ocupados. — Мы очень заняты."
      - tip: "Слова, которые описывают состояние, — это тоже прилагательные, поэтому они согласуются с тем, о ком вы говорите. Если речь идёт о мужчине, то слово заканчивается на **-o**: _Pablo está cansado._ _Carlos está nervioso._ Если речь идёт о женщине, то оно заканчивается на **-a**: _Ana está cansada._ _Mi madre está ocupada._ Если людей несколько, то в конце добавляется **-s**: _Estamos cansados._ _Mis hermanas están contentas._ А слово **triste** по родам не меняется: _Pablo está triste._ _Ana está triste._"
      - exercise:
          title: Traduce
          items:
            - "Я сегодня устала. => Hoy estoy cansada."
            - "Ты занят? => ¿Estás ocupado?"
            - "Они очень довольны. => Están muy contentos."
            - "Моя сестра болеет. => Mi hermana está enferma."

  - id: gramatica
    kind: grammar
    title: Ser или estar?
    vocab:
      - "⏰ ahora [ао́ра] — сейчас :: Ahora estoy en casa. — Сейчас я дома."
      - "♾ siempre [сьэ́мпрэ] — всегда"
    blocks:
      - "В испанском языке есть два глагола со значением «быть»: **ser** и **estar**. Посмотрите на пары предложений и подумайте, в чём между ними разница."
      - examples:
          items:
            - "Pablo es alto. — Пабло высокий. (всегда)"
            - "Pablo está cansado. — Пабло устал. (сейчас)"
            - "Ana es médica. — Ана — врач."
            - "Ana está en el hospital. — Ана в больнице."
            - "Soy de Kiev. — Я из Киева."
            - "Estoy en Madrid. — Я в Мадриде."
      - rule: |
          Глагол **SER** отвечает на вопросы «**кто** это?» и «**какой** он по своей сути?».
          • С ним называют имя: _Soy Carmen._ _Ella es Isabel._
          • С ним называют профессию: _Ana es médica._ _Mi padre es ingeniero._
          • С ним говорят, откуда человек и какой он национальности: _Soy ucraniana._ _Somos de Kiev._ _Lucía es de Sevilla._
          • С ним описывают внешность: _Pablo es alto._ _Mi hermana es rubia._
          • С ним описывают характер: _Mi abuelo es muy serio._ _Eres muy simpática._
          Глагол **ESTAR** отвечает на вопросы «**где**?» и «**в каком состоянии** сейчас?».
          • С ним говорят, где находится человек или вещь: _Estoy en Madrid._ _Ana está en el hospital._ _¿Dónde está el baño?_
          • С ним рассказывают о самочувствии: _Pablo está cansado._ _Mi padre está enfermo._
          • С ним рассказывают о настроении: _Hoy estoy contenta._ _¿Estás triste?_
      - tip: "Запомните простую подсказку: если вы говорите о том, как себя чувствуете или где находитесь, то всегда нужен глагол **estar**: _¿Cómo estás? — Estoy bien._ _¿Dónde estás? — Estoy en casa._"
      - "Иногда от выбора глагола зависит смысл всей фразы. Если сказать **ser aburrido**, то это значит «быть скучным человеком», а если сказать **estar aburrido**, то это значит «скучать прямо сейчас»."
      - examples:
          title: Одно слово — разный смысл
          items:
            - "Pablo es aburrido. — Пабло скучный (человек)."
            - "Pablo está aburrido. — Пабло скучно (сейчас)."
            - "Mi abuelo siempre es muy serio, pero ahora está contento. — Мой дедушка всегда очень серьёзный, но сейчас доволен."
      - exercise:
          title: "¿Ser o estar?"
          items:
            - "Yo ___ de Ucrania. => soy"
            - "Ahora ___ en la oficina. (yo) => estoy"
            - "Mi hermana ___ muy simpática. => es"
            - "Hoy mi hermana ___ triste. => está"
            - "Nosotros ___ estudiantes. => somos"
            - "¿Dónde ___ tus padres? => están"
            - "Javier ___ médico, pero hoy ___ enfermo. => es / está"

  - id: dialogo
    kind: dialogue
    title: ¿Qué te pasa?
    vocab:
      - "❓ ¿Qué te pasa? [кэ тэ па́са] — что с тобой? что случилось?"
      - "❓ ¿Por qué? [пор кэ] — почему?"
      - "💡 porque [по́ркэ] — потому что :: Estoy cansado porque trabajo mucho. — Я устал, потому что много работаю."
      - "👔 el jefe / la jefa [хэ́фэ, хэ́фа] — начальник, начальница"
      - "🎉 ¡Qué bien! [кэ бьен] — как здорово!"
    blocks:
      - "Обратите внимание на два похожих слова. Вопрос **¿por qué?**, то есть «почему?», пишется раздельно и с ударением: _¿Por qué estás triste?_ _¿Por qué estudias español?_ А ответ **porque**, то есть «потому что», пишется слитно и без ударения: _Porque estoy muy cansado._ _Porque mi novia vive en Sevilla._"
      - dialogue:
          lines:
            - "Ana: Hola, Pablo. ¿Qué tal? | Привет, Пабло. Как дела?"
            - "Pablo: Regular. | Так себе."
            - "Ana: ¿Qué te pasa? ¿Estás enfermo? | Что с тобой? Ты заболел?"
            - "Pablo: No, no estoy enfermo. Estoy cansado. | Нет, не заболел. Я устал."
            - "Ana: ¿Por qué? | Почему?"
            - "Pablo: Porque trabajo mucho. Y mi jefe es muy antipático. | Потому что много работаю. И мой начальник очень неприятный."
            - "Ana: Vaya... | Вот как..."
            - "Pablo: ¿Y tú? ¿Qué tal? | А ты? Как дела?"
            - "Ana: ¡Muy bien! Estoy muy contenta: ¡tengo un piso nuevo! | Отлично! Я очень довольна: у меня новая квартира!"
            - "Pablo: ¡Qué bien! ¿Dónde está? | Как здорово! Где она?"
            - "Ana: En el centro, cerca de la universidad. ¡Y es muy bonito! | В центре, недалеко от университета. И очень красивая!"
      - note: "Слово **¡Vaya!** значит «вот как» или «ну и ну». Так говорят, когда слышат неожиданную или неприятную новость: _Estoy enfermo. — ¡Vaya!_ _No hay café. — ¡Vaya!_"
      - exercise:
          title: Responde
          items:
            - "¿Cómo está Pablo? => Está cansado."
            - "¿Por qué? => Porque trabaja mucho."
            - "¿Cómo es su jefe? => Es muy antipático."
            - "¿Por qué está contenta Ana? => Porque tiene un piso nuevo."
    forms: [vaya]

  - id: practica
    kind: practice
    title: Ser и estar на практике
    blocks:
      - "Сегодня мы тренируем самую важную пару глаголов уровня A1. Не торопитесь и для каждого предложения спросите себя, о чём в нём говорится. Если о том, кто это и какой он по сути, то нужен **ser**. Если о том, где он и в каком состоянии сейчас, то нужен **estar**."
      - exercise:
          title: "¿Ser o estar?"
          items:
            - "Madrid ___ en España. => está"
            - "Lucía ___ española, de Sevilla. => es"
            - "¿Por qué ___ (tú) nervioso? => estás"
            - "Mis abuelos ___ mayores. => son"
            - "El café ___ en la mesa. => está"
            - "Vosotros ___ muy divertidos. => sois"
            - "Hoy (yo) ___ muy ocupada. => estoy"
      - exercise:
          title: Traduce
          items:
            - "Мой брат — программист. Сейчас он в офисе. => Mi hermano es programador. Ahora está en la oficina."
            - "Почему ты грустная? — Потому что мой кот болеет. => ¿Por qué estás triste? — Porque mi gato está enfermo."
            - "Мы из Киева, но сейчас мы в Барселоне. => Somos de Kiev, pero ahora estamos en Barcelona."
      - exercise:
          title: Найдите ошибку
          items:
            - "`Soy` cansado. => Estoy cansado."
            - "Mi padre `está` ingeniero. => Mi padre es ingeniero."
            - "¿Dónde `es` el baño? => ¿Dónde está el baño?"
      - task: "Как вы себя чувствуете сегодня? Напишите об этом в комментариях по образцу **Hoy estoy... porque...** Например: _Hoy estoy cansado porque trabajo mucho._"

  - id: quiz
    kind: quiz
    title: Ser и estar
    blocks:
      - "Это тест по теме «Состояния. Ser и estar»."
      - cando:
          - "рассказать о своём самочувствии и настроении: Estoy cansado. Estoy contenta. Estoy enfermo."
          - "выбрать между ser и estar"
          - "спросить ¿Por qué? и ответить Porque..."
    quiz:
      - q: "Hoy ___ muy cansada."
        options: "estoy | soy | es"
        explain: "Здесь говорится о том, как человек себя чувствует сейчас, поэтому нужен глагол estar: Hoy estoy muy cansada."
      - q: "Mi madre ___ profesora."
        options: "es | está | estoy"
        explain: "Профессию называют с глаголом ser, поэтому правильно сказать: Mi madre es profesora."
      - q: "¿Dónde ___ la universidad?"
        options: "está | es | hay"
        explain: "Если вы спрашиваете, где находится известное место или вещь, то нужен глагол estar: ¿Dónde está...?"
      - q: Как сказать «почему»?
        options: "¿Por qué? | ¿Porque? | ¿Qué?"
        explain: "Вопрос «почему?» пишется в два слова и с ударением: ¿Por qué? А porque без ударения значит «потому что»."
      - q: "Pablo ___ alto y moreno."
        options: "es | está | están"
        explain: "Внешность — это постоянное качество человека, поэтому её описывают с глаголом ser: Pablo es alto y moreno."
