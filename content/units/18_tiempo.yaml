id: tiempo
number: 18
level: A1
title: Погода и даты
goals:
  - рассказать о погоде
  - назвать времена года и месяцы
  - сказать дату и спросить о дне рождения

lessons:
  - id: clima
    kind: vocab
    title: ¿Qué tiempo hace?
    vocab:
      - "🌡 ¿Qué tiempo hace? [кэ тьэ́мпо а́θэ] — какая погода?"
      - "🥵 hace calor [а́θэ кало́р] — жарко"
      - "🥶 hace frío [а́θэ фри́о] — холодно"
      - "☀️ hace sol [а́θэ соль] — солнечно"
      - "💨 hace viento [а́θэ бьэ́нто] — ветрено"
      - "🌤 hace buen tiempo / hace mal tiempo [буэн тьэ́мпо, маль тьэ́мпо] — хорошая / плохая погода"
      - "🌧 llover [льобэ́р] — идти (о дожде) :: Hoy llueve. — Сегодня идёт дождь."
      - "🌨 nevar [нэба́р] — идти (о снеге) :: En Kiev nieva mucho. — В Киеве много снега."
    blocks:
      - "О погоде можно поговорить с кем угодно, поэтому эта тема пригодится вам каждый день. Посмотрите на примеры и найдите глагол, который испанцы используют, когда говорят о погоде."
      - rule: |
          1. Когда испанцы говорят о жаре, холоде, солнце и ветре, они используют глагол **hace**, то есть дословно «делает». Например, _hace calor_ означает «жарко», а буквально «делает жару». Так же говорят: _Hoy hace calor._ (Сегодня жарко.) _En Kiev hace frío._ (В Киеве холодно.) _En Sevilla hace sol._ (В Севилье солнечно.) _Hoy hace viento._ (Сегодня ветрено.)
          2. Хорошую и плохую погоду тоже описывают с глаголом **hace**: _Hoy hace buen tiempo._ (Сегодня хорошая погода.) _En Galicia hace mal tiempo._ (В Галисии плохая погода.) _¿Qué tiempo hace en Madrid?_ (Какая погода в Мадриде?)
          3. Для дождя и снега в испанском есть отдельные глаголы, поэтому **hace** с ними не нужен: **llueve** значит «идёт дождь», а **nieva** значит «идёт снег». Например: _Hoy llueve._ (Сегодня идёт дождь.) _En Kiev nieva._ (В Киеве идёт снег.) _En Málaga no nieva._ (В Малаге не бывает снега.)
      - examples:
          items:
            - "¿Qué tiempo hace hoy? Hace sol y hace calor. — Какая сегодня погода? Солнечно и жарко."
            - "Hoy hace mal tiempo: llueve y hace viento. — Сегодня плохая погода: дождь и ветер."
            - "En Kiev hace mucho frío. — В Киеве очень холодно."
      - tip: "Чтобы сказать «очень жарко», говорят **hace mucho calor**, а не `muy calor`, потому что **calor** — это существительное «жара», а перед существительным ставится **mucho**. Точно так же говорят _hace mucho frío_, _hace mucho sol_ и _hace mucho viento_. Подробнее о разнице между **muy** и **mucho** мы поговорим через пару уроков."
      - exercise:
          title: "¿Qué tiempo hace?"
          items:
            - "☀️🥵 => Hace sol y hace calor."
            - "🌧 => Llueve."
            - "🌨🥶 => Nieva y hace frío."
            - "💨 => Hace viento."
            - "🌤 => Hace buen tiempo."
      - task: "Какая погода сегодня там, где вы живёте? Напишите об этом в комментариях по образцу **Hoy en... hace...**, например: _Hoy en Kiev hace frío y llueve._"

  - id: estaciones
    kind: vocab
    title: Времена года
    vocab:
      - "🗓 la estación del año [эстаθьо́н дэль а́ньо] — время года"
      - "🌸 la primavera [примабэ́ра] — весна"
      - "🏖 el verano [бэра́но] — лето"
      - "🍂 el otoño [ото́ньо] — осень"
      - "❄️ el invierno [имбьэ́рно] — зима"
      - "☁️ está nublado [эста́ нубла́до] — облачно, пасмурно"
      - "❤️ favorito/a [фабори́то, фабори́та] — любимый"
    blocks:
      - "Сегодня вы выучите названия четырёх времён года. Обратите внимание, что слово **la estación** означает и «вокзал», и «время года», а какое из значений имеется в виду, обычно понятно из разговора."
      - examples:
          items:
            - "En verano hace mucho calor. — Летом очень жарко."
            - "En invierno nieva. — Зимой идёт снег."
            - "En otoño llueve y está nublado. — Осенью дождливо и пасмурно."
            - "Mi estación favorita es la primavera. — Моё любимое время года — весна."
      - rule: |
          1. Если вы хотите сказать, **когда** что-то происходит, то поставьте перед временем года предлог **en**, а артикль в этом случае не нужен: _En verano hace calor._ (Летом жарко.) _En invierno nieva._ (Зимой идёт снег.) _En otoño llueve._ (Осенью идёт дождь.)
          2. Если же время года — это то, о чём вы рассказываете, то перед ним ставится артикль: _La primavera es muy bonita._ (Весна очень красивая.) _Mi estación favorita es el verano._ (Моё любимое время года — лето.) _El invierno en Kiev es muy largo._ (Зима в Киеве очень долгая.)
      - culture: "В Аргентине и Чили времена года идут наоборот, потому что эти страны находятся в Южном полушарии. Поэтому Новый год там празднуют летом, на пляже ☀️, а в июле там зима."
      - exercise:
          title: Responde
          items:
            - "¿Qué tiempo hace en verano en España? => Hace sol y mucho calor."
            - "¿Qué tiempo hace en invierno en Ucrania? => Hace mucho frío y nieva."
            - "¿Cuál es tu estación favorita? => Mi estación favorita es..."

  - id: meses1
    kind: vocab
    title: Месяцы (январь — июнь)
    vocab:
      - "📅 el mes [мэс] — месяц"
      - "❓ ¿Cuándo? [куа́ндо] — когда?"
      - "1️⃣ enero [энэ́ро] — январь"
      - "2️⃣ febrero [фэбрэ́ро] — февраль"
      - "3️⃣ marzo [ма́рθо] — март"
      - "4️⃣ abril [абри́ль] — апрель"
      - "5️⃣ mayo [ма́йо] — май"
      - "6️⃣ junio [ху́ньо] — июнь"
    blocks:
      - "Испанские названия месяцев похожи на русские, поэтому их легко запомнить. Обратите внимание, что по-испански месяцы пишутся с маленькой буквы: _enero_, _febrero_, _junio_. А чтобы сказать «в каком-то месяце», поставьте перед ним предлог **en**, так же как с временами года: _en enero_ (в январе), _en marzo_ (в марте), _en mayo_ (в мае)."
      - examples:
          items:
            - "En enero hace mucho frío. — В январе очень холодно."
            - "¿Cuándo vas a España? En mayo. — Когда ты едешь в Испанию? В мае."
            - "Junio es mi mes favorito. — Июнь — мой любимый месяц."
      - exercise:
          title: Traduce
          items:
            - "в феврале => en febrero"
            - "в апреле => en abril"
            - "Март — весенний месяц. => Marzo es un mes de primavera."
            - "Когда? В июне. => ¿Cuándo? En junio."

  - id: fechas
    kind: grammar
    title: "Месяцы (июль — декабрь) и даты"
    vocab:
      - "7️⃣ julio [ху́льо] — июль"
      - "8️⃣ agosto [аго́сто] — август"
      - "9️⃣ septiembre [сэптьэ́мбрэ] — сентябрь"
      - "🔟 octubre [окту́брэ] — октябрь"
      - "1️⃣1️⃣ noviembre [нобьэ́мбрэ] — ноябрь"
      - "1️⃣2️⃣ diciembre [диθьэ́мбрэ] — декабрь"
      - "🎂 el cumpleaños [кумплэа́ньос] — день рождения"
      - "📆 la fecha [фэ́ча] — дата"
    blocks:
      - "В этом уроке вы выучите оставшиеся шесть месяцев и узнаете, как по-испански называют дату."
      - examples:
          items:
            - "¿Qué fecha es hoy? Es el diez de octubre. — Какое сегодня число? Десятое октября."
            - "¿Cuándo es tu cumpleaños? Es el veinte de enero. — Когда у тебя день рождения? Двадцатого января."
            - "Mi cumpleaños es en agosto. — Мой день рождения в августе."
            - "Hoy es el uno de julio. — Сегодня первое июля."
      - rule: |
          1. Дата строится по схеме **el + число + de + месяц**: сначала идёт артикль **el**, потом число, потом предлог **de** и название месяца. Например: _el cinco de mayo_ (пятое мая), _el doce de octubre_ (двенадцатое октября), _el treinta de junio_ (тридцатое июня).
          2. В испанском для дат используют обычные числа, а не порядковые. Поэтому _el veinte_ означает «двадцатое», хотя дословно это «двадцать»: _el veinte de enero_ (двадцатое января), _el quince de agosto_ (пятнадцатое августа). Только первое число можно назвать двумя способами: и _el uno de julio_, и _el primero de julio_ означают «первое июля».
          3. Год читается как обычное число: 2026 читается _dos mil veintiséis_, 2000 читается _dos mil_, а 1990 читается _mil novecientos noventa_.
          4. Если вы называете только месяц, без числа, то вместо **el** нужен предлог **en**: _Mi cumpleaños es en septiembre._ (Мой день рождения в сентябре.) _En diciembre hace frío._ (В декабре холодно.) _Voy a España en julio._ (Я еду в Испанию в июле.)
      - exercise:
          title: Traduce
          items:
            - "8 марта => el ocho de marzo"
            - "1 сентября => el uno (primero) de septiembre"
            - "31 декабря => el treinta y uno de diciembre"
            - "Мой день рождения 14 ноября. => Mi cumpleaños es el catorce de noviembre."
      - task: "Когда у вас день рождения? Напишите об этом в комментариях по образцу **Mi cumpleaños es el... de...**"

  - id: muy_mucho
    kind: grammar
    title: Muy или mucho?
    vocab:
      - "🌡 el grado [гра́до] — градус :: Hoy hace treinta grados. — Сегодня тридцать градусов."
    blocks:
      - "Оба слова, **muy** и **mucho**, могут переводиться как «очень», а **mucho** к тому же значит «много». Посмотрите на примеры и обратите внимание, с какими словами стоит каждое из них."
      - examples:
          items:
            - "Hoy hace mucho calor. — Сегодня очень жарко."
            - "Está muy nublado. — Очень пасмурно."
            - "En Galicia llueve mucho. — В Галисии много дождей."
            - "El abrigo es muy caro. — Пальто очень дорогое."
            - "Hay mucha gente en la playa. — На пляже много людей."
      - rule: |
          1. Если «очень» относится к прилагательному или наречию, то нужно слово **muy**. Оно ставится перед этим словом и никогда не меняет форму: _La chaqueta es muy cara._ (Куртка очень дорогая.) _Los zapatos son muy caros._ (Туфли очень дорогие.) _Estoy muy bien._ (У меня всё очень хорошо.) _Me levanto muy temprano._ (Я встаю очень рано.)
          2. Если после «очень» или «много» стоит существительное, то нужно слово **mucho**, и оно согласуется с существительным в роде и числе, как прилагательное: _Hoy hace mucho calor._ (Сегодня очень жарко.) _Hay mucha leche en la nevera._ (В холодильнике много молока.) _Carlos tiene muchos libros._ (У Карлоса много книг.) _En el centro hay muchas tiendas._ (В центре много магазинов.)
          3. Если «много» или «очень» относится к глаголу, то **mucho** ставится после глагола и тоже не меняет форму: _En Galicia llueve mucho._ (В Галисии часто идут дожди.) _Mis padres trabajan mucho._ (Мои родители много работают.) _Carlos lee mucho._ (Карлос много читает.)
      - exercise:
          title: "¿Muy o mucho?"
          items:
            - "Hace ___ frío. => mucho"
            - "Madrid es ___ bonito. => muy"
            - "En verano hay ___ gente en la playa. => mucha"
            - "Mi hermano duerme ___. => mucho"
            - "Hoy hace ___ buen tiempo. => muy"
            - "Tengo ___ amigos. => muchos"

  - id: lectura
    kind: reading
    title: Климат Испании
    vocab:
      - "🌍 el clima [кли́ма] — климат"
      - "⬆️ el norte [но́ртэ] — север"
      - "⬇️ el sur [сур] — юг"
      - "🤏 casi [ка́си] — почти"
    blocks:
      - "Испания не очень большая страна, но погода в разных её частях очень разная. Прочитайте текст и найдите в нём все слова, которые говорят о погоде."
      - reading:
          title: El clima de España
          text: |
            En el norte de España, en Galicia, llueve mucho y no hace mucho calor. Todo es muy verde.

            En el centro, en Madrid, hace mucho frío en invierno y mucho calor en verano.

            En el sur, en Andalucía, hace sol casi todo el año. En verano hace mucho calor: ¡a veces cuarenta y cinco grados!

            ¿Y en Ucrania? En Ucrania hace mucho frío en invierno y nieva mucho. ¡Pero en verano a veces hace calor!
          translation: |
            На севере Испании, в Галисии, часто идёт дождь и не очень жарко. Всё очень зелёное.

            В центре, в Мадриде, зимой очень холодно, а летом очень жарко.

            На юге, в Андалусии, солнце почти весь год. Летом очень жарко: иногда сорок пять градусов!

            А в Украины? В Украины зимой очень холодно и много снега. Но летом иногда бывает жарко!
      - exercise:
          title: Responde
          items:
            - "¿Qué tiempo hace en Galicia? => Llueve mucho y no hace mucho calor."
            - "¿Cómo es el invierno en Madrid? => Hace mucho frío."
            - "¿Dónde hace sol casi todo el año? => En el sur, en Andalucía."
      - note: "Кроме севера и юга, есть ещё две стороны света: **el este** означает «восток», а **el oeste** означает «запад». Например, фраза _Valencia está en el este de España_ значит «Валенсия находится на востоке Испании»."
    forms: [oeste]
    quiz:
      - q: ¿Dónde llueve mucho?
        options: "en el norte | en el sur | en el centro"
      - q: ¿Cuántos grados hace a veces en verano en Andalucía?
        options: "cuarenta y cinco | treinta | veinticinco"

  - id: quiz
    kind: quiz
    title: Погода и даты
    blocks:
      - "Пришло время проверить себя: это тест по теме «Погода и даты»."
      - cando:
          - "рассказать о погоде: hace calor, llueve, está nublado"
          - "назвать времена года и месяцы"
          - "сказать дату: el cinco de mayo"
          - "выбрать muy или mucho"
    quiz:
      - q: Как сказать «Холодно»?
        options: "Hace frío. | Es frío. | Está frío."
        explain: "Когда говорят о погоде, используют глагол hace: hace frío, hace calor, hace sol."
      - q: "Hoy hace ___ calor."
        options: "mucho | muy | mucha"
        explain: "Слово calor — существительное мужского рода, поэтому перед ним ставится mucho, а не muy: hace mucho calor, hace mucho frío."
      - q: Какой месяц идёт после «junio»?
        options: "julio | mayo | agosto"
      - q: Как сказать «пятое мая»?
        options: "el cinco de mayo | el quinto mayo | cinco mayo"
        explain: "Дату называют обычным числом по схеме el + число + de + месяц: el cinco de mayo, el doce de octubre."
      - q: Что значит «Llueve»?
        options: "Идёт дождь. | Идёт снег. | Ветрено."
