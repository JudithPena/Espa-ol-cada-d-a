id: cosas
number: 6
level: A0
title: Вещи вокруг нас
goals:
  - назвать предметы вокруг себя
  - понимать род слов и выбирать артикль el, la, un, una
  - образовывать множественное число и говорить, что где есть

lessons:
  - id: vocab1
    kind: vocab
    title: ¿Qué es esto?
    vocab:
      - "❓ ¿Qué es esto? [кэ эс э́сто] — что это? :: ¿Qué es esto? Es un libro. — Что это? Это книга."
      - "☝️ un / una [ун, у́на] — (какой-то) один, одна; неопределённый артикль :: Es una llave. — Это ключ."
      - "📕 el libro [ли́бро] — книга"
      - "📓 el cuaderno [куадэ́рно] — тетрадь"
      - "🖊 el bolígrafo [боли́графо] — ручка"
      - "🎒 la mochila [мочи́ла] — рюкзак"
      - "🔑 la llave [лья́бэ] — ключ"
    blocks:
      - "Самый простой способ узнать новое слово такой: покажите на предмет и спросите **¿Qué es esto?**, то есть «Что это?». В ответ вы услышите **Es un...** или **Es una...** и название предмета."
      - examples:
          items:
            - "¿Qué es esto? Es un cuaderno. — Что это? Это тетрадь."
            - "¿Qué es esto? Es una mochila. — Что это? Это рюкзак."
            - "¿Es un libro? No, es un cuaderno. — Это книга? Нет, это тетрадь."
      - tip: "Заметили? Перед одними словами стоит **un**, а перед другими стоит **una**: _un libro, un cuaderno, un bolígrafo_, но _una mochila, una llave_. Это зависит от рода слова. В следующем уроке мы разберёмся, как род узнать."
      - exercise:
          title: Responde
          items:
            - "📕 ¿Qué es esto? => Es un libro."
            - "🔑 ¿Qué es esto? => Es una llave."
            - "🖊 ¿Qué es esto? => Es un bolígrafo."
            - "🎒 ¿Qué es esto? => Es una mochila."

  - id: genero
    kind: grammar
    title: "Мужской и женский род: el, la, un, una"
    vocab:
      - "🍽️ la mesa [мэ́са] — стол"
      - "🪑 la silla [си́лья] — стул"
      - "📅 el día [ди́а] — день"
      - "📷 la foto [фо́то] — фотография"
      - "🗺 el mapa [ма́па] — карта"
      - "🔀 o [о] — или :: ¿El o la? — El или la?"
    blocks:
      - "Посмотрите на три группы слов. Как вы думаете, можно ли по окончанию слова угадать его артикль?"
      - table:
          rows:
            - ["el libro, el cuaderno, el bolígrafo", "эти слова заканчиваются на `-o`, и перед ними стоит **el**"]
            - ["la mochila, la mesa, la silla", "эти слова заканчиваются на `-a`, и перед ними стоит **la**"]
            - ["el café, el hotel, la llave", "у этих слов другие окончания, поэтому артикль нужно запомнить"]
      - rule: |
          1. Если слово заканчивается на **-o**, то обычно оно мужского рода, и перед ним ставится **el**: _el libro, el cuaderno, el queso, el vino_.
          2. Если слово заканчивается на **-a**, то обычно оно женского рода, и перед ним ставится **la**: _la mesa, la silla, la casa, la plaza_.
          3. Если слово заканчивается на другую букву, то по окончанию род не угадать, и его нужно запомнить: _el café, el hotel, el jamón_, но _la llave, la traducción_. Например, chocolate и llave оба заканчиваются на `-e`, но говорят _el chocolate_ и _la llave_. Поэтому учите слова сразу **с артиклем**.
          4. Есть исключения. Слова **día** и **mapa** заканчиваются на `-a`, но они мужского рода: _el día, un día, el mapa, un mapa de España_. А слово **foto** заканчивается на `-o`, но оно женского рода, потому что это сокращение от `la fotografía`: _la foto, una foto, la foto de Pablo_.
      - table:
          title: Артикли
          rows:
            - ["**el** и **la** ставятся, когда речь идёт о том самом, уже известном предмете", "**el** libro, **la** mesa, **el** mapa, **la** foto"]
            - ["**un** и **una** ставятся, когда речь идёт о каком-то предмете, одном из многих", "**un** libro, **una** mesa, **un** mapa, **una** foto"]
      - "Посмотрите, как это работает в речи. Когда предмет появляется впервые, говорят **un** или **una**. Когда о нём уже говорили и понятно, о каком предмете речь, говорят **el** или **la**."
      - examples:
          items:
            - "Es un libro. El libro es de Ana. — Это книга. Книга — Аны."
            - "Es una foto. La foto es de Pablo. — Это фотография. Фото — Пабло."
            - "Es un mapa. El mapa es de Carlos. — Это карта. Карта — Карлоса."
      - note: "Слово **de** показывает, кому что принадлежит. Сначала называют предмет, а потом через **de** называют владельца: _el libro de Ana_ значит «книга Аны», _el amigo de Pablo_ значит «друг Пабло», а _la mochila de Carlos_ значит «рюкзак Карлоса»."
      - exercise:
          title: "¿El o la?"
          items:
            - "___ mesa => la"
            - "___ cuaderno => el"
            - "___ llave => la"
            - "___ día => el"
            - "___ foto => la"
            - "___ mapa => el"
      - exercise:
          title: "¿Un o una?"
          items:
            - "Es ___ silla. => una"
            - "Es ___ bolígrafo. => un"
            - "Es ___ mochila. => una"
            - "Es ___ hotel. => un"

  - id: vocab2
    kind: vocab
    title: В комнате
    vocab:
      - "💻 el ordenador [ордэнадо́р] — компьютер"
      - "📱 el móvil [мо́биль] — мобильный телефон"
      - "🚪 la puerta [пуэ́рта] — дверь"
      - "🪟 la ventana [бэнта́на] — окно"
      - "⌚ el reloj [рэло́х] — часы"
      - "💡 la lámpara [ла́мпара] — лампа"
    blocks:
      - "Сегодня у нас шесть слов о том, что окружает вас прямо сейчас. Посмотрите вокруг и назовите вслух всё, что знаете: **Es una ventana. Es un móvil...**"
      - latam: "компьютер называют **la computadora**, а мобильный телефон называют **el celular**: _Es la computadora de Ana._ _Es el celular de Pablo._ _¿Es tu celular?_"
      - tip: "В слове **reloj** последняя буква `j` почти не слышна, поэтому слово читается примерно как [рэло́]: _Es un reloj._ _Es el reloj de Carlos._"
      - exercise:
          title: "Traduce (с артиклем!)"
          items:
            - "окно => la ventana"
            - "часы => el reloj"
            - "дверь => la puerta"
            - "компьютер => el ordenador"
            - "Это мобильный Пабло. => Es el móvil de Pablo."
    forms: [computadora, celular]

  - id: plural
    kind: grammar
    title: "Много вещей: los, las, hay"
    unlocks: [plural]
    vocab:
      - "👥 los / las [лос, лас] — артикль во множественном числе :: los libros, las mesas — книги, столы"
      - "👥 unos / unas [у́нос, у́нас] — несколько, какие-то :: unos cuadernos — несколько тетрадей"
      - "✅ hay [ай] — есть, имеется :: En la mesa hay un libro. — На столе (лежит) книга."
      - "❓ ¿Qué hay en...? [кэ ай эн] — что есть в / на...? :: ¿Qué hay en la mochila? — Что в рюкзаке?"
      - "✏️ el lápiz [ла́пиθ] — карандаш"
    blocks:
      - "Посмотрите, как меняются слова, когда предметов много. Видите три разных случая?"
      - table:
          rows:
            - ["el libro → los libro**s**", "la mesa → las mesa**s**"]
            - ["el reloj → los reloj**es**", "el móvil → los móvil**es**"]
            - ["el lápiz → los lápi**ces**", "буква `z` меняется на `c`, и добавляется `-es`"]
      - rule: |
          1. Если слово заканчивается на гласную, то во множественном числе к нему добавляется `-s`: libro**s**, mesa**s**, café**s**, llave**s**.
          2. Если слово заканчивается на согласную, то к нему добавляется `-es`: reloj**es**, hotel**es**, móvil**es**, señor**es**.
          3. Если слово заканчивается на `z`, то `z` меняется на `c`, и добавляется `-es`: из lápiz получается lápi**ces**. _Un lápiz, dos lápices, tres lápices._
          4. Артикли тоже меняются. Вместо **el** во множественном числе говорят **los**, вместо **la** говорят **las**, вместо **un** говорят **unos**, а вместо **una** говорят **unas**: _los libros, las mesas, unos cuadernos, unas llaves_.
      - header: "Hay — «есть, имеется»"
      - |
        1. Слово **hay** никогда не меняется: и об одном предмете, и о многих говорят **hay**. _Hay un libro._ _Hay dos libros._ _Hay unas llaves._
        2. После **hay** обычно не ставят **el** и **la**, потому что **hay** сообщает о каком-то новом предмете. Поэтому говорят _hay un libro_, а не `hay el libro`, и _hay una mesa_, а не `hay la mesa`.
        3. Если чего-то нет, то перед **hay** ставится **no**: _No hay ventanas._ _En la mesa no hay libros._
      - examples:
          items:
            - "En la mesa hay un ordenador y dos libros. — На столе компьютер и две книги."
            - "¿Qué hay en la mochila? Hay unas llaves. — Что в рюкзаке? Какие-то ключи."
            - "No hay ventanas. — Окон нет."
      - exercise:
          title: Множественное число
          items:
            - "el cuaderno => los cuadernos"
            - "la llave => las llaves"
            - "el hotel => los hoteles"
            - "el lápiz => los lápices"
            - "una silla => unas sillas"
            - "el día => los días"

  - id: lectura
    kind: reading
    title: ¿Qué hay en la mochila?
    vocab:
      - "🍼 la botella [ботэ́лья] — бутылка"
      - "👓 las gafas [га́фас] — очки"
      - "💶 el dinero [дине́ро] — деньги"
    blocks:
      - "Прочитайте текст, а потом послушайте аудио. В конце урока вас ждут вопросы на испанском, и вы уже сможете на них ответить."
      - reading:
          title: La mochila de Ana
          text: |
            Ana tiene una mochila. ¿Qué hay en la mochila de Ana?

            Hay un libro, dos cuadernos, tres bolígrafos y un lápiz. También hay unas llaves, unas gafas y un móvil. Hay una botella, pero no hay dinero.

            ¿Y el ordenador? ¡No hay ordenador! El ordenador de Ana está en casa.
          translation: |
            У Аны есть рюкзак. Что в рюкзаке у Аны?

            Там книга, две тетради, три ручки и карандаш. Ещё там ключи, очки и мобильный. Есть бутылка, но нет денег.

            А компьютер? Компьютера нет! Компьютер Аны дома.
      - note: "**Está en casa** значит «находится дома». Глагол **está** мы подробно разберём позже, а пока запомните **en casa** как готовую фразу, которая значит «дома»: _El ordenador está en casa._ _Ana está en casa._ _¿Dónde está el ordenador? En casa._"
      - exercise:
          title: Responde
          items:
            - "¿Cuántos cuadernos hay? => Hay dos cuadernos."
            - "¿Hay un móvil? => Sí, hay un móvil."
            - "¿Hay dinero? => No, no hay dinero."
            - "¿Dónde está el ordenador? => En casa."
    quiz:
      - q: ¿Cuántos bolígrafos hay en la mochila?
        options: "tres | dos | uno"
      - q: ¿Qué no hay en la mochila?
        options: "dinero | gafas | llaves"

  - id: practica
    kind: practice
    title: el, la, los, las
    blocks:
      - "Сегодня тренируем артикли и множественное число. Сначала ответьте вслух, а потом проверьте себя."
      - exercise:
          title: "¿El, la, los o las?"
          items:
            - "___ ventanas => las"
            - "___ reloj => el"
            - "___ gafas => las"
            - "___ días => los"
            - "___ mapa => el"
            - "___ fotos => las"
      - exercise:
          title: Traduce
          items:
            - "Что это? Это ключи. => ¿Qué es esto? Son unas llaves."
            - "На столе две бутылки. => En la mesa hay dos botellas."
            - "В рюкзаке нет денег. => En la mochila no hay dinero."
            - "Это телефон Пабло. => Es el teléfono de Pablo."
      - note: "**Son** — это форма глагола **ser** для множественного числа, она значит «(они) есть». Если предмет один, то говорят **es**, а если предметов много, то говорят **son**: _Es una llave_, но _Son unas llaves_; _Es un libro_, но _Son unos libros_; _Es una foto_, но _Son unas fotos_. Подробнее о глаголе **ser** мы поговорим в следующей теме."
      - exercise:
          title: Найдите ошибку
          items:
            - "la día => el día"
            - "`los lápizes` => los lápices"
            - "Hay el libro en la mesa. => Hay un libro en la mesa."
      - task: "Что лежит у вас на столе? Напишите об этом в комментариях и начните так: **En mi mesa hay...**"
    forms: [son]

  - id: quiz
    kind: quiz
    title: Вещи вокруг нас
    blocks:
      - "Это тест по теме «Вещи вокруг нас». Проверьте, что вы запомнили."
      - cando:
          - "спросить ¿Qué es esto? и ответить"
          - "выбрать артикль: el / la, un / una"
          - "образовать множественное число: libros, relojes, lápices"
          - "сказать, что где есть: En la mesa hay..."
    quiz:
      - q: Какой артикль у слова «día»?
        options: "el | la"
        answer: 0
        explain: "Слово día заканчивается на -a, но это исключение: оно мужского рода, поэтому говорят el día."
      - q: Множественное число от «el lápiz»
        options: "los lápices | los lápizes | los lápizs"
        explain: "Если слово заканчивается на `z`, то `z` меняется на `c` и добавляется -es: lápiz, lápices."
      - q: Множественное число от «el reloj»
        options: "los relojes | los relojs | las relojes"
        explain: "Слово reloj заканчивается на согласную, поэтому добавляется -es. Оно мужского рода, поэтому нужен артикль los."
      - q: "En la mesa ___ un libro."
        options: "hay | es | tiene"
        explain: "Когда говорят, что где-то что-то есть или лежит, используют hay: En la mesa hay un libro."
      - q: Как сказать «какие-то ключи»?
        options: "unas llaves | unos llaves | las llave"
        explain: "Слово llave женского рода, поэтому во множественном числе нужен артикль unas: unas llaves."
