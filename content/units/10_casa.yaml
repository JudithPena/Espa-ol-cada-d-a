id: casa
number: 10
level: A1
title: Мой дом
goals:
  - описать квартиру или дом
  - сказать, где что находится
  - различать hay и está

lessons:
  - id: vocab1
    kind: vocab
    title: Комнаты
    vocab:
      - "🏢 el piso [пи́со] — квартира; этаж"
      - "🚪 la habitación [абитаθьо́н] — комната; спальня"
      - "🛏 el dormitorio [дормито́рьо] — спальня"
      - "🛋 el salón [сало́н] — гостиная"
      - "🍳 la cocina [коθи́на] — кухня"
      - "🛁 el baño [ба́ньо] — ванная; туалет"
      - "🌇 el balcón [бальо́н] — балкон"
      - "🐘 grande [гра́ндэ] — большой {pos: adj}"
    blocks:
      - "Начинаем новую тему: дом. В Испании большинство людей живёт не в отдельных домах, а в квартирах, и квартира по-испански называется **el piso**."
      - examples:
          items:
            - "Vivo en un piso grande. — Я живу в большой квартире."
            - "El piso tiene tres habitaciones. — В квартире три комнаты."
            - "La cocina es pequeña. — Кухня маленькая."
            - "¿Tienes balcón? — У тебя есть балкон?"
      - latam: "квартиру обычно называют **el departamento** или **el apartamento**: _Vivo en un departamento grande_ — «Я живу в большой квартире», _Mi apartamento tiene dos baños_ — «В моей квартире два туалета». А спальню там часто называют **el cuarto**: _Mi cuarto es pequeño_ — «Моя спальня маленькая»."
      - note: "Слово **la cocina** («кухня») родственно глаголу **cocinar** («готовить») и слову **cocinero** («повар»), которые вы уже знаете: _Cocino en la cocina_ — «Я готовлю на кухне», _Mi padre cocina muy bien_ — «Мой папа очень хорошо готовит», _Carlos es cocinero_ — «Карлос работает поваром»."
      - exercise:
          title: Traduce
          items:
            - "большая гостиная => un salón grande"
            - "В квартире два туалета. => El piso tiene dos baños."
            - "Моя спальня маленькая. => Mi dormitorio es pequeño."
            - "У нас нет балкона. => No tenemos balcón."
    forms: [departamento, apartamento, cuarto]

  - id: vocab2
    kind: vocab
    title: Мебель и техника
    vocab:
      - "🛏 la cama [ка́ма] — кровать"
      - "🛋 el sofá [софа́] — диван"
      - "🚪 el armario [арма́рьо] — шкаф"
      - "📚 la estantería [эстантэри́а] — полка, стеллаж"
      - "🧊 la nevera [нэбэ́ра] — холодильник"
      - "📺 la tele [тэ́лэ] — телевизор (сокр. от la televisión)"
      - "🚿 la ducha [ду́ча] — душ"
    blocks:
      - "Что стоит в комнатах? Повторяйте слова за аудио и показывайте на такие же вещи у себя дома."
      - examples:
          items:
            - "En el dormitorio hay una cama y un armario. — В спальне кровать и шкаф."
            - "En el salón hay un sofá y una tele. — В гостиной диван и телевизор."
            - "La nevera es blanca. — Холодильник белый."
            - "En el baño hay una ducha. — В ванной есть душ."
      - exercise:
          title: "¿Qué hay en...?"
          items:
            - "¿Qué hay en la cocina? => Hay una nevera, una mesa..."
            - "¿Qué hay en el dormitorio? => Hay una cama, un armario..."
            - "¿Qué hay en el salón? => Hay un sofá, una tele, una estantería..."
    forms: [televisión]

  - id: estar
    kind: grammar
    title: "¿Dónde está? Глагол estar"
    vocab:
      - "📍 estar [эста́р] — находиться; быть (где-то)"
      - "❓ ¿Dónde está...? [до́ндэ эста́] — где находится...? :: ¿Dónde está el baño? — Где туалет?"
      - "⬆️ encima de [энθи́ма дэ] — на, поверх"
      - "⬇️ debajo de [дэба́хо дэ] — под"
      - "↔️ al lado de [аль ла́до дэ] — рядом с"
    blocks:
      - "Посмотрите на вопросы и ответы. Какой глагол испанцы используют, когда говорят, **где** что-то находится?"
      - examples:
          items:
            - "¿Dónde está el libro? Está en la mesa. — Где книга? На столе."
            - "¿Dónde están las llaves? Están en la mochila. — Где ключи? В рюкзаке."
            - "¿Dónde estás? Estoy en la cocina. — Где ты? Я на кухне."
            - "Madrid está en España. — Мадрид находится в Испании."
      - rule: |
          Если вы говорите, где кто-то или что-то находится, то всегда используйте глагол **estar**. Это касается и людей, и предметов, и городов:
          1. О людях: _Estoy en casa_ — «Я дома», _Mis padres están en Sevilla_ — «Мои родители в Севилье».
          2. О предметах: _El sofá está en el salón_ — «Диван стоит в гостиной», _La nevera está en la cocina_ — «Холодильник стоит на кухне».
          3. О городах и странах: _Málaga está en Andalucía_ — «Малага находится в Андалусии», _Bogotá está en Colombia_ — «Богота находится в Колумбии».
      - conjugation:
          verb: estar
          ru: находиться
          forms: [estoy, estás, está, estamos, estáis, están]
      - table:
          title: Где?
          rows:
            - ["**en**", "значит «в» или «на»: _en la mesa_, _en la cocina_, _en el sofá_"]
            - ["**encima de**", "значит «на» или «поверх»: _encima de la cama_, _encima de la mesa_, _encima del armario_"]
            - ["**debajo de**", "значит «под»: _debajo de la mesa_, _debajo de la cama_, _debajo del sofá_"]
            - ["**al lado de**", "значит «рядом с»: _al lado de la ventana_, _al lado de la puerta_, _al lado del baño_"]
      - note: "Вы уже знаете, что предлог **de** и артикль **el** сливаются в одно слово **del**. Здесь происходит то же самое: _debajo del sofá_, _al lado del armario_, _encima del sofá_. А с артиклем **la** предлог **de** не сливается: _al lado de la puerta_, _debajo de la cama_, _encima de la mesa_."
      - exercise:
          title: Responde
          items:
            - "🐱 под 🛏: ¿Dónde está el gato? => Está debajo de la cama."
            - "📕 на 🛋: ¿Dónde está el libro? => Está encima del sofá."
            - "🖼 рядом с 🚪: ¿Dónde está la foto? => Está al lado de la puerta."
            - "Nosotros ___ en casa. => estamos"
            - "¿Dónde ___ (tú)? => estás"

  - id: preposiciones
    kind: grammar
    title: Перед, за, между
    vocab:
      - "▶️ delante de [дэла́нтэ дэ] — перед"
      - "◀️ detrás de [дэтра́с дэ] — за, позади"
      - "↔️ entre [э́нтрэ] — между :: entre la cama y el armario — между кроватью и шкафом"
      - "🤏 cerca de [θэ́рка дэ] — близко от, недалеко"
      - "🛫 lejos de [лэ́хос дэ] — далеко от"
    blocks:
      - "Вот ещё пять слов, с помощью которых можно сказать, где что-то находится. Четыре из них употребляются с предлогом **de**: _delante de la casa_, _detrás del hotel_, _cerca de la plaza_, _lejos de la oficina_. А после **entre** предлог **de** не ставится: _entre la puerta y la ventana_, _entre Madrid y Sevilla_."
      - examples:
          items:
            - "La tele está delante del sofá. — Телевизор перед диваном."
            - "El perro está detrás de la puerta. — Собака за дверью."
            - "La mesa está entre la cama y el armario. — Стол между кроватью и шкафом."
            - "Mi casa está cerca de la universidad. — Мой дом недалеко от университета."
            - "Moscú está lejos de Madrid. — Москва далеко от Мадрида."
      - exercise:
          title: Traduce
          items:
            - "Кот за диваном. => El gato está detrás del sofá."
            - "Стул перед окном. => La silla está delante de la ventana."
            - "Ванная между кухней и спальней. => El baño está entre la cocina y el dormitorio."
            - "Моя квартира далеко от центра? Нет, близко. => ¿Mi piso está lejos? No, está cerca."
      - task: "Где вы сейчас? Напишите в комментариях, где вы находитесь: **Estoy en...** А потом напишите, что стоит рядом с вами: **Al lado de mí hay...**"
    forms: [mí]

  - id: hay_esta
    kind: grammar
    title: Hay или está?
    vocab:
      - "📌 aquí [аки́] — здесь, тут"
      - "👉 allí [айи́] — там"
    blocks:
      - "Сравните две пары предложений. Как вы думаете, когда испанцы говорят **hay**, а когда **está**?"
      - examples:
          items:
            - "En el salón hay un sofá. — В гостиной есть диван."
            - "El sofá está al lado de la ventana. — Диван (стоит) у окна."
            - "¿Hay un baño aquí? — Здесь есть туалет?"
            - "Sí, el baño está allí. — Да, туалет там."
      - rule: |
          1. Слово **hay** используют, когда сообщают, что где-то **есть** какой-то предмет, то есть дают новую информацию. Поэтому после **hay** обычно стоит **un** или **una**, число или существительное без артикля: _En la cocina hay **una** nevera_, _En mi casa hay **dos** baños_, _En la mesa hay **libros**_. Само слово **hay** при этом не меняется, даже если предметов много.
          2. Формы **está** и **están** используют, когда говорят, **где** находится предмет или человек, о котором уже известно. Поэтому перед ними обычно стоит **el** или **la**, слово вроде **mi** или имя: _**La** cama está en el dormitorio_, _**Mis** llaves están en la mochila_, _**Carmen** está en la cocina_. Если предмет один, то говорят **está**, а если их несколько, то **están**.
      - exercise:
          title: "¿Hay o está?"
          items:
            - "En mi casa ___ dos baños. => hay"
            - "El baño ___ al lado del dormitorio. => está"
            - "¿Dónde ___ las gafas? => están"
            - "En la mesa ___ unas gafas. => hay"
            - "¿___ una nevera en la cocina? => Hay"
            - "La nevera ___ en la cocina. => está"

  - id: lectura
    kind: reading
    title: Mi piso
    vocab:
      - "🏙 el centro [θэ́нтро] — центр"
      - "✨ nuevo/a [нуэ́бо, нуэ́ба] — новый"
      - "🏚 viejo/a [бьэ́хо, бьэ́ха] — старый"
      - "🌸 bonito/a [бони́то, бони́та] — красивый, симпатичный (о вещах, местах)"
      - "🛋 cómodo/a [ко́модо, ко́мода] — удобный"
      - "🔢 ¿cuántos? / ¿cuántas? [куа́нтос, куа́нтас] — сколько? (м. р. / ж. р.) :: ¿Cuántas sillas hay? — Сколько стульев?"
    blocks:
      - "Сара рассказывает о своей квартире. Сначала прочитайте текст сами, а потом послушайте его и следите по тексту."
      - reading:
          title: Mi piso
          text: |
            Me llamo Sara y vivo en un piso pequeño en el centro de Madrid. El piso es viejo, pero muy bonito.

            Tiene dos habitaciones: mi dormitorio y un salón. En el salón hay un sofá azul muy cómodo, una mesa y cuatro sillas. La tele está delante del sofá.

            La cocina es pequeña, pero tiene una nevera nueva. El baño está al lado de la cocina.

            No tengo balcón, pero hay dos ventanas grandes. ¡Mi gato está en la ventana todo el día!
          translation: |
            Меня зовут Сара, я живу в маленькой квартире в центре Мадрида. Квартира старая, но очень красивая.

            В ней две комнаты: моя спальня и гостиная. В гостиной очень удобный синий диван, стол и четыре стула. Телевизор стоит перед диваном.

            Кухня маленькая, но в ней новый холодильник. Ванная рядом с кухней.

            Балкона у меня нет, но есть два больших окна. Мой кот весь день сидит на окне!
      - note: "Выражение **todo el día** значит «весь день»: _Mi gato está en la ventana todo el día_ — «Мой кот весь день сидит на окне», _Trabajo todo el día_ — «Я работаю весь день», _Mi hermana estudia todo el día_ — «Моя сестра учится весь день»."
      - exercise:
          title: Responde
          items:
            - "¿Dónde está el piso de Sara? => En el centro de Madrid."
            - "¿Cómo es el piso? => Es pequeño y viejo, pero muy bonito."
            - "¿De qué color es el sofá? => Es azul."
            - "¿Dónde está la tele? => Delante del sofá."
            - "¿Hay balcón? => No, no hay balcón."
    forms: [todo]
    quiz:
      - q: ¿Cuántas habitaciones tiene el piso?
        options: "dos | tres | una"
      - q: ¿Qué es nuevo en la cocina?
        options: "la nevera | la mesa | la ventana"

  - id: escucha
    kind: listening
    title: ¿Dónde están mis llaves?
    vocab:
      - "👩‍👦 mamá / papá [мама́, папа́] — мама / папа"
    blocks:
      - "Пабло опаздывает и не может найти ключи. Послушайте его разговор с мамой и ответьте на вопросы."
      - dialogue:
          hidden: true
          voices: {Madre: f}
          lines:
            - "Pablo: Mamá, ¿dónde están mis llaves? | Мама, где мои ключи?"
            - "Madre: ¿Están en tu mochila? | В твоём рюкзаке?"
            - "Pablo: No, no están en la mochila. | Нет, в рюкзаке их нет."
            - "Madre: ¿Y en la mesa del salón? | А на столе в гостиной?"
            - "Pablo: No... En la mesa hay un libro y unas gafas. | Нет... На столе книга и очки."
            - "Madre: ¡Mis gafas! Gracias, Pablo. ¿Y tus llaves están debajo del sofá? | Мои очки! Спасибо, Пабло. А твои ключи не под диваном?"
            - "Pablo: ¡Sí! Están aquí, debajo del sofá. Y el gato también está aquí. | Да! Вот они, под диваном. И кот тоже здесь."
    quiz:
      - q: ¿Dónde están las llaves de Pablo?
        options: "debajo del sofá | en la mochila | en la mesa"
      - q: ¿Qué hay en la mesa del salón?
        options: "un libro y unas gafas | las llaves | el gato"
      - q: ¿Las gafas son de Pablo?
        options: "No, son de su madre. | Sí, son de Pablo. | No, son de su padre."

  - id: quiz
    kind: quiz
    title: Мой дом
    blocks:
      - "Сегодня у нас тест по теме «Мой дом»."
      - cando:
          - "назвать комнаты и мебель"
          - "сказать, где что находится: está encima de, debajo de, al lado de..."
          - "выбрать между hay и está"
    quiz:
      - q: "¿Dónde ___ mis gafas?"
        options: "están | hay | son"
        explain: "Мы спрашиваем, где находятся очки, поэтому нужен глагол estar. Слово gafas стоит во множественном числе, значит, нужна форма están."
      - q: "En la cocina ___ una nevera."
        options: "hay | está | es"
        explain: "Мы сообщаем, что на кухне есть холодильник, то есть даём новую информацию, поэтому нужно hay."
      - q: "El gato está debajo ___ sofá."
        options: "del | de el | de la"
        explain: "Предлог de и артикль el всегда сливаются в одно слово del, поэтому правильно сказать debajo del sofá."
      - q: "Nosotros ___ en casa."
        options: "estamos | somos | estáis"
        explain: "Когда говорят, где кто находится, используют глагол estar. Для nosotros у него форма estamos."
      - q: Как сказать «между»?
        options: "entre | detrás de | encima de"
        explain: "Entre значит «между», и после него предлог de не ставится: entre la cama y el armario. А detrás de значит «за», encima de значит «на»."
