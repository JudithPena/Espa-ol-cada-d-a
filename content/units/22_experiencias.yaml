id: experiencias
number: 22
level: A1
title: Что вы сделали сегодня?
goals:
  - рассказать, что вы сделали сегодня и на этой неделе
  - спросить о жизненном опыте: «Ты когда-нибудь…?»
  - образовывать причастия: hablado, comido, vivido

lessons:
  - id: perfecto
    kind: grammar
    title: "He comido: прошедшее время"
    unlocks: [participle]
    vocab:
      - "🔧 haber [абэ́р] — вспомогательный глагол (иметь)"
      - "🌅 esta mañana [э́ста манья́на] — сегодня утром"
      - "🗓 esta semana [э́ста сэма́на] — на этой неделе"
      - "✅ ya [йа] — уже :: Ya he comido. — Я уже поел."
      - "⏳ todavía no [тодаби́а но] — ещё не :: Todavía no he comido. — Я ещё не ел."
    blocks:
      - "Сегодня вы знакомитесь с первым прошедшим временем! Посмотрите на примеры и подумайте, из каких двух слов состоит глагол в каждой фразе."
      - examples:
          items:
            - "Hoy he trabajado mucho. — Сегодня я много работал."
            - "Esta mañana he desayunado en un bar. — Сегодня утром я позавтракал в баре."
            - "¿Has comido? Sí, ya he comido. — Ты поел? Да, уже поел."
            - "Esta semana hemos visto dos películas. — На этой неделе мы посмотрели два фильма."
            - "Todavía no he hecho la tarea. — Я ещё не сделал задание."
      - conjugation:
          verb: haber
          ru: вспомогательный глагол
          highlight: false
          forms: [he, has, ha, hemos, habéis, han]
      - rule: |
          Это время состоит из двух слов: сначала идёт глагол **haber** в нужной форме, а за ним причастие основного глагола: _he trabajado_ — «я работал», _has comido_ — «ты поел», _ha vivido_ — «он жил» или «она жила», _hemos visto_ — «мы видели».
          Причастие образуется так:
          1. Если глагол заканчивается на **-ar**, то вместо **-ar** добавьте **-ado**. Так из hablar получается habl**ado**, из trabajar получается trabaj**ado**, а из desayunar получается desayun**ado**.
          2. Если глагол заканчивается на **-er** или **-ir**, то вместо этого окончания добавьте **-ido**. Так из comer получается com**ido**, из beber получается beb**ido**, а из vivir и salir получаются viv**ido** и sal**ido**.
          Причастие никогда не меняется. И мужчина, и женщина скажут _he comido_, и с любым лицом оно остаётся тем же: _has comido, hemos comido, han comido_. Меняется только **haber**.
          Это время используют, когда говорят о том, что произошло **в период, который ещё не закончился**. Поэтому рядом с ним часто стоят слова _hoy, esta mañana, esta semana, este año_: _Hoy he estudiado dos horas._ — «Сегодня я занимался два часа», _Esta semana he leído un libro._ — «На этой неделе я прочитал книгу», _Este año hemos viajado a España._ — «В этом году мы ездили в Испанию».
      - table:
          title: Неправильные причастия
          rows:
            - ["hacer", "**hecho**"]
            - ["ver", "**visto**"]
            - ["escribir", "**escrito**"]
            - ["volver", "**vuelto**"]
            - ["abrir", "**abierto**"]
      - "Эти пять причастий образуются не по правилу, поэтому их нужно запомнить. Посмотрите, как они звучат во фразах: _¿Qué has hecho hoy?_ — «Что ты сегодня делал?», _Hemos visto una película muy buena._ — «Мы посмотрели очень хороший фильм», _Ana ha escrito un texto en español._ — «Ана написала текст на испанском», _Pablo ya ha vuelto a casa._ — «Пабло уже вернулся домой», _¿Has abierto la ventana?_ — «Ты открыл окно?»."
      - note: "Между **haber** и причастием ничего не ставится. Поэтому слова **no**, **ya**, **todavía no** и возвратные местоимения стоят перед **haber**: _No he comido._ — «Я не ел», _Ya he hecho la tarea._ — «Я уже сделал задание», _Todavía no hemos visto la película._ — «Мы ещё не посмотрели фильм», _Hoy me he levantado a las siete._ — «Сегодня я встал в семь»."
      - latam: "даже о том, что произошло сегодня, чаще говорят в другом прошедшем времени, которое изучают на уровне A2. Например, вместо _Hoy he trabajado mucho_ там скажут `Hoy trabajé mucho`, а вместо _Ya he comido_ скажут `Ya comí`. Но время с **haber** там тоже все понимают."
      - exercise:
          title: Responde
          items:
            - "trabajar => trabajado"
            - "comer => comido"
            - "vivir => vivido"
            - "hacer => hecho"
            - "Hoy (yo) ___ (estudiar) mucho. => he estudiado"
            - "¿(tú) ___ (ver) la película? => Has visto"
            - "Esta semana nosotros ___ (comer) en casa. => hemos comido"

  - id: experiencia
    kind: grammar
    title: ¿Has estado en España?
    vocab:
      - "❓ alguna vez [алгу́на бэθ] — когда-нибудь :: ¿Has estado alguna vez en España? — Ты когда-нибудь был в Испании?"
      - "🔁 una vez / muchas veces [у́на бэθ, му́час бэ́θэс] — один раз / много раз"
      - "😋 probar [проба́р] — пробовать :: ¿Has probado la paella? — Ты пробовал паэлью?"
      - "🌊 el mar [мар] — море"
    blocks:
      - "Сегодня вы научитесь спрашивать о жизненном опыте, то есть задавать вопрос «Ты когда-нибудь…?», и отвечать на него: «да, два раза» или «нет, никогда»."
      - examples:
          items:
            - "¿Has estado alguna vez en España? Sí, he estado dos veces. — Ты был когда-нибудь в Испании? Да, дважды."
            - "No, nunca he estado en España. — Нет, я никогда не был в Испании."
            - "¿Has probado el jamón? Sí, ¡muchas veces! — Ты пробовал хамон? Да, много раз!"
            - "Mi abuela nunca ha visto el mar. — Моя бабушка никогда не видела моря."
      - rule: |
          Чтобы спросить о жизненном опыте, используйте **haber** с причастием и добавьте **alguna vez**, что значит «когда-нибудь»: _¿Has estado alguna vez en Sevilla?_ — «Ты когда-нибудь был в Севилье?», _¿Has probado alguna vez las tapas?_ — «Ты когда-нибудь пробовал тапас?», _¿Has visto alguna vez el mar?_ — «Ты когда-нибудь видел море?».
          Если ответ положительный, то скажите, сколько раз это было: _Sí, una vez._ — «Да, один раз», _Sí, dos veces._ — «Да, два раза», _Sí, muchas veces._ — «Да, много раз».
          Если ответ отрицательный, то используйте слово **nunca**, которое значит «никогда»: _No, nunca._ — «Нет, никогда», _Nunca he estado en Cancún._ — «Я никогда не был в Канкуне», _Mi padre nunca ha probado la paella._ — «Мой папа никогда не пробовал паэлью».
          Если речь идёт о поездках, то «я был в…» по-испански будет **he estado en**, с глаголом **estar**, а не **ser**: _He estado en Madrid._ — «Я был в Мадриде», _Hemos estado en Granada dos veces._ — «Мы были в Гранаде два раза», _Carmen ha estado en París._ — «Кармен была в Париже».
      - exercise:
          title: Traduce
          items:
            - "Ты когда-нибудь был в Мексике? => ¿Has estado alguna vez en México?"
            - "Я никогда не пробовал паэлью. => Nunca he probado la paella."
            - "Мы видели этот фильм три раза. => Hemos visto la película tres veces."
            - "Она уже вернулась домой. => Ya ha vuelto a casa."
      - task: "Ответьте в комментариях на два вопроса: **¿Has estado alguna vez en España? ¿Has probado la paella?** Отвечайте полными фразами, например: _Sí, he estado en España una vez_ или _No, nunca he probado la paella_."

  - id: lectura
    kind: reading
    title: Мой год с испанским
    vocab:
      - "🥇 primer [примэ́р] — первый (перед сущ. м. р.) :: mi primer año — мой первый год"
      - "💡 entender [энтэндэ́р] — понимать (`e → ie`) :: Ya entiendo mucho. — Я уже многое понимаю."
    blocks:
      - "Этот текст написан про вас, и он один из последних в курсе. Прочитайте его вслух, потому что всё, о чём в нём говорится, вы уже умеете."
      - reading:
          title: Mi primer año con el español
          text: |
            Este año he aprendido mucho. He estudiado español casi todos los días: he leído textos, he escuchado música en español y he hecho muchas tareas.

            He aprendido a hablar de mi familia, de mi casa y de mi ciudad. Ya puedo pedir un café en un bar, comprar ropa en una tienda y preguntar dónde está la estación.

            Todavía no hablo muy bien, pero ya entiendo mucho. ¡Y el español me encanta!

            El año que viene voy a viajar a España. Voy a hablar con la gente, voy a probar las tapas y voy a visitar muchas ciudades.
          translation: |
            В этом году я многому научился. Я занимался испанским почти каждый день: читал тексты, слушал музыку на испанском и сделал много заданий.

            Я научился говорить о семье, о доме и о городе. Я уже могу заказать кофе в баре, купить одежду в магазине и спросить, где вокзал.

            Я ещё не очень хорошо говорю, но понимаю уже много. И я обожаю испанский!

            В следующем году я поеду в Испанию. Буду разговаривать с людьми, попробую тапас и посещу много городов.
      - note: |
          Глагол **preguntar** значит «спрашивать». Это правильный глагол на **-ar**, поэтому он спрягается так же, как hablar: _Ana pregunta dónde está la estación._ — «Ана спрашивает, где вокзал», _Quiero preguntar dónde está el museo._ — «Я хочу спросить, где музей».
          Глагол **entender** значит «понимать», и вы знаете его с первых уроков по фразе _No entiendo_. В его корне `e` превращается в `ie`, как у querer: _Ya entiendo mucho._ — «Я уже многое понимаю», _¿Me entiendes?_ — «Ты меня понимаешь?», _Ana no entiende nada._ — «Ана ничего не понимает».
      - exercise:
          title: Responde
          items:
            - "¿Qué ha hecho este año? => Ha estudiado español casi todos los días."
            - "¿Qué puede hacer ya? => Pedir un café, comprar ropa, preguntar dónde está la estación."
            - "¿Qué va a hacer el año que viene? => Va a viajar a España."
    forms: [preguntar]
    quiz:
      - q: ¿Habla muy bien español?
        options: "Todavía no, pero entiende mucho. | Sí, habla muy bien. | No entiende nada."
      - q: ¿Adónde va a viajar el año que viene?
        options: "a España | a México | a Argentina"

  - id: quiz
    kind: quiz
    title: Прошедшее время
    blocks:
      - "Это тест по теме «Что вы сделали сегодня?». Проверьте, как вы запомнили глагол **haber** и причастия, в том числе неправильные."
      - cando:
          - "рассказать, что вы сделали сегодня: _He trabajado, he comido, he visto una película..._"
          - "спросить о жизненном опыте и ответить: _¿Has estado alguna vez en Sevilla? Sí, dos veces. No, nunca._"
          - "образовывать причастия, в том числе неправильные: hecho, visto, escrito, vuelto, abierto"
    quiz:
      - q: "Hoy ___ mucho. (я работал)"
        options: "he trabajado | ha trabajado | he trabajando"
      - q: Причастие от «hacer»
        options: "hecho | hacido | hacedo"
      - q: "¿___ visto la película? (ты)"
        options: "Has | Ha | He"
      - q: Как сказать «Я никогда не был в Мексике»?
        options: "Nunca he estado en México. | Nunca estoy en México. | Nunca he sido México."
      - q: "Todavía no ___ (yo, comer)."
        options: "he comido | he comiendo | como"
