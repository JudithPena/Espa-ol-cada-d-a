id: trabajo
number: 7
level: A0
title: Профессии и работа
goals:
  - рассказать, кем и где вы работаете или учитесь
  - спрягать глаголы на -ar во всех лицах
  - говорить «мы», «вы» и «они»

lessons:
  - id: vocab1
    kind: vocab
    title: ¿A qué te dedicas?
    vocab:
      - "💼 ¿A qué te dedicas? [а кэ тэ дэди́кас] — чем ты занимаешься? кем работаешь?"
      - "👨‍🏫 el profesor / la profesora [профэсо́р, профэсо́ра] — преподаватель, учитель(ница)"
      - "👩‍⚕️ el médico / la médica [мэ́дико, мэ́дика] — врач"
      - "🎓 el/la estudiante [эстудья́нтэ] — студент, студентка"
      - "🍽 el camarero / la camarera [камарэ́ро, камарэ́ра] — официант, официантка"
      - "👷 el ingeniero / la ingeniera [инхэнье́ро, инхэнье́ра] — инженер"
      - "💻 el programador / la programadora [програмадо́р, програмадо́ра] — программист(ка)"
    blocks:
      - "Как спросить о профессии и ответить. Посмотрите на примеры — чего не хватает по сравнению с «Es un libro»?"
      - examples:
          items:
            - "¿A qué te dedicas? Soy profesora. — Кем ты работаешь? Я учительница."
            - "Pablo es médico. — Пабло врач."
            - "Ana es estudiante. — Ана студентка."
            - "¿Eres ingeniero? No, soy programador. — Ты инженер? Нет, я программист."
      - rule: "О профессии говорят **без артикля**: _Soy profesora_, _Es médico_ — а не `Soy una profesora`."
      - tip: "Женский род образуется знакомым способом: profesor → profesor**a**, médico → médic**a**. А **estudiante** — одно слово для обоих: _el estudiante, la estudiante_."
      - exercise:
          title: Traduce
          items:
            - "Я программист. => Soy programador."
            - "Она врач. => Es médica."
            - "Ты студент? => ¿Eres estudiante?"
            - "Карлос официант. => Carlos es camarero."
            - "Кем ты работаешь? => ¿A qué te dedicas?"

  - id: vocab2
    kind: vocab
    title: ¿Dónde trabajas?
    vocab:
      - "🛠 trabajar [трабаха́р] — работать {forms: trabajo trabajas trabaja} :: Trabajo en una oficina. — Я работаю в офисе."
      - "📚 estudiar [эстудья́р] — учиться; изучать {forms: estudio estudias estudia} :: Estudio español. — Я изучаю испанский."
      - "🏥 el hospital [оспита́ль] — больница"
      - "🏫 la escuela [эскуэ́ла] — школа"
      - "🏢 la oficina [офиθи́на] — офис"
      - "🍴 el restaurante [рэстаура́нтэ] — ресторан"
      - "🏛 la universidad [унибэрсида́д] — университет"
    blocks:
      - "Два глагола и пять мест, где работают и учатся."
      - examples:
          items:
            - "¿Dónde trabajas? Trabajo en un hospital. — Где ты работаешь? В больнице."
            - "Ana estudia en la universidad. — Ана учится в университете."
            - "¿Trabajas o estudias? — Ты работаешь или учишься?"
            - "Pablo es camarero. Trabaja en un restaurante. — Пабло официант. Работает в ресторане."
      - tip: "**estudiar** — и «учиться», и «изучать»: _Estudio en la universidad_ — «учусь в университете», _Estudio español_ — «изучаю испанский»."
      - exercise:
          title: Responde
          items:
            - "Lucía es profesora. ¿Dónde trabaja? => Trabaja en una escuela."
            - "Javier es médico. ¿Dónde trabaja? => Trabaja en un hospital."
            - "Diego es estudiante. ¿Dónde estudia? => Estudia en la universidad."
            - "¿Trabajas o estudias? => Trabajo... / Estudio..."
    forms: [estudias, trabajas]

  - id: presente
    kind: grammar
    title: "Мы, вы, они: глаголы на -ar"
    unlocks: [present_ar]
    vocab:
      - "👫 nosotros / nosotras [носо́трос, носо́трас] — мы"
      - "👥 vosotros / vosotras [босо́трос, босо́трас] — вы (группе, неформально)"
      - "👨‍👨‍👦 ellos [э́йос] — они (мужчины или смешанная группа)"
      - "👩‍👩‍👧 ellas [э́йас] — они (только женщины)"
      - "🎩 ustedes [устэ́дэс] — вы (вежливо, группе)"
    blocks:
      - "Посмотрите на один глагол в разных лицах. Какая часть не меняется, а какая меняется?"
      - examples:
          items:
            - "Yo trabajo en una oficina. — Я работаю в офисе."
            - "Tú trabajas en un hospital. — Ты работаешь в больнице."
            - "Ella trabaja en una escuela. — Она работает в школе."
            - "Nosotros trabajamos en un restaurante. — Мы работаем в ресторане."
            - "Vosotros trabajáis en la universidad. — Вы работаете в университете."
            - "Ellos trabajan en casa. — Они работают дома."
      - rule: "Отбрасываем **-ar** и добавляем окончание лица: **-o, -as, -a, -amos, -áis, -an**. Так спрягаются почти все глаголы на -ar: hablar, trabajar, estudiar, llamarse…"
      - conjugation:
          verb: trabajar
          ru: работать
      - rule: |
          **nosotros** — мы (мужчины или смешанная группа), **nosotras** — только женщины. Так же **vosotros / vosotras**.
          **ellos** — они (мужчины или смешанная группа), **ellas** — только женщины.
          **ustedes** («вы» вежливо) сочетается с той же формой, что **ellos**: _ustedes trabajan_.
      - latam: "**vosotros** не используют: любой группе говорят **ustedes** — и друзьям, и незнакомым."
      - header: "Глагол ser полностью"
      - conjugation:
          verb: ser
          ru: быть
          highlight: false
          forms: [soy, eres, es, somos, sois, son]
      - exercise:
          title: Responde
          items:
            - "Nosotros ___ (hablar) español. => hablamos"
            - "¿Vosotros ___ (estudiar) inglés? => estudiáis"
            - "Ellas ___ (trabajar) en una oficina. => trabajan"
            - "Ustedes ___ (hablar) muy bien. => hablan"
            - "Nosotras ___ (ser) estudiantes. => somos"
            - "¿Vosotros ___ (ser) de Madrid? => sois"

  - id: lectura
    kind: reading
    title: Mis amigos y su trabajo
    vocab:
      - "📰 el/la periodista [пэрьоди́ста] — журналист(ка)"
      - "⚖️ el abogado / la abogada [абога́до, абога́да] — юрист, адвокат"
      - "💉 el enfermero / la enfermera [энфэрмэ́ро, энфэрмэ́ра] — медбрат, медсестра"
      - "👨‍🍳 el cocinero / la cocinera [коθинэ́ро, коθинэ́ра] — повар"
      - "💪 mucho [му́чо] — много :: Trabajo mucho. — Я много работаю."
    blocks:
      - "Прочитайте текст вслух. Обращайте внимание на окончания глаголов: кто что делает?"
      - reading:
          title: Mis amigos y su trabajo
          text: |
            Me llamo Marta y soy profesora. Trabajo en una escuela en Sevilla.

            Mi amigo Javier es médico y trabaja en un hospital. Su amiga Rosa también trabaja en el hospital: es enfermera.

            Mis amigas Laura y Carmen son periodistas. Trabajan en Madrid, pero viven en Toledo.

            Mi amigo Diego es estudiante. Estudia en la universidad y también trabaja: es camarero en un restaurante.

            ¿Y yo? Yo trabajo mucho, pero también estudio. ¡Estudio inglés!
          translation: |
            Меня зовут Марта, я учительница. Работаю в школе в Севилье.

            Мой друг Хавьер — врач, работает в больнице. Его подруга Роса тоже работает в больнице: она медсестра.

            Мои подруги Лаура и Кармен — журналистки. Работают в Мадриде, но живут в Толедо.

            Мой друг Диего — студент. Учится в университете и ещё работает: он официант в ресторане.

            А я? Я много работаю, но и учусь тоже. Изучаю английский!
      - exercise:
          title: Responde
          items:
            - "¿Qué es Marta? => Es profesora."
            - "¿Dónde trabaja Javier? => En un hospital."
            - "¿Qué es Rosa? => Es enfermera."
            - "¿Dónde viven Laura y Carmen? => En Toledo."
            - "¿Diego trabaja o estudia? => Estudia y también trabaja."
    forms: [viven]
    quiz:
      - q: ¿Dónde trabajan Laura y Carmen?
        options: "En Madrid. | En Toledo. | En Sevilla."
        explain: "Trabajan en Madrid, pero viven en Toledo."
      - q: ¿Qué estudia Marta?
        options: "inglés | español | francés"

  - id: dialogo
    kind: dialogue
    title: ¿Sois estudiantes?
    blocks:
      - "Диалог на вечеринке: как обращаться к группе людей. Новых слов нет."
      - dialogue:
          lines:
            - "Lucía: Hola, ¿sois estudiantes? | Привет, вы студенты?"
            - "Diego: Sí, somos estudiantes. Estudiamos en la universidad. ¿Y vosotras? | Да, мы студенты. Учимся в университете. А вы?"
            - "Lucía: Nosotras trabajamos. Yo soy enfermera y ella es abogada. | Мы работаем. Я медсестра, а она юрист."
            - "Diego: ¿Dónde trabajáis? | Где вы работаете?"
            - "Elena: Lucía trabaja en un hospital y yo trabajo en una oficina. | Лусия работает в больнице, а я в офисе."
            - "Diego: ¿Y habláis inglés? | А вы говорите по-английски?"
            - "Elena: Sí, hablamos inglés y un poco de francés. ¿Y vosotros? | Да, говорим по-английски и немного по-французски. А вы?"
            - "Diego: Nosotros hablamos inglés y estudiamos alemán. | Мы говорим по-английски и учим немецкий."
      - exercise:
          title: Responde
          items:
            - "¿Diego trabaja o estudia? => Estudia."
            - "¿Qué es Elena? => Es abogada."
            - "¿Dónde trabaja Lucía? => En un hospital."
            - "¿Qué estudian Diego y su amigo? => Alemán."
      - exercise:
          title: "Вежливо: vosotros → ustedes"
          items:
            - "¿Sois estudiantes? => ¿Ustedes son estudiantes?"
            - "¿Dónde trabajáis? => ¿Dónde trabajan ustedes?"
            - "¿Habláis inglés? => ¿Ustedes hablan inglés?"

  - id: practica
    kind: practice
    title: Глаголы на -ar
    vocab:
      - "🎧 escuchar [эскуча́р] — слушать :: Escucho música. — Я слушаю музыку."
      - "🍳 cocinar [коθина́р] — готовить (еду)"
    blocks:
      - "Тренируем спряжение. Два новых глагола спрягаются точно так же, как trabajar."
      - exercise:
          title: Responde
          items:
            - "yo / escuchar => escucho"
            - "tú / cocinar => cocinas"
            - "nosotros / estudiar => estudiamos"
            - "ellos / hablar => hablan"
            - "vosotras / escuchar => escucháis"
            - "usted / trabajar => trabaja"
      - exercise:
          title: Traduce
          items:
            - "Мы слушаем музыку. => Escuchamos música."
            - "Пабло хорошо готовит. => Pablo cocina bien."
            - "Вы (группе) говорите по-русски? => ¿Habláis ruso?"
            - "Они не работают, они учатся. => No trabajan, estudian."
            - "Я много работаю. => Trabajo mucho."
      - exercise:
          title: Найдите ошибку
          items:
            - "Nosotros `trabajan` en un hospital. => Nosotros trabajamos..."
            - "Soy `una` profesora. => Soy profesora."
            - "Ellas `habla` inglés. => Ellas hablan inglés."
      - task: "Расскажите о себе в комментариях: **Soy... Trabajo en... / Estudio...** и о друге: **Mi amigo / Mi amiga es... Trabaja en...**"

  - id: quiz
    kind: quiz
    title: Профессии и работа
    blocks:
      - "Тест по теме «Профессии и работа»."
      - cando:
          - "спросить и сказать, кем вы работаете: ¿A qué te dedicas? — Soy..."
          - "рассказать, где работаете или учитесь"
          - "спрягать глаголы на -ar: trabajo, trabajas, trabaja, trabajamos, trabajáis, trabajan"
    quiz:
      - q: "Nosotros ___ en una oficina."
        options: "trabajamos | trabajan | trabajáis"
      - q: Как сказать «Я учительница»?
        options: "Soy profesora. | Soy una profesora. | Estoy profesora."
        explain: "О профессии — без артикля."
      - q: "¿Vosotros ___ inglés?"
        options: "habláis | hablan | hablamos"
      - q: Как вежливо обратиться к группе людей?
        options: "ustedes | vosotros | ellos"
      - q: "Ellas ___ periodistas."
        options: "son | sois | es"
