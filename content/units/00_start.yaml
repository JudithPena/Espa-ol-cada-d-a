id: start
number: 0
level: A0
title: Старт
goals:
  - понимать, как устроен курс и как с ним заниматься
  - читать испанские слова по правилам и ставить ударение

lessons:
  - id: intro
    kind: intro
    title: ¡Hola! Добро пожаловать
    vocab:
      - "👋 ¡Hola! [о́ла] — привет; здравствуйте"
    blocks:
      - |
        Это канал для тех, кто начинает испанский **с полного нуля**. Каждый день — один короткий пост на 5–10 минут. Маленькими шагами мы дойдём до уровня **A1**: вы сможете познакомиться и рассказать о себе, заказать еду в кафе, спросить дорогу, поговорить о семье, погоде и планах.
      - header: Как устроен курс
      - list:
          - "👣 **Маленькие шаги** — в посте не больше 4–8 новых слов"
          - "📚 **Лексика** — слова в живых примерах, с озвучкой"
          - "📐 **Грамматика** — сначала примеры, потом правило: закономерность вы замечаете сами"
          - "💬 **Диалоги** и 📖 **тексты** — только из слов, которые вы уже знаете"
          - "🧠 **Тесты** — викторины прямо в канале"
          - "🔁 **Повторение** — слова возвращаются через 1, 3, 7, 14 и 30 дней, пока не закрепятся"
      - header: Постепенное погружение
      - |
        Сначала всё объясняется по-русски. По мере того как вы учите слова, испанского в постах становится больше: подписи и задания переходят на испанский, потом появляются тексты и вопросы на испанском. Каждый шаг — только когда нужные слова уже пройдены.
      - header: Как заниматься, чтобы запоминать
      - list:
          - "Читайте испанские примеры **вслух** и повторяйте за диктором в аудио"
          - "Скрытый текст ||вот такой|| — это ответы и переводы. Сначала вспомните сами, потом нажмите"
          - "Отвечайте на тесты по памяти: попытка вспомнить закрепляет лучше, чем перечитывание"
          - "Пишите в комментариях — даже с ошибками. Без собственной речи язык не заговорит"
      - tip: "В курсе — испанский Испании. Где в Латинской Америке говорят иначе, будет значок 🌎."
      - "Первое слово у вас уже есть. Завтра — гласные и ударение. **¡Hola!**"

  - id: vowels
    kind: phonetics
    title: Гласные и ударение
    vocab:
      - "🏠 la casa [ка́са] — дом"
      - "☕ el café [кафэ́] — кофе; кафе"
      - "🚕 el taxi [та́кси] — такси"
      - "🏨 el hotel [отэ́ль] — гостиница, отель"
      - "🎵 la música [му́сика] — музыка"
      - "✅ sí [си] — да"
      - "❌ no [но] — нет; не"
    blocks:
      - |
        Хорошая новость: испанский читается так, как пишется. Выучите несколько правил — и прочитаете любое слово.

        Гласных всего пять: `a` `e` `i` `o` `u`. Главное — **гласные всегда звучат чётко**, даже без ударения. По-русски мы говорим «малако́», а по-испански `o` всегда остаётся `o`. Буква `e` звучит как «э».
      - header: Где ударение?
      - rule: |
          1. Слово кончается на гласную, `-n` или `-s` → ударение на **предпоследний** слог: **ca**sa, **ta**xi.
          2. Кончается на другую согласную → на **последний** слог: ho**tel**.
          3. Есть значок ´ → ударение там, где он: ca**fé**, **mú**sica.
      - "Значок ударения ещё и различает слова: **sí** — «да», а `si` без значка — «если»."
      - exercise:
          title: Прочитайте вслух, затем проверьте ударение
          items:
            - "la casa => **CA**-sa"
            - "el hotel => ho-**TEL**"
            - "el café => ca-**FÉ**"
            - "la música => **MÚ**-si-ca"
            - "el taxi => **TA**-xi"
      - note: "**el** и **la** — артикли, «метки» рода: el café — мужской род, la casa — женский. Учите слова сразу с артиклем. Подробнее о роде поговорим позже."
    quiz:
      - q: Где ударение в слове «hotel»?
        options: "ho-TEL | HO-tel"
        explain: "Слово кончается на согласную (не `n` и не `s`) — ударение на последний слог."
      - q: Где ударение в слове «música»?
        options: "MÚ-si-ca | mu-SI-ca | mu-si-CA"
        explain: Значок ´ всегда показывает ударный слог.

  - id: consonants1
    kind: phonetics
    title: "Согласные: `h`, `j`, `g`, `qu`, `ll`, `ñ`"
    vocab:
      - "🍖 el jamón [хамо́н] — хамон (вяленый окорок)"
      - "🧀 el queso [кэ́со] — сыр"
      - "🎸 la guitarra [гита́рра] — гитара"
      - "🥘 la paella [паэ́йя] — паэлья"
      - "🥔 la tortilla [торти́йя] — тортилья (омлет с картофелем)"
      - "🇪🇸 España [эспа́нья] — Испания"
      - "🌅 mañana [манья́на] — завтра; утро"
    blocks:
      - "Большинство согласных читается почти как в русском. Сегодня — первая половина исключений."
      - table:
          rows:
            - ["`h`", "не читается никогда: **hola** [о́ла], **hotel** [отэ́ль]"]
            - ["`j`", "как «х»: **jamón** [хамо́н]"]
            - ["`g` + `e`, `i`", "тоже как «х»; в остальных случаях `g` — это «г»"]
            - ["`gu` + `e`, `i`", "«г», а `u` не читается: **guitarra** [гита́рра]"]
            - ["`qu` + `e`, `i`", "«к», `u` не читается: **queso** [кэ́со]"]
            - ["`ll`", "как «й»: **paella**, **tortilla**"]
            - ["`ñ`", "как «нь»: **España**, **mañana**"]
      - exercise:
          title: Как это читается?
          items:
            - "hola => [о́ла]"
            - "el queso => [эль кэ́со]"
            - "la paella => [ла паэ́йя]"
            - "mañana => [манья́на]"
            - "el jamón => [эль хамо́н]"
      - task: "Прочитайте вслух: **España, la guitarra, la tortilla, el queso**. Если хотите, запишите голосовое в комментариях."
    quiz:
      - q: Какая буква в испанском никогда не читается?
        options: "`h` | `j` | `ñ`"
        explain: "hola читается [о́ла], hotel — [отэ́ль]."
      - q: Как читается «queso»?
        options: "кэ́со | куэ́со | квэ́со"
        explain: "В сочетаниях `que` и `qui` буква `u` не читается."

  - id: consonants2
    kind: phonetics
    title: "Согласные: `c`, `z`, `ch`, `r`, `v`"
    vocab:
      - "🙏 gracias [гра́θиас] — спасибо"
      - "🍺 la cerveza [θэрбэ́θа] — пиво"
      - "⛲ la plaza [пла́θа] — площадь"
      - "🍫 el chocolate [чокола́тэ] — шоколад"
      - "🐶 el perro [пэ́рро] — собака"
      - "🍷 el vino [би́но] — вино"
    blocks:
      - "Вторая половина исключений — и вы сможете прочитать любое испанское слово."
      - table:
          rows:
            - ["`c` + `e`, `i` и `z`", "межзубный звук, как `th` в английском `think`: **gracias**, **cerveza**, **plaza**"]
            - ["`c` + `a`, `o`, `u`", "«к»: **casa**, **café**"]
            - ["`ch`", "как «ч»: **chocolate**"]
            - ["`r` и `rr`", "`r` — одно касание языком; `rr` и `r` в начале слова — раскатистое «рр»: **perro**"]
            - ["`v` и `b`", "обе читаются примерно как «б»: **vino** [би́но]"]
      - latam: "`c` + `e`, `i` и `z` произносят как обычное «с»: [гра́сьяс], [сэрбэ́са]. Вас поймут при любом варианте."
      - exercise:
          title: Как это читается?
          items:
            - "la cerveza => [ла θэрбэ́θа]"
            - "el perro => [эль пэ́рро]"
            - "el vino => [эль би́но]"
            - "el chocolate => [эль чокола́тэ]"
      - task: "Прочитайте вслух: **gracias, el chocolate, el perro, el vino**. Запишите голосовое в комментариях — так тренируется произношение."
    quiz:
      - q: Как читается «`ll`» в слове «paella»?
        options: "й | л | ль"
      - q: Как читается «vino»?
        options: "би́но | ви́но | фи́но"
        explain: "`v` и `b` в испанском звучат одинаково — примерно как «б»."

  - id: quiz
    kind: quiz
    title: Читаем по-испански
    auto_quiz: 3
    blocks:
      - "Проверим, как вы освоили чтение. Прочитайте слова вслух, переведите и проверьте себя — ответ под спойлером."
      - exercise:
          title: Прочитайте и переведите
          items:
            - "la plaza => [ла пла́θа] — площадь"
            - "el perro => [эль пэ́рро] — собака"
            - "la guitarra => [ла гита́рра] — гитара"
            - "gracias => [гра́θиас] — спасибо"
            - "mañana => [манья́на] — завтра"
            - "la casa => [ла ка́са] — дом"
    quiz:
      - q: Как читается «guitarra»?
        options: "гита́рра | гуита́рра | джита́рра"
        explain: "В сочетаниях `gue` и `gui` буква `u` не читается."
      - q: Как читается «jamón»?
        options: "хамо́н | жамо́н | джамо́н"
      - q: Где ударение в слове «café»?
        options: "ca-FÉ | CA-fé"
        explain: "Значок ударения ´ стоит над `é`."
      - q: В каком слове есть звук «нь»?
        options: "mañana | música | casa"
      - q: Что значит «sí»?
        options: "да | нет | если"
        explain: "sí — «да», а `si` без значка — «если»."
