id: saludos
number: 1
level: A0
title: ¡Hola! Приветствия
goals:
  - поздороваться и попрощаться в любое время суток
  - спросить, как дела, и ответить
  - выбрать «ты» или «вы»

lessons:
  - id: vocab1
    kind: vocab
    title: Привет и пока
    vocab:
      - "☀️ buenos días [буэ́нос ди́ас] — доброе утро; добрый день (до обеда) :: ¡Buenos días, María! — Доброе утро, Мария!"
      - "🌇 buenas tardes [буэ́нас та́рдэс] — добрый день; добрый вечер (после обеда) :: ¡Buenas tardes, Pablo! — Добрый день, Пабло!"
      - "🌙 buenas noches [буэ́нас но́чэс] — доброй ночи; добрый вечер (поздно) :: Buenas noches, Ana. — Спокойной ночи, Ана."
      - "👋 adiós [адьо́с] — до свидания; пока :: ¡Adiós, Carlos! — Пока, Карлос!"
      - "🔜 hasta luego [а́ста луэ́го] — до встречи; пока :: ¡Hasta luego, Lucía! — До встречи, Лусия!"
      - "📅 hasta mañana [а́ста манья́на] — до завтра :: ¡Hasta mañana, Pablo! — До завтра, Пабло!"
    blocks:
      - |
        В испанском приветствие зависит от времени суток. Только **¡Hola!** подходит всегда — его можно сочетать с другими: _¡Hola, buenos días!_
      - header: Когда что говорить
      - list:
          - "☀️ от утра до обеда (в Испании обедают около 14:00) — **buenos días**"
          - "🌇 после обеда и до темноты — **buenas tardes**"
          - "🌙 поздно вечером и перед сном — **buenas noches**"
      - tip: "**hasta** значит «до»: _hasta luego_ — «до потом», _hasta mañana_ — «до завтра». А **adiós** — «до свидания», иногда навсегда 🙂"
      - exercise:
          title: Что вы скажете?
          items:
            - "9:00, коллеге в офисе => ¡Buenos días!"
            - "17:00, соседу => ¡Buenas tardes!"
            - "23:00, перед сном => ¡Buenas noches!"
            - "Уходите и увидитесь завтра => ¡Hasta mañana!"
            - "Уходите ненадолго => ¡Hasta luego!"

  - id: vocab2
    kind: vocab
    title: "¿Qué tal? Как дела?"
    vocab:
      - "❓ ¿Qué tal? [кэ таль] — как дела? :: ¡Hola, Ana! ¿Qué tal? — Привет, Ана! Как дела?"
      - "🙂 bien [бьен] — хорошо :: Bien, gracias. — Хорошо, спасибо."
      - "😀 muy bien [муй бьен] — очень хорошо :: Muy bien, gracias. — Очень хорошо, спасибо."
      - "😐 regular [рэгула́р] — так себе, неважно"
      - "😕 mal [маль] — плохо"
      - "🙋 ¿Y tú? [и ту] — а ты? :: Bien, ¿y tú? — Хорошо, а ты?"
    blocks:
      - "После приветствия обычно спрашивают, как дела. Отвечать подробно не принято: хватит одного-двух слов."
      - table:
          title: От лучшего к худшему
          rows:
            - ["😀", "**muy bien** — очень хорошо"]
            - ["🙂", "**bien** — хорошо"]
            - ["😐", "**regular** — так себе"]
            - ["😕", "**mal** — плохо"]
      - tip: "**y** значит «и» или «а»: _¿Y tú?_ — «А ты?». Так вежливо вернуть вопрос собеседнику."
      - examples:
          title: Короткий разговор
          items:
            - "¡Hola! ¿Qué tal? — Привет! Как дела?"
            - "Muy bien, gracias. ¿Y tú? — Очень хорошо, спасибо. А ты?"
            - "Bien. — Хорошо."
      - exercise:
          title: Ответьте
          items:
            - "¿Qué tal? (у вас всё отлично) => Muy bien, gracias. ¿Y tú?"
            - "¿Qué tal? (так себе) => Regular. ¿Y tú?"
            - "Спросите друга, как дела => ¿Qué tal?"

  - id: grammar
    kind: grammar
    title: «Ты» и «вы». Знаки ¿? и ¡!
    vocab:
      - "🧑 tú [ту] — ты"
      - "🎩 usted [устэ́д] — вы (вежливо, одному человеку)"
      - "💬 ¿Cómo estás? [ко́мо эста́с] — как ты? как поживаешь?"
      - "💬 ¿Cómo está usted? [ко́мо эста́ устэ́д] — как вы поживаете?"
      - "🙋 ¿Y usted? [и устэ́д] — а вы?"
      - "👨 el señor [сэньо́р] — господин, сеньор :: Buenos días, señor García. — Доброе утро, сеньор Гарсия."
      - "👩 la señora [сэньо́ра] — госпожа, сеньора :: Buenas tardes, señora López. — Добрый день, сеньора Лопес."
    blocks:
      - "Посмотрите на два разговора. Чем они отличаются?"
      - examples:
          title: С другом
          items:
            - "¡Hola, Pablo! ¿Cómo estás? — Привет, Пабло! Как ты?"
            - "Bien, gracias. ¿Y tú? — Хорошо, спасибо. А ты?"
      - examples:
          title: С пожилым соседом
          items:
            - "Buenos días, señor García. ¿Cómo está usted? — Доброе утро, сеньор Гарсия. Как вы поживаете?"
            - "Muy bien, gracias. ¿Y usted? — Очень хорошо, спасибо. А вы?"
      - rule: |
          **tú** — «ты»: друзьям, родным, коллегам, ровесникам. В Испании на «ты» переходят очень быстро.
          **usted** — вежливое «вы» одному человеку: пожилым, незнакомым в официальной обстановке.
          **¿Qué tal?** подходит в обоих случаях.
      - header: Перевёрнутые знаки
      - |
        Вопрос и восклицание в испанском выделяют с двух сторон, а в начале знак переворачивают: **¿...?** и **¡...!**
        Так сразу видно, что предложение — вопрос: _Sí._ — «Да.», _¿Sí?_ — «Да?», _¡Sí!_ — «Да!»
      - exercise:
          items:
            - "Как спросить «как дела?» у друга? => ¿Qué tal? / ¿Cómo estás?"
            - "…у пожилой сеньоры? => ¿Qué tal? / ¿Cómo está usted?"
            - "Ответьте другу и спросите в ответ => Bien, gracias. ¿Y tú?"
            - "Ответьте сеньору Гарсия и спросите в ответ => Muy bien, gracias. ¿Y usted?"
            - "Где ошибка: «`Que tal?`» => Нужны оба знака и ударение: ¿Qué tal?"

  - id: dialogue
    kind: dialogue
    title: Утро в офисе
    vocab:
      - "🙏 por favor [пор фабо́р] — пожалуйста (просьба) :: Un café, por favor. — Кофе, пожалуйста. {forms: un}"
      - "🙏 muchas gracias [му́час гра́θиас] — большое спасибо"
      - "🤝 de nada [дэ на́да] — не за что"
      - "🙇 perdón [пэрдо́н] — извините, простите"
      - "👌 vale [ба́лэ] — ладно, хорошо, окей"
    blocks:
      - "Прочитайте диалоги вслух, затем послушайте аудио. Перевод — под спойлером: сначала попробуйте понять сами."
      - dialogue:
          title: Утром
          lines:
            - "Lucía: ¡Buenos días, Pablo! | Доброе утро, Пабло!"
            - "Pablo: ¡Hola, Lucía! ¿Qué tal? | Привет, Лусия! Как дела?"
            - "Lucía: Muy bien, gracias. ¿Y tú? | Очень хорошо, спасибо. А ты?"
            - "Pablo: Bien. ¿Café? | Хорошо. Кофе?"
            - "Lucía: ¡Sí, por favor! | Да, пожалуйста!"
            - "Pablo: ¡Perdón! El café... | Ой, прости! Кофе..."
            - "Lucía: ¡No, no, Pablo! Vale, gracias. | Ничего-ничего, Пабло! Всё хорошо, спасибо."
            - "Pablo: De nada. | Не за что."
      - dialogue:
          title: Вечером
          voices: {Señor García: m}
          lines:
            - "Señor García: Buenas tardes, Lucía. | Добрый вечер, Лусия."
            - "Lucía: Buenas tardes, señor García. ¿Cómo está usted? | Добрый вечер, сеньор Гарсия. Как вы поживаете?"
            - "Señor García: Bien, gracias. ¿Y usted? | Хорошо, спасибо. А вы?"
            - "Lucía: Regular... ¡Hasta mañana, señor García! | Так себе... До завтра, сеньор Гарсия!"
            - "Señor García: ¡Adiós, Lucía! | До свидания, Лусия!"
      - exercise:
          title: Поняли?
          items:
            - "Как дела у Лусии утром? => Muy bien — очень хорошо"
            - "Что Пабло предлагает Лусии? => café — кофе"
            - "Лусия и сеньор Гарсия на «ты» или на «вы»? => на «вы»: ¿Cómo está usted?"
            - "Как дела у Лусии вечером? => regular — так себе"
      - note: "**vale** — любимое слово испанцев: «ладно», «хорошо», «договорились». Ещё запомните фразу _Un café, por favor_ — «Кофе, пожалуйста». Слово **un** разберём позже."
      - latam: "**vale** почти не говорят — вместо него _está bien_."

  - id: practice
    kind: practice
    title: Поздоровайтесь!
    blocks:
      - "Переведите на испанский. Сначала скажите вслух, потом откройте ответ."
      - exercise:
          title: Переведите
          items:
            - "Доброе утро! => ¡Buenos días!"
            - "Привет! Как дела? => ¡Hola! ¿Qué tal?"
            - "Хорошо, спасибо. А ты? => Bien, gracias. ¿Y tú?"
            - "Добрый вечер, сеньора! Как вы поживаете? => ¡Buenas tardes, señora! ¿Cómo está usted?"
            - "Большое спасибо! — Не за что. => ¡Muchas gracias! — De nada."
            - "Пока! До завтра! => ¡Adiós! ¡Hasta mañana!"
      - exercise:
          title: Восстановите диалог
          items:
            - "Bien, gracias. ¿Y tú? / ¡Hola, Ana! ¿Qué tal? / Muy bien. => ¡Hola, Ana! ¿Qué tal? — Bien, gracias. ¿Y tú? — Muy bien."
            - "¡Adiós! / ¡Hasta luego, Carlos! => ¡Hasta luego, Carlos! — ¡Adiós!"
      - exercise:
          title: Найдите ошибку
          items:
            - "¿Cómo estás, señor García? => С сеньором — на «вы»: ¿Cómo está usted?"
            - "23:00 — ¡Buenos días! => Поздно вечером: ¡Buenas noches!"
            - "Muchas gracias! => Нужен перевёрнутый знак: ¡Muchas gracias!"
      - task: "Напишите в комментариях приветствие, которое подходит к этому времени дня, и ответьте на вопрос **¿Qué tal?**"

  - id: quiz
    kind: quiz
    title: Приветствия
    blocks:
      - "Тест по теме «Приветствия». Отвечайте быстро — как в живом разговоре."
      - cando:
          - "поздороваться утром, днём и вечером"
          - "спросить, как дела, и ответить"
          - "говорить на «ты» и на «вы»"
          - "поблагодарить и попрощаться"
    quiz:
      - q: Что сказать коллеге в 10 утра?
        options: "¡Buenos días! | ¡Buenas tardes! | ¡Buenas noches!"
        explain: "До обеда — buenos días."
      - q: Как вежливо спросить «как вы поживаете?»
        options: "¿Cómo está usted? | ¿Cómo estás? | ¿Y tú?"
        explain: "usted — вежливое «вы»."
      - q: "— ¿Qué tal? — ..."
        options: "Muy bien, gracias. | De nada. | Hasta luego."
      - q: Как сказать «до завтра»?
        options: "¡Hasta mañana! | ¡Hasta luego! | ¡Buenas noches!"
      - q: Вам сказали «¡Muchas gracias!». Что ответить?
        options: "De nada. | Perdón. | Regular."
        explain: "de nada — «не за что»."
