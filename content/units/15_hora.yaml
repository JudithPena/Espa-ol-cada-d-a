id: hora
number: 15
level: A1
title: Время и дни недели
goals:
  - назвать дни недели
  - спросить и сказать, который час
  - договориться о времени: во сколько что начинается и заканчивается

lessons:
  - id: dias
    kind: vocab
    title: Дни недели
    vocab:
      - "1️⃣ el lunes [лу́нэс] — понедельник"
      - "2️⃣ el martes [ма́ртэс] — вторник"
      - "3️⃣ el miércoles [мьэ́рколэс] — среда"
      - "4️⃣ el jueves [хуэ́бэс] — четверг"
      - "5️⃣ el viernes [бьэ́рнэс] — пятница"
      - "6️⃣ el sábado [са́бадо] — суббота"
      - "7️⃣ el domingo [доми́нго] — воскресенье"
      - "🗓 la semana [сэма́на] — неделя"
    blocks:
      - "В испанском дни недели пишутся с маленькой буквы: **lunes**, **martes**, **sábado**. Посмотрите, как сказать «в понедельник» и «по понедельникам»."
      - rule: |
          1. Если речь идёт об одном конкретном дне, то перед ним ставится артикль **el**: **el lunes** значит «в понедельник», то есть в этот, ближайший понедельник. Например: _El lunes voy al médico_, _El martes tengo un test_, _El viernes voy al cine_.
          2. Если что-то повторяется каждую неделю, то ставится артикль множественного числа **los**: **los lunes** значит «по понедельникам». Например: _Los lunes trabajo en casa_, _Los miércoles estudio inglés_, _Los jueves voy a la biblioteca_.
          3. Предлог при этом не нужен, достаточно одного артикля: говорят _el lunes_, а не `en el lunes`.
      - tip: "Дни с понедельника по пятницу и так заканчиваются на `-s`, поэтому во множественном числе они не меняются, меняется только артикль: _los lunes_, _los martes_, _los viernes_. А **sábado** и **domingo** во множественном числе получают окончание `-s`: _los sábados_, _los domingos_."
      - examples:
          items:
            - "¿Qué día es hoy? Hoy es viernes. — Какой сегодня день? Сегодня пятница."
            - "Los sábados voy a la montaña. — По субботам я езжу в горы."
            - "El domingo comemos con mis padres. — В воскресенье обедаем с родителями."
      - exercise:
          title: Traduce
          items:
            - "в среду => el miércoles"
            - "по воскресеньям => los domingos"
            - "Сегодня понедельник. => Hoy es lunes."
            - "По вторникам и четвергам я плаваю. => Los martes y los jueves nado."

  - id: hora
    kind: grammar
    title: ¿Qué hora es?
    vocab:
      - "🕐 ¿Qué hora es? [кэ о́ра эс] — который час?"
      - "⏱ la hora [о́ра] — час; время (на часах)"
      - "🕧 y media [и мэ́дья] — половина (… и тридцать)"
      - "🕒 y cuarto [и куа́рто] — четверть (… и пятнадцать)"
      - "🕘 menos cuarto [мэ́нос куа́рто] — без четверти"
      - "➖ menos [мэ́нос] — без, минус"
      - "🎯 en punto [эн пу́нто] — ровно"
    blocks:
      - "Посмотрите на примеры. Почему в первом примере **es la**, а в остальных **son las**?"
      - examples:
          items:
            - "Es la una. — Час."
            - "Son las dos. — Два часа."
            - "Son las tres y media. — Половина четвёртого (3:30)."
            - "Son las cuatro y cuarto. — Четверть пятого (4:15)."
            - "Son las cinco menos cuarto. — Без четверти пять (4:45)."
            - "Son las ocho y diez. — Восемь десять (8:10)."
            - "Son las nueve menos veinte. — Без двадцати девять (8:40)."
            - "Son las diez en punto. — Ровно десять."
      - rule: |
          1. Когда на часах час, говорят **Es la una**: час всего один, поэтому глагол и артикль стоят в единственном числе. Например: _Es la una_, _Es la una y diez_, _Es la una y media_.
          2. Для всех остальных часов используют множественное число, потому что часов несколько: **Son las…** Например: _Son las dos_, _Son las seis_, _Son las once y media_.
          3. Если прошло не больше получаса, то минуты **прибавляют** к часу словом **y**: _Son las ocho y cinco_ (8:05), _Son las dos y cuarto_ (2:15), _Son las once y veinte_ (11:20).
          4. Если прошло больше получаса, то минуты **вычитают** из следующего часа словом **menos**: _Son las diez menos cinco_ (9:55), _Son las dos menos veinte_ (1:40), _Son las doce menos cuarto_ (11:45).
      - exercise:
          title: "¿Qué hora es?"
          items:
            - "7:00 => Son las siete en punto."
            - "1:30 => Es la una y media."
            - "10:15 => Son las diez y cuarto."
            - "5:45 => Son las seis menos cuarto."
            - "12:20 => Son las doce y veinte."
            - "3:50 => Son las cuatro menos diez."

  - id: a_que_hora
    kind: grammar
    title: ¿A qué hora...?
    vocab:
      - "❓ ¿A qué hora...? [а кэ о́ра] — во сколько...? :: ¿A qué hora comes? — Во сколько ты обедаешь?"
      - "🌅 por la mañana [пор ла манья́на] — утром"
      - "🌇 por la tarde [пор ла та́рдэ] — днём, после обеда; вечером"
      - "🌙 por la noche [пор ла но́чэ] — вечером, ночью"
      - "📚 la clase [кла́сэ] — урок, занятие"
      - "▶️ empezar [эмпэθа́р] — начинать(ся) {forms: empieza empiezan} :: La clase empieza a las nueve. — Урок начинается в девять."
      - "⏹ terminar [тэрмина́р] — заканчивать(ся)"
    blocks:
      - "Как сказать, **во сколько** что-то происходит? Сравните эти фразы с вопросом «который час?» и найдите маленькое слово, которое появилось перед временем."
      - examples:
          items:
            - "¿A qué hora comes? Como a las dos. — Во сколько ты обедаешь? В два."
            - "La clase empieza a las nueve y termina a las once. — Урок начинается в девять и заканчивается в одиннадцать."
            - "Por la mañana trabajo y por la tarde estudio. — Утром я работаю, а днём учусь."
            - "Ceno a las nueve de la noche. — Я ужинаю в девять вечера."
      - rule: |
          1. Чтобы ответить на вопрос «во сколько?», поставьте перед временем предлог **a**: _Como **a la una**_, _La clase empieza **a las dos**_, _Ceno **a las nueve y media**_.
          2. Если нужно уточнить время суток, то после часа добавьте **de la mañana** («утра»), **de la tarde** («дня» или «вечера») или **de la noche** («вечера» или «ночи»): _a las siete de la mañana_, _a las cinco de la tarde_, _a las once de la noche_.
          3. Если точного времени нет и вы говорите просто «утром», «днём» или «вечером», то используйте предлог **por**: _Por la mañana bebo café_, _Por la tarde voy al parque_, _Por la noche veo la tele_.
      - note: "Глагол **empezar** меняет гласную в корне: там, где на неё падает ударение, вместо `e` появляется `ie`. Поэтому говорят _La clase empieza a las nueve_ и _Las clases empiezan a las ocho_. Почему так происходит, мы разберём в следующей теме."
      - exercise:
          title: Traduce
          items:
            - "Во сколько начинается фильм? => ¿A qué hora empieza la película?"
            - "В половине девятого. => A las ocho y media."
            - "Я завтракаю в семь утра. => Desayuno a las siete de la mañana."
            - "По вечерам мы смотрим сериалы. => Por la noche vemos series."
            - "Занятие заканчивается в час. => La clase termina a la una."

  - id: horarios
    kind: dialogue
    title: Часы работы
    vocab:
      - "🔒 cerrar [θэрра́р] — закрывать(ся) {forms: cierra cierran}"
      - "🔁 todos los días [то́дос лос ди́ас] — каждый день"
      - "↔️ de... a... [дэ... а...] — с... до... :: de lunes a viernes — с понедельника по пятницу"
      - "🟢 abierto/a [абьэ́рто, абьэ́рта] — открытый, открыто"
      - "🔴 cerrado/a [θэрра́до, θэрра́да] — закрытый, закрыто"
    blocks:
      - "Уго звонит в музей. Обратите внимание на то, как он спрашивает о часах работы."
      - dialogue:
          lines:
            - "Hugo: Buenos días. ¿A qué hora abre el museo? | Доброе утро. Во сколько открывается музей?"
            - "Recepcionista: Abre a las diez de la mañana. | Открывается в десять утра."
            - "Hugo: ¿Y a qué hora cierra? | А во сколько закрывается?"
            - "Recepcionista: Cierra a las ocho de la tarde. | Закрывается в восемь вечера."
            - "Hugo: ¿Abre todos los días? | Он работает каждый день?"
            - "Recepcionista: De martes a domingo. Los lunes está cerrado. | Со вторника по воскресенье. По понедельникам закрыт."
            - "Hugo: ¡Vaya! Hoy es lunes. | Вот как! Сегодня понедельник."
            - "Recepcionista: Sí, pero mañana está abierto. | Да, но завтра открыт."
            - "Hugo: Vale, gracias. ¡Hasta luego! | Хорошо, спасибо. До свидания!"
      - culture: "Во многих испанских городах магазины закрываются на обед примерно с 14 до 17 часов, потому что это время **la siesta**. Зато вечером они работают до 21 или даже до 22 часов."
      - exercise:
          title: Responde
          items:
            - "¿A qué hora abre el museo? => A las diez de la mañana."
            - "¿A qué hora cierra? => A las ocho de la tarde."
            - "¿Qué día está cerrado? => El lunes."
            - "¿Y mañana? => Está abierto."
    forms: [siesta]

  - id: escucha
    kind: listening
    title: Который час?
    blocks:
      - "Послушайте и запишите время цифрами. Потом откройте текст и проверьте себя."
      - dialogue:
          hidden: true
          lines:
            - "Profesora: Número uno: son las tres y media. | 1) 3:30"
            - "Profesora: Número dos: es la una y cuarto. | 2) 1:15"
            - "Profesora: Número tres: son las nueve menos cuarto. | 3) 8:45"
            - "Profesora: Número cuatro: son las once en punto. | 4) 11:00"
            - "Profesora: Número cinco: son las siete menos diez. | 5) 6:50"
    quiz:
      - q: Какое время под номером 3?
        options: "8:45 | 9:15 | 9:45"
        explain: "Nueve menos cuarto значит «без четверти девять», то есть 8:45: четверть часа вычитают из девяти."
      - q: Какое время под номером 5?
        options: "6:50 | 7:10 | 7:50"
        explain: "Siete menos diez значит «без десяти семь», то есть 6:50: десять минут вычитают из семи."

  - id: quiz
    kind: quiz
    title: Время и дни недели
    blocks:
      - "Тест по теме «Время и дни недели»."
      - cando:
          - "назвать дни недели и сказать «в понедельник», «по понедельникам»"
          - "сказать, который час: Son las tres y media"
          - "спросить и сказать, во сколько: ¿A qué hora...? — A las..."
    quiz:
      - q: Как сказать «1:00»?
        options: "Es la una. | Son las una. | Es una."
      - q: "10:45 — ..."
        options: "Son las once menos cuarto. | Son las diez y cuarto. | Son las diez menos cuarto."
      - q: Как сказать «по субботам»?
        options: "los sábados | el sábado | en sábado"
      - q: "La clase empieza ___ las nueve."
        options: "a | en | de"
      - q: Какой день идёт после «miércoles»?
        options: "jueves | martes | viernes"
