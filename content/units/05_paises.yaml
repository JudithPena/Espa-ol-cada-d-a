id: paises
number: 5
level: A0
title: Страны, национальности, языки
goals:
  - сказать, откуда вы, и спросить собеседника
  - назвать национальность в мужском и женском роде
  - рассказать, на каких языках вы говорите и где живёте

lessons:
  - id: vocab1
    kind: vocab
    title: ¿De dónde eres?
    vocab:
      - "🌍 ¿De dónde eres? [дэ до́ндэ э́рэс] — откуда ты? :: ¿De dónde eres, Iván? — Откуда ты, Иван?"
      - "📍 soy de... [сой дэ] — я из... :: Soy de España. — Я из Испании."
      - "🇷🇺 Rusia [ру́сья] — Россия"
      - "🇲🇽 México [мэ́хико] — Мексика"
      - "🇦🇷 Argentina [архэнти́на] — Аргентина"
      - "🇨🇴 Colombia [коло́мбья] — Колумбия"
      - "🇫🇷 Francia [фра́нθья] — Франция"
    blocks:
      - "Откуда вы? Этот вопрос — второй после имени в любом знакомстве."
      - examples:
          items:
            - "¿De dónde eres? — Откуда ты?"
            - "Soy de Rusia. ¿Y tú? — Я из России. А ты?"
            - "Soy de México. — Я из Мексики."
            - "¿De dónde es usted? — Откуда вы?"
            - "Ella es de Colombia. — Она из Колумбии."
      - tip: "**México** пишется с `x`, но читается [мэ́хико] — это старое написание звука «х»."
      - exercise:
          title: Traduce
          items:
            - "Я из России. => Soy de Rusia."
            - "Откуда ты? => ¿De dónde eres?"
            - "Карлос из Аргентины. => Carlos es de Argentina."
            - "Откуда вы, сеньора? => ¿De dónde es usted, señora?"

  - id: vocab2
    kind: vocab
    title: Ещё страны
    vocab:
      - "🇩🇪 Alemania [алема́нья] — Германия"
      - "🇮🇹 Italia [ита́лья] — Италия"
      - "🏴󠁧󠁢󠁥󠁮󠁧󠁿 Inglaterra [инглатэ́рра] — Англия"
      - "🇺🇸 Estados Unidos [эста́дос уни́дос] — США"
      - "🇨🇳 China [чи́на] — Китай"
      - "➕ también [тамбье́н] — тоже, также :: Soy de Rusia. Yo también. — Я из России. Я тоже."
    blocks:
      - "Ещё пять стран и одно очень полезное слово — **también**, «тоже»."
      - examples:
          items:
            - "Marco es de Italia. — Марко из Италии."
            - "Li es de China. — Ли из Китая."
            - "Tom es de Inglaterra. — Том из Англии."
            - "¿Eres de Alemania? — No, soy de Francia. — Ты из Германии? — Нет, я из Франции."
      - exercise:
          title: Responde
          items:
            - "¿De dónde es Marco? => Es de Italia."
            - "¿De dónde es Li? => Es de China."
            - "¿De dónde eres tú? => Soy de..."
            - "Soy de España. ¿Y tú? (вы тоже) => Yo también."

  - id: nacionalidad
    kind: grammar
    title: "Национальность: ruso — rusa"
    vocab:
      - "🇷🇺 ruso/a [ру́со, ру́са] — русский / русская :: Iván es ruso. Olga es rusa. — Иван русский. Ольга русская."
      - "🇪🇸 español/a [эспаньо́ль, эспаньо́ла] — испанец / испанка; испанский :: Pablo es español. — Пабло испанец."
      - "🇲🇽 mexicano/a [мэхика́но] — мексиканец / мексиканка"
      - "🇦🇷 argentino/a [архэнти́но] — аргентинец / аргентинка"
      - "🇨🇴 colombiano/a [коломбья́но] — колумбиец / колумбийка"
    blocks:
      - "Сравните пары. Как меняется слово, когда речь о женщине?"
      - examples:
          items:
            - "Iván es ruso. — Иван русский."
            - "Olga es rusa. — Ольга русская."
            - "Pablo es español. — Пабло испанец."
            - "Lucía es española. — Лусия испанка."
      - rule: |
          **-o → -a**: ruso → rus**a**, mexicano → mexican**a**.
          **согласная → `+a`**: español → español**a**.
          Национальности пишутся **с маленькой буквы**, а страны — с большой: _Soy rusa, de Rusia._
      - exercise:
          title: Responde
          items:
            - "Ana es de México. Es ___ => mexicana"
            - "Diego es de Argentina. Es ___ => argentino"
            - "Sofía es de Colombia. Es ___ => colombiana"
            - "Carmen es de España. Es ___ => española"
            - "Iván es de Rusia. Es ___ => ruso"
      - task: "Напишите в комментариях о себе: **Me llamo... Soy de... Soy ruso / rusa** (или своя национальность)."

  - id: vocab3
    kind: vocab
    title: Национальности Европы и мира
    vocab:
      - "🇫🇷 francés/a [франθэ́с, франθэ́са] — француз / француженка; французский"
      - "🇩🇪 alemán/a [алема́н, алема́на] — немец / немка; немецкий"
      - "🇬🇧 inglés/a [ингле́с, ингле́са] — англичанин / англичанка; английский"
      - "🇮🇹 italiano/a [италья́но] — итальянец / итальянка"
      - "🇺🇸 americano/a [амэрика́но] — американец / американка"
      - "🇨🇳 chino/a [чи́но] — китаец / китаянка"
    blocks:
      - "Ещё шесть национальностей. Обратите внимание на значок ударения."
      - rule: "francés → frances**a**, alemán → aleman**a**, inglés → ingles**a**. В женском роде появляется лишний слог, ударение больше не на последнем слоге — и значок пропадает."
      - note: "Официально о жителях США говорят `estadounidense`, но в разговоре чаще слышно **americano**."
      - exercise:
          title: Responde
          items:
            - "Pierre es de Francia. Es ___ => francés"
            - "Marie es de Francia. Es ___ => francesa"
            - "Hans es de Alemania. Es ___ => alemán"
            - "Emma es de Inglaterra. Es ___ => inglesa"
            - "Marco es de Italia. Es ___ => italiano"
            - "Li es de China. Es ___ => chino"
    allow: [Marie, Hans, Emma]

  - id: idiomas
    kind: grammar
    title: ¿Hablas español?
    vocab:
      - "🗣 hablar [абла́р] — говорить, разговаривать {forms: hablo hablas habla} :: Hablo español. — Я говорю по-испански."
      - "🇪🇸 el español [эспаньо́ль] — испанский язык"
      - "🇷🇺 el ruso [ру́со] — русский язык"
      - "🇬🇧 el inglés [ингле́с] — английский язык"
      - "🤏 un poco [ун по́ко] — немного {pos: phrase} :: Hablo un poco de español. — Я немного говорю по-испански."
      - "↔️ pero [пэ́ро] — но :: Hablo inglés, pero no hablo francés. — Я говорю по-английски, но не по-французски."
      - "➕ e [э] — и (перед словами на `i-`, `hi-`) :: Hablo español e inglés. — Я говорю по-испански и по-английски."
    blocks:
      - "Посмотрите на примеры. Как называется язык и чем это слово похоже на национальность?"
      - examples:
          items:
            - "¿Hablas inglés? — Ты говоришь по-английски?"
            - "Sí, hablo inglés y un poco de francés. — Да, я говорю по-английски и немного по-французски."
            - "Pierre habla francés. — Пьер говорит по-французски."
            - "Li habla chino e inglés. — Ли говорит по-китайски и по-английски."
      - rule: |
          Язык называется так же, как национальность в мужском роде: **el español, el ruso, el francés, el alemán, el italiano, el chino**.
          После **hablar** артикль не нужен: _Hablo español._
      - table:
          title: "hablar — говорить"
          rows:
            - ["yo", "habl**o**"]
            - ["tú", "habl**as**"]
            - ["él / ella / usted", "habl**a**"]
      - note: "**y** («и») перед словом, которое начинается на звук «и», превращается в **e**: _español e inglés_, _francés e italiano_ — чтобы два «и» не сливались."
      - exercise:
          title: Traduce
          items:
            - "Ты говоришь по-английски? => ¿Hablas inglés?"
            - "Да, немного. => Sí, un poco."
            - "Я говорю по-русски и по-испански. => Hablo ruso y español."
            - "Марко говорит по-итальянски и по-английски. => Marco habla italiano e inglés."
            - "Я не говорю по-китайски. => No hablo chino."
    allow: []

  - id: lectura
    kind: reading
    title: Друзья со всего мира
    vocab:
      - "🏡 ¿Dónde vives? [до́ндэ би́бэс] — где ты живёшь?"
      - "🏠 vivir [биби́р] — жить {forms: vivo vives vive}"
      - "📍 en [эн] — в, на :: Vivo en Madrid. — Я живу в Мадриде."
      - "🤝 el amigo / la amiga [ами́го, ами́га] — друг / подруга"
    blocks:
      - "Первый настоящий текст! Все слова в нём вы уже знаете (новые — выше). Прочитайте его вслух, потом послушайте аудио и ответьте на вопросы."
      - reading:
          title: Mis amigos
          text: |
            Hola. Me llamo Iván. Soy ruso, de Moscú, pero vivo en Madrid. Hablo ruso, inglés y un poco de español.

            Mi amiga se llama Sofía. Es argentina, de Buenos Aires. Sofía habla español e italiano.

            Mi amigo Pierre es francés. Él también vive en Madrid. Habla francés, español y un poco de ruso. ¡Muy bien, Pierre!
          translation: |
            Привет. Меня зовут Иван. Я русский, из Москвы, но живу в Мадриде. Говорю по-русски, по-английски и немного по-испански.

            Мою подругу зовут Софья. Она аргентинка, из Буэнос-Айреса. Софья говорит по-испански и по-итальянски.

            Мой друг Пьер — француз. Он тоже живёт в Мадриде. Говорит по-французски, по-испански и немного по-русски. Молодец, Пьер!
      - exercise:
          title: Responde
          items:
            - "¿De dónde es Iván? => Es de Rusia, de Moscú."
            - "¿Dónde vive Iván? => Vive en Madrid."
            - "¿Sofía es mexicana? => No, es argentina."
            - "¿Pierre habla ruso? => Sí, un poco."
      - note: "**Mis amigos** — «мои друзья». Как образуется множественное число, разберём совсем скоро."
    forms: [mis, amigos]
    quiz:
      - q: ¿De dónde es Sofía?
        options: "De Argentina. | De Francia. | De Rusia."
      - q: ¿Dónde vive Pierre?
        options: "En Madrid. | En Moscú. | En Buenos Aires."

  - id: dialogo
    kind: dialogue
    title: В языковой школе
    blocks:
      - "Новых слов нет — только знакомое. Прочитайте, послушайте и попробуйте разыграть диалог вслух."
      - dialogue:
          lines:
            - "Pablo: ¡Hola! Me llamo Pablo. ¿Cómo te llamas? | Привет! Меня зовут Пабло. Как тебя зовут?"
            - "Irina: Hola, Pablo. Me llamo Irina. | Привет, Пабло. Меня зовут Ирина."
            - "Pablo: Encantado. ¿De dónde eres, Irina? | Очень приятно. Откуда ты, Ирина?"
            - "Irina: Soy de Rusia, de San Petersburgo. ¿Y tú? | Я из России, из Санкт-Петербурга. А ты?"
            - "Pablo: Yo soy mexicano. ¿Hablas inglés? | Я мексиканец. Ты говоришь по-английски?"
            - "Irina: Sí, hablo inglés y un poco de español. | Да, говорю по-английски и немного по-испански."
            - "Pablo: ¡Hablas muy bien! | Ты отлично говоришь!"
            - "Irina: Gracias. Pero más despacio, por favor. | Спасибо. Но помедленнее, пожалуйста."
            - "Pablo: ¡Vale! ¿Dónde vives? | Хорошо! Где ты живёшь?"
            - "Irina: Vivo en Madrid. ¿Y tú? | Живу в Мадриде. А ты?"
            - "Pablo: ¡Yo también! | Я тоже!"
      - exercise:
          title: Responde
          items:
            - "¿De dónde es Irina? => Es de Rusia, de San Petersburgo."
            - "¿Pablo es español? => No, es mexicano."
            - "¿Qué habla Irina? => Inglés y un poco de español."
            - "¿Dónde vive Pablo? => En Madrid."
      - task: "Ответьте в комментариях на вопросы: **¿De dónde eres? ¿Dónde vives? ¿Hablas inglés?**"

  - id: quiz
    kind: quiz
    title: Страны и языки
    blocks:
      - "Тест по теме «Страны, национальности, языки»."
      - cando:
          - "сказать, откуда вы: Soy de Rusia"
          - "назвать национальность: ruso / rusa, español / española"
          - "рассказать о языках: Hablo ruso y un poco de español"
          - "сказать, где живёте: Vivo en..."
    quiz:
      - q: "Olga es de Rusia. Es ___"
        options: "rusa | ruso | Rusia"
      - q: "Pierre es de Francia. Es ___"
        options: "francés | francesa | Francia"
      - q: Как сказать «Я говорю по-испански и по-английски»?
        options: "Hablo español e inglés. | Hablo español y inglés. | Habla español e inglés."
        explain: "Перед i- союз y меняется на e."
      - q: "¿Dónde vives?"
        options: "Vivo en Madrid. | Soy de Madrid. | Hablo Madrid."
      - q: Какое слово пишется с большой буквы?
        options: "Alemania | alemán | alemana"
        explain: "Страны — с большой буквы, национальности и языки — с маленькой."

  - id: repaso
    kind: review
    title: Большое повторение
    blocks:
      - |
        Позади пять тем и больше сотни слов и фраз! Сегодня новых слов нет — только повторение. Слова для него выбраны по системе интервальных повторений: те, что давно не встречались в текстах.
      - "Как заниматься: прочитайте слово, **скажите перевод вслух** и только потом откройте спойлер. Не помните — ничего страшного: это слово вернётся снова."
