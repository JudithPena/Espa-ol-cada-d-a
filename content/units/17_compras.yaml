id: compras
number: 17
level: A1
title: Покупки
goals:
  - назвать одежду и описать её
  - считать до тысячи и понимать цены
  - купить вещь в магазине: спросить размер, примерить, заплатить

lessons:
  - id: ropa1
    kind: vocab
    title: Одежда
    vocab:
      - "👚 la ropa [ро́па] — одежда"
      - "👔 la camisa [ками́са] — рубашка"
      - "👕 la camiseta [камисэ́та] — футболка"
      - "👖 los pantalones [пантало́нэс] — брюки"
      - "👗 la falda [фа́льда] — юбка"
      - "👗 el vestido [бэсти́до] — платье"
      - "🧶 el jersey [хэрсэ́й] — свитер {pl: jerséis}"
      - "👞 los zapatos [θапа́тос] — туфли, ботинки"
    blocks:
      - "Новая тема посвящена покупкам, и начнём мы с одежды. Цвета вы уже знаете, поэтому сразу описывайте вещи!"
      - examples:
          items:
            - "Llevo una camiseta blanca y unos pantalones negros. — На мне белая футболка и чёрные брюки."
            - "Ana lleva un vestido rojo. — Ана в красном платье."
            - "Me gusta tu jersey. — Мне нравится твой свитер."
            - "¿Dónde están mis zapatos? — Где мои туфли?"
      - rule: |
          1. Цвет ставится **после** названия одежды, хотя в русском он стоит перед ним: _una camiseta amarilla_, _un vestido azul_, _una falda negra_.
          2. Цвет согласуется с вещью в роде и числе. Если вещь женского рода, то и цвет стоит в женском роде: _una falda blanca_, _una camisa roja_. Если вещей несколько, то и цвет стоит во множественном числе: _unos zapatos marrones_, _unas camisetas negras_.
          3. Цвета, которые заканчиваются на `-e` или на согласную, по родам не меняются: _un vestido verde_ и _una falda verde_, _un jersey azul_ и _una camisa azul_.
      - exercise:
          title: Traduce
          items:
            - "белая рубашка => una camisa blanca"
            - "синие брюки => unos pantalones azules"
            - "чёрное платье => un vestido negro"
            - "Сегодня на мне красный свитер. => Hoy llevo un jersey rojo."

  - id: ropa2
    kind: vocab
    title: Куртки, джинсы, кроссовки
    vocab:
      - "🧥 la chaqueta [чакэ́та] — куртка, пиджак"
      - "🧥 el abrigo [абри́го] — пальто"
      - "👖 los vaqueros [бакэ́рос] — джинсы"
      - "👟 las zapatillas [θапати́йяс] — кроссовки; тапочки"
      - "🩶 gris [грис] — серый {pos: adj}"
      - "📏 la talla [та́йя] — размер (одежды)"
    blocks:
      - "Сегодня вы узнаете ещё несколько названий одежды и важное слово **la talla**, которое значит «размер»."
      - examples:
          items:
            - "Llevo un abrigo gris. — Я ношу серое пальто."
            - "Me encantan tus vaqueros. — Обожаю твои джинсы."
            - "¿Qué talla tienes? Tengo la talla... — Какой у тебя размер?"
            - "Para correr llevo zapatillas. — Чтобы бегать, я надеваю кроссовки."
      - latam: "свитер называют **el suéter**, а джинсы называют **los jeans**: _Llevo un suéter gris_, _Me encantan tus jeans_. Куртку в Мексике называют **la chamarra**, а в Аргентине её называют **la campera**. Поэтому в Мексике скажут _Me gusta tu chamarra_, а в Аргентине скажут _Me gusta tu campera_."
      - exercise:
          title: "¿Qué llevas hoy?"
          items:
            - "Опишите, во что вы одеты сегодня => Hoy llevo..."
            - "серая куртка => una chaqueta gris"
            - "белые кроссовки => unas zapatillas blancas"
    forms: [suéter, chamarra, campera, jeans]

  - id: numeros
    kind: vocab
    title: Числа до 100
    vocab:
      - "3️⃣0️⃣ treinta [трэ́йнта] — тридцать {pos: num}"
      - "4️⃣0️⃣ cuarenta [куарэ́нта] — сорок {pos: num}"
      - "5️⃣0️⃣ cincuenta [θинкуэ́нта] — пятьдесят {pos: num}"
      - "6️⃣0️⃣ sesenta [сэсэ́нта] — шестьдесят {pos: num}"
      - "7️⃣0️⃣ setenta [сэтэ́нта] — семьдесят {pos: num}"
      - "8️⃣0️⃣ ochenta [очэ́нта] — восемьдесят {pos: num}"
      - "9️⃣0️⃣ noventa [нобэ́нта] — девяносто {pos: num}"
      - "💯 cien [θьен] — сто {pos: num}"
    forms: [veintiuno, veintidós, veintitrés, veinticuatro, veinticinco, veintiséis, veintisiete, veintiocho, veintinueve]
    blocks:
      - "Теперь вы сможете назвать настоящий возраст и любую цену до ста. Почти все десятки заканчиваются на `-enta`: cuarenta, cincuenta, sesenta. Не подчиняются этому только 20 и 30: veinte и treinta."
      - rule: |
          1. Числа от 21 до 29 пишутся одним словом: veintiuno, veintidós, veintitrés, veinticuatro, veinticinco, veintiséis, veintisiete, veintiocho, veintinueve.
          2. Числа от 31 до 99, кроме круглых десятков, пишутся в три слова, потому что десятки и единицы соединяются союзом **y**: treinta **y** uno, cuarenta **y** cinco, setenta **y** dos, noventa **y** nueve.
          3. Число 100 называется **cien**: _Tengo cien euros_, _cien libros_, _cien años_.
      - examples:
          items:
            - "Tengo treinta y dos años. — Мне тридцать два года."
            - "Mi abuelo tiene ochenta y cinco años. — Моему дедушке восемьдесят пять лет."
            - "Hay veintiocho estudiantes en la clase. — В классе двадцать восемь студентов."
      - exercise:
          title: Traduce
          items:
            - "45 => cuarenta y cinco"
            - "27 => veintisiete"
            - "63 => sesenta y tres"
            - "99 => noventa y nueve"
            - "Моей маме пятьдесят четыре года. => Mi madre tiene cincuenta y cuatro años."

  - id: demostrativos
    kind: grammar
    title: "Este, ese, aquel"
    vocab:
      - "👇 este/esta [э́стэ, э́ста] — этот, эта (рядом со мной) {pos: adj, pl: estos estas}"
      - "👉 ese/esa [э́сэ, э́са] — этот, тот (рядом с вами) {pos: adj, pl: esos esas}"
      - "🔭 aquel/aquella [акэ́ль, акэ́йя] — тот, та (далеко) {pos: adj, pl: aquellos aquellas}"
      - "📍 ahí [аи́] — там (рядом с вами)"
    blocks:
      - "В магазине всё время приходится показывать на вещи. Посмотрите на примеры: чем отличаются эти три слова?"
      - examples:
          items:
            - "Me gusta esta camisa. — Мне нравится эта рубашка (у меня в руках)."
            - "¿Y esa falda? — А эта юбка (у тебя)?"
            - "Aquel abrigo es muy bonito. — Вон то пальто очень красивое."
            - "Estos zapatos y esas zapatillas. — Эти туфли и те кроссовки."
      - rule: |
          1. Если вещь находится рядом с вами (_aquí_), то говорите **este** или **esta**: _este jersey_, _esta camisa_, _estas faldas_.
          2. Если вещь находится рядом с собеседником (_ahí_), то говорите **ese** или **esa**: _ese abrigo_, _esa falda_, _esas zapatillas_.
          3. Если вещь далеко от вас обоих (_allí_), то говорите **aquel** или **aquella**: _aquel jersey_, _aquella chaqueta_, _aquellos pantalones_.
          4. Все эти слова согласуются с вещью в роде и числе: este, esta, estos, estas; ese, esa, esos, esas; aquel, aquella, aquellos, aquellas. Обратите внимание, что во множественном числе мужского рода получаются формы **estos** и **esos**, хотя в единственном числе эти слова заканчиваются на `-e`: _estos pantalones_, _esos abrigos_.
      - note: "Если мы не знаем, что это за предмет, то говорим **esto** («это», рядом со мной) или **eso** («это», рядом с вами): _¿Qué es esto?_, _¿Qué es eso?_, _Esto es un libro_. Фразу _¿Qué es esto?_ вы знаете с самого начала курса!"
      - exercise:
          title: Responde
          items:
            - "___ camiseta (рядом со мной) => esta"
            - "___ zapatos (рядом со мной) => estos"
            - "___ chaqueta (у тебя) => esa"
            - "___ vaqueros (у тебя) => esos"
            - "___ vestido (далеко) => aquel"
    forms: [eso]

  - id: precios
    kind: grammar
    title: ¿Cuánto cuesta?
    vocab:
      - "💶 ¿Cuánto cuesta...? [куа́нто куэ́ста] — сколько стоит...? :: ¿Cuánto cuesta esta camiseta? — Сколько стоит эта футболка?"
      - "💰 costar [коста́р] — стоить"
      - "💸 caro/a [ка́ро, ка́ра] — дорогой"
      - "🏷 barato/a [бара́то, бара́та] — дешёвый"
      - "🏷 el precio [прэ́θьо] — цена"
      - "🪙 el céntimo [θэ́нтимо] — цент (сотая часть евро)"
      - "🔢 mil [миль] — тысяча {pos: num}"
    forms: [ciento, doscientos, doscientas, trescientos, cuatrocientos, quinientos, seiscientos, setecientos, ochocientos, novecientos]
    blocks:
      - "Теперь научимся спрашивать цену. Обратите внимание: если вещь одна, то говорят **cuesta**, а если вещей несколько, то говорят **cuestan**. Глагол **costar** меняет `o` на `ue` так же, как **poder**."
      - examples:
          items:
            - "¿Cuánto cuesta esta camiseta? Cuesta quince euros. — Сколько стоит эта футболка? Пятнадцать евро."
            - "¿Cuánto cuestan estos zapatos? Cuestan ochenta euros. — Сколько стоят эти туфли? Восемьдесят евро."
            - "¡Qué caros! — Какие дорогие!"
            - "Este jersey es muy barato: nueve euros con noventa. — Этот свитер очень дешёвый: девять девяносто."
      - table:
          title: Сотни
          rows:
            - ["101", "ciento uno"]
            - ["200", "doscientos"]
            - ["300", "trescientos"]
            - ["400", "cuatrocientos"]
            - ["500", "**quinientos**"]
            - ["600", "seiscientos"]
            - ["700", "**setecientos**"]
            - ["800", "ochocientos"]
            - ["900", "**novecientos**"]
            - ["1000", "mil"]
      - rule: |
          1. Ровно сто будет **cien**: _cien euros_, _cien libros_. Если после ста идут ещё десятки или единицы, то говорят **ciento**: _ciento uno_, _ciento veinte_, _ciento treinta y cinco_.
          2. Остальные сотни обычно образуются по правилу: к числу добавляется `-cientos`. Так получаются _doscientos_, _trescientos_, _cuatrocientos_, _seiscientos_ и _ochocientos_.
          3. Выделенные в таблице сотни образуются не по правилу, поэтому их нужно запомнить: **quinientos** (500), **setecientos** (700), **novecientos** (900).
      - exercise:
          title: "¿Cuánto cuesta?"
          items:
            - "👕 12 € => Cuesta doce euros."
            - "🧥 150 € => Cuesta ciento cincuenta euros."
            - "👟 75 € => Cuestan setenta y cinco euros."
            - "💻 999 € => Cuesta novecientos noventa y nueve euros."
            - "☕ 1,80 € => Cuesta un euro con ochenta."

  - id: tienda
    kind: dialogue
    title: В магазине одежды
    vocab:
      - "🪞 probarse [проба́рсэ] — примерять :: ¿Puedo probarme esta camisa? — Можно примерить эту рубашку?"
      - "🚪 el probador [пробадо́р] — примерочная"
      - "👌 claro [кла́ро] — конечно"
      - "👗 me queda bien / me queda grande [мэ кэ́да] — сидит хорошо / мне велико"
      - "🛍 me lo llevo / me la llevo [мэ ло льэ́бо] — беру (это)"
      - "💳 pagar [пага́р] — платить"
      - "💳 la tarjeta [тархэ́та] — карта (банковская)"
    blocks:
      - "Клара покупает футболку. Этот диалог можно использовать как готовый сценарий в любом магазине."
      - dialogue:
          lines:
            - "Dependienta: Hola, buenas tardes. ¿Qué busca? | Здравствуйте. Что вы ищете?"
            - "Clara: Busco una camiseta blanca. | Ищу белую футболку."
            - "Dependienta: ¿Qué talla tiene? | Какой у вас размер?"
            - "Clara: La treinta y ocho. | Тридцать восьмой."
            - "Dependienta: Aquí tiene: estas camisetas son muy bonitas. | Вот, пожалуйста: эти футболки очень красивые."
            - "Clara: ¿Puedo probarme esta? | Можно примерить эту?"
            - "Dependienta: Sí, claro. El probador está allí. | Да, конечно. Примерочная вон там."
            - "Dependienta: ¿Qué tal? | Ну как?"
            - "Clara: Me queda un poco grande. ¿Tiene una talla más pequeña? | Немного великовата. У вас есть размер поменьше?"
            - "Dependienta: Sí, aquí tiene la treinta y seis. | Да, вот тридцать шестой."
            - "Clara: ¡Me queda muy bien! ¿Cuánto cuesta? | Сидит отлично! Сколько стоит?"
            - "Dependienta: Doce euros con noventa. | Двенадцать девяносто."
            - "Clara: ¡Qué barata! Me la llevo. ¿Puedo pagar con tarjeta? | Какая дешёвая! Беру. Можно заплатить картой?"
            - "Dependienta: Sí, claro. | Да, конечно."
      - note: "Фраза **me la llevo** значит «беру её»: так говорят о вещи женского рода, например о футболке (_la camiseta_) или о юбке (_la falda_). Если вещь мужского рода, то говорят **me lo llevo**: так скажут о свитере (_el jersey_) или о пальто (_el abrigo_)."
      - exercise:
          title: Responde
          items:
            - "¿Qué busca Clara? => Una camiseta blanca."
            - "¿Qué talla tiene? => La treinta y ocho, pero la treinta y seis le queda muy bien."
            - "¿Cuánto cuesta la camiseta? => Doce euros con noventa."
            - "¿Cómo paga Clara? => Con tarjeta."
      - task: "Разыграйте в комментариях покупку: спросите, сколько стоит вещь, а потом скажите, берёте ли вы её. Например: **¿Cuánto cuesta...? — ... — ¡Me lo llevo!**"

  - id: quiz
    kind: quiz
    title: Покупки
    blocks:
      - "Тест по теме «Покупки»."
      - cando:
          - "назвать одежду и её цвет"
          - "считать до тысячи и понимать цены"
          - "показать на вещь: este, ese, aquel"
          - "купить вещь: спросить размер, примерить, заплатить"
    quiz:
      - q: "¿Cuánto ___ estos zapatos?"
        options: "cuestan | cuesta | costan"
      - q: Как сказать «эта рубашка» (у меня в руках)?
        options: "esta camisa | esa camisa | este camisa"
      - q: Как будет 500?
        options: "quinientos | cincocientos | cincuenta"
      - q: Что значит «Me queda grande»?
        options: "мне велико | мне нравится | я беру"
      - q: "Mi padre tiene ___ años. (47)"
        options: "cuarenta y siete | cuatro y siete | cuarentaisiete"
