# Четвёртый список автора, часть 6 — «Desconcierto en el hospital 4» (слова 29–42).
lang: es
words:
  - word: delantal
    ru: фартук
    ipa: /delanˈtal/
    say: дэланта́ль
    meaning: "Одежда без рукавов, которую надевают спереди, чтобы не испачкать одежду: на кухне, в мастерской."
    examples:
      - "Se puso el delantal y empezó a cocinar. — Она надела фартук и начала готовить."
      - "El carnicero lleva un delantal blanco. — На мяснике белый фартук."
    origin: "От delante «спереди» + суффикс -al: «то, что надевают спереди». Родственные: adelante «вперёд», delantero «передний»."
    register: "Нейтральное."
    synonyms:
      - word: mandil
        pair: ["Llevaba un delantal.", "Llevaba un mandil."]
        diff:
          - "mandil — тоже «фартук»; в Латинской Америке и в мастерских чаще"
          - "delantal — самое общее слово в Испании"
    analogs:
      - "apron — фартук"
      - "pinafore — фартук-сарафан"
    dialogue:
      - "Ana: ¿Por qué llevas eso puesto? | Почему ты это надел?"
      - "Pablo: Es mi delantal, voy a cocinar. | Это мой фартук, я буду готовить."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ponerse el delantal — надеть фартук"
      - "quitarse el delantal — снять фартук"
      - "delantal de cocina — кухонный фартук"
    collocation_example: "Se quitó el delantal y se sentó a la mesa. — Он снял фартук и сел за стол."
    trap: "Слово мужского рода: el delantal. Не путайте с delantero «передний; нападающий» и delante «спереди»."

  - word: entregar apuntes
    ru: передать конспекты
    ipa: /entɾeˈɣaɾ aˈpuntes/
    say: энтрэга́р апу́нтэс
    pron: "g между гласными мягкое [ɣ]; перед e g меняется на gu: entregué."
    meaning: "Отдать записи лекций кому-то: чтобы тот мог учиться, переписать, подготовиться. Apuntes — «конспекты»."
    examples:
      - "Le entregué los apuntes a mi compañero. — Я передал свои конспекты однокурснику."
      - "¿Me entregas los apuntes de ayer? — Отдашь мне конспекты за вчера?"
    origin: "entregar — из лат. integrare «возвращать в целости»; apuntes — от apuntar «записывать» (a- + punto «точка»: ставить пометки)."
    register: "Нейтральное, учебное."
    synonyms:
      - word: pasar los apuntes
        pair: ["Me entregó los apuntes.", "Me pasó los apuntes."]
        diff:
          - "pasar — разговорнее: «передать, одолжить»"
          - "entregar — «вручить, отдать в руки», чуть официальнее"
    analogs:
      - "to hand over notes — передать записи"
      - "to lend notes — одолжить конспекты"
    dialogue:
      - "Ana: ¿Tienes los apuntes de historia? | У тебя есть конспекты по истории?"
      - "Pablo: Sí, te los entrego mañana. | Да, передам тебе завтра."
    cefr: "B1."
    frequency: "Частое среди студентов."
    collocations:
      - "tomar apuntes — конспектировать"
      - "los apuntes de clase — конспекты лекций"
      - "entregar un trabajo — сдать работу"
    collocation_example: "Tomo apuntes en todas las clases. — Я конспектирую на всех занятиях."
    trap: "Apuntes почти всегда во множественном: los apuntes. Entregar — «передавать, сдавать», а не «возвращать» (devolver)."

  - word: hacer saber
    ru: сообщить, дать понять
    ipa: /aˈθeɾ saˈβeɾ/
    say: асэ́р сабэ́р
    pron: "h не читается; c перед e в Испании — [θ]; v читается как b."
    meaning: "Известить кого-то, дать ему знать: официально или намёком. Hacer saber algo a alguien."
    examples:
      - "Le hice saber mi decisión. — Я сообщил ему своё решение."
      - "Nos hizo saber que no vendría. — Он дал нам знать, что не придёт."
    origin: "hacer «делать» + saber «знать»: «сделать так, чтобы знали». Устойчивый оборот, часто в официальной переписке."
    register: "Формальное, нейтральное."
    synonyms:
      - word: informar
        pair: ["Me hizo saber la noticia.", "Me informó de la noticia."]
        diff:
          - "informar — «сообщить, дать информацию»"
          - "hacer saber — «дать знать», иногда с нажимом, чтобы человек понял позицию"
    analogs:
      - "to let someone know — дать знать"
      - "to make known — сообщить"
    dialogue:
      - "Ana: ¿Te dijeron algo? | Тебе что-нибудь сказали?"
      - "Pablo: Me hicieron saber que no hay plazas. | Мне дали понять, что мест нет."
    cefr: "B2."
    frequency: "Частое в деловых письмах."
    collocations:
      - "hacer saber a alguien — дать знать кому-то"
      - "hacer saber que… — сообщить, что…"
      - "dar a conocer — обнародовать"
    collocation_example: "Quiero hacerle saber que estoy muy agradecido. — Хочу дать вам знать, что очень благодарен."
    trap: "После hacer saber — a кому и que что: hizo saber a todos que… Не путайте hacer saber «сообщить» с saber hacer «уметь делать»."

  - word: dada la insistencia de
    ru: учитывая чью-то настойчивость
    ipa: /ˈdaða la insisˈtenθja de/
    say: да́да ла инсисте́нсья дэ
    pron: "c перед i в Испании — [θ]; d между гласными мягкое [ð]."
    meaning: "Конструкция «dado + существительное»: «ввиду, учитывая». Dada — женский род, потому что insistencia женского рода."
    examples:
      - "Dada la insistencia de su madre, aceptó. — Учитывая настойчивость матери, он согласился."
      - "Dada la gravedad del caso, lo ingresaron. — Ввиду серьёзности случая его госпитализировали."
    origin: "dado — причастие от dar «давать» + insistencia «настойчивость» (лат. insistere «настаивать»). Дословно «данное настойчивостью» → «учитывая её»."
    register: "Формальное, книжное."
    synonyms:
      - word: debido a
        pair: ["Dada la insistencia, aceptó.", "Debido a la insistencia, aceptó."]
        diff:
          - "debido a — «из-за, по причине»"
          - "dada/o — «принимая во внимание», с оттенком обоснования"
    analogs:
      - "given the insistence of — учитывая настойчивость"
      - "in view of — ввиду"
    dialogue:
      - "Ana: ¿Por qué cambió de opinión? | Почему он передумал?"
      - "Pablo: Dada la insistencia de todos, aceptó. | Учитывая настойчивость всех, согласился."
    cefr: "C1."
    frequency: "Частое в письменной речи."
    collocations:
      - "dado que — поскольку"
      - "dada la situación — учитывая ситуацию"
      - "dado el caso — в таком случае"
    collocation_example: "Dada la situación, es mejor esperar. — Учитывая ситуацию, лучше подождать."
    trap: "Dado согласуется с существительным по роду и числу: dada la insistencia, dados los hechos. После dado que — глагол: dado que es tarde."

  - word: hacer pasar a alguien al salón
    ru: провести кого-то в гостиную
    ipa: /aˈθeɾ paˈsaɾ a ˈalɣjen al saˈlon/
    say: асэ́р паса́р а а́льгьен аль сало́н
    pron: "h не читается; c перед e в Испании — [θ]."
    meaning: "Пригласить гостя войти и провести его в главную комнату дома. Hacer pasar — «пригласить войти»."
    examples:
      - "La asistenta lo hizo pasar al salón. — Домработница провела его в гостиную."
      - "Hazlos pasar al salón, por favor. — Проведи их в гостиную, пожалуйста."
    origin: "hacer «заставлять» + pasar «проходить» + salón «большая комната» (от sala «зал»). «Сделать так, чтобы человек прошёл»."
    register: "Нейтральное, вежливое."
    synonyms:
      - word: invitar a pasar
        pair: ["Lo hizo pasar al salón.", "Lo invitó a pasar al salón."]
        diff:
          - "invitar a pasar — «пригласить войти», вежливое"
          - "hacer pasar — «провести внутрь», обычно в доме с прислугой или секретарём"
    analogs:
      - "to show someone in — проводить кого-то"
      - "to usher in — провести внутрь"
    dialogue:
      - "Ana: ¿Ya llegó el señor López? | Господин Лопес уже пришёл?"
      - "Pablo: Sí, lo hice pasar al salón. | Да, я провёл его в гостиную."
    cefr: "B2."
    frequency: "Нечастое: в рассказах."
    collocations:
      - "hacer pasar a alguien — пригласить войти"
      - "pasar al salón — пройти в гостиную"
      - "pase, por favor — проходите, пожалуйста"
    collocation_example: "La secretaria lo hizo pasar al despacho. — Секретарша провела его в кабинет."
    trap: "Hacer pasar не значит «заставить пройти силой»: это вежливое «пригласить пройти». Перед человеком нужен a: hacer pasar A alguien."

  - word: auricular
    ru: телефонная трубка; наушник
    ipa: /auɾikuˈlaɾ/
    say: аурикула́р
    pron: "Ударение на последнем слоге: auricular."
    meaning: "Часть телефона, которую подносят к уху: трубка. Во множественном — «наушники»: los auriculares."
    examples:
      - "Colgó el auricular. — Он повесил трубку."
      - "Me compré unos auriculares nuevos. — Я купил новые наушники."
    origin: "От lat. auricula «ушко» (уменьшительное от auris «ухо»). Родственное: oreja «ухо», auditivo «слуховой»."
    register: "Нейтральное."
    synonyms:
      - word: teléfono
        pair: ["Descolgó el auricular.", "Descolgó el teléfono."]
        diff:
          - "teléfono — аппарат целиком"
          - "auricular — именно трубка, которую подносят к уху"
    analogs:
      - "receiver — телефонная трубка"
      - "headphones — наушники"
    dialogue:
      - "Ana: ¿Con quién hablabas? | С кем ты разговаривал?"
      - "Pablo: Con mi madre, ya colgué el auricular. | С мамой, я уже повесил трубку."
    cefr: "B2."
    frequency: "Частое: и в телефонах, и в музыке."
    collocations:
      - "descolgar el auricular — снять трубку"
      - "colgar el auricular — повесить трубку"
      - "auriculares inalámbricos — беспроводные наушники"
    collocation_example: "Descolgó el auricular y marcó el número. — Он снял трубку и набрал номер."
    trap: "Auricular — и «трубка» (el auricular), и «наушник» (чаще во множественном: los auriculares). Не путайте с aurícula «предсердие»."

  - word: intuición acertada
    ru: верная интуиция
    ipa: /intwiˈθjon aθeɾˈtaða/
    say: интуисьо́н асэрта́да
    pron: "ui — один слог «уи»; c перед i в Испании — [θ]."
    meaning: "Предчувствие, которое оказалось верным. Acertado — «попавший в цель, правильный»."
    examples:
      - "Su intuición fue acertada. — Его интуиция не подвела."
      - "Tuvo una intuición acertada sobre el caso. — У неё было верное предчувствие по этому делу."
    origin: "intuición — от лат. intueri «пристально смотреть» (in- + tueri «смотреть»). acertado — причастие от acertar «попасть в цель»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: buen instinto
        pair: ["Tuvo una intuición acertada.", "Tuvo buen instinto."]
        diff:
          - "buen instinto — «хорошее чутьё», как врождённая способность"
          - "intuición acertada — конкретное предчувствие, которое сбылось"
    analogs:
      - "correct hunch — верная догадка"
      - "sound intuition — безошибочная интуиция"
    dialogue:
      - "Ana: ¿Cómo lo supiste? | Как ты узнал?"
      - "Pablo: Fue una intuición acertada. | Это была верная интуиция."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "una intuición femenina — женская интуиция"
      - "seguir la intuición — довериться интуиции"
      - "tener intuición — обладать интуицией"
    collocation_example: "Su intuición no falló. — Её интуиция не подвела."
    trap: "Intuición женского рода: la intuición, поэтому acertada. Не путайте с instinto «инстинкт» — врождённая реакция."

  - word: tener constancia de que
    ru: иметь подтверждение, что
    ipa: /teˈneɾ konˈstanθja de ke/
    say: тэнэ́р конста́нсья дэ кэ
    pron: "c перед i в Испании — [θ]; ударение на stan."
    meaning: "Знать наверняка, потому что есть документ, запись или доказательство: «у нас зафиксировано, что…»."
    examples:
      - "Tenemos constancia de que llegó anoche. — У нас есть подтверждение, что он приехал вчера вечером."
      - "No tengo constancia de ese pago. — У меня нет подтверждения этого платежа."
    origin: "От constar «быть записанным, быть известным» (лат. constare «стоять твёрдо») + суффикс -ia: «то, что зафиксировано»."
    register: "Формальное, юридическое."
    synonyms:
      - word: tener pruebas de que
        pair: ["Tengo constancia de que pagó.", "Tengo pruebas de que pagó."]
        diff:
          - "tener pruebas — «иметь доказательства»"
          - "tener constancia — «есть запись, документ», чуть сдержаннее и официальнее"
    analogs:
      - "to have it on record that — иметь в записях, что"
      - "to be aware that — знать, что"
    dialogue:
      - "Ana: ¿Está seguro de que lo firmó? | Вы уверены, что он подписал?"
      - "Pablo: Sí, tenemos constancia de que lo firmó. | Да, у нас есть подтверждение, что подписал."
    cefr: "C1."
    frequency: "Частое в официальных текстах."
    collocations:
      - "dejar constancia — зафиксировать"
      - "tener constancia — иметь подтверждение"
      - "no hay constancia — нет подтверждений"
    collocation_example: "Quiero dejar constancia de mi queja. — Хочу зафиксировать свою жалобу."
    trap: "Constancia — и «подтверждение», и «постоянство, упорство»: con constancia — «упорно». Для «зафиксировать» — dejar constancia."

  - word: borrar
    ru: стереть, удалить
    ipa: /boˈrraɾ/
    say: борра́р
    pron: "rr — раскатистое."
    meaning: "Убрать написанное: ластиком, с доски, из памяти телефона. Ещё — «удалить файл, сообщение»."
    examples:
      - "Borra el mensaje, por favor. — Удали сообщение, пожалуйста."
      - "Borró la pizarra antes de salir. — Он стёр с доски перед уходом."
    origin: "От borra «шерсть, пух» (лат. burra): возможно, образ «стирать пухом». Родственное: borrador «ластик; черновик»."
    register: "Нейтральное."
    synonyms:
      - word: eliminar
        pair: ["Borró el archivo.", "Eliminó el archivo."]
        diff:
          - "eliminar — «удалить, устранить», нейтрально и формально"
          - "borrar — «стереть написанное, записанное», проще"
    analogs:
      - "to erase — стереть"
      - "to delete — удалить"
    dialogue:
      - "Ana: ¿Dónde está la foto? | Где фото?"
      - "Pablo: La borré sin querer. | Я случайно её удалил."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "borrar un mensaje — удалить сообщение"
      - "borrar la pizarra — стереть доску"
      - "borrarse de una lista — выйти из списка"
    collocation_example: "Borré por error todos los contactos. — Я по ошибке удалил все контакты."
    trap: "Borrar — и «стереть», и «удалить». Не путайте с borracho «пьяный» и borrasca «буря»: слова похожи по звучанию, но не связаны."

  - word: pulsar
    ru: нажимать (клавишу, кнопку)
    ipa: /pulˈsaɾ/
    say: пульса́р
    meaning: "Нажать на кнопку или клавишу: на телефоне, на клавиатуре, на звонке. Ещё — «пульсировать»."
    examples:
      - "Pulse la tecla verde para llamar. — Нажмите зелёную клавишу, чтобы позвонить."
      - "Pulsa el botón de emergencia. — Нажми кнопку экстренного вызова."
    origin: "Из лат. pulsare «ударять, стучать» (от pellere «толкать»). Родственные: pulso «пульс», pulsera «браслет»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: presionar
        pair: ["Pulsa el botón.", "Presiona el botón."]
        diff:
          - "presionar — «давить, нажимать» сильнее; ещё «оказывать давление на человека»"
          - "pulsar — «нажимать клавишу, кнопку» коротко, как в инструкциях"
    analogs:
      - "to press — нажимать"
      - "to push — нажимать"
    dialogue:
      - "Ana: ¿Cómo se enciende? | Как это включить?"
      - "Pablo: Pulsa el botón rojo. | Нажми красную кнопку."
    cefr: "B2."
    frequency: "Очень частое в инструкциях."
    collocations:
      - "pulsar una tecla — нажать клавишу"
      - "pulsar el botón — нажать кнопку"
      - "pulsar el timbre — позвонить в дверь"
    collocation_example: "Pulse la tecla de inicio para empezar. — Нажмите клавишу «пуск», чтобы начать."
    trap: "Pulsar — «нажимать» на кнопки, а «давить на человека» — presionar. Не путайте с pulsera «браслет» и pulso «пульс»."

  - word: no ser fácil
    ru: быть непростым; быть маловероятным
    ipa: /no ˈseɾ ˈfaθil/
    say: но сэр фа́силь
    pron: "c перед i в Испании — [θ]."
    meaning: "Дело нелёгкое. Ещё «no es fácil que + subjuntivo» — «вряд ли»: маловероятно."
    examples:
      - "No es fácil encontrar trabajo. — Найти работу непросто."
      - "No es fácil que venga hoy. — Вряд ли он придёт сегодня."
    origin: "fácil «лёгкий» (лат. facilis, от facere «делать»: то, что легко сделать). No ser fácil — «не быть лёгким»."
    register: "Нейтральное."
    synonyms:
      - word: ser difícil
        pair: ["No es fácil convencerlo.", "Es difícil convencerlo."]
        diff:
          - "ser difícil — прямо «трудно»"
          - "no ser fácil — мягче, вежливее, как «непросто»"
    analogs:
      - "it's not easy — это непросто"
      - "it's unlikely — маловероятно"
    dialogue:
      - "Ana: ¿Crees que aceptará? | Думаешь, он согласится?"
      - "Pablo: No es fácil que acepte. | Вряд ли он согласится."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "no es fácil — это непросто"
      - "no es fácil que + subjuntivo — вряд ли"
      - "no ser nada fácil — быть совсем непросто"
    collocation_example: "No es nada fácil aprender un idioma. — Выучить язык совсем непросто."
    trap: "Этот оборот мягче, чем es difícil: так вежливо говорят о проблеме. После no es fácil que — subjuntivo."

  - word: puesto que
    ru: поскольку
    ipa: /ˈpwesto ke/
    say: пуэ́сто кэ
    pron: "ue — один слог «уэ»."
    meaning: "Союз причины: «так как, поскольку». Объясняет, почему что-то происходит. Часто в письменной речи."
    examples:
      - "Puesto que llueve, nos quedamos en casa. — Поскольку идёт дождь, мы остаёмся дома."
      - "Se lo dije, puesto que lo sabía. — Я ему сказал, раз он знал."
    origin: "puesto — причастие от poner «класть, ставить» + que «что»: «поставлено, что…». Дословно «установлено, что» → «раз уж»."
    register: "Формальное, книжное."
    synonyms:
      - word: ya que
        pair: ["Puesto que llueve, me quedo.", "Ya que llueve, me quedo."]
        diff:
          - "ya que — разговорный и самый частый вариант"
          - "puesto que — книжнее, как в тексте"
    analogs:
      - "since — поскольку"
      - "given that — учитывая, что"
    dialogue:
      - "Ana: ¿Por qué no vienes? | Почему ты не приходишь?"
      - "Pablo: Puesto que estoy enfermo, me quedo. | Так как я болен, я остаюсь."
    cefr: "B2."
    frequency: "Частое в письменной речи."
    collocations:
      - "puesto que + индикатив — поскольку"
      - "dado que — поскольку"
      - "ya que — раз уж"
    collocation_example: "Puesto que no hay otra opción, aceptamos. — Поскольку другого варианта нет, мы соглашаемся."
    trap: "После puesto que — indicativo: puesto que es tarde. Не путайте puesto que «поскольку» с puesto «рабочее место; прилавок»."

  - word: buena papeleta
    ru: трудная ситуация, неприятное положение
    ipa: /ˈbwena papeˈleta/
    say: буэ́на папэлэ́та
    pron: "ue — один слог «уэ»; ударение на le: papeleta."
    meaning: "Иронично: «хорошенькая задача» — когда придётся решать что-то неприятное. Обычно в «¡Menuda papeleta!»."
    examples:
      - "Menuda papeleta tenemos ahora. — Ну и задачка перед нами."
      - "Le tocó una buena papeleta. — Ему досталась непростая задача."
    origin: "papeleta — «бумажка, талон, бюллетень» (от papel «бумага»). Образ: вытянутый «билет» с неприятным заданием."
    register: "Разговорное, иронично."
    synonyms:
      - word: marrón
        pair: ["Menuda papeleta.", "Menudo marrón."]
        diff:
          - "marrón — разговорное, «неприятность, которая свалилась»"
          - "papeleta — «неприятное дело, которое надо решать»"
    analogs:
      - "a tough job — непростая работа"
      - "a nasty situation — неприятная ситуация"
    dialogue:
      - "Ana: ¿Y ahora qué hacemos? | И что теперь делать?"
      - "Pablo: Menuda papeleta nos ha tocado. | Ну и задачка нам досталась."
    cefr: "C1."
    frequency: "Частое в разговоре в Испании."
    collocations:
      - "menuda papeleta — ну и задача"
      - "tocar una papeleta — достаться сложное дело"
      - "papeleta de voto — избирательный бюллетень"
    collocation_example: "Explicarle esto a mi jefe es una papeleta. — Объяснить это начальнику — задача не из лёгких."
    trap: "В буквальном смысле papeleta — «бюллетень» или «квитанция». Иронично: buena/menuda papeleta — наоборот «плохая задача», а не «хорошая»."

  - word: abordar
    ru: затронуть (тему); подойти к вопросу
    ipa: /aβoɾˈðaɾ/
    say: аборда́р
    pron: "b между гласными мягкая [β]; d между гласными мягкое [ð]."
    meaning: "Начать заниматься сложной темой или проблемой: заговорить об этом. Ещё — «подойти к человеку»; «подняться на борт»."
    examples:
      - "Hay que abordar el problema cuanto antes. — Нужно браться за проблему как можно скорее."
      - "Abordó el tema con delicadeza. — Он затронул тему деликатно."
    origin: "От a bordo «на борт» (borde «край, борт»): «подойти к борту корабля». Затем — «приступить к чему-то»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: tratar
        pair: ["Abordaron el tema del dinero.", "Trataron el tema del dinero."]
        diff:
          - "tratar — «обсуждать, касаться», нейтрально"
          - "abordar — «приступить, взяться за непростое», с усилием"
    analogs:
      - "to tackle — взяться за, справиться"
      - "to broach — завести разговор о"
    dialogue:
      - "Ana: ¿Hablaste con él del dinero? | Ты говорил с ним о деньгах?"
      - "Pablo: No sé cómo abordar el tema. | Не знаю, как затронуть эту тему."
    cefr: "C1."
    frequency: "Частое в новостях и деловой речи."
    collocations:
      - "abordar un tema — затронуть тему"
      - "abordar un problema — взяться за проблему"
      - "abordar a alguien — подойти к кому-то"
    collocation_example: "El Gobierno abordará la reforma el próximo mes. — Правительство займётся реформой в следующем месяце."
    trap: "Abordar — переходный, без предлога: abordar un problema. Не путайте с aburrir «надоедать» и abordaje «абордаж»."
