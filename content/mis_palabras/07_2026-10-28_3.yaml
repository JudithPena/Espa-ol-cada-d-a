# Четвёртый список автора, часть 6 — «Desconcierto en el hospital 4» (слова 29–42).
lang: es
words:
  - word: delantal
    ru: фартук
    ipa: /delanˈtal/
    say: дэланта́ль
    meaning: "Одежда без рукавов, которую надевают спереди, чтобы не испачкать одежду: на кухне, в мастерской."
    examples:
      - "Ponte el delantal antes de cocinar. — Надень фартук перед тем, как готовить."
      - "Los alumnos pintaron con delantal para no mancharse la ropa de colores. — Ученики рисовали в фартуках, чтобы не испачкать одежду красками."
      - "El carnicero lleva un delantal blanco manchado de sangre y un cuchillo enorme en la mano. — На мяснике белый фартук, испачканный кровью, а в руке огромный нож."
    origin: "От delante «спереди» + суффикс -al: «то, что надевают спереди». Родственные: adelante «вперёд», delantero «передний»."
    register: "Нейтральное."
    synonyms:
      - word: mandil
        pair: ["Llevaba un delantal.", "Llevaba un mandil."]
        diff:
          - "mandil — тоже «фартук»; в Латинской Америке и в мастерских чаще"
          - "delantal — самое общее слово в Испании"
    analogs:
      - "apron — фартук"
      - "pinafore — фартук-сарафан"
    dialogue:
      - "Ana: ¿Por qué llevas eso puesto? | Почему ты это надел?"
      - "Pablo: Es mi delantal. Voy a cocinar. | Это мой фартук. Я буду готовить."
      - "Ana: ¿Tú? ¿Desde cuándo cocinas? | Ты? С каких пор ты готовишь?"
      - "Pablo: Desde que mi asistenta se tomó vacaciones. No me queda otro remedio. | С тех пор как домработница ушла в отпуск. Другого выхода нет."
      - "Ana: ¿Y qué vas a hacer? | И что ты собираешься приготовить?"
      - "Pablo: Una tortilla, si no se me quema. Me embarga la ilusión. | Тортилью, если не подгорит. Меня охватило воодушевление."
      - "Ana: ¡Mucha suerte! Ponte también un trapo en el hombro, como los cocineros. | Удачи! Положи ещё тряпку на плечо, как повара."
      - "Pablo: Hecho. Ahora, a armarse de paciencia. | Готово. Теперь запасаемся терпением."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ponerse el delantal — надеть фартук"
      - "quitarse el delantal — снять фартук"
      - "delantal de cocina — кухонный фартук"
    collocation_example: "Se quitó el delantal y se sentó a la mesa. — Он снял фартук и сел за стол."
    trap: "Слово мужского рода: el delantal. Не путайте с delantero «передний; нападающий» и delante «спереди»."

  - word: entregar apuntes
    ru: передать конспекты
    ipa: /entɾeˈɣaɾ aˈpuntes/
    say: энтрэга́р апу́нтэс
    pron: "g между гласными мягкое [ɣ]; перед e g меняется на gu: entregué."
    meaning: "Отдать записи лекций кому-то: чтобы тот мог учиться, переписать, подготовиться. Apuntes — «конспекты»."
    examples:
      - "¿Puedes entregar los apuntes a Marta? — Можешь передать конспекты Марте?"
      - "Le entregué los apuntes a mi compañero para que pudiera estudiar mientras estaba enfermo. — Я отдал конспекты соседу по парте, чтобы он мог заниматься, пока болеет."
      - "¿Me entregas los apuntes de ayer? Es que me quedé dormido y no fui a clase. — Передашь мне вчерашние конспекты? Я проспал и не пошёл на занятия."
    origin: "entregar — из лат. integrare «возвращать в целости»; apuntes — от apuntar «записывать» (a- + punto «точка»: ставить пометки)."
    register: "Нейтральное, учебное."
    synonyms:
      - word: pasar los apuntes
        pair: ["Me entregó los apuntes.", "Me pasó los apuntes."]
        diff:
          - "pasar — разговорнее: «передать, одолжить»"
          - "entregar — «вручить, отдать в руки», чуть официальнее"
    analogs:
      - "to hand over notes — передать записи"
      - "to lend notes — одолжить конспекты"
    dialogue:
      - "Ana: ¿Tienes los apuntes de historia? | У тебя есть конспекты по истории?"
      - "Pablo: Sí, te los entrego mañana. | Да, передам тебе завтра."
      - "Ana: ¿No podrías hoy? Los necesito cuanto antes. | Не мог бы сегодня? Они нужны мне как можно скорее."
      - "Pablo: Hoy ando buscando a Luis para entregarle otros papeles. Estoy a punto de salir. | Сегодня я ищу Луиса, чтобы передать ему другие бумаги. Я вот-вот выйду."
      - "Ana: Entonces envíamelos por el móvil. | Тогда пришли мне их на телефон."
      - "Pablo: Están escritos a mano. Tendría que fotografiarlos página por página. | Они написаны от руки. Пришлось бы фотографировать постранично."
      - "Ana: Eso me vale. No hace falta que sea perfecto. | Мне подойдёт. Не обязательно, чтобы было идеально."
      - "Pablo: Vale. Aprovecho el descanso y te los mando. | Хорошо. Воспользуюсь перерывом и пришлю."
    cefr: "B1."
    frequency: "Частое среди студентов."
    collocations:
      - "tomar apuntes — конспектировать"
      - "los apuntes de clase — конспекты лекций"
      - "entregar un trabajo — сдать работу"
    collocation_example: "Tomo apuntes en todas las clases. — Я конспектирую на всех занятиях."
    trap: "Apuntes почти всегда во множественном: los apuntes. Entregar — «передавать, сдавать», а не «возвращать» (devolver)."

  - word: hacer saber
    ru: сообщить, дать понять
    ipa: /aˈθeɾ saˈβeɾ/
    say: асэ́р сабэ́р
    pron: "h не читается; c перед e в Испании — [θ]; v читается как b."
    meaning: "Известить кого-то, дать ему знать: официально или намёком. Hacer saber algo a alguien."
    examples:
      - "Le hice saber mi decisión. — Я сообщил ему своё решение."
      - "Nos hizo saber que no vendría a la cena, aunque no explicó por qué. — Он дал нам понять, что не придёт на ужин, хотя не объяснил почему."
      - "Quiero hacer saber a todos los presentes que esta es la última reunión del año. — Я хочу довести до сведения всех присутствующих, что это последнее собрание в этом году."
    origin: "hacer «делать» + saber «знать»: «сделать так, чтобы знали». Устойчивый оборот, часто в официальной переписке."
    register: "Формальное, нейтральное."
    synonyms:
      - word: informar
        pair: ["Me hizo saber la noticia.", "Me informó de la noticia."]
        diff:
          - "informar — «сообщить, дать информацию»"
          - "hacer saber — «дать знать», иногда с нажимом, чтобы человек понял позицию"
    analogs:
      - "to let someone know — дать знать"
      - "to make known — сообщить"
    dialogue:
      - "Ana: ¿Te dijeron algo? | Тебе что-нибудь сказали?"
      - "Pablo: Me hicieron saber que no hay plazas. | Мне дали понять, что мест нет."
      - "Ana: ¿Y no hay alternativa? | И нет альтернативы?"
      - "Pablo: Quizá en septiembre. Me avisarán, si hay alguna novedad. | Возможно, в сентябре. Они предупредят, если будут новости."
      - "Ana: ¿Cuándo te lo hicieron saber? | Когда тебе об этом сообщили?"
      - "Pablo: Esta mañana, sin previo aviso, por teléfono. Me llevé una gran sorpresa. | Сегодня утром, без предупреждения, по телефону. Я был очень удивлён."
      - "Ana: Qué falta de consideración. | Какое неуважение."
      - "Pablo: Pese a todo, me hicieron saber que lo sienten. Es un trámite corriente. | Но всё же они дали понять, что сожалеют. Это обычная формальность."
    cefr: "B2."
    frequency: "Частое в деловых письмах."
    collocations:
      - "hacer saber a alguien — дать знать кому-то"
      - "hacer saber que… — сообщить, что…"
      - "dar a conocer — обнародовать"
    collocation_example: "Quiero hacerle saber que estoy muy agradecido. — Хочу дать вам знать, что очень благодарен."
    trap: "После hacer saber — a кому и que что: hizo saber a todos que… Не путайте hacer saber «сообщить» с saber hacer «уметь делать»."

  - word: dada la insistencia de
    ru: учитывая чью-то настойчивость
    ipa: /ˈdaða la insisˈtenθja de/
    say: да́да ла инсисте́нсья дэ
    pron: "c перед i в Испании — [θ]; d между гласными мягкое [ð]."
    meaning: "Конструкция «dado + существительное»: «ввиду, учитывая». Dada — женский род, потому что insistencia женского рода."
    examples:
      - "Dada la lluvia, cancelaron la excursión. — Ввиду дождя экскурсию отменили."
      - "Dada la insistencia de los vecinos, el ayuntamiento decidió arreglar por fin el parque. — Учитывая настойчивость жителей, мэрия решила наконец отремонтировать парк."
      - "Dada la gravedad del caso, lo ingresaron de inmediato en la unidad de cuidados intensivos. — Ввиду серьёзности случая его немедленно положили в реанимацию."
    origin: "dado — причастие от dar «давать» + insistencia «настойчивость» (лат. insistere «настаивать»). Дословно «данное настойчивостью» → «учитывая её»."
    register: "Формальное, книжное."
    synonyms:
      - word: debido a
        pair: ["Dada la insistencia, aceptó.", "Debido a la insistencia, aceptó."]
        diff:
          - "debido a — «из-за, по причине»"
          - "dada/o — «принимая во внимание», с оттенком обоснования"
    analogs:
      - "given the insistence of — учитывая настойчивость"
      - "in view of — ввиду"
    dialogue:
      - "Ana: ¿Por qué cambió de opinión? | Почему он передумал?"
      - "Pablo: Dada la insistencia de todos, aceptó. | Учитывая настойчивость всех, он согласился."
      - "Ana: ¿Se resistió mucho? | Он долго сопротивлялся?"
      - "Pablo: Al principio se negó en redondo. Dijo que no le convenía y que no tenía tiempo. | Сначала категорически отказался. Сказал, что ему это неудобно и нет времени."
      - "Ana: ¿Y quién lo convenció? | И кто его убедил?"
      - "Pablo: Su madre, sobre todo. Dada su insistencia, no tuvo escapatoria. | Прежде всего мать. Учитывая её настойчивость, ему некуда было деваться."
      - "Ana: Las madres siempre ganan. | Мамы всегда выигрывают."
      - "Pablo: Sí, y con paciencia. Dada la insistencia, hasta el más testarudo cede. | Да, и терпением. Учитывая настойчивость, уступит даже самый упрямый."
    cefr: "C1."
    frequency: "Частое в письменной речи."
    collocations:
      - "dado que — поскольку"
      - "dada la situación — учитывая ситуацию"
      - "dado el caso — в таком случае"
    collocation_example: "Dada la situación, es mejor esperar. — Учитывая ситуацию, лучше подождать."
    trap: "Dado согласуется с существительным по роду и числу: dada la insistencia, dados los hechos. После dado que — глагол: dado que es tarde."

  - word: hacer pasar a alguien al salón
    ru: провести кого-то в гостиную
    ipa: /aˈθeɾ paˈsaɾ a ˈalɣjen al saˈlon/
    say: асэ́р паса́р а а́льгьен аль сало́н
    pron: "h не читается; c перед e в Испании — [θ]."
    meaning: "Пригласить гостя войти и провести его в главную комнату дома. Hacer pasar — «пригласить войти»."
    examples:
      - "Hazlos pasar al salón, por favor. — Проведи их в гостиную, пожалуйста."
      - "El mayordomo hizo pasar al inspector al salón, donde ardía la chimenea. — Дворецкий провёл инспектора в гостиную, где горел камин."
      - "La asistenta lo hizo pasar al salón y le pidió que esperase a que llegara la señora. — Домработница провела его в гостиную и попросила подождать, пока придёт хозяйка."
    origin: "hacer «заставлять» + pasar «проходить» + salón «большая комната» (от sala «зал»). «Сделать так, чтобы человек прошёл»."
    register: "Нейтральное, вежливое."
    synonyms:
      - word: invitar a pasar
        pair: ["Lo hizo pasar al salón.", "Lo invitó a pasar al salón."]
        diff:
          - "invitar a pasar — «пригласить войти», вежливое"
          - "hacer pasar — «провести внутрь», обычно в доме с прислугой или секретарём"
    analogs:
      - "to show someone in — проводить кого-то"
      - "to usher in — провести внутрь"
    dialogue:
      - "Ana: ¿Ya llegó el señor López? | Сеньор Лопес уже пришёл?"
      - "Pablo: Sí, lo hice pasar al salón. | Да, я проводил его в гостиную."
      - "Ana: ¿Le ofreciste algo? | Ты ему что-нибудь предложил?"
      - "Pablo: Un café y un bollo. Estaba un poco aturdido, con tanto tráfico. | Кофе и булочку. Он был слегка растерян из-за пробок."
      - "Ana: ¿Y el otro señor? | А другой сеньор?"
      - "Pablo: Aún no. Cuando llegue, hazlo pasar al salón también, por favor. | Ещё нет. Когда придёт, проводи его тоже в гостиную, пожалуйста."
      - "Ana: Descuida. ¿Les aviso de que el jefe llegará tarde? | Не беспокойся. Предупредить их, что начальник опоздает?"
      - "Pablo: Sí, hazles saber que no tardará en venir. | Да, дай им понять, что он скоро будет."
    cefr: "B2."
    frequency: "Нечастое: в рассказах."
    collocations:
      - "hacer pasar a alguien — пригласить войти"
      - "pasar al salón — пройти в гостиную"
      - "pase, por favor — проходите, пожалуйста"
    collocation_example: "La secretaria lo hizo pasar al despacho. — Секретарша провела его в кабинет."
    trap: "Hacer pasar не значит «заставить пройти силой»: это вежливое «пригласить пройти». Перед человеком нужен a: hacer pasar A alguien."

  - word: auricular
    ru: телефонная трубка; наушник
    ipa: /auɾikuˈlaɾ/
    say: аурикула́р
    pron: "Ударение на последнем слоге: auricular."
    meaning: "Часть телефона, которую подносят к уху: трубка. Во множественном — «наушники»: los auriculares."
    examples:
      - "Se me rompió el auricular del teléfono. — У меня сломалась трубка телефона."
      - "Descolgó el auricular, escuchó un momento y, sin decir palabra, volvió a dejarlo. — Он снял трубку, послушал мгновение и, не сказав ни слова, положил её обратно."
      - "Me compré unos auriculares nuevos para escuchar música en el tren sin molestar a nadie. — Я купил новые наушники, чтобы слушать музыку в поезде, никому не мешая."
    origin: "От lat. auricula «ушко» (уменьшительное от auris «ухо»). Родственное: oreja «ухо», auditivo «слуховой»."
    register: "Нейтральное."
    synonyms:
      - word: teléfono
        pair: ["Descolgó el auricular.", "Descolgó el teléfono."]
        diff:
          - "teléfono — аппарат целиком"
          - "auricular — именно трубка, которую подносят к уху"
    analogs:
      - "receiver — телефонная трубка"
      - "headphones — наушники"
    dialogue:
      - "Ana: ¿Con quién hablabas? | С кем ты говорил?"
      - "Pablo: Con mi madre. Ya colgué el auricular. | С мамой. Я уже повесил трубку."
      - "Ana: ¿Todavía usas teléfono fijo? | Ты до сих пор пользуешься стационарным телефоном?"
      - "Pablo: En casa, sí. El auricular pesa un poco, pero se oye mucho mejor. | Дома да. Трубка немного тяжёлая, но слышно гораздо лучше."
      - "Ana: Yo uso auriculares con el móvil. Estoy a punto de tirar el fijo. | Я пользуюсь наушниками с мобильным. Вот-вот выброшу стационарный."
      - "Pablo: No lo hagas. En una emergencia puede ser un remedio. | Не делай этого. В экстренной ситуации он может спасти."
      - "Ana: Tienes razón. Por si se va la luz. | Ты прав. На случай, если отключат электричество."
      - "Pablo: Exacto. Y, de hecho, mi vecino lo usó el mes pasado. | Именно. Кстати, мой сосед пользовался им в прошлом месяце."
    cefr: "B2."
    frequency: "Частое: и в телефонах, и в музыке."
    collocations:
      - "descolgar el auricular — снять трубку"
      - "colgar el auricular — повесить трубку"
      - "auriculares inalámbricos — беспроводные наушники"
    collocation_example: "Descolgó el auricular y marcó el número. — Он снял трубку и набрал номер."
    trap: "Auricular — и «трубка» (el auricular), и «наушник» (чаще во множественном: los auriculares). Не путайте с aurícula «предсердие»."

  - word: intuición acertada
    ru: верная интуиция
    ipa: /intwiˈθjon aθeɾˈtaða/
    say: интуисьо́н асэрта́да
    pron: "ui — один слог «уи»; c перед i в Испании — [θ]."
    meaning: "Предчувствие, которое оказалось верным. Acertado — «попавший в цель, правильный»."
    examples:
      - "Su intuición no falló esta vez. — Его интуиция на этот раз не подвела."
      - "Su intuición fue acertada: desconfió del vendedor y, efectivamente, resultó ser un estafador. — Его интуиция не подвела: он не доверился продавцу, и тот действительно оказался мошенником."
      - "Tuvo una intuición acertada sobre el caso desde el primer día, antes de que aparecieran las pruebas. — У него было верное предчувствие по этому делу с первого дня, ещё до появления доказательств."
    origin: "intuición — от лат. intueri «пристально смотреть» (in- + tueri «смотреть»). acertado — причастие от acertar «попасть в цель»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: buen instinto
        pair: ["Tuvo una intuición acertada.", "Tuvo buen instinto."]
        diff:
          - "buen instinto — «хорошее чутьё», как врождённая способность"
          - "intuición acertada — конкретное предчувствие, которое сбылось"
    analogs:
      - "correct hunch — верная догадка"
      - "sound intuition — безошибочная интуиция"
    dialogue:
      - "Ana: ¿Cómo lo supiste? | Как ты узнал?"
      - "Pablo: Fue una intuición acertada. | Это была верная интуиция."
      - "Ana: ¿Presentiste algo? | Ты что-то предчувствовал?"
      - "Pablo: Sí, un escalofrío cuando lo vi llegar. Parecía nervioso y apenas acertó a saludar. | Да, озноб, когда увидел, как он подходит. Он казался нервным и едва смог поздороваться."
      - "Ana: Qué ojo tienes. | Какое у тебя чутьё."
      - "Pablo: No siempre acierto. Esta vez tuve una intuición acertada. | Не всегда угадываю. В этот раз интуиция меня не подвела."
      - "Ana: ¿Y qué hiciste? | И что ты сделал?"
      - "Pablo: Avisé a la policía cuanto antes. Y no tardaron en detenerlo. | Предупредил полицию как можно скорее. И они не заставили себя ждать с задержанием."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "una intuición femenina — женская интуиция"
      - "seguir la intuición — довериться интуиции"
      - "tener intuición — обладать интуицией"
    collocation_example: "Su intuición no falló. — Её интуиция не подвела."
    trap: "Intuición женского рода: la intuición, поэтому acertada. Не путайте с instinto «инстинкт» — врождённая реакция."

  - word: tener constancia de que
    ru: иметь подтверждение, что
    ipa: /teˈneɾ konˈstanθja de ke/
    say: тэнэ́р конста́нсья дэ кэ
    pron: "c перед i в Испании — [θ]; ударение на stan."
    meaning: "Знать наверняка, потому что есть документ, запись или доказательство: «у нас зафиксировано, что…»."
    examples:
      - "Tenemos constancia de que llegó anoche. — У нас есть подтверждение, что он приехал вчера вечером."
      - "La policía tiene constancia de que el sospechoso estuvo en la ciudad aquella noche. — У полиции есть данные о том, что подозреваемый находился в городе той ночью."
      - "No tengo constancia de ese pago, así que será mejor que me enseñe el justificante. — У меня нет подтверждения этого платежа, так что лучше покажите мне квитанцию."
    origin: "От constar «быть записанным, быть известным» (лат. constare «стоять твёрдо») + суффикс -ia: «то, что зафиксировано»."
    register: "Формальное, юридическое."
    synonyms:
      - word: tener pruebas de que
        pair: ["Tengo constancia de que pagó.", "Tengo pruebas de que pagó."]
        diff:
          - "tener pruebas — «иметь доказательства»"
          - "tener constancia — «есть запись, документ», чуть сдержаннее и официальнее"
    analogs:
      - "to have it on record that — иметь в записях, что"
      - "to be aware that — знать, что"
    dialogue:
      - "Ana: ¿Está seguro de que lo firmó? | Вы уверены, что он подписал?"
      - "Pablo: Sí, tenemos constancia de que lo firmó. | Да, у нас есть подтверждение, что он подписал."
      - "Ana: ¿Qué constancia? | Какое подтверждение?"
      - "Pablo: Una copia con su firma y el sello del juzgado. Además, hay un testigo que lo vio. | Копия с его подписью и печатью суда. Кроме того, есть свидетель, который это видел."
      - "Ana: Entonces no hay duda. | Тогда нет сомнений."
      - "Pablo: Ninguna. Ya no puede esgrimir que lo ignoraba. | Никаких. Он больше не может заявить, что не знал."
      - "Ana: ¿Y qué consecuencias tendrá? | И какие будут последствия?"
      - "Pablo: Tendrá que pagar una multa. Pese a todo, podría haber sido peor. | Придётся заплатить штраф. Несмотря ни на что, могло быть и хуже."
    cefr: "C1."
    frequency: "Частое в официальных текстах."
    collocations:
      - "dejar constancia — зафиксировать"
      - "tener constancia — иметь подтверждение"
      - "no hay constancia — нет подтверждений"
    collocation_example: "Quiero dejar constancia de mi queja. — Хочу зафиксировать свою жалобу."
    trap: "Constancia — и «подтверждение», и «постоянство, упорство»: con constancia — «упорно». Для «зафиксировать» — dejar constancia."

  - word: borrar
    ru: стереть, удалить
    ipa: /boˈrraɾ/
    say: борра́р
    pron: "rr — раскатистое."
    meaning: "Убрать написанное: ластиком, с доски, из памяти телефона. Ещё — «удалить файл, сообщение»."
    examples:
      - "Borra el mensaje, por favor. — Удали сообщение, пожалуйста."
      - "Sin querer, borré todas las fotos del viaje al limpiar la memoria del móvil. — Нечаянно я удалил все фото из поездки, когда чистил память телефона."
      - "Borró la pizarra antes de salir de clase y dejó todo limpio para el profesor siguiente. — Он стёр доску перед уходом с занятия и оставил всё чистым для следующего преподавателя."
    origin: "От borra «шерсть, пух» (лат. burra): возможно, образ «стирать пухом». Родственное: borrador «ластик; черновик»."
    register: "Нейтральное."
    synonyms:
      - word: eliminar
        pair: ["Borró el archivo.", "Eliminó el archivo."]
        diff:
          - "eliminar — «удалить, устранить», нейтрально и формально"
          - "borrar — «стереть написанное, записанное», проще"
    analogs:
      - "to erase — стереть"
      - "to delete — удалить"
    dialogue:
      - "Ana: ¿Dónde está la foto? | Где фото?"
      - "Pablo: La borré sin querer. | Я случайно удалил её."
      - "Ana: ¡No! Era la única de aquel día. | Нет! Это было единственное фото того дня."
      - "Pablo: Lo siento. Pulsé el botón equivocado, y ni siquiera me di cuenta. | Прости. Нажал не ту кнопку и даже не заметил."
      - "Ana: ¿No se puede recuperar? | Нельзя восстановить?"
      - "Pablo: Quizá, desde la papelera. Voy a mirar. Hay que armarse de paciencia. | Возможно, из корзины. Сейчас посмотрю. Нужно запастись терпением."
      - "Ana: Si no, me enfado. | А если нет, я рассержусь."
      - "Pablo: Tranquila, que ya veo algo. ¡Aquí está! No se borró del todo. | Спокойно, уже что-то вижу. Вот она! Полностью не удалилась."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "borrar un mensaje — удалить сообщение"
      - "borrar la pizarra — стереть доску"
      - "borrarse de una lista — выйти из списка"
    collocation_example: "Borré por error todos los contactos. — Я по ошибке удалил все контакты."
    trap: "Borrar — и «стереть», и «удалить». Не путайте с borracho «пьяный» и borrasca «буря»: слова похожи по звучанию, но не связаны."

  - word: pulsar
    ru: нажимать (клавишу, кнопку)
    ipa: /pulˈsaɾ/
    say: пульса́р
    meaning: "Нажать на кнопку или клавишу: на телефоне, на клавиатуре, на звонке. Ещё — «пульсировать»."
    examples:
      - "Pulsa la tecla para continuar. — Нажми клавишу, чтобы продолжить."
      - "Pulse la tecla verde para llamar y la roja para colgar el teléfono. — Нажмите зелёную кнопку, чтобы позвонить, и красную, чтобы положить трубку."
      - "Pulsa el botón de emergencia si ves que el ascensor se para entre dos pisos. — Нажми кнопку экстренного вызова, если увидишь, что лифт застрял между этажами."
    origin: "Из лат. pulsare «ударять, стучать» (от pellere «толкать»). Родственные: pulso «пульс», pulsera «браслет»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: presionar
        pair: ["Pulsa el botón.", "Presiona el botón."]
        diff:
          - "presionar — «давить, нажимать» сильнее; ещё «оказывать давление на человека»"
          - "pulsar — «нажимать клавишу, кнопку» коротко, как в инструкциях"
    analogs:
      - "to press — нажимать"
      - "to push — нажимать"
    dialogue:
      - "Ana: ¿Cómo se enciende? | Как это включается?"
      - "Pablo: Pulsa el botón rojo. | Нажми красную кнопку."
      - "Ana: ¿Este? No pasa nada. | Эту? Ничего не происходит."
      - "Pablo: Mantén pulsado unos segundos. Es un modelo antiguo. | Подержи несколько секунд. Это старая модель."
      - "Ana: Ya se enciende. ¿Y ahora qué pulso? | Включилось. А что теперь нажимать?"
      - "Pablo: Pulsa la tecla verde para empezar y la azul para parar. | Нажми зелёную клавишу, чтобы начать, и синюю, чтобы остановить."
      - "Ana: Qué sencillo. ¿Y para borrar? | Как просто. А чтобы стереть?"
      - "Pablo: La amarilla, pero ten cuidado, que no pide confirmación. | Жёлтую, но осторожно: подтверждения она не требует."
    cefr: "B2."
    frequency: "Очень частое в инструкциях."
    collocations:
      - "pulsar una tecla — нажать клавишу"
      - "pulsar el botón — нажать кнопку"
      - "pulsar el timbre — позвонить в дверь"
    collocation_example: "Pulse la tecla de inicio para empezar. — Нажмите клавишу «пуск», чтобы начать."
    trap: "Pulsar — «нажимать» на кнопки, а «давить на человека» — presionar. Не путайте с pulsera «браслет» и pulso «пульс»."

  - word: no ser fácil
    ru: быть непростым; быть маловероятным
    ipa: /no ˈseɾ ˈfaθil/
    say: но сэр фа́силь
    pron: "c перед i в Испании — [θ]."
    meaning: "Дело нелёгкое. Ещё «no es fácil que + subjuntivo» — «вряд ли»: маловероятно."
    examples:
      - "Aprender un idioma lleva tiempo. — Выучить язык требует времени."
      - "No es fácil que venga hoy, porque tiene mucho trabajo acumulado en la oficina. — Вряд ли он сегодня придёт, потому что у него накопилось много работы в офисе."
      - "No es fácil criar a tres hijos con un solo sueldo, pero lo están consiguiendo. — Нелегко растить троих детей на одну зарплату, но у них это получается."
    origin: "fácil «лёгкий» (лат. facilis, от facere «делать»: то, что легко сделать). No ser fácil — «не быть лёгким»."
    register: "Нейтральное."
    synonyms:
      - word: ser difícil
        pair: ["No es fácil convencerlo.", "Es difícil convencerlo."]
        diff:
          - "ser difícil — прямо «трудно»"
          - "no ser fácil — мягче, вежливее, как «непросто»"
    analogs:
      - "it's not easy — это непросто"
      - "it's unlikely — маловероятно"
    dialogue:
      - "Ana: ¿Crees que aceptará? | Ты думаешь, он согласится?"
      - "Pablo: No es fácil que acepte. | Вряд ли он согласится."
      - "Ana: ¿Por qué? Es una buena oferta. | Почему? Это хорошее предложение."
      - "Pablo: Porque es muy cabezota. Y no le conviene cambiar de domicilio ahora. | Потому что он очень упрямый. И ему не с руки сейчас менять место жительства."
      - "Ana: Pero dada la insistencia de la familia... | Но учитывая настойчивость семьи..."
      - "Pablo: Ya, pero no es fácil convencerlo. Habrá que abordar el tema con tacto. | Да, но убедить его непросто. Придётся подходить к теме деликатно."
      - "Ana: ¿Y si se lo propone su amigo? | А если предложит его друг?"
      - "Pablo: Quizá sí. A su amigo le hace más caso que a nadie. | Возможно. К другу он прислушивается больше, чем к кому-либо."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "no es fácil — это непросто"
      - "no es fácil que + subjuntivo — вряд ли"
      - "no ser nada fácil — быть совсем непросто"
    collocation_example: "No es nada fácil aprender un idioma. — Выучить язык совсем непросто."
    trap: "Этот оборот мягче, чем es difícil: так вежливо говорят о проблеме. После no es fácil que — subjuntivo."

  - word: puesto que
    ru: поскольку
    ipa: /ˈpwesto ke/
    say: пуэ́сто кэ
    pron: "ue — один слог «уэ»."
    meaning: "Союз причины: «так как, поскольку». Объясняет, почему что-то происходит. Часто в письменной речи."
    examples:
      - "Puesto que llueve, nos quedamos en casa. — Поскольку идёт дождь, мы остаёмся дома."
      - "Puesto que no hay más candidatos, la plaza será para la única persona presentada. — Поскольку других кандидатов нет, место достанется единственному заявителю."
      - "Se lo dije a todos, puesto que sabía que tarde o temprano iban a enterarse de todas formas. — Я сказал об этом всем, поскольку знал, что рано или поздно они всё равно узнают."
    origin: "puesto — причастие от poner «класть, ставить» + que «что»: «поставлено, что…». Дословно «установлено, что» → «раз уж»."
    register: "Формальное, книжное."
    synonyms:
      - word: ya que
        pair: ["Puesto que llueve, me quedo.", "Ya que llueve, me quedo."]
        diff:
          - "ya que — разговорный и самый частый вариант"
          - "puesto que — книжнее, как в тексте"
    analogs:
      - "since — поскольку"
      - "given that — учитывая, что"
    dialogue:
      - "Ana: ¿Por qué no vienes? | Почему ты не придёшь?"
      - "Pablo: Puesto que estoy enfermo, me quedo. | Поскольку я болен, остаюсь."
      - "Ana: ¿Tienes fiebre? | У тебя температура?"
      - "Pablo: Un poco, y me duele la cabeza. Puesto que es corriente en esta época, no me preocupo. | Небольшая, и болит голова. Поскольку это обычно в это время года, не беспокоюсь."
      - "Ana: Pero conviene que vayas al médico. | Но тебе стоит сходить к врачу."
      - "Pablo: Puesto que no reviste gravedad, prefiero descansar en casa. | Поскольку ничего серьёзного нет, предпочитаю отдохнуть дома."
      - "Ana: Vale, pero avísame si empeoras. | Хорошо, но предупреди меня, если станет хуже."
      - "Pablo: Lo haré, puesto que me lo pides con tanta ternura. | Сделаю, раз ты просишь так нежно."
    cefr: "B2."
    frequency: "Частое в письменной речи."
    collocations:
      - "puesto que + индикатив — поскольку"
      - "dado que — поскольку"
      - "ya que — раз уж"
    collocation_example: "Puesto que no hay otra opción, aceptamos. — Поскольку другого варианта нет, мы соглашаемся."
    trap: "После puesto que — indicativo: puesto que es tarde. Не путайте puesto que «поскольку» с puesto «рабочее место; прилавок»."

  - word: buena papeleta
    ru: трудная ситуация, неприятное положение
    ipa: /ˈbwena papeˈleta/
    say: буэ́на папэлэ́та
    pron: "ue — один слог «уэ»; ударение на le: papeleta."
    meaning: "Иронично: «хорошенькая задача» — когда придётся решать что-то неприятное. Обычно в «¡Menuda papeleta!»."
    examples:
      - "Menuda papeleta nos ha tocado hoy. — Какая неприятная задача нам сегодня досталась."
      - "Menuda papeleta tenemos ahora, con la fiesta mañana y sin la comida encargada. — Вот так задача: завтра праздник, а заказанной еды нет."
      - "Le tocó una buena papeleta cuando el jefe le pidió que despidiera a su mejor amigo. — Ему досталась неприятная задача, когда начальник попросил его уволить лучшего друга."
    origin: "papeleta — «бумажка, талон, бюллетень» (от papel «бумага»). Образ: вытянутый «билет» с неприятным заданием."
    register: "Разговорное, иронично."
    synonyms:
      - word: marrón
        pair: ["Menuda papeleta.", "Menudo marrón."]
        diff:
          - "marrón — разговорное, «неприятность, которая свалилась»"
          - "papeleta — «неприятное дело, которое надо решать»"
    analogs:
      - "a tough job — непростая работа"
      - "a nasty situation — неприятная ситуация"
    dialogue:
      - "Ana: ¿Y ahora qué hacemos? | И что нам теперь делать?"
      - "Pablo: Menuda papeleta nos ha tocado. | Ну и неприятность нам досталась."
      - "Ana: El cliente se ha ido y el contrato no está firmado. | Клиент ушёл, а договор не подписан."
      - "Pablo: Y encima el jefe montará en cólera cuando se entere. | А ещё начальник придёт в ярость, когда узнает."
      - "Ana: No nos precipitemos. Quizá haya algún remedio. | Не будем торопиться. Возможно, есть выход."
      - "Pablo: ¿Cuál? No tenemos ni siquiera su domicilio. | Какой? У нас даже его адреса нет."
      - "Ana: Pero tenemos su teléfono. Podemos hacerle saber lo ocurrido, cuanto antes. | Зато у нас есть его телефон. Мы можем сообщить ему о случившемся как можно скорее."
      - "Pablo: Buena idea. Pase lo que pase, hay que abordar el problema con calma. | Хорошая мысль. Что бы ни случилось, к проблеме надо подходить спокойно."
    cefr: "C1."
    frequency: "Частое в разговоре в Испании."
    collocations:
      - "menuda papeleta — ну и задача"
      - "tocar una papeleta — достаться сложное дело"
      - "papeleta de voto — избирательный бюллетень"
    collocation_example: "Explicarle esto a mi jefe es una papeleta. — Объяснить это начальнику — задача не из лёгких."
    trap: "В буквальном смысле papeleta — «бюллетень» или «квитанция». Иронично: buena/menuda papeleta — наоборот «плохая задача», а не «хорошая»."

  - word: abordar
    ru: затронуть (тему); подойти к вопросу
    ipa: /aβoɾˈðaɾ/
    say: аборда́р
    pron: "b между гласными мягкая [β]; d между гласными мягкое [ð]."
    meaning: "Начать заниматься сложной темой или проблемой: заговорить об этом. Ещё — «подойти к человеку»; «подняться на борт»."
    examples:
      - "Abordó el problema con mucha calma. — Он занялся проблемой очень спокойно."
      - "Abordó el tema con delicadeza, para que su hijo no se sintiera presionado. — Он затронул тему деликатно, чтобы сын не чувствовал давления."
      - "El periodista abordó al ministro a la salida del edificio para hacerle una última pregunta. — Журналист подошёл к министру у выхода из здания, чтобы задать последний вопрос."
    origin: "От a bordo «на борт» (borde «край, борт»): «подойти к борту корабля». Затем — «приступить к чему-то»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: tratar
        pair: ["Abordaron el tema del dinero.", "Trataron el tema del dinero."]
        diff:
          - "tratar — «обсуждать, касаться», нейтрально"
          - "abordar — «приступить, взяться за непростое», с усилием"
    analogs:
      - "to tackle — взяться за, справиться"
      - "to broach — завести разговор о"
    dialogue:
      - "Ana: ¿Hablaste con él del dinero? | Ты поговорил с ним о деньгах?"
      - "Pablo: No sé cómo abordar el tema. | Не знаю, как подступиться к теме."
      - "Ana: Con sinceridad. Sin rodeos. | Искренне. Без обиняков."
      - "Pablo: Es que es un asunto delicado. No quiero que se sienta atacado. | Дело в том, что это щекотливая тема. Не хочу, чтобы он чувствовал себя атакованным."
      - "Ana: Empieza por lo bueno. Dile que le agradeces su ayuda. | Начни с хорошего. Скажи, что благодарен за помощь."
      - "Pablo: Y luego, ¿cómo abordo lo de la deuda? | А потом как заговорить о долге?"
      - "Ana: Con calma. Algo así como: «Quedamos en pagar a plazos, ¿cómo lo vemos?». | Спокойно. Примерно так: «Мы договорились платить частями, как посмотрим?»"
      - "Pablo: Suena razonable. Voy a abordarlo así, y con mucha paciencia. | Звучит разумно. Так и подойду, и с огромным терпением."
    cefr: "C1."
    frequency: "Частое в новостях и деловой речи."
    collocations:
      - "abordar un tema — затронуть тему"
      - "abordar un problema — взяться за проблему"
      - "abordar a alguien — подойти к кому-то"
    collocation_example: "El Gobierno abordará la reforma el próximo mes. — Правительство займётся реформой в следующем месяце."
    trap: "Abordar — переходный, без предлога: abordar un problema. Не путайте с aburrir «надоедать» и abordaje «абордаж»."
