# Четвёртый список автора, часть 2 — «Desconcierto en el hospital 3» (слова 13–24).
lang: es
words:
  - word: entrañar una dificultad
    ru: заключать в себе трудность
    ipa: /entɾaˈɲaɾ ˈuna difikulˈtað/
    say: энтраньа́р у́на дификульта́д
    pron: "ñ — «нь»; d на конце слова мягкое [ð]."
    meaning: "О деле или решении: содержать в себе сложность, риск. Entrañar — «включать в себя, подразумевать»."
    examples:
      - "El plan entraña bastante riesgo. — План сопряжён со значительным риском."
      - "La operación entraña algunos riesgos que el médico debe explicar al paciente. — Операция сопряжена с некоторыми рисками, о которых врач должен рассказать пациенту."
      - "Este trabajo entraña una gran dificultad, porque hay que coordinar a mucha gente de distintos países. — Эта работа сопряжена с большой трудностью, потому что нужно координировать множество людей из разных стран."
    origin: "От entrañas «внутренности, нутро»: entrañar — «нести в нутре», «содержать внутри». Родственное: entrañable «душевный, близкий»."
    register: "Формальное, книжное."
    synonyms:
      - word: implicar
        pair: ["El plan entraña riesgos.", "El plan implica riesgos."]
        diff:
          - "implicar — нейтральное «подразумевать, повлечь»"
          - "entrañar — книжнее и образнее, «носить в себе»"
    analogs:
      - "to involve — включать, влечь за собой"
      - "to entail — влечь, повлечь"
    dialogue:
      - "Ana: ¿Es difícil? | Это сложно?"
      - "Pablo: Sí, entraña varias dificultades. | Да, это сопряжено с несколькими трудностями."
      - "Ana: ¿Cuáles? | Какими?"
      - "Pablo: Primero, hay que reunir muchos papeles. Segundo, el trámite es lento y burocrático. | Во-первых, нужно собрать много бумаг. Во-вторых, процедура медленная и бюрократичная."
      - "Ana: ¿Y tercero? | А в-третьих?"
      - "Pablo: Que cualquier error entraña el riesgo de empezar de cero. | Что любая ошибка влечёт риск начать с нуля."
      - "Ana: Entonces hay que hacerlo con ahínco y mucha prudencia. | Значит, нужно делать усердно и очень осмотрительно."
      - "Pablo: Exacto. Una vez que se entiende el proceso, ya no es tan complicado. | Именно. Когда поймёшь процесс, уже не так сложно."
    cefr: "C1."
    frequency: "Частое в газетах и официальных текстах."
    collocations:
      - "entrañar un riesgo — таить риск"
      - "entrañar peligro — быть опасным"
      - "entrañar dificultades — быть сопряжённым с трудностями"
    collocation_example: "El viaje entraña ciertos peligros. — Поездка сопряжена с некоторыми опасностями."
    trap: "Entrañar — переходный глагол без предлога: entrañar un riesgo. Не путайте с entrañable «милый, дорогой» и entrar «входить»."

  - word: constar de
    ru: состоять из
    ipa: /konsˈtaɾ de/
    say: конста́р дэ
    pron: "Ударение на последнем слоге: constar — «констáр»."
    meaning: "Иметь в своём составе определённые части: «состоять из». Ещё — «быть записанным, быть известным»: consta que… «известно, что…»."
    examples:
      - "La casa consta de tres habitaciones. — Дом состоит из трёх комнат."
      - "Consta en el expediente que llegó tarde tres veces durante el mes de marzo. — В деле записано, что в марте он трижды опоздал."
      - "El libro consta de diez capítulos, y cada uno cuenta una historia distinta del mismo pueblo. — Книга состоит из десяти глав, и каждая рассказывает отдельную историю одного и того же села."
    origin: "Из лат. constare «стоять вместе»: con- «вместе» + stare «стоять». Родственные: constante «постоянный», constar «быть записанным»."
    register: "Формальное, книжное."
    synonyms:
      - word: estar formado por
        pair: ["El equipo consta de cinco personas.", "El equipo está formado por cinco personas."]
        diff:
          - "estar formado por — разговорный и понятный вариант"
          - "constar de — короче и официальнее"
    analogs:
      - "to consist of — состоять из"
      - "to comprise — включать в себя"
    dialogue:
      - "Ana: ¿Cómo es el curso? | Какой этот курс?"
      - "Pablo: Consta de veinte clases. | Он состоит из двадцати занятий."
      - "Ana: ¿Cada una de cuánto tiempo? | Каждое по сколько?"
      - "Pablo: De una hora y media. Y consta de dos partes: teoría por la mañana y práctica por la tarde. | По полтора часа. И состоит из двух частей: теория утром и практика после обеда."
      - "Ana: ¿Hay examen? | Есть экзамен?"
      - "Pablo: Sí, al final. Consta de una prueba escrita y otra oral. | Да, в конце. Он состоит из письменной части и устной."
      - "Ana: Qué completo. ¿Y el precio? | Как всесторонне. А цена?"
      - "Pablo: Asequible. Se puede pagar en efectivo o mediante tarjeta. | Доступная. Можно платить наличными или картой."
    cefr: "B2."
    frequency: "Частое в описаниях и документах."
    collocations:
      - "constar de partes — состоять из частей"
      - "hacer constar — зафиксировать, отметить"
      - "que conste — пусть будет известно"
    collocation_example: "Que conste que yo no dije eso. — Пусть будет известно, что я этого не говорил."
    trap: "Нужен предлог de: constar de. Для «быть записанным» — constar en: consta en el acta. Не путайте с constatar «констатировать»."

  - word: relevo
    ru: смена, сменяющий персонал
    ipa: /reˈleβo/
    say: рэле́бо
    pron: "r в начале — раскатистое; v читается как b."
    meaning: "Передача дела следующему: «пришла смена». Ещё — «эстафета» и те, кто пришёл на смену: el relevo."
    examples:
      - "El relevo llega a las diez. — Смена приходит в десять."
      - "El equipo español ganó la carrera de relevos con un último tramo espectacular. — Испанская команда выиграла эстафету с впечатляющим последним этапом."
      - "Es importante preparar el relevo generacional en la empresa antes de que se jubile el fundador. — Важно подготовить смену поколений в компании до того, как основатель выйдет на пенсию."
    origin: "От relevar «сменять, освобождать от должности» (лат. relevare «облегчать»: re- + levare «поднимать»). Родственные: relevante «важный», relieve «рельеф»."
    register: "Нейтральное."
    synonyms:
      - word: sustitución
        pair: ["Esperan el relevo del turno.", "Esperan la sustitución del turno."]
        diff:
          - "sustitución — замена вообще"
          - "relevo — именно приход следующего по смене"
    analogs:
      - "relief — смена (дежурных)"
      - "relay — эстафета"
    dialogue:
      - "Ana: ¿Ya te vas? | Ты уже уходишь?"
      - "Pablo: Sí, ha llegado el relevo. | Да, пришла смена."
      - "Ana: ¿Cómo ha ido el turno? | Как прошла смена?"
      - "Pablo: Largo y tranquilo. Nadie arma follón, por suerte. | Длинной и спокойной. К счастью, никто не шумит."
      - "Ana: ¿Y quién te releva? | А кто тебя сменяет?"
      - "Pablo: Un chico nuevo. Parece concienzudo, pero todavía está algo aturdido. | Новенький парень. Кажется добросовестным, но он ещё немного растерян."
      - "Ana: Pues dale un consejo antes de irte. | Тогда дай ему совет перед уходом."
      - "Pablo: Ya lo hice: que se arme de paciencia y no restes importancia a nada. | Уже дал: пусть запасётся терпением и ничего не преуменьшает."
    cefr: "B2."
    frequency: "Частое в работе и новостях."
    collocations:
      - "tomar el relevo — принять эстафету"
      - "relevo generacional — смена поколений"
      - "carrera de relevos — эстафета"
    collocation_example: "El nuevo equipo tomó el relevo. — Новая команда приняла эстафету."
    trap: "Не путайте relevo «смена» с relevante «важный» и relieve «рельеф»: слова одного корня, значения разные."

  - word: melena
    ru: волосы средней или длинной длины, грива
    ipa: /meˈlena/
    say: мэле́на
    meaning: "Густые волосы до плеч или длиннее, часто распущенные. О льве — «грива»."
    examples:
      - "Tiene una melena larga y negra. — У неё длинные чёрные волосы."
      - "Se cortó la melena rubia que llevaba desde la adolescencia. — Она отрезала светлые волосы, которые носила с юности."
      - "El león sacudió la melena y se tumbó a la sombra de un árbol, tranquilo y satisfecho. — Лев тряхнул гривой и улёгся в тени дерева, спокойный и довольный."
    origin: "Возможно, от лат. mellinus «жёлтый, медовый» (mel «мёд») — по цвету, либо от старого слова «mellena». Родственное: melenudo «длинноволосый»."
    register: "Нейтральное; о волосах часто лестное."
    synonyms:
      - word: cabellera
        pair: ["Admiré su melena.", "Admiré su cabellera."]
        diff:
          - "cabellera — более высокий стиль: «шевелюра»"
          - "melena — разговорное, ближе к «гриве»"
    analogs:
      - "mane — грива (у льва, лошади)"
      - "long hair — длинные волосы"
    dialogue:
      - "Ana: ¿Te gusta mi pelo? | Тебе нравятся мои волосы?"
      - "Pablo: Sí, tienes una melena preciosa. | Да, у тебя прекрасная грива."
      - "Ana: Me lo dejé crecer todo el año. | Я отращивала их весь год."
      - "Pablo: Se nota. Antes llevabas un corte muy sobrio, y ahora estás irreconocible. | Заметно. Раньше у тебя была очень строгая стрижка, а теперь тебя не узнать."
      - "Ana: Mi madre dice que parezco una leona. | Мама говорит, что я похожа на львицу."
      - "Pablo: Una leona con mucha ternura. | Львица с большой нежностью."
      - "Ana: ¡Qué cursi! Pero me gusta. | Какая слащавость! Но мне нравится."
      - "Pablo: Sinceramente, es el mejor cambio que has hecho. | Честно говоря, это лучшая перемена, что ты делала."
    cefr: "B2."
    frequency: "Частое в описаниях."
    collocations:
      - "melena larga — длинные волосы"
      - "melena al viento — волосы по ветру"
      - "soltarse la melena — распустить волосы; пуститься во все тяжкие"
    collocation_example: "Se soltó la melena y salió corriendo. — Она распустила волосы и выбежала."
    trap: "Melena в единственном числе — шевелюра в целом, а не «длинный волос»: «pelo» — отдельный волос или волосы вообще. Не путайте с medalla «медаль»."

  - word: aparentar
    ru: выглядеть на какой-то возраст; делать вид
    ipa: /apaɾenˈtaɾ/
    say: апарэнта́р
    meaning: "Выглядеть так, как будто тебе столько-то лет. Ещё — «изображать, притворяться»: aparentar riqueza."
    examples:
      - "Aparenta menos edad de la que tiene. — Он выглядит моложе, чем есть."
      - "Aparenta treinta años, pero en realidad tiene cuarenta y cinco y dos hijos mayores. — Он выглядит на тридцать, но на самом деле ему сорок пять и у него двое взрослых детей."
      - "Vive muy por encima de sus posibilidades solo para aparentar una riqueza que no tiene. — Он живёт не по средствам лишь для того, чтобы изобразить богатство, которого у него нет."
    origin: "От aparente «видимый, кажущийся» (лат. apparere «являться»). Родственные: apariencia «внешность», parecer «казаться»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: parecer
        pair: ["Aparenta menos edad.", "Parece más joven."]
        diff:
          - "parecer — просто «казаться, выглядеть»"
          - "aparentar — «выглядеть на столько-то» и «притворяться»"
    analogs:
      - "to look (age) — выглядеть на возраст"
      - "to pretend — притворяться"
    dialogue:
      - "Ana: ¿Cuántos años tiene? | Сколько ему лет?"
      - "Pablo: Aparenta cincuenta, pero tiene sesenta. | Выглядит на пятьдесят, но ему шестьдесят."
      - "Ana: ¡No me lo creo! Pensaba que era más joven. | Не верю! Я думала, он моложе."
      - "Pablo: Cuida mucho su aspecto. Hace deporte y se alimenta muy bien. | Он очень следит за внешностью. Занимается спортом и хорошо питается."
      - "Ana: ¿Y tú cuántos aparentas? | А на сколько выглядишь ты?"
      - "Pablo: Unos cuarenta, aunque tengo treinta y cinco. Estoy agotado todo el día. | Лет на сорок, хотя мне тридцать пять. Я весь день измотан."
      - "Ana: Pues no aparentes tanto cansancio, o te tomarán por un viejo. | Тогда не показывай столько усталости, а то примут за старика."
      - "Pablo: Lo intentaré. Un poco de sol y un buen café ayudan. | Постараюсь. Немного солнца и хороший кофе помогают."
    cefr: "B2."
    frequency: "Частое в описаниях людей."
    collocations:
      - "aparentar la edad — выглядеть на свой возраст"
      - "aparentar tranquilidad — изображать спокойствие"
      - "sin aparentar — не показывая вида"
    collocation_example: "Intentó aparentar calma, aunque estaba nervioso. — Он пытался изобразить спокойствие, хотя нервничал."
    trap: "С возрастом: aparentar + число лет (без «a»). Не путайте с parecer: «Parece joven» — просто «выглядит молодо»."

  - word: paradero
    ru: местонахождение
    ipa: /paɾaˈðeɾo/
    say: парадэ́ро
    pron: "d между гласными мягкое [ð]."
    meaning: "Место, где находится человек или вещь. Чаще в неизвестных случаях: «paradero desconocido»."
    examples:
      - "Se desconoce el paradero del testigo. — Местонахождение свидетеля неизвестно."
      - "Nadie sabía el paradero de la carta, que había desaparecido misteriosamente de la oficina. — Никто не знал, где письмо, которое загадочным образом пропало из офиса."
      - "La policía busca su paradero y pide ayuda a cualquiera que lo haya visto en los últimos días. — Полиция ищет его местонахождение и просит помощи у каждого, кто видел его в последние дни."
    origin: "От parar «останавливаться»: paradero — «место, где остановился». Родственные: parada «остановка», parado «остановившийся»."
    register: "Формальное, из полицейских и газетных текстов."
    synonyms:
      - word: ubicación
        pair: ["Desconocen su paradero.", "Desconocen su ubicación."]
        diff:
          - "ubicación — точка на карте, и для предметов, и для людей"
          - "paradero — «где человек сейчас», обычно о ком-то, кого ищут"
    analogs:
      - "whereabouts — местонахождение"
      - "location — местоположение"
    dialogue:
      - "Ana: ¿Dónde está el testigo? | Где свидетель?"
      - "Pablo: Su paradero es desconocido. | Его местонахождение неизвестно."
      - "Ana: ¿Desde cuándo? | С каких пор?"
      - "Pablo: Desde hace tres días. Se fue sin previo aviso y dejó el móvil en casa. | Три дня. Он уехал без предупреждения и оставил телефон дома."
      - "Ana: Eso es muy raro. ¿Tiene miedo? | Это очень странно. Он боится?"
      - "Pablo: Seguro. Alguien lo amenazó, y quizá lo hizo para protegerse. | Наверняка. Ему кто-то угрожал, и, возможно, он скрылся ради защиты."
      - "Ana: ¿Y la policía? | А полиция?"
      - "Pablo: Está investigando su paradero. De momento, nadie sabe nada. | Выясняет его местонахождение. Пока никто ничего не знает."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "paradero desconocido — неизвестное местонахождение"
      - "ignorar el paradero — не знать местонахождения"
      - "conocer el paradero — знать, где находится"
    collocation_example: "Nadie conoce el paradero del testigo. — Никто не знает, где свидетель."
    trap: "Почти всегда в выражениях: paradero desconocido. В Латинской Америке paradero — ещё и «остановка автобуса»."

  - word: conveniente
    ru: подходящий, целесообразный
    ipa: /kombeˈnjente/
    say: комбэнье́нтэ
    pron: "v читается как b; ie — один слог «ье»."
    meaning: "Такой, что полезно или выгодно сделать: «стоит, желательно». Ещё — «подходящий, выгодный»."
    examples:
      - "Me parece conveniente esperar un poco. — Мне кажется, стоит немного подождать."
      - "Es conveniente llegar temprano al aeropuerto, sobre todo si viajas en verano. — Желательно приезжать в аэропорт пораньше, особенно если летишь летом."
      - "Me parece una solución muy conveniente, porque nos ahorra tiempo y dinero a los dos. — Мне кажется, это очень подходящее решение, потому что оно экономит и время, и деньги нам обоим."
    origin: "От convenir «подходить» (лат. convenire «сходиться»). Родственные: conveniencia «целесообразность», convenio «соглашение», convenir."
    register: "Нейтральное, формальное."
    synonyms:
      - word: aconsejable
        pair: ["Es conveniente esperar.", "Es aconsejable esperar."]
        diff:
          - "aconsejable — «желательно, по совету»"
          - "conveniente — «полезно, выгодно, уместно»"
    analogs:
      - "convenient — удобный; ложный друг: часто «целесообразный»"
      - "advisable — желательный"
    dialogue:
      - "Ana: ¿Debo llevar los documentos? | Мне нужно взять документы?"
      - "Pablo: Sí, es conveniente llevarlos. | Да, лучше их взять."
      - "Ana: ¿Todos? | Все?"
      - "Pablo: Al menos el carné de identidad, el volante y las facturas. | Как минимум удостоверение личности, направление и счета."
      - "Ana: ¿Y una copia? | А копию?"
      - "Pablo: Sería muy conveniente, por si hace falta presentarlos. | Было бы очень кстати, на случай если придётся подавать."
      - "Ana: Vale. Aprovecho para imprimirlos esta tarde. | Хорошо. Воспользуюсь случаем и распечатаю их сегодня днём."
      - "Pablo: Y no los dejes por ahí, que luego no aparecen. | И не оставляй где попало, а то потом не найдутся."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "es conveniente + инфинитив — желательно"
      - "conveniente para — подходящий для"
      - "considerar conveniente — счесть нужным"
    collocation_example: "No es conveniente salir con esta lluvia. — С таким дождём лучше не выходить."
    trap: "Ложный друг английского convenient: conveniente — «целесообразный, полезный», а «удобный» чаще — cómodo. После es conveniente — инфинитив или que + subjuntivo."

  - word: quitarse un peso de encima
    ru: снять груз с души
    ipa: /kiˈtaɾse un ˈpeso de enˈθima/
    say: кита́рсэ ун пэ́со дэ энси́ма
    pron: "qu перед i — [k]; c перед i в Испании — [θ]."
    meaning: "Почувствовать облегчение, когда неприятное закончилось: «как гора с плеч»."
    examples:
      - "Hablar con ella me quitó un peso. — Разговор с ней снял с меня груз."
      - "Contárselo me quitó un peso de encima, aunque sabía que se iba a enfadar. — Рассказав ему, я почувствовал облегчение, хотя знал, что он рассердится."
      - "Al vender el negocio se quitó un peso de encima y por fin pudo descansar. — Продав бизнес, он почувствовал облегчение и наконец смог отдохнуть."
    origin: "quitarse «снять с себя» + peso «тяжесть» + de encima «с плеч». Буквально «снять тяжесть с себя»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: sentirse aliviado
        pair: ["Me quité un peso de encima.", "Me sentí aliviado."]
        diff:
          - "sentirse aliviado — нейтральное «почувствовать облегчение»"
          - "quitarse un peso de encima — образно, «будто тяжесть сняли»"
    analogs:
      - "to take a weight off one's shoulders — снять груз с плеч"
      - "to get something off one's chest — облегчить душу"
    dialogue:
      - "Ana: ¿Cómo te sientes? | Как ты себя чувствуешь?"
      - "Pablo: Me quité un peso de encima. | Как будто гора с плеч."
      - "Ana: ¿Por qué? ¿Qué pasó? | Почему? Что случилось?"
      - "Pablo: Hablé con mi padre. Llevaba meses sin atreverme y por fin lo hice. | Поговорил с отцом. Месяцами не решался, а вот наконец сделал."
      - "Ana: ¿Y cómo reaccionó? | И как он отреагировал?"
      - "Pablo: Mejor de lo que pensaba. Asintió y me dio un abrazo. | Лучше, чем я думал. Кивнул и обнял меня."
      - "Ana: Qué ternura. Entonces, ¿se acabó el resentimiento? | Какая нежность. Значит, обида прошла?"
      - "Pablo: Eso espero. Pero ya me quité el peso de encima, y eso es mucho. | Надеюсь. Но тяжесть с души я уже снял, а это много."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "quitarse un peso de encima — как гора с плеч"
      - "quitar un peso a alguien — освободить от тяжести"
      - "sentir un peso — чувствовать тяжесть"
    collocation_example: "Al fin terminé el trabajo y me quité un peso de encima. — Наконец закончил работу, как гора с плеч."
    trap: "Глагол возвратный: me quito, te quitas. Не путайте quitar «убрать, снять» с quedar «оставаться» и quitarse «снять с себя (одежду)»."

  - word: era conveniente
    ru: было желательно, следовало
    ipa: /ˈeɾa kombeˈnjente/
    say: э́ра комбэнье́нтэ
    pron: "v читается как b."
    meaning: "О прошлом: что нужно или стоило сделать. Рассказывают, какое решение тогда было разумным."
    examples:
      - "Fue conveniente cambiar de plan entonces. — Тогда было разумно поменять план."
      - "Era conveniente avisar antes de venir, porque la oficina estaba cerrada por obras. — Следовало предупредить перед приходом, потому что офис был закрыт на ремонт."
      - "No era conveniente dejarlo solo en casa después de la operación, así que me quedé con él. — Не стоило оставлять его одного дома после операции, поэтому я остался с ним."
    origin: "era — прошедшее от ser («был»); conveniente — «целесообразный». Устойчивое сочетание для рассказа о прошлом."
    register: "Формальное, нейтральное."
    synonyms:
      - word: convenía
        pair: ["Era conveniente esperar.", "Convenía esperar."]
        diff:
          - "convenía — короче и безличнее: «стоило»"
          - "era conveniente — подчёркивает «было целесообразно»"
    analogs:
      - "it was advisable — было желательно"
      - "it would have been better — лучше было бы"
    dialogue:
      - "Ana: ¿Por qué no fuiste? | Почему ты не пошёл?"
      - "Pablo: No era conveniente en ese momento. | В тот момент это было нецелесообразно."
      - "Ana: ¿Qué quieres decir? | Что ты имеешь в виду?"
      - "Pablo: Estaban todos alterados, y mi presencia solo habría empeorado las cosas. | Все были взвинчены, и моё присутствие только ухудшило бы дело."
      - "Ana: Visto así, tienes razón. | С такой точки зрения ты прав."
      - "Pablo: Además, había un follón enorme y yo estaba cansado. | К тому же была ужасная суматоха, а я устал."
      - "Ana: Entonces lo prudente era esperar. | Значит, разумнее было подождать."
      - "Pablo: Sí. Ahora sí es conveniente hablar con ellos con calma. | Да. Теперь же уместно поговорить с ними спокойно."
    cefr: "B2."
    frequency: "Частое в письменной речи."
    collocations:
      - "era conveniente + инфинитив — стоило бы"
      - "no era conveniente — не следовало"
      - "resultar conveniente — оказаться полезным"
    collocation_example: "Era conveniente salir antes de que llegara la tormenta. — Стоило выйти до того, как придёт гроза."
    trap: "Прошедшее время нужно по смыслу: era conveniente (тогда), es conveniente (сейчас). После era conveniente que — subjuntivo в прошедшем: era conveniente que fueras."

  - word: chaval
    ru: парень, подросток
    ipa: /tʃaˈβal/
    say: чава́ль
    pron: "ch — «ч»; v читается как b."
    meaning: "Разговорное слово «парень, пацан» в Испании. Женский род — chavala, «девчонка»."
    examples:
      - "Es un chaval muy simpático. — Он очень симпатичный парень."
      - "El chaval que trabaja en la cafetería tiene solo dieciocho años. — Парнишке, который работает в кафе, всего восемнадцать лет."
      - "Esos chavales juegan al fútbol en la plaza todas las tardes hasta que se hace de noche. — Эти пацаны играют в футбол на площади каждый вечер, пока не стемнеет."
    origin: "Из цыганского слова chavale «сын, парень» (от chavo «ребёнок»). В Мексике похожее chavo — «парень»."
    register: "Разговорное, фамильярное; в официальной речи не годится."
    synonyms:
      - word: muchacho
        pair: ["Ese chaval es mi vecino.", "Ese muchacho es mi vecino."]
        diff:
          - "muchacho — нейтральное «парень, юноша»"
          - "chaval — разговорное, из Испании, чуть простое"
    analogs:
      - "lad — парень (британское)"
      - "kid — парень, ребёнок"
    dialogue:
      - "Ana: ¿Quién es ese? | Кто это?"
      - "Pablo: Un chaval del barrio. | Парень из нашего района."
      - "Ana: ¿Y qué hace aquí a estas horas? | И что он тут делает в такое время?"
      - "Pablo: Espera a su hermano. Vive en el rellano de enfrente. | Ждёт брата. Он живёт на площадке напротив."
      - "Ana: Parece muy joven. | Выглядит очень молодым."
      - "Pablo: Aparenta quince, pero tiene diecinueve. Es un chaval muy simpático. | Выглядит на пятнадцать, а ему девятнадцать. Очень симпатичный парень."
      - "Ana: ¿A qué se dedica? | Чем занимается?"
      - "Pablo: Trabaja de repartidor y estudia por las noches. Con mucho ahínco, por cierto. | Работает курьером и учится по вечерам. Кстати, очень усердно."
    cefr: "B1."
    frequency: "Очень частое в разговоре в Испании."
    collocations:
      - "un chaval joven — молодой парень"
      - "los chavales — ребята"
      - "ese chaval — этот парень"
    collocation_example: "Los chavales del barrio juegan en la calle. — Ребята нашего района играют на улице."
    trap: "Слово чисто испанское и разговорное: в Латинской Америке чаще chico, muchacho, chavo (Мексика). Женский род — chavala."

  - word: acertar a
    ru: суметь, удаться что-то сделать
    ipa: /aθeɾˈtaɾ a/
    say: асэрта́р а
    pron: "c перед e в Испании — [θ]. Спрягается e → ie: acierto, aciertas."
    meaning: "Случайно или с трудом суметь сделать: «ему удалось». Часто о том, что сделано не сразу."
    examples:
      - "Apenas acertó a sonreír, nervioso. — Он едва сумел улыбнуться, нервничая."
      - "No acierto a entender por qué decidió irse sin despedirse de nadie. — Я никак не могу понять, почему он решил уехать, ни с кем не простившись."
      - "No acertó a decir una palabra cuando vio a su hermano entrar por la puerta tras tantos años. — Он не смог произнести ни слова, когда увидел, как брат входит в дверь спустя столько лет."
    origin: "От acierto «меткость, попадание» (a- + cierto «верный»). «Попасть в цель»: acertar — «угадать, попасть»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: lograr
        pair: ["Acertó a abrir la puerta.", "Logró abrir la puerta."]
        diff:
          - "lograr — просто «добиться»"
          - "acertar a — «сумел, как-то получилось», часто с трудом или случайно"
    analogs:
      - "to manage to — суметь"
      - "to happen to — случайно"
    dialogue:
      - "Ana: ¿Qué dijo cuando te vio? | Что он сказал, когда тебя увидел?"
      - "Pablo: No acertó a decir nada. | Он не смог ничего вымолвить."
      - "Ana: ¿Tan sorprendido estaba? | Он был так удивлён?"
      - "Pablo: Se quedó quieto, mirándome fijamente. Apenas acertó a sonreír. | Замер, пристально глядя на меня. Едва смог улыбнуться."
      - "Ana: ¿Y tú? | А ты?"
      - "Pablo: Yo tampoco acerté a reaccionar. Llevábamos años sin vernos. | Я тоже не сообразил, как реагировать. Мы не виделись годы."
      - "Ana: Qué emoción. ¿Os abrazasteis? | Какое волнение. Вы обнялись?"
      - "Pablo: Sí, y entonces salió todo: las risas, el cotilleo y las preguntas a la vez. | Да, и тогда всё прорвалось: смех, сплетни и вопросы сразу."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "acertar a + инфинитив — суметь сделать"
      - "no acertar a decir — не найти слов"
      - "acertar con — угадать с"
    collocation_example: "No acertó a explicar lo que pasaba. — Он не смог объяснить, что происходит."
    trap: "С предлогом a и инфинитивом: acertar a hacer. Без a — acertar «угадать, попасть»: acertó la respuesta. Не путайте с acercar «приблизить»."

  - word: balbucear
    ru: лепетать, говорить запинаясь
    ipa: /balβuθeˈaɾ/
    say: балбусэа́р
    pron: "c перед e в Испании — [θ]; ea — два слога «э-а»."
    meaning: "Говорить невнятно, с запинками: от волнения, страха, или как маленький ребёнок."
    examples:
      - "El niño balbucea algunas palabras sueltas. — Малыш лепечет отдельные слова."
      - "Balbuceó una excusa y salió corriendo de la habitación sin mirar a nadie. — Он пробормотал какую-то отговорку и выбежал из комнаты, ни на кого не глядя."
      - "El bebé balbucea sus primeras palabras y sus padres lo graban cada día con el móvil. — Малыш лепечет первые слова, а родители каждый день записывают его на телефон."
    origin: "Звукоподражание: слог «bal-bu» передаёт бормотание. От лат. balbus «заикающийся». Родственное: balbuceo «лепет»."
    register: "Нейтральное, книжное."
    synonyms:
      - word: tartamudear
        pair: ["Balbuceaba de miedo.", "Tartamudeaba de miedo."]
        diff:
          - "tartamudear — «заикаться» (постоянно или от испуга)"
          - "balbucear — «лепетать, бормотать», чаще от растерянности"
    analogs:
      - "to stammer — запинаться"
      - "to babble — лепетать"
    dialogue:
      - "Ana: ¿Qué dijo el testigo? | Что сказал свидетель?"
      - "Pablo: Balbuceó algo que no entendí. | Пробормотал что-то, чего я не понял."
      - "Ana: ¿Estaba asustado? | Он был напуган?"
      - "Pablo: Muchísimo. Le temblaba la voz y balbuceaba entre sollozos. | Ужасно. У него дрожал голос, и он бормотал сквозь рыдания."
      - "Ana: Pobre hombre. ¿Había visto algo grave? | Бедняга. Он видел что-то страшное?"
      - "Pablo: Eso creo. Se quedó aturdido y ni siquiera acertó a pedir ayuda. | Думаю, да. Он остолбенел и не смог даже позвать на помощь."
      - "Ana: Habrá que tratarlo con ternura. | Придётся обращаться с ним мягко."
      - "Pablo: Sí, y con paciencia. Una vez que se calme, hablará. | Да, и с терпением. Когда успокоится, заговорит."
    cefr: "C1."
    frequency: "Нечастое: в литературе."
    collocations:
      - "balbucear una excusa — пробормотать отговорку"
      - "balbucear palabras — лепетать слова"
      - "balbucear de nervios — запинаться от волнения"
    collocation_example: "Balbuceó unas palabras de agradecimiento. — Он запинаясь произнёс слова благодарности."
    trap: "Не путайте с balbuceo (существительное, «лепет») и susurrar «шептать»: balbucear — запинаться, а не шептать."
