# Четвёртый список автора, часть 2 — «Desconcierto en el hospital 3» (слова 13–24).
lang: es
words:
  - word: entrañar una dificultad
    ru: заключать в себе трудность
    ipa: /entɾaˈɲaɾ ˈuna difikulˈtað/
    say: энтраньа́р у́на дификульта́д
    pron: "ñ — «нь»; d на конце слова мягкое [ð]."
    meaning: "О деле или решении: содержать в себе сложность, риск. Entrañar — «включать в себя, подразумевать»."
    examples:
      - "Este trabajo entraña una gran dificultad. — Эта работа таит в себе большую трудность."
      - "La operación entraña algunos riesgos. — Операция сопряжена с некоторыми рисками."
    origin: "От entrañas «внутренности, нутро»: entrañar — «нести в нутре», «содержать внутри». Родственное: entrañable «душевный, близкий»."
    register: "Формальное, книжное."
    synonyms:
      - word: implicar
        pair: ["El plan entraña riesgos.", "El plan implica riesgos."]
        diff:
          - "implicar — нейтральное «подразумевать, повлечь»"
          - "entrañar — книжнее и образнее, «носить в себе»"
    analogs:
      - "to involve — включать, влечь за собой"
      - "to entail — влечь, повлечь"
    dialogue:
      - "Ana: ¿Es difícil? | Это сложно?"
      - "Pablo: Sí, entraña varias dificultades. | Да, это сопряжено с несколькими трудностями."
    cefr: "C1."
    frequency: "Частое в газетах и официальных текстах."
    collocations:
      - "entrañar un riesgo — таить риск"
      - "entrañar peligro — быть опасным"
      - "entrañar dificultades — быть сопряжённым с трудностями"
    collocation_example: "El viaje entraña ciertos peligros. — Поездка сопряжена с некоторыми опасностями."
    trap: "Entrañar — переходный глагол без предлога: entrañar un riesgo. Не путайте с entrañable «милый, дорогой» и entrar «входить»."

  - word: constar de
    ru: состоять из
    ipa: /konsˈtaɾ de/
    say: конста́р дэ
    pron: "Ударение на последнем слоге: constar — «констáр»."
    meaning: "Иметь в своём составе определённые части: «состоять из». Ещё — «быть записанным, быть известным»: consta que… «известно, что…»."
    examples:
      - "El libro consta de diez capítulos. — Книга состоит из десяти глав."
      - "Consta en el expediente que llegó tarde. — В деле записано, что он опоздал."
    origin: "Из лат. constare «стоять вместе»: con- «вместе» + stare «стоять». Родственные: constante «постоянный», constar «быть записанным»."
    register: "Формальное, книжное."
    synonyms:
      - word: estar formado por
        pair: ["El equipo consta de cinco personas.", "El equipo está formado por cinco personas."]
        diff:
          - "estar formado por — разговорный и понятный вариант"
          - "constar de — короче и официальнее"
    analogs:
      - "to consist of — состоять из"
      - "to comprise — включать в себя"
    dialogue:
      - "Ana: ¿Cómo es el curso? | Какой курс?"
      - "Pablo: Consta de veinte clases. | Он состоит из двадцати занятий."
    cefr: "B2."
    frequency: "Частое в описаниях и документах."
    collocations:
      - "constar de partes — состоять из частей"
      - "hacer constar — зафиксировать, отметить"
      - "que conste — пусть будет известно"
    collocation_example: "Que conste que yo no dije eso. — Пусть будет известно, что я этого не говорил."
    trap: "Нужен предлог de: constar de. Для «быть записанным» — constar en: consta en el acta. Не путайте с constatar «констатировать»."

  - word: relevo
    ru: смена, сменяющий персонал
    ipa: /reˈleβo/
    say: рэле́бо
    pron: "r в начале — раскатистое; v читается как b."
    meaning: "Передача дела следующему: «пришла смена». Ещё — «эстафета» и те, кто пришёл на смену: el relevo."
    examples:
      - "El relevo llega a las diez. — Смена приходит в десять."
      - "Es importante preparar el relevo generacional. — Важно подготовить смену поколений."
    origin: "От relevar «сменять, освобождать от должности» (лат. relevare «облегчать»: re- + levare «поднимать»). Родственные: relevante «важный», relieve «рельеф»."
    register: "Нейтральное."
    synonyms:
      - word: sustitución
        pair: ["Esperan el relevo del turno.", "Esperan la sustitución del turno."]
        diff:
          - "sustitución — замена вообще"
          - "relevo — именно приход следующего по смене"
    analogs:
      - "relief — смена (дежурных)"
      - "relay — эстафета"
    dialogue:
      - "Ana: ¿Ya te vas? | Ты уже уходишь?"
      - "Pablo: Sí, ha llegado el relevo. | Да, смена пришла."
    cefr: "B2."
    frequency: "Частое в работе и новостях."
    collocations:
      - "tomar el relevo — принять эстафету"
      - "relevo generacional — смена поколений"
      - "carrera de relevos — эстафета"
    collocation_example: "El nuevo equipo tomó el relevo. — Новая команда приняла эстафету."
    trap: "Не путайте relevo «смена» с relevante «важный» и relieve «рельеф»: слова одного корня, значения разные."

  - word: melena
    ru: волосы средней или длинной длины, грива
    ipa: /meˈlena/
    say: мэле́на
    meaning: "Густые волосы до плеч или длиннее, часто распущенные. О льве — «грива»."
    examples:
      - "Tiene una melena larga y rubia. — У неё длинные светлые волосы."
      - "El león sacudió la melena. — Лев тряхнул гривой."
    origin: "Возможно, от лат. mellinus «жёлтый, медовый» (mel «мёд») — по цвету, либо от старого слова «mellena». Родственное: melenudo «длинноволосый»."
    register: "Нейтральное; о волосах часто лестное."
    synonyms:
      - word: cabellera
        pair: ["Admiré su melena.", "Admiré su cabellera."]
        diff:
          - "cabellera — более высокий стиль: «шевелюра»"
          - "melena — разговорное, ближе к «гриве»"
    analogs:
      - "mane — грива (у льва, лошади)"
      - "long hair — длинные волосы"
    dialogue:
      - "Ana: ¿Te gusta mi pelo? | Тебе нравятся мои волосы?"
      - "Pablo: Sí, tienes una melena preciosa. | Да, у тебя прекрасные волосы."
    cefr: "B2."
    frequency: "Частое в описаниях."
    collocations:
      - "melena larga — длинные волосы"
      - "melena al viento — волосы по ветру"
      - "soltarse la melena — распустить волосы; пуститься во все тяжкие"
    collocation_example: "Se soltó la melena y salió corriendo. — Она распустила волосы и выбежала."
    trap: "Melena в единственном числе — шевелюра в целом, а не «длинный волос»: «pelo» — отдельный волос или волосы вообще. Не путайте с medalla «медаль»."

  - word: aparentar
    ru: выглядеть на какой-то возраст; делать вид
    ipa: /apaɾenˈtaɾ/
    say: апарэнта́р
    meaning: "Выглядеть так, как будто тебе столько-то лет. Ещё — «изображать, притворяться»: aparentar riqueza."
    examples:
      - "Aparenta treinta años, pero tiene cuarenta. — Выглядит на тридцать, а ему сорок."
      - "No aparentes lo que no eres. — Не изображай того, кем ты не являешься."
    origin: "От aparente «видимый, кажущийся» (лат. apparere «являться»). Родственные: apariencia «внешность», parecer «казаться»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: parecer
        pair: ["Aparenta menos edad.", "Parece más joven."]
        diff:
          - "parecer — просто «казаться, выглядеть»"
          - "aparentar — «выглядеть на столько-то» и «притворяться»"
    analogs:
      - "to look (age) — выглядеть на возраст"
      - "to pretend — притворяться"
    dialogue:
      - "Ana: ¿Cuántos años tiene? | Сколько ему лет?"
      - "Pablo: Aparenta cincuenta, pero tiene sesenta. | Выглядит на пятьдесят, а ему шестьдесят."
    cefr: "B2."
    frequency: "Частое в описаниях людей."
    collocations:
      - "aparentar la edad — выглядеть на свой возраст"
      - "aparentar tranquilidad — изображать спокойствие"
      - "sin aparentar — не показывая вида"
    collocation_example: "Intentó aparentar calma, aunque estaba nervioso. — Он пытался изобразить спокойствие, хотя нервничал."
    trap: "С возрастом: aparentar + число лет (без «a»). Не путайте с parecer: «Parece joven» — просто «выглядит молодо»."

  - word: paradero
    ru: местонахождение
    ipa: /paɾaˈðeɾo/
    say: парадэ́ро
    pron: "d между гласными мягкое [ð]."
    meaning: "Место, где находится человек или вещь. Чаще в неизвестных случаях: «paradero desconocido»."
    examples:
      - "Se desconoce su paradero. — Неизвестно, где он находится."
      - "La policía busca su paradero. — Полиция ищет, где он находится."
    origin: "От parar «останавливаться»: paradero — «место, где остановился». Родственные: parada «остановка», parado «остановившийся»."
    register: "Формальное, из полицейских и газетных текстов."
    synonyms:
      - word: ubicación
        pair: ["Desconocen su paradero.", "Desconocen su ubicación."]
        diff:
          - "ubicación — точка на карте, и для предметов, и для людей"
          - "paradero — «где человек сейчас», обычно о ком-то, кого ищут"
    analogs:
      - "whereabouts — местонахождение"
      - "location — местоположение"
    dialogue:
      - "Ana: ¿Dónde está el testigo? | Где свидетель?"
      - "Pablo: Su paradero es desconocido. | Его местонахождение неизвестно."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "paradero desconocido — неизвестное местонахождение"
      - "ignorar el paradero — не знать местонахождения"
      - "conocer el paradero — знать, где находится"
    collocation_example: "Nadie conoce el paradero del testigo. — Никто не знает, где свидетель."
    trap: "Почти всегда в выражениях: paradero desconocido. В Латинской Америке paradero — ещё и «остановка автобуса»."

  - word: conveniente
    ru: подходящий, целесообразный
    ipa: /kombeˈnjente/
    say: комбэнье́нтэ
    pron: "v читается как b; ie — один слог «ье»."
    meaning: "Такой, что полезно или выгодно сделать: «стоит, желательно». Ещё — «подходящий, выгодный»."
    examples:
      - "Es conveniente llegar temprano. — Желательно прийти рано."
      - "Me parece una solución muy conveniente. — Мне кажется, это очень выгодное решение."
    origin: "От convenir «подходить» (лат. convenire «сходиться»). Родственные: conveniencia «целесообразность», convenio «соглашение», convenir."
    register: "Нейтральное, формальное."
    synonyms:
      - word: aconsejable
        pair: ["Es conveniente esperar.", "Es aconsejable esperar."]
        diff:
          - "aconsejable — «желательно, по совету»"
          - "conveniente — «полезно, выгодно, уместно»"
    analogs:
      - "convenient — удобный; ложный друг: часто «целесообразный»"
      - "advisable — желательный"
    dialogue:
      - "Ana: ¿Debo llevar los documentos? | Мне нужно взять документы?"
      - "Pablo: Sí, es conveniente llevarlos. | Да, лучше взять."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "es conveniente + инфинитив — желательно"
      - "conveniente para — подходящий для"
      - "considerar conveniente — счесть нужным"
    collocation_example: "No es conveniente salir con esta lluvia. — С таким дождём лучше не выходить."
    trap: "Ложный друг английского convenient: conveniente — «целесообразный, полезный», а «удобный» чаще — cómodo. После es conveniente — инфинитив или que + subjuntivo."

  - word: quitarse un peso de encima
    ru: снять груз с души
    ipa: /kiˈtaɾse un ˈpeso de enˈθima/
    say: кита́рсэ ун пэ́со дэ энси́ма
    pron: "qu перед i — [k]; c перед i в Испании — [θ]."
    meaning: "Почувствовать облегчение, когда неприятное закончилось: «как гора с плеч»."
    examples:
      - "Me quité un peso de encima al terminar el examen. — Когда закончил экзамен, как гора с плеч свалилась."
      - "Contárselo me quitó un peso de encima. — Рассказав ему, я почувствовал облегчение."
    origin: "quitarse «снять с себя» + peso «тяжесть» + de encima «с плеч». Буквально «снять тяжесть с себя»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: sentirse aliviado
        pair: ["Me quité un peso de encima.", "Me sentí aliviado."]
        diff:
          - "sentirse aliviado — нейтральное «почувствовать облегчение»"
          - "quitarse un peso de encima — образно, «будто тяжесть сняли»"
    analogs:
      - "to take a weight off one's shoulders — снять груз с плеч"
      - "to get something off one's chest — облегчить душу"
    dialogue:
      - "Ana: ¿Cómo te sientes? | Как ты себя чувствуешь?"
      - "Pablo: Me quité un peso de encima. | Как гора с плеч."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "quitarse un peso de encima — как гора с плеч"
      - "quitar un peso a alguien — освободить от тяжести"
      - "sentir un peso — чувствовать тяжесть"
    collocation_example: "Al fin terminé el trabajo y me quité un peso de encima. — Наконец закончил работу, как гора с плеч."
    trap: "Глагол возвратный: me quito, te quitas. Не путайте quitar «убрать, снять» с quedar «оставаться» и quitarse «снять с себя (одежду)»."

  - word: era conveniente
    ru: было желательно, следовало
    ipa: /ˈeɾa kombeˈnjente/
    say: э́ра комбэнье́нтэ
    pron: "v читается как b."
    meaning: "О прошлом: что нужно или стоило сделать. Рассказывают, какое решение тогда было разумным."
    examples:
      - "Era conveniente avisar antes. — Следовало предупредить заранее."
      - "No era conveniente dejarlo solo. — Не следовало оставлять его одного."
    origin: "era — прошедшее от ser («был»); conveniente — «целесообразный». Устойчивое сочетание для рассказа о прошлом."
    register: "Формальное, нейтральное."
    synonyms:
      - word: convenía
        pair: ["Era conveniente esperar.", "Convenía esperar."]
        diff:
          - "convenía — короче и безличнее: «стоило»"
          - "era conveniente — подчёркивает «было целесообразно»"
    analogs:
      - "it was advisable — было желательно"
      - "it would have been better — лучше было бы"
    dialogue:
      - "Ana: ¿Por qué no fuiste? | Почему ты не пошёл?"
      - "Pablo: No era conveniente en ese momento. | В тот момент это было нежелательно."
    cefr: "B2."
    frequency: "Частое в письменной речи."
    collocations:
      - "era conveniente + инфинитив — стоило бы"
      - "no era conveniente — не следовало"
      - "resultar conveniente — оказаться полезным"
    collocation_example: "Era conveniente salir antes de que llegara la tormenta. — Стоило выйти до того, как придёт гроза."
    trap: "Прошедшее время нужно по смыслу: era conveniente (тогда), es conveniente (сейчас). После era conveniente que — subjuntivo в прошедшем: era conveniente que fueras."

  - word: chaval
    ru: парень, подросток
    ipa: /tʃaˈβal/
    say: чава́ль
    pron: "ch — «ч»; v читается как b."
    meaning: "Разговорное слово «парень, пацан» в Испании. Женский род — chavala, «девчонка»."
    examples:
      - "Es un chaval muy simpático. — Он очень симпатичный парень."
      - "Esos chavales juegan al fútbol. — Те ребята играют в футбол."
    origin: "Из цыганского слова chavale «сын, парень» (от chavo «ребёнок»). В Мексике похожее chavo — «парень»."
    register: "Разговорное, фамильярное; в официальной речи не годится."
    synonyms:
      - word: muchacho
        pair: ["Ese chaval es mi vecino.", "Ese muchacho es mi vecino."]
        diff:
          - "muchacho — нейтральное «парень, юноша»"
          - "chaval — разговорное, из Испании, чуть простое"
    analogs:
      - "lad — парень (британское)"
      - "kid — парень, ребёнок"
    dialogue:
      - "Ana: ¿Quién es ese? | Кто это?"
      - "Pablo: Un chaval del barrio. | Парень из нашего района."
    cefr: "B1."
    frequency: "Очень частое в разговоре в Испании."
    collocations:
      - "un chaval joven — молодой парень"
      - "los chavales — ребята"
      - "ese chaval — этот парень"
    collocation_example: "Los chavales del barrio juegan en la calle. — Ребята нашего района играют на улице."
    trap: "Слово чисто испанское и разговорное: в Латинской Америке чаще chico, muchacho, chavo (Мексика). Женский род — chavala."

  - word: acertar a
    ru: суметь, удаться что-то сделать
    ipa: /aθeɾˈtaɾ a/
    say: асэрта́р а
    pron: "c перед e в Испании — [θ]. Спрягается e → ie: acierto, aciertas."
    meaning: "Случайно или с трудом суметь сделать: «ему удалось». Часто о том, что сделано не сразу."
    examples:
      - "No acertó a decir una palabra. — Он не смог вымолвить ни слова."
      - "Acertó a llegar justo a tiempo. — Ему удалось прийти как раз вовремя."
    origin: "От acierto «меткость, попадание» (a- + cierto «верный»). «Попасть в цель»: acertar — «угадать, попасть»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: lograr
        pair: ["Acertó a abrir la puerta.", "Logró abrir la puerta."]
        diff:
          - "lograr — просто «добиться»"
          - "acertar a — «сумел, как-то получилось», часто с трудом или случайно"
    analogs:
      - "to manage to — суметь"
      - "to happen to — случайно"
    dialogue:
      - "Ana: ¿Qué dijo cuando lo viste? | Что он сказал, когда увидел тебя?"
      - "Pablo: No acertó a decir nada. | Он не нашёл, что сказать."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "acertar a + инфинитив — суметь сделать"
      - "no acertar a decir — не найти слов"
      - "acertar con — угадать с"
    collocation_example: "No acertó a explicar lo que pasaba. — Он не смог объяснить, что происходит."
    trap: "С предлогом a и инфинитивом: acertar a hacer. Без a — acertar «угадать, попасть»: acertó la respuesta. Не путайте с acercar «приблизить»."

  - word: balbucear
    ru: лепетать, говорить запинаясь
    ipa: /balβuθeˈaɾ/
    say: балбусэа́р
    pron: "c перед e в Испании — [θ]; ea — два слога «э-а»."
    meaning: "Говорить невнятно, с запинками: от волнения, страха, или как маленький ребёнок."
    examples:
      - "Balbuceó una excusa y salió. — Он пробормотал отговорку и вышел."
      - "El bebé balbucea sus primeras palabras. — Малыш лепечет первые слова."
    origin: "Звукоподражание: слог «bal-bu» передаёт бормотание. От лат. balbus «заикающийся». Родственное: balbuceo «лепет»."
    register: "Нейтральное, книжное."
    synonyms:
      - word: tartamudear
        pair: ["Balbuceaba de miedo.", "Tartamudeaba de miedo."]
        diff:
          - "tartamudear — «заикаться» (постоянно или от испуга)"
          - "balbucear — «лепетать, бормотать», чаще от растерянности"
    analogs:
      - "to stammer — запинаться"
      - "to babble — лепетать"
    dialogue:
      - "Ana: ¿Qué dijo el testigo? | Что сказал свидетель?"
      - "Pablo: Balbuceó algo que no entendí. | Пробормотал что-то непонятное."
    cefr: "C1."
    frequency: "Нечастое: в литературе."
    collocations:
      - "balbucear una excusa — пробормотать отговорку"
      - "balbucear palabras — лепетать слова"
      - "balbucear de nervios — запинаться от волнения"
    collocation_example: "Balbuceó unas palabras de agradecimiento. — Он запинаясь произнёс слова благодарности."
    trap: "Не путайте с balbuceo (существительное, «лепет») и susurrar «шептать»: balbucear — запинаться, а не шептать."
