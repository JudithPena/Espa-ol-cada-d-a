# Четвёртый список папы (10 слов, уровень A0–A1): «отлично», «слишком», потерять, потерянный, багаж, похожий, невозможно, «кажется», зонт, ходить пешком. Примеры A0 / A1 / A1–A2, диалог 4 реплики (по 2 у Ana и Pablo).
lang: es
words:
  - word: estupenda
    image: art/papa/estupenda.png
    ru: чудесная, замечательная
    ipa: /esˈtupenda/
    say: эступéнда
    meaning: "Очень хорошая, прекрасная. Так говорят о женщине, о вещи женского рода или о идее. Для мужского рода — estupendo."
    examples:
      - "Es una idea estupenda. — Это замечательная идея."
      - "Mi mujer cocina una paella estupenda los domingos. — Моя жена по воскресеньям готовит замечательную паэлью."
      - "La casa de mis amigos es estupenda y tiene un jardín muy grande. — Дом моих друзей чудесный, и у него очень большой сад."
    origin: ""
    forms:
      - "estupendo — замечательный (м. р.)"
      - "estupenda — замечательная (ж. р.)"
      - "estupendos / estupendas — замечательные (мн. ч.)"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Cómo es tu casa nueva? | Какой твой новый дом?"
      - "Pablo: Es estupenda. | Он замечательный."
      - "Ana: ¿Tiene jardín? | Там есть сад?"
      - "Pablo: Sí, y también una terraza. | Да, и ещё терраса."
    cefr: "A1 — оценка."
    frequency: "Частое."
    collocations:
      - "una idea estupenda — замечательная идея"
      - "un día estupendo — чудесный день"
      - "¡Estupendo! — Отлично!"
    collocation_example: "Hoy hace un día estupendo. — Сегодня чудесный день."
    trap: ""

  - word: demasiado
    image: art/papa/demasiado.png
    ru: слишком, слишком много
    ipa: /demaˈsjaðo/
    say: демасьядо
    meaning: "Больше, чем нужно. Перед прилагательным не меняется: demasiado caro — слишком дорого. Перед существительным согласуется: demasiada agua — слишком много воды. Не то же, что muy: muy caro — очень дорого, demasiado caro — слишком дорого."
    examples:
      - "Es demasiado caro. — Это слишком дорого."
      - "Hay demasiada gente en la calle hoy. — Сегодня на улице слишком много людей."
      - "No compro el abrigo porque es demasiado grande para mí. — Я не покупаю пальто, потому что оно слишком большое для меня."
    origin: ""
    forms:
      - "demasiado + прилагательное — слишком (demasiado frío)"
      - "demasiado / demasiada + существительное — слишком много"
      - "demasiados / demasiadas — слишком много (мн. ч.)"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Te gusta la sopa? | Тебе нравится суп?"
      - "Pablo: Está demasiado caliente. | Он слишком горячий."
      - "Ana: Espera un poco. | Подожди немного."
      - "Pablo: Vale, gracias. | Хорошо, спасибо."
    cefr: "A2 — количество."
    frequency: "Очень частое."
    collocations:
      - "demasiado tarde — слишком поздно"
      - "demasiado caro — слишком дорого"
      - "demasiada gente — слишком много людей"
    collocation_example: "Es demasiado tarde para llamar. — Слишком поздно звонить."
    trap: ""

  - word: perder
    image: art/papa/perder.png
    ru: терять, проигрывать
    ipa: /peɾˈðeɾ/
    say: пердéр
    meaning: "Остаться без вещи, потому что не знаешь, где она. Или проиграть в игре. Ещё: perder el tren — опоздать на поезд. Меняется e на ie: pierdo, а не «perdo»."
    examples:
      - "Pierdo las llaves. — Я теряю ключи."
      - "En casa mi padre siempre pierde las gafas. — Дома мой отец всегда теряет очки."
      - "Si salimos tarde, vamos a perder el autobús de las ocho. — Если мы выйдем поздно, мы опоздаем на автобус в восемь."
    origin: ""
    forms:
      - "yo pierdo — я теряю"
      - "tú pierdes — ты теряешь"
      - "él / ella pierde — он / она теряет"
      - "nosotros perdemos — мы теряем"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Dónde está mi bolso? | Где моя сумка?"
      - "Pablo: ¿Lo has perdido? | Ты её потеряла?"
      - "Ana: No lo sé. | Не знаю."
      - "Pablo: Busca en el coche. | Посмотри в машине."
    cefr: "A1 — действие."
    frequency: "Частое."
    collocations:
      - "perder las llaves — потерять ключи"
      - "perder el tren — опоздать на поезд"
      - "perder tiempo — терять время"
    collocation_example: "No quiero perder tiempo. — Я не хочу терять время."
    trap: ""

  - word: perdido
    image: art/papa/perdido.png
    ru: потерянный, потерявшийся
    ipa: /peɾˈðiðo/
    say: пердидо
    meaning: "Тот, кого или что потеряли. Человек говорит «estoy perdido», когда не знает, где он находится."
    examples:
      - "Estoy perdido. — Я заблудился."
      - "El niño está perdido y llora en la plaza. — Ребёнок потерялся и плачет на площади."
      - "No encuentro el mapa y estamos perdidos en una ciudad que no conocemos. — Я не нахожу карту, и мы заблудились в городе, который не знаем."
    origin: ""
    forms:
      - "perdido — потерянный (м. р.)"
      - "perdida — потерянная (ж. р.)"
      - "perdidos / perdidas — потерянные (мн. ч.)"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Dónde estamos? | Где мы?"
      - "Pablo: No lo sé. Estoy perdido. | Не знаю. Я заблудился."
      - "Ana: Pregunta a ese señor. | Спроси у того мужчины."
      - "Pablo: Buena idea. | Хорошая мысль."
    cefr: "A1 — состояние."
    frequency: "Частое."
    collocations:
      - "estar perdido — заблудиться, не знать, где ты"
      - "objetos perdidos — бюро находок"
      - "un perro perdido — потерявшаяся собака"
    collocation_example: "Busco mi perro perdido. — Я ищу свою потерявшуюся собаку."
    trap: ""

  - word: equipaje
    image: art/papa/equipaje.png
    ru: багаж
    ipa: /ekiˈpaxe/
    say: экипáхе
    meaning: "Чемоданы и сумки, которые человек берёт в поездку. Слово мужского рода, без множественного числа в быту: el equipaje."
    examples:
      - "Mi equipaje es pequeño. — Мой багаж маленький."
      - "Dejamos el equipaje en el hotel antes de comer. — Мы оставляем багаж в отеле перед обедом."
      - "En el aeropuerto esperamos mucho rato para recoger el equipaje. — В аэропорту мы долго ждём, чтобы забрать багаж."
    origin: ""
    forms:
      - "el equipaje — багаж"
      - "el equipaje de mano — ручная кладь"
      - "facturar el equipaje — сдать багаж"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Dónde está tu equipaje? | Где твой багаж?"
      - "Pablo: Está en el coche. | В машине."
      - "Ana: ¿Es muy pesado? | Он очень тяжёлый?"
      - "Pablo: Un poco. | Немного."
    cefr: "A2 — путешествие."
    frequency: "Частое."
    collocations:
      - "perder el equipaje — потерять багаж"
      - "recoger el equipaje — забрать багаж"
      - "equipaje de mano — ручная кладь"
    collocation_example: "No encuentro mi equipaje de mano. — Я не нахожу свою ручную кладь."
    trap: ""

  - word: parecido
    image: art/papa/parecido.png
    ru: похожий
    ipa: /paɾeˈθiðo/
    say: паресидо
    meaning: "Такой же или почти такой же, как другой человек или предмет. Говорят: ser parecido a alguien — быть похожим на кого-то (после parecido стоит предлог a)."
    examples:
      - "Eres parecido a tu padre. — Ты похож на своего отца."
      - "Mi hija es muy parecida a su abuela. — Моя дочь очень похожа на свою бабушку."
      - "Estos dos coches son parecidos, pero el azul es más barato. — Эти две машины похожи, но синяя дешевле."
    origin: ""
    forms:
      - "parecido — похожий (м. р.)"
      - "parecida — похожая (ж. р.)"
      - "parecidos / parecidas — похожие (мн. ч.)"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: Tu hermano es muy parecido a ti. | Твой брат очень похож на тебя."
      - "Pablo: Sí, todos lo dicen. | Да, все так говорят."
      - "Ana: ¿Y tu hermana? | А твоя сестра?"
      - "Pablo: Ella es parecida a mi madre. | Она похожа на мою маму."
    cefr: "A2 — сравнение."
    frequency: "Частое."
    collocations:
      - "parecido a — похожий на"
      - "muy parecido — очень похожий"
      - "algo parecido — что-то похожее"
    collocation_example: "Quiero algo parecido, pero más barato. — Я хочу что-то похожее, но подешевле."
    trap: ""

  - word: imposible
    image: art/papa/imposible.png
    ru: невозможный, невозможно
    ipa: /impoˈsiβle/
    say: импосибле
    meaning: "То, что сделать нельзя. Слово одинаково для мужского и женского рода: un trabajo imposible, una tarea imposible."
    examples:
      - "Es imposible. — Это невозможно."
      - "Es imposible llegar a las ocho con tanto tráfico. — Невозможно приехать к восьми при такой пробке."
      - "Para mí es imposible vivir sin café por la mañana, ¡no puedo! — Для меня невозможно жить без кофе по утрам, я не могу!"
    origin: ""
    forms:
      - "imposible — невозможный (м. и ж. р.)"
      - "imposibles — невозможные (мн. ч.)"
      - "es imposible + глагол — невозможно сделать"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Puedes venir hoy? | Ты можешь прийти сегодня?"
      - "Pablo: Hoy es imposible. | Сегодня невозможно."
      - "Ana: ¿Y mañana? | А завтра?"
      - "Pablo: Mañana sí. | Завтра да."
    cefr: "A2 — оценка."
    frequency: "Частое."
    collocations:
      - "es imposible — это невозможно"
      - "una misión imposible — невыполнимая миссия"
      - "imposible de hacer — невозможно сделать"
    collocation_example: "Es imposible abrir esta puerta. — Невозможно открыть эту дверь."
    trap: ""

  - word: parece
    image: art/papa/parece.png
    ru: кажется, похоже
    ipa: /paˈɾeθe/
    say: парéсе
    meaning: "Форма глагола parecer — «казаться, быть похожим». Parece que… — «кажется, что…»; me parece… — «мне кажется…». Не путайте с parecerse a — «быть похожим на»."
    examples:
      - "Parece fácil. — Кажется, это легко."
      - "Esta tarde va a llover, me parece. — Мне кажется, сегодня днём пойдёт дождь."
      - "Me parece que tu hermano está cansado, porque no habla mucho. — Мне кажется, твой брат устал, потому что мало говорит."
    origin: ""
    forms:
      - "me parece — мне кажется"
      - "te parece — тебе кажется"
      - "parece que — похоже, что"
      - "parecen — кажутся (они)"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: Parece que hace frío. | Похоже, на улице холодно."
      - "Pablo: Sí, hay mucho viento. | Да, сильный ветер."
      - "Ana: Me parece que necesito un abrigo. | Мне кажется, мне нужно пальто."
      - "Pablo: Toma el mío. | Возьми моё."
    cefr: "A2 — мнение."
    frequency: "Очень частое."
    collocations:
      - "parece que… — похоже, что…"
      - "me parece bien — по-моему, хорошо"
      - "¿Qué te parece? — Что ты об этом думаешь?"
    collocation_example: "¿Qué te parece mi idea? — Что ты думаешь о моей идее?"
    trap: ""

  - word: paraguas
    image: art/papa/paraguas.png
    ru: зонт
    ipa: /paˈɾaɣwas/
    say: парáгуас
    meaning: "Предмет, который защищает от дождя. Слово мужского рода: el paraguas. В единственном и во множественном числе пишется одинаково."
    examples:
      - "Tengo un paraguas. — У меня есть зонт."
      - "Hoy llueve mucho, coge el paraguas. — Сегодня сильный дождь, возьми зонт."
      - "Siempre pierdo los paraguas en el metro, así que ahora compro los más baratos. — Я всегда теряю зонты в метро, поэтому теперь покупаю самые дешёвые."
    origin: ""
    forms:
      - "el paraguas — зонт"
      - "los paraguas — зонты"
      - "abrir el paraguas — открыть зонт"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Llueve? | Идёт дождь?"
      - "Pablo: Sí, mucho. | Да, сильный."
      - "Ana: ¿Dónde está el paraguas? | Где зонт?"
      - "Pablo: Está en la entrada. | Он в прихожей."
    cefr: "A1 — вещь."
    frequency: "Частое."
    collocations:
      - "abrir el paraguas — открыть зонт"
      - "llevar paraguas — взять с собой зонт"
      - "un paraguas grande — большой зонт"
    collocation_example: "Llevo paraguas porque va a llover. — Я беру зонт, потому что пойдёт дождь."
    trap: ""

  - word: andar
    image: art/papa/andar.png
    ru: ходить, идти пешком
    ipa: /anˈdaɾ/
    say: андáр
    meaning: "Идти пешком, двигаться шагом. Часто говорят: andar por la calle — гулять по улице. Неправильный глагол: в прошедшем anduve."
    examples:
      - "Ando al trabajo. — Я иду на работу пешком."
      - "Mi padre es mayor, pero todavía anda mucho. — Мой отец уже немолод, но всё ещё много ходит."
      - "Cuando hace buen tiempo, nos gusta andar por la playa después de comer. — Когда хорошая погода, нам нравится ходить по пляжу после обеда."
    origin: ""
    forms:
      - "yo ando — я иду"
      - "tú andas — ты идёшь"
      - "él / ella anda — он / она идёт"
      - "nosotros andamos — мы идём"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Vas en coche? | Ты едешь на машине?"
      - "Pablo: No, ando. | Нет, я иду пешком."
      - "Ana: ¿Está lejos? | Это далеко?"
      - "Pablo: No, diez minutos. | Нет, десять минут."
    cefr: "A1 — движение."
    frequency: "Частое."
    collocations:
      - "andar por la calle — ходить по улице"
      - "andar despacio — идти медленно"
      - "andar a pie — идти пешком"
    collocation_example: "Me gusta andar despacio por el parque. — Мне нравится медленно ходить по парку."
    trap: ""
