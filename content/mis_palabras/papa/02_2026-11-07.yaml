# Второй список папы (18 слов, уровень A0–A1): долг и дела, здоровье, гости и выставка, дни, прогулка. Примеры A0 / A1 / A1–A2, диалог 4 реплики (по 2 у Ana и Pablo).
lang: es
words:
  - word: tener que + infinitivo
    ru: нужно, должен (что-то делать)
    ipa: /teˈneɾ ke/
    say: тэне́р ке
    meaning: "Говорим, что нужно или надо что-то сделать. После tener que всегда стоит глагол в начальной форме: tengo que trabajar — мне нужно работать."
    examples:
      - "Tengo que trabajar. — Мне нужно работать."
      - "Mi hijo tiene que estudiar por la tarde. — Моему сыну нужно учиться днём."
      - "Mañana tenemos que levantarnos temprano porque salimos de viaje. — Завтра нам нужно рано встать, потому что мы уезжаем в поездку."
    origin: ""
    forms:
      - "yo tengo que — мне нужно"
      - "tú tienes que — тебе нужно"
      - "él, ella tiene que — ему, ей нужно"
      - "nosotros tenemos que — нам нужно"
      - "vosotros tenéis que — вам нужно"
      - "ellos tienen que — им нужно"
    register: ""
    synonyms: []
    analogs: []
    dialogue:
      - "Ana: ¿Vienes al cine hoy? | Ты придёшь сегодня в кино?"
      - "Pablo: No puedo. Tengo que trabajar. | Не могу. Мне нужно работать."
      - "Ana: ¿Y mañana? | А завтра?"
      - "Pablo: Mañana tengo que levantarme temprano. | Завтра мне надо рано вставать."
    cefr: "A1 — слово из первых уроков."
    frequency: "Очень частое."
    collocations:
      - "tengo que ir — мне нужно идти"
      - "tienes que descansar — тебе нужно отдохнуть"
      - "tenemos que salir — нам нужно выходить"
    collocation_example: "Tengo que irme ya. — Мне уже нужно уходить."
    trap: ""

