  - word: la misma
    ru: та же самая, такая же
    ipa: /la ˈmisma/
    say: ла ми́сма
    meaning: "Когда речь об одном и том же, говорим mismo. Перед женским словом — la misma: la misma casa — тот же дом, la misma hora — то же время. Перед мужским — el mismo."
    examples:
      - "Es la misma casa. — Это тот же дом."
