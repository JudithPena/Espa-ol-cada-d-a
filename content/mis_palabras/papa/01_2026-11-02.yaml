# Первый список папы (уровень A0–A1): распорядок дня, дом и еда, «когда и как часто», прилагательные для сравнения.
lang: es
words:
  - word: despertarse
    ru: просыпаться
    ipa: /desperˈtarse/
    say: десперта́рсэ
    meaning: "Проснуться, открыть глаза утром. Я просыпаюсь — me despierto, ты просыпаешься — te despiertas. Буква e в середине слова меняется на ie."
    examples:
      - "Me despierto a las siete. — Я просыпаюсь в семь."
      - "Mi hijo se despierta muy temprano. — Мой сын просыпается очень рано."
      - "Los domingos me despierto tarde y desayuno con calma. — По воскресеньям я просыпаюсь поздно и спокойно завтракаю."
    origin: "От despierto «бодрствующий» (lat. expergere «будить»): «стать бодрым»."
    register: "Обычное, нейтральное слово."
    synonyms: []
    analogs:
      - "to wake up — просыпаться"
    dialogue:
      - "Ana: ¿A qué hora te despiertas? | Во сколько ты просыпаешься?"
      - "Pablo: Me despierto a las siete. | Я просыпаюсь в семь."
    cefr: "A1 — слово из первых уроков про день."
    frequency: "Очень частое."
    collocations:
      - "despertarse temprano — просыпаться рано"
      - "despertarse tarde — просыпаться поздно"
      - "despertarse a las siete — просыпаться в семь"
    collocation_example: "Siempre me despierto temprano. — Я всегда просыпаюсь рано."
    trap: "Это возвратный глагол: se нужно: me despierto. Без se (despertar) — «будить кого-то»."

  - word: desayunar
    ru: завтракать
    ipa: /desaʝuˈnar/
    say: десайуна́р
    meaning: "Есть утром первую еду. Я завтракаю — desayuno, ты завтракаешь — desayunas."
    examples:
      - "Desayuno café con leche. — Я завтракаю кофе с молоком."
      - "Mi madre desayuna a las ocho. — Моя мама завтракает в восемь."
      - "Los sábados desayunamos todos juntos en la cocina. — По субботам мы завтракаем все вместе на кухне."
    origin: "От des- «не» и ayuno «голодание»: «перестать быть голодным». Родственное слово — el desayuno «завтрак»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to have breakfast — завтракать"
    dialogue:
      - "Ana: ¿Qué desayunas? | Что ты ешь на завтрак?"
      - "Pablo: Desayuno pan y café. | Я ем хлеб и пью кофе."
    cefr: "A1 — базовое слово про еду."
    frequency: "Очень частое."
    collocations:
      - "desayunar pan — завтракать хлебом"
      - "desayunar en casa — завтракать дома"
      - "desayunar con la familia — завтракать с семьёй"
    collocation_example: "Desayuno en casa con mi familia. — Я завтракаю дома с семьёй."
    trap: "Это не возвратный глагол: без se. Не говорите «me desayuno»."

  - word: levantarse
    ru: вставать (с постели)
    ipa: /leβanˈtarse/
    say: левантарсэ́
    pron: "Буква v в испанском звучит как «б»: лебантáрсэ."
    meaning: "Встать с кровати. Я встаю — me levanto, ты встаёшь — te levantas."
    examples:
      - "Me levanto a las siete. — Я встаю в семь."
      - "Mi padre se levanta muy temprano. — Мой папа встаёт очень рано."
      - "Primero me levanto, después me ducho y desayuno. — Сначала я встаю, потом принимаю душ и завтракаю."
    origin: "От levantar «поднимать» (lat. levare) и se «себя»: «поднять себя»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to get up — вставать"
    dialogue:
      - "Ana: ¿A qué hora te levantas? | Во сколько ты встаёшь?"
      - "Pablo: Me levanto a las siete y media. | Я встаю в половине восьмого."
    cefr: "A1 — слово про распорядок дня."
    frequency: "Очень частое."
    collocations:
      - "levantarse temprano — вставать рано"
      - "levantarse tarde — вставать поздно"
      - "levantarse de la cama — вставать с кровати"
    collocation_example: "Me levanto de la cama y voy al baño. — Я встаю с кровати и иду в ванную."
    trap: "Возвратный глагол: me levanto. Без se (levantar) — «поднять что-то», например levantar la mano «поднять руку»."

  - word: cenar
    ru: ужинать
    ipa: /θeˈnar/
    say: сена́р
    pron: "Буква c перед e в Испании читается как английское th в слове think. В Латинской Америке это просто «с»."
    meaning: "Есть вечером последнюю еду за день. Я ужинаю — ceno, ты ужинаешь — cenas."
    examples:
      - "Ceno a las nueve. — Я ужинаю в девять."
      - "Mi familia cena en casa. — Моя семья ужинает дома."
      - "Los viernes cenamos fuera con unos amigos. — По пятницам мы ужинаем не дома, с друзьями."
    origin: "От lat. cena «обед, ужин». Родственное слово — la cena «ужин»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to have dinner — ужинать"
    dialogue:
      - "Ana: ¿A qué hora cenas? | Во сколько ты ужинаешь?"
      - "Pablo: Ceno a las nueve. | Я ужинаю в девять."
    cefr: "A1 — слово про еду и день."
    frequency: "Очень частое."
    collocations:
      - "cenar en casa — ужинать дома"
      - "cenar tarde — ужинать поздно"
      - "cenar con amigos — ужинать с друзьями"
    collocation_example: "Normalmente ceno en casa. — Обычно я ужинаю дома."
    trap: "В Испании ужинают поздно, часто в девять или десять вечера. Не путайте с comer «обедать»: это еда в середине дня."

  - word: ducharse
    ru: принимать душ
    ipa: /duˈtʃarse/
    say: дуча́рсэ
    pron: "ch читается как русское «ч»: дучáрсэ."
    meaning: "Мыться под душем. Я принимаю душ — me ducho, ты принимаешь — te duchas."
    examples:
      - "Me ducho por la mañana. — Я принимаю душ утром."
      - "Mi hijo se ducha después del deporte. — Мой сын принимает душ после спорта."
      - "Primero me ducho y después me afeito en el baño. — Сначала я принимаю душ, а потом бреюсь в ванной."
    origin: "От la ducha «душ» (фр. douche) и se «себя»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to take a shower — принимать душ"
    dialogue:
      - "Ana: ¿Te duchas por la mañana? | Ты принимаешь душ утром?"
      - "Pablo: Sí, me ducho a las siete. | Да, я принимаю душ в семь."
    cefr: "A1 — слово про распорядок дня."
    frequency: "Очень частое."
    collocations:
      - "ducharse con agua caliente — принимать душ с горячей водой"
      - "ducharse por la mañana — принимать душ утром"
      - "ducharse rápido — быстро принимать душ"
    collocation_example: "Me ducho con agua caliente. — Я принимаю душ с горячей водой."
    trap: "Возвратный глагол: me ducho. Не путайте с la ducha «душ» (существительное)."

  - word: irse
    ru: уходить, уезжать
    ipa: /ˈirse/
    say: и́рсэ
    meaning: "Уйти или уехать из места. Я ухожу — me voy, ты уходишь — te vas, он уходит — se va. Глагол ir «идти» с частицей se."
    examples:
      - "Me voy a casa. — Я ухожу домой."
      - "Mi padre se va al trabajo. — Мой папа уходит на работу."
      - "A las ocho me voy de casa y llego al trabajo. — В восемь я ухожу из дома и прихожу на работу."
    origin: "Глагол ir (lat. ire) с частицей se: подчёркивает, что человек покидает место."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to leave, to go away — уходить"
    dialogue:
      - "Ana: ¿A qué hora te vas? | Во сколько ты уходишь?"
      - "Pablo: Me voy a las ocho. | Я ухожу в восемь."
    cefr: "A1 — базовый глагол движения."
    frequency: "Очень частое."
    collocations:
      - "irse a casa — уходить домой"
      - "irse de casa — уходить из дома"
      - "irse al trabajo — уходить на работу"
    collocation_example: "Me voy al trabajo a las ocho. — Я ухожу на работу в восемь."
    trap: "Ir — «идти куда-то», irse — «уйти оттуда». Формы странные: me voy, te vas, se va."

  - word: lavarse
    ru: умываться, мыться
    ipa: /laˈβarse/
    say: лава́рсэ
    meaning: "Мыть себя: лицо, руки, всё тело. Я умываюсь — me lavo, ты умываешься — te lavas."
    examples:
      - "Me lavo las manos. — Я мою руки."
      - "Mi hija se lava la cara. — Моя дочь умывает лицо."
      - "Antes de comer, me lavo siempre las manos con jabón. — Перед едой я всегда мою руки с мылом."
    origin: "От lavar (lat. lavare) «мыть» и se «себя»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to wash oneself — мыться"
    dialogue:
      - "Ana: ¿Te lavas los dientes? | Ты чистишь зубы?"
      - "Pablo: Sí, me lavo los dientes dos veces. | Да, я чищу зубы два раза."
    cefr: "A1 — слово про личную гигиену."
    frequency: "Очень частое."
    collocations:
      - "lavarse las manos — мыть руки"
      - "lavarse la cara — умываться"
      - "lavarse los dientes — чистить зубы"
    collocation_example: "Me lavo los dientes por la noche. — Я чищу зубы вечером."
    trap: "Часть тела берётся с артиклем: me lavo las manos (а не mis manos). Для зубов говорят lavarse los dientes, то есть «мыть зубы»."

  - word: quedarse en casa
    ru: оставаться дома
    ipa: /keˈðarse en ˈkasa/
    say: кеда́рсэ эн ка́са
    pron: "Буква d между гласными мягкая, как в английском this."
    meaning: "Не идти никуда, остаться дома. Я остаюсь — me quedo, ты остаёшься — te quedas."
    examples:
      - "Hoy me quedo en casa. — Сегодня я остаюсь дома."
      - "Mi madre se queda en casa por la tarde. — Моя мама остаётся дома днём."
      - "Cuando llueve mucho, me quedo en casa y leo un libro. — Когда идёт сильный дождь, я остаюсь дома и читаю книгу."
    origin: "От quedar «оставаться» и se; en casa — «дома»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to stay at home — оставаться дома"
    dialogue:
      - "Ana: ¿Sales hoy? | Ты сегодня выходишь?"
      - "Pablo: No, me quedo en casa. | Нет, я остаюсь дома."
    cefr: "A1 — частая фраза."
    frequency: "Очень частое."
    collocations:
      - "quedarse en casa hoy — остаться дома сегодня"
      - "quedarse en la cama — остаться в постели"
      - "quedarse en casa con la familia — остаться дома с семьёй"
    collocation_example: "El domingo me quedo en casa. — В воскресенье я остаюсь дома."
    trap: "Не путайте с quedar «договориться о встрече»: quedamos a las ocho. Здесь нужен se."

  - word: afeitarse
    ru: бриться
    ipa: /afejˈtarse/
    say: афейта́рсэ
    meaning: "Брить бороду или усы. Я бреюсь — me afeito, ты бреешься — te afeitas."
    examples:
      - "Me afeito cada día. — Я бреюсь каждый день."
      - "Mi padre se afeita por la mañana. — Мой папа бреется по утрам."
      - "Después de ducharme, me afeito delante del espejo. — После душа я бреюсь перед зеркалом."
    origin: "От afeitar «приводить в порядок, украшать»: сначала так говорили про уход за лицом, потом стали говорить «бриться»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to shave — бриться"
    dialogue:
      - "Ana: ¿Te afeitas todos los días? | Ты бреешься каждый день?"
      - "Pablo: Sí, me afeito por la mañana. | Да, я бреюсь утром."
    cefr: "A1 — слово про распорядок дня."
    frequency: "Частое."
    collocations:
      - "afeitarse la barba — сбрить бороду"
      - "afeitarse por la mañana — бриться утром"
      - "afeitarse todos los días — бриться каждый день"
    collocation_example: "Me afeito la barba una vez por semana. — Я бреюсь раз в неделю."
    trap: "Возвратный глагол: me afeito. Слово читается «афейтáрсэ»: ei — один слог."

  - word: acostarse
    ru: ложиться спать
    ipa: /akosˈtarse/
    say: акоста́рсэ
    meaning: "Лечь в постель, чтобы спать. Я ложусь — me acuesto, ты ложишься — te acuestas. Буква o меняется на ue."
    examples:
      - "Me acuesto a las once. — Я ложусь спать в одиннадцать."
      - "Mi hija se acuesta muy temprano. — Моя дочь ложится очень рано."
      - "Los fines de semana me acuesto más tarde que siempre. — В выходные я ложусь позже обычного."
    origin: "От a- и costa «бок, сторона» (lat. costa «ребро»): «лечь на бок»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to go to bed — ложиться спать"
    dialogue:
      - "Ana: ¿A qué hora te acuestas? | Во сколько ты ложишься спать?"
      - "Pablo: Me acuesto a las once. | Я ложусь в одиннадцать."
    cefr: "A1 — слово про распорядок дня."
    frequency: "Очень частое."
    collocations:
      - "acostarse temprano — ложиться рано"
      - "acostarse tarde — ложиться поздно"
      - "acostarse a las once — ложиться в одиннадцать"
    collocation_example: "Casi nunca me acuesto tarde. — Я почти никогда не ложусь поздно."
    trap: "Форма me acuesto, te acuestas, se acuesta — с ue. Для «мы» форма обычная: nos acostamos."

  - word: peinarse
    ru: причёсываться
    ipa: /pejˈnarse/
    say: пейна́рсэ
    meaning: "Расчёсывать волосы. Я причёсываюсь — me peino, ты причёсываешься — te peinas."
    examples:
      - "Me peino por la mañana. — Я причёсываюсь утром."
      - "Mi hija se peina delante del espejo. — Моя дочь причёсывается перед зеркалом."
      - "Después de ducharme, me peino y salgo de casa. — После душа я причёсываюсь и выхожу из дома."
    origin: "От peine «расчёска» (lat. pecten) и se «себя»."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "to comb one's hair — причёсываться"
    dialogue:
      - "Ana: ¿Te peinas antes de salir? | Ты причёсываешься перед выходом?"
      - "Pablo: Sí, me peino con un peine. | Да, причёсываюсь расчёской."
    cefr: "A1 — слово про распорядок дня."
    frequency: "Частое."
    collocations:
      - "peinarse el pelo — расчёсывать волосы"
      - "peinarse con un peine — причёсываться расчёской"
      - "peinarse por la mañana — причёсываться утром"
    collocation_example: "Me peino el pelo con un peine. — Я расчёсываю волосы расчёской."
    trap: "Слово читается «пейнáрсэ»: ei — один слог. Не путайте с el peine «расчёска»."

  - word: llamarse
    ru: называться, зваться
    ipa: /ʝaˈmarse/
    say: яма́рсэ
    pron: "ll в большинстве стран читается как русское «й»: ямáрсэ."
    meaning: "Иметь такое-то имя. Меня зовут — me llamo, тебя зовут — te llamas, его зовут — se llama."
    examples:
      - "Me llamo Pedro. — Меня зовут Педро."
      - "Mi hijo se llama Pablo. — Моего сына зовут Пабло."
      - "¿Cómo te llamas y de dónde eres? — Как тебя зовут и откуда ты?"
    origin: "От llamar «звать» (lat. clamare «кричать») и se: «называть себя»."
    register: "Обычное, нейтральное; так представляются все."
    synonyms: []
    analogs:
      - "to be called — называться"
    dialogue:
      - "Ana: ¿Cómo te llamas? | Как тебя зовут?"
      - "Pablo: Me llamo Pablo. ¿Y tú? | Меня зовут Пабло. А тебя?"
    cefr: "A1 — самая первая фраза знакомства."
    frequency: "Очень частое."
    collocations:
      - "me llamo… — меня зовут…"
      - "¿Cómo te llamas? — Как тебя зовут?"
      - "se llama… — его (её) зовут…"
    collocation_example: "Mi perro se llama Max. — Мою собаку зовут Макс."
    trap: "Буквально «я называю себя». Не говорите «yo soy llamo»: правильно только me llamo."

  - word: el desayuno
    ru: завтрак
    ipa: /el desaˈʝuno/
    say: эль десайу́но
    meaning: "Утренняя еда. Слово мужского рода: el desayuno."
    examples:
      - "El desayuno es a las ocho. — Завтрак в восемь."
      - "Mi desayuno es café con pan. — Мой завтрак — кофе с хлебом."
      - "En el hotel, el desayuno es muy bueno y muy grande. — В отеле завтрак очень хороший и большой."
    origin: "От desayunar «завтракать» (des- и ayuno «голодание»)."
    register: "Обычное, нейтральное."
    synonyms: []
    analogs:
      - "breakfast — завтрак"
    dialogue:
      - "Ana: ¿Qué hay para el desayuno? | Что на завтрак?"
      - "Pablo: Hay café y pan. | Есть кофе и хлеб."
    cefr: "A1 — слово про еду."
    frequency: "Очень частое."
    collocations:
      - "tomar el desayuno — позавтракать"
      - "el desayuno de hoy — сегодняшний завтрак"
      - "un buen desayuno — хороший завтрак"
    collocation_example: "Tomo el desayuno a las ocho. — Я завтракаю в восемь."
    trap: "Это существительное; глагол — desayunar. Артикль мужской: el desayuno, а не la."

  - word: el baño
    ru: ванная, туалет
    ipa: /el ˈbaɲo/
    say: эль ба́ньо
    pron: "ñ читается как русское «нь»."
    meaning: "Комната с ванной или душем, часто и с туалетом. Ещё — «купание»."
    examples:
      - "El baño está aquí. — Ванная здесь."
      - "Mi casa tiene dos baños. — В моём доме две ванные."
      - "¿Dónde está el baño, por favor? Quiero lavarme las manos. — Где ванная, пожалуйста? Я хочу вымыть руки."
    origin: "От bañar «купать» (lat. balneum «баня»)."
    register: "Обычное, нейтральное. В магазине и кафе спрашивают именно так."
    synonyms: []
    analogs:
      - "bathroom, toilet — ванная, туалет"
    dialogue:
      - "Ana: ¿Dónde está el baño? | Где ванная (туалет)?"
      - "Pablo: Está a la derecha. | Справа."
    cefr: "A1 — слово про дом."
    frequency: "Очень частое."
    collocations:
      - "ir al baño — идти в ванную (туалет)"
      - "el baño de la casa — ванная в доме"
      - "un baño grande — большая ванная"
    collocation_example: "Voy al baño un momento. — Я схожу в туалет на минуту."
