# Четвёртый список автора, часть 4 — «Desconcierto en el hospital 4» (слова 1–14).
lang: es
words:
  - word: agotarse
    ru: заканчиваться, иссякать
    ipa: /aɣoˈtaɾse/
    say: агота́рсэ
    pron: "g между гласными мягкое [ɣ]."
    meaning: "О запасах, силах, терпении: кончиться, иссякнуть. Agotado — «истощённый»; о товаре — «распродан»."
    examples:
      - "Se me agotó la paciencia. — У меня кончилось терпение."
      - "En pocos días tras la inundación, las existencias de agua potable se agotaron. — Через несколько дней после наводнения запасы питьевой воды закончились."
      - "Las entradas se agotaron en una hora, y miles de personas se quedaron sin poder verlo. — Билеты закончились за час, и тысячи людей не смогли его увидеть."
    origin: "От gota «капля»: a- + gota + -ar, то есть «вычерпать до последней капли». Родственные: gotear «капать», agotado."
    register: "Нейтральное."
    synonyms:
      - word: acabarse
        pair: ["Se agotó el tiempo.", "Se acabó el tiempo."]
        diff:
          - "acabarse — обычное «закончиться»"
          - "agotarse — подчёркивает, что запас вычерпан до дна"
    analogs:
      - "to run out — заканчиваться"
      - "to sell out — распродаться"
    dialogue:
      - "Ana: ¿Quedan entradas? | Билеты ещё остались?"
      - "Pablo: No, se agotaron ayer. | Нет, они закончились вчера."
      - "Ana: ¡Qué pena! Quería ir con mi hermana. | Как жаль! Я хотела пойти с сестрой."
      - "Pablo: Ya, a mí también se me agotó la paciencia buscándolas. | Понимаю, у меня тоже терпение иссякло, пока их искал."
      - "Ana: ¿Y por internet? | А через интернет?"
      - "Pablo: Tampoco. Se agotaron en diez minutos. Hubo un follón en la web. | Тоже нет. Раскупили за десять минут. На сайте была неразбериха."
      - "Ana: Pues habrá que esperar a otra función. | Тогда придётся ждать другого показа."
      - "Pablo: Sí, y comprar con tiempo, por si se vuelven a agotar. | Да, и покупать заранее, вдруг опять закончатся."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "agotarse las existencias — закончиться на складе"
      - "agotarse la paciencia — лопнуть терпению"
      - "entradas agotadas — билеты распроданы"
    collocation_example: "Se agotaron las existencias en dos días. — Запасы закончились за два дня."
    trap: "Возвратный глагол: se agotó, а не agotó (это «исчерпал»). Agotado о человеке — «без сил», о товаре — «закончился»."

  - word: no tardar en
    ru: скоро что-то сделать, не заставить себя ждать
    ipa: /no taɾˈðaɾ en/
    say: но тарда́р эн
    pron: "d между гласными мягкое [ð]: tardar."
    meaning: "Очень скоро что-то произойдёт или будет сделано: «не заставит себя ждать». После en — инфинитив."
    examples:
      - "No tardó en darse cuenta del error. — Он быстро понял свою ошибку."
      - "Tras el robo en el museo, la policía no tardó en descubrir quién se llevó el cuadro. — После кражи в музее полиции не потребовалось много времени, чтобы выяснить, кто унёс картину."
      - "No tardarán en llegar, así que pon la mesa y abre una botella de vino. — Они скоро приедут, так что накрой на стол и открой бутылку вина."
    origin: "tardar «медлить, задерживаться» (от tarde «поздно»; лат. tardus «медленный»). No tardar — «не медлить»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: enseguida
        pair: ["No tardó en llegar.", "Llegó enseguida."]
        diff:
          - "enseguida — просто «сразу»"
          - "no tardar en — «скоро, вскоре», с оттенком ожидаемого"
    analogs:
      - "not to be long in — скоро сделать"
      - "to soon — вскоре"
    dialogue:
      - "Ana: ¿Vendrá el médico? | Врач придёт?"
      - "Pablo: No tardará en llegar. | Он скоро будет."
      - "Ana: ¿Seguro? Llevamos una hora esperando. | Уверен? Мы ждём уже час."
      - "Pablo: Sí, está atendiendo a un paciente grave. No tardará en venir. | Да, он принимает тяжёлого пациента. Скоро придёт."
      - "Ana: Qué paciencia hay que tener en los hospitales. | Сколько терпения нужно в больницах."
      - "Pablo: Mucha. Pero una vez que llega, es muy concienzudo. | Много. Но когда он приходит, он очень добросовестный."
      - "Ana: Pues no tardes en avisarme cuando aparezca. | Тогда не медли сообщить мне, когда он появится."
      - "Pablo: Tranquila, no tardaré. | Не волнуйся, не задержусь."
    cefr: "B2."
    frequency: "Частое в прозе и новостях."
    collocations:
      - "no tardar en + инфинитив — скоро сделать"
      - "tardar en llegar — задержаться"
      - "no tardó mucho — это заняло немного времени"
    collocation_example: "La respuesta no tardó en llegar. — Ответ не заставил себя ждать."
    trap: "С инфинитивом: no tardar en hacer. Не путайте tardar «задерживаться» и tardar «занимать время»: ¿Cuánto tardas? — «Сколько тебе нужно?»."

  - word: somnífero
    ru: снотворное
    ipa: /somˈnifeɾo/
    say: сомни́фэро
    pron: "Ударение на ni: somnífero — знак ударения обязателен."
    meaning: "Лекарство, которое помогает уснуть. Как прилагательное — «усыпляющий»."
    examples:
      - "Mi abuela toma un somnífero ligero. — Моя бабушка принимает лёгкое снотворное."
      - "Encontraron un frasco de somníferos vacío junto a la cama del paciente. — Рядом с кроватью пациента нашли пустой флакон из-под снотворного."
      - "Toma un somnífero cada noche desde que se murió su marido, pero el médico quiere que lo deje. — Она принимает снотворное каждую ночь с тех пор, как умер муж, но врач хочет, чтобы она перестала."
    origin: "Из лат. somnus «сон» + -fer «несущий»: «несущий сон». Родственные: insomnio «бессонница», sueño «сон»."
    register: "Нейтральное, медицинское."
    synonyms:
      - word: pastilla para dormir
        pair: ["Toma un somnífero.", "Toma una pastilla para dormir."]
        diff:
          - "pastilla para dormir — разговорное название «таблетка для сна»"
          - "somnífero — слово из аптеки и инструкций"
    analogs:
      - "sleeping pill — снотворное"
      - "sedative — успокоительное, седативное"
    dialogue:
      - "Ana: ¿Duermes bien últimamente? | Ты хорошо спишь в последнее время?"
      - "Pablo: Solo con un somnífero. | Только со снотворным."
      - "Ana: ¿Desde cuándo lo tomas? | С каких пор ты его принимаешь?"
      - "Pablo: Desde el accidente. Sin él doy vueltas en la cama y me despierto cada hora. | С аварии. Без него я ворочаюсь в постели и просыпаюсь каждый час."
      - "Ana: No me gusta. Un somnífero no es un remedio para siempre. | Мне это не нравится. Снотворное — не лекарство на всю жизнь."
      - "Pablo: Lo sé. El médico me dijo que lo dejara poco a poco. Es conveniente no depender de él. | Знаю. Врач сказал бросать понемногу. Желательно не зависеть от него."
      - "Ana: Prueba con un té y un paseo antes de acostarte. | Попробуй чай и прогулку перед сном."
      - "Pablo: Lo intentaré. Pero, de momento, no hay otro remedio. | Попробую. Но пока другого выхода нет."
    cefr: "C1."
    frequency: "Частое в разговорах о здоровье."
    collocations:
      - "tomar un somnífero — принять снотворное"
      - "somnífero suave — лёгкое снотворное"
      - "sobredosis de somníferos — передозировка снотворного"
    collocation_example: "El médico le recetó un somnífero suave. — Врач выписал ему лёгкое снотворное."
    trap: "Не путайте somnífero «снотворное» с sonámbulo «лунатик» и soñoliento «сонный»."

  - word: dormir de un tirón
    ru: проспать без перерыва
    ipa: /doɾˈmiɾ de un tiˈɾon/
    say: дорми́р дэ ун тиро́н
    meaning: "Спать всю ночь, ни разу не просыпаясь. Tirón — «рывок, одним махом»."
    examples:
      - "Dormí de un tirón toda la noche. — Я проспал всю ночь без перерыва."
      - "Desde que cumplió seis meses de edad, el bebé duerme de un tirón. — С тех пор как ему исполнилось шесть месяцев, малыш спит без пробуждений."
      - "Después de tantos días de viaje, durmió de un tirón doce horas en la cama del hotel. — После стольких дней в пути он проспал двенадцать часов подряд в гостиничной кровати."
    origin: "dormir «спать» + de un tirón «одним рывком». От tirar «тянуть»: «одной протяжкой, без остановки»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: dormir del tirón
        pair: ["Durmió de un tirón.", "Durmió del tirón."]
        diff:
          - "del tirón — вариант выражения, значение то же"
    analogs:
      - "to sleep straight through — проспать без перерыва"
      - "to sleep like a log — спать как убитый"
    dialogue:
      - "Ana: ¿Cómo has dormido? | Как ты спал?"
      - "Pablo: De un tirón, hasta las nueve. | Не просыпаясь, до девяти."
      - "Ana: ¡Qué envidia! Yo me desperté tres veces. | Завидую! Я просыпалась три раза."
      - "Pablo: Es que estaba agotado. Anoche me tiré en la cama y quedé sumido en un sueño profundo. | Я был измотан. Вчера бросился на кровать и провалился в глубокий сон."
      - "Ana: ¿Y soñaste algo? | И тебе что-то снилось?"
      - "Pablo: Nada que recuerde. Dormí de un tirón y ahora estoy despejado. | Ничего не помню. Проспал без перерыва, и теперь бодр."
      - "Ana: Pues yo necesito un café bien cargado. | А мне нужен крепкий кофе."
      - "Pablo: Prepáralo, y aprovecha para traerme otro. | Приготовь и заодно принеси мне ещё."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "dormir de un tirón — спать не просыпаясь"
      - "leer de un tirón — прочитать залпом"
      - "de un tirón — одним махом"
    collocation_example: "Leí el libro de un tirón. — Я прочитал книгу за один присест."
    trap: "Выражение «de un tirón» бывает не только про сон: leer de un tirón — «прочитать залпом». Не путайте с tirón «рывок» и tirar «бросать»."

  - word: enterarse de
    ru: узнать о чём-то
    ipa: /enteˈɾaɾse de/
    say: энтэра́рсэ дэ
    meaning: "Получить известие, узнать новость. Часто — «выяснить, разобраться»."
    examples:
      - "Me enteré de la noticia ayer. — Я узнал эту новость вчера."
      - "Han cerrado la panadería de la esquina: ¿te has enterado? — Булочную на углу закрыли: ты не слышал?"
      - "Quiero enterarme de todo lo que dicen los vecinos sobre la nueva tienda de la esquina. — Я хочу узнать всё, что говорят соседи о новом магазине на углу."
    origin: "От enterar «сообщать» (лат. integrare «делать цельным»): entero «целый, полный». «Получить полное сведение»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: saber
        pair: ["Me enteré de que se mudó.", "Supe que se mudó."]
        diff:
          - "saber — «знать», а в прошедшем (supe) — «узнал»"
          - "enterarse — «получить известие», подчёркивает момент получения"
    analogs:
      - "to find out — узнать"
      - "to hear about — услышать о"
    dialogue:
      - "Ana: ¿Cómo te enteraste? | Как ты узнал?"
      - "Pablo: Me lo contó un vecino. | Мне рассказал сосед."
      - "Ana: ¿Y qué te dijo exactamente? | И что именно он сказал?"
      - "Pablo: Que el dueño de la joyería había desaparecido sin previo aviso. | Что хозяин ювелирного магазина исчез без предупреждения."
      - "Ana: Qué cotilleo tan raro. ¿Quién más lo sabe? | Какая странная сплетня. Кто ещё знает?"
      - "Pablo: Todo el barrio, de hecho. Nadie se enteró por la prensa, sino por los vecinos. | На самом деле весь район. Никто не узнал из прессы, а только от соседей."
      - "Ana: Y la policía, ¿se ha enterado? | А полиция в курсе?"
      - "Pablo: Ahora sí. Yo mismo me apresuré a avisarla. | Теперь да. Я сам поспешил её предупредить."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "enterarse de algo — узнать о чём-то"
      - "enterarse de que… — узнать, что…"
      - "¿te enteras? — ты понимаешь?"
    collocation_example: "No me enteré de nada de lo que dijo. — Я ничего не понял из того, что он сказал."
    trap: "Нужен предлог de: enterarse DE algo. Возвратный глагол: me entero. Не путайте с entender «понимать»: «No me entero» — разговорное «я не въезжаю»."

  - word: personarse
    ru: явиться лично
    ipa: /peɾsoˈnaɾse/
    say: пэрсона́рсэ
    meaning: "Прийти куда-то лично, особенно по вызову или в официальное учреждение: в суд, в полицию, в больницу."
    examples:
      - "Los testigos deben personarse en el juzgado. — Свидетели должны явиться в суд."
      - "Mañana a las diez, para declarar como testigo, debe personarse en la comisaría. — Завтра в десять часов, чтобы дать показания как свидетель, вам нужно явиться в участок."
      - "El abogado se personó en el juzgado con todos los documentos que le había pedido el juez. — Адвокат явился в суд со всеми документами, которые запросил судья."
    origin: "От persona «лицо, человек» + возвратное -se: «появиться лицом». Родственное: personal «личный»."
    register: "Формальное, юридическое."
    synonyms:
      - word: presentarse
        pair: ["Debe personarse en el juzgado.", "Debe presentarse en el juzgado."]
        diff:
          - "presentarse — обычное «явиться, прийти»"
          - "personarse — официальнее, «явиться лично» по вызову"
    analogs:
      - "to appear in person — явиться лично"
      - "to turn up — появиться"
    dialogue:
      - "Ana: ¿Qué dice la carta? | Что говорится в письме?"
      - "Pablo: Que debo personarme en el juzgado. | Что я должен лично явиться в суд."
      - "Ana: ¿Cuándo? | Когда?"
      - "Pablo: El jueves a las diez. Me citan como testigo. | В четверг в десять. Вызывают меня как свидетеля."
      - "Ana: ¿Hace falta llevar algo? | Нужно что-то взять?"
      - "Pablo: El carné de identidad y la citación. Es conveniente llegar media hora antes. | Удостоверение личности и повестку. Желательно прийти за полчаса."
      - "Ana: Pues no te despistes, que siempre llegas tarde. | Тогда не расслабляйся, ты всегда опаздываешь."
      - "Pablo: Esta vez no. Me da respeto personarme ante un juez. | В этот раз нет. Мне страшно являться перед судьёй."
    cefr: "C1."
    frequency: "Частое в официальных текстах."
    collocations:
      - "personarse en un lugar — явиться куда-то"
      - "personarse en el juzgado — явиться в суд"
      - "personarse como acusación — выступить стороной обвинения"
    collocation_example: "El abogado se personó en la causa. — Адвокат вступил в дело."
    trap: "Это возвратный глагол: se personó. Не путайте с personalizar «персонализировать» и personificar «олицетворять»."

  - word: dar publicidad a
    ru: придать огласку
    ipa: /ˈdaɾ publiθiˈðað a/
    say: дар публиси́да а
    pron: "c перед i в Испании — [θ]; d мягкое [ð]."
    meaning: "Сделать что-то известным многим: рассказать публике. Publicidad — не только «реклама», но и «известность, огласка»."
    examples:
      - "Prefirió no dar publicidad a su enfermedad. — Он предпочёл не предавать огласке свою болезнь."
      - "Para proteger a la familia de la víctima, no quiso dar publicidad al caso. — Чтобы защитить семью жертвы, он не захотел предавать дело огласке."
      - "La empresa dio publicidad a su nuevo producto con una campaña en televisión y redes sociales. — Компания рекламировала свой новый продукт кампанией на телевидении и в соцсетях."
    origin: "publicidad от público «публичный, открытый» (лат. publicus). Dar publicidad — «сделать публичным»."
    register: "Формальное, газетное."
    synonyms:
      - word: hacer público
        pair: ["Dieron publicidad al hecho.", "Hicieron público el hecho."]
        diff:
          - "hacer público — «обнародовать», нейтральнее"
          - "dar publicidad — «придать огласку», часто в связи со СМИ"
    analogs:
      - "to publicize — предать огласке"
      - "to make public — обнародовать"
    dialogue:
      - "Ana: ¿Vais a contarlo a la prensa? | Вы расскажете об этом прессе?"
      - "Pablo: No, preferimos no dar publicidad al asunto. | Нет, мы предпочитаем не придавать этому огласку."
      - "Ana: ¿Por qué? Es una injusticia. | Почему? Это несправедливость."
      - "Pablo: Porque la familia sufre ya bastante. Dar publicidad solo traería más cotilleo. | Потому что семья и так достаточно страдает. Огласка принесёт только больше сплетен."
      - "Ana: Pero así nadie se hará eco de la noticia. | Но тогда никто не подхватит новость."
      - "Pablo: Mejor. Cuanto menos ruido, más fácil trabajar con discreción. | Тем лучше. Чем меньше шума, тем легче работать незаметно."
      - "Ana: Visto así, tienes razón. | С этой точки зрения ты прав."
      - "Pablo: Además, si hace falta, siempre podemos dar publicidad más adelante. | К тому же, если понадобится, мы всегда сможем придать огласку позже."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "dar publicidad a algo — предать огласке"
      - "evitar la publicidad — избежать огласки"
      - "publicidad engañosa — вводящая в заблуждение реклама"
    collocation_example: "El Gobierno decidió dar publicidad a los resultados. — Правительство решило обнародовать результаты."
    trap: "Publicidad — «реклама» и «огласка»: в «dar publicidad» чаще второе. «Реклама по ТВ» — anuncio, «рекламировать» — anunciar."

  - word: cuanto antes
    ru: как можно скорее
    ipa: /ˈkwanto ˈantes/
    say: куа́нто а́нтэс
    pron: "ua — один слог «уа»."
    meaning: "Побыстрее: «как только получится, без задержки». Используется и в просьбах, и в советах."
    examples:
      - "Respóndeme cuanto antes, por favor. — Ответь мне как можно скорее, пожалуйста."
      - "Necesito tu respuesta para poder cerrar el trato hoy, así que llámame cuanto antes. — Мне нужен твой ответ, чтобы сегодня закрыть сделку, так что позвони мне как можно скорее."
      - "Hay que operar cuanto antes, porque cada día de espera aumenta el riesgo para el paciente. — Нужно оперировать как можно скорее, потому что каждый день ожидания увеличивает риск для пациента."
    origin: "cuanto «насколько» + antes «раньше». Дословно «насколько раньше», то есть «чем раньше, тем лучше»."
    register: "Нейтральное."
    synonyms:
      - word: lo antes posible
        pair: ["Respóndeme cuanto antes.", "Respóndeme lo antes posible."]
        diff:
          - "lo antes posible — чуть формальнее и длиннее"
          - "cuanto antes — короче, обиходнее"
    analogs:
      - "as soon as possible — как можно скорее"
      - "the sooner the better — чем скорее, тем лучше"
    dialogue:
      - "Ana: ¿Para cuándo lo necesitas? | К какому сроку тебе это нужно?"
      - "Pablo: Cuanto antes. | Как можно скорее."
      - "Ana: ¿Hoy mismo? | Сегодня же?"
      - "Pablo: Si puede ser, sí. El inspector de Hacienda llega mañana y quiero tener todo listo. | Если можно, то да. Завтра приезжает налоговый инспектор, и я хочу, чтобы всё было готово."
      - "Ana: Vale, me pongo con ello. Tendré que quedarme hasta tarde. | Хорошо, берусь за дело. Придётся задержаться допоздна."
      - "Pablo: Te lo agradezco. Te invito a cenar cuanto antes. | Благодарю. Приглашу тебя на ужин при первой возможности."
      - "Ana: Cuanto antes mejor. Estoy muerta de hambre. | Чем скорее, тем лучше. Я умираю от голода."
      - "Pablo: Pues acabemos cuanto antes y nos vamos. | Тогда закончим скорее и пойдём."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "lo antes posible — как можно скорее"
      - "cuanto antes mejor — чем раньше, тем лучше"
      - "responder cuanto antes — ответить побыстрее"
    collocation_example: "Cuanto antes lo sepas, mejor. — Чем скорее ты узнаешь, тем лучше."
    trap: "Не путайте cuanto antes с lo más pronto «как можно раньше»: они почти одинаковы. А «чем раньше, тем лучше» — cuanto antes, mejor."

  - word: albergar esperanzas
    ru: питать надежды
    ipa: /albeɾˈɣaɾ espeˈɾanθas/
    say: албэрга́р эспэра́нсас
    pron: "g перед a — [ɣ]; перед e g меняется на gu: albergué."
    meaning: "Носить в себе надежду: хранить её, пока есть шанс. Albergar — «приютить, держать в себе»."
    examples:
      - "No albergo ninguna esperanza de ganar. — У меня нет никакой надежды выиграть."
      - "Cuando termine la guerra, él todavía alberga esperanzas de volver a su país. — Когда закончится война, он всё ещё питает надежду вернуться в свою страну."
      - "No albergo muchas esperanzas de que el jefe acepte nuestra propuesta de cambiar el horario. — Я не питаю больших надежд, что начальник примет наше предложение изменить график."
    origin: "albergar «приютить» от albergue «приют, убежище» (готск. haribaírgō «стоянка войска»). Образ: надежда «живёт» в человеке."
    register: "Формальное, книжное."
    synonyms:
      - word: tener esperanzas
        pair: ["Alberga esperanzas.", "Tiene esperanzas."]
        diff:
          - "tener esperanzas — просто «надеяться»"
          - "albergar — «хранить в себе», звучит литературнее"
    analogs:
      - "to harbour hopes — питать надежды"
      - "to hold out hope — не терять надежду"
    dialogue:
      - "Ana: ¿Crees que lo encontrarán? | Ты думаешь, его найдут?"
      - "Pablo: Aún albergo esperanzas. | Я всё ещё питаю надежды."
      - "Ana: Han pasado dos semanas. Su paradero sigue siendo desconocido. | Прошло две недели. Его местонахождение по-прежнему неизвестно."
      - "Pablo: Lo sé. Pero el inspector es muy sagaz y no se rinde. | Знаю. Но инспектор очень проницателен и не сдаётся."
      - "Ana: ¿Y la familia? | А семья?"
      - "Pablo: Su madre no albergaba esperanzas, pero ahora se ha animado. | Его мать не питала надежд, но теперь воодушевилась."
      - "Ana: Ojalá tenga razón. | Хорошо бы, чтобы вы оказались правы."
      - "Pablo: Pese a todo, hay que armarse de paciencia y no perder la fe. | Несмотря ни на что, надо запастись терпением и не терять веры."
    cefr: "C1."
    frequency: "Частое в письменной речи."
    collocations:
      - "albergar esperanzas — питать надежды"
      - "albergar dudas — иметь сомнения"
      - "albergar rencor — затаить злобу"
    collocation_example: "Aún albergo dudas sobre su inocencia. — У меня всё ещё есть сомнения в его невиновности."
    trap: "Albergar — переходный и значит «приютить» тоже: El hotel alberga a cien personas. Перед e g меняется на gu: albergue."

  - word: hacerse pasar por
    ru: выдавать себя за кого-то
    ipa: /aˈθeɾse paˈsaɾ poɾ/
    say: асэ́рсэ паса́р пор
    pron: "h не читается; c перед e в Испании — [θ]."
    meaning: "Притвориться другим человеком, чтобы все поверили. После por — кем притворяются."
    examples:
      - "Se hizo pasar por inspector de sanidad. — Он выдал себя за санитарного инспектора."
      - "Un periodista se hizo pasar por turista para investigar cómo trataban a los clientes. — Журналист притворился туристом, чтобы выяснить, как обращаются с клиентами."
      - "Se hacen pasar por empleados del banco y piden los datos de la tarjeta por teléfono. — Они выдают себя за сотрудников банка и просят данные карты по телефону."
    origin: "hacerse «делать себя» + pasar por «сойти за»: «сделать так, чтобы приняли за». Образ из жизни: «пройти» под чужим именем."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: fingir ser
        pair: ["Se hizo pasar por policía.", "Fingió ser policía."]
        diff:
          - "fingir ser — «притвориться», без стремления обмануть кого-то конкретного"
          - "hacerse pasar por — «выдать себя» с целью обмануть"
    analogs:
      - "to pose as — выдавать себя за"
      - "to pass oneself off as — выдать себя за"
    dialogue:
      - "Ana: ¿Quién llamó? | Кто звонил?"
      - "Pablo: Alguien que se hizo pasar por tu jefe. | Кто-то, кто выдал себя за твоего начальника."
      - "Ana: ¿Qué quería? | Что он хотел?"
      - "Pablo: Mis datos y la contraseña del banco. Quería suplantar mi personalidad. | Мои данные и пароль от банка. Хотел выдать себя за меня."
      - "Ana: ¿Y se los diste? | И ты их дал?"
      - "Pablo: Ni siquiera acertó a justificar la urgencia. Colgué sin previo aviso. | Он даже не смог объяснить срочность. Я повесил трубку без предупреждения."
      - "Ana: Qué suerte. Hay mucho delincuente por ahí. | Повезло. Много преступников развелось."
      - "Pablo: Sí, y se hacen pasar por todo: bancos, jefes, hasta por la policía. | Да, и выдают себя за всех: банки, начальников, даже полицию."
    cefr: "B2."
    frequency: "Частое в новостях о мошенничестве."
    collocations:
      - "hacerse pasar por alguien — выдавать себя за кого-то"
      - "hacerse pasar por médico — выдавать себя за врача"
      - "pasar por — сойти за"
    collocation_example: "Un estafador se hizo pasar por inspector. — Мошенник выдал себя за инспектора."
    trap: "С предлогом por: hacerse pasar por X. Глагол hacerse спрягается: me hago, te haces; pasar не меняется."

  - word: llevarse una gran sorpresa
    ru: сильно удивиться
    ipa: /ʎeˈβaɾse ˈuna ɡɾan soɾˈpɾesa/
    say: йэба́рсэ у́на гран сорпрэ́са
    pron: "ll в большинстве регионов — как «й»; v читается как b."
    meaning: "Получить неожиданное, часто приятное известие или впечатление: «ему был сюрприз»."
    examples:
      - "Se llevó una sorpresa muy agradable. — Он получил очень приятный сюрприз."
      - "Al saber lo del panadero, los vecinos se llevaron una gran sorpresa. — Узнав о булочнике, соседи сильно удивились."
      - "Me llevé una gran sorpresa al verla en la puerta, porque no sabía que había vuelto de viaje. — Я очень удивился, увидев её у двери, потому что не знал, что она вернулась из поездки."
    origin: "llevarse «получать, уносить с собой» + sorpresa «неожиданность» (от sorprender «застать врасплох»). Буквально «унести с собой удивление»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: sorprenderse
        pair: ["Me llevé una gran sorpresa.", "Me sorprendí mucho."]
        diff:
          - "sorprenderse — просто «удивиться»"
          - "llevarse una sorpresa — «получить сюрприз», о событии"
    analogs:
      - "to get a surprise — получить сюрприз"
      - "to be taken aback — быть озадаченным"
    dialogue:
      - "Ana: ¿Qué tal la visita? | Как визит?"
      - "Pablo: Me llevé una gran sorpresa. | Меня ждал большой сюрприз."
      - "Ana: ¿Buena o mala? | Хороший или плохой?"
      - "Pablo: Buena. Esperaba una casa sobria y me encontré con un sitio acogedor. | Хороший. Я ждал строгий дом, а попал в уютное место."
      - "Ana: ¿Y los dueños? | А хозяева?"
      - "Pablo: Un matrimonio encantador. Me recibieron con un bollo casero y café. | Очаровательная пара. Встретили меня домашней булочкой и кофе."
      - "Ana: Qué detalle. Yo también me llevé una sorpresa ayer. | Какая забота. Я вчера тоже получила сюрприз."
      - "Pablo: ¿Sí? Cuéntame, no me dejes con la intriga. | Да? Расскажи, не держи в интриге."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "llevarse una sorpresa — получить сюрприз"
      - "llevarse un susto — испугаться"
      - "llevarse una decepción — разочароваться"
    collocation_example: "Se llevó un buen susto con el ruido. — Он здорово испугался шума."
    trap: "Выражение с llevarse и существительным: llevarse una sorpresa, un susto, una decepción. Не говорите «llevar una sorpresa»: нужен возвратный llevarse."

  - word: embargar a alguien la ilusión
    ru: охватить кого-то надеждой, радостным ожиданием
    ipa: /embaɾˈɣaɾ a ˈalɣjen la iluˈsjon/
    say: эмбарга́р а а́льгьен ла илусьо́н
    pron: "g перед a — [ɣ]; перед e g меняется на gu: embargue."
    meaning: "О сильном чувстве: полностью овладеть человеком, заполнить его. Embargar — «охватить, завладеть»."
    examples:
      - "Me embargó la ilusión por el viaje. — Меня охватила радость от поездки."
      - "Después de tantos años de separación, le embargaba la ilusión de volver a verla. — После стольких лет разлуки его переполняла радостная надежда снова увидеть её."
      - "Una gran emoción la embargó cuando abrió la puerta y vio a toda la familia reunida. — Её охватило сильное волнение, когда она открыла дверь и увидела всю семью в сборе."
    origin: "embargar «задерживать, накладывать арест» (лат. imbarricare «преграждать»): чувство будто преграждает путь всем другим мыслям. Родственное: embargo «арест имущества»."
    register: "Формальное, литературное."
    synonyms:
      - word: invadir
        pair: ["La ilusión lo embargaba.", "La ilusión lo invadía."]
        diff:
          - "invadir — «нахлынуть, заполнить», нейтральнее"
          - "embargar — книжное, «овладеть целиком»"
    analogs:
      - "to overcome — охватить, овладеть"
      - "to be overwhelmed by — быть охваченным"
    dialogue:
      - "Cuando Lucía recibió la carta, la ilusión la embargó por completo. | Когда Лусия получила письмо, её полностью охватило радостное волнение."
      - "Era la respuesta de una universidad en otra ciudad: la habían aceptado. | Это был ответ университета из другого города: её приняли."
      - "Abrazó a su madre, que sollozaba de alegría, y las dos se echaron a reír. | Она обняла маму, которая плакала от радости, и обе рассмеялись."
      - "Durante días, no acertó a pensar en otra cosa que en el viaje. | Несколько дней она не могла думать ни о чём, кроме поездки."
      - "Sin embargo, de noche la embargaba también la melancolía de dejar a su familia. | Но по ночам её охватывала и грусть от расставания с семьёй."
      - "Pese a todo, se armó de valor y empezó a preparar las maletas. | Несмотря ни на что, она набралась смелости и начала собирать чемоданы."
    cefr: "C1."
    frequency: "Нечастое: в литературе."
    collocations:
      - "embargar la emoción — охватить волнением"
      - "embargar la tristeza — охватить грустью"
      - "embargar los bienes — арестовать имущество"
    collocation_example: "Le embargaba una profunda tristeza. — Его охватила глубокая печаль."
    trap: "Embargar — и «охватить чувством», и «арестовать имущество» (юридически). Чувство — подлежащее, человек — прямое дополнение: la emoción lo embargó."

  - word: presagiar
    ru: предвещать, предчувствовать
    ipa: /pɾesaˈxjaɾ/
    say: прэсахья́р
    pron: "g перед i — «х»; ударение на последнем слоге: presagiar."
    meaning: "Подавать знак того, что скоро случится: «ничего хорошего не предвещать»."
    examples:
      - "Esas nubes presagian una gran tormenta. — Эти тучи предвещают сильную грозу."
      - "Como el cielo oscuro presagiaba tormenta, los pescadores decidieron volver antes al puerto. — Так как тёмное небо предвещало грозу, рыбаки решили пораньше вернуться в порт."
      - "Su silencio no presagiaba nada bueno, y todos lo sabíamos aunque nadie lo dijera. — Его молчание не предвещало ничего хорошего, и мы все это понимали, хотя никто не сказал вслух."
    origin: "От presagio «предзнаменование» (лат. praesagium: prae- «заранее» + sagire «чуять»). Родственное: sagaz «проницательный»."
    register: "Формальное, книжное."
    synonyms:
      - word: anunciar
        pair: ["Las nubes presagiaban lluvia.", "Las nubes anunciaban lluvia."]
        diff:
          - "anunciar — «возвещать» открыто"
          - "presagiar — «предвещать» по знакам, намёками, обычно к дурному"
    analogs:
      - "to foreshadow — предвещать"
      - "to bode — предвещать"
    dialogue:
      - "Ana: ¿Cómo estaba el ambiente en la reunión? | Какая была атмосфера на встрече?"
      - "Pablo: Tenso. Presagiaba una pelea. | Напряжённая. Предвещала ссору."
      - "Ana: ¿Hubo gritos? | Были крики?"
      - "Pablo: Casi. El jefe esgrimió su carácter absorbente y todos se callaron. | Почти. Начальник показал свой властный характер, и все замолчали."
      - "Ana: Esas nubes negras también presagian una tormenta. | Эти чёрные тучи тоже предвещают грозу."
      - "Pablo: Sí, mejor salir ya, por si acaso. Presiento que va a llover mucho. | Да, лучше выйти сейчас, на всякий случай. Чувствую, что будет сильный дождь."
      - "Ana: No quiero llegar mojada, tengo una cita importante. | Не хочу прийти мокрой, у меня важная встреча."
      - "Pablo: Pues vámonos. Un cielo así presagia tormenta seguro. | Тогда пошли. Такое небо точно предвещает грозу."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "presagiar tormenta — предвещать грозу"
      - "presagiar problemas — предвещать проблемы"
      - "un mal presagio — дурное предзнаменование"
    collocation_example: "Aquel silencio presagiaba problemas. — Это молчание предвещало неприятности."
    trap: "Глагол — presagiar с ударением на последнем слоге, существительное presagio — на sa. Не путайте с presentir «предчувствовать»: presentir — внутреннее чувство, presagiar — внешний знак."

  - word: venirse abajo
    ru: рухнуть, развалиться
    ipa: /beˈniɾse aˈβaxo/
    say: бэни́рсэ аба́хо
    pron: "v читается как b; j — «х»."
    meaning: "О здании или планах: обрушиться, развалиться. О человеке — «упасть духом, расклеиться»."
    examples:
      - "El techo del garaje se vino abajo. — Крыша гаража рухнула."
      - "Todos nuestros planes se vinieron abajo cuando el banco nos negó el préstamo. — Все наши планы рухнули, когда банк отказал нам в кредите."
      - "Se vino abajo al oír la noticia y tuvieron que ayudarle a sentarse en una silla. — Он упал духом, услышав новость, и ему пришлось помочь сесть на стул."
    origin: "venirse «приходить сюда» + abajo «вниз»: «прийти вниз». Образ: падение, рушится сверху вниз."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: derrumbarse
        pair: ["El techo se vino abajo.", "El techo se derrumbó."]
        diff:
          - "derrumbarse — «обрушиться», нейтральное и книжное"
          - "venirse abajo — разговорнее, и о людях, и о планах"
    analogs:
      - "to collapse — рухнуть"
      - "to fall apart — развалиться"
    dialogue:
      - "Ana: ¿Cómo está tu primo? | Как твой двоюродный брат?"
      - "Pablo: Se vino abajo tras el despido. | Он рухнул после увольнения."
      - "Ana: ¿Tan mal? | Так плохо?"
      - "Pablo: Sí. Estaba sumido en una tristeza profunda y apenas comía. | Да. Он был погружён в глубокую печаль и едва ел."
      - "Ana: ¿Y la familia? | А семья?"
      - "Pablo: Todos intentan animarlo. Su madre le lleva bollos y su hermana lo llama cada día. | Все пытаются его подбодрить. Мама носит булочки, а сестра звонит каждый день."
      - "Ana: Menos mal que no está solo. | Хорошо, что он не один."
      - "Pablo: Sí, aunque cuesta. Cuando uno se viene abajo, tarda en levantarse. | Да, хотя трудно. Когда человек рушится, ему нужно время, чтобы подняться."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "venirse abajo — рухнуть"
      - "todo se vino abajo — всё рухнуло"
      - "irse abajo — рухнуть"
    collocation_example: "Todos sus planes se vinieron abajo. — Все его планы рухнули."
    trap: "Спрягается как venir: me vengo, te vienes; в прошедшем me vine abajo. Не путайте с bajar «спуститься» и abajo «внизу»."
