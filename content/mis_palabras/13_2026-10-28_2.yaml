# Пятый список автора, часть 6 — «Desconcierto en el hospital 5» (слова 12–22).
lang: es
words:
  - word: acceder a la petición
    ru: согласиться на просьбу
    ipa: /akθeˈðeɾ a la peˈtiθjon/
    say: акссэдэ́р а ла пэтисьо́н
    pron: "cc читается [kθ]: acceder — «акс-сэ-дэ́р»; d между гласными мягкое [ð]; c перед i в Испании — [θ]."
    meaning: "Дать своё согласие на то, о чём просили. Чаще в официальной речи."
    examples:
      - "No accedió a mi petición. — Он не согласился на мою просьбу."
      - "Después de pensarlo mucho, el director accedió a la petición de los empleados. — Долго подумав, директор согласился на просьбу работников."
      - "El ayuntamiento accedió a la petición de los vecinos y colocó un semáforo en el cruce. — Мэрия согласилась с просьбой жителей и поставила на перекрёстке светофор."
    origin: "Из лат. accedere «подходить»: ad- «к» + cedere «идти». Родственные: acceso «доступ», ceder «уступать»."
    register: "Формальное."
    synonyms:
      - word: aceptar
        pair: ["Accedió a la petición.", "Aceptó la petición."]
        diff:
          - "aceptar — просто «принять»"
          - "acceder a — «согласиться на просьбу, уступить», с оттенком снисхождения"
    analogs:
      - "to grant a request — удовлетворить просьбу"
      - "to agree to — согласиться на"
    dialogue:
      - "Ana: ¿Aceptó el jefe? | Начальник согласился?"
      - "Pablo: Sí, accedió a nuestra petición. | Да, он согласился на нашу просьбу."
      - "Ana: ¿De verdad? Pensaba que no habría forma. | Правда? Я думала, что никак."
      - "Pablo: Dada la insistencia de todos, no tuvo escapatoria. Accedió y hasta nos felicitó. | Учитывая настойчивость всех, ему некуда было деваться. Согласился и даже нас поздравил."
      - "Ana: ¿Y qué conseguimos exactamente? | И чего именно мы добились?"
      - "Pablo: Un turno más flexible y un día libre al mes. Es algo planteable, dijo. | Более гибкий график и один выходной в месяц. Это допустимо, сказал он."
      - "Ana: Qué alegría. Después de tanto, por fin. | Какая радость. После всего этого наконец-то."
      - "Pablo: Sí. A veces con paciencia y razones, se accede a las peticiones más difíciles. | Да. Иногда терпением и доводами добиваются согласия и в самых трудных просьбах."
    cefr: "C1."
    frequency: "Частое в официальных текстах."
    collocations:
      - "acceder a una petición — удовлетворить просьбу"
      - "acceder a un lugar — получить доступ"
      - "acceder a internet — выйти в интернет"
    collocation_example: "No puedo acceder a mi cuenta. — Я не могу войти в свой аккаунт."
    trap: "Acceder a — «согласиться» и «получить доступ»: acceder a internet. Не путайте с ascender «подниматься» и exceder «превышать»."

  - word: raptar
    ru: похищать
    ipa: /rapˈtaɾ/
    say: рапта́р
    pron: "r в начале — раскатистое; pt читается слитно."
    meaning: "Забрать человека силой: обычно ребёнка или женщину, чтобы получить выкуп. Книжнее, чем secuestrar."
    examples:
      - "Cuando era niña, la raptaron. — Когда она была ребёнком, её похитили."
      - "Lo raptaron cuando volvía a casa del colegio y lo tuvieron encerrado tres días. — Его похитили, когда он возвращался домой из школы, и держали взаперти три дня."
      - "Raptaron a un niño en la plaza mientras su madre hablaba con una vecina en un banco. — Мальчика похитили на площади, пока его мать разговаривала с соседкой на скамейке."
    origin: "Из лат. raptare «хватать», от rapere «похищать». Родственные: rapto «похищение», rapaz «хищный; паренёк», rapiña «грабёж»."
    register: "Формальное, книжное."
    synonyms:
      - word: secuestrar
        pair: ["Raptaron al empresario.", "Secuestraron al empresario."]
        diff:
          - "secuestrar — основное слово в новостях: любое похищение"
          - "raptar — чуть книжнее, чаще о детях и женщинах"
    analogs:
      - "to kidnap — похищать"
      - "to abduct — похитить"
    dialogue:
      - "Hace veinte años, a la salida del colegio, raptaron a un niño del barrio. | Двадцать лет назад у выхода из школы похитили мальчика из нашего района."
      - "Todo el mundo se movilizó: vecinos, policía y voluntarios buscaron durante semanas. | Все мобилизовались: соседи, полиция и волонтёры искали неделями."
      - "La madre, destrozada, no acertaba a dormir ni a comer. | Мать, убитая горем, не могла ни спать, ни есть."
      - "Poco a poco, la esperanza se fue apagando, aunque nunca desapareció del todo. | Понемногу надежда гасла, хотя так и не исчезла совсем."
      - "Veinte años después, apareció un hombre que se parecía mucho al niño desaparecido. | Спустя двадцать лет появился мужчина, очень похожий на пропавшего мальчика."
      - "Una prueba de ADN confirmó lo que su madre siempre había presentido. | Тест ДНК подтвердил то, что мать всегда предчувствовала."
    cefr: "C1."
    frequency: "Нечастое: в новостях и литературе."
    collocations:
      - "raptar a un niño — похитить ребёнка"
      - "el rapto — похищение"
      - "raptor — похититель"
    collocation_example: "El rapto de la joven conmocionó al pueblo. — Похищение девушки потрясло посёлок."
    trap: "Raptar — «похищать человека»; robar — «красть вещи». Перед человеком нужен a: raptar a alguien. Не путайте с rapto «порыв»: «un rapto de ira»."

  - word: inverosímil
    ru: невероятный, неправдоподобный
    ipa: /imbeɾoˈsimil/
    say: имбэроси́миль
    pron: "n перед b звучит как «м»: «имбэро…»; v читается как b."
    meaning: "Такой, что трудно поверить: слишком странный, чтобы быть правдой."
    examples:
      - "Su excusa me parece inverosímil. — Его отговорка кажется мне неправдоподобной."
      - "Me parece inverosímil que no lo supiera, porque todos los vecinos hablaban del tema. — Мне кажется невероятным, что он не знал, потому что об этом говорили все соседи."
      - "La película tiene un final inverosímil, pero aun así, el público salió del cine muy contento. — У фильма неправдоподобная развязка, но всё равно зрители вышли из кино очень довольными."
    origin: "in- «не» + verosímil «правдоподобный» (лат. verisimilis: verus «истинный» + similis «похожий»). Родственные: verdad «правда», semejante «подобный»."
    register: "Формальное, книжное."
    synonyms:
      - word: increíble
        pair: ["Es una excusa inverosímil.", "Es una excusa increíble."]
        diff:
          - "increíble — «невероятный» и в хорошем смысле (потрясающий)"
          - "inverosímil — именно «не похоже на правду», только отрицательно"
    analogs:
      - "implausible — неправдоподобный"
      - "far-fetched — притянутый за уши"
    dialogue:
      - "Ana: ¿Te crees su historia? | Ты веришь его истории?"
      - "Pablo: Me parece inverosímil. | Мне она кажется неправдоподобной."
      - "Ana: ¿Por qué? | Почему?"
      - "Pablo: Dice que estuvo toda la noche en casa, pero un testigo lo vio salir a eso de las doce. | Он говорит, что всю ночь был дома, но свидетель видел, как он выходил около двенадцати."
      - "Ana: Quizá el testigo se equivoca. | Возможно, свидетель ошибается."
      - "Pablo: No lo creo. Además, su razonamiento tiene muchos huecos y no atiende a la lógica. | Не думаю. К тому же его рассуждения полны пробелов и не отвечают логике."
      - "Ana: Entonces es inverosímil de verdad. | Значит, и правда неправдоподобно."
      - "Pablo: Sí, y habrá que desmentirlo con pruebas. | Да, и придётся опровергнуть его доказательствами."
    cefr: "C1."
    frequency: "Частое в текстах."
    collocations:
      - "una excusa inverosímil — неправдоподобная отговорка"
      - "resultar inverosímil — оказаться неправдоподобным"
      - "parecer inverosímil — казаться невероятным"
    collocation_example: "Su coartada resultó inverosímil. — Его алиби оказалось неправдоподобным."
    trap: "Inverosímil — «неправдоподобный» только в плохом смысле, а «потрясающий» — increíble, extraordinario. Противоположное — verosímil."

  - word: hacer caso omiso de
    ru: полностью игнорировать, не обращать внимания
    ipa: /aˈθeɾ ˈkaso oˈmiso de/
    say: асэ́р ка́со оми́со дэ
    pron: "h не читается; c перед e в Испании — [θ]."
    meaning: "Сделать вид, что не слышишь: советы, предупреждения, просьбы. Caso omiso — «пропущенное внимание»."
    examples:
      - "Hizo caso omiso de mis advertencias. — Он проигнорировал мои предупреждения."
      - "El gobierno hizo caso omiso de las protestas, y la situación empeoró en invierno. — Правительство проигнорировало протесты, и зимой ситуация ухудшилась."
      - "Los conductores hicieron caso omiso de la señal y entraron en la calle cortada por las obras. — Водители не обратили внимания на знак и въехали на улицу, перекрытую из-за ремонта."
    origin: "hacer caso «обращать внимание» + omiso «пропущенный» (лат. omissus «опущенный»). Родственные: omitir «пропускать», omisión «пропуск»."
    register: "Формальное, книжное."
    synonyms:
      - word: ignorar
        pair: ["Hizo caso omiso de la orden.", "Ignoró la orden."]
        diff:
          - "ignorar — «игнорировать» в обычной речи"
          - "hacer caso omiso de — громче, подчёркнуто «и ухом не повёл»"
    analogs:
      - "to turn a deaf ear to — пропустить мимо ушей"
      - "to pay no heed to — не обращать внимания"
    dialogue:
      - "Ana: ¿Te escuchó? | Он тебя послушал?"
      - "Pablo: No, hizo caso omiso de mis advertencias. | Нет, он полностью проигнорировал мои предупреждения."
      - "Ana: ¿Y no le importó? | И ему было всё равно?"
      - "Pablo: Ni siquiera me miró. Hizo caso omiso y siguió con lo suyo. | Он даже не посмотрел. Проигнорировал и продолжил своё."
      - "Ana: Qué cabezota. ¿Qué pasó luego? | Какой упрямый. Что было потом?"
      - "Pablo: Se llevó una gran sorpresa cuando todo salió mal. Tuvo que agachar la cabeza. | Он очень удивился, когда всё пошло не так. Ему пришлось опустить голову."
      - "Ana: Eso le pasa por no escuchar. | Так ему и надо за то, что не слушает."
      - "Pablo: Exacto. Quien hace caso omiso de las advertencias paga las consecuencias. | Именно. Кто игнорирует предупреждения, тот расплачивается последствиями."
    cefr: "C1."
    frequency: "Частое в официальных текстах."
    collocations:
      - "hacer caso omiso — проигнорировать"
      - "hacer caso a alguien — послушать кого-то"
      - "no hacer caso — не слушаться"
    collocation_example: "Hizo caso omiso de las normas de seguridad. — Он полностью проигнорировал правила безопасности."
    trap: "Выражение неизменно: «hacer caso omiso de + что-то». Не путайте с hacer caso «послушаться» и omiso «пропущенный»: omiso само по себе не употребляется."

  - word: estar obcecado con
    ru: быть зацикленным на мысли
    ipa: /esˈtaɾ oβθeˈkaðo kon/
    say: эста́р обсэка́до кон
    pron: "bc читается [βθ]; c перед e в Испании — [θ]."
    meaning: "Упрямо держаться одной мысли и не слушать других: человек «ослеплён» идеей. Obcecar — «ослепить»."
    examples:
      - "Está obcecado con una idea absurda. — Он зациклен на нелепой идее."
      - "Durante meses descuidó a su familia, porque estaba obcecado con encontrar al culpable. — Несколько месяцев он пренебрегал семьёй, потому что зациклился на поисках виновного."
      - "No sigas obcecado con ese tema, porque ya hemos hablado de ello mil veces y no hay solución. — Не зацикливайся на этой теме, мы уже тысячу раз об этом говорили, и решения нет."
    origin: "От лат. obcaecare «ослеплять»: ob- + caecus «слепой». Родственные: ceguera «слепота», ciego «слепой»."
    register: "Формальное, книжное."
    synonyms:
      - word: estar empeñado en
        pair: ["Está obcecado con eso.", "Está empeñado en eso."]
        diff:
          - "empeñado en — «упорно добивается», с целью"
          - "obcecado con — «зациклен, не видит ничего другого»"
    analogs:
      - "to be fixated on — зациклиться на"
      - "to be obsessed with — быть одержимым"
    dialogue:
      - "Ana: ¿Por qué no escucha a nadie? | Почему он никого не слушает?"
      - "Pablo: Está obcecado con su plan. | Он зациклен на своём плане."
      - "Ana: ¿Aunque todos le dicen que no funciona? | Хотя все говорят ему, что он не работает?"
      - "Pablo: Aunque se lo demuestren. Está obcecado y no atiende a razones. | Даже когда ему это доказывают. Он упёрся и не слушает доводов."
      - "Ana: Qué agotador. ¿Y tú qué haces? | Как утомительно. А ты что делаешь?"
      - "Pablo: Me armo de paciencia y espero. Alguien obcecado acaba tropezando solo. | Запасаюсь терпением и жду. Кто упёрся, тот в итоге сам споткнётся."
      - "Ana: Con suerte, sin hacerse daño. | Хорошо, если не поранившись."
      - "Pablo: Eso espero. No quiero que se arruine por no escucharnos. | Надеюсь. Не хочу, чтобы он разорился из-за того, что не слушает нас."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "obcecarse con — зациклиться на"
      - "estar obcecado con — быть зацикленным на"
      - "obcecación — упрямая зацикленность"
    collocation_example: "Se obcecó con la idea de que lo engañaban. — Он зациклился на мысли, что его обманывают."
    trap: "С con (или en): estar obcecado con algo. Не путайте с obsesionado «одержимый» и obstinado «упрямый»."

  - word: rescate
    ru: выкуп; спасение
    ipa: /resˈkate/
    say: рэска́тэ
    pron: "r в начале — раскатистое."
    meaning: "Деньги за освобождение похищенного. Ещё — «спасательная операция»: equipo de rescate."
    examples:
      - "Los secuestradores piden un rescate. — Похитители требуют выкуп."
      - "Los bomberos lograron sacar a los excursionistas atrapados en el barranco. — Пожарным удалось вывести туристов, застрявших в ущелье."
      - "El equipo de rescate llegó en una hora y sacó a los excursionistas de la montaña con helicópteros. — Спасательная бригада прибыла через час и вывезла туристов с горы на вертолётах."
    origin: "От rescatar «выкупать, спасать» (re- + lat. captare «хватать»). Родственные: rescatar «спасти», captar «улавливать»."
    register: "Нейтральное."
    synonyms:
      - word: salvamento
        pair: ["Hubo una operación de rescate.", "Hubo una operación de salvamento."]
        diff:
          - "salvamento — «спасение» людей или имущества, чаще на воде и в горах"
          - "rescate — и «спасение», и «выкуп»"
    analogs:
      - "ransom — выкуп"
      - "rescue — спасение"
    dialogue:
      - "Ana: ¿Qué piden los secuestradores? | Чего требуют похитители?"
      - "Pablo: Un rescate de un millón. | Выкуп в миллион."
      - "Ana: ¡Un millón! ¿Y la familia puede pagarlo? | Миллион! И семья может его заплатить?"
      - "Pablo: No lo tienen. Disponen de unos ahorros y una finca, pero no llegan ni a la mitad. | У них нет. Есть сбережения и усадьба, но не хватает даже половины."
      - "Ana: ¿Y qué van a hacer? | И что они будут делать?"
      - "Pablo: La policía les insta a no pagar y a dejar actuar a los expertos. | Полиция настоятельно призывает их не платить и дать работать экспертам."
      - "Ana: Qué angustia. | Какая тревога."
      - "Pablo: Sí, y el tiempo corre. Aguardan una nueva llamada con el corazón en un puño. | Да, и время идёт. Ждут нового звонка, сердце сжимается."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "pagar un rescate — заплатить выкуп"
      - "operación de rescate — спасательная операция"
      - "rescate económico — финансовая помощь"
    collocation_example: "La familia pagó el rescate para liberarlo. — Семья заплатила выкуп, чтобы его освободить."
    trap: "Rescate — «выкуп» и «спасение»: контекст решает. Ещё в экономике: rescate bancario — «спасение банка». Не путайте с rescatar «спасти»."

  - word: anular la voluntad
    ru: подавить волю
    ipa: /anuˈlaɾ la boluntˈad/
    say: ануля́р ла болунта́д
    pron: "v читается как b; d на конце слова мягкое [ð]."
    meaning: "Лишить человека возможности хотеть и решать самому: давлением, страхом, лекарствами. Юридически — «действовать без воли»."
    examples:
      - "Lo drogaron para anular su voluntad. — Его одурманили, чтобы подавить его волю."
      - "El miedo puede anular la voluntad de una persona hasta hacerle aceptar cualquier cosa. — Страх может подавить волю человека настолько, что он согласится на что угодно."
      - "Según el abogado, el acusado actuó bajo presión de un grupo que anuló su voluntad. — По словам адвоката, обвиняемый действовал под давлением группы, которая подавила его волю."
    origin: "anular — от lat. annullare «обращать в ничто» (nullus «никакой»); voluntad — от lat. voluntas «желание, воля». Родственные: nulo «недействительный», querer «хотеть»."
    register: "Формальное, юридическое."
    synonyms:
      - word: someter la voluntad
        pair: ["Quiso anular su voluntad.", "Quiso someter su voluntad."]
        diff:
          - "someter — «подчинить», воля остаётся, но под давлением"
          - "anular — «свести на нет», воли почти не остаётся"
    analogs:
      - "to override someone's will — подавить чью-то волю"
      - "to break one's will — сломить волю"
    dialogue:
      - "Ana: ¿Por qué firmó el documento? | Почему он подписал документ?"
      - "Pablo: Le anularon la voluntad con amenazas. | Ему подавили волю угрозами."
      - "Ana: ¿Quién? | Кто?"
      - "Pablo: Su socio y un desaprensivo que se hizo pasar por abogado. Lo presionaron durante días. | Его партнёр и один беспринципный тип, выдававший себя за адвоката. Они давили на него несколько дней."
      - "Ana: Entonces el contrato no es válido. | Значит, договор недействителен."
      - "Pablo: Eso dictaminó el juez. Cuando se anula la voluntad de alguien, no hay consentimiento real. | Это постановил судья. Когда у человека подавлена воля, настоящего согласия нет."
      - "Ana: ¿Y los culpables? | А виновные?"
      - "Pablo: Se enfrentan a varios años de cárcel. Y ya no pueden esgrimir buena fe. | Им грозит несколько лет тюрьмы. И сослаться на добросовестность они уже не могут."
    cefr: "C1."
    frequency: "Частое в юридических новостях."
    collocations:
      - "anular la voluntad — подавить волю"
      - "anular un contrato — аннулировать договор"
      - "anular una cita — отменить встречу"
    collocation_example: "Tuve que anular la cita por enfermedad. — Мне пришлось отменить встречу из-за болезни."
    trap: "Anular — ещё «аннулировать, отменить»: anular un contrato. Не путайте с anular «безымянный (палец)»: el dedo anular."

  - word: carné de donante de órganos
    ru: карточка донора органов
    ipa: /kaɾˈne de doˈnante de ˈoɾɣanos/
    say: карне́ дэ дона́нтэ дэ о́рганос
    pron: "g перед a — [ɣ]; ударение на ó: órganos."
    meaning: "Документ, где человек подтверждает, что согласен отдать органы после смерти для пересадки."
    examples:
      - "Llevo el carné de donante conmigo. — Я ношу карточку донора с собой."
      - "Tras ver cuántos esperan un trasplante, se hizo el carné de donante de órganos. — Увидев, сколько людей ждут пересадки, он оформил карточку донора органов."
      - "Tener el carné de donante de órganos no obliga a nada, pero es mejor hablarlo con la familia. — Наличие карточки донора органов ни к чему не обязывает, но лучше обсудить это с семьёй."
    origin: "carné — из франц. carnet «книжечка»; donante — от donar «дарить» (лат. donare, от donum «дар»); órgano — греч. organon «орудие»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: tarjeta de donante
        pair: ["Tiene el carné de donante.", "Tiene la tarjeta de donante."]
        diff:
          - "tarjeta de donante — «карточка», более обиходное название"
          - "carné — документ с фотографией или подписью"
    analogs:
      - "organ donor card — карточка донора органов"
      - "donor card — карточка донора"
    dialogue:
      - "Ana: ¿Eres donante de órganos? | Ты донор органов?"
      - "Pablo: Sí, llevo el carné siempre. | Да, всегда ношу карточку."
      - "Ana: Qué generoso. ¿Cuándo lo hiciste? | Как щедро. Когда ты её оформил?"
      - "Pablo: Hace años, tras ver un reportaje en el hospital. Me di cuenta de lo imprescindible que es. | Несколько лет назад, после репортажа в больнице. Я понял, насколько это необходимо."
      - "Ana: Yo nunca me he atrevido. Me da respeto. | Я так и не решилась. Мне страшно."
      - "Pablo: Lo comprendo, pero no reviste ningún riesgo. Y puede salvar vidas. | Понимаю, но это не несёт риска. И может спасти жизни."
      - "Ana: Tienes razón. Voy a informarme cuanto antes. | Ты прав. Узнаю подробности как можно скорее."
      - "Pablo: Te acompaño, si quieres. Y de paso te invito a un café. | Могу пойти с тобой, если хочешь. И заодно угощу кофе."
    cefr: "B2."
    frequency: "Нечастое: в медицинской лексике."
    collocations:
      - "donante de sangre — донор крови"
      - "trasplante de órganos — пересадка органов"
      - "donar órganos — пожертвовать органы"
    collocation_example: "Donar sangre puede salvar vidas. — Сдача крови может спасти жизни."
    trap: "Донор по-испански — donante (общий род): el/la donante. Не путайте с donativo «пожертвование» и dona «пончик» (в Латинской Америке)."

  - word: desaprensivo
    ru: бессовестный, беспринципный
    ipa: /desapɾenˈsiβo/
    say: дэсапрэнси́бо
    pron: "v читается как b; ударение на si."
    meaning: "О человеке: не задумывающийся о чужих чувствах и о правилах: равнодушно причиняет вред. Сильнее, чем «наглый»."
    examples:
      - "Qué desaprensivo, no piensa en nadie. — Какой бессовестный, он ни о ком не думает."
      - "Al saltarse un semáforo en rojo, causó el accidente un conductor desaprensivo. — Проехав на красный свет, аварию вызвал беспринципный водитель."
      - "Es un desaprensivo que solo piensa en el dinero y no le importa a quién engaña. — Это бессовестный человек, который думает только о деньгах и которому всё равно, кого он обманывает."
    origin: "des- «не» + aprensivo «боязливый, обеспокоенный» (от aprensión «опасение»). «Без опасений», то есть без совести."
    register: "Формальное, пренебрежительное."
    synonyms:
      - word: sinvergüenza
        pair: ["Es un desaprensivo.", "Es un sinvergüenza."]
        diff:
          - "sinvergüenza — «бесстыжий», разговорное, с оттенком возмущения"
          - "desaprensivo — «бессовестный, без угрызений», суше и строже"
    analogs:
      - "unscrupulous — беспринципный"
      - "callous — бессердечный"
    dialogue:
      - "Ana: ¿Quién dejó la basura aquí? | Кто оставил здесь мусор?"
      - "Pablo: Algún desaprensivo, claro. | Какой-нибудь беспринципный тип, конечно."
      - "Ana: Qué asco. Con lo limpio que estaba el parque. | Какая мерзость. А парк был таким чистым."
      - "Pablo: Hay gente que no piensa en nadie. Tiran bolsas, latas y hasta muebles viejos. | Есть люди, которые ни о ком не думают. Выбрасывают пакеты, банки и даже старую мебель."
      - "Ana: ¿Y la policía no hace nada? | И полиция ничего не делает?"
      - "Pablo: Ha reforzado la vigilancia, pero no puede estar en todas partes. | Усилила наблюдение, но не может быть везде."
      - "Ana: Entonces habrá que denunciarlo nosotros. | Тогда придётся заявлять самим."
      - "Pablo: Sí, y quitar la basura cuanto antes, por si hace daño a los niños. | Да, и убрать мусор как можно скорее, вдруг навредит детям."
    cefr: "C1."
    frequency: "Частое в новостях и публицистике."
    collocations:
      - "un desaprensivo — бессовестный человек"
      - "un conductor desaprensivo — безответственный водитель"
      - "un comportamiento desaprensivo — бессовестное поведение"
    collocation_example: "Los desaprensivos que abandonan animales deberían ser castigados. — Бессовестных людей, бросающих животных, следует наказывать."
    trap: "Ложный друг: не «не боящийся», а «бессовестный». Не путайте с aprensivo «мнительный» (противоположное по корню)."

  - word: prevenir de
    ru: предупредить кого-то о чём-то
    ipa: /pɾeβeˈniɾ de/
    say: прэбэни́р дэ
    pron: "v читается как b; спрягается как venir: prevengo, previenes."
    meaning: "Сообщить заранее об опасности: «prevenir a alguien de algo». Ещё — «предотвращать»: prevenir un accidente."
    examples:
      - "Nos previnieron del peligro a tiempo. — Нас вовремя предупредили об опасности."
      - "Sobre todo si hay niños pequeños, hay que prevenir los accidentes en casa. — Особенно если есть маленькие дети, нужно предотвращать несчастные случаи дома."
      - "Me previno de que no confiara en él, pero no le hice caso y ahora lo lamento. — Он предупредил меня, чтобы я ему не доверял, но я его не послушал и теперь жалею об этом."
    origin: "Из лат. praevenire «опережать»: prae- «перед» + venire «приходить». Родственные: venir «приходить», prevención «профилактика»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: advertir
        pair: ["Me previno del peligro.", "Me advirtió del peligro."]
        diff:
          - "advertir — «предостеречь, заметить»"
          - "prevenir — «предупредить заранее», ещё и «предотвратить»"
    analogs:
      - "to warn — предупредить"
      - "to prevent — предотвратить"
    dialogue:
      - "Ana: ¿Te avisaron? | Тебя предупредили?"
      - "Pablo: Sí, me previnieron del riesgo. | Да, меня предупредили о риске."
      - "Ana: ¿Quién? | Кто?"
      - "Pablo: Un amigo del banco, sin previo aviso. Me hizo saber que habían detectado un movimiento raro. | Друг из банка, без предупреждения. Дал знать, что обнаружили странное движение."
      - "Ana: Qué suerte tener a alguien así. | Повезло, что есть такой человек."
      - "Pablo: Sí. Gracias a su advertencia, cambié la contraseña a tiempo. | Да. Благодаря его предупреждению я вовремя сменил пароль."
      - "Ana: ¿Y el dinero? | А деньги?"
      - "Pablo: Todo en orden. Mejor prevenir que lamentar. | Всё в порядке. Лучше предупредить, чем жалеть."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "prevenir a alguien de algo — предупредить о чём-то"
      - "prevenir una enfermedad — предотвратить болезнь"
      - "más vale prevenir que curar — лучше предупредить, чем лечить"
    collocation_example: "Más vale prevenir que curar. — Лучше предупредить, чем лечить."
    trap: "Спрягается как venir: prevengo, previno. Prevenir — «предупредить» и «предотвратить»; не путайте с prever «предвидеть»."

  - word: tomadura de pelo
    ru: издевательство, насмешка
    ipa: /tomaˈðuɾa de ˈpelo/
    say: тома́дура дэ пэ́ло
    pron: "d между гласными мягкое [ð]."
    meaning: "Когда над человеком шутят и водят его за нос: насмешка, неуважение. «Es una tomadura de pelo» — «Это издёвка»."
    examples:
      - "Esto es una tomadura de pelo. — Это издевательство."
      - "Pagar tanto por un servicio tan malo me parece una auténtica tomadura de pelo. — Платить так много за такую плохую услугу мне кажется настоящим издевательством."
      - "Me dio una respuesta que fue una tomadura de pelo, y por eso decidí no volver a ese sitio. — Он дал мне ответ, который был насмешкой, и поэтому я решил больше не возвращаться в то место."
    origin: "tomar el pelo «водить за нос» (дословно «хватать за волосы»): образ насмешки, когда человека дёргают за волосы. Tomadura — существительное от tomar."
    register: "Разговорное."
    synonyms:
      - word: burla
        pair: ["Fue una tomadura de pelo.", "Fue una burla."]
        diff:
          - "burla — «насмешка», обидная"
          - "tomadura de pelo — «водить за нос», обман пополам с издёвкой"
    analogs:
      - "a rip-off — обдираловка, обман"
      - "a mockery — издёвка"
    dialogue:
      - "Ana: ¿Qué te parece la oferta? | Что ты думаешь о предложении?"
      - "Pablo: ¡Es una tomadura de pelo! | Это издевательство!"
      - "Ana: ¿Tan mala es? | Настолько плохо?"
      - "Pablo: Quieren que trabaje doce horas por el sueldo de seis, y encima en efectivo y sin contrato. | Хотят, чтобы я работал двенадцать часов за зарплату шести, да ещё наличными и без контракта."
      - "Ana: Eso es economía sumergida. | Это теневая экономика."
      - "Pablo: Exacto. Una auténtica tomadura de pelo. Los desaprensivos se aprovechan de la gente desesperada. | Именно. Настоящее издевательство. Беспринципные люди пользуются отчаявшимися."
      - "Ana: ¿Vas a aceptar? | Ты примешь?"
      - "Pablo: Ni de broma. No pienso agachar la cabeza ante algo así. | Ни за что. Не собираюсь опускать голову перед таким."
    cefr: "C1."
    frequency: "Частое в разговоре."
    collocations:
      - "tomar el pelo a alguien — подшучивать над кем-то"
      - "una tomadura de pelo — издёвка"
      - "¿Me estás tomando el pelo? — Ты меня разыгрываешь?"
    collocation_example: "¿Me estás tomando el pelo? No puede ser verdad. — Ты меня разыгрываешь? Не может быть."
    trap: "Tomar el pelo — «разыграть, посмеяться»: без злого умысла. Tomadura de pelo — чаще злая: «издёвка». Не путайте pelo «волос» с pelea «драка»."
