# Пятый список автора, часть 6 — «Desconcierto en el hospital 5» (слова 12–22).
lang: es
words:
  - word: acceder a la petición
    ru: согласиться на просьбу
    ipa: /akθeˈðeɾ a la peˈtiθjon/
    say: акссэдэ́р а ла пэтисьо́н
    pron: "cc читается [kθ]: acceder — «акс-сэ-дэ́р»; d между гласными мягкое [ð]; c перед i в Испании — [θ]."
    meaning: "Дать своё согласие на то, о чём просили. Чаще в официальной речи."
    examples:
      - "El director accedió a la petición de los empleados. — Директор согласился на просьбу сотрудников."
      - "No accedió a mi petición. — Он не согласился на мою просьбу."
    origin: "Из лат. accedere «подходить»: ad- «к» + cedere «идти». Родственные: acceso «доступ», ceder «уступать»."
    register: "Формальное."
    synonyms:
      - word: aceptar
        pair: ["Accedió a la petición.", "Aceptó la petición."]
        diff:
          - "aceptar — просто «принять»"
          - "acceder a — «согласиться на просьбу, уступить», с оттенком снисхождения"
    analogs:
      - "to grant a request — удовлетворить просьбу"
      - "to agree to — согласиться на"
    dialogue:
      - "Ana: ¿Aceptó el jefe? | Начальник согласился?"
      - "Pablo: Sí, accedió a nuestra petición. | Да, он удовлетворил нашу просьбу."
    cefr: "C1."
    frequency: "Частое в официальных текстах."
    collocations:
      - "acceder a una petición — удовлетворить просьбу"
      - "acceder a un lugar — получить доступ"
      - "acceder a internet — выйти в интернет"
    collocation_example: "No puedo acceder a mi cuenta. — Я не могу войти в свой аккаунт."
    trap: "Acceder a — «согласиться» и «получить доступ»: acceder a internet. Не путайте с ascender «подниматься» и exceder «превышать»."

  - word: raptar
    ru: похищать
    ipa: /rapˈtaɾ/
    say: рапта́р
    pron: "r в начале — раскатистое; pt читается слитно."
    meaning: "Забрать человека силой: обычно ребёнка или женщину, чтобы получить выкуп. Книжнее, чем secuestrar."
    examples:
      - "Raptaron a un niño en la plaza. — Ребёнка похитили на площади."
      - "Lo raptaron cuando volvía a casa. — Его похитили, когда он возвращался домой."
    origin: "Из лат. raptare «хватать», от rapere «похищать». Родственные: rapto «похищение», rapaz «хищный; паренёк», rapiña «грабёж»."
    register: "Формальное, книжное."
    synonyms:
      - word: secuestrar
        pair: ["Raptaron al empresario.", "Secuestraron al empresario."]
        diff:
          - "secuestrar — основное слово в новостях: любое похищение"
          - "raptar — чуть книжнее, чаще о детях и женщинах"
    analogs:
      - "to kidnap — похищать"
      - "to abduct — похитить"
    dialogue:
      - "Ana: ¿Qué pasó con el niño? | Что с мальчиком?"
      - "Pablo: Lo raptaron a la salida del colegio. | Его похитили у выхода из школы."
    cefr: "C1."
    frequency: "Нечастое: в новостях и литературе."
    collocations:
      - "raptar a un niño — похитить ребёнка"
      - "el rapto — похищение"
      - "raptor — похититель"
    collocation_example: "El rapto de la joven conmocionó al pueblo. — Похищение девушки потрясло посёлок."
    trap: "Raptar — «похищать человека»; robar — «красть вещи». Перед человеком нужен a: raptar a alguien. Не путайте с rapto «порыв»: «un rapto de ira»."

  - word: inverosímil
    ru: невероятный, неправдоподобный
    ipa: /imbeɾoˈsimil/
    say: имбэроси́миль
    pron: "n перед b звучит как «м»: «имбэро…»; v читается как b."
    meaning: "Такой, что трудно поверить: слишком странный, чтобы быть правдой."
    examples:
      - "Su historia es inverosímil. — Его история неправдоподобна."
      - "Me parece inverosímil que no lo supiera. — Мне кажется невероятным, что он не знал."
    origin: "in- «не» + verosímil «правдоподобный» (лат. verisimilis: verus «истинный» + similis «похожий»). Родственные: verdad «правда», semejante «подобный»."
    register: "Формальное, книжное."
    synonyms:
      - word: increíble
        pair: ["Es una excusa inverosímil.", "Es una excusa increíble."]
        diff:
          - "increíble — «невероятный» и в хорошем смысле (потрясающий)"
          - "inverosímil — именно «не похоже на правду», только отрицательно"
    analogs:
      - "implausible — неправдоподобный"
      - "far-fetched — притянутый за уши"
    dialogue:
      - "Ana: ¿Te crees su historia? | Ты веришь его истории?"
      - "Pablo: Me parece inverosímil. | Мне она кажется неправдоподобной."
    cefr: "C1."
    frequency: "Частое в текстах."
    collocations:
      - "una excusa inverosímil — неправдоподобная отговорка"
      - "resultar inverosímil — оказаться неправдоподобным"
      - "parecer inverosímil — казаться невероятным"
    collocation_example: "Su coartada resultó inverosímil. — Его алиби оказалось неправдоподобным."
    trap: "Inverosímil — «неправдоподобный» только в плохом смысле, а «потрясающий» — increíble, extraordinario. Противоположное — verosímil."

  - word: hacer caso omiso de
    ru: полностью игнорировать, не обращать внимания
    ipa: /aˈθeɾ ˈkaso oˈmiso de/
    say: асэ́р ка́со оми́со дэ
    pron: "h не читается; c перед e в Испании — [θ]."
    meaning: "Сделать вид, что не слышишь: советы, предупреждения, просьбы. Caso omiso — «пропущенное внимание»."
    examples:
      - "Hizo caso omiso de mis advertencias. — Он проигнорировал мои предупреждения."
      - "Nadie hizo caso omiso de la señal. — Никто не проигнорировал сигнал."
    origin: "hacer caso «обращать внимание» + omiso «пропущенный» (лат. omissus «опущенный»). Родственные: omitir «пропускать», omisión «пропуск»."
    register: "Формальное, книжное."
    synonyms:
      - word: ignorar
        pair: ["Hizo caso omiso de la orden.", "Ignoró la orden."]
        diff:
          - "ignorar — «игнорировать» в обычной речи"
          - "hacer caso omiso de — громче, подчёркнуто «и ухом не повёл»"
    analogs:
      - "to turn a deaf ear to — пропустить мимо ушей"
      - "to pay no heed to — не обращать внимания"
    dialogue:
      - "Ana: ¿Te escuchó? | Он тебя послушал?"
      - "Pablo: No, hizo caso omiso de todo. | Нет, он всё проигнорировал."
    cefr: "C1."
    frequency: "Частое в официальных текстах."
    collocations:
      - "hacer caso omiso — проигнорировать"
      - "hacer caso a alguien — послушать кого-то"
      - "no hacer caso — не слушаться"
    collocation_example: "Hizo caso omiso de las normas de seguridad. — Он полностью проигнорировал правила безопасности."
    trap: "Выражение неизменно: «hacer caso omiso de + что-то». Не путайте с hacer caso «послушаться» и omiso «пропущенный»: omiso само по себе не употребляется."

  - word: estar obcecado con
    ru: быть зацикленным на мысли
    ipa: /esˈtaɾ oβθeˈkaðo kon/
    say: эста́р обсэка́до кон
    pron: "bc читается [βθ]; c перед e в Испании — [θ]."
    meaning: "Упрямо держаться одной мысли и не слушать других: человек «ослеплён» идеей. Obcecar — «ослепить»."
    examples:
      - "Está obcecado con la idea de venganza. — Он зациклен на мысли о мести."
      - "No sigas obcecado con ese tema. — Не зацикливайся на этой теме."
    origin: "От лат. obcaecare «ослеплять»: ob- + caecus «слепой». Родственные: ceguera «слепота», ciego «слепой»."
    register: "Формальное, книжное."
    synonyms:
      - word: estar empeñado en
        pair: ["Está obcecado con eso.", "Está empeñado en eso."]
        diff:
          - "empeñado en — «упорно добивается», с целью"
          - "obcecado con — «зациклен, не видит ничего другого»"
    analogs:
      - "to be fixated on — зациклиться на"
      - "to be obsessed with — быть одержимым"
    dialogue:
      - "Ana: ¿Por qué no escucha a nadie? | Почему он никого не слушает?"
      - "Pablo: Está obcecado con su plan. | Он зациклен на своём плане."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "obcecarse con — зациклиться на"
      - "estar obcecado con — быть зацикленным на"
      - "obcecación — упрямая зацикленность"
    collocation_example: "Se obcecó con la idea de que lo engañaban. — Он зациклился на мысли, что его обманывают."
    trap: "С con (или en): estar obcecado con algo. Не путайте с obsesionado «одержимый» и obstinado «упрямый»."

  - word: rescate
    ru: выкуп; спасение
    ipa: /resˈkate/
    say: рэска́тэ
    pron: "r в начале — раскатистое."
    meaning: "Деньги за освобождение похищенного. Ещё — «спасательная операция»: equipo de rescate."
    examples:
      - "Los secuestradores piden un rescate. — Похитители требуют выкуп."
      - "El equipo de rescate llegó en una hora. — Спасательная команда прибыла за час."
    origin: "От rescatar «выкупать, спасать» (re- + lat. captare «хватать»). Родственные: rescatar «спасти», captar «улавливать»."
    register: "Нейтральное."
    synonyms:
      - word: salvamento
        pair: ["Hubo una operación de rescate.", "Hubo una operación de salvamento."]
        diff:
          - "salvamento — «спасение» людей или имущества, чаще на воде и в горах"
          - "rescate — и «спасение», и «выкуп»"
    analogs:
      - "ransom — выкуп"
      - "rescue — спасение"
    dialogue:
      - "Ana: ¿Qué piden los secuestradores? | Чего хотят похитители?"
      - "Pablo: Un rescate de un millón. | Выкуп в миллион."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "pagar un rescate — заплатить выкуп"
      - "operación de rescate — спасательная операция"
      - "rescate económico — финансовая помощь"
    collocation_example: "La familia pagó el rescate para liberarlo. — Семья заплатила выкуп, чтобы его освободить."
    trap: "Rescate — «выкуп» и «спасение»: контекст решает. Ещё в экономике: rescate bancario — «спасение банка». Не путайте с rescatar «спасти»."

  - word: anular la voluntad
    ru: подавить волю
    ipa: /anuˈlaɾ la boluntˈad/
    say: ануля́р ла болунта́д
    pron: "v читается как b; d на конце слова мягкое [ð]."
    meaning: "Лишить человека возможности хотеть и решать самому: давлением, страхом, лекарствами. Юридически — «действовать без воли»."
    examples:
      - "Lo drogaron para anular su voluntad. — Его одурманили, чтобы подавить его волю."
      - "El miedo puede anular la voluntad. — Страх может подавить волю."
    origin: "anular — от lat. annullare «обращать в ничто» (nullus «никакой»); voluntad — от lat. voluntas «желание, воля». Родственные: nulo «недействительный», querer «хотеть»."
    register: "Формальное, юридическое."
    synonyms:
      - word: someter la voluntad
        pair: ["Quiso anular su voluntad.", "Quiso someter su voluntad."]
        diff:
          - "someter — «подчинить», воля остаётся, но под давлением"
          - "anular — «свести на нет», воли почти не остаётся"
    analogs:
      - "to override someone's will — подавить чью-то волю"
      - "to break one's will — сломить волю"
    dialogue:
      - "Ana: ¿Por qué firmó el documento? | Почему он подписал документ?"
      - "Pablo: Le anularon la voluntad con amenazas. | Ему подавили волю угрозами."
    cefr: "C1."
    frequency: "Частое в юридических новостях."
    collocations:
      - "anular la voluntad — подавить волю"
      - "anular un contrato — аннулировать договор"
      - "anular una cita — отменить встречу"
    collocation_example: "Tuve que anular la cita por enfermedad. — Мне пришлось отменить встречу из-за болезни."
    trap: "Anular — ещё «аннулировать, отменить»: anular un contrato. Не путайте с anular «безымянный (палец)»: el dedo anular."

  - word: carné de donante de órganos
    ru: карточка донора органов
    ipa: /kaɾˈne de doˈnante de ˈoɾɣanos/
    say: карне́ дэ дона́нтэ дэ о́рганос
    pron: "g перед a — [ɣ]; ударение на ó: órganos."
    meaning: "Документ, где человек подтверждает, что согласен отдать органы после смерти для пересадки."
    examples:
      - "Llevo el carné de donante de órganos en la cartera. — Я ношу карточку донора органов в кошельке."
      - "Se hizo el carné de donante de órganos. — Он оформил карточку донора органов."
    origin: "carné — из франц. carnet «книжечка»; donante — от donar «дарить» (лат. donare, от donum «дар»); órgano — греч. organon «орудие»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: tarjeta de donante
        pair: ["Tiene el carné de donante.", "Tiene la tarjeta de donante."]
        diff:
          - "tarjeta de donante — «карточка», более обиходное название"
          - "carné — документ с фотографией или подписью"
    analogs:
      - "organ donor card — карточка донора органов"
      - "donor card — карточка донора"
    dialogue:
      - "Ana: ¿Eres donante de órganos? | Ты донор органов?"
      - "Pablo: Sí, llevo el carné siempre conmigo. | Да, ношу карточку всегда с собой."
    cefr: "B2."
    frequency: "Нечастое: в медицинской лексике."
    collocations:
      - "donante de sangre — донор крови"
      - "trasplante de órganos — пересадка органов"
      - "donar órganos — пожертвовать органы"
    collocation_example: "Donar sangre puede salvar vidas. — Сдача крови может спасти жизни."
    trap: "Донор по-испански — donante (общий род): el/la donante. Не путайте с donativo «пожертвование» и dona «пончик» (в Латинской Америке)."

  - word: desaprensivo
    ru: бессовестный, беспринципный
    ipa: /desapɾenˈsiβo/
    say: дэсапрэнси́бо
    pron: "v читается как b; ударение на si."
    meaning: "О человеке: не задумывающийся о чужих чувствах и о правилах: равнодушно причиняет вред. Сильнее, чем «наглый»."
    examples:
      - "Es un desaprensivo que solo piensa en el dinero. — Это бессовестный тип, который думает только о деньгах."
      - "Un conductor desaprensivo causó el accidente. — Беспринципный водитель стал причиной аварии."
    origin: "des- «не» + aprensivo «боязливый, обеспокоенный» (от aprensión «опасение»). «Без опасений», то есть без совести."
    register: "Формальное, пренебрежительное."
    synonyms:
      - word: sinvergüenza
        pair: ["Es un desaprensivo.", "Es un sinvergüenza."]
        diff:
          - "sinvergüenza — «бесстыжий», разговорное, с оттенком возмущения"
          - "desaprensivo — «бессовестный, без угрызений», суше и строже"
    analogs:
      - "unscrupulous — беспринципный"
      - "callous — бессердечный"
    dialogue:
      - "Ana: ¿Quién dejó la basura aquí? | Кто оставил мусор здесь?"
      - "Pablo: Algún desaprensivo, claro. | Какой-нибудь бессовестный, конечно."
    cefr: "C1."
    frequency: "Частое в новостях и публицистике."
    collocations:
      - "un desaprensivo — бессовестный человек"
      - "un conductor desaprensivo — безответственный водитель"
      - "un comportamiento desaprensivo — бессовестное поведение"
    collocation_example: "Los desaprensivos que abandonan animales deberían ser castigados. — Бессовестных людей, бросающих животных, следует наказывать."
    trap: "Ложный друг: не «не боящийся», а «бессовестный». Не путайте с aprensivo «мнительный» (противоположное по корню)."

  - word: prevenir de
    ru: предупредить кого-то о чём-то
    ipa: /pɾeβeˈniɾ de/
    say: прэбэни́р дэ
    pron: "v читается как b; спрягается как venir: prevengo, previenes."
    meaning: "Сообщить заранее об опасности: «prevenir a alguien de algo». Ещё — «предотвращать»: prevenir un accidente."
    examples:
      - "Me previno de que no confiara en él. — Он предупредил меня, чтобы я ему не доверял."
      - "Hay que prevenir los accidentes. — Нужно предотвращать аварии."
    origin: "Из лат. praevenire «опережать»: prae- «перед» + venire «приходить». Родственные: venir «приходить», prevención «профилактика»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: advertir
        pair: ["Me previno del peligro.", "Me advirtió del peligro."]
        diff:
          - "advertir — «предостеречь, заметить»"
          - "prevenir — «предупредить заранее», ещё и «предотвратить»"
    analogs:
      - "to warn — предупредить"
      - "to prevent — предотвратить"
    dialogue:
      - "Ana: ¿Te avisaron? | Тебя предупредили?"
      - "Pablo: Sí, me previnieron del riesgo. | Да, меня предупредили о риске."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "prevenir a alguien de algo — предупредить о чём-то"
      - "prevenir una enfermedad — предотвратить болезнь"
      - "más vale prevenir que curar — лучше предупредить, чем лечить"
    collocation_example: "Más vale prevenir que curar. — Лучше предупредить, чем лечить."
    trap: "Спрягается как venir: prevengo, previno. Prevenir — «предупредить» и «предотвратить»; не путайте с prever «предвидеть»."

  - word: tomadura de pelo
    ru: издевательство, насмешка
    ipa: /tomaˈðuɾa de ˈpelo/
    say: тома́дура дэ пэ́ло
    pron: "d между гласными мягкое [ð]."
    meaning: "Когда над человеком шутят и водят его за нос: насмешка, неуважение. «Es una tomadura de pelo» — «Это издёвка»."
    examples:
      - "Esto es una tomadura de pelo. — Это издевательство."
      - "Me dio una respuesta que fue una tomadura de pelo. — Он дал мне ответ, который был просто насмешкой."
    origin: "tomar el pelo «водить за нос» (дословно «хватать за волосы»): образ насмешки, когда человека дёргают за волосы. Tomadura — существительное от tomar."
    register: "Разговорное."
    synonyms:
      - word: burla
        pair: ["Fue una tomadura de pelo.", "Fue una burla."]
        diff:
          - "burla — «насмешка», обидная"
          - "tomadura de pelo — «водить за нос», обман пополам с издёвкой"
    analogs:
      - "a rip-off — обдираловка, обман"
      - "a mockery — издёвка"
    dialogue:
      - "Ana: ¿Qué te parece la oferta? | Как тебе предложение?"
      - "Pablo: ¡Es una tomadura de pelo! | Это издёвка!"
    cefr: "C1."
    frequency: "Частое в разговоре."
    collocations:
      - "tomar el pelo a alguien — подшучивать над кем-то"
      - "una tomadura de pelo — издёвка"
