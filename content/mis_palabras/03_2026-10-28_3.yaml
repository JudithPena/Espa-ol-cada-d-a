# Третий список автора, часть 3 — «Desconcierto en el hospital», глава 1 (слова 36–48).
lang: es
words:
  - word: presentir
    ru: предчувствовать
    ipa: /presenˈtiɾ/
    say: прэсэнти́р
    pron: "Спрягается e → ie: presiento, presientes (как sentir)."
    meaning: "Чувствовать заранее, что что-то случится, ещё до того, как это стало видно."
    examples:
      - "Presentía que algo malo iba a pasar. — Я предчувствовал, что случится что-то плохое."
      - "Presiento que va a llover. — Чувствую, что пойдёт дождь."
    origin: "pre- «до, заранее» + sentir «чувствовать» (лат. sentire). Родственное — presentimiento «предчувствие»."
    register: "Нейтральное, чуть литературное."
    synonyms:
      - word: intuir
        pair: ["Presentí el peligro.", "Intuí el peligro."]
        diff:
          - "intuir — понять чутьём, без доказательств; не обязательно про будущее"
          - "presentir — именно ощутить, что что-то случится"
    analogs:
      - "to have a feeling — предчувствовать"
      - "to sense — чувствовать, ощущать"
    dialogue:
      - "Ana: ¿Cómo lo sabías? | Откуда ты знал?"
      - "Pablo: Lo presentí, no sé por qué. | Предчувствовал, не знаю почему."
    cefr: "C1."
    frequency: "Средней частоты: в рассказах и повседневной речи."
    collocations:
      - "presentir un peligro — предчувствовать опасность"
      - "presentir que… — чувствовать, что…"
      - "un mal presentimiento — дурное предчувствие"
    collocation_example: "Tengo el presentimiento de que algo va mal. — У меня предчувствие, что что-то идёт не так."
    trap: "После presentir que при прошедшем рассказе нужен imperfecto: presentía que iba a pasar. Спрягается как sentir: presiento, а не presento."

  - word: lío
    ru: путаница, неразбериха; неприятность
    ipa: /ˈlio/
    say: ли́о
    pron: "Два слога: ли́-о, ударение на i. Если написать без ударения, получится lio — одним слогом."
    meaning: "Путаница, беспорядок, неприятная ситуация, в которую можно влипнуть. Ещё — «роман, интрижка» (разговорное)."
    examples:
      - "Menudo lío hay en la oficina. — Какая суматоха в офисе!"
      - "Me he metido en un lío. — Я влип в историю."
      - "Tiene un lío con una compañera. — У него интрижка с коллегой."
    origin: "От liar «связывать, обвязывать, запутывать» (лат. ligare «связывать»). Образ: всё «связалось в узел»."
    register: "Разговорное."
    synonyms:
      - word: follón
        pair: ["Qué lío hay en la calle.", "Qué follón hay en la calle."]
        diff:
          - "follón — шумный беспорядок и шумиха"
          - "lío — путаница и сложное положение, не всегда шумное"
    analogs:
      - "mess — беспорядок"
      - "trouble — неприятность"
    dialogue:
      - "Ana: ¿Qué te pasa? | Что с тобой?"
      - "Pablo: Estoy en un lío con el seguro. | Я запутался со страховкой."
    cefr: "B1."
    frequency: "Очень частое в разговоре."
    collocations:
      - "meterse en un lío — влипнуть в историю"
      - "armar un lío — устроить неразбериху"
      - "hacerse un lío — запутаться"
      - "menudo lío — вот это бардак"
    collocation_example: "Me hice un lío con los horarios. — Я запутался в расписании."
    trap: "Ударение на i обязательно: lío. Выражение hacerse un lío значит «запутаться», а не «устроить беспорядок»: За беспорядок отвечает armar un lío."

  - word: tener para rato
    ru: это надолго, придётся долго ждать
    ipa: /teˈneɾ ˈpaɾa ˈrato/
    say: тэнэ́р па́ра ра́то
    pron: "r в начале rato — раскатистое."
    meaning: "Скоро это не закончится: «ждать долго», «это на долгое время». Rato — «некоторое время»."
    examples:
      - "Todavía tengo para rato. — Мне ещё долго."
      - "Con tanta gente, vamos a tener para rato. — С таким количеством людей мы тут надолго."
    origin: "tener «иметь» + para «на» + rato «некоторое время». То есть «иметь времени надолго»: тебе предстоит долго."
    register: "Разговорное."
    synonyms:
      - word: ir para largo
        pair: ["Esto tiene para rato.", "Esto va para largo."]
        diff:
          - "ir para largo — «затянется надолго», безлично о ситуации"
          - "tener para rato — обычно о том, сколько ждать человеку"
    analogs:
      - "to be in for a long wait — ждать долго"
      - "to have a long way to go — предстоит долго"
    dialogue:
      - "Ana: ¿Falta mucho para tu turno? | До твоей очереди ещё далеко?"
      - "Pablo: Sí, tengo para rato. | Да, мне ещё долго."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "tener para rato — быть надолго"
      - "para rato — надолго"
      - "un rato largo — долгое время"
    collocation_example: "No me esperes, que tengo para rato. — Не жди меня, мне ещё долго."
    trap: "Выражение неизменно: tengo, tienes, tiene para rato. Не путайте с un rato «немного времени»: «Espera un rato» — «подожди немного»."

  - word: pese a todo
    ru: несмотря ни на что
    ipa: /ˈpese a ˈtoðo/
    say: пэ́сэ а то́до
    pron: "d между гласными мягкое [ð]: «то́до»."
    meaning: "Вопреки трудностям, всему плохому, что произошло. Оборот из письменной речи."
    examples:
      - "Pese a todo, seguimos adelante. — Несмотря ни на что, мы продолжаем."
      - "Pese a todo, sonreía. — Несмотря ни на что, она улыбалась."
    origin: "pese — форма глагола pesar «весить, быть тяжким» в subjuntivo («пусть тяжело»). Дословно «пусть всё тяжело»: «хоть всё и против»."
    register: "Формальное, книжное; в разговоре чаще a pesar de todo."
    synonyms:
      - word: a pesar de todo
        pair: ["Pese a todo, ganó el partido.", "A pesar de todo, ganó el partido."]
        diff:
          - "a pesar de todo — стандартная разговорная форма"
          - "pese a todo — короче и книжнее"
    analogs:
      - "in spite of everything — несмотря ни на что"
      - "despite everything — то же, но короче"
    dialogue:
      - "Ana: ¿Cómo está tu padre? | Как твой отец?"
      - "Pablo: Pese a todo, está animado. | Несмотря ни на что, он бодр."
    cefr: "C1."
    frequency: "Частое в газетах и прозе."
    collocations:
      - "pese a que + indicativo — несмотря на то, что…"
      - "pese a ello — несмотря на это"
      - "pese a todo — несмотря ни на что"
    collocation_example: "Pese a que llovía, salimos a pasear. — Несмотря на дождь, мы пошли гулять."
    trap: "Не путайте с a pesar de: после pese нет a и de. Но с глаголом нужен que: pese a que estaba cansado, а не «pese que»."

  - word: dar de alta
    ru: выписать из больницы
    ipa: /ˈdaɾ de ˈalta/
    say: дар дэ а́льта
    pron: "d между гласными мягкое [ð]: dar de alta."
    meaning: "Объявить, что больной выздоровел и может идти домой. Ещё — «зарегистрировать» (в налоговой, на работе)."
    examples:
      - "Mañana le dan el alta. — Завтра его выпишут."
      - "Me dieron de alta ayer. — Меня выписали вчера."
      - "Se dio de alta como autónomo. — Он зарегистрировался как самозанятый."
    origin: "Существительное alta — «выписка; регистрация»: человека как будто снова «записывают в строй». Противоположное — dar de baja «снять с учёта, оформить больничный»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: dar el alta
        pair: ["Lo dieron de alta ayer.", "Le dieron el alta ayer."]
        diff:
          - "dar el alta — то же значение, но человек в dativo: le dan el alta"
          - "dar de alta — человек в винительном: lo dan de alta"
    analogs:
      - "to discharge — выписать"
      - "to release — отпустить"
    dialogue:
      - "Ana: ¿Cuándo sales del hospital? | Когда тебя выпишут?"
      - "Pablo: Mañana me dan el alta. | Завтра меня выписывают."
    cefr: "B2."
    frequency: "Очень частое в разговорах о больнице."
    collocations:
      - "dar el alta — выписать"
      - "recibir el alta — получить выписку"
      - "darse de alta — зарегистрироваться"
      - "el alta médica — выписка"
    collocation_example: "Recibió el alta médica esta mañana. — Он получил выписку сегодня утром."
    trap: "Alta женского рода, но артикль el: el alta (как el agua). В выражении с человеком — либо lo dieron de alta, либо le dieron el alta, не смешивайте."

  - word: fluidez en el trabajo
    ru: слаженность, плавность в работе
    ipa: /flwiˈðeθ en el tɾaˈβaxo/
    say: фльуидэ́с эн эль траба́хо
    pron: "ui — один слог «уи»; z на конце в Испании — [θ]; j — «х»."
    meaning: "Когда рабочий процесс идёт без заминок: все знают свои задачи, дела не стоят. Fluidez — «текучесть, свободное течение»."
    examples:
      - "El nuevo sistema mejora la fluidez en el trabajo. — Новая система улучшает слаженность работы."
      - "Falta fluidez en la comunicación. — Не хватает плавности в общении."
    origin: "От fluido «текучий» (лат. fluere «течь»). Родственные: fluir «течь», flujo «поток», fluidez verbal «беглость речи»."
    register: "Нейтральное, деловое."
    synonyms:
      - word: eficacia
        pair: ["Buscan más fluidez en el trabajo.", "Buscan más eficacia en el trabajo."]
        diff:
          - "eficacia — результативность, достижение цели"
          - "fluidez — именно плавность, когда ничего не тормозит"
    analogs:
      - "smooth running — гладкая работа"
      - "flow — течение, плавность"
    dialogue:
      - "Ana: ¿Qué quiere la dirección? | Чего хочет руководство?"
      - "Pablo: Más fluidez en el trabajo. | Больше слаженности в работе."
    cefr: "C1."
    frequency: "Частое в деловых текстах."
    collocations:
      - "hablar con fluidez — говорить свободно"
      - "fluidez verbal — беглость речи"
      - "fluidez del tráfico — свободное движение транспорта"
    collocation_example: "Habla español con mucha fluidez. — Он говорит по-испански очень свободно."
    trap: "Fluidez — не «флюидность», а чаще «беглость»: hablar con fluidez — «говорить свободно». Заканчивается на -z, во множественном — fluideces (редко)."

  - word: someter a observación
    ru: оставить под наблюдением
    ipa: /someˈteɾ a oβseɾβaˈθjon/
    say: сомэтэ́р а обсэрвасьо́н
    pron: "b в obser — мягкая [β]; c перед i в Испании — [θ]."
    meaning: "Оставить больного в больнице на некоторое время, чтобы следить за его состоянием."
    examples:
      - "Lo someterán a observación veinticuatro horas. — Его оставят под наблюдением на сутки."
      - "Quedó sometido a observación. — Он остался под наблюдением."
    origin: "someter «подвергать» (лат. submittere «подчинять») + observación «наблюдение» (лат. observare «следить»). Дословно «подвергнуть наблюдению»."
    register: "Формальное, медицинское."
    synonyms:
      - word: dejar en observación
        pair: ["Lo sometieron a observación.", "Lo dejaron en observación."]
        diff:
          - "dejar en observación — проще, бытовое «оставили понаблюдать»"
    analogs:
      - "to keep under observation — оставить под наблюдением"
      - "to monitor — следить, контролировать"
    dialogue:
      - "Ana: ¿Se va a casa? | Он едет домой?"
      - "Pablo: No, lo someten a observación esta noche. | Нет, его оставят под наблюдением на эту ночь."
    cefr: "C1."
    frequency: "Частое в новостях о здоровье."
    collocations:
      - "estar en observación — быть под наблюдением"
      - "someter a un examen — подвергнуть обследованию"
      - "someterse a una operación — перенести операцию"
    collocation_example: "Se sometió a una operación el lunes. — Ему сделали операцию в понедельник."
    trap: "Someter всегда с a: someter a observación, someter a votación. Не путайте observación «наблюдение» с observancia «соблюдение (закона)»."

  - word: si hiciera falta
    ru: если понадобится
    ipa: /si iˈθjeɾa ˈfalta/
    say: си исье́ра фа́льта
    pron: "h не читается; z перед i в Испании — [θ]: hiciera — «исье́ра»."
    meaning: "Если вдруг потребуется. Фраза в прошедшей форме subjuntivo — «hiciera», вежливый тон, предложение на будущее."
    examples:
      - "Si hiciera falta, volvería. — Если понадобится, я вернусь."
      - "Llámame si hiciera falta. — Позвони мне, если понадобится."
    origin: "hiciera — imperfecto de subjuntivo от hacer; falta «нужда». «Если бы вдруг понадобилось»: вежливое, гипотетическое условие."
    register: "Формальное и вежливое, чуть литературное."
    synonyms:
      - word: si hace falta
        pair: ["Te ayudo si hiciera falta.", "Te ayudo si hace falta."]
        diff:
          - "si hace falta — простое условие, настоящее время"
          - "si hiciera falta — гипотетично и вежливо, «на случай, если»"
    analogs:
      - "if need be — если понадобится"
      - "should it be necessary — если потребуется"
    dialogue:
      - "Ana: ¿Puedes quedarte esta noche? | Можешь остаться на ночь?"
      - "Pablo: Sí, si hiciera falta, me quedo. | Да, если понадобится, останусь."
    cefr: "C1."
    frequency: "Нечастое в разговоре, обычное в литературе."
    collocations:
      - "si hace falta — если нужно"
      - "si fuera necesario — если бы потребовалось"
      - "si hiciera falta, llámame — если понадобится, позвони"
    collocation_example: "Si hiciera falta, pediríamos ayuda. — Если понадобится, мы попросим о помощи."
    trap: "После si с imperfecto de subjuntivo во второй части — condicional: si hiciera falta, volvería. Не пишите «si haría falta»: после si — не condicional."

  - word: hasta dentro de
    ru: только через...
    ipa: /ˈasta ˈdentɾo de/
    say: а́ста дэ́нтро дэ
    pron: "h не читается."
    meaning: "Не раньше, чем через какое-то время: hasta dentro de una hora — «только через час». Подчёркивает, что раньше не будет."
    examples:
      - "No tendremos resultados hasta dentro de una hora. — Результатов не будет только через час."
      - "El médico no vuelve hasta dentro de dos días. — Врач вернётся только через два дня."
    origin: "hasta «до» + dentro de «через, спустя». Конструкция «не раньше чем»."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "not until — не раньше, чем: not until tomorrow"
      - "only in — только через"
    dialogue:
      - "Ana: ¿Cuándo salen los resultados? | Когда будут результаты?"
      - "Pablo: Hasta dentro de dos días, nada. | Только через два дня, не раньше."
    cefr: "B1."
    frequency: "Частое в разговоре."
    collocations:
      - "hasta dentro de una semana — не раньше, чем через неделю"
      - "no… hasta dentro de — не раньше чем через"
      - "dentro de poco — скоро"
    collocation_example: "No me dan cita hasta dentro de un mes. — Мне записывают только через месяц."
    trap: "Dentro de — «через» (в будущем), а hace — «назад» (в прошлом): dentro de una hora «через час», hace una hora «час назад». Hasta dentro de обычно с отрицанием: no… hasta dentro de."

  - word: derrame cerebral
    ru: инсульт, кровоизлияние в мозг
    ipa: /deˈrame θeɾeˈβɾal/
    say: дэрра́мэ сэрэбра́ль
    pron: "rr — раскатистое; c перед e в Испании — [θ]."
    meaning: "Кровоизлияние в мозг; в обычной речи — «инсульт». Derrame — «пролив, излияние»."
    examples:
      - "Sufrió un derrame cerebral. — У него был инсульт."
      - "El derrame cerebral lo dejó sin habla. — Инсульт лишил его речи."
    origin: "derramar «проливать, разливать» + cerebral (лат. cerebrum «мозг»). Буквально «пролив в мозге»."
    register: "Нейтральное, разговорное; в медицине — ictus или accidente cerebrovascular."
    synonyms:
      - word: ictus
        pair: ["Tuvo un derrame cerebral.", "Tuvo un ictus."]
        diff:
          - "ictus — термин врачей и новостей в Испании"
          - "derrame cerebral — как это называют в разговоре и в Латинской Америке"
    analogs:
      - "stroke — инсульт"
      - "brain hemorrhage — кровоизлияние в мозг"
    dialogue:
      - "Ana: ¿Qué le pasó a tu tío? | Что случилось с твоим дядей?"
      - "Pablo: Tuvo un derrame cerebral. | У него был инсульт."
    cefr: "B2."
    frequency: "Частое в новостях и разговорах о здоровье."
    collocations:
      - "sufrir un derrame cerebral — перенести инсульт"
      - "un derrame pleural — плеврит, выпот в плевру"
      - "un derrame de petróleo — разлив нефти"
    collocation_example: "El petrolero provocó un derrame de petróleo. — Танкер вызвал разлив нефти."
    trap: "Derrame — и «разлив», и «излияние»: derrame de petróleo — «разлив нефти», derrame cerebral — «инсульт». Не путайте с derrota «поражение»."

  - word: volante
    ru: направление (бланк направления)
    ipa: /boˈlante/
    say: бола́нтэ
    pron: "v читается как b."
    meaning: "В больнице — бланк направления к специалисту или на анализы. Ещё — «руль» (в машине) и «воланчик»."
    examples:
      - "Necesito un volante para el especialista. — Мне нужно направление к специалисту."
      - "Agarró el volante con las dos manos. — Он взялся за руль обеими руками."
    origin: "От volar «летать»: «летучий», как «летучий листок» (бланк, листовка). Руль назван так за то, что он вращается."
    register: "Нейтральное."
    synonyms:
      - word: derivación
        pair: ["Me dieron un volante.", "Me dieron una derivación."]
        diff:
          - "derivación — более формальное слово: направление к другому врачу"
          - "volante — обиходное слово для бланка"
    analogs:
      - "referral — направление к специалисту"
      - "steering wheel — руль"
    dialogue:
      - "Ana: ¿Qué necesitas del médico? | Что тебе нужно от врача?"
      - "Pablo: Un volante para el cardiólogo. | Направление к кардиологу."
    cefr: "B2."
    frequency: "Частое в больницах и в вождении."
    collocations:
      - "al volante — за рулём"
      - "un volante médico — медицинское направление"
      - "tomar el volante — сесть за руль"
    collocation_example: "No hables por teléfono al volante. — Не говори по телефону за рулём."
    trap: "Volante — и «руль», и «направление», и «воланчик»: Смысл подсказывает контекст. В Латинской Америке «руль» часто — manubrio или timón."

  - word: internamiento
    ru: госпитализация
    ipa: /inteɾnaˈmjento/
    say: интэрнамье́нто
    pron: "ie — один слог «ье»."
    meaning: "Помещение человека в больницу или специальное учреждение на длительный срок."
    examples:
      - "El internamiento duró tres semanas. — Госпитализация длилась три недели."
      - "Decidieron su internamiento en un centro. — Решили поместить его в клинику."
    origin: "От internar «помещать внутрь» (лат. internus «внутренний») + суффикс -miento, образующий существительное из глагола."
    register: "Формальное, юридическое и медицинское."
    synonyms:
      - word: ingreso
        pair: ["Su internamiento fue necesario.", "Su ingreso fue necesario."]
        diff:
          - "ingreso — поступление в больницу, обычное слово"
          - "internamiento — длительное, часто принудительное помещение, например в клинику"
    analogs:
      - "hospitalization — госпитализация"
      - "confinement — помещение под надзор"
    dialogue:
      - "Ana: ¿Cuánto durará el tratamiento? | Сколько продлится лечение?"
      - "Pablo: El internamiento será de una semana. | Госпитализация — неделя."
    cefr: "C1."
    frequency: "Нечастое: в новостях и документах."
    collocations:
      - "internamiento hospitalario — госпитализация"
      - "internamiento forzoso — принудительное помещение"
      - "centro de internamiento — центр содержания"
    collocation_example: "El juez ordenó su internamiento forzoso. — Судья приказал поместить его принудительно."
    trap: "Слово нейтральное только в больнице; применённое к человеку часто звучит жёстко (принудительное помещение). Обычная «госпитализация» в быту — ingreso."

  - word: una vez que
    ru: как только, после того как
    ipa: /ˈuna ˈβeθ ke/
    say: у́на бэс кэ
    pron: "v читается как b; z на конце перед k в Испании — [θ]."
    meaning: "Как только случилось одно, происходит другое. Подчёркивает момент, после которого что-то меняется."
    examples:
      - "Una vez que llegues, llámame. — Как только приедешь, позвони."
      - "Una vez que terminó, se fue. — Как только он закончил, он ушёл."
    origin: "una vez «один раз» + que «что». Дословно «один раз, когда»: «как только это один раз произошло»."
    register: "Нейтральное, слегка книжное."
    synonyms:
      - word: en cuanto
        pair: ["Una vez que llegue, te aviso.", "En cuanto llegue, te aviso."]
        diff:
          - "en cuanto — «как только», скорее в разговоре и подчёркивает быстроту"
          - "una vez que — «после того как», с акцентом на завершение"
    analogs:
      - "once — как только, once you arrive"
      - "as soon as — как только"
    dialogue:
      - "Ana: ¿Cuándo salimos? | Когда выходим?"
      - "Pablo: Una vez que acabe el médico. | Как только врач закончит."
    cefr: "B2."
    frequency: "Частое в письменной и устной речи."
    collocations:
      - "una vez que + subjuntivo (будущее) — как только (в будущем)"
      - "una vez que + indicativo (прошлое) — после того как (в прошлом)"
      - "una vez más — ещё раз"
    collocation_example: "Una vez que terminemos, nos vamos a cenar. — Как только закончим, пойдём ужинать."
    trap: "О будущем после una vez que — subjuntivo: una vez que llegues, а не llegas. О прошлом и привычном — indicativo: una vez que llegó."
