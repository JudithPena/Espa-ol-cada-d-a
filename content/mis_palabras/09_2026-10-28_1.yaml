      - "No entiendo el argot de los médicos, y por eso siempre les pido que lo expliquen con palabras sencillas. — Я не понимаю жаргона врачей, поэтому всегда прошу объяснять простыми словами."
      - "El diccionario recoge algunas palabras del argot de los marineros que ya casi nadie conoce. — Словарь содержит несколько слов из жаргона моряков, которые уже почти никто не знает."
    origin: "Из французского argot «воровской жаргон»: исходно тайный язык воров. В испанский вошло в XIX веке."
