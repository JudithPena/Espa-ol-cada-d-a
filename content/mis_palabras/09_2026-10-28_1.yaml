# Четвёртый список автора, часть 9 — «Lola Lago: Vacaciones al sol 2» (11 слов).
lang: es
words:
  - word: bahía
    ru: бухта, залив
    ipa: /baˈia/
    say: баи́я
    pron: "ía — два слога: ба-и́-я."
    meaning: "Участок моря, вдающийся в сушу, защищённый от волн: небольшой залив."
    examples:
      - "El hotel está frente a la bahía, y desde las habitaciones se ven los barcos de pesca. — Отель стоит напротив бухты, и из номеров видны рыбацкие лодки."
      - "Los barcos entran en la bahía al amanecer, cuando el mar todavía está tranquilo. — Корабли заходят в бухту на рассвете, когда море ещё спокойно."
      - "La ciudad se extiende alrededor de una bahía enorme rodeada de montañas verdes. — Город раскинулся вокруг огромной бухты, окружённой зелёными горами."
    origin: "Происхождение неясно. Известные названия: Bahía de Cádiz, Bahía Blanca."
    register: "Нейтральное."
    synonyms:
      - word: golfo
        pair: ["Navegamos por la bahía.", "Navegamos por el golfo."]
        diff:
          - "golfo — больший по размеру залив"
          - "bahía — меньшая по размеру, обычно защищённая бухта"
    analogs:
      - "bay — бухта"
      - "cove — небольшая бухточка"
    dialogue:
      - "Ana: ¿Dónde está el puerto? | Где порт?"
      - "Pablo: En la bahía, al final de la playa. | В бухте, в конце пляжа."
    cefr: "B1."
    frequency: "Частое в рассказах о побережье."
    collocations:
      - "la bahía de Cádiz — бухта Кадиса"
      - "una bahía tranquila — спокойная бухта"
      - "entrar en la bahía — зайти в бухту"
    collocation_example: "La bahía de la ciudad es muy bonita al atardecer. — Бухта города очень красива на закате."
    trap: "Ударение на i: bahía — знак ударения обязателен. Не путайте с baya «ягода» и vaya «пусть идёт»."

  - word: muralla
    ru: городская стена, крепостная стена
    ipa: /muˈɾaʎa/
    say: мура́йя
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Толстая стена вокруг города или замка, которая защищала от врагов."
    examples:
      - "Paseamos por la muralla de la ciudad al atardecer, con toda la llanura a nuestros pies. — Мы гуляли по городской стене на закате, и вся равнина лежала у наших ног."
      - "La muralla romana todavía está en pie, aunque algunas partes se han perdido con el tiempo. — Римская стена всё ещё стоит, хотя некоторые её части со временем разрушились."
      - "Construyeron la muralla en el siglo doce para proteger la ciudad de los ataques enemigos. — Стену построили в двенадцатом веке, чтобы защитить город от нападений врагов."
    origin: "От muro «стена» (лат. murus) + суффикс -alla. Родственные: muro «стена», amurallar «обнести стеной»."
    register: "Нейтральное."
    synonyms:
      - word: muro
        pair: ["Subimos a la muralla.", "Subimos al muro."]
        diff:
          - "muro — обычная стена, любая"
          - "muralla — крепостная стена, огромная и защитная"
    analogs:
      - "city wall — городская стена"
      - "rampart — крепостной вал"
    dialogue:
      - "Ana: ¿Qué visitamos hoy? | Что посмотрим сегодня?"
      - "Pablo: La muralla de Ávila. | Стену Авилы."
    cefr: "B1."
    frequency: "Частое в туристических рассказах."
    collocations:
      - "la muralla de Ávila — стена Авилы"
      - "la Gran Muralla — Великая стена"
      - "dentro de la muralla — внутри стены"
    collocation_example: "La Gran Muralla china es muy larga. — Великая китайская стена очень длинная."
    trap: "Muralla — городская стена, а muro — обычная. Не путайте muralla «стена» с mural «фреска»: mural — роспись на стене."

  - word: estafado
    ru: обманутый, обманутый мошенником
    ipa: /estaˈfaðo/
    say: эстафа́до
    pron: "d между гласными мягкое [ð]."
    meaning: "Человек, которого обманули ради денег: мошенник взял деньги и ничего не дал."
    examples:
      - "Se sintió estafado por el vendedor, que le había asegurado que el coche no tenía ningún problema. — Он почувствовал себя обманутым продавцом, который уверял, что у машины нет никаких проблем."
      - "Los estafados presentaron una denuncia colectiva contra la empresa de viajes que desapareció. — Обманутые подали коллективное заявление на турфирму, которая исчезла."
      - "Quedé estafado al comprar entradas por internet: llegué al concierto y no existían. — Меня обманули при покупке билетов через интернет: я пришёл на концерт, а билетов не существовало."
    origin: "Причастие от estafar «обманывать, мошенничать» (из итальянского staffare «выводить из седла»). Родственные: estafa «мошенничество», estafador «мошенник»."
    register: "Нейтральное."
    synonyms:
      - word: engañado
        pair: ["Se sintió estafado.", "Se sintió engañado."]
        diff:
          - "engañado — любой обман, не обязательно ради денег"
          - "estafado — обманутый ради денег, с материальным ущербом"
    analogs:
      - "scammed — обманутый мошенниками"
      - "swindled — обманутый"
    dialogue:
      - "Ana: ¿Por qué estás tan enfadado? | Почему ты такой злой?"
      - "Pablo: Me siento estafado, el coche no funciona. | Я чувствую себя обманутым, машина не работает."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "sentirse estafado — чувствовать себя обманутым"
      - "ser estafado — быть обманутым"
      - "estafar dinero — выманить деньги"
    collocation_example: "Lo estafaron con una falsa inversión. — Его обманули фальшивым вложением."
    trap: "Estafado — причастие, согласуется: estafada, estafados. «Обмануть» в обычной ситуации — engañar; estafar — именно ради денег."

  - word: comunica
    ru: линия занята (телефон)
    ipa: /koˈmunika/
    say: комуни́ка
    pron: "Ударение на ни: comunica — «комуни́ка»."
    meaning: "Короткие гудки при звонке: «Linea ocupada». Фраза: «Está comunicando» — «занято»."
    examples:
      - "Llamé a su casa, pero comunica desde hace una hora y no sé si tiene el teléfono descolgado. — Я позвонил ему домой, но занято уже час, и не знаю, не снята ли у него трубка."
      - "El teléfono comunica cada vez que lo intento, aunque ya sé que debe de estar en casa. — Телефон занят каждый раз, как я пытаюсь позвонить, хотя я знаю, что он должен быть дома."
      - "Seguía comunicando cuando volví a llamar, así que le dejé un mensaje en el contestador. — Было по-прежнему занято, когда я позвонил снова, так что я оставил ему сообщение на автоответчике."
    origin: "От comunicar «сообщаться; быть занятым»: из лат. communicare «делать общим». В телефоне: «связь занята»."
    register: "Разговорное."
    synonyms:
      - word: dar tono de ocupado
        pair: ["Comunica el teléfono.", "El teléfono da tono de ocupado."]
        diff:
          - "dar tono de ocupado — полнее, «давать сигнал занято»"
          - "comunicar — кратко и разговорно"
    analogs:
      - "the line is busy — линия занята"
      - "engaged — занято (британское)"
    dialogue:
      - "Ana: ¿Hablaste con Luis? | Ты поговорил с Луисом?"
      - "Pablo: No, siempre comunica. | Нет, всегда занято."
    cefr: "B2."
    frequency: "Частое в Испании."
    collocations:
      - "estar comunicando — быть занятым"
      - "comunicar con alguien — связаться"
      - "comunicarse con — связаться с"
    collocation_example: "Llevo toda la tarde llamando y siempre comunica. — Весь вечер звоню, и всё время занято."
    trap: "Ложный друг: comunicar бывает «сообщать» и «быть занятым» (телефон). Для «занято» говорят «comunica» или «está comunicando». Не путайте с comunicado «сообщение»."

  - word: bañador
    ru: купальник; плавки
    ipa: /baɲaˈðoɾ/
    say: баньадо́р
    pron: "ñ — «нь»; d между гласными мягкое [ð]."
    meaning: "Одежда для плавания: цельный женский купальник или мужские плавки. Раздельный женский — bikini."
    examples:
      - "Se me olvidó el bañador, y no pude meterme en la piscina con los demás. — Я забыл плавки и не смог залезть в бассейн вместе со всеми."
      - "Llevo el bañador debajo de la ropa por si encontramos una playa de camino. — Я ношу плавки под одеждой на случай, если мы по дороге найдём пляж."
      - "Mi hermana se compró un bañador nuevo para las vacaciones, de color azul y con rayas blancas. — Сестра купила себе новый купальник для отпуска, синий в белую полоску."
    origin: "От bañar «купать» (лат. balneare, от balneum «баня») + суффикс -dor, обозначающий предмет для действия. Родственные: baño «ванна, купание», bañera «ванна»."
    register: "Нейтральное."
    synonyms:
      - word: traje de baño
        pair: ["Compré un bañador.", "Compré un traje de baño."]
        diff:
          - "traje de baño — в Латинской Америке основное слово"
          - "bañador — привычное в Испании"
    analogs:
      - "swimsuit — купальник"
      - "swimming trunks — плавки"
    dialogue:
      - "Ana: ¿Qué llevas a la playa? | Что берёшь на пляж?"
      - "Pablo: Toalla y bañador. | Полотенце и плавки."
    cefr: "A2."
    frequency: "Очень частое летом."
    collocations:
      - "ponerse el bañador — надеть купальник"
      - "bañador de hombre — мужские плавки"
      - "bañador de una pieza — цельный купальник"
    collocation_example: "No olvides tu bañador y la toalla. — Не забудь купальник и полотенце."
    trap: "В Латинской Америке чаще traje de baño или malla (Аргентина). Не путайте с bañera «ванна» и bañar «купать»."

  - word: hoguera
    ru: костёр
    ipa: /oˈɣeɾa/
    say: оѓэ́ра
    pron: "h не читается; gu перед e читается как «г»."
    meaning: "Большой огонь на открытом воздухе, который разжигают для тепла, праздника или чтобы что-то сжечь."
    examples:
      - "Encendimos una hoguera en la playa y estuvimos cantando hasta que salió el sol. — Мы развели костёр на пляже и пели, пока не взошло солнце."
      - "En la noche de San Juan se hacen hogueras en toda la costa para quemar las cosas viejas. — В ночь на святого Иоанна по всему побережью разжигают костры, чтобы сжечь старые вещи."
      - "Los excursionistas se sentaron alrededor de la hoguera para calentarse y asar unas salchichas. — Туристы сели вокруг костра, чтобы согреться и пожарить сосиски."
    origin: "От лат. focaria «очаг», от focus «огонь, очаг». Родственные: fuego «огонь», hogar «домашний очаг», foco «фокус»."
    register: "Нейтральное."
    synonyms:
      - word: fogata
        pair: ["Hicimos una hoguera.", "Hicimos una fogata."]
        diff:
          - "fogata — «костёр» в Латинской Америке"
          - "hoguera — привычное слово в Испании"
    analogs:
      - "bonfire — большой костёр"
      - "campfire — костёр на привале"
    dialogue:
      - "Ana: ¿Qué hicisteis en la playa? | Что вы делали на пляже?"
      - "Pablo: Una hoguera y cantamos canciones. | Разожгли костёр и пели песни."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "encender una hoguera — разжечь костёр"
      - "la noche de San Juan — ночь Сан-Хуан"
      - "saltar la hoguera — прыгать через костёр"
    collocation_example: "La noche de San Juan saltamos sobre la hoguera. — В ночь Сан-Хуан мы прыгаем через костёр."
    trap: "Hoguera пишется с h и gu: hoguera, а не «ogera». Не путайте с hogar «домашний очаг, дом»."

  - word: horrorizado
    ru: объятый ужасом
    ipa: /oroɾiˈθaðo/
    say: орориса́до
    pron: "h не читается; z в Испании — [θ]."
    meaning: "Испугавшийся до ужаса: потрясённый чем-то страшным или отвратительным."
    examples:
      - "Miró horrorizado la escena del accidente y no fue capaz de dar ni un paso. — Он с ужасом посмотрел на место аварии и не смог сделать ни шагу."
      - "Estaba horrorizada por la noticia y no podía creer que algo así pasara en su barrio. — Она была в ужасе от новости и не могла поверить, что такое случилось в её районе."
      - "El público, horrorizado, vio cómo el payaso se caía desde lo alto del escenario. — Публика в ужасе смотрела, как клоун падал с высоты сцены."
    origin: "Причастие от horrorizar «ужасать» (horror «ужас», лат. horror, от horrere «ощетиниться»). Родственные: horror, horrible «ужасный»."
    register: "Нейтральное."
    synonyms:
      - word: aterrado
        pair: ["Lo miró horrorizado.", "Lo miró aterrado."]
        diff:
          - "aterrado — «перепуганный до смерти», страх за себя"
          - "horrorizado — «охваченный ужасом» от увиденного, отвращение и шок"
    analogs:
      - "horrified — потрясённый ужасом"
      - "appalled — потрясённый"
    dialogue:
      - "Ana: ¿Cómo reaccionó? | Как он отреагировал?"
      - "Pablo: Horrorizado, no podía hablar. | Объятый ужасом, он не мог говорить."
    cefr: "B2."
    frequency: "Частое в рассказах."
    collocations:
      - "quedarse horrorizado — остаться в ужасе"
      - "mirar horrorizado — смотреть в ужасе"
      - "horrorizarse ante algo — ужаснуться чему-то"
    collocation_example: "Se quedó horrorizado al ver el accidente. — Он оцепенел от ужаса, увидев аварию."
    trap: "Причастие согласуется: horrorizada, horrorizados. Не путайте horrorizado «в ужасе» и horroroso «ужасный»: первое — состояние человека, второе — качество вещи."

  - word: estafador
    ru: мошенник
    ipa: /estafaˈðoɾ/
    say: эстафадо́р
    pron: "d между гласными мягкое [ð]."
    meaning: "Тот, кто обманывает людей ради денег: выдаёт себя за другого, продаёт то, чего нет."
    examples:
      - "Un estafador le robó los ahorros haciéndose pasar por empleado del banco. — Мошенник украл его сбережения, выдав себя за сотрудника банка."
      - "Cuidado con los estafadores en internet: nadie regala dinero y menos aún por un enlace. — Остерегайтесь мошенников в интернете: никто не раздаёт деньги, тем более по ссылке."
      - "La policía detuvo al estafador cuando intentaba salir del país con el dinero de las víctimas. — Полиция задержала мошенника, когда он пытался выехать из страны с деньгами жертв."
    origin: "От estafar «обманывать ради денег» + суффикс -dor. Женский род — estafadora. Родственные: estafa «афера»."
    register: "Нейтральное."
    synonyms:
      - word: timador
        pair: ["Era un estafador.", "Era un timador."]
        diff:
          - "timador — «жулик, который надувает на мелочи», разговорное"
          - "estafador — любой мошенник, и серьёзный"
    analogs:
      - "fraudster — мошенник"
      - "con artist — аферист"
    dialogue:
      - "Ana: ¿Quién te llamó? | Кто тебе звонил?"
      - "Pablo: Un estafador que quería mi contraseña. | Мошенник, который хотел мой пароль."
    cefr: "B2."
    frequency: "Очень частое в новостях."
    collocations:
      - "caer en manos de un estafador — попасть к мошеннику"
      - "un estafador profesional — профессиональный мошенник"
      - "la estafa — афера"
    collocation_example: "Cayó en manos de un estafador en internet. — Он попал в руки мошенника в интернете."
    trap: "Женский род — estafadora. Не путайте с estafa «афера» и estafar «обманывать»: это три слова одного корня."

  - word: ahogar
    ru: тонуть; душить; топить
    ipa: /aˈoɣaɾ/
    say: аога́р
    pron: "h не читается; ударение на последнем слоге; перед e g меняется на gu: ahogué."
    meaning: "Лишить воздуха: утопить или задушить. Ahogarse — «тонуть, задыхаться». Ещё — «заглушить» (двигатель)."
    examples:
      - "El niño casi se ahoga en la piscina cuando nadie lo miraba, pero un vecino lo sacó a tiempo. — Мальчик чуть не утонул в бассейне, когда никто не смотрел, но сосед вовремя его вытащил."
      - "Me ahogo con este humo, así que voy a abrir las ventanas de par en par. — Я задыхаюсь от этого дыма, так что распахну окна настежь."
      - "La música tan alta ahogó las voces de los que intentaban hablar en la mesa. — Такая громкая музыка заглушала голоса тех, кто пытался говорить за столом."
    origin: "Из лат. offocare «душить», от fauces «горло». Родственные: ahogo «удушье», ahogado «утонувший»."
    register: "Нейтральное."
    synonyms:
      - word: asfixiar
        pair: ["Se ahogó con el humo.", "Se asfixió con el humo."]
        diff:
          - "asfixiar — «задохнуться» от нехватки воздуха, книжное"
          - "ahogarse — и «утонуть», и «задохнуться»"
    analogs:
      - "to drown — тонуть"
      - "to choke — душить, давиться"
    dialogue:
      - "Ana: ¿Qué pasó en la playa? | Что случилось на пляже?"
      - "Pablo: Un niño casi se ahoga. | Мальчик чуть не утонул."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ahogarse en el mar — утонуть в море"
      - "ahogarse de calor — задыхаться от жары"
      - "ahogar las penas — заливать горе"
    collocation_example: "Se ahogaba de calor en el autobús. — В автобусе она задыхалась от жары."
    trap: "Ahogarse — возвратный, «утонуть сам»; ahogar — «утопить». Перед e g меняется на gu: ahogué. Не путайте с ahorrar «экономить»."

  - word: afectiva
    ru: ласковый, чуткий (аффективный)
    ipa: /afekˈtiβa/
    say: афэкти́ба
    pron: "v читается как b."
    meaning: "О человеке: тёплый, склонный выражать чувства. Чаще в паре: afectivo — «ласковый, эмоциональный»; ещё — «связанный с чувствами»."
    examples:
      - "Es una persona muy afectiva, siempre da abrazos y dice lo que siente sin vergüenza. — Это очень ласковый человек: он всегда обнимает и без стеснения говорит о своих чувствах."
      - "Necesita apoyo afectivo, porque lleva meses sintiéndose solo en una ciudad que no conoce. — Ему нужна эмоциональная поддержка, потому что он уже несколько месяцев чувствует себя одиноким в незнакомом городе."
      - "Los psicólogos hablan de la importancia del vínculo afectivo en los primeros años de vida. — Психологи говорят о важности эмоциональной связи в первые годы жизни."
    origin: "От лат. affectivus «чувствующий», от affectus «настроение, чувство». Родственные: afecto «привязанность», afectar «влиять»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: cariñoso
