# Четвёртый список автора, часть 9 — «Lola Lago: Vacaciones al sol 2» (11 слов).
lang: es
words:
  - word: bahía
    ru: бухта, залив
    ipa: /baˈia/
    say: баи́я
    pron: "ía — два слога: ба-и́-я."
    meaning: "Участок моря, вдающийся в сушу, защищённый от волн: небольшой залив."
    examples:
      - "Los pescadores salen de la bahía. — Рыбаки выходят из бухты."
      - "La ciudad se extiende alrededor de una bahía enorme rodeada de montañas verdes. — Город раскинулся вокруг огромной бухты, окружённой зелёными горами."
      - "El hotel está frente a la bahía, y desde las habitaciones se ven los barcos de pesca. — Отель стоит напротив бухты, и из номеров видны рыбацкие лодки."
    origin: "Происхождение неясно. Известные названия: Bahía de Cádiz, Bahía Blanca."
    register: "Нейтральное."
    synonyms:
      - word: golfo
        pair: ["Navegamos por la bahía.", "Navegamos por el golfo."]
        diff:
          - "golfo — больший по размеру залив"
          - "bahía — меньшая по размеру, обычно защищённая бухта"
    analogs:
      - "bay — бухта"
      - "cove — небольшая бухточка"
    dialogue:
      - "Ana: ¿Dónde está el puerto? | Где порт?"
      - "Pablo: En la bahía, al final de la playa. | В бухте, в конце пляжа."
      - "Ana: ¿Se puede ir andando? | Можно дойти пешком?"
      - "Pablo: Sí, en veinte minutos. Sigue el paseo marítimo y no te desvíes. | Да, за двадцать минут. Иди по набережной и не сворачивай."
      - "Ana: ¿Y qué hay allí? | И что там?"
      - "Pablo: Un mercado de pescado, bares con boquerones y barcos de pesca. | Рыбный рынок, бары с анчоусами и рыбацкие лодки."
      - "Ana: Suena genial. ¿Y al atardecer? | Звучит здорово. А на закате?"
      - "Pablo: La bahía se pone rojiza y es un espectáculo. Ven a verla conmigo. | Бухта становится красноватой, и это зрелище. Пойдём посмотрим вместе."
    cefr: "B1."
    frequency: "Частое в рассказах о побережье."
    collocations:
      - "la bahía de Cádiz — бухта Кадиса"
      - "una bahía tranquila — спокойная бухта"
      - "entrar en la bahía — зайти в бухту"
    collocation_example: "La bahía de la ciudad es muy bonita al atardecer. — Бухта города очень красива на закате."
    trap: "Ударение на i: bahía — знак ударения обязателен. Не путайте с baya «ягода» и vaya «пусть идёт»."

  - word: muralla
    ru: городская стена, крепостная стена
    ipa: /muˈɾaʎa/
    say: мура́йя
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Толстая стена вокруг города или замка, которая защищала от врагов."
    examples:
      - "Subimos a la muralla al amanecer. — Мы поднялись на городскую стену на рассвете."
      - "Construyeron la muralla en el siglo doce para proteger la ciudad de los ataques. — Стену построили в двенадцатом веке, чтобы защитить город от нападений."
      - "La muralla romana todavía está en pie, aunque algunas partes se han perdido con el tiempo. — Римская стена всё ещё стоит, хотя некоторые её части со временем разрушились."
    origin: "От muro «стена» (лат. murus) + суффикс -alla. Родственные: muro «стена», amurallar «обнести стеной»."
    register: "Нейтральное."
    synonyms:
      - word: muro
        pair: ["Subimos a la muralla.", "Subimos al muro."]
        diff:
          - "muro — обычная стена, любая"
          - "muralla — крепостная стена, огромная и защитная"
    analogs:
      - "city wall — городская стена"
      - "rampart — крепостной вал"
    dialogue:
      - "Salimos de Madrid temprano para visitar la muralla de Ávila. | Мы выехали из Мадрида рано, чтобы посетить стену Авилы."
      - "Llegamos a media mañana, con el cielo despejado y un frío seco. | Приехали к середине утра, небо было ясным, а холод сухим."
      - "Subimos por una escalera estrecha y, desde arriba, se veía toda la ciudad. | Мы поднялись по узкой лестнице, и сверху был виден весь город."
      - "Mi madre, que tiene vértigo, se quedó quieta y no se atrevió a mirar abajo. | Моя мама, у которой кружится голова от высоты, замерла и не решилась смотреть вниз."
      - "Mi padre, en cambio, sacó mil fotos y casi se cayó de bruces. | А отец, наоборот, сделал тысячу снимков и чуть не упал лицом вниз."
      - "Al bajar, comimos unas judías y saboreamos el éxito de la excursión. | Спустившись, мы поели фасоль и насладились успехом поездки."
    cefr: "B1."
    frequency: "Частое в туристических рассказах."
    collocations:
      - "la muralla de Ávila — стена Авилы"
      - "la Gran Muralla — Великая стена"
      - "dentro de la muralla — внутри стены"
    collocation_example: "La Gran Muralla china es muy larga. — Великая китайская стена очень длинная."
    trap: "Muralla — городская стена, а muro — обычная. Не путайте muralla «стена» с mural «фреска»: mural — роспись на стене."

  - word: estafado
    ru: обманутый, обманутый мошенником
    ipa: /estaˈfaðo/
    say: эстафа́до
    pron: "d между гласными мягкое [ð]."
    meaning: "Человек, которого обманули ради денег: мошенник взял деньги и ничего не дал."
    examples:
      - "Me sentí estafado por el taxista. — Я почувствовал, что меня обманул таксист."
      - "Contra la empresa de viajes que desapareció, presentaron una denuncia colectiva los estafados. — На турфирму, которая исчезла, коллективное заявление подали обманутые."
      - "Se sintió estafado por el vendedor, que le había asegurado que el coche no tenía ningún problema. — Он почувствовал себя обманутым продавцом, который уверял, что у машины нет никаких проблем."
    origin: "Причастие от estafar «обманывать, мошенничать» (из итальянского staffare «выводить из седла»). Родственные: estafa «мошенничество», estafador «мошенник»."
    register: "Нейтральное."
    synonyms:
      - word: engañado
        pair: ["Se sintió estafado.", "Se sintió engañado."]
        diff:
          - "engañado — любой обман, не обязательно ради денег"
          - "estafado — обманутый ради денег, с материальным ущербом"
    analogs:
      - "scammed — обманутый мошенниками"
      - "swindled — обманутый"
    dialogue:
      - "Ana: ¿Por qué estás tan enfadado? | Почему ты так зол?"
      - "Pablo: Me siento estafado, el coche no funciona. | Я чувствую себя обманутым: машина не заводится."
      - "Ana: ¿No era nueva? | Она же была новой?"
      - "Pablo: Era de segunda mano. El vendedor me aseguró que estaba perfecta y me engañó. | Подержанная. Продавец уверял, что она в идеальном состоянии, и обманул меня."
      - "Ana: ¿Pagaste en efectivo? | Ты платил наличными?"
      - "Pablo: Sí, y sin recibo. Menuda papeleta me ha tocado. | Да, и без чека. Ну и неприятность мне досталась."
      - "Ana: Pues hay que denunciarlo cuanto antes. | Тогда надо заявить на него как можно скорее."
      - "Pablo: Eso voy a hacer. No pienso agachar la cabeza ante un estafador. | Именно так и сделаю. Не собираюсь опускать голову перед мошенником."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "sentirse estafado — чувствовать себя обманутым"
      - "ser estafado — быть обманутым"
      - "estafar dinero — выманить деньги"
    collocation_example: "Lo estafaron con una falsa inversión. — Его обманули фальшивым вложением."
    trap: "Estafado — причастие, согласуется: estafada, estafados. «Обмануть» в обычной ситуации — engañar; estafar — именно ради денег."

  - word: comunica
    ru: линия занята (телефон)
    ipa: /koˈmunika/
    say: комуни́ка
    pron: "Ударение на ни: comunica — «комуни́ка»."
    meaning: "Короткие гудки при звонке: «Linea ocupada». Фраза: «Está comunicando» — «занято»."
    examples:
      - "Su móvil comunica desde esta mañana. — Его телефон занят с самого утра."
      - "Cuando volví a llamar, le dejé un mensaje porque seguía comunicando. — Когда я позвонил снова, я оставил сообщение, потому что по-прежнему было занято."
      - "Llamé a su casa, pero comunica desde hace una hora y no sé si tiene el teléfono descolgado. — Я позвонил ему домой, но занято уже час, и не знаю, не снята ли у него трубка."
    origin: "От comunicar «сообщаться; быть занятым»: из лат. communicare «делать общим». В телефоне: «связь занята»."
    register: "Разговорное."
    synonyms:
      - word: dar tono de ocupado
        pair: ["Comunica el teléfono.", "El teléfono da tono de ocupado."]
        diff:
          - "dar tono de ocupado — полнее, «давать сигнал занято»"
          - "comunicar — кратко и разговорно"
    analogs:
      - "the line is busy — линия занята"
      - "engaged — занято (британское)"
    dialogue:
      - "Ana: ¿Hablaste con Luis? | Ты поговорил с Луисом?"
      - "Pablo: No, siempre comunica. | Нет, у него всегда занято."
      - "Ana: ¿Desde cuándo? | С каких пор?"
      - "Pablo: Desde esta mañana. Ando buscando a Luis y su móvil no hace más que comunicar. | С самого утра. Я ищу Луиса, а его телефон всё время занят."
      - "Ana: Quizá dejó el auricular descolgado. | Может, он оставил трубку снятой."
      - "Pablo: Puede ser. Voy a probar con el fijo, a ver si coge. | Возможно. Попробую по стационарному, вдруг ответит."
      - "Ana: ¿Y si le dejamos un recado? | А если оставим сообщение?"
      - "Pablo: Mejor, sí. Y que me llame cuanto antes. | Лучше так. И пусть позвонит мне как можно скорее."
    cefr: "B2."
    frequency: "Частое в Испании."
    collocations:
      - "estar comunicando — быть занятым"
      - "comunicar con alguien — связаться"
      - "comunicarse con — связаться с"
    collocation_example: "Llevo toda la tarde llamando y siempre comunica. — Весь вечер звоню, и всё время занято."
    trap: "Ложный друг: comunicar бывает «сообщать» и «быть занятым» (телефон). Для «занято» говорят «comunica» или «está comunicando». Не путайте с comunicado «сообщение»."

  - word: bañador
    ru: купальник; плавки
    ipa: /baɲaˈðoɾ/
    say: баньадо́р
    pron: "ñ — «нь»; d между гласными мягкое [ð]."
    meaning: "Одежда для плавания: цельный женский купальник или мужские плавки. Раздельный женский — bikini."
    examples:
      - "Se me olvidó el bañador. — Я забыл плавки."
      - "Llevo el bañador debajo de la ropa por si encontramos una playa de camino. — Я ношу плавки под одеждой на случай, если мы по дороге найдём пляж."
      - "Mi hermana se compró un bañador nuevo para las vacaciones, de color azul y con rayas blancas. — Сестра купила себе новый купальник для отпуска, синий в белую полоску."
    origin: "От bañar «купать» (лат. balneare, от balneum «баня») + суффикс -dor, обозначающий предмет для действия. Родственные: baño «ванна, купание», bañera «ванна»."
    register: "Нейтральное."
    synonyms:
      - word: traje de baño
        pair: ["Compré un bañador.", "Compré un traje de baño."]
        diff:
          - "traje de baño — в Латинской Америке основное слово"
          - "bañador — привычное в Испании"
    analogs:
      - "swimsuit — купальник"
      - "swimming trunks — плавки"
    dialogue:
      - "Ana: ¿Qué llevas a la playa? | Что берёшь на пляж?"
      - "Pablo: Toalla y bañador. | Полотенце и плавки."
      - "Ana: ¿Y crema solar? | А солнцезащитный крем?"
      - "Pablo: Claro, y una gorra. El sol de la bahía quema, aunque esté despejado. | Конечно, и кепку. Солнце в бухте жжёт, даже когда небо чистое."
      - "Ana: Yo me olvidé del bañador. | А я забыла купальник."
      - "Pablo: ¡Qué despiste! ¿Y ahora qué vas a hacer? | Какая рассеянность! И что ты теперь будешь делать?"
      - "Ana: Voy a comprarme uno en una tienda. Aprovecho para estrenar algo nuevo. | Куплю в магазине. Заодно куплю что-то новое."
      - "Pablo: Pues no elijas algo hortera, que luego te arrepientes. | Только не выбирай ничего безвкусного, а то потом пожалеешь."
    cefr: "A2."
    frequency: "Очень частое летом."
    collocations:
      - "ponerse el bañador — надеть купальник"
      - "bañador de hombre — мужские плавки"
      - "bañador de una pieza — цельный купальник"
    collocation_example: "No olvides tu bañador y la toalla. — Не забудь купальник и полотенце."
    trap: "В Латинской Америке чаще traje de baño или malla (Аргентина). Не путайте с bañera «ванна» и bañar «купать»."

  - word: hoguera
    ru: костёр
    ipa: /oˈɣeɾa/
    say: оѓэ́ра
    pron: "h не читается; gu перед e читается как «г»."
    meaning: "Большой огонь на открытом воздухе, который разжигают для тепла, праздника или чтобы что-то сжечь."
    examples:
      - "Hicimos una hoguera junto al lago. — Мы развели костёр у озера."
      - "En la playa, hasta que salió el sol, estuvimos cantando junto a la hoguera. — На пляже мы пели у костра, пока не взошло солнце."
      - "En la noche de San Juan se hacen hogueras en toda la costa para quemar las cosas viejas. — В ночь на святого Иоанна по всему побережью разжигают костры, чтобы сжечь старые вещи."
    origin: "От лат. focaria «очаг», от focus «огонь, очаг». Родственные: fuego «огонь», hogar «домашний очаг», foco «фокус»."
    register: "Нейтральное."
    synonyms:
      - word: fogata
        pair: ["Hicimos una hoguera.", "Hicimos una fogata."]
        diff:
          - "fogata — «костёр» в Латинской Америке"
          - "hoguera — привычное слово в Испании"
    analogs:
      - "bonfire — большой костёр"
      - "campfire — костёр на привале"
    dialogue:
      - "Una noche de verano, mis amigos y yo hicimos una hoguera junto a la playa. | Одной летней ночью мы с друзьями развели костёр у пляжа."
      - "Recogimos ramas secas y las apilamos con cuidado. | Собрали сухие ветки и аккуратно сложили."
      - "Cuando el fuego prendió, nos sentamos alrededor y alguien sacó una guitarra. | Когда огонь разгорелся, мы сели вокруг, и кто-то достал гитару."
      - "Cantamos canciones antiguas y nos reímos hasta la madrugada. | Мы пели старые песни и смеялись до рассвета."
      - "Un amigo, algo mareado, se tumbó en la arena y se quedó sumido en un sueño profundo. | Один друг, слегка захмелевший, лёг на песок и погрузился в глубокий сон."
      - "Antes de irnos, apagamos la hoguera y no dejamos ni un papel. | Перед уходом мы потушили костёр и не оставили ни бумажки."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "encender una hoguera — разжечь костёр"
      - "la noche de San Juan — ночь Сан-Хуан"
      - "saltar la hoguera — прыгать через костёр"
    collocation_example: "La noche de San Juan saltamos sobre la hoguera. — В ночь Сан-Хуан мы прыгаем через костёр."
    trap: "Hoguera пишется с h и gu: hoguera, а не «ogera». Не путайте с hogar «домашний очаг, дом»."

  - word: horrorizado
    ru: объятый ужасом
    ipa: /oroɾiˈθaðo/
    say: орориса́до
    pron: "h не читается; z в Испании — [θ]."
    meaning: "Испугавшийся до ужаса: потрясённый чем-то страшным или отвратительным."
    examples:
      - "Se quedó horrorizado ante la noticia. — Он пришёл в ужас от новости."
      - "Todo el público vio caer al payaso desde lo alto del escenario, horrorizado. — Вся публика в ужасе смотрела, как клоун падает с высоты сцены."
      - "Estaba horrorizada por la noticia y no podía creer que algo así pasara en su barrio. — Она была в ужасе от новости и не могла поверить, что такое случилось в её районе."
    origin: "Причастие от horrorizar «ужасать» (horror «ужас», лат. horror, от horrere «ощетиниться»). Родственные: horror, horrible «ужасный»."
    register: "Нейтральное."
    synonyms:
      - word: aterrado
        pair: ["Lo miró horrorizado.", "Lo miró aterrado."]
        diff:
          - "aterrado — «перепуганный до смерти», страх за себя"
          - "horrorizado — «охваченный ужасом» от увиденного, отвращение и шок"
    analogs:
      - "horrified — потрясённый ужасом"
      - "appalled — потрясённый"
    dialogue:
      - "Ana: ¿Cómo reaccionó? | Как он отреагировал?"
      - "Pablo: Horrorizado, no podía hablar. | В ужасе, не мог говорить."
      - "Ana: ¿Qué vio exactamente? | Что именно он увидел?"
      - "Pablo: A un niño casi ahogado en la bahía. Se quedó quieto, aturdido, sin acertar a pedir ayuda. | Ребёнка, чуть не утонувшего в бухте. Он замер, оглушённый, не в силах позвать на помощь."
      - "Ana: ¡Qué espeluznante! ¿Y alguien ayudó? | Какой кошмар! И кто-нибудь помог?"
      - "Pablo: Un socorrista se tiró al agua y lo sacó enseguida. | Спасатель бросился в воду и тут же вытащил его."
      - "Ana: Menos mal. ¿Y cómo está el niño? | Слава богу. А как мальчик?"
      - "Pablo: Bien, pero asustado. Ahora el que está horrorizado es su padre. | Хорошо, но напуган. Теперь в ужасе его отец."
    cefr: "B2."
    frequency: "Частое в рассказах."
    collocations:
      - "quedarse horrorizado — остаться в ужасе"
      - "mirar horrorizado — смотреть в ужасе"
      - "horrorizarse ante algo — ужаснуться чему-то"
    collocation_example: "Se quedó horrorizado al ver el accidente. — Он оцепенел от ужаса, увидев аварию."
    trap: "Причастие согласуется: horrorizada, horrorizados. Не путайте horrorizado «в ужасе» и horroroso «ужасный»: первое — состояние человека, второе — качество вещи."

  - word: estafador
    ru: мошенник
    ipa: /estafaˈðoɾ/
    say: эстафадо́р
    pron: "d между гласными мягкое [ð]."
    meaning: "Тот, кто обманывает людей ради денег: выдаёт себя за другого, продаёт то, чего нет."
    examples:
      - "Cuidado con los estafadores en internet. — Остерегайтесь мошенников в интернете."
      - "Un estafador le robó los ahorros haciéndose pasar por empleado del banco. — Мошенник украл его сбережения, выдав себя за сотрудника банка."
      - "La policía detuvo al estafador cuando intentaba salir del país con el dinero de las víctimas. — Полиция задержала мошенника, когда он пытался выехать из страны с деньгами жертв."
    origin: "От estafar «обманывать ради денег» + суффикс -dor. Женский род — estafadora. Родственные: estafa «афера»."
    register: "Нейтральное."
    synonyms:
      - word: timador
        pair: ["Era un estafador.", "Era un timador."]
        diff:
          - "timador — «жулик, который надувает на мелочи», разговорное"
          - "estafador — любой мошенник, и серьёзный"
    analogs:
      - "fraudster — мошенник"
      - "con artist — аферист"
    dialogue:
      - "Marcos: Anoche me llamó un estafador que quería mi contraseña. | Вчера вечером мне позвонил мошенник, который хотел мой пароль."
      - "Marcos: Se hizo pasar por empleado del banco y habló con mucha seguridad. | Он выдал себя за сотрудника банка и говорил очень уверенно."
      - "Marcos: Me dijo que habían detectado un cargo raro y que tenía que verificarlo cuanto antes. | Сказал, что обнаружили странное списание и мне нужно подтвердить его как можно скорее."
      - "Marcos: Mi intuición acertada me avisó: ningún banco te pide la clave por teléfono. | Моя верная интуиция подсказала: ни один банк не просит пароль по телефону."
      - "Marcos: Colgué sin previo aviso y llamé al banco. | Я повесил трубку без предупреждения и позвонил в банк."
      - "Marcos: Ahora lo cuento a todo el mundo, por si algún otro cae en la trampa. | Теперь рассказываю всем, вдруг кто-то ещё попадётся."
    cefr: "B2."
    frequency: "Очень частое в новостях."
    collocations:
      - "caer en manos de un estafador — попасть к мошеннику"
      - "un estafador profesional — профессиональный мошенник"
      - "la estafa — афера"
    collocation_example: "Cayó en manos de un estafador en internet. — Он попал в руки мошенника в интернете."
    trap: "Женский род — estafadora. Не путайте с estafa «афера» и estafar «обманывать»: это три слова одного корня."

  - word: ahogar
    ru: тонуть; душить; топить
    ipa: /aˈoɣaɾ/
    say: аога́р
    pron: "h не читается; ударение на последнем слоге; перед e g меняется на gu: ahogué."
    meaning: "Лишить воздуха: утопить или задушить. Ahogarse — «тонуть, задыхаться». Ещё — «заглушить» (двигатель)."
    examples:
      - "Casi se ahoga en el río. — Он чуть не утонул в реке."
      - "Abro las ventanas de par en par, porque me ahogo con este humo. — Я открываю окна настежь, потому что задыхаюсь от этого дыма."
      - "El niño casi se ahoga en la piscina cuando nadie lo miraba, pero un vecino lo sacó a tiempo. — Мальчик чуть не утонул в бассейне, когда никто не смотрел, но сосед вовремя его вытащил."
    origin: "Из лат. offocare «душить», от fauces «горло». Родственные: ahogo «удушье», ahogado «утонувший»."
    register: "Нейтральное."
    synonyms:
      - word: asfixiar
        pair: ["Se ahogó con el humo.", "Se asfixió con el humo."]
        diff:
          - "asfixiar — «задохнуться» от нехватки воздуха, книжное"
          - "ahogarse — и «утонуть», и «задохнуться»"
    analogs:
      - "to drown — тонуть"
      - "to choke — душить, давиться"
    dialogue:
      - "Ana: ¿Qué pasó en la playa? | Что случилось на пляже?"
      - "Pablo: Un niño casi se ahoga. | Ребёнок чуть не утонул."
      - "Ana: ¡Dios mío! ¿Cómo? | Боже мой! Как?"
      - "Pablo: Se metió en el agua sin vigilancia y una ola lo arrastró. Se asustó y empezó a ahogarse. | Зашёл в воду без присмотра, и его унесло волной. Он испугался и начал тонуть."
      - "Ana: ¿Quién lo ayudó? | Кто ему помог?"
      - "Pablo: Un socorrista que andaba por ahí. No tardó en llegar y lo sacó del agua. | Спасатель, который был неподалёку. Он быстро добрался и вытащил его."
      - "Ana: Menos mal. ¿Y los padres? | Слава богу. А родители?"
      - "Pablo: Estaban horrorizados. Ahora vigilan a su hijo a todas horas. | Были в ужасе. Теперь присматривают за сыном круглые сутки."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ahogarse en el mar — утонуть в море"
      - "ahogarse de calor — задыхаться от жары"
      - "ahogar las penas — заливать горе"
    collocation_example: "Se ahogaba de calor en el autobús. — В автобусе она задыхалась от жары."
    trap: "Ahogarse — возвратный, «утонуть сам»; ahogar — «утопить». Перед e g меняется на gu: ahogué. Не путайте с ahorrar «экономить»."

  - word: afectiva
    ru: ласковый, чуткий (аффективный)
    ipa: /afekˈtiβa/
    say: афэкти́ба
    pron: "v читается как b."
    meaning: "О человеке: тёплый, склонный выражать чувства. Чаще в паре: afectivo — «ласковый, эмоциональный»; ещё — «связанный с чувствами»."
    examples:
      - "Es una persona muy afectiva. — Это очень ласковый человек."
      - "Necesita apoyo afectivo, porque lleva meses sintiéndose solo en una ciudad que no conoce. — Ему нужна эмоциональная поддержка, потому что он уже несколько месяцев чувствует себя одиноким в незнакомом городе."
      - "Los psicólogos hablan de la importancia del vínculo afectivo en los primeros años de vida. — Психологи говорят о важности эмоциональной связи в первые годы жизни."
    origin: "От лат. affectivus «чувствующий», от affectus «настроение, чувство». Родственные: afecto «привязанность», afectar «влиять»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: cariñoso
        pair: ["Es muy afectiva con sus hijos.", "Es muy cariñosa con sus hijos."]
        diff:
          - "cariñoso — «ласковый», разговорное и обычное"
          - "afectivo — «эмоциональный, связанный с чувствами», книжнее"
    analogs:
      - "affectionate — ласковый"
      - "emotional — эмоциональный"
    dialogue:
      - "Ana: ¿Cómo es tu madre? | Какая твоя мама?"
      - "Pablo: Muy afectiva y cariñosa. | Очень ласковая и нежная."
      - "Ana: ¿Besa y abraza mucho? | Часто целует и обнимает?"
      - "Pablo: Sin parar. Cuando llego a casa, me da un abrazo y me pregunta cómo estoy. | Без остановки. Когда я прихожу домой, она обнимает меня и спрашивает, как дела."
      - "Ana: Qué suerte. La mía es más sobria. | Повезло. Моя более сдержанная."
      - "Pablo: Mi padre es al revés: poco afectivo, pero muy fiel y protector. | Мой отец наоборот: мало ласковый, но очень верный и заботливый."
      - "Ana: Se complementan. | Они дополняют друг друга."
      - "Pablo: Sí. Aunque a veces se llevan mal, pese a todo se quieren mucho. | Да. Хотя иногда ссорятся, несмотря ни на что, очень любят друг друга."
    cefr: "C1."
    frequency: "Нечастое: в психологии и описаниях."
    collocations:
      - "relación afectiva — эмоциональная связь"
      - "apoyo afectivo — эмоциональная поддержка"
      - "vida afectiva — личная жизнь"
    collocation_example: "Los niños necesitan apoyo afectivo. — Детям нужна эмоциональная поддержка."
    trap: "Не путайте afectivo «ласковый, эмоциональный» с efectivo «действенный»: разные слова, похожие по звуку. Прилагательное меняется по роду: afectivo/afectiva."

  - word: argot
    ru: жаргон
    ipa: /aɾˈɣot/
    say: арго́т
    pron: "t на конце слышна: argot — «арго́т»; заимствовано из французского."
    meaning: "Особая лексика группы людей: подростков, воров, врачей. Слова, которых не знают посторонние."
    examples:
      - "Los jóvenes usan mucho argot. — Молодёжь много использует жаргона."
      - "El diccionario recoge palabras del argot de los marineros que casi nadie conoce. — Словарь содержит слова из жаргона моряков, которые почти никто не знает."
      - "No entiendo el argot de los médicos, y por eso siempre les pido que lo expliquen con palabras sencillas. — Я не понимаю жаргона врачей, поэтому всегда прошу объяснять простыми словами."
    origin: "Из французского argot «воровской жаргон»: исходно тайный язык воров. В испанский вошло в XIX веке."
    register: "Нейтральное."
    synonyms:
      - word: jerga
        pair: ["Usan argot juvenil.", "Usan jerga juvenil."]
        diff:
          - "jerga — общее слово «жаргон» любой группы"
          - "argot — «жаргон» чаще воровской или уличный"
    analogs:
      - "slang — сленг"
      - "jargon — профессиональный жаргон"
    dialogue:
      - "Ana: ¿Entiendes lo que dicen? | Ты понимаешь, что они говорят?"
      - "Pablo: No, usan mucho argot. | Нет, они используют много жаргона."
      - "Ana: Yo capto algunas palabras, pero no todas. | Я улавливаю некоторые слова, но не все."
      - "Pablo: Es normal. El argot de los chavales cambia cada año y es muy corriente que los mayores no lo entiendan. | Это нормально. Жаргон подростков меняется каждый год, и взрослые часто его не понимают."
      - "Ana: ¿Y por qué lo usan? | И почему они им пользуются?"
      - "Pablo: Para sentirse parte del grupo. Es una forma de decir «somos de aquí» sin explicarlo. | Чтобы чувствовать себя частью группы. Это способ сказать «мы свои», не объясняя."
      - "Ana: Qué interesante. Yo aprendo uno nuevo cada vez que los oigo. | Как интересно. Я каждый раз узнаю новое, когда их слышу."
      - "Pablo: Pues anótalo en tu agenda, que mañana ya no se dice. | Тогда запиши в ежедневник, потому что завтра так уже не говорят."
    cefr: "C1."
    frequency: "Нечастое."
    collocations:
      - "argot juvenil — молодёжный жаргон"
      - "argot policial — полицейский жаргон"
      - "en argot — на жаргоне"
    collocation_example: "En argot, a la policía le llaman «la poli». — На жаргоне полицию зовут «поли»."
    trap: "Мужского рода: el argot; t в конце слышна, как во французском. Не путайте argot «жаргон» с argón «аргон» (газ)."
