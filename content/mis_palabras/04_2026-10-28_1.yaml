# Третий список автора, часть 4 — «Desconcierto en el hospital», глава 2 (слова 1–14).
lang: es
words:
  - word: no revestir ninguna gravedad
    ru: не представлять никакой серьёзной опасности
    ipa: /no reβesˈtiɾ niŋˈguna ɣɾaβeˈðað/
    say: но рэбэсти́р нингу́на грабэда́д
    pron: "Спрягается как pedir: no reviste, no revistió. d на конце слова мягкое: gravedad."
    meaning: "Книжная формула: болезнь или травма не опасна. Revestir здесь значит «иметь, носить какой-то характер»."
    examples:
      - "La herida no reviste ninguna gravedad. — Рана не представляет никакой опасности."
      - "El golpe no revistió gravedad. — Удар не оказался серьёзным."
    origin: "revestir «облекать, одевать» (re- + vestir «одевать»): здесь «принимать вид, характер». gravedad — от grave «тяжёлый, серьёзный» (лат. gravis)."
    register: "Формальное, медицинское и юридическое, язык справок и новостей."
    synonyms:
      - word: no ser grave
        pair: ["La lesión no reviste gravedad.", "La lesión no es grave."]
        diff:
          - "no ser grave — обычная разговорная форма"
          - "no revestir gravedad — официальная формула из справок"
    analogs:
      - "not to be serious — не быть серьёзным"
      - "to pose no danger — не представлять опасности"
    dialogue:
      - "Ana: ¿Qué dice el médico? | Что говорит врач?"
      - "Pablo: Que no reviste ninguna gravedad. | Что ничего серьёзного."
    cefr: "C1."
    frequency: "Частое в газетных и медицинских текстах, в разговоре — почти никогда."
    collocations:
      - "revestir gravedad — быть серьёзным"
      - "revestir importancia — иметь значение"
      - "revestir carácter urgente — носить срочный характер"
    collocation_example: "El asunto reviste especial importancia. — Дело имеет особую важность."
    trap: "С revestir обычно отрицание: no reviste gravedad. Слово gravedad — и «тяжесть», и «гравитация»: sin gravedad — «в невесомости»."

  - word: concienzudo
    ru: тщательный, добросовестный
    ipa: /konθjenˈθuðo/
    say: консьенсу́до
    pron: "Оба c — [θ] в Испании: con-cien-zu-do. ie — один слог «ье»."
    meaning: "О человеке или работе: сделанный очень тщательно, с полной ответственностью."
    examples:
      - "Es un médico muy concienzudo. — Он очень добросовестный врач."
      - "Hizo un examen concienzudo. — Он провёл тщательный осмотр."
    origin: "От conciencia «совесть, сознание» + суффикс -udo, значащий «полный чего-то» (как en cabezudo «упрямый»). «Полный совести»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: minucioso
        pair: ["Hizo un análisis concienzudo.", "Hizo un análisis minucioso."]
        diff:
          - "minucioso — подчёркивает внимание к мелочам"
          - "concienzudo — подчёркивает ответственность и совесть"
    analogs:
      - "conscientious — добросовестный; ложный друг: не «сознательный»"
      - "thorough — тщательный"
    dialogue:
      - "Ana: ¿Cómo es la doctora? | Какая эта врач?"
      - "Pablo: Muy concienzuda, lo revisa todo. | Очень дотошная, проверяет всё."
    cefr: "C1."
    frequency: "Нечастое: в прозе и описаниях людей."
    collocations:
      - "un trabajo concienzudo — добросовестная работа"
      - "un estudio concienzudo — тщательное исследование"
      - "una persona concienzuda — добросовестный человек"
    collocation_example: "Preparó el informe de forma concienzuda. — Он подготовил отчёт тщательно."
    trap: "Ложный друг: «concienzudo» — не «conscious», а «добросовестный». «Сознательный» по-испански — consciente. Пишется conciencia через c: concienzudo."

  - word: conforme
    ru: довольный, согласный, спокойный
    ipa: /konˈfoɾme/
    say: конфо́рмэ
    meaning: "Согласный и не против; удовлетворённый ситуацией. Ещё — «в соответствии с чем-то» (conforme a)."
    examples:
      - "Estoy conforme con el resultado. — Я доволен результатом."
      - "¿Estás conforme? — Ты согласен?"
      - "Actuó conforme a la ley. — Он действовал в соответствии с законом."
    origin: "Из лат. conformis «сходный, одинаковый»: con- «вместе» + forma «форма». Родственные: conformidad «согласие», inconforme «недовольный»."
    register: "Нейтральное."
    synonyms:
      - word: satisfecho
        pair: ["Estoy conforme con mi sueldo.", "Estoy satisfecho con mi sueldo."]
        diff:
          - "satisfecho — именно «доволен, удовлетворён»"
          - "conforme — «согласен принять как есть», чуть сдержаннее"
    analogs:
      - "satisfied — доволен"
      - "in agreement — согласен"
    dialogue:
      - "Ana: ¿Te parece bien el horario? | Тебя устраивает график?"
      - "Pablo: Sí, estoy conforme. | Да, я согласен."
    cefr: "B2."
    frequency: "Частое в разговоре и документах."
    collocations:
      - "estar conforme con — быть согласным с"
      - "conforme a — в соответствии с"
      - "dar la conformidad — дать согласие"
    collocation_example: "Firmó conforme a lo acordado. — Он подписал в соответствии с договорённостью."
    trap: "После estar conforme нужен con: estoy conforme con eso. Не путайте с conformarse «довольствоваться»: «Me conformo con poco»."

  - word: trámite burocrático
    ru: бюрократическая формальность
    ipa: /ˈtɾamite buɾoˈkɾatiko/
    say: тра́митэ бурокра́тико
    meaning: "Процедура с бумагами, справками и подписями, которую нужно пройти. Burocrático — «бумажный, канцелярский»."
    examples:
      - "Todavía faltan unos trámites burocráticos. — Ещё осталось несколько бюрократических формальностей."
      - "Hay que hacer muchos trámites para ingresar. — Для госпитализации нужно пройти много формальностей."
    origin: "trámite — от лат. trames «тропа, путь»: «путь, по которому ведут дело». Burocracia — от франц. bureau «бюро, письменный стол» + греч. kratos «власть»: «власть письменного стола»."
    register: "Нейтральное, часто с лёгкой иронией."
    synonyms:
      - word: papeleo
        pair: ["Me ocupa mucho papeleo.", "Me ocupan muchos trámites."]
        diff:
          - "papeleo — «бумажная волокита» в целом, разговорное и ироничное"
          - "trámite — конкретная формальность"
    analogs:
      - "red tape — бюрократическая волокита"
      - "formality — формальность"
    dialogue:
      - "Ana: ¿Ya te dieron el alta? | Тебя уже выписали?"
      - "Pablo: Faltan unos trámites burocráticos. | Осталось пройти формальности."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "hacer un trámite — оформить, пройти формальность"
      - "los trámites burocráticos — бюрократические процедуры"
      - "en trámite — в процессе оформления"
    collocation_example: "Mi solicitud está en trámite. — Моё заявление находится на рассмотрении."
    trap: "Trámite — существительное мужского рода: el trámite. Произносится с ударением на тра: «тра́митэ». Не путайте с trampa «ловушка, обман»."

  - word: acogedor
    ru: уютный, приятный
    ipa: /akoxeˈðoɾ/
    say: акохэдо́р
    pron: "g перед e — «х»; d между гласными мягкое [ð]."
    meaning: "О месте, где тепло и спокойно: хочется остаться. О человеке — «радушный, приветливый»."
    examples:
      - "Es un café muy acogedor. — Это очень уютное кафе."
      - "La habitación era pequeña pero acogedora. — Комната была маленькая, но уютная."
    origin: "От acoger «принимать, приютить» (a- + coger «брать»). Родственные: acogida «приём», acogerse «прибегнуть»."
    register: "Нейтральное."
    synonyms:
      - word: confortable
        pair: ["La casa es acogedora.", "La casa es confortable."]
        diff:
          - "confortable — удобный по обстановке"
          - "acogedor — тёплый, домашний, с ощущением уюта"
    analogs:
      - "cosy — уютный"
      - "welcoming — гостеприимный"
    dialogue:
      - "Ana: ¿Cómo es la habitación? | Какая палата?"
      - "Pablo: Pequeña, pero muy acogedora. | Небольшая, но очень уютная."
    cefr: "B2."
    frequency: "Частое в описаниях мест."
    collocations:
      - "un ambiente acogedor — уютная атмосфера"
      - "un hogar acogedor — уютный дом"
      - "un trato acogedor — радушное обращение"
    collocation_example: "Nos recibieron en un salón muy acogedor. — Нас приняли в очень уютной гостиной."
    trap: "Женский род — acogedora. Не путайте с acogida «приём»: «hacer una buena acogida»."

  - word: vesícula
    ru: желчный пузырь
    ipa: /beˈsikula/
    say: бэси́кула
    pron: "c перед u — [k]; ударение на si."
    meaning: "Небольшой орган, который накапливает желчь. Обычно говорят vesícula biliar. Ещё — «пузырёк» (на коже)."
    examples:
      - "Le operaron la vesícula. — Ему удалили желчный пузырь."
      - "Tiene piedras en la vesícula. — У него камни в желчном пузыре."
    origin: "Из лат. vesicula «пузырёк»: уменьшительное от vesica «пузырь». Родственное — vejiga «мочевой пузырь»."
    register: "Медицинское, нейтральное."
    synonyms: []
    analogs:
      - "gallbladder — желчный пузырь"
      - "vesicle — пузырёк"
    dialogue:
      - "Ana: ¿Por qué te operan? | Почему тебя оперируют?"
      - "Pablo: Por la vesícula. | Из-за желчного пузыря."
    cefr: "C1."
    frequency: "Частое в разговорах о здоровье."
    collocations:
      - "vesícula biliar — желчный пузырь"
      - "operar de la vesícula — оперировать желчный пузырь"
      - "cálculos en la vesícula — камни в желчном пузыре"
    collocation_example: "Me operaron de la vesícula en verano. — Мне оперировали желчный пузырь летом."
    trap: "Ударение на si: vesícula, знак ставят обязательно. Не путайте с vejiga «мочевой пузырь» и ampolla «волдырь»."

  - word: comprimido
    ru: таблетка
    ipa: /kompɾiˈmiðo/
    say: комприми́до
    meaning: "Лекарство в виде маленького плотного кружочка. Ещё — «сжатый, прессованный»."
    examples:
      - "Tome un comprimido después de comer. — Принимайте таблетку после еды."
      - "Es un archivo comprimido. — Это сжатый файл."
    origin: "Причастие от comprimir «сжимать» (лат. comprimere: con- «вместе» + premere «давить»). Таблетка — это «спрессованный порошок»."
    register: "Нейтральное, медицинское."
    synonyms:
      - word: pastilla
        pair: ["Tómate un comprimido.", "Tómate una pastilla."]
        diff:
          - "pastilla — обиходное «таблетка» и в Испании, и в Латинской Америке"
          - "comprimido — аптечное и из инструкции"
    analogs:
      - "tablet — таблетка"
      - "pill — таблетка (обиходное)"
    dialogue:
      - "Ana: ¿Cada cuánto me lo tomo? | Как часто это принимать?"
      - "Pablo: Un comprimido cada ocho horas. | По таблетке каждые восемь часов."
    cefr: "B2."
    frequency: "Частое в аптеке и инструкциях."
    collocations:
      - "un comprimido al día — одна таблетка в день"
      - "tomar un comprimido — принять таблетку"
      - "comprimido efervescente — шипучая таблетка"
    collocation_example: "Tome un comprimido cada doce horas. — Принимайте по таблетке каждые двенадцать часов."
    trap: "Comprimido — причастие, но и существительное: el comprimido. Не путайте с cápsula «капсула» и pastilla «пастилка, леденец»."

  - word: pronosticar
    ru: предсказывать, прогнозировать
    ipa: /pɾonostiˈkaɾ/
    say: проностика́р
    pron: "Перед e c меняется на qu: pronostiqué."
    meaning: "Предсказать, как будет развиваться что-то: погода, болезнь, результат матча."
    examples:
      - "El médico pronosticó una pronta mejoría. — Врач предсказал скорое улучшение."
      - "Pronostican lluvia para mañana. — На завтра прогнозируют дождь."
    origin: "От pronóstico «прогноз» (греч. pro- «вперёд» + gnosis «знание»). Родственное: diagnóstico «диагноз» — «распознавание», а pronóstico — «предвидение»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: predecir
        pair: ["Pronosticaron un cambio.", "Predijeron un cambio."]
        diff:
          - "predecir — шире: любое предсказание, даже без данных"
          - "pronosticar — прогноз на основе признаков, в медицине и погоде"
    analogs:
      - "to forecast — прогнозировать"
      - "to predict — предсказывать"
    dialogue:
      - "Ana: ¿Qué pronostican para el fin de semana? | Что обещают на выходные?"
      - "Pablo: Pronostican sol y calor. | Обещают солнце и жару."
    cefr: "B2."
    frequency: "Частое в новостях о погоде и спорте."
    collocations:
      - "pronosticar el tiempo — предсказывать погоду"
      - "pronosticar una mejoría — предсказать улучшение"
      - "pronóstico reservado — осторожный прогноз"
    collocation_example: "El pronóstico es reservado. — Прогноз осторожный."
    trap: "В форме yo нужно qu: pronostiqué, а не pronosticé. Существительное — pronóstico, с ударением на нó."

  - word: sillón abatible
    ru: раскладное кресло
    ipa: /siˈʎon aβaˈtiβle/
    say: сийо́н абати́блэ
    pron: "ll в большинстве регионов — как «й»; b и v между гласными мягкие [β]."
    meaning: "Кресло, у которого спинка откидывается назад: на таком спят рядом с больным в палате."
    examples:
      - "Dormí en un sillón abatible junto a la cama. — Я спал в раскладном кресле рядом с кроватью."
      - "La habitación tiene un sillón abatible para el acompañante. — В палате есть раскладное кресло для сопровождающего."
    origin: "sillón — увеличительное от silla «стул» (лат. sella). abatible — от abatir «опускать, откидывать» + суффикс -ible, значащий «можно»: «такое, что можно откинуть»."
    register: "Нейтральное, деловое, бытовое."
    synonyms:
      - word: sillón reclinable
        pair: ["Tiene un sillón abatible.", "Tiene un sillón reclinable."]
        diff:
          - "reclinable — «откидывающийся» назад, спинка с наклоном"
          - "abatible — «раскладывающийся» почти до горизонтали"
    analogs:
      - "recliner — кресло с откидной спинкой"
      - "folding chair-bed — кресло-кровать"
    dialogue:
      - "Ana: ¿Dónde dormirás? | Где ты будешь спать?"
      - "Pablo: En el sillón abatible de la habitación. | В раскладном кресле в палате."
    cefr: "C1."
    frequency: "Нечастое: в описаниях больниц, мебели, поездов."
    collocations:
      - "asiento abatible — откидное сиденье"
      - "mesa abatible — откидной столик"
      - "sillón de acompañante — кресло для сопровождающего"
    collocation_example: "Bajó la mesa abatible del asiento. — Он опустил откидной столик на спинке сиденья."
    trap: "Abatir — ещё и «сбивать с ног; удручать», а abatido — «подавленный». Но abatible — только «откидной»."

  - word: cuarto de aseo
    ru: санузел, ванная
    ipa: /ˈkwaɾto de aˈseo/
    say: куа́рто дэ асэ́о
    pron: "ua — один слог «уа»; d между гласными мягкое [ð]."
    meaning: "Небольшая комната с умывальником и туалетом. Часто говорят просто aseo или baño."
    examples:
      - "El cuarto de aseo está al final del pasillo. — Санузел в конце коридора."
      - "Cada habitación tiene su propio cuarto de aseo. — В каждой палате свой санузел."
    origin: "cuarto «комната» (лат. quartus «четвёртый» → «четверть дома») + aseo «гигиена, опрятность» (от asear «приводить в порядок»)."
    register: "Нейтральное, формальное; часто в объявлениях и на табличках."
    synonyms:
      - word: baño
        pair: ["Voy al cuarto de aseo.", "Voy al baño."]
        diff:
          - "baño — самое обычное слово, в том числе в быту и дома"
          - "cuarto de aseo — вежливее и официальнее, с табличек"
    analogs:
      - "restroom — туалет (американское)"
      - "bathroom — ванная, туалет"
    dialogue:
      - "Ana: ¿Dónde está el cuarto de aseo? | Где санузел?"
      - "Pablo: Segunda puerta a la derecha. | Вторая дверь справа."
    cefr: "B1."
    frequency: "Частое в быту и на табличках."
    collocations:
      - "los aseos — туалеты (на табличках)"
      - "artículos de aseo — туалетные принадлежности"
      - "aseo personal — личная гигиена"
    collocation_example: "Los aseos están junto a la entrada. — Туалеты рядом с входом."
    trap: "На табличках: aseos (мн.), а не «cuartos de aseo». Слово aseo — и «санузел», и «гигиена»; asear — «приводить в порядок»."

  - word: aprovechar para
    ru: воспользоваться случаем, чтобы...
    ipa: /apɾoβeˈtʃaɾ ˈpaɾa/
    say: апробэча́р па́ра
    pron: "ch — «ч»; v между гласными мягкая [β]."
    meaning: "Сделать что-то ещё, пока есть возможность: «заодно». После para — инфинитив."
    examples:
      - "Aproveché para visitar a mi tía. — Я воспользовался случаем и навестил тётю."
      - "Aprovecha para descansar. — Пользуйся случаем и отдохни."
    origin: "От provecho «польза, выгода» (лат. profectus «успех») + приставка a-: «извлечь пользу». Родственное: «¡Buen provecho!» — «Приятного аппетита!»"
    register: "Нейтральное, годится везде."
    synonyms:
      - word: aprovechar la ocasión para
        pair: ["Aprovechó para salir.", "Aprovechó la ocasión para salir."]
        diff:
          - "aprovechar la ocasión para — то же, полнее и книжнее"
    analogs:
      - "to take the opportunity to — воспользоваться случаем"
      - "to make the most of — использовать по максимуму"
    dialogue:
      - "Ana: ¿Qué haces en el centro? | Что ты делаешь в центре?"
      - "Pablo: Aprovecho para comprar un libro. | Заодно покупаю книгу."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "aprovechar la ocasión — воспользоваться случаем"
      - "aprovechar el tiempo — использовать время"
      - "aprovecharse de alguien — воспользоваться кем-то (негативно)"
    collocation_example: "Aprovecharé el viaje para ver a mis padres. — Я воспользуюсь поездкой, чтобы повидать родителей."
    trap: "Aprovechar и aprovecharse разные: «aprovecharse de» — «злоупотребить, воспользоваться кем-то» (плохо). Для «заодно сделать» — aprovechar para + инфинитив."

  - word: foráneo
    ru: иностранный, чужой, пришлый
    ipa: /foˈɾaneo/
    say: фора́нэо
    meaning: "Не местный, пришедший откуда-то извне: об обычаях, людях, товарах."
    examples:
      - "Había mucha gente foránea en el pueblo. — В посёлке было много приезжих."
      - "Prefieren los productos foráneos. — Они предпочитают импортные товары."
    origin: "Из лат. foraneus «внешний», от foras «наружу, вне». Родственное: forastero «приезжий, чужак»."
    register: "Книжное, формальное."
    synonyms:
      - word: extranjero
        pair: ["Los productos foráneos son caros.", "Los productos extranjeros son caros."]
        diff:
          - "extranjero — «из-за границы», о стране"
          - "foráneo — шире: «чужой, не местный», может быть и из другого региона"
    analogs:
      - "foreign — иностранный, чужой"
      - "outsider — чужак"
    dialogue:
      - "Ana: ¿Quién es esa mujer? | Кто эта женщина?"
      - "Pablo: Una foránea, no es de aquí. | Приезжая, она не здешняя."
    cefr: "C1."
    frequency: "Нечастое: в прессе и книжной речи."
    collocations:
      - "capital foráneo — иностранный капитал"
      - "influencia foránea — внешнее влияние"
      - "gente foránea — приезжие"
    collocation_example: "Esta influencia foránea cambió la cultura local. — Это внешнее влияние изменило местную культуру."
    trap: "Не путайте с forastero «приезжий, чужак»: forastero — существительное, foráneo — прилагательное. Ударение на ра: foráneo."

  - word: bollo
    ru: булочка
    ipa: /ˈboʎo/
    say: бо́йо
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Небольшая сладкая или простая булка. Ещё — «вмятина» (en la chapa) и «шишка» (от удара) в разговоре."
    examples:
      - "Desayuné un café y un bollo. — Я позавтракал кофе и булочкой."
      - "El coche tiene un bollo en la puerta. — На двери машины вмятина."
    origin: "Возможно, от bolla «шарик, пузырёк» (лат. bulla). Булочка — «шарик из теста»; вмятина — как «шишка» на металле."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: panecillo
        pair: ["Comí un bollo con mantequilla.", "Comí un panecillo con mantequilla."]
        diff:
          - "panecillo — маленький хлебец, обычно несладкий"
          - "bollo — чаще сладкая булочка, из кондитерской"
    analogs:
      - "bun — булочка"
      - "roll — булка, булочка"
    dialogue:
      - "Ana: ¿Qué pides? | Что закажешь?"
      - "Pablo: Un café con leche y un bollo. | Кофе с молоком и булочку."
    cefr: "B1."
    frequency: "Очень частое в кафе Испании."
    collocations:
      - "un bollo de leche — сладкая молочная булочка"
      - "bollería — выпечка"
      - "un bollo en el coche — вмятина на машине"
    collocation_example: "En la cafetería venden bollos recién hechos. — В кафе продают свежую выпечку."
    trap: "В Латинской Америке bollo бывает совсем другим: тамале из кукурузы (Колумбия, Куба). И не путайте с bolo «кегля» и bola «шар»."

  - word: en ayunas
    ru: натощак
    ipa: /en aˈʝunas/
    say: эн аю́нас
    pron: "y между гласными — «й»: ayunas — «аю́нас»."
    meaning: "Ничего не поев с утра. Часто в рекомендациях врача перед анализом."
    examples:
      - "Tienes que venir en ayunas. — Тебе нужно прийти натощак."
      - "Me hicieron el análisis en ayunas. — Мне сделали анализ натощак."
    origin: "ayuno «пост, голодание» (лат. ieiunium «пост»). Выражение «en ayunas» — буквально «в посте»."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "on an empty stomach — на пустой желудок"
      - "fasting — натощак, в состоянии поста"
    dialogue:
      - "Ana: ¿Puedo desayunar antes de la analítica? | Можно позавтракать до анализа?"
      - "Pablo: No, tiene que ir en ayunas. | Нет, нужно прийти натощак."
    cefr: "B1."
    frequency: "Частое в разговорах о здоровье."
    collocations:
      - "estar en ayunas — быть натощак"
      - "tomar en ayunas — принимать натощак"
      - "quedarse en ayunas — остаться ни с чем, не понять (разг.)"
    collocation_example: "Me dejó en ayunas y no entendí nada. — Я остался ничего не поняв."
    trap: "Выражение всегда во множественном: en ayunas, а не «en ayuna». Ещё «quedarse en ayunas» значит «остаться в неведении»."
