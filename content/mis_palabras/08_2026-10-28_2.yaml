# Четвёртый список автора, часть 8 — «Lola Lago: Una nota falsa» (слова 17–32).
lang: es
words:
  - word: orujo
    ru: орухо (крепкий алкоголь из виноградных выжимок)
    ipa: /oˈɾuxo/
    say: ору́хо
    pron: "j — «х»: orujo — «ору́хо»."
    meaning: "Крепкий напиток из выжимок винограда, традиционный на севере Испании (Галисия, Кантабрия). Похож на граппу и чачу."
    examples:
      - "Probé un orujo casero en Galicia. — Я попробовал домашнее орухо в Галисии."
      - "Después de comer tomamos un orujo, que es una costumbre típica del norte. — После обеда мы выпили орухо, это типичная привычка севера."
      - "El orujo de Galicia es muy conocido y se vende en botellas de cristal con etiquetas antiguas. — Орухо из Галисии очень известно, его продают в стеклянных бутылках со старинными этикетками."
    origin: "Происхождение неясно. Само слово orujo — «выжимки» (кожица и косточки винограда после отжима), из них и гонят напиток."
    register: "Нейтральное, о напитке."
    synonyms:
      - word: aguardiente
        pair: ["Sirvieron orujo.", "Sirvieron aguardiente."]
        diff:
          - "aguardiente — общее название крепких напитков"
          - "orujo — конкретно из выжимок винограда"
    analogs:
      - "grappa — итальянский аналог"
      - "pomace brandy — бренди из выжимок"
    dialogue:
      - "Ana: ¿Qué quieres tomar? | Что будешь пить?"
      - "Pablo: Un orujo, por favor. | Орухо, пожалуйста."
      - "Ana: ¿Un orujo? ¿A estas horas? | Орухо? В такое время?"
      - "Pablo: Es para la sobremesa. En Galicia se toma después de comer, para ayudar a la digestión. | Это для послеобеденной беседы. В Галисии его пьют после еды, чтобы помочь пищеварению."
      - "Ana: Pues yo prefiero un café. El orujo me deja aturdida. | Я лучше выпью кофе. От орухо у меня кружится голова."
      - "Pablo: Es fuerte, sí. Pero un orujo casero, con calma, saborea la tarde. | Крепкий, да. Но домашнее орухо, не спеша, позволяет насладиться вечером."
      - "Ana: Ya veo que lo sabes disfrutar. | Вижу, ты умеешь получать удовольствие."
      - "Pablo: Sin prisas y sin exagerar. Tampoco me gusta ingerir alcohol en exceso. | Без спешки и без излишеств. Я тоже не люблю употреблять много алкоголя."
    cefr: "B2."
    frequency: "Нечастое: региональное слово из быта."
    collocations:
      - "un chupito de orujo — рюмка орухо"
      - "orujo de hierbas — травяной орухо"
      - "orujo gallego — галисийский орухо"
    collocation_example: "Terminó la comida con un chupito de orujo. — Он закончил обед рюмкой орухо."
    trap: "Не путайте orujo «выжимки» с aguardiente и с ron «ром». Chupito — «рюмка» (небольшая, на один глоток)."

  - word: picar
    ru: перекусить; колоть; кусать (о комаре); клевать
    ipa: /piˈkaɾ/
    say: пика́р
    pron: "Перед e c меняется на qu: piqué."
    meaning: "Основное значение — «колоть, жалить» (о комаре). В разговоре — «перекусить, съесть понемногу»; «чесаться»; «клюнуть» (о рыбе)."
    examples:
      - "Esta salsa pica un poco. — Этот соус немного острый."
      - "La sopa pica mucho: le he puesto demasiada guindilla y vas a necesitar agua. — Суп очень острый: я положил слишком много чили, тебе понадобится вода."
      - "Me ha picado un mosquito en el brazo y no puedo dejar de rascarme desde anoche. — Меня укусил комар в руку, и я не могу перестать чесаться со вчерашнего вечера."
    origin: "От лат. picus «дятел»: «стучать, колоть клювом». Родственные: pico «клюв, вершина», picante «острый», picadura «укус»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tapear
        pair: ["Vamos a picar algo.", "Vamos de tapas."]
        diff:
          - "ir de tapas — пойти перекусить тапас в баре"
          - "picar — съесть что-то небольшое, не обязательно в баре"
    analogs:
      - "to snack — перекусить"
      - "to sting — жалить"
    dialogue:
      - "Después de un día de trabajo, Marcos llegó a casa con mucha hambre. | После рабочего дня Маркос пришёл домой очень голодным."
      - "La cena aún no estaba lista, así que decidió picar algo. | Ужин ещё не был готов, и он решил перекусить."
      - "Abrió la nevera y sacó queso, aceitunas y unas rodajas de chorizo. | Открыл холодильник и достал сыр, оливки и несколько кружков чоризо."
      - "El chorizo picaba un poco y tuvo que beber agua enseguida. | Чоризо оказался островатым, и ему пришлось тут же запить водой."
      - "Mientras picaba, un mosquito le picó en el brazo, y lo espantó con una servilleta. | Пока он перекусывал, комар укусил его в руку, и он отогнал его салфеткой."
      - "Cuando por fin se sentó a cenar, ya casi no tenía hambre. | Когда он наконец сел ужинать, голода почти не осталось."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "picar algo — перекусить"
      - "picar una cebolla — нарезать лук"
      - "picar carne — сделать фарш"
      - "picar el anzuelo — клюнуть на приманку"
    collocation_example: "Pica la cebolla muy fina. — Нарежь лук очень мелко."
    trap: "Picar — глагол со многими значениями: «кусать», «перекусить», «нарезать», «быть острым». Перед e c меняется на qu: piqué, piquemos."

  - word: caer simpático
    ru: нравиться как человек
    ipa: /kaˈeɾ simˈpatiko/
    say: каэ́р симпа́тико
    pron: "Конструкция как gustar: «мне нравится человек»: me cae simpático, me caen simpáticos."
    meaning: "Вызывать симпатию, быть приятным как человек. Не про внешность, а про характер, обаяние. Противоположное — caer mal."
    examples:
      - "Tu amigo me resulta muy simpático. — Твой друг мне очень симпатичен."
      - "El nuevo profesor cae simpático a todos los alumnos desde la primera semana. — Новый преподаватель нравится всем ученикам с первой недели."
      - "Ella no me cae simpática, aunque reconozco que es muy buena en su trabajo. — Она мне не симпатична, хотя я признаю, что она очень хороша в своей работе."
    origin: "caer «падать, приходиться» + simpático «симпатичный» (греч. sympathes: syn- «вместе» + pathos «чувство»). Дословно «падать симпатично» → «производить впечатление»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: caer bien
        pair: ["Me cae simpático.", "Me cae bien."]
        diff:
          - "caer bien — самое обычное в разговоре"
          - "caer simpático — чуть мягче и выразительнее"
    analogs:
      - "to like someone — симпатизировать"
      - "to get on well with — хорошо ладить"
    dialogue:
      - "Ana: ¿Qué tal el nuevo compañero? | Как новый коллега?"
      - "Pablo: Me cae muy simpático. | Он мне очень симпатичен."
      - "Ana: ¿Por qué? Si apenas lo conoces. | Почему? Ты же его почти не знаешь."
      - "Pablo: Porque desde el primer día se ofreció a ayudarme y no se hizo el interesante. | Потому что с первого дня предложил помочь и не важничал."
      - "Ana: Qué bien. A mí el jefe nuevo no me cae nada simpático. | Хорошо. А мне новый начальник совсем несимпатичен."
      - "Pablo: ¿El que monta en cólera por todo? | Тот, что злится по любому поводу?"
      - "Ana: Ese mismo. Siempre está de mal humor y no se ríe nunca. | Он самый. Всегда в плохом настроении и никогда не смеётся."
      - "Pablo: Pues tienes para rato. Ármate de paciencia. | Тогда у тебя надолго. Запасайся терпением."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "caer bien — нравиться"
      - "caer mal — не нравиться"
      - "caer fatal — очень не нравиться"
    collocation_example: "Su jefe le cae fatal. — Начальник ему совсем не нравится."
    trap: "Это про человека и его характер: «Me cae bien Juan» (а не «Me gusta Juan», что может значить «влюблён»). Прилагательное согласуется с человеком: simpática, simpáticos."

  - word: culebrón
    ru: мыльная опера
    ipa: /kuleˈβɾon/
    say: кулебро́н
    pron: "b между гласными мягкая [β]."
    meaning: "Длинный телесериал с запутанными сюжетами и сильными страстями. Ещё — «запутанная история с драмой»."
    examples:
      - "Vimos un culebrón en la tele. — Мы смотрели по телевизору сериал-мелодраму."
      - "Aquel culebrón latinoamericano duró cuatro años y lo vieron millones de personas. — Тот латиноамериканский сериал шёл четыре года, и его смотрели миллионы людей."
      - "Mi abuela ve el culebrón cada tarde, y ya conoce la vida de todos los personajes. — Моя бабушка смотрит сериал каждый вечер и уже знает жизнь всех героев."
    origin: "От culebra «змея» + увеличительное -ón: «большая змея» за то, что сериал тянется бесконечно. Родственное: culebra «змея», culebrear «извиваться»."
    register: "Разговорное, с иронией."
    synonyms:
      - word: telenovela
        pair: ["Ve un culebrón.", "Ve una telenovela."]
        diff:
          - "telenovela — нейтральное название жанра"
          - "culebrón — ироничное: «тягучий сериал» с драмой"
    analogs:
      - "soap opera — мыльная опера"
      - "melodrama — мелодрама"
    dialogue:
      - "Los padres de Pablo tienen una costumbre: a las cinco, ven el culebrón. | У родителей Пабло есть привычка: в пять они смотрят сериал."
      - "Se sientan juntos en el sofá, con un café y unos bollos. | Они садятся рядом на диван с кофе и булочками."
      - "Nadie puede hablar ni llamar, porque la historia es muy intensa. | Никто не может ни говорить, ни звонить, потому что сюжет очень напряжённый."
      - "Siempre hay una infidelidad, una herencia y alguien que finge estar muerto. | Всегда есть измена, наследство и кто-то, кто притворяется мёртвым."
      - "Pablo se ríe, pero a veces se queda enganchado sin querer. | Пабло смеётся, но иногда незаметно для себя втягивается."
      - "Su madre dice que es una tontería, aunque no se pierde ni un capítulo. | Мать говорит, что это глупость, хотя не пропускает ни одной серии."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "un culebrón venezolano — венесуэльский сериал"
      - "un culebrón familiar — семейная драма"
      - "ser un culebrón — быть как сериал"
    collocation_example: "Su divorcio fue un auténtico culebrón. — Его развод был настоящей мыльной оперой."
    trap: "Слово ироничное: говорят о тягучем сериале или жизни с драмой. Не путайте culebrón с culebra «змея»."

  - word: vigilar
    ru: следить, присматривать
    ipa: /bixiˈlaɾ/
    say: бихила́р
    pron: "v читается как b; g перед i — «х»."
    meaning: "Внимательно следить за кем-то или чем-то, чтобы ничего не случилось: за ребёнком, домом, больным."
    examples:
      - "Vigila el horno, que no se queme. — Следи за духовкой, чтобы ничего не сгорело."
      - "La policía vigila la casa desde hace una semana, por si el sospechoso vuelve. — Полиция следит за домом уже неделю на случай, если подозреваемый вернётся."
      - "El guarda vigila la fábrica por las noches y revisa todas las puertas cada dos horas. — Охранник по ночам присматривает за фабрикой и каждые два часа проверяет все двери."
    origin: "Из лат. vigilare «бодрствовать»: vigil «бодрый». Родственные: vigilia «бдение», vigía «дозорный», vigilante «охранник»."
    register: "Нейтральное."
    synonyms:
      - word: cuidar
        pair: ["Vigila al bebé.", "Cuida al bebé."]
        diff:
          - "cuidar — заботиться, ухаживать"
          - "vigilar — присматривать, следить, чтобы не случилось плохого"
    analogs:
      - "to watch — присматривать"
      - "to keep an eye on — следить"
    dialogue:
      - "Ana: ¿Puedes quedarte con él? | Можешь остаться с ним?"
      - "Pablo: Sí, yo lo vigilo. | Да, я за ним присмотрю."
      - "Ana: Gracias. Tengo que hacer unos recados y no tardaré en volver. | Спасибо. Мне нужно сделать кое-какие дела, и я скоро вернусь."
      - "Pablo: Tranquila. ¿Tiene fiebre? | Не волнуйся. У него температура?"
      - "Ana: Un poco, está resfriado. Si se agita, avísame cuanto antes. | Небольшая, он простужен. Если он начнёт метаться, сообщи мне как можно скорее."
      - "Pablo: Lo vigilo de cerca. Y le doy un comprimido, si hace falta. | Присмотрю внимательно. И дам таблетку, если понадобится."
      - "Ana: Perfecto. Vigila también que no se destape. | Отлично. И следи, чтобы он не раскрылся."
      - "Pablo: Descuida, que me quedo a su lado hasta que vuelvas. | Не беспокойся, я буду рядом, пока ты не вернёшься."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "vigilar a alguien — следить за кем-то"
      - "vigilar el horno — присматривать за духовкой"
      - "vigilar la casa — охранять дом"
    collocation_example: "Vigila el horno, que no se queme. — Присматривай за духовкой, чтобы ничего не сгорело."
    trap: "Перед человеком нужен a: vigilar a alguien. Не путайте с velar «бодрствовать, охранять» и vigilia «канун»."

  - word: resfriado
    ru: простуженный; простуда
    ipa: /resfɾiˈaðo/
    say: рэсфриа́до
    pron: "Ударение на a: resfriado; ia — два слога: ре-сфри-а́-до."
    meaning: "Как прилагательное — простудившийся. Как существительное (el resfriado) — простуда: насморк, кашель."
    examples:
      - "Estoy resfriado y tengo mucha tos. — Я простужен и сильно кашляю."
      - "Estoy resfriado desde ayer, con dolor de garganta y la nariz completamente tapada. — Я простужен со вчерашнего дня: болит горло, и нос совсем заложен."
      - "Tiene un resfriado fuerte y el médico le ha recomendado quedarse unos días en la cama. — У него сильная простуда, и врач порекомендовал ему несколько дней полежать в постели."
    origin: "Причастие от resfriar «охладить» (re- + frío «холод»). Родственные: frío «холод», enfriarse «остыть, простудиться»."
    register: "Нейтральное."
    synonyms:
      - word: constipado
        pair: ["Estoy resfriado.", "Estoy constipado."]
        diff:
          - "constipado — тот же смысл в Испании: «простужен»; в Латинской Америке — «запор»!"
          - "resfriado — безопасное слово везде"
    analogs:
      - "cold — простуда"
      - "to have a cold — простудиться"
    dialogue:
      - "Marcos: Fatal, estoy resfriado. | Ужасно, я простужен."
      - "Marcos: Llevo tres días con tos, mocos y un cansancio enorme. | Три дня кашель, насморк и огромная усталость."
      - "Marcos: Anoche no pude dormir de un tirón; me despertaba cada hora. | Ночью я не мог проспать без перерыва: просыпался каждый час."
      - "Marcos: Me tomé un comprimido y un té con miel, pero el resfriado sigue ahí. | Я принял таблетку и выпил чай с мёдом, но простуда никуда не делась."
      - "Marcos: No reviste ninguna gravedad, aunque me siento como un trapo. | Ничего серьёзного нет, хотя чувствую себя как тряпка."
      - "Marcos: Hoy me quedo en casa, sumido bajo la manta, hasta que me despeje. | Сегодня остаюсь дома, под одеялом, пока не прояснится голова."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "coger un resfriado — подхватить простуду"
      - "pillar un resfriado — простудиться"
      - "estar resfriado — быть простуженным"
    collocation_example: "Cogí un resfriado por la lluvia. — Я простудился из-за дождя."
    trap: "Не путайте resfriado «простуда» с gripe «грипп»: это разные болезни. Constipado в Латинской Америке — «страдающий запором»."

  - word: fiel
    ru: верный
    ipa: /fjel/
    say: фьель
    pron: "ie — один слог «ье»."
    meaning: "О человеке или собаке: не предающий, постоянный. О партнёре — не изменяющий. О тексте — точный."
    examples:
      - "Es un amigo muy fiel. — Он очень верный друг."
      - "Mi perro es muy fiel y no se separa de mí ni un momento. — Мой пёс очень верен и ни на миг не отходит от меня."
      - "El perro es fiel a su dueño y lo espera cada tarde en la estación del tren. — Собака верна своему хозяину и каждый вечер ждёт его на вокзале."
    origin: "Из лат. fidelis «верный», от fides «вера, доверие». Родственные: fe «вера», fidelidad «верность», confiar «доверять»."
    register: "Нейтральное."
    synonyms:
      - word: leal
        pair: ["Es un amigo fiel.", "Es un amigo leal."]
        diff:
          - "leal — «преданный», в основном о долге и дружбе"
          - "fiel — шире: и в любви, и о животных, и о точности"
    analogs:
      - "faithful — верный"
      - "loyal — преданный"
    dialogue:
      - "Ana: ¿Confías en él? | Ты ему доверяешь?"
      - "Pablo: Sí, es un amigo fiel. | Да, он верный друг."
      - "Ana: ¿Desde cuándo lo conoces? | С каких пор ты его знаешь?"
      - "Pablo: Desde pequeños. Nunca me ha engañado ni me ha dejado tirado. | С детства. Он ни разу меня не обманул и не бросил в беде."
      - "Ana: Eso es muy raro hoy en día. | Это сейчас большая редкость."
      - "Pablo: Lo sé. Cuando me quedé parado, él fue el primero en ayudarme. | Знаю. Когда я остался без работы, он первым пришёл на помощь."
      - "Ana: Qué suerte. Un amigo fiel vale más que una fortuna. | Повезло. Верный друг ценнее состояния."
      - "Pablo: Pues sí. Y yo trato de ser igual de fiel con él. | Это так. И я стараюсь быть таким же верным с ним."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "fiel a — верный чему-то"
      - "ser fiel a alguien — быть верным кому-то"
      - "una traducción fiel — точный перевод"
    collocation_example: "Sé fiel a tus principios. — Будь верен своим принципам."
    trap: "Во множественном — fieles: одна форма для мужчин и женщин. Предлог a: fiel a alguien. Противоположное — infiel «неверный»."

  - word: máquina tragaperras
    ru: игровой автомат
    ipa: /ˈmakina tɾaɣaˈpeɾas/
    say: ма́кина трагапе́рас
    pron: "g между гласными мягкое [ɣ]; ударение на pe: tragaperras."
    meaning: "Автомат в баре или казино, в который кидают монеты. Перас — старые испанские монеты (peras — это сленговое «песета»)."
    examples:
      - "Jugó a la máquina tragaperras en Las Vegas. — Он играл на игровом автомате в Лас-Вегасе."
      - "Perdió mucho dinero en la máquina tragaperras del bar mientras esperaba a sus amigos. — Он потерял много денег в игровом автомате в баре, пока ждал друзей."
      - "En el bar hay una máquina tragaperras que hace mucho ruido y que a nadie le gusta. — В баре стоит игровой автомат, который сильно шумит и который никому не нравится."
    origin: "tragar «глотать» + perras «мелкие монеты»: «автомат, который глотает монеты». Perras — разговорное «мелкие монеты»; perra gorda и perra chica — старые испанские монеты в 10 и 5 сентимо."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tragamonedas
        pair: ["Jugó en la tragaperras.", "Jugó en el tragamonedas."]
        diff:
          - "tragamonedas — название в Латинской Америке"
          - "tragaperras — привычное в Испании"
    analogs:
      - "slot machine — игровой автомат"
      - "fruit machine — игровой автомат (британское)"
    dialogue:
      - "Mi primo entra al bar cada tarde a la misma hora. | Мой двоюродный брат заходит в бар каждый вечер в одно и то же время."
      - "Pide un café, se sienta junto a la ventana y mira la máquina tragaperras. | Заказывает кофе, садится у окна и смотрит на игровой автомат."
      - "Al principio solo la miraba; luego se atrevió a meter una moneda. | Сначала он просто смотрел, потом решился бросить монету."
      - "Ahora juega a la tragaperras casi cada día y siempre pierde. | Теперь он играет почти каждый день и всегда проигрывает."
      - "Su mujer le ha hecho saber que está harta y que quiere que lo deje. | Жена дала ему понять, что ей это надоело и она хочет, чтобы он бросил."
      - "Él dice que no pasa nada, pero se ve que está arrepentido. | Он говорит, что ничего страшного, но видно, что он раскаивается."
    cefr: "B2."
    frequency: "Частое в Испании."
    collocations:
      - "jugar a la tragaperras — играть на автомате"
      - "echar monedas — кидать монеты"
      - "ludopatía — игровая зависимость"
    collocation_example: "Echó unas monedas en la máquina y ganó. — Он бросил несколько монет в автомат и выиграл."
    trap: "Tragaperras пишется одним словом: la máquina tragaperras, а коротко — la tragaperras. Perras здесь — не «собаки», а мелкие монеты."

  - word: llevarse muy mal
    ru: очень плохо ладить
    ipa: /ʎeˈβaɾse muj mal/
    say: йэба́рсэ муй маль
    pron: "ll в большинстве регионов — как «й»; v читается как b."
    meaning: "Плохо относиться друг к другу: постоянные ссоры, нет общего языка. Llevarse bien — «ладить»."
    examples:
      - "Mis hermanos se llevan muy mal. — Мои братья очень плохо ладят."
      - "Los dos vecinos se llevan muy mal y casi no se saludan. — Двое соседей очень плохо ладят и почти не здороваются."
      - "Me llevo fatal con mi jefe y por eso estoy buscando otro trabajo desde hace meses. — Я ужасно лажу с начальником, и поэтому уже несколько месяцев ищу другую работу."
    origin: "llevar «нести, вести» + se (взаимно) + mal «плохо». Дословно «нести друг друга плохо»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: no soportarse
        pair: ["Se llevan muy mal.", "No se soportan."]
        diff:
          - "no soportarse — «терпеть друг друга не могут», сильнее"
          - "llevarse mal — «плохо ладить», нейтрально"
    analogs:
      - "to not get on — не ладить"
      - "to get on badly — плохо ладить"
    dialogue:
      - "Ana: ¿Cómo se llevan tus padres? | Как ладят твои родители?"
      - "Pablo: Se llevan muy mal desde hace años. | Они очень плохо ладят уже много лет."
      - "Ana: ¿Por qué? ¿Qué pasó? | Почему? Что случилось?"
      - "Pablo: Poco a poco, el resentimiento fue creciendo. Cada uno tiene un carácter fuerte. | Понемногу обида росла. У каждого сильный характер."
      - "Ana: ¿Y vosotros, los hijos? | А вы, дети?"
      - "Pablo: Intentamos no meternos, pero a veces tenemos que mediar. Es agotador. | Стараемся не вмешиваться, но иногда приходится мирить. Это изматывает."
      - "Ana: Qué pena. Pese a todo, se nota que se quieren. | Как жаль. Несмотря ни на что, видно, что они любят друг друга."
      - "Pablo: Sí, aunque lo demuestran de forma extraña. Se llevan muy mal, pero no se separan. | Да, хотя показывают это странным образом. Очень плохо ладят, но не расстаются."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "llevarse bien — ладить"
      - "llevarse mal — плохо ладить"
      - "llevarse a matar — враждовать (разг.)"
    collocation_example: "Se llevan a matar desde que se conocieron. — Они на ножах с самого знакомства."
    trap: "Возвратный глагол: me llevo, te llevas. Предлог con: llevarse bien con alguien. Не путайте с llevar «нести» и llevarse «забрать»."

  - word: boquerones
    ru: маринованные анчоусы
    ipa: /bokeˈɾones/
    say: бокэро́нэс
    pron: "qu перед e — [k]; ударение на ro."
    meaning: "Небольшая серебристая рыба (европейский анчоус); в тапас — «boquerones en vinagre» (маринованные в уксусе, или жареные — fritos)."
    examples:
      - "Pedimos boquerones en vinagre y cerveza. — Мы заказали маринованные анчоусы и пиво."
      - "En Málaga, a los boquerones se les llama «victorianos» cuando se fríen con harina. — В Малаге жареные в муке анчоусы называют «викторианос»."
      - "Los boquerones fritos están riquísimos, sobre todo si los acompañas con un poco de limón. — Жареные анчоусы очень вкусные, особенно если подать их с лимоном."
    origin: "От boca «рот» + увеличительное -erón: у рыбки «большой рот». Родственное: boca «рот», bocadillo «бутерброд»."
    register: "Нейтральное, кулинарное."
    synonyms:
      - word: anchoas
        pair: ["Pedimos boquerones.", "Pedimos anchoas."]
        diff:
          - "anchoas — солёные анчоусы в масле (из консервной банки)"
          - "boquerones — свежие, в уксусе или жареные"
    analogs:
      - "anchovies — анчоусы"
      - "white anchovies — маринованные анчоусы"
    dialogue:
      - "Ana: ¿Qué pedimos de tapa? | Что закажем на закуску?"
      - "Pablo: Unos boquerones en vinagre. | Маринованных анчоусов."
      - "Ana: ¿Seguro? A mí me dan algo de grima. | Уверен? Мне они немного противны."
      - "Pablo: Pruébalos una vez. Con una cerveza fría, son una delicia. | Попробуй хоть раз. С холодным пивом это объедение."
      - "Ana: Vale, pero también pedimos unas patatas bravas, por si acaso. | Ладно, но закажем ещё картошку бравас, на всякий случай."
      - "Pablo: Hecho. Y un bollo de pan, para mojar el aceite. | Договорились. И булочку хлеба, чтобы макать в масло."
      - "Ana: ¡Menudo festín! Hoy estoy de buen humor. | Какой пир! Сегодня я в хорошем настроении."
      - "Pablo: Pues aprovechemos para saborear la tarde. | Тогда воспользуемся случаем и насладимся вечером."
    cefr: "B1."
    frequency: "Частое в Испании."
    collocations:
      - "boquerones en vinagre — маринованные анчоусы"
      - "boquerones fritos — жареные анчоусы"
      - "un cucurucho de boquerones — кулёк жареных анчоусов"
    collocation_example: "En Málaga son típicos los boquerones fritos. — В Малаге типичны жареные анчоусы."
    trap: "Boquerones — свежие (маринованные или жареные), а anchoas — солёные из банки. Жителей Малаги в шутку зовут boquerones."

  - word: rojizo
    ru: рыжеватый, красноватый
    ipa: /roˈxiθo/
    say: рохи́со
    pron: "j — «х»; z в Испании — [θ]."
    meaning: "Окрашенный в красноватый или рыжий оттенок: о волосах, земле, закате."
    examples:
      - "Tenía el pelo rojizo y rizado. — У него были рыжеватые кудрявые волосы."
      - "El cielo se volvió rojizo al atardecer y los pájaros volvieron a los árboles. — Небо стало красноватым на закате, и птицы вернулись на деревья."
      - "La tierra de esta zona es rojiza por el hierro que hay en ella desde hace millones de años. — Земля в этом районе красноватая из-за железа, которое находится в ней миллионы лет."
    origin: "От rojo «красный» (лат. russeus) + суффикс -izo, обозначающий «похожий на»: «красноватый». Родственные: rojo, enrojecer «покраснеть»."
    register: "Нейтральное."
    synonyms:
      - word: pelirrojo
        pair: ["Tiene el pelo rojizo.", "Es pelirrojo."]
        diff:
          - "pelirrojo — «рыжеволосый», о человеке"
          - "rojizo — оттенок «красноватый», и о волосах, и о других вещах"
    analogs:
      - "reddish — красноватый"
      - "auburn — каштановый с рыжиной (о волосах)"
    dialogue:
      - "Ana: ¿De qué color es su perro? | Какого цвета его собака?"
      - "Pablo: Rojizo, casi naranja. | Рыжеватая, почти оранжевая."
      - "Ana: ¿Y de qué raza? | А какой породы?"
      - "Pablo: No sé, pero tiene el pelo largo y brillante. Parece un zorro. | Не знаю, но у неё длинная блестящая шерсть. Похожа на лису."
      - "Ana: ¿Es amistoso? | Она дружелюбная?"
      - "Pablo: Muchísimo. No muerde y se acerca a todo el mundo, sin ningún miedo. | Очень. Не кусается и подходит ко всем без всякого страха."
      - "Ana: Qué ternura. ¿Y cómo se llama? | Какая нежность. А как её зовут?"
      - "Pablo: Canela, por su color rojizo. | Канела, из-за её рыжеватого цвета."
    cefr: "B2."
    frequency: "Частое в описаниях."
    collocations:
      - "pelo rojizo — рыжеватые волосы"
      - "tonos rojizos — красноватые оттенки"
      - "tierra rojiza — красноватая земля"
    collocation_example: "La tierra rojiza es típica de esta región. — Красноватая земля характерна для этого региона."
    trap: "Rojizo меняется по роду: rojizo/rojiza. Не путайте с rojo «красный» и rubio «светловолосый»."

  - word: dehesa
    ru: пастбище, дубрава (испанская)
    ipa: /deˈesa/
    say: дэ́эса
    pron: "h не читается: dehesa — «дэ́эса»."
    meaning: "Огороженный луг с редкими дубами, где пасутся свиньи и коровы. Типичный ландшафт юго-запада Испании."
    examples:
      - "Los cerdos viven en la dehesa. — Свиньи живут на дехесе."
      - "Pasamos el día paseando por la dehesa, entre vacas y encinas centenarias. — Мы целый день гуляли по дехесе среди коров и вековых дубов."
      - "El jamón ibérico viene de la dehesa, un paisaje de encinas y pastos típico del suroeste. — Иберийская ветчина происходит из дехесы, пейзажа из дубов и пастбищ, типичного для юго-запада."
    origin: "От лат. defensa «защищённое место» (defendere «защищать»): «огороженный участок». Родственные: defensa «защита», dehesa."
    register: "Нейтральное, региональное."
    synonyms:
      - word: pastizal
        pair: ["Las vacas pastan en la dehesa.", "Las vacas pastan en el pastizal."]
        diff:
          - "pastizal — просто «пастбище, луг»"
          - "dehesa — особый тип пастбища с дубами в Испании и Португалии"
    analogs:
      - "pasture — пастбище"
      - "meadow — луг"
    dialogue:
      - "Los cerdos ibéricos viven en la dehesa durante buena parte del año. | Иберийские свиньи живут на дехесе большую часть года."
      - "Es un paisaje de encinas y alcornoques, con mucho espacio y poca gente. | Это пейзаж из дубов и пробковых деревьев, с большим пространством и малым количеством людей."
      - "Allí los animales se alimentan de bellotas, y de eso depende el sabor del jamón. | Там животные питаются желудями, и от этого зависит вкус хамона."
      - "Los pastores vigilan los rebaños y ayudan cuando hace falta. | Пастухи присматривают за стадами и помогают, когда нужно."
      - "En otoño, la dehesa se llena de color rojizo y los turistas se arremolinan para sacar fotos. | Осенью дехеса наполняется красноватыми красками, и туристы толпятся, чтобы сфотографировать."
      - "Pese a todo, el sitio sigue siendo tranquilo y casi macabro por las noches. | Тем не менее место остаётся тихим и почти жутковатым по ночам."
    cefr: "C1."
    frequency: "Нечастое: в рассказах об Испании."
    collocations:
      - "dehesa extremeña — дехеса Эстремадуры"
      - "cerdos de dehesa — свиньи из дехесы"
      - "las encinas de la dehesa — дубы дехесы"
    collocation_example: "El jamón de bellota se cría en la dehesa. — Хамон из жёлудей выращивают на дехесе."
    trap: "Dehesa пишется с h, которая не читается. Не путайте с desesa: такого слова нет."

  - word: cursi
    ru: слащавый, претенциозный
    ipa: /ˈkuɾsi/
    say: ку́рси
    meaning: "О человеке или вещи: слишком сладкий, наигранный, «розовые сопли». Одна форма для обоих родов."
    examples:
      - "Esa canción es muy cursi. — Эта песня очень слащавая."
      - "La carta de amor que escribió era tan cursi que nos reímos mucho. — Любовное письмо, которое он написал, было таким слащавым, что мы много смеялись."
      - "Mi tía es un poco cursi: pone lazos rosas en todo y llama «cariño» a todo el mundo. — Моя тётя немного претенциозная: везде повязывает розовые банты и называет всех «дорогой»."
    origin: "По одной из версий, слово пошло от фамилии семьи Cursi из Кадиса, над чьими претензиями на аристократизм смеялись в XIX веке."
    register: "Разговорное."
    synonyms:
      - word: empalagoso
        pair: ["Es una película cursi.", "Es una película empalagosa."]
        diff:
          - "empalagoso — «приторный» до тошноты, чрезмерно сладкий"
          - "cursi — «жеманный, претенциозный», с пафосом"
    analogs:
      - "cheesy — слащавый"
      - "twee — жеманный"
    dialogue:
      - "Ana: ¿Qué te pareció la película? | Как тебе фильм?"
      - "Pablo: Muy cursi, pero me gustó. | Очень слащавый, но мне понравился."
      - "Ana: ¿Cursi por qué? | Слащавый чем?"
      - "Pablo: Por los diálogos. Todo era «mi vida» y «mi amor», con música romántica de fondo. | Диалогами. Всё было «жизнь моя» и «любовь моя», с романтической музыкой на фоне."
      - "Ana: A mí me dio ternura. Hasta sollocé en una escena. | Мне это показалось нежным. Я даже всхлипнула в одной сцене."
      - "Pablo: A mí también se me escapó una lágrima, pero me la sequé disimuladamente. | У меня тоже скатилась слеза, но я незаметно её вытер."
      - "Ana: ¡Qué cursi eres! | Какой ты слащавый!"
      - "Pablo: Anda ya. Puestos a ser sinceros, tú lloraste más. | Ну хватит. Если уж честно, ты плакала больше."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "qué cursi — как слащаво"
      - "una carta cursi — сентиментальное письмо"
      - "ponerse cursi — расчувствоваться"
    collocation_example: "No seas cursi y dime lo que piensas. — Не будь слащавым и скажи, что думаешь."
    trap: "Одна форма для обоих родов: un cursi, una cursi. Не путайте cursi «слащавый» с cursiva «курсив»."

  - word: setter irlandés
    ru: ирландский сеттер
    ipa: /ˈseter iɾlanˈdes/
    say: сэ́тэр ирланде́с
    pron: "Слово setter заимствовано из английского: читается «сэ́тэр»."
    meaning: "Порода охотничьих собак с шелковистой рыжей шерстью. Irlandés — «ирландский»."
    examples:
      - "Su setter irlandés corre por el parque. — Его ирландский сеттер бегает по парку."
      - "El setter irlandés tiene el pelo rojizo y largo, y necesita cepillarse a menudo. — У ирландского сеттера длинная рыжеватая шерсть, и его нужно часто расчёсывать."
      - "Tiene un setter irlandés muy cariñoso que lo espera cada tarde en la puerta de casa. — У него очень ласковый ирландский сеттер, который каждый вечер ждёт его у двери дома."
    origin: "Setter — от англ. to set «замирать» (стойка на дичь). Irlandés — от Irlanda «Ирландия» + суффикс -és, образующий название жителя или вещи оттуда."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "Irish setter — ирландский сеттер"
      - "red setter — рыжий сеттер"
    dialogue:
      - "Pablo: Tengo un perro setter irlandés. | У меня собака — ирландский сеттер."
      - "Pablo: Se llama Rufo, por su pelo rojizo, largo y sedoso. | Его зовут Руфо, из-за его рыжеватой, длинной и шелковистой шерсти."
      - "Pablo: Es muy cariñoso y fiel, pero también muy movido y no se queda quieto ni un segundo. | Он очень ласковый и верный, но и очень активный и ни секунды не сидит на месте."
      - "Pablo: Cada mañana lo saco a pasear por el parque, y él corre como loco. | Каждое утро я вывожу его гулять в парк, и он бегает как сумасшедший."
      - "Pablo: Algunos vecinos le tienen miedo, pero nunca muerde a nadie. | Некоторые соседи его боятся, но он никогда никого не кусает."
      - "Pablo: Para mí es como un hijo, y no lo cambiaría por nada. | Для меня он как сын, и я бы не променял его ни на что."
    cefr: "B2."
    frequency: "Нечастое."
    collocations:
      - "un perro de caza — охотничья собака"
      - "pasear al perro — выгуливать собаку"
      - "un perro de raza — породистая собака"
    collocation_example: "Saca a pasear al setter todas las mañanas. — Он выгуливает сеттера каждое утро."
    trap: "Setter мужского рода: el setter irlandés, во множественном — los setters irlandeses. Прилагательное irlandés меняется: irlandesa, irlandeses."

  - word: quitar
    ru: убирать, снимать
    ipa: /kiˈtaɾ/
    say: кита́р
    pron: "qu перед i — [k]: «кита́р»."
    meaning: "Убрать что-то с места: снять одежду, убрать пятно, отнять. Ещё — «убрать боль»: este calmante quita el dolor."
    examples:
      - "Me quitaron el abrigo en la entrada. — У меня забрали пальто у входа."
      - "Esta pastilla quita el dolor de cabeza en media hora. — Эта таблетка снимает головную боль за полчаса."
      - "Quita los platos de la mesa, por favor, y limpia un poco antes de que lleguen los invitados. — Убери тарелки со стола, пожалуйста, и немного протри, прежде чем придут гости."
    origin: "Из лат. quietare «успокаивать»: старое значение «освободить от» → «убрать». Родственные: quieto «спокойный», quitarse «снять с себя»."
    register: "Нейтральное."
    synonyms:
      - word: retirar
        pair: ["Quitó los platos.", "Retiró los platos."]
        diff:
          - "retirar — «убрать, унести», чуть формальнее"
          - "quitar — «убрать, снять, отнять», шире и обиходнее"
    analogs:
      - "to remove — убрать"
      - "to take off — снять"
    dialogue:
      - "Ana: ¿Puedes quitar eso de ahí? | Можешь это убрать оттуда?"
      - "Pablo: Claro, ya lo quito. | Конечно, уже убираю."
      - "Ana: Gracias. Está estorbando en el pasillo. | Спасибо. Оно мешает в коридоре."
      - "Pablo: ¿Y esto también lo quito? Parece un trapo viejo. | И это тоже убрать? Похоже на старую тряпку."
      - "Ana: No, eso déjalo. Es el delantal de mi madre. | Нет, это оставь. Это фартук моей мамы."
      - "Pablo: Perdona. Entonces quito solo las cajas. | Прости. Тогда уберу только коробки."
      - "Ana: Y quita también el polvo, aprovechando que estás. | И заодно вытри пыль, раз уж ты тут."
      - "Pablo: Ya empiezas a mandarme. Qué carácter absorbente tienes hoy. | Ты уже начинаешь мной командовать. Какой у тебя сегодня властный характер."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "quitar la mesa — убрать со стола"
      - "quitarse la ropa — снять одежду"
      - "quitar el sueño — отнять сон"
      - "quitar importancia — преуменьшить значение"
    collocation_example: "El café me quita el sueño. — От кофе я не могу уснуть."
    trap: "Quitar — «убрать, снять»; quitarse — «снять с себя». Не путайте с quedar «оставаться» и quietar: такого слова нет."

  - word: morder
    ru: кусать
    ipa: /moɾˈðeɾ/
    say: морде́р
    pron: "Спрягается o → ue: muerdo, muerdes; d перед e мягкое [ð]."
    meaning: "Схватить зубами: о животном, человеке, насекомом. Ещё — «откусить»."
    examples:
      - "El perro me mordió la mano. — Собака укусила меня за руку."
      - "Mordió la manzana con ganas y el jugo le cayó por la barbilla. — Он с аппетитом откусил яблоко, и сок потёк по подбородку."
      - "No muerdas el lápiz, que es una mala costumbre y se te van a estropear los dientes. — Не грызи карандаш, это плохая привычка, и ты испортишь зубы."
    origin: "Из лат. mordere «кусать». Родственные: mordisco «укус», remordimiento «угрызения совести» (re- + mordere: «снова кусать»)."
    register: "Нейтральное."
    synonyms:
      - word: mordisquear
        pair: ["El perro me mordió.", "El perro me mordisqueó."]
        diff:
          - "mordisquear — «покусывать, грызть понемногу»"
          - "morder — «укусить», сильнее и один раз"
    analogs:
      - "to bite — кусать"
      - "to nibble — покусывать"
    dialogue:
      - "Ana: ¿Qué te pasó? | Что с тобой случилось?"
      - "Pablo: Me mordió un perro. | Меня укусила собака."
      - "Ana: ¡Qué horror! ¿Dónde? | Какой ужас! Где?"
      - "Pablo: En la mano, junto a la glorieta. Un perro suelto, rojizo, grande. | В руку, возле кольца. Бродячий пёс, рыжеватый, большой."
      - "Ana: ¿Tienes una herida profunda? | Рана глубокая?"
      - "Pablo: No, solo un rasguño, pero me asusté mucho. Fui a urgencias por si acaso. | Нет, только царапина, но я сильно испугался. Поехал на скорую на всякий случай."
      - "Ana: Hiciste bien. Conviene vigilarla y ponerse una vacuna. | Правильно сделал. Нужно следить за раной и сделать прививку."
      - "Pablo: Sí, el médico me hizo una advertencia: nada de restar importancia. | Да, врач меня предостерёг: ни в коем случае не преуменьшать."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "morderse las uñas — грызть ногти"
      - "morder el anzuelo — клюнуть на приманку"
      - "perro que ladra no muerde — собака, которая лает, не кусает"
    collocation_example: "Se muerde las uñas cuando está nervioso. — Он грызёт ногти, когда нервничает."
    trap: "Спрягается o → ue: muerdo, muerdes, muerde. Не путайте с mudar «менять» и morir «умереть»."
