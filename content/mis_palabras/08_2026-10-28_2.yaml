# Четвёртый список автора, часть 8 — «Lola Lago: Una nota falsa» (слова 17–32).
lang: es
words:
  - word: orujo
    ru: орухо (крепкий алкоголь из виноградных выжимок)
    ipa: /oˈɾuxo/
    say: ору́хо
    pron: "j — «х»: orujo — «ору́хо»."
    meaning: "Крепкий напиток из выжимок винограда, традиционный на севере Испании (Галисия, Кантабрия). Похож на граппу и чачу."
    examples:
      - "Después de comer tomamos un orujo. — После еды мы выпили орухо."
      - "El orujo de Galicia es muy conocido. — Галисийский орухо хорошо известен."
    origin: "Происхождение неясно. Само слово orujo — «выжимки» (кожица и косточки винограда после отжима), из них и гонят напиток."
    register: "Нейтральное, о напитке."
    synonyms:
      - word: aguardiente
        pair: ["Sirvieron orujo.", "Sirvieron aguardiente."]
        diff:
          - "aguardiente — общее название крепких напитков"
          - "orujo — конкретно из выжимок винограда"
    analogs:
      - "grappa — итальянский аналог"
      - "pomace brandy — бренди из выжимок"
    dialogue:
      - "Ana: ¿Qué quieres tomar? | Что ты будешь пить?"
      - "Pablo: Un orujo, por favor. | Орухо, пожалуйста."
    cefr: "B2."
    frequency: "Нечастое: региональное слово из быта."
    collocations:
      - "un chupito de orujo — рюмка орухо"
      - "orujo de hierbas — травяной орухо"
      - "orujo gallego — галисийский орухо"
    collocation_example: "Terminó la comida con un chupito de orujo. — Он закончил обед рюмкой орухо."
    trap: "Не путайте orujo «выжимки» с aguardiente и с ron «ром». Chupito — «рюмка» (небольшая, на один глоток)."

  - word: picar
    ru: перекусить; колоть; кусать (о комаре); клевать
    ipa: /piˈkaɾ/
    say: пика́р
    pron: "Перед e c меняется на qu: piqué."
    meaning: "Основное значение — «колоть, жалить» (о комаре). В разговоре — «перекусить, съесть понемногу»; «чесаться»; «клюнуть» (о рыбе)."
    examples:
      - "Voy a picar algo antes de cenar. — Я перекушу что-нибудь перед ужином."
      - "Me ha picado un mosquito. — Меня укусил комар."
      - "La sopa pica mucho. — Суп очень острый."
    origin: "От лат. picus «дятел»: «стучать, колоть клювом». Родственные: pico «клюв, вершина», picante «острый», picadura «укус»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tapear
        pair: ["Vamos a picar algo.", "Vamos de tapas."]
        diff:
          - "ir de tapas — пойти перекусить тапас в баре"
          - "picar — съесть что-то небольшое, не обязательно в баре"
    analogs:
      - "to snack — перекусить"
      - "to sting — жалить"
    dialogue:
      - "Ana: ¿Tienes hambre? | Ты голоден?"
      - "Pablo: Un poco, voy a picar algo. | Немного, перекушу что-нибудь."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "picar algo — перекусить"
      - "picar una cebolla — нарезать лук"
      - "picar carne — сделать фарш"
      - "picar el anzuelo — клюнуть на приманку"
    collocation_example: "Pica la cebolla muy fina. — Нарежь лук очень мелко."
    trap: "Picar — глагол со многими значениями: «кусать», «перекусить», «нарезать», «быть острым». Перед e c меняется на qu: piqué, piquemos."

  - word: caer simpático
    ru: нравиться как человек
    ipa: /kaˈeɾ simˈpatiko/
    say: каэ́р симпа́тико
    pron: "Конструкция как gustar: «мне нравится человек»: me cae simpático, me caen simpáticos."
    meaning: "Вызывать симпатию, быть приятным как человек. Не про внешность, а про характер, обаяние. Противоположное — caer mal."
    examples:
      - "Tu hermano me cae muy simpático. — Твой брат мне очень симпатичен."
      - "Ella no me cae simpática. — Она мне несимпатична."
    origin: "caer «падать, приходиться» + simpático «симпатичный» (греч. sympathes: syn- «вместе» + pathos «чувство»). Дословно «падать симпатично» → «производить впечатление»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: caer bien
        pair: ["Me cae simpático.", "Me cae bien."]
        diff:
          - "caer bien — самое обычное в разговоре"
          - "caer simpático — чуть мягче и выразительнее"
    analogs:
      - "to like someone — симпатизировать"
      - "to get on well with — хорошо ладить"
    dialogue:
      - "Ana: ¿Qué tal el nuevo compañero? | Как новый коллега?"
      - "Pablo: Me cae muy simpático. | Он мне очень нравится."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "caer bien — нравиться"
      - "caer mal — не нравиться"
      - "caer fatal — очень не нравиться"
    collocation_example: "Su jefe le cae fatal. — Начальник ему совсем не нравится."
    trap: "Это про человека и его характер: «Me cae bien Juan» (а не «Me gusta Juan», что может значить «влюблён»). Прилагательное согласуется с человеком: simpática, simpáticos."

  - word: culebrón
    ru: мыльная опера
    ipa: /kuleˈβɾon/
    say: кулебро́н
    pron: "b между гласными мягкая [β]."
    meaning: "Длинный телесериал с запутанными сюжетами и сильными страстями. Ещё — «запутанная история с драмой»."
    examples:
      - "Mi abuela ve el culebrón cada tarde. — Моя бабушка смотрит сериал каждый вечер."
      - "Su vida es un culebrón. — Его жизнь — настоящая мыльная опера."
    origin: "От culebra «змея» + увеличительное -ón: «большая змея» за то, что сериал тянется бесконечно. Родственное: culebra «змея», culebrear «извиваться»."
    register: "Разговорное, с иронией."
    synonyms:
      - word: telenovela
        pair: ["Ve un culebrón.", "Ve una telenovela."]
        diff:
          - "telenovela — нейтральное название жанра"
          - "culebrón — ироничное: «тягучий сериал» с драмой"
    analogs:
      - "soap opera — мыльная опера"
      - "melodrama — мелодрама"
    dialogue:
      - "Ana: ¿Qué hacen tus padres? | Что делают твои родители?"
      - "Pablo: Ven el culebrón de las cinco. | Смотрят сериал в пять."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "un culebrón venezolano — венесуэльский сериал"
      - "un culebrón familiar — семейная драма"
      - "ser un culebrón — быть как сериал"
    collocation_example: "Su divorcio fue un auténtico culebrón. — Его развод был настоящей мыльной оперой."
    trap: "Слово ироничное: говорят о тягучем сериале или жизни с драмой. Не путайте culebrón с culebra «змея»."

  - word: vigilar
    ru: следить, присматривать
    ipa: /bixiˈlaɾ/
    say: бихила́р
    pron: "v читается как b; g перед i — «х»."
    meaning: "Внимательно следить за кем-то или чем-то, чтобы ничего не случилось: за ребёнком, домом, больным."
    examples:
      - "Vigila a los niños mientras juegan. — Присматривай за детьми, пока они играют."
      - "La policía vigila la casa. — Полиция следит за домом."
    origin: "Из лат. vigilare «бодрствовать»: vigil «бодрый». Родственные: vigilia «бдение», vigía «дозорный», vigilante «охранник»."
    register: "Нейтральное."
    synonyms:
      - word: cuidar
        pair: ["Vigila al bebé.", "Cuida al bebé."]
        diff:
          - "cuidar — заботиться, ухаживать"
          - "vigilar — присматривать, следить, чтобы не случилось плохого"
    analogs:
      - "to watch — присматривать"
      - "to keep an eye on — следить"
    dialogue:
      - "Ana: ¿Puedes quedarte con él? | Можешь с ним остаться?"
      - "Pablo: Sí, yo lo vigilo. | Да, я присмотрю за ним."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "vigilar a alguien — следить за кем-то"
      - "vigilar el horno — присматривать за духовкой"
      - "vigilar la casa — охранять дом"
    collocation_example: "Vigila el horno, que no se queme. — Присматривай за духовкой, чтобы ничего не сгорело."
    trap: "Перед человеком нужен a: vigilar a alguien. Не путайте с velar «бодрствовать, охранять» и vigilia «канун»."

  - word: resfriado
    ru: простуженный; простуда
    ipa: /resfɾiˈaðo/
    say: рэсфриа́до
    pron: "Ударение на a: resfriado; ia — два слога: ре-сфри-а́-до."
    meaning: "Как прилагательное — простудившийся. Как существительное (el resfriado) — простуда: насморк, кашель."
    examples:
      - "Estoy resfriado desde ayer. — Я простужен со вчерашнего дня."
      - "Tiene un resfriado fuerte. — У него сильная простуда."
    origin: "Причастие от resfriar «охладить» (re- + frío «холод»). Родственные: frío «холод», enfriarse «остыть, простудиться»."
    register: "Нейтральное."
    synonyms:
      - word: constipado
        pair: ["Estoy resfriado.", "Estoy constipado."]
        diff:
          - "constipado — тот же смысл в Испании: «простужен»; в Латинской Америке — «запор»!"
          - "resfriado — безопасное слово везде"
    analogs:
      - "cold — простуда"
      - "to have a cold — простудиться"
    dialogue:
      - "Ana: ¿Cómo estás? | Как ты?"
      - "Pablo: Fatal, estoy resfriado. | Плохо, простужен."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "coger un resfriado — подхватить простуду"
      - "pillar un resfriado — простудиться"
      - "estar resfriado — быть простуженным"
    collocation_example: "Cogí un resfriado por la lluvia. — Я простудился из-за дождя."
    trap: "Не путайте resfriado «простуда» с gripe «грипп»: это разные болезни. Constipado в Латинской Америке — «страдающий запором»."

  - word: fiel
    ru: верный
    ipa: /fjel/
    say: фьель
    pron: "ie — один слог «ье»."
    meaning: "О человеке или собаке: не предающий, постоянный. О партнёре — не изменяющий. О тексте — точный."
    examples:
      - "Es un amigo muy fiel. — Он очень верный друг."
      - "El perro es fiel a su dueño. — Собака верна хозяину."
    origin: "Из лат. fidelis «верный», от fides «вера, доверие». Родственные: fe «вера», fidelidad «верность», confiar «доверять»."
    register: "Нейтральное."
    synonyms:
      - word: leal
        pair: ["Es un amigo fiel.", "Es un amigo leal."]
        diff:
          - "leal — «преданный», в основном о долге и дружбе"
          - "fiel — шире: и в любви, и о животных, и о точности"
    analogs:
      - "faithful — верный"
      - "loyal — преданный"
    dialogue:
      - "Ana: ¿Confías en él? | Ты ему доверяешь?"
      - "Pablo: Sí, es un amigo fiel. | Да, он верный друг."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "fiel a — верный чему-то"
      - "ser fiel a alguien — быть верным кому-то"
      - "una traducción fiel — точный перевод"
    collocation_example: "Sé fiel a tus principios. — Будь верен своим принципам."
    trap: "Во множественном — fieles: одна форма для мужчин и женщин. Предлог a: fiel a alguien. Противоположное — infiel «неверный»."

  - word: máquina tragaperras
    ru: игровой автомат
    ipa: /ˈmakina tɾaɣaˈpeɾas/
    say: ма́кина трагапе́рас
    pron: "g между гласными мягкое [ɣ]; ударение на pe: tragaperras."
    meaning: "Автомат в баре или казино, в который кидают монеты. Перас — старые испанские монеты (peras — это сленговое «песета»)."
    examples:
      - "Perdió mucho dinero en la máquina tragaperras. — Он проиграл много денег в игровом автомате."
      - "En el bar hay una máquina tragaperras. — В баре стоит игровой автомат."
    origin: "tragar «глотать» + perras «мелкие монеты»: «автомат, который глотает монеты». Perras — разговорное «мелкие монеты»; perra gorda и perra chica — старые испанские монеты в 10 и 5 сентимо."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tragamonedas
        pair: ["Jugó en la tragaperras.", "Jugó en el tragamonedas."]
        diff:
          - "tragamonedas — название в Латинской Америке"
          - "tragaperras — привычное в Испании"
    analogs:
      - "slot machine — игровой автомат"
      - "fruit machine — игровой автомат (британское)"
    dialogue:
      - "Ana: ¿Qué hace tu primo en el bar? | Что твой двоюродный брат делает в баре?"
      - "Pablo: Juega a la tragaperras. | Играет на автомате."
    cefr: "B2."
    frequency: "Частое в Испании."
    collocations:
      - "jugar a la tragaperras — играть на автомате"
      - "echar monedas — кидать монеты"
      - "ludopatía — игровая зависимость"
    collocation_example: "Echó unas monedas en la máquina y ganó. — Он бросил несколько монет в автомат и выиграл."
    trap: "Tragaperras пишется одним словом: la máquina tragaperras, а коротко — la tragaperras. Perras здесь — не «собаки», а мелкие монеты."

  - word: llevarse muy mal
    ru: очень плохо ладить
    ipa: /ʎeˈβaɾse muj mal/
    say: йэба́рсэ муй маль
    pron: "ll в большинстве регионов — как «й»; v читается как b."
    meaning: "Плохо относиться друг к другу: постоянные ссоры, нет общего языка. Llevarse bien — «ладить»."
    examples:
      - "Mis hermanos se llevan muy mal. — Мои братья очень плохо ладят."
      - "Me llevo fatal con mi jefe. — Я очень плохо лажу с начальником."
    origin: "llevar «нести, вести» + se (взаимно) + mal «плохо». Дословно «нести друг друга плохо»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: no soportarse
        pair: ["Se llevan muy mal.", "No se soportan."]
        diff:
          - "no soportarse — «терпеть друг друга не могут», сильнее"
          - "llevarse mal — «плохо ладить», нейтрально"
    analogs:
      - "to not get on — не ладить"
      - "to get on badly — плохо ладить"
    dialogue:
      - "Ana: ¿Cómo se llevan tus padres? | Как ладят твои родители?"
      - "Pablo: Se llevan muy mal desde hace años. | Они плохо ладят уже годы."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "llevarse bien — ладить"
      - "llevarse mal — плохо ладить"
      - "llevarse a matar — враждовать (разг.)"
    collocation_example: "Se llevan a matar desde que se conocieron. — Они на ножах с самого знакомства."
    trap: "Возвратный глагол: me llevo, te llevas. Предлог con: llevarse bien con alguien. Не путайте с llevar «нести» и llevarse «забрать»."

  - word: boquerones
    ru: маринованные анчоусы
    ipa: /bokeˈɾones/
    say: бокэро́нэс
    pron: "qu перед e — [k]; ударение на ro."
    meaning: "Небольшая серебристая рыба (европейский анчоус); в тапас — «boquerones en vinagre» (маринованные в уксусе, или жареные — fritos)."
    examples:
      - "Pedimos boquerones en vinagre. — Мы заказали маринованные анчоусы."
      - "Los boquerones fritos están riquísimos. — Жареные анчоусы очень вкусные."
    origin: "От boca «рот» + увеличительное -erón: у рыбки «большой рот». Родственное: boca «рот», bocadillo «бутерброд»."
    register: "Нейтральное, кулинарное."
    synonyms:
      - word: anchoas
        pair: ["Pedimos boquerones.", "Pedimos anchoas."]
        diff:
          - "anchoas — солёные анчоусы в масле (из консервной банки)"
          - "boquerones — свежие, в уксусе или жареные"
    analogs:
      - "anchovies — анчоусы"
      - "white anchovies — маринованные анчоусы"
    dialogue:
      - "Ana: ¿Qué pedimos de tapa? | Что возьмём на закуску?"
      - "Pablo: Unos boquerones en vinagre. | Немного маринованных анчоусов."
    cefr: "B1."
    frequency: "Частое в Испании."
    collocations:
      - "boquerones en vinagre — маринованные анчоусы"
      - "boquerones fritos — жареные анчоусы"
      - "un cucurucho de boquerones — кулёк жареных анчоусов"
    collocation_example: "En Málaga son típicos los boquerones fritos. — В Малаге типичны жареные анчоусы."
    trap: "Boquerones — свежие (маринованные или жареные), а anchoas — солёные из банки. Жителей Малаги в шутку зовут boquerones."

  - word: rojizo
    ru: рыжеватый, красноватый
    ipa: /roˈxiθo/
    say: рохи́со
    pron: "j — «х»; z в Испании — [θ]."
    meaning: "Окрашенный в красноватый или рыжий оттенок: о волосах, земле, закате."
    examples:
      - "Tiene el pelo rojizo. — У него рыжеватые волосы."
      - "El cielo se volvió rojizo al atardecer. — На закате небо стало красноватым."
    origin: "От rojo «красный» (лат. russeus) + суффикс -izo, обозначающий «похожий на»: «красноватый». Родственные: rojo, enrojecer «покраснеть»."
    register: "Нейтральное."
    synonyms:
      - word: pelirrojo
        pair: ["Tiene el pelo rojizo.", "Es pelirrojo."]
        diff:
          - "pelirrojo — «рыжеволосый», о человеке"
          - "rojizo — оттенок «красноватый», и о волосах, и о других вещах"
    analogs:
      - "reddish — красноватый"
      - "auburn — каштановый с рыжиной (о волосах)"
    dialogue:
      - "Ana: ¿De qué color es su perro? | Какого цвета его собака?"
      - "Pablo: Rojizo, casi naranja. | Рыжеватый, почти оранжевый."
    cefr: "B2."
    frequency: "Частое в описаниях."
    collocations:
      - "pelo rojizo — рыжеватые волосы"
      - "tonos rojizos — красноватые оттенки"
      - "tierra rojiza — красноватая земля"
    collocation_example: "La tierra rojiza es típica de esta región. — Красноватая земля характерна для этого региона."
    trap: "Rojizo меняется по роду: rojizo/rojiza. Не путайте с rojo «красный» и rubio «светловолосый»."

  - word: dehesa
    ru: пастбище, дубрава (испанская)
    ipa: /deˈesa/
    say: дэ́эса
    pron: "h не читается: dehesa — «дэ́эса»."
    meaning: "Огороженный луг с редкими дубами, где пасутся свиньи и коровы. Типичный ландшафт юго-запада Испании."
    examples:
      - "Los cerdos viven en la dehesa. — Свиньи живут на дехесе."
      - "El jamón ibérico viene de la dehesa. — Иберийский хамон родом из дехесы."
    origin: "От лат. defensa «защищённое место» (defendere «защищать»): «огороженный участок». Родственные: defensa «защита», dehesa."
    register: "Нейтральное, региональное."
    synonyms:
      - word: pastizal
        pair: ["Las vacas pastan en la dehesa.", "Las vacas pastan en el pastizal."]
        diff:
          - "pastizal — просто «пастбище, луг»"
          - "dehesa — особый тип пастбища с дубами в Испании и Португалии"
    analogs:
      - "pasture — пастбище"
      - "meadow — луг"
    dialogue:
      - "Ana: ¿Dónde crían los cerdos? | Где выращивают свиней?"
      - "Pablo: En la dehesa, bajo las encinas. | На дехесе, под дубами."
    cefr: "C1."
    frequency: "Нечастое: в рассказах об Испании."
    collocations:
      - "dehesa extremeña — дехеса Эстремадуры"
      - "cerdos de dehesa — свиньи из дехесы"
      - "las encinas de la dehesa — дубы дехесы"
    collocation_example: "El jamón de bellota se cría en la dehesa. — Хамон из жёлудей выращивают на дехесе."
    trap: "Dehesa пишется с h, которая не читается. Не путайте с desesa: такого слова нет."

  - word: cursi
    ru: слащавый, претенциозный
    ipa: /ˈkuɾsi/
    say: ку́рси
    meaning: "О человеке или вещи: слишком сладкий, наигранный, «розовые сопли». Одна форма для обоих родов."
    examples:
      - "Esa canción es muy cursi. — Эта песня очень слащавая."
      - "Mi tía es un poco cursi. — Моя тётя немного жеманная."
    origin: "По одной из версий, слово пошло от фамилии семьи Cursi из Кадиса, над чьими претензиями на аристократизм смеялись в XIX веке."
    register: "Разговорное."
    synonyms:
      - word: empalagoso
        pair: ["Es una película cursi.", "Es una película empalagosa."]
        diff:
          - "empalagoso — «приторный» до тошноты, чрезмерно сладкий"
          - "cursi — «жеманный, претенциозный», с пафосом"
    analogs:
      - "cheesy — слащавый"
      - "twee — жеманный"
    dialogue:
      - "Ana: ¿Qué te pareció la película? | Как тебе фильм?"
      - "Pablo: Muy cursi, pero me gustó. | Слишком слащавый, но мне понравился."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "qué cursi — как слащаво"
      - "una carta cursi — сентиментальное письмо"
      - "ponerse cursi — расчувствоваться"
    collocation_example: "No seas cursi y dime lo que piensas. — Не будь слащавым и скажи, что думаешь."
    trap: "Одна форма для обоих родов: un cursi, una cursi. Не путайте cursi «слащавый» с cursiva «курсив»."

  - word: setter irlandés
    ru: ирландский сеттер
    ipa: /ˈseter iɾlanˈdes/
    say: сэ́тэр ирланде́с
    pron: "Слово setter заимствовано из английского: читается «сэ́тэр»."
    meaning: "Порода охотничьих собак с шелковистой рыжей шерстью. Irlandés — «ирландский»."
    examples:
      - "Tiene un setter irlandés muy cariñoso. — У него очень ласковый ирландский сеттер."
      - "El setter irlandés tiene el pelo rojizo. — У ирландского сеттера рыжеватая шерсть."
    origin: "Setter — от англ. to set «замирать» (стойка на дичь). Irlandés — от Irlanda «Ирландия» + суффикс -és, образующий название жителя или вещи оттуда."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "Irish setter — ирландский сеттер"
      - "red setter — рыжий сеттер"
    dialogue:
      - "Ana: ¿Qué perro tienes? | Какая у тебя собака?"
      - "Pablo: Un setter irlandés, de pelo rojizo. | Ирландский сеттер, рыжий."
    cefr: "B2."
    frequency: "Нечастое."
    collocations:
      - "un perro de caza — охотничья собака"
      - "pasear al perro — выгуливать собаку"
      - "un perro de raza — породистая собака"
    collocation_example: "Saca a pasear al setter todas las mañanas. — Он выгуливает сеттера каждое утро."
    trap: "Setter мужского рода: el setter irlandés, во множественном — los setters irlandeses. Прилагательное irlandés меняется: irlandesa, irlandeses."

  - word: quitar
    ru: убирать, снимать
    ipa: /kiˈtaɾ/
    say: кита́р
    pron: "qu перед i — [k]: «кита́р»."
    meaning: "Убрать что-то с места: снять одежду, убрать пятно, отнять. Ещё — «убрать боль»: este calmante quita el dolor."
    examples:
      - "Quita los platos de la mesa. — Убери тарелки со стола."
      - "Esta pastilla quita el dolor. — Эта таблетка снимает боль."
      - "Me quitaron el pasaporte. — У меня забрали паспорт."
    origin: "Из лат. quietare «успокаивать»: старое значение «освободить от» → «убрать». Родственные: quieto «спокойный», quitarse «снять с себя»."
    register: "Нейтральное."
    synonyms:
      - word: retirar
        pair: ["Quitó los platos.", "Retiró los platos."]
        diff:
          - "retirar — «убрать, унести», чуть формальнее"
          - "quitar — «убрать, снять, отнять», шире и обиходнее"
    analogs:
      - "to remove — убрать"
      - "to take off — снять"
    dialogue:
      - "Ana: ¿Puedes quitar eso de ahí? | Можешь убрать это отсюда?"
      - "Pablo: Claro, ya lo quito. | Конечно, сейчас уберу."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "quitar la mesa — убрать со стола"
      - "quitarse la ropa — снять одежду"
      - "quitar el sueño — отнять сон"
      - "quitar importancia — преуменьшить значение"
    collocation_example: "El café me quita el sueño. — От кофе я не могу уснуть."
    trap: "Quitar — «убрать, снять»; quitarse — «снять с себя». Не путайте с quedar «оставаться» и quietar: такого слова нет."

  - word: morder
    ru: кусать
    ipa: /moɾˈðeɾ/
    say: морде́р
    pron: "Спрягается o → ue: muerdo, muerdes; d перед e мягкое [ð]."
    meaning: "Схватить зубами: о животном, человеке, насекомом. Ещё — «откусить»."
    examples:
      - "El perro me mordió la mano. — Собака укусила меня за руку."
      - "No muerdas el lápiz. — Не грызи карандаш."
    origin: "Из лат. mordere «кусать». Родственные: mordisco «укус», remordimiento «угрызения совести» (re- + mordere: «снова кусать»)."
    register: "Нейтральное."
    synonyms:
      - word: mordisquear
        pair: ["El perro me mordió.", "El perro me mordisqueó."]
        diff:
          - "mordisquear — «покусывать, грызть понемногу»"
          - "morder — «укусить», сильнее и один раз"
    analogs:
      - "to bite — кусать"
      - "to nibble — покусывать"
    dialogue:
      - "Ana: ¿Qué te pasó? | Что с тобой?"
      - "Pablo: Me mordió un perro. | Меня укусила собака."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "morderse las uñas — грызть ногти"
      - "morder el anzuelo — клюнуть на приманку"
      - "perro que ladra no muerde — собака, которая лает, не кусает"
    collocation_example: "Se muerde las uñas cuando está nervioso. — Он грызёт ногти, когда нервничает."
    trap: "Спрягается o → ue: muerdo, muerdes, muerde. Не путайте с mudar «менять» и morir «умереть»."
