# Четвёртый список автора, часть 11 — «Poderoso caballero» (слова 16–30).
lang: es
words:
  - word: sostén
    ru: бюстгальтер
    ipa: /sosˈten/
    say: состэ́н
    pron: "Ударение на последнем слоге: sostén; во множественном — sostenes (ударение на te)."
    meaning: "Женское бельё для груди. Ещё — «опора, поддержка»: el sostén de la familia."
    examples:
      - "Compró un sostén de encaje. — Она купила кружевной бюстгальтер."
      - "El techo se apoya en cuatro columnas, el sostén de todo el edificio. — Крыша опирается на четыре колонны, опору всего здания."
      - "Él es el sostén de la familia desde que murió su padre, y trabaja dos turnos al día. — Он опора семьи с тех пор, как умер отец, и работает в две смены в день."
    origin: "Существительное от sostener «поддерживать» (лат. sustinere: sub- «снизу» + tenere «держать»). Родственные: sostener, sustento «пропитание»."
    register: "Нейтральное."
    synonyms:
      - word: sujetador
        pair: ["Se puso el sostén.", "Se puso el sujetador."]
        diff:
          - "sujetador — основное слово в Испании"
          - "sostén — привычнее в Латинской Америке и в Мексике"
    analogs:
      - "bra — бюстгальтер"
      - "support — опора, поддержка"
    dialogue:
      - "Ana: ¿Dónde puedo comprar ropa interior? | Где можно купить нижнее бельё?"
      - "Pablo: En esa tienda tienen sostenes y bragas de todas las tallas. | В том магазине есть бюстгальтеры и трусики всех размеров."
      - "Ana: ¿Y los precios? | А цены?"
      - "Pablo: Normales, aunque un sostén de encaje cuesta bastante más. | Обычные, хотя кружевной бюстгальтер стоит намного дороже."
      - "Ana: ¿Hay probadores? | Есть примерочные?"
      - "Pablo: Sí, pero a veces hay cola y tienes para rato. | Да, но иногда бывает очередь, и ждать придётся долго."
      - "Ana: Voy a ir a eso de las cinco, cuando haya menos gente. | Пойду около пяти, когда народу будет меньше."
      - "Pablo: Buena idea. Y pide ayuda a la dependienta, es muy concienzuda. | Хорошая мысль. И попроси помощи у продавщицы, она очень добросовестная."
    cefr: "B2."
    frequency: "Частое в магазинах одежды."
    collocations:
      - "el sostén de la familia — кормилец семьи"
      - "un sostén deportivo — спортивный бюстгальтер"
      - "sostén y bragas — бельё"
    collocation_example: "Su sueldo es el sostén de toda la familia. — Его зарплата — опора всей семьи."
    trap: "Sostén во множественном — sostenes: ударение переходит на te. В Испании чаще sujetador. Слово ещё — «поддержка»."

  - word: bocado
    ru: кусок; закуска
    ipa: /boˈkaðo/
    say: бока́до
    pron: "d между гласными мягкое [ð]."
    meaning: "Один кусок еды, который кладут в рот. Ещё — «перекус» (tomar un bocado)."
    examples:
      - "Tomamos un bocado y seguimos caminando. — Мы перекусили и пошли дальше."
      - "Desde ayer por la noche no me he llevado ni un bocado a la boca, así que tengo muchísima hambre. — С вчерашнего вечера я не взял в рот ни куска, так что страшно голоден."
      - "Vamos a tomar un bocado en la cafetería antes de entrar al cine, que dura tres horas. — Давайте перекусим в кафе, прежде чем идти в кино, ведь фильм идёт три часа."
    origin: "От boca «рот» + суффикс -ado, образующий результат: «то, что берётся ртом». Родственные: bocadillo «бутерброд», boca «рот»."
    register: "Нейтральное."
    synonyms:
      - word: mordisco
        pair: ["Le di un bocado a la manzana.", "Le di un mordisco a la manzana."]
        diff:
          - "mordisco — «укус, откус» зубами"
          - "bocado — «кусок», который кладут в рот"
    analogs:
      - "bite — кусочек, укус"
      - "mouthful — полный рот"
    dialogue:
      - "Ana: ¿Has comido? | Ты поел?"
      - "Pablo: No he probado bocado en todo el día. | Я за весь день ни крошки не съел."
      - "Ana: ¿Por qué? ¿Estás enfermo? | Почему? Ты болен?"
      - "Pablo: No, es que tuve un compromiso tras otro y no tuve tiempo ni de sentarme. | Нет, просто у меня было одно дело за другим, и я даже не успел присесть."
      - "Ana: Pues ahora mismo te preparo un bocadillo. | Тогда я прямо сейчас приготовлю тебе бутерброд."
      - "Pablo: Gracias. Estoy agotado, y se me nota el cansancio y la cara de hambre. | Спасибо. Я измотан, и усталость и голод заметны на лице."
      - "Ana: Siéntate y toma al menos un bocado de fruta. | Садись и съешь хотя бы кусочек фрукта."
      - "Pablo: Eso sí. Un bocado para despejar la cabeza y ya está. | Это да. Кусочек, чтобы прояснить голову, и хватит."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "no probar bocado — ничего не есть"
      - "tomar un bocado — перекусить"
      - "un bocado de pan — кусок хлеба"
    collocation_example: "No probó bocado por los nervios. — От волнения он ничего не ел."
    trap: "Bocado — «кусок» и «перекус». Не путайте с bocadillo «бутерброд» и bocata «бутерброд» (разг.): это другая еда."

  - word: arreglarse las uñas
    ru: делать маникюр
    ipa: /areˈɣlaɾse las ˈuɲas/
    say: аррэгла́рсэ лас у́ньяс
    pron: "g перед l — мягкое [ɣ]; ñ — «нь»."
    meaning: "Привести ногти в порядок: подстричь, отполировать, покрасить. Не обязательно в салоне."
    examples:
      - "Se pinta las uñas cada domingo. — Она красит ногти каждое воскресенье."
      - "Antes de la boda, fue a la peluquería a arreglarse las uñas. — Перед свадьбой она пошла в салон сделать маникюр."
      - "Me arreglo las uñas cada semana, y a veces voy a una peluquería y a veces lo hago en casa. — Я привожу ногти в порядок каждую неделю: иногда хожу в салон, иногда делаю дома."
    origin: "arreglar «приводить в порядок» (от regla «правило, линейка»: ставить по правилам) + возвратное se + uña «ноготь» (лат. ungula)."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: hacerse la manicura
        pair: ["Se arregló las uñas.", "Se hizo la manicura."]
        diff:
          - "hacerse la manicura — «сделать маникюр», обычно в салоне"
          - "arreglarse las uñas — шире: подстричь, подпилить дома"
    analogs:
      - "to do one's nails — делать ногти"
      - "to get a manicure — сделать маникюр"
    dialogue:
      - "Ana: ¿Dónde vas? | Куда идёшь?"
      - "Pablo: A arreglarme las uñas. | Делать маникюр."
      - "Ana: ¿Tú? Qué moderno. | Ты? Какой современный."
      - "Pablo: Es para la boda de mi prima. Quiero ir bien arreglado, y dicen que las manos cuidadas dan buena impresión. | Это для свадьбы кузины. Хочу выглядеть аккуратно, а говорят, что ухоженные руки производят хорошее впечатление."
      - "Ana: Tienes razón. Yo también me arreglo las uñas cada domingo. | Ты прав. Я тоже делаю маникюр каждое воскресенье."
      - "Pablo: ¿Y qué color usas? | А какой цвет ты используешь?"
      - "Ana: Un rojo sobrio. Nada hortera. | Строгий красный. Ничего безвкусного."
      - "Pablo: Pues me gusta. Dicen que el rojo da buena suerte. | Мне нравится. Говорят, красный приносит удачу."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "arreglarse el pelo — привести в порядок волосы"
      - "pintarse las uñas — покрасить ногти"
      - "cortarse las uñas — подстричь ногти"
    collocation_example: "Se pintó las uñas de rojo para la fiesta. — Она покрасила ногти в красный цвет для вечеринки."
    trap: "Возвратный глагол: me arreglo las uñas (не «mis uñas»). Не путайте arreglar «починить, привести в порядок» с arreglárselas «справиться»."

  - word: concejal
    ru: член городского совета, советник
    ipa: /konθeˈxal/
    say: консэха́ль
    pron: "c перед e в Испании — [θ]; j — «х»."
    meaning: "Человек, избранный в городской совет (ayuntamiento). Часто отвечает за какую-то область: культуру, транспорт."
    examples:
      - "La concejal visitó nuestra escuela ayer. — Член совета вчера посетила нашу школу."
      - "Con un breve discurso sobre el pueblo inauguró la exposición el concejal de cultura. — Краткой речью о селе выставку открыл член совета по культуре."
      - "Su tío es concejal en el ayuntamiento y se encarga de las obras de la ciudad. — Его дядя – член городского совета и отвечает за строительные работы в городе."
    origin: "От concejo «совет, собрание» (лат. concilium «собрание»): человек, который заседает в совете. Родственные: concilio, consejo «совет»."
    register: "Формальное, политическое."
    synonyms:
      - word: edil
        pair: ["El concejal habló.", "El edil habló."]
        diff:
          - "edil — книжное и газетное слово, то же значение"
    analogs:
      - "councillor — член совета"
      - "city councilman — член городского совета"
    dialogue:
      - "Ana: ¿Quién organizó la fiesta? | Кто организовал праздник?"
      - "Pablo: El concejal de festejos. | Советник по праздникам."
      - "Ana: ¿Y quién paga todo? | И кто за всё платит?"
      - "Pablo: El ayuntamiento, aunque se rumorea que parte del dinero viene de un socio del concejal. | Мэрия, хотя ходят слухи, что часть денег поступает от партнёра советника."
      - "Ana: Siempre hay cotilleos. | Всегда сплетни."
      - "Pablo: Y a veces con razón. La concejal anterior tuvo que dimitir por una infidelidad en la gestión. | И иногда обоснованные. Предыдущая советница была вынуждена уйти в отставку из-за недобросовестного управления."
      - "Ana: ¿Y ahora qué dicen? | И что говорят сейчас?"
      - "Pablo: Que el nuevo es honrado. Pese a todo, hay que vigilar las cuentas. | Что новый честный. Несмотря ни на что, нужно следить за счетами."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "concejal de urbanismo — советник по градостроительству"
      - "concejal del ayuntamiento — член городского совета"
      - "ser concejal — быть советником"
    collocation_example: "La concejal de educación visitó el colegio. — Советник по образованию посетила школу."
    trap: "Одна форма для обоих родов: el concejal, la concejal. Не путайте с consejal: правильно concejal (через c). Consejero — «советчик»."

  - word: cadena multinacional
    ru: транснациональная сеть
    ipa: /kaˈðena multinaθjoˈnal/
    say: кадэ́на мультинасьона́ль
    pron: "d между гласными мягкое [ð]; c перед i в Испании — [θ]."
    meaning: "Сеть магазинов, кафе, отелей, принадлежащая одной большой компании в нескольких странах."
    examples:
      - "Trabaja para una cadena multinacional de hoteles. — Он работает в международной сети отелей."
      - "Porque pueden vender más barato, muchas cadenas multinacionales cierran los negocios pequeños del barrio. — Потому что они могут продавать дешевле, многие международные сети закрывают маленькие магазины района."
      - "La cadena multinacional de cafeterías abrió un nuevo local en la plaza y enseguida se llenó de gente. — Международная сеть кафе открыла новое заведение на площади, и оно сразу заполнилось людьми."
    origin: "cadena «цепь, сеть» (лат. catena «цепь») + multinacional — от multi- «много» + nacional «национальный». «Цепь, протянутая через многие страны»."
    register: "Деловое, нейтральное."
    synonyms:
      - word: franquicia
        pair: ["Es una cadena multinacional.", "Es una franquicia."]
        diff:
          - "franquicia — отдельное точка, работающая по лицензии бренда"
          - "cadena multinacional — вся сеть целиком"
    analogs:
      - "multinational chain — международная сеть"
      - "global chain — глобальная сеть"
    dialogue:
      - "Ana: ¿Dónde trabaja tu hermano? | Где работает твой брат?"
      - "Pablo: En una cadena multinacional de hoteles. | В транснациональной сети отелей."
      - "Ana: ¿Y le gusta? | И ему нравится?"
      - "Pablo: Mucho. Viaja a menudo y conoce a gente de todo el mundo. | Очень. Он часто путешествует и знакомится с людьми со всего мира."
      - "Ana: Qué suerte. ¿Y el sueldo? | Повезло. А зарплата?"
      - "Pablo: Bueno, aunque dice que no hay fluidez en el trabajo con tantos jefes. | Хорошая, хотя он говорит, что с таким количеством начальников нет слаженности в работе."
      - "Ana: Es normal en una cadena multinacional. | Это нормально для транснациональной сети."
      - "Pablo: Sí, pero a él le sale muy bien. Es un trabajador concienzudo y afectuoso. | Да, но у него это хорошо получается. Он добросовестный и душевный работник."
    cefr: "C1."
    frequency: "Частое в деловых и новостных текстах."
    collocations:
      - "cadena de supermercados — сеть супермаркетов"
      - "cadena de televisión — телеканал"
      - "cadena de montaje — конвейер"
    collocation_example: "Esa cadena de televisión emite en todo el mundo. — Этот телеканал вещает по всему миру."
    trap: "Cadena — и «цепь», и «сеть», и «телеканал»: cadena de televisión. Не путайте cadena «цепь» с cadera «бедро»."

  - word: agotado
    ru: истощённый, без сил; распроданный
    ipa: /aɣoˈtaðo/
    say: агота́до
    pron: "g между гласными мягкое [ɣ]; d между гласными мягкое [ð]."
    meaning: "Совсем без сил: от работы или болезни. О товаре, билетах — «закончился, распродан»."
    examples:
      - "Estoy agotado después del viaje. — Я без сил после поездки."
      - "Con los pies hinchados y sin ganas de hablar, llegó de la oficina agotada. — С опухшими ногами и без желания разговаривать она пришла из офиса без сил."
      - "Las entradas están agotadas desde hace una semana, y ya no queda ni una para el sábado. — Билеты распроданы уже неделю, и ни одного не осталось на субботу."
    origin: "Причастие от agotar «исчерпать» (от gota «капля»). Родственные: agotarse «закончиться», gota «капля»."
    register: "Нейтральное."
    synonyms:
      - word: exhausto
        pair: ["Llegó agotado.", "Llegó exhausto."]
        diff:
          - "exhausto — «измученный до предела», сильнее и книжнее"
          - "agotado — «без сил», обычное слово"
    analogs:
      - "exhausted — измученный"
      - "sold out — распроданный"
    dialogue:
      - "Ana: ¿Cómo estás? | Как ты?"
      - "Pablo: Agotado, he trabajado doce horas. | Выжат, отработал двенадцать часов."
      - "Ana: ¿Doce? ¿Por qué? | Двенадцать? Почему?"
      - "Pablo: Porque llegó un inspector sin previo aviso y hubo que revisarlo todo. | Потому что без предупреждения приехал инспектор, и пришлось всё проверять."
      - "Ana: Qué agobio. ¿Has cenado? | Какая нагрузка. Ты ужинал?"
      - "Pablo: Ni un bocado. Solo quiero dormir de un tirón. | Ни кусочка. Хочу только проспать без перерыва."
      - "Ana: Pues acuéstate ya. Mañana será otro día. | Тогда ложись сейчас. Завтра будет другой день."
      - "Pablo: Sí, estoy agotado. Hasta los ojos se me cierran. | Да, я без сил. Даже глаза слипаются."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "agotado de cansancio — выбившийся из сил"
      - "entradas agotadas — билеты распроданы"
      - "estar agotado — быть без сил"
    collocation_example: "El libro está agotado en todas las librerías. — Книга распродана во всех магазинах."
    trap: "Agotado — причастие: agotada, agotados. О человеке — «без сил», о товаре — «закончился». Не путайте с agotar «исчерпать»."

  - word: deprimir
    ru: вгонять в депрессию
    ipa: /depɾiˈmiɾ/
    say: дэприми́р
    pron: "Ударение на последнем слоге: deprimir."
    meaning: "Делать человека подавленным: в этом смысле о погоде, новостях, обстановке. Deprimirse — «впасть в тоску»."
    examples:
      - "Se deprimió tras perder el trabajo. — Он впал в депрессию после потери работы."
      - "Me cuesta mucho levantarme por las mañanas, porque este tiempo gris me deprime. — Мне очень трудно вставать по утрам, потому что эта серая погода меня подавляет."
      - "Ver las noticias todo el día me deprime, así que he decidido leerlas solo una vez por la tarde. — Просмотр новостей весь день меня угнетает, так что я решил читать их только раз вечером."
    origin: "Из лат. deprimere «давить вниз»: de- «вниз» + premere «давить». Родственные: depresión «депрессия», presión «давление»."
    register: "Нейтральное."
    synonyms:
      - word: entristecer
        pair: ["La noticia lo deprimió.", "La noticia lo entristeció."]
        diff:
          - "entristecer — «опечалить», слабее"
          - "deprimir — «вогнать в подавленность», сильнее"
    analogs:
      - "to depress — угнетать"
      - "to bring down — расстраивать"
    dialogue:
      - "Ana: ¿Por qué estás tan triste? | Почему ты такой грустный?"
      - "Pablo: Las noticias me deprimen. | Новости меня удручают."
      - "Ana: ¿Cuáles? | Какие?"
      - "Pablo: Todas: secuestros, estafas, huelgas, consecuencias nefastas por todas partes. | Все: похищения, мошенничество, забастовки, пагубные последствия повсюду."
      - "Ana: Pues no las veas tanto. A mí también me deprimen. | Тогда не смотри так много. Меня они тоже угнетают."
      - "Pablo: Lo sé. Pero me enganchan, y luego me vengo abajo. | Знаю. Но они затягивают, а потом я падаю духом."
      - "Ana: ¿Por qué no salimos a pasear? Está soleado. | Может, выйдем погуляем? Солнечно."
      - "Pablo: Buena idea. Aire fresco y menos pantalla. | Хорошая мысль. Свежий воздух и меньше экрана."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "deprimirse — впасть в тоску"
      - "algo me deprime — это меня угнетает"
      - "una película que deprime — фильм, от которого грустно"
    collocation_example: "Ver tanto noticias me deprime. — От обилия новостей мне становится тоскливо."
    trap: "Переходный и возвратный: deprimir a alguien (кого-то), deprimirse (самому). Не путайте с reprimir «подавлять»."

  - word: finca
    ru: усадьба, поместье
    ipa: /ˈfiŋka/
    say: фи́нка
    pron: "n перед k звучит как носовое [ŋ]."
    meaning: "Земельный участок за городом с домом и хозяйством: небольшое поместье, ферма. Ещё — «любая недвижимость» в бумагах."
    examples:
      - "Tienen una finca cerca del río. — У них есть усадьба рядом с рекой."
      - "De su abuelo heredó una finca, pero no sabe cómo mantenerla sin vivir allí. — От деда он унаследовал поместье, но не знает, как его содержать, не живя там."
      - "La finca tiene un olivar de mil árboles, y cada otoño vienen familias enteras a recoger las aceitunas. — В усадьбе оливковая роща в тысячу деревьев, и каждую осень приезжают целые семьи собирать оливки."
    origin: "От fincar «основываться, пускать корни» (лат. figicare «вбивать»): место, где человек «укоренился». Родственное: fijo «неподвижный»."
    register: "Нейтральное."
    synonyms:
      - word: hacienda
        pair: ["Visitamos la finca.", "Visitamos la hacienda."]
        diff:
          - "hacienda — большое поместье, особенно в Латинской Америке"
          - "finca — участок с домом, любого размера"
    analogs:
      - "estate — поместье"
      - "farm — ферма"
    dialogue:
      - "Ana: ¿Dónde pasan el verano? | Где они проводят лето?"
      - "Pablo: En una finca de mis abuelos. | В усадьбе моих бабушки и дедушки."
      - "Ana: ¿Está lejos? | Это далеко?"
      - "Pablo: A eso de dos horas en coche. Está en una dehesa, rodeada de encinas. | Около двух часов на машине. Она на дехесе, в окружении дубов."
      - "Ana: ¿Y qué hacéis allí? | И что вы там делаете?"
      - "Pablo: Hacemos hogueras, montamos a caballo y vigilamos a los cerdos. | Разжигаем костры, ездим верхом и присматриваем за свиньями."
      - "Ana: Qué envidia. ¿Hay wifi? | Какая зависть. Там есть вайфай?"
      - "Pablo: Qué va. Y por eso es perfecto. | Что вы, нет. Поэтому там идеально."
    cefr: "B2."
    frequency: "Частое в рассказах о деревне."
    collocations:
      - "una finca rústica — сельский участок"
      - "una finca urbana — городской участок"
      - "finca de recreo — усадьба для отдыха"
    collocation_example: "Compraron una finca con una casa de piedra. — Они купили усадьбу с каменным домом."
    trap: "В юридических документах finca — «земельный участок и недвижимость» любого типа, даже квартира: «la finca número 5». Не путайте finca «поместье» с fino «тонкий»."

  - word: pulgar
    ru: большой палец
    ipa: /pulˈɣaɾ/
    say: пульга́р
    pron: "g между l и a — [ɣ]; ударение на последнем слоге."
    meaning: "Самый короткий и толстый палец на руке. Большой палец на ноге — dedo gordo del pie."
    examples:
      - "Levantó el pulgar y sonrió. — Он поднял большой палец и улыбнулся."
      - "Cuando estaban nerviosos y no sabían cómo evitarlo, los niños chupaban el pulgar. — Когда они нервничали и не знали, как этого избежать, дети сосали большой палец."
      - "Se hizo daño en el pulgar al cerrar la puerta del coche y le puso hielo durante una hora. — Он ушиб большой палец, закрывая дверцу машины, и час прикладывал к нему лёд."
    origin: "Из лат. pollicaris «относящийся к большому пальцу», от pollex «большой палец». Родственные: pulgada «дюйм» (ширина пальца)."
    register: "Нейтральное."
    synonyms:
      - word: dedo gordo
        pair: ["Me duele el pulgar.", "Me duele el dedo gordo."]
        diff:
          - "dedo gordo — разговорное «большой палец»; и о ноге"
          - "pulgar — «большой палец руки», нейтральное и точное"
    analogs:
      - "thumb — большой палец"
      - "big toe — большой палец ноги"
    dialogue:
      - "Ana: ¿Qué le pasó a tu mano? | Что с твоей рукой?"
      - "Pablo: Me machaqué el pulgar con un martillo. | Я ударил себе молотком по большому пальцу."
      - "Ana: ¡Qué dolor! ¿Está hinchado? | Как больно! Он опух?"
      - "Pablo: Muchísimo, y morado. Estaba distraído y no miré dónde daba. | Очень, и посинел. Я отвлёкся и не смотрел, куда бью."
      - "Ana: ¿Fuiste a urgencias? | Ты ездил на скорую?"
      - "Pablo: Sí, me hicieron una radiografía. No hay fractura, pero tengo que llevar un vendaje. | Да, сделали рентген. Перелома нет, но нужно носить повязку."
      - "Ana: Y con el pulgar así, ¿cómo vas a trabajar? | А как ты будешь работать с таким пальцем?"
      - "Pablo: Con una mano. Y con paciencia. Pulgar arriba, que no es nada grave. | Одной рукой. И терпеливо. Большой палец вверх, ничего страшного."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "pulgar arriba — палец вверх"
      - "chuparse el pulgar — сосать большой палец"
      - "regla del pulgar — правило большого пальца"
    collocation_example: "Me dio el pulgar hacia arriba y sonrió. — Он показал мне палец вверх и улыбнулся."
    trap: "Pulgar — большой палец руки, а на ноге — dedo gordo del pie. Не путайте с pulga «блоха» и pulgada «дюйм»."

  - word: llevarse
    ru: уносить, забирать; получать
    ipa: /ʎeˈβaɾse/
    say: йэба́рсэ
    pron: "ll в большинстве регионов — как «й»; v читается как b."
    meaning: "Взять что-то с собой, забрать. Ещё: «получить» (llevarse un susto), «ладить» (llevarse bien) и «быть старше на» (Se llevan dos años)."
    examples:
      - "Se llevó la bici de su primo. — Он забрал велосипед своего двоюродного брата."
      - "Me llevo muy bien con mi hermana, aunque tenemos gustos totalmente distintos. — Я очень хорошо лажу с сестрой, хотя у нас совершенно разные вкусы."
      - "Se llevó mi paraguas sin preguntar y ahora tengo que ir a casa bajo la lluvia. — Он унёс мой зонт, не спросив, и теперь мне приходится идти домой под дождём."
    origin: "llevar «нести, брать с собой» (лат. levare «поднимать»), с возвратным -se: «взять себе». Родственные: levantar «поднять», leve «лёгкий»."
    register: "Нейтральное."
    synonyms:
      - word: quitar
        pair: ["Se llevó el libro.", "Quitó el libro."]
        diff:
          - "quitar — «убрать, отнять»"
          - "llevarse — «унести с собой, взять себе»"
    analogs:
      - "to take away — унести"
      - "to get on — ладить"
    dialogue:
      - "Ana: ¿Dónde está mi cargador? | Где моя зарядка?"
      - "Pablo: Se lo llevó tu hermano. | Её забрал твой брат."
      - "Ana: ¿Otra vez? ¡Siempre se lleva mis cosas! | Опять? Он вечно уносит мои вещи!"
      - "Pablo: Pues dile que te las devuelva. A mí también se llevó un libro y no sé nada de él. | Тогда скажи ему, пусть вернёт. У меня он тоже унёс книгу, и я ничего о ней не слышал."
      - "Ana: Es un caradura. Y luego dice que no se acuerda. | Нахал. А потом говорит, что не помнит."
      - "Pablo: Mira, déjale una nota: «El que se lleve algo, que avise». | Смотри, оставь ему записку: «Кто что-то берёт, пусть предупреждает»."
      - "Ana: Muy bien. Y que se la apunte en la agenda. | Отлично. И пусть запишет себе в ежедневник."
      - "Pablo: Ja, ja. Seguro que se la lleva también. | Ха-ха. Наверняка и её утащит."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "llevarse bien con alguien — ладить с кем-то"
      - "llevarse un susto — испугаться"
      - "llevarse una sorpresa — удивиться"
      - "llevarse algo — унести что-то"
    collocation_example: "Se llevó una gran decepción con el resultado. — Он очень разочаровался в результате."
    trap: "Llevarse — возвратный глагол: me llevo, te llevas. Не путайте с llevar «нести, носить» и llevar «жить, вести»."

  - word: carne cruda
    ru: сырое мясо
    ipa: /ˈkaɾne ˈkɾuða/
    say: ка́рнэ кру́да
    pron: "d между гласными мягкое [ð]: cruda."
    meaning: "Мясо без термической обработки. Crudo — «сырой», о еде, а ещё «жёсткий, грубый» в переносном смысле."
    examples:
      - "La carne cruda puede hacer daño. — Сырое мясо может навредить."
      - "Si estás embarazada, no te conviene comer carne cruda, porque puede tener bacterias peligrosas. — Если ты беременна, тебе не стоит есть сырое мясо, потому что в нём могут быть опасные бактерии."
      - "El carpaccio se hace con carne cruda cortada muy fina y se sirve con aceite y queso. — Карпаччо готовят из очень тонко нарезанного сырого мяса и подают с маслом и сыром."
    origin: "carne — из лат. caro «мясо»; crudo — из лат. crudus «сырой, необработанный»."
    register: "Нейтральное."
    synonyms:
      - word: carne fresca
        pair: ["Compré carne cruda.", "Compré carne fresca."]
        diff:
          - "carne fresca — «свежее мясо», не обязательно сырое в сравнении с приготовленным"
          - "carne cruda — именно «непрожаренное, необработанное»"
    analogs:
      - "raw meat — сырое мясо"
      - "uncooked meat — непроваренное мясо"
    dialogue:
      - "Ana: ¿Puedo probarla? | Можно попробовать?"
      - "Pablo: No, está cruda todavía. | Нет, она ещё сырая."
      - "Ana: Pero huele muy bien. | Но так вкусно пахнет."
      - "Pablo: Un bocado de carne cruda puede dar problemas de estómago. Hay que esperar. | Кусочек сырого мяса может вызвать проблемы с желудком. Надо подождать."
      - "Ana: Vale, pero no tardes. Estoy a punto de desmayarme de hambre. | Хорошо, но недолго. Я вот-вот упаду в обморок от голода."
      - "Pablo: Aún no son ni las dos. Pica algo de pan mientras tanto. | Ещё нет и двух. Пока перекуси хлебом."
      - "Ana: Qué crueldad. Dame al menos un trozo. | Какая жестокость. Дай хотя бы кусочек."
      - "Pablo: Un trozo de pan, sí. De carne cruda, nada. | Кусочек хлеба — да. Сырого мяса — ни за что."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "carne cruda — сырое мясо"
      - "huevo crudo — сырое яйцо"
      - "verdura cruda — сырые овощи"
    collocation_example: "Lava bien las verduras crudas antes de comerlas. — Хорошо мой сырые овощи перед едой."
    trap: "Crudo согласуется: carne cruda, huevo crudo. Не путайте с cocido «варёный» и hecho «приготовленный»."

  - word: cómo demonios
    ru: как, чёрт возьми
    ipa: /ˈkomo deˈmonjos/
    say: ко́мо дэмо́ньос
    pron: "В вопросе cómo пишется со знаком ударения; demonios — «дэмо́ньос»."
    meaning: "Усилитель вопроса: раздражение или недоумение. Demonios — «демоны, черти»: мягкое ругательство."
    examples:
      - "¿Cómo demonios has entrado en mi casa? — Как, чёрт возьми, ты вошёл в мой дом?"
      - "Hay agua por todas partes y nadie me ha avisado: ¿qué demonios pasa aquí? — Везде вода, и никто меня не предупредил: что, чёрт возьми, здесь происходит?"
      - "¿Cómo demonios quieres que termine todo esto en una hora si ni siquiera tengo los documentos? — Как, чёрт возьми, ты хочешь, чтобы я закончил всё это за час, если у меня даже нет документов?"
    origin: "cómo «как» + demonios «демоны»: от лат. daemonium. «Как же, ну и бес с ним»: усиление вопроса."
    register: "Разговорное, эмоциональное; мягкое ругательство."
    synonyms:
      - word: cómo diablos
        pair: ["¿Cómo demonios lo hiciste?", "¿Cómo diablos lo hiciste?"]
        diff:
          - "diablos — то же самое: «чёрт возьми»"
    analogs:
      - "how on earth — как, чёрт возьми"
      - "what the hell — что за чёрт"
    dialogue:
      - "Ana: Ha salido por la ventana. | Он вышел через окно."
      - "Pablo: ¿Cómo demonios lo hizo? | Как, чёрт возьми, он это сделал?"
      - "Ana: Se descolgó por la fachada, sin ayuda. | Спустился по фасаду без чьей-либо помощи."
      - "Pablo: Es imposible. Estamos en un tercero. | Это невозможно. Мы на четвёртом этаже."
      - "Ana: Ni siquiera acertó a hacer ruido. Salió sin previo aviso. | Он даже не смог произвести шум. Вышел без предупреждения."
      - "Pablo: Está como una cabra. ¿Y cómo demonios se escapó de la policía? | Он спятил. И как, чёрт возьми, он сбежал от полиции?"
      - "Ana: Dicen que se hizo pasar por vecino. | Говорят, он выдал себя за соседа."
      - "Pablo: Qué sagacidad... y qué descaro. | Какая проницательность... и какая наглость."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "qué demonios — что за чёрт"
      - "dónde demonios — где, чёрт возьми"
      - "quién demonios — кто, чёрт возьми"
    collocation_example: "¿Dónde demonios he dejado las llaves? — Где, чёрт возьми, я оставил ключи?"
    trap: "В вопросе cómo пишется с ударением: cómo. Выражение эмоциональное, в вежливом разговоре лучше не использовать."

  - word: olfato de detective
    ru: детективное чутьё
    ipa: /olˈfato de deteˈktiβe/
    say: ольфа́то дэ дэтэкти́бэ
    pron: "v читается как b; ударение на ti: detective."
    meaning: "Умение замечать скрытое и догадываться: как у хорошего сыщика. Olfato — «нюх»."
    examples:
      - "Con su olfato de detective, descubrió la verdad. — Благодаря своему чутью сыщика, он раскрыл правду."
      - "Siempre sabe cuándo alguien está mintiendo sin necesidad de pruebas: tiene olfato de detective. — Он всегда знает, когда кто-то лжёт, без всяких доказательств: у него детективное чутьё."
      - "Hace falta olfato de detective para ver lo que todos los demás han pasado por alto. — Нужно детективное чутьё, чтобы увидеть то, что все остальные упустили."
    origin: "olfato «обоняние» (лат. olfactus, от olfacere «нюхать») + detective — из англ. detective. Образ: нюх, который находит след."
    register: "Нейтральное, образное."
    synonyms:
      - word: buen ojo
        pair: ["Tiene olfato de detective.", "Tiene buen ojo."]
        diff:
          - "buen ojo — «зоркий глаз, хорошее чутьё», о вкусе и о людях"
          - "olfato de detective — именно догадливость, как у сыщика"
    analogs:
      - "a nose for detective work — нюх на расследования"
      - "sleuth's instinct — чутьё сыщика"
    dialogue:
      - "La inspectora llegó a la casa y se quedó un rato en el rellano, mirando la puerta. | Инспектор приехала к дому и некоторое время стояла на площадке, глядя на дверь."
      - "Nadie había forzado la cerradura, pero había un leve olor a colonia en el aire. | Никто не взламывал замок, но в воздухе чувствовался лёгкий запах одеколона."
      - "«Aquí ha estado alguien que conocía al viudo», dijo en voz baja. | «Здесь был кто-то, кто знал вдовца», — тихо сказала она."
      - "Su ayudante la miró, aturdido, y le preguntó cómo lo sabía. | Помощник посмотрел на неё, ошеломлённый, и спросил, откуда она это знает."
      - "«Tengo olfato de detective», respondió ella con una sonrisa. | «У меня детективное чутьё», — ответила она с улыбкой."
      - "Y, efectivamente, una hora después encontraron una pista en el jardín. | И действительно, через час они нашли зацепку в саду."
    cefr: "B2."
    frequency: "Нечастое: образное выражение."
    collocations:
      - "tener olfato — иметь нюх"
      - "olfato para los negocios — нюх на дела"
      - "seguir el olfato — довериться чутью"
    collocation_example: "Tiene olfato para los negocios. — У него нюх на бизнес."
    trap: "Olfato — «нюх», а olor — «запах». Tener olfato — «обладать чутьём»; oler — «нюхать, пахнуть»."

  - word: conseguir esa carta
    ru: раздобыть то письмо
    ipa: /konseˈɣiɾ ˈesa ˈkaɾta/
    say: консэги́р э́са ка́рта
    pron: "gu перед i — [ɡ]: conseguir — «консэги́р»; спрягается как pedir: consigo, consigues."
    meaning: "Заполучить конкретное письмо или документ, которого сложно добиться. Conseguir — «достать, добиться»."
    examples:
      - "Tengo que conseguir esa carta hoy. — Мне нужно раздобыть это письмо сегодня."
      - "Gracias a un amigo del archivo de la ciudad, consiguió la carta. — Благодаря другу из городского архива он достал письмо."
      - "Nadie logró conseguir esa carta, que desapareció la noche del robo y nunca se volvió a ver. — Никому не удалось раздобыть то письмо, которое исчезло в ночь ограбления и больше не появилось."
    origin: "conseguir — из лат. consequi «следовать, догонять»: con- + sequi «следовать». Родственные: seguir «следовать», consecuencia «последствие»."
    register: "Нейтральное."
    synonyms:
      - word: obtener
        pair: ["Consiguió la carta.", "Obtuvo la carta."]
        diff:
          - "obtener — более формальное, «получить»"
          - "conseguir — «раздобыть, добиться» с усилием"
    analogs:
      - "to get hold of — раздобыть"
      - "to obtain — получить"
    dialogue:
      - "Ana: ¿Tienes el documento? | У тебя есть документ?"
      - "Pablo: Todavía no, pero lo voy a conseguir. | Пока нет, но я его раздобуду."
      - "Ana: ¿Dónde está? | Где он?"
      - "Pablo: En la caja fuerte del despacho. Tengo que conseguir esa carta antes de que llegue el inspector. | В сейфе в кабинете. Мне нужно раздобыть то письмо до приезда инспектора."
      - "Ana: ¿Y cómo piensas abrirla? | И как ты собираешься открыть сейф?"
      - "Pablo: Se me ha ocurrido una idea: la contraseña será la fecha del cumpleaños de su mujer. | Мне пришла в голову мысль: пароль наверняка дата рождения его жены."
      - "Ana: ¿Y si te equivocas? | А если ошибёшься?"
      - "Pablo: Entonces habrá que armarse de paciencia y probar otra combinación. Pero no creo: es un hombre muy sentimental. | Тогда придётся запастись терпением и попробовать другую комбинацию. Но не думаю: он очень сентиментальный."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "conseguir un trabajo — найти работу"
      - "conseguir información — получить информацию"
      - "conseguir + инфинитив — суметь сделать"
    collocation_example: "No conseguí entrar porque estaba cerrado. — Мне не удалось войти, потому что было закрыто."
    trap: "Conseguir спрягается как pedir: consigo, consiguió. После conseguir — инфинитив без предлога: conseguí abrir. Не путайте с conseguir «следовать»."

  - word: conseguir la información
    ru: получить информацию
    ipa: /konseˈɣiɾ la imfoɾmaˈθjon/
    say: консэги́р ла имформасьо́н
    pron: "n перед f звучит как «м»: информасьон."
    meaning: "Узнать то, что нужно: найти данные, собрать сведения. Часто в расследованиях и журналистике."
    examples:
      - "Obtuvo toda la información que necesitaba. — Он получил всю информацию, которая была нужна."
      - "Mañana temprano es la presentación al cliente, así que necesito conseguir la información hoy. — Завтра рано утром презентация для клиента, так что мне нужно получить информацию сегодня."
      - "La policía consiguió la información de un testigo que había visto salir al hombre del edificio. — Полиция получила сведения от свидетеля, который видел, как мужчина выходил из здания."
    origin: "conseguir «добиться» + información — из лат. informatio «разъяснение, представление» (informare «придавать форму»)."
    register: "Нейтральное, формальное."
    synonyms:
      - word: obtener información
        pair: ["Consiguió la información.", "Obtuvo la información."]
        diff:
          - "obtener — формальнее, из официальных текстов"
          - "conseguir — «раздобыть» с усилием, чаще в разговоре"
    analogs:
      - "to get information — получить информацию"
      - "to obtain information — добыть информацию"
    dialogue:
      - "Marcos: He conseguido algo de información sobre el caso. | Мне удалось раздобыть кое-какую информацию по делу."
      - "Marcos: Hablé con un vecino que oyó un ruido extraño la noche del crimen. | Я поговорил с соседом, который слышал странный шум в ночь преступления."
      - "Marcos: Me contó que vio a un hombre alto, con melena rojiza, salir por la puerta trasera. | Он рассказал, что видел высокого мужчину с рыжеватой гривой, выходящего через заднюю дверь."
      - "Marcos: No consiguió ver su cara, pero recuerda que cojeaba. | Лица он не разглядел, но помнит, что тот хромал."
      - "Marcos: Mañana intentaré conseguir las grabaciones de las cámaras de la zona. | Завтра попробую добыть записи камер в этом районе."
      - "Marcos: Si todo sale bien, no tardaré en dar con su paradero. | Если всё получится, я скоро выйду на его след."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "pedir información — запросить информацию"
      - "dar información — давать информацию"
      - "buscar información — искать информацию"
    collocation_example: "Buscó información en internet antes de decidir. — Он поискал информацию в интернете, прежде чем решить."
    trap: "Información — единственное число, женский род: la información, а не «las informaciones» (редко). Для «одна справка» — un dato."
