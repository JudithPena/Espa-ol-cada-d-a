# Четвёртый список автора, часть 11 — «Poderoso caballero» (слова 16–30).
lang: es
words:
  - word: sostén
    ru: бюстгальтер
    ipa: /sosˈten/
    say: состэ́н
    pron: "Ударение на последнем слоге: sostén; во множественном — sostenes (ударение на te)."
    meaning: "Женское бельё для груди. Ещё — «опора, поддержка»: el sostén de la familia."
    examples:
      - "Compró un sostén de encaje. — Она купила кружевной бюстгальтер."
      - "Él es el sostén de la familia. — Он — опора семьи."
    origin: "Существительное от sostener «поддерживать» (лат. sustinere: sub- «снизу» + tenere «держать»). Родственные: sostener, sustento «пропитание»."
    register: "Нейтральное."
    synonyms:
      - word: sujetador
        pair: ["Se puso el sostén.", "Se puso el sujetador."]
        diff:
          - "sujetador — основное слово в Испании"
          - "sostén — привычнее в Латинской Америке и в Мексике"
    analogs:
      - "bra — бюстгальтер"
      - "support — опора, поддержка"
    dialogue:
      - "Ana: ¿Dónde puedo comprar ropa interior? | Где купить нижнее бельё?"
      - "Pablo: En esa tienda tienen sostenes y bragas. | В том магазине есть бюстгальтеры и трусы."
    cefr: "B2."
    frequency: "Частое в магазинах одежды."
    collocations:
      - "el sostén de la familia — кормилец семьи"
      - "un sostén deportivo — спортивный бюстгальтер"
      - "sostén y bragas — бельё"
    collocation_example: "Su sueldo es el sostén de toda la familia. — Его зарплата — опора всей семьи."
    trap: "Sostén во множественном — sostenes: ударение переходит на te. В Испании чаще sujetador. Слово ещё — «поддержка»."

  - word: bocado
    ru: кусок; закуска
    ipa: /boˈkaðo/
    say: бока́до
    pron: "d между гласными мягкое [ð]."
    meaning: "Один кусок еды, который кладут в рот. Ещё — «перекус» (tomar un bocado)."
    examples:
      - "No he probado bocado desde ayer. — Со вчерашнего дня у меня и крошки во рту не было."
      - "Vamos a tomar un bocado. — Давай перекусим."
    origin: "От boca «рот» + суффикс -ado, образующий результат: «то, что берётся ртом». Родственные: bocadillo «бутерброд», boca «рот»."
    register: "Нейтральное."
    synonyms:
      - word: mordisco
        pair: ["Le di un bocado a la manzana.", "Le di un mordisco a la manzana."]
        diff:
          - "mordisco — «укус, откус» зубами"
          - "bocado — «кусок», который кладут в рот"
    analogs:
      - "bite — кусочек, укус"
      - "mouthful — полный рот"
    dialogue:
      - "Ana: ¿Has comido? | Ты поел?"
      - "Pablo: No he probado bocado en todo el día. | У меня весь день крошки во рту не было."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "no probar bocado — ничего не есть"
      - "tomar un bocado — перекусить"
      - "un bocado de pan — кусок хлеба"
    collocation_example: "No probó bocado por los nervios. — От волнения он ничего не ел."
    trap: "Bocado — «кусок» и «перекус». Не путайте с bocadillo «бутерброд» и bocata «бутерброд» (разг.): это другая еда."

  - word: arreglarse las uñas
    ru: делать маникюр
    ipa: /areˈɣlaɾse las ˈuɲas/
    say: аррэгла́рсэ лас у́ньяс
    pron: "g перед l — мягкое [ɣ]; ñ — «нь»."
    meaning: "Привести ногти в порядок: подстричь, отполировать, покрасить. Не обязательно в салоне."
    examples:
      - "Me arreglo las uñas cada semana. — Я привожу ногти в порядок каждую неделю."
      - "Fue a la peluquería a arreglarse las uñas. — Она пошла в парикмахерскую сделать маникюр."
    origin: "arreglar «приводить в порядок» (от regla «правило, линейка»: ставить по правилам) + возвратное se + uña «ноготь» (лат. ungula)."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: hacerse la manicura
        pair: ["Se arregló las uñas.", "Se hizo la manicura."]
        diff:
          - "hacerse la manicura — «сделать маникюр», обычно в салоне"
          - "arreglarse las uñas — шире: подстричь, подпилить дома"
    analogs:
      - "to do one's nails — делать ногти"
      - "to get a manicure — сделать маникюр"
    dialogue:
      - "Ana: ¿Dónde vas? | Куда ты идёшь?"
      - "Pablo: A arreglarme las uñas. | Делать маникюр."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "arreglarse el pelo — привести в порядок волосы"
      - "pintarse las uñas — покрасить ногти"
      - "cortarse las uñas — подстричь ногти"
    collocation_example: "Se pintó las uñas de rojo para la fiesta. — Она покрасила ногти в красный цвет для вечеринки."
    trap: "Возвратный глагол: me arreglo las uñas (не «mis uñas»). Не путайте arreglar «починить, привести в порядок» с arreglárselas «справиться»."

  - word: concejal
    ru: член городского совета, советник
    ipa: /konθeˈxal/
    say: консэха́ль
    pron: "c перед e в Испании — [θ]; j — «х»."
    meaning: "Человек, избранный в городской совет (ayuntamiento). Часто отвечает за какую-то область: культуру, транспорт."
    examples:
      - "El concejal de cultura inauguró la exposición. — Советник по культуре открыл выставку."
      - "Su tío es concejal en el ayuntamiento. — Его дядя — член городского совета."
    origin: "От concejo «совет, собрание» (лат. concilium «собрание»): человек, который заседает в совете. Родственные: concilio, consejo «совет»."
    register: "Формальное, политическое."
    synonyms:
      - word: edil
        pair: ["El concejal habló.", "El edil habló."]
        diff:
          - "edil — книжное и газетное слово, то же значение"
    analogs:
      - "councillor — член совета"
      - "city councilman — член городского совета"
    dialogue:
      - "Ana: ¿Quién organizó la fiesta? | Кто организовал праздник?"
      - "Pablo: El concejal de festejos. | Советник по праздникам."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "concejal de urbanismo — советник по градостроительству"
      - "concejal del ayuntamiento — член городского совета"
      - "ser concejal — быть советником"
    collocation_example: "La concejal de educación visitó el colegio. — Советник по образованию посетила школу."
    trap: "Одна форма для обоих родов: el concejal, la concejal. Не путайте с consejal: правильно concejal (через c). Consejero — «советчик»."

  - word: cadena multinacional
    ru: транснациональная сеть
    ipa: /kaˈðena multinaθjoˈnal/
    say: кадэ́на мультинасьона́ль
    pron: "d между гласными мягкое [ð]; c перед i в Испании — [θ]."
    meaning: "Сеть магазинов, кафе, отелей, принадлежащая одной большой компании в нескольких странах."
    examples:
      - "Trabaja para una cadena multinacional de hoteles. — Он работает в международной сети отелей."
      - "Las cadenas multinacionales cierran los negocios pequeños. — Международные сети закрывают маленький бизнес."
    origin: "cadena «цепь, сеть» (лат. catena «цепь») + multinacional — от multi- «много» + nacional «национальный». «Цепь, протянутая через многие страны»."
    register: "Деловое, нейтральное."
    synonyms:
      - word: franquicia
        pair: ["Es una cadena multinacional.", "Es una franquicia."]
        diff:
          - "franquicia — отдельное точка, работающая по лицензии бренда"
          - "cadena multinacional — вся сеть целиком"
    analogs:
      - "multinational chain — международная сеть"
      - "global chain — глобальная сеть"
    dialogue:
      - "Ana: ¿Dónde trabaja tu hermano? | Где работает твой брат?"
      - "Pablo: En una cadena multinacional de moda. | В международной сети магазинов одежды."
    cefr: "C1."
    frequency: "Частое в деловых и новостных текстах."
    collocations:
      - "cadena de supermercados — сеть супермаркетов"
      - "cadena de televisión — телеканал"
      - "cadena de montaje — конвейер"
    collocation_example: "Esa cadena de televisión emite en todo el mundo. — Этот телеканал вещает по всему миру."
    trap: "Cadena — и «цепь», и «сеть», и «телеканал»: cadena de televisión. Не путайте cadena «цепь» с cadera «бедро»."

  - word: agotado
    ru: истощённый, без сил; распроданный
    ipa: /aɣoˈtaðo/
    say: агота́до
    pron: "g между гласными мягкое [ɣ]; d между гласными мягкое [ð]."
    meaning: "Совсем без сил: от работы или болезни. О товаре, билетах — «закончился, распродан»."
    examples:
      - "Estoy agotado después del viaje. — Я без сил после поездки."
      - "Las entradas están agotadas. — Билеты распроданы."
    origin: "Причастие от agotar «исчерпать» (от gota «капля»). Родственные: agotarse «закончиться», gota «капля»."
    register: "Нейтральное."
    synonyms:
      - word: exhausto
        pair: ["Llegó agotado.", "Llegó exhausto."]
        diff:
          - "exhausto — «измученный до предела», сильнее и книжнее"
          - "agotado — «без сил», обычное слово"
    analogs:
      - "exhausted — измученный"
      - "sold out — распроданный"
    dialogue:
      - "Ana: ¿Cómo estás? | Как ты?"
      - "Pablo: Agotado, he trabajado doce horas. | Без сил, проработал двенадцать часов."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "agotado de cansancio — выбившийся из сил"
      - "entradas agotadas — билеты распроданы"
      - "estar agotado — быть без сил"
    collocation_example: "El libro está agotado en todas las librerías. — Книга распродана во всех магазинах."
    trap: "Agotado — причастие: agotada, agotados. О человеке — «без сил», о товаре — «закончился». Не путайте с agotar «исчерпать»."

  - word: deprimir
    ru: вгонять в депрессию
    ipa: /depɾiˈmiɾ/
    say: дэприми́р
    pron: "Ударение на последнем слоге: deprimir."
    meaning: "Делать человека подавленным: в этом смысле о погоде, новостях, обстановке. Deprimirse — «впасть в тоску»."
    examples:
      - "Este tiempo me deprime. — Эта погода меня угнетает."
      - "Se deprimió tras perder el trabajo. — Он впал в депрессию после потери работы."
    origin: "Из лат. deprimere «давить вниз»: de- «вниз» + premere «давить». Родственные: depresión «депрессия», presión «давление»."
    register: "Нейтральное."
    synonyms:
      - word: entristecer
        pair: ["La noticia lo deprimió.", "La noticia lo entristeció."]
        diff:
          - "entristecer — «опечалить», слабее"
          - "deprimir — «вогнать в подавленность», сильнее"
    analogs:
      - "to depress — угнетать"
      - "to bring down — расстраивать"
    dialogue:
      - "Ana: ¿Por qué estás tan triste? | Почему ты такой грустный?"
      - "Pablo: Las noticias me deprimen. | Новости меня угнетают."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "deprimirse — впасть в тоску"
      - "algo me deprime — это меня угнетает"
      - "una película que deprime — фильм, от которого грустно"
    collocation_example: "Ver tanto noticias me deprime. — От обилия новостей мне становится тоскливо."
    trap: "Переходный и возвратный: deprimir a alguien (кого-то), deprimirse (самому). Не путайте с reprimir «подавлять»."

  - word: finca
    ru: усадьба, поместье
    ipa: /ˈfiŋka/
    say: фи́нка
    pron: "n перед k звучит как носовое [ŋ]."
    meaning: "Земельный участок за городом с домом и хозяйством: небольшое поместье, ферма. Ещё — «любая недвижимость» в бумагах."
    examples:
      - "Tienen una finca en el campo. — У них есть усадьба за городом."
      - "La finca tiene un olivar. — В усадьбе есть оливковая роща."
    origin: "От fincar «основываться, пускать корни» (лат. figicare «вбивать»): место, где человек «укоренился». Родственное: fijo «неподвижный»."
    register: "Нейтральное."
    synonyms:
      - word: hacienda
        pair: ["Visitamos la finca.", "Visitamos la hacienda."]
        diff:
          - "hacienda — большое поместье, особенно в Латинской Америке"
          - "finca — участок с домом, любого размера"
    analogs:
      - "estate — поместье"
      - "farm — ферма"
    dialogue:
      - "Ana: ¿Dónde pasan el verano? | Где вы проводите лето?"
      - "Pablo: En una finca de mis abuelos. | В усадьбе моих дедушки и бабушки."
    cefr: "B2."
    frequency: "Частое в рассказах о деревне."
    collocations:
      - "una finca rústica — сельский участок"
      - "una finca urbana — городской участок"
      - "finca de recreo — усадьба для отдыха"
    collocation_example: "Compraron una finca con una casa de piedra. — Они купили усадьбу с каменным домом."
    trap: "В юридических документах finca — «земельный участок и недвижимость» любого типа, даже квартира: «la finca número 5». Не путайте finca «поместье» с fino «тонкий»."

  - word: pulgar
    ru: большой палец
    ipa: /pulˈɣaɾ/
    say: пульга́р
    pron: "g между l и a — [ɣ]; ударение на последнем слоге."
    meaning: "Самый короткий и толстый палец на руке. Большой палец на ноге — dedo gordo del pie."
    examples:
      - "Levantó el pulgar en señal de aprobación. — Он поднял большой палец в знак одобрения."
      - "Se hizo daño en el pulgar. — Он повредил большой палец."
    origin: "Из лат. pollicaris «относящийся к большому пальцу», от pollex «большой палец». Родственные: pulgada «дюйм» (ширина пальца)."
    register: "Нейтральное."
    synonyms:
      - word: dedo gordo
        pair: ["Me duele el pulgar.", "Me duele el dedo gordo."]
        diff:
          - "dedo gordo — разговорное «большой палец»; и о ноге"
          - "pulgar — «большой палец руки», нейтральное и точное"
    analogs:
      - "thumb — большой палец"
      - "big toe — большой палец ноги"
    dialogue:
      - "Ana: ¿Qué le pasó a tu mano? | Что с твоей рукой?"
      - "Pablo: Me machaqué el pulgar con un martillo. | Я стукнул себе большой палец молотком."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "pulgar arriba — палец вверх"
      - "chuparse el pulgar — сосать большой палец"
      - "regla del pulgar — правило большого пальца"
    collocation_example: "Me dio el pulgar hacia arriba y sonrió. — Он показал мне палец вверх и улыбнулся."
    trap: "Pulgar — большой палец руки, а на ноге — dedo gordo del pie. Не путайте с pulga «блоха» и pulgada «дюйм»."

  - word: llevarse
    ru: уносить, забирать; получать
    ipa: /ʎeˈβaɾse/
    say: йэба́рсэ
    pron: "ll в большинстве регионов — как «й»; v читается как b."
    meaning: "Взять что-то с собой, забрать. Ещё: «получить» (llevarse un susto), «ладить» (llevarse bien) и «быть старше на» (Se llevan dos años)."
    examples:
      - "Se llevó mi paraguas sin preguntar. — Он забрал мой зонт, не спросив."
      - "Me llevo muy bien con mi hermana. — Я очень хорошо лажу с сестрой."
    origin: "llevar «нести, брать с собой» (лат. levare «поднимать»), с возвратным -se: «взять себе». Родственные: levantar «поднять», leve «лёгкий»."
    register: "Нейтральное."
    synonyms:
      - word: quitar
        pair: ["Se llevó el libro.", "Quitó el libro."]
        diff:
          - "quitar — «убрать, отнять»"
          - "llevarse — «унести с собой, взять себе»"
    analogs:
      - "to take away — унести"
      - "to get on — ладить"
    dialogue:
      - "Ana: ¿Dónde está mi cargador? | Где моя зарядка?"
      - "Pablo: Se lo llevó tu hermano. | Её забрал твой брат."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "llevarse bien con alguien — ладить с кем-то"
      - "llevarse un susto — испугаться"
      - "llevarse una sorpresa — удивиться"
      - "llevarse algo — унести что-то"
    collocation_example: "Se llevó una gran decepción con el resultado. — Он очень разочаровался в результате."
    trap: "Llevarse — возвратный глагол: me llevo, te llevas. Не путайте с llevar «нести, носить» и llevar «жить, вести»."

  - word: carne cruda
    ru: сырое мясо
    ipa: /ˈkaɾne ˈkɾuða/
    say: ка́рнэ кру́да
    pron: "d между гласными мягкое [ð]: cruda."
    meaning: "Мясо без термической обработки. Crudo — «сырой», о еде, а ещё «жёсткий, грубый» в переносном смысле."
    examples:
      - "No comas carne cruda. — Не ешь сырое мясо."
      - "El carpaccio se hace con carne cruda. — Карпаччо делают из сырого мяса."
    origin: "carne — из лат. caro «мясо»; crudo — из лат. crudus «сырой, необработанный»."
    register: "Нейтральное."
    synonyms:
      - word: carne fresca
        pair: ["Compré carne cruda.", "Compré carne fresca."]
        diff:
          - "carne fresca — «свежее мясо», не обязательно сырое в сравнении с приготовленным"
          - "carne cruda — именно «непрожаренное, необработанное»"
    analogs:
      - "raw meat — сырое мясо"
      - "uncooked meat — непроваренное мясо"
    dialogue:
      - "Ana: ¿Puedo probarla? | Можно попробовать?"
      - "Pablo: No, está cruda todavía. | Нет, она ещё сырая."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "carne cruda — сырое мясо"
      - "huevo crudo — сырое яйцо"
      - "verdura cruda — сырые овощи"
    collocation_example: "Lava bien las verduras crudas antes de comerlas. — Хорошо мой сырые овощи перед едой."
    trap: "Crudo согласуется: carne cruda, huevo crudo. Не путайте с cocido «варёный» и hecho «приготовленный»."

  - word: cómo demonios
    ru: как, чёрт возьми
    ipa: /ˈkomo deˈmonjos/
    say: ко́мо дэмо́ньос
    pron: "В вопросе cómo пишется со знаком ударения; demonios — «дэмо́ньос»."
    meaning: "Усилитель вопроса: раздражение или недоумение. Demonios — «демоны, черти»: мягкое ругательство."
    examples:
      - "¿Cómo demonios has entrado? — Как, чёрт возьми, ты сюда попал?"
      - "¿Qué demonios pasa aquí? — Что, чёрт возьми, здесь происходит?"
    origin: "cómo «как» + demonios «демоны»: от лат. daemonium. «Как же, ну и бес с ним»: усиление вопроса."
    register: "Разговорное, эмоциональное; мягкое ругательство."
    synonyms:
      - word: cómo diablos
        pair: ["¿Cómo demonios lo hiciste?", "¿Cómo diablos lo hiciste?"]
        diff:
          - "diablos — то же самое: «чёрт возьми»"
    analogs:
      - "how on earth — как, чёрт возьми"
      - "what the hell — что за чёрт"
    dialogue:
      - "Ana: Ha salido por la ventana. | Он вышел через окно."
      - "Pablo: ¿Cómo demonios lo hizo? | Как, чёрт возьми, он это сделал?"
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "qué demonios — что за чёрт"
      - "dónde demonios — где, чёрт возьми"
      - "quién demonios — кто, чёрт возьми"
    collocation_example: "¿Dónde demonios he dejado las llaves? — Где, чёрт возьми, я оставил ключи?"
    trap: "В вопросе cómo пишется с ударением: cómo. Выражение эмоциональное, в вежливом разговоре лучше не использовать."

  - word: olfato de detective
    ru: детективное чутьё
    ipa: /olˈfato de deteˈktiβe/
    say: ольфа́то дэ дэтэкти́бэ
    pron: "v читается как b; ударение на ti: detective."
    meaning: "Умение замечать скрытое и догадываться: как у хорошего сыщика. Olfato — «нюх»."
    examples:
      - "Tiene olfato de detective. — У него чутьё сыщика."
      - "Con su olfato de detective, descubrió la verdad. — Благодаря своему чутью сыщика, он раскрыл правду."
    origin: "olfato «обоняние» (лат. olfactus, от olfacere «нюхать») + detective — из англ. detective. Образ: нюх, который находит след."
    register: "Нейтральное, образное."
    synonyms:
      - word: buen ojo
        pair: ["Tiene olfato de detective.", "Tiene buen ojo."]
        diff:
          - "buen ojo — «зоркий глаз, хорошее чутьё», о вкусе и о людях"
          - "olfato de detective — именно догадливость, как у сыщика"
    analogs:
      - "a nose for detective work — нюх на расследования"
      - "sleuth's instinct — чутьё сыщика"
    dialogue:
      - "Ana: ¿Cómo lo supiste? | Как ты узнал?"
      - "Pablo: Tengo olfato de detective. | У меня чутьё сыщика."
    cefr: "B2."
    frequency: "Нечастое: образное выражение."
    collocations:
      - "tener olfato — иметь нюх"
      - "olfato para los negocios — нюх на дела"
      - "seguir el olfato — довериться чутью"
    collocation_example: "Tiene olfato para los negocios. — У него нюх на бизнес."
    trap: "Olfato — «нюх», а olor — «запах». Tener olfato — «обладать чутьём»; oler — «нюхать, пахнуть»."

  - word: conseguir esa carta
    ru: раздобыть то письмо
    ipa: /konseˈɣiɾ ˈesa ˈkaɾta/
    say: консэги́р э́са ка́рта
    pron: "gu перед i — [ɡ]: conseguir — «консэги́р»; спрягается как pedir: consigo, consigues."
    meaning: "Заполучить конкретное письмо или документ, которого сложно добиться. Conseguir — «достать, добиться»."
    examples:
      - "Tengo que conseguir esa carta. — Мне нужно раздобыть то письмо."
      - "Consiguió la carta gracias a un amigo. — Он достал письмо благодаря другу."
    origin: "conseguir — из лат. consequi «следовать, догонять»: con- + sequi «следовать». Родственные: seguir «следовать», consecuencia «последствие»."
    register: "Нейтральное."
    synonyms:
      - word: obtener
        pair: ["Consiguió la carta.", "Obtuvo la carta."]
        diff:
          - "obtener — более формальное, «получить»"
          - "conseguir — «раздобыть, добиться» с усилием"
    analogs:
      - "to get hold of — раздобыть"
      - "to obtain — получить"
    dialogue:
      - "Ana: ¿Tienes el documento? | У тебя есть документ?"
      - "Pablo: Todavía no, pero lo voy a conseguir. | Пока нет, но достану."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "conseguir un trabajo — найти работу"
      - "conseguir información — получить информацию"
      - "conseguir + инфинитив — суметь сделать"
    collocation_example: "No conseguí entrar porque estaba cerrado. — Мне не удалось войти, потому что было закрыто."
    trap: "Conseguir спрягается как pedir: consigo, consiguió. После conseguir — инфинитив без предлога: conseguí abrir. Не путайте с conseguir «следовать»."

  - word: conseguir la información
    ru: получить информацию
    ipa: /konseˈɣiɾ la imfoɾmaˈθjon/
    say: консэги́р ла имформасьо́н
    pron: "n перед f звучит как «м»: информасьон."
    meaning: "Узнать то, что нужно: найти данные, собрать сведения. Часто в расследованиях и журналистике."
    examples:
      - "Necesito conseguir la información hoy. — Мне нужно получить информацию сегодня."
      - "La policía consiguió la información de un testigo. — Полиция получила сведения от свидетеля."
    origin: "conseguir «добиться» + información — из лат. informatio «разъяснение, представление» (informare «придавать форму»)."
    register: "Нейтральное, формальное."
    synonyms:
      - word: obtener información
        pair: ["Consiguió la información.", "Obtuvo la información."]
        diff:
          - "obtener — формальнее, из официальных текстов"
          - "conseguir — «раздобыть» с усилием, чаще в разговоре"
    analogs:
      - "to get information — получить информацию"
      - "to obtain information — добыть информацию"
    dialogue:
      - "Ana: ¿Sabes algo del caso? | Ты что-нибудь знаешь о деле?"
      - "Pablo: He conseguido algo de información. | Я кое-что узнал."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "pedir información — запросить информацию"
      - "dar información — давать информацию"
      - "buscar información — искать информацию"
    collocation_example: "Buscó información en internet antes de decidir. — Он поискал информацию в интернете, прежде чем решить."
    trap: "Información — единственное число, женский род: la información, а не «las informaciones» (редко). Для «одна справка» — un dato."
