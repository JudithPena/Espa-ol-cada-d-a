# Третий список автора, часть 7 — «Lola Lago: vacaciones al sol», глава 1 (слова 1–14).
lang: es
words:
  - word: efectivo
    ru: действительный, реальный, эффективный; наличные
    ipa: /efekˈtiβo/
    say: эфэкти́бо
    pron: "v читается как b; ударение на ti."
    meaning: "Как прилагательное — настоящий, действенный, дающий результат. Как существительное (el efectivo) — наличные деньги."
    examples:
      - "El tratamiento fue muy efectivo. — Лечение было очень эффективным."
      - "Es un método efectivo para aprender vocabulario si lo repasas todos los días. — Это эффективный способ учить слова, если повторять их каждый день."
      - "¿Pagas con tarjeta o en efectivo? Es que aquí hay un descuento si pagas en billetes. — Ты платишь картой или наличными? Здесь, если платить купюрами, есть скидка."
    origin: "От лат. effectivus «действенный», от efficere «осуществлять»: ex- «наружу» + facere «делать». Родственные: efecto «следствие, эффект», eficaz «действенный»."
    register: "Нейтральное."
    synonyms:
      - word: eficaz
        pair: ["Es un método efectivo.", "Es un método eficaz."]
        diff:
          - "eficaz — «даёт результат» вообще"
          - "efectivo — «даёт реальный, ощутимый результат»; ещё и «наличные»"
    analogs:
      - "effective — эффективный, действенный"
      - "cash — наличные (у efectivo именно это значение при оплате)"
    dialogue:
      - "Ana: ¿Cómo pagas? | Как платишь?"
      - "Pablo: En efectivo, por favor. | Наличными, пожалуйста."
      - "Ana: ¿No prefieres tarjeta? | Не хочешь картой?"
      - "Pablo: No. Con efectivo controlo mejor lo que gasto. | Нет. С наличными лучше контролирую траты."
      - "Ana: Pero es un riesgo. Se te puede caer el billetero. | Но это риск. Кошелёк может выпасть."
      - "Pablo: Es verdad. Sin embargo, el método es muy efectivo para ahorrar. | Верно. Но способ очень эффективен для экономии."
      - "Ana: Eso sí. Yo gasto sin darme cuenta con la tarjeta. | Это да. Я трачу с картой, сама того не замечая."
      - "Pablo: Pues prueba una semana en efectivo y verás la diferencia. | Попробуй неделю наличными и увидишь разницу."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "un tratamiento efectivo — действенное лечение"
      - "dinero en efectivo — наличные деньги"
      - "hacer efectivo — привести в исполнение"
      - "hacer efectivo un cheque — обналичить чек"
    collocation_example: "El cheque se hizo efectivo ayer. — Чек был обналичен вчера."
    trap: "Ложный друг: efectivo не всегда «эффективный» (это чаще eficaz). И как существительное — это «наличные»: «Pago en efectivo» — «Плачу наличными»."

  - word: efectivamente
    ru: действительно, в самом деле
    ipa: /efektiβaˈmente/
    say: эфэктибаме́нтэ
    pron: "Ударение на me: efectivamente — «эфэктибамéнтэ»."
    meaning: "Подтверждает, что сказанное верно: «именно так», «так и есть»."
    examples:
      - "Efectivamente, tenía razón desde el principio. — Действительно, он был прав с самого начала."
      - "Efectivamente, el vuelo llegó tarde, tal como habían anunciado en los altavoces del aeropuerto. — И правда, рейс прибыл с опозданием, как и объявляли по громкой связи в аэропорту."
      - "Pregunté si era él quien había llamado y me dijo que efectivamente, lo había hecho a las diez. — Я спросил, он ли звонил, и он ответил, что действительно, звонил в десять."
    origin: "Наречие от efectivo + суффикс -mente (как и в «rápidamente»). «Эффективным образом» → «на деле»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: exacto
        pair: ["Efectivamente, tienes razón.", "Exacto, tienes razón."]
        diff:
          - "exacto — короткое подтверждение «точно»"
          - "efectivamente — чуть вежливее и весомее"
    analogs:
      - "indeed — действительно"
      - "precisely — именно"
    dialogue:
      - "Ana: ¿Usted es el socio de Luis? | Вы партнёр Луиса?"
      - "Pablo: Efectivamente, soy yo. | Именно так, это я."
      - "Ana: Encantada. Quería hablarle de un contrato. | Очень приятно. Хотела поговорить с вами о договоре."
      - "Pablo: Efectivamente, ya me han avisado. Pase, por favor. | Да, мне уже сообщили. Проходите, пожалуйста."
      - "Ana: ¿Hay algún problema con los fondos? | Есть какая-то проблема со средствами?"
      - "Pablo: Efectivamente. Faltan firmas y todavía no hay una gestión clara. | Да. Не хватает подписей, и чёткого управления пока нет."
      - "Ana: Entonces, ¿qué propone? | Что тогда предлагаете?"
      - "Pablo: Aclarar los trámites. Una vez que se arreglen, firmamos. | Прояснить формальности. Как только их уладят, подпишем."
    cefr: "B1."
    frequency: "Частое в разговоре и текстах."
    collocations:
      - "efectivamente — так и есть"
      - "y, efectivamente… — и действительно…"
      - "sí, efectivamente — да, именно так"
    collocation_example: "Efectivamente, el problema estaba en el motor. — Действительно, проблема была в двигателе."
    trap: "Это подтверждение, а не оценка. Не путайте с «эффективно» (eficazmente): Funciona eficazmente — «работает эффективно»."

  - word: pagar en efectivo
    ru: платить наличными
    ipa: /paˈɣaɾ en efekˈtiβo/
    say: пага́р эн эфэкти́бо
    pron: "g между гласными мягкое [ɣ]: pagar — «пага́р»."
    meaning: "Оплатить покупку банкнотами и монетами, а не картой."
    examples:
      - "¿Aceptan efectivo o solo tarjeta? — Принимают наличные или только карточки?"
      - "Prefiero pagar en efectivo cuando compro en el mercado, porque casi nadie acepta tarjeta. — Я предпочитаю платить наличными, когда покупаю на рынке, потому что карточки почти нигде не принимают."
      - "Aquí solo se puede pagar en efectivo, y el cajero automático más cercano está a diez minutos. — Здесь можно платить только наличными, а ближайший банкомат в десяти минутах."
    origin: "pagar «платить» (лат. pacare «успокаивать»: кредитора «успокаивали» платежом) + en efectivo «наличными»."
    register: "Нейтральное."
    synonyms:
      - word: pagar en metálico
        pair: ["Pagó en efectivo.", "Pagó en metálico."]
        diff:
          - "en metálico — то же, чуть более формальное и «из договоров»"
    analogs:
      - "to pay cash — платить наличными"
      - "to pay in cash — то же"
    dialogue:
      - "Ana: ¿Aceptan tarjeta? | Вы принимаете карты?"
      - "Pablo: No, solo se puede pagar en efectivo. | Нет, можно платить только наличными."
      - "Ana: Qué fastidio. No llevo nada encima. | Какая досада. У меня ничего с собой нет."
      - "Pablo: Hay un cajero en la esquina. Aprovecha para sacar algo más. | Банкомат на углу. Воспользуйся случаем и сними побольше."
      - "Ana: ¿Cuánto hace falta? | Сколько нужно?"
      - "Pablo: Unos treinta euros. Y pide un recibo, por si hay algún problema. | Евро тридцать. И попроси чек, вдруг будут проблемы."
      - "Ana: Ya voy. ¿Me guardas la mesa? | Иду. Подержишь мне столик?"
      - "Pablo: Claro. Y no tardes, que esto está hasta los topes. | Конечно. И не задерживайся, тут битком."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "pagar con tarjeta — платить картой"
      - "pagar al contado — платить сразу, наличными"
      - "dinero en efectivo — наличные деньги"
    collocation_example: "Pagué en efectivo y no pedí factura. — Я заплатил наличными и не взял чек."
    trap: "Предлог en: pagar en efectivo, а картой — con: pagar con tarjeta. Не говорите «pagar por efectivo»."

  - word: socio
    ru: партнёр, компаньон, член (клуба)
    ipa: /ˈsoθjo/
    say: со́сьо
    pron: "c перед i в Испании — [θ]; ударение на первом слоге."
    meaning: "Тот, кто делит с кем-то дело или входит в организацию: партнёр по бизнесу, член клуба."
    examples:
      - "Es socio del club de fútbol. — Он член футбольного клуба."
      - "Los socios de la cooperativa decidieron por votación repartir los beneficios del año. — Члены кооператива проголосовали за распределение прибыли за год."
      - "Mi socio y yo abrimos una joyería hace cinco años, y el negocio ha ido muy bien. — Мы с компаньоном открыли ювелирный магазин пять лет назад, и дело пошло очень хорошо."
    origin: "Из лат. socius «товарищ, союзник». Родственные: sociedad «общество», social «общественный», asociar «связывать»."
    register: "Нейтральное, деловое."
    synonyms:
      - word: compañero
        pair: ["Es mi socio.", "Es mi compañero."]
        diff:
          - "compañero — товарищ, коллега, спутник, не обязательно по бизнесу"
          - "socio — именно «по делу»: партнёр, член общества"
    analogs:
      - "partner — партнёр"
      - "member — член (клуба)"
    dialogue:
      - "Ana: ¿Con quién llevas el negocio? | С кем ты ведёшь дело?"
      - "Pablo: Con mi socio, Luis. | С моим партнёром Луисом."
      - "Ana: ¿Y os lleváis bien? | И вы ладите?"
      - "Pablo: Muy bien. Es concienzudo y siempre cumple. | Очень. Он добросовестный и всегда выполняет обещания."
      - "Ana: ¿Hace mucho que sois socios? | Вы давно партнёры?"
      - "Pablo: Cinco años. Efectivamente, fue él quien me convenció para empezar. | Пять лет. Именно он убедил меня начать."
      - "Ana: Qué suerte. Un buen socio vale oro. | Повезло. Хороший партнёр на вес золота."
      - "Pablo: Sí. Aunque a veces discutimos, pese a todo nos entendemos. | Да. Хотя иногда спорим, мы всё равно понимаем друг друга."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "socio del club — член клуба"
      - "hacerse socio — вступить в клуб"
      - "socio capitalista — партнёр-вкладчик"
    collocation_example: "Se hizo socio del gimnasio la semana pasada. — Он купил абонемент в спортзал на прошлой неделе."
    trap: "Ложный друг: socio — не «социальный». Женский род — socia. Не путайте с asociado «связанный, ассоциированный» и socorro «помощь»."

  - word: las joyas
    ru: драгоценности, украшения
    ipa: /las ˈxojas/
    say: лас хо́йас
    pron: "j — «х»: «хо́йас»; y в joya читается как «й»."
    meaning: "Дорогие украшения из золота, серебра, камней. Единственное число joya — «драгоценность; сокровище»."
    examples:
      - "Compró joyas en una tienda del centro. — Она купила драгоценности в магазине в центре."
      - "Guarda las joyas de su abuela en una caja fuerte escondida. — Она хранит драгоценности бабушки в спрятанном сейфе."
      - "Los ladrones se llevaron todas las joyas y dejaron intacto el resto de las cosas de la casa. — Воры унесли все драгоценности и оставили нетронутыми остальные вещи в доме."
    origin: "Из старофранцузского joiel «драгоценность», далее из лат. gaudium «радость». Родственные: joyero «ювелир, шкатулка», joyería «ювелирный магазин»."
    register: "Нейтральное."
    synonyms:
      - word: alhajas
        pair: ["Le robaron las joyas.", "Le robaron las alhajas."]
        diff:
          - "alhajas — старинное и книжное, из арабского"
    analogs:
      - "jewels — драгоценности"
      - "jewellery — ювелирные изделия"
    dialogue:
      - "Ana: ¿Dónde están las joyas? | Где драгоценности?"
      - "Pablo: En la caja fuerte. | В сейфе."
      - "Ana: ¿Y la combinación? | А шифр?"
      - "Pablo: Solo la sabe mi abuela. La apuntó en una nota suelta que escondió en el joyero. | Знает только бабушка. Она записала его на листке и спрятала в шкатулке."
      - "Ana: ¡Qué imprudencia! Cualquiera podría encontrarla. | Какая неосторожность! Любой мог бы найти."
      - "Pablo: Por eso las joyas están en un sitio discreto. Nadie sospecha. | Поэтому драгоценности лежат в неприметном месте. Никто не подозревает."
      - "Ana: ¿Y valen mucho? | А они дорого стоят?"
      - "Pablo: Más por el valor sentimental que por otra cosa. | Скорее своей сентиментальной ценностью, чем чем-то другим."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "joyas de oro — золотые украшения"
      - "joyas falsas — бижутерия"
      - "caja de joyas — шкатулка для украшений"
      - "ser una joya — быть сокровищем (о человеке)"
    collocation_example: "Mi abuela me dejó todas sus joyas. — Бабушка оставила мне все свои драгоценности."
    trap: "Joya — женского рода: la joya, las joyas. Не путайте с joyero: это и «ювелир», и «шкатулка для украшений»."

  - word: joyero
    ru: ювелир; шкатулка для украшений
    ipa: /xoˈʝeɾo/
    say: хойе́ро
    pron: "j — «х»; y между гласными — «й»."
    meaning: "Человек, который делает или продаёт украшения. Также шкатулка для украшений."
    examples:
      - "Guardó el collar en el joyero. — Она убрала ожерелье в шкатулку."
      - "El joyero hizo un anillo a medida con las piedras de mi abuela. — Ювелир сделал кольцо на заказ из камней моей бабушки."
      - "Mi tío es joyero en una calle muy antigua del centro y trabaja solo con oro y plata. — Мой дядя ювелир на очень старой улице в центре и работает только с золотом и серебром."
    origin: "От joya «драгоценность» + суффикс -ero, обозначающий профессию или вместилище (как en panadero, cenicero)."
    register: "Нейтральное."
    synonyms:
      - word: orfebre
        pair: ["Es un joyero famoso.", "Es un orfebre famoso."]
        diff:
          - "orfebre — мастер, который работает с золотом и серебром, работа мастера"
          - "joyero — и мастер, и продавец украшений"
    analogs:
      - "jeweller — ювелир"
      - "jewellery box — шкатулка для украшений"
    dialogue:
      - "Ana: ¿Dónde compraste el anillo? | Где ты купил кольцо?"
      - "Pablo: En casa de un joyero de Madrid. | У одного ювелира в Мадриде."
      - "Ana: Es precioso. ¿Cuánto costó? | Оно прекрасно. Сколько стоило?"
      - "Pablo: Pagué en efectivo y no te lo digo, que me da vergüenza. | Я заплатил наличными и тебе не скажу, мне стыдно."
      - "Ana: ¿Era caro? | Оно было дорогим?"
      - "Pablo: Un poco. Pero el joyero fue muy amable y me hizo un descuento. | Немного. Но ювелир был очень любезен и сделал скидку."
      - "Ana: ¿Y lo guardas en algún joyero? | И ты хранишь его в какой-нибудь шкатулке?"
      - "Pablo: Sí, en uno de madera que me regaló mi abuela. | Да, в деревянной, которую подарила бабушка."
    cefr: "B1."
    frequency: "Нечастое."
    collocations:
      - "un joyero de confianza — проверенный ювелир"
      - "un joyero de madera — деревянная шкатулка"
      - "taller de joyero — мастерская ювелира"
    collocation_example: "Llevé el reloj al joyero para arreglarlo. — Я отнёс часы ювелиру на ремонт."
    trap: "Одно слово — два значения: человек и предмет. Женщина-ювелир — joyera. Магазин — joyería."

  - word: joyería
    ru: ювелирный магазин
    ipa: /xoʝeˈɾia/
    say: хойери́я
    pron: "j — «х»; ía — два слога: хо-йе-ри́-я."
    meaning: "Магазин, мастерская или искусство работы с ювелирными изделиями."
    examples:
      - "Compré el anillo en una joyería. — Я купил кольцо в ювелирном магазине."
      - "Estudió joyería en una escuela de artes y hoy diseña colecciones para marcas internacionales. — Он изучал ювелирное дело в школе искусств и сегодня создаёт коллекции для международных брендов."
      - "La joyería abre a las diez y cierra a mediodía para volver a abrir por la tarde. — Ювелирный магазин открывается в десять и закрывается в полдень, чтобы снова открыться во второй половине дня."
    origin: "От joya «драгоценность» + суффикс -ería «место, магазин» (как en panadería, librería)."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "jewellery shop — ювелирный магазин"
      - "jeweller's — магазин ювелира"
    dialogue:
      - "Ana: ¿Dónde trabajas? | Где ты работаешь?"
      - "Pablo: En una joyería del centro. | В ювелирном магазине в центре."
      - "Ana: ¿Y qué haces allí? | И что ты там делаешь?"
      - "Pablo: Atiendo a los clientes y registro las ventas. | Принимаю клиентов и оформляю продажи."
      - "Ana: ¿Hay muchas trabas para vender joyas? | Много ли препятствий для продажи украшений?"
      - "Pablo: Sí, hay trámites burocráticos y hay que declarar todo al fisco. | Да, есть бюрократические формальности, и всё нужно декларировать в налоговую."
      - "Ana: Qué responsabilidad. ¿Tienes socio? | Какая ответственность. У тебя есть партнёр?"
      - "Pablo: No, el dueño es un joyero muy concienzudo. Yo solo soy el empleado. | Нет, хозяин — очень добросовестный ювелир. Я просто сотрудник."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "una joyería de lujo — магазин роскошных украшений"
      - "entrar en una joyería — зайти в ювелирный магазин"
      - "robo en una joyería — ограбление ювелирного магазина"
    collocation_example: "Atracaron una joyería en el centro de la ciudad. — Ограбили ювелирный магазин в центре города."
    trap: "Joyería — магазин, joyero — мастер. Не путайте с relojería «часовой магазин»."

  - word: fiscal
    ru: прокурор; налоговый
    ipa: /fisˈkal/
    say: фиска́ль
    meaning: "Как существительное (el/la fiscal) — прокурор, обвинитель в суде. Как прилагательное — налоговый, государственный (año fiscal, deuda fiscal)."
    examples:
      - "La fiscal pidió cinco años de cárcel. — Прокурор попросила пять лет тюрьмы."
      - "El fiscal general del Estado anunció una investigación sobre los contratos del ayuntamiento. — Генеральный прокурор государства объявил о расследовании контрактов мэрии."
      - "Tiene problemas fiscales desde que dejó de declarar los ingresos de su segundo trabajo. — У него проблемы с налогами с тех пор, как он перестал декларировать доходы со второй работы."
    origin: "Из лат. fiscalis «относящийся к казне», от fiscus «казна, корзина для денег». Родственные: fisco «казна», fiscalía «прокуратура»."
    register: "Формальное, юридическое."
    synonyms:
      - word: acusador
        pair: ["El fiscal habló.", "El acusador habló."]
        diff:
          - "acusador — «тот, кто обвиняет», любой человек"
          - "fiscal — должность прокурора в суде"
    analogs:
      - "prosecutor — прокурор"
      - "fiscal — налоговый, финансовый"
    dialogue:
      - "Ana: ¿Quién lleva el caso? | Кто ведёт дело?"
      - "Pablo: La fiscal del juzgado. | Прокурор суда."
      - "Ana: ¿Es dura? | Она строгая?"
      - "Pablo: Muy concienzuda. Nunca se apresura a acusar sin pruebas. | Очень дотошная. Никогда не спешит обвинять без доказательств."
      - "Ana: ¿Y qué pide para el acusado? | И чего она требует для обвиняемого?"
      - "Pablo: Cinco años de cárcel, por infidelidad en la gestión de fondos. | Пять лет тюрьмы за недобросовестное управление средствами."
      - "Ana: ¡Qué consecuencia nefasta para su familia! | Какое пагубное последствие для его семьи!"
      - "Pablo: Sí, pese a todo, la fiscal asegura que se respetarán sus derechos. | Да, но прокурор уверяет, что его права будут соблюдены."
    cefr: "B2."
    frequency: "Частое в новостях и судебных текстах."
    collocations:
      - "fiscal general — генеральный прокурор"
      - "año fiscal — финансовый год"
      - "paraíso fiscal — налоговая гавань"
    collocation_example: "Muchas empresas buscan un paraíso fiscal. — Многие компании ищут налоговую гавань."
    trap: "В испанском fiscal — «прокурор» и «налоговый»: из контекста ясно. Для мужчин и женщин одно слово: el fiscal, la fiscal. Не путайте с fisco «казна»."

  - word: fisco
    ru: казна, налоговая служба
    ipa: /ˈfisko/
    say: фи́ско
    meaning: "Государственная казна и налоговая служба как организация. «Hacienda» часто говорят об этом же."
    examples:
      - "Hacienda es el fisco de España. — Hacienda – это налоговая служба Испании."
      - "El fisco persigue a los defraudadores con inspecciones cada vez más frecuentes. — Налоговая служба преследует тех, кто уклоняется от налогов, всё более частыми проверками."
      - "Debe dinero al fisco desde hace años y ahora le han embargado la cuenta del banco. — Он уже много лет должен деньги казне, и теперь у него арестовали банковский счёт."
    origin: "От лат. fiscus «кошель; казна»: изначально корзина для денег императора. Родственные: fiscal, fiscalía, confiscar «конфисковать»."
    register: "Формальное, газетное."
    synonyms:
      - word: Hacienda
        pair: ["Debe dinero al fisco.", "Debe dinero a Hacienda."]
        diff:
          - "Hacienda — налоговая служба Испании, пишется с большой буквы"
          - "fisco — общее слово «казна», в газетах"
    analogs:
      - "treasury — казначейство"
      - "tax authorities — налоговые органы"
    dialogue:
      - "Ana: ¿Por qué lo investigan? | Почему его расследуют?"
      - "Pablo: Por engañar al fisco. | За обман налоговой."
      - "Ana: ¿Cuánto debía? | Сколько он задолжал?"
      - "Pablo: Una fortuna. Ocultó ingresos mediante una cuenta falsa durante años. | Целое состояние. Годами скрывал доходы через поддельный счёт."
      - "Ana: ¿Y lo descubrieron ahora? | И обнаружили только сейчас?"
      - "Pablo: Sí, una vez que su socio lo denunció. | Да, после того как его партнёр донёс."
      - "Ana: ¿Y qué consecuencias tendrá? | И какие будут последствия?"
      - "Pablo: Una multa enorme y, quizá, cárcel. El fisco no perdona. | Огромный штраф и, возможно, тюрьма. Налоговая не прощает."
    cefr: "C1."
    frequency: "Средней частоты: в новостях."
    collocations:
      - "engañar al fisco — обмануть налоговую"
      - "defraudar al fisco — уклониться от налогов"
      - "deuda con el fisco — долг перед казной"
    collocation_example: "La empresa defraudó al fisco millones de euros. — Компания недоплатила государству миллионы евро."
    trap: "Fisco — всегда с артиклем: el fisco. В бытовой речи Испании обычно говорят Hacienda: «Me llamó Hacienda»."

  - word: fiscalía
    ru: прокуратура
    ipa: /fiskaˈlia/
    say: фискали́я
    pron: "ía — два слога: фис-ка-ли́-я."
    meaning: "Учреждение прокуроров и должность прокурора. Fiscalía General del Estado — Генеральная прокуратура."
    examples:
      - "Dos fiscalías investigan el caso. — Две прокуратуры расследуют это дело."
      - "La fiscalía abrió una investigación después de recibir la denuncia de los vecinos. — Прокуратура начала расследование после получения заявления жителей."
      - "La Fiscalía General del Estado pidió más tiempo para estudiar los documentos del caso. — Генеральная прокуратура государства попросила больше времени для изучения документов по делу."
    origin: "От fiscal «прокурор» + суффикс -ía «учреждение, должность» (как en policía, alcaldía)."
    register: "Формальное, юридическое."
    synonyms: []
    analogs:
      - "prosecutor's office — прокуратура"
      - "public prosecution service — служба уголовного преследования"
    dialogue:
      - "Ana: ¿Adónde fue a denunciar? | Куда он пошёл заявлять?"
      - "Pablo: A la fiscalía. | В прокуратуру."
      - "Ana: ¿No a la comisaría? | Не в комиссариат?"
      - "Pablo: No. Dice que la policía no se atrevería a investigar a su socio. | Нет. Говорит, что полиция не решится расследовать его партнёра."
      - "Ana: ¿Y la fiscalía qué ha hecho? | И что сделала прокуратура?"
      - "Pablo: Ha abierto un expediente y ha pedido todas las cuentas de la empresa. | Открыла дело и запросила все счета фирмы."
      - "Ana: Entonces el asunto va en serio. | Значит, дело серьёзное."
      - "Pablo: Sí. Y una vez que revisen los fondos, descubrirán todo el pastel. | Да. А когда проверят средства, всё раскроется."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "Fiscalía General — Генеральная прокуратура"
      - "denunciar ante la fiscalía — заявить в прокуратуру"
      - "la fiscalía pide — прокуратура требует"
    collocation_example: "La fiscalía pide diez años de cárcel para el acusado. — Прокуратура требует для обвиняемого десять лет тюрьмы."
    trap: "Не путайте fiscalía «прокуратура» с «налоговой службой» (Hacienda). Слово женского рода: la fiscalía."

  - word: inspector de Hacienda
    ru: налоговый инспектор
    ipa: /inspekˈtoɾ de aˈθjenda/
    say: инспэкто́р дэ асье́нда
    pron: "H не читается; c перед i в Испании — [θ]; ie — один слог."
    meaning: "Сотрудник налоговой службы Испании, который проверяет декларации и расчёты. Hacienda — «налоговая служба; казначейство»."
    examples:
      - "Llegó un inspector de Hacienda a la oficina. — В офис приехал налоговый инспектор."
      - "El inspector de Hacienda revisó las cuentas del restaurante durante tres días seguidos. — Налоговый инспектор три дня подряд проверял бухгалтерию ресторана."
      - "Recibió la visita de un inspector de Hacienda que quería ver todas las facturas del año. — К нему пришёл налоговый инспектор, который хотел посмотреть все счета за год."
    origin: "inspector — от лат. inspicere «осматривать». hacienda — от лат. facienda «то, что надо сделать», позднее «имущество, государственные финансы»."
    register: "Формальное."
    synonyms: []
    analogs:
      - "tax inspector — налоговый инспектор"
      - "revenue officer — налоговый служащий"
    dialogue:
      - "Ana: ¿Quién viene mañana a la oficina? | Кто завтра придёт в офис?"
      - "Pablo: Un inspector de Hacienda. | Налоговый инспектор."
      - "Ana: ¡Qué agobio! ¿Sin previo aviso? | Какая духота! Без предупреждения?"
      - "Pablo: No, nos avisaron hace una semana. Pero nadie se lo tomó en serio. | Нет, нас предупредили неделю назад. Но никто не отнёсся серьёзно."
      - "Ana: ¿Está todo en orden? | Всё в порядке?"
      - "Pablo: Casi. Faltan unas facturas y un par de trámites burocráticos. | Почти. Не хватает нескольких счетов и пары бюрократических формальностей."
      - "Ana: Pues a trabajar. Hay que armarse de paciencia. | Тогда за работу. Нужно запастись терпением."
      - "Pablo: Y ser sinceros. Un inspector de Hacienda huele cualquier mentira. | И быть честными. Налоговый инспектор чует любую ложь."
    cefr: "C1."
    frequency: "Частое в новостях и деловой речи."
    collocations:
      - "Agencia Tributaria — налоговое агентство"
      - "recibir una inspección — пройти проверку"
      - "deber dinero a Hacienda — быть должным налоговой"
    collocation_example: "Hacienda me ha enviado una carta. — Налоговая прислала мне письмо."
    trap: "Hacienda в этом смысле пишется с большой H. Hacienda — ещё и «усадьба, поместье» в Латинской Америке."

  - word: nena
    ru: детка, малышка
    ipa: /ˈnena/
    say: нэ́на
    meaning: "Ласковое обращение к девочке, девушке или женщине помоложе; в разговоре — «детка». Мужской род — nene."
    examples:
      - "La nena sonríe a todo el mundo. — Малышка улыбается всем."
      - "La nena duerme en su cuna y no quiere que enciendan la luz. — Малышка спит в своей кроватке и не хочет, чтобы включали свет."
      - "Ven aquí, nena, que te abrocho el abrigo antes de salir a la calle con el frío. — Иди сюда, малышка, я застегну тебе пальто, прежде чем мы выйдем на мороз."
    origin: "Из детской речи: повторяющиеся слоги, как «баба» или «мама». Парное слово — nene «малыш»."
    register: "Разговорное, ласковое; в обращении к взрослой женщине может звучать снисходительно."
    synonyms:
      - word: niña
        pair: ["Mi nena ya sabe leer.", "Mi niña ya sabe leer."]
        diff:
          - "niña — нейтральное «девочка»"
          - "nena — ласковое «малышка», тёплое и домашнее"
    analogs:
      - "baby — детка, обращение"
      - "sweetheart — милая"
    dialogue:
      - "Ana: ¿Cómo está la nena? | Как малышка?"
      - "Pablo: Muy bien, ya camina. | Очень хорошо, уже ходит."
      - "Ana: ¡Qué rápido pasa el tiempo! La última vez que la vi era un bebé. | Как быстро летит время! В последний раз я видела её младенцем."
      - "Pablo: Sí, y ahora es un torbellino. No se queda quieta ni un segundo. | Да, а теперь она вихрь. Ни секунды не сидит на месте."
      - "Ana: ¿Habla ya? | Уже говорит?"
      - "Pablo: Dice «papá» y «agua». Lo demás son gritos y risas. | Говорит «папа» и «вода». Остальное — крики и смех."
      - "Ana: Qué ternura de nena. | Какая нежная малышка."
      - "Pablo: Pues de noche se despierta y ya no hay quien la duerma. Estoy agotado. | А ночью просыпается — и уже не уложить. Я выжат."
    cefr: "B1."
    frequency: "Частое в разговоре."
    collocations:
      - "mi nena — моя малышка"
      - "ven, nena — иди сюда, детка"
      - "nena y nene — малыши"
    collocation_example: "Mi nena cumple dos años mañana. — Моей малышке завтра два года."
    trap: "В обращении ко взрослой женщине может быть неуважительным: «Oye, nena» звучит как «эй, детка». Мужской род — nene."

  - word: impuesto
    ru: налог
    ipa: /imˈpwesto/
    say: импуэ́сто
    pron: "ue — один слог «уэ»; mp — «мп»."
    meaning: "Деньги, которые люди и компании обязаны платить государству."
    examples:
      - "Los impuestos son muy altos este año. — Налоги в этом году очень высокие."
      - "Los impuestos suben cada año, pero los servicios públicos no parecen mejorar nada. — Налоги растут каждый год, но государственные услуги, похоже, не становятся лучше."
      - "Hay que pagar los impuestos antes de junio, o te cobrarán una multa por el retraso. — Налоги нужно заплатить до июня, иначе тебя оштрафуют за просрочку."
    origin: "Причастие от imponer «налагать» (лат. imponere: in- «на» + ponere «класть»). Буквально «наложенное»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: tasa
        pair: ["Pagó el impuesto.", "Pagó la tasa."]
        diff:
          - "tasa — плата за конкретную услугу: за паспорт, за суд"
          - "impuesto — общий налог, не связанный с одной услугой"
    analogs:
      - "tax — налог"
      - "duty — пошлина, налог на товары"
    dialogue:
      - "Ana: ¿Cuándo hay que pagar los impuestos? | Когда нужно платить налоги?"
      - "Pablo: Antes de fin de mes. | До конца месяца."
      - "Ana: ¿Todos? | Все?"
      - "Pablo: Los de la renta, sí. Los otros impuestos tienen otros plazos. | Подоходный — да. У других налогов другие сроки."
      - "Ana: Siempre me hago un lío con esto. | Я вечно путаюсь в этом."
      - "Pablo: Pide ayuda a un asesor. Una vez que lo explica, es sencillo. | Попроси помощи у консультанта. Когда объяснят, всё просто."
      - "Ana: Pero cobran una fortuna. | Но они берут целое состояние."
      - "Pablo: Es mejor que una multa. Los impuestos no se perdonan. | Лучше, чем штраф. Налоги не прощают."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "pagar impuestos — платить налоги"
      - "subir los impuestos — повысить налоги"
      - "impuesto sobre la renta — подоходный налог"
    collocation_example: "El Gobierno quiere subir los impuestos. — Правительство хочет повысить налоги."
    trap: "Impuesto — и «налог», и причастие от imponer «наложенный»: Me han impuesto una multa. Налоги обычно во множественном: los impuestos."

  - word: imponer
    ru: навязывать, налагать
    ipa: /impoˈneɾ/
    say: импонэ́р
    pron: "Спрягается как poner: impongo, impones, impuso; причастие — impuesto."
    meaning: "Заставить принять что-то: волю, правило, наказание, налог. Imponerse — «взять верх; навязать себя»."
    examples:
      - "No quiero imponerte mi opinión. — Не хочу навязывать тебе своё мнение."
      - "Le impusieron una multa por aparcar delante de una salida de emergencia. — На него наложили штраф за парковку перед аварийным выходом."
      - "El gobierno impuso nuevas restricciones de movimiento para frenar el avance de la epidemia. — Правительство ввело новые ограничения на передвижение, чтобы остановить распространение эпидемии."
    origin: "Из лат. imponere «возлагать»: in- «на» + ponere «класть». Родственные: impuesto «налог», imposición «навязывание», imponente «внушительный»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: obligar
        pair: ["Me impuso su decisión.", "Me obligó a aceptar su decisión."]
        diff:
          - "obligar — «заставить сделать», с глаголом"
          - "imponer — «навязать» что-то: правило, волю, штраф"
    analogs:
      - "to impose — навязывать, налагать"
      - "to enforce — вводить в силу"
    dialogue:
      - "Ana: ¿Por qué te multaron? | За что тебя оштрафовали?"
      - "Pablo: Me impusieron una multa por aparcar mal. | На меня наложили штраф за неправильную парковку."
      - "Ana: ¿En un carril de bus? | На полосе для автобусов?"
      - "Pablo: No, delante de un garaje. Pensé que no importaba cinco minutos. | Нет, перед гаражом. Я думал, что пять минут не страшно."
      - "Ana: Pues sí que importa. ¿Cuánto fue? | Ещё как страшно. Сколько?"
      - "Pablo: Ochenta euros. Y encima me advirtieron de que podían imponer otra. | Восемьдесят евро. И ещё предупредили, что могут наложить ещё один."
      - "Ana: Qué abuso. Yo no me atrevería a aparcar ahí. | Какой произвол. Я бы не решилась там парковаться."
      - "Pablo: Ahora tampoco me atrevo. Pero tampoco quiero que nadie me imponga cómo vivir. | Теперь и я не решусь. Но и не хочу, чтобы мне диктовали, как жить."
    cefr: "B2."
    frequency: "Частое в новостях и разговоре."
    collocations:
      - "imponer una multa — наложить штраф"
      - "imponer una condición — поставить условие"
      - "imponerse a alguien — взять верх над кем-то"
    collocation_example: "El juez impuso una pena de tres años. — Судья назначил наказание в три года."
    trap: "Imponer — не «импонировать»: «Он мне импонирует» — Me cae bien / Me gusta. Imponente — «внушительный». Не путайте с importar «иметь значение»."
