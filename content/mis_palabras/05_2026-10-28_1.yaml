      - "recibir una inspección — пройти проверку"
      - "deber dinero a Hacienda — быть должным налоговой"
    collocation_example: "Hacienda me ha enviado una carta. — Налоговая прислала мне письмо."
    trap: "Hacienda в этом смысле пишется с большой H. Hacienda — ещё и «усадьба, поместье» в Латинской Америке."

  - word: nena
    ru: детка, малышка
    ipa: /ˈnena/
    say: нэ́на
    meaning: "Ласковое обращение к девочке, девушке или женщине помоложе; в разговоре — «детка». Мужской род — nene."
    examples:
      - "Ven aquí, nena, que te abrocho el abrigo antes de salir a la calle con el frío. — Иди сюда, малышка, я застегну тебе пальто, прежде чем мы выйдем на мороз."
      - "La nena duerme en su cuna y no quiere que nadie encienda la luz del cuarto. — Малышка спит в своей кроватке и не хочет, чтобы кто-то включал свет в комнате."
      - "—Nena, no te preocupes— le dijo su abuela, abrazándola con mucho cariño. — «Детка, не волнуйся», сказала ей бабушка, с большой нежностью обнимая её."
    origin: "Из детской речи: повторяющиеся слоги, как «баба» или «мама». Парное слово — nene «малыш»."
    register: "Разговорное, ласковое; в обращении к взрослой женщине может звучать снисходительно."
    synonyms:
      - word: niña
        pair: ["Mi nena ya sabe leer.", "Mi niña ya sabe leer."]
        diff:
          - "niña — нейтральное «девочка»"
          - "nena — ласковое «малышка», тёплое и домашнее"
    analogs:
      - "baby — детка, обращение"
      - "sweetheart — милая"
    dialogue:
      - "Ana: ¿Cómo está la nena? | Как малышка?"
      - "Pablo: Muy bien, ya camina. | Очень хорошо, уже ходит."
    cefr: "B1."
    frequency: "Частое в разговоре."
    collocations:
      - "mi nena — моя малышка"
      - "ven, nena — иди сюда, детка"
      - "nena y nene — малыши"
    collocation_example: "Mi nena cumple dos años mañana. — Моей малышке завтра два года."
    trap: "В обращении ко взрослой женщине может быть неуважительным: «Oye, nena» звучит как «эй, детка». Мужской род — nene."

  - word: impuesto
    ru: налог
    ipa: /imˈpwesto/
    say: импуэ́сто
    pron: "ue — один слог «уэ»; mp — «мп»."
    meaning: "Деньги, которые люди и компании обязаны платить государству."
    examples:
      - "Hay que pagar los impuestos antes de junio, o te cobrarán una multa por el retraso. — Налоги нужно заплатить до июня, иначе тебя оштрафуют за просрочку."
      - "Los impuestos suben cada año, pero los servicios públicos no parecen mejorar nada. — Налоги растут каждый год, но государственные услуги, похоже, не становятся лучше."
      - "Existe un impuesto especial sobre el tabaco y otro sobre las bebidas con mucho azúcar. — Существует особый налог на табак и ещё один на напитки с большим содержанием сахара."
    origin: "Причастие от imponer «налагать» (лат. imponere: in- «на» + ponere «класть»). Буквально «наложенное»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: tasa
        pair: ["Pagó el impuesto.", "Pagó la tasa."]
        diff:
          - "tasa — плата за конкретную услугу: за паспорт, за суд"
          - "impuesto — общий налог, не связанный с одной услугой"
    analogs:
      - "tax — налог"
      - "duty — пошлина, налог на товары"
    dialogue:
      - "Ana: ¿Cuándo hay que pagar los impuestos? | Когда нужно платить налоги?"
      - "Pablo: Antes de fin de mes. | До конца месяца."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "pagar impuestos — платить налоги"
      - "subir los impuestos — повысить налоги"
      - "impuesto sobre la renta — подоходный налог"
    collocation_example: "El Gobierno quiere subir los impuestos. — Правительство хочет повысить налоги."
    trap: "Impuesto — и «налог», и причастие от imponer «наложенный»: Me han impuesto una multa. Налоги обычно во множественном: los impuestos."

  - word: imponer
    ru: навязывать, налагать
    ipa: /impoˈneɾ/
    say: импонэ́р
    pron: "Спрягается как poner: impongo, impones, impuso; причастие — impuesto."
    meaning: "Заставить принять что-то: волю, правило, наказание, налог. Imponerse — «взять верх; навязать себя»."
    examples:
      - "Le impusieron una multa por aparcar delante de una salida de emergencia. — На него наложили штраф за парковку перед аварийным выходом."
      - "No quiero imponerte mi opinión, pero creo que deberías pensarlo una vez más. — Я не хочу навязывать тебе своё мнение, но думаю, что тебе стоит обдумать это ещё раз."
      - "El gobierno impuso nuevas restricciones de movimiento para frenar el avance de la epidemia. — Правительство ввело новые ограничения на передвижение, чтобы остановить распространение эпидемии."
    origin: "Из лат. imponere «возлагать»: in- «на» + ponere «класть». Родственные: impuesto «налог», imposición «навязывание», imponente «внушительный»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: obligar
        pair: ["Me impuso su decisión.", "Me obligó a aceptar su decisión."]
        diff:
          - "obligar — «заставить сделать», с глаголом"
          - "imponer — «навязать» что-то: правило, волю, штраф"
    analogs:
      - "to impose — навязывать, налагать"
      - "to enforce — вводить в силу"
    dialogue:
      - "Ana: ¿Por qué te multaron? | За что тебя оштрафовали?"
      - "Pablo: Me impusieron una multa por aparcar mal. | Мне выписали штраф за неправильную парковку."
    cefr: "B2."
    frequency: "Частое в новостях и разговоре."
    collocations:
      - "imponer una multa — наложить штраф"
      - "imponer una condición — поставить условие"
      - "imponerse a alguien — взять верх над кем-то"
    collocation_example: "El juez impuso una pena de tres años. — Судья назначил наказание в три года."
    trap: "Imponer — не «импонировать»: «Он мне импонирует» — Me cae bien / Me gusta. Imponente — «внушительный». Не путайте с importar «иметь значение»."
