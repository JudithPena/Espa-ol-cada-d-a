# Третий список автора, часть 7 — «Lola Lago: vacaciones al sol», глава 1 (слова 1–14).
lang: es
words:
  - word: efectivo
    ru: действительный, реальный, эффективный; наличные
    ipa: /efekˈtiβo/
    say: эфэкти́бо
    pron: "v читается как b; ударение на ti."
    meaning: "Как прилагательное — настоящий, действенный, дающий результат. Как существительное (el efectivo) — наличные деньги."
    examples:
      - "El tratamiento fue muy efectivo y a los tres días la fiebre había desaparecido por completo. — Лечение оказалось очень эффективным, и через три дня жар полностью исчез."
      - "¿Pagas con tarjeta o en efectivo? Es que aquí hay un descuento si pagas en billetes. — Ты платишь картой или наличными? Здесь, если платить купюрами, есть скидка."
      - "Es un método efectivo para aprender vocabulario si lo repasas todos los días. — Это эффективный способ учить слова, если повторять их каждый день."
    origin: "От лат. effectivus «действенный», от efficere «осуществлять»: ex- «наружу» + facere «делать». Родственные: efecto «следствие, эффект», eficaz «действенный»."
    register: "Нейтральное."
    synonyms:
      - word: eficaz
        pair: ["Es un método efectivo.", "Es un método eficaz."]
        diff:
          - "eficaz — «даёт результат» вообще"
          - "efectivo — «даёт реальный, ощутимый результат»; ещё и «наличные»"
    analogs:
      - "effective — эффективный, действенный"
      - "cash — наличные (у efectivo именно это значение при оплате)"
    dialogue:
      - "Ana: ¿Cómo pagas? | Как платишь?"
      - "Pablo: En efectivo, por favor. | Наличными, пожалуйста."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "un tratamiento efectivo — действенное лечение"
      - "dinero en efectivo — наличные деньги"
      - "hacer efectivo — привести в исполнение"
      - "hacer efectivo un cheque — обналичить чек"
    collocation_example: "El cheque se hizo efectivo ayer. — Чек был обналичен вчера."
    trap: "Ложный друг: efectivo не всегда «эффективный» (это чаще eficaz). И как существительное — это «наличные»: «Pago en efectivo» — «Плачу наличными»."

  - word: efectivamente
    ru: действительно, в самом деле
    ipa: /efektiβaˈmente/
    say: эфэктибаме́нтэ
    pron: "Ударение на me: efectivamente — «эфэктибамéнтэ»."
    meaning: "Подтверждает, что сказанное верно: «именно так», «так и есть»."
    examples:
      - "Pregunté si era él quien había llamado y me dijo que efectivamente, lo había hecho a las diez. — Я спросил, он ли звонил, и он ответил, что действительно, звонил в десять."
      - "Efectivamente, el vuelo llegó tarde, tal como habían anunciado en los altavoces del aeropuerto. — И правда, рейс прибыл с опозданием, как и объявляли по громкой связи в аэропорту."
      - "Dijiste que habría mucha gente en la plaza y, efectivamente, no cabía ni un alfiler. — Ты говорил, что на площади будет много людей, и так и оказалось: яблоку негде было упасть."
    origin: "Наречие от efectivo + суффикс -mente (как и в «rápidamente»). «Эффективным образом» → «на деле»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: exacto
        pair: ["Efectivamente, tienes razón.", "Exacto, tienes razón."]
        diff:
          - "exacto — короткое подтверждение «точно»"
          - "efectivamente — чуть вежливее и весомее"
    analogs:
      - "indeed — действительно"
      - "precisely — именно"
    dialogue:
      - "Ana: ¿Usted es el socio? | Вы партнёр?"
      - "Pablo: Efectivamente, soy yo. | Именно так, это я."
    cefr: "B1."
    frequency: "Частое в разговоре и текстах."
    collocations:
      - "efectivamente — так и есть"
      - "y, efectivamente… — и действительно…"
      - "sí, efectivamente — да, именно так"
    collocation_example: "Efectivamente, el problema estaba en el motor. — Действительно, проблема была в двигателе."
    trap: "Это подтверждение, а не оценка. Не путайте с «эффективно» (eficazmente): Funciona eficazmente — «работает эффективно»."

  - word: pagar en efectivo
    ru: платить наличными
    ipa: /paˈɣaɾ en efekˈtiβo/
    say: пага́р эн эфэкти́бо
    pron: "g между гласными мягкое [ɣ]: pagar — «пага́р»."
    meaning: "Оплатить покупку банкнотами и монетами, а не картой."
    examples:
      - "Prefiero pagar en efectivo cuando compro en el mercado, porque casi nadie acepta tarjeta. — Я предпочитаю платить наличными, когда покупаю на рынке, потому что карточки почти нигде не принимают."
      - "Aquí solo se puede pagar en efectivo, y el cajero automático más cercano está a diez minutos. — Здесь можно платить только наличными, а ближайший банкомат в десяти минутах."
      - "Si pagas en efectivo, te hacen un descuento del diez por ciento en todo el menú. — Если платишь наличными, тебе дают скидку в десять процентов на всё меню."
    origin: "pagar «платить» (лат. pacare «успокаивать»: кредитора «успокаивали» платежом) + en efectivo «наличными»."
    register: "Нейтральное."
    synonyms:
      - word: pagar en metálico
        pair: ["Pagó en efectivo.", "Pagó en metálico."]
        diff:
          - "en metálico — то же, чуть более формальное и «из договоров»"
    analogs:
      - "to pay cash — платить наличными"
      - "to pay in cash — то же"
    dialogue:
      - "Ana: ¿Aceptan tarjeta? | Принимаете карты?"
      - "Pablo: No, solo se puede pagar en efectivo. | Нет, только наличными."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "pagar con tarjeta — платить картой"
      - "pagar al contado — платить сразу, наличными"
      - "dinero en efectivo — наличные деньги"
    collocation_example: "Pagué en efectivo y no pedí factura. — Я заплатил наличными и не взял чек."
    trap: "Предлог en: pagar en efectivo, а картой — con: pagar con tarjeta. Не говорите «pagar por efectivo»."

  - word: socio
    ru: партнёр, компаньон, член (клуба)
    ipa: /ˈsoθjo/
    say: со́сьо
    pron: "c перед i в Испании — [θ]; ударение на первом слоге."
    meaning: "Тот, кто делит с кем-то дело или входит в организацию: партнёр по бизнесу, член клуба."
    examples:
      - "Mi socio y yo abrimos una joyería hace cinco años, y el negocio ha ido muy bien. — Мы с компаньоном открыли ювелирный магазин пять лет назад, и дело пошло очень хорошо."
      - "Es socio del club de fútbol desde que era niño y no se pierde ningún partido. — Он член футбольного клуба с детства и не пропускает ни одного матча."
      - "Los socios de la cooperativa decidieron por votación repartir los beneficios del año. — Члены кооператива проголосовали за распределение прибыли за год."
    origin: "Из лат. socius «товарищ, союзник». Родственные: sociedad «общество», social «общественный», asociar «связывать»."
    register: "Нейтральное, деловое."
    synonyms:
      - word: compañero
        pair: ["Es mi socio.", "Es mi compañero."]
        diff:
          - "compañero — товарищ, коллега, спутник, не обязательно по бизнесу"
          - "socio — именно «по делу»: партнёр, член общества"
    analogs:
      - "partner — партнёр"
      - "member — член (клуба)"
    dialogue:
      - "Ana: ¿Con quién llevas el negocio? | С кем ты ведёшь дело?"
      - "Pablo: Con mi socio, Luis. | С моим партнёром Луисом."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "socio del club — член клуба"
      - "hacerse socio — вступить в клуб"
      - "socio capitalista — партнёр-вкладчик"
    collocation_example: "Se hizo socio del gimnasio la semana pasada. — Он купил абонемент в спортзал на прошлой неделе."
    trap: "Ложный друг: socio — не «социальный». Женский род — socia. Не путайте с asociado «связанный, ассоциированный» и socorro «помощь»."

  - word: las joyas
    ru: драгоценности, украшения
    ipa: /las ˈxojas/
    say: лас хо́йас
    pron: "j — «х»: «хо́йас»; y в joya читается как «й»."
    meaning: "Дорогие украшения из золота, серебра, камней. Единственное число joya — «драгоценность; сокровище»."
    examples:
      - "Guarda las joyas en una caja fuerte que está escondida detrás de un cuadro del salón. — Она хранит драгоценности в сейфе, спрятанном за картиной в гостиной."
      - "Esta pulsera es una joya de la familia que ha pasado de madres a hijas durante cien años. — Этот браслет – семейная драгоценность, которая сто лет переходит от матерей к дочерям."
      - "Los ladrones se llevaron todas las joyas y dejaron intacto el resto de las cosas de la casa. — Воры унесли все драгоценности и оставили нетронутыми остальные вещи в доме."
    origin: "Из старофранцузского joiel «драгоценность», далее из лат. gaudium «радость». Родственные: joyero «ювелир, шкатулка», joyería «ювелирный магазин»."
    register: "Нейтральное."
    synonyms:
      - word: alhajas
        pair: ["Le robaron las joyas.", "Le robaron las alhajas."]
        diff:
          - "alhajas — старинное и книжное, из арабского"
    analogs:
      - "jewels — драгоценности"
      - "jewellery — ювелирные изделия"
    dialogue:
      - "Ana: ¿Dónde están las joyas? | Где драгоценности?"
      - "Pablo: En la caja fuerte. | В сейфе."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "joyas de oro — золотые украшения"
      - "joyas falsas — бижутерия"
      - "caja de joyas — шкатулка для украшений"
      - "ser una joya — быть сокровищем (о человеке)"
    collocation_example: "Mi abuela me dejó todas sus joyas. — Бабушка оставила мне все свои драгоценности."
    trap: "Joya — женского рода: la joya, las joyas. Не путайте с joyero: это и «ювелир», и «шкатулка для украшений»."

  - word: joyero
    ru: ювелир; шкатулка для украшений
    ipa: /xoˈʝeɾo/
    say: хойе́ро
    pron: "j — «х»; y между гласными — «й»."
    meaning: "Человек, который делает или продаёт украшения. Также шкатулка для украшений."
    examples:
      - "El joyero hizo un anillo a medida con las piedras que mi abuela guardaba desde hacía años. — Ювелир сделал кольцо на заказ из камней, которые моя бабушка хранила много лет."
      - "Guardó el collar en el joyero y cerró la tapa con cuidado para no estropear las perlas. — Она убрала ожерелье в шкатулку и осторожно закрыла крышку, чтобы не испортить жемчуг."
      - "Mi tío es joyero en una calle muy antigua del centro y trabaja solo con oro y plata. — Мой дядя ювелир на очень старой улице в центре и работает только с золотом и серебром."
    origin: "От joya «драгоценность» + суффикс -ero, обозначающий профессию или вместилище (как en panadero, cenicero)."
    register: "Нейтральное."
    synonyms:
      - word: orfebre
        pair: ["Es un joyero famoso.", "Es un orfebre famoso."]
        diff:
          - "orfebre — мастер, который работает с золотом и серебром, работа мастера"
          - "joyero — и мастер, и продавец украшений"
    analogs:
      - "jeweller — ювелир"
      - "jewellery box — шкатулка для украшений"
    dialogue:
      - "Ana: ¿Dónde compraste el anillo? | Где ты купил кольцо?"
      - "Pablo: En casa de un joyero de Madrid. | У ювелира в Мадриде."
    cefr: "B1."
    frequency: "Нечастое."
    collocations:
      - "un joyero de confianza — проверенный ювелир"
      - "un joyero de madera — деревянная шкатулка"
      - "taller de joyero — мастерская ювелира"
    collocation_example: "Llevé el reloj al joyero para arreglarlo. — Я отнёс часы ювелиру на ремонт."
    trap: "Одно слово — два значения: человек и предмет. Женщина-ювелир — joyera. Магазин — joyería."

  - word: joyería
    ru: ювелирный магазин
    ipa: /xoʝeˈɾia/
    say: хойери́я
    pron: "j — «х»; ía — два слога: хо-йе-ри́-я."
    meaning: "Магазин, мастерская или искусство работы с ювелирными изделиями."
    examples:
      - "Compré el anillo en una joyería del centro que lleva abierta más de cien años. — Я купил кольцо в ювелирном магазине в центре, который работает больше ста лет."
      - "La joyería abre a las diez y cierra a mediodía para volver a abrir por la tarde. — Ювелирный магазин открывается в десять и закрывается в полдень, чтобы снова открыться во второй половине дня."
      - "Estudió joyería en una escuela de artes y hoy diseña colecciones para marcas internacionales. — Он изучал ювелирное дело в школе искусств и сегодня создаёт коллекции для международных брендов."
    origin: "От joya «драгоценность» + суффикс -ería «место, магазин» (как en panadería, librería)."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "jewellery shop — ювелирный магазин"
      - "jeweller's — магазин ювелира"
    dialogue:
      - "Ana: ¿Dónde trabajas? | Где ты работаешь?"
      - "Pablo: En una joyería del centro. | В ювелирном магазине в центре."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "una joyería de lujo — магазин роскошных украшений"
      - "entrar en una joyería — зайти в ювелирный магазин"
      - "robo en una joyería — ограбление ювелирного магазина"
    collocation_example: "Atracaron una joyería en el centro de la ciudad. — Ограбили ювелирный магазин в центре города."
    trap: "Joyería — магазин, joyero — мастер. Не путайте с relojería «часовой магазин»."

  - word: fiscal
    ru: прокурор; налоговый
    ipa: /fisˈkal/
    say: фиска́ль
    meaning: "Как существительное (el/la fiscal) — прокурор, обвинитель в суде. Как прилагательное — налоговый, государственный (año fiscal, deuda fiscal)."
    examples:
      - "La fiscal pidió cinco años de cárcel para el acusado y presentó nuevas pruebas. — Прокурор потребовала для обвиняемого пять лет тюрьмы и представила новые доказательства."
      - "Tiene problemas fiscales desde que dejó de declarar los ingresos de su segundo trabajo. — У него проблемы с налогами с тех пор, как он перестал декларировать доходы со второй работы."
      - "El fiscal general del Estado anunció una investigación sobre los contratos del ayuntamiento. — Генеральный прокурор государства объявил о расследовании контрактов мэрии."
    origin: "Из лат. fiscalis «относящийся к казне», от fiscus «казна, корзина для денег». Родственные: fisco «казна», fiscalía «прокуратура»."
    register: "Формальное, юридическое."
    synonyms:
      - word: acusador
        pair: ["El fiscal habló.", "El acusador habló."]
        diff:
          - "acusador — «тот, кто обвиняет», любой человек"
          - "fiscal — должность прокурора в суде"
    analogs:
      - "prosecutor — прокурор"
      - "fiscal — налоговый, финансовый"
    dialogue:
      - "Ana: ¿Quién lleva el caso? | Кто ведёт дело?"
      - "Pablo: La fiscal del juzgado. | Прокурор суда."
    cefr: "B2."
    frequency: "Частое в новостях и судебных текстах."
    collocations:
      - "fiscal general — генеральный прокурор"
      - "año fiscal — финансовый год"
      - "paraíso fiscal — налоговая гавань"
    collocation_example: "Muchas empresas buscan un paraíso fiscal. — Многие компании ищут налоговую гавань."
    trap: "В испанском fiscal — «прокурор» и «налоговый»: из контекста ясно. Для мужчин и женщин одно слово: el fiscal, la fiscal. Не путайте с fisco «казна»."

  - word: fisco
    ru: казна, налоговая служба
    ipa: /ˈfisko/
    say: фи́ско
    meaning: "Государственная казна и налоговая служба как организация. «Hacienda» часто говорят об этом же."
    examples:
      - "Debe dinero al fisco desde hace años y ahora le han embargado la cuenta del banco. — Он уже много лет должен деньги казне, и теперь у него арестовали банковский счёт."
      - "El fisco persigue a los defraudadores con inspecciones cada vez más frecuentes. — Налоговая служба преследует тех, кто уклоняется от налогов, всё более частыми проверками."
      - "La nueva ley permite al fisco revisar las cuentas de las empresas con más facilidad. — Новый закон позволяет налоговой службе проще проверять счета компаний."
    origin: "От лат. fiscus «кошель; казна»: изначально корзина для денег императора. Родственные: fiscal, fiscalía, confiscar «конфисковать»."
    register: "Формальное, газетное."
    synonyms:
      - word: Hacienda
        pair: ["Debe dinero al fisco.", "Debe dinero a Hacienda."]
        diff:
          - "Hacienda — налоговая служба Испании, пишется с большой буквы"
          - "fisco — общее слово «казна», в газетах"
    analogs:
      - "treasury — казначейство"
      - "tax authorities — налоговые органы"
    dialogue:
      - "Ana: ¿Por qué lo investigan? | Почему его проверяют?"
      - "Pablo: Por engañar al fisco. | За обман налоговой."
    cefr: "C1."
    frequency: "Средней частоты: в новостях."
    collocations:
      - "engañar al fisco — обмануть налоговую"
      - "defraudar al fisco — уклониться от налогов"
      - "deuda con el fisco — долг перед казной"
    collocation_example: "La empresa defraudó al fisco millones de euros. — Компания недоплатила государству миллионы евро."
    trap: "Fisco — всегда с артиклем: el fisco. В бытовой речи Испании обычно говорят Hacienda: «Me llamó Hacienda»."

  - word: fiscalía
    ru: прокуратура
    ipa: /fiskaˈlia/
    say: фискали́я
    pron: "ía — два слога: фис-ка-ли́-я."
    meaning: "Учреждение прокуроров и должность прокурора. Fiscalía General del Estado — Генеральная прокуратура."
    examples:
      - "La fiscalía abrió una investigación después de recibir la denuncia de los vecinos. — Прокуратура начала расследование после получения заявления жителей."
      - "Presentó una denuncia en la fiscalía contra la empresa que había contaminado el río. — Он подал заявление в прокуратуру против компании, загрязнившей реку."
      - "La Fiscalía General del Estado pidió más tiempo para estudiar los documentos del caso. — Генеральная прокуратура государства попросила больше времени для изучения документов по делу."
    origin: "От fiscal «прокурор» + суффикс -ía «учреждение, должность» (как en policía, alcaldía)."
    register: "Формальное, юридическое."
    synonyms: []
    analogs:
      - "prosecutor's office — прокуратура"
      - "public prosecution service — служба уголовного преследования"
    dialogue:
      - "Ana: ¿Adónde fue a denunciar? | Куда он пошёл подавать заявление?"
      - "Pablo: A la fiscalía. | В прокуратуру."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "Fiscalía General — Генеральная прокуратура"
      - "denunciar ante la fiscalía — заявить в прокуратуру"
      - "la fiscalía pide — прокуратура требует"
    collocation_example: "La fiscalía pide diez años de cárcel para el acusado. — Прокуратура требует для обвиняемого десять лет тюрьмы."
    trap: "Не путайте fiscalía «прокуратура» с «налоговой службой» (Hacienda). Слово женского рода: la fiscalía."

  - word: inspector de Hacienda
