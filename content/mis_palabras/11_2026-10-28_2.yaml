# Пятый список автора, часть 2 — «Por qué Ceuta y Melilla pertenecen a España si están en África» (слова 16–27).
lang: es
words:
  - word: el presidio
    ru: тюрьма, острог
    ipa: /el pɾeˈsiðjo/
    say: эль прэси́дьо
    pron: "d между гласными мягкое [ð]; ударение на si."
    meaning: "Место заключения, особенно старое: крепость или острог, где отбывали наказание. Часто в исторических текстах."
    examples:
      - "El presidio de la ciudad se construyó en el siglo XVIII. — Острог города построили в XVIII веке."
      - "Lo condenaron a presidio. — Его приговорили к заключению."
    origin: "Из лат. praesidium «охрана, гарнизон» (prae- «перед» + sedere «сидеть»): исходно крепость с гарнизоном. Родственные: presidente, residir."
    register: "Формальное, историческое; в современной речи чаще prisión."
    synonyms:
      - word: prisión
        pair: ["Lo enviaron al presidio.", "Lo enviaron a prisión."]
        diff:
          - "prisión — обычная тюрьма сегодня"
          - "presidio — старое слово: острог, крепость-тюрьма, каторга"
    analogs:
      - "penal colony — исправительная колония"
      - "prison — тюрьма"
    dialogue:
      - "Ana: ¿Qué es este edificio antiguo? | Что это за старое здание?"
      - "Pablo: Era el presidio de la ciudad. | Это был городской острог."
    cefr: "C1."
    frequency: "Нечастое: в исторических текстах."
    collocations:
      - "condenar a presidio — приговорить к заключению"
      - "un presidio militar — военный острог"
      - "presidio mayor — длительное заключение"
    collocation_example: "En el siglo XIX lo condenaron a presidio por robo. — В XIX веке его приговорили к тюремному заключению за кражу."
    trap: "Не путайте presidio «острог» с presidente «президент» и presidir «председательствовать»: слова одного корня, значения разные."

  - word: enfrentar
    ru: сталкивать, противопоставлять; лицом к лицу
    ipa: /emfɾenˈtaɾ/
    say: энфрэнта́р
    pron: "n перед f звучит как «м»: «эмфрэнтáр»."
    meaning: "Поставить людей или стороны лицом к лицу: в споре, в игре, в конфликте. Ещё — «встретить трудность лицом к лицу»."
    examples:
      - "El partido enfrenta a los dos mejores equipos. — Матч сводит двух лучших команд."
      - "Tuvo que enfrentar sus miedos. — Ему пришлось посмотреть в лицо своим страхам."
    origin: "От en- «в» + frente «лоб, фронт» (лат. frons): «поставить лоб ко лбу». Родственные: frente «лоб», afrontar «встретить лицом к лицу»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: afrontar
        pair: ["Enfrentó el problema.", "Afrontó el problema."]
        diff:
          - "afrontar — «встретить лицом к лицу» трудность без паники"
          - "enfrentar — шире: и «столкнуть» людей, и «встретить» трудность"
    analogs:
      - "to confront — противостоять"
      - "to pit against — противопоставить"
    dialogue:
      - "Ana: ¿Quién juega mañana? | Кто играет завтра?"
      - "Pablo: Se enfrentan los dos mejores equipos. | Сходятся две лучшие команды."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "enfrentar un problema — встретить проблему"
      - "enfrentarse a alguien — столкнуться с кем-то"
      - "enfrentar a dos partes — столкнуть две стороны"
    collocation_example: "Se enfrentó a su jefe por primera vez. — Он впервые открыто возразил начальнику."
    trap: "Enfrentar (без se) — «столкнуть, встретить»; enfrentarse a alguien — «столкнуться с кем-то». Не путайте с afrontar: они почти синонимы, но afrontar чаще о проблемах."

  - word: albergar
    ru: вмещать, размещать у себя; приютить
    ipa: /albeɾˈɣaɾ/
    say: албэрга́р
    pron: "g перед a — [ɣ]; перед e g → gu: albergue."
    meaning: "Дать место людям или предметам: приютить гостей, вместить, заключать в себе. О чувствах — «хранить в себе»."
    examples:
      - "El estadio alberga a cien mil personas. — Стадион вмещает сто тысяч человек."
      - "El edificio albergará un museo. — В здании разместится музей."
    origin: "От albergue «приют, убежище» (готск. haribaírgō «стоянка войска»). Родственные: albergue «приют», albergar esperanzas."
    register: "Формальное, книжное."
    synonyms:
      - word: acoger
        pair: ["El pueblo alberga a refugiados.", "El pueblo acoge a refugiados."]
        diff:
          - "acoger — «принять тепло, приютить» людей"
          - "albergar — шире: людей, предметы, чувства, музей в здании"
    analogs:
      - "to house — вмещать, размещать"
      - "to shelter — приютить"
    dialogue:
      - "Ana: ¿Qué hay en ese edificio? | Что в этом здании?"
      - "Pablo: Alberga un museo y una biblioteca. | В нём музей и библиотека."
    cefr: "C1."
    frequency: "Частое в текстах и новостях."
    collocations:
      - "albergar a refugiados — приютить беженцев"
      - "albergar una exposición — вместить выставку"
      - "albergar dudas — иметь сомнения"
    collocation_example: "El palacio alberga una gran colección de arte. — Во дворце хранится большая коллекция искусства."
    trap: "Не путайте albergar «приютить, вмещать» с albergue «приют, хостел». Перед e g меняется на gu: albergué."

  - word: otorgar
    ru: предоставлять, даровать, присуждать
    ipa: /otoɾˈɣaɾ/
    say: отогра́р
    pron: "g перед a — [ɣ]; перед e g → gu: otorgué."
    meaning: "Официально дать что-то: права, премию, разрешение. Слово торжественное."
    examples:
      - "Le otorgaron el premio nacional. — Ему присудили национальную премию."
      - "El Gobierno otorgó una licencia. — Правительство выдало лицензию."
    origin: "Из лат. auctorare «ручаться, подтверждать» (от auctor «автор»). Родственные: autor «автор», autoridad «власть», otorgamiento «предоставление»."
    register: "Формальное, юридическое."
    synonyms:
      - word: conceder
        pair: ["Le otorgaron un permiso.", "Le concedieron un permiso."]
        diff:
          - "conceder — «пойти навстречу, разрешить»"
          - "otorgar — «официально даровать, присудить», более торжественное"
    analogs:
      - "to grant — даровать, предоставлять"
      - "to award — присуждать"
    dialogue:
      - "Ana: ¿Quién ganó el premio? | Кто выиграл премию?"
      - "Pablo: Se lo otorgaron a una joven escritora. | Её присудили молодой писательнице."
    cefr: "C1."
    frequency: "Частое в новостях и документах."
    collocations:
      - "otorgar un premio — присудить премию"
      - "otorgar un permiso — выдать разрешение"
      - "otorgar importancia — придать значение"
    collocation_example: "El juez le otorgó la custodia de los niños. — Судья предоставил ей опеку над детьми."
    trap: "Otorgar с двумя дополнениями: otorgar algo a alguien: se lo otorgaron. Перед e g → gu: otorgué, otorguen."

  - word: plantear
    ru: ставить (вопрос), предлагать, излагать
    ipa: /plantˈeaɾ/
    say: плантеа́р
    pron: "ea — два слога: план-те-ар."
    meaning: "Выдвинуть на обсуждение: вопрос, проблему, идею. Ещё — «спланировать»: plantear un proyecto."
    examples:
      - "Quiero plantear una pregunta. — Я хочу задать вопрос."
      - "Planteó una solución muy original. — Он предложил очень оригинальное решение."
    origin: "От planta «план, чертёж» (лат. planta «подошва; план»): «начертить схему». Родственные: planta «растение; этаж; план», plan «план»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: proponer
        pair: ["Planteó una idea.", "Propuso una idea."]
        diff:
          - "proponer — «предложить» как вариант действий"
          - "plantear — «поставить на обсуждение», вопрос или проблему, не всегда решение"
    analogs:
      - "to raise — поднять (вопрос)"
      - "to put forward — выдвинуть"
    dialogue:
      - "Ana: ¿Tienes algo que decir? | Тебе есть что сказать?"
      - "Pablo: Sí, quiero plantear una duda. | Да, хочу поставить вопрос."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "plantear una pregunta — задать вопрос"
      - "plantear un problema — поставить проблему"
      - "plantearse algo — задуматься над чем-то"
    collocation_example: "Me planteé dejar el trabajo. — Я задумался о том, чтобы уйти с работы."
    trap: "Plantear — «поставить (вопрос)»; plantearse — «спрашивать себя, задумываться». Не путайте с plantar «сажать» и plantear «планировать»."

  - word: algo planteable
    ru: нечто обсуждаемое, приемлемое для рассмотрения
    ipa: /ˈalɣo plantˈeaβle/
    say: а́льго планте́абле
    pron: "ble на конце — слог «бле»; b мягкая [β]."
    meaning: "То, что можно выдвинуть на рассмотрение: идея вполне допустима. Суффикс -able значит «можно»."
    examples:
      - "No es algo planteable en este momento. — Это нельзя сейчас вынести на обсуждение."
      - "Me parece una opción planteable. — Мне кажется, это вариант, который можно рассматривать."
    origin: "От plantear «поставить вопрос» + -able «возможный»: «о чём можно говорить». Родственные: planteamiento «постановка вопроса»."
    register: "Формальное, книжное."
    synonyms:
      - word: viable
        pair: ["Es una propuesta planteable.", "Es una propuesta viable."]
        diff:
          - "viable — «осуществимый», можно реально сделать"
          - "planteable — «допустимый к обсуждению», не обязательно осуществимый"
    analogs:
      - "worth considering — достойный рассмотрения"
      - "tenable — допустимый"
    dialogue:
      - "Ana: ¿Podemos hablar de aumentar el sueldo? | Можно ли поговорить о повышении зарплаты?"
      - "Pablo: Sí, es algo planteable. | Да, это можно обсудить."
    cefr: "C1."
    frequency: "Нечастое."
    collocations:
      - "es planteable — это допустимо обсуждать"
      - "no es planteable — нечего и думать"
      - "una opción planteable — вариант, который можно рассматривать"
    collocation_example: "Es planteable aplazar la reunión. — Можно рассмотреть перенос собрания."
    trap: "Прилагательное planteable — редкое: чаще говорят «viable» или «se puede plantear». Согласуется: planteable одно для обоих родов."

  - word: sumergido
    ru: теневой; погружённый в воду
    ipa: /sumeɾˈxiðo/
    say: сумэрхи́до
    pron: "g перед i — «х»; d между гласными мягкое [ð]."
    meaning: "О вещи, скрытой под водой: затопленный. В экономике — economía sumergida: «теневая экономика»."
    examples:
      - "Trabaja en la economía sumergida. — Он работает в теневой экономике."
      - "El barco estaba sumergido en el lago. — Корабль был затоплен в озере."
    origin: "Причастие от sumergir «погружать» (лат. submergere: sub- «под» + mergere «погружать»). Родственные: emerger «всплывать», inmerso «погружённый»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: oculto
        pair: ["Es economía sumergida.", "Es economía oculta."]
        diff:
          - "oculto — «скрытый» вообще"
          - "sumergido — «теневой, ушедший под воду» именно о неформальном секторе"
    analogs:
      - "submerged — погружённый"
      - "underground economy — теневая экономика"
    dialogue:
      - "Ana: ¿Cuánta gente trabaja sin contrato? | Сколько людей работает без договора?"
      - "Pablo: Mucha, es la economía sumergida. | Много, это теневая экономика."
    cefr: "C1."
    frequency: "Частое в новостях и экономике."
    collocations:
      - "economía sumergida — теневая экономика"
      - "estar sumergido en — быть погружённым в"
      - "sumergido en pensamientos — погружённый в мысли"
    collocation_example: "Estaba sumergido en la lectura y no oyó nada. — Он был погружён в чтение и ничего не слышал."
    trap: "Причастие согласуется: sumergida, sumergidos. Глагол sumergir: перед a, o g → j: sumerja. Не путайте с emergido «вышедший на поверхность»."

  - word: desembocar en
    ru: вылиться, привести к чему-либо; впадать
    ipa: /desemboˈkaɾ en/
    say: дэсэмбока́р эн
    pron: "Перед e c меняется на qu: desemboqué."
    meaning: "Об итоге процесса: в конце концов привести к результату. О реке — «впадать» в море."
    examples:
      - "La discusión desembocó en una pelea. — Спор перерос в драку."
      - "El río desemboca en el mar. — Река впадает в море."
    origin: "des- + embocar «входить в устье» (boca «рот, устье»). Образ: река «выходит устьем» в море. Родственные: boca «рот», desembocadura «устье»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: acabar en
        pair: ["La protesta desembocó en violencia.", "La protesta acabó en violencia."]
        diff:
          - "acabar en — просто «закончиться чем-то»"
          - "desembocar en — «привести к результату» как итог цепочки событий"
    analogs:
      - "to lead to — привести к"
      - "to flow into — впадать"
    dialogue:
      - "Ana: ¿Cómo acabó la protesta? | Чем закончился протест?"
      - "Pablo: Desembocó en enfrentamientos. | Вылился в столкновения."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "desembocar en un conflicto — вылиться в конфликт"
      - "desembocar en el mar — впадать в море"
      - "la desembocadura de un río — устье реки"
    collocation_example: "La crisis desembocó en elecciones anticipadas. — Кризис привёл к досрочным выборам."
    trap: "Нужен предлог en: desembocar en algo. Перед e c → qu: desemboqué. Не путайте с desembarcar «высаживаться»."

  - word: la porra
    ru: дубинка
    ipa: /la ˈporra/
    say: ла по́рра
    pron: "rr — раскатистое."
    meaning: "Палка, которой бьют: полицейская дубинка. В разговоре — выражение гнева: «¡Vete a la porra!» — «Иди к чёрту!»."
    examples:
      - "El policía sacó la porra. — Полицейский достал дубинку."
      - "¡Vete a la porra! — Иди к чёрту!"
    origin: "Возможно, от лат. pŭrra «палка». Первоначально — «булава, палка с утолщением»."
    register: "Нейтральное; в выражениях — разговорное, грубоватое."
    synonyms:
      - word: el garrote
        pair: ["Llevaba una porra.", "Llevaba un garrote."]
        diff:
          - "garrote — «толстая дубина, палка»; ещё и орудие казни"
          - "porra — «дубинка», особенно полицейская"
    analogs:
      - "baton — дубинка"
      - "truncheon — дубинка (британское)"
    dialogue:
      - "Ana: ¿Qué llevaba el policía? | Что было у полицейского?"
      - "Pablo: Una porra y un chaleco. | Дубинка и жилет."
    cefr: "B2."
    frequency: "Частое в новостях и в разговоре."
    collocations:
      - "mandar a la porra — послать куда подальше"
      - "una porra — дубинка"
      - "¡Y una porra! — Ни за что!"
    collocation_example: "Mandó todo a la porra y se fue. — Он послал всё к чёрту и ушёл."
    trap: "В Испании porra — ещё и «жареная булочка-палочка» (churros porras), и «тотализатор». Выражения вроде «a la porra» — разговорные и резкие."

  - word: pelotas de goma
    ru: резиновые пули
    ipa: /peˈlotas de ˈɣoma/
    say: пэло́тас дэ го́ма
    pron: "g в goma читается как «г»; ударение на первом слоге."
    meaning: "Снаряды из резины, которые используют, чтобы разогнать толпу. Рядом говорят и balas de goma."
    examples:
      - "La policía disparó pelotas de goma. — Полиция стреляла резиновыми пулями."
      - "La policía usó pelotas de goma para dispersar a la multitud. — Полиция применила резиновые пули, чтобы разогнать толпу."
    origin: "pelota «мяч» (от pella «шар») + de goma «резиновый». goma — «резина, клей» (лат. gummi). Родственное: gomas «резинки»."
    register: "Нейтральное, из новостей."
    synonyms:
      - word: balas de goma
        pair: ["Dispararon pelotas de goma.", "Dispararon balas de goma."]
        diff:
          - "balas de goma — «резиновые пули» из обычного оружия"
          - "pelotas de goma — буквально «резиновые мячи», крупные снаряды; в новостях часто взаимозаменяемы"
    analogs:
      - "rubber bullets — резиновые пули"
      - "baton rounds — резиновые снаряды"
    dialogue:
      - "Ana: ¿Qué usó la policía? | Что использовала полиция?"
      - "Pablo: Pelotas de goma, según la noticia. | Резиновые пули, по новостям."
    cefr: "C1."
    frequency: "Частое в новостях о протестах."
    collocations:
      - "disparar pelotas de goma — стрелять резиновыми пулями"
      - "gas lacrimógeno — слезоточивый газ"
      - "una pelota de goma — резиновый мяч"
    collocation_example: "La policía usó gas lacrimógeno y pelotas de goma. — Полиция применила слезоточивый газ и резиновые пули."
    trap: "Pelota — и «мяч», и «пуля» в этом контексте. Не путайте с pelotón «взвод; отряд»."

  - word: un eslabón
    ru: звено
    ipa: /un esˈlaβon/
    say: ун эслабо́н
    pron: "b между гласными мягкая [β]."
    meaning: "Одно кольцо цепи. В переносном смысле — часть последовательности: «звено в цепочке»."
    examples:
      - "Cada eslabón de la cadena es importante. — Каждое звено цепи важно."
      - "Es el eslabón más débil del grupo. — Он самое слабое звено в группе."
    origin: "Из лат. *slabo «звено», возможно германского происхождения. Родственные: cadena «цепь», encadenar «сковать цепью»."
    register: "Нейтральное, образное."
    synonyms:
      - word: un anillo
        pair: ["Rompió un eslabón.", "Rompió un anillo."]
        diff:
          - "anillo — «кольцо» украшение или предмет"
          - "eslabón — именно звено цепи, часть последовательности"
    analogs:
      - "link — звено"
      - "chain link — звено цепи"
    dialogue:
      - "Ana: ¿Quién falla en el equipo? | Кто подводит команду?"
      - "Pablo: Él es el eslabón más débil. | Он самое слабое звено."
    cefr: "C1."
    frequency: "Частое в переносном смысле."
    collocations:
      - "el eslabón más débil — самое слабое звено"
      - "un eslabón perdido — недостающее звено"
      - "un eslabón de la cadena — звено цепи"
    collocation_example: "Esta pieza es un eslabón esencial de la cadena de producción. — Эта деталь — важное звено в производственной цепочке."
