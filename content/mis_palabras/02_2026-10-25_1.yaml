      - "to flicker — мигать (о свете)"
    dialogue:
      - "Inspectora: Mírame fijamente. | Смотрите на меня пристально."
      - "Testigo: Lo intento, pero no puedo dejar de parpadear. | Стараюсь, но не могу перестать моргать."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "sin parpadear — не моргая"
      - "en un parpadeo — в мгновение ока"
      - "una luz que parpadea — мигающий свет"
    collocation_example: "Todo pasó en un parpadeo. — Всё произошло в мгновение ока."
    trap: "Не путайте párpado «веко» и pestaña «ресница»."

  - word: fallecer
    ru: скончаться
    ipa: /faʝeˈθeɾ/
    say: файэсэ́р
    pron: "ll — как «й» [ʝ], c перед e — [θ]. Форма «я» — fallezco."
    meaning: "Скончаться, умереть — официально и вежливо."
    examples:
      - "Su abuelo falleció el año pasado. — Его дедушка скончался в прошлом году."
      - "Falleció en el hospital. — Он скончался в больнице."
    origin: "Лат. fallere «обманывать, подводить» — «жизнь подвела». Родственные: fallecimiento «кончина», fallar «подвести, промахнуться»."
    register: "Формальное, вежливое; в новостях и некрологах."
    synonyms:
      - word: morir
        pair: ["Falleció anoche.", "Murió anoche."]
        diff:
          - "morir — обычное слово"
          - "fallecer — вежливо и официально, только о людях"
    analogs:
      - "to pass away — скончаться"
      - "to die — умереть"
    dialogue:
      - "Ana: ¿Sabes que falleció el señor García? | Знаешь, что скончался сеньор Гарсия?"
      - "Pablo: Sí, el entierro es mañana. | Да, похороны завтра."
    cefr: "B2 — формальный регистр."
    frequency: "Частое в новостях и официальных текстах."
    collocations:
      - "fallecer de una enfermedad — скончаться от болезни"
      - "el fallecimiento — кончина"
      - "la persona fallecida — покойный"
    collocation_example: "Lamentamos el fallecimiento de su padre. — Соболезнуем в связи с кончиной вашего отца."
    trap: "Только о людях: о растениях и животных — morir. Форма «я» — fallezco."

  - word: envenenar
    ru: отравлять
    ipa: /embeneˈnaɾ/
    say: эмбэнэна́р
    pron: "n перед v звучит как [m], v — как b: «эмбэнэнар»."
    meaning: "Отравить ядом; в переносном смысле — испортить (отношения, атмосферу)."
    examples:
      - "Lo envenenaron con arsénico. — Его отравили мышьяком."
      - "Los celos envenenaron su relación. — Ревность отравила их отношения."
    origin: "en- + veneno «яд» (лат. venenum). Родственные: envenenamiento «отравление», venenoso «ядовитый»."
    register: "Нейтральное."
    synonyms:
      - word: intoxicar
        pair: ["Se envenenó con setas.", "Se intoxicó con setas."]
        diff:
          - "intoxicar — отравиться случайно, без умысла"
          - "envenenar — часто намеренно, ядом"
    analogs:
      - "to poison — отравить"
    dialogue:
      - "Inspectora: La víctima fue envenenada. | Жертва была отравлена."
      - "Forense: Sí, el veneno estaba en el té. | Да, яд был в чае."
    cefr: "B2."
    frequency: "Средняя: детективы, новости."
    collocations:
      - "envenenar a alguien — отравить кого-то"
      - "morir envenenado — умереть от отравления"
      - "envenenar el ambiente — отравить атмосферу"
    collocation_example: "Murió envenenado. — Он умер от отравления."
    trap: "Пищевое отравление — intoxicación, а не envenenamiento. Перед человеком — a: envenenar **a** alguien."

  - word: chantajear
    ru: шантажировать
    ipa: /tʃantaxeˈaɾ/
    say: чантахэа́р
    pron: "ch — «ч», j — хриплое [x]."
    meaning: "Шантажировать, угрожая раскрыть тайну или навредить."
    examples:
      - "Lo chantajeaba con unas fotos. — Она шантажировала его фотографиями."
      - "No me vas a chantajear. — Ты не будешь меня шантажировать."
    origin: "Из французского chantage, от chanter «петь»: шантажист «заставляет петь» жертву. Родственное: chantaje «шантаж»."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "to blackmail — шантажировать"
    dialogue:
      - "Lucía: ¿Por qué le pagaba? | Почему он ему платил?"
      - "Marcos: Porque lo chantajeaba. Ahora tiene sentido. | Потому что тот его шантажировал. Теперь всё сходится."
    cefr: "B2."
    frequency: "Средняя: детективы, сериалы."
    collocations:
      - "chantajear a alguien — шантажировать кого-то"
      - "chantaje emocional — эмоциональный шантаж"
      - "ser víctima de chantaje — стать жертвой шантажа"
    collocation_example: "Eso es chantaje emocional. — Это эмоциональный шантаж."
    trap: "Перед человеком — a: chantajear **a** alguien. Пишется с j: chantaje, chantajear."

  - word: resignarse
    ru: смириться
    ipa: /resiɣˈnaɾse/
    say: рэсигна́рсэ
    pron: "r в начале — раскатистое. gn читается раздельно: g + n, не как «нь»."
    meaning: "Смириться с чем-то, принять неизбежное. С чем — a или con."
    examples:
      - "Se resignó a perder. — Он смирился с поражением."
      - "No me resigno. — Я не смиряюсь."
    origin: "Лат. resignare «распечатывать, отказываться». Родственное: resignación «смирение»."
    register: "Нейтральное."
    synonyms:
      - word: aceptar
        pair: ["Me resigné a su decisión.", "Acepté su decisión."]
        diff:
          - "aceptar — просто «принять», без грусти"
          - "resignarse — принять с сожалением, против желания"
    analogs:
      - "to resign oneself to — смириться"
      - "to accept — принять"
    dialogue:
      - "Ana: ¿Vas a luchar por el trabajo? | Будешь бороться за работу?"
      - "Pablo: No, me resigno. Ya no tiene sentido. | Нет, смирюсь. Уже нет смысла."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "resignarse a algo — смириться с чем-то"
      - "con resignación — со смирением"
      - "no resignarse — не сдаваться"
    collocation_example: "Lo aceptó con resignación. — Он принял это со смирением."
    trap: "Это не «уйти в отставку»: «подать в отставку» — dimitir. И resignarse без se не бывает."

  - word: reflexionar
    ru: размышлять
    ipa: /reflekʃoˈnaɾ/
    say: рэфлэксьона́р
    pron: "x между гласными — «кс» [ks]."
    meaning: "Размышлять, обдумывать. О чём — sobre: reflexionar sobre algo."
    examples:
      - "Necesito reflexionar. — Мне нужно подумать."
      - "Reflexiona sobre lo que has hecho. — Подумай о том, что ты сделал."
    origin: "Лат. reflectere «отгибать назад»: мысль «отражается» обратно. Родственные: reflexión «размышление», reflejo «отражение»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: pensar
        pair: ["Reflexiona antes de decidir.", "Piensa antes de decidir."]
        diff:
          - "pensar — обычное «думать»"
          - "reflexionar — глубже и дольше"
    analogs:
      - "to reflect — размышлять"
      - "to think over — обдумать"
    dialogue:
      - "Lucía: ¿Ya has decidido? | Ты уже решил?"
      - "Marcos: Todavía no. Quiero reflexionar un poco. | Ещё нет. Хочу немного подумать."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "reflexionar sobre algo — размышлять о чём-то"
      - "hacer reflexionar — заставить задуматься"
      - "una reflexión profunda — глубокое размышление"
    collocation_example: "Esta película me hizo reflexionar. — Этот фильм заставил меня задуматься."
    trap: "Пишется с x: reflexionar, а «отражение» — reflejo, с j. О чём — sobre, а не de."

  - word: estremecerse
    ru: вздрогнуть
    ipa: /estɾemeˈθeɾse/
    say: эстрэмэсэ́рсэ
    pron: "c перед e — [θ]. Форма «я» — me estremezco."
    meaning: "Вздрогнуть, содрогнуться — от страха, холода или волнения."
    examples:
      - "Me estremecí al oír el grito. — Я вздрогнул, услышав крик."
      - "Se estremeció de frío. — Он задрожал от холода."
    origin: "Лат. ex- + tremere «дрожать». Родственные: temblar «дрожать», tremendo «ужасный»."
    register: "Книжное, литературное."
    synonyms:
      - word: temblar
        pair: ["Se estremeció de miedo.", "Tembló de miedo."]
        diff:
          - "temblar — дрожать долго"
          - "estremecerse — один резкий вздрог"
    analogs:
      - "to shudder — содрогнуться"
      - "to shiver — дрожать (от холода)"
    dialogue:
      - "Ana: ¿Por qué te estremeces? | Почему ты вздрогнул?"
      - "Pablo: He visto algo en el cementerio. | Я что-то видел на кладбище."
    cefr: "C1 — литературное слово."
    frequency: "Редкое в речи, частое в книгах."
    collocations:
      - "estremecerse de miedo — содрогнуться от страха"
      - "estremecerse de frío — дрожать от холода"
      - "una noticia estremecedora — потрясающая новость"
    collocation_example: "Fue una noticia estremecedora. — Это была потрясающая новость."
    trap: "Форма «я» — estremezco. От чего — de: estremecerse **de** miedo."

  - word: desconfiar de
    ru: не доверять (кому-то)
    ipa: /deskomˈfjaɾ ðe/
    say: дэскомфья́р дэ
    pron: "n перед f звучит почти как [m]. Ударение в настоящем на i: desconfío."
    meaning: "Не доверять кому-то или чему-то, подозревать."
    examples:
      - "Desconfío de él. — Я ему не доверяю."
      - "Desconfía de todo el mundo. — Он никому не доверяет."
    origin: "des- «не» + confiar «доверять» (лат. fides «вера»). Родственные: desconfianza «недоверие», desconfiado."
    register: "Нейтральное."
    synonyms:
      - word: sospechar de
        pair: ["Desconfío del vecino.", "Sospecho del vecino."]
        diff:
          - "sospechar — подозревать в конкретном поступке"
          - "desconfiar — не доверять вообще"
    analogs:
      - "to distrust — не доверять"
      - "to be wary of — остерегаться"
    dialogue:
      - "Inspectora: ¿Por qué desconfía de su socio? | Почему вы не доверяете своему партнёру?"
      - "Testigo: Porque me oculta algo. | Потому что он от меня что-то скрывает."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "desconfiar de alguien — не доверять кому-то"
      - "sentir desconfianza — испытывать недоверие"
      - "con desconfianza — с недоверием"
    collocation_example: "Me miró con desconfianza. — Он посмотрел на меня с недоверием."
    trap: "Кому — de, а не a: desconfiar **de** alguien. Ударение: desconfío, с тильдой."

  - word: alterarse
    ru: взволноваться, занервничать
    ipa: /alteˈɾaɾse/
    say: альтэра́рсэ
    meaning: "Потерять спокойствие, разнервничаться, вспылить."
    examples:
      - "No te alteres, por favor. — Не нервничай, пожалуйста."
      - "Se alteró al ver a la policía. — Он занервничал, увидев полицию."
    origin: "Лат. alterare «изменять», от alter «другой»: «стать другим, не собой». Родственное: alterado «взволнованный»."
    register: "Нейтральное."
    synonyms:
      - word: ponerse nervioso
        pair: ["Se alteró.", "Se puso nervioso."]
        diff:
          - "ponerse nervioso — разговорнее"
          - "alterarse — может значить и «вспылить»"
    analogs:
      - "to get upset — расстроиться, разволноваться"
      - "to lose one's temper — выйти из себя"
    dialogue:
      - "Lucía: ¡Tranquilo, no te alteres! | Спокойно, не нервничай!"
      - "Marcos: Es que no aguanto más. | Просто я больше не выдерживаю."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "no te alteres — не нервничай"
      - "alterarse por algo — разволноваться из-за чего-то"
      - "estar alterado — быть взвинченным"
    collocation_example: "Está muy alterado. — Он очень взвинчен."
    trap: "Без se — «изменять»: alterar los planes. С se — «разволноваться»."

  - word: arriesgarse
    ru: рисковать
    ipa: /arjesˈɣaɾse/
    say: арьесга́рсэ
    pron: "rr — раскатистое [r], ie — одним слогом. В прошедшем «я»: me arriesgué, с gu."
    meaning: "Пойти на риск. С инфинитивом — a: arriesgarse a perder."
    examples:
      - "Me arriesgué y gané. — Я рискнул и выиграл."
      - "No quiero arriesgarme. — Не хочу рисковать."
    origin: "От riesgo «риск», возможно из итальянского risico. Родственные: arriesgado «рискованный»."
    register: "Нейтральное."
    synonyms:
      - word: atreverse
        pair: ["Me arriesgué a decirlo.", "Me atreví a decirlo."]
        diff:
          - "atreverse — главное смелость"
          - "arriesgarse — главное возможная потеря"
    analogs:
      - "to take a risk — рискнуть"
    dialogue:
      - "Ana: ¿Y si nos equivocamos? | А если мы ошибаемся?"
      - "Pablo: Hay que arriesgarse. De todas formas, no tenemos nada que perder. | Надо рискнуть. В любом случае нам нечего терять."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "arriesgarse a algo — рискнуть чем-то"
      - "arriesgar la vida — рисковать жизнью"
      - "una decisión arriesgada — рискованное решение"
    collocation_example: "Arriesgó la vida por ella. — Он рисковал жизнью ради неё."
    trap: "С se — «пойти на риск» вообще; без se — рисковать чем-то: arriesgar la vida. В прошедшем: arriesgué, с gu."
