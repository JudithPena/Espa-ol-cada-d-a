# Второй список автора, 25 октября 2026, часть 1 — глаголы. Правила — docs/mis_palabras_guide.md.
lang: es
words:
  - word: disfrazarse
    ru: переодеваться в костюм
    ipa: /disfɾaˈθaɾse/
    say: дисфраса́рсе
    pron: "z в Испании — [θ], как th в английском _think_; в Латинской Америке — [s]."
    meaning: "Надеть маскарадный костюм, переодеться кем-то. Кем — говорят с de: disfrazarse de pirata."
    examples:
      - "En carnaval me disfrazo de pirata. — На карнавал я наряжаюсь пиратом."
      - "El ladrón se disfrazó de policía. — Вор переоделся полицейским."
    origin: "От disfraz «маскарадный костюм»: dis- «раз-, не» + старинное fraz «облик». Буквально «изменить облик»."
    register: "Нейтральное."
    synonyms:
      - word: vestirse de
        pair: ["Se disfrazó de bruja.", "Se vistió de bruja."]
        diff:
          - "vestirse de — просто «одеться как», без идеи маскировки"
          - "disfrazarse — именно костюм или маскировка"
    analogs:
      - "to dress up as — нарядиться кем-то"
      - "to disguise oneself — замаскироваться"
    dialogue:
      - "Ana: ¿De qué te vas a disfrazar? | Кем ты нарядишься?"
      - "Pablo: De vampiro, como siempre. | Вампиром, как всегда."
    cefr: "B1 — нужно для праздников, но слово не базовое."
    frequency: "Частое в феврале (карнавал) и на Хэллоуин, в остальное время — средняя."
    collocations:
      - "disfrazarse de algo — нарядиться кем-то"
      - "una fiesta de disfraces — костюмированная вечеринка"
      - "disfrazar la verdad — приукрашивать правду"
    collocation_example: "Mañana hay una fiesta de disfraces. — Завтра костюмированная вечеринка."
    trap: "Кем — с de, а не como: disfrazarse **de** pirata. Не путайте с disfrutar — «наслаждаться»."

  - word: despedir
    ru: увольнять
    ipa: /despeˈðiɾ/
    say: дэспэди́р
    pron: "d между гласными мягкое [ð], почти как th в английском _this_."
    meaning: "Уволить с работы. Ещё значит «провожать» (despedir a alguien en el aeropuerto). Спрягается с e → i: despido, despides."
    examples:
      - "Lo despidieron por llegar tarde. — Его уволили за опоздания."
      - "La empresa va a despedir a cien personas. — Компания собирается уволить сто человек."
      - "Fuimos a despedir a Ana al aeropuerto. — Мы поехали провожать Ану в аэропорт."
    origin: "Лат. expetere «требовать» через старое espedir «отпускать». Родственные: despido «увольнение», despedida «прощание, проводы»."
    register: "Нейтральное, язык работы и новостей."
    synonyms:
      - word: echar
        pair: ["Me han despedido.", "Me han echado."]
        diff:
          - "echar — разговорное и грубее: «выгнали»"
          - "despedir — официальное «уволить»"
    analogs:
      - "to fire / to dismiss — уволить"
      - "to see off — проводить"
    dialogue:
      - "Lucía: ¿Por qué estás tan triste? | Почему ты такой грустный?"
      - "Marcos: Me han despedido. Sin embargo, no me sorprende. | Меня уволили. Впрочем, я не удивлён."
    cefr: "B1 — тема работы."
    frequency: "Частое в новостях и разговорах о работе."
    collocations:
      - "despedir a un trabajador — уволить работника"
      - "ser despedido — быть уволенным"
      - "despedir a alguien en la estación — проводить кого-то на вокзале"
    collocation_example: "Fue despedido sin explicación. — Его уволили без объяснений."
    trap: "Без se — «увольнять, провожать», с se — «прощаться» (despedirse). Перед человеком нужен a: despedir **a** alguien."

  - word: despedirse
    ru: прощаться
    homonym: "Уже было: despedir — увольнять. С se значение другое: прощаться."
    ipa: /despeˈðiɾse/
    say: дэспэди́рсэ
    pron: "d между гласными мягкое [ð]. Спрягается с e → i: me despido, te despides."
    meaning: "Попрощаться с кем-то. С кем — говорят с de: despedirse de alguien."
    examples:
      - "Me despedí de mis amigos. — Я попрощался с друзьями."
      - "Se fue sin despedirse. — Он ушёл не попрощавшись."
    origin: "Тот же глагол despedir с se. Отсюда despedida «прощание» и fiesta de despedida «прощальная вечеринка»."
    register: "Нейтральное."
    synonyms:
      - word: decir adiós
        pair: ["Me despedí de ella.", "Le dije adiós."]
        diff:
          - "decir adiós — проще и разговорнее"
    analogs:
      - "to say goodbye — попрощаться"
    dialogue:
      - "Ana: ¿Ya te vas? | Ты уже уходишь?"
      - "Pablo: Sí, tengo prisa. Me despido de todos y me voy. | Да, спешу. Попрощаюсь со всеми и пойду."
    cefr: "A2 — нужно с первых разговоров."
    frequency: "Очень частое."
    collocations:
      - "despedirse de alguien — попрощаться с кем-то"
      - "sin despedirse — не попрощавшись"
      - "una fiesta de despedida — прощальная вечеринка"
    collocation_example: "Le hicimos una fiesta de despedida. — Мы устроили ему прощальную вечеринку."
    trap: "С кем — de, а не con: despedirse **de** alguien. Без se смысл меняется: Lo despidieron — «его уволили»."

  - word: alborotarse
    ru: взволноваться, переполошиться
    ipa: /alβoɾoˈtaɾse/
    say: альборота́рсе
    pron: "b после l мягкое [β]."
    meaning: "Прийти в волнение, засуетиться, расшуметься — о человеке или о толпе."
    examples:
      - "Los niños se alborotaron al ver el pastel. — Дети разволновались, увидев торт."
      - "La gente se alborotó cuando llegó la policía. — Люди переполошились, когда приехала полиция."
    origin: "От alboroto «шум, суматоха», возможно из старого alborozo «ликование». Родственное: alborotado «взволнованный»."
    register: "Нейтральное, немного разговорное."
    synonyms:
      - word: alterarse
        pair: ["Todos se alborotaron.", "Todos se alteraron."]
        diff:
          - "alterarse — занервничать, потерять спокойствие внутри"
          - "alborotarse — шумно, с суетой, часто о группе"
    analogs:
      - "to get excited / worked up — разволноваться"
      - "to be in an uproar — о толпе: шуметь, бурлить"
    dialogue:
      - "Lucía: ¿Por qué se alborotaron los vecinos? | Почему соседи переполошились?"
      - "Marcos: Por la tormenta. ¡No pasa nada! | Из-за грозы. Ничего страшного!"
    cefr: "B2 — редкое в учебниках, выразительное слово."
    frequency: "Средняя: рассказы, разговоры."
    collocations:
      - "alborotarse por algo — переполошиться из-за чего-то"
      - "armar alboroto — поднять шум"
      - "alborotar el pelo — растрепать волосы"
    collocation_example: "El viento me alborota el pelo. — Ветер растрёпывает мне волосы."
    trap: "Это возвратный глагол: Me alboroté. Без se — «взбудоражить кого-то»: alborotar a los niños."

  - word: averiguar
    ru: выяснять, разузнавать
    ipa: /aβeɾiˈɣwaɾ/
    say: авэригуа́р
    pron: "b-звук от v мягкий [β]. gu перед a читается «гуа». В прошедшем пишется averigüé — с точками над ü, чтобы u читалась."
    meaning: "Выяснить, узнать правду, разузнать, что произошло."
    examples:
      - "Tengo que averiguar quién lo hizo. — Мне нужно выяснить, кто это сделал."
      - "Averigüé la verdad. — Я узнал правду."
    origin: "Лат. verificare «подтверждать», от verus «истинный»: «доискаться истины». Родственное: verdad."
    register: "Нейтральное, частое в детективах."
    synonyms:
      - word: descubrir
        pair: ["Averiguó la verdad.", "Descubrió la verdad."]
        diff:
          - "descubrir — «обнаружить», часто случайно"
          - "averiguar — выяснять специально, расспрашивая и ища"
    analogs:
      - "to find out — выяснить"
      - "to look into — разузнать"
    dialogue:
      - "Inspectora: Hay que averiguar quién envió la carta. | Нужно выяснить, кто отправил письмо."
      - "Marcos: Fíjese en la firma. | Обратите внимание на подпись."
    cefr: "B1 — частое в расследованиях и быту."
    frequency: "Частое."
    collocations:
      - "averiguar la verdad — выяснить правду"
      - "averiguar dónde… — разузнать, где…"
      - "tratar de averiguar — пытаться выяснить"
    collocation_example: "Trato de averiguar dónde vive. — Пытаюсь разузнать, где он живёт."
    trap: "Форма «я» в прошедшем — averigüé, с ü. Не путайте с adivinar — «угадать»."

  - word: denunciar
    ru: доносить, заявлять в полицию
    ipa: /denunˈθjaɾ/
    say: дэнунсья́р
    pron: "c перед i в Испании — [θ], как th в английском _think_."
    meaning: "Заявить в полицию о преступлении или на человека; публично обличить."
    examples:
      - "Denuncié el robo en la comisaría. — Я заявил о краже в полицейском участке."
      - "La vecina lo denunció. — Соседка донесла на него."
    origin: "Лат. denuntiare «объявлять»: de- + nuntiare «сообщать». Родственные: denuncia «заявление в полицию», anunciar «объявлять»."
    register: "Нейтральное, юридическое."
    synonyms:
      - word: delatar
        pair: ["Lo denunció a la policía.", "Lo delató a la policía."]
        diff:
          - "delatar — «выдать, донести», с оттенком предательства"
          - "denunciar — официально заявить"
    analogs:
      - "to report — заявить"
      - "to denounce — публично осудить"
    dialogue:
      - "Lucía: Me han robado el móvil. | У меня украли телефон."
      - "Marcos: Tienes que denunciarlo en la comisaría. | Нужно заявить в участке."
    cefr: "B1 — бытовая ситуация с полицией."
    frequency: "Частое в новостях."
    collocations:
      - "poner una denuncia — подать заявление"
      - "denunciar un robo — заявить о краже"
      - "denunciar a alguien — донести на кого-то"
    collocation_example: "Voy a poner una denuncia. — Я подам заявление в полицию."
    trap: "Испанское denunciar чаще «заявить в полицию», а не «донос» в плохом смысле, как в русском. Перед человеком — a: denunciar **a** alguien."

  - word: despreciar
    ru: презирать, пренебрегать
    ipa: /despɾeˈθjaɾ/
    say: дэспрэсья́р
    pron: "c перед i в Испании — [θ]."
    meaning: "Презирать кого-то; пренебречь чем-то, отвергнуть (помощь, совет)."
    examples:
      - "Desprecia a la gente pobre. — Он презирает бедных людей."
      - "Despreció mi ayuda. — Он пренебрёг моей помощью."
    origin: "des- «не» + precio «цена»: «не придавать цены». Родственные: desprecio «презрение», precio, apreciar «ценить»."
    register: "Нейтральное, эмоционально сильное."
    synonyms:
      - word: menospreciar
        pair: ["Desprecia mi trabajo.", "Menosprecia mi trabajo."]
        diff:
          - "menospreciar — недооценивать, слабее"
          - "despreciar — презирать, сильнее"
    analogs:
      - "to despise — презирать"
      - "to scorn — пренебрегать, отвергать"
    dialogue:
      - "Ana: ¿Por qué no hablas con él? | Почему ты с ним не разговариваешь?"
      - "Pablo: Porque me desprecia. Fíjate cómo me mira. | Потому что он меня презирает. Посмотри, как он на меня смотрит."
    cefr: "B2 — абстрактный глагол чувств."
    frequency: "Средняя: книги, сериалы."
    collocations:
      - "sentir desprecio — испытывать презрение"
      - "despreciar una oferta — отвергнуть предложение"
      - "con desprecio — с презрением"
    collocation_example: "Me miró con desprecio. — Он посмотрел на меня с презрением."
    trap: "Противоположность — apreciar «ценить». Перед человеком нужен a: desprecia **a** su hermano."

  - word: sustituir
    ru: заменять
    ipa: /sustiˈtwiɾ/
    say: суституи́р
    pron: "ui — одним слогом «уи». В настоящем появляется y: sustituyo, sustituyes."
    meaning: "Заменить одно другим или кого-то на работе. Кого на кого — sustituir A por B."
    examples:
      - "Sustituí el azúcar por miel. — Я заменил сахар мёдом."
      - "Hoy sustituyo a mi compañero. — Сегодня я замещаю коллегу."
    origin: "Лат. substituere: sub «под» + statuere «ставить» — «поставить вместо». Родственные: sustituto «замена, заместитель»."
    register: "Нейтральное, чуть формальнее, чем cambiar."
    synonyms:
      - word: reemplazar
        pair: ["Sustituyeron al entrenador.", "Reemplazaron al entrenador."]
        diff:
          - "reemplazar — полный синоним, чуть чаще в Латинской Америке"
    analogs:
      - "to replace — заменить"
      - "to substitute — заменить, подменить"
    dialogue:
      - "Lucía: ¿Quién te sustituye mañana? | Кто тебя заменит завтра?"
      - "Marcos: Cualquiera, no es difícil. | Кто угодно, это несложно."
    cefr: "B1 — частый рабочий глагол."
    frequency: "Частое."
    collocations:
      - "sustituir A por B — заменить A на B"
      - "sustituir a alguien — замещать кого-то"
      - "un profesor sustituto — учитель на замену"
    collocation_example: "Sustituye la mantequilla por aceite. — Замени масло растительным."
    trap: "На что меняют — por, а не con: sustituir A **por** B. Пишется sustituir, не substituir (старое написание)."

  - word: valorar
    ru: ценить
    ipa: /baloˈɾaɾ/
    say: балора́р
    pron: "v читается как b: «балорар»."
    meaning: "Ценить, высоко ставить; ещё — оценивать (стоимость, ситуацию)."
    examples:
      - "Valoro mucho tu ayuda. — Я очень ценю твою помощь."
      - "Hay que valorar los riesgos. — Нужно оценить риски."
    origin: "От valor «ценность, смелость» (лат. valere «стоить, быть сильным»). Родственные: valioso «ценный», valiente «смелый»."
    register: "Нейтральное, частое в работе и отношениях."
    synonyms:
      - word: apreciar
        pair: ["Valoro tu sinceridad.", "Aprecio tu sinceridad."]
        diff:
          - "apreciar — теплее, «ценить, дорожить»"
          - "valorar — ещё и «оценивать» трезво"
    analogs:
      - "to value — ценить"
      - "to assess — оценивать"
    dialogue:
      - "Ana: Gracias por escucharme. | Спасибо, что выслушал."
      - "Pablo: De nada. Valoro mucho nuestra amistad. | Не за что. Я очень ценю нашу дружбу."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "valorar mucho — очень ценить"
      - "valorar el trabajo de alguien — ценить чью-то работу"
      - "valorar positivamente — оценить положительно"
    collocation_example: "Nadie valora mi trabajo. — Никто не ценит мою работу."
    trap: "Пишется с v. Не путайте с valer — «стоить»: ¿Cuánto vale? — «Сколько стоит?»."

  - word: cometer
    ru: совершать
    ipa: /komeˈteɾ/
    say: комэтэ́р
    meaning: "Совершать что-то плохое: ошибку, преступление, грех. Уже было в выражении cometer un crimen; здесь — сам глагол с разными словами."
    examples:
      - "Todos cometemos errores. — Все мы совершаем ошибки."
      - "Cometió un delito grave. — Он совершил тяжкое правонарушение."
    origin: "Лат. committere «соединять, поручать, совершать», отсюда и «комитет»."
    register: "Нейтральное."
    synonyms:
      - word: incurrir en
        pair: ["Cometió un error.", "Incurrió en un error."]
        diff:
          - "incurrir en — книжное и официальное, с предлогом en"
    analogs:
      - "to commit — совершить (преступление)"
      - "to make — совершить (ошибку)"
    dialogue:
      - "Lucía: He cometido un error terrible. | Я совершила ужасную ошибку."
      - "Marcos: Tranquila, no pasa nada. | Спокойно, ничего страшного."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "cometer un error — совершить ошибку"
      - "cometer un delito — совершить правонарушение"
      - "cometer una injusticia — поступить несправедливо"
    collocation_example: "Cometí el error de confiar en él. — Я совершил ошибку, доверившись ему."
    trap: "С ошибками и преступлениями — cometer, а не hacer: cometer un error. С хорошими делами cometer не говорят."

  - word: atravesar
    ru: переживать, проходить через
    ipa: /atɾaβeˈsaɾ/
    say: атравэса́р
    pron: "v между гласными мягкое [β]. Спрягается с e → ie: atravieso, atraviesas."
    meaning: "Пересечь, пройти насквозь (улицу, лес); в переносном смысле — переживать трудный период."
    examples:
      - "Atravesamos el bosque. — Мы прошли через лес."
      - "Está atravesando un momento difícil. — Он переживает трудный момент."
    origin: "a- + través «поперёк» (лат. transversus). Родственные: a través de «через», travesía «переход, плавание»."
    register: "Нейтральное."
    synonyms:
      - word: pasar por
        pair: ["Atraviesa una crisis.", "Pasa por una crisis."]
        diff:
          - "pasar por — проще и разговорнее"
    analogs:
      - "to go through — переживать"
      - "to cross — пересечь"
    dialogue:
      - "Ana: Te veo muy pensativo. | Ты какой-то задумчивый."
      - "Pablo: Estoy atravesando una mala racha. | У меня полоса неудач."
    cefr: "B2 — переносное значение."
    frequency: "Частое в текстах и новостях."
    collocations:
      - "atravesar la calle — перейти улицу"
      - "atravesar una crisis — переживать кризис"
      - "atravesar un mal momento — переживать трудный момент"
    collocation_example: "El país atraviesa una crisis económica. — Страна переживает экономический кризис."
    trap: "Форма «я» — atravieso, с ie. Без предлога: atravesar el río, а не atravesar por el río."

  - word: desviar
    ru: отклонять, перенаправлять
    ipa: /desˈβjaɾ/
    say: дэсвья́р
    pron: "v после s мягкое [β]. В настоящем ударение падает на i: desvío, desvías."
    meaning: "Изменить направление: дороги, взгляда, разговора, денег."
    examples:
      - "Desviaron el tráfico por las obras. — Движение перенаправили из-за ремонта."
      - "Siempre desvía la conversación. — Он всегда уводит разговор в сторону."
    origin: "des- + vía «путь»: «увести с пути». Родственные: desvío «объезд», vía «дорога, путь»."
    register: "Нейтральное."
    synonyms:
      - word: cambiar de dirección
        pair: ["Desviaron el avión.", "Cambiaron la dirección del avión."]
        diff:
          - "desviar — короче и точнее, «увести в сторону»"
    analogs:
      - "to divert — перенаправить"
      - "to deflect — отклонить"
    dialogue:
      - "Inspectora: ¿Por qué desvía la mirada? | Почему вы отводите взгляд?"
