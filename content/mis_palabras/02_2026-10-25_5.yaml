# Второй список автора, часть 5 — наречия и связки.
lang: es
words:
  - word: sinceramente
    ru: честно говоря
    ipa: /sinθeɾaˈmente/
    say: синсэрамэ́нтэ
    pron: "c перед e — [θ]. У наречий на -mente два ударения: как в sincera и как в mente."
    meaning: "Честно говоря, откровенно; искренне."
    examples:
      - "Sinceramente, no me gusta. — Честно говоря, мне не нравится."
      - "Te lo agradezco sinceramente. — Я искренне тебе благодарен."
    origin: "sincera «искренняя» + -mente. Лат. sincerus «чистый, без примесей»."
    register: "Нейтральное, частое в разговоре."
    synonyms:
      - word: la verdad
        pair: ["Sinceramente, no lo sé.", "La verdad, no lo sé."]
        diff:
          - "la verdad — разговорнее и очень частое в Испании"
    analogs:
      - "honestly / to be honest — честно говоря"
      - "sincerely — искренне"
    dialogue:
      - "Lucía: ¿Te gusta mi disfraz? | Тебе нравится мой костюм?"
      - "Marcos: Sinceramente, no mucho. | Честно говоря, не очень."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "sinceramente, … — честно говоря…"
      - "hablar sinceramente — говорить откровенно"
      - "te lo digo sinceramente — говорю тебе честно"
    collocation_example: "Te lo digo sinceramente: no vayas. — Говорю тебе честно: не ходи."
    trap: "В конце письма «Искренне ваш» — Atentamente, а не Sinceramente (калька с английского)."

  - word: únicamente
    ru: только, исключительно
    ipa: /unikaˈmente/
    say: уникамэ́нтэ
    pron: "Ударения два: на ú (тильда сохраняется) и на me."
    meaning: "Только, исключительно — книжнее, чем solo."
    examples:
      - "Únicamente quiero la verdad. — Я хочу только правды."
      - "Abierto únicamente los domingos. — Открыто только по воскресеньям."
    origin: "única «единственная» + -mente. Лат. unicus, от unus «один»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: solo
        pair: ["Únicamente tengo diez euros.", "Solo tengo diez euros."]
        diff:
          - "solo — разговорное и самое частое"
          - "únicamente — подчёркивает «и больше ничего»"
    analogs:
      - "only / solely — только, исключительно"
    dialogue:
      - "Inspectora: ¿Qué quiere usted? | Чего вы хотите?"
      - "Testigo: Únicamente protección. | Только защиты."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "única y exclusivamente — исключительно"
      - "únicamente para… — только для…"
      - "único — единственный"
    collocation_example: "Es única y exclusivamente culpa tuya. — Это исключительно твоя вина."
    trap: "Тильда остаётся: únicamente, как в único."

  - word: desgraciadamente
    ru: к сожалению
    ipa: /desɣɾaθjaðaˈmente/
    say: дэсграсьядамэ́нтэ
    pron: "g мягкое [ɣ], c перед i — [θ], d мягкое [ð]."
    meaning: "К сожалению, к несчастью."
    examples:
      - "Desgraciadamente, no pudo venir. — К сожалению, он не смог прийти."
      - "Desgraciadamente, falleció. — К несчастью, он скончался."
    origin: "desgraciada «несчастная» + -mente; от desgracia «несчастье»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: por desgracia
        pair: ["Desgraciadamente, llueve.", "Por desgracia, llueve."]
        diff:
          - "por desgracia — короче и чаще в речи"
          - "lamentablemente — официальнее"
    analogs:
      - "unfortunately — к сожалению"
    dialogue:
      - "Ana: ¿Encontraron al culpable? | Нашли виновного?"
      - "Pablo: Desgraciadamente, no hay pruebas. | К сожалению, нет доказательств."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "desgraciadamente, … — к сожалению…"
      - "por desgracia — к несчастью"
      - "lamentablemente — к сожалению (официально)"
    collocation_example: "Lamentablemente, el vuelo está cancelado. — К сожалению, рейс отменён."
    trap: "desgraciado о человеке — «несчастный» или грубое «негодяй». Наречие desgraciadamente — нейтральное."

  - word: anteriormente
    ru: ранее
    ipa: /anteɾjoɾˈmente/
    say: антэрьормэ́нтэ
    meaning: "Ранее, прежде, до этого."
    examples:
      - "Como dije anteriormente… — Как я говорил ранее…"
      - "Anteriormente vivía en Madrid. — Раньше он жил в Мадриде."
    origin: "anterior «предыдущий» + -mente. Лат. ante «перед»."
    register: "Формальное, книжное."
    synonyms:
      - word: antes
        pair: ["Anteriormente trabajaba aquí.", "Antes trabajaba aquí."]
        diff:
          - "antes — разговорное"
          - "anteriormente — официальное, в докладах и новостях"
    analogs:
      - "previously / formerly — ранее"
    dialogue:
      - "Inspectora: ¿Había estado aquí anteriormente? | Вы бывали здесь раньше?"
      - "Testigo: No, nunca. | Нет, никогда."
    cefr: "B2."
    frequency: "Средняя в официальных текстах."
    collocations:
      - "como se ha dicho anteriormente — как было сказано ранее"
      - "anteriormente conocido como — ранее известный как"
      - "el día anterior — накануне"
    collocation_example: "Llegó el día anterior. — Он приехал накануне."
    trap: "В разговоре это звучит официально: проще сказать antes."

  - word: aparentemente
    ru: по-видимому
    ipa: /apaɾenteˈmente/
    say: апарэнтэмэ́нтэ
    meaning: "По-видимому, судя по всему; внешне (а на деле может быть иначе)."
    examples:
      - "Aparentemente, todo está bien. — По-видимому, всё в порядке."
      - "Aparentemente es tranquilo, pero no lo es. — С виду он спокоен, но это не так."
    origin: "aparente «видимый, кажущийся» + -mente. От aparecer «появляться»."
    register: "Нейтральное."
    synonyms:
      - word: al parecer
        pair: ["Aparentemente, se fue.", "Al parecer, se fue."]
        diff:
          - "al parecer — разговорнее, «судя по всему»"
    analogs:
      - "apparently — по-видимому"
      - "seemingly — внешне"
    dialogue:
      - "Lucía: ¿Cómo murió? | Как он умер?"
      - "Marcos: Aparentemente fue un accidente. Pero yo desconfío. | Похоже, это был несчастный случай. Но я не верю."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "aparentemente normal — внешне нормальный"
      - "al parecer — судя по всему"
      - "sin motivo aparente — без видимой причины"
    collocation_example: "Se fue sin motivo aparente. — Он ушёл без видимой причины."
    trap: "Часто значит «внешне, а на самом деле нет». Не путайте с evidentemente — «очевидно»."

  - word: suavemente
    ru: мягко, осторожно
    ipa: /swaβeˈmente/
    say: суавэмэ́нтэ
    pron: "ua — одним слогом, v мягкое [β]."
    meaning: "Мягко, нежно, осторожно; тихо."
    examples:
      - "Habló suavemente. — Он говорил мягко."
      - "Cierra la puerta suavemente. — Закрой дверь аккуратно."
    origin: "suave «мягкий» (лат. suavis «приятный») + -mente."
    register: "Нейтральное."
    synonyms:
      - word: con cuidado
        pair: ["Tócalo suavemente.", "Tócalo con cuidado."]
        diff:
          - "con cuidado — осторожно, чтобы не сломать"
          - "suavemente — мягко, нежно"
    analogs:
      - "gently / softly — мягко"
    dialogue:
      - "Ana: El bebé duerme. | Малыш спит."
      - "Pablo: Vale, hablo suavemente. | Хорошо, говорю тихо."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "hablar suavemente — говорить мягко"
      - "tocar suavemente — коснуться нежно"
      - "suave al tacto — мягкий на ощупь"
    collocation_example: "Esta tela es muy suave al tacto. — Эта ткань очень мягкая на ощупь."
    trap: "suave — ещё и «гладкий» и «лёгкий» (вино, климат). «Мягкий» о хлебе — blando или tierno."

  - word: fijamente
    ru: пристально
    ipa: /fixaˈmente/
    say: фихамэ́нтэ
    pron: "j — хриплое [x]."
    meaning: "Пристально, не отводя глаз."
    examples:
      - "Me miró fijamente. — Он пристально посмотрел на меня."
      - "No mires fijamente al sol. — Не смотри пристально на солнце."
    origin: "fija «неподвижная» + -mente. Родственные: fijo, fijarse en."
    register: "Нейтральное."
    synonyms:
      - word: sin parpadear
        pair: ["Me miraba fijamente.", "Me miraba sin parpadear."]
        diff:
          - "sin parpadear — «не моргая», выразительнее"
    analogs:
      - "fixedly / intently — пристально"
      - "to stare — пристально смотреть"
    dialogue:
      - "Lucía: ¿Por qué me miras tan fijamente? | Почему ты так пристально на меня смотришь?"
      - "Marcos: Porque estás irreconocible. | Потому что ты неузнаваема."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "mirar fijamente — пристально смотреть"
      - "observar fijamente — внимательно наблюдать"
      - "fijarse en algo — обратить внимание на что-то"
    collocation_example: "El gato me observaba fijamente. — Кот пристально за мной наблюдал."
    trap: "Почти всегда с mirar: mirar fijamente. Не путайте с finalmente «наконец»."

  - word: suficientemente
    ru: достаточно
    ipa: /sufiθjenteˈmente/
    say: суфисьентэмэ́нтэ
    pron: "c перед i — [θ]."
    meaning: "Достаточно — перед прилагательным или наречием: suficientemente grande."
    examples:
      - "No es suficientemente grande. — Он недостаточно большой."
      - "¿Lo has pensado suficientemente? — Ты достаточно это обдумал?"
    origin: "suficiente «достаточный» (лат. sufficere «хватать») + -mente."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: lo bastante
        pair: ["Es suficientemente fuerte.", "Es lo bastante fuerte."]
        diff:
          - "lo bastante — разговорнее"
    analogs:
      - "enough / sufficiently — достаточно"
    dialogue:
      - "Ana: ¿Tenemos pruebas suficientes? | У нас достаточно доказательств?"
      - "Pablo: No. No son suficientemente claras. | Нет. Они недостаточно ясные."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "suficientemente bueno — достаточно хороший"
      - "lo suficiente — достаточно (после глагола)"
      - "no ser suficiente — быть недостаточным"
    collocation_example: "Has trabajado lo suficiente. — Ты достаточно поработал."
    trap: "Перед прилагательным: suficientemente grande. После глагола проще lo suficiente: dormí lo suficiente."

  - word: incluso
    ru: даже
    ipa: /iŋˈkluso/
    say: инклу́со
    pron: "n перед c — носовое [ŋ]."
    meaning: "Даже; ещё — включительно."
    examples:
      - "Incluso mi abuela usa el móvil. — Даже моя бабушка пользуется телефоном."
      - "Trabaja incluso los domingos. — Он работает даже по воскресеньям."
    origin: "Лат. inclusus «включённый», от includere «включать». Родственное: incluir «включать»."
    register: "Нейтральное."
    synonyms:
      - word: hasta
        pair: ["Incluso él lo sabe.", "Hasta él lo sabe."]
        diff:
          - "hasta — разговорнее, «даже» с удивлением"
          - "aun — тоже «даже», книжное"
    analogs:
      - "even — даже"
      - "including — включая"
    dialogue:
      - "Lucía: ¿Todos sabían lo de la amante? | Все знали про любовницу?"
      - "Marcos: Sí, incluso la viuda. | Да, даже вдова."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "incluso si… — даже если…"
      - "incluso ahora — даже сейчас"
      - "e incluso — и даже"
    collocation_example: "Te ayudo incluso si no quieres. — Я тебе помогу, даже если ты не хочешь."
    trap: "«Даже не» — ni siquiera, а не incluso no: Ni siquiera me llamó — «Он даже не позвонил»."

  - word: mediante
    ru: посредством
    ipa: /meˈðjante/
    say: мэдья́нтэ
    pron: "d между гласными мягкое [ð]."
    meaning: "Посредством, с помощью — книжный предлог."
    examples:
      - "Pagó mediante transferencia. — Он заплатил переводом."
      - "Lo resolvieron mediante el diálogo. — Это решили путём диалога."
    origin: "Причастие от старого mediar «быть посередине» (лат. medius «средний»)."
    register: "Формальное, книжное."
    synonyms:
      - word: por medio de
        pair: ["Mediante un acuerdo.", "Por medio de un acuerdo."]
        diff:
          - "por medio de — чуть проще"
          - "con — самое разговорное: con una transferencia"
    analogs:
      - "by means of / through — посредством"
    dialogue:
      - "Inspectora: ¿Cómo enviaba el dinero? | Как он отправлял деньги?"
      - "Marcos: Mediante una cuenta falsa. Desviaba fondos. | Через фиктивный счёт. Выводил средства."
    cefr: "B2."
    frequency: "Средняя в официальных текстах."
    collocations:
      - "mediante transferencia — переводом"
      - "mediante el diálogo — путём диалога"
      - "Dios mediante — с Божьей помощью"
    collocation_example: "Nos vemos el lunes, Dios mediante. — Увидимся в понедельник, если Бог даст."
    trap: "В разговоре звучит официально: проще con или por. Dios mediante — устойчивое «если Бог даст»."
