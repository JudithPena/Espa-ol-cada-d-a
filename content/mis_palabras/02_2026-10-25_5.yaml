# Второй список автора, часть 5 — наречия и связки.
lang: es
words:
  - word: sinceramente
    ru: честно говоря
    ipa: /sinθeɾaˈmente/
    say: синсэрамэ́нтэ
    pron: "c перед e — [θ]. У наречий на -mente два ударения: как в sincera и как в mente."
    meaning: "Честно говоря, откровенно; искренне."
    examples:
      - "Gracias, te lo digo sinceramente, de corazón. — Спасибо, говорю тебе искренне, от сердца."
      - "Te lo agradezco sinceramente: sin tu apoyo no habría llegado hasta aquí. — Я искренне тебе благодарен: без твоей поддержки я бы сюда не дошёл."
      - "Sinceramente, no me gusta la idea, pero entiendo que es la única opción que tenemos. — Честно говоря, мне не нравится эта идея, но я понимаю, что это единственный вариант."
    origin: "sincera «искренняя» + -mente. Лат. sincerus «чистый, без примесей»."
    register: "Нейтральное, частое в разговоре."
    synonyms:
      - word: la verdad
        pair: ["Sinceramente, no lo sé.", "La verdad, no lo sé."]
        diff:
          - "la verdad — разговорнее и очень частое в Испании"
    analogs:
      - "honestly / to be honest — честно говоря"
      - "sincerely — искренне"
    dialogue:
      - "Lucía: ¿Te gusta mi disfraz de bruja? | Тебе нравится мой костюм ведьмы?"
      - "Marcos: Sinceramente, no mucho. Pareces un poco amenazante. | Честно говоря, не очень. Ты выглядишь немного угрожающе."
      - "Lucía: ¡Eso es lo que quería! Es una fiesta macabra. | Именно этого я и хотела! Это жуткая вечеринка."
      - "Marcos: Entonces sinceramente te felicito. Das miedo de verdad. | Тогда искренне поздравляю. Ты правда страшная."
      - "Lucía: Pues tú tampoco estás mal. ¿De qué te disfrazas? | Ты тоже неплох. А ты кем наряжаешься?"
      - "Marcos: De viudo. Con luto y todo. | Вдовцом. В трауре и со всем остальным."
      - "Lucía: ¡Qué macabro! Me encanta. Seremos los más originales. | Как жутко! Обожаю. Мы будем самыми оригинальными."
      - "Marcos: Y el que se asuste, que aguante. | А кто испугается, пусть терпит."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "sinceramente, … — честно говоря…"
      - "hablar sinceramente — говорить откровенно"
      - "te lo digo sinceramente — говорю тебе честно"
    collocation_example: "Te lo digo sinceramente: no vayas. — Говорю тебе честно: не ходи."
    trap: "В конце письма «Искренне ваш» — Atentamente, а не Sinceramente (калька с английского)."

  - word: únicamente
    ru: только, исключительно
    ipa: /unikaˈmente/
    say: уникамэ́нтэ
    pron: "Ударения два: на ú (тильда сохраняется) и на me."
    meaning: "Только, исключительно — книжнее, чем solo."
    examples:
      - "La tienda abre únicamente los domingos. — Магазин открыт только по воскресеньям."
      - "Únicamente quiero la verdad, aunque sea dolorosa y cambie todo lo que pensaba. — Я хочу только правды, даже если она болезненна и меняет всё, что я думал."
      - "Este servicio es únicamente para los clientes que ya tienen una cuenta en el banco. — Эта услуга только для клиентов, у которых уже есть счёт в банке."
    origin: "única «единственная» + -mente. Лат. unicus, от unus «один»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: solo
        pair: ["Únicamente tengo diez euros.", "Solo tengo diez euros."]
        diff:
          - "solo — разговорное и самое частое"
          - "únicamente — подчёркивает «и больше ничего»"
    analogs:
      - "only / solely — только, исключительно"
    dialogue:
      - "Inspectora: ¿Qué quiere a cambio de su declaración? | Что вы хотите в обмен на показания?"
      - "Testigo: Únicamente protección. No pido dinero ni fortuna. | Только защиту. Я не прошу ни денег, ни богатства."
      - "Inspectora: Entonces hablemos claro. ¿Qué vio esa noche? | Тогда будем говорить прямо. Что вы видели той ночью?"
      - "Testigo: Vi a un hombre salir del cementerio con una caja. | Я видел, как мужчина выходил с кладбища с коробкой."
      - "Inspectora: ¿Estaba solo o rodeado de gente? | Он был один или в окружении людей?"
      - "Testigo: Estaba solo. Únicamente llevaba una linterna. | Один. С собой у него был только фонарь."
      - "Inspectora: ¿Se acercó a alguna tumba? | Он подходил к какой-нибудь могиле?"
      - "Testigo: A la de un viudo, creo. Después huyó asustado. | К могиле вдовца, кажется. Потом убежал в испуге."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "única y exclusivamente — исключительно"
      - "únicamente para… — только для…"
      - "único — единственный"
    collocation_example: "Es única y exclusivamente culpa tuya. — Это исключительно твоя вина."
    trap: "Тильда остаётся: únicamente, как в único."

  - word: desgraciadamente
    ru: к сожалению
    ipa: /desɣɾaθjaðaˈmente/
    say: дэсграсьядамэ́нтэ
    pron: "g мягкое [ɣ], c перед i — [θ], d мягкое [ð]."
    meaning: "К сожалению, к несчастью."
    examples:
      - "Desgraciadamente, la tienda ya estaba cerrada. — К сожалению, магазин уже был закрыт."
      - "Desgraciadamente, todavía hay mucha gente que no tiene acceso a agua potable. — К сожалению, многие люди до сих пор не имеют доступа к питьевой воде."
      - "Desgraciadamente, no pudo venir a la ceremonia porque el vuelo se retrasó once horas. — К сожалению, он не смог приехать на церемонию, потому что рейс задержали на одиннадцать часов."
    origin: "desgraciada «несчастная» + -mente; от desgracia «несчастье»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: por desgracia
        pair: ["Desgraciadamente, llueve.", "Por desgracia, llueve."]
        diff:
          - "por desgracia — короче и чаще в речи"
          - "lamentablemente — официальнее"
    analogs:
      - "unfortunately — к сожалению"
    dialogue:
      - "Ana: ¿Encontraron al culpable? | Нашли виновного?"
      - "Pablo: Desgraciadamente, no. No hay pruebas suficientes. | К сожалению, нет. Улик недостаточно."
      - "Ana: ¿Ni una pista? | Ни одной зацепки?"
      - "Pablo: Solo una contraseña en el móvil de la víctima, pero nadie sabe de quién es. | Только пароль в телефоне жертвы, но никто не знает, чей он."
      - "Ana: Qué frustrante. ¿Y el expediente está completo? | Как обидно. А дело полное?"
      - "Pablo: Desgraciadamente, faltan hojas. Alguien quiso ocultar algo. | К сожалению, не хватает страниц. Кто-то хотел кое-что скрыть."
      - "Ana: Sospecho que hay un delincuente dentro de la comisaría. | Подозреваю, что в комиссариате работает преступник."
      - "Pablo: No lo digas tan alto. Podría ser peligroso. | Не говори так громко. Это может быть опасно."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "desgraciadamente, … — к сожалению…"
      - "por desgracia — к несчастью"
      - "lamentablemente — к сожалению (официально)"
    collocation_example: "Lamentablemente, el vuelo está cancelado. — К сожалению, рейс отменён."
    trap: "desgraciado о человеке — «несчастный» или грубое «негодяй». Наречие desgraciadamente — нейтральное."

  - word: anteriormente
    ru: ранее
    ipa: /anteɾjoɾˈmente/
    say: антэрьормэ́нтэ
    meaning: "Ранее, прежде, до этого."
    examples:
      - "Anteriormente trabajaba en una pequeña editorial. — Раньше он работал в небольшом издательстве."
      - "Como dije anteriormente, necesitamos más tiempo antes de dar una respuesta definitiva. — Как я говорил ранее, нам нужно больше времени, прежде чем дать окончательный ответ."
      - "Anteriormente vivía en Madrid, pero se mudó a Bilbao por trabajo hace cinco años. — Раньше он жил в Мадриде, но пять лет назад переехал в Бильбао из-за работы."
    origin: "anterior «предыдущий» + -mente. Лат. ante «перед»."
    register: "Формальное, книжное."
    synonyms:
      - word: antes
        pair: ["Anteriormente trabajaba aquí.", "Antes trabajaba aquí."]
        diff:
          - "antes — разговорное"
          - "anteriormente — официальное, в докладах и новостях"
    analogs:
      - "previously / formerly — ранее"
    dialogue:
      - "Inspectora: ¿Había estado aquí anteriormente? | Вы бывали здесь раньше?"
      - "Testigo: No, nunca. Anteriormente vivía en otra ciudad. | Нет, никогда. Раньше я жил в другом городе."
      - "Inspectora: ¿Y por qué se mudó? | А почему переехали?"
      - "Testigo: Anteriormente trabajaba en una pequeña editorial. Me despidieron y tuve que empezar de cero. | Раньше я работал в маленьком издательстве. Меня уволили, и пришлось начинать с нуля."
      - "Inspectora: Lo siento. ¿Tiene algún enemigo? | Сочувствую. У вас есть враги?"
      - "Testigo: Ninguno. Solo conocía de vista al viudo del cementerio. | Нет. Я знал только в лицо вдовца с кладбища."
      - "Inspectora: ¿Le tenía envidia o resentimiento? | Вы ему завидовали или были на него обижены?"
      - "Testigo: Al contrario. Me daba pena. | Наоборот. Мне было его жаль."
    cefr: "B2."
    frequency: "Средняя в официальных текстах."
    collocations:
      - "como se ha dicho anteriormente — как было сказано ранее"
      - "anteriormente conocido como — ранее известный как"
      - "el día anterior — накануне"
    collocation_example: "Llegó el día anterior. — Он приехал накануне."
    trap: "В разговоре это звучит официально: проще сказать antes."

  - word: aparentemente
    ru: по-видимому
    ipa: /apaɾenteˈmente/
    say: апарэнтэмэ́нтэ
    meaning: "По-видимому, судя по всему; внешне (а на деле может быть иначе)."
    examples:
      - "Aparentemente es tranquilo, pero no lo es. — С виду он спокоен, но это не так."
      - "Aparentemente es una persona tranquila, pero cuando se enfada da miedo. — С виду он спокойный человек, но когда злится, становится страшно."
      - "Aparentemente no hubo heridos en el incendio, aunque aún faltan datos de dos barrios. — По-видимому, при пожаре никто не пострадал, хотя данных по двум районам ещё нет."
    origin: "aparente «видимый, кажущийся» + -mente. От aparecer «появляться»."
    register: "Нейтральное."
    synonyms:
      - word: al parecer
        pair: ["Aparentemente, se fue.", "Al parecer, se fue."]
        diff:
          - "al parecer — разговорнее, «судя по всему»"
    analogs:
      - "apparently — по-видимому"
      - "seemingly — внешне"
    dialogue:
      - "Lucía: ¿Cómo murió el viudo? | Как умер вдовец?"
      - "Marcos: Aparentemente fue un accidente. Pero yo desconfío. | По-видимому, это несчастный случай. Но я не доверяю этому."
      - "Lucía: ¿Por qué? ¿Qué dice la autopsia? | Почему? Что говорит вскрытие?"
      - "Marcos: Que no hay señales de lucha. Aparentemente se cayó por la escalera. | Что следов борьбы нет. По-видимому, он упал с лестницы."
      - "Lucía: Entonces, ¿qué te parece sospechoso? | Тогда что тебе кажется подозрительным?"
      - "Marcos: Que alguien borró las huellas. Y el culpable parecía tener prisa. | Что кто-то стёр отпечатки. И виновный, похоже, торопился."
      - "Lucía: Suena a asesinato. ¿Se lo dijiste a la inspectora? | Звучит как убийство. Ты сказал инспектору?"
      - "Marcos: Todavía no. Primero quiero averiguar más. | Пока нет. Сначала хочу выяснить больше."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "aparentemente normal — внешне нормальный"
      - "al parecer — судя по всему"
      - "sin motivo aparente — без видимой причины"
    collocation_example: "Se fue sin motivo aparente. — Он ушёл без видимой причины."
    trap: "Часто значит «внешне, а на самом деле нет». Не путайте с evidentemente — «очевидно»."

  - word: suavemente
    ru: мягко, осторожно
    ipa: /swaβeˈmente/
    say: суавэмэ́нтэ
    pron: "ua — одним слогом, v мягкое [β]."
    meaning: "Мягко, нежно, осторожно; тихо."
    examples:
      - "Abre la ventana suavemente, por favor. — Открой окно осторожно, пожалуйста."
      - "Habló suavemente, casi en un susurro, para no despertar al bebé que dormía. — Он говорил тихо, почти шёпотом, чтобы не разбудить спящего ребёнка."
      - "Cierra la puerta suavemente, que mi abuela está durmiendo la siesta en el salón. — Закрой дверь осторожно, потому что бабушка спит в гостиной после обеда."
    origin: "suave «мягкий» (лат. suavis «приятный») + -mente."
    register: "Нейтральное."
    synonyms:
      - word: con cuidado
        pair: ["Tócalo suavemente.", "Tócalo con cuidado."]
        diff:
          - "con cuidado — осторожно, чтобы не сломать"
          - "suavemente — мягко, нежно"
    analogs:
      - "gently / softly — мягко"
    dialogue:
      - "Ana: Shhh, el bebé duerme. | Тсс, малыш спит."
      - "Pablo: Vale, hablo suavemente. ¿Cómo ha pasado el día? | Хорошо, говорю тихо. Как он провёл день?"
      - "Ana: Bien, aunque estuvo alborotado toda la tarde. | Хорошо, хотя весь вечер был возбуждён."
      - "Pablo: ¿Y qué hiciste para calmarlo? | И что ты сделала, чтобы его успокоить?"
      - "Ana: Le canté bajito y le acaricié la cabeza suavemente. | Я тихонько пела ему и мягко гладила по голове."
      - "Pablo: Qué paciencia tienes. Yo me pongo nervioso enseguida. | Какое у тебя терпение. Я сразу нервничаю."
      - "Ana: Con el tiempo se aprende. Abre la puerta suavemente y mira. | Со временем учишься. Тихонько открой дверь и посмотри."
      - "Pablo: Qué ternura. Parece un angelito. | Какая нежность. Как ангелочек."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "hablar suavemente — говорить мягко"
      - "tocar suavemente — коснуться нежно"
      - "suave al tacto — мягкий на ощупь"
    collocation_example: "Esta tela es muy suave al tacto. — Эта ткань очень мягкая на ощупь."
    trap: "suave — ещё и «гладкий» и «лёгкий» (вино, климат). «Мягкий» о хлебе — blando или tierno."

  - word: fijamente
    ru: пристально
    ipa: /fixaˈmente/
    say: фихамэ́нтэ
    pron: "j — хриплое [x]."
    meaning: "Пристально, не отводя глаз."
    examples:
      - "No mires fijamente al sol. — Не смотри пристально на солнце."
      - "Me miró fijamente sin decir nada, y yo no supe cómo reaccionar. — Он пристально посмотрел на меня, ничего не говоря, и я не знал, как реагировать."
      - "La niña observaba fijamente al payaso con los ojos muy abiertos y la boca cerrada. — Девочка пристально смотрела на клоуна широко открытыми глазами и закрытым ртом."
    origin: "fija «неподвижная» + -mente. Родственные: fijo, fijarse en."
    register: "Нейтральное."
    synonyms:
      - word: sin parpadear
        pair: ["Me miraba fijamente.", "Me miraba sin parpadear."]
        diff:
          - "sin parpadear — «не моргая», выразительнее"
    analogs:
      - "fixedly / intently — пристально"
      - "to stare — пристально смотреть"
    dialogue:
      - "Lucía: ¿Por qué me miras tan fijamente? | Почему ты так пристально на меня смотришь?"
      - "Marcos: Porque estás irreconocible. ¿Te has cortado el pelo? | Потому что тебя не узнать. Ты подстриглась?"
      - "Lucía: Y me lo he teñido. ¿No te gusta? | И покрасилась. Тебе не нравится?"
      - "Marcos: Sinceramente, me encanta. Solo estoy sorprendido. | Честно говоря, очень нравится. Я просто удивлён."
      - "Lucía: Pues no me mires fijamente, que me pongo nerviosa. | Тогда не смотри на меня так пристально, я нервничаю."
      - "Marcos: Perdona. Es que pareces otra persona. | Извини. Просто ты как другой человек."
      - "Lucía: Eso es lo que quería. Necesitaba un cambio. | Этого я и хотела. Мне нужны были перемены."
      - "Marcos: Pues lo has conseguido. Vamos a celebrarlo. | Что ж, получилось. Пойдём отпразднуем."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "mirar fijamente — пристально смотреть"
      - "observar fijamente — внимательно наблюдать"
      - "fijarse en algo — обратить внимание на что-то"
    collocation_example: "El gato me observaba fijamente. — Кот пристально за мной наблюдал."
    trap: "Почти всегда с mirar: mirar fijamente. Не путайте с finalmente «наконец»."

  - word: suficientemente
    ru: достаточно
    ipa: /sufiθjenteˈmente/
    say: суфисьентэмэ́нтэ
    pron: "c перед i — [θ]."
    meaning: "Достаточно — перед прилагательным или наречием: suficientemente grande."
    examples:
      - "No es suficientemente grande para todos nosotros. — Он недостаточно велик для всех нас."
      - "Estudia suficientemente cada día, y por eso sacó buena nota en el examen. — Он занимается достаточно каждый день, и поэтому получил хорошую оценку на экзамене."
      - "Habla suficientemente alto para que todos te oigan desde el fondo de la sala. — Говори достаточно громко, чтобы тебя слышали все из глубины зала."
    origin: "suficiente «достаточный» (лат. sufficere «хватать») + -mente."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: lo bastante
        pair: ["Es suficientemente fuerte.", "Es lo bastante fuerte."]
        diff:
          - "lo bastante — разговорнее"
    analogs:
      - "enough / sufficiently — достаточно"
    dialogue:
      - "Ana: ¿Tenemos pruebas suficientes para denunciar? | У нас достаточно улик, чтобы подать заявление?"
      - "Pablo: No. No son suficientemente claras. | Нет. Они недостаточно ясные."
      - "Ana: Pero tenemos la firma y la contraseña. | Но у нас есть подпись и пароль."
      - "Pablo: Eso solo demuestra que alguien entró en el expediente, no quién. | Это лишь показывает, что кто-то открыл дело, а не кто."
      - "Ana: Entonces necesitamos otro testigo. | Тогда нужен ещё один свидетель."
      - "Pablo: Y que sea alguien suficientemente valiente para hablar. | И чтобы он был достаточно смелым, чтобы заговорить."
      - "Ana: Conozco a uno. Pero tiene miedo de la venganza. | Я знаю одного. Но он боится мести."
      - "Pablo: Entonces habrá que protegerlo bien. | Тогда придётся хорошо его защитить."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "suficientemente bueno — достаточно хороший"
      - "lo suficiente — достаточно (после глагола)"
      - "no ser suficiente — быть недостаточным"
    collocation_example: "Has trabajado lo suficiente. — Ты достаточно поработал."
    trap: "Перед прилагательным: suficientemente grande. После глагола проще lo suficiente: dormí lo suficiente."

  - word: incluso
    ru: даже
    ipa: /iŋˈkluso/
    say: инклу́со
    pron: "n перед c — носовое [ŋ]."
    meaning: "Даже; ещё — включительно."
    examples:
      - "Incluso los niños pequeños lo sabían. — Даже маленькие дети это знали."
      - "Incluso mi abuela usa el móvil ahora, y manda mensajes con muchas fotos. — Даже моя бабушка теперь пользуется телефоном и отправляет сообщения с кучей фотографий."
