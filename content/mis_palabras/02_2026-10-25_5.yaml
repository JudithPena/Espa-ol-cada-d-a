      - "Inspectora: Es una pista importante. ¿Alguien más lo sabía? | Это важная зацепка. Кто-то ещё знал?"
      - "Marcos: Sí, un empleado de la gestoría. Pero se resignó a callar por miedo. | Да, сотрудник конторы. Но он смирился с молчанием из страха."
