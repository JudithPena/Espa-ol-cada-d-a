# Третий список автора, часть 2 — «Desconcierto en el hospital», глава 1 (слова 22–35).
lang: es
words:
  - word: ingresar
    ru: госпитализировать; поступить в больницу
    ipa: /iŋgɾeˈsaɾ/
    say: ингрэса́р
    pron: "n перед g звучит как носовое [ŋ]: «ингрэсáр»."
    meaning: "Положить человека в больницу (ingresar a alguien) или самому поступить в больницу (ingresar en el hospital). Ещё — «положить деньги на счёт»."
    examples:
      - "Lo ingresaron de urgencia. — Его госпитализировали срочно."
      - "Ingresó en el hospital el lunes. — Он поступил в больницу в понедельник."
      - "Ingresé el dinero en mi cuenta. — Я положил деньги на счёт."
    origin: "Из лат. ingredi «входить»: in- «внутрь» + gradi «шагать». Родственные: ingreso «поступление, доход», egresar «выписываться»."
    register: "Нейтральное, формальное; в больнице — стандартное слово."
    synonyms:
      - word: hospitalizar
        pair: ["Tuvieron que ingresarlo.", "Tuvieron que hospitalizarlo."]
        diff:
          - "hospitalizar — тоже «госпитализировать», но чуть более канцелярское"
    analogs:
      - "to admit — госпитализировать: admit someone to hospital"
      - "to check in — поступать в больницу"
    dialogue:
      - "Ana: ¿Dónde está tu abuelo? | Где твой дедушка?"
      - "Pablo: Lo han ingresado en cardiología. | Его положили в кардиологию."
    cefr: "B2."
    frequency: "Очень частое в новостях о больницах и банках."
    collocations:
      - "ingresar en el hospital — поступить в больницу"
      - "ingresar en urgencias — поступить в приёмное отделение"
      - "ingresar dinero — положить деньги на счёт"
      - "ingresar en prisión — попасть в тюрьму"
    collocation_example: "Lo ingresaron en la UCI esa misma noche. — Его положили в реанимацию в ту же ночь."
    trap: "В Испании говорят ingresar en el hospital, а не a: предлог a бывает только перед человеком (ingresar a alguien). Не путайте с ingerir «принимать внутрь»."

  - word: pincharse un neumático
    ru: проколоть шину
    ipa: /pinˈtʃaɾse un neuˈmatiko/
    say: пинча́рсэ ун нэума́тико
    pron: "ch — «ч»; eu в neumático — два слога «э-у»: нэ-у-ма́-ти-ко."
    meaning: "О колесе: проколоться, спустить. Дословно «уколоться», потому что колесо «укололось» гвоздём."
    examples:
      - "Se nos pinchó un neumático en la autopista. — У нас на шоссе проколола шина."
      - "Me pinché una rueda y llegué tarde. — У меня проколола шина, и я опоздал."
    origin: "pinchar «колоть» (от pincho «шип, остриё») + возвратное se: колесо «уколото». Neumático от греч. pneuma «воздух»: «воздушный»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tener un pinchazo
        pair: ["Se me pinchó una rueda.", "Tuve un pinchazo."]
        diff:
          - "tener un pinchazo — то же, но в виде существительного"
    analogs:
      - "to get a flat tire — проколоть шину"
      - "to have a puncture — британское выражение"
    dialogue:
      - "Ana: ¿Por qué has llegado tarde? | Почему ты опоздал?"
      - "Pablo: Se me pinchó un neumático. | У меня проколола шина."
    cefr: "B2."
    frequency: "Частое при разговоре о машинах."
    collocations:
      - "un pinchazo — прокол"
      - "cambiar la rueda — сменить колесо"
      - "rueda de repuesto — запасное колесо"
    collocation_example: "Cambié la rueda pinchada en diez minutos. — Я сменил проколотое колесо за десять минут."
    trap: "Часто — безличная форма с me/nos: Se me pinchó la rueda, «у меня проколола». Колесо — rueda, шина — neumático, в Латинской Америке ещё llanta."

  - word: cuneta
    ru: кювет
    ipa: /kuˈneta/
    say: куне́та
    meaning: "Канава вдоль дороги, куда стекает вода. В аварийных рассказах — «съехать в кювет»."
    examples:
      - "El coche acabó en la cuneta. — Машина оказалась в кювете."
      - "Pararon en la cuneta para cambiar la rueda. — Они остановились у обочины, чтобы сменить колесо."
    origin: "Точное происхождение неизвестно. Придорожная канава обычно V-образного сечения."
    register: "Нейтральное."
    synonyms:
      - word: arcén
        pair: ["Paró en la cuneta.", "Paró en el arcén."]
        diff:
          - "arcén — обочина, по которой можно ехать или стоять"
          - "cuneta — именно канава рядом с дорогой"
    analogs:
      - "ditch — канава, кювет"
      - "roadside — обочина"
    dialogue:
      - "Ana: ¿Dónde acabó el coche? | Где оказалась машина?"
      - "Pablo: En la cuneta, sin daños graves. | В кювете, без серьёзных повреждений."
    cefr: "B2."
    frequency: "Частое в рассказах про дорогу."
    collocations:
      - "caer en la cuneta — упасть в кювет"
      - "estar en la cuneta — оказаться на обочине жизни"
      - "dejar en la cuneta — бросить"
    collocation_example: "Se salió de la carretera y cayó a la cuneta. — Он выехал с дороги и упал в кювет."
    trap: "Не путайте cuneta «кювет» с arcén «обочина» и с acera «тротуар». Фраза «quedarse en la cuneta» — ещё и «потерпеть неудачу»."

  - word: conmoción
    ru: потрясение, шок
    ipa: /konmoˈθjon/
    say: коммосьо́н
    pron: "c перед i в Испании — [θ]; nm звучит как «мм»: коммосьон."
    meaning: "Сильное потрясение — физическое (после удара по голове) или душевное (от тяжёлой новости)."
    examples:
      - "La noticia causó una gran conmoción. — Новость вызвала большое потрясение."
      - "Tiene una conmoción cerebral. — У него сотрясение мозга."
    origin: "Из лат. commotio «движение, потрясение»: com- «вместе» + movere «двигать». Родственные: mover «двигать», emoción «эмоция», conmover «растрогать»."
    register: "Нейтральное, формальное; в новостях."
    synonyms:
      - word: shock
        pair: ["Sufrió una conmoción.", "Sufrió un shock."]
        diff:
          - "shock — заимствование, разговорное слово: «шок»"
          - "conmoción — слово посерьёзнее, и в медицине, и в новостях"
    analogs:
      - "shock — потрясение"
      - "concussion — сотрясение мозга (медицина)"
    dialogue:
      - "Ana: ¿Cómo está tu hermano? | Как твой брат?"
      - "Pablo: Tiene una conmoción cerebral, pero se recupera. | У него сотрясение мозга, но он поправляется."
    cefr: "C1."
    frequency: "Частое в новостях и медицине."
    collocations:
      - "conmoción cerebral — сотрясение мозга"
      - "causar conmoción — вызвать потрясение"
      - "una gran conmoción social — большой общественный резонанс"
    collocation_example: "El accidente causó una gran conmoción en el pueblo. — Авария вызвала большое потрясение в посёлке."
    trap: "Conmoción — женского рода и оканчивается на -ción: la conmoción. Пишется через n: con- + moción, а не «commoción». Сочетание nm произносится как «мм»."

  - word: no dar abasto
    ru: не справляться, не успевать
    ipa: /no ˈdaɾ aˈβasto/
    say: но дар аба́сто
    pron: "b между гласными мягкая [β]; ударение на ba: abasto."
    meaning: "Не успевать сделать всё, что нужно, потому что дел слишком много или не хватает людей."
    examples:
      - "Los médicos no dan abasto. — Врачи не справляются."
      - "No doy abasto con tanto trabajo. — Я не справляюсь с такой работой."
    origin: "abasto — «снабжение, запас» (от abastecer «снабжать»). Дословно «не давать запаса»: сил и рук не хватает на всё."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: no llegar a todo
        pair: ["No doy abasto con los pedidos.", "No llego a todo con los pedidos."]
        diff:
          - "no llegar a todo — проще, разговорное «не успеваю всё»"
          - "no dar abasto — чаще о сильной перегрузке"
    analogs:
      - "to be overwhelmed — не справляться"
      - "to be swamped — быть заваленным"
    dialogue:
      - "Ana: ¿Cómo va el hospital? | Как дела в больнице?"
      - "Pablo: Mal, no damos abasto. | Плохо, мы не справляемся."
    cefr: "B2."
    frequency: "Частое в новостях и разговоре."
    collocations:
      - "no dar abasto con — не справляться с"
      - "no dar abasto a — не успевать"
      - "no dar abasto con el trabajo — не справляться с работой"
    collocation_example: "No damos abasto con tantos pacientes. — Мы не справляемся с таким количеством больных."
    trap: "Это неизменное выражение: abasto не меняется. Не пишите «a basto» раздельно: abasto — одно слово. С чем не справляются — con: no doy abasto con."

  - word: atender
    ru: принять, обслужить, оказать помощь
    ipa: /atenˈdeɾ/
    say: атэндэ́р
    pron: "d между гласными мягкое [ð]. Спрягается e → ie: atiendo, atiendes."
    meaning: "Заниматься человеком или делом: принять посетителя, обслужить клиента, оказать помощь больному. Ещё — «ответить на звонок»."
    examples:
      - "El médico atiende a los pacientes. — Врач принимает больных."
      - "¿Quién te atiende? — Кто вас обслуживает?"
      - "No pude atender el teléfono. — Я не смог ответить на звонок."
    origin: "Из лат. attendere «направлять внимание»: ad- «к» + tendere «тянуть». Отсюда и atención «внимание», atento «внимательный»."
    register: "Нейтральное."
    synonyms:
      - word: ocuparse de
        pair: ["El enfermero atiende al paciente.", "El enfermero se ocupa del paciente."]
        diff:
          - "ocuparse de — «заниматься чем-то или кем-то» вообще"
          - "atender — именно принять и обслужить"
    analogs:
      - "to attend to — заниматься, обслуживать"
      - "to take care of — позаботиться"
    dialogue:
      - "Ana: ¿Ya te han atendido? | Вас уже приняли?"
      - "Pablo: No, todavía espero. | Нет, всё ещё жду."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "atender a un paciente — принять больного"
      - "atender el teléfono — ответить на звонок"
      - "atender a un cliente — обслужить клиента"
    collocation_example: "Me atendió una enfermera muy amable. — Меня принимала очень любезная медсестра."
    trap: "Перед человеком нужен a: atender a alguien. Ложный друг английского to attend «посещать»: «посетить» по-испански — asistir a."

  - word: arremolinarse
    ru: толпиться, собираться кучей
    ipa: /aremoliˈnaɾse/
    say: аррэмолина́рсэ
    pron: "rr — раскатистое."
    meaning: "О людях: собираться тесной толпой вокруг чего-то или кого-то. О воздухе и воде — «закручиваться в вихрь»."
    examples:
      - "La gente se arremolinó en la entrada. — Люди столпились у входа."
      - "Los curiosos se arremolinaban alrededor del coche. — Любопытные толпились вокруг машины."
    origin: "remolino «водоворот, вихрь» (от remolinar) с приставкой a- и возвратным -se: люди «закручиваются» вокруг центра."
    register: "Нейтральное, чуть литературное."
    synonyms:
      - word: agolparse
        pair: ["Los curiosos se arremolinaron.", "Los curiosos se agolparon."]
        diff:
          - "agolparse — «скопиться, нахлынуть» разом, ещё сильнее подчёркивает давку"
    analogs:
      - "to crowd around — собираться толпой"
      - "to swirl — кружиться вихрем"
    dialogue:
      - "Ana: ¿Qué pasa en la puerta? | Что там у двери?"
      - "Pablo: La gente se arremolina para entrar. | Люди толпятся, чтобы войти."
    cefr: "C1."
    frequency: "Нечастое: из художественных текстов и новостей."
    collocations:
      - "arremolinarse alrededor de — столпиться вокруг"
      - "arremolinarse en la puerta — толпиться у двери"
      - "un remolino de gente — водоворот людей"
    collocation_example: "Los periodistas se arremolinaron alrededor del ministro. — Журналисты столпились вокруг министра."
    trap: "Это возвратный глагол: se arremolinó, а не arremolinó. Не путайте с remolino «водоворот» и remolcar «буксировать»."

  - word: despejarse
    ru: освободиться, расчиститься
    ipa: /despeˈxaɾse/
    say: дэспэха́рсэ
    pron: "j — «х»: despejarse — «дэспэхáрсэ»."
    meaning: "О месте или небе: стать свободным, расчиститься. О голове — прийти в себя, проясниться."
    examples:
      - "El cielo se despejó por la tarde. — К вечеру небо прояснилось."
      - "La sala de espera se despejó poco a poco. — Приёмная постепенно освободилась."
      - "Salí a caminar para despejarme. — Я вышел пройтись, чтобы проветрить голову."
    origin: "От despejar «расчищать, освобождать»: избавлять место от препятствий. Родственное: despejado «ясный, свободный»."
    register: "Нейтральное."
    synonyms:
      - word: aclararse
        pair: ["El cielo se despejó.", "El cielo se aclaró."]
        diff:
          - "aclararse — «стать светлее, яснее», но не освободиться от людей и вещей"
    analogs:
      - "to clear up — проясниться, освободиться"
      - "to clear one's head — проветрить голову"
    dialogue:
      - "Ana: ¿Ya hay sitio en la sala? | В палате уже есть места?"
      - "Pablo: Sí, se despejó hace un rato. | Да, освободилось недавно."
    cefr: "B2."
    frequency: "Частое: в погоде, в быту, в медицине."
    collocations:
      - "despejarse el cielo — проясниться (о небе)"
      - "despejar la mente — проветрить голову"
      - "despejar el camino — расчистить дорогу"
    collocation_example: "Un paseo me ayuda a despejar la mente. — Прогулка помогает мне проветрить голову."
    trap: "Despejado — и «ясный» (о небе), и «бодрый» (о человеке): Estoy despejado значит «я в ясном сознании». Не путайте с despedir «увольнять»."

  - word: follón
    ru: бардак, суматоха
    ipa: /foˈʎon/
    say: фойо́н
    pron: "ll в большинстве регионов — как «й», в части Испании — «льй»."
    meaning: "Шумный беспорядок, суматоха, спор или путаница. Разговорное слово из Испании."
    examples:
      - "¡Qué follón hay en urgencias! — Какой бардак в приёмном отделении!"
      - "Se armó un buen follón. — Начался настоящий бардак."
    origin: "Происхождение спорное. Родственное слово — follonero «скандалист, зачинщик беспорядка»."
    register: "Разговорное, фамильярное. В официальной речи лучше confusión или desorden."
    synonyms:
      - word: jaleo
        pair: ["Hay un follón enorme.", "Hay un jaleo enorme."]
        diff:
          - "jaleo — шумная суматоха, но чаще весёлая, как на празднике"
          - "follón — неприятный бардак, спор, неразбериха"
    analogs:
      - "mess — беспорядок"
      - "commotion — шумиха, суматоха"
    dialogue:
      - "Ana: ¿Por qué hay tanto ruido? | Почему так шумно?"
      - "Pablo: Se ha armado un follón en la entrada. | У входа начался бардак."
    cefr: "B2."
    frequency: "Очень частое в разговоре в Испании."
    collocations:
      - "armar un follón — устроить бардак"
      - "meterse en un follón — влипнуть в историю"
      - "qué follón — какой бардак"
    collocation_example: "Se armó un follón tremendo en la reunión. — На собрании поднялся жуткий шум."
    trap: "Слово разговорное и испанское: в Латинской Америке чаще lío или desorden. Родственное follonero — это «скандалист»."

  - word: estar a punto de
    ru: быть вот-вот готовым сделать
    ipa: /esˈtaɾ a ˈpunto de/
    say: эста́р а пу́нто дэ
    meaning: "Вот-вот сделать что-то или вот-вот случиться: «чуть не», «на грани». После de — инфинитив."
    examples:
      - "Estoy a punto de salir. — Я вот-вот выйду."
      - "El tren estaba a punto de partir. — Поезд вот-вот должен был отправиться."
      - "Estuve a punto de caerme. — Я чуть не упал."
    origin: "punto «точка, момент» + estar a «находиться в». Дословно «быть на пороге момента»."
    register: "Нейтральное, годится везде."
    synonyms:
      - word: ir a + infinitivo
        pair: ["Estoy a punto de salir.", "Voy a salir ya."]
        diff:
          - "ir a — просто ближайшее будущее"
          - "estar a punto de — совсем скоро, вот-вот, часто чуть не"
    analogs:
      - "to be about to — быть готовым сделать"
      - "to be on the verge of — быть на грани"
    dialogue:
      - "Ana: ¿Ya llegas? | Ты уже подходишь?"
      - "Pablo: Estoy a punto de entrar. | Я вот-вот войду."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "estar a punto de + инфинитив — быть готовым сделать"
      - "estar a punto de llorar — чуть не заплакать"
      - "estar a punto de terminar — вот-вот закончить"
    collocation_example: "Estaba a punto de llorar cuando oyó la noticia. — Она чуть не заплакала, когда услышала новость."
    trap: "После de — только инфинитив: a punto de llegar, а не a punto de llegando. Не забывайте de: «estoy a punto salir» — ошибка."

  - word: disuadir
    ru: отговорить
    ipa: /disuaˈðiɾ/
    say: дисуади́р
    pron: "d между гласными мягкое [ð]: disuadir — «дисуади́р»."
    meaning: "Убедить человека не делать что-то. Конструкция: disuadir a alguien de algo или de hacer algo."
    examples:
      - "Intenté disuadirlo de viajar. — Я пытался отговорить его от поездки."
      - "Nadie pudo disuadirla de su idea. — Никто не смог отговорить её от этой идеи."
    origin: "Из лат. dissuadere: dis- «против» + suadere «убеждать». Антоним — persuadir «убедить» и convencer «убедить»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: quitar de la cabeza
        pair: ["Quiso disuadirlo del plan.", "Quiso quitarle el plan de la cabeza."]
        diff:
          - "quitar de la cabeza — разговорная форма «выбить из головы»"
    analogs:
      - "to dissuade — то же слово, книжное"
      - "to talk someone out of — отговорить, разговорное"
    dialogue:
      - "Ana: ¿Vas a irte hoy? | Ты уедешь сегодня?"
      - "Pablo: Sí, y nadie me disuade. | Да, и никто меня не отговорит."
    cefr: "C1."
    frequency: "Средней частоты: в письменной речи и новостях."
    collocations:
      - "disuadir a alguien de algo — отговорить кого-то от чего-то"
      - "disuadir de hacer algo — отговорить что-то делать"
      - "efecto disuasorio — сдерживающий эффект"
    collocation_example: "Su madre lo disuadió de abandonar los estudios. — Мать отговорила его бросать учёбу."
    trap: "Нужно de: disuadir DE algo, а не disuadir algo. Не путайте с persuadir «убедить сделать»: это противоположное действие."

  - word: convenir
    ru: договариваться; подходить, быть выгодным
    ipa: /kombeˈniɾ/
    say: комбэни́р
    pron: "v читается как b; спрягается как venir: conviene, convienen."
    meaning: "Два значения: 1) договариваться о чём-то (convenir un precio); 2) подходить, быть полезным (me conviene esperar)."
    examples:
      - "Convinieron el precio. — Они договорились о цене."
      - "Me conviene esperar un poco. — Мне лучше немного подождать."
      - "No conviene salir ahora. — Сейчас лучше не выходить."
    origin: "Из лат. convenire «сходиться»: con- «вместе» + venire «приходить». Родственные: conveniente «подходящий», convenio «соглашение»."
    register: "Формальное и нейтральное."
    synonyms:
      - word: acordar
        pair: ["Convinieron una fecha.", "Acordaron una fecha."]
        diff:
          - "acordar — тоже «договариваться»; в Латинской Америке чаще"
          - "convenir — ещё и «подходить, быть выгодным»"
    analogs:
      - "to agree — договориться"
      - "to suit — подходить, быть выгодным"
    dialogue:
      - "Ana: ¿Quedamos mañana? | Встретимся завтра?"
      - "Pablo: Mejor el jueves, me conviene más. | Лучше в четверг, мне так удобнее."
    cefr: "B2."
    frequency: "Частое в деловой и письменной речи."
    collocations:
      - "convenir un precio — договориться о цене"
      - "me conviene — мне подходит"
      - "como convenga — как будет нужно"
    collocation_example: "Convinimos vernos el viernes. — Мы договорились встретиться в пятницу."
    trap: "Спрягается как venir: conviene, convino, convenga. В значении «подходить» часто безличный: no conviene hacerlo — «лучше этого не делать». Не путайте с convencer «убеждать»."

  - word: reclamar más personal sanitario
    ru: запросить больше медперсонала
    ipa: /reklaˈmaɾ mas peɾsoˈnal saniˈtaɾjo/
    say: рэклама́р мас пэрсона́ль санита́рьо
    meaning: "Потребовать, чтобы в больнице было больше медицинских работников. Reclamar — требовать то, на что есть право."
    examples:
      - "Los sindicatos reclaman más personal sanitario. — Профсоюзы требуют больше медперсонала."
      - "Reclamaron más personal para la planta. — Они потребовали больше персонала для отделения."
    origin: "reclamar от лат. reclamare «кричать против»: re- «снова» + clamare «кричать». personal sanitario — «медицинский персонал» (sanitario от лат. sanitas «здоровье»)."
    register: "Формальное, язык новостей и профсоюзов."
    synonyms:
      - word: exigir
        pair: ["Reclaman más personal.", "Exigen más personal."]
        diff:
          - "exigir — требовать жёстче, как приказ"
          - "reclamar — требовать то, что положено, и обращаться с просьбой"
    analogs:
      - "to demand more staff — требовать больше персонала"
      - "to call for — призвать, потребовать"
    dialogue:
      - "Ana: ¿Qué piden los médicos? | Чего просят врачи?"
      - "Pablo: Reclaman más personal sanitario. | Требуют больше медперсонала."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "reclamar derechos — требовать права"
      - "reclamar una solución — требовать решения"
      - "personal sanitario — медицинский персонал"
    collocation_example: "El sindicato reclama más recursos. — Профсоюз требует больше ресурсов."
    trap: "Personal — слово мужского рода без множественного: el personal sanitario, а не «los personales». Reclamar — не «рекламировать»: «рекламировать» — anunciar."

  - word: armarse de paciencia
    ru: запастись терпением
    ipa: /aɾˈmaɾse de paˈθjenθja/
    say: арма́рсэ дэ пасье́нсья
    pron: "c/z в Испании — [θ]: pa-θjen-θja."
    meaning: "Приготовиться терпеливо ждать или терпеть что-то неприятное. Дословно «вооружиться терпением»."
    examples:
      - "Hay que armarse de paciencia. — Нужно запастись терпением."
      - "Me armé de paciencia y esperé. — Я запасся терпением и ждал."
    origin: "armarse «вооружаться» (от arma «оружие») + de «чем» + paciencia (лат. patientia «терпение»). Образ: терпение как оружие в борьбе с ожиданием."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tener paciencia
        pair: ["Tuve que armarme de paciencia.", "Tuve que tener paciencia."]
        diff:
          - "tener paciencia — просто «потерпеть»"
          - "armarse de paciencia — подчёркивает усилие и подготовку"
    analogs:
      - "to steel oneself — собраться с духом"
      - "to be patient — быть терпеливым"
    dialogue:
      - "Ana: ¿Cuánto tardan las pruebas? | Сколько занимают обследования?"
      - "Pablo: Mucho, hay que armarse de paciencia. | Долго, нужно запастись терпением."
    cefr: "B2."
    frequency: "Частое в разговорной речи."
    collocations:
      - "armarse de valor — собраться с духом"
      - "armarse de paciencia — запастись терпением"
      - "armarse hasta los dientes — вооружиться до зубов"
    collocation_example: "Me armé de valor y le dije la verdad. — Я собрался с духом и сказал ему правду."
    trap: "Нужен предлог de: armarse DE paciencia, а не «con paciencia». Глагол возвратный: me armo, te armas."
