# Третий список автора, часть 2 — «Desconcierto en el hospital», глава 1 (слова 22–35).
lang: es
words:
  - word: ingresar
    ru: госпитализировать; поступить в больницу
    ipa: /iŋgɾeˈsaɾ/
    say: ингрэса́р
    pron: "n перед g звучит как носовое [ŋ]: «ингрэсáр»."
    meaning: "Положить человека в больницу (ingresar a alguien) или самому поступить в больницу (ingresar en el hospital). Ещё — «положить деньги на счёт»."
    examples:
      - "Ingresé el dinero en el banco ayer. — Я вчера положил деньги в банк."
      - "Ingresó en el hospital el lunes y le dieron el alta tres días después. — Он поступил в больницу в понедельник и был выписан три дня спустя."
      - "Lo ingresaron de urgencia por un dolor fuerte en el pecho, y pasó allí una semana. — Его срочно госпитализировали из-за сильной боли в груди, и он провёл там неделю."
    origin: "Из лат. ingredi «входить»: in- «внутрь» + gradi «шагать». Родственные: ingreso «поступление, доход», egresar «выписываться»."
    register: "Нейтральное, формальное; в больнице — стандартное слово."
    synonyms:
      - word: hospitalizar
        pair: ["Tuvieron que ingresarlo.", "Tuvieron que hospitalizarlo."]
        diff:
          - "hospitalizar — тоже «госпитализировать», но чуть более канцелярское"
    analogs:
      - "to admit — госпитализировать: admit someone to hospital"
      - "to check in — поступать в больницу"
    dialogue:
      - "Ana: ¿Dónde está tu abuelo? Lo busqué en casa y no estaba. | Где твой дедушка? Я искала его дома, его там не было."
      - "Pablo: Lo han ingresado en cardiología esta madrugada. | Его госпитализировали в кардиологию сегодня на рассвете."
      - "Ana: ¡Qué susto! ¿Qué le pasó? | Какой испуг! Что с ним случилось?"
      - "Pablo: Sintió un dolor fuerte en el pecho y se puso muy pálido. | Он почувствовал сильную боль в груди и сильно побледнел."
      - "Ana: ¿Y cómo está ahora? | А как он сейчас?"
      - "Pablo: Estable, pero el médico quiere someterlo a pruebas. Tendrá que quedarse unos días ingresado. | Стабильно, но врач хочет сделать ему анализы. Ему придётся несколько дней полежать в больнице."
      - "Ana: Si hace falta, yo me quedo con él esta noche. | Если нужно, я останусь с ним на эту ночь."
      - "Pablo: Gracias, pero tranquila. Mejor descansa, que se te nota el cansancio. | Спасибо, но не волнуйся. Лучше отдохни, по тебе видно усталость."
    cefr: "B2."
    frequency: "Очень частое в новостях о больницах и банках."
    collocations:
      - "ingresar en el hospital — поступить в больницу"
      - "ingresar en urgencias — поступить в приёмное отделение"
      - "ingresar dinero — положить деньги на счёт"
      - "ingresar en prisión — попасть в тюрьму"
    collocation_example: "Lo ingresaron en la UCI esa misma noche. — Его положили в реанимацию в ту же ночь."
    trap: "В Испании говорят ingresar en el hospital, а не a: предлог a бывает только перед человеком (ingresar a alguien). Не путайте с ingerir «принимать внутрь»."

  - word: pincharse un neumático
    ru: проколоть шину
    ipa: /pinˈtʃaɾse un neuˈmatiko/
    say: пинча́рсэ ун нэума́тико
    pron: "ch — «ч»; eu в neumático — два слога «э-у»: нэ-у-ма́-ти-ко."
    meaning: "О колесе: проколоться, спустить. Дословно «уколоться», потому что колесо «укололось» гвоздём."
    examples:
      - "Se pinchó un neumático junto al puente. — У моста пробило шину."
      - "Me pinché una rueda de camino al trabajo y llegué tarde a la reunión. — У меня по дороге на работу пробило колесо, и я опоздал на собрание."
      - "Se nos pinchó un neumático en la autopista y tuvimos que esperar a la grúa durante una hora. — У нас на шоссе пробило шину, и нам пришлось ждать эвакуатор целый час."
    origin: "pinchar «колоть» (от pincho «шип, остриё») + возвратное se: колесо «уколото». Neumático от греч. pneuma «воздух»: «воздушный»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tener un pinchazo
        pair: ["Se me pinchó una rueda.", "Tuve un pinchazo."]
        diff:
          - "tener un pinchazo — то же, но в виде существительного"
    analogs:
      - "to get a flat tire — проколоть шину"
      - "to have a puncture — британское выражение"
    dialogue:
      - "Ana: ¿Por qué has llegado tan tarde? Estaba preocupada. | Почему ты так опоздал? Я волновалась."
      - "Pablo: Se me pinchó un neumático junto al puente. | У меня на мосту прокололась шина."
      - "Ana: ¡Qué mala suerte! ¿Tenías rueda de repuesto? | Вот не повезло! У тебя была запаска?"
      - "Pablo: Sí, pero no me acordaba de dónde estaba el gato. | Да, но я не помнил, где домкрат."
      - "Ana: ¿Y cómo lo arreglaste? | И как ты справился?"
      - "Pablo: Un señor muy amable se acercó y me ayudó. Si no, aún estaría allí. | Подошёл очень любезный сеньор и помог. Если бы не он, я бы до сих пор там стоял."
      - "Ana: Menos mal. Por cierto, ¿te has hecho algún rasguño? | Слава богу. Кстати, ты не поцарапался?"
      - "Pablo: Solo me manché las manos de grasa. Voy a lavarme y ya cenamos. | Только руки испачкал в смазке. Сейчас помою и будем ужинать."
    cefr: "B2."
    frequency: "Частое при разговоре о машинах."
    collocations:
      - "un pinchazo — прокол"
      - "cambiar la rueda — сменить колесо"
      - "rueda de repuesto — запасное колесо"
    collocation_example: "Cambié la rueda pinchada en diez minutos. — Я сменил проколотое колесо за десять минут."
    trap: "Часто — безличная форма с me/nos: Se me pinchó la rueda, «у меня проколола». Колесо — rueda, шина — neumático, в Латинской Америке ещё llanta."

  - word: cuneta
    ru: кювет
    ipa: /kuˈneta/
    say: куне́та
    meaning: "Канава вдоль дороги, куда стекает вода. В аварийных рассказах — «съехать в кювет»."
    examples:
      - "Dejaron la bici en la cuneta del camino. — Они оставили велосипед в кювете у дороги."
      - "El coche acabó en la cuneta después de salirse en una curva con hielo. — Машина оказалась в кювете, слетев с дороги на обледенелом повороте."
      - "Pararon en la cuneta para cambiar la rueda antes de que se hiciera de noche. — Они остановились на обочине, чтобы заменить колесо до наступления ночи."
    origin: "Точное происхождение неизвестно. Придорожная канава обычно V-образного сечения."
    register: "Нейтральное."
    synonyms:
      - word: arcén
        pair: ["Paró en la cuneta.", "Paró en el arcén."]
        diff:
          - "arcén — обочина, по которой можно ехать или стоять"
          - "cuneta — именно канава рядом с дорогой"
    analogs:
      - "ditch — канава, кювет"
      - "roadside — обочина"
    dialogue:
      - "Anoche llovía mucho y la carretera estaba resbaladiza. | Вчера вечером шёл сильный дождь, и дорога была скользкой."
      - "Un coche patinó en una curva y acabó en la cuneta. | Машина занесло на повороте, и она оказалась в кювете."
      - "El conductor salió aturdido, pero sin ningún rasguño. | Водитель вышел оглушённый, но без единой царапины."
      - "Poco después llegaron otros coches y la gente se arremolinó alrededor. | Вскоре подъехали другие машины, и вокруг собрались люди."
      - "Alguien llamó a una ambulancia y a la policía. | Кто-то вызвал скорую и полицию."
      - "Menos mal que no hubo heridos graves, solo un gran desconcierto. | К счастью, серьёзно раненых не было — только большая растерянность."
      - "Al amanecer, una grúa sacó el coche de la cuneta y la carretera se despejó. | На рассвете эвакуатор вытащил машину из кювета, и дорога освободилась."
    cefr: "B2."
    frequency: "Частое в рассказах про дорогу."
    collocations:
      - "caer en la cuneta — упасть в кювет"
      - "estar en la cuneta — оказаться на обочине жизни"
      - "dejar en la cuneta — бросить"
    collocation_example: "Se salió de la carretera y cayó a la cuneta. — Он выехал с дороги и упал в кювет."
    trap: "Не путайте cuneta «кювет» с arcén «обочина» и с acera «тротуар». Фраза «quedarse en la cuneta» — ещё и «потерпеть неудачу»."

  - word: conmoción
    ru: потрясение, шок
    ipa: /konmoˈθjon/
    say: коммосьо́н
    pron: "c перед i в Испании — [θ]; nm звучит как «мм»: коммосьон."
    meaning: "Сильное потрясение — физическое (после удара по голове) или душевное (от тяжёлой новости)."
    examples:
      - "La noticia causó una gran conmoción. — Новость вызвала большое потрясение."
      - "Tiene una conmoción cerebral y el médico le ha prohibido leer y usar pantallas. — У него сотрясение мозга, и врач запретил ему читать и пользоваться экранами."
      - "Todo el país vivió con conmoción las imágenes del terremoto y las historias de los supervivientes. — Вся страна с потрясением смотрела кадры землетрясения и слушала истории выживших."
    origin: "Из лат. commotio «движение, потрясение»: com- «вместе» + movere «двигать». Родственные: mover «двигать», emoción «эмоция», conmover «растрогать»."
    register: "Нейтральное, формальное; в новостях."
    synonyms:
      - word: shock
        pair: ["Sufrió una conmoción.", "Sufrió un shock."]
        diff:
          - "shock — заимствование, разговорное слово: «шок»"
          - "conmoción — слово посерьёзнее, и в медицине, и в новостях"
    analogs:
      - "shock — потрясение"
      - "concussion — сотрясение мозга (медицина)"
    dialogue:
      - "Ana: ¿Cómo está tu hermano? Me dijeron que tuvo un accidente. | Как твой брат? Мне сказали, что у него была авария."
      - "Pablo: Tiene una conmoción cerebral, pero se recupera. | У него сотрясение мозга, но он поправляется."
      - "Ana: ¡Qué conmoción para toda la familia! | Какое потрясение для всей семьи!"
      - "Pablo: Sí, mi madre se quedó pálida y no pudo ni hablar. | Да, мама побледнела и не смогла даже говорить."
      - "Ana: ¿Los médicos lo van a someter a observación? | Врачи оставят его под наблюдением?"
      - "Pablo: Sí, por la hemorragia pequeña que tuvo, quieren vigilarlo unos días. | Да, из-за небольшого кровотечения хотят понаблюдать за ним несколько дней."
      - "Ana: ¿Puedo visitarlo? | Можно его навестить?"
      - "Pablo: Mañana mejor. Hoy está aturdido y necesita descansar. | Лучше завтра. Сегодня он оглушён и ему нужен отдых."
    cefr: "C1."
    frequency: "Частое в новостях и медицине."
    collocations:
      - "conmoción cerebral — сотрясение мозга"
      - "causar conmoción — вызвать потрясение"
      - "una gran conmoción social — большой общественный резонанс"
    collocation_example: "El accidente causó una gran conmoción en el pueblo. — Авария вызвала большое потрясение в посёлке."
    trap: "Conmoción — женского рода и оканчивается на -ción: la conmoción. Пишется через n: con- + moción, а не «commoción». Сочетание nm произносится как «мм»."

  - word: no dar abasto
    ru: не справляться, не успевать
    ipa: /no ˈdaɾ aˈβasto/
    say: но дар аба́сто
    pron: "b между гласными мягкая [β]; ударение на ba: abasto."
    meaning: "Не успевать сделать всё, что нужно, потому что дел слишком много или не хватает людей."
    examples:
      - "Hoy no doy abasto con tanta gente. — Сегодня я не справляюсь с таким количеством людей."
      - "Los médicos no dan abasto con tantos enfermos de gripe en el hospital. — Врачи не справляются с таким количеством больных гриппом в больнице."
      - "No doy abasto con tanto trabajo y creo que voy a pedir ayuda a mi jefe. — Я не успеваю из-за такой кучи работы и думаю попросить помощи у начальника."
    origin: "abasto — «снабжение, запас» (от abastecer «снабжать»). Дословно «не давать запаса»: сил и рук не хватает на всё."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: no llegar a todo
        pair: ["No doy abasto con los pedidos.", "No llego a todo con los pedidos."]
        diff:
          - "no llegar a todo — проще, разговорное «не успеваю всё»"
          - "no dar abasto — чаще о сильной перегрузке"
    analogs:
      - "to be overwhelmed — не справляться"
      - "to be swamped — быть заваленным"
    dialogue:
      - "Ana: ¿Cómo va el hospital? Te noto agotado. | Как дела в больнице? Ты выглядишь измотанным."
      - "Pablo: Mal. No damos abasto. | Плохо. Мы не справляемся."
      - "Ana: ¿Hay tanta gente? | Что, так много людей?"
      - "Pablo: Las urgencias están hasta los topes y el celador no da abasto con las camillas. | Скорая забита до предела, и санитар не успевает возить носилки."
      - "Ana: ¿Y los médicos? | А врачи?"
      - "Pablo: Tampoco. Hace semanas que reclaman más personal, pero no pasa nada. | Тоже. Уже несколько недель просят больше персонала, но ничего не меняется."
      - "Ana: Qué injusto. Tendríais que quejaros. | Какая несправедливость. Вам стоило бы пожаловаться."
      - "Pablo: Lo hacemos, pero con paciencia. Los cambios tardan mucho. | Жалуемся, но терпеливо. Перемены идут очень долго."
    cefr: "B2."
    frequency: "Частое в новостях и разговоре."
    collocations:
      - "no dar abasto con — не справляться с"
      - "no dar abasto a — не успевать"
      - "no dar abasto con el trabajo — не справляться с работой"
    collocation_example: "No damos abasto con tantos pacientes. — Мы не справляемся с таким количеством больных."
    trap: "Это неизменное выражение: abasto не меняется. Не пишите «a basto» раздельно: abasto — одно слово. С чем не справляются — con: no doy abasto con."

  - word: atender
    ru: принять, обслужить, оказать помощь
    ipa: /atenˈdeɾ/
    say: атэндэ́р
    pron: "d между гласными мягкое [ð]. Спрягается e → ie: atiendo, atiendes."
    meaning: "Заниматься человеком или делом: принять посетителя, обслужить клиента, оказать помощь больному. Ещё — «ответить на звонок»."
    examples:
      - "Atienda a esta señora primero, por favor. — Обслужите эту сеньору первой, пожалуйста."
      - "No pude atender el teléfono porque tenía las manos ocupadas con la comida. — Я не смог ответить на звонок, потому что руки были заняты едой."
      - "El médico atiende a los pacientes por orden de llegada, excepto en los casos urgentes. — Врач принимает пациентов в порядке очерёдности, кроме срочных случаев."
    origin: "Из лат. attendere «направлять внимание»: ad- «к» + tendere «тянуть». Отсюда и atención «внимание», atento «внимательный»."
    register: "Нейтральное."
    synonyms:
      - word: ocuparse de
        pair: ["El enfermero atiende al paciente.", "El enfermero se ocupa del paciente."]
        diff:
          - "ocuparse de — «заниматься чем-то или кем-то» вообще"
          - "atender — именно принять и обслужить"
    analogs:
      - "to attend to — заниматься, обслуживать"
      - "to take care of — позаботиться"
    dialogue:
      - "Ana: ¿Ya te han atendido? | Тебя уже приняли?"
      - "Pablo: No, todavía espero. Dicen que tengo para rato. | Нет, всё ещё жду. Говорят, ждать долго."
      - "Ana: ¿Hay mucha gente? | Много людей?"
      - "Pablo: Sí, la enfermera atiende primero a los más graves. | Да, медсестра сначала принимает самых тяжёлых."
      - "Ana: Es lo justo. ¿Qué te duele? | Это справедливо. Что у тебя болит?"
      - "Pablo: El tobillo. Me caí de bruces en la calle y no puedo apoyar el pie. | Лодыжка. Я упал лицом вниз на улице и не могу наступить на ногу."
      - "Ana: Pues pide que te atiendan pronto, por si es una fractura. | Тогда проси, чтобы тебя приняли скорее, вдруг перелом."
      - "Pablo: Eso voy a hacer en cuanto vuelva la doctora. | Именно так и сделаю, как только вернётся докторка."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "atender a un paciente — принять больного"
      - "atender el teléfono — ответить на звонок"
      - "atender a un cliente — обслужить клиента"
    collocation_example: "Me atendió una enfermera muy amable. — Меня принимала очень любезная медсестра."
    trap: "Перед человеком нужен a: atender a alguien. Ложный друг английского to attend «посещать»: «посетить» по-испански — asistir a."

  - word: arremolinarse
    ru: толпиться, собираться кучей
    ipa: /aremoliˈnaɾse/
    say: аррэмолина́рсэ
    pron: "rr — раскатистое."
    meaning: "О людях: собираться тесной толпой вокруг чего-то или кого-то. О воздухе и воде — «закручиваться в вихрь»."
    examples:
      - "Los turistas se arremolinaron junto a la fuente. — Туристы столпились у фонтана."
      - "Los curiosos se arremolinaban alrededor del coche mientras llegaba la policía. — Любопытные толпились вокруг машины, пока приезжала полиция."
      - "La gente se arremolinó en la entrada para ver mejor a los actores que llegaban. — Люди столпились у входа, чтобы лучше увидеть приезжающих актёров."
    origin: "remolino «водоворот, вихрь» (от remolinar) с приставкой a- и возвратным -se: люди «закручиваются» вокруг центра."
    register: "Нейтральное, чуть литературное."
    synonyms:
      - word: agolparse
        pair: ["Los curiosos se arremolinaron.", "Los curiosos se agolparon."]
        diff:
          - "agolparse — «скопиться, нахлынуть» разом, ещё сильнее подчёркивает давку"
    analogs:
      - "to crowd around — собираться толпой"
      - "to swirl — кружиться вихрем"
    dialogue:
      - "Cuando abrieron las puertas, la gente se arremolinó para entrar. | Когда открыли двери, люди столпились, чтобы войти."
      - "Nadie esperaba su turno; todos empujaban con prisa. | Никто не ждал своей очереди, все толкались, торопясь."
      - "Un guardia intentaba poner orden, pero había demasiado follón. | Охранник пытался навести порядок, но суматохи было слишком много."
      - "Una señora mayor, aturdida, casi se cayó de bruces. | Пожилая женщина, оглушённая, чуть не упала лицом вниз."
      - "Dos jóvenes la ayudaron a levantarse y la llevaron a un banco. | Двое молодых людей помогли ей встать и отвели к скамье."
      - "Poco a poco, la multitud se despejó y se formó una cola. | Мало-помалу толпа рассосалась, и выстроилась очередь."
      - "Al final, hasta los más impacientes tuvieron que armarse de paciencia. | В конце концов даже самым нетерпеливым пришлось запастись терпением."
    cefr: "C1."
    frequency: "Нечастое: из художественных текстов и новостей."
    collocations:
      - "arremolinarse alrededor de — столпиться вокруг"
      - "arremolinarse en la puerta — толпиться у двери"
      - "un remolino de gente — водоворот людей"
    collocation_example: "Los periodistas se arremolinaron alrededor del ministro. — Журналисты столпились вокруг министра."
    trap: "Это возвратный глагол: se arremolinó, а не arremolinó. Не путайте с remolino «водоворот» и remolcar «буксировать»."

  - word: despejarse
    ru: освободиться, расчиститься
    ipa: /despeˈxaɾse/
    say: дэспэха́рсэ
    pron: "j — «х»: despejarse — «дэспэхáрсэ»."
    meaning: "О месте или небе: стать свободным, расчиститься. О голове — прийти в себя, проясниться."
    examples:
      - "Por la tarde el cielo se despejó. — К вечеру небо прояснилось."
      - "Salí a caminar un rato para despejarme antes de seguir con el trabajo. — Я вышел немного пройтись, чтобы проветрить голову, прежде чем продолжить работу."
      - "La sala de espera se despejó poco a poco cuando fueron llamando a los pacientes. — Зал ожидания постепенно освободился, когда стали вызывать пациентов."
    origin: "От despejar «расчищать, освобождать»: избавлять место от препятствий. Родственное: despejado «ясный, свободный»."
    register: "Нейтральное."
    synonyms:
      - word: aclararse
        pair: ["El cielo se despejó.", "El cielo se aclaró."]
        diff:
          - "aclararse — «стать светлее, яснее», но не освободиться от людей и вещей"
    analogs:
      - "to clear up — проясниться, освободиться"
      - "to clear one's head — проветрить голову"
    dialogue:
      - "Ana: ¿Ya hay sitio en la sala de espera? | В зале ожидания уже есть место?"
      - "Pablo: Sí, se despejó hace un rato. Ven, siéntate aquí. | Да, недавно освободилось. Иди, садись сюда."
      - "Ana: Menos mal. Esta mañana estaba hasta los topes. | Слава богу. Сегодня утром было забито до отказа."
      - "Pablo: Sí, y ahora ni un alma. Se oye hasta el murmullo del aire acondicionado. | Да, а теперь ни души. Слышно даже гул кондиционера."
      - "Ana: ¿Y el cielo? Parecía que iba a llover. | А небо? Казалось, пойдёт дождь."
      - "Pablo: Se despejó por la tarde. Ahora está soleado. | Прояснилось после обеда. Сейчас солнечно."
      - "Ana: Qué bien, así podremos volver sin mojarnos. | Как хорошо, так мы вернёмся и не промокнем."
      - "Pablo: Y con el humor menos oscuro, ¿verdad? | И с настроением поменьше мрачным, да?"
    cefr: "B2."
    frequency: "Частое: в погоде, в быту, в медицине."
    collocations:
      - "despejarse el cielo — проясниться (о небе)"
      - "despejar la mente — проветрить голову"
      - "despejar el camino — расчистить дорогу"
    collocation_example: "Un paseo me ayuda a despejar la mente. — Прогулка помогает мне проветрить голову."
    trap: "Despejado — и «ясный» (о небе), и «бодрый» (о человеке): Estoy despejado значит «я в ясном сознании». Не путайте с despedir «увольнять»."

  - word: follón
    ru: бардак, суматоха
    ipa: /foˈʎon/
    say: фойо́н
    pron: "ll в большинстве регионов — как «й», в части Испании — «льй»."
    meaning: "Шумный беспорядок, суматоха, спор или путаница. Разговорное слово из Испании."
    examples:
      - "¡Menudo follón había en la estación! — Какая суматоха была на вокзале!"
      - "Se armó un buen follón cuando se cortó la luz en pleno concierto. — Поднялась настоящая суматоха, когда посреди концерта выключили свет."
      - "¡Qué follón hay en urgencias! Hay camillas por todos los pasillos y nadie nos atiende. — Какая суматоха в приёмном отделении! Каталки во всех коридорах, и нас никто не принимает."
    origin: "Происхождение спорное. Родственное слово — follonero «скандалист, зачинщик беспорядка»."
    register: "Разговорное, фамильярное. В официальной речи лучше confusión или desorden."
    synonyms:
      - word: jaleo
        pair: ["Hay un follón enorme.", "Hay un jaleo enorme."]
        diff:
          - "jaleo — шумная суматоха, но чаще весёлая, как на празднике"
          - "follón — неприятный бардак, спор, неразбериха"
    analogs:
      - "mess — беспорядок"
      - "commotion — шумиха, суматоха"
    dialogue:
      - "Ana: ¿Por qué hay tanto ruido? | Почему так шумно?"
      - "Pablo: Se ha armado un follón en la entrada. | У входа поднялась суматоха."
      - "Ana: ¿Qué ha pasado? ¿Otro choque? | Что случилось? Опять авария?"
      - "Pablo: No, es una discusión. Un hombre quería pasar sin esperar su turno. | Нет, это спор. Один мужчина хотел пройти без очереди."
      - "Ana: ¡Menudo desconcierto! ¿Y los guardias? | Ну и растерянность! А охранники?"
      - "Pablo: Ya vienen. Se arremolina la gente y nadie escucha. | Уже идут. Люди толпятся, и никто никого не слушает."
      - "Ana: Sinceramente, qué falta de respeto. | Честно говоря, какое неуважение."
      - "Pablo: Tienes razón, pero mejor no te metas en ese lío. | Ты права, но лучше не лезь в эту историю."
    cefr: "B2."
    frequency: "Очень частое в разговоре в Испании."
    collocations:
      - "armar un follón — устроить бардак"
      - "meterse en un follón — влипнуть в историю"
      - "qué follón — какой бардак"
    collocation_example: "Se armó un follón tremendo en la reunión. — На собрании поднялся жуткий шум."
    trap: "Слово разговорное и испанское: в Латинской Америке чаще lío или desorden. Родственное follonero — это «скандалист»."

  - word: estar a punto de
    ru: быть вот-вот готовым сделать
    ipa: /esˈtaɾ a ˈpunto de/
    say: эста́р а пу́нто дэ
    meaning: "Вот-вот сделать что-то или вот-вот случиться: «чуть не», «на грани». После de — инфинитив."
    examples:
      - "Estuve a punto de llamarte ayer. — Я чуть было не позвонил тебе вчера."
      - "El tren estaba a punto de partir cuando llegué corriendo a la estación. — Поезд вот-вот должен был отправиться, когда я подбежал к вокзалу."
      - "Estoy a punto de salir, así que si quieres que te lleve, ven ahora mismo. — Я вот-вот выхожу, так что, если хочешь, чтобы я тебя подвёз, приходи прямо сейчас."
    origin: "punto «точка, момент» + estar a «находиться в». Дословно «быть на пороге момента»."
    register: "Нейтральное, годится везде."
    synonyms:
      - word: ir a + infinitivo
        pair: ["Estoy a punto de salir.", "Voy a salir ya."]
        diff:
          - "ir a — просто ближайшее будущее"
          - "estar a punto de — совсем скоро, вот-вот, часто чуть не"
    analogs:
      - "to be about to — быть готовым сделать"
      - "to be on the verge of — быть на грани"
    dialogue:
      - "Ana: ¿Ya llegas? | Ты уже подъезжаешь?"
      - "Pablo: Estoy a punto de entrar en la ciudad. | Я вот-вот въеду в город."
      - "Ana: Estuve a punto de llamarte hace un rato. | Я чуть было не позвонила тебе недавно."
      - "Pablo: ¿Por qué? ¿Pasó algo? | Почему? Что-то случилось?"
      - "Ana: Nada grave. Es que el abuelo estaba a punto de recibir el alta y se puso nervioso. | Ничего серьёзного. Просто дедушку вот-вот должны были выписать, и он разволновался."
      - "Pablo: Bueno, es normal. Después de tantos días en cama, cualquiera se alteraría. | Что ж, это нормально. После стольких дней в постели любой бы разволновался."
      - "Ana: Pues tranquilízalo cuando llegues. Contigo se calma. | Так успокой его, когда приедешь. С тобой он успокаивается."
      - "Pablo: Claro. Mira, ya estoy a punto de aparcar. | Конечно. Смотри, я уже почти паркуюсь."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "estar a punto de + инфинитив — быть готовым сделать"
      - "estar a punto de llorar — чуть не заплакать"
      - "estar a punto de terminar — вот-вот закончить"
    collocation_example: "Estaba a punto de llorar cuando oyó la noticia. — Она чуть не заплакала, когда услышала новость."
    trap: "После de — только инфинитив: a punto de llegar, а не a punto de llegando. Не забывайте de: «estoy a punto salir» — ошибка."

  - word: disuadir
    ru: отговорить
    ipa: /disuaˈðiɾ/
    say: дисуади́р
    pron: "d между гласными мягкое [ð]: disuadir — «дисуади́р»."
    meaning: "Убедить человека не делать что-то. Конструкция: disuadir a alguien de algo или de hacer algo."
    examples:
      - "Intentó disuadirme, pero no lo consiguió. — Он пытался меня отговорить, но не смог."
      - "Intenté disuadirlo de viajar solo en invierno, pero no hubo manera de convencerlo. — Я пытался отговорить его ехать одному зимой, но убедить его было невозможно."
      - "Nadie pudo disuadirla de su idea de abrir una librería en el centro del pueblo. — Никто не смог отговорить её от идеи открыть книжный магазин в центре села."
    origin: "Из лат. dissuadere: dis- «против» + suadere «убеждать». Антоним — persuadir «убедить» и convencer «убедить»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: quitar de la cabeza
        pair: ["Quiso disuadirlo del plan.", "Quiso quitarle el plan de la cabeza."]
        diff:
          - "quitar de la cabeza — разговорная форма «выбить из головы»"
    analogs:
      - "to dissuade — то же слово, книжное"
      - "to talk someone out of — отговорить, разговорное"
    dialogue:
      - "Ana: ¿Vas a irte hoy? | Ты уезжаешь сегодня?"
      - "Pablo: Sí, y nadie me disuade. | Да, и никто меня не отговорит."
      - "Ana: Tu madre lo intentó, ¿verdad? | Твоя мама пыталась, да?"
      - "Pablo: Intentó disuadirme, pero no lo consiguió. Estoy decidido. | Пыталась отговорить, но не вышло. Я решился."
      - "Ana: ¿No te da miedo arriesgarte tanto? | Тебе не страшно так рисковать?"
      - "Pablo: Un poco, pero pese a todo quiero probar. | Немного, но несмотря ни на что хочу попробовать."
      - "Ana: Entonces no te disuado. Solo te pido prudencia. | Тогда я не буду отговаривать. Прошу только осторожности."
      - "Pablo: Prometido. Te llamo en cuanto llegue. | Обещаю. Позвоню, как только приеду."
    cefr: "C1."
    frequency: "Средней частоты: в письменной речи и новостях."
    collocations:
      - "disuadir a alguien de algo — отговорить кого-то от чего-то"
      - "disuadir de hacer algo — отговорить что-то делать"
      - "efecto disuasorio — сдерживающий эффект"
    collocation_example: "Su madre lo disuadió de abandonar los estudios. — Мать отговорила его бросать учёбу."
    trap: "Нужно de: disuadir DE algo, а не disuadir algo. Не путайте с persuadir «убедить сделать»: это противоположное действие."

  - word: convenir
    ru: договариваться; подходить, быть выгодным
    ipa: /kombeˈniɾ/
    say: комбэни́р
    pron: "v читается как b; спрягается как venir: conviene, convienen."
    meaning: "Два значения: 1) договариваться о чём-то (convenir un precio); 2) подходить, быть полезным (me conviene esperar)."
    examples:
      - "Nos conviene salir temprano mañana. — Нам выгодно выйти рано завтра."
      - "No conviene salir ahora, porque hay mucho tráfico y llegaríamos tarde igualmente. — Сейчас не стоит выезжать, потому что много машин, и мы всё равно опоздаем."
      - "Me conviene esperar un poco antes de vender el piso, porque los precios están subiendo. — Мне выгодно немного подождать с продажей квартиры, потому что цены растут."
    origin: "Из лат. convenire «сходиться»: con- «вместе» + venire «приходить». Родственные: conveniente «подходящий», convenio «соглашение»."
    register: "Формальное и нейтральное."
    synonyms:
      - word: acordar
        pair: ["Convinieron una fecha.", "Acordaron una fecha."]
        diff:
          - "acordar — тоже «договариваться»; в Латинской Америке чаще"
          - "convenir — ещё и «подходить, быть выгодным»"
    analogs:
      - "to agree — договориться"
      - "to suit — подходить, быть выгодным"
    dialogue:
      - "Ana: ¿Quedamos mañana? | Увидимся завтра?"
      - "Pablo: Mejor el jueves, me conviene más. | Лучше в четверг, мне так удобнее."
      - "Ana: ¿Por qué? ¿Tienes mucho lío mañana? | Почему? У тебя много дел завтра?"
      - "Pablo: Sí, tengo cita con el médico y luego una reunión. | Да, у меня приём у врача, а потом встреча."
      - "Ana: Vale, pero conviene que reservemos mesa. El restaurante estará hasta los topes. | Хорошо, но стоит забронировать столик. В ресторане будет полно народу."
      - "Pablo: Buena idea. Y conviene salir temprano, por si hay tráfico. | Хорошая мысль. И выехать лучше пораньше — вдруг будут пробки."
      - "Ana: Lo anoto en la agenda. | Запишу в ежедневник."
      - "Pablo: Y yo en el móvil. Así nos vemos el jueves sin falta. | А я в телефон. Так мы увидимся в четверг обязательно."
    cefr: "B2."
    frequency: "Частое в деловой и письменной речи."
    collocations:
      - "convenir un precio — договориться о цене"
      - "me conviene — мне подходит"
      - "como convenga — как будет нужно"
    collocation_example: "Convinimos vernos el viernes. — Мы договорились встретиться в пятницу."
    trap: "Спрягается как venir: conviene, convino, convenga. В значении «подходить» часто безличный: no conviene hacerlo — «лучше этого не делать». Не путайте с convencer «убеждать»."

  - word: reclamar más personal sanitario
    ru: запросить больше медперсонала
    ipa: /reklaˈmaɾ mas peɾsoˈnal saniˈtaɾjo/
    say: рэклама́р мас пэрсона́ль санита́рьо
    meaning: "Потребовать, чтобы в больнице было больше медицинских работников. Reclamar — требовать то, на что есть право."
    examples:
      - "Los médicos reclaman más personal sanitario. — Врачи требуют больше медицинского персонала."
      - "Los sindicatos reclaman más personal sanitario para los hospitales de la región. — Профсоюзы требуют больше медицинского персонала для больниц региона."
      - "En la manifestación se reclamó más personal sanitario y mejores salarios para las enfermeras. — На демонстрации требовали больше медицинских работников и лучших зарплат для медсестёр."
    origin: "reclamar от лат. reclamare «кричать против»: re- «снова» + clamare «кричать». personal sanitario — «медицинский персонал» (sanitario от лат. sanitas «здоровье»)."
    register: "Формальное, язык новостей и профсоюзов."
    synonyms:
      - word: exigir
        pair: ["Reclaman más personal.", "Exigen más personal."]
        diff:
          - "exigir — требовать жёстче, как приказ"
          - "reclamar — требовать то, что положено, и обращаться с просьбой"
    analogs:
      - "to demand more staff — требовать больше персонала"
      - "to call for — призвать, потребовать"
    dialogue:
      - "Ana: ¿Qué piden los médicos? | Чего требуют врачи?"
      - "Pablo: Reclaman más personal sanitario. | Требуют больше медперсонала."
      - "Ana: ¿Por qué ahora? | Почему сейчас?"
      - "Pablo: Porque no dan abasto. Las urgencias están llenas cada noche. | Потому что не справляются. Скорая заполнена каждую ночь."
      - "Ana: ¿Y los celadores también se quejan? | А санитары тоже жалуются?"
      - "Pablo: Sí, y las enfermeras sufren mucho cansancio. | Да, и медсёстры сильно устают."
      - "Ana: ¿Hacen huelga? | Они бастуют?"
      - "Pablo: Todavía no, pero reclamarán con más firmeza si no les hacen caso. | Пока нет, но будут требовать твёрже, если их не услышат."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "reclamar derechos — требовать права"
      - "reclamar una solución — требовать решения"
      - "personal sanitario — медицинский персонал"
    collocation_example: "El sindicato reclama más recursos. — Профсоюз требует больше ресурсов."
    trap: "Personal — слово мужского рода без множественного: el personal sanitario, а не «los personales». Reclamar — не «рекламировать»: «рекламировать» — anunciar."

  - word: armarse de paciencia
    ru: запастись терпением
    ipa: /aɾˈmaɾse de paˈθjenθja/
    say: арма́рсэ дэ пасье́нсья
    pron: "c/z в Испании — [θ]: pa-θjen-θja."
    meaning: "Приготовиться терпеливо ждать или терпеть что-то неприятное. Дословно «вооружиться терпением»."
    examples:
      - "Con tres hijos hay que tener mucha paciencia. — С тремя детьми нужно иметь много терпения."
      - "Me armé de paciencia y esperé tres horas en la sala sin quejarme. — Я запасся терпением и ждал три часа в зале, не жалуясь."
      - "Hay que armarse de paciencia con los trámites del banco, porque siempre piden otro papel. — С банковскими формальностями нужно запастись терпением, потому что всегда просят ещё одну бумагу."
    origin: "armarse «вооружаться» (от arma «оружие») + de «чем» + paciencia (лат. patientia «терпение»). Образ: терпение как оружие в борьбе с ожиданием."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: tener paciencia
        pair: ["Tuve que armarme de paciencia.", "Tuve que tener paciencia."]
        diff:
          - "tener paciencia — просто «потерпеть»"
          - "armarse de paciencia — подчёркивает усилие и подготовку"
    analogs:
      - "to steel oneself — собраться с духом"
      - "to be patient — быть терпеливым"
    dialogue:
      - "Ana: ¿Cuánto tardan las pruebas? | Сколько занимают анализы?"
      - "Pablo: Mucho. Hay que armarse de paciencia. | Много. Нужно запастись терпением."
      - "Ana: ¿Un día? ¿Dos? | День? Два?"
      - "Pablo: Como mínimo tres. Y hasta dentro de unos días no nos dirán nada. | Минимум три. И пока не пройдёт несколько дней, нам ничего не скажут."
      - "Ana: Qué agobio. Yo me armo de paciencia con los niños, pero con esto no puedo. | Какая тоска. С детьми я запасаюсь терпением, а тут не могу."
      - "Pablo: Piensa en cosas bonitas. Un paseo, un café... | Думай о приятном. Прогулка, кофе..."
      - "Ana: Tienes razón. Voy a tomar un respiro. | Ты прав. Пойду немного передохну."
      - "Pablo: Aprovecha, que aquí vamos a tener para rato. | Пользуйся, мы тут надолго."
    cefr: "B2."
    frequency: "Частое в разговорной речи."
    collocations:
      - "armarse de valor — собраться с духом"
      - "armarse de paciencia — запастись терпением"
      - "armarse hasta los dientes — вооружиться до зубов"
    collocation_example: "Me armé de valor y le dije la verdad. — Я собрался с духом и сказал ему правду."
    trap: "Нужен предлог de: armarse DE paciencia, а не «con paciencia». Глагол возвратный: me armo, te armas."
