# Второй список автора, часть 2 — существительные (расследование, деньги, работа, чувства).
lang: es
words:
  - word: chantaje
    ru: шантаж
    ipa: /tʃanˈtaxe/
    say: чанта́хэ
    pron: "ch — «ч», j — хриплое [x]."
    meaning: "Шантаж — угроза раскрыть тайну или навредить, чтобы получить деньги или выгоду."
    examples:
      - "Es víctima de un chantaje. — Он жертва шантажа."
      - "Eso es chantaje. — Это шантаж."
    origin: "Из французского chantage, от chanter «петь»: шантажист «заставляет петь» жертву. Глагол — chantajear."
    register: "Нейтральное."
    synonyms:
      - word: extorsión
        pair: ["Lo acusaron de chantaje.", "Lo acusaron de extorsión."]
        diff:
          - "extorsión — юридический термин: «вымогательство»"
    analogs:
      - "blackmail — шантаж"
    dialogue:
      - "Inspectora: ¿Le pedían dinero? | У вас требовали денег?"
      - "Testigo: Sí. Era un chantaje, pero no me atreví a denunciarlo. | Да. Это был шантаж, но я не решился заявить."
    cefr: "B2."
    frequency: "Средняя: детективы, новости."
    collocations:
      - "hacer chantaje — шантажировать"
      - "chantaje emocional — эмоциональный шантаж"
      - "ceder al chantaje — поддаться шантажу"
    collocation_example: "No pienso ceder al chantaje. — Я не собираюсь поддаваться шантажу."
    trap: "chantaje — мужского рода: el chantaje. Пишется с j."

  - word: testigo
    ru: свидетель
    ipa: /tesˈtiɣo/
    say: тэсти́го
    pron: "g между гласными мягкое [ɣ]."
    meaning: "Свидетель — тот, кто видел событие или даёт показания. Одна форма для мужчины и женщины: el testigo, la testigo."
    examples:
      - "Hay un testigo del crimen. — Есть свидетель преступления."
      - "Fui testigo del accidente. — Я был свидетелем аварии."
    origin: "Лат. testis «свидетель». Родственные: testimonio «показания», atestiguar «свидетельствовать», «тест»."
    register: "Нейтральное, юридическое."
    synonyms: []
    analogs:
      - "witness — свидетель"
    dialogue:
      - "Inspectora: ¿Hay algún testigo? | Есть свидетели?"
      - "Marcos: Sí, una vecina. Dice que reconoció al asesino. | Да, соседка. Говорит, что узнала убийцу."
    cefr: "B1."
    frequency: "Частое в новостях и детективах."
    collocations:
      - "ser testigo de algo — быть свидетелем чего-то"
      - "un testigo presencial — очевидец"
      - "testigo de boda — свидетель на свадьбе"
    collocation_example: "Mi hermano fue testigo de boda. — Мой брат был свидетелем на свадьбе."
    trap: "О женщине — la testigo, без формы testiga. Свидетель чего — de: testigo **del** robo."

  - word: comisaría
    ru: полицейский участок
    ipa: /komisaˈɾi.a/
    say: комисари́я
    pron: "Ударение на í, и ia — два слога: co-mi-sa-rí-a."
    meaning: "Полицейский участок, отделение полиции."
    examples:
      - "Fui a la comisaría a poner una denuncia. — Я пошёл в участок подать заявление."
      - "Lo llevaron a comisaría. — Его отвезли в участок."
    origin: "От comisario «комиссар», лат. committere «поручать». Родственное: comisario «комиссар полиции»."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "police station — полицейский участок"
    dialogue:
      - "Lucía: ¿Dónde está la comisaría más cercana? | Где ближайший участок?"
      - "Marcos: Al final de la calle. ¿Por qué? | В конце улицы. А что?"
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "ir a comisaría — пойти в участок"
      - "llevar a comisaría — доставить в участок"
      - "denunciar en comisaría — заявить в участке"
    collocation_example: "Tuve que ir a comisaría. — Мне пришлось пойти в участок."
    trap: "Ударение на í: comisaría. В Латинской Америке чаще говорят estación de policía."

  - word: interrogatorio
    ru: допрос
    ipa: /interoɣaˈtoɾjo/
    say: интэрогато́рьё
    pron: "rr — раскатистое [r], g между гласными мягкое [ɣ]."
    meaning: "Допрос подозреваемого или свидетеля; в переносном смысле — расспросы."
    examples:
      - "El interrogatorio duró tres horas. — Допрос длился три часа."
      - "¿Qué es esto, un interrogatorio? — Это что, допрос?"
    origin: "От interrogar «допрашивать» (лат. inter + rogare «спрашивать»). Родственное: signo de interrogación «вопросительный знак»."
    register: "Нейтральное, юридическое."
    synonyms: []
    analogs:
      - "interrogation — допрос"
      - "questioning — расспросы"
    dialogue:
      - "Ana: Me haces muchas preguntas. ¿Es un interrogatorio? | Ты задаёшь много вопросов. Это допрос?"
      - "Pablo: No, solo quiero averiguar la verdad. | Нет, просто хочу выяснить правду."
    cefr: "B2."
    frequency: "Средняя: детективы, сериалы."
    collocations:
      - "someter a un interrogatorio — подвергнуть допросу"
      - "la sala de interrogatorios — комната для допросов"
      - "interrogar a un sospechoso — допросить подозреваемого"
    collocation_example: "Interrogaron al sospechoso toda la noche. — Подозреваемого допрашивали всю ночь."
    trap: "Пишется с rr: interrogatorio. Глагол — interrogar, не «interrogatorar»."

  - word: pista
    ru: зацепка, след
    ipa: /ˈpista/
    say: пи́ста
    meaning: "Зацепка, подсказка в расследовании или загадке. Ещё — дорожка, корт, взлётная полоса, танцпол."
    examples:
      - "La policía no tiene ninguna pista. — У полиции нет ни одной зацепки."
      - "Dame una pista. — Дай подсказку."
    origin: "Из итальянского pista «след, тропа». Отсюда и значения «дорожка, полоса»."
    register: "Нейтральное."
    synonyms:
      - word: indicio
        pair: ["Encontraron una pista.", "Encontraron un indicio."]
        diff:
          - "indicio — книжнее: «признак, улика»"
    analogs:
      - "clue — зацепка, подсказка"
      - "lead — след в расследовании"
    dialogue:
      - "Marcos: ¿Tenemos alguna pista? | У нас есть зацепки?"
      - "Inspectora: Sí, fíjese en esta firma. | Да, обратите внимание на эту подпись."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "seguir la pista — идти по следу"
      - "dar una pista — дать подсказку"
      - "la pista de baile — танцпол"
    collocation_example: "Te doy una pista: empieza por A. — Даю подсказку: начинается на А."
    trap: "pista — не «пистолет» (pistola). И не путайте с prueba: pista — зацепка, prueba — доказательство."

  - word: prueba
    ru: доказательство
    ipa: /ˈpɾweβa/
    say: пруэ́ба
    pron: "ue — одним слогом «уэ», b между гласными мягкое [β]."
    meaning: "Доказательство, улика. Ещё — проба, тест, экзамен, примерка."
    examples:
      - "No hay pruebas contra él. — Против него нет доказательств."
      - "Mañana tengo una prueba de inglés. — Завтра у меня тест по английскому."
    origin: "От probar «пробовать, доказывать» (лат. probare). Родственные: probable, comprobar «проверять»."
    register: "Нейтральное."
    synonyms:
      - word: evidencia
        pair: ["Tenemos pruebas.", "Tenemos evidencias."]
        diff:
          - "evidencia — в Испании скорее «очевидность»; «улика» — калька с английского, чаще в Латинской Америке"
    analogs:
      - "proof / evidence — доказательство"
      - "test — тест, проба"
    dialogue:
      - "Lucía: Estoy segura de que es culpable. | Я уверена, что он виновен."
      - "Marcos: Puede ser, pero necesitamos pruebas. | Может быть, но нам нужны доказательства."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "una prueba de… — доказательство чего-то"
      - "a prueba de agua — водонепроницаемый"
      - "poner a prueba — испытать"
    collocation_example: "Esta situación pone a prueba nuestra paciencia. — Эта ситуация испытывает наше терпение."
    trap: "«Доказательства» в смысле улик — обычно во множественном: no hay pruebas. Не путайте с probar «пробовать»."

  - word: remitente
    ru: отправитель
    ipa: /remiˈtente/
    say: рэмитэ́нтэ
    pron: "r в начале — раскатистое."
    meaning: "Отправитель письма или посылки. Получатель — destinatario."
    examples:
      - "La carta no tiene remitente. — На письме нет отправителя."
      - "Escribe el remitente aquí. — Напиши отправителя здесь."
    origin: "От remitir «отправлять» (лат. remittere). Родственное: remitir «отсылать»."
    register: "Нейтральное, официальное."
    synonyms: []
    analogs:
      - "sender — отправитель"
    dialogue:
      - "Inspectora: ¿Quién es el remitente? | Кто отправитель?"
      - "Marcos: No lo sé. Solo hay una firma. | Не знаю. Есть только подпись."
    cefr: "B1."
    frequency: "Средняя: почта, электронная почта."
    collocations:
      - "remitente desconocido — неизвестный отправитель"
      - "devolver al remitente — вернуть отправителю"
      - "el remitente y el destinatario — отправитель и получатель"
    collocation_example: "Devolvieron el paquete al remitente. — Посылку вернули отправителю."
    trap: "Отправитель — remitente, получатель — destinatario. Не путайте их."

  - word: firma
    ru: подпись
    ipa: /ˈfiɾma/
    say: фи́рма
    meaning: "Подпись на документе. Ещё — фирма, компания."
    examples:
      - "Falta tu firma. — Не хватает твоей подписи."
      - "Trabaja en una firma de abogados. — Он работает в юридической фирме."
    origin: "От firmar «подписывать», лат. firmare «укреплять»: подпись «закрепляет» документ. Родственные: firme «твёрдый», firmeza."
    register: "Нейтральное."
    synonyms:
      - word: rúbrica
        pair: ["Puso su firma.", "Puso su rúbrica."]
        diff:
          - "rúbrica — книжное: росчерк в подписи"
    analogs:
      - "signature — подпись"
      - "firm — фирма"
    dialogue:
      - "Lucía: Esta firma no es suya. | Это не его подпись."
      - "Marcos: ¿Estás segura? Parece la misma. | Ты уверена? Выглядит так же."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "poner la firma — поставить подпись"
      - "recoger firmas — собирать подписи"
      - "falsificar una firma — подделать подпись"
    collocation_example: "Falsificó la firma de su jefe. — Он подделал подпись начальника."
    trap: "Главное значение — «подпись», а не «фирма»: «компания» чаще empresa. Глагол — firmar."

  - word: contraseña
    ru: пароль
    ipa: /kontɾaˈseɲa/
    say: контрасэ́нья
    pron: "ñ — «нь»."
    meaning: "Пароль к аккаунту, устройству или тайный знак при входе."
    examples:
      - "He olvidado mi contraseña. — Я забыл пароль."
      - "Cambia la contraseña. — Смени пароль."
    origin: "contra «против, в ответ» + seña «знак»: «ответный знак» часового."
    register: "Нейтральное."
    synonyms:
      - word: clave
        pair: ["¿Cuál es la contraseña?", "¿Cuál es la clave?"]
        diff:
          - "clave — «ключ, код», шире: и пароль, и PIN"
    analogs:
      - "password — пароль"
    dialogue:
      - "Ana: ¿Me dices la contraseña del wifi? | Скажешь пароль от вайфая?"
      - "Pablo: Claro, está en la nevera. | Конечно, он на холодильнике."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "olvidar la contraseña — забыть пароль"
      - "cambiar la contraseña — сменить пароль"
      - "una contraseña segura — надёжный пароль"
    collocation_example: "Usa una contraseña segura. — Используй надёжный пароль."
    trap: "Пишется с ñ: contraseña. «Логин» — usuario."

  - word: expediente
    ru: дело, досье
    ipa: /ekspeˈðjente/
    say: экспэдье́нтэ
    pron: "x — «кс», d между гласными мягкое [ð]."
    meaning: "Дело, досье — папка документов о человеке или случае. Ещё: успеваемость (expediente académico)."
    examples:
      - "Abrieron un expediente. — Завели дело."
      - "Tiene un expediente limpio. — У него чистое досье."
    origin: "Лат. expedire «распутывать, решать». Родственные: expedir «выдавать (документ)», expedición."
    register: "Официальное, юридическое."
    synonyms:
      - word: archivo
        pair: ["Busca su expediente.", "Busca su archivo."]
        diff:
          - "archivo — архив, файл, шире"
    analogs:
      - "file / record — дело, досье"
    dialogue:
      - "Inspectora: Tráigame el expediente del viudo. | Принесите мне дело вдовца."
      - "Marcos: Aquí está. Tiene relación con un caso de chantaje. | Вот оно. Связано с делом о шантаже."
    cefr: "B2."
    frequency: "Средняя: работа, суд, учёба."
    collocations:
      - "abrir un expediente — завести дело"
      - "expediente académico — выписка оценок"
      - "un expediente de despido — процедура увольнения"
    collocation_example: "Tiene un expediente académico excelente. — У него отличная успеваемость."
    trap: "Это не «экспедиция» (expedición). Пишется с x."

  - word: delito
    ru: преступление, правонарушение
    ipa: /deˈlito/
    say: дэли́то
    meaning: "Преступление, правонарушение — любое нарушение закона, от кражи до мошенничества."
    examples:
      - "Robar es un delito. — Красть — преступление."
      - "Cometió un delito grave. — Он совершил тяжкое преступление."
    origin: "Лат. delictum «проступок», от delinquere «провиниться». Родственные: delincuente, delinquir."
    register: "Нейтральное, юридическое."
    synonyms:
      - word: crimen
        pair: ["Es un delito.", "Es un crimen."]
        diff:
          - "crimen — тяжкое, обычно убийство"
          - "delito — любое правонарушение"
    analogs:
      - "offence / crime — правонарушение"
    dialogue:
      - "Lucía: ¿Leer su correo es un delito? | Читать его почту — преступление?"
      - "Marcos: Sí, y sin su contraseña es imposible. | Да, и без его пароля это невозможно."
    cefr: "B1."
    frequency: "Частое в новостях."
    collocations:
      - "cometer un delito — совершить правонарушение"
      - "un delito grave — тяжкое преступление"
      - "delito fiscal — налоговое преступление"
    collocation_example: "Es un delito fiscal. — Это налоговое преступление."
    trap: "delito — мужского рода: el delito. Не путайте с delicia «наслаждение»."

  - word: delincuente
    ru: преступник
    ipa: /deliŋˈkwente/
    say: дэлинкуэ́нтэ
    pron: "n перед c — носовое [ŋ], cu — «ку»."
    meaning: "Преступник, правонарушитель. Одна форма: el delincuente, la delincuente."
    examples:
      - "Detuvieron al delincuente. — Преступника задержали."
      - "Es un delincuente peligroso. — Это опасный преступник."
    origin: "От delinquir «совершать преступление» (лат. delinquere). Родственные: delito, delincuencia «преступность»."
    register: "Нейтральное, юридическое."
    synonyms:
      - word: criminal
        pair: ["Es un delincuente.", "Es un criminal."]
        diff:
          - "criminal — звучит тяжелее"
    analogs:
      - "offender / criminal — преступник"
    dialogue:
      - "Ana: ¿Ese hombre es un delincuente? | Этот человек преступник?"
      - "Pablo: Aparentemente sí. Tiene un expediente enorme. | По-видимому, да. У него огромное досье."
    cefr: "B1."
    frequency: "Частое в новостях."
    collocations:
      - "un delincuente juvenil — малолетний преступник"
      - "detener a un delincuente — задержать преступника"
      - "la delincuencia — преступность"
    collocation_example: "La delincuencia ha bajado. — Преступность снизилась."
    trap: "Одна форма для обоих родов: la delincuente, не «delincuenta». Перед ним — a: detener **al** delincuente."

  - word: consecuencia
    ru: последствие
    ipa: /konseˈkwenθja/
    say: консэкуэ́нсья
    pron: "cu — «ку», c перед i в Испании — [θ]."
    meaning: "Последствие, результат. a consecuencia de — «вследствие»."
    examples:
      - "Asume las consecuencias. — Отвечай за последствия."
      - "Murió a consecuencia del accidente. — Он умер вследствие аварии."
    origin: "Лат. consequi «следовать за»: con + sequi. Родственные: conseguir «добиться», secuencia."
    register: "Нейтральное."
    synonyms:
      - word: resultado
        pair: ["Es la consecuencia de su decisión.", "Es el resultado de su decisión."]
        diff:
          - "resultado — нейтральнее"
          - "consecuencia — часто о плохом"
    analogs:
      - "consequence — последствие"
    dialogue:
      - "Lucía: No pienses en las consecuencias. | Не думай о последствиях."
      - "Marcos: No puedo. Soy demasiado prudente. | Не могу. Я слишком осторожный."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "tener consecuencias — иметь последствия"
      - "a consecuencia de — вследствие"
      - "en consecuencia — следовательно"
    collocation_example: "Esto tendrá consecuencias. — Это будет иметь последствия."
    trap: "Пишется с cu: consecuencia. «Вследствие» — a consecuencia **de**, с предлогом."

  - word: murmullo
    ru: гул, ропот
    ipa: /muɾˈmuʝo/
    say: мурму́йо
    pron: "ll — как «й» [ʝ]."
    meaning: "Тихий гул голосов, шёпот толпы; шелест воды или листьев."
    examples:
      - "Se oía un murmullo en la sala. — В зале слышался гул."
      - "El murmullo del río. — Журчание реки."
    origin: "Звукоподражание, лат. murmur. Родственные: murmurar «шептать, ворчать», русское «мурлыкать» тоже звукоподражание."
    register: "Книжное, описательное."
    synonyms:
      - word: susurro
        pair: ["Se oía un murmullo.", "Se oía un susurro."]
        diff:
          - "susurro — шёпот одного человека"
          - "murmullo — гул многих голосов"
    analogs:
      - "murmur — гул, ропот"
      - "hum — гул"
    dialogue:
      - "Ana: ¿Qué es ese murmullo? | Что это за гул?"
      - "Pablo: La gente se ha alborotado. Hay policía fuera. | Люди переполошились. На улице полиция."
    cefr: "C1 — литературное слово."
    frequency: "Средняя в книгах, редкая в речи."
    collocations:
      - "un murmullo de voces — гул голосов"
      - "el murmullo del agua — журчание воды"
      - "murmurar algo — пробормотать что-то"
    collocation_example: "Murmuró algo y se fue. — Он что-то пробормотал и ушёл."
    trap: "Пишется с ll: murmullo, а глагол — murmurar, с r. murmurar — ещё и «злословить»: murmurar de alguien."

  - word: actitud
    ru: отношение, поведение
    ipa: /aktiˈtuð/
    say: актиту́д
