# Четвёртый список автора, часть 7 — «Lola Lago: Una nota falsa» (слова 1–16).
lang: es
words:
  - word: secuestro
    ru: похищение
    ipa: /seˈkwestɾo/
    say: сэкуэ́стро
    pron: "ue — один слог «уэ»."
    meaning: "Захват человека силой, чтобы требовать выкуп или чего-то ещё. Ещё — «угон» самолёта (secuestro aéreo)."
    examples:
      - "El secuestro duró dos días enteros. — Похищение длилось целых два дня."
      - "El secuestro del avión terminó sin heridos después de una larga negociación en tierra. — Угон самолёта закончился без жертв после долгих переговоров на земле."
      - "La policía investiga el secuestro de un empresario que desapareció el lunes cuando iba al trabajo. — Полиция расследует похищение предпринимателя, который пропал в понедельник по дороге на работу."
    origin: "От secuestrar «похищать; арестовывать имущество» (лат. sequestrare «отдавать на хранение»). Родственное: secuestrador «похититель»."
    register: "Нейтральное, из новостей."
    synonyms:
      - word: rapto
        pair: ["Hubo un secuestro en el barrio.", "Hubo un rapto en el barrio."]
        diff:
          - "rapto — «похищение» с оттенком книжности; ещё «порыв»"
          - "secuestro — основное слово для похищения людей и угона"
    analogs:
      - "kidnapping — похищение"
      - "hijacking — угон"
    dialogue:
      - "Ana: ¿Qué ha pasado? | Что случилось?"
      - "Pablo: Ha habido un secuestro en el centro. | В центре произошло похищение."
      - "Ana: ¡Dios mío! ¿Quién? | Боже мой! Кого?"
      - "Pablo: Un empresario, al salir de su oficina. La policía lo busca, pero su paradero es desconocido. | Предпринимателя, когда он выходил из офиса. Полиция его ищет, но его местонахождение неизвестно."
      - "Ana: ¿Hay testigos? | Есть свидетели?"
      - "Pablo: Sí, uno balbuceó que lo metieron en una furgoneta. Estaba aturdido y asustado. | Да, один пробормотал, что его запихнули в фургон. Он был оглушён и напуган."
      - "Ana: Qué espeluznante. | Как жутко."
      - "Pablo: Todos los medios se hacen eco de la noticia. Habrá que esperar y albergar esperanzas. | Все СМИ подхватили новость. Остаётся ждать и надеяться."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "denunciar un secuestro — заявить о похищении"
      - "secuestro exprés — быстрое похищение ради выкупа"
      - "secuestro aéreo — угон самолёта"
    collocation_example: "El secuestro duró tres días. — Похищение длилось три дня."
    trap: "Не путайте secuestro «похищение» с sequestrar: правильно только secuestrar. Имущество «арестовывают» тоже secuestrar."

  - word: recado
    ru: поручение; сообщение
    ipa: /reˈkaðo/
    say: рэка́до
    pron: "d между гласными мягкое [ð]."
    meaning: "Небольшое поручение, которое нужно сделать (сходить в магазин, передать вещь) или записка, переданная через кого-то."
    examples:
      - "Hoy hago los recados de mi abuela. — Сегодня я выполняю поручения бабушки."
      - "Mi madre me manda a hacer los recados cada sábado por la mañana. — Мама посылает меня по поручениям каждую субботу утром."
      - "Tengo que hacer unos recados por el centro antes de ir a recoger a los niños al colegio. — Мне надо сделать несколько дел в центре, прежде чем забирать детей из школы."
    origin: "От старого recabdo «забота; поручение». Родственное по звучанию: recaudar «собирать (деньги)»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: encargo
        pair: ["Tengo un recado que hacer.", "Tengo un encargo que hacer."]
        diff:
          - "encargo — «заказ, поручение», более серьёзное"
          - "recado — мелкое бытовое поручение или передача слов"
    analogs:
      - "errand — мелкое поручение"
      - "message — сообщение, записка"
    dialogue:
      - "Ana: ¿Adónde vas? | Куда идёшь?"
      - "Pablo: A hacer unos recados. | Пойду по делам."
      - "Ana: ¿Qué recados? | Какие?"
      - "Pablo: Correos, la farmacia y el supermercado. Hoy hago los recados de mi abuela. | Почта, аптека и супермаркет. Сегодня я выполняю поручения бабушки."
      - "Ana: ¿Quieres que te acompañe? | Хочешь, пойду с тобой?"
      - "Pablo: Sí, así vamos más rápido. Y de paso, aprovechamos para comprar un bollo. | Да, так будет быстрее. И заодно купим булочку."
      - "Ana: ¿Dejó algún recado más? | Она оставила ещё какие-то поручения?"
      - "Pablo: Un recado para el vecino: que le avise cuanto antes del corte de agua. | Одно поручение для соседа: предупредить его как можно скорее об отключении воды."
    cefr: "B1."
    frequency: "Частое в разговоре."
    collocations:
      - "hacer un recado — сделать поручение"
      - "dejar un recado — оставить сообщение"
      - "mandar un recado — передать записку"
    collocation_example: "Déjale un recado en el contestador. — Оставь ему сообщение на автоответчике."
    trap: "Recado — «поручение», а не «рекомендация». Для «передать сообщение» в телефоне: dejar un recado. Не путайте с recaudar «собирать (деньги)»."

  - word: llevar las cuentas
    ru: вести счета
    ipa: /ʎeˈβaɾ las ˈkwentas/
    say: йэба́р лас куэ́нтас
    pron: "ll в большинстве регионов — как «й»; v читается как b; ue — один слог."
    meaning: "Следить за деньгами: записывать доходы и расходы, вести бухгалтерию. Cuentas — «счета, подсчёты»."
    examples:
      - "Ella lleva las cuentas del negocio. — Она ведёт счета фирмы."
      - "Mi hermano me lleva las cuentas del taller porque yo no entiendo de números. — Брат ведёт бухгалтерию моей мастерской, потому что я не разбираюсь в цифрах."
      - "Si no llevas las cuentas del hogar, al final del mes no sabes en qué se ha ido el dinero. — Если не вести домашний бюджет, то в конце месяца не знаешь, на что ушли деньги."
    origin: "llevar «вести, нести» + cuentas «счета» (от contar «считать»). Образ: «нести счёт» как груз ответственности."
    register: "Нейтральное, деловое."
    synonyms:
      - word: llevar la contabilidad
        pair: ["Lleva las cuentas del bar.", "Lleva la contabilidad del bar."]
        diff:
          - "llevar la contabilidad — официальнее: «вести бухгалтерию»"
          - "llevar las cuentas — разговорнее, и для домашних денег"
    analogs:
      - "to keep the accounts — вести счета"
      - "to do the books — вести бухгалтерию"
    dialogue:
      - "Ana: ¿Quién se ocupa del dinero? | Кто занимается деньгами?"
      - "Pablo: Mi socio lleva las cuentas. | Мой партнёр ведёт счета."
      - "Ana: ¿Y tú te fías? | И ты ему доверяешь?"
      - "Pablo: Sí, es muy concienzudo. Anota cada gasto y cada ingreso en su agenda. | Да, он очень добросовестный. Записывает каждый расход и каждый доход в свой ежедневник."
      - "Ana: Aun así, conviene revisarlas de vez en cuando. | И всё же стоит иногда их проверять."
      - "Pablo: Lo hacemos una vez al mes. Llevar las cuentas entre dos da más seguridad. | Раз в месяц. Вести счета вдвоём надёжнее."
      - "Ana: Con el fisco no se juega. | С налоговой не шутят."
      - "Pablo: Exacto. Por eso declaramos los impuestos puntualmente. | Именно. Поэтому мы вовремя декларируем налоги."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "llevar las cuentas — вести счета"
      - "pedir cuentas — требовать отчёта"
      - "a fin de cuentas — в конечном счёте"
      - "caer en la cuenta — сообразить"
    collocation_example: "A fin de cuentas, todo salió bien. — В конечном счёте, всё вышло хорошо."
    trap: "Cuenta — и «счёт» (в банке, за ужин), и «расчёт»: la cuenta, por favor — «счёт, пожалуйста». Не путайте llevar las cuentas с contar cuentos «рассказывать сказки»."

  - word: muela
    ru: коренной зуб
    ipa: /ˈmwela/
    say: муэ́ла
    pron: "ue — один слог «уэ»."
    meaning: "Крупный зуб сзади, которым жуют. Muela del juicio — «зуб мудрости»."
    examples:
      - "Me duele una muela desde ayer. — У меня со вчерашнего дня болит зуб."
      - "Tuvieron que sacarle una muela porque estaba muy picada y no se podía salvar. — Ему пришлось удалить коренной зуб, потому что он сильно испортился и его нельзя было спасти."
      - "Le salieron las muelas del juicio a los veinte años y casi no sintió ningún dolor. — Зубы мудрости у него прорезались в двадцать лет, и он почти не почувствовал боли."
    origin: "Из лат. mola «жёрнов, мельничный камень»: коренные зубы «перемалывают» еду. Родственное: molino «мельница», molar «коренной зуб»."
    register: "Нейтральное."
    synonyms:
      - word: molar
        pair: ["Le duele la muela.", "Le duele el molar."]
        diff:
          - "molar — медицинский термин"
          - "muela — разговорное слово «коренной зуб»"
    analogs:
      - "molar — коренной зуб"
      - "back tooth — задний зуб"
    dialogue:
      - "Ana: ¿Qué te pasa? | Что с тобой?"
      - "Pablo: Me duele una muela, voy al dentista. | У меня болит зуб, иду к стоматологу."
      - "Ana: ¿Desde cuándo? | С каких пор?"
      - "Pablo: Desde ayer. No pude dormir de un tirón, ni siquiera con un somnífero. | Со вчерашнего дня. Я не смог спать без перерыва, даже со снотворным."
      - "Ana: Pobre. ¿Tienes la cara hinchada? | Бедняга. У тебя щека не опухла?"
      - "Pablo: Un poco. Creo que es una muela del juicio. | Немного. Думаю, это зуб мудрости."
      - "Ana: Pues pide cita cuanto antes. Dolor de muelas no es corriente. | Тогда запишись как можно скорее. Зубная боль — не пустяк."
      - "Pablo: Ya tengo cita a las cinco. Estoy a punto de salir. | Запись на пять. Я вот-вот выйду."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "dolor de muelas — зубная боль"
      - "muela del juicio — зуб мудрости"
      - "sacar una muela — вырвать зуб"
    collocation_example: "Tengo dolor de muelas desde ayer. — У меня зубная боль со вчерашнего дня."
    trap: "Muela — именно коренной зуб, а «зуб» вообще — diente. Выражение «dolor de muelas» — «зубная боль»: так говорят про любой зуб."

  - word: bizco
    ru: косоглазый
    ipa: /ˈbiθko/
    say: би́ско
    pron: "z перед k в Испании — [θ]."
    meaning: "О человеке, у которого глаза смотрят в разные стороны. Разговорное и немного грубое слово."
    examples:
      - "Me quedé bizco de tanto mirar la pantalla. — У меня зарябило в глазах от экрана."
      - "Con aquellas gafas tan gruesas parecía bizco, aunque en realidad veía muy bien. — В тех очень толстых очках он казался косоглазым, хотя на самом деле хорошо видел."
      - "El niño nació bizco y a los cinco años le hicieron una pequeña operación en los ojos. — Мальчик родился косоглазым, и в пять лет ему сделали небольшую операцию на глазах."
    origin: "Происхождение неясно; возможно, от лат. bis «дважды» и oculus «глаз». Родственное по смыслу: ojo «глаз»."
    register: "Разговорное; о человеке может быть грубым, лучше «tiene estrabismo»."
    synonyms:
      - word: estrábico
        pair: ["Es bizco.", "Es estrábico."]
        diff:
          - "estrábico — медицинское слово «страдающий косоглазием»"
          - "bizco — разговорное, может прозвучать грубо"
    analogs:
      - "cross-eyed — косоглазый"
      - "squint — косоглазие"
    dialogue:
      - "Ana: ¿Cómo es tu hermano? | Какой твой брат?"
      - "Pablo: Alto y un poco bizco. | Высокий и немного косоглазый."
      - "Ana: ¿Y simpático? | И симпатичный?"
      - "Pablo: Muchísimo. Cuando sonríe, se le arruga la nariz, y eso le da un aire tierno. | Очень. Когда улыбается, у него морщится нос, и это придаёт ему нежный вид."
      - "Ana: ¿Y no le molesta lo de la vista? | И его не беспокоит зрение?"
      - "Pablo: Ya no. De pequeño sufría, pero ahora lo lleva con humor. | Уже нет. В детстве страдал, но теперь относится с юмором."
      - "Ana: Eso es madurez. | Это зрелость."
      - "Pablo: Sí. Dice que ser bizco le ha enseñado a no juzgar a nadie por su aspecto. | Да. Говорит, что косоглазие научило его не судить никого по внешности."
    cefr: "C1."
    frequency: "Нечастое: в описаниях людей."
    collocations:
      - "quedarse bizco — «поплыло в глазах», сильно удивиться"
      - "ojos bizcos — косые глаза"
      - "dejar bizco — ошеломить"
    collocation_example: "Se quedó bizco al ver el precio. — Он обомлел, увидев цену."
    trap: "О человеке слово может быть обидным, лучше мягко: tiene estrabismo. Часто в переносном смысле: quedarse bizco — «обомлеть»."

  - word: secarse las lágrimas
    ru: вытирать слёзы
    ipa: /seˈkaɾse las ˈlaɣɾimas/
    say: сэка́рсэ лас ла́гримас
    pron: "g перед r — мягкое [ɣ]; qu нет, c перед a — [k]."
    meaning: "Вытереть слёзы с лица: платком, рукой. Secarse — «вытирать себя»."
    examples:
      - "Sécate las lágrimas y respira hondo. — Вытри слёзы и глубоко вдохни."
      - "El niño se secó las lágrimas con la manga y volvió a jugar. — Мальчик вытер слёзы рукавом и снова стал играть."
      - "Se secó las lágrimas con un pañuelo y trató de sonreír para que no la vieran triste. — Она вытерла слёзы платком и попыталась улыбнуться, чтобы её не видели грустной."
    origin: "secar «сушить, вытирать» (лат. siccare, от siccus «сухой») + lágrimas «слёзы» (лат. lacrima). Родственное: lacrimógeno «слезоточивый»."
    register: "Нейтральное."
    synonyms:
      - word: enjugarse las lágrimas
        pair: ["Se secó las lágrimas.", "Se enjugó las lágrimas."]
        diff:
          - "enjugarse — книжное, «промокнуть слёзы»"
          - "secarse — обычное и разговорное"
    analogs:
      - "to dry one's tears — вытереть слёзы"
      - "to wipe away tears — смахнуть слёзы"
    dialogue:
      - "Ana: ¿Estás llorando? | Ты плачешь?"
      - "Pablo: Un poco. Me seco las lágrimas. | Немного. Вытираю слёзы."
      - "Ana: ¿Qué te ha pasado? | Что с тобой случилось?"
      - "Pablo: Nada grave. Es que vi una película y me vine abajo en la última escena. | Ничего серьёзного. Я смотрел фильм и расклеился в последней сцене."
      - "Ana: Qué ternura. Yo también sollozo con las películas tristes. | Какая нежность. Я тоже плачу над грустными фильмами."
      - "Pablo: Sécate las lágrimas, dijo el protagonista, y yo ya no pude más. | «Вытри слёзы», — сказал герой, и я уже не выдержал."
      - "Ana: Pues ahora a respirar hondo. | Тогда теперь дыши глубже."
      - "Pablo: Sí, y a tomar un té. Cuanto antes me despeje, mejor. | Да, и выпить чаю. Чем скорее приду в себя, тем лучше."
    cefr: "B1."
    frequency: "Частое в рассказах."
    collocations:
      - "secarse el sudor — вытереть пот"
      - "derramar lágrimas — проливать слёзы"
      - "llorar a lágrima viva — рыдать"
    collocation_example: "Lloraba a lágrima viva en la estación. — Она рыдала на вокзале."
    trap: "Возвратный глагол: me seco las lágrimas — а не «seco mis lágrimas». Притяжательное не нужно: часть тела с артиклем."

  - word: secuestrar
    ru: похищать
    ipa: /sekwesˈtɾaɾ/
    say: сэкуэстра́р
    pron: "ue — один слог «уэ»; qu нет, c перед u — [k]."
    meaning: "Захватить человека силой, чтобы требовать выкуп или условий. Ещё — «изъять имущество по суду»."
    examples:
      - "Lo secuestraron al salir de la oficina. — Его похитили при выходе из офиса."
      - "El juez ordenó secuestrar los bienes del acusado hasta que termine el proceso. — Судья распорядился наложить арест на имущество обвиняемого до конца процесса."
      - "Secuestraron a un empresario a la puerta de su casa y pidieron un millón de euros. — Предпринимателя похитили у двери его дома и потребовали миллион евро."
    origin: "Из лат. sequestrare «отдавать на хранение третьему лицу»; затем «изымать». Родственное: secuestro «похищение»."
    register: "Нейтральное, из новостей."
    synonyms:
      - word: raptar
        pair: ["Secuestraron a una niña.", "Raptaron a una niña."]
        diff:
          - "raptar — «похитить», обычно о женщинах и детях, чуть книжнее"
          - "secuestrar — общее слово, и для выкупа, и для самолёта"
    analogs:
      - "to kidnap — похищать"
      - "to hijack — угонять"
    dialogue:
      - "Ana: ¿Qué cuenta la noticia? | Что говорят в новостях?"
      - "Pablo: Secuestraron a un empresario ayer. | Вчера похитили предпринимателя."
      - "Ana: ¿Dónde? | Где?"
      - "Pablo: En la glorieta de la avenida. Lo metieron en una furgoneta sin previo aviso. | На кольце на проспекте. Его без предупреждения затолкали в фургон."
      - "Ana: ¿Y piden rescate? | И требуют выкуп?"
      - "Pablo: Todavía no. La familia prefirió no dar publicidad al caso. | Пока нет. Семья предпочла не придавать делу огласку."
      - "Ana: Es comprensible. ¿Y la policía? | Это понятно. А полиция?"
      - "Pablo: Trabaja con discreción. Se rumorea que no tardarán en dar con su paradero. | Работает незаметно. Ходят слухи, что скоро выйдут на его след."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "secuestrar a alguien — похитить кого-то"
      - "secuestrar un avión — угнать самолёт"
      - "secuestrar bienes — арестовать имущество"
    collocation_example: "Un grupo armado secuestró un autobús. — Вооружённая группа захватила автобус."
    trap: "Перед человеком нужен a: secuestrar a alguien. Не путайте с sequestrar: такого слова нет. Пишется secuestrar."

  - word: hortera
    ru: безвкусный, вульгарный
    ipa: /oɾˈteɾa/
    say: орте́ра
    pron: "h не читается."
    meaning: "Разговорное слово: о вещи, одежде, человеке со слишком кричащим и дешёвым вкусом. Одна форма для мужского и женского."
    examples:
      - "Qué corbata tan hortera lleva hoy. — Какой безвкусный галстук на нём сегодня."
      - "Esa camisa es muy hortera, con tantas flores de colores y botones dorados. — Эта рубашка очень безвкусная, с таким количеством разноцветных цветочков и золотых пуговиц."
      - "Qué decoración tan hortera tiene su casa: cortinas rosas, sofás de leopardo y luces de neón. — Какой безвкусный интерьер у их дома: розовые шторы, леопардовые диваны и неоновые лампы."
    origin: "Раньше hortera — «деревянная миска», а затем в Мадриде — насмешливое «приказчик из лавки»; отсюда «вульгарный, безвкусный»."
    register: "Разговорное, может быть обидным."
    synonyms:
      - word: cursi
        pair: ["Ese vestido es hortera.", "Ese vestido es cursi."]
        diff:
          - "cursi — слащаво-претенциозный, «сюсюкающий»"
          - "hortera — безвкусный и вульгарный, «дешёвый блеск»"
    analogs:
      - "tacky — безвкусный"
      - "naff — безвкусный (британское)"
    dialogue:
      - "Ana: ¿Te gusta mi vestido? | Тебе нравится моё платье?"
      - "Pablo: Un poco hortera, la verdad. | Немного безвкусное, по правде говоря."
      - "Ana: ¡Qué sincero! ¿Por qué? | Какой откровенный! Почему?"
      - "Pablo: Por los colores, tan chillones. Prefiero algo más sobrio. | Из-за цветов, слишком кричащих. Я предпочитаю что-то посдержаннее."
      - "Ana: Pues me lo compré en una joyería... ay, no, en una tienda del centro. | Я его купила в ювелирном... ой, нет, в магазине в центре."
      - "Pablo: Ja, ja, la mezcla de joyas y vestido sí que es hortera. | Ха-ха, сочетание драгоценностей и платья точно безвкусное."
      - "Ana: Bueno, un día es un día. Me lo pongo y a disfrutar. | Ну что ж, раз в год можно. Надену и буду радоваться."
      - "Pablo: Tienes razón. Lo importante es que te sientas cómoda. | Ты права. Главное, чтобы тебе было удобно."
    cefr: "C1."
    frequency: "Частое в разговоре в Испании."
    collocations:
      - "ir hortera — одеваться безвкусно"
      - "qué hortera — как безвкусно"
      - "un decorado hortera — безвкусный декор"
    collocation_example: "El salón tenía una decoración muy hortera. — В гостиной был очень безвкусный декор."
    trap: "Слово не меняется по роду: un traje hortera, una corbata hortera. Резкое, обижает человека: безопаснее говорить о вещи, не о человеке."

  - word: rayos UVA
    ru: ультрафиолетовые лучи
    ipa: /ˈraʝos ˈuβa/
    say: ра́йос у́ба
    pron: "UVA читается как слово: «у́ба». v читается как b."
    meaning: "Ультрафиолетовое излучение, которое используют в солярии и которое есть в солнечном свете. UVA — «ультрафиолет А»."
    examples:
      - "Evita los rayos UVA en verano. — Избегай ультрафиолета летом."
      - "Los rayos UVA envejecen la piel y aumentan el riesgo de cáncer. — Ультрафиолет старит кожу и повышает риск рака."
      - "Se hace rayos UVA en un centro de estética, aunque los médicos le han dicho que no lo haga. — Она ходит в солярий в центре красоты, хотя врачи советуют ей этого не делать."
    origin: "rayo «луч» (лат. radius) + аббревиатура UVA: ultravioleta A. В Испании в разговоре «hacerse rayos UVA» — «ходить в солярий»."
    register: "Нейтральное, бытовое."
    synonyms: []
    analogs:
      - "UV rays — ультрафиолетовые лучи"
      - "sunbed — солярий"
    dialogue:
      - "Ana: ¿Cómo estás tan morena? | Почему ты такая загорелая?"
      - "Pablo: Voy a sesiones de rayos UVA. | Хожу на сеансы УФ-лучей."
      - "Ana: ¿En invierno? ¿No es peligroso? | Зимой? Это не опасно?"
      - "Pablo: Un poco. El médico me hizo una advertencia: demasiados rayos UVA dañan la piel. | Немного. Врач меня предостерёг: слишком много УФ-лучей вредит коже."
      - "Ana: Pues conviene que lo dejes. | Тогда тебе стоит бросить."
      - "Pablo: Lo sé. Ya me quité un peso de encima y me apunté a un gimnasio. | Знаю. Я уже снял груз с души и записался в зал."
      - "Ana: Mejor así. El sol de verdad es gratis y soleado. | Так лучше. Настоящее солнце бесплатное и светлое."
      - "Pablo: Y no hay que pagar en efectivo. | И не надо платить наличными."
    cefr: "B2."
    frequency: "Частое в быту и рекламе."
    collocations:
      - "sesión de rayos UVA — сеанс солярия"
      - "protección UVA — защита от UVA"
      - "los rayos del sol — лучи солнца"
    collocation_example: "Usa crema con protección contra los rayos UVA. — Пользуйся кремом с защитой от UVA."
    trap: "Не путайте UVA с uva «виноград»: на письме UVA заглавными. Rayos — всегда во множественном."

  - word: hinchado
    ru: опухший
    ipa: /inˈtʃaðo/
    say: инча́до
    pron: "h не читается; ch — «ч»: hinchado — «инча́до»."
    meaning: "О части тела или предмете: раздувшийся, с отёком. Ещё — «надутый» (о шарике)."
    examples:
      - "Tenía la mano hinchada por la picadura. — У него опухла рука от укуса."
      - "Tengo el tobillo hinchado desde que me caí por las escaleras el sábado. — У меня опухла лодыжка с тех пор, как в субботу я упал с лестницы."
      - "Llevaba la cara hinchada de tanto llorar y los ojos rojos, y nadie se atrevió a preguntar. — У неё было опухшее от слёз лицо и красные глаза, и никто не решился ничего спросить."
    origin: "Причастие от hinchar «раздувать» (лат. inflare: in- «внутрь» + flare «дуть»). Родственные: inflar «надувать», inflación «инфляция»."
    register: "Нейтральное."
    synonyms:
      - word: inflamado
        pair: ["Tiene la rodilla hinchada.", "Tiene la rodilla inflamada."]
        diff:
          - "inflamado — «воспалённый», с покраснением и болью"
          - "hinchado — просто «опухший, раздувшийся»"
    analogs:
      - "swollen — опухший"
      - "puffy — отёкший"
    dialogue:
      - "Ana: ¿Qué te pasó en la mano? | Что у тебя с рукой?"
      - "Pablo: Me picó una abeja y la tengo hinchada. | Меня ужалила пчела, и она опухла."
      - "Ana: ¡Qué dolor! ¿Duele mucho? | Как больно! Сильно болит?"
      - "Pablo: Bastante. Estaba distraído y no la vi. Estoy hinchado como un globo. | Довольно. Я отвлёкся и не заметил. Я распух как шарик."
      - "Ana: ¿Eres alérgico? | У тебя аллергия?"
      - "Pablo: Que yo sepa, no. No reviste ninguna gravedad, pero conviene vigilarla. | Насколько знаю, нет. Опасности нет, но за ней стоит следить."
      - "Ana: Ponte hielo. Y si empeora, vamos a urgencias. | Приложи лёд. А если станет хуже, поедем в скорую."
      - "Pablo: Vale. Un comprimido y reposo, y mañana estará mejor. | Хорошо. Таблетка и покой, и завтра будет лучше."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "tener el pie hinchado — иметь опухшую ногу"
      - "hincharse de comer — наесться до отвала"
      - "ojos hinchados — опухшие глаза"
    collocation_example: "Me hinché de comer en la boda. — Я объелся на свадьбе."
    trap: "С h в начале (не читается): hinchado, hinchar. Hincharse de + инфинитив — «объесться, набить себе»: разговорное. Не путайте с hincha «болельщик»."

  - word: a sí mismo
    ru: самому себе
    ipa: /a si ˈmismo/
    say: а си ми́смо
    pron: "sí — с ударением (знак) — «си»; mismo — «ми́смо»."
    meaning: "Указывает, что действие направлено на самого говорящего или подлежащего: «себе самому». Sí — это «себя» после предлога."
    examples:
      - "Habló consigo mismo en voz baja. — Он говорил сам с собой вполголоса."
      - "Se prometió a sí mismo no volver nunca a aquella casa donde había sufrido. — Он пообещал самому себе никогда не возвращаться в тот дом, где страдал."
      - "Se miró a sí mismo en el espejo y no reconoció al hombre que tenía delante. — Он посмотрел на себя в зеркало и не узнал человека, стоявшего перед ним."
    origin: "sí — ударная форма возвратного местоимения (лат. sibi «себе») + mismo «самый»: усиливает «себя»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: a sí misma
        pair: ["Se miró a sí mismo.", "Se miró a sí misma."]
        diff:
          - "a sí misma — женский род: о женщине"
          - "a sí mismo — мужской род: о мужчине, а также «вообще»"
    analogs:
      - "to oneself — самому себе"
      - "himself — самого себя"
    dialogue:
      - "Ana: ¿Qué le dijo? | Что он ей сказал?"
      - "Pablo: Se lo prometió a sí mismo. | Он пообещал это самому себе."
      - "Ana: ¿El qué? | Что именно?"
      - "Pablo: Que dejaría de fumar. Se miró en el espejo y se lo dijo a sí mismo en voz alta. | Что бросит курить. Посмотрел в зеркало и сказал это самому себе вслух."
      - "Ana: ¿Y lo cumplió? | И выполнил?"
      - "Pablo: De momento sí. Lleva tres semanas sin un cigarrillo. | Пока да. Три недели без сигареты."
      - "Ana: Qué ahínco. | Какое усердие."
      - "Pablo: Sí. Dice que cuando uno se promete algo a sí mismo, no hay quien lo detenga. | Да. Говорит, что когда обещаешь что-то самому себе, никто тебя не остановит."
    cefr: "B2."
    frequency: "Частое в письменной речи."
    collocations:
      - "a sí mismo — самому себе"
      - "por sí mismo — самостоятельно"
      - "en sí mismo — само по себе"
    collocation_example: "El niño ya se viste por sí mismo. — Мальчик уже одевается сам."
    trap: "Sí со знаком ударения — «себя»; si без знака — «если». Согласуется по роду и числу: a sí misma, a sí mismos."

  - word: contratar
    ru: нанимать
    ipa: /kontɾaˈtaɾ/
    say: контрата́р
    meaning: "Взять человека на работу или заказать услугу по договору. Contrato — «договор»."
    examples:
      - "Contratamos un seguro de vida. — Мы оформили страхование жизни."
      - "Decidieron contratar a un abogado para que los ayudara con el divorcio. — Они решили нанять адвоката, чтобы он помог им с разводом."
      - "La empresa contrató a diez personas nuevas para atender el aumento de pedidos en verano. — Компания наняла десять новых сотрудников, чтобы справиться с ростом заказов летом."
    origin: "От contrato «договор» (лат. contractus «соглашение», от contrahere «стягивать»). Родственное: contratista «подрядчик», subcontratar."
    register: "Нейтральное, деловое."
    synonyms:
      - word: emplear
        pair: ["Contrataron a un abogado.", "Emplearon a un abogado."]
        diff:
          - "emplear — «использовать; держать на службе», шире"
          - "contratar — «нанять по договору»"
    analogs:
      - "to hire — нанимать"
      - "to take on — взять на работу"
    dialogue:
      - "Ana: ¿Ya tienen nuevo empleado? | У них уже есть новый сотрудник?"
      - "Pablo: Sí, contrataron a una chica ayer. | Да, вчера наняли девушку."
      - "Ana: ¿Cómo es? | Какая она?"
      - "Pablo: Joven, concienzuda y con mucho ahínco. Dicen que trabaja con una fluidez increíble. | Молодая, добросовестная и очень усердная. Говорят, она работает с невероятной слаженностью."
      - "Ana: ¿Y la contrataron fija? | И её наняли на постоянной основе?"
      - "Pablo: De momento, por seis meses. Luego ya veremos. | Пока на полгода. Потом посмотрим."
      - "Ana: Qué suerte. Hay tantos parados... | Повезло. Столько безработных..."
      - "Pablo: Sí, y las empresas tardan en contratar. Es toda una buena papeleta. | Да, и фирмы не спешат нанимать. Это прямо трудная ситуация."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "contratar a alguien — нанять кого-то"
      - "contratar un servicio — заказать услугу"
      - "contratar un seguro — оформить страховку"
    collocation_example: "Quiero contratar un servicio de limpieza. — Я хочу заказать услугу по уборке."
    trap: "Перед человеком нужен a: contratar a un abogado. Не путайте с contratiempo «помеха» и contraer «заразиться»."

  - word: parado
    ru: безработный
    ipa: /paˈɾaðo/
    say: пара́до
    pron: "d между гласными мягкое [ð]."
    meaning: "В Испании — человек без работы. Ещё — «остановившийся, неподвижный». Estar parado — быть безработным или стоять на месте."
    examples:
      - "Hay muchos parados en esta ciudad. — В этом городе много безработных."
      - "Llevo un año parado y busco cualquier trabajo que me permita pagar las facturas. — Я год без работы и ищу любое место, которое позволит платить по счетам."
      - "El tren está parado en la estación porque hay un problema con la vía más adelante. — Поезд стоит на станции, потому что дальше проблема с путями."
    origin: "Причастие от parar «останавливать» (лат. parare «готовить»). Безработный — «остановившийся» в работе. Родственные: paro «безработица», parada «остановка»."
    register: "Нейтральное; в Испании обычное, формальнее — desempleado."
    synonyms:
      - word: desempleado
        pair: ["Es un parado de larga duración.", "Es un desempleado de larga duración."]
        diff:
          - "desempleado — более нейтральное, в Латинской Америке основное"
          - "parado — привычное в Испании, из разговора"
    analogs:
      - "unemployed — безработный"
      - "jobless — безработный"
    dialogue:
      - "Ana: ¿Trabajas ahora? | Ты сейчас работаешь?"
      - "Pablo: No, estoy parado desde marzo. | Нет, я без работы с марта."
      - "Ana: ¿Y qué haces durante el día? | И что делаешь днём?"
      - "Pablo: Ando buscando trabajo y hago unos recados para mi vecina. | Ищу работу и выполняю поручения для соседки."
      - "Ana: ¿Has hablado con el paro? | Ты обращался в службу занятости?"
      - "Pablo: Sí, me hicieron saber que hay muchos parados y poca oferta. | Да, мне дали понять, что безработных много, а предложений мало."
      - "Ana: Qué dura es la situación. ¿Y cómo lo llevas? | Тяжёлая ситуация. И как ты справляешься?"
      - "Pablo: Con paciencia. Pero a veces me vengo abajo. | С терпением. Но иногда падаю духом."
    cefr: "B2."
    frequency: "Частое в Испании."
    collocations:
      - "estar en paro — быть безработным"
      - "cobrar el paro — получать пособие по безработице"
      - "un parado de larga duración — долгосрочный безработный"
    collocation_example: "Está en paro desde hace seis meses. — Он без работы уже полгода."
    trap: "В Испании «безработица» — el paro, а вот в Латинской Америке paro — «забастовка». Quedarse parado — «остановиться, замереть»."

  - word: vespa
    ru: веспа, мотороллер
    ipa: /ˈbespa/
    say: бе́спа
    pron: "v читается как b."
    meaning: "Мотороллер марки Vespa; в быту — любой лёгкий мотороллер. Vespa — «оса» по-итальянски."
    examples:
      - "Va al trabajo en vespa. — Он ездит на работу на мотороллере."
      - "En verano, las calles se llenan de vespas que pasan entre los coches. — Летом улицы наполняются веспами, которые проезжают между машинами."
      - "Compré una vespa de segunda mano en el mercadillo y la arreglé yo mismo en el garaje. — Я купил подержанную веспу на барахолке и сам починил её в гараже."
    origin: "От итальянского vespa «оса» (лат. vespa): мотороллер получил имя за жужжащий звук и тонкую талию. Марка Piaggio с 1946 года."
    register: "Нейтральное."
    synonyms:
      - word: moto
        pair: ["Va en vespa.", "Va en moto."]
        diff:
          - "moto — любой мотоцикл"
          - "vespa — именно мотороллер, обычно лёгкий и маленький"
    analogs:
      - "scooter — мотороллер"
      - "moped — мопед"
    dialogue:
      - "Ana: ¿Cómo vas al trabajo? | Как ты ездишь на работу?"
      - "Pablo: En vespa, es más rápido. | На веспе, так быстрее."
      - "Ana: ¿No te desvías por las obras? | Тебе не приходится объезжать из-за ремонта?"
      - "Pablo: No, con la vespa me meto por callejuelas y me ahorro el follón de la glorieta. | Нет, на веспе я проезжаю по переулкам и избегаю суматохи на кольце."
      - "Ana: ¿Y cuando llueve? | А когда дождь?"
      - "Pablo: Entonces voy en autobús. Me da miedo mojarme y caer de bruces. | Тогда еду автобусом. Боюсь промокнуть и упасть лицом вниз."
      - "Ana: Más vale prevenir que curar. | Лучше предупредить, чем лечить."
      - "Pablo: Exacto. Una vespa corriente no sirve para la lluvia. | Именно. Обычная веспа не годится для дождя."
    cefr: "B1."
    frequency: "Нечастое."
    collocations:
      - "ir en vespa — ехать на мотороллере"
      - "una vespa roja — красная веспа"
      - "conducir una vespa — управлять мотороллером"
    collocation_example: "Mi abuelo tenía una vespa en los años sesenta. — У моего дедушки в шестидесятые была веспа."
    trap: "С маленькой буквы vespa — общее название мотороллера. Не путайте с avispa «оса» по-испански: по-итальянски vespa."

  - word: gustar meterse con alguien
    ru: любить задирать кого-то
    ipa: /ɡusˈtaɾ meˈteɾse kon ˈalɣjen/
    say: густа́р мэтэ́рсэ кон а́льгьен
    pron: "g перед u — [g]: gustar — «густа́р»."
    meaning: "О человеке, который любит подкалывать, дразнить или цепляться к другим. Meterse con alguien — «задирать, дразнить»."
    examples:
      - "Deja de meterte con tu hermana. — Перестань задирать свою сестру."
      - "No te metas conmigo, que hoy no estoy de humor para aguantar tus bromas. — Не цепляйся ко мне, сегодня я не в настроении терпеть твои шутки."
      - "Le gusta meterse con los más pequeños del colegio, y nadie se atreve a decirle nada. — Он любит задирать самых маленьких в школе, и никто не решается ему возразить."
    origin: "gustar «нравиться» + meterse «вмешиваться, лезть» + con «к, с». Дословно «нравится лезть к кому-то»."
    register: "Разговорное."
    synonyms:
      - word: tomarla con alguien
        pair: ["Le gusta meterse con él.", "La ha tomado con él."]
        diff:
          - "tomarla con alguien — «взъесться на кого-то», настойчивее"
          - "meterse con alguien — «задирать, дразнить», обычно из любви к подколкам"
    analogs:
      - "to pick on someone — цепляться к кому-то"
      - "to tease — дразнить"
    dialogue:
      - "Ana: ¿Por qué lloras? | Почему ты плачешь?"
      - "Pablo: A mi hermano le gusta meterse conmigo. | Мой брат любит меня задирать."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "meterse con alguien — задирать"
      - "no te metas conmigo — не цепляйся ко мне"
