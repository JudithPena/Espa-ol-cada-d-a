# Четвёртый список автора, часть 5 — «Desconcierto en el hospital 4» (слова 15–28).
lang: es
words:
  - word: voz desconsolada
    ru: расстроенный, безутешный голос
    ipa: /boθ deskonsoˈlaða/
    say: бос дэсконсола́да
    pron: "z на конце в Испании — [θ]; d между гласными мягкое [ð]."
    meaning: "Голос человека, которого ничем не утешить: полный горя. Desconsolado — «безутешный»."
    examples:
      - "Contestó con voz desconsolada y baja. — Он ответил безутешным тихим голосом."
      - "Todos entendieron que había pasado algo muy grave cuando habló con voz desconsolada. — Все поняли, что случилось что-то очень серьёзное, когда он заговорил безутешным голосом."
      - "Se oía una voz desconsolada en el pasillo, y nadie sabía quién estaba llorando allí. — В коридоре слышался безутешный голос, и никто не знал, кто там плачет."
    origin: "des- «не» + consolar «утешать» (лат. consolari: con- + solari «утешать»). Родственные: consuelo «утешение», consolación."
    register: "Литературное, книжное."
    synonyms:
      - word: voz triste
        pair: ["Contestó con voz desconsolada.", "Contestó con voz triste."]
        diff:
          - "voz triste — просто «грустный голос»"
          - "voz desconsolada — «безутешный», с оттенком горя, которое не утешить"
    analogs:
      - "disconsolate voice — безутешный голос"
      - "heartbroken voice — голос, разбитый горем"
    dialogue:
      - "Ana: ¿Cómo sonaba al teléfono? | Как он звучал по телефону?"
      - "Pablo: Con una voz desconsolada. | С безутешным голосом."
      - "Ana: ¿Había pasado algo grave? | Случилось что-то серьёзное?"
      - "Pablo: Se había muerto su perro. Hablaba entre sollozos y apenas acertaba a decir una frase entera. | У него умерла собака. Он говорил сквозь рыдания и едва мог закончить фразу."
      - "Ana: Pobre. Eran inseparables. | Бедняга. Они были неразлучны."
      - "Pablo: Sí. Dijo que se sentía vacío y que la casa estaba demasiado silenciosa. | Да. Сказал, что чувствует пустоту и дом слишком тихий."
      - "Ana: ¿Fuiste a verlo? | Ты к нему поехал?"
      - "Pablo: Enseguida. Con una voz así, no se puede dejar a nadie solo. | Сразу. С таким голосом нельзя оставлять человека одного."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "voz desconsolada — безутешный голос"
      - "llanto desconsolado — безутешный плач"
      - "una viuda desconsolada — безутешная вдова"
    collocation_example: "Lloraba con un llanto desconsolado. — Она плакала безутешно."
    trap: "Прилагательное согласуется с существительным: voz desconsolada (женский), llanto desconsolado (мужской). Не путайте с consolar «утешать» и desolado «опустошённый»."

  - word: corriente
    ru: обычный, распространённый
    ipa: /koˈrrjente/
    say: коррье́нтэ
    pron: "rr — раскатистое; ie — один слог «ье»."
    meaning: "Как прилагательное — такой, как у всех: привычный, нормальный. Как существительное — «течение, поток, ток»."
    examples:
      - "Es un problema muy corriente hoy. — Сегодня это очень обычная проблема."
      - "Hay mucha corriente de aire en este pasillo, así que cierra la puerta. — В этом коридоре сильный сквозняк, так что закрой дверь."
      - "Es una situación muy corriente, y mucha gente pasa por lo mismo en algún momento de su vida. — Это очень обычная ситуация, и многие люди проходят через то же самое в какой-то момент жизни."
    origin: "От correr «бежать, течь» (лат. currere): «текущий» → «обычный, повседневный». Родственные: corrida «бег», corriente eléctrica «электрический ток»."
    register: "Нейтральное."
    synonyms:
      - word: común
        pair: ["Es un problema corriente.", "Es un problema común."]
        diff:
          - "común — «общий, распространённый»"
          - "corriente — «обычный, ничем не примечательный», иногда скучный"
    analogs:
      - "ordinary — обычный"
      - "common — распространённый"
    dialogue:
      - "Ana: ¿Es grave? | Это серьёзно?"
      - "Pablo: No, es un caso muy corriente. | Нет, это очень распространённый случай."
      - "Ana: ¿Seguro? Me asusté al ver tanta gente en urgencias. | Уверен? Я испугалась, когда увидела столько людей на скорой."
      - "Pablo: Es normal. Un resfriado fuerte es muy corriente en esta época. | Это нормально. Сильная простуда в это время года — обычное дело."
      - "Ana: ¿Y no hace falta ingresarlo? | И госпитализировать не нужно?"
      - "Pablo: Qué va. Reposo y un comprimido cada ocho horas. | Нет, что вы. Покой и таблетка каждые восемь часов."
      - "Ana: Menos mal. Pensaba que reviste gravedad. | Слава богу. Я думала, это опасно."
      - "Pablo: No reviste ninguna gravedad. Es corriente y se pasa en unos días. | Ничего серьёзного. Это обычное дело и пройдёт за несколько дней."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "corriente y moliente — самый обычный"
      - "estar al corriente — быть в курсе"
      - "corriente de aire — сквозняк"
      - "agua corriente — водопроводная вода"
    collocation_example: "¿Estás al corriente de lo que pasó? — Ты в курсе того, что случилось?"
    trap: "Corriente — и прилагательное «обычный», и существительное «течение, ток, сквозняк». Не путайте estar al corriente «быть в курсе» с estar corriente."

  - word: precipitarse en pensar
    ru: поспешить с мыслью, поспешить решить
    ipa: /pɾeθipiˈtaɾse en penˈsaɾ/
    say: прэсипита́рсэ эн пэнса́р
    pron: "c перед i в Испании — [θ]."
    meaning: "Слишком быстро сделать вывод, не разобравшись: «поспешил с мыслью». Precipitarse — «поторопиться, броситься»."
    examples:
      - "Tranquilo, no juzgues sin saber nada. — Спокойно, не суди, ничего не зная."
      - "Hasta tener todos los datos, es mejor no precipitarse en pensar mal de nadie. — Пока нет всех данных, лучше не спешить думать плохо о ком-либо."
      - "Se precipitó en sacar conclusiones y acusó a un compañero que no tenía nada que ver. — Он поспешил с выводами и обвинил коллегу, который был ни при чём."
    origin: "precipitar «бросать вниз» (лат. praeceps «головой вперёд»: prae- + caput «голова»). Образ: «нестись с головой вперёд» без раздумий."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: apresurarse
        pair: ["Se precipitó en decidir.", "Se apresuró a decidir."]
        diff:
          - "apresurarse — «поспешить» нейтрально"
          - "precipitarse — «ринуться сломя голову», обычно слишком рано"
    analogs:
      - "to jump to conclusions — спешить с выводами"
      - "to rush into — броситься делать"
    dialogue:
      - "Ana: ¿Crees que nos mintió? | Ты думаешь, он нам солгал?"
      - "Pablo: No te precipites en pensar eso. | Не спеши так думать."
      - "Ana: Pero su versión no es verosímil. | Но его версия неправдоподобна."
      - "Pablo: Quizá se equivocó, o se apresuró a responder por los nervios. | Возможно, он ошибся или поспешил ответить из-за нервов."
      - "Ana: O quizá ocultó algo. | Или, может, что-то скрыл."
      - "Pablo: Puede ser, pero mejor esperar. Cuando uno se precipita, comete errores. | Может быть, но лучше подождать. Когда торопишься, совершаешь ошибки."
      - "Ana: Tienes razón. Tengamos paciencia. | Ты прав. Запасёмся терпением."
      - "Pablo: Sí. Ya saldrá la verdad a relucir. | Да. Правда ещё выйдет наружу."
    cefr: "C1."
    frequency: "Частое в письменной речи."
    collocations:
      - "precipitarse en + инфинитив — поспешить сделать"
      - "precipitarse en juzgar — поспешить с суждением"
      - "no te precipites — не спеши"
    collocation_example: "No te precipites en juzgar a la gente. — Не спеши судить людей."
    trap: "С предлогом en и инфинитивом: precipitarse en juzgar. Не путайте с precipitación «осадки» и precipicio «обрыв»."

  - word: andar buscando
    ru: быть занятым поисками, искать
    ipa: /anˈdaɾ busˈkando/
    say: анда́р буска́ндо
    pron: "Ударение на последнем слоге: andar."
    meaning: "Находиться в поиске чего-то или кого-то: «ходить и искать». С gerundio: andar buscando."
    examples:
      - "Ando buscando un piso desde hace meses. — Я ищу квартиру уже несколько месяцев."
      - "Resulta que estabas en el jardín, y yo te andaba buscando por toda la casa. — Оказывается, ты был в саду, а я искал тебя по всему дому."
      - "¿Qué andas buscando en ese cajón? Ya te dije que las llaves no están allí. — Что ты ищешь в том ящике? Я же сказал, ключей там нет."
    origin: "andar «ходить» + buscar «искать»: «ходить, ища». Gerundio buscando показывает процесс, как в «estar buscando»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: estar buscando
        pair: ["Ando buscando trabajo.", "Estoy buscando trabajo."]
        diff:
          - "estar buscando — нейтральное «ищу»"
          - "andar buscando — разговорнее, с оттенком «ищу уже давно, хожу и ищу»"
    analogs:
      - "to be looking for — искать"
      - "to be on the lookout for — выискивать"
    dialogue:
      - "Ana: ¿Qué haces por aquí? | Что ты тут делаешь?"
      - "Pablo: Ando buscando a Luis. | Ищу Луиса."
      - "Ana: Estuvo hace un rato en la cafetería. | Он был недавно в кафетерии."
      - "Pablo: ¿Y dónde se ha metido ahora? Lo llamé varias veces y nada. | И куда он теперь делся? Я звонил несколько раз, безрезультатно."
      - "Ana: Quizá se retiró a su despacho. | Может, ушёл к себе в кабинет."
      - "Pablo: Ya miré. Ando buscando también unos papeles suyos. | Уже смотрел. Я ещё ищу его бумаги."
      - "Ana: ¿Qué papeles? | Какие бумаги?"
      - "Pablo: Las facturas del IVA. El inspector de Hacienda las pide cuanto antes. | Счета по НДС. Налоговый инспектор требует их как можно скорее."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "andar buscando algo — искать что-то"
      - "andar buscando a alguien — искать кого-то"
      - "andar buscando problemas — нарываться на неприятности"
    collocation_example: "Si sigues así, andas buscando problemas. — Если будешь продолжать, нарвёшься на неприятности."
    trap: "Перед человеком нужен a: andar buscando A alguien. Андар с gerundio — разговорный вариант, не «estar»."

  - word: domicilio
    ru: место жительства, домашний адрес
    ipa: /domiˈθiljo/
    say: домиси́льо
    pron: "c перед i в Испании — [θ]."
    meaning: "Адрес, по которому человек живёт: официальное слово. Ещё «a domicilio» — «на дом»."
    examples:
      - "Escriba su domicilio con letra clara. — Напишите свой адрес разборчиво."
      - "En el formulario, indique su domicilio y adjunte una copia del contrato de alquiler. — В бланке укажите свой адрес проживания и приложите копию договора аренды."
      - "Cambió de domicilio varias veces y por eso la carta del banco nunca llegó a sus manos. — Он несколько раз менял адрес проживания, и поэтому письмо из банка так и не дошло до него."
    origin: "Из лат. domicilium «жилище», от domus «дом». Родственные: doméstico «домашний», domicilio fiscal «налоговый адрес»."
    register: "Формальное, юридическое."
    synonyms:
      - word: dirección
        pair: ["¿Cuál es su domicilio?", "¿Cuál es su dirección?"]
        diff:
          - "dirección — обычное «адрес», и в быту"
          - "domicilio — официально: «место жительства», для документов"
    analogs:
      - "address — адрес"
      - "residence — место жительства"
    dialogue:
      - "Ana: ¿Dónde vive? | Где он живёт?"
      - "Pablo: Su domicilio está en la calle Mayor. | Его адрес — улица Майор."
      - "Ana: ¿Y desde cuándo? | И с каких пор?"
      - "Pablo: Hace diez años. Cambió de domicilio una sola vez, para mudarse a un piso mayor. | Десять лет. Менял место жительства только один раз, переехав в квартиру побольше."
      - "Ana: ¿Y tienes el número? | А номер у тебя есть?"
      - "Pablo: Sí, aquí, en la agenda. Pero el domicilio fiscal es otro. | Да, здесь, в ежедневнике. Но налоговый адрес другой."
      - "Ana: ¿Por qué? | Почему?"
      - "Pablo: Porque la empresa está registrada en casa de su socio. Es un trámite burocrático corriente. | Потому что фирма зарегистрирована дома у его партнёра. Это обычная бюрократическая формальность."
    cefr: "B2."
    frequency: "Частое в документах."
    collocations:
      - "a domicilio — на дом"
      - "cambio de domicilio — смена адреса"
      - "domicilio fiscal — налоговый адрес"
    collocation_example: "Pedimos comida a domicilio los viernes. — По пятницам мы заказываем еду на дом."
    trap: "Domicilio — документная лексика, в быту говорят dirección или casa. Слово мужского рода: el domicilio. «A domicilio» — «с доставкой на дом»."

  - word: desviarse
    ru: отклоняться от пути
    ipa: /desˈβjaɾse/
    say: дэсбьа́рсэ
    pron: "v читается как b; в форме yo ударение на i: me desvío."
    meaning: "Свернуть с дороги или с основной темы: уйти в сторону. О человеке и о предметах."
    examples:
      - "No te desvíes del tema, por favor. — Не уходи от темы, пожалуйста."
      - "El avión se desvió de su ruta por la tormenta de anoche. — Самолёт отклонился от маршрута из-за вчерашней грозы."
      - "Nos desviamos del camino principal para ver una ermita que había en lo alto de la colina. — Мы свернули с главной дороги, чтобы посмотреть на часовню на вершине холма."
    origin: "des- «отдельно» + vía «дорога»: «уйти с пути». Родственные: desvío «объезд», vía «путь», viaje «путешествие»."
    register: "Нейтральное."
    synonyms:
      - word: apartarse
        pair: ["Se desvió del camino.", "Se apartó del camino."]
        diff:
          - "apartarse — «отойти в сторону», уступив путь"
          - "desviarse — «отклониться от направления» намеренно или нечаянно"
    analogs:
      - "to deviate — отклоняться"
      - "to go off course — сбиться с курса"
    dialogue:
      - "Ana: ¿Por qué llegaste tarde? | Почему ты опоздал?"
      - "Pablo: Me desvié por unas obras. | Мне пришлось свернуть из-за ремонта."
      - "Ana: ¿Había mucho tráfico? | Было много машин?"
      - "Pablo: Un follón. Tuve que cambiar de carril tres veces y salir por una glorieta. | Суматоха. Мне пришлось трижды перестраиваться и выехать на кольцо."
      - "Ana: ¿Y no tenías GPS? | И не было навигатора?"
      - "Pablo: Sí, pero me desvió por un camino lleno de baches. | Был, но он направил меня по дороге с ямами."
      - "Ana: Qué mala suerte. ¿Se pinchó algún neumático? | Не повезло. Не прокололась шина?"
      - "Pablo: Por suerte no. Pero llegué con un cansancio enorme. | К счастью, нет. Но приехал с огромной усталостью."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "desviarse del camino — сойти с пути"
      - "desviarse del tema — отклониться от темы"
      - "desviar el tráfico — перенаправить движение"
    collocation_example: "Se desvió del tema y nadie lo entendió. — Он ушёл от темы, и никто его не понял."
    trap: "Спрягается как enviar: me desvío, te desvías (с ударением на i). Не путайте desviarse «отклониться» и desviar «отклонить»: возвратность разная."

  - word: verosímil
    ru: правдоподобный
    ipa: /beɾoˈsimil/
    say: бэроси́миль
    pron: "v читается как b; ударение на si: verosímil."
    meaning: "Такой, что можно поверить: похожий на правду, хотя необязательно правдивый."
    examples:
      - "Parece verosímil lo que cuentas. — Звучит правдоподобно то, что ты рассказываешь."
      - "Habría que comprobarla con más datos de la empresa, aunque es una explicación verosímil. — Её нужно проверить по более полным данным компании, хотя это правдоподобное объяснение."
      - "Su historia no es verosímil, porque las fechas que da no coinciden con las del hotel. — Его история неправдоподобна, потому что даты, которые он называет, не совпадают с данными отеля."
    origin: "Из лат. verisimilis: verus «истинный» + similis «похожий»: «похожий на истину». Родственное: verdad «правда», semejante «подобный»."
    register: "Формальное, книжное."
    synonyms:
      - word: creíble
        pair: ["Es una versión verosímil.", "Es una versión creíble."]
        diff:
          - "creíble — «такой, которому можно верить», и о людях"
          - "verosímil — «выглядит похожим на правду», чаще о рассказе или объяснении"
    analogs:
      - "plausible — правдоподобный"
      - "believable — убедительный"
    dialogue:
      - "Ana: ¿Crees su versión? | Ты веришь его версии?"
      - "Pablo: No es muy verosímil. | Она не очень правдоподобна."
      - "Ana: ¿Por qué no? | Почему?"
      - "Pablo: Dice que no sabía nada, pero tenía la contraseña del expediente. | Он говорит, что ничего не знал, но у него был пароль от дела."
      - "Ana: Eso sí es raro. | Вот это странно."
      - "Pablo: Y además su historia entraña muchas contradicciones. | И к тому же его история полна противоречий."
      - "Ana: Entonces habrá que investigar más. | Значит, придётся расследовать дальше."
      - "Pablo: Sí, pero sin precipitarnos. Parece verosímil, pero no lo creo del todo. | Да, но не торопясь. Звучит правдоподобно, но я не до конца верю."
    cefr: "C1."
    frequency: "Нечастое: в письменной речи."
    collocations:
      - "una historia verosímil — правдоподобная история"
      - "poco verosímil — малоправдоподобный"
      - "una excusa verosímil — убедительная отговорка"
    collocation_example: "Su excusa sonaba poco verosímil. — Его отговорка звучала малоправдоподобно."
    trap: "Не путайте verosímil «правдоподобный» с veraz «правдивый» (о человеке) и verdadero «настоящий». Противоположное — inverosímil."

  - word: glorieta
    ru: кольцевая развязка
    ipa: /gloˈɾjeta/
    say: глорье́та
    pron: "ie — один слог «ье»."
    meaning: "Перекрёсток с круговым движением. Ещё — «беседка» в саду."
    examples:
      - "Gire en la segunda glorieta. — Поверните на втором кольце."
      - "Quedamos en la glorieta de Bilbao, junto al metro, a las siete. — Мы договорились встретиться на площади Бильбао, у метро, в семь."
      - "En el centro del parque había una glorieta cubierta de plantas donde los mayores jugaban a las cartas. — В центре парка стояла беседка, увитая растениями, где пожилые люди играли в карты."
    origin: "От франц. gloriette «беседка» (уменьшительное от gloire «слава»). В Испании слово закрепилось и для кольцевой развязки."
    register: "Нейтральное."
    synonyms:
      - word: rotonda
        pair: ["Giré en la glorieta.", "Giré en la rotonda."]
        diff:
          - "rotonda — тоже «кольцо», в Латинской Америке чаще"
          - "glorieta — привычное слово в Испании"
    analogs:
      - "roundabout — кольцевая развязка (британское)"
      - "traffic circle — круговая развязка (американское)"
    dialogue:
      - "Ana: ¿Cómo llego a tu casa? | Как мне доехать до твоего дома?"
      - "Pablo: Sigue recto y en la glorieta gira a la derecha. | Езжай прямо, а на кольце поверни направо."
      - "Ana: ¿Y luego? | А потом?"
      - "Pablo: Verás una farmacia. Tuerce a la izquierda y mi domicilio está al fondo. | Увидишь аптеку. Поверни налево, и мой дом в конце."
      - "Ana: ¿Hay aparcamiento? | Парковка есть?"
      - "Pablo: Sí, junto al rellano de la entrada. Ojo con el carril de los autobuses. | Да, рядом с входной площадкой. Осторожно с автобусной полосой."
      - "Ana: Vale. Como me desvíe, te llamo. | Хорошо. Если собьюсь с пути, позвоню."
      - "Pablo: Aviso por si acaso: la glorieta tiene cinco salidas y es un lío. | Предупреждаю на всякий случай: на кольце пять съездов, и это неразбериха."
    cefr: "B1."
    frequency: "Частое в Испании."
    collocations:
      - "tomar la glorieta — выехать на кольцо"
      - "salir de la glorieta — съехать с кольца"
      - "primera salida de la glorieta — первый съезд с кольца"
    collocation_example: "Toma la tercera salida de la glorieta. — Возьми третий съезд с кольца."
    trap: "Ложный друг: glorieta — не «слава» (gloria). В Латинской Америке для круговой развязки говорят rotonda или redondel."

  - word: espeluznante
    ru: жуткий, леденящий душу
    ipa: /espeluθˈnante/
    say: эспэлусна́нтэ
    pron: "z перед n в Испании — [θ]: espeluznante."
    meaning: "Такой страшный, что мурашки по коже: об истории, крике, зрелище."
    examples:
      - "Qué historia tan espeluznante cuentas. — Какую жуткую историю ты рассказываешь."
      - "Los testigos describieron una escena espeluznante: coches destrozados y gente por todas partes. — Свидетели описали жуткую сцену: разбитые машины и люди повсюду."
      - "Se oyó un grito espeluznante en mitad de la noche, y todos los vecinos se asomaron. — Посреди ночи раздался леденящий кровь крик, и все соседи выглянули в окна."
    origin: "От espeluzno «озноб, дрожь страха» (возможно, от pelo «волос»: волосы встают дыбом). Родственные: espeluzno, pelo «волос»."
    register: "Нейтральное, образное."
    synonyms:
      - word: escalofriante
        pair: ["Fue un relato espeluznante.", "Fue un relato escalofriante."]
        diff:
          - "escalofriante — «бросающий в дрожь», очень близко"
          - "espeluznante — чуть сильнее и «волосы дыбом»"
    analogs:
      - "hair-raising — от которого волосы дыбом"
      - "spine-chilling — леденящий душу"
    dialogue:
      - "Ana: ¿Qué viste? | Что ты видел?"
      - "Pablo: Algo espeluznante. | Нечто жуткое."
      - "Ana: ¿Un choque? ¿Un herido? | Аварию? Раненого?"
      - "Pablo: Peor. Una casa vacía con las puertas abiertas y un montón de objetos tirados por el suelo. | Хуже. Пустой дом с открытыми дверями и кучей вещей на полу."
      - "Ana: Qué escalofrío. ¿Y no había nadie? | Мурашки. И там никого не было?"
      - "Pablo: Nadie. Se oía solo un murmullo extraño. Era un ambiente macabro. | Никого. Слышался только странный шорох. Атмосфера была жуткой."
      - "Ana: ¿Llamaste a la policía? | Ты позвонил в полицию?"
      - "Pablo: Sí, y no tardó en llegar. Fue una escena espeluznante. | Да, и она скоро приехала. Это была жуткая сцена."
    cefr: "C1."
    frequency: "Частое в новостях и рассказах."
    collocations:
      - "un crimen espeluznante — жуткое преступление"
      - "una escena espeluznante — леденящая душу сцена"
      - "un grito espeluznante — леденящий душу крик"
    collocation_example: "La película tiene escenas espeluznantes. — В фильме есть жуткие сцены."
    trap: "Прилагательное одно для мужского и женского: espeluznante. Не путайте с espeluznar «пугать»: глагол редкий."

  - word: convivir a diario con
    ru: ежедневно сталкиваться с чем-то, жить бок о бок
    ipa: /kombiˈβiɾ a ˈðjaɾjo kon/
    say: комбиби́р а дья́рьо кон
    pron: "v читается как b; d в diario мягкое [ð] в середине фразы."
    meaning: "Постоянно жить или работать рядом с кем-то или чем-то: сталкиваться каждый день."
    examples:
      - "Convive a diario con su suegra. — Он ежедневно живёт рядом со свекровью."
      - "Para ser más paciente, nada como convivir a diario con tanta gente distinta. — Чтобы стать терпеливее, нет ничего лучше, чем ежедневно общаться со столькими разными людьми."
      - "Los médicos conviven a diario con el dolor y con la muerte, y eso los cambia mucho. — Врачи ежедневно сталкиваются с болью и смертью, и это сильно их меняет."
    origin: "con- «вместе» + vivir «жить»: «жить вместе». a diario — «ежедневно» (от día «день»). Родственные: convivencia «совместная жизнь»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: vivir con
        pair: ["Convive con el miedo.", "Vive con el miedo."]
        diff:
          - "vivir con — просто «жить рядом»"
          - "convivir con — подчёркивает «сосуществовать, привыкнуть жить вместе»"
    analogs:
      - "to live alongside — жить бок о бок"
      - "to live with — жить с"
    dialogue:
      - "Ana: ¿Cómo lleva su trabajo? | Как он справляется с работой?"
      - "Pablo: Convive a diario con el dolor ajeno. | Каждый день живёт рядом с чужой болью."
      - "Ana: ¿Es médico? | Он врач?"
      - "Pablo: Celador, en urgencias. Ve heridos, hemorragias y familias desconsoladas. | Санитар в скорой. Видит раненых, кровотечения и безутешные семьи."
      - "Ana: Qué dureza. ¿Cómo lo aguanta? | Какая тяжесть. Как он это выдерживает?"
      - "Pablo: Con mucha paciencia y con mucha ternura. Pero a veces se viene abajo. | С огромным терпением и огромной нежностью. Но иногда ломается."
      - "Ana: Es normal. Convivir a diario con esas escenas no es fácil. | Это нормально. Каждый день жить рядом с такими картинами нелегко."
      - "Pablo: Por eso su mujer cuida mucho de él. | Поэтому жена очень заботится о нём."
    cefr: "C1."
    frequency: "Частое в новостях и интервью."
    collocations:
      - "convivir con alguien — жить вместе"
      - "convivir con la enfermedad — жить с болезнью"
      - "convivencia pacífica — мирное сосуществование"
    collocation_example: "Aprendió a convivir con su enfermedad. — Он научился жить со своей болезнью."
    trap: "С предлогом con: convivir con alguien. Не путайте с vivir «жить» и con vivencia «опыт»: convivencia — «совместная жизнь»."

  - word: insensibilizar
    ru: делать менее чувствительным
    ipa: /insensiβiliˈθaɾ/
    say: инсэнсибилиса́р
    pron: "z в Испании — [θ]; перед e z меняется на c: insensibilicé."
    meaning: "Сделать человека менее восприимчивым: к боли или к чужим бедам. Без чувствительности: insensible."
    examples:
      - "El frío insensibiliza los dedos. — Холод делает пальцы нечувствительными."
      - "Después puede doler un poco, porque la anestesia insensibiliza la zona solo durante dos horas. — Потом может немного болеть, потому что анестезия обезболивает область всего на два часа."
      - "La costumbre lo insensibilizó al dolor ajeno, y ya no le conmueve nada de lo que ve. — Привычка сделала его нечувствительным к чужой боли, и его уже ничто не трогает."
    origin: "in- «не» + sensible «чувствительный» + -izar «делать»: «делать нечувствительным». Родственные: sensibilidad «чувствительность», sensato «разумный»."
    register: "Формальное, медицинское."
    synonyms:
      - word: anestesiar
        pair: ["Le insensibilizaron el brazo.", "Le anestesiaron el brazo."]
        diff:
          - "anestesiar — «обезболить» с помощью анестезии"
          - "insensibilizar — шире: и физически, и «сделать равнодушным»"
    analogs:
      - "to desensitize — снизить чувствительность"
      - "to numb — онемить"
    dialogue:
      - "Ana: ¿Por qué no siente nada? | Почему он ничего не чувствует?"
      - "Pablo: La violencia lo ha insensibilizado. | Насилие сделало его бесчувственным."
      - "Ana: ¿De qué hablas? | О чём ты?"
      - "Pablo: Lleva años de policía. Ha visto muchos casos macabros. | Он годами служит в полиции. Видел много жутких случаев."
      - "Ana: Pobre. Eso endurece a cualquiera. | Бедняга. Это ожесточает любого."
      - "Pablo: Sí. Antes se estremecía con cada escena, ahora ni se inmuta. | Да. Раньше он вздрагивал при каждой сцене, теперь даже не морщится."
      - "Ana: ¿Y no lo ayuda nadie? | И ему никто не помогает?"
      - "Pablo: Va a terapia. Quiere recuperar la sensibilidad, pese a todo. | Ходит на терапию. Хочет вернуть чувствительность, несмотря ни на что."
    cefr: "C1."
    frequency: "Нечастое: в медицине и публицистике."
    collocations:
      - "insensibilizar a alguien — сделать нечувствительным"
      - "insensibilizar la zona — обезболить участок"
      - "insensibilizarse ante el dolor — перестать чувствовать боль"
    collocation_example: "La violencia constante insensibiliza a la gente. — Постоянное насилие делает людей бесчувственными."
    trap: "Часто с возвратным se: insensibilizarse «стать равнодушным». Не путайте с insensato «безрассудный» и sensible «чувствительный»."

  - word: cumplir su cometido
    ru: выполнить своё задание
    ipa: /kumˈpliɾ su koˈmeðiðo/
    say: кумпли́р су комэ́тидо
    pron: "d между гласными мягкое [ð]."
    meaning: "Сделать то, ради чего было назначено: выполнить поручение, роль. Cometido — «задача, миссия»."
    examples:
      - "La medicina cumplió su cometido. — Лекарство выполнило свою задачу."
      - "Como los precios siguieron subiendo igual que antes, la ley no cumplió su cometido. — Так как цены продолжали расти так же, как прежде, закон не выполнил своей цели."
      - "El equipo cumplió su cometido con éxito y regresó a casa después de tres meses de misión. — Команда успешно выполнила свою задачу и вернулась домой после трёх месяцев миссии."
    origin: "cumplir «выполнять» (лат. complere «заполнять») + cometido — причастие от cometer «поручать» (лат. committere). Cometido — «то, что поручено»."
    register: "Формальное."
    synonyms:
      - word: cumplir su misión
        pair: ["Cumplió su cometido.", "Cumplió su misión."]
        diff:
          - "misión — более высокое слово «миссия»"
          - "cometido — рабочее «поручение, задача»"
    analogs:
      - "to fulfil one's task — выполнить задачу"
      - "to carry out one's mission — исполнить миссию"
    dialogue:
      - "Ana: ¿Salió bien el plan? | План сработал?"
      - "Pablo: Sí, cumplió su cometido. | Да, он выполнил своё предназначение."
      - "Ana: ¿Descubrieron al culpable? | Нашли виновного?"
      - "Pablo: Sí. Un inspector se hizo pasar por cliente y le tendió una trampa. | Да. Инспектор выдал себя за клиента и расставил ловушку."
      - "Ana: ¿Y no sospechó? | И тот не заподозрил?"
      - "Pablo: Ni siquiera acertó a reaccionar. Se quedó aturdido y confesó enseguida. | Даже не смог отреагировать. Остолбенел и сразу признался."
      - "Ana: Qué sagacidad. | Какая проницательность."
      - "Pablo: Sí. El plan cumplió su cometido y se descubrió todo el pastel. | Да. План выполнил свою задачу, и всё раскрылось."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "cumplir un cometido — выполнить задачу"
      - "cumplir su deber — выполнить долг"
      - "cumplir una promesa — сдержать обещание"
    collocation_example: "El guardia cumplió su cometido con eficacia. — Охранник эффективно выполнил свою задачу."
    trap: "Не путайте cometido «задача» и cometer «совершать»: cometer un error, но cumplir un cometido. Cumplir ещё — «исполняться возраст»: cumplir años."

  - word: asistenta
    ru: домработница
    ipa: /asisˈtenta/
    say: асисте́нта
    meaning: "Женщина, которая приходит убирать или помогать по дому. Ещё — «ассистентка, помощница»."
    examples:
      - "Mi asistenta se llama Rosa. — Мою домработницу зовут Роса."
      - "Para limpiar la casa, los martes y los viernes viene la asistenta. — Убирать дом по вторникам и пятницам приходит домработница."
      - "Contrataron a una asistenta porque los dos trabajaban todo el día y no llegaban a nada. — Они наняли домработницу, потому что оба работали весь день и ничего не успевали."
    origin: "От asistir «помогать, присутствовать» (лат. assistere «стоять рядом»). Женский род причастия: asistente → asistenta."
    register: "Нейтральное, чуть старомодное."
    synonyms:
      - word: empleada del hogar
        pair: ["La asistenta limpia la casa.", "La empleada del hogar limpia la casa."]
        diff:
          - "empleada del hogar — современное официальное название профессии"
          - "asistenta — привычное, чуть устаревшее разговорное слово"
    analogs:
      - "housekeeper — домработница"
      - "cleaner — уборщица"
    dialogue:
      - "Ana: ¿Quién limpia tu casa? | Кто убирает твой дом?"
      - "Pablo: Una asistenta que viene dos veces por semana. | Домработница, которая приходит два раза в неделю."
      - "Ana: ¿Y es de confianza? | И ей можно доверять?"
      - "Pablo: Totalmente. Lleva diez años con nosotros y es muy concienzuda. | Полностью. Она у нас десять лет и очень добросовестна."
      - "Ana: ¿Y qué tal en la cocina? | А как на кухне?"
      - "Pablo: Mejor que yo. Hace una tortilla espectacular. | Лучше меня. Готовит потрясающую тортилью."
      - "Ana: ¿Y no te molesta convivir a diario con alguien ajeno? | А не мешает ли жить бок о бок с посторонним человеком?"
      - "Pablo: Qué va, ya es de la familia. Le tengo mucho cariño. | Что вы, она уже своя. Я очень её люблю."
    cefr: "B2."
    frequency: "Средней частоты: в прозе и разговоре."
    collocations:
      - "asistenta social — социальный работник"
      - "una asistenta por horas — уборщица на несколько часов"
      - "contratar una asistenta — нанять помощницу"
    collocation_example: "La asistenta social visitó a la familia. — Социальный работник посетила семью."
    trap: "Asistenta — «домработница» и ещё «ассистентка». Не путайте с asistente (общий род) «помощник»: el/la asistente."

  - word: trapo
    ru: тряпка
    ipa: /ˈtɾapo/
    say: тра́по
    meaning: "Кусок ткани для вытирания и уборки. Ещё — разговорное «старая, ненужная одежда»."
    examples:
      - "Limpia el cristal con un trapo seco. — Протри стекло сухой тряпкой."
      - "Pasa un trapo por la mesa, que hay migas de pan por todas partes. — Протри стол тряпкой, на нём везде крошки хлеба."
      - "Ese vestido es un trapo viejo: ya no te lo puedes poner para ir a ningún sitio. — Это платье старая тряпка: ты уже не можешь надевать его никуда."
    origin: "Происхождение спорное; слово связывают с позднелатинским drappus «ткань». Родственное: trapero «старьёвщик»."
    register: "Нейтральное; в переносном смысле — разговорное и грубоватое."
    synonyms:
      - word: paño
        pair: ["Limpia con un trapo.", "Limpia con un paño."]
        diff:
          - "paño — кусок ткани для протирания, более аккуратная тряпка"
          - "trapo — старый кусок ткани, простая тряпка"
    analogs:
      - "rag — тряпка"
      - "cloth — кусок ткани"
    dialogue:
      - "Ana: ¿Con qué limpias? | Чем ты убираешь?"
      - "Pablo: Con un trapo húmedo. | Влажной тряпкой."
      - "Ana: ¿Y para los cristales? | А для стёкол?"
      - "Pablo: Con un trapo seco, para que no dejen marcas. | Сухой тряпкой, чтобы не оставались следы."
      - "Ana: Mi asistenta usa papel de cocina. | Моя домработница использует бумажные полотенца."
      - "Pablo: Yo prefiero el trapo. Es más barato y se lava. | Я предпочитаю тряпку. Она дешевле и стирается."
      - "Ana: Tienes razón. Pásame un trapo, que he derramado el café. | Ты прав. Дай мне тряпку, я пролила кофе."
      - "Pablo: Aquí tienes. No te preocupes, que no reviste ninguna gravedad. | Вот. Не переживай, ничего страшного."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "trapo de cocina — кухонное полотенце"
      - "estar hecho un trapo — быть измотанным"
      - "poner como un trapo — разнести, отчитать"
      - "trapos sucios — грязное бельё (о секретах)"
    collocation_example: "Después del partido estaba hecho un trapo. — После матча он был как выжатый лимон."
    trap: "В переносном смысле: estar hecho un trapo — «быть без сил», trapos sucios — «семейные секреты». Не путайте с trampa «ловушка»."
