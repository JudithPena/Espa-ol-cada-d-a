# Четвёртый список автора, часть 1 — «Desconcierto en el hospital 3» (слова 1–12).
lang: es
words:
  - word: taza de váter
    ru: унитаз
    ipa: /ˈtaθa de ˈbateɾ/
    say: та́са дэ ба́тэр
    pron: "z в taza в Испании — [θ]; v читается как b; váter — «ба́тэр», ударение на первом слоге."
    meaning: "Чаша унитаза. В Испании говорят и просто váter (от англ. water closet)."
    examples:
      - "La taza de váter está atascada. — Унитаз засорился."
      - "Cada semana, con un producto que mate los gérmenes, limpia la taza de váter. — Каждую неделю он моет унитаз средством, которое убивает микробы."
      - "Cambiaron la taza de váter y pusieron una nueva con doble descarga para ahorrar agua. — Поменяли унитаз и поставили новый с двойным смывом, чтобы экономить воду."
    origin: "taza «чаша» (из арабского tassa) + váter — от английского water closet «туалет с водой»: слово через сокращение закрепилось в Испании."
    register: "Нейтральное, бытовое."
    synonyms:
      - word: inodoro
        pair: ["La taza de váter está limpia.", "El inodoro está limpio."]
        diff:
          - "inodoro — нейтральное и более «правильное» название, в Латинской Америке основное"
          - "váter — разговорное, чаще в Испании"
    analogs:
      - "toilet bowl — чаша унитаза"
      - "toilet — унитаз"
    dialogue:
      - "Ana: ¿Qué le pasa al baño? | Что случилось с ванной?"
      - "Pablo: La taza de váter está atascada. | Унитаз засорился."
      - "Ana: ¡Qué asco! ¿Has probado con el desatascador? | Какая гадость! Пробовал вантуз?"
      - "Pablo: Sí, pero no hay manera. Habrá que llamar al fontanero. | Да, но безрезультатно. Придётся звать сантехника."
      - "Ana: ¿Hay alguno de guardia? | Есть дежурный?"
      - "Pablo: Sí, pero cobra una fortuna. Y hoy es festivo. | Есть, но берёт целое состояние. И сегодня праздник."
      - "Ana: Pues pregunta a los vecinos. Quizá alguien disponga de uno. | Тогда спроси соседей. Может, у кого-то есть."
      - "Pablo: Buena idea. Y mientras tanto, usamos el cuarto de aseo de abajo. | Хорошая мысль. А пока пользуемся санузлом внизу."
    cefr: "B1."
    frequency: "Частое в быту."
    collocations:
      - "tirar de la cadena — спустить воду"
      - "atascar el váter — засорить унитаз"
      - "la tapa del váter — крышка унитаза"
    collocation_example: "Se atascó el váter y llamamos al fontanero. — Унитаз засорился, и мы вызвали сантехника."
    trap: "Váter пишется через v и со знаком ударения: слово приспособили на испанский лад. В Латинской Америке чаще inodoro."

  - word: disponer de
    ru: иметь в распоряжении
    ipa: /dispoˈneɾ de/
    say: диспонэ́р дэ
    pron: "Спрягается как poner: dispongo, dispones, dispuso; причастие — dispuesto."
    meaning: "Иметь что-то под рукой, чтобы можно было воспользоваться: время, деньги, людей, оборудование."
    examples:
      - "¿Dispones de un minuto ahora? — У тебя найдётся минута сейчас?"
      - "Puede volver mañana por la mañana, porque hoy no dispongo de tiempo para atenderle. — Вы можете прийти завтра утром, потому что сегодня у меня нет времени вас принять."
      - "El hospital dispone de cien camas y de dos quirófanos modernos en la planta baja. — В больнице сто коек и две современные операционные на первом этаже."
    origin: "dis- «врозь, по порядку» + poner «класть»: «разместить как нужно» → «иметь в своём распоряжении». Родственные: disposición «распоряжение», disponible «доступный»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: tener
        pair: ["Dispone de un coche.", "Tiene un coche."]
        diff:
          - "tener — просто «иметь»"
          - "disponer de — «иметь и мочь пользоваться», книжнее"
    analogs:
      - "to have at one's disposal — иметь в распоряжении"
      - "to have available — иметь в наличии"
    dialogue:
      - "Ana: ¿Qué recursos tienen? | Какие у них ресурсы?"
      - "Pablo: Disponen de tres quirófanos y de cuarenta camas. | В их распоряжении три операционные и сорок коек."
      - "Ana: Parece suficiente. | Кажется, достаточно."
      - "Pablo: No tanto. Cuando hay un choque grave, no dan abasto. | Не совсем. Когда случается серьёзная авария, они не справляются."
      - "Ana: ¿Y personal? | А персонал?"
      - "Pablo: Disponen de poco. Los sindicatos reclaman más contratos. | Мало. Профсоюзы требуют больше контрактов."
      - "Ana: ¿Dispones de un minuto? Quiero preguntarte algo. | Есть минутка? Хочу тебя кое о чём спросить."
      - "Pablo: Claro, ahora tengo un rato libre. Dime. | Конечно, сейчас у меня свободное время. Говори."
    cefr: "B2."
    frequency: "Частое в текстах, новостях и деловой речи."
    collocations:
      - "disponer de tiempo — иметь время"
      - "disponer de recursos — располагать ресурсами"
      - "disponer de información — располагать информацией"
    collocation_example: "No dispongo de información suficiente. — У меня недостаточно информации."
    trap: "Нужен предлог de: disponer de algo, а не «disponer algo» (это «распорядиться»). Не путайте с disponible «доступный»."

  - word: no ocurrírsele a alguien
    ru: не приходить кому-то в голову
    ipa: /no okuˈrirsele a ˈalɣjen/
    say: но окури́рсэлэ а а́льгьен
    pron: "Ударение на rí: ocurrírsele."
    meaning: "Обороты «не додуматься, не пришло в голову»: что-то никогда не возникало в мыслях. Ocurrírsele — «прийти на ум»."
    examples:
      - "No se le ocurrió pedir ayuda. — Ему не пришло в голову попросить о помощи."
      - "Esa noche no se me ocurrió que podía llamar a mi hermano. — В ту ночь мне не пришло в голову, что я могу позвонить брату."
      - "A nadie se le ocurrió que el ladrón podía haber entrado por el tejado. — Никому не пришло в голову, что вор мог проникнуть через крышу."
    origin: "ocurrir «происходить, случаться» (лат. occurrere «бежать навстречу»), с me/te/le: «мысль бежит навстречу». Родственные: ocurrencia «выдумка, идея»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: no pensar en
        pair: ["No se me ocurrió.", "No pensé en ello."]
        diff:
          - "no pensar en — просто «не подумать»"
          - "no ocurrírsele — «в голову не пришло», идея не возникла сама"
    analogs:
      - "it didn't occur to me — мне не пришло в голову"
      - "to not think of — не додуматься"
    dialogue:
      - "Ana: ¿Por qué no me avisaste? | Почему ты меня не предупредил?"
      - "Pablo: No se me ocurrió, perdona. | Мне это просто не пришло в голову, прости."
      - "Ana: ¿Cómo que no se te ocurrió? Estaba preocupada. | Как это не пришло в голову? Я волновалась."
      - "Pablo: Estaba distraído con el trabajo. Ni siquiera miré el móvil. | Я был занят работой. Даже в телефон не смотрел."
      - "Ana: Siempre igual. No se te ocurre pensar en los demás. | Всегда одно и то же. Тебе не приходит в голову думать о других."
      - "Pablo: Tienes razón. Me arrepiento y prometo avisar. | Ты права. Я жалею и обещаю предупреждать."
      - "Ana: Apúntalo en la agenda, por si acaso. | Запиши в ежедневник, на всякий случай."
      - "Pablo: Ya lo apunto. Y esta vez no se me olvida. | Уже записываю. И в этот раз не забуду."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "se me ocurre una idea — мне в голову пришла идея"
      - "¿Se te ocurre algo? — Тебе что-нибудь приходит в голову?"
      - "ni se me ocurriría — мне бы и в голову не пришло"
    collocation_example: "Ni se me ocurriría hablarle así. — Мне бы и в голову не пришло так с ним говорить."
    trap: "Человек стоит в me/te/le, а идея — подлежащее: se me ocurrió una idea. Не говорите «yo ocurrí»: это неверно. Не путайте с ocurrir «происходить»."

  - word: descubrirse todo el pastel
    ru: всё раскрыться, правда выйти наружу
    ipa: /deskuˈβɾiɾse ˈtoðo el pasˈtel/
    say: дэскубри́рсэ то́до эль пастэ́ль
    meaning: "Фразеологизм: всё стало известно, тайна раскрылась. Pastel — «пирог, торт»: как будто сняли крышку с пирога."
    examples:
      - "Por fin se descubrió todo el pastel. — Наконец вся правда вышла наружу."
      - "Cuando se descubrió todo el pastel, nadie en el pueblo quiso volver a saludarlo. — Когда вся правда открылась, никто в селе больше не хотел с ним здороваться."
      - "Si hablas con el periodista, se descubre el pastel y la empresa tendrá que dar explicaciones. — Если поговоришь с журналистом, всё выйдет наружу, и компании придётся давать объяснения."
    origin: "Образ от пирога, внутри которого прятали начинку или даже сюрприз: когда его открывали, всё становилось видно. Pastel — от лат. pasta «тесто»."
    register: "Разговорное."
    synonyms:
      - word: salir a la luz
        pair: ["Se descubrió todo el pastel.", "Todo salió a la luz."]
        diff:
          - "salir a la luz — нейтральное «стало известно»"
          - "descubrirse el pastel — разговорное, часто о секрете, который хотели скрыть"
    analogs:
      - "to let the cat out of the bag — выдать секрет"
      - "the truth comes out — правда выходит наружу"
    dialogue:
      - "Ana: ¿Qué pasó con la sorpresa? | Что случилось с сюрпризом?"
      - "Pablo: Se descubrió todo el pastel. | Всё раскрылось."
      - "Ana: ¿Quién lo contó? | Кто рассказал?"
      - "Pablo: Mi hermano pequeño. Dijo en voz alta lo del regalo, delante de ella. | Мой младший брат. Он вслух рассказал про подарок прямо при ней."
      - "Ana: ¡Qué desastre! ¿Y ella qué cara puso? | Какая катастрофа! А она какое лицо сделала?"
      - "Pablo: Se quedó quieta y luego se echó a reír. Fingió sorpresa, pero ya lo sabía. | Замерла, а потом засмеялась. Притворилась удивлённой, но уже знала."
      - "Ana: Pobre. Con tanto trabajo preparando la fiesta. | Бедняга. Столько труда ушло на подготовку праздника."
      - "Pablo: Pese a todo, lo pasamos bien. Se descubrió todo el pastel, pero nos reímos mucho. | Несмотря ни на что, мы хорошо провели время. Всё раскрылось, но мы много смеялись."
    cefr: "C1."
    frequency: "Нечастое: разговорное выражение."
    collocations:
      - "descubrir el pastel — раскрыть секрет"
      - "estar el pastel descubierto — всё и так ясно"
      - "repartirse el pastel — поделить пирог"
    collocation_example: "Cuando llegó la policía se descubrió el pastel. — Когда приехала полиция, всё раскрылось."
    trap: "Выражение разговорное и образное, в официальной речи не годится. Обратите внимание на глагол: descubrir — «раскрывать», а со se — «раскрылось»."

  - word: apoderarse de alguien
    ru: овладеть кем-то, охватить
    ipa: /apoðeˈɾaɾse de ˈalɣjen/
    say: аподэра́рсэ дэ а́льгьен
    pron: "d между гласными мягкое [ð]."
    meaning: "О чувстве или состоянии: целиком охватить человека. Ещё — «завладеть чем-то»: apoderarse del poder."
    examples:
      - "El pánico se apoderó de la multitud. — Паника охватила толпу."
      - "Una tristeza profunda se apoderó de él tras la muerte de su mejor amigo. — Глубокая печаль овладела им после смерти лучшего друга."
      - "El miedo se apoderó de ella en cuanto oyó pasos en el piso de arriba, vacío desde hacía meses. — Страх охватил её, как только она услышала шаги на верхнем этаже, пустовавшем месяцами."
    origin: "a- + poder «власть» + возвратное se: «взять власть над». Родственные: poder «мочь; власть», poderoso «могущественный»."
    register: "Нейтральное, книжное."
    synonyms:
      - word: invadir
        pair: ["La tristeza se apoderó de él.", "La tristeza lo invadió."]
        diff:
          - "invadir — «заполнить, нахлынуть», более нейтрально"
          - "apoderarse de — «целиком взять под контроль»"
    analogs:
      - "to take hold of — овладеть"
      - "to seize — захватить"
    dialogue:
      - "Ana: ¿Qué le pasó a Marcos? | Что случилось с Маркосом?"
      - "Pablo: El pánico se apoderó de él. | Его охватила паника."
      - "Ana: ¿Cuándo? | Когда?"
      - "Pablo: Cuando vio el humo en el rellano. Se quedó quieto, aturdido, sin poder reaccionar. | Когда увидел дым на площадке. Замер, оглушённый, не в силах отреагировать."
      - "Ana: Es normal. Cualquiera se alteraría. | Это нормально. Любой бы разволновался."
      - "Pablo: Sí, pero fue tal el pánico que ni siquiera abrió la puerta. | Да, но паника была такой, что он даже дверь не открыл."
      - "Ana: ¿Y cómo salió? | И как он вышел?"
      - "Pablo: Un vecino lo ayudó y lo sacó suavemente. Pese a todo, está bien. | Сосед помог и осторожно вывел. Несмотря ни на что, он в порядке."
    cefr: "C1."
    frequency: "Частое в прозе и новостях."
    collocations:
      - "apoderarse del miedo — охватить страхом"
      - "apoderarse del mando — захватить власть"
      - "apoderarse de lo ajeno — присвоить чужое"
    collocation_example: "Una gran tristeza se apoderó de todos. — Всех охватила глубокая грусть."
    trap: "Всегда с se и de: se apoderó de él. Чувство — подлежащее, человек — после de. Не путайте с apoderar «давать полномочия» и apoderado «доверенное лицо»."

  - word: montar en cólera
    ru: прийти в ярость
    ipa: /monˈtaɾ en ˈkolera/
    say: монта́р эн ко́лэра
    pron: "ударение на первом слоге: cólera; на конце — a."
    meaning: "Сильно разозлиться, вспылить. Cólera — «ярость» (не только болезнь)."
    examples:
      - "Montó en cólera al oír la noticia. — Он пришёл в ярость, услышав новость."
      - "Al ver que nadie había avisado al cliente, el jefe montó en cólera. — Увидев, что никто не предупредил клиента, начальник пришёл в ярость."
      - "No montes en cólera por una tontería y hablemos con calma de lo que ha pasado. — Не впадай в ярость из-за ерунды, давай спокойно поговорим о том, что случилось."
    origin: "montar «садиться, подниматься» + cólera «гнев» (греч. kholera, от khole «желчь»: древние считали, что гнев рождается от желчи). Дословно «взойти в ярость»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: enfurecerse
        pair: ["Montó en cólera.", "Se enfureció."]
        diff:
          - "enfurecerse — простой глагол «рассвирепеть»"
          - "montar en cólera — устойчивое выражение, подчёркивает вспышку"
    analogs:
      - "to fly into a rage — прийти в ярость"
      - "to blow up — взорваться"
    dialogue:
      - "Ana: ¿Cómo reaccionó el jefe? | Как отреагировал начальник?"
      - "Pablo: Montó en cólera y se fue. | Пришёл в ярость и ушёл."
      - "Ana: ¿Y todos se quedaron callados? | И все промолчали?"
      - "Pablo: Todos. Hubo un silencio incómodo y el desconcierto se notaba. | Все. Повисла неловкая тишина, и растерянность была заметна."
      - "Ana: ¿Qué le dijeron para ponerlo así? | Что ему сказали, что он так рассердился?"
      - "Pablo: Que el cliente había cancelado el contrato. Esgrimió que era culpa de todos. | Что клиент расторг контракт. Он заявил, что виноваты все."
      - "Ana: Qué soberbia. | Какое высокомерие."
      - "Pablo: Sí. Cuando monta en cólera, no hay quien lo calme. | Да. Когда он приходит в ярость, его не успокоить."
    cefr: "C1."
    frequency: "Нечастое: в рассказах и новостях."
    collocations:
      - "montar en cólera — взорваться от гнева"
      - "montar un escándalo — устроить скандал"
      - "ataque de cólera — приступ ярости"
    collocation_example: "Montó un escándalo en el restaurante. — Он устроил скандал в ресторане."
    trap: "Cólera женского рода: la cólera. Но el cólera — «холера» (болезнь): у слова одно написание и два рода, разные значения."

  - word: estar de adorno
    ru: быть бесполезным, быть «для вида»
    ipa: /esˈtaɾ de aˈðoɾno/
    say: эста́р дэ адо́рно
    pron: "d между гласными мягкое [ð]."
    meaning: "О человеке или вещи: присутствует, но ничего не делает или ничему не помогает. Только «для красоты»."
    examples:
      - "La lámpara está de adorno en el salón. — Лампа стоит в гостиной для вида."
      - "Todas las decisiones las toma su secretaria, porque el director está de adorno. — Все решения принимает его секретарша, потому что директор здесь для вида."
      - "No quiero estar de adorno en la reunión: si me invitáis, quiero opinar sobre el plan. — Я не хочу быть на собрании для вида: если вы меня приглашаете, я хочу высказаться о плане."
    origin: "adorno «украшение» (от adornar «украшать»). Estar de adorno — «быть в роли украшения»."
    register: "Разговорное, часто с иронией."
    synonyms:
      - word: servir de poco
        pair: ["Está de adorno en la reunión.", "Sirve de poco en la reunión."]
        diff:
          - "servir de poco — «приносить мало пользы», нейтральнее"
          - "estar de adorno — резче, «просто сидит, ничего не делает»"
    analogs:
      - "to be just for show — быть для вида"
      - "to be ornamental — быть украшением"
    dialogue:
      - "Ana: ¿Para qué sirve ese cargo? | Зачем нужна эта должность?"
      - "Pablo: Está de adorno. Nadie decide nada. | Она для вида. Никто ничего не решает."
      - "Ana: ¿Y quién lo ocupa? | И кто её занимает?"
      - "Pablo: Un señor muy discreto. Firma lo que le piden y se retira a su despacho. | Один очень сдержанный сеньор. Подписывает, что просят, и уходит к себе в кабинет."
      - "Ana: Qué desperdicio. | Какая трата."
      - "Pablo: Sí. En esta empresa hay muchos puestos de adorno, con sueldos altos. | Да. В этой фирме много должностей для вида с высокими зарплатами."
      - "Ana: Y la gente trabajadora no da abasto. | А рабочие люди не справляются."
      - "Pablo: Exacto. Por eso reclamamos más fluidez en el trabajo. | Именно. Поэтому мы требуем большей слаженности в работе."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "estar de adorno — быть для вида"
      - "servir de adorno — служить украшением"
      - "de adorno — для красоты"
    collocation_example: "Las flores están de adorno en la mesa. — Цветы стоят на столе для красоты."
    trap: "Выражение может быть обидным, если сказано о человеке. С предлогом de: estar DE adorno. Не путайте adorno «украшение» с adoración «обожание»."

  - word: turno
    ru: смена; очередь
    ipa: /ˈtuɾno/
    say: ту́рно
    meaning: "Время работы по очереди (рабочая смена) и очередь: «ваш ход». Turno de noche — ночная смена."
    examples:
      - "Me toca el turno de noche. — Мне выпала ночная смена."
      - "Espera tu turno, por favor, que todavía hay cuatro personas antes que tú. — Подожди своей очереди, пожалуйста, перед тобой ещё четыре человека."
      - "Mi turno empieza a las ocho y termina a las cuatro, con media hora para comer. — Моя смена начинается в восемь и заканчивается в четыре, с получасовым перерывом на обед."
    origin: "От итальянского turno «очередь, оборот»: от лат. tornare «вращать». Родственные: tornear «точить», volver «возвращаться», turnarse «чередоваться»."
    register: "Нейтральное."
    synonyms:
      - word: vez
        pair: ["Es tu turno.", "Es tu vez."]
        diff:
          - "vez — «раз» и «очередь» в разговоре: ¿Quién da la vez? — Кто последний?"
          - "turno — очередь по номеру, по графику; и рабочая смена"
    analogs:
      - "shift — рабочая смена"
      - "turn — очередь, ход"
    dialogue:
      - "Ana: ¿A qué hora sales? | Во сколько ты заканчиваешь?"
      - "Pablo: Cuando acabe el turno de tarde. | Когда закончится дневная смена."
      - "Ana: ¿Y mañana? | А завтра?"
      - "Pablo: Me toca el turno de noche. Es agotador, pero pagan mejor. | У меня ночная смена. Это изматывает, но платят лучше."
      - "Ana: ¿Y duermes de día? | И ты спишь днём?"
      - "Pablo: Lo intento, pero los vecinos arman un follón. Estoy sumido en un cansancio constante. | Пытаюсь, но соседи шумят. Я нахожусь в постоянной усталости."
      - "Ana: Pide cambio de turno. | Попроси сменить график."
      - "Pablo: Ya lo hice. Quedamos en que, una vez que acabe el mes, me cambian. | Уже просил. Мы договорились, что как только закончится месяц, меня переведут."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "turno de noche — ночная смена"
      - "por turnos — по очереди"
      - "pedir turno — записаться на приём"
    collocation_example: "Trabajo por turnos en el hospital. — Я работаю в больнице по сменам."
    trap: "Turno — и «смена», и «очередь»: контекст подскажет. Не путайте с tuno «студент-музыкант» и turismo «туризм»."

  - word: hacerse eco de una noticia
    ru: подхватить, растиражировать новость
    ipa: /aˈθeɾse ˈeko de ˈuna noˈtiθja/
    say: асэ́рсэ э́ко дэ у́на ноти́сья
    pron: "h не читается; z/c в Испании — [θ]."
    meaning: "О СМИ или людях: повторить и разнести новость дальше. Eco — «эхо»."
    examples:
      - "La radio se hizo eco de la noticia. — Радио подхватило эту новость."
      - "Todos los periódicos se hicieron eco de la noticia al día siguiente. — Все газеты подхватили эту новость на следующий день."
      - "Las redes sociales se hicieron eco del caso y en pocas horas miles de personas lo habían leído. — Социальные сети разнесли эту историю, и за несколько часов её прочитали тысячи людей."
    origin: "hacerse «становиться» + eco «эхо» (греч. ēkhō «звук»). Образ: новость как эхо разносится от одного к другому."
    register: "Формальное, язык новостей."
    synonyms:
      - word: difundir
        pair: ["La prensa se hizo eco de la noticia.", "La prensa difundió la noticia."]
        diff:
          - "difundir — просто «распространить»"
          - "hacerse eco — «подхватить то, что сказали другие», с оттенком повторения"
    analogs:
      - "to echo a story — подхватить историю"
      - "to pick up on — подхватить"
    dialogue:
      - "Ana: ¿Salió en las noticias? | Об этом говорили в новостях?"
      - "Pablo: Sí, todos se hicieron eco. | Да, все подхватили эту новость."
      - "Ana: ¿Y qué decían? | И что говорили?"
      - "Pablo: Que el inspector de Hacienda había descubierto un fraude enorme. | Что налоговый инспектор обнаружил огромное мошенничество."
      - "Ana: ¡No me digas! ¿Quién? | Не может быть! Кто?"
      - "Pablo: Un socio de la joyería. La radio y la tele se hicieron eco de la noticia enseguida. | Партнёр ювелирного магазина. Радио и телевидение сразу подхватили новость."
      - "Ana: Habrá cotilleo para rato. | Сплетен теперь надолго хватит."
      - "Pablo: Seguro. Y los periódicos, de hecho, ya preparan reportajes. | Точно. И газеты, кстати, уже готовят репортажи."
    cefr: "C1."
    frequency: "Частое в журналистике."
    collocations:
      - "hacerse eco de — подхватить"
      - "hacerse eco de las críticas — повторить критику"
      - "tener eco — найти отклик"
    collocation_example: "La televisión se hizo eco de las quejas de los vecinos. — Телевидение подхватило жалобы соседей."
    trap: "Выражение с предлогом de: hacerse eco DE algo. Eco — мужского рода: el eco. Не путайте с echo (форма echar): «echo de menos»."

  - word: remedio
    ru: выход, средство, лекарство
    ipa: /reˈmeðjo/
    say: рэмэ́дьо
    pron: "r в начале — раскатистое; d между гласными мягкое [ð]."
    meaning: "Способ исправить положение: «выход», «средство». Ещё — домашнее лекарство. «No hay remedio» — «ничего не поделать»."
    examples:
      - "Es el único remedio que tenemos. — Это единственное средство, которое у нас есть."
      - "No hay más remedio que esperar a que pase la tormenta. — Ничего не остаётся, как ждать, пока пройдёт гроза."
      - "Cuando perdió el trabajo, no tuvo más remedio que vender el coche y mudarse con sus padres. — Когда он потерял работу, ему ничего не оставалось, как продать машину и переехать к родителям."
    origin: "Из лат. remedium «лекарство»: re- «снова» + mederi «лечить». Родственные: remediar «исправить», medicina «лекарство»."
    register: "Нейтральное."
    synonyms:
      - word: solución
        pair: ["No hay remedio.", "No hay solución."]
        diff:
          - "solución — «решение» задачи, проблемы"
          - "remedio — средство, чтобы что-то исправить или вылечить"
    analogs:
      - "remedy — средство, лекарство"
      - "way out — выход"
    dialogue:
      - "Ana: ¿Qué podemos hacer? | Что мы можем сделать?"
      - "Pablo: No hay otro remedio, tenemos que esperar. | Другого выхода нет, придётся ждать."
      - "Ana: ¿Hasta cuándo? | До каких пор?"
      - "Pablo: Hasta dentro de unos días. El médico dice que ni siquiera hay que cambiar el tratamiento. | Ещё несколько дней. Врач говорит, что лечение даже менять не нужно."
      - "Ana: ¿Y no hay algún remedio casero? | А домашнего средства нет?"
      - "Pablo: Té con miel, reposo y mucha paciencia. Es el único remedio que tenemos. | Чай с мёдом, покой и много терпения. Это единственное средство, что у нас есть."
      - "Ana: Pues a armarse de paciencia. | Ну тогда запасаемся терпением."
      - "Pablo: Eso es. Y si empeora, volvemos al hospital sin demora. | Вот именно. А если станет хуже, без промедления вернёмся в больницу."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "no hay más remedio — ничего не остаётся"
      - "sin remedio — без выхода, непоправимо"
      - "remedio casero — домашнее средство"
      - "poner remedio — исправить положение"
    collocation_example: "Tuve que aceptar, no había remedio. — Мне пришлось согласиться, выхода не было."
    trap: "Ложный друг: remedio чаще «выход, средство», а не только «лекарство». «Medicina» и «medicamento» — это именно лекарство."

  - word: ser la ruina de alguien
    ru: стать чьей-то погибелью, катастрофой
    ipa: /seɾ la ˈrwina de ˈalɣjen/
    say: сэр ла ру́ина дэ а́льгьен
    pron: "r в ruina — раскатистое; ui — один слог «уи»."
    meaning: "Стать причиной чьего-то краха: разорения, несчастья, гибели."
    examples:
      - "Esa decisión será mi ruina. — Это решение станет моей погибелью."
      - "Para su familia, que lo perdió todo, el juego fue la ruina. — Для его семьи, которая потеряла всё, азартные игры стали погибелью."
      - "La guerra fue la ruina de muchos pueblos que dependían del comercio con el otro lado de la frontera. — Война стала разорением для многих сёл, которые зависели от торговли с той стороной границы."
    origin: "ruina «развалины, крах» (лат. ruina «обвал», от ruere «рушиться»). Родственные: arruinar «разорять», ruinoso «разорительный»."
    register: "Нейтральное, книжное."
    synonyms:
      - word: perder a alguien
        pair: ["Eso fue su ruina.", "Eso lo perdió."]
        diff:
          - "perder a alguien — короче и разговорнее"
          - "ser la ruina de alguien — образнее и громче"
    analogs:
      - "to be someone's undoing — стать чьей-то погибелью"
      - "to ruin someone — разорить"
    dialogue:
      - "Ana: ¿Por qué quebró la empresa? | Почему обанкротилась фирма?"
      - "Pablo: Las deudas fueron su ruina. | Долги её погубили."
      - "Ana: ¿Tantas eran? | Их было так много?"
      - "Pablo: Sí. Pidieron préstamos sin pensar y luego no pudieron pagar los impuestos. | Да. Брали кредиты, не думая, а потом не смогли заплатить налоги."
      - "Ana: Qué consecuencia nefasta para los empleados. | Какое пагубное последствие для работников."
      - "Pablo: Muchos se quedaron sin sueldo. El dueño, sin embargo, se retiró a una casa en la costa. | Многие остались без зарплаты. А хозяин при этом удалился в дом на побережье."
      - "Ana: ¡Qué injusticia! Esa decisión fue la ruina de todos menos de él. | Какая несправедливость! Это решение погубило всех, кроме него."
      - "Pablo: Ya ves. A veces el culpable ni siquiera se arrepiente. | Вот так. Иногда виновный даже не раскаивается."
    cefr: "C1."
    frequency: "Нечастое: в прозе и газетах."
    collocations:
      - "ser la ruina — быть разорением"
      - "estar en la ruina — быть разорённым"
      - "llevar a la ruina — довести до краха"
    collocation_example: "Las malas inversiones lo llevaron a la ruina. — Неудачные вложения довели его до краха."
    trap: "Ruina — женского рода: la ruina. Без «de alguien» ser la ruina значит «стать катастрофой». Во множественном ruinas — «развалины»: las ruinas romanas."
