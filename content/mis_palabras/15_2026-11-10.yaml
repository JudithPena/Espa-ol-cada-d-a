# Недостающие слова из списка Гали от 10 ноября. Только личная колода автора.
# Примеры A2 / B1 / B2; мини-сцены B1–B2 повторяют прежнюю лексику автора.
# Этимология сверена при создании исходных карточек: https://dle.rae.es/arrojar ; https://dle.rae.es/lechuza
lang: es
words:
- word: corpulento
  ru: крупный, массивного телосложения
  ipa: /koɾpuˈlento/
  say: корпулэ́нто
  meaning: Так говорят о человеке с крупным, массивным телом. Слово описывает телосложение, а не обязательно лишний
    вес. Женская форма — corpulenta.
  examples:
  - El vecino es tan corpulento que necesita una silla más grande. — Сосед настолько крупный, что ему нужен стул
    побольше.
  - El testigo describió a un hombre corpulento que había atravesado la plaza minutos antes. — Свидетель описал
    мужчину крупного телосложения, который пересёк площадь несколькими минутами ранее.
  - Aunque era corpulento, se movía con una agilidad que sorprendía a todos. — Хотя он был массивного телосложения,
    он двигался с ловкостью, которая всех удивляла.
  origin: Происходит от латинского corpulentus, связанного с corpus «тело». Родственные испанские слова — cuerpo
    «тело» и corpulencia «крупное телосложение».
  register: Нейтральное описательное слово. Часто встречается в портретах персонажей и описаниях внешности.
  synonyms:
  - word: robusto
    pair:
    - El portero es corpulento.
    - El portero es robusto.
    diff:
    - Corpulento подчёркивает размеры тела; robusto — крепость и силу, даже при небольшом росте.
  analogs:
  - burly — крупный и крепкий; corpulent по-английски чаще подчёркивает полноту и звучит книжно.
  dialogue:
  - 'Ana: El testigo afirma que vio a un hombre corpulento junto a la puerta. | Свидетель утверждает, что видел
    у двери крупного мужчину.'
  - 'Pablo: ¿Pudo reconocerlo o solo se fijó en su aspecto? | Он смог его узнать или только обратил внимание на
    его внешность?'
  - 'Ana: No está seguro, pero recuerda que llevaba un disfraz. | Он не уверен, но помнит, что тот был в маскарадном
    костюме.'
  - 'Pablo: Entonces habrá que comprobar esa pista antes de sacar conclusiones. | Тогда придётся проверить эту зацепку,
    прежде чем делать выводы.'
  cefr: B2 — точное описание телосложения вместо общего grande.
  frequency: Умеренно частое слово в художественных текстах и описаниях людей.
  collocations:
  - un hombre corpulento — мужчина крупного телосложения
  - una mujer corpulenta — женщина крупного телосложения
  - de aspecto corpulento — массивный на вид
  collocation_example: Un hombre corpulento abrió la puerta. — Мужчина крупного телосложения открыл дверь.
  trap: 'Corpulento не означает «мускулистый»: для этого есть musculoso. Форму согласуют с человеком: una mujer
    corpulenta.'
- word: rollizo
  ru: пухлый, упитанный
  ipa: /roˈʝiθo/
  say: ройи́со
  pron: Начальная r произносится раскатисто; ll в большей части Испании звучит как /ʝ/, а z — как межзубное /θ/.
    Приблизительное «с» не передаёт этот звук точно.
  meaning: Описывает округлое, полное тело, особенно у ребёнка или животного. Женская форма — rolliza. В зависимости
    от контекста звучит ласково или может задеть человека.
  examples:
  - El gato está más rollizo porque ahora come dos veces al día. — Кот стал упитаннее, потому что теперь ест два
    раза в день.
  - En aquella foto aparecía un niño rollizo al que nadie de la familia consiguió reconocer. — На той фотографии
    был пухлый мальчик, которого никто из семьи не смог узнать.
  - El gato, antes delgado, se había vuelto rollizo desde que vivía con nosotros. — Раньше кот был худым, но с тех
    пор как он жил с нами, он стал упитанным.
  origin: 'Связано со словом rollo «рулон, валик»: исходный образ — что-то округлое, цилиндрическое. Суффикс -izo
    образует прилагательное.'
  register: Описательное, нередко ласковое о младенцах и животных. В разговоре о взрослом требует такта.
  synonyms:
  - word: regordete
    pair:
    - Es un bebé rollizo.
    - Es un bebé regordete.
    diff:
    - Regordete обычно звучит более разговорно и ласково; rollizo чаще встречается в описаниях.
  analogs:
  - plump / chubby — округлый, пухлый; chubby особенно часто говорят о детях.
  dialogue:
  - 'Ana: El gato rollizo del vecino se ha quedado quieto junto a la ventana. | Упитанный соседский кот замер возле
    окна.'
  - 'Pablo: Se ha fijado en un pájaro; lleva un rato mirándolo fijamente. | Он заметил птицу; уже некоторое время
    пристально на неё смотрит.'
  - 'Ana: Con ese aspecto tan tranquilo, nadie diría que está a punto de saltar. | С таким спокойным видом и не
    скажешь, что он вот-вот прыгнет.'
  - 'Pablo: Mejor cierro la ventana antes de que nos dé un disgusto. | Лучше закрою окно, пока он не доставил нам
    неприятностей.'
  cefr: B2 — более точное описание полноты, чем gordo.
  frequency: Встречается в описаниях детей, животных и литературных портретах.
  collocations:
  - un bebé rollizo — пухлый малыш
  - unas mejillas rollizas — пухлые щёки
  - un gato rollizo — упитанный кот
  collocation_example: El bebé tiene las mejillas rollizas. — У малыша пухлые щёки.
  trap: Rollizo говорит об округлости и полноте, а corpulento — о крупном телосложении. Это не полные синонимы.
- word: valla
  ru: забор, ограждение
  ipa: /ˈbaʝa/
  say: ба́йя
  pron: V звучит как испанская b; ll в большей части Испании произносится как /ʝ/. При таком произношении valla
    и vaya звучат одинаково.
  meaning: La valla — забор или ограждение, которое отделяет участок или перекрывает проход. В спорте так называют
    барьер, а valla publicitaria — рекламный щит.
  examples:
  - Pusimos una valla alrededor del jardín para que el perro no saliera. — Мы поставили вокруг сада забор, чтобы
    собака не выходила.
  - Cuando llegamos a la finca, descubrimos que alguien había cortado la valla durante la noche. — Когда мы приехали
    в поместье, мы обнаружили, что ночью кто-то прорезал ограждение.
  - La valla que separaba los jardines cayó durante la tormenta de anoche. — Забор, который разделял сады, упал
    во время вчерашней ночной бури.
  origin: Происходит от латинского valla, множественного числа vallum «укрепление, ограда». Связанный глагол vallar
    означает «огораживать».
  register: Нейтральное бытовое слово; употребляется также в спорте и рекламе.
  synonyms:
  - word: cerca
    pair:
    - Han puesto una valla alrededor del jardín.
    - Han puesto una cerca alrededor del jardín.
    diff:
    - Cerca в этом значении — существительное «ограда»; valla также бывает временным барьером или рекламным щитом.
  analogs:
  - fence — забор; barrier — ограждение; billboard — только рекламный щит.
  dialogue:
  - 'Ana: Alguien ha atravesado la finca y ha dejado rota la valla. | Кто-то прошёл через поместье и оставил забор
    сломанным.'
  - 'Pablo: ¿Hay alguna pista que permita averiguar quién ha sido? | Есть какая-нибудь зацепка, которая поможет
    выяснить, кто это был?'
  - 'Ana: Solo un trozo de tela; parece que el intruso se ha hecho un rasguño. | Только кусочек ткани; похоже, незваный
    гость поцарапался.'
  - 'Pablo: Entonces conviene guardarlo y avisar a la policía. | Тогда стоит его сохранить и сообщить в полицию.'
  cefr: B1 — полезное название ограждения в городе и за городом.
  frequency: Частое слово в быту, дорожных объявлениях и спортивных новостях.
  collocations:
  - saltar una valla — перепрыгнуть через забор
  - una valla de madera — деревянный забор
  - una valla publicitaria — рекламный щит
  - poner una valla — поставить ограждение
  collocation_example: Pusieron una valla de madera en el jardín. — В саду поставили деревянный забор.
  trap: Valla — забор, vaya — форма ir или восклицание, а baya — ягода. В большинстве Испании все три слова звучат
    одинаково.
- word: espiar
  ru: шпионить, подглядывать, тайно следить
  ipa: /esˈpjaɾ/
  say: эспья́р
  meaning: Тайно наблюдать за человеком или собирать сведения, чтобы он об этом не знал. Может описывать и работу
    шпиона, и бытовое подглядывание.
  examples:
  - Los niños espiaban al vecino porque querían saber qué hacía en el jardín. — Дети подглядывали за соседом, потому
    что хотели узнать, что он делает в саду.
  - El detective averiguó que alguien llevaba semanas espiando los movimientos de la víctima. — Детектив выяснил,
    что кто-то уже несколько недель тайно следил за передвижениями жертвы.
  - Descubrió que alguien lo espiaba cuando encontró una cámara oculta en su despacho. — Он обнаружил, что за ним
    кто-то следил, когда нашёл скрытую камеру в кабинете.
  origin: 'Связано со словом espía «шпион», пришедшим через французский из германского корня со значением «наблюдать».
    Спряжение: espío, espías, espía.'
  register: Нейтральное слово, обычно с оттенком скрытности и нарушения чужой приватности.
  synonyms:
  - word: vigilar
    pair:
    - Espían al vecino desde la ventana.
    - Vigilan al vecino desde la ventana.
    diff:
    - Espiar обязательно предполагает тайное наблюдение; vigilar может означать открытое наблюдение или охрану.
  analogs:
  - to spy on — тайно следить за человеком; to peek — украдкой заглянуть, часто ненадолго.
  dialogue:
  - Ana se fijó en una figura que parecía espiar al vecino desde la calle. | Ана заметила фигуру, которая, казалось,
    тайно наблюдала за соседом с улицы.
  - En lugar de acercarse, decidió quedarse quieta para no llamar la atención. | Вместо того чтобы подойти, она
    решила оставаться неподвижной, чтобы не привлекать внимания.
  - Cuando reconoció al testigo, comprendió que aquella visita no era una coincidencia. | Когда она узнала свидетеля,
    она поняла, что этот визит не был совпадением.
  cefr: B1 — глагол скрытого наблюдения, полезный в рассказах.
  frequency: Регулярно встречается в детективах, новостях о слежке и бытовых историях.
  collocations:
  - espiar a alguien — тайно следить за кем-то
  - espiar por la ventana — подглядывать через окно
  - espiar los movimientos de alguien — следить за чьими-то передвижениями
  collocation_example: No debes espiar a tus vecinos. — Не следует подглядывать за соседями.
  trap: 'Перед человеком нужна личная a: espiar a alguien. У настоящего времени ударение на í: yo espío; в инфинитиве
    espiar знака ударения нет.'
- word: habitual
  ru: обычный, привычный, постоянный
  ipa: /aβiˈtwal/
  say: абитуа́ль
  pron: H не читается; b между гласными произносится мягко, без полного смыкания губ. Ударение падает на последний
    слог.
  meaning: 'То, что происходит регулярно или стало привычным. О человеке означает «постоянный»: un cliente habitual
    — постоянный клиент. Форма одинакова для обоих родов.'
  examples:
  - Hoy no he ido a mi café habitual porque estaba cerrado por obras. — Сегодня я не пошёл в своё обычное кафе,
    потому что оно было закрыто на ремонт.
  - La ausencia de su cliente habitual llamó la atención del camarero, que decidió telefonearle. — Отсутствие постоянного
    клиента привлекло внимание официанта, который решил ему позвонить.
  - Aunque es habitual que llegue tarde, hoy su retraso nos ha preocupado de verdad. — Хотя он обычно опаздывает,
    сегодня его задержка нас действительно встревожила.
  origin: Связано с hábito «привычка», из латинского habitus «состояние, образ поведения». Суффикс -al образует
    прилагательное.
  register: Нейтральное; подходит для повседневной речи, объявлений и официальных текстов.
  synonyms:
  - word: frecuente
    pair:
    - Es un problema habitual.
    - Es un problema frecuente.
    diff:
    - Habitual подчёркивает привычность или повторяющийся порядок, frecuente — высокую частоту.
  analogs:
  - usual / regular — обычный, постоянный; habitual по-английски чаще описывает устойчивую привычку.
  dialogue:
  - 'Ana: El cliente habitual no ha aparecido y el camarero empieza a desconfiar. | Постоянный клиент не появился,
    и официант начинает что-то подозревать.'
  - 'Pablo: ¿Ha ocurrido algo que justifique esa preocupación? | Произошло что-то, что оправдывает это беспокойство?'
  - 'Ana: Ayer parecía distraído y dejó una nota suelta en la mesa. | Вчера он выглядел рассеянным и оставил на
    столе отдельный листок с записью.'
  - 'Pablo: Antes de alarmarnos, conviene averiguar si alguien ha hablado con él. | Прежде чем поднимать тревогу,
    стоит выяснить, говорил ли с ним кто-нибудь.'
  cefr: B1 — описание привычных действий, мест и постоянных посетителей.
  frequency: Частое слово в разговоре, новостях и объявлениях о режиме работы.
  collocations:
  - un cliente habitual — постоянный клиент
  - el horario habitual — обычное расписание
  - como es habitual — как обычно
  - la ruta habitual — привычный маршрут
  collocation_example: Mañana volvemos al horario habitual. — Завтра мы возвращаемся к обычному расписанию.
  trap: 'Не добавляйте окончание -a: una clienta habitual. Во множественном числе — habituales.'
- word: soportar
  ru: терпеть, выносить; выдерживать нагрузку
  ipa: /sopoɾˈtaɾ/
  say: сопорта́р
  meaning: 'Выносить что-то неприятное: шум, боль, жару, поведение человека. О конструкции или предмете — выдерживать
    вес или нагрузку.'
  examples:
  - No soportaba el ruido de la calle, así que cerré todas las ventanas. — Я не выносил уличный шум, поэтому закрыл
    все окна.
  - Aunque la herida no parecía grave, no podía soportar el dolor y pidió un calmante. — Хотя рана не казалась серьёзной,
    он не мог терпеть боль и попросил обезболивающее.
  - El puente tuvo que cerrarse porque ya no soportaba el peso de los camiones. — Мост пришлось закрыть, потому
    что он больше не выдерживал вес грузовиков.
  origin: От латинского supportare «нести, поддерживать снизу». Отсюда же soporte «опора, подставка».
  register: Нейтральное. No soporto… часто выражает сильное раздражение.
  synonyms:
  - word: aguantar
    pair:
    - No soporto este ruido.
    - No aguanto este ruido.
    diff:
    - Aguantar чаще звучит в разговорной речи; soportar подходит и для более формального описания нагрузки.
  analogs:
  - to bear / to put up with — терпеть; английское to support в значении «поддерживать человека» обычно соответствует
    apoyar.
  dialogue:
  - 'Ana: No soporto este murmullo; necesito concentrarme en el informe. | Я не выношу этот гул; мне нужно сосредоточиться
    на отчёте.'
  - 'Pablo: Habrá que armarse de paciencia, porque el turno entrante aún no ha llegado. | Придётся набраться терпения,
    потому что новая смена ещё не пришла.'
  - 'Ana: Lo sé, pero no quiero cometer un error por el cansancio. | Я знаю, но не хочу допустить ошибку из-за усталости.'
  - 'Pablo: Entonces busca un sitio tranquilo; yo me encargo de atender a la gente. | Тогда найди спокойное место;
    я займусь посетителями.'
  cefr: B1 — выражение терпения, раздражения и физической нагрузки.
  frequency: Очень распространено в сочетании no soportar, а также в описаниях конструкций.
  collocations:
  - soportar el dolor — терпеть боль
  - no soportar el ruido — не выносить шум
  - soportar el peso — выдерживать вес
  collocation_example: Esta mesa no soporta tanto peso. — Этот стол не выдерживает такой вес.
  trap: «Поддерживать друга» — apoyar a un amigo. Soportar a un amigo означает «терпеть друга», что передаёт совсем
    другое отношение.
- word: opuesto
  ru: противоположный; противоположность
  ipa: /oˈpwesto/
  say: опуэ́сто
  meaning: То, что находится на другой стороне или полностью отличается по смыслу, направлению, позиции. Как существительное
    lo opuesto означает «противоположное». Женская форма — opuesta.
  examples:
  - La farmacia estaba en el lado opuesto de la calle y tuvimos que cruzar. — Аптека была на противоположной стороне
    улицы, и нам пришлось перейти дорогу.
  - Los dos testigos ofrecieron versiones opuestas, por lo que el inspector volvió a interrogarlos. — Два свидетеля
    дали противоположные версии, поэтому инспектор снова их допросил.
  - Aunque compartían el mismo objetivo, defendían opiniones opuestas sobre cómo alcanzarlo. — Хотя у них была общая
    цель, они отстаивали противоположные мнения о том, как её достичь.
  origin: Это также причастие глагола oponer «противопоставлять», восходящего к латинскому opponere «ставить напротив».
    Родственное слово — oposición «противодействие».
  register: Нейтральное слово для пространственных описаний, сравнений и споров.
  synonyms:
  - word: contrario
    pair:
    - Caminaban en direcciones opuestas.
    - Caminaban en direcciones contrarias.
    diff:
    - В описании направлений слова близки; opuesto часто подчёркивает полную противоположность двух позиций.
  analogs:
  - opposite — противоположный; opposed to — настроенный против чего-то.
  dialogue:
  - 'Ana: Las dos versiones son tan opuestas que una de ellas tiene que ser falsa. | Эти две версии настолько противоположны,
    что одна из них должна быть ложной.'
  - 'Pablo: Sin embargo, ambos testigos parecen convencidos de lo que vieron. | Однако оба свидетеля, кажется, убеждены
    в том, что видели.'
  - 'Ana: Quizá se fijaron en momentos distintos y no están mintiendo. | Возможно, они обратили внимание на разные
    моменты и не лгут.'
  - 'Pablo: Esa posibilidad tiene sentido; comparemos primero las horas. | Этот вариант имеет смысл; сначала сравним
    время.'
  cefr: B1 — сравнение направлений, качеств и мнений.
  frequency: Частое слово в бытовой речи, обсуждениях и учебных объяснениях.
  collocations:
  - el lado opuesto — противоположная сторона
  - en sentido opuesto — в противоположном направлении
  - lo opuesto a algo — противоположность чему-то
  - opiniones opuestas — противоположные мнения
  collocation_example: El autobús iba en sentido opuesto. — Автобус ехал в противоположном направлении.
  trap: «Противоположность чему-то» — lo opuesto a algo, с предлогом a. Не путайте с puesto «поставленный, место,
    должность».
- word: acontecimiento
  ru: событие, значительное происшествие
  ipa: /akonteθiˈmjento/
  say: аконтэсимье́нто
  pron: C перед i в Испании произносится как межзубное /θ/, а первая c перед o — как /k/.
  meaning: El acontecimiento — событие, обычно заметное или важное для людей. Это может быть историческое событие,
    общественное мероприятие или важный момент личной жизни.
  examples:
  - La boda fue un acontecimiento importante y vino toda nuestra familia. — Свадьба стала важным событием, и приехала
    вся наша семья.
  - El acontecimiento causó tanto asombro que los vecinos siguieron comentándolo durante varios días. — Событие
    вызвало такое удивление, что соседи обсуждали его ещё несколько дней.
  - El periodista explicó cómo aquel acontecimiento había cambiado la vida de toda una generación. — Журналист объяснил,
    как то событие изменило жизнь целого поколения.
  origin: Образовано от acontecer «происходить» с суффиксом -miento, который создаёт существительные действия или
    результата.
  register: Нейтральное, но более весомое и книжное, чем просто algo que pasó «то, что произошло».
  synonyms:
  - word: suceso
    pair:
    - Fue un acontecimiento inesperado.
    - Fue un suceso inesperado.
    diff:
    - Acontecimiento выделяет значимость; suceso просто называет случившееся, а в новостях часто обозначает происшествие.
  analogs:
  - event — событие; happening — произошедшее, обычно без обязательного оттенка важности.
  dialogue:
  - 'Ana: Nadie esperaba que aquel acontecimiento provocara tanta envidia. | Никто не ожидал, что то событие вызовет
    столько зависти.'
  - 'Pablo: La fortuna del heredero siempre ha despertado resentimiento en la familia. | Состояние наследника всегда
    вызывало обиду у родственников.'
  - 'Ana: Aun así, cuesta creer que alguien llegara a chantajearlo por eso. | И всё же трудно поверить, что кто-то
    дошёл до шантажа из-за этого.'
  - 'Pablo: Hasta que aparezca una prueba, no conviene acusar a nadie. | Пока не появится доказательство, не стоит
    никого обвинять.'
  cefr: B1 — описание заметных событий в жизни и истории.
  frequency: Частое слово в новостях, исторических рассказах и описаниях важных дат.
  collocations:
  - un acontecimiento histórico — историческое событие
  - un acontecimiento importante — важное событие
  - los últimos acontecimientos — последние события
  collocation_example: La apertura del museo fue un acontecimiento importante. — Открытие музея стало важным событием.
  trap: 'Это существительное мужского рода: el acontecimiento. Само слово не означает несчастье: событие может быть
    радостным.'
- word: lechuza
  ru: сова
  ipa: /leˈtʃuθa/
  say: лечу́са
  pron: Ch произносится как «ч», а z в Испании — как межзубное /θ/.
  meaning: La lechuza — сова, ночная птица с характерным светлым лицевым диском в форме сердца. Это один из видов
    совообразных; для общего слова «сова» часто используют búho.
  examples:
  - Anoche vimos una lechuza blanca que estaba en el tejado de la casa. — Вчера ночью мы увидели белую сову, которая
    сидела на крыше дома.
  - El testigo creyó oír un grito, pero después averiguó que había sido una lechuza. — Свидетель подумал, что услышал
    крик человека, но потом выяснил, что это была сова.
  - Como la lechuza caza de noche, es más fácil oírla que verla volar. — Поскольку сова охотится ночью, её легче
    услышать, чем увидеть в полёте.
  origin: По DLE, происходит от старого nechuza, восходящего к латинскому noctua «ночная птица». На форму повлияло
    leche «молоко» из-за старого суеверия, связывавшего эту птицу с кормлением младенцев.
  register: Нейтральное название птицы; употребляется в быту, рассказах и текстах о природе.
  synonyms:
  - word: lechuza común
    pair:
    - Una lechuza anida en la granja.
    - Una lechuza común anida en la granja.
    diff:
    - Lechuza común — более точное название этой птицы; lechuza — короткий бытовой вариант.
  analogs:
  - owl — сова; barn owl — более точное английское название этой птицы.
  dialogue:
  - 'Ana: Aquel grito me dio un escalofrío; pensé que alguien estaba herido. | От того крика у меня пошли мурашки;
    я подумала, что кто-то ранен.'
  - 'Pablo: Yo también me alteré, hasta que vi una lechuza en el tejado. | Я тоже разволновался, пока не увидел
    на крыше сову.'
  - 'Ana: Con esta tormenta, cualquier ruido parece amenazante. | В такую грозу любой шум кажется угрожающим.'
  - 'Pablo: De todas formas, vamos a comprobar que las ventanas estén cerradas. | В любом случае давай проверим,
    закрыты ли окна.'
  cefr: B2 — конкретное название птицы, полезное при чтении.
  frequency: Не повседневное слово; регулярно встречается в рассказах и текстах о природе.
  collocations:
  - una lechuza común — обыкновенная сова
  - el grito de una lechuza — крик совы
  - una lechuza blanca — белая сова
  collocation_example: Oímos el grito de una lechuza en el bosque. — В лесу мы услышали крик совы.
  trap: 'Не каждую сову называют lechuza: búho — более широкое бытовое слово. Грамматический род — женский: la lechuza,
    даже если пол птицы неизвестен.'
- word: tratar
  ru: обращаться с кем-то; лечить; обсуждать
  ipa: /tɾaˈtaɾ/
  say: трата́р
  meaning: 'Значение зависит от конструкции: tratar bien a alguien — хорошо обращаться с человеком; tratar una enfermedad
    — лечить болезнь; tratar un tema — обсуждать тему. Tratar de + инфинитив означает «пытаться», а tratarse de
    — «речь идёт о».'
  examples:
  - El médico trató a mi padre y le explicó cómo tomar las pastillas. — Врач лечил моего отца и объяснил ему, как
    принимать таблетки.
  - La reunión trató un problema que llevaba meses causando conflictos entre los vecinos. — На собрании обсуждалась
    проблема, которая уже несколько месяцев вызывала конфликты между соседями.
  - Aunque trató de mantener la calma, se notaba que aquella pregunta le molestaba. — Хотя он пытался сохранять
    спокойствие, было заметно, что тот вопрос его раздражал.
  origin: От латинского tractare «обращаться, заниматься чем-то», связанного с trahere «тянуть». Родственные слова
    — trato «обращение, сделка» и tratamiento «лечение, обращение».
  register: Нейтральное и очень универсальное; встречается и в быту, и в медицине, и в обсуждениях.
  synonyms:
  - word: intentar
    pair:
    - Trato de entenderlo.
    - Intento entenderlo.
    diff:
    - Синонимом intentar служит конструкция tratar de, а не любой случай tratar. После intentar предлог de не нужен.
  analogs:
  - to treat — лечить или обращаться; to deal with — обсуждать; to try — пытаться, только для tratar de.
  dialogue:
  - Ana se encargó de tratar con el remitente de aquella carta amenazante. | Ана взяла на себя общение с отправителем
    того письма с угрозами.
  - Trató de mantener la calma, aunque el chantaje le provocaba una profunda indignación. | Она пыталась сохранять
    спокойствие, хотя шантаж вызывал у неё глубокое возмущение.
  - Antes de responder, decidió averiguar si la firma era auténtica. | Прежде чем ответить, она решила выяснить,
    была ли подпись подлинной.
  cefr: B1 — многозначный глагол с несколькими распространёнными конструкциями.
  frequency: Очень частое слово в разговорной, рабочей и письменной речи.
  collocations:
  - tratar bien a alguien — хорошо обращаться с кем-то
  - tratar una enfermedad — лечить болезнь
  - tratar un tema — обсуждать тему
  - tratar de hacer algo — пытаться что-то сделать
  - tratarse de algo — речь идёт о чём-то
  collocation_example: Siempre trata bien a sus compañeros. — Она всегда хорошо обращается с коллегами.
  trap: 'Различайте: trato de dormir — «пытаюсь уснуть», se trata de un sueño — «речь идёт о сне». «Книга о дружбе»
    — el libro trata de la amistad, без se.'
- word: arrojar
  ru: бросать, швырять; выдавать результат
  ipa: /aroˈxaɾ/
  say: арроха́р
  pron: Двойная rr произносится раскатисто; j звучит примерно как русское «х».
  meaning: Бросать или швырять что-либо, часто с силой. В сочетании arrojar resultados означает «давать результаты»,
    а arrojar luz sobre algo — «проливать свет на что-то».
  examples:
  - El niño arrojó la pelota por encima de la valla y fue a buscarla. — Мальчик перебросил мяч через забор и пошёл
    его искать.
  - El sospechoso arrojó un paquete al río cuando se dio cuenta de que lo seguían. — Подозреваемый бросил свёрток
    в реку, когда понял, что за ним следят.
  - El informe arrojó resultados que obligaron al equipo a revisar su primera explicación. — Отчёт дал результаты,
    которые заставили команду пересмотреть своё первоначальное объяснение.
  origin: Восходит к народно-латинскому rotulare «катить, пускать катиться», связанному с rotare «вращать». Первоначальный
    образ связан с предметом, который бросают и пускают катиться.
  register: Нейтральное, несколько выразительнее бытового tirar. Переносные сочетания характерны для новостей и
    отчётов.
  synonyms:
  - word: lanzar
    pair:
    - Arrojó una piedra al río.
    - Lanzó una piedra al río.
    diff:
    - Arrojar нередко подчёркивает резкость броска; lanzar также употребляется для запуска проекта, товара или ракеты.
  analogs:
  - to throw / to hurl — бросать, швырять; to yield — давать, когда речь о результатах.
  dialogue:
  - 'Ana: El testigo vio cómo el sospechoso arrojaba un paquete al río. | Свидетель видел, как подозреваемый бросал
    свёрток в реку.'
  - 'Pablo: ¿Pudo averiguar qué contenía o lo perdió de vista enseguida? | Он смог выяснить, что в нём было, или
    сразу потерял его из виду?'
  - 'Ana: No lo sabe, pero insiste en que aquello podría ser una prueba. | Он не знает, но настаивает, что это могло
    бы быть доказательством.'
  - 'Pablo: Entonces habrá que localizarlo antes de que la corriente se lo lleve. | Тогда придётся его найти, пока
    течение его не унесло.'
  cefr: B2 — выразительный глагол броска с частыми переносными сочетаниями.
  frequency: Частое слово в повествовании, новостях и сообщениях о результатах исследований.
  collocations:
  - arrojar una piedra — бросить камень
  - arrojar algo al suelo — швырнуть что-то на пол
  - arrojar resultados — дать результаты
  - arrojar luz sobre algo — пролить свет на что-то
  collocation_example: La investigación arrojó luz sobre el caso. — Расследование пролило свет на это дело.
  trap: Arrojar algo — бросить предмет; arrojarse al agua — броситься в воду самому. Местоимение se меняет участника
    действия.
- word: percibir
  ru: замечать, воспринимать, ощущать
  ipa: /peɾθiˈβiɾ/
  say: пэрсиби́р
  pron: C перед i в Испании звучит как межзубное /θ/; b между гласными произносится мягко, без полного смыкания
    губ.
  meaning: Замечать или ощущать что-то органами чувств либо понимать по косвенным признакам. В официальной речи
    percibir un sueldo означает «получать зарплату».
  examples:
  - Al abrir la puerta, percibí un olor extraño y llamé a mi vecino. — Открыв дверь, я почувствовал странный запах
    и позвонил соседу.
  - El inspector percibió un cambio en su actitud cuando mencionó el nombre de la víctima. — Инспектор заметил перемену
    в его поведении, когда упомянул имя жертвы.
  - Aunque nadie expresó su desacuerdo, percibí cierta tensión durante la reunión. — Хотя никто не выразил несогласия,
    я ощутила некоторое напряжение во время собрания.
  origin: От латинского percipere «получать, улавливать». Родственные слова — percepción «восприятие» и perceptible
    «ощутимый, заметный».
  register: Нейтральное, несколько более точное и книжное, чем notar; в значении дохода — официальное.
  synonyms:
  - word: notar
    pair:
    - Percibí un cambio en su voz.
    - Noté un cambio en su voz.
    diff:
    - Notar чаще звучит в повседневном разговоре; percibir выделяет само восприятие, иногда едва уловимое.
  analogs:
  - to perceive / to sense — воспринимать, ощущать; to receive — получать, когда речь о зарплате.
  dialogue:
  - 'Ana: He percibido cierta envidia cuando hemos hablado de la fortuna del heredero. | Я уловила некоторую зависть,
    когда мы говорили о состоянии наследника.'
  - 'Pablo: Yo también me he fijado en su actitud, pero eso no demuestra nada. | Я тоже обратил внимание на его
    поведение, но это ничего не доказывает.'
  - 'Ana: De acuerdo; una impresión no puede sustituir una prueba. | Согласна; впечатление не может заменить доказательство.'
  - 'Pablo: Entonces sigamos investigando sin dejarnos llevar por el resentimiento. | Тогда продолжим расследование,
    не поддаваясь обиде.'
  cefr: B2 — точное описание чувственного и косвенного восприятия.
  frequency: Распространено в письменной речи, описаниях чувств и официальных текстах о доходах.
  collocations:
  - percibir un olor — почувствовать запах
  - percibir un cambio — заметить изменение
  - percibir una amenaza — ощутить угрозу
  - percibir un sueldo — получать зарплату
  collocation_example: Percibí un cambio en su actitud. — Я заметила перемену в его отношении.
  trap: Не путайте percibir «воспринимать» и recibir «получать». Только некоторые сочетания, например percibir un
    sueldo, связаны с получением денег.
- word: suceder
  ru: происходить, случаться
  ipa: /suθeˈðeɾ/
  say: сусэдэ́р
  pron: C перед e в Испании произносится как межзубное /θ/, а d между гласными — мягко, без полного смыкания.
  meaning: 'Обозначает то, что происходит или случилось: ¿Qué sucede? — «Что происходит?». Другое значение — сменить
    кого-то в должности: suceder a alguien.'
  examples:
  - No sé qué sucedió anoche porque me fui a casa bastante temprano. — Я не знаю, что случилось вчера ночью, потому
    что ушёл домой довольно рано.
  - El testigo contó lo que había sucedido, aunque no recordaba todos los detalles del accidente. — Свидетель рассказал
    о случившемся, хотя помнил не все подробности аварии.
  - Nadie comprendía lo que había sucedido hasta que apareció un nuevo testigo. — Никто не понимал, что произошло,
    пока не появился новый свидетель.
  origin: От латинского succedere «следовать за, наступать». Поэтому глагол описывает и событие, и приход следующего
    человека на чьё-то место.
  register: Нейтральное. В бытовом разговоре вместо suceder очень часто говорят pasar.
  synonyms:
  - word: ocurrir
    pair:
    - ¿Qué sucedió anoche?
    - ¿Qué ocurrió anoche?
    diff:
    - В вопросе о событии слова почти взаимозаменяемы; ocurrírsele a alguien дополнительно означает «прийти кому-то
      в голову».
  analogs:
  - to happen — случаться; английское to succeed в значении «добиться успеха» переводится tener éxito.
  dialogue:
  - 'Ana: Necesitamos averiguar qué sucedió antes de que llegara la policía. | Нам нужно выяснить, что произошло
    до приезда полиции.'
  - 'Pablo: El testigo parecía aturdido y no pudo explicar por qué se había desviado. | Свидетель выглядел ошеломлённым
    и не смог объяснить, почему свернул с пути.'
  - 'Ana: Quizá el choque le haya afectado más de lo que parece. | Возможно, столкновение повлияло на него сильнее,
    чем кажется.'
  - 'Pablo: De todas formas, conviene esperar antes de volver a interrogarlo. | В любом случае стоит подождать,
    прежде чем снова его допрашивать.'
  cefr: B1 — базовый глагол для рассказа о событиях.
  frequency: Очень частое слово в новостях, вопросах и повествованиях.
  collocations:
  - ¿qué sucede? — что происходит?
  - suceder de repente — случиться внезапно
  - lo sucedido — случившееся
  - suceder a alguien en el cargo — сменить кого-то в должности
  collocation_example: Todo sucedió de repente. — Всё случилось внезапно.
  trap: Sucedió algo — «что-то случилось», а tuvo éxito — «он добился успеха». Английское success не помогает угадать
    основное значение suceder.
- word: embotellamiento
  ru: дорожная пробка, затор
  ipa: /emboteʝaˈmjento/
  say: эмботэйямье́нто
  pron: Ll в большей части Испании произносится как /ʝ/. Сочетание -miento звучит одним ударным слогом mien и безударным
    to.
  meaning: El embotellamiento — скопление машин, из-за которого движение замедляется или останавливается. В Испании
    в повседневной речи чаще говорят atasco.
  examples:
  - Llegamos tarde al trabajo porque había un embotellamiento cerca del centro. — Мы опоздали на работу, потому
    что возле центра была пробка.
  - El conductor decidió desviarse cuando supo que el choque había causado un embotellamiento de varios kilómetros.
    — Водитель решил изменить маршрут, когда узнал, что столкновение вызвало многокилометровую пробку.
  - Aunque salimos antes de lo habitual, quedamos atrapados en un embotellamiento durante una hora. — Хотя мы выехали
    раньше обычного, мы на час застряли в пробке.
  origin: Образовано от embotellar «разливать по бутылкам; закупоривать», связанного с botella «бутылка». Образ
    узкого горлышка объясняет переносное значение затора.
  register: Нейтральное, особенно распространённое в Латинской Америке. В Испании понятно, но бытовое atasco обычно
    естественнее.
  synonyms:
  - word: atasco
    pair:
    - Hay un embotellamiento en la autopista.
    - Hay un atasco en la autopista.
    diff:
    - Atasco — наиболее обычный разговорный вариант в Испании; embotellamiento длиннее и чаще встречается в латиноамериканской
      речи.
  analogs:
  - traffic jam — дорожная пробка; bottleneck — узкое место, которое вызывает затор.
  dialogue:
  - 'Ana: El choque ha provocado un embotellamiento y parece que tenemos para rato. | Столкновение вызвало пробку,
    и, похоже, мы здесь надолго.'
  - 'Pablo: Podríamos desviarnos, pero no quiero acabar otra vez en la cuneta. | Мы могли бы свернуть, но я не хочу
    снова оказаться в кювете.'
  - 'Ana: Entonces habrá que armarse de paciencia y avisar del retraso. | Тогда придётся набраться терпения и предупредить
    об опоздании.'
  - 'Pablo: Ya he llamado; por suerte, han restado importancia al asunto. | Я уже позвонил; к счастью, там не придали
    этому большого значения.'
  cefr: B1 — описание дорожной ситуации и причины опоздания.
  frequency: Частое в новостях о движении и в Латинской Америке; в Испании чаще atasco.
  collocations:
  - un embotellamiento de tráfico — дорожный затор
  - quedar atrapado en un embotellamiento — застрять в пробке
  - evitar un embotellamiento — избежать пробки
  collocation_example: Salimos temprano para evitar un embotellamiento. — Мы выехали рано, чтобы избежать пробки.
  trap: Не путайте embotellamiento «затор» и embotellado «розлив по бутылкам». Для повседневного рассказа в Испании
    подойдёт atasco.
