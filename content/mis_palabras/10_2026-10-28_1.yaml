  - word: estar como una cabra
    ru: быть сумасшедшим, чудить
    ipa: /esˈtaɾ ˈkomo ˈuna ˈkaβɾa/
    say: эста́р ко́мо у́на ка́бра
    pron: "b между гласными мягкая [β]."
    meaning: "Разговорное: вести себя странно, безрассудно, «спятить». Часто в шутку или с удивлением."
    examples:
      - "Mi tío está como una cabra. — Мой дядя совсем чокнутый."
      - "¿Estás como una cabra? — Ты что, с ума сошёл?"
    origin: "estar «быть» + como una cabra «как коза»: козы скачут и ведут себя непредсказуемо. Образ из деревенской жизни."
    register: "Разговорное, шутливое; в серьёзном разговоре грубо."
    synonyms:
      - word: estar loco
        pair: ["Está como una cabra.", "Está loco."]
        diff:
          - "estar loco — просто «сумасшедший», без образа"
          - "estar como una cabra — шутливо, «с причудами»"
    analogs:
      - "to be nuts — быть чокнутым"
      - "to be mad as a hatter — быть сумасшедшим"
    dialogue:
      - "Ana: Va a cruzar a nado el río. | Он собирается переплыть реку."
      - "Pablo: ¡Está como una cabra! | Он совсем сумасшедший!"
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "estar como una cabra — быть не в себе"
      - "estar loco de remate — быть совсем сумасшедшим"
      - "volverse loco — сойти с ума"
    collocation_example: "Se tiró al agua en pleno invierno: ¡está como una cabra! — Он прыгнул в воду посреди зимы: он чокнутый!"
    trap: "Всегда с estar: está como una cabra. Не говорите это о человеке с психическим заболеванием: выражение шутливое."

  - word: medias
    ru: чулки, колготки
    ipa: /ˈmeðjas/
    say: ме́дьяс
    pron: "ie — один слог «ье»; d между гласными мягкое [ð]."
    meaning: "Одежда, закрывающая ногу: чулки или колготки. Обычно во множественном: las medias."
    examples:
      - "Se puso unas medias negras. — Она надела чёрные чулки."
      - "Se me ha roto una media. — У меня порвался чулок."
    origin: "По одной из версий, от calzas medias «половинные штаны»: чулки закрывали только часть ноги. Родственное: calcetín «носок»."
    register: "Нейтральное."
    synonyms:
      - word: pantis
        pair: ["Llevaba unas medias.", "Llevaba unos pantis."]
        diff:
          - "pantis — колготки (в Испании), от английского panty"
          - "medias — и чулки, и колготки (в Латинской Америке)"
    analogs:
      - "stockings — чулки"
      - "tights — колготки"
    dialogue:
      - "Ana: ¿Qué te pongo para la fiesta? | Что мне надеть на вечеринку?"
      - "Pablo: Un vestido y unas medias negras. | Платье и чёрные колготки."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "unas medias — чулки"
      - "medias de nailon — нейлоновые чулки"
      - "a medias — наполовину"
      - "dejar a medias — бросить на полпути"
    collocation_example: "Dejó el trabajo a medias y se fue. — Он бросил работу на полпути и ушёл."
    trap: "Медиас — только во множественном: las medias. «a medias» — «наполовину», а не «в чулках». В Испании колготки — pantis или leotardos."

  - word: bragas
    ru: женские трусы
    ipa: /ˈbɾaɣas/
    say: бра́гас
    pron: "g между гласными мягкое [ɣ]."
    meaning: "Женское нижнее бельё. Всегда во множественном: unas bragas."
    examples:
      - "Compró bragas de algodón. — Она купила хлопковые трусы."
      - "Metió las bragas en la maleta. — Она положила бельё в чемодан."
    origin: "От braga «штаны» (лат. braca, слово из кельтского): раньше «bragas» были штанами и у мужчин. Родственное: bragueta «ширинка»."
    register: "Нейтральное, бытовое."
    synonyms:
      - word: braguitas
        pair: ["Compró unas bragas.", "Compró unas braguitas."]
        diff:
          - "braguitas — уменьшительное, ласковое и в магазинах"
    analogs:
      - "knickers — женские трусы (британское)"
      - "panties — женские трусы (американское)"
    dialogue:
      - "Ana: ¿Qué compraste? | Что ты купила?"
      - "Pablo: Ropa interior, bragas y calcetines. | Нижнее бельё: трусы и носки."
    cefr: "B2."
    frequency: "Частое в магазинах одежды."
    collocations:
      - "unas bragas — женские трусы"
      - "bragas de encaje — кружевные трусики"
      - "pillar en bragas — застать врасплох (разг.)"
    collocation_example: "Me pilló en bragas y no sabía qué decir. — Он застал меня врасплох, и я не знала, что сказать."
    trap: "Только во множественном: las bragas, а мужские трусы — calzoncillos. «Pillar en bragas» — разговорное «застать врасплох»."
