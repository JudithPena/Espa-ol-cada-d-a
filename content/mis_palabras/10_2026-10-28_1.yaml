# Четвёртый список автора, часть 10 — «Poderoso caballero» (слова 1–15).
lang: es
words:
  - word: poderoso caballero
    ru: могущественный господин
    ipa: /podeˈɾoso kaβaˈʎeɾo/
    say: подэро́со кабайе́ро
    pron: "d между гласными мягкое [ð]; ll в большинстве регионов — как «й»."
    meaning: "Из поэмы Франсиско де Кеведо «Poderoso caballero es don Dinero» — «Могущественный господин — дон Деньги». В разговоре — «деньги правят миром»."
    examples:
      - "Se creía un poderoso caballero. — Он считал себя влиятельным господином."
      - "Poderoso caballero es don Dinero, escribió Quevedo hace más de cuatrocientos años. — «Могущественный господин – дон Деньги», писал Кеведо более четырёхсот лет назад."
      - "Se cree un poderoso caballero, pero en realidad todos saben que debe dinero a medio pueblo. — Он считает себя влиятельным господином, но на самом деле все знают, что он должен денег полсела."
    origin: "poderoso — от poder «власть; мочь»; caballero — «всадник, господин» (от caballo «лошадь»). Фраза из стихотворения Кеведо (XVII век) стала поговоркой о власти денег."
    register: "Книжное, с иронией."
    synonyms:
      - word: el dinero lo puede todo
        pair: ["Poderoso caballero es don Dinero.", "El dinero lo puede todo."]
        diff:
          - "el dinero lo puede todo — простое современное «деньги всё решают»"
          - "poderoso caballero — цитата из Кеведо, звучит насмешливо и литературно"
    analogs:
      - "money talks — деньги решают"
      - "money makes the world go round — деньги правят миром"
    dialogue:
      - "Ana: ¿Cómo consiguió el permiso tan rápido? | Как он так быстро получил разрешение?"
      - "Pablo: Poderoso caballero es don Dinero. | Могущественный господин — дон Деньги."
      - "Ana: ¿Quieres decir que pagó? | Хочешь сказать, что заплатил?"
      - "Pablo: No lo sé, pero tiene un socio concejal y las trabas desaparecieron como por arte de magia. | Не знаю, но у него есть партнёр-советник, и препоны исчезли как по волшебству."
      - "Ana: Qué descaro. Una persona normal tardaría meses. | Какая наглость. Обычный человек ждал бы месяцы."
      - "Pablo: Ya ves, poderoso caballero... Y cuanto más dinero, menos trámites burocráticos. | Вот видишь, могущественный господин... И чем больше денег, тем меньше бюрократии."
      - "Ana: Qué injusto. | Какая несправедливость."
      - "Pablo: Pero así funciona. Pese a todo, no hay que agachar la cabeza ante eso. | Но так это устроено. Несмотря ни на что, перед этим опускать голову не нужно."
    cefr: "C1."
    frequency: "Нечастое: литературная цитата."
    collocations:
      - "don Dinero — «дон Деньги»"
      - "un hombre poderoso — влиятельный человек"
      - "un caballero andante — странствующий рыцарь"
    collocation_example: "Es un hombre muy poderoso en la política. — Он очень влиятельный человек в политике."
    trap: "Caballero — «господин, джентльмен», а не только «всадник». Фраза — цитата Кеведо, её произносят иронично. Don и dinero в цитате пишутся с заглавной: don Dinero."

  - word: indemnización
    ru: компенсация
    ipa: /indemniθaˈθjon/
    say: индэмнисасьо́н
    pron: "z/c в Испании — [θ]; ударение на последнем слоге."
    meaning: "Деньги, которые платят за ущерб, увольнение или несчастный случай."
    examples:
      - "Recibió una indemnización por el accidente. — Он получил компенсацию за аварию."
      - "Los vecinos reclamaron una indemnización al ayuntamiento por los daños que causaron las obras. — Жители потребовали у мэрии компенсацию за ущерб, нанесённый ремонтными работами."
      - "La empresa le pagó una indemnización por despido que le permitió vivir seis meses sin trabajar. — Компания выплатила ему компенсацию при увольнении, которая позволила шесть месяцев не работать."
    origin: "От indemnizar «возмещать»: лат. indemnis «невредимый» (in- «не» + damnum «вред»). Родственное: daño «вред»."
    register: "Формальное, юридическое."
    synonyms:
      - word: compensación
        pair: ["Le dieron una indemnización.", "Le dieron una compensación."]
        diff:
          - "compensación — любая компенсация, и не только деньгами"
          - "indemnización — именно выплата за ущерб, по закону или договору"
    analogs:
      - "compensation — компенсация"
      - "severance pay — выходное пособие"
    dialogue:
      - "Ana: ¿Qué pasó con el despido? | Что с твоим увольнением?"
      - "Pablo: Me dieron una indemnización de tres meses. | Мне дали компенсацию в три месяца."
      - "Ana: ¿Es suficiente? | Этого достаточно?"
      - "Pablo: Es lo que marca la ley. Yo pensaba reclamar más, pero mi abogado me aconsejó no precipitarme. | Так предписывает закон. Я думал требовать больше, но адвокат посоветовал не торопиться."
      - "Ana: ¿Y qué vas a hacer con el dinero? | И что ты будешь делать с деньгами?"
      - "Pablo: Pagar deudas y ahorrar un poco. Mientras ando buscando trabajo, lo necesito. | Заплатить долги и немного отложить. Пока ищу работу, он мне нужен."
      - "Ana: ¿Hace falta declarar la indemnización? | Нужно ли декларировать компенсацию?"
      - "Pablo: Sí, hay que declararla al fisco. El IVA no, pero sí la renta. | Да, её нужно задекларировать налоговой. НДС нет, а подоходный — да."
    cefr: "C1."
    frequency: "Частое в новостях и юриспруденции."
    collocations:
      - "indemnización por despido — компенсация при увольнении"
      - "reclamar una indemnización — требовать компенсации"
      - "pagar una indemnización — выплатить компенсацию"
    collocation_example: "Reclamó una indemnización por daños. — Он потребовал компенсацию за ущерб."
    trap: "Indemnización — выплата за вред; «compensar» — «возместить» вообще. Глагол — indemnizar, перед e z → c: indemnice."

  - word: compromiso
    ru: обязательство; помолвка
    ipa: /kompɾoˈmiso/
    say: компроми́со
    meaning: "Обещание, которое нужно выполнить; договорённость, дело, назначенное на определённое время. Ещё — «помолвка» и «затруднительное положение»."
    examples:
      - "Mañana tengo un compromiso con mi jefe. — Завтра у меня встреча с начальником."
      - "Tengo un compromiso esta tarde y no podré ir con vosotros al cine. — У меня сегодня днём дела, и я не смогу пойти с вами в кино."
      - "Están comprometidos desde hace un año y se casan en junio, en el pueblo de ella. — Они помолвлены уже год и женятся в июне, в её родном селе."
    origin: "От лат. compromissum «взаимное обещание»: com- «вместе» + promittere «обещать». Родственные: prometer «обещать», comprometerse «обязаться»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: obligación
        pair: ["Tiene un compromiso.", "Tiene una obligación."]
        diff:
          - "obligación — то, что нужно по закону или долгу"
          - "compromiso — то, что вы взяли на себя сами, обещание или встреча"
    analogs:
      - "commitment — обязательство"
      - "engagement — помолвка; запланированное дело"
    dialogue:
      - "Ana: ¿Vienes esta tarde? | Придёшь сегодня днём?"
      - "Pablo: No puedo, tengo un compromiso. | Не могу, у меня обязательство."
      - "Ana: ¿Con quién? | С кем?"
      - "Pablo: Con mi jefe. Me hizo saber que quiere hablar cuanto antes de mi puesto. | С начальником. Он дал понять, что хочет как можно скорее поговорить о моей должности."
      - "Ana: ¿Algo grave? | Что-то серьёзное?"
      - "Pablo: No lo sé. Presiento que es una oferta, pero no quiero albergar demasiadas esperanzas. | Не знаю. Предчувствую, что это предложение, но не хочу питать слишком много надежд."
      - "Ana: Pues suerte. Y avísame luego. | Тогда удачи. И сообщи потом."
      - "Pablo: Sin falta. Y si sale bien, te invito a cenar a eso de las nueve. | Обязательно. И если всё пройдёт хорошо, приглашу тебя на ужин около девяти."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "asumir un compromiso — взять на себя обязательство"
      - "cumplir un compromiso — выполнить обязательство"
      - "sin compromiso — без обязательств"
      - "poner en un compromiso — поставить в неловкое положение"
    collocation_example: "Me pusiste en un compromiso con tu pregunta. — Ты поставил меня в неловкое положение своим вопросом."
    trap: "Ложный друг английского compromise «компромисс»: «компромисс» по-испански — acuerdo, término medio. Compromiso — «обязательство, помолвка»."

  - word: conjunto
    ru: комплект; ансамбль; совокупность
    ipa: /konˈxunto/
    say: конху́нто
    pron: "j — «х»."
    meaning: "Несколько предметов или людей, которые образуют одно целое: комплект одежды, музыкальная группа, множество."
    examples:
      - "Compré un conjunto de ropa deportiva. — Я купил комплект спортивной одежды."
      - "En conjunto, el resultado es bueno, aunque algunos detalles todavía se pueden mejorar. — В целом результат хороший, хотя некоторые детали ещё можно улучшить."
      - "El conjunto de música tocó en la plaza del pueblo durante las fiestas, y todos bailaron. — Музыкальный ансамбль играл на сельской площади во время праздников, и все танцевали."
    origin: "Из лат. coniunctus «соединённый» (причастие от coniungere: con- «вместе» + iungere «соединять»). Родственные: junto «вместе», juntar «соединять»."
    register: "Нейтральное."
    synonyms:
      - word: grupo
        pair: ["Es un conjunto de música.", "Es un grupo de música."]
        diff:
          - "grupo — любая группа людей или предметов"
          - "conjunto — группа как единое целое; ещё «комплект» и «множество»"
    analogs:
      - "set — комплект"
      - "ensemble — ансамбль"
    dialogue:
      - "Ana: ¿Te gusta el vestido? | Тебе нравится платье?"
      - "Pablo: Sí, es un conjunto muy elegante. | Да, это очень элегантный комплект."
      - "Ana: Con los zapatos y el bolso, ¿no? | С туфлями и сумкой, да?"
      - "Pablo: Exacto. El conjunto es sobrio, no es nada hortera. Los colores combinan muy bien. | Именно. Комплект строгий, совсем не безвкусный. Цвета отлично сочетаются."
      - "Ana: Lo compré con mi madre. Ella tiene un gusto afectivo y tradicional. | Я купила его с мамой. У неё вкус душевный и традиционный."
      - "Pablo: Pues acertó. Pareces otra persona con ese conjunto. | Значит, угадала. Ты как другой человек в этом комплекте."
      - "Ana: Gracias. Hoy voy a sacarle partido en la boda de Marta. | Спасибо. Сегодня надену его на свадьбу Марты."
      - "Pablo: Estarás irreconocible. Ese conjunto es el mejor que has tenido. | Тебя не узнать. Этот комплект — лучший из всех, что у тебя были."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "en conjunto — в целом"
      - "un conjunto de música — музыкальный ансамбль"
      - "el conjunto de los vecinos — все соседи вместе"
    collocation_example: "El conjunto de medidas ayudó a resolver el problema. — Совокупность мер помогла решить проблему."
    trap: "Conjunto — существительное: el conjunto. Как прилагательное conjunto — «совместный»: un esfuerzo conjunto. Не путайте с conjuntivitis «конъюнктивит»."

  - word: consolar
    ru: утешать
    ipa: /konsoˈlaɾ/
    say: консола́р
    pron: "Спрягается o → ue: consuelo, consuelas, consuela."
    meaning: "Помочь тому, кто грустит: сказать добрые слова, быть рядом."
    examples:
      - "Nadie pudo consolar al niño. — Никто не смог утешить мальчика."
      - "Intenté consolarla con un abrazo, pero ella seguía llorando sin poder parar. — Я попытался утешить её объятием, но она продолжала плакать, не в силах остановиться."
      - "Sus amigos fueron a consolarlo a su casa con comida y con ganas de escuchar. — Друзья пришли утешить его домой с едой и желанием выслушать."
    origin: "Из лат. consolari: con- «вместе» + solari «утешать». Родственные: consuelo «утешение», desconsolado «безутешный»."
    register: "Нейтральное."
    synonyms:
      - word: reconfortar
        pair: ["Quise consolarlo.", "Quise reconfortarlo."]
        diff:
          - "reconfortar — «подбодрить, придать сил», тепло и физически"
          - "consolar — «утешить» в горе"
    analogs:
      - "to console — утешать"
      - "to comfort — утешать, успокаивать"
    dialogue:
      - "Ana: ¿Cómo está tu amiga? | Как твоя подруга?"
      - "Pablo: Triste. Intento consolarla. | Грустная. Пытаюсь её утешить."
      - "Ana: ¿Qué le ha pasado? | Что с ней случилось?"
      - "Pablo: Su perro se ha muerto. Está desconsolada y no deja de sollozar. | У неё умерла собака. Она безутешна и не перестаёт всхлипывать."
      - "Ana: Pobre. ¿Qué le dices? | Бедняжка. Что ты ей говоришь?"
      - "Pablo: Que el dolor pasará, pero que el cariño del perro se queda para siempre. | Что боль пройдёт, а любовь собаки останется навсегда."
      - "Ana: Qué ternura. Yo también quiero ir a consolarla. | Какая нежность. Я тоже хочу пойти её утешить."
      - "Pablo: Ven. Así se siente rodeada de gente que la quiere. | Приходи. Так она почувствует себя в окружении людей, которые её любят."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "consolar a alguien — утешить кого-то"
      - "consolarse con algo — утешиться чем-то"
      - "palabras de consuelo — слова утешения"
    collocation_example: "Se consoló pensando que podía haber sido peor. — Он утешился мыслью, что могло быть и хуже."
    trap: "Спрягается o → ue: consuelo. Перед человеком нужен a: consolar a alguien. Не путайте с consolidar «укреплять» и consola «приставка»."

  - word: taller
    ru: мастерская
    ipa: /taˈʎeɾ/
    say: тайе́р
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Место, где что-то чинят или делают руками: автосервис, мастерская художника. Ещё — «мастер-класс, семинар»."
    examples:
      - "Hay un taller de bicicletas aquí. — Здесь есть мастерская по ремонту велосипедов."
      - "Llevé el coche al taller porque hacía un ruido extraño en las ruedas delanteras. — Я отвёз машину в мастерскую, потому что она странно шумела в передних колёсах."
      - "Mi tío tiene un taller de carpintería en la parte trasera de su casa y hace muebles a medida. — У моего дяди есть столярная мастерская в задней части дома, и он делает мебель на заказ."
    origin: "Из франц. atelier «мастерская» (от astelle «щепка, обломок»): место, где обрабатывают дерево. В испанский вошло в Средние века."
    register: "Нейтральное."
    synonyms:
      - word: obrador
        pair: ["Trabaja en un taller.", "Trabaja en un obrador."]
        diff:
          - "obrador — мастерская или пекарня, где что-то делают на месте"
          - "taller — любая мастерская и ещё мастер-класс"
    analogs:
      - "workshop — мастерская; мастер-класс"
      - "garage — автосервис"
    dialogue:
      - "Ana: ¿Dónde está tu coche? | Где твоя машина?"
      - "Pablo: En el taller, se estropeó el motor. | В мастерской, сломался двигатель."
      - "Ana: ¿Otra vez? ¿Y cuánto te van a cobrar? | Опять? И сколько с тебя возьмут?"
      - "Pablo: Una fortuna. El mecánico dice que hay que cambiar varias piezas. | Целое состояние. Механик говорит, что нужно заменить несколько деталей."
      - "Ana: Pide otro presupuesto, por si acaso. | Попроси другую смету, на всякий случай."
      - "Pablo: Ya lo hice. Y el otro taller me hizo saber un precio aún mayor. | Уже попросил. И другая мастерская назвала ещё более высокую цену."
      - "Ana: Menuda papeleta. ¿Cómo vas a ir al trabajo? | Ну и неприятность. Как ты будешь добираться на работу?"
      - "Pablo: En vespa, hasta que acaben. Aunque no es fácil con lluvia. | На веспе, пока не закончат. Хотя в дождь это непросто."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "taller mecánico — автосервис"
      - "taller de escritura — литературный семинар"
      - "taller de costura — швейная мастерская"
    collocation_example: "Asistió a un taller de teatro. — Он ходил на театральный мастер-класс."
    trap: "Taller — мужского рода: el taller. Не путайте с talla «размер; резьба» и tallar «резать»."

  - word: caducado
    ru: просроченный
    ipa: /kaðuˈkaðo/
    say: кадука́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О продукте, лекарстве или документе: срок годности вышел."
    examples:
      - "El yogur está caducado desde ayer. — Йогурт просрочен со вчерашнего дня."
      - "Los medicamentos caducados deben llevarse a la farmacia, no tirarse a la basura. — Просроченные лекарства нужно относить в аптеку, а не выбрасывать в мусор."
      - "Tengo el carné de conducir caducado y tengo que pedir cita para renovarlo cuanto antes. — У меня просрочены водительские права, и мне нужно как можно скорее записаться на продление."
    origin: "Причастие от caducar «терять силу» (лат. caducus «падающий, недолговечный»). Родственные: caducidad «срок годности»."
    register: "Нейтральное."
    synonyms:
      - word: vencido
        pair: ["El yogur está caducado.", "El yogur está vencido."]
        diff:
          - "vencido — «срок истёк», в Латинской Америке о продуктах и платежах"
          - "caducado — привычное в Испании для еды и документов"
    analogs:
      - "expired — просроченный"
      - "out of date — устаревший"
    dialogue:
      - "Ana: ¿Puedo comer esto? | Можно мне это съесть?"
      - "Pablo: No, está caducado. | Нет, оно просрочено."
      - "Ana: ¿Cuánto hace? | Как давно?"
      - "Pablo: Desde ayer. Mira la fecha en el envase. Mejor no arriesgarse. | Со вчерашнего дня. Посмотри на дату на упаковке. Лучше не рисковать."
      - "Ana: Qué manía con las fechas. Seguro que está bien. | Что за мания с датами. Наверняка в порядке."
      - "Pablo: Un yogur caducado puede dar un mareo y un dolor de estómago. | Просроченный йогурт может вызвать головокружение и боль в желудке."
      - "Ana: Tienes razón. Mejor tirarlo. | Ты прав. Лучше выбросить."
      - "Pablo: Y revisa el congelador, que tenías cosas ahí desde hace meses. | И проверь морозилку, там у тебя вещи лежат уже несколько месяцев."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "fecha de caducidad — срок годности"
      - "medicamento caducado — просроченное лекарство"
      - "pasaporte caducado — просроченный паспорт"
    collocation_example: "Mira la fecha de caducidad antes de comprar. — Посмотри срок годности перед покупкой."
    trap: "Caducado — причастие: caducada, caducados. Для людей не говорят: «caduco» о человеке — «дряхлый». Срок годности — la fecha de caducidad."

  - word: aún
    ru: ещё (до сих пор)
    ipa: /aˈun/
    say: ау́н
    pron: "Ударение на ú: aún — «ау́н»: два слога."
    meaning: "Всё ещё, до сих пор: о том, что продолжается. С отрицанием — «ещё не»."
    examples:
      - "Aún no he desayunado hoy. — Я ещё не завтракал сегодня."
      - "Aún tengo hambre, aunque acabo de comer un plato enorme de arroz con pollo. — Я всё ещё голоден, хотя только что съел огромную тарелку риса с курицей."
      - "¿Aún vives en el mismo barrio? Me parece que hace mucho que no te veo por aquí. — Ты всё ещё живёшь в том же районе? Мне кажется, я давно не видел тебя здесь."
    origin: "От лат. adhuc «до сих пор»: ad- «до» + huc «сюда». Родственное: todavía «всё ещё»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: todavía
        pair: ["Aún no he comido.", "Todavía no he comido."]
        diff:
          - "todavía — чаще в разговоре, одно и то же"
          - "aún — короче и чуть литературнее"
    analogs:
      - "still — всё ещё"
      - "yet — ещё (в отрицании)"
    dialogue:
      - "Ana: ¿Ya comiste? | Ты уже поел?"
      - "Pablo: Aún no, estoy esperando. | Ещё нет, жду."
      - "Ana: ¿A quién esperas? | Кого ты ждёшь?"
      - "Pablo: A Luis. Quedamos en comer juntos a eso de las dos, y aún no ha llegado. | Луиса. Мы договорились пообедать вместе около двух, а он ещё не пришёл."
      - "Ana: Siempre llega tarde. | Он всегда опаздывает."
      - "Pablo: Aún no me ha avisado. Su móvil sigue comunicando. | Он ещё не предупредил. Его телефон по-прежнему занят."
      - "Ana: ¿Y tienes mucha hambre? | И ты очень голоден?"
      - "Pablo: Aún aguanto, pero no mucho más. Voy a picar algo mientras tanto. | Пока терплю, но недолго. Пока что-нибудь перекушу."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "aún no — ещё не"
      - "aun así — и всё же (без ударения)"
      - "aún más — ещё больше"
    collocation_example: "Aun así, decidió seguir adelante. — И всё же он решил продолжить."
    trap: "С ударением aún — «ещё»; без ударения aun — «даже»: aun así — «и всё же». Произносятся по-разному: «ау́н» и «аун»."

  - word: equipo de deporte
    ru: спортивная команда; спортивная форма
    ipa: /eˈkipo de deˈpoɾte/
    say: экипо дэ дэпо́ртэ
    pron: "qu перед i — [k]."
    meaning: "Equipo — «команда», а также «комплект вещей». Equipo de deporte — и «команда по виду спорта», и «спортивная форма, экипировка»."
    examples:
      - "Mi hermano juega en un equipo de deporte. — Мой брат играет в спортивной команде."
      - "El colegio compró equipos de deporte nuevos para que todos los niños pudieran participar. — Школа купила новое спортивное снаряжение, чтобы все дети могли участвовать."
      - "Lleva el equipo de deporte en la mochila y se cambia en el vestuario antes de entrenar. — Он носит спортивную форму в рюкзаке и переодевается в раздевалке перед тренировкой."
    origin: "equipo — от equipar «снаряжать» (от древнескандинавского skipa «снаряжать судно»). Образ: «судовая команда» → «любая команда»."
    register: "Нейтральное."
    synonyms:
      - word: chándal
        pair: ["Me puse el equipo de deporte.", "Me puse el chándal."]
        diff:
          - "chándal — спортивный костюм, одежда"
          - "equipo de deporte — вся экипировка или команда"
    analogs:
      - "sports team — спортивная команда"
      - "sports kit — спортивная форма"
    dialogue:
      - "Ana: ¿Qué llevas en la bolsa? | Что у тебя в сумке?"
      - "Pablo: El equipo de deporte. | Спортивная форма."
      - "Ana: ¿Vas a entrenar? | Идёшь на тренировку?"
      - "Pablo: Sí, a eso de las siete. Juego en un equipo de deporte del barrio. | Да, около семи. Я играю в спортивной команде нашего района."
      - "Ana: ¿Y qué hacéis? | И что вы делаете?"
      - "Pablo: Fútbol sala. Somos diez, y siempre falta alguien. | Мини-футбол. Нас десять, и всегда кого-то не хватает."
      - "Ana: ¿Y tenéis camiseta? | А у вас есть футболки?"
      - "Pablo: Sí, un conjunto rojo con un escudo cursi, pero nos gusta. | Да, красный комплект со слащавой эмблемой, но нам нравится."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "equipo de fútbol — футбольная команда"
      - "equipo de sonido — звукоусилительная техника"
      - "trabajo en equipo — командная работа"
    collocation_example: "El trabajo en equipo es muy importante. — Командная работа очень важна."
    trap: "Equipo — и «команда», и «оборудование»: equipo de música — «аудиосистема». Не путайте с equivocar «ошибаться»."

  - word: congelador
    ru: морозильная камера
    ipa: /koŋxelaˈðoɾ/
    say: конхэладо́р
    pron: "n перед j звучит как носовое [ŋ]; j — «х»."
    meaning: "Часть холодильника, где продукты замораживают, или отдельный морозильник."
    examples:
      - "El congelador está lleno de helados. — Морозилка полна мороженого."
      - "Compramos un congelador grande para la despensa porque cocinamos para toda la familia. — Мы купили большой морозильник для кладовой, потому что готовим на всю семью."
      - "Guardé el pescado en el congelador para que no se estropee antes del fin de semana. — Я убрал рыбу в морозилку, чтобы она не испортилась до выходных."
    origin: "От congelar «замораживать» (лат. congelare: con- + gelare «замерзать») + суффикс -dor. Родственные: hielo «лёд», gélido «ледяной»."
    register: "Нейтральное."
    synonyms:
      - word: freezer
        pair: ["Está en el congelador.", "Está en el freezer."]
        diff:
          - "freezer — заимствование из английского, в Латинской Америке"
          - "congelador — слово из Испании"
    analogs:
      - "freezer — морозильная камера"
      - "deep freeze — глубокая заморозка"
    dialogue:
      - "Ana: ¿Dónde está el helado? | Где мороженое?"
      - "Pablo: En el congelador. | В морозилке."
      - "Ana: No lo veo. | Не вижу."
      - "Pablo: Está al fondo, detrás de las verduras. Aparta todo y verás que hay un cubo. | В глубине, за овощами. Отодвинь всё, и увидишь ведёрко."
      - "Ana: ¡Aquí está! Pero hay mucho hielo. | Нашла! Но там много льда."
      - "Pablo: Hay que descongelar el congelador. Lo dejé pendiente, y se me pasó. | Надо разморозить морозилку. Я оставил это на потом и забыл."
      - "Ana: Pues hazlo cuanto antes, o no cabrá nada. | Тогда сделай это как можно скорее, а то ничего не поместится."
      - "Pablo: Mañana lo hago. Hoy toca saborear el helado. | Завтра сделаю. Сегодня надо насладиться мороженым."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "meter en el congelador — положить в морозилку"
      - "descongelar — разморозить"
      - "comida congelada — замороженная еда"
    collocation_example: "Saca la carne del congelador para descongelarla. — Достань мясо из морозилки, чтобы разморозить."
    trap: "Congelador — «морозилка» (мужской род), а «холодильник» — nevera или frigorífico. Не путайте с congelar «заморозить»."

  - word: a eso de
    ru: около, примерно (о времени)
    ipa: /a ˈeso de/
    say: а э́со дэ
    meaning: "Приблизительно в какое-то время: «около трёх», «часа в три». Только о времени."
    examples:
      - "Llegó a eso de las ocho. — Он пришёл около восьми."
      - "Quedamos a eso de las cinco en la plaza del pueblo. — Мы договорились встретиться около пяти на площади села."
      - "Se fue a eso de la medianoche y no volvió a dar señales de vida hasta el lunes. — Он ушёл около полуночи и не подавал признаков жизни до понедельника."
    origin: "a «в» + eso «это» + de «из»: «в это (время) примерно». Дословно «примерно к этому»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: sobre
        pair: ["Llegó a eso de las ocho.", "Llegó sobre las ocho."]
        diff:
          - "sobre — «около» (время), чаще в Испании в разговоре"
          - "a eso de — чуть литературнее и подчёркивает приблизительность"
    analogs:
      - "at around — около"
      - "at about — приблизительно в"
    dialogue:
      - "Ana: ¿A qué hora llegas? | Во сколько ты приедешь?"
      - "Pablo: A eso de las nueve. | Около девяти."
      - "Ana: ¿Seguro? Siempre te retrasas. | Уверен? Ты всегда задерживаешься."
      - "Pablo: Esta vez no. Salgo del trabajo a eso de las siete y no me desvío por nada. | В этот раз нет. Выйду с работы около семи и ни на что не свернусь."
      - "Ana: ¿Y si hay un choque? | А если будет авария?"
      - "Pablo: Entonces te aviso cuanto antes. Prometido. | Тогда предупрежу тебя как можно скорее. Обещаю."
      - "Ana: Vale. Yo preparo la cena a eso de las ocho y media. | Хорошо. Я приготовлю ужин около половины девятого."
      - "Pablo: Perfecto. Y vigila que no se queme el horno. | Отлично. И присматривай, чтобы духовка не подгорела."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "a eso de las tres — около трёх"
      - "a eso del mediodía — около полудня"
      - "sobre las cinco — около пяти"
    collocation_example: "Nos vemos a eso del mediodía. — Увидимся около полудня."
    trap: "Только о времени: a eso de las ocho. О количестве «около» — alrededor de, unos: unos diez euros. Часы всегда с артиклем las: a eso de las ocho."

  - word: cursillo
    ru: краткосрочный курс
    ipa: /kuɾˈsiʎo/
    say: курси́йо
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Короткие курсы: несколько дней или недель занятий по определённой теме."
    examples:
      - "Hizo un cursillo de primeros auxilios. — Он прошёл курсы первой помощи."
      - "El ayuntamiento organiza cursillos gratuitos de cocina para los jubilados del barrio. — Мэрия организует бесплатные кулинарные курсы для пенсионеров района."
      - "Me apunté a un cursillo de verano de fotografía que empieza la semana que viene. — Я записался на летний курс фотографии, который начинается на следующей неделе."
    origin: "От curso «курс» (лат. cursus «бег, течение») + уменьшительное -illo: «небольшой курс»."
    register: "Нейтральное."
    synonyms:
      - word: curso corto
        pair: ["Hizo un cursillo.", "Hizo un curso corto."]
        diff:
          - "curso corto — то же, но без уменьшительного оттенка"
    analogs:
      - "short course — краткий курс"
      - "workshop — семинар"
    dialogue:
      - "Ana: ¿Qué estudias ahora? | Что ты сейчас изучаешь?"
      - "Pablo: Un cursillo de cocina. | Краткий курс кулинарии."
      - "Ana: ¿Tú? ¿Cuánto dura? | Ты? Сколько он длится?"
      - "Pablo: Dos semanas, por las tardes. Consta de ocho clases y una prueba final. | Две недели, по вечерам. Состоит из восьми занятий и итогового экзамена."
      - "Ana: ¿Y qué has aprendido? | И чему ты научился?"
      - "Pablo: A hacer una tortilla de verdad, y a no cortarme el pulgar con el cuchillo. | Готовить настоящую тортилью и не отрезать себе палец ножом."
      - "Ana: ¡Qué bien! Me invitas cuando acabes. | Прекрасно! Пригласишь меня, когда закончишь."
      - "Pablo: Claro, con delantal y todo. | Конечно, в фартуке и со всем остальным."
    cefr: "B2."
    frequency: "Частое в Испании."
    collocations:
      - "hacer un cursillo — пройти курсы"
      - "cursillo de formación — курс подготовки"
      - "cursillo intensivo — интенсивный курс"
    collocation_example: "Está haciendo un cursillo intensivo de inglés. — Он проходит интенсивный курс английского."
    trap: "Cursillo — уменьшительное, но не «плохой курс»: просто «краткий». Не путайте с cursi «слащавый»."

  - word: estar como una cabra
    ru: быть сумасшедшим, чудить
    ipa: /esˈtaɾ ˈkomo ˈuna ˈkaβɾa/
    say: эста́р ко́мо у́на ка́бра
    pron: "b между гласными мягкая [β]."
    meaning: "Разговорное: вести себя странно, безрассудно, «спятить». Часто в шутку или с удивлением."
    examples:
      - "¿Estás como una cabra o qué? — Ты что, спятил?"
      - "Dicen que está como una cabra, pero tiene ideas muy originales y buenas. — Говорят, он чудак, но у него очень оригинальные и хорошие идеи."
      - "Mi tío está como una cabra: ayer se puso a bailar en medio de la calle sin música. — Мой дядя совсем чудной: вчера он принялся танцевать посреди улицы без музыки."
    origin: "estar «быть» + como una cabra «как коза»: козы скачут и ведут себя непредсказуемо. Образ из деревенской жизни."
    register: "Разговорное, шутливое; в серьёзном разговоре грубо."
    synonyms:
      - word: estar loco
        pair: ["Está como una cabra.", "Está loco."]
        diff:
          - "estar loco — просто «сумасшедший», без образа"
          - "estar como una cabra — шутливо, «с причудами»"
    analogs:
      - "to be nuts — быть чокнутым"
      - "to be mad as a hatter — быть сумасшедшим"
    dialogue:
      - "Ana: Va a cruzar a nado el río. | Он собирается переплыть реку."
      - "Pablo: ¡Está como una cabra! | Он совсем спятил!"
      - "Ana: Dice que lo hace por un reto. | Говорит, что делает это на спор."
      - "Pablo: Pues le puede costar caro. Hay corriente y el agua está helada. | Это может ему дорого обойтись. Там течение, и вода ледяная."
      - "Ana: ¿Y si se ahoga? | А если утонет?"
      - "Pablo: No lo permitiremos. Mira, ya se va a tirar. ¡Detenlo! | Мы не допустим. Смотри, он уже собирается прыгнуть. Останови его!"
      - "Ana: ¡Eh, tú! ¡No seas insensato! | Эй, ты! Не будь безрассудным!"
      - "Pablo: Qué susto. Alguien que está como una cabra no escucha a nadie. | Какой испуг. Тот, кто спятил, никого не слушает."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "estar como una cabra — быть не в себе"
      - "estar loco de remate — быть совсем сумасшедшим"
      - "volverse loco — сойти с ума"
    collocation_example: "Se tiró al agua en pleno invierno: ¡está como una cabra! — Он прыгнул в воду посреди зимы: он чокнутый!"
    trap: "Всегда с estar: está como una cabra. Не говорите это о человеке с психическим заболеванием: выражение шутливое."

  - word: medias
    ru: чулки, колготки
    ipa: /ˈmeðjas/
    say: ме́дьяс
    pron: "ie — один слог «ье»; d между гласными мягкое [ð]."
    meaning: "Одежда, закрывающая ногу: чулки или колготки. Обычно во множественном: las medias."
    examples:
      - "Se puso unas medias negras. — Она надела чёрные чулки."
      - "Compró varias medias de colores en el mercadillo para los vestidos de verano. — Она купила на рынке несколько цветных колготок к летним платьям."
      - "Se me ha roto una media justo antes de salir, y tengo que cambiarme otra vez. — У меня порвался чулок прямо перед выходом, и мне нужно переодеваться снова."
    origin: "По одной из версий, от calzas medias «половинные штаны»: чулки закрывали только часть ноги. Родственное: calcetín «носок»."
    register: "Нейтральное."
    synonyms:
      - word: pantis
        pair: ["Llevaba unas medias.", "Llevaba unos pantis."]
        diff:
          - "pantis — колготки (в Испании), от английского panty"
          - "medias — и чулки, и колготки (в Латинской Америке)"
    analogs:
      - "stockings — чулки"
      - "tights — колготки"
    dialogue:
      - "Ana: ¿Qué me pongo para la fiesta? | Что мне надеть на вечеринку?"
      - "Pablo: Un vestido y unas medias negras. | Платье и чёрные колготки."
      - "Ana: ¿No es demasiado sobrio? | Не слишком ли строго?"
      - "Pablo: Al contrario. Con ese conjunto estarás elegante, no hortera. | Наоборот. В таком комплекте ты будешь элегантной, а не безвкусной."
      - "Ana: ¿Y los zapatos? | А туфли?"
      - "Pablo: Los de tacón, y un abrigo rojizo por encima. | На каблуках, а сверху рыжеватое пальто."
      - "Ana: Pues me pongo las medias, aunque no es fácil: se me rompen siempre. | Тогда надену колготки, хотя это непросто: они у меня вечно рвутся."
      - "Pablo: Llévate otras de repuesto, por si acaso. | Возьми запасные, на всякий случай."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "unas medias — чулки"
      - "medias de nailon — нейлоновые чулки"
      - "a medias — наполовину"
      - "dejar a medias — бросить на полпути"
    collocation_example: "Dejó el trabajo a medias y se fue. — Он бросил работу на полпути и ушёл."
    trap: "Медиас — только во множественном: las medias. «a medias» — «наполовину», а не «в чулках». В Испании колготки — pantis или leotardos."

