# Четвёртый список автора, часть 10 — «Poderoso caballero» (слова 1–15).
lang: es
words:
  - word: poderoso caballero
    ru: могущественный господин
    ipa: /podeˈɾoso kaβaˈʎeɾo/
    say: подэро́со кабайе́ро
    pron: "d между гласными мягкое [ð]; ll в большинстве регионов — как «й»."
    meaning: "Из поэмы Франсиско де Кеведо «Poderoso caballero es don Dinero» — «Могущественный господин — дон Деньги». В разговоре — «деньги правят миром»."
    examples:
      - "Poderoso caballero es don Dinero. — Могущественный господин — дон Деньги."
      - "Aquel hombre era un poderoso caballero en la ciudad. — Тот человек был влиятельным господином в городе."
    origin: "poderoso — от poder «власть; мочь»; caballero — «всадник, господин» (от caballo «лошадь»). Фраза из стихотворения Кеведо (XVII век) стала поговоркой о власти денег."
    register: "Книжное, с иронией."
    synonyms:
      - word: el dinero lo puede todo
        pair: ["Poderoso caballero es don Dinero.", "El dinero lo puede todo."]
        diff:
          - "el dinero lo puede todo — простое современное «деньги всё решают»"
          - "poderoso caballero — цитата из Кеведо, звучит насмешливо и литературно"
    analogs:
      - "money talks — деньги решают"
      - "money makes the world go round — деньги правят миром"
    dialogue:
      - "Ana: ¿Cómo consiguió el permiso tan rápido? | Как он так быстро получил разрешение?"
      - "Pablo: Poderoso caballero es don Dinero. | Деньги правят миром."
    cefr: "C1."
    frequency: "Нечастое: литературная цитата."
    collocations:
      - "don Dinero — «дон Деньги»"
      - "un hombre poderoso — влиятельный человек"
      - "un caballero andante — странствующий рыцарь"
    collocation_example: "Es un hombre muy poderoso en la política. — Он очень влиятельный человек в политике."
    trap: "Caballero — «господин, джентльмен», а не только «всадник». Фраза — цитата Кеведо, её произносят иронично. Don и dinero в цитате пишутся с заглавной: don Dinero."

  - word: indemnización
    ru: компенсация
    ipa: /indemniθaˈθjon/
    say: индэмнисасьо́н
    pron: "z/c в Испании — [θ]; ударение на последнем слоге."
    meaning: "Деньги, которые платят за ущерб, увольнение или несчастный случай."
    examples:
      - "Recibió una indemnización por el accidente. — Он получил компенсацию за аварию."
      - "La empresa le pagó una indemnización por despido. — Фирма выплатила ему компенсацию при увольнении."
    origin: "От indemnizar «возмещать»: лат. indemnis «невредимый» (in- «не» + damnum «вред»). Родственное: daño «вред»."
    register: "Формальное, юридическое."
    synonyms:
      - word: compensación
        pair: ["Le dieron una indemnización.", "Le dieron una compensación."]
        diff:
          - "compensación — любая компенсация, и не только деньгами"
          - "indemnización — именно выплата за ущерб, по закону или договору"
    analogs:
      - "compensation — компенсация"
      - "severance pay — выходное пособие"
    dialogue:
      - "Ana: ¿Qué pasó con el despido? | Что с увольнением?"
      - "Pablo: Me dieron una indemnización de tres meses. | Мне выплатили компенсацию за три месяца."
    cefr: "C1."
    frequency: "Частое в новостях и юриспруденции."
    collocations:
      - "indemnización por despido — компенсация при увольнении"
      - "reclamar una indemnización — требовать компенсации"
      - "pagar una indemnización — выплатить компенсацию"
    collocation_example: "Reclamó una indemnización por daños. — Он потребовал компенсацию за ущерб."
    trap: "Indemnización — выплата за вред; «compensar» — «возместить» вообще. Глагол — indemnizar, перед e z → c: indemnice."

  - word: compromiso
    ru: обязательство; помолвка
    ipa: /kompɾoˈmiso/
    say: компроми́со
    meaning: "Обещание, которое нужно выполнить; договорённость, дело, назначенное на определённое время. Ещё — «помолвка» и «затруднительное положение»."
    examples:
      - "Tengo un compromiso esta tarde. — У меня сегодня днём дела."
      - "Asumió el compromiso de ayudarlos. — Он взял на себя обязательство им помочь."
      - "Están comprometidos y se casan en junio. — Они помолвлены и женятся в июне."
    origin: "От лат. compromissum «взаимное обещание»: com- «вместе» + promittere «обещать». Родственные: prometer «обещать», comprometerse «обязаться»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: obligación
        pair: ["Tiene un compromiso.", "Tiene una obligación."]
        diff:
          - "obligación — то, что нужно по закону или долгу"
          - "compromiso — то, что вы взяли на себя сами, обещание или встреча"
    analogs:
      - "commitment — обязательство"
      - "engagement — помолвка; запланированное дело"
    dialogue:
      - "Ana: ¿Vienes esta tarde? | Придёшь сегодня?"
      - "Pablo: No puedo, tengo un compromiso. | Не могу, у меня дела."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "asumir un compromiso — взять на себя обязательство"
      - "cumplir un compromiso — выполнить обязательство"
      - "sin compromiso — без обязательств"
      - "poner en un compromiso — поставить в неловкое положение"
    collocation_example: "Me pusiste en un compromiso con tu pregunta. — Ты поставил меня в неловкое положение своим вопросом."
    trap: "Ложный друг английского compromise «компромисс»: «компромисс» по-испански — acuerdo, término medio. Compromiso — «обязательство, помолвка»."

  - word: conjunto
    ru: комплект; ансамбль; совокупность
    ipa: /konˈxunto/
    say: конху́нто
    pron: "j — «х»."
    meaning: "Несколько предметов или людей, которые образуют одно целое: комплект одежды, музыкальная группа, множество."
    examples:
      - "Compré un conjunto de falda y chaqueta. — Я купила комплект: юбку и пиджак."
      - "En conjunto, el resultado es bueno. — В целом результат хороший."
    origin: "Из лат. coniunctus «соединённый» (причастие от coniungere: con- «вместе» + iungere «соединять»). Родственные: junto «вместе», juntar «соединять»."
    register: "Нейтральное."
    synonyms:
      - word: grupo
        pair: ["Es un conjunto de música.", "Es un grupo de música."]
        diff:
          - "grupo — любая группа людей или предметов"
          - "conjunto — группа как единое целое; ещё «комплект» и «множество»"
    analogs:
      - "set — комплект"
      - "ensemble — ансамбль"
    dialogue:
      - "Ana: ¿Te gusta el vestido? | Тебе нравится платье?"
      - "Pablo: Sí, es un conjunto muy elegante. | Да, это очень элегантный комплект."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "en conjunto — в целом"
      - "un conjunto de música — музыкальный ансамбль"
      - "el conjunto de los vecinos — все соседи вместе"
    collocation_example: "El conjunto de medidas ayudó a resolver el problema. — Совокупность мер помогла решить проблему."
    trap: "Conjunto — существительное: el conjunto. Как прилагательное conjunto — «совместный»: un esfuerzo conjunto. Не путайте с conjuntivitis «конъюнктивит»."

  - word: consolar
    ru: утешать
    ipa: /konsoˈlaɾ/
    say: консола́р
    pron: "Спрягается o → ue: consuelo, consuelas, consuela."
    meaning: "Помочь тому, кто грустит: сказать добрые слова, быть рядом."
    examples:
      - "Intenté consolarla con un abrazo. — Я пытался утешить её объятием."
      - "Nada podía consolarlo. — Ничто не могло его утешить."
    origin: "Из лат. consolari: con- «вместе» + solari «утешать». Родственные: consuelo «утешение», desconsolado «безутешный»."
    register: "Нейтральное."
    synonyms:
      - word: reconfortar
        pair: ["Quise consolarlo.", "Quise reconfortarlo."]
        diff:
          - "reconfortar — «подбодрить, придать сил», тепло и физически"
          - "consolar — «утешить» в горе"
    analogs:
      - "to console — утешать"
      - "to comfort — утешать, успокаивать"
    dialogue:
      - "Ana: ¿Cómo está tu amiga? | Как твоя подруга?"
      - "Pablo: Triste. Intento consolarla. | Грустная. Пытаюсь её утешить."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "consolar a alguien — утешить кого-то"
      - "consolarse con algo — утешиться чем-то"
      - "palabras de consuelo — слова утешения"
    collocation_example: "Se consoló pensando que podía haber sido peor. — Он утешился мыслью, что могло быть и хуже."
    trap: "Спрягается o → ue: consuelo. Перед человеком нужен a: consolar a alguien. Не путайте с consolidar «укреплять» и consola «приставка»."

  - word: taller
    ru: мастерская
    ipa: /taˈʎeɾ/
    say: тайе́р
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Место, где что-то чинят или делают руками: автосервис, мастерская художника. Ещё — «мастер-класс, семинар»."
    examples:
      - "Llevé el coche al taller. — Я отвёз машину в сервис."
      - "Hay un taller de pintura los sábados. — По субботам есть мастер-класс по рисованию."
    origin: "Из франц. atelier «мастерская» (от astelle «щепка, обломок»): место, где обрабатывают дерево. В испанский вошло в Средние века."
    register: "Нейтральное."
    synonyms:
      - word: obrador
        pair: ["Trabaja en un taller.", "Trabaja en un obrador."]
        diff:
          - "obrador — мастерская или пекарня, где что-то делают на месте"
          - "taller — любая мастерская и ещё мастер-класс"
    analogs:
      - "workshop — мастерская; мастер-класс"
      - "garage — автосервис"
    dialogue:
      - "Ana: ¿Dónde está tu coche? | Где твоя машина?"
      - "Pablo: En el taller, se estropeó el motor. | В сервисе, сломался двигатель."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "taller mecánico — автосервис"
      - "taller de escritura — литературный семинар"
      - "taller de costura — швейная мастерская"
    collocation_example: "Asistió a un taller de teatro. — Он ходил на театральный мастер-класс."
    trap: "Taller — мужского рода: el taller. Не путайте с talla «размер; резьба» и tallar «резать»."

  - word: caducado
    ru: просроченный
    ipa: /kaðuˈkaðo/
    say: кадука́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О продукте, лекарстве или документе: срок годности вышел."
    examples:
      - "Esta leche está caducada. — Это молоко просрочено."
      - "Tengo el carné caducado. — У меня просрочено удостоверение."
    origin: "Причастие от caducar «терять силу» (лат. caducus «падающий, недолговечный»). Родственные: caducidad «срок годности»."
    register: "Нейтральное."
    synonyms:
      - word: vencido
        pair: ["El yogur está caducado.", "El yogur está vencido."]
        diff:
          - "vencido — «срок истёк», в Латинской Америке о продуктах и платежах"
          - "caducado — привычное в Испании для еды и документов"
    analogs:
      - "expired — просроченный"
      - "out of date — устаревший"
    dialogue:
      - "Ana: ¿Puedo comer esto? | Можно это съесть?"
      - "Pablo: No, está caducado. | Нет, это просрочено."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "fecha de caducidad — срок годности"
      - "medicamento caducado — просроченное лекарство"
      - "pasaporte caducado — просроченный паспорт"
    collocation_example: "Mira la fecha de caducidad antes de comprar. — Посмотри срок годности перед покупкой."
    trap: "Caducado — причастие: caducada, caducados. Для людей не говорят: «caduco» о человеке — «дряхлый». Срок годности — la fecha de caducidad."

  - word: aún
    ru: ещё (до сих пор)
    ipa: /aˈun/
    say: ау́н
    pron: "Ударение на ú: aún — «ау́н»: два слога."
    meaning: "Всё ещё, до сих пор: о том, что продолжается. С отрицанием — «ещё не»."
    examples:
      - "Aún no ha llegado. — Он ещё не приехал."
      - "Aún tengo hambre. — Я всё ещё голоден."
    origin: "От лат. adhuc «до сих пор»: ad- «до» + huc «сюда». Родственное: todavía «всё ещё»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: todavía
        pair: ["Aún no he comido.", "Todavía no he comido."]
        diff:
          - "todavía — чаще в разговоре, одно и то же"
          - "aún — короче и чуть литературнее"
    analogs:
      - "still — всё ещё"
      - "yet — ещё (в отрицании)"
    dialogue:
      - "Ana: ¿Ya comiste? | Ты уже поел?"
      - "Pablo: Aún no, estoy esperando. | Ещё нет, жду."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "aún no — ещё не"
      - "aun así — и всё же (без ударения)"
      - "aún más — ещё больше"
    collocation_example: "Aun así, decidió seguir adelante. — И всё же он решил продолжить."
    trap: "С ударением aún — «ещё»; без ударения aun — «даже»: aun así — «и всё же». Произносятся по-разному: «ау́н» и «аун»."

  - word: equipo de deporte
    ru: спортивная команда; спортивная форма
    ipa: /eˈkipo de deˈpoɾte/
    say: экипо дэ дэпо́ртэ
    pron: "qu перед i — [k]."
    meaning: "Equipo — «команда», а также «комплект вещей». Equipo de deporte — и «команда по виду спорта», и «спортивная форма, экипировка»."
    examples:
      - "Mi hermano juega en un equipo de deporte. — Мой брат играет в спортивной команде."
      - "Lleva el equipo de deporte en la mochila. — Он носит спортивную форму в рюкзаке."
    origin: "equipo — от equipar «снаряжать» (от древнескандинавского skipa «снаряжать судно»). Образ: «судовая команда» → «любая команда»."
    register: "Нейтральное."
    synonyms:
      - word: chándal
        pair: ["Me puse el equipo de deporte.", "Me puse el chándal."]
        diff:
          - "chándal — спортивный костюм, одежда"
          - "equipo de deporte — вся экипировка или команда"
    analogs:
      - "sports team — спортивная команда"
      - "sports kit — спортивная форма"
    dialogue:
      - "Ana: ¿Qué llevas en la bolsa? | Что у тебя в сумке?"
      - "Pablo: El equipo de deporte para el gimnasio. | Спортивная форма для зала."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "equipo de fútbol — футбольная команда"
      - "equipo de sonido — звукоусилительная техника"
      - "trabajo en equipo — командная работа"
    collocation_example: "El trabajo en equipo es muy importante. — Командная работа очень важна."
    trap: "Equipo — и «команда», и «оборудование»: equipo de música — «аудиосистема». Не путайте с equivocar «ошибаться»."

  - word: congelador
    ru: морозильная камера
    ipa: /koŋxelaˈðoɾ/
    say: конхэладо́р
    pron: "n перед j звучит как носовое [ŋ]; j — «х»."
    meaning: "Часть холодильника, где продукты замораживают, или отдельный морозильник."
    examples:
      - "Guardé el pescado en el congelador. — Я убрал рыбу в морозилку."
      - "El congelador no funciona. — Морозилка не работает."
    origin: "От congelar «замораживать» (лат. congelare: con- + gelare «замерзать») + суффикс -dor. Родственные: hielo «лёд», gélido «ледяной»."
    register: "Нейтральное."
    synonyms:
      - word: freezer
        pair: ["Está en el congelador.", "Está en el freezer."]
        diff:
          - "freezer — заимствование из английского, в Латинской Америке"
          - "congelador — слово из Испании"
    analogs:
      - "freezer — морозильная камера"
      - "deep freeze — глубокая заморозка"
    dialogue:
      - "Ana: ¿Dónde está el helado? | Где мороженое?"
      - "Pablo: En el congelador. | В морозилке."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "meter en el congelador — положить в морозилку"
      - "descongelar — разморозить"
      - "comida congelada — замороженная еда"
    collocation_example: "Saca la carne del congelador para descongelarla. — Достань мясо из морозилки, чтобы разморозить."
    trap: "Congelador — «морозилка» (мужской род), а «холодильник» — nevera или frigorífico. Не путайте с congelar «заморозить»."

  - word: a eso de
    ru: около, примерно (о времени)
    ipa: /a ˈeso de/
    say: а э́со дэ
    meaning: "Приблизительно в какое-то время: «около трёх», «часа в три». Только о времени."
    examples:
      - "Llegó a eso de las ocho. — Он пришёл около восьми."
      - "Quedamos a eso de las cinco. — Договорились около пяти."
    origin: "a «в» + eso «это» + de «из»: «в это (время) примерно». Дословно «примерно к этому»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: sobre
        pair: ["Llegó a eso de las ocho.", "Llegó sobre las ocho."]
        diff:
          - "sobre — «около» (время), чаще в Испании в разговоре"
          - "a eso de — чуть литературнее и подчёркивает приблизительность"
    analogs:
      - "at around — около"
      - "at about — приблизительно в"
    dialogue:
      - "Ana: ¿A qué hora llegas? | Во сколько ты приедешь?"
      - "Pablo: A eso de las nueve. | Часам к девяти."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "a eso de las tres — около трёх"
      - "a eso del mediodía — около полудня"
      - "sobre las cinco — около пяти"
    collocation_example: "Nos vemos a eso del mediodía. — Увидимся около полудня."
    trap: "Только о времени: a eso de las ocho. О количестве «около» — alrededor de, unos: unos diez euros. Часы всегда с артиклем las: a eso de las ocho."

  - word: cursillo
    ru: краткосрочный курс
    ipa: /kuɾˈsiʎo/
    say: курси́йо
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Короткие курсы: несколько дней или недель занятий по определённой теме."
    examples:
      - "Hizo un cursillo de primeros auxilios. — Он прошёл курсы первой помощи."
      - "Me apunté a un cursillo de verano. — Я записался на летние курсы."
    origin: "От curso «курс» (лат. cursus «бег, течение») + уменьшительное -illo: «небольшой курс»."
    register: "Нейтральное."
    synonyms:
      - word: curso corto
        pair: ["Hizo un cursillo.", "Hizo un curso corto."]
        diff:
          - "curso corto — то же, но без уменьшительного оттенка"
