# Третий список автора, часть 5 — «Desconcierto en el hospital», глава 2 (слова 15–28).
lang: es
words:
  - word: dar vueltas
    ru: ходить кругами, бродить туда-сюда
    ipa: /ˈdaɾ ˈβweltas/
    say: дар бу́эльтас
    pron: "ue — один слог «уэ»; v читается как b."
    meaning: "Идти по кругу или туда-сюда без цели. Ещё — «крутиться, вертеться» и «обдумывать снова и снова» (dar vueltas a algo)."
    examples:
      - "Los niños daban vueltas en el patio. — Дети бегали кругами во дворе."
      - "Daba vueltas por el pasillo del hospital esperando noticias del médico sobre la operación. — Он ходил кругами по коридору больницы в ожидании вестей от врача об операции."
      - "El avión estuvo dando vueltas sobre la ciudad durante media hora antes de poder aterrizar. — Самолёт полчаса кружил над городом, прежде чем смог приземлиться."
    origin: "dar «давать» + vueltas «обороты, повороты» (от volver «возвращаться, поворачивать»). Дословно «делать обороты»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: dar un paseo
        pair: ["Daba vueltas por el parque.", "Daba un paseo por el parque."]
        diff:
          - "dar un paseo — приятная прогулка"
          - "dar vueltas — ходить без цели, часто от беспокойства"
    analogs:
      - "to pace around — ходить из угла в угол"
      - "to go round in circles — ходить по кругу"
    dialogue:
      - "Ana: ¿Qué haces aquí fuera? | Что ты делаешь здесь на улице?"
      - "Pablo: Doy vueltas, estoy nervioso. | Хожу кругами, нервничаю."
      - "Ana: ¿Por la operación? | Из-за операции?"
      - "Pablo: Sí, el cirujano ya entró en el quirófano hace una hora. | Да, хирург вошёл в операционную час назад."
      - "Ana: Ven, siéntate. Dar vueltas no ayuda. | Иди, сядь. Ходить кругами не поможет."
      - "Pablo: No puedo. Me da vueltas la cabeza pensando en lo peor. | Не могу. У меня голова идёт кругом от самых плохих мыслей."
      - "Ana: Respira. Piensa que es un médico concienzudo. | Дыши. Подумай, что он добросовестный врач."
      - "Pablo: Tienes razón. Me armo de paciencia y espero. | Ты права. Запасаюсь терпением и жду."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "dar vueltas a algo — обдумывать снова и снова"
      - "dar vueltas por — бродить по"
      - "dar una vuelta — прогуляться"
      - "dar la vuelta — повернуть назад"
    collocation_example: "No dejo de darle vueltas al asunto. — Я никак не перестану думать об этом деле."
    trap: "Vuelta всегда во множественном: dar vueltas «крутиться»; в единственном — dar una vuelta «прогуляться». «Dar vueltas a algo» значит «обдумывать», а не «поворачивать»."

  - word: sobrio
    ru: сдержанный, строгий; трезвый
    ipa: /ˈsoβɾjo/
    say: со́брьо
    pron: "br — один слог; b мягкая [β]; ударение на первом слоге."
    meaning: "Без излишеств: о стиле, одежде, обстановке. Ещё — «трезвый» (о человеке, который не пьян)."
    examples:
      - "La sala era sobria y limpia. — Зал был строгий и чистый."
      - "Prefiere un estilo sobrio y elegante, con colores neutros y pocas joyas. — Она предпочитает строгий и элегантный стиль, нейтральные цвета и мало украшений."
      - "Llegó sobrio a casa, aunque había pasado la noche en una fiesta con todos sus amigos. — Он пришёл домой трезвым, хотя провёл ночь на вечеринке со всеми друзьями."
    origin: "Из лат. sobrius «трезвый, умеренный»: so- «без» + ebrius «пьяный». Противоположное — ebrio «пьяный» и embriagado."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: austero
        pair: ["Tenía un estilo sobrio.", "Tenía un estilo austero."]
        diff:
          - "austero — суровый, почти аскетичный"
          - "sobrio — сдержанный и без лишнего, но не бедный"
    analogs:
      - "sober — трезвый; и «сдержанный»"
      - "plain — простой, скромный"
    dialogue:
      - "Ana: ¿Cómo es el hospital por dentro? | Какая больница внутри?"
      - "Pablo: Sobria, sin muchos adornos. | Строгая, без лишних украшений."
      - "Ana: ¿Fría? | Холодная?"
      - "Pablo: Un poco, pero muy limpia. Paredes blancas, suelo gris, bancos de madera. | Немного, но очень чистая. Белые стены, серый пол, деревянные скамьи."
      - "Ana: Lo prefiero a un sitio recargado. | Мне это больше нравится, чем перегруженное место."
      - "Pablo: Yo también. Aunque la habitación es más acogedora. | Мне тоже. Хотя палата уютнее."
      - "Ana: ¿Y la gente qué tal? | А люди как?"
      - "Pablo: Discreta y amable. Nadie arma follón. | Сдержанные и любезные. Никто не устраивает суматоху."
    cefr: "C1."
    frequency: "Средней частоты: в описаниях и текстах."
    collocations:
      - "un estilo sobrio — сдержанный стиль"
      - "colores sobrios — сдержанные цвета"
      - "estar sobrio — быть трезвым"
    collocation_example: "Vestía un traje sobrio de color gris. — На нём был строгий серый костюм."
    trap: "Не путайте sobrio «сдержанный, трезвый» с sombrío «мрачный»: похожи, но смысл разный. Слог бр один: so-brio."

  - word: rellano
    ru: лестничная площадка
    ipa: /reˈʎano/
    say: рэйа́но
    pron: "rr в начале — раскатистое; ll в большинстве регионов — как «й»."
    meaning: "Площадка между лестничными пролётами или перед дверями квартир."
    examples:
      - "Nos encontramos en el rellano. — Мы встретились на лестничной площадке."
      - "Dejó el cochecito del niño en el rellano porque no cabía en el ascensor. — Он оставил детскую коляску на лестничной площадке, потому что она не помещалась в лифт."
      - "En el rellano hay tres puertas, y la de la derecha es la de mi abuela. — На площадке три двери, и справа дверь моей бабушки."
    origin: "От llano «ровный, плоский»: «ровное место на лестнице». re- здесь усиливает слово. Родственные: llanura «равнина»."
    register: "Нейтральное."
    synonyms:
      - word: descansillo
        pair: ["Esperó en el rellano.", "Esperó en el descansillo."]
        diff:
          - "descansillo — «площадка для отдыха» между пролётами, чаще в Испании"
          - "rellano — тоже площадка, и между пролётами, и перед дверью"
    analogs:
      - "landing — лестничная площадка"
      - "stair landing — то же"
    dialogue:
      - "Ana: ¿Dónde te espero? | Где тебя подождать?"
      - "Pablo: En el rellano del segundo. | На лестничной площадке второго этажа."
      - "Ana: ¿Hay ascensor? | Лифт есть?"
      - "Pablo: Sí, pero está estropeado. Tendrás que subir por la escalera. | Есть, но сломан. Придётся подниматься по лестнице."
      - "Ana: Qué pereza. Con el cansancio que llevo... | Какая лень. С моей-то усталостью..."
      - "Pablo: Son solo dos pisos. En el rellano hay un banco para descansar. | Всего два этажа. На площадке есть скамейка, можно передохнуть."
      - "Ana: Vale, subo despacio. No me atosigues. | Хорошо, поднимусь не спеша. Не торопи меня."
      - "Pablo: Tranquila. Yo aprovecho para llamar a mi madre. | Спокойно. А я заодно позвоню маме."
    cefr: "B2."
    frequency: "Частое в быту, особенно в Испании."
    collocations:
      - "el rellano de la escalera — лестничная площадка"
      - "salir al rellano — выйти на площадку"
      - "vecinos del rellano — соседи по площадке"
    collocation_example: "Salí al rellano para oír mejor. — Я вышел на площадку, чтобы лучше слышать."
    trap: "Не путайте rellano «площадка» с llano «ровный» и relleno «начинка». Ударение на a: rellano."

  - word: chuchería
    ru: сладость, снек, лакомство
    ipa: /tʃutʃeˈɾia/
    say: чучери́я
    pron: "ch — «ч»; ía — два слога: чу-че-ри́-я."
    meaning: "Мелкая вкусная вещь: конфета, чипсы, жвачка. Едят не для сытости, а для удовольствия."
    examples:
      - "Los niños comieron muchas chucherías hoy. — Дети съели сегодня много сладостей."
      - "No les des tantas chucherías, que luego no quieren comer nada en la cena. — Не давай им столько сладостей, потом они ничего не хотят есть за ужином."
      - "En el hospital hay una máquina de chucherías que está siempre vacía por la noche. — В больнице есть автомат со сладостями, который ночью всегда пустой."
    origin: "Происхождение неясно. Сначала слово значило «безделушка», потом «лакомство»."
    register: "Разговорное, детское."
    synonyms:
      - word: golosina
        pair: ["Le dio una chuchería.", "Le dio una golosina."]
        diff:
          - "golosina — более нейтральное, «лакомство»"
          - "chuchería — разговорное, чаще про мелкие сладости и снеки"
    analogs:
      - "treat — лакомство"
      - "snack — перекус; sweets — сладости"
    dialogue:
      - "Ana: ¿Qué compramos para los niños? | Что купим детям?"
      - "Pablo: Unas chucherías. | Немного сладостей."
      - "Ana: ¿Gominolas? | Мармеладки?"
      - "Pablo: Sí, y algún chicle. Pero no demasiadas, que luego no cenan. | Да, и жвачку. Но не слишком много, а то потом не будут ужинать."
      - "Ana: Eres prudente. Mi madre nos llenaba la bolsa y luego se arrepentía. | Ты осмотрителен. Моя мама набивала нам пакет, а потом жалела."
      - "Pablo: Hoy compramos poco, pero bueno. Las chucherías, con moderación. | Сегодня купим понемногу, но хорошего. Сладости — в меру."
      - "Ana: Vale. Aprovechando que pasamos por la tienda... | Хорошо. Раз уж мы проходим мимо магазина..."
      - "Pablo: Te compro también un bollo. Anda, no pongas esa cara. | Куплю и тебе булочку. Ну не делай такое лицо."
    cefr: "B1."
    frequency: "Частое в Испании в разговоре."
    collocations:
      - "una bolsa de chucherías — пакет сладостей"
      - "comprar chucherías — купить сладостей"
      - "tienda de chucherías — магазин сладостей"
    collocation_example: "Los niños gastaron su paga en chucherías. — Дети потратили карманные деньги на сладости."
    trap: "Слово чаще во множественном: las chucherías. В Латинской Америке вместо него dulces или golosinas."

  - word: convaleciente
    ru: выздоравливающий, восстанавливающийся
    ipa: /kombaleˈθjente/
    say: комбалесье́нтэ
    pron: "v читается как b; c перед i в Испании — [θ]."
    meaning: "Человек, который болел и уже идёт на поправку, но ещё слаб. Может быть и прилагательным."
    examples:
      - "El convaleciente necesita descansar mucho. — Выздоравливающему нужно много отдыхать."
      - "Cuando hace buen tiempo, en el jardín del hospital descansan los convalecientes. — Когда стоит хорошая погода, в саду больницы отдыхают выздоравливающие."
      - "Pasó un mes convaleciente después de la operación y no volvió al trabajo hasta marzo. — Он месяц восстанавливался после операции и вернулся на работу только в марте."
    origin: "Из лат. convalescere «набираться сил»: con- «полностью» + valere «быть сильным, здоровым». Родственное: convalecencia «выздоровление»."
    register: "Формальное, книжное."
    synonyms:
      - word: en recuperación
        pair: ["Está convaleciente tras la operación.", "Está en recuperación tras la operación."]
        diff:
          - "en recuperación — обычный оборот, понятный любому"
          - "convaleciente — слово из текстов, красивое и редкое"
    analogs:
      - "convalescent — выздоравливающий"
      - "recovering — восстанавливающийся"
    dialogue:
      - "Ana: ¿Cómo sigue tu padre? | Как твой отец?"
      - "Pablo: Convaleciente, pero mejor cada día. | Выздоравливает, и с каждым днём лучше."
      - "Ana: ¿Ya come solo? | Уже ест сам?"
      - "Pablo: Sí, ayer se terminó un plato de sopa y medio bollo. | Да, вчера доел тарелку супа и полбулочки."
      - "Ana: ¡Qué buena señal! ¿Y el humor? | Хороший знак! А настроение?"
      - "Pablo: Pese a todo, está animado. Dice que un convaleciente tiene derecho a quejarse. | Несмотря ни на что, бодр. Говорит, что выздоравливающий имеет право ворчать."
      - "Ana: Qué carácter. ¿Y dónde pasa el día? | Какой характер. А где он проводит день?"
      - "Pablo: En su sillón, con una manta y el mando de la tele. | В своём кресле, с пледом и пультом от телевизора."
    cefr: "C1."
    frequency: "Редкое: в прозе и медицинских текстах."
    collocations:
      - "estar convaleciente — быть на поправке"
      - "un periodo de convalecencia — период выздоровления"
      - "convaleciente de una operación — после операции"
    collocation_example: "Está convaleciente de una grave enfermedad. — Он выздоравливает после тяжёлой болезни."
    trap: "Слово одно и для мужчины, и для женщины: el/la convaleciente. После предлога de — от чего выздоравливает: convaleciente de la gripe."

  - word: retirarse
    ru: удалиться, уйти к себе
    ipa: /retiˈɾaɾse/
    say: рэтира́рсэ
    meaning: "Уйти, отойти от людей, пойти в свою комнату или на покой. Ещё — «уйти на пенсию»."
    examples:
      - "El abuelo se retiró a su cuarto. — Дедушка ушёл к себе в комнату."
      - "Me retiro a mi habitación, que mañana tengo que madrugar y estoy muy cansado. — Я иду к себе в комнату, потому что завтра рано вставать, и я очень устал."
      - "Se retiró a los sesenta años y se fue a vivir a una casa pequeña junto al mar. — Он вышел на пенсию в шестьдесят лет и переехал в маленький дом у моря."
    origin: "re- «назад» + tirar «тянуть, бросать»: «отойти назад». Родственные: retiro «покой, уединение», retirada «отступление»."
    register: "Нейтральное, чуть формальное и книжное."
    synonyms:
      - word: irse
        pair: ["Se retiró a su cuarto.", "Se fue a su cuarto."]
        diff:
          - "irse — обычное «уйти»"
          - "retirarse — вежливее, с оттенком «удалился, чтобы побыть одному»"
    analogs:
      - "to retire — удалиться; выйти на пенсию"
      - "to withdraw — отойти"
    dialogue:
      - "Cuando acabó la cena, el abuelo se retiró a su cuarto. | Когда ужин закончился, дедушка удалился к себе в комнату."
      - "Se despidió de todos con un beso y un «hasta mañana». | Он попрощался со всеми поцелуем и «до завтра»."
      - "En el salón se quedó un silencio extraño, casi macabro. | В гостиной повисла странная тишина, почти жуткая."
      - "Ana y Pablo se miraron en silencio, preocupados por su cansancio. | Ана и Пабло молча переглянулись, обеспокоенные его усталостью."
      - "Esa noche, sin embargo, nadie se atrevió a decir lo que pensaba. | Но в ту ночь никто не решился сказать вслух, что думает."
      - "Una hora después, la luz del cuarto seguía encendida. | Через час свет в комнате всё ещё горел."
      - "Pablo llamó suavemente a la puerta y el abuelo respondió: «Pasa, hijo». | Пабло тихонько постучал, и дедушка ответил: «Входи, сынок»."
    cefr: "B2."
    frequency: "Частое в текстах и официальной речи."
    collocations:
      - "retirarse a descansar — уйти отдыхать"
      - "retirarse de la vida pública — уйти из общественной жизни"
      - "retirarse del juego — выйти из игры"
    collocation_example: "Se retiró temprano porque estaba cansado. — Он ушёл рано, потому что устал."
    trap: "Retirarse — возвратный глагол: me retiro. Без se retirar — «забрать, снять» (retirar dinero — «снять деньги»). Значения разные."

  - word: quirófano
    ru: операционная
    ipa: /kiˈɾofano/
    say: киро́фано
    pron: "qu перед i — [k]; ударение на ro: quirófano — «кирóфано»."
    meaning: "Комната в больнице, где проводят операции."
    examples:
      - "Entró en el quirófano a las diez. — Он вошёл в операционную в десять."
      - "Esperaron a que llegara el equipo de anestesia, y los cirujanos prepararon el quirófano. — Хирурги подготовили операционную и ждали, пока приедет бригада анестезиологов."
      - "El quirófano está en la tercera planta, al fondo del pasillo, detrás de una puerta doble. — Операционная находится на третьем этаже, в конце коридора, за двойной дверью."
    origin: "От греч. cheir «рука» + phainein «показывать»: «место, где видна работа рук». Родственные слова: cirugía «хирургия» и cirujano «хирург» — тоже от греч. cheir."
    register: "Нейтральное, медицинское."
    synonyms:
      - word: sala de operaciones
        pair: ["Entró al quirófano.", "Entró a la sala de operaciones."]
        diff:
          - "sala de operaciones — то же, более «бумажное» название"
    analogs:
      - "operating room — операционная (американское)"
      - "operating theatre — операционная (британское)"
    dialogue:
      - "Ana: ¿Dónde está el paciente? | Где пациент?"
      - "Pablo: Ya está en el quirófano. | Уже в операционной."
      - "Ana: ¿Cuánto tiempo estará dentro? | Сколько он там пробудет?"
      - "Pablo: Dos horas, más o menos. Después lo llevarán a la sala de observación. | Примерно два часа. Потом его перевезут в палату наблюдения."
      - "Ana: ¿Hay riesgo de hemorragia? | Есть риск кровотечения?"
      - "Pablo: Siempre lo hay, pero el cirujano es muy concienzudo. | Всегда есть, но хирург очень добросовестный."
      - "Ana: Entonces tranquilo. ¿Quieres un café mientras esperamos? | Тогда спокойно. Хочешь кофе, пока ждём?"
      - "Pablo: Sí, aprovechemos para dar una vuelta por el jardín. | Да, воспользуемся случаем и пройдёмся по саду."
    cefr: "B2."
    frequency: "Частое в новостях и разговорах о больнице."
    collocations:
      - "entrar en el quirófano — зайти в операционную"
      - "pasar por el quirófano — пройти операцию"
      - "salir del quirófano — выйти из операционной"
    collocation_example: "Salió del quirófano tras cuatro horas. — Он вышел из операционной через четыре часа."
    trap: "Пишется quirófano через qu и ó с ударением: не «kirófano». С cirujano «хирург» и cirugía «хирургия» корень один, но пишется по-разному."

  - word: asentir
    ru: кивнуть, согласиться жестом
    ipa: /asenˈtiɾ/
    say: асэнти́р
    pron: "Спрягается e → ie: asiento, asientes; в 3-м лице прошедшего — asintió."
    meaning: "Выразить согласие кивком или словом: «да, согласен». Чаще кивок головой."
    examples:
      - "Asintió y le dio la razón. — Он кивнул и согласился с ним."
      - "Todos asintieron en silencio cuando el director preguntó si había alguna duda. — Все молча кивнули, когда директор спросил, есть ли вопросы."
      - "Asintió con la cabeza sin decir nada, y entendí que estaba de acuerdo con el plan. — Он кивнул, ничего не сказав, и я понял, что он согласен с планом."
    origin: "Из лат. assentire «соглашаться»: ad- «к» + sentire «чувствовать, думать»: «думать так же». Родственные: asentimiento «согласие», consentir «позволять»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: afirmar
        pair: ["Asintió con la cabeza.", "Afirmó con la cabeza."]
        diff:
          - "afirmar — сказать «да» или подтвердить, не обязательно кивком"
    analogs:
      - "to nod — кивнуть"
      - "to assent — согласиться"
    dialogue:
      - "Ana: ¿Está de acuerdo? | Он согласен?"
      - "Pablo: Sí, asintió sin hablar. | Да, кивнул, ничего не сказав."
      - "Ana: ¿Te miró fijamente? | Он смотрел на тебя пристально?"
      - "Pablo: Sí. Estaba aturdido, pero asintió con la cabeza y apretó mi mano. | Да. Он был оглушён, но кивнул и сжал мою руку."
      - "Ana: Qué ternura. | Какая нежность."
      - "Pablo: Después cerró los ojos. Parecía conforme. | Потом закрыл глаза. Казался спокойным."
      - "Ana: Entonces el internamiento no es tan malo como pensábamos. | Значит, госпитализация не так страшна, как мы думали."
      - "Pablo: Asiento. Pese a todo, está en buenas manos. | Согласен. Несмотря ни на что, он в надёжных руках."
    cefr: "C1."
    frequency: "Частое в прозе и описаниях."
    collocations:
      - "asentir con la cabeza — кивнуть головой"
      - "asentir en silencio — молча согласиться"
      - "asentir levemente — слегка кивнуть"
    collocation_example: "Ella asintió levemente y sonrió. — Она слегка кивнула и улыбнулась."
    trap: "Не путайте asentir «кивнуть» с asentar «поселить; положить» и asiento «сиденье»: похожие слова. Спряжение как sentir: asiento, asintió."

  - word: constante
    ru: жизненный показатель; постоянный
    ipa: /konˈstante/
    say: конста́нтэ
    meaning: "Как прилагательное — постоянный, неизменный. Как существительное во множественном (las constantes) — жизненные показатели: пульс, давление, температура."
    examples:
      - "La tensión es una constante vital. — Давление – это жизненный показатель."
      - "Le tomaron las constantes al llegar: la tensión, la temperatura y el pulso. — Ему измерили показатели при поступлении: давление, температуру и пульс."
      - "Hay un ruido constante en la calle que no deja dormir a los vecinos de ese edificio. — На улице постоянный шум, который не даёт спать жильцам того дома."
    origin: "Из лат. constans «стойкий, непрерывный», от constare «стоять твёрдо». Родственные: constancia «постоянство», constantemente «постоянно»."
    register: "Нейтральное, в медицине — стандартный термин."
    synonyms:
      - word: continuo
        pair: ["Oímos un ruido constante.", "Oímos un ruido continuo."]
        diff:
          - "continuo — без перерывов, идёт подряд"
          - "constante — не меняется, остаётся таким же"
    analogs:
      - "constant — постоянный"
      - "vital signs — жизненные показатели"
    dialogue:
      - "Ana: ¿Cómo está el paciente? | Как пациент?"
      - "Pablo: Las constantes son estables. | Показатели стабильны."
      - "Ana: ¿La tensión también? | И давление тоже?"
      - "Pablo: Sí, y el pulso es normal. No reviste ninguna gravedad. | Да, и пульс нормальный. Ничего серьёзного."
      - "Ana: Qué alivio. ¿Se lo has dicho a su mujer? | Какое облегчение. Ты сказал его жене?"
      - "Pablo: Ya, y asintió muy aliviada. | Да, и она с облегчением кивнула."
      - "Ana: ¿Y el médico qué pronostica? | А что прогнозирует врач?"
      - "Pablo: Que, una vez que pase la noche, le darán el alta. | Что как только пройдёт ночь, его выпишут."
    cefr: "B2."
    frequency: "Частое в больнице и в общей речи."
    collocations:
      - "constantes vitales — жизненные показатели"
      - "tomar las constantes — измерить показатели"
      - "un ruido constante — постоянный шум"
    collocation_example: "La enfermera comprobó las constantes vitales. — Медсестра проверила жизненные показатели."
    trap: "В медицине constante чаще женского рода во множественном: las constantes vitales (пульс, давление). Ударение на tan: constante."

  - word: ingerir
    ru: принимать внутрь, употреблять
    ipa: /iŋxeˈɾiɾ/
    say: инхэри́р
    pron: "g перед e — «х»; n перед g звучит как носовое [ŋ]. Спрягается e → ie: ingiero, ingieres."
    meaning: "Проглотить еду, воду или лекарство. Слово медицинское и официальное."
    examples:
      - "El niño ingirió un medicamento por error. — Ребёнок по ошибке проглотил лекарство."
      - "Puede ser muy peligroso, por eso no debe ingerir alcohol mientras toma este medicamento. — Это может быть очень опасно, поэтому ему нельзя употреблять алкоголь, пока он принимает это лекарство."
      - "Se recomienda ingerir mucho líquido después de la operación para ayudar a los riñones. — После операции рекомендуется пить много жидкости, чтобы помочь почкам."
    origin: "Из лат. ingerere «вносить, вкладывать»: in- «внутрь» + gerere «нести». Родственные: ingestión «приём внутрь», digerir «переваривать»."
    register: "Формальное, медицинское; в разговоре — comer, beber, tomar."
    synonyms:
      - word: tragar
        pair: ["Ingirió una pastilla.", "Tragó una pastilla."]
        diff:
          - "tragar — обычное «проглотить»"
          - "ingerir — официальное «принять внутрь», слово из инструкций"
    analogs:
      - "to ingest — принимать внутрь, то же слово"
      - "to swallow — проглотить"
    dialogue:
      - "Ana: ¿Puedo beber alcohol con este medicamento? | Можно пить алкоголь с этим лекарством?"
      - "Pablo: No, no debe ingerir alcohol mientras lo toma. | Нет, нельзя употреблять алкоголь, пока вы его принимаете."
      - "Ana: ¿Ni siquiera una cerveza? | Даже пива нельзя?"
      - "Pablo: Ni una. El comprimido se absorbe más despacio y puede dar mareo. | Ни капли. Таблетка усваивается медленнее и может вызвать головокружение."
      - "Ana: Vale. ¿Y la comida? ¿Tengo que estar en ayunas? | Хорошо. А еда? Нужно ли принимать натощак?"
      - "Pablo: No, conviene ingerirlo después de comer, con un vaso de agua. | Нет, лучше принять после еды, запив стаканом воды."
      - "Ana: ¿Y si ingiero más de la cuenta? | А если приму больше нормы?"
      - "Pablo: Llama al médico enseguida. Una dosis doble no reviste gravedad, pero mejor avisar. | Сразу звони врачу. Двойная доза не опасна, но лучше предупредить."
    cefr: "C1."
    frequency: "Частое в инструкциях и новостях."
    collocations:
      - "ingerir alimentos — принимать пищу"
      - "ingerir un medicamento — принять лекарство"
      - "ingerir alcohol — употреблять алкоголь"
    collocation_example: "Se recomienda ingerir mucho líquido. — Рекомендуется пить много жидкости."
    trap: "Не путайте ingerir «принимать внутрь» с injerir «вмешиваться» и ingresar «госпитализировать». Спрягается как sentir: ingiero, ingirió."

  - word: masticar chicle
    ru: жевать жвачку
    ipa: /mastiˈkaɾ ˈtʃikle/
    say: мастика́р чи́клэ
    pron: "ch — «ч»; в chicle — ударение на первом слоге."
    meaning: "Жевать жевательную резинку. Masticar — «жевать» вообще, часто в медицинском значении."
    examples:
      - "No masticar chicle en el hospital. — Не жевать жвачку в больнице."
      - "Cuando lo ve, el profesor se enfada mucho, así que no mastiques chicle en clase. — Когда он это видит, учитель очень сердится, так что не жуй жвачку на уроке."
      - "Mastica despacio la comida y no hables con la boca llena, que es de mala educación. — Жуй еду медленно и не разговаривай с полным ртом, это невежливо."
    origin: "masticar — из лат. masticare «жевать» (от греч. mastichan «скрежетать зубами»). chicle — из языка науатль tzictli «смола». Жвачка получила название от смолы чикле-дерева."
    register: "Нейтральное; в разговоре чаще mascar chicle."
    synonyms:
      - word: mascar
        pair: ["Mastica chicle todo el día.", "Masca chicle todo el día."]
        diff:
          - "mascar — разговорное, чаще про жвачку и жвачные привычки"
          - "masticar — нейтральное, общее «жевать»"
    analogs:
      - "to chew gum — жевать жвачку"
      - "to chew — жевать"
    dialogue:
      - "Ana: ¿Puedo comer chicle antes de la prueba? | Можно жевать жвачку перед анализом?"
      - "Pablo: No, no puedes masticar chicle en ayunas. | Нет, нельзя жевать жвачку натощак."
      - "Ana: ¿Por qué? Si no es comida. | Почему? Это же не еда."
      - "Pablo: Porque estimula el estómago y puede alterar el resultado. | Потому что стимулирует желудок и может исказить результат."
      - "Ana: Qué manía. Yo mastico chicle cuando estoy nerviosa. | Какая прихоть. Я жую жвачку, когда нервничаю."
      - "Pablo: Pues hoy aguanta. Una vez que acabes, te compro un paquete. | Тогда сегодня потерпи. Когда закончишь, куплю тебе пачку."
      - "Ana: Y unas chucherías, ¿no? | И сладостей, да?"
      - "Pablo: Y unas chucherías. Pero con moderación, que luego te mareas. | И сладостей. Но в меру, а то потом закружится голова."
    cefr: "B2."
    frequency: "Частое в быту."
    collocations:
      - "masticar bien — хорошо пережёвывать"
      - "masticar chicle — жевать жвачку"
      - "un chicle de menta — мятная жвачка"
    collocation_example: "Mastícalo bien antes de tragar. — Хорошо пережуй, прежде чем глотать."
    trap: "В испанском «жвачка» — chicle (мужской род, el chicle), а не «chewing gum»: «Chewing gum» тоже поймут, но по-испански — chicle. Masticar пишется через t: mas-ti-car."

  - word: estar despejado
    ru: быть бодрым, с ясной головой
    ipa: /esˈtaɾ despeˈxaðo/
    say: эста́р дэспэха́до
    pron: "j — «х»; d между гласными мягкое [ð]."
    meaning: "Быть в ясном сознании, не сонным, соображать чётко. О небе — «безоблачный, ясный»."
    examples:
      - "Estoy despejado después del café. — После кофе я бодр."
      - "Dormiré bien esta noche, porque necesito estar despejado para conducir tantas horas. — Я хорошо высплюсь сегодня, потому что мне нужно быть с ясной головой, чтобы вести машину столько часов."
      - "Hoy el cielo está despejado, sin una sola nube, así que podremos ver las estrellas. — Сегодня небо ясное, ни одного облачка, так что мы сможем увидеть звёзды."
    origin: "Причастие от despejar «расчищать, освобождать»: как небо без облаков, так и голова без «тумана»."
    register: "Нейтральное."
    synonyms:
      - word: estar espabilado
        pair: ["Estoy despejado por la mañana.", "Estoy espabilado por la mañana."]
        diff:
          - "espabilado — «проснувшийся, бодрый и сообразительный», чаще о человеке, чуть разговорное"
    analogs:
      - "to be clear-headed — быть в ясном сознании"
      - "to be alert — быть бодрым"
    dialogue:
      - "Ana: ¿Cómo te sientes? | Как ты себя чувствуешь?"
      - "Pablo: Despejado, ya no tengo sueño. | Бодрым, спать уже не хочется."
      - "Ana: ¿Dormiste bien anoche? | Ты хорошо спал сегодня ночью?"
      - "Pablo: Poco, pero un café bien cargado y un paseo me despejaron. | Мало, но крепкий кофе и прогулка прочистили голову."
      - "Ana: A mí el café me da más cansancio. | А у меня от кофе только больше усталости."
      - "Pablo: Será cosa de cada uno. Yo, con una buena ducha, estoy despejado todo el día. | Это у каждого по-своему. Мне хватает хорошего душа, и я бодр весь день."
      - "Ana: Qué suerte. Hoy me pesa la cabeza. | Повезло. А у меня сегодня тяжёлая голова."
      - "Pablo: Pues sal a dar una vuelta. El aire fresco despeja la mente. | Тогда пройдись. Свежий воздух проясняет мысли."
    cefr: "B2."
    frequency: "Частое в разговоре и в погодных сводках."
    collocations:
      - "cielo despejado — ясное небо"
      - "mente despejada — ясная голова"
      - "con la cabeza despejada — со свежей головой"
    collocation_example: "Necesito dormir bien para tener la mente despejada. — Мне нужно хорошо выспаться, чтобы голова была ясной."
    trap: "В значении «бодрый» говорят estar despejado, но не ser: Soy despejado не годится. Despejado ещё и «просторный»: una calle despejada — «свободная улица»."

  - word: cotilleo
    ru: сплетня, сплетни
    ipa: /kotiˈʎeo/
    say: котийэ́о
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Разговоры о чужой жизни: кто с кем что делал. Обычно во множественном: cotilleos."
    examples:
      - "Cuéntame el último cotilleo del barrio. — Расскажи мне последнюю сплетню района."
      - "En la oficina hay mucho cotilleo sobre quién cambiará de departamento este año. — В офисе много сплетен о том, кто в этом году сменит отдел."
      - "Detrás del cotilleo del barrio había una historia real que nadie se atrevía a contar. — За сплетнями в районе стояла настоящая история, которую никто не решался рассказать."
    origin: "От cotillear «сплетничать». По одной из версий, от cotilla «корсетница»: корсетницы славились болтовнёй. Родственное: cotilla «сплетник, сплетница»."
    register: "Разговорное, чуть шутливое."
    synonyms:
      - word: chisme
        pair: ["No me interesa el cotilleo.", "No me interesa el chisme."]
        diff:
          - "chisme — чаще сам слух, одна сплетня; в Латинской Америке основное слово"
          - "cotilleo — само занятие, пересуды, особенно в Испании"
    analogs:
      - "gossip — сплетни"
      - "tittle-tattle — болтовня о пустяках"
    dialogue:
      - "Ana: ¿Qué cuentan en el trabajo? | Что говорят на работе?"
      - "Pablo: Puro cotilleo, nada serio. | Сплошные сплетни, ничего серьёзного."
      - "Ana: Cuéntame, que me aburro. | Расскажи, мне скучно."
      - "Pablo: Dicen que el jefe y la secretaria se llevan muy bien. | Говорят, что начальник с секретаршей очень дружны."
      - "Ana: ¡Qué cotilleo más jugoso! ¿Y es verdad? | Какая смачная сплетня! И это правда?"
      - "Pablo: No lo sé. Aquí todos cotillean pero nadie sabe nada con certeza. | Не знаю. Тут все сплетничают, но никто ничего не знает наверняка."
      - "Ana: Sinceramente, me encanta el cotilleo, aunque me arrepienta después. | Честно говоря, обожаю сплетни, хоть потом и жалею."
      - "Pablo: Pues mejor no lo repitas. Puede traer problemas. | Тогда лучше не повторяй. Это может принести проблемы."
    cefr: "B2."
    frequency: "Частое в Испании в разговоре."
    collocations:
      - "programa de cotilleo — программа о сплетнях"
      - "revista del cotilleo — жёлтая пресса"
      - "ser un cotilla — быть сплетником"
    collocation_example: "Mi vecina es una cotilla y siempre pregunta todo. — Моя соседка — сплетница, и всегда всё расспрашивает."
    trap: "Cotilleo — существительное, а «сплетничать» — cotillear. Слово испанское; в Латинской Америке — chisme и chismorreo."

  - word: infidelidad
    ru: измена
    ipa: /imfiðeliˈðað/
    say: инфидэлида́д
    pron: "d между гласными и на конце слова мягкое [ð]."
    meaning: "Нарушение верности в браке или отношениях. Ещё — «неверность» слову, делу."
    examples:
      - "Descubrió la infidelidad de su socio. — Он узнал об измене своего партнёра."
      - "Aunque intentaron seguir juntos un año más, su matrimonio lo destruyó la infidelidad. — Хотя они пытались остаться вместе ещё год, их брак разрушила измена."
      - "Es una novela sobre la infidelidad en una pequeña ciudad de provincias durante el siglo diecinueve. — Это роман об измене в маленьком провинциальном городе в девятнадцатом веке."
    origin: "От infiel «неверный» (лат. infidelis: in- «не» + fidelis «верный»). Родственные: fidelidad «верность», fe «вера»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: engaño
        pair: ["Hubo infidelidad en la pareja.", "Hubo engaño en la pareja."]
        diff:
          - "engaño — любой обман, не только измена"
          - "infidelidad — именно неверность партнёру"
    analogs:
      - "infidelity — измена"
      - "cheating — разговорное: изменять"
    dialogue:
      - "Ana: ¿Por qué se separaron Lucía y Marcos? | Почему расстались Лусия и Маркос?"
      - "Pablo: Por una infidelidad. | Из-за измены."
      - "Ana: ¡No me lo puedo creer! ¿Quién fue? | Не могу поверить! Кто изменил?"
      - "Pablo: No lo dice nadie claramente. Todo son cotilleos y medias palabras. | Никто прямо не говорит. Одни сплетни и недомолвки."
      - "Ana: Qué pena. Siempre parecían muy felices. | Как жаль. Они всегда казались такими счастливыми."
      - "Pablo: Pues ya ves. La infidelidad destruye la confianza y deja mucho resentimiento. | Вот так. Измена разрушает доверие и оставляет много обиды."
      - "Ana: ¿Y ahora cómo están? | А как они сейчас?"
      - "Pablo: Pese a todo, hablan por teléfono. Aunque él sigue dolido. | Несмотря ни на что, они созваниваются. Хотя он всё ещё обижен."
    cefr: "B2."
    frequency: "Частое в новостях и книгах."
    collocations:
      - "una infidelidad — измена"
      - "perdonar una infidelidad — простить измену"
      - "infidelidad conyugal — супружеская измена"
    collocation_example: "No pudo perdonar su infidelidad. — Она не смогла простить его измену."
    trap: "Не путайте infidelidad «измена» с infiel «неверный» (прилагательное). Глагол «изменять» — ser infiel a alguien."
