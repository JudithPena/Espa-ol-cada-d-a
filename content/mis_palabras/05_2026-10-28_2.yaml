# Третий список автора, часть 8 — «Lola Lago: vacaciones al sol», глава 1 (слова 15–28).
lang: es
words:
  - word: IVA
    ru: НДС (налог на добавленную стоимость)
    ipa: /ˈiβa/
    say: и́ба
    pron: "Читается как слово «и́ба»: i-ba, v как b; пишется заглавными. Расшифровка: impuesto sobre el valor añadido."
    meaning: "Налог, который уже включён в цену товаров и услуг. В Испании основная ставка — 21 %."
    examples:
      - "El precio incluye el IVA. — В цену включён НДС."
      - "El gobierno bajó el IVA de los alimentos básicos para ayudar a las familias. — Правительство снизило НДС на основные продукты, чтобы помочь семьям."
      - "¿Con IVA o sin IVA? Es que si es para la empresa, necesito la factura con el desglose. — С НДС или без? Если это для компании, мне нужен счёт с расшифровкой."
    origin: "Аббревиатура: Impuesto sobre el Valor Añadido — «налог на добавленную стоимость». valor «стоимость» + añadido «добавленный» (от añadir «добавлять»)."
    register: "Нейтральное, деловое, обиходное."
    synonyms: []
    analogs:
      - "VAT — value added tax, тот же налог"
      - "sales tax — налог с продаж (в США)"
    dialogue:
      - "Ana: ¿Cuánto cuesta con IVA? | Сколько стоит с НДС?"
      - "Pablo: Cien euros más IVA. | Сто евро плюс НДС."
      - "Ana: O sea, ciento veintiuno. | То есть сто двадцать один."
      - "Pablo: Exacto. El IVA general es del veintiuno por ciento. | Верно. Общий НДС — двадцать один процент."
      - "Ana: ¿Y en los alimentos? | А на продукты?"
      - "Pablo: Ahí es menor. Hay un IVA reducido para el pan, la leche y la fruta. | Там меньше. Есть сниженный НДС на хлеб, молоко и фрукты."
      - "Ana: Sinceramente, no entiendo cómo se calcula. | Честно говоря, не понимаю, как это считается."
      - "Pablo: Mira la factura. Siempre aparece el IVA aparte, por si hace falta. | Посмотри на счёт. НДС всегда указан отдельно — на случай, если понадобится."
    cefr: "B1."
    frequency: "Очень частое в Испании: в магазинах, счетах, новостях."
    collocations:
      - "IVA incluido — НДС включён"
      - "más IVA — плюс НДС"
      - "bajar el IVA — снизить НДС"
    collocation_example: "Los precios ya llevan el IVA incluido. — В цены уже включён НДС."
    trap: "IVA — мужского рода: el IVA. Пишется заглавными буквами и произносится как слово, а не по буквам. В Латинской Америке называется по-разному, например ITBIS в Доминикане."

  - word: pagar impuestos
    ru: платить налоги
    ipa: /paˈɣaɾ imˈpwestos/
    say: пага́р импуэ́стос
    pron: "g между гласными мягкое [ɣ]: pagar — «пага́р»; ue — один слог «уэ»."
    meaning: "Отдавать государству часть своего дохода или своей покупки в виде налога."
    examples:
      - "Todos tenemos que pagar impuestos. — Все мы должны платить налоги."
      - "Los autónomos pagan impuestos cada trimestre, y eso les complica mucho la contabilidad. — Самозанятые платят налоги каждый квартал, и это сильно усложняет им бухгалтерию."
      - "La empresa paga muchos impuestos, y por eso el ayuntamiento no quiere que se vaya. — Компания платит много налогов, и поэтому мэрия не хочет, чтобы она уезжала."
    origin: "pagar «платить» (лат. pacare «успокаивать») + impuestos «налоги» (от imponer «налагать»)."
    register: "Нейтральное, формальное."
    synonyms: []
    analogs:
      - "to pay taxes — платить налоги"
      - "to pay tax — платить налог"
    dialogue:
      - "Ana: ¿Por qué estás tan preocupado? | Почему ты так встревожен?"
      - "Pablo: Tengo que pagar impuestos esta semana. | Мне на этой неделе нужно заплатить налоги."
      - "Ana: ¿Tanto es? | Что, так много?"
      - "Pablo: Más de lo que pensaba. Me olvidé de apuntar unos ingresos. | Больше, чем я думал. Я забыл записать несколько доходов."
      - "Ana: ¿Y si no los declaras? | А если не декларировать?"
      - "Pablo: Ni siquiera lo pienso. No pagar impuestos tiene consecuencias nefastas. | Даже не думаю. Неуплата налогов имеет пагубные последствия."
      - "Ana: Tienes razón. Lo de la multa te lo enseñó. | Ты прав. Урок со штрафом тебя научил."
      - "Pablo: Pues sí. Todos tenemos que pagar impuestos, aunque cueste. | Именно. Все мы должны платить налоги, пусть и дорого."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "pagar impuestos — платить налоги"
      - "evadir impuestos — уклоняться от налогов"
      - "cobrar impuestos — взимать налоги"
    collocation_example: "Evadir impuestos es un delito. — Уклонение от налогов — это преступление."
    trap: "Налоги платят: pagar impuestos, а не «dar impuestos». Для «заплатить налог на что-то» — pagar impuestos por: pagar impuestos por la casa."

  - word: declarar impuestos
    ru: подавать налоговую декларацию, декларировать доходы
    ipa: /deklaˈɾaɾ imˈpwestos/
    say: дэклара́р импуэ́стос
    pron: "Ударение на ra: declarar."
    meaning: "Сообщить налоговой службе о своих доходах и имуществе: «подать декларацию»."
    examples:
      - "Declaró sus impuestos con ayuda de un asesor. — Он подал декларацию с помощью консультанта."
      - "Tienes que declarar impuestos antes de junio, aunque no hayas ganado mucho este año. — Ты должен подать налоговую декларацию до июня, даже если в этом году мало заработал."
      - "No declaró todos sus ingresos, y por eso ahora tiene que pagar una multa muy alta. — Он задекларировал не все доходы, и поэтому теперь должен заплатить очень высокий штраф."
    origin: "declarar «заявлять, объявлять» (лат. declarare «разъяснять»: de- «полностью» + clarare «делать ясным») + impuestos «налоги»."
    register: "Формальное, налоговое."
    synonyms:
      - word: hacer la declaración de la renta
        pair: ["Ya declaré impuestos.", "Ya hice la declaración de la renta."]
        diff:
          - "hacer la declaración de la renta — обычная разговорная формула в Испании"
          - "declarar impuestos — короче и безличнее"
    analogs:
      - "to file a tax return — подать налоговую декларацию"
      - "to declare income — декларировать доходы"
    dialogue:
      - "Ana: ¿Ya hiciste la declaración? | Ты уже подал декларацию?"
      - "Pablo: No, aún tengo que declarar impuestos. | Нет, мне ещё нужно декларировать налоги."
      - "Ana: ¿Y el plazo? | А срок?"
      - "Pablo: Termina el treinta. Estoy a punto de empezar. | Заканчивается тридцатого. Вот-вот начну."
      - "Ana: ¿Lo haces tú solo? | Ты делаешь сам?"
      - "Pablo: Sí, con la ayuda del programa de Hacienda. Hay que armarse de paciencia. | Да, с помощью программы налоговой. Нужно запастись терпением."
      - "Ana: Yo prefiero un asesor concienzudo. | А я предпочитаю дотошного консультанта."
      - "Pablo: Pues yo, mediante el ordenador, aprovecho para entender mis cuentas. | А я за компьютером заодно понимаю свои расходы."
    cefr: "B2."
    frequency: "Частое в Испании весной (кампания «la Renta»)."
    collocations:
      - "declarar ingresos — декларировать доходы"
      - "la declaración de la renta — налоговая декларация"
      - "declarar a Hacienda — задекларировать налоговой"
    collocation_example: "Todos los autónomos deben declarar sus ingresos. — Все самозанятые должны декларировать доходы."
    trap: "Declarar — ещё и «давать показания» в суде: declarar como testigo. Нужное значение подсказывает контекст. Не путайте с pagar: можно declarar, но не платить."

  - word: ir a buscar a alguien
    ru: забирать, встречать кого-то
    ipa: /iɾ a βusˈkaɾ a ˈalɣjen/
    say: ир а буска́р а а́льгьен
    pron: "a alguien — два «а» подряд: «а а́льгьен»; c перед a — [k]."
    meaning: "Заехать за кем-то и забрать: из аэропорта, школы, со встречи. Обратите внимание на двойное a."
    examples:
      - "¿Quién me va a buscar mañana? — Кто завтра меня заберёт?"
      - "¿Me vas a buscar al aeropuerto o prefieres que tome un taxi hasta casa? — Ты встретишь меня в аэропорту или мне лучше взять такси до дома?"
      - "Voy a buscar a mi hija al colegio a las cuatro y luego iremos juntas al parque. — Я пойду забирать дочь из школы в четыре, а потом мы вместе пойдём в парк."
    origin: "ir «идти» + a buscar «искать» + a «предлог перед человеком» + alguien «кто-то». Буквально «идти искать кого-то»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: recoger a alguien
        pair: ["Voy a buscar a mi hijo.", "Voy a recoger a mi hijo."]
        diff:
          - "recoger — «забрать», чуть формальнее и чаще в Испании"
          - "ir a buscar — «пойти и найти, забрать», в Латинской Америке чаще"
    analogs:
      - "to pick up — забрать"
      - "to go and get — пойти за кем-то"
    dialogue:
      - "Ana: ¿Quién va a buscar a los niños? | Кто заберёт детей?"
      - "Pablo: Yo los voy a buscar a las cinco. | Я заберу их в пять."
      - "Ana: ¿Y si tienes turno? | А если у тебя смена?"
      - "Pablo: Hoy no. Salgo a las cuatro, y de paso paso por el supermercado. | Сегодня нет. Я заканчиваю в четыре и заодно зайду в супермаркет."
      - "Ana: Pues yo voy a buscar a tu madre al aeropuerto. | А я поеду встречать твою маму в аэропорт."
      - "Pablo: ¿Seguro? Llega sin previo aviso, como siempre. | Уверена? Она приезжает без предупреждения, как всегда."
      - "Ana: Sí, me llamó anoche. No quiere que nadie se preocupe. | Да, она позвонила вчера вечером. Не хочет, чтобы кто-то волновался."
      - "Pablo: Qué mujer. Pues entonces nos vemos todos a la hora de cenar. | Вот это женщина. Тогда встретимся все к ужину."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "ir a buscar a alguien al aeropuerto — встретить кого-то в аэропорту"
      - "venir a buscar a alguien — приехать за кем-то"
      - "ir a buscar algo — пойти за чем-то"
    collocation_example: "Mañana voy a buscarte a la estación. — Завтра я заберу тебя на вокзале."
    trap: "Перед человеком нужен предлог a: buscar a alguien. Перед предметом a нет: ir a buscar un libro. Не путайте с encontrar «находить»."

  - word: azafata
    ru: стюардесса, бортпроводница
    ipa: /aθaˈfata/
    say: асафа́та
    pron: "z в Испании — [θ], как th в английском _think_; в Латинской Америке — [s]."
    meaning: "Женщина, которая работает на борту самолёта и заботится о пассажирах. Ещё — «помощница на мероприятиях»."
    examples:
      - "La azafata sirvió café a todos. — Стюардесса подала всем кофе."
      - "Trabaja de azafata de congresos y habla cuatro idiomas con los visitantes extranjeros. — Она работает хостес на конгрессах и говорит с иностранными гостями на четырёх языках."
      - "La azafata nos dio la bienvenida con una sonrisa y nos indicó dónde estaban nuestros asientos. — Стюардесса приветствовала нас с улыбкой и показала, где наши места."
    origin: "Из арабского as-safaṭa «корзина»: так называли придворную служанку, которая подавала королеве вещи из корзины. Позже слово перешло на бортпроводниц."
    register: "Нейтральное."
    synonyms:
      - word: auxiliar de vuelo
        pair: ["La azafata atendió a los pasajeros.", "La auxiliar de vuelo atendió a los pasajeros."]
        diff:
          - "auxiliar de vuelo — современное, неотмеченное по полу название должности"
          - "azafata — привычное, но женское; для мужчины — auxiliar de vuelo или sobrecargo"
    analogs:
      - "flight attendant — бортпроводник"
      - "air hostess — стюардесса (устаревает)"
    dialogue:
      - "Ana: ¿Quién te atendió en el vuelo? | Кто обслуживал тебя в полёте?"
      - "Pablo: Una azafata muy amable. | Очень любезная стюардесса."
      - "Ana: ¿Y cómo fue el viaje? | И как прошёл перелёт?"
      - "Pablo: Tranquilo, aunque hubo turbulencias. La azafata nos pidió que mantuviéramos la calma. | Спокойно, хотя была турбулентность. Стюардесса попросила нас сохранять спокойствие."
      - "Ana: ¿Te asustaste? | Ты испугался?"
      - "Pablo: Un poco, me estremecí. Pero ella sonreía y todo parecía normal. | Немного, вздрогнул. Но она улыбалась, и всё казалось нормальным."
      - "Ana: Qué paciencia deben tener. | Сколько терпения им нужно."
      - "Pablo: Mucha. Y sin tomarse ni un respiro durante horas. | Много. И ни минуты передышки на протяжении многих часов."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "azafata de vuelo — бортпроводница"
      - "azafata de congresos — помощница на мероприятиях"
      - "azafata de tierra — сотрудница аэропорта"
    collocation_example: "La azafata de tierra nos ayudó con el equipaje. — Сотрудница аэропорта помогла нам с багажом."
    trap: "Слово женского рода. Для мужчины — auxiliar de vuelo, а не «azafato». В Латинской Америке стюардесса — aeromoza, а не azafata."

  - word: auxiliar de vuelo
    ru: бортпроводник
    ipa: /auksiˈljaɾ de ˈβwelo/
    say: ауксилья́р дэ бу́эло
    pron: "x между гласными — «кс»: auxiliar — «ауксилья́р»; ue — один слог «уэ»."
    meaning: "Сотрудник авиакомпании, который работает на борту: следит за безопасностью и обслуживает пассажиров. Одно слово и для мужчин, и для женщин."
    examples:
      - "Soy auxiliar de vuelo desde hace tres años. — Я бортпроводник уже три года."
      - "Los auxiliares de vuelo explican las normas de seguridad antes de despegar. — Бортпроводники объясняют правила безопасности перед взлётом."
      - "Mi hermano es auxiliar de vuelo y pasa la mitad del mes en hoteles de otros países. — Мой брат бортпроводник и половину месяца проводит в гостиницах других стран."
    origin: "auxiliar «помощник» (лат. auxiliaris «вспомогательный», от auxilium «помощь») + de vuelo «рейсовый». «Помощник на рейсе»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: tripulante de cabina
        pair: ["Trabaja como auxiliar de vuelo.", "Trabaja como tripulante de cabina."]
        diff:
          - "tripulante de cabina — самое официальное: член экипажа в салоне"
    analogs:
      - "flight attendant — бортпроводник"
      - "cabin crew — салонный экипаж"
    dialogue:
      - "Ana: ¿A qué se dedica tu primo? | Чем занимается твой двоюродный брат?"
      - "Pablo: Es auxiliar de vuelo. | Он бортпроводник."
      - "Ana: ¡Qué guay! ¿Viaja mucho? | Здорово! Он много путешествует?"
      - "Pablo: Sí, pero casi nunca ve la ciudad. Aterriza, descansa y vuelve a volar. | Да, но почти не видит города. Приземляется, отдыхает и снова летит."
      - "Ana: ¿Y no echa de menos a su familia? | А он не скучает по семье?"
      - "Pablo: Muchísimo. Aprovecha las escalas para llamar a su madre. | Очень. Использует пересадки, чтобы позвонить маме."
      - "Ana: Un trabajo agotador. | Изматывающая работа."
      - "Pablo: Sí. Pese a todo, dice que no lo cambiaría por nada. | Да. Но говорит, что ни на что бы её не променял."
    cefr: "B2."
    frequency: "Частое в вакансиях и новостях."
    collocations:
      - "auxiliar de vuelo — бортпроводник"
      - "personal de vuelo — лётный персонал"
      - "auxiliar de cabina — салонный бортпроводник"
    collocation_example: "La auxiliar de vuelo repartió las bebidas. — Бортпроводница разнесла напитки."
    trap: "Слово не меняется по роду: el auxiliar de vuelo / la auxiliar de vuelo. Не путайте с auxilio «помощь»: «¡Auxilio!» — «На помощь!»."

  - word: huelga
    ru: забастовка
    ipa: /ˈwelɣa/
    say: у́эльга
    pron: "h не читается; ue — один слог «уэ»: huelga — «у́эльга»."
    meaning: "Остановка работы, к которой призывают работники, чтобы чего-то добиться: повышения зарплаты, лучших условий."
    examples:
      - "Hay huelga de transportes mañana. — Завтра забастовка на транспорте."
      - "Los trabajadores están en huelga desde hace tres semanas para exigir mejores salarios. — Работники бастуют уже три недели, требуя более высоких зарплат."
      - "La huelga de los médicos obligó a aplazar cientos de operaciones en toda la región. — Забастовка врачей вынудила отложить сотни операций по всему региону."
    origin: "От holgar «отдыхать, бездельничать»: huelga — «время без работы». Родственное: holgazán «лентяй»."
    register: "Нейтральное, из новостей."
    synonyms:
      - word: paro
        pair: ["Convocaron una huelga.", "Convocaron un paro."]
        diff:
          - "paro — в Латинской Америке «забастовка»; в Испании paro ещё и «безработица»"
          - "huelga — «забастовка» везде"
    analogs:
      - "strike — забастовка"
      - "walkout — выход с работы"
    dialogue:
      - "Ana: ¿Funcionan los trenes? | Поезда ходят?"
      - "Pablo: No, hay huelga. | Нет, забастовка."
      - "Ana: ¿Otra vez? ¿Cuántos días? | Опять? Сколько дней?"
      - "Pablo: Tres. Los maquinistas reclaman mejores sueldos. | Три. Машинисты требуют повысить зарплаты."
      - "Ana: Qué follón. ¿Cómo voy a llegar a la oficina? | Какая суматоха. Как мне добраться до офиса?"
      - "Pablo: Hay servicios mínimos, pero tendrás para rato en la parada. | Есть минимальные рейсы, но на остановке тебе придётся долго ждать."
      - "Ana: Pues me armo de paciencia. | Тогда запасусь терпением."
      - "Pablo: O ve en bici. Hace buen día y está soleado. | Или поезжай на велосипеде. Погода хорошая, солнечно."
    cefr: "B1."
    frequency: "Очень частое в новостях."
    collocations:
      - "estar en huelga — бастовать"
      - "ir a la huelga — объявить забастовку"
      - "una huelga general — всеобщая забастовка"
    collocation_example: "Los pilotos están en huelga desde el lunes. — Пилоты бастуют с понедельника."
    trap: "Пишется с h в начале, которая не читается: huelga. Для человека — huelguista. Не путайте с huella «след, отпечаток»."

  - word: convocar una huelga
    ru: объявить забастовку
    ipa: /komboˈkaɾ ˈuna ˈwelɣa/
    say: комбока́р у́на у́эльга
    pron: "v читается как b; перед e c меняется на qu: convoqué."
    meaning: "Официально призвать работников начать забастовку в определённый день."
    examples:
      - "Los pilotos convocaron una huelga mañana. — Пилоты объявили забастовку на завтра."
      - "Han convocado una huelga general contra la reforma laboral que prepara el gobierno. — Объявили всеобщую забастовку против трудовой реформы, которую готовит правительство."
      - "El sindicato convocó una huelga para el lunes si no se llega a un acuerdo antes del viernes. — Профсоюз объявил забастовку на понедельник, если до пятницы не будет достигнуто соглашение."
    origin: "convocar «созывать» (лат. convocare: con- «вместе» + vocare «звать») + huelga. «Созвать» людей на забастовку. Родственное: convocatoria «созыв, конкурс»."
    register: "Формальное, из новостей."
    synonyms:
      - word: llamar a la huelga
        pair: ["Convocaron una huelga.", "Llamaron a la huelga."]
        diff:
          - "llamar a la huelga — проще и ближе к разговору"
          - "convocar — официальнее: профсоюз «созывает»"
    analogs:
      - "to call a strike — объявить забастовку"
      - "to call for a strike — призвать к забастовке"
    dialogue:
      - "Ana: ¿Quién ha convocado la huelga? | Кто объявил забастовку?"
      - "Pablo: Los sindicatos del transporte. | Профсоюзы транспорта."
      - "Ana: ¿Y por qué ahora? | И почему именно сейчас?"
      - "Pablo: Porque la dirección se niega a negociar los sueldos. | Потому что руководство отказывается обсуждать зарплаты."
      - "Ana: ¿Es un conflicto grave? | Это серьёзный конфликт?"
      - "Pablo: Bastante. Si no llegan a un acuerdo, convocarán otra huelga más larga. | Довольно. Если они не договорятся, объявят ещё одну, более долгую."
      - "Ana: Qué consecuencia nefasta para los viajeros. | Какое пагубное последствие для пассажиров."
      - "Pablo: Sí, aunque, de hecho, muchos apoyan a los trabajadores. | Да, хотя на самом деле многие поддерживают работников."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "convocar elecciones — объявить выборы"
      - "convocar una reunión — созвать собрание"
      - "convocar una huelga — объявить забастовку"
    collocation_example: "Convocaron una reunión urgente para el viernes. — Срочное собрание созвали на пятницу."
    trap: "Convocar — переходный: что объявляют — прямое дополнение: convocar una huelga. Для кого — a: convocar a los trabajadores. Не путайте с convencer «убеждать»."

  - word: huelga de hambre
    ru: голодовка
    ipa: /ˈwelɣa de ˈambɾe/
    say: у́эльга дэ а́мбрэ
    pron: "h не читается ни в huelga, ни в hambre: «у́эльга дэ а́мбрэ»."
    meaning: "Протест, при котором человек отказывается от еды, чтобы привлечь внимание или чего-то добиться."
    examples:
      - "Comenzó una huelga de hambre en la cárcel. — В тюрьме началась голодовка."
      - "El preso está en huelga de hambre desde el lunes pasado. — Заключённый голодает с прошлого понедельника."
      - "Está en huelga de hambre desde hace una semana y los médicos temen por su salud. — Он голодает уже неделю, и врачи опасаются за его здоровье."
    origin: "huelga «забастовка» + de hambre «голода». Дословно «забастовка голодом»."
    register: "Нейтральное, из новостей."
    synonyms: []
    analogs:
      - "hunger strike — голодовка"
      - "fast — пост, голодание"
    dialogue:
      - "Ana: ¿Cómo protestan los presos? | Как протестуют заключённые?"
      - "Pablo: Con una huelga de hambre. | Голодовкой."
      - "Ana: ¿Cuánto llevan sin comer? | Сколько они уже не едят?"
      - "Pablo: Cinco días. Ni siquiera aceptan un caldo. | Пять дней. Не соглашаются даже на бульон."
      - "Ana: ¡Qué desesperación! ¿Qué reclaman? | Какое отчаяние! Чего они требуют?"
      - "Pablo: Que los trasladen a otra cárcel y que mejoren las condiciones. | Чтобы их перевели в другую тюрьму и улучшили условия."
      - "Ana: ¿Y los médicos qué dicen? | А что говорят врачи?"
      - "Pablo: Que están débiles y puede haber consecuencias nefastas si siguen. | Что они слабы, и могут быть пагубные последствия, если продолжат."
    cefr: "B2."
    frequency: "Нечастое: в новостях."
    collocations:
      - "hacer huelga de hambre — голодать в знак протеста"
      - "empezar una huelga de hambre — начать голодовку"
      - "poner fin a la huelga de hambre — прекратить голодовку"
    collocation_example: "Los presos pusieron fin a la huelga de hambre. — Заключённые прекратили голодовку."
    trap: "Не путайте с ayunar «поститься по религиозным причинам»: huelga de hambre — это протест. Предлог de: huelga DE hambre."

  - word: aviso
    ru: уведомление, предупреждение
    ipa: /aˈβiso/
    say: аби́со
    pron: "v читается как b."
    meaning: "Сообщение о чём-то заранее: объявление, предупреждение, повестка. Часто на табличках."
    examples:
      - "Recibí un aviso de mi banco. — Я получил уведомление от банка."
      - "Dejó un aviso en la puerta para que todos supieran que no había agua. — Он оставил на двери объявление, чтобы все знали, что воды нет."
      - "El aviso de tormenta llegó al móvil a las seis, y todos los vecinos cerraron las ventanas. — Предупреждение о грозе пришло на телефон в шесть, и все соседи закрыли окна."
    origin: "Существительное от avisar «предупреждать». Родственное по смыслу: advertir «предостерегать»."
    register: "Нейтральное."
    synonyms:
      - word: notificación
        pair: ["Recibí un aviso del banco.", "Recibí una notificación del banco."]
        diff:
          - "notificación — официальное уведомление, и из приложения"
          - "aviso — короче, повседневнее; и объявление"
    analogs:
      - "notice — уведомление"
      - "warning — предупреждение"
    dialogue:
      - "Ana: ¿Qué dice el papel? | Что написано в бумаге?"
      - "Pablo: Es un aviso de corte de agua. | Это уведомление об отключении воды."
      - "Ana: ¿Cuándo? | Когда?"
      - "Pablo: Mañana de nueve a doce. Hay que llenar cubos, por si hace falta. | Завтра с девяти до двенадцати. Нужно набрать вёдра на случай необходимости."
      - "Ana: Qué fastidio, justo cuando tengo invitados. | Какая досада, как раз когда у меня гости."
      - "Pablo: Tienes para rato. Aprovecha para cocinar antes. | У тебя ещё есть время. Воспользуйся случаем и приготовь заранее."
      - "Ana: Buena idea. ¿Y por qué lo cortan? | Хорошая мысль. А почему отключают?"
      - "Pablo: Por una avería en la tubería. Dicen que es urgente. | Из-за аварии на трубе. Говорят, срочно."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "dar aviso — известить"
      - "un aviso importante — важное уведомление"
      - "hasta nuevo aviso — до нового уведомления"
      - "estar sobre aviso — быть начеку"
    collocation_example: "El museo estará cerrado hasta nuevo aviso. — Музей будет закрыт до нового уведомления."
    trap: "Aviso — существительное «уведомление», avisar — глагол «предупредить». Строгое предостережение об опасности — advertencia."

  - word: avisar
    ru: предупреждать, уведомлять
    ipa: /aβiˈsaɾ/
    say: абиса́р
    pron: "v читается как b; ударение на последнем слоге."
    meaning: "Сообщить заранее, чтобы человек был готов. Часто — «дать знать»."
    examples:
      - "Mi hermana me avisó de la fiesta. — Сестра предупредила меня о вечеринке."
      - "Avísame cuando llegues a casa, que me quedo preocupado hasta saber que estás bien. — Дай мне знать, когда доберёшься до дома, я переживаю, пока не узнаю, что с тобой всё в порядке."
      - "Me avisaron de la huelga ayer por la tarde y no pude cambiar mis planes de viaje. — Меня предупредили о забастовке вчера вечером, и я не смог изменить планы на поездку."
    origin: "Из старофранцузского aviser «наблюдать» (от лат. ad visum «на взгляд»). Родственные: aviso «предупреждение», visión «зрение»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: informar
        pair: ["Avisé al jefe.", "Informé al jefe."]
        diff:
          - "informar — подробно сообщить, дать сведения"
          - "avisar — коротко дать знать, чтобы кто-то успел подготовиться"
    analogs:
      - "to notify — уведомить"
      - "to let someone know — дать знать"
    dialogue:
      - "Ana: ¿Vienes a cenar? | Придёшь на ужин?"
      - "Pablo: Te aviso mañana. | Сообщу завтра."
      - "Ana: Vale, pero avísame pronto. Tengo que comprar. | Хорошо, но предупреди заранее. Мне нужно закупиться."
      - "Pablo: Prometido. Tengo que mirar la agenda y mi turno. | Обещаю. Мне нужно проверить ежедневник и смену."
      - "Ana: ¿Y si no puedes? | А если не сможешь?"
      - "Pablo: Entonces te aviso con tiempo, no como la última vez. | Тогда предупрежу заранее, а не как в прошлый раз."
      - "Ana: Sí, no me avisaste y me quedé esperando una hora. | Да, ты не предупредил, и я ждала целый час."
      - "Pablo: Lo sé, lo siento. Me arrepiento de aquello. | Знаю, прости. Я жалею об этом."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "avisar a alguien — известить кого-то"
      - "avisar de algo — предупредить о чём-то"
      - "avisar al médico — вызвать врача"
      - "avísame — дай мне знать"
    collocation_example: "Avisaron al médico en cuanto se sintió mal. — Врача вызвали, как только ему стало плохо."
    trap: "Перед человеком нужен a: avisar a mi madre. О чём предупредили — de: me avisó de que… Не путайте с advertir «предостеречь об опасности»."

  - word: sin previo aviso
    ru: без предупреждения
    ipa: /sin ˈpɾeβjo aˈβiso/
    say: син пре́бьо аби́со
    pron: "ie — один слог: pre-bio; v читается как b."
    meaning: "Без предварительного уведомления: внезапно, не предупредив заранее."
    examples:
      - "Se fueron sin previo aviso anoche. — Они уехали без предупреждения вчера вечером."
      - "No pueden despedirte sin previo aviso, tienes derecho a un mes de preaviso. — Тебя не могут уволить без предупреждения: у тебя есть право на месяц уведомления."
      - "Cerraron la tienda sin previo aviso, y los clientes se encontraron con la puerta cerrada. — Магазин закрыли без предупреждения, и покупатели нашли дверь запертой."
    origin: "sin «без» + previo «предварительный» (лат. previus «идущий впереди») + aviso «предупреждение». «Без предварительного предупреждения»."
    register: "Формальное, нейтральное; часто на табличках и в договорах."
    synonyms:
      - word: de repente
        pair: ["Se fue sin previo aviso.", "Se fue de repente."]
        diff:
          - "de repente — «внезапно», просто как неожиданность"
          - "sin previo aviso — «не предупредив» — подчёркивает, что человек не сказал заранее"
    analogs:
      - "without prior notice — без предварительного уведомления"
      - "without warning — без предупреждения"
    dialogue:
      - "Ana: ¿Sabías que venía? | Ты знала, что он приедет?"
      - "Pablo: No, apareció sin previo aviso. | Нет, он появился без предупреждения."
      - "Ana: ¡Qué cara más dura! ¿Y qué hiciste? | Какая наглость! И что ты сделал?"
      - "Pablo: Nada. Me quedé quieto, aturdido, sin saber qué decir. | Ничего. Замер, ошеломлённый, не зная, что сказать."
      - "Ana: ¿Venía a pedirte algo? | Он пришёл что-то просить?"
      - "Pablo: Dinero, seguro. Siempre aparece sin previo aviso cuando lo necesita. | Деньги, конечно. Он всегда появляется без предупреждения, когда они ему нужны."
      - "Ana: ¿Y se lo diste? | И ты дал?"
      - "Pablo: Ni siquiera le abrí la puerta. Me hice el despistado. | Даже дверь не открыл. Сделал вид, что не слышу."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "sin previo aviso — без предупреждения"
      - "con previo aviso — с предупреждением"
      - "previo pago — после оплаты"
    collocation_example: "Pueden cambiar el horario sin previo aviso. — Расписание могут изменить без предупреждения."
    trap: "Previo — прилагательное перед существительным: previo aviso, а не «aviso previo» (но так тоже бывает). Не путайте previo «предварительный» с previsto «предусмотренный»."

  - word: advertencia
    ru: предупреждение, предостережение
    ipa: /aðβeɾˈtenθja/
    say: адбэртэ́нсья
    pron: "dv — d мягкое [ð] и b: ad-ver-ten-cia; c перед i в Испании — [θ]."
    meaning: "Сообщение об опасности или о правилах: «осторожно», «так делать нельзя»."
    examples:
      - "Ignoró la advertencia del médico. — Он проигнорировал предупреждение врача."
      - "La policía lanzó una advertencia sobre falsos mensajes que piden los datos del banco. — Полиция выпустила предупреждение о фальшивых сообщениях, в которых просят банковские данные."
      - "Hay una advertencia en la caja de las pastillas sobre el peligro de tomarlas con alcohol. — На коробке с таблетками есть предостережение об опасности их приёма с алкоголем."
    origin: "От advertir «предостерегать» (лат. advertere «обращать внимание»: ad- «к» + vertere «поворачивать»). Родственные: advertido «предупреждённый»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: aviso
        pair: ["Hizo una advertencia.", "Hizo un aviso."]
        diff:
          - "aviso — любое сообщение, нейтральное: «знайте»"
          - "advertencia — предостережение об опасности, строже"
    analogs:
      - "warning — предупреждение"
      - "caution — предостережение"
    dialogue:
      - "Ana: ¿Leíste la advertencia? | Ты прочитал предупреждение?"
      - "Pablo: Sí, dice que no lo mezcle con alcohol. | Да, там сказано, что нельзя смешивать с алкоголем."
      - "Ana: ¿Y alguna más? | А ещё какие-нибудь?"
      - "Pablo: Que no conduzca después de tomarlo y que lo guarde fuera del alcance de los niños. | Что нельзя садиться за руль после приёма и надо хранить вне досягаемости детей."
      - "Ana: Qué razonable. Mucha gente ignora la advertencia. | Разумно. Многие игнорируют предупреждения."
      - "Pablo: Y luego hay consecuencias nefastas. Mi tío ignoró la advertencia del médico. | А потом бывают пагубные последствия. Мой дядя проигнорировал предупреждение врача."
      - "Ana: ¿Y qué le pasó? | И что с ним случилось?"
      - "Pablo: Un derrame cerebral. Hoy está convaleciente. | Инсульт. Сейчас выздоравливает."
    cefr: "B2."
    frequency: "Частое на упаковках и в новостях."
    collocations:
      - "hacer una advertencia — сделать предупреждение"
      - "una advertencia seria — серьёзное предостережение"
      - "pese a la advertencia — несмотря на предупреждение"
    collocation_example: "El profesor hizo una advertencia a los alumnos. — Учитель сделал ученикам предупреждение."
    trap: "Advertencia — «предостережение об опасности», а aviso — просто «уведомление». Глагол — advertir «предупредить; заметить»."

  - word: por ahí
    ru: где-то там, там (в той стороне)
    ipa: /poɾ aˈi/
    say: пор аи́
    pron: "Читается слитно: «пора́и». Ударение на i: ahí — «аи́»."
    meaning: "Неопределённо: где-то там, в той стороне, поблизости. Ещё — «примерно»: por ahí cerca de las diez."
    examples:
      - "Debe de andar por ahí cerca. — Он, должно быть, где-то неподалёку."
      - "Las llaves deben de estar por ahí, en algún cajón del salón. — Ключи должны быть где-то там, в каком-нибудь ящике в гостиной."
      - "Salió por ahí a dar una vuelta con los amigos y todavía no ha vuelto a casa. — Он пошёл куда-то погулять с друзьями и до сих пор не вернулся домой."
    origin: "por «по, через» + ahí «там» (a- + hi из лат. ibi «там»). «Через там»: где-то поблизости."
    register: "Разговорное."
    synonyms:
      - word: por allí
        pair: ["Está por ahí.", "Está por allí."]
        diff:
          - "por allí — «там, подальше», дальше от говорящего"
          - "por ahí — «там, неподалёку», ближе к собеседнику"
    analogs:
      - "around there — где-то там"
      - "somewhere over there — вон там где-то"
    dialogue:
      - "Ana: ¿Dónde está mi bolso? | Где моя сумка?"
      - "Pablo: Por ahí, junto a la puerta. | Где-то там, у двери."
      - "Ana: ¿Por ahí dónde? No lo veo. | Это где? Я не вижу."
      - "Pablo: Debajo del abrigo, creo. O quizá lo dejaste por ahí, en el rellano. | Под пальто, кажется. А может, ты оставила его где-то там, на площадке."
      - "Ana: Qué despiste. ¿Me ayudas a buscarlo? | Какая рассеянность. Поможешь поискать?"
      - "Pablo: Claro. Voy a mirar por ahí, junto a las escaleras. | Конечно. Посмотрю там, у лестницы."
      - "Ana: ¡Aquí está! Estaba en el sillón, sumido entre cojines. | Вот он! Лежал в кресле, утонув в подушках."
      - "Pablo: ¿Ves? Siempre lo pierdes y siempre aparece. | Видишь? Ты вечно его теряешь, и он вечно находится."
    cefr: "A2."
    frequency: "Очень частое в разговоре."
    collocations:
      - "por ahí — где-то там"
      - "irse por ahí — уйти погулять"
      - "o por ahí — или около того"
      - "andar por ahí — бродить где-то"
    collocation_example: "No sé dónde está, andará por ahí. — Не знаю, где он, наверное, где-то ходит."
    trap: "Не путайте ahí «там, рядом» с hay «есть» и ay «ой!»: звучат почти одинаково. Ударение на i: ahí."
