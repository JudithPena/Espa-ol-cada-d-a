# Первый список Гали (16 слов).
lang: es
words:
  - word: a favor de
    image: art/galya/a_favor_de.png
    ru: за, в пользу
    ipa: /a faˈβoɾ ðe/
    say: а фаво́р дэ
    pron: "b в favor и d в de между гласными звучат мягко."
    meaning: "Предлог-оборот: «за что-то, в поддержку чего-то»; ещё «в пользу кого-то»."
    examples:
      - "Votaron a favor de ella. — Они проголосовали за неё."
      - "El árbitro pitó a favor de nuestro equipo en el último minuto del partido. — Судья свистнул в пользу нашей команды на последней минуте матча."
      - "La mayoría de los vecinos votó a favor de construir un parque en el solar vacío. — Большинство соседей проголосовало за то, чтобы построить парк на пустом участке."
    origin: "Favor от лат. favor «благосклонность» (favere «благоволить»). Родственные: favorito, favorecer «благоприятствовать»."
    register: "Нейтральное, для споров, голосований и новостей."
    synonyms:
      - word: en favor de
        pair: ["Estoy a favor de la reforma.", "Estoy en favor de la reforma."]
        diff:
          - "en favor de — то же самое, чуть книжнее, чаще «в пользу»"
          - "a favor de — обычное в речи, особенно «быть за»"
    analogs:
      - "in favor of — то же значение; to be for — «быть за»"
    dialogue:
      - "Ana: ¿Estás a favor de la nueva ley? | Ты за новый закон?"
      - "Luis: Sí, a favor de todo lo que ayude a los vecinos. | Да, за всё, что помогает соседям."
      - "Ana: Yo no lo tengo tan claro. Dicen que cuesta mucho dinero. | Я не так уверена. Говорят, что он стоит больших денег."
      - "Luis: Es verdad, pero votaron a favor de ella casi todos los concejales. | Это правда, но за него проголосовали почти все советники."
      - "Ana: ¿Y qué opinan en el barrio? | А что думают в районе?"
      - "Luis: La mayoría está a favor, aunque hay quien está en contra por miedo a los impuestos. | Большинство за, хотя есть и те, кто против из страха перед налогами."
      - "Ana: Entonces habrá que informarse mejor antes de decidir. | Значит, нужно лучше разобраться, прежде чем решать."
      - "Luis: Buena idea. Yo te paso el informe, que es corto. | Хорошая мысль. Я пришлю тебе доклад, он короткий."
    cefr: "B1."
    frequency: "Частое в новостях и обсуждениях."
    collocations:
      - "estar a favor de algo — быть за что-то"
      - "votar a favor — голосовать «за»"
      - "a favor y en contra — за и против"
      - "a su favor — в его пользу"
    collocation_example: "Hay argumentos a favor y en contra. — Есть доводы за и против."
    trap: "Противоположное — en contra de. Не говорите «por favor de»: por favor — это «пожалуйста»."

  - word: albañil
    image: art/galya/albanil.png
    ru: каменщик, строитель
    ipa: /alβaˈɲil/
    say: альбаньи́ль
    pron: "ñ читается как русское «нь»; b между гласными мягкое."
    meaning: "Рабочий, который кладёт стены, штукатурит и занимается стройкой дома."
    examples:
      - "Los albañiles empiezan a las siete. — Строители начинают в семь."
      - "Necesitamos un albañil que sepa arreglar la humedad del sótano antes del invierno. — Нам нужен каменщик, который умеет справляться с сыростью в подвале до зимы."
      - "Mi abuelo trabajó de albañil toda su vida y construyó con sus propias manos la casa del pueblo. — Мой дед всю жизнь проработал каменщиком и своими руками построил дом в деревне."
    origin: "От арабск. al-bannāʼ «строитель» (artículo al- слился со словом, как в almohada, azúcar). Однокоренное: albañilería «каменная кладка»."
    register: "Нейтральное."
    synonyms:
      - word: obrero
        pair: ["Es albañil.", "Es obrero de la construcción."]
        diff:
          - "obrero — любой рабочий, шире"
          - "albañil — именно тот, кто кладёт кирпич и штукатурит"
    analogs:
      - "bricklayer, mason — каменщик; builder — более общее «строитель»"
    dialogue:
      - "Ana: ¿Quién hizo esta pared? | Кто сделал эту стену?"
      - "Pablo: Un albañil muy bueno de mi barrio. | Очень хороший каменщик из нашего района."
      - "Ana: Está perfecta. ¿Cuánto tardó? | Она идеальна. Сколько он делал?"
      - "Pablo: Una semana. Los albañiles empiezan a las siete y no paran hasta la tarde. | Неделю. Каменщики начинают в семь и не останавливаются до вечера."
      - "Ana: ¡Qué trabajo tan duro! | Какая тяжёлая работа!"
      - "Pablo: Sí, pero este es muy modesto y nunca se queja. Le pagué y casi no quiso aceptar el dinero. | Да, но этот очень скромный и никогда не жалуется. Я заплатил, а он почти не хотел брать деньги."
      - "Ana: Pásame su teléfono. Necesito arreglar una pared en casa. | Дай мне его телефон. Мне нужно починить стену дома."
      - "Pablo: Claro. Dile que vas de mi parte y te hará un buen precio. | Конечно. Скажи, что ты от меня, и он сделает хорошую цену."
    cefr: "B1."
    frequency: "Частое в быту."
    collocations:
      - "trabajar de albañil — работать каменщиком"
      - "maestro albañil — мастер-каменщик"
      - "ayudante de albañil — подсобный рабочий"
    collocation_example: "Trabajó de albañil durante diez años. — Он десять лет работал каменщиком."
    trap: "Пишется с ñ, а на конце одна l: albañil. Слово для мужчины и женщины одно: el/la albañil (форму la albañila тоже встретите)."

  - word: atropellar
    image: art/galya/atropellar.png
    ru: сбить, переехать
    ipa: /atɾopeˈʎaɾ/
    say: атропэйя́р
    pron: "ll — [ʎ], в большинстве стран (и в речи многих испанцев) как «й»: атропэйя́р."
    meaning: "Сбить или переехать машиной человека или животное. В переносном смысле — грубо нарушить права, мнение человека."
    examples:
      - "Un coche atropelló a un ciclista. — Машина сбила велосипедиста."
      - "Esa ley atropella los derechos de los trabajadores más humildes del país. — Этот закон попирает права самых простых работников страны."
      - "Por suerte, el conductor frenó a tiempo y no llegó a atropellar al niño que corría tras la pelota. — К счастью, водитель вовремя затормозил и не сбил мальчика, который бежал за мячом."
    origin: "От a- + tropel «давка, топот толпы» + -ar: сначала «затоптать». Родственные: atropello «наезд; произвол», tropel «толпа»."
    register: "Нейтральное; в новостях о происшествиях."
    synonyms:
      - word: arrollar
        pair: ["El camión atropelló al perro.", "El camión arrolló al perro."]
        diff:
          - "arrollar — «смять, сбить с силой», чаще о сильном ударе или в переносном «разгромить»"
          - "atropellar — обычное слово для «сбить машиной»"
    analogs:
      - "to run over — переехать, to knock down — сбить; to trample — затоптать, попирать"
    dialogue:
      - "Ayer por la tarde, un coche atropelló a un ciclista en el cruce de mi calle. | Вчера вечером машина сбила велосипедиста на перекрёстке моей улицы."
      - "Yo lo vi todo desde el balcón y bajé corriendo. | Я всё видел с балкона и сбежал вниз."
      - "El ciclista estaba en el suelo, aturdido, pero consciente. | Велосипедист лежал на земле, ошеломлённый, но в сознании."
      - "El conductor, muy nervioso, repetía que no lo había visto. | Водитель, очень нервничая, повторял, что не заметил его."
      - "Llamamos a una ambulancia y esperamos a su lado hasta que llegó. | Мы вызвали скорую и ждали рядом, пока она не приехала."
      - "Por suerte, solo tenía un brazo roto y algunos rasguños. | К счастью, у него была только сломана рука и несколько царапин."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "ser atropellado por un coche — попасть под машину"
      - "atropellar los derechos — попирать права"
      - "atropellar a un peatón — сбить пешехода"
    collocation_example: "Fue atropellado por una moto al cruzar la calle. — Его сбил мотоцикл, когда он переходил улицу."
    trap: "Атропельяр — именно «наехать», не «обогнать» и не «толкнуть». Существительное: un atropello — «наезд» и «произвол»."

  - word: contemporáneo
    image: art/galya/contemporaneo.png
    ru: современный, нынешний
    ipa: /kontempoˈɾaneo/
    say: контэмпора́нэо
    meaning: "Относящийся к нашему времени или к тому же времени, что и другой человек или событие: «современный», «одновременный»."
    examples:
      - "Fue un pintor contemporáneo muy famoso. — Это был очень известный современный художник."
      - "Cervantes fue contemporáneo de Shakespeare, aunque nunca se conocieron personalmente. — Сервантес был современником Шекспира, хотя они никогда не встречались лично."
      - "Los problemas de la sociedad contemporánea, como la soledad o el estrés, preocupan cada vez más a los médicos. — Проблемы современного общества, такие как одиночество или стресс, всё больше беспокоят врачей."
    origin: "Лат. contemporaneus: con- «вместе» + tempus, temporis «время» + -áneo. Родственные: tiempo, temporal, temporada, extemporáneo."
    register: "Нейтральное, книжное; частое в искусстве, истории, журналистике."
    synonyms:
      - word: actual
        pair: ["La sociedad contemporánea cambia rápido.", "La sociedad actual cambia rápido."]
        diff:
          - "actual — «нынешний, сегодняшний», обиходнее"
          - "contemporáneo — «современный» и «современник кого-то»"
    analogs:
      - "contemporary — современный и современник; modern — «модерновый, новый»"
    dialogue:
      - "Ana: ¿Te gusta el arte contemporáneo? | Тебе нравится современное искусство?"
      - "Pablo: Mucho. Fue un pintor contemporáneo quien me enseñó a mirar los cuadros. | Очень. Именно современный художник научил меня смотреть на картины."
      - "Ana: ¿Quién? | Кто?"
      - "Pablo: Un señor que vivía en mi calle. Era muy famoso, pero seguía siendo modesto. | Один сеньор, жил на моей улице. Был очень известным, но оставался скромным."
      - "Ana: Yo prefiero lo clásico. El arte contemporáneo a veces no lo entiendo. | Я предпочитаю классику. Современное искусство я иногда не понимаю."
      - "Pablo: Pues ve al museo con otra mirada. No hay que entenderlo todo, basta con sentirlo. | Тогда сходи в музей с другим взглядом. Не нужно понимать всё, достаточно чувствовать."
      - "Ana: Vale, el domingo me animo. ¿Vienes? | Хорошо, в воскресенье попробую. Идёшь?"
      - "Pablo: Por supuesto. Y después tomamos algo. | Конечно. А потом чего-нибудь выпьем."
    cefr: "B2."
    frequency: "Частое в культуре и новостях."
    collocations:
      - "arte contemporáneo — современное искусство"
      - "historia contemporánea — новейшая история"
      - "ser contemporáneo de alguien — быть чьим-то современником"
    collocation_example: "Galdós fue contemporáneo de Clarín. — Гальдос был современником Кларина."
    trap: "Contemporáneo — не «временный». «Временный» — temporal. Также помните ударение: contemporáneo, на предпоследнем слоге."

  - word: desempeñar
    image: art/galya/desempenar.png
    ru: выполнять (роль, должность, обязанности)
    ipa: /desempeˈɲaɾ/
    say: дэсэмпэнья́р
    pron: "ñ — «нь»."
    meaning: "Исполнять должность, функцию, роль в фильме или обязанности. Старое значение: «выкупить заложенную вещь»."
    examples:
      - "La actriz desempeña el papel principal. — Актриса исполняет главную роль."
      - "Cada miembro del equipo debe desempeñar su función con responsabilidad en el proyecto. — Каждый член команды должен ответственно выполнять свою функцию в проекте."
      - "El actor desempeñó el papel del rey con tanta naturalidad que el público olvidó que era una obra de teatro. — Актёр сыграл роль короля так естественно, что зрители забыли, что это спектакль."
    origin: "Des- «снять» + empeñar «заложить» (empeño «залог»): сначала «вернуть заложенное», потом «выполнить обязательство». Родственные: empeñarse «упорствовать», empeño «старание»."
    register: "Формальное, деловое."
    synonyms:
      - word: ejercer
        pair: ["Desempeña su profesión con orgullo.", "Ejerce su profesión con orgullo."]
        diff:
          - "ejercer — «заниматься профессией» (врач, юрист)"
          - "desempeñar — «выполнять функцию, должность, роль»"
    analogs:
      - "to perform — исполнять; to hold (a post) — занимать (должность); to carry out — выполнять"
    dialogue:
      - "Ana: ¿Qué función desempeñas en la empresa? | Какую функцию ты выполняешь в компании?"
      - "Luis: Soy responsable de compras. Desempeño ese cargo desde hace tres años. | Я отвечаю за закупки. Занимаю эту должность уже три года."
      - "Ana: ¿Y te gusta? | И тебе нравится?"
      - "Luis: Mucho. Aunque desempeñar un cargo así exige paciencia y buena memoria. | Очень. Хотя выполнять такую работу — значит иметь терпение и хорошую память."
      - "Ana: ¿Y tu compañera, qué papel desempeña? | А твоя коллега, какую роль она играет?"
      - "Luis: Es la directora financiera. Desempeña el papel más importante del equipo. | Финансовый директор. Она играет самую важную роль в команде."
      - "Ana: Entonces os llevaréis bien. | Значит, вы хорошо ладите."
      - "Luis: Perfectamente. Cada uno desempeña lo suyo y nos respetamos. | Прекрасно. Каждый занимается своим, и мы уважаем друг друга."
    cefr: "B2."
    frequency: "Частое в деловой речи."
    collocations:
      - "desempeñar un cargo — занимать должность"
      - "desempeñar un papel — играть роль"
      - "desempeñar una función — выполнять функцию"
      - "desempeñar un trabajo — выполнять работу"
    collocation_example: "El Estado desempeña un papel importante en la economía. — Государство играет важную роль в экономике."
    trap: "Не путайте с empeñar «закладывать» и empeñarse «настаивать, упорно добиваться». Пишется с ñ."

  - word: desgracia
    image: art/galya/desgracia.png
    ru: несчастье, беда
    ipa: /dezˈɣɾaθja/
    say: дэсгра́сия
    pron: "s перед g звучит как [z]; c перед i — [θ] в Испании, в Америке — «с»."
    meaning: "Беда, неудача, несчастный случай. Ещё — потеря расположения («caer en desgracia» — впасть в немилость)."
    examples:
      - "Por desgracia, no pude ir. — К несчастью, я не смог пойти."
      - "La familia sufrió una gran desgracia cuando perdió la casa en el incendio. — Семью постигло большое несчастье, когда она потеряла дом при пожаре."
      - "Por desgracia, el vuelo se canceló por la tormenta y tuvimos que pasar la noche en el aeropuerto. — К несчастью, рейс отменили из-за грозы, и нам пришлось провести ночь в аэропорту."
    origin: "Des- «не» + gracia «милость, благодать»: «отсутствие милости судьбы». Родственные: desgraciado «несчастный», gracias, gracioso."
    register: "Нейтральное; «por desgracia» часто в речи."
    synonyms:
      - word: infortunio
        pair: ["Sufrió una desgracia.", "Sufrió un infortunio."]
        diff:
          - "infortunio — книжное, «злой рок»"
          - "desgracia — обычное слово для беды"
    analogs:
      - "misfortune — несчастье; unfortunately = por desgracia"
    dialogue:
      - "Ana: ¿Has oído lo de Marta? | Ты слышал про Марту?"
      - "Pablo: No, ¿qué le ha pasado? | Нет, что с ней случилось?"
      - "Ana: Una desgracia. Se le ha incendiado la cocina. | Несчастье. У неё загорелась кухня."
      - "Pablo: ¡Qué horror! ¿Está bien? | Какой ужас! Она в порядке?"
      - "Ana: Sí, por suerte salió ilesa, pero lo ha perdido casi todo. | Да, к счастью, цела, но потеряла почти всё."
      - "Pablo: Qué desgracia. Habrá que ayudarla. | Какое несчастье. Нужно ей помочь."
      - "Ana: Estamos organizando una colecta entre los vecinos. | Мы организуем сбор среди соседей."
      - "Pablo: Cuenta conmigo. Por desgracia, estas cosas pasan, y hay que estar unidos. | Рассчитывай на меня. К сожалению, такое случается, и нужно быть вместе."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "por desgracia — к несчастью"
      - "caer en desgracia — впасть в немилость"
      - "tener la desgracia de… — иметь несчастье…"
      - "una desgracia nunca viene sola — беда не приходит одна"
    collocation_example: "Las desgracias nunca vienen solas. — Беда не приходит одна."
    trap: "Desgracia — не «грация» и не «изящество». Desgraciadamente = к сожалению. Не путайте: gracia — «изящество, шутка»."

  - word: enterarse
    image: art/galya/enterarse.png
    ru: узнать, выяснить, быть в курсе
    ipa: /enteˈɾaɾse/
    say: энтэра́рсэ
    meaning: "Узнать новость, получить информацию. Обычно «enterarse de algo»: «узнать о чём-то»."
    examples:
      - "¿Te has enterado de la noticia? — Ты слышал эту новость?"
      - "Si quieres enterarte de los horarios, lo mejor es consultar la página web. — Если хочешь узнать расписание, лучше всего посмотреть на сайте."
      - "Me enteré de la noticia por casualidad, cuando leí el mensaje que mi hermana había dejado en el grupo. — Я узнал эту новость случайно, когда прочитал сообщение, которое сестра оставила в группе."
    origin: "От enterar «ввести в курс», а то от entero «целый, полный» (лат. integer): рассказать «полностью». Родственные: entero, entereza «стойкость»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: saber
        pair: ["Me enteré de que se fue.", "Supe que se fue."]
        diff:
          - "saber в претерите (supe) — «узнал»; нейтральнее"
          - "enterarse — акцент на том, как новость дошла до вас"
    analogs:
      - "to find out — выяснить; to hear about — услышать о чём-то"
    dialogue:
      - "Ana: ¿Cómo te enteraste de la fiesta? | Как ты узнал о вечеринке?"
      - "Luis: Me lo contó un compañero. ¿Te has enterado de lo de la sorpresa? | Мне рассказал коллега. А ты слышала про сюрприз?"
      - "Ana: No, ¿qué sorpresa? | Нет, какой сюрприз?"
      - "Luis: Van a regalarle un viaje a Marta. Me enteré ayer por casualidad. | Марте подарят поездку. Я узнал вчера случайно."
      - "Ana: Qué detalle. ¿Y quién más se ha enterado? | Какая забота. А кто ещё узнал?"
      - "Luis: Solo cuatro personas. Si se entera ella, se acaba la sorpresa. | Только четыре человека. Если она узнает, сюрприз пропадёт."
      - "Ana: Pues no digas nada. Yo seré una tumba. | Тогда ничего не говори. Я буду нема как могила."
      - "Luis: Gracias. Y avísame si te enteras de algo más. | Спасибо. И сообщи мне, если узнаешь что-то ещё."
    cefr: "B1."
    frequency: "Очень частое в быту."
    collocations:
      - "enterarse de algo — узнать о чём-то"
      - "enterarse de que… — узнать, что…"
      - "¡Entérate! — разузнай!"
      - "para que te enteres — чтобы ты знал"
    collocation_example: "No me enteré de nada. — Я ничего не узнал / ничего не понял."
    trap: "Всегда с предлогом de: enterarse de algo. Без de — разговорная ошибка. Не путайте с entender «понимать»."

  - word: exilio
    image: art/galya/exilio.png
    ru: изгнание, эмиграция
    ipa: /ekˈsiljo/
    say: экси́льо
    pron: "x между гласными читается как [ks]; в exilio ударение на втором слоге."
    meaning: "Вынужденная жизнь вдали от родины по политическим причинам; также само место изгнания."
    examples:
      - "Vivió muchos años en el exilio. — Он много лет прожил в изгнании."
      - "Miles de familias tuvieron que marcharse al exilio cuando cambió el gobierno del país. — Тысячам семей пришлось уехать в изгнание, когда в стране сменилась власть."
      - "Después de la guerra, el poeta pasó veinte años en el exilio y escribió allí sus mejores versos. — После войны поэт провёл двадцать лет в изгнании и написал там свои лучшие стихи."
    origin: "Лат. exilium (от exsul «изгнанник»): ex- «вне» + solum «почва, земля». Родственные: exiliado «изгнанник», exiliar «отправить в изгнание»."
    register: "Нейтральное, книжное; история и политика."
    synonyms:
      - word: destierro
        pair: ["Lo condenaron al exilio.", "Lo condenaron al destierro."]
        diff:
          - "destierro — «ссылка, высылка», чуть торжественнее и старее"
          - "exilio — обычное слово, в том числе добровольное"
    analogs:
      - "exile — изгнание; banishment — высылка"
    dialogue:
      - "Ana: ¿Dónde pasó el escritor sus últimos años? | Где писатель провёл последние годы?"
      - "Pablo: En el exilio, lejos de su país. | В изгнании, вдали от своей страны."
      - "Ana: ¿Por qué se fue? | Почему он уехал?"
      - "Pablo: Tuvo que marcharse tras la guerra. Vivió muchos años en el exilio, echando de menos su tierra. | Ему пришлось уехать после войны. Он много лет прожил в изгнании, скучая по родине."
      - "Ana: Qué triste. ¿Y volvió alguna vez? | Как грустно. И он когда-нибудь вернулся?"
      - "Pablo: Solo de visita, ya mayor. Casi nadie lo reconoció, y se sintió extranjero en su propia casa. | Только в гости, уже старым. Его почти никто не узнал, и он чувствовал себя чужим в собственном доме."
      - "Ana: Ese es el peor exilio. | Это худшее изгнание."
      - "Pablo: Sí. Escribió muchos libros sobre la existencia y la memoria. | Да. Он написал много книг о существовании и памяти."
    cefr: "B2."
    frequency: "Среднее; частое в истории и новостях."
    collocations:
      - "vivir en el exilio — жить в изгнании"
      - "ir al exilio — уехать в изгнание"
      - "gobierno en el exilio — правительство в изгнании"
      - "exilio político — политическое изгнание"
    collocation_example: "Muchos artistas vivieron en el exilio. — Многие артисты жили в изгнании."
    trap: "Exilio — не «эмиграция по работе»: это вынужденный отъезд. Для обычного отъезда — emigrar. Человек: exiliado."

  - word: existencia
    image: art/galya/existencia.png
    ru: существование, бытие
    ipa: /eksisˈtenθja/
    say: эксистэ́нсия
    pron: "x между гласными [ks]; c перед i — [θ] в Испании, «с» в Америке."
    meaning: "То, что есть, существует; жизнь человека. Во множественном числе — «запасы товара» (existencias)."
    examples:
      - "No sabíamos de su existencia. — Мы не знали о его существовании."
      - "Esta semana no hay existencias de ese modelo, pero llegarán más el lunes. — На этой неделе этой модели нет в наличии, но в понедельник привезут ещё."
      - "Llevó una existencia tranquila en una casa junto al mar, lejos del ruido de la ciudad. — Он вёл спокойную жизнь в доме у моря, вдали от городского шума."
    origin: "Лат. existentia от exsistere «выходить, возникать»: ex- «из» + sistere «ставить». Родственные: existir, existente, resistir, consistir."
    register: "Нейтральное, книжное."
    synonyms:
      - word: vida
        pair: ["Llevó una existencia solitaria.", "Llevó una vida solitaria."]
        diff:
          - "vida — просто «жизнь», обиходнее"
          - "existencia — «бытие, способ жить», чуть более философское"
    analogs:
      - "existence — существование; stock — запасы (existencias)"
    dialogue:
      - "Ana: ¿Todavía tenéis ese modelo? | У вас ещё есть эта модель?"
      - "Pablo: Depende. Voy a mirar las existencias del almacén. | Зависит. Посмотрю остатки на складе."
      - "Ana: ¿Cómo que las existencias? | Что значит «остатки»?"
      - "Pablo: Lo que queda en venta. Hay modelos agotados y otros en existencia. | То, что осталось в продаже. Есть распроданные модели и те, что есть в наличии."
      - "Ana: Entiendo. Y el mío, ¿está en existencia? | Понимаю. А моя модель есть в наличии?"
      - "Pablo: Sí, quedan dos. Yo ni siquiera sabía de su existencia, hasta que llegó el pedido. | Да, осталось две. Я даже не знал о её существовании, пока не пришёл заказ."
      - "Ana: Pues resérvame una, por favor. | Тогда оставь мне одну, пожалуйста."
      - "Pablo: Hecho. Pásate mañana a eso de las diez. | Договорились. Заходи завтра около десяти."
    cefr: "B2."
    frequency: "Среднее; чаще в тексте, чем в живой речи."
    collocations:
      - "negar la existencia — отрицать существование"
      - "en existencia — в наличии"
      - "amargar la existencia — отравлять жизнь"
      - "existencias en almacén — товар на складе"
    collocation_example: "Hay que comprobar las existencias del almacén. — Надо проверить запасы на складе."
    trap: "В единственном числе — «существование», во множественном — «запасы»: existencias. Не путайте с existir «существовать» (глагол) и exigencia «требование»."

  - word: generación
    image: art/galya/generacion.png
    ru: поколение
    ipa: /xeneɾaˈθjon/
    say: хенерасьо́н
    pron: "g перед e звучит как русское «х»; c перед i — [θ] в Испании, в Америке — «с»; ударение на последнем слоге."
    meaning: "Группа людей примерно одного возраста, выросших в одно время; ещё — «порождение», создание; а также «поколение техники»."
    examples:
      - "Es la nueva generación de móviles. — Это новое поколение телефонов."
      - "En esta casa viven tres generaciones: los abuelos, mis padres y nosotros, los hijos. — В этом доме живут три поколения: бабушка с дедушкой, мои родители и мы, дети."
      - "Mi generación creció sin teléfonos móviles y todavía recuerda cuando se jugaba en la calle. — Моё поколение выросло без мобильных телефонов и ещё помнит, как играли на улице."
    origin: "Лат. generatio от generare «порождать» (genus «род»). Родственные: general, género, generoso, generar."
    register: "Нейтральное."
    synonyms:
      - word: promoción
        pair: ["Somos de la misma generación.", "Somos de la misma promoción."]
        diff:
          - "promoción — выпуск (школы, вуза)"
          - "generación — все люди примерно одного возраста"
    analogs:
      - "generation — то же самое, включая «generation of phones»"
    dialogue:
      - "Ana: ¿Qué piensan los jóvenes de esta generación? | Что думают молодые этого поколения?"
      - "Luis: Piensan distinto. Es la generación que ha crecido con el móvil en la mano. | Думают иначе. Это поколение выросло с телефоном в руке."
      - "Ana: ¿Y eso es malo? | И это плохо?"
      - "Luis: No necesariamente. Tienen más información que nunca, aunque a veces les falta paciencia. | Не обязательно. У них больше информации, чем когда-либо, хотя иногда им не хватает терпения."
      - "Ana: Mi abuela dice que su generación era más trabajadora. | Моя бабушка говорит, что её поколение было трудолюбивее."
      - "Luis: Cada generación piensa que la anterior era mejor. Es la nueva generación quien tiene que demostrar su valor. | Каждое поколение считает предыдущее лучше. Новое поколение должно само доказать свою ценность."
      - "Ana: Tienes razón. Y la nuestra, ¿qué papel desempeña? | Ты прав. А наше, какую роль оно играет?"
      - "Luis: Somos el puente entre las dos. | Мы — мост между ними."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "nueva generación — новое поколение"
      - "generación del 98 — поколение 98 года (испанские писатели)"
      - "brecha generacional — разрыв поколений"
      - "de generación en generación — из поколения в поколение"
    collocation_example: "La tradición pasa de generación en generación. — Традиция передаётся из поколения в поколение."
    trap: "Ударение на последнем слоге: generación. Не путайте с generosidad «щедрость» и género «род, жанр»."

  - word: miembro
    image: art/galya/miembro.png
    ru: член (организации); конечность
    ipa: /ˈmjembɾo/
    say: мье́мбро
    meaning: "Участник группы, организации, семьи. Также часть тела: рука или нога (los miembros)."
    examples:
      - "Es miembro del club desde hace años. — Он уже несколько лет член клуба."
      - "España es miembro de la Unión Europea desde mil novecientos ochenta y seis. — Испания – член Европейского союза с 1986 года."
      - "Todos los miembros de la familia se juntaron en casa de mis abuelos para celebrar su aniversario. — Все члены семьи собрались у моих бабушки и дедушки отпраздновать их годовщину."
    origin: "Лат. membrum «член, часть тела». Гласная ударного слога удвоилась: mem- → miem- (как в tiempo). Родственные: membresía «членство», miembros."
    register: "Нейтральное."
    synonyms:
      - word: socio
        pair: ["Es miembro del club.", "Es socio del club."]
        diff:
          - "socio — тот, кто платит взнос, партнёр по бизнесу"
          - "miembro — любой участник, не обязательно платит"
    analogs:
      - "member — член организации; limb — конечность"
    dialogue:
      - "Ana: ¿Eres miembro del partido? | Ты член партии?"
      - "Pablo: No, soy miembro del club de lectura desde hace años. | Нет, я уже много лет член читательского клуба."
      - "Ana: ¿Y qué hacéis? | И что вы делаете?"
      - "Pablo: Leemos un libro al mes y lo comentamos. Somos doce miembros, y cada uno propone una obra. | Читаем книгу в месяц и обсуждаем. Нас двенадцать членов, и каждый предлагает произведение."
      - "Ana: ¿Puedo apuntarme? | Можно мне записаться?"
      - "Pablo: Claro. Solo hay que ser miembro y pagar una pequeña cuota. | Конечно. Нужно только стать членом и заплатить небольшой взнос."
      - "Ana: ¿Cuándo es la próxima reunión? | Когда следующая встреча?"
      - "Pablo: El jueves. Te presento al resto de los miembros. | В четверг. Я представлю тебя остальным членам."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "miembro de la familia — член семьи"
      - "país miembro — страна-участник"
      - "ser miembro de — быть членом"
      - "miembros del jurado — члены жюри"
    collocation_example: "España es un país miembro de la Unión Europea. — Испания — страна-член Европейского союза."
    trap: "Перед b всегда m, не n: miembro, а не «mienbro». Слово мужского рода и для женщины: ella es un miembro del club (иногда говорят la miembro)."

  - word: modesto
    image: art/galya/modesto.png
    ru: скромный
    ipa: /moˈðesto/
    say: модэ́сто
    pron: "d между гласными мягкое [ð]."
    meaning: "Не хвастающийся, простой; также «небольшой, небогатый» (о доме, заработке)."
    examples:
      - "Es un hombre muy modesto. — Он очень скромный человек."
      - "Con un sueldo modesto no es fácil ahorrar para un piso. — С небольшой зарплатой нелегко накопить на квартиру."
      - "Crecieron en una casa modesta, pero sus padres siempre se las arreglaron para que no les faltara nada. — Они выросли в скромном доме, но родители всегда находили способ, чтобы им ни в чём не было недостатка."
    origin: "Лат. modestus «умеренный, сдержанный» от modus «мера». Родственные: moderado, modo, modelo, modestia «скромность»."
    register: "Нейтральное."
    synonyms:
      - word: humilde
        pair: ["Viene de una familia modesta.", "Viene de una familia humilde."]
        diff:
          - "humilde — «смиренный» или «бедный», сильнее"
          - "modesto — «скромный, без претензий»"
    analogs:
      - "modest — скромный; humble — смиренный, скромного происхождения"
    dialogue:
      - "Mi vecino Antonio ganó el premio de pintura de la ciudad. | Мой сосед Антонио выиграл городскую премию по живописи."
      - "Pero sigue siendo un hombre muy modesto. | Но остаётся очень скромным человеком."
      - "Va a comprar el pan con la misma ropa de siempre y saluda a todos. | Он ходит за хлебом в той же одежде и здоровается со всеми."
      - "Cuando alguien le felicita, sonríe y cambia de tema. | Когда кто-то его поздравляет, он улыбается и меняет тему."
      - "Dice que lo importante no es el premio, sino seguir trabajando. | Говорит, что главное не премия, а продолжать работать."
      - "Por eso todo el barrio lo quiere y lo admira. | Поэтому весь район его любит и восхищается им."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ser modesto — быть скромным"
      - "un sueldo modesto — скромная зарплата"
      - "de origen modesto — скромного происхождения"
    collocation_example: "Siempre fue una persona modesta. — Он всегда был скромным человеком."
    trap: "Modesto — это «скромный», а не «модный»: модный — de moda. «Скромность» — modestia."

  - word: obtener
    image: art/galya/obtener.png
    ru: получать, добиваться
    ipa: /oβteˈneɾ/
    say: обтэнэ́р
    pron: "b перед t звучит мягко [β]."
    meaning: "Получить что-то, чего добивались: результат, оценку, разрешение, работу."
    examples:
      - "Obtuvo la beca por sus notas. — Он получил стипендию за свои оценки."
      - "Para obtener el visado tuvo que presentar varios documentos y esperar casi un mes. — Чтобы получить визу, ему пришлось подать несколько документов и ждать почти месяц."
      - "Con mucho esfuerzo, obtuvo el título de ingeniera y empezó a trabajar en una gran empresa. — Приложив много усилий, она получила диплом инженера и начала работать в крупной компании."
    origin: "Лат. obtinere: ob- «на, к» + tenere «держать». Спрягается как tener: obtengo, obtienes, obtuvo. Родственные: tener, mantener, contener."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: conseguir
        pair: ["Obtuvo un buen trabajo.", "Consiguió un buen trabajo."]
        diff:
          - "conseguir — обиходное, «раздобыть, добиться»"
          - "obtener — чуть официальнее: результат, документ, оценка"
    analogs:
      - "to obtain — получить; to get — самое обычное «получить»"
    dialogue:
      - "Ana: ¿Dónde obtuviste esos datos? | Где ты получил эти данные?"
      - "Luis: En un informe de la universidad. Obtuve el permiso para consultarlo. | В докладе университета. Я получил разрешение его изучить."
      - "Ana: ¿Y cómo lo conseguiste? | И как тебе это удалось?"
      - "Luis: Escribí un correo y, por lo visto, les gustó mi proyecto. Obtuve la respuesta en dos días. | Написал письмо, и, судя по всему, им понравился мой проект. Ответ я получил за два дня."
      - "Ana: Qué suerte. Yo nunca obtengo nada tan rápido. | Повезло. Я никогда так быстро ничего не получаю."
      - "Luis: Es cuestión de insistir con educación. Así obtuve también la beca. | Дело в вежливой настойчивости. Так я получил и стипендию."
      - "Ana: Enséñame tu método. | Покажи свой метод."
      - "Luis: Es sencillo: claridad, paciencia y una buena sonrisa. | Он простой: чёткость, терпение и хорошая улыбка."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "obtener un resultado — получить результат"
      - "obtener permiso — получить разрешение"
      - "obtener una beca — получить стипендию"
      - "obtener información — получить информацию"
    collocation_example: "Obtuvo una beca para estudiar en Madrid. — Он получил стипендию, чтобы учиться в Мадриде."
    trap: "Неправильный глагол, как tener: obtuve, obtendré. Не путайте с retener «удерживать» и mantener «поддерживать»: все три от tener, но значат разное."

  - word: preferente
    image: art/galya/preferente.png
    ru: приоритетный, льготный, привилегированный
    ipa: /pɾefeˈɾente/
    say: прэфэрэ́нтэ
    meaning: "То, чему отдают предпочтение или что стоит в начале очереди: приоритетный, льготный, привилегированный."
    examples:
      - "Esos asientos son preferentes para embarazadas. — Эти места приоритетные для беременных."
      - "Compró acciones preferentes porque le aseguraban cobrar antes que los demás accionistas. — Он купил привилегированные акции, потому что они гарантировали ему получить выплаты раньше остальных акционеров."
      - "Las personas mayores y las embarazadas tienen un trato preferente en la cola del ambulatorio. — Пожилые люди и беременные имеют приоритет в очереди в поликлинике."
    origin: "От preferir (лат. praeferre «выносить вперёд»: prae- «перед» + ferre «нести») + -ente. Родственные: preferencia, preferir, referir."
    register: "Формальное, деловое, юридическое."
    synonyms:
      - word: prioritario
        pair: ["Es un tema preferente.", "Es un tema prioritario."]
        diff:
          - "prioritario — «приоритетный, самый срочный»"
          - "preferente — «льготный, привилегированный, с преимуществом»"
    analogs:
      - "preferential — льготный; priority — приоритетный"
    dialogue:
      - "Ana: ¿Puedo sentarme aquí? | Можно мне здесь сесть?"
      - "Pablo: Mejor no. Esos asientos son preferentes para embarazadas y mayores. | Лучше нет. Эти места приоритетные для беременных и пожилых."
      - "Ana: No sabía. ¿Y dónde me siento? | Не знала. А куда сесть?"
      - "Pablo: Detrás. Los asientos preferentes están marcados en amarillo. | Сзади. Приоритетные места отмечены жёлтым."
      - "Ana: ¿Y si no hay nadie? | А если никого нет?"
      - "Pablo: Puedes sentarte, pero cédelo si sube alguien que lo necesite. | Можешь сесть, но уступи, если зайдёт тот, кому нужно."
      - "Ana: Claro. Es cuestión de educación. | Конечно. Это вопрос воспитания."
      - "Pablo: Exacto. Aunque hay quien no lo respeta, por desgracia. | Именно. Хотя некоторые, к сожалению, не соблюдают."
    cefr: "B2."
    frequency: "Среднее; частое в сервисе, финансах и транспорте."
    collocations:
      - "trato preferente — льготное отношение"
      - "acciones preferentes — привилегированные акции"
      - "clase preferente — бизнес-класс (Испания)"
      - "asientos preferentes — приоритетные места"
    collocation_example: "Viajamos en clase preferente. — Мы летели бизнес-классом."
    trap: "Preferente — не «предпочтительный» в смысле «любимый»; любимый — favorito, preferido. В бизнесе — «привилегированный»."

  - word: renunciar
    image: art/galya/renunciar.png
    ru: отказываться; уходить в отставку
    ipa: /renunˈθjaɾ/
    say: рэнунсья́р
    pron: "c перед i — [θ] в Испании, в Америке — «с»."
    meaning: "Добровольно отказаться от чего-то (renunciar a algo) или уйти с должности (renunciar al cargo)."
    examples:
      - "No quiero renunciar a mis sueños. — Я не хочу отказываться от своих мечтаний."
      - "El director renunció a su cargo después de que la prensa publicara la noticia. — Директор ушёл с должности после того, как пресса опубликовала эту новость."
      - "Renunció a la herencia de su tío para no tener problemas con el resto de la familia. — Она отказалась от наследства дяди, чтобы не иметь проблем с остальной семьёй."
    origin: "Лат. renuntiare «сообщать в ответ, отказываться»: re- + nuntiare «объявлять». Родственные: anunciar, pronunciar, denunciar, renuncia «отказ, заявление об уходе»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: dimitir
        pair: ["El ministro renunció.", "El ministro dimitió."]
        diff:
          - "dimitir — «подать в отставку», только о должности; в Испании чаще"
          - "renunciar — шире: ещё и «отказаться от права, мечты»; в Америке чаще для «уволиться»"
    analogs:
      - "to renounce — отказаться; to resign — уйти в отставку"
    dialogue:
      - "Ana: ¿Es verdad que renunciaste al trabajo? | Правда, что ты уволился?"
      - "Luis: Sí, renuncié hace un mes. | Да, месяц назад."
      - "Ana: ¿Por qué? Tenías un buen sueldo. | Почему? У тебя была хорошая зарплата."
      - "Luis: Pero no era feliz. No quiero renunciar a mis sueños por dinero. | Но я не был счастлив. Не хочу отказываться от своих мечтаний ради денег."
      - "Ana: ¿Y qué piensas hacer? | И что ты собираешься делать?"
      - "Luis: Montar un negocio propio. Por lo visto, hay mucho mercado para lo que ofrezco. | Открыть собственный бизнес. По-видимому, на то, что я предлагаю, есть большой спрос."
      - "Ana: Qué valiente. Yo no me atrevería a renunciar. | Какой смелый. Я бы не решилась уйти."
      - "Luis: Tampoco fue fácil. Pero ya he renunciado a la duda. | Мне тоже было непросто. Но я уже отказался от сомнений."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "renunciar a algo — отказаться от чего-то"
      - "renunciar al cargo — уйти с должности"
      - "renunciar a la nacionalidad — отказаться от гражданства"
      - "carta de renuncia — заявление об уходе"
    collocation_example: "Presentó su carta de renuncia ayer. — Он вчера подал заявление об уходе."
    trap: "Всегда с предлогом a: renunciar a algo, без a — ошибка. Не путайте с denunciar «заявлять в полицию, обличать» и anunciar «объявлять»."

  - word: trasladarse
    image: art/galya/trasladarse.png
    ru: переезжать, перебираться
    ipa: /tɾazlaˈðaɾse/
    say: тразлада́рсэ
    pron: "s перед l звучит как [z]; d между гласными мягкое."
    meaning: "Перебраться в другое место: город, офис, квартиру; добраться от одной точки до другой."
    examples:
      - "Pienso trasladarme a otra ciudad pronto. — Я собираюсь скоро переехать в другой город."
      - "Para trasladarse del aeropuerto al centro se puede tomar el autobús o el tren. — Чтобы добраться из аэропорта в центр, можно взять автобус или поезд."
      - "Se trasladó a Valencia por motivos de trabajo y encontró un piso con vistas al mar. — Он переехал в Валенсию по работе и нашёл квартиру с видом на море."
    origin: "Trasladar от лат. translatus «перенесённый» (trans- «через» + latus). Часто сближают с lado «сторона», но по происхождению это не так. Родственные: traslado «перевод, переезд»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: mudarse
        pair: ["Se trasladó a otra ciudad.", "Se mudó a otra ciudad."]
        diff:
          - "mudarse — «переехать жить в новый дом», обиходное"
          - "trasladarse — шире: переезд по работе, перевод, перемещение; чуть формальнее"
    analogs:
      - "to move — переехать; to relocate — переехать по работе; to transfer — перевести"
    dialogue:
      - "Antonio pensaba trasladarse a otra ciudad desde hacía años. | Антонио уже несколько лет собирался переехать в другой город."
      - "Su hija vivía allí y su trabajo estaba cada vez más lejos de casa. | Там жила его дочь, а работа становилась всё дальше от дома."
      - "Un día, recibió una oferta de empleo y decidió trasladarse sin esperar más. | Однажды он получил предложение о работе и решил переехать, не ожидая."
      - "Alquiló un piso pequeño y acogedor, junto al río. | Он снял маленькую уютную квартиру у реки."
      - "Al principio echaba de menos su barrio y sus vecinos. | Сначала он скучал по своему району и соседям."
      - "Pero pronto se instaló, hizo nuevos amigos y empezó a sentirse en casa. | Но скоро обустроился, завёл новых друзей и начал чувствовать себя как дома."
    cefr: "B2."
    frequency: "Частое в работе и новостях."
    collocations:
      - "trasladarse a otra ciudad — переехать в другой город"
      - "trasladarse en coche — добираться на машине"
      - "trasladar a un empleado — перевести сотрудника"
      - "pedir el traslado — просить перевода"
    collocation_example: "Me trasladaron a la oficina de Barcelona. — Меня перевели в барселонский офис."
    trap: "Trasladarse — возвратный глагол (с se), когда вы сами переезжаете. Без se (trasladar) — «переносить, перевозить кого-то или что-то»."
