# Второй список Гали (30 слов и выражений).
lang: es
words:
  - word: conseguir
    image: art/galya/conseguir.png
    ru: суметь, добиться, достать
    ipa: /konseˈɣiɾ/
    say: консэги́р
    pron: "в gui буква u не читается: gi звучит как «ги»."
    meaning: "Добиться своего, получить то, к чему стремились. С инфинитивом (conseguir + inf.) — «суметь, удаться сделать»: «Conseguí abrir la puerta»."
    examples:
      - "Conseguí hablar con el director. — Мне удалось поговорить с директором."
      - "Con mucho esfuerzo, el año pasado él consiguió una beca para estudiar medicina en Madrid. — Приложив много усилий, в прошлом году он получил стипендию, чтобы учиться на врача в Мадриде."
      - "Si no consigues que te devuelvan el dinero, tendrás que reclamar por escrito. — Если тебе не удастся добиться возврата денег, придётся подать жалобу в письменной форме."
    origin: "Лат. consequi: con- + sequi «следовать». Спрягается как seguir (e → i): consigo, consigues, consiguió. Родственные: seguir, consecuencia."
    register: "Нейтральное, очень обиходное."
    synonyms:
      - word: lograr
        pair: ["Conseguí aprobar el examen.", "Logré aprobar el examen."]
        diff:
          - "lograr — чуть более книжное, «достичь, суметь»"
          - "conseguir — обиходное, подходит и для «достать, раздобыть» предмет"
    analogs:
      - "to manage to — суметь; to get — получить, достать; to achieve — добиться"
    dialogue:
      - "Ana: ¿Conseguiste las entradas? | Ты достал билеты?"
      - "Pablo: Sí, conseguí dos para el sábado. | Да, достал два на субботу."
      - "Ana: ¿Cómo? Ya no había. | Как? Их уже не было."
      - "Pablo: Llamé a un amigo que trabaja en el teatro. Él las consiguió para mí. | Я позвонил другу, который работает в театре. Он достал их для меня."
      - "Ana: ¡Genial! ¿Cuánto te debo? | Здорово! Сколько я тебе должна?"
      - "Pablo: Nada. Conseguí un buen precio y te invito. | Ничего. Мне сделали хорошую цену, и я тебя приглашаю."
      - "Ana: Gracias. La próxima vez las consigo yo. | Спасибо. В следующий раз достану я."
      - "Pablo: De acuerdo. Pero tienes que ser rápida. | Договорились. Но тебе надо быть быстрой."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "conseguir + инфинитив — суметь сделать"
      - "conseguir un trabajo — найти работу"
      - "conseguir un objetivo — достичь цели"
      - "conseguir que + subjuntivo — добиться, чтобы…"
    collocation_example: "Consiguió que todos lo escucharan. — Ему удалось заставить всех себя выслушать."
    trap: "Это не «следовать» (seguir). Для «суметь» после conseguir идёт инфинитив без предлога, а «добиться, чтобы» требует que и subjuntivo."

  - word: asistir a
    image: art/galya/asistir_a.png
    ru: присутствовать на, посещать, участвовать в
    ipa: /asisˈtiɾ a/
    say: асисти́р а
    meaning: "Бывать на занятии, встрече, концерте, быть там лично. Всегда с предлогом a."
    examples:
      - "Asistí a la reunión de ayer. — Я был на вчерашней встрече."
      - "A la conferencia sobre el cambio climático asistieron más de trescientas personas. — На конференции об изменении климата присутствовали более трёхсот человек."
      - "Mis hijos asisten a clase de música dos veces por semana después del colegio. — Мои дети ходят на уроки музыки два раза в неделю после школы."
    origin: "Лат. assistere: ad- «к» + sistere «ставить, стоять». Родственные: asistencia «присутствие; помощь», asistente «помощник; присутствующий»."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: acudir a
        pair: ["Asistió a la reunión.", "Acudió a la reunión."]
        diff:
          - "acudir — «прийти, явиться» (по вызову, на помощь, на встречу): акцент на самом приходе"
          - "asistir — «присутствовать, быть на месте»: акцент на участии"
          - "Acudieron los bomberos — приехали пожарные; asistieron treinta personas — было тридцать человек"
    analogs:
      - "to attend — посещать (ложный друг: to assist — это ayudar)"
    dialogue:
      - "Ana: ¿Vas a asistir a la conferencia? | Ты пойдёшь на конференцию?"
      - "Luis: Sí, ayer asistí a la primera y me gustó mucho. | Да, вчера я был на первой, и мне очень понравилось."
      - "Ana: ¿De qué hablaban? | О чём там говорили?"
      - "Luis: De cómo trabajar mejor. Asistieron más de doscientas personas. | О том, как лучше работать. Пришло больше двухсот человек."
      - "Ana: ¿Hay que reservar? | Нужно записываться?"
      - "Luis: Sí, y hay que asistir los dos días para recibir el certificado. | Да, и нужно прийти оба дня, чтобы получить сертификат."
      - "Ana: Entonces me apunto hoy. | Тогда я записываюсь сегодня."
      - "Luis: Perfecto. Así asistimos juntos. | Отлично. Так мы пойдём вместе."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "asistir a clase — ходить на занятия"
      - "asistir a una reunión — быть на встрече"
      - "asistir a un concierto — быть на концерте"
      - "asistir a un enfermo — ухаживать за больным"
    collocation_example: "Los médicos asistieron a los heridos. — Врачи оказали помощь раненым."
    trap: "Не путайте с английским to assist («помогать»). Asistir a = быть где-то; помогать — ayudar. Предлог a обязателен."

  - word: instalarse
    image: art/galya/instalarse.png
    ru: устраиваться, располагаться, поселиться
    ipa: /instaˈlaɾse/
    say: инстала́рсэ
    meaning: "Обосноваться на новом месте: поселиться в доме, удобно усесться, начать жить где-то."
    examples:
      - "Nos instalamos en la sala. — Мы расположились в гостиной."
      - "En un piso luminoso del barrio viejo se instalaron después de la mudanza. — В светлой квартире в старом районе они поселились после переезда."
      - "Hace diez años se instaló en Barcelona y ya no piensa en volver a su pueblo. — Десять лет назад он обосновался в Барселоне и больше не думает возвращаться в свой городок."
    origin: "Фр. installer от ср.-лат. installare (in- + stallum «место, стойло»). Без se: instalar «устанавливать (программу, лампу)»."
    register: "Нейтральное."
    synonyms:
      - word: acomodarse
        pair: ["Se instaló en el sofá.", "Se acomodó en el sofá."]
        diff:
          - "acomodarse — «удобно усесться», про позу и комфорт"
          - "instalarse — «обосноваться», про место на какое-то время"
    analogs:
      - "to settle in — обустроиться; to install — установить (instalar)"
    dialogue:
      - "Ana: ¿Ya te has instalado en la nueva casa? | Ты уже обустроился в новом доме?"
      - "Pablo: Casi. Nos instalamos en la sala hace una semana, pero faltan cosas por colocar. | Почти. Мы расположились в гостиной неделю назад, но ещё многое нужно расставить."
      - "Ana: ¿Y qué tal el barrio? | А как район?"
      - "Pablo: Muy tranquilo. Los vecinos son amables y hay un parque cerca. | Очень спокойный. Соседи любезные, и рядом парк."
      - "Ana: ¿Echas de menos el centro? | Скучаешь по центру?"
      - "Pablo: Un poco, pero me voy a instalar pronto en mi rutina. Ya conocí al panadero. | Немного, но скоро войду в рутину. Я уже познакомился с пекарем."
      - "Ana: ¡Esa es la primera señal! | Это первый признак!"
      - "Pablo: Ven a verlo cuando acabemos de instalarnos del todo. | Приходи посмотреть, когда мы полностью устроимся."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "instalarse en una casa — поселиться в доме"
      - "instalarse en una ciudad — обосноваться в городе"
      - "instalarse cómodamente — удобно расположиться"
    collocation_example: "Se instaló en París hace diez años. — Он обосновался в Париже десять лет назад."
    trap: "Instalar — «установить» (прибор, программу), а instalarse — «поселиться, расположиться». Это возвратный глагол."

  - word: ambiente
    image: art/galya/ambiente.png
    ru: атмосфера, обстановка; окружающая среда
    ipa: /amˈbjente/
    say: амбье́нтэ
    meaning: "Общая обстановка и настроение места или компании; ещё — окружающая среда и «комнатная температура»."
    examples:
      - "Guarda el vino a temperatura ambiente. — Храни вино при комнатной температуре."
      - "Había tan buen ambiente en la fiesta que nadie quería irse a casa. — На вечеринке была такая хорошая атмосфера, что никому не хотелось идти домой."
      - "En este pueblo se respira un ambiente medieval, con calles de piedra y casas de madera. — В этом городке царит средневековая атмосфера: улицы из камня и деревянные дома."
    origin: "Лат. ambiens, ambientis «окружающий» от ambire (amb- «вокруг» + ire «идти»). Родственные: ambiental, ambos."
    register: "Нейтральное."
    synonyms:
      - word: atmósfera
        pair: ["Hay un ambiente muy agradable.", "Hay una atmósfera muy agradable."]
        diff:
          - "atmósfera — книжнее, а ещё «воздушная оболочка Земли»"
          - "ambiente — обиходно: настроение места или компании"
    analogs:
      - "atmosphere — атмосфера; ambience — обстановка; environment — окружающая среда"
    dialogue:
      - "Ana: ¿Qué tal el bar nuevo? | Как новый бар?"
      - "Luis: Genial. Tiene muy buen ambiente y la música no está muy alta. | Отлично. Там очень хорошая атмосфера, и музыка не слишком громкая."
      - "Ana: ¿Había mucha gente? | Было много людей?"
      - "Luis: Sí, pero el ambiente era tranquilo. Aunque, por lo visto, los viernes se llena. | Да, но обстановка была спокойной. Хотя, судя по всему, по пятницам он забит."
      - "Ana: ¿Y la comida? | А еда?"
      - "Luis: Exquisita. Probé unas croquetas y un vino servido a temperatura ambiente. | Изысканная. Я попробовал крокеты и вино, поданное при комнатной температуре."
      - "Ana: Qué ganas. ¿Vamos el sábado? | Как хочется. Сходим в субботу?"
      - "Luis: Vale. Y cuidemos el ambiente: nada de discusiones. | Хорошо. И побережём атмосферу: никаких споров."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "buen ambiente — хорошая атмосфера"
      - "medio ambiente — окружающая среда"
      - "ambiente familiar — семейная обстановка"
      - "temperatura ambiente — комнатная температура"
    collocation_example: "Hay que cuidar el medio ambiente. — Нужно беречь окружающую среду."
    trap: "Ambiente — мужского рода (el ambiente). «Окружающая среда» по-испански medio ambiente, а не просто ambiente."

  - word: pasar por
    image: art/galya/pasar_por.png
    ru: заходить, заглядывать (по пути); проходить через
    ipa: /paˈsaɾ poɾ/
    say: паса́р пор
    meaning: "Зайти ненадолго куда-то по дороге, заглянуть; ещё — проехать, пройти через место."
    examples:
      - "Pasaré por la farmacia mañana. — Я зайду в аптеку завтра."
      - "El tren sale de Madrid, pasa por Zaragoza y llega a Barcelona en tres horas. — Поезд выходит из Мадрида, идёт через Сарагосу и прибывает в Барселону за три часа."
      - "Voy a pasar por tu casa antes de la cena para dejarte el libro que me prestaste. — Я зайду к тебе перед ужином, чтобы вернуть книгу, которую ты мне давал."
    origin: "Pasar от paso «шаг, проход» (лат. passus) + por «через, мимо». Родственные: pasaje, pasajero, paso."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: visitar
        pair: ["Pasaré por tu oficina.", "Visitaré tu oficina."]
        diff:
          - "visitar — именно «посетить», с целью"
          - "pasar por — «заглянуть мимоходом», быстро и неформально"
    analogs:
      - "to drop by, to stop by — заглянуть; to go through — пройти через"
    dialogue:
      - "Ana: ¿Puedes pasar por el supermercado? | Можешь заглянуть в супермаркет?"
      - "Pablo: Claro, paso por allí de camino a casa. | Конечно, зайду по дороге домой."
      - "Ana: Necesito leche, pan y huevos. | Мне нужны молоко, хлеб и яйца."
      - "Pablo: Anotado. Y mañana tengo que pasar por la farmacia. | Записал. А завтра мне нужно зайти в аптеку."
      - "Ana: ¿Por qué? ¿Estás enfermo? | Зачем? Ты болен?"
      - "Pablo: Un poco resfriado. Ayer pasé por una zona con mucho viento y me enfrié. | Немного простужен. Вчера прошёл через место с сильным ветром и замёрз."
      - "Ana: Pues pasa también por casa de mi madre y llévale esto, por favor. | Тогда заскочи ещё к моей маме и отнеси ей это, пожалуйста."
      - "Pablo: Hecho. Paso por todas partes menos por el gimnasio. | Хорошо. Зайду куда угодно, кроме спортзала."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "pasar por casa de alguien — зайти к кому-то"
      - "pasar por la aduana — пройти таможню"
      - "pasar por un mal momento — переживать трудное время"
      - "pasar por alto — упустить, не заметить"
    collocation_example: "Pasa por mi casa cuando quieras. — Заходи ко мне, когда хочешь."
    trap: "Pasar por + место = «заглянуть», а pasar de = «проходить мимо, не обращать внимания» (разг.: paso de eso — мне это неинтересно)."

  - word: causar
    image: art/galya/causar.png
    ru: вызывать, причинять
    ipa: /kauˈsaɾ/
    say: кауса́р
    meaning: "Быть причиной чего-то: вызвать, породить, причинить вред, удивление, радость."
    examples:
      - "El ruido causó mucho miedo. — Шум вызвал сильный страх."
      - "En toda la ciudad, la fuerte lluvia causó graves problemas de tráfico. — Сильный дождь вызвал по всему городу серьёзные проблемы с движением."
      - "El accidente, que causó dos heridos, ocurrió a primera hora de la mañana. — Авария, в которой пострадали двое, произошла рано утром."
    origin: "Лат. causare от causa «причина». Родственные: causa, causante, a causa de «из-за»."
    register: "Нейтральное, частое в новостях."
    synonyms:
      - word: provocar
        pair: ["El ruido causó un susto.", "El ruido provocó un susto."]
        diff:
          - "provocar — «вызвать, спровоцировать», ещё и «подначивать»"
          - "causar — нейтральное «стать причиной»"
    analogs:
      - "to cause — то же; to bring about — вызывать"
    dialogue:
      - "Ana: ¿Qué causó el incendio? | Что вызвало пожар?"
      - "Luis: Un problema con la electricidad. Causó muchos daños, pero nadie murió. | Проблема с электричеством. Он нанёс много ущерба, но никто не погиб."
      - "Ana: ¡Qué suerte! ¿Y el edificio? | Какое везение! А здание?"
      - "Luis: Está muy dañado. El humo causó más problemas que el fuego. | Сильно повреждено. Дым причинил больше проблем, чем огонь."
      - "Ana: ¿Y los vecinos? | А соседи?"
      - "Luis: Ahora viven con su familia. El ruido de las sirenas causó mucho miedo. | Сейчас живут у родственников. Шум сирен вызвал большой страх."
      - "Ana: Pobres. ¿Cuánto tiempo van a estar fuera? | Бедные. Сколько они будут вне дома?"
      - "Luis: Por lo visto, dos meses. | Судя по всему, два месяца."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "causar daño — причинить вред"
      - "causar problemas — создавать проблемы"
      - "causar sorpresa — удивлять"
      - "causar un accidente — стать причиной аварии"
    collocation_example: "Esa noticia causó mucha alegría. — Эта новость вызвала большую радость."
    trap: "Causar — «вызвать», а не «наказать» и не «судиться». «Из-за» — a causa de."

  - word: causar impresión
    image: art/galya/causar_impresion.png
    ru: произвести впечатление
    ipa: /kauˈsaɾ impɾeˈsjon/
    say: кауса́р импрэсьо́н
    meaning: "Оказать эффект на собеседника: произвести впечатление, обычно с уточнением «хорошее / плохое»."
    examples:
      - "Causó buena impresión en la entrevista. — Он произвёл хорошее впечатление на собеседовании."
      - "El paisaje de las montañas nevadas me causó una impresión que nunca olvidaré. — Пейзаж заснеженных гор произвёл на меня впечатление, которое я никогда не забуду."
      - "Llegó tarde y con la ropa sucia, y eso causó mala impresión desde el primer momento. — Он опоздал и пришёл в грязной одежде, и это с самого начала произвело плохое впечатление."
    origin: "Causar «вызывать» + impresión (лат. impressio от imprimere «вдавливать, оттискивать»). Родственные: imprimir, impresionante."
    register: "Нейтральное."
    synonyms:
      - word: impresionar
        pair: ["Me causó impresión su valentía.", "Me impresionó su valentía."]
        diff:
          - "impresionar — одним глаголом, короче и бодрее"
          - "causar impresión — устойчивый оборот, можно уточнить: buena, mala, fuerte"
    analogs:
      - "to make an impression — произвести впечатление; to impress — впечатлить"
    dialogue:
      - "Ana: ¿Qué tal la entrevista? | Как собеседование?"
      - "Pablo: Muy bien. Creo que causé buena impresión. | Очень хорошо. Кажется, я произвёл хорошее впечатление."
      - "Ana: ¿Qué te preguntaron? | О чём тебя спросили?"
      - "Pablo: Qué función desempeñé en mi último trabajo y por qué renuncié. | Какую функцию я выполнял на последней работе и почему уволился."
      - "Ana: ¿Y qué respondiste? | И что ты ответил?"
      - "Pablo: La verdad, con calma. Dicen que la primera impresión es la que cuenta. | Правду, спокойно. Говорят, что решает первое впечатление."
      - "Ana: ¿Cuándo te dirán algo? | Когда тебе ответят?"
      - "Pablo: En una semana. Mientras tanto, voy a asistir a un curso. Eso también causa buena impresión. | Через неделю. А пока пойду на курсы. Это тоже производит хорошее впечатление."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "causar buena impresión — произвести хорошее впечатление"
      - "causar mala impresión — произвести плохое впечатление"
      - "causar una impresión profunda — оставить глубокое впечатление"
    collocation_example: "El paisaje me causó una impresión inolvidable. — Пейзаж оставил у меня незабываемое впечатление."
    trap: "Без уточнения оборот чаще значит «произвести сильное впечатление». Английское to make an impression передают не через hacer, а через causar."

  - word: por lo visto
    image: art/galya/por_lo_visto.png
    ru: очевидно, по всей видимости, судя по всему
    ipa: /poɾ lo ˈβisto/
    say: пор ло ви́сто
    meaning: "Вводное выражение: говорящий делает вывод по тому, что видит или слышит, но не уверен на сто процентов."
    examples:
      - "Mañana, por lo visto, hará frío. — Завтра, по-видимому, будет холодно."
      - "Mañana lloverá todo el día, por lo visto, así que dejamos la excursión. — Завтра, по-видимому, весь день будет дождь, так что отложим поездку."
      - "Ha cambiado de trabajo, por lo visto, porque ya no contesta a mis mensajes de la oficina. — Он, видимо, сменил работу, потому что больше не отвечает на мои сообщения в офис."
    origin: "Por «по» + lo (нейтральный артикль) + visto — причастие от ver «видеть»: «по тому, что видно»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: al parecer
        pair: ["Por lo visto, está enfermo.", "Al parecer, está enfermo."]
        diff:
          - "al parecer — чуть формальнее, «как кажется»"
          - "por lo visto — разговорнее, с оттенком «судя по тому, что вижу / слышу»"
    analogs:
      - "apparently — по-видимому; seemingly — на первый взгляд"
    dialogue:
      - "Ana: ¿Por qué no contesta? | Почему он не отвечает?"
      - "Luis: Por lo visto, se ha quedado sin batería. | Судя по всему, у него села батарея."
      - "Ana: ¿Y no tiene cargador? | А зарядки у него нет?"
      - "Luis: Por lo visto, lo dejó en casa. Mañana, por lo visto, hará frío y lloverá. | Судя по всему, оставил дома. Завтра, судя по прогнозу, будет холодно и дождливо."
      - "Ana: Pues dile que me llame desde otro teléfono. | Тогда скажи, чтобы позвонил мне с другого телефона."
      - "Luis: Se lo diré. Por lo visto, hoy todo el mundo está desconectado. | Передам. Судя по всему, сегодня все отключены."
      - "Ana: Qué día. Voy a tomarme un café. | Ну и день. Пойду выпью кофе."
      - "Luis: Te acompaño. Por lo visto, necesitamos los dos un descanso. | Я с тобой. Похоже, нам обоим нужен перерыв."
    cefr: "B1."
    frequency: "Очень частое в разговорной речи."
    collocations:
      - "por lo visto — судя по всему"
      - "por lo que parece — похоже на то"
      - "según parece — по-видимому"
    collocation_example: "Por lo visto, la reunión se ha cancelado. — Похоже, встречу отменили."
    trap: "Это вывод, а не «очевидно» в смысле «всем ясно»: для «это ясно» говорят está claro или obviamente. Выражение неизменяемое."

  - word: informe
    image: art/galya/informe.png
    ru: доклад, отчёт, справка
    ipa: /imˈfoɾme/
    say: имфо́рмэ
    pron: "n перед f звучит как [m]: имформе."
    meaning: "Документ, где собраны факты и выводы: доклад, отчёт, заключение. Мужской род."
    examples:
      - "El director leyó el informe. — Директор прочёл отчёт."
      - "Tengo que entregar un informe sobre los gastos del mes antes del viernes. — Мне нужно сдать отчёт о расходах за месяц до пятницы."
      - "El informe médico confirma que el paciente se está recuperando bien tras la operación. — Медицинское заключение подтверждает, что пациент хорошо восстанавливается после операции."
    origin: "От informar (лат. informare «придавать форму; обучать»). Родственные: información, informal, forma."
    register: "Деловое, нейтральное."
    synonyms:
      - word: reporte
        pair: ["Preparó el informe anual.", "Preparó el reporte anual."]
        diff:
          - "reporte — чаще в Латинской Америке"
          - "informe — основное слово в Испании"
    analogs:
      - "report — доклад, отчёт (информе ≠ inform, это именно report)"
    dialogue:
      - "Ana: ¿Ya terminaste el informe? | Ты закончил отчёт?"
      - "Pablo: Casi. Falta la última parte, pero el director ya leyó el resumen. | Почти. Не хватает последней части, но директор уже прочитал резюме."
      - "Ana: ¿Y qué le pareció? | И что он думает?"
      - "Pablo: Que obtuve buenos resultados, aunque quiere más datos. | Что я получил хорошие результаты, хотя хочет больше данных."
      - "Ana: ¿Cuándo lo entregas? | Когда сдаёшь?"
      - "Pablo: El viernes. Elaboro el informe de noche para no distraerme. | В пятницу. Составляю отчёт ночью, чтобы не отвлекаться."
      - "Ana: ¿Quieres que lo revise? | Хочешь, я проверю?"
      - "Pablo: Sí, por favor. Un informe con errores no causa buena impresión. | Да, пожалуйста. Отчёт с ошибками не производит хорошего впечатления."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "elaborar un informe — составить отчёт"
      - "presentar un informe — представить доклад"
      - "informe médico — медицинская справка"
      - "informe anual — годовой отчёт"
    collocation_example: "El comité presentó un informe sobre el accidente. — Комитет представил доклад об аварии."
    trap: "Informe — существительное «отчёт», глагол — informar «сообщать, информировать». Ещё informe бывает прилагательным: «бесформенный»."

  - word: aunque
    image: art/galya/aunque.png
    ru: хотя, даже если
    ipa: /ˈauŋke/
    say: а́ункэ
    pron: "n перед k звучит как [ŋ]; qu = [k]."
    meaning: "Союз уступки: «хотя» (факт) или «даже если» (предположение). С реальным фактом идёт изъявительное (indicativo), с возможным — сослагательное (subjuntivo)."
    examples:
      - "Aunque cueste dinero, lo haremos. — Даже если это стоит денег, мы это сделаем."
      - "Vamos a salir porque ya hemos comprado las entradas, aunque llueve a cántaros. — Мы пойдём, потому что уже купили билеты, хотя льёт как из ведра."
      - "El piso es caro, aunque a mí me parece que vale la pena por su ubicación. — Квартира дорогая, хотя, по-моему, стоит своих денег из-за расположения."
    origin: "От aun «даже» + que: «даже что». Родственные: aún, aun, pero, sin embargo."
    register: "Нейтральное."
    synonyms:
      - word: a pesar de que
        pair: ["Aunque estaba cansado, siguió.", "A pesar de que estaba cansado, siguió."]
        diff:
          - "a pesar de que — «несмотря на то, что», тяжелее и формальнее"
          - "aunque — короткий, обиходный, годится и для «даже если»"
    analogs:
      - "although, though — хотя; even if — даже если"
    dialogue:
      - "Ana: ¿Vienes a la fiesta aunque no te invite nadie? | Ты придёшь на вечеринку, даже если тебя никто не пригласит?"
      - "Luis: No, aunque me cae bien el dueño de la casa. | Нет, хотя хозяин дома мне симпатичен."
      - "Ana: Yo sí voy. Aunque cuesta dinero, me gusta ver a mis amigos. | А я иду. Хоть это стоит денег, мне нравится видеть друзей."
      - "Luis: Tienes razón, pero a mí me da vergüenza ir sin invitación. | Ты права, но мне неловко приходить без приглашения."
      - "Ana: Yo hago una cena el sábado, aunque llueve mucho en esta época. ¿Vienes? | В субботу я устраиваю ужин, хотя в это время года много дождей. Придёшь?"
      - "Luis: Sí, voy, aunque tengo mucho trabajo. | Да, приду, хотя у меня много работы."
      - "Ana: Genial. Aunque no me avisas, hay sitio para ti. | Здорово. Даже если не предупредишь, для тебя найдётся место."
      - "Luis: Mejor te aviso, por educación. | Лучше я предупрежу, из вежливости."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "aunque + indicativo — хотя (факт)"
      - "aunque + subjuntivo — даже если (гипотеза)"
      - "aunque sea — хотя бы"
    collocation_example: "Llámame, aunque sea tarde. — Позвони мне, пусть даже поздно."
    trap: "Выбор наклонения меняет смысл: aunque llueve — дождь идёт, aunque llueva — может пойти. Не путайте с aún («ещё») и aun («даже»)."

  - word: dirigirse a
    image: art/galya/dirigirse_a.png
    ru: направиться в; обратиться к
    ipa: /diɾiˈxiɾse a/
    say: дирихи́рсэ а
    pron: "g перед i читается как русское «х»; перед a и o меняется на j: me dirijo."
    meaning: "Идти или ехать в определённое место; ещё — обратиться к человеку с речью или письмом."
    examples:
      - "Se dirigió a la salida. — Он направился к выходу."
      - "Me dirijo a usted para pedirle información sobre el curso de verano. — Обращаюсь к вам, чтобы попросить информацию о летнем курсе."
      - "El tren con destino a Sevilla se dirige ahora hacia la estación de Córdoba. — Поезд, следующий в Севилью, сейчас направляется к станции Кордова."
    origin: "Лат. dirigere (dis- + regere «направлять»). Спрягается с изменением g → j перед a/o: dirijo, dirija. Родственные: dirección, director, regir."
    register: "Нейтральное, чуть формальное."
    synonyms:
      - word: ir hacia
        pair: ["Se dirigió al hotel.", "Fue hacia el hotel."]
        diff:
          - "ir hacia — просто «идти в сторону»"
          - "dirigirse — «целенаправленно направиться», более книжно"
    analogs:
      - "to head for — направляться; to address — обратиться к"
    dialogue:
      - "Ana: ¿Adónde te diriges? | Куда ты направляешься?"
      - "Pablo: Me dirijo a la estación. Mi tren sale en una hora. | Я иду на вокзал. Мой поезд уходит через час."
      - "Ana: ¿Vas lejos? | Едешь далеко?"
      - "Pablo: A casa de mis padres. Me dirijo allí cada mes, aunque tarde tres horas. | К родителям. Езжу туда каждый месяц, хотя ехать три часа."
      - "Ana: ¿Y a quién te diriges si pierdes el tren? | А к кому обратишься, если опоздаешь на поезд?"
      - "Pablo: Al jefe de estación, aunque casi nunca pasa. Se dirigió a la salida, pero lo perdió. | К начальнику вокзала, хотя это почти не случается. Он пошёл к выходу, но поезд ушёл."
      - "Ana: Qué disgusto. Y tú te diriges a mí cada vez que lo pierdes. | Какая досада. А ты обращаешься ко мне каждый раз, когда опаздываешь."
      - "Pablo: Porque siempre me ayudas. Gracias. | Потому что ты всегда помогаешь. Спасибо."
    cefr: "B2."
    frequency: "Частое в новостях и официальной речи."
    collocations:
      - "dirigirse a casa — направиться домой"
      - "dirigirse al público — обратиться к публике"
      - "dirigirse hacia el norte — двигаться на север"
    collocation_example: "El presidente se dirigió a la nación. — Президент обратился к нации."
    trap: "Dirigirse — возвратный, dirigir (без se) — «руководить, направлять»: dirigir una empresa. И не забывайте g → j: me dirijo."

  - word: pasarlo bien
    image: art/galya/pasarlo_bien.png
    ru: отлично провести время
    ipa: /paˈsaɾlo βjen/
    say: паса́рло бьен
    meaning: "Приятно проводить время, повеселиться. Lo здесь нейтральное и не заменяется: pasarlo bien, pasarlo mal."
    examples:
      - "Lo pasé fatal en la fiesta. — Я ужасно провёл время на вечеринке."
      - "Lo pasamos muy bien en la playa, aunque el agua estaba bastante fría. — Мы отлично провели время на пляже, хотя вода была довольно холодной."
      - "En la boda de mi prima lo pasé en grande, bailando hasta las cinco de la mañana. — На свадьбе двоюродной сестры я здорово повеселился, танцуя до пяти утра."
    origin: "Pasar «проводить (время)» + lo (нейтральное местоимение: «это, время») + bien. Противоположное: pasarlo mal."
    register: "Разговорное."
    synonyms:
      - word: divertirse
        pair: ["Lo pasamos bien en la fiesta.", "Nos divertimos en la fiesta."]
        diff:
          - "divertirse — «развлекаться, веселиться»"
          - "pasarlo bien — шире: просто приятно провести время"
    analogs:
      - "to have a good time — хорошо провести время"
    dialogue:
      - "Ana: ¿Qué tal el viaje? | Как поездка?"
      - "Luis: Genial. Lo pasamos muy bien. | Прекрасно. Мы отлично провели время."
      - "Ana: ¿Adónde fuisteis? | Куда ездили?"
      - "Luis: A un pueblo en la orilla del mar. Lo pasé bien, aunque llovió un par de días. | В городок на берегу моря. Я хорошо отдохнул, хотя пару дней шёл дождь."
      - "Ana: ¿Y la gente? | А люди?"
      - "Luis: Un ambiente estupendo. Por lo visto, siempre lo pasan bien allí. | Прекрасная атмосфера. Судя по всему, там всегда хорошо проводят время."
      - "Ana: Qué envidia. Yo lo pasé fatal en la oficina. | Какая зависть. А я ужасно провела время в офисе."
      - "Luis: Pues este fin de semana, lo pasamos bien juntos. | Тогда в эти выходные проведём время хорошо вместе."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "pasarlo bien — хорошо провести время"
      - "pasarlo mal — плохо провести время"
      - "pasarlo en grande — отлично повеселиться"
      - "¡Que lo pases bien! — Хорошо проведи время!"
    collocation_example: "Lo pasamos en grande en la boda. — Мы здорово повеселились на свадьбе."
    trap: "Lo нельзя опускать: без него pasar bien значит «хорошо пройти, протекать» (el examen pasó bien — экзамен прошёл хорошо). Для «хорошо провести время» всегда pasarlo bien."

  - word: poseer
    image: art/galya/poseer.png
    ru: владеть, иметь
    ipa: /poseˈeɾ/
    say: посээ́р
    meaning: "Иметь в собственности или обладать качеством, знаниями, талантом."
    examples:
      - "Esta casa posee un jardín enorme. — У этого дома огромный сад."
      - "Para ser buen traductor hay que poseer conocimientos profundos de ambas lenguas. — Чтобы быть хорошим переводчиком, нужно обладать глубокими знаниями обоих языков."
      - "Esa familia posee una enorme finca en el sur del país, con olivos y caballos. — Эта семья владеет огромной усадьбой на юге страны, с оливковыми деревьями и лошадьми."
    origin: "Лат. possidere (potis «хозяин, могущий» + sedere «сидеть»): «сидеть как хозяин». Спрягается как leer: poseyó, poseyeron, poseído. Родственные: posesión, poseedor."
    register: "Формальное, книжное."
    synonyms:
      - word: tener
        pair: ["Posee una casa en el campo.", "Tiene una casa en el campo."]
        diff:
          - "tener — обиходное «иметь» на каждый день"
          - "poseer — книжнее, подчёркивает собственность или ценное качество"
    analogs:
      - "to possess — владеть; to own — быть владельцем"
    dialogue:
      - "Ana: ¿De quién es esa finca? | Чья это усадьба?"
      - "Pablo: De una familia que posee casi todo el valle. | Одной семьи, которая владеет почти всей долиной."
      - "Ana: ¡Qué barbaridad! ¿Y cómo lo consiguieron? | Невероятно! И как им это удалось?"
      - "Pablo: Por herencia. Poseen tierras desde hace generaciones. | По наследству. Они владеют землями уже поколениями."
      - "Ana: ¿Y qué posee la finca? | А что есть в усадьбе?"
      - "Pablo: Un jardín enorme y un lago pequeño. Esta casa posee un encanto especial. | Огромный сад и небольшое озеро. У этого дома особое очарование."
      - "Ana: ¿Se puede visitar? | Можно посетить?"
      - "Pablo: Solo los domingos. Pasa por la entrada y pregunta. | Только по воскресеньям. Подойди ко входу и спроси."
    cefr: "B2."
    frequency: "Среднее, чаще в тексте, чем в речи."
    collocations:
      - "poseer una casa — владеть домом"
      - "poseer talento — обладать талантом"
      - "poseer el título — иметь звание"
      - "poseer conocimientos — обладать знаниями"
    collocation_example: "Posee conocimientos profundos de historia. — Он обладает глубокими знаниями истории."
    trap: "Глагол с y в 3-м лице: poseyó, poseyeron. Причастие poseído может значить и «одержимый»."

  - word: situado
    image: art/galya/situado.png
    ru: расположенный, находящийся
    ipa: /siˈtwaðo/
    say: ситу́адо
    pron: "d между гласными мягкое [ð]; ua — один слог."
    meaning: "Причастие: находящийся в определённом месте. Согласуется с родом и числом: situado, situada, situados."
    examples:
      - "El hotel está situado junto al mar. — Отель расположен у моря."
      - "Buscamos un apartamento cerca del metro y de las tiendas, bien situado. — Мы ищем квартиру рядом с метро и магазинами, удобно расположенную."
      - "Las casas situadas al norte del pueblo son más frías en invierno que las del sur. — Дома, расположенные на севере деревни, зимой холоднее, чем на юге."
    origin: "Причастие от situar (лат. situs «положение, место»). Родственные: situación, sitio."
    register: "Нейтральное, формальное; часто в путеводителях."
    synonyms:
      - word: ubicado
        pair: ["Está situado en el centro.", "Está ubicado en el centro."]
        diff:
          - "ubicado — чаще в Латинской Америке"
          - "situado — типично для Испании и путеводителей"
    analogs:
      - "located, situated — расположенный"
    dialogue:
      - "Ana: ¿Dónde está el museo? | Где музей?"
      - "Luis: Está situado junto al río, en el centro. | Он расположен у реки, в центре."
      - "Ana: ¿Cómo llego? | Как добраться?"
      - "Luis: Dirígete a la plaza y sigue la calle principal. Está situado frente a la catedral. | Иди на площадь и следуй по главной улице. Он расположен напротив собора."
      - "Ana: ¿Y el hotel? | А отель?"
      - "Luis: Está situado a pocos pasos, en una calle tranquila. Es un sitio con mucho encanto. | Он расположен в нескольких шагах, на тихой улице. Место с большим очарованием."
      - "Ana: Perfecto. ¿Tienes algún plano? | Отлично. У тебя есть карта?"
      - "Luis: Toma, aquí están situados todos los monumentos. | Держи, здесь отмечены все памятники."
    cefr: "B1."
    frequency: "Частое в описаниях."
    collocations:
      - "estar situado en — находиться в"
      - "bien situado — удобно расположенный"
      - "situado al norte — расположенный на севере"
    collocation_example: "El apartamento está bien situado. — Квартира удобно расположена."
    trap: "Situado — причастие, поэтому согласуется: casa situada, pueblos situados. С estar, не с ser."

  - word: situar
    image: art/galya/situar.png
    ru: расположить, поместить; определить положение
    ipa: /siˈtwaɾ/
    say: ситу́ар
    pron: "ударение смещается: sitúo, sitúas, sitúa (на у)."
    meaning: "Поместить что-то в определённое место; ещё — «найти место на карте / во времени». Возвратная форма situarse: «находиться, занять позицию»."
    examples:
      - "Sitúa el pueblo en el mapa. — Найди это селение на карте."
      - "Ese pueblo está cerca, pero no sé situarlo en el mapa. — Та деревня где-то рядом, но я не могу найти её на карте."
      - "La novela se sitúa en el siglo diecinueve y cuenta la historia de una familia de marineros. — Действие романа происходит в XIX веке, и в нём рассказывается история семьи моряков."
    origin: "Лат. situs «положение» + -ar. Спряжение: sitúo, sitúas, sitúa, situamos. Родственные: situado, situación."
    register: "Нейтральное, книжное."
    synonyms:
      - word: colocar
        pair: ["Situó la lámpara junto a la ventana.", "Colocó la lámpara junto a la ventana."]
        diff:
          - "colocar — обиходное «поставить, положить»"
          - "situar — книжнее и точнее по месту"
    analogs:
      - "to place, to situate — поместить; to set (a story) — поместить действие"
    dialogue:
      - "Ana: ¿Puedes situar Soria en el mapa? | Можешь показать Сорию на карте?"
      - "Pablo: Sí, sitúa el pueblo en el mapa, al norte de Madrid. | Да, помести городок на карту, к северу от Мадрида."
      - "Ana: ¿Está muy lejos? | Это далеко?"
      - "Pablo: A unas dos horas. Se sitúa en una llanura alta, rodeada de montañas. | Часа два. Находится на высокой равнине в окружении гор."
      - "Ana: ¿Y cómo es la gente? | А какие там люди?"
      - "Pablo: Modesta y amable. Además, sitúan la ciudad entre las más tranquilas del país. | Скромные и любезные. К тому же город называют одним из самых спокойных в стране."
      - "Ana: Me apetece conocerlo. | Мне хочется там побывать."
      - "Pablo: Pues sitúa la fecha y organizamos el viaje. | Тогда определи дату, и мы организуем поездку."
    cefr: "B2."
    frequency: "Среднее."
    collocations:
      - "situar en el mapa — найти на карте"
      - "situarse en el primer puesto — выйти на первое место"
      - "la acción se sitúa en — действие происходит в"
    collocation_example: "El equipo se sitúa en primer lugar. — Команда вышла на первое место."
    trap: "Ударение падает на u в формах sitúo, sitúas, sitúa, sitúan, а в situamos, situáis — на другой слог (как у глагола actuar)."

  - word: extensión
    image: art/galya/extension.png
    ru: площадь, протяжённость; расширение
    ipa: /ekstenˈsjon/
    say: экстэнсьо́н
    pron: "x в начале слога читается как [ks]; ударение на последнем слоге."
    meaning: "Размер территории (площадь), протяжённость во времени и пространстве; ещё — расширение, продление и добавочный номер."
    examples:
      - "Pidió la extensión del plazo. — Он попросил продлить срок."
      - "El parque natural tiene una extensión de más de cien hectáreas. — Площадь природного парка больше ста гектаров."
      - "Para hablar con contabilidad, llame al número principal y marque la extensión doscientos catorce. — Чтобы поговорить с бухгалтерией, позвоните на основной номер и наберите добавочный двести четырнадцать."
    origin: "Лат. extensio от extendere (ex- «из» + tendere «тянуть»). Родственные: extender «растягивать», extenso «обширный», tender."
    register: "Нейтральное, формальное."
    synonyms:
      - word: superficie
        pair: ["La extensión del país es enorme.", "La superficie del país es enorme."]
        diff:
          - "superficie — точная площадь в км² или м²"
          - "extensión — размах, протяжённость, не обязательно число"
    analogs:
      - "extent, area — протяжённость, площадь; extension — расширение, продление"
    dialogue:
      - "Ana: ¿Cuánto mide el lago? | Какого размера озеро?"
      - "Luis: Tiene una extensión de casi diez kilómetros. | Его площадь почти десять километров."
      - "Ana: ¡Qué grande! ¿Y la región? | Какое большое! А регион?"
      - "Luis: Una gran extensión de llanura, con pocos pueblos. Por lo visto, es el lago más extenso del país. | Большая протяжённость равнины с редкими городками. Судя по всему, это самое большое озеро в стране."
      - "Ana: ¿Se puede rodear andando? | Можно обойти пешком?"
      - "Luis: Lleva dos días. Hay que pedir una extensión del permiso si se acampa. | Это занимает два дня. Если ночуешь в палатке, нужно запросить продление разрешения."
      - "Ana: Qué complicado. | Как сложно."
      - "Luis: Nada del otro mundo. Pero la vista bien merece el esfuerzo. | Ничего особенного. Но вид стоит усилий."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "una gran extensión — большая площадь"
      - "extensión de terreno — участок земли"
      - "en toda su extensión — во всём объёме"
      - "por extensión — по аналогии"
    collocation_example: "La finca tiene una extensión de mil metros cuadrados. — Площадь участка тысяча квадратных метров."
    trap: "Extensión — не «экстенсивность»: это конкретная площадь или продление. Прилагательное — extenso, «обширный»."

  - word: llanura
    image: art/galya/llanura.png
    ru: равнина
    ipa: /ʎaˈnuɾa/
    say: йану́ра
    pron: "ll читается как [ʎ] или как русское «й» (в большинстве стран и у многих в Испании: йану́ра)."
    meaning: "Большая плоская поверхность без возвышенностей."
    examples:
      - "Es una llanura enorme y plana. — Это огромная ровная равнина."
      - "Por la zona manchega, en la llanura se cultivan cereales y se ven molinos de viento. — В этих местах на равнине Ла-Манча выращивают зерновые и видно мельницы."
      - "Cruzamos la llanura en tren durante horas y todo el paisaje era igual de plano. — Мы часами ехали через равнину на поезде, и весь пейзаж был одинаково плоским."
    origin: "От llano «ровный, плоский» (лат. planus «плоский») + -ura. Родственные: llano, plano, planicie."
    register: "Нейтральное, географическое."
    synonyms:
      - word: planicie
        pair: ["Una llanura inmensa.", "Una planicie inmensa."]
        diff:
          - "planicie — более книжное"
          - "llanura — обычное слово для географии"
    analogs:
      - "plain — равнина; flatland — ровная местность"
    dialogue:
      - "Ana: ¿Cómo es la región? | Какой этот регион?"
      - "Pablo: Una llanura enorme y plana, sin árboles. | Огромная, плоская равнина без деревьев."
      - "Ana: ¿Y el clima? | А климат?"
      - "Pablo: Extremo: calor en verano y mucho frío en invierno. Pero tiene un encanto único. | Экстремальный: жара летом и сильный холод зимой. Но у него особое очарование."
      - "Ana: ¿Hay mucha gente? | Там много людей?"
      - "Pablo: Poca. La población se concentra en pequeñas ciudades, a la orilla de los ríos. | Мало. Население сосредоточено в небольших городах на берегах рек."
      - "Ana: ¿Y qué se cultiva? | И что выращивают?"
      - "Pablo: Trigo, sobre todo. En verano la llanura parece un mar dorado. | В основном пшеницу. Летом равнина кажется золотым морем."
    cefr: "B2."
    frequency: "Среднее."
    collocations:
      - "una vasta llanura — обширная равнина"
      - "llanura costera — прибрежная равнина"
      - "la llanura manchega — равнина Ла-Манча"
    collocation_example: "La llanura de La Mancha es famosa por sus molinos. — Равнина Ла-Манчи знаменита мельницами."
    trap: "Llanura — существительное; llano бывает и существительным («равнина»), и прилагательным («ровный; простой»)."

  - word: superar
    image: art/galya/superar.png
    ru: превосходить, превышать, преодолевать
    ipa: /supeˈɾaɾ/
    say: супэра́р
    meaning: "Быть больше, лучше или выше, чем кто-то или что-то; также преодолеть трудность, пережить."
    examples:
      - "Superó el examen con buena nota. — Он сдал экзамен с хорошей оценкой."
      - "Todas nuestras expectativas fueron superadas y celebramos con una gran cena. — Все наши ожидания были превзойдены, и мы отпраздновали большим ужином."
      - "Superó la enfermedad con mucho valor y volvió a trabajar al cabo de un año. — Он мужественно преодолел болезнь и через год вернулся к работе."
    origin: "Лат. superare от super «над, выше». Родственные: superior, superficie, supermercado."
    register: "Нейтральное."
    synonyms:
      - word: sobrepasar
        pair: ["Superó el límite.", "Sobrepasó el límite."]
        diff:
          - "sobrepasar — «перейти предел», буквально «пройти поверх»"
          - "superar — шире: ещё и «преодолеть, превзойти»"
    analogs:
      - "to exceed, to surpass — превышать; to overcome — преодолеть"
    dialogue:
      - "Ana: ¿Aprobaste el examen? | Ты сдал экзамен?"
      - "Luis: Sí, superé el examen con buena nota. | Да, сдал экзамен с хорошей оценкой."
      - "Ana: ¡Felicidades! ¿Fue difícil? | Поздравляю! Было трудно?"
      - "Luis: Bastante. Pero saqué más puntos de los que esperaba. | Довольно. Но я набрал больше баллов, чем ждал."
      - "Ana: Te lo mereces. Estudiaste mucho. | Ты это заслужил. Ты много занимался."
      - "Luis: Sí, tuve que superar el miedo a suspender. Y también el cansancio. | Да, мне пришлось преодолеть страх завалить. И усталость."
      - "Ana: ¿Y ahora qué haces? | И что делаешь теперь?"
      - "Luis: Ahora descanso y lo paso bien. | Теперь отдыхаю и хорошо провожу время."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "superar un obstáculo — преодолеть препятствие"
      - "superar un examen — сдать экзамен"
      - "superar las expectativas — превзойти ожидания"
      - "superarse a sí mismo — превзойти себя"
    collocation_example: "Superó todos los obstáculos para conseguirlo. — Он преодолел все препятствия, чтобы этого добиться."
    trap: "Superar — прямое дополнение, без предлога: superar la crisis (не superar de la crisis). Возвратное superarse — «самосовершенствоваться»."

  - word: cordillera
    image: art/galya/cordillera.png
    ru: горная цепь, хребет
    ipa: /koɾðiˈʎeɾa/
    say: кордийе́ра
    pron: "d перед i мягкое [ð], ll как [ʎ] или «й»: кордийера."
    meaning: "Длинная цепь гор, составленная из нескольких хребтов."
    examples:
      - "Los Andes son una cordillera enorme. — Анды – огромная горная цепь."
      - "Cruzamos la cordillera en autobús y vimos desde la ventanilla cumbres cubiertas de nieve. — Мы пересекли хребет на автобусе и видели из окна вершины, покрытые снегом."
      - "La cordillera separa los dos países y solo se puede cruzar por unos pocos pasos. — Горная цепь разделяет две страны, и её можно пересечь только через несколько перевалов."
    origin: "От cordilla (уменьшительное от cuerda «верёвка») + -era: «цепь, как верёвка». Родственные: cuerda, cordón, cordel."
    register: "Нейтральное, географическое."
    synonyms:
      - word: sierra
        pair: ["La cordillera nevada.", "La sierra nevada."]
        diff:
          - "sierra — менее высокая цепь гор, с зубцами (вроде пилы)"
          - "cordillera — крупная система хребтов"
    analogs:
      - "mountain range — горная цепь; chain — цепь"
    dialogue:
      - "Ana: ¿Cuál es la cordillera más larga del mundo? | Какой самый длинный горный хребет в мире?"
      - "Pablo: Los Andes. Es una cordillera enorme que recorre casi toda Sudamérica. | Анды. Это огромный хребет, проходящий почти по всей Южной Америке."
      - "Ana: ¿Cuánto mide? | Какой он длины?"
      - "Pablo: Unos siete mil kilómetros, por lo visto. Supera con mucho a las demás cordilleras. | Около семи тысяч километров, судя по всему. Намного превосходит остальные хребты."
      - "Ana: ¿Y en España? | А в Испании?"
      - "Pablo: Los Pirineos, la cordillera Cantábrica y Sierra Nevada. Todas tienen un encanto especial. | Пиренеи, Кантабрийские горы и Сьерра-Невада. У каждой особое очарование."
      - "Ana: ¿Has subido a alguna? | Ты поднимался на какую-нибудь?"
      - "Pablo: A Sierra Nevada. Asistí a un cursillo de montaña y pasé una semana inolvidable. | На Сьерра-Неваду. Я прошёл горный курс и провёл незабываемую неделю."
    cefr: "B1."
    frequency: "Среднее."
    collocations:
      - "cordillera de los Andes — Анды"
      - "cruzar la cordillera — пересечь хребет"
      - "cordillera cantábrica — Кантабрийские горы"
    collocation_example: "La cordillera cantábrica separa la costa del interior. — Кантабрийские горы отделяют побережье от внутренней части."
    trap: "Не путайте с montaña (одна гора, горы вообще) и sierra (меньший хребет)."

  - word: perpetuo
    image: art/galya/perpetuo.png
    ru: вечный, постоянный, пожизненный
    ipa: /peɾˈpetwo/
    say: пэрпэ́туо
    meaning: "Продолжающийся без конца или на всю жизнь: вечный, непрерывный."
    examples:
      - "Lo condenaron a cadena perpetua. — Его приговорили к пожизненному заключению."
      - "En la cima de la montaña hay nieve perpetua incluso en pleno verano. — На вершине горы лежит вечный снег даже в разгар лета."
      - "Vivían en perpetuo temor a que algún día volviera la guerra a su pueblo. — Они жили в постоянном страхе, что однажды война вернётся в их селение."
    origin: "Лат. perpetuus «непрерывный» (perpes «беспрерывный»). Родственные: perpetuar «увековечивать», perpetuidad."
    register: "Книжное, формальное."
    synonyms:
      - word: eterno
        pair: ["Es una nieve perpetua.", "Es una nieve eterna."]
        diff:
          - "eterno — «вечный» в самом широком смысле, чувства, время"
          - "perpetuo — «непрерывный, пожизненный», чаще в терминах"
    analogs:
      - "perpetual — вечный, бесконечный; eternal — вечный"
    dialogue:
      - "Ana: ¿Qué pena le dieron? | Какой приговор ему вынесли?"
      - "Luis: Lo condenaron a cadena perpetua. | Его приговорили к пожизненному заключению."
      - "Ana: ¡Qué duro! ¿Qué hizo? | Какой суровый! Что он сделал?"
      - "Luis: Mató a dos personas. Por lo visto, lo planeó durante meses. | Убил двух человек. Судя по всему, он планировал это месяцами."
      - "Ana: ¿Y está arrepentido? | И он раскаивается?"
      - "Luis: No lo parece. No dijo ni una palabra en el juicio. | Не похоже. Он не сказал ни слова на суде."
      - "Ana: Qué triste. ¿Y las familias? | Как грустно. А семьи?"
      - "Luis: Tienen un dolor perpetuo, pero ahora dicen que pueden descansar un poco. | У них вечная боль, но теперь, говорят, они могут немного отдохнуть."
    cefr: "C1."
    frequency: "Нечастое."
    collocations:
      - "cadena perpetua — пожизненное заключение"
      - "nieves perpetuas — вечные снега"
      - "movimiento perpetuo — вечный двигатель"
    collocation_example: "Los glaciares tienen nieves perpetuas. — На ледниках лежат вечные снега."
    trap: "Perpetuo — прилагательное, наречие — perpetuamente. Не путайте с perpendicular «перпендикулярный»."

  - word: estar hecho de
    image: art/galya/estar_hecho_de.png
    ru: состоять из, быть сделанным из
    ipa: /esˈtaɾ ˈetʃo ðe/
    say: эста́р э́чо дэ
    pron: "h не читается; hecho — [ˈetʃo]."
    meaning: "Описывает материал или состав: из чего сделан предмет."
    examples:
      - "La mesa está hecha de madera. — Стол сделан из дерева."
      - "Estas ventanas, que son nuevas, están hechas de madera y de cristal reciclado. — Эти окна, новые, сделаны из дерева и переработанного стекла."
      - "El puente está hecho de hierro y piedra y tiene más de cien años. — Мост сделан из железа и камня, и ему больше ста лет."
    origin: "Hecho — причастие от hacer (лат. facere). Родственные: hacer, deshacer, hechizo, fechoría."
    register: "Нейтральное."
    synonyms:
      - word: estar fabricado en
        pair: ["Está hecho de acero.", "Está fabricado en acero."]
        diff:
          - "fabricado — «изготовлен», производство"
          - "hecho de — просто материал"
    analogs:
      - "to be made of — быть сделанным из; to consist of — состоять из"
    dialogue:
      - "Ana: ¿De qué está hecha esta mesa? | Из чего сделан этот стол?"
      - "Pablo: Está hecha de madera de roble. | Он сделан из дубового дерева."
      - "Ana: ¿Y las sillas? | А стулья?"
      - "Pablo: Están hechas de metal y plástico. Por lo visto, combinan bien con la mesa. | Из металла и пластика. Судя по всему, они хорошо сочетаются со столом."
      - "Ana: ¿Y el suelo? | А пол?"
      - "Pablo: Está hecho de piedra. Esta casa posee un encanto antiguo, pero cómodo. | Из камня. У этого дома старинное, но удобное очарование."
      - "Ana: ¿Y tú? ¿De qué estás hecho tú? | А ты? Из чего ты сделан?"
      - "Pablo: De paciencia y café, sobre todo. | Из терпения и кофе, в основном."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "estar hecho de madera — сделан из дерева"
      - "estar hecho a mano — сделан вручную"
      - "estar hecho polvo — быть без сил (разг.)"
    collocation_example: "Esta bufanda está hecha a mano. — Этот шарф сделан вручную."
    trap: "Hecho согласуется с подлежащим: mesa hecha, muros hechos. Материал вводится предлогом de."

  - word: exquisito
    image: art/galya/exquisito.png
    ru: изысканный, превосходный, очень вкусный
    ipa: /ekskiˈsito/
    say: экскиси́то
    pron: "x = [ks]; qu = [k], u не звучит."
    meaning: "Очень хорошего качества: тонкий, изысканный; чаще всего о еде, вкусе, манерах."
    examples:
      - "Es una persona de modales exquisitos. — Это человек с изысканными манерами."
      - "La cena estuvo exquisita: pescado fresco, verduras de la huerta y un postre casero. — Ужин был превосходным: свежая рыба, овощи с огорода и домашний десерт."
      - "Nos recibió con un trato exquisito y se aseguró de que no nos faltara nada. — Нас приняли с изысканной любезностью и позаботились, чтобы нам ни в чём не было недостатка."
    origin: "Лат. exquisitus «тщательно подобранный» (ex- + quaerere «искать»). Родственные от quaerere: conquistar, adquirir, requerir, inquisición."
    register: "Нейтральное, возвышенное."
    synonyms:
      - word: delicioso
        pair: ["Es un plato exquisito.", "Es un plato delicioso."]
        diff:
          - "delicioso — «очень вкусный», чисто вкус"
          - "exquisito — ещё и «тонкий, утончённый»"
    analogs:
      - "exquisite — изысканный; delicious — вкусный"
    dialogue:
      - "Ana: ¿Qué tal el restaurante? | Как ресторан?"
      - "Luis: Exquisito. La comida estaba riquísima y el servicio fue muy bueno. | Изысканно. Еда была очень вкусная, а обслуживание очень хорошее."
      - "Ana: ¿Qué pediste? | Что ты заказал?"
      - "Luis: Pescado a la plancha y una tarta de queso exquisita. | Рыбу на гриле и изумительный чизкейк."
      - "Ana: ¿Y el ambiente? | А атмосфера?"
      - "Luis: Elegante, con música suave. Los camareros eran muy amables. | Элегантная, с тихой музыкой. Официанты были очень любезны."
      - "Ana: ¿Está en el centro? | Он в центре?"
      - "Luis: Sí, junto a la plaza. Es un poco caro, pero merece la pena. | Да, возле площади. Он немного дорогой, но оно того стоит."
      - "Ana: Pues vamos juntos un día. | Тогда как-нибудь сходим вместе."
      - "Luis: Claro, cuando quieras. | Конечно, когда захочешь."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "sabor exquisito — изысканный вкус"
      - "gusto exquisito — тонкий вкус"
      - "trato exquisito — безупречное обхождение"
    collocation_example: "Nos recibió con un trato exquisito. — Нас встретили с изысканной любезностью."
    trap: "Exquisito — не «странный» и не «экзотический». И qu перед i даёт [k]: экскисито."

  - word: aproximado
    image: art/galya/aproximado.png
    ru: примерный, приблизительный
    ipa: /apɾoksiˈmaðo/
    say: апроксима́до
    pron: "x = [ks]; d между гласными мягкое."
    meaning: "Не точный, но близкий к реальному: примерный, приблизительный."
    examples:
      - "Es solo un cálculo aproximado. — Это лишь приблизительный расчёт."
      - "El precio aproximado del viaje es de mil euros, sin contar el alojamiento. — Примерная стоимость поездки – тысяча евро, не считая проживания."
      - "El tiempo aproximado del trayecto es de dos horas, si no hay mucho tráfico. — Примерное время в пути – два часа, если нет больших пробок."
    origin: "Причастие от aproximar (лат. approximare: ad- + proximus «ближайший»). Родственные: próximo, proximidad, aproximadamente «примерно»."
    register: "Нейтральное, деловое."
    synonyms:
      - word: aproximativo
        pair: ["Es un cálculo aproximado.", "Es un cálculo aproximativo."]
        diff:
          - "aproximativo — «приближённый» (как метод), более технично"
          - "aproximado — обычное «примерный»"
    analogs:
      - "approximate — приблизительный; rough — грубый, примерный"
    dialogue:
      - "Ana: ¿Cuántos invitados habrá? | Сколько будет гостей?"
      - "Pablo: Un cálculo aproximado: unos cuarenta. | Примерный расчёт: человек сорок."
      - "Ana: ¿Seguro? Antes dijiste treinta. | Уверен? Раньше ты говорил тридцать."
      - "Pablo: Es solo un número aproximado. Todavía no se han confirmado todos. | Это лишь приблизительная цифра. Не все ещё подтвердили."
      - "Ana: ¿Y cuánto costará aproximadamente? | И сколько это будет стоить примерно?"
      - "Pablo: Aproximadamente dos mil euros. Elaboramos un presupuesto detallado la semana que viene. | Примерно две тысячи евро. Подробную смету составим на следующей неделе."
      - "Ana: Vale. ¿Y la hora? | Хорошо. А время?"
      - "Pablo: Hora aproximada de llegada, las ocho. Aunque todos suelen tardar. | Примерное время прихода — восемь. Хотя все обычно опаздывают."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "cálculo aproximado — приблизительный расчёт"
      - "cifra aproximada — примерная цифра"
      - "precio aproximado — ориентировочная цена"
      - "aproximadamente — примерно"
    collocation_example: "La cifra aproximada es de diez mil personas. — Примерная цифра — десять тысяч человек."
    trap: "Согласуется: aproximada, aproximados. Наречие — aproximadamente. В речи его часто заменяют на más o menos «плюс-минус»."

  - word: población
    image: art/galya/poblacion.png
    ru: население; населённый пункт
    ipa: /poβlaˈθjon/
    say: побласьо́н
    pron: "b между гласными мягкое [β]; c перед i — [θ] в Испании, в Америке — «с»."
    meaning: "Все жители страны или города (население); также сам населённый пункт (город, городок)."
    examples:
      - "Vivo en una población pequeña. — Я живу в небольшом населённом пункте."
      - "La población del país supera los cuarenta millones de habitantes y sigue creciendo. — Население страны превышает сорок миллионов жителей и продолжает расти."
      - "La población local recibió a los visitantes con mucha amabilidad y les ofreció comida. — Местные жители очень приветливо встретили гостей и угостили их едой."
    origin: "От poblar «заселять» (лат. populus «народ»). Родственные: pueblo, popular, poblado «поселение»."
    register: "Нейтральное."
    synonyms:
      - word: habitantes
        pair: ["La población es de diez mil.", "Hay diez mil habitantes."]
        diff:
          - "habitantes — «жители», конкретные люди"
          - "población — «население», коллективно, как статистика"
    analogs:
      - "population — население; town — населённый пункт"
    dialogue:
      - "Ana: ¿Cuánta población tiene tu ciudad? | Сколько населения в твоём городе?"
      - "Luis: Unos cien mil habitantes. Es una población mediana. | Около ста тысяч жителей. Это средний по размеру город."
      - "Ana: ¿Y el pueblo de tus padres? | А городок твоих родителей?"
      - "Luis: Es una población pequeña, de unos dos mil habitantes. Todos se conocen. | Это небольшой населённый пункт, примерно две тысячи жителей. Все друг друга знают."
      - "Ana: ¿Y la población crece? | И население растёт?"
      - "Luis: No, al contrario. Los jóvenes se van a las ciudades y se quedan los mayores. | Нет, наоборот. Молодёжь уезжает в города, а остаются пожилые."
      - "Ana: Qué pena. Es un problema en muchos pueblos. | Как жаль. Это проблема во многих городках."
      - "Luis: Sí. Por eso el pueblo da ayudas a las familias nuevas. | Да. Поэтому городок помогает новым семьям."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "población activa — трудоспособное население"
      - "crecimiento de la población — рост населения"
      - "población local — местное население"
      - "población mundial — население мира"
    collocation_example: "La población mundial supera los ocho mil millones. — Население мира превышает восемь миллиардов."
    trap: "Единственное число población — «население»; множественное poblaciones чаще «населённые пункты». Не путайте с pueblo («село, народ»)."

  - word: varios
    image: art/galya/varios.png
    ru: несколько, разные
    ipa: /ˈbaɾjos/
    say: ба́риос
    pron: "v звучит как [b]."
    meaning: "Больше двух, но не очень много; ещё — «разные, различные». Используется во множественном числе: varios, varias."
    examples:
      - "Hay varios coches en el garaje. — В гараже несколько машин."
      - "Cuando llegué a la ciudad, me ayudaron mucho varios amigos de Madrid. — Когда я приехал в город, мне очень помогли несколько друзей из Мадрида."
      - "Lo intenté varias veces, pero la puerta no se abrió con ninguna de las llaves. — Я пробовал несколько раз, но дверь не открылась ни одним из ключей."
    origin: "Лат. varius «разный, пёстрый». Родственные: variar «меняться», variedad, vario, variable."
    register: "Нейтральное."
    synonyms:
      - word: algunos
        pair: ["Hay varios libros en la mesa.", "Hay algunos libros en la mesa."]
        diff:
          - "algunos — «некоторые», без оттенка количества"
          - "varios — «несколько» (больше двух), с оттенком «разные»"
    analogs:
      - "several — несколько; various — «разные» совпадает только частично"
    dialogue:
      - "Ana: ¿Cuántas veces has estado en Roma? | Сколько раз ты был в Риме?"
      - "Pablo: Varias, no sabría decirte cuántas. | Несколько, не скажу точно сколько."
      - "Ana: ¿Y qué es lo que más te gusta? | И что тебе там больше всего нравится?"
      - "Pablo: Hay varios sitios que me encantan: el Panteón, una plaza pequeña y varios cafés. | Есть несколько мест, которые я обожаю: Пантеон, маленькая площадь и несколько кафе."
      - "Ana: Yo solo he ido una vez. Pasé por varias calles y me perdí. | Я была лишь один раз. Прошла по нескольким улицам и заблудилась."
      - "Pablo: Es normal. Hay varios caminos y todos parecen iguales. | Это нормально. Много дорог, и все кажутся одинаковыми."
      - "Ana: Pues enséñame tú los varios rincones que conoces. | Тогда покажи мне те уголки, которые ты знаешь."
      - "Pablo: Será un placer. Elegimos varios días y organizamos un viaje. | С удовольствием. Выберем несколько дней и организуем поездку."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "varias veces — несколько раз"
      - "varios días — несколько дней"
      - "varias personas — несколько человек"
    collocation_example: "Esperé varios minutos en la puerta. — Я прождал несколько минут у двери."
    trap: "Varios — только во множественном числе в значении «несколько». В единственном числе vario — «разнообразный, переменчивый», редкость."

  - word: elaborar
    image: art/galya/elaborar.png
    ru: производить, готовить, составлять
    ipa: /elaβoˈɾaɾ/
    say: элабора́р
    pron: "b между гласными мягкое [β]."
    meaning: "Создавать продукт или документ в несколько этапов: приготовить, изготовить, разработать, составить."
    examples:
      - "Elaboran pan artesanal cada mañana. — Каждое утро они пекут хлеб кустарным способом."
      - "Con leche de las ovejas de la zona, en este pueblo elaboran queso artesanal. — Из молока местных овец в этом селе делают сыр кустарным способом."
      - "Este vino se elabora con uvas de viñedos antiguos y envejece en barricas de roble. — Это вино делают из винограда старых виноградников, и оно выдерживается в дубовых бочках."
    origin: "Лат. elaborare: e- «из» + laborare «трудиться». Родственные: labor, laboratorio, colaborar, laborioso."
    register: "Нейтральное, формальное."
    synonyms:
      - word: preparar
        pair: ["Elaboró un informe.", "Preparó un informe."]
        diff:
          - "preparar — обиходное «подготовить, приготовить»"
          - "elaborar — подчёркивает длительную и тщательную работу"
    analogs:
      - "to produce, to make — производить; to draw up — составлять"
    dialogue:
      - "Ana: ¿Quién elaboró este plan? | Кто составил этот план?"
      - "Luis: Lo elaboramos entre varios compañeros, durante dos semanas. | Мы составили его вместе, несколькими коллегами, за две недели."
      - "Ana: ¿Y es definitivo? | И он окончательный?"
      - "Luis: No, es aproximado. Elaboramos una primera versión, y falta el informe final. | Нет, он приблизительный. Мы подготовили первую версию, и не хватает итогового отчёта."
      - "Ana: ¿Cómo lo elaboráis? | Как вы это составляете?"
      - "Luis: Reunimos datos y los ordenamos. Elaborar un buen plan exige paciencia. | Собираем данные и упорядочиваем. Составить хороший план требует терпения."
      - "Ana: Parece un gran trabajo. | Похоже на большую работу."
      - "Luis: Lo es. Pero cuando sale bien, el resultado causa muy buena impresión. | Так и есть. Но когда получается, результат производит очень хорошее впечатление."
    cefr: "B2."
    frequency: "Частое в деловых текстах."
    collocations:
      - "elaborar un plan — разработать план"
      - "elaborar un informe — составить отчёт"
      - "elaborar un producto — производить продукт"
      - "elaborar una teoría — выработать теорию"
    collocation_example: "El chef elaboró un menú especial. — Шеф-повар составил специальное меню."
    trap: "Elaborar не значит «детализировать» (to elaborate on): оно про создание чего-то сложного, а не про «распространиться на тему»."

  - word: encanto
    image: art/galya/encanto.png
    ru: прелесть, очарование, чудо
    ipa: /eŋˈkanto/
    say: энка́нто
    pron: "n перед k звучит как [ŋ]."
    meaning: "Притягательность места, человека или вещи; ещё — волшебство, заклинание."
    examples:
      - "Qué encanto tiene esta casita. — Какое очарование у этого домика."
      - "Decidió quedarse a vivir en la ciudad porque cayó bajo su encanto. — Он решил остаться жить в городе, потому что попал под его очарование."
      - "Este pueblo tiene mucho encanto, con sus callejuelas estrechas y sus balcones llenos de flores. — В этом городке много очарования: узкие улочки и балконы, полные цветов."
    origin: "Лат. incantare «заколдовывать» (in- + cantare «петь»): заклинания пели. Родственные: encantar «очаровывать, нравиться», encantador «очаровательный», canto."
    register: "Нейтральное, лёгкое поэтическое."
    synonyms:
      - word: atractivo
        pair: ["Tiene mucho encanto.", "Tiene mucho atractivo."]
        diff:
          - "atractivo — «привлекательность», более рациональное"
          - "encanto — «очарование», чувство и атмосфера"
    analogs:
      - "charm — очарование; spell — чары"
    dialogue:
      - "Ana: ¿Te gusta la casa? | Тебе нравится дом?"
      - "Pablo: Mucho. Qué encanto tiene esta casita, con su jardín y su chimenea. | Очень. Какое очарование у этого домика, с садом и камином."
      - "Ana: ¿Es antigua? | Он старый?"
      - "Pablo: Del siglo pasado. Está hecha de piedra y madera, y posee un encanto especial. | Прошлого века. Сделан из камня и дерева, и обладает особым очарованием."
      - "Ana: ¿Y el barrio? | А район?"
      - "Pablo: Tranquilo, con mucho ambiente. Todo aquí tiene encanto, hasta las calles. | Спокойный, с хорошей атмосферой. Здесь всё имеет свою прелесть, даже улицы."
      - "Ana: ¿Piensas instalarte aquí? | Ты думаешь обосноваться здесь?"
      - "Pablo: Sí, si consigo el préstamo. Sería un sueño. | Да, если получу кредит. Это было бы мечтой."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "tener encanto — быть очаровательным"
      - "un lugar con encanto — уютное, обаятельное место"
      - "encanto natural — природная прелесть"
      - "como por encanto — как по волшебству"
    collocation_example: "Todo cambió como por encanto. — Всё изменилось как по волшебству."
    trap: "Не путайте с encantar («очень нравиться»): me encanta la casa. Ещё есть значение «чары»: romper el encanto."

  - word: tener lugar
    image: art/galya/tener_lugar.png
    ru: происходить, проходить, состояться
    ipa: /teˈneɾ luˈɣaɾ/
    say: тэнэ́р луга́р
    meaning: "О событии: произойти, состояться в определённое время или в определённом месте."
    examples:
      - "¿Dónde tiene lugar la boda? — Где проходит свадьба?"
      - "El concierto tuvo lugar en la plaza mayor y asistieron miles de personas. — Концерт прошёл на главной площади, и на нём были тысячи людей."
      - "La reunión tendrá lugar el lunes a las diez en la sala grande del segundo piso. — Встреча состоится в понедельник в десять часов в большом зале на втором этаже."
    origin: "Tener «иметь» + lugar (лат. locus «место»): «иметь место». Родственные: lugar, local, localizar."
    register: "Нейтральное, формальное; новости и объявления."
    synonyms:
      - word: celebrarse
        pair: ["La final tendrá lugar en Madrid.", "La final se celebrará en Madrid."]
        diff:
          - "celebrarse — «проводиться» (организованное событие)"
          - "tener lugar — нейтральнее, годится и для случайных происшествий"
    analogs:
      - "to take place — произойти, состояться"
    dialogue:
      - "Ana: ¿Cuándo tiene lugar la ceremonia? | Когда состоится церемония?"
      - "Luis: El sábado a las doce, en la iglesia del pueblo. | В субботу в двенадцать, в церкви городка."
      - "Ana: ¿Dónde tiene lugar la boda? | А где проходит свадьба?"
      - "Luis: En una finca situada a unos veinte kilómetros. Tiene lugar al aire libre, si no llueve. | В усадьбе, расположенной в двадцати километрах. Проходит на открытом воздухе, если не будет дождя."
      - "Ana: ¿Y si llueve? | А если будет дождь?"
      - "Luis: Por lo visto, hay una sala preparada. Aunque la ceremonia no tendrá lugar allí. | Судя по всему, подготовлен зал. Хотя церемония там проходить не будет."
      - "Ana: ¿Y la fiesta? | А праздник?"
      - "Luis: La fiesta tiene lugar después, con baile y música hasta la madrugada. | Праздник состоится после, с танцами и музыкой до рассвета."
    cefr: "B1."
    frequency: "Частое в новостях."
    collocations:
      - "tener lugar — произойти, состояться"
      - "tener lugar un accidente — произойти (об аварии)"
      - "dar lugar a — привести к"
      - "en lugar de — вместо"
    collocation_example: "El accidente tuvo lugar de madrugada. — Авария произошла рано утром."
    trap: "Подлежащее — событие: la reunión tiene lugar. Артикля нет: tener un lugar — это уже «иметь место, пространство»."

  - word: orilla
    image: art/galya/orilla.png
    ru: берег
    ipa: /oˈɾiʎa/
    say: ори́йя
    pron: "ll читается как [ʎ] или как «й»: ори́йя; r между гласными одноударная."
    meaning: "Край воды: берег реки, озера, моря; ещё — край чего-либо, кайма."
    examples:
      - "Se sentó en la orilla del río. — Он сел на берегу реки."
      - "Mi pueblo está a orillas del Ebro y cada primavera se llena de turistas. — Мой городок стоит на берегах Эбро и каждую весну наполняется туристами."
      - "Nos sentamos en la orilla del río a comer el bocadillo y a ver pasar los barcos. — Мы сели на берегу реки поесть бутерброды и посмотреть, как проплывают лодки."
    origin: "От orla «кайма, край» (лат. ora «край, берег») + -illa. Родственные: orla, orillar, a orillas de."
    register: "Нейтральное."
    synonyms:
      - word: ribera
        pair: ["Paseamos por la orilla.", "Paseamos por la ribera."]
        diff:
          - "ribera — береговая полоса, речной берег, чуть поэтичнее"
          - "orilla — именно край воды"
    analogs:
      - "shore, bank — берег; edge — край"
    dialogue:
      - "Ana: ¿Dónde vamos a comer? | Где будем обедать?"
      - "Pablo: En la orilla del río. Hay mesas debajo de los árboles. | На берегу реки. Там есть столы под деревьями."
      - "Ana: ¿Está lejos? | Далеко?"
      - "Pablo: No, a diez minutos andando. Nos sentamos junto al agua. | Нет, в десяти минутах пешком. Сядем у воды."
      - "Ana: ¿Llevamos algo? | Возьмём что-нибудь?"
      - "Pablo: Pan, queso y fruta. Además, allí venden bocadillos. | Хлеб, сыр и фрукты. К тому же там продают бутерброды."
      - "Ana: Genial. ¿Y para pasarlo bien? | Отлично. А чтобы хорошо провести время?"
      - "Pablo: Una manta, una guitarra y mucho sol. La orilla es un sitio muy bonito. | Плед, гитара и много солнца. Берег — очень красивое место."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "a orillas de — на берегах"
      - "la orilla del mar — берег моря"
      - "la orilla del río — берег реки"
      - "orilla opuesta — противоположный берег"
    collocation_example: "El pueblo está a orillas del Duero. — Городок стоит на берегах Дуэро."
    trap: "Orilla — берег у воды, но не «побережье»: побережье — costa, а «пляж» — playa. Для моря обычно la orilla del mar."

  - word: tardar en
    image: art/galya/tardar_en.png
    ru: тратить время на; задерживаться, медлить
    ipa: /taɾˈðaɾ en/
    say: тарда́р эн
    pron: "d перед a мягкое [ð]."
    meaning: "Требовать времени: «сколько времени уходит на что-то». С инфинитивом: tardar en + inf."
    examples:
      - "Tardé una hora en llegar. — Мне понадобился час, чтобы добраться."
      - "Cuando tienes que salir deprisa, ¿cuánto tardas en vestirte por las mañanas? — Когда нужно быстро выходить, сколько тебе нужно времени, чтобы одеться утром?"
      - "No tardes en volver, que la comida se enfría y todos te están esperando. — Не задерживайся, возвращайся скорее: еда остывает, и тебя все ждут."
    origin: "От tarde (лат. tarde «поздно»). Родственные: tarde, tardío, tardanza «задержка», atardecer."
    register: "Нейтральное, обиходное."
    synonyms:
      - word: demorar
        pair: ["Tardó en responder.", "Demoró en responder."]
        diff:
          - "demorar — чаще в Латинской Америке"
          - "tardar — основное слово в Испании"
    analogs:
      - "to take (time) — занимать время; to be long — задерживаться"
    dialogue:
      - "Ana: ¿Cuánto tardas en llegar a la oficina? | Сколько ты добираешься до офиса?"
      - "Luis: Tardo una hora, aunque la distancia es corta. | Час, хотя расстояние небольшое."
      - "Ana: ¿Tanto? ¿Por el tráfico? | Так долго? Из-за пробок?"
      - "Luis: Sí, tardé una hora ayer, y hoy tardé aún más. Y eso que me levanto temprano. | Да, вчера я потратил час, а сегодня ещё больше. И это притом, что я встаю рано."
      - "Ana: ¿Y por qué no te trasladas más cerca? | А почему не переедешь ближе?"
      - "Luis: Tardaría en encontrar un piso bueno y barato. No me importa tardar un poco más. | Я бы долго искал хорошую и недорогую квартиру. Мне не жалко потратить чуть больше времени."
      - "Ana: Pues no tardes en avisarme si cambias de opinión. | Тогда не медли сообщить мне, если передумаешь."
      - "Luis: Descuida. No tardaré. | Не волнуйся. Не задержусь."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "tardar en + infinitivo — потратить время на"
      - "tardar poco — быстро справиться"
      - "tardar mucho — долго возиться"
      - "sin tardar — без промедления"
    collocation_example: "El tren no tardará en llegar. — Поезд скоро прибудет."
    trap: "Tardar en + инфинитив (потратить время), а не tardar de. И не путайте с llegar tarde — «прийти поздно»."
