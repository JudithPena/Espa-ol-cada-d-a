# Четвёртый список Гали (1 слово). Примеры A1 / A2 / B1–B2, мини-диалог 4 строки, уровень A2–B1.
lang: es
words:
  - word: suspender
    image: art/galya/suspender.png
    ru: провалить (экзамен), отменить, приостановить
    ipa: /suspenˈdeɾ/
    say: суспэндэ́р
    pron: "s перед p слабая; d между гласными звучит мягко; ударение на последнем слоге."
    meaning: "Три главных значения. 1) Поставить неудовлетворительную оценку или не сдать экзамен: suspender un examen, suspender a alguien. 2) Приостановить или отменить на время: suspender una reunión, un concierto, un servicio. 3) Повесить, подвесить (книжнее)."
    examples:
      - "Ayer suspendí el examen de matemáticas por unos errores tontos. — Вчера я провалил экзамен по математике из-за нескольких глупых ошибок."
      - "Han suspendido el concierto de esta noche porque llueve mucho. — Сегодняшний концерт отменили, потому что идёт сильный дождь."
      - "Aunque estudió todo el año, el profesor la suspendió por no entregar el trabajo final. — Хотя она училась весь год, преподаватель поставил ей неудовлетворительную оценку за то, что она не сдала итоговую работу."
    origin: "Лат. suspendere «подвешивать»: sub- «под» + pendere «висеть». Родственные: suspensión «приостановка», suspenso «неудовлетворительная оценка», suspense «напряжённое ожидание»."
    register: "Нейтральное. В значении «провалить экзамен» — обиходное слово школ и университетов Испании."
    synonyms:
      - word: cancelar
        pair: ["Han suspendido el partido por la lluvia.", "Han cancelado el partido por la lluvia."]
        diff:
          - "cancelar — отменить совсем, как правило, без новой даты"
          - "suspender — прервать или отложить: событие могут перенести"
      - word: reprobar
        pair: ["Suspendí el examen de química.", "Reprobé el examen de química."]
        diff:
          - "reprobar — вариант Латинской Америки (Мексика и др.)"
          - "suspender — стандартное слово в Испании"
    analogs:
      - "to fail (an exam) — провалить; to suspend — приостановить, отстранить (в этом значении похоже); to cancel — отменить"
    dialogue:
      - "Ana: ¿Vas a asistir al concierto de esta noche? | Ты пойдёшь на сегодняшний концерт?"
      - "Luis: No, lo han suspendido por la lluvia. | Нет, его отменили из-за дождя."
      - "Ana: Qué pena. Aunque hoy tampoco tengo ganas de salir. | Жаль. Хотя мне сегодня тоже не хочется выходить."
      - "Luis: Yo, en cambio, tengo que estudiar: no quiero suspender el examen. | А мне, наоборот, надо учиться: не хочу провалить экзамен."
    cefr: "B1."
    frequency: "Частое: в школе, в новостях об отменах и в рабочих разговорах."
    collocations:
      - "suspender un examen / una asignatura — провалить экзамен / предмет"
      - "suspender a alguien — поставить кому-то «неуд»"
      - "suspender un acto, un vuelo, un partido — отменить мероприятие, рейс, матч"
      - "suspender un pago — приостановить платёж"
    collocation_example: "Suspendieron el vuelo por la niebla. — Рейс отменили из-за тумана."
    trap: "В Испании «Suspendí el examen» — «я его провалил»; не путайте с aprobar «сдать». В Латинской Америке для «провалить» чаще говорят reprobar. А suspender a alguien — это учитель «заваливает» ученика: «El profesor me suspendió»."
