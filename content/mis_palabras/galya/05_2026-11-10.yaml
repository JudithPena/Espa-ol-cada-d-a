# Пятый список Гали: 18 слов в порядке автора; habitual и soportar — отдельные слова.
# Примеры A1 / A2 / B1–B2; мини-сцены A2–B1 с повторением прежней лексики.
# Сверка этимологии: https://dle.rae.es/arrojar ; https://dle.rae.es/lechuza ; https://dle.rae.es/volante
lang: es
words:
  - word: corpulento
    ru: крупный, массивного телосложения
    ipa: /koɾpuˈlento/
    say: корпулэ́нто
    meaning: "Так говорят о человеке с крупным, массивным телом. Слово описывает телосложение, а не обязательно лишний вес. Женская форма — corpulenta."
    examples:
      - "Mi hermano es corpulento y necesita una cama grande. — Мой брат крупный, и ему нужна большая кровать."
      - "Un hombre corpulento nos ayudó a subir las maletas al tren. — Мужчина крупного телосложения помог нам поднять чемоданы в поезд."
      - "Aunque era corpulento, se movía con una agilidad que sorprendía a todos. — Хотя он был массивного телосложения, он двигался с ловкостью, которая всех удивляла."
    origin: "Происходит от латинского corpulentus, связанного с corpus «тело». Родственные испанские слова — cuerpo «тело» и corpulencia «крупное телосложение»."
    register: "Нейтральное описательное слово. Часто встречается в портретах персонажей и описаниях внешности."
    synonyms:
      - word: robusto
        pair: ["El portero es corpulento.", "El portero es robusto."]
        diff: ["Corpulento подчёркивает размеры тела; robusto — крепость и силу, даже при небольшом росте."]
    analogs: ["burly — крупный и крепкий; corpulent по-английски чаще подчёркивает полноту и звучит книжно."]
    dialogue:
      - "Ana: El albañil nuevo es muy corpulento. | Новый каменщик очень крупный."
      - "Pablo: Sí, va a encargarse de mover esas piedras. | Да, он займётся переноской этих камней."
      - "Ana: Aunque parece fuerte, voy a ayudarlo. | Хотя он выглядит сильным, я ему помогу."
      - "Pablo: Yo también; entre todos tardaremos menos. | Я тоже; все вместе мы потратим меньше времени."
    cefr: "B2 — точное описание телосложения вместо общего grande."
    frequency: "Умеренно частое слово в художественных текстах и описаниях людей."
    collocations:
      - "un hombre corpulento — мужчина крупного телосложения"
      - "una mujer corpulenta — женщина крупного телосложения"
      - "de aspecto corpulento — массивный на вид"
    collocation_example: "Un hombre corpulento abrió la puerta. — Мужчина крупного телосложения открыл дверь."
    trap: "Corpulento не означает «мускулистый»: для этого есть musculoso. Форму согласуют с человеком: una mujer corpulenta."

  - word: rollizo
    ru: пухлый, упитанный
    ipa: /roˈʝiθo/
    say: ройи́со
    pron: "Начальная r произносится раскатисто; ll в большей части Испании звучит как /ʝ/, а z — как межзубное /θ/. Приблизительное «с» не передаёт этот звук точно."
    meaning: "Описывает округлое, полное тело, особенно у ребёнка или животного. Женская форма — rolliza. В зависимости от контекста звучит ласково или может задеть человека."
    examples:
      - "El bebé es rollizo y tiene las mejillas muy suaves. — Малыш пухлый, и у него очень мягкие щёки."
      - "De pequeña era una niña rolliza y siempre tenía hambre. — В детстве она была пухлой девочкой и всегда хотела есть."
      - "El gato, antes delgado, se había vuelto rollizo desde que vivía con nosotros. — Раньше кот был худым, но с тех пор как он жил с нами, он стал упитанным."
    origin: "Связано со словом rollo «рулон, валик»: исходный образ — что-то округлое, цилиндрическое. Суффикс -izo образует прилагательное."
    register: "Описательное, нередко ласковое о младенцах и животных. В разговоре о взрослом требует такта."
    synonyms:
      - word: regordete
        pair: ["Es un bebé rollizo.", "Es un bebé regordete."]
        diff: ["Regordete обычно звучит более разговорно и ласково; rollizo чаще встречается в описаниях."]
    analogs: ["plump / chubby — округлый, пухлый; chubby особенно часто говорят о детях."]
    dialogue:
      - "Ana: ¡Qué gato tan rollizo! | Какой упитанный кот!"
      - "Pablo: Tiene mucho encanto, pero come una ración enorme. | Он очень обаятельный, но ест огромную порцию."
      - "Ana: ¿Quién va a encargarse de darle de comer? | Кто займётся его кормлением?"
      - "Pablo: Yo, y voy a darle un poco menos. | Я, и буду давать ему немного меньше."
    cefr: "B2 — более точное описание полноты, чем gordo."
    frequency: "Встречается в описаниях детей, животных и литературных портретах."
    collocations:
      - "un bebé rollizo — пухлый малыш"
      - "unas mejillas rollizas — пухлые щёки"
      - "un gato rollizo — упитанный кот"
    collocation_example: "El bebé tiene las mejillas rollizas. — У малыша пухлые щёки."
    trap: "Rollizo говорит об округлости и полноте, а corpulento — о крупном телосложении. Это не полные синонимы."

  - word: valla
    ru: забор, ограждение
    ipa: /ˈbaʝa/
    say: ба́йя
    pron: "V звучит как испанская b; ll в большей части Испании произносится как /ʝ/. При таком произношении valla и vaya звучат одинаково."
    meaning: "La valla — забор или ограждение, которое отделяет участок или перекрывает проход. В спорте так называют барьер, а valla publicitaria — рекламный щит."
    examples:
      - "Hay una valla blanca y una puerta delante de la casa. — Перед домом есть белый забор и дверь."
      - "Pusieron una valla para que los coches no entraran en la plaza. — Поставили ограждение, чтобы машины не въезжали на площадь."
      - "La valla que separaba los jardines cayó durante la tormenta de anoche. — Забор, который разделял сады, упал во время вчерашней ночной бури."
    origin: "Происходит от латинского valla, множественного числа vallum «укрепление, ограда». Связанный глагол vallar означает «огораживать»."
    register: "Нейтральное бытовое слово; употребляется также в спорте и рекламе."
    synonyms:
      - word: cerca
        pair: ["Han puesto una valla alrededor del jardín.", "Han puesto una cerca alrededor del jardín."]
        diff: ["Cerca в этом значении — существительное «ограда»; valla также бывает временным барьером или рекламным щитом."]
    analogs: ["fence — забор; barrier — ограждение; billboard — только рекламный щит."]
    dialogue:
      - "Ana: La valla del jardín está rota. | Забор в саду сломан."
      - "Pablo: Por lo visto, cayó un árbol encima. | По всей видимости, на него упало дерево."
      - "Ana: Voy a dirigirme al albañil que vive aquí. | Я обращусь к каменщику, который здесь живёт."
      - "Pablo: Pregúntale cuánto va a tardar en arreglarla. | Спроси его, сколько времени займёт ремонт."
    cefr: "B1 — полезное название ограждения в городе и за городом."
    frequency: "Частое слово в быту, дорожных объявлениях и спортивных новостях."
    collocations:
      - "saltar una valla — перепрыгнуть через забор"
      - "una valla de madera — деревянный забор"
      - "una valla publicitaria — рекламный щит"
      - "poner una valla — поставить ограждение"
    collocation_example: "Pusieron una valla de madera en el jardín. — В саду поставили деревянный забор."
    trap: "Valla — забор, vaya — форма ir или восклицание, а baya — ягода. В большинстве Испании все три слова звучат одинаково."

  - word: espiar
    ru: шпионить, подглядывать, тайно следить
    ipa: /esˈpjaɾ/
    say: эспья́р
    meaning: "Тайно наблюдать за человеком или собирать сведения, чтобы он об этом не знал. Может описывать и работу шпиона, и бытовое подглядывание."
    examples:
      - "No quiero espiar a nadie; solo quiero abrir la ventana. — Я не хочу ни за кем подглядывать; я только хочу открыть окно."
      - "Los niños espiaron al vecino desde un hueco de la puerta. — Дети подглядывали за соседом через щель в двери."
      - "Descubrió que alguien lo espiaba cuando encontró una cámara oculta en su despacho. — Он обнаружил, что за ним кто-то следил, когда нашёл скрытую камеру в кабинете."
    origin: "Связано со словом espía «шпион», пришедшим через французский из германского корня со значением «наблюдать». Спряжение: espío, espías, espía."
    register: "Нейтральное слово, обычно с оттенком скрытности и нарушения чужой приватности."
    synonyms:
      - word: vigilar
        pair: ["Espían al vecino desde la ventana.", "Vigilan al vecino desde la ventana."]
        diff: ["Espiar обязательно предполагает тайное наблюдение; vigilar может означать открытое наблюдение или охрану."]
    analogs: ["to spy on — тайно следить за человеком; to peek — украдкой заглянуть, часто ненадолго."]
    dialogue:
      - "Ana vio un hueco en la valla del jardín. | Ана увидела щель в садовом заборе."
      - "Por lo visto, alguien había pasado por allí. | По всей видимости, кто-то там прошёл."
      - "Se acercó para mirar, pero no quería espiar a los vecinos. | Она подошла посмотреть, но не хотела подглядывать за соседями."
    cefr: "B1 — глагол скрытого наблюдения, полезный в рассказах."
    frequency: "Регулярно встречается в детективах, новостях о слежке и бытовых историях."
    collocations:
      - "espiar a alguien — тайно следить за кем-то"
      - "espiar por la ventana — подглядывать через окно"
      - "espiar los movimientos de alguien — следить за чьими-то передвижениями"
    collocation_example: "No debes espiar a tus vecinos. — Не следует подглядывать за соседями."
    trap: "Перед человеком нужна личная a: espiar a alguien. У настоящего времени ударение на í: yo espío; в инфинитиве espiar знака ударения нет."

  - word: habitual
    ru: обычный, привычный, постоянный
    ipa: /aβiˈtwal/
    say: абитуа́ль
    pron: "H не читается; b между гласными произносится мягко, без полного смыкания губ. Ударение падает на последний слог."
    meaning: "То, что происходит регулярно или стало привычным. О человеке означает «постоянный»: un cliente habitual — постоянный клиент. Форма одинакова для обоих родов."
    examples:
      - "Este es mi café habitual y está cerca de mi casa. — Это моё обычное кафе, и оно рядом с домом."
      - "Hoy he cambiado mi ruta habitual porque hay obras en la calle. — Сегодня я изменил свой привычный маршрут, потому что на улице ремонт."
      - "Aunque es habitual que llegue tarde, hoy su retraso nos ha preocupado de verdad. — Хотя он обычно опаздывает, сегодня его задержка нас действительно встревожила."
    origin: "Связано с hábito «привычка», из латинского habitus «состояние, образ поведения». Суффикс -al образует прилагательное."
    register: "Нейтральное; подходит для повседневной речи, объявлений и официальных текстов."
    synonyms:
      - word: frecuente
        pair: ["Es un problema habitual.", "Es un problema frecuente."]
        diff: ["Habitual подчёркивает привычность или повторяющийся порядок, frecuente — высокую частоту."]
    analogs: ["usual / regular — обычный, постоянный; habitual по-английски чаще описывает устойчивую привычку."]
    dialogue:
      - "Ana: ¿Vamos a nuestro café habitual? | Пойдём в наше обычное кафе?"
      - "Pablo: Sí, me gusta su ambiente. | Да, мне нравится его атмосфера."
      - "Ana: Por lo visto, hoy tienen una ración especial. | По всей видимости, сегодня у них особая порция блюда."
      - "Pablo: Entonces vamos ya; luego habrá mucha gente. | Тогда пойдём сейчас; позже будет много людей."
    cefr: "B1 — описание привычных действий, мест и постоянных посетителей."
    frequency: "Частое слово в разговоре, новостях и объявлениях о режиме работы."
    collocations:
      - "un cliente habitual — постоянный клиент"
      - "el horario habitual — обычное расписание"
      - "como es habitual — как обычно"
      - "la ruta habitual — привычный маршрут"
    collocation_example: "Mañana volvemos al horario habitual. — Завтра мы возвращаемся к обычному расписанию."
    trap: "Не добавляйте окончание -a: una clienta habitual. Во множественном числе — habituales."

  - word: soportar
    ru: терпеть, выносить; выдерживать нагрузку
    ipa: /sopoɾˈtaɾ/
    say: сопорта́р
    meaning: "Выносить что-то неприятное: шум, боль, жару, поведение человека. О конструкции или предмете — выдерживать вес или нагрузку."
    examples:
      - "No soporto este ruido y quiero cerrar la ventana. — Я не выношу этот шум и хочу закрыть окно."
      - "Ayer soportamos dos horas de calor antes de encontrar una sombra. — Вчера мы два часа терпели жару, прежде чем нашли тень."
      - "El puente tuvo que cerrarse porque ya no soportaba el peso de los camiones. — Мост пришлось закрыть, потому что он больше не выдерживал вес грузовиков."
    origin: "От латинского supportare «нести, поддерживать снизу». Отсюда же soporte «опора, подставка»."
    register: "Нейтральное. No soporto… часто выражает сильное раздражение."
    synonyms:
      - word: aguantar
        pair: ["No soporto este ruido.", "No aguanto este ruido."]
        diff: ["Aguantar чаще звучит в разговорной речи; soportar подходит и для более формального описания нагрузки."]
    analogs: ["to bear / to put up with — терпеть; английское to support в значении «поддерживать человека» обычно соответствует apoyar."]
    dialogue:
      - "Ana: No soporto el ruido del piso de arriba. | Не выношу шум из квартиры наверху."
      - "Pablo: Por lo visto, un albañil está trabajando allí. | По всей видимости, там работает каменщик."
      - "Ana: ¿Va a tardar en terminar? | Он долго ещё будет заканчивать?"
      - "Pablo: No sé; voy a dirigirme al encargado. | Не знаю; я обращусь к ответственному."
    cefr: "B1 — выражение терпения, раздражения и физической нагрузки."
    frequency: "Очень распространено в сочетании no soportar, а также в описаниях конструкций."
    collocations:
      - "soportar el dolor — терпеть боль"
      - "no soportar el ruido — не выносить шум"
      - "soportar el peso — выдерживать вес"
    collocation_example: "Esta mesa no soporta tanto peso. — Этот стол не выдерживает такой вес."
    trap: "«Поддерживать друга» — apoyar a un amigo. Soportar a un amigo означает «терпеть друга», что передаёт совсем другое отношение."

  - word: fingir
    ru: притворяться, симулировать, изображать
    ipa: /finˈxiɾ/
    say: финхи́р
    pron: "G перед i звучит как испанская j, примерно как русское «х». В форме yo пишется j: finjo."
    meaning: "Создавать видимость чувства или состояния, которого на самом деле нет: fingir alegría, fingir estar enfermo. Также можно притвориться, что что-то происходит: fingir que…"
    examples:
      - "No quiero fingir una sonrisa; hoy estoy muy triste. — Я не хочу изображать улыбку; сегодня мне очень грустно."
      - "Fingió estar dormido porque no quería hablar con nadie. — Он притворился спящим, потому что ни с кем не хотел разговаривать."
      - "Aunque la noticia la preocupó, fingió que todo iba bien para no alarmarnos. — Хотя новость её встревожила, она сделала вид, что всё хорошо, чтобы нас не пугать."
    origin: "От латинского fingere «лепить, придавать форму, выдумывать». Родственное fingido означает «притворный»."
    register: "Нейтральное слово; часто встречается в разговоре о чувствах и в художественной прозе."
    synonyms:
      - word: simular
        pair: ["Fingió una enfermedad.", "Simuló una enfermedad."]
        diff: ["Simular звучит несколько формальнее и может означать техническое моделирование; fingir чаще относится к обманной видимости."]
    analogs: ["to pretend / to feign — притворяться; to feign формальнее и особенно часто относится к чувствам или болезни."]
    dialogue:
      - "Ana: ¿Por qué finges que no te importa el examen? | Почему ты делаешь вид, что экзамен тебе безразличен?"
      - "Pablo: Porque temo suspender otra vez. | Потому что боюсь опять провалить."
      - "Ana: Puedes conseguir una buena nota si estudias conmigo. | Ты можешь получить хорошую оценку, если будешь заниматься со мной."
      - "Pablo: Tienes razón; no voy a fingir más. | Ты права; я больше не буду притворяться."
    cefr: "B1 — описание неискреннего поведения и мнимых состояний."
    frequency: "Частое слово в рассказах, диалогах и описаниях отношений."
    collocations:
      - "fingir una sonrisa — изобразить улыбку"
      - "fingir estar enfermo — притвориться больным"
      - "fingir que no pasa nada — делать вид, что ничего не происходит"
    collocation_example: "Fingió una sonrisa para la foto. — Она изобразила улыбку для фотографии."
    trap: "Обычно говорят fingir, без -se: fingió estar enfermo. Yo — finjo, но tú — finges; звук при этом сохраняется."

  - word: opuesto
    ru: противоположный; противоположность
    ipa: /oˈpwesto/
    say: опуэ́сто
    meaning: "То, что находится на другой стороне или полностью отличается по смыслу, направлению, позиции. Как существительное lo opuesto означает «противоположное». Женская форма — opuesta."
    examples:
      - "La farmacia está en el lado opuesto de esta calle. — Аптека находится на противоположной стороне этой улицы."
      - "Tomamos caminos opuestos y no volvimos a vernos ese día. — Мы пошли противоположными путями и в тот день больше не виделись."
      - "Aunque compartían el mismo objetivo, defendían opiniones opuestas sobre cómo alcanzarlo. — Хотя у них была общая цель, они отстаивали противоположные мнения о том, как её достичь."
    origin: "Это также причастие глагола oponer «противопоставлять», восходящего к латинскому opponere «ставить напротив». Родственное слово — oposición «противодействие»."
    register: "Нейтральное слово для пространственных описаний, сравнений и споров."
    synonyms:
      - word: contrario
        pair: ["Caminaban en direcciones opuestas.", "Caminaban en direcciones contrarias."]
        diff: ["В описании направлений слова близки; opuesto часто подчёркивает полную противоположность двух позиций."]
    analogs: ["opposite — противоположный; opposed to — настроенный против чего-то."]
    dialogue:
      - "Ana buscaba un café con un ambiente tranquilo. | Ана искала кафе со спокойной атмосферой."
      - "Pablo, en cambio, quería asistir a un concierto. | Пабло, наоборот, хотел пойти на концерт."
      - "Tenían planes opuestos, pero decidieron cenar juntos primero. | У них были противоположные планы, но сначала они решили вместе поужинать."
    cefr: "B1 — сравнение направлений, качеств и мнений."
    frequency: "Частое слово в бытовой речи, обсуждениях и учебных объяснениях."
    collocations:
      - "el lado opuesto — противоположная сторона"
      - "en sentido opuesto — в противоположном направлении"
      - "lo opuesto a algo — противоположность чему-то"
      - "opiniones opuestas — противоположные мнения"
    collocation_example: "El autobús iba en sentido opuesto. — Автобус ехал в противоположном направлении."
    trap: "«Противоположность чему-то» — lo opuesto a algo, с предлогом a. Не путайте с puesto «поставленный, место, должность»."

  - word: estremecerse
    ru: вздрогнуть, содрогнуться, задрожать
    ipa: /estɾemeˈθeɾse/
    say: эстремэсэ́рсэ
    pron: "C перед e в Испании произносится как межзубное /θ/. В форме yo пишется zc: me estremezco."
    meaning: "Непроизвольно вздрогнуть или задрожать от холода, страха либо сильного переживания. Без -se глагол estremecer означает «потрясти, заставить содрогнуться»."
    examples:
      - "Me estremezco de frío y busco mi abrigo en casa. — Я дрожу от холода и ищу дома своё пальто."
      - "Se estremeció al oír un grito detrás de la puerta. — Она вздрогнула, услышав крик за дверью."
      - "Aunque intentó parecer tranquilo, se estremeció al recordar lo que había ocurrido. — Хотя он старался казаться спокойным, он содрогнулся, вспомнив о случившемся."
    origin: "Восходит к латинскому глаголу со значением «дрожать», родственному tremere. Та же идея дрожи есть в испанском temblar."
    register: "Нейтральное выразительное слово; особенно характерно для повествований и описаний переживаний."
    synonyms:
      - word: temblar
        pair: ["Se estremeció de frío.", "Tembló de frío."]
        diff: ["Estremecerse часто описывает внезапную дрожь или сильную эмоциональную реакцию; temblar может обозначать длительную дрожь."]
    analogs: ["to shudder / to shiver — содрогнуться или задрожать; shudder чаще передаёт страх и отвращение."]
    dialogue:
      - "Ana: ¿Por qué te has estremecido? | Почему ты вздрогнул?"
      - "Pablo: He oído un ruido y he empezado a temer lo peor. | Я услышал шум и начал опасаться худшего."
      - "Ana: Por lo visto, solo se ha caído una rama. | По всей видимости, просто упала ветка."
      - "Pablo: Menos mal; este ambiente me pone nervioso. | Хорошо; эта атмосфера меня нервирует."
    cefr: "B2 — точное описание телесной реакции на эмоцию или холод."
    frequency: "Чаще встречается в прозе, чем в простом бытовом разговоре."
    collocations:
      - "estremecerse de frío — задрожать от холода"
      - "estremecerse de miedo — содрогнуться от страха"
      - "estremecerse al recordar algo — содрогнуться при воспоминании о чём-то"
    collocation_example: "Se estremeció de miedo al oír los pasos. — Он содрогнулся от страха, услышав шаги."
    trap: "Субъект реакции требует местоимения: me estremezco. Сравните: la noticia me estremeció — «новость меня потрясла»."

  - word: acontecimiento
    ru: событие, значительное происшествие
    ipa: /akonteθiˈmjento/
    say: аконтэсимье́нто
    pron: "C перед i в Испании произносится как межзубное /θ/, а первая c перед o — как /k/."
    meaning: "El acontecimiento — событие, обычно заметное или важное для людей. Это может быть историческое событие, общественное мероприятие или важный момент личной жизни."
    examples:
      - "La fiesta del pueblo es un acontecimiento importante para mi familia. — Праздник в посёлке — важное событие для моей семьи."
      - "El nacimiento de su hija fue el acontecimiento más feliz del año. — Рождение дочери стало самым счастливым событием года."
      - "El periodista explicó cómo aquel acontecimiento había cambiado la vida de toda una generación. — Журналист объяснил, как то событие изменило жизнь целого поколения."
    origin: "Образовано от acontecer «происходить» с суффиксом -miento, который создаёт существительные действия или результата."
    register: "Нейтральное, но более весомое и книжное, чем просто algo que pasó «то, что произошло»."
    synonyms:
      - word: suceso
        pair: ["Fue un acontecimiento inesperado.", "Fue un suceso inesperado."]
        diff: ["Acontecimiento выделяет значимость; suceso просто называет случившееся, а в новостях часто обозначает происшествие."]
    analogs: ["event — событие; happening — произошедшее, обычно без обязательного оттенка важности."]
    dialogue:
      - "Ana: ¿Vas a asistir a la fiesta de la región? | Ты пойдёшь на праздник региона?"
      - "Pablo: Sí, es un acontecimiento importante para mi generación. | Да, это важное событие для моего поколения."
      - "Ana: ¿Dónde va a tener lugar? | Где он состоится?"
      - "Pablo: En la plaza; dicen que habrá muy buen ambiente. | На площади; говорят, атмосфера будет очень хорошей."
    cefr: "B1 — описание заметных событий в жизни и истории."
    frequency: "Частое слово в новостях, исторических рассказах и описаниях важных дат."
    collocations:
      - "un acontecimiento histórico — историческое событие"
      - "un acontecimiento importante — важное событие"
      - "los últimos acontecimientos — последние события"
    collocation_example: "La apertura del museo fue un acontecimiento importante. — Открытие музея стало важным событием."
    trap: "Это существительное мужского рода: el acontecimiento. Само слово не означает несчастье: событие может быть радостным."

  - word: lechuza
    ru: сова
    ipa: /leˈtʃuθa/
    say: лечу́са
    pron: "Ch произносится как «ч», а z в Испании — как межзубное /θ/."
    meaning: "La lechuza — сова, ночная птица с характерным светлым лицевым диском в форме сердца. Это один из видов совообразных; для общего слова «сова» часто используют búho."
    examples:
      - "La lechuza es blanca y vive cerca de nuestra casa. — Сова белая и живёт рядом с нашим домом."
      - "Anoche vimos una lechuza que salió del tejado de la granja. — Вчера ночью мы увидели сову, которая вылетела из-под крыши фермы."
      - "Como la lechuza caza de noche, es más fácil oírla que verla volar. — Поскольку сова охотится ночью, её легче услышать, чем увидеть в полёте."
    origin: "По DLE, происходит от старого nechuza, восходящего к латинскому noctua «ночная птица». На форму повлияло leche «молоко» из-за старого суеверия, связывавшего эту птицу с кормлением младенцев."
    register: "Нейтральное название птицы; употребляется в быту, рассказах и текстах о природе."
    synonyms:
      - word: lechuza común
        pair: ["Una lechuza anida en la granja.", "Una lechuza común anida en la granja."]
        diff: ["Lechuza común — более точное название этой птицы; lechuza — короткий бытовой вариант."]
    analogs: ["owl — сова; barn owl — более точное английское название этой птицы."]
    dialogue:
      - "Ana: Hay una lechuza en aquel hueco. | В той нише сова."
      - "Pablo: ¿En el árbol situado junto a la orilla? | В дереве, которое находится у берега?"
      - "Ana: Sí, pero no te acerques; puede temer a las personas. | Да, но не подходи; она может бояться людей."
      - "Pablo: Vamos a mirarla desde aquí. | Посмотрим на неё отсюда."
    cefr: "B2 — конкретное название птицы, полезное при чтении."
    frequency: "Не повседневное слово; регулярно встречается в рассказах и текстах о природе."
    collocations:
      - "una lechuza común — обыкновенная сова"
      - "el grito de una lechuza — крик совы"
      - "una lechuza blanca — белая сова"
    collocation_example: "Oímos el grito de una lechuza en el bosque. — В лесу мы услышали крик совы."
    trap: "Не каждую сову называют lechuza: búho — более широкое бытовое слово. Грамматический род — женский: la lechuza, даже если пол птицы неизвестен."

  - word: tratar
    ru: обращаться с кем-то; лечить; обсуждать
    ipa: /tɾaˈtaɾ/
    say: трата́р
    meaning: "Значение зависит от конструкции: tratar bien a alguien — хорошо обращаться с человеком; tratar una enfermedad — лечить болезнь; tratar un tema — обсуждать тему. Tratar de + инфинитив означает «пытаться», а tratarse de — «речь идёт о»."
    examples:
      - "El médico trata a mi padre y siempre es muy amable. — Врач лечит моего отца и всегда очень любезен."
      - "En la reunión tratamos el problema, pero no encontramos una solución. — На собрании мы обсудили проблему, но не нашли решения."
      - "Aunque trató de mantener la calma, se notaba que aquella pregunta le molestaba. — Хотя он пытался сохранять спокойствие, было заметно, что тот вопрос его раздражал."
    origin: "От латинского tractare «обращаться, заниматься чем-то», связанного с trahere «тянуть». Родственные слова — trato «обращение, сделка» и tratamiento «лечение, обращение»."
    register: "Нейтральное и очень универсальное; встречается и в быту, и в медицине, и в обсуждениях."
    synonyms:
      - word: intentar
        pair: ["Trato de entenderlo.", "Intento entenderlo."]
        diff: ["Синонимом intentar служит конструкция tratar de, а не любой случай tratar. После intentar предлог de не нужен."]
    analogs: ["to treat — лечить или обращаться; to deal with — обсуждать; to try — пытаться, только для tratar de."]
    dialogue:
      - "Ana se encargaba de recibir a los nuevos vecinos. | Ана занималась приёмом новых соседей."
      - "Trataba a todos con respeto, aunque algunos estaban nerviosos. | Она обращалась со всеми уважительно, хотя некоторые нервничали."
      - "Quería crear un ambiente agradable para que pudieran instalarse tranquilos. | Она хотела создать приятную атмосферу, чтобы они могли спокойно обустроиться."
    cefr: "B1 — многозначный глагол с несколькими распространёнными конструкциями."
    frequency: "Очень частое слово в разговорной, рабочей и письменной речи."
    collocations:
      - "tratar bien a alguien — хорошо обращаться с кем-то"
      - "tratar una enfermedad — лечить болезнь"
      - "tratar un tema — обсуждать тему"
      - "tratar de hacer algo — пытаться что-то сделать"
      - "tratarse de algo — речь идёт о чём-то"
    collocation_example: "Siempre trata bien a sus compañeros. — Она всегда хорошо обращается с коллегами."
    trap: "Различайте: trato de dormir — «пытаюсь уснуть», se trata de un sueño — «речь идёт о сне». «Книга о дружбе» — el libro trata de la amistad, без se."

  - word: arrojar
    ru: бросать, швырять; выдавать результат
    ipa: /aroˈxaɾ/
    say: арроха́р
    pron: "Двойная rr произносится раскатисто; j звучит примерно как русское «х»."
    meaning: "Бросать или швырять что-либо, часто с силой. В сочетании arrojar resultados означает «давать результаты», а arrojar luz sobre algo — «проливать свет на что-то»."
    examples:
      - "El niño arroja una pelota y su perro corre detrás. — Мальчик бросает мяч, и его собака бежит следом."
      - "Arrojó las llaves sobre la mesa y salió sin decir nada. — Она бросила ключи на стол и вышла, ничего не сказав."
      - "El informe arrojó resultados que obligaron al equipo a revisar su primera explicación. — Отчёт дал результаты, которые заставили команду пересмотреть своё первоначальное объяснение."
    origin: "Восходит к народно-латинскому rotulare «катить, пускать катиться», связанному с rotare «вращать». Первоначальный образ связан с предметом, который бросают и пускают катиться."
    register: "Нейтральное, несколько выразительнее бытового tirar. Переносные сочетания характерны для новостей и отчётов."
    synonyms:
      - word: lanzar
        pair: ["Arrojó una piedra al río.", "Lanzó una piedra al río."]
        diff: ["Arrojar нередко подчёркивает резкость броска; lanzar также употребляется для запуска проекта, товара или ракеты."]
    analogs: ["to throw / to hurl — бросать, швырять; to yield — давать, когда речь о результатах."]
    dialogue:
      - "Ana: Ese niño acaba de arrojar una botella al río. | Тот мальчик только что бросил бутылку в реку."
      - "Pablo: Voy a dirigirme a él antes de que se vaya. | Я обращусь к нему, пока он не ушёл."
      - "Ana: Yo me encargo de recogerla desde la orilla. | Я займусь тем, чтобы достать её с берега."
      - "Pablo: Ten cuidado; podemos pedir ayuda. | Осторожно; мы можем попросить о помощи."
    cefr: "B2 — выразительный глагол броска с частыми переносными сочетаниями."
    frequency: "Частое слово в повествовании, новостях и сообщениях о результатах исследований."
    collocations:
      - "arrojar una piedra — бросить камень"
      - "arrojar algo al suelo — швырнуть что-то на пол"
      - "arrojar resultados — дать результаты"
      - "arrojar luz sobre algo — пролить свет на что-то"
    collocation_example: "La investigación arrojó luz sobre el caso. — Расследование пролило свет на это дело."
    trap: "Arrojar algo — бросить предмет; arrojarse al agua — броситься в воду самому. Местоимение se меняет участника действия."

  - word: percibir
    ru: замечать, воспринимать, ощущать
    ipa: /peɾθiˈβiɾ/
    say: пэрсиби́р
    pron: "C перед i в Испании звучит как межзубное /θ/; b между гласными произносится мягко, без полного смыкания губ."
    meaning: "Замечать или ощущать что-то органами чувств либо понимать по косвенным признакам. В официальной речи percibir un sueldo означает «получать зарплату»."
    examples:
      - "Percibo un olor a pan y tengo mucha hambre. — Я чувствую запах хлеба и очень хочу есть."
      - "Al entrar, percibió que el ambiente de la casa había cambiado. — Войдя, она заметила, что атмосфера в доме изменилась."
      - "Aunque nadie expresó su desacuerdo, percibí cierta tensión durante la reunión. — Хотя никто не выразил несогласия, я ощутила некоторое напряжение во время собрания."
    origin: "От латинского percipere «получать, улавливать». Родственные слова — percepción «восприятие» и perceptible «ощутимый, заметный»."
    register: "Нейтральное, несколько более точное и книжное, чем notar; в значении дохода — официальное."
    synonyms:
      - word: notar
        pair: ["Percibí un cambio en su voz.", "Noté un cambio en su voz."]
        diff: ["Notar чаще звучит в повседневном разговоре; percibir выделяет само восприятие, иногда едва уловимое."]
    analogs: ["to perceive / to sense — воспринимать, ощущать; to receive — получать, когда речь о зарплате."]
    dialogue:
      - "Ana: ¿Percibes ese olor? | Чувствуешь этот запах?"
      - "Pablo: Sí, por lo visto están elaborando pan. | Да, по всей видимости, они пекут хлеб."
      - "Ana: El ambiente aquí es muy agradable. | Здесь очень приятная атмосфера."
      - "Pablo: Vamos a entrar; quizá podamos conseguir una barra caliente. | Зайдём; возможно, нам удастся купить горячий багет."
    cefr: "B2 — точное описание чувственного и косвенного восприятия."
    frequency: "Распространено в письменной речи, описаниях чувств и официальных текстах о доходах."
    collocations:
      - "percibir un olor — почувствовать запах"
      - "percibir un cambio — заметить изменение"
      - "percibir una amenaza — ощутить угрозу"
      - "percibir un sueldo — получать зарплату"
    collocation_example: "Percibí un cambio en su actitud. — Я заметила перемену в его отношении."
    trap: "Не путайте percibir «воспринимать» и recibir «получать». Только некоторые сочетания, например percibir un sueldo, связаны с получением денег."

  - word: suceder
    ru: происходить, случаться
    ipa: /suθeˈðeɾ/
    say: сусэдэ́р
    pron: "C перед e в Испании произносится как межзубное /θ/, а d между гласными — мягко, без полного смыкания."
    meaning: "Обозначает то, что происходит или случилось: ¿Qué sucede? — «Что происходит?». Другое значение — сменить кого-то в должности: suceder a alguien."
    examples:
      - "¿Qué sucede en la calle y por qué hay tanta gente? — Что происходит на улице и почему там столько людей?"
      - "Todo sucedió muy rápido y no pude llamar a nadie. — Всё произошло очень быстро, и я не смогла никому позвонить."
      - "Nadie comprendía lo que había sucedido hasta que apareció un nuevo testigo. — Никто не понимал, что произошло, пока не появился новый свидетель."
    origin: "От латинского succedere «следовать за, наступать». Поэтому глагол описывает и событие, и приход следующего человека на чьё-то место."
    register: "Нейтральное. В бытовом разговоре вместо suceder очень часто говорят pasar."
    synonyms:
      - word: ocurrir
        pair: ["¿Qué sucedió anoche?", "¿Qué ocurrió anoche?"]
        diff: ["В вопросе о событии слова почти взаимозаменяемы; ocurrírsele a alguien дополнительно означает «прийти кому-то в голову»."]
    analogs: ["to happen — случаться; английское to succeed в значении «добиться успеха» переводится tener éxito."]
    dialogue:
      - "Ana: ¿Qué ha sucedido en la plaza? | Что случилось на площади?"
      - "Pablo: Por lo visto, han suspendido el concierto. | По всей видимости, концерт отменили."
      - "Ana: Voy a enterarme del motivo. | Я узнаю причину."
      - "Pablo: Avísame; varios amigos querían asistir. | Сообщи мне; несколько друзей хотели пойти."
    cefr: "B1 — базовый глагол для рассказа о событиях."
    frequency: "Очень частое слово в новостях, вопросах и повествованиях."
    collocations:
      - "¿qué sucede? — что происходит?"
      - "suceder de repente — случиться внезапно"
      - "lo sucedido — случившееся"
      - "suceder a alguien en el cargo — сменить кого-то в должности"
    collocation_example: "Todo sucedió de repente. — Всё случилось внезапно."
    trap: "Sucedió algo — «что-то случилось», а tuvo éxito — «он добился успеха». Английское success не помогает угадать основное значение suceder."

  - word: parpadear
    ru: моргать; мигать, мерцать
    ipa: /paɾpaðeˈaɾ/
    say: парпадэа́р
    pron: "D между гласными произносится мягко. E и a принадлежат разным слогам: par-pa-de-ar."
    meaning: "Закрывать и снова открывать веки — моргать. О лампочке, экране или сигнале означает «мигать, мерцать»."
    examples:
      - "La luz es muy fuerte y no dejo de parpadear. — Свет очень яркий, и я всё время моргаю."
      - "La luz del teléfono empezó a parpadear mientras dormíamos. — Лампочка телефона начала мигать, пока мы спали."
      - "Parpadeó varias veces antes de darse cuenta de que la figura era solo una sombra. — Она несколько раз моргнула, прежде чем поняла, что фигура была всего лишь тенью."
    origin: "Образовано от párpado «веко» при помощи глагольного суффикса -ear. Существительное parpadeo означает «моргание, мигание»."
    register: "Нейтральное; употребляется и о человеке, и о технике."
    synonyms:
      - word: pestañear
        pair: ["Parpadeó varias veces.", "Pestañeó varias veces."]
        diff: ["О глазах слова близки; для мигающей лампочки обычнее parpadear."]
    analogs: ["to blink — моргать или мигать; to flicker — мерцать, обычно о свете."]
    dialogue:
      - "Ana llevaba un rato elaborando un informe en el ordenador. | Ана уже некоторое время составляла отчёт на компьютере."
      - "Mientras escribía, una luz de la pantalla empezó a parpadear. | Пока она писала, на экране начал мигать огонёк."
      - "Por lo visto, la batería estaba casi vacía; guardó el trabajo enseguida. | По всей видимости, батарея почти разрядилась; она сразу сохранила работу."
    cefr: "B1 — описание движения век и мигающих сигналов."
    frequency: "Употребляется в быту, описаниях внешности и инструкциях к устройствам."
    collocations:
      - "parpadear varias veces — моргнуть несколько раз"
      - "sin parpadear — не моргая"
      - "una luz que parpadea — мигающий огонёк"
    collocation_example: "Una luz roja parpadeaba en el panel. — На панели мигал красный огонёк."
    trap: "Párpado «веко» пишется со знаком ударения, а parpadear — без него. Моргание — parpadeo, тоже без знака ударения."

  - word: embotellamiento
    ru: дорожная пробка, затор
    ipa: /emboteʝaˈmjento/
    say: эмботэйямье́нто
    pron: "Ll в большей части Испании произносится как /ʝ/. Сочетание -miento звучит одним ударным слогом mien и безударным to."
    meaning: "El embotellamiento — скопление машин, из-за которого движение замедляется или останавливается. В Испании в повседневной речи чаще говорят atasco."
    examples:
      - "Hay un embotellamiento y el autobús no llega al centro. — На дороге пробка, и автобус не доезжает до центра."
      - "Llegamos tarde porque había un embotellamiento a la entrada de la ciudad. — Мы опоздали, потому что на въезде в город была пробка."
      - "Aunque salimos antes de lo habitual, quedamos atrapados en un embotellamiento durante una hora. — Хотя мы выехали раньше обычного, мы на час застряли в пробке."
    origin: "Образовано от embotellar «разливать по бутылкам; закупоривать», связанного с botella «бутылка». Образ узкого горлышка объясняет переносное значение затора."
    register: "Нейтральное, особенно распространённое в Латинской Америке. В Испании понятно, но бытовое atasco обычно естественнее."
    synonyms:
      - word: atasco
        pair: ["Hay un embotellamiento en la autopista.", "Hay un atasco en la autopista."]
        diff: ["Atasco — наиболее обычный разговорный вариант в Испании; embotellamiento длиннее и чаще встречается в латиноамериканской речи."]
    analogs: ["traffic jam — дорожная пробка; bottleneck — узкое место, которое вызывает затор."]
    dialogue:
      - "Ana: Hay un embotellamiento enorme delante de nosotros. | Перед нами огромная пробка."
      - "Pablo: Vamos a tardar en llegar al concierto. | Мы нескоро доберёмся до концерта."
      - "Ana: Podemos asistir a la segunda parte; empieza dentro de una hora. | Мы можем попасть на вторую часть; она начинается через час."
      - "Pablo: Voy a avisar a los demás mientras esperamos. | Пока ждём, я предупрежу остальных."
    cefr: "B1 — описание дорожной ситуации и причины опоздания."
    frequency: "Частое в новостях о движении и в Латинской Америке; в Испании чаще atasco."
    collocations:
      - "un embotellamiento de tráfico — дорожный затор"
      - "quedar atrapado en un embotellamiento — застрять в пробке"
      - "evitar un embotellamiento — избежать пробки"
    collocation_example: "Salimos temprano para evitar un embotellamiento. — Мы выехали рано, чтобы избежать пробки."
    trap: "Не путайте embotellamiento «затор» и embotellado «розлив по бутылкам». Для повседневного рассказа в Испании подойдёт atasco."

  - word: volante
    ru: руль
    ipa: /boˈlante/
    say: бола́нтэ
    pron: "V произносится как испанская b, без русского звука «в»."
    meaning: "El volante — руль автомобиля. Estar al volante означает «быть за рулём». У слова есть и другие значения: рекламная листовка, волан на одежде или волан для бадминтона; здесь главное значение — автомобильное."
    examples:
      - "Mi padre tiene las manos en el volante y mira la carretera. — Мой отец держит руки на руле и смотрит на дорогу."
      - "Giró el volante a la derecha para entrar en una calle estrecha. — Она повернула руль вправо, чтобы въехать на узкую улицу."
      - "Aunque el coche empezó a deslizarse, mantuvo firme el volante y logró detenerse. — Хотя машина начала скользить, он крепко удержал руль и сумел остановиться."
    origin: "Происходит от volar «летать»; форма volante первоначально означала «летящий». Название вращающейся детали связано с техническим употреблением этого слова."
    register: "Нейтральное бытовое слово. Значение «рекламная листовка» особенно распространено в Латинской Америке."
    synonyms:
      - word: timón
        pair: ["Sujetó el volante con fuerza.", "Sujetó el timón con fuerza."]
        diff: ["В отдельных странах timón тоже обозначает автомобильный руль; в Испании это прежде всего судовой руль, а в автомобиле говорят volante."]
    analogs: ["steering wheel — автомобильный руль; wheel в сочетании at the wheel тоже означает «за рулём»."]
    dialogue:
      - "Ana: ¿Quién va al volante hasta la costa? | Кто будет за рулём до побережья?"
      - "Pablo: Yo, aunque prefiero evitar nuestro camino habitual. | Я, хотя предпочитаю избежать нашего обычного пути."
      - "Ana: Por lo visto, hay un embotellamiento en esa carretera. | По всей видимости, на той дороге пробка."
      - "Pablo: Entonces tú te encargas de buscar otra ruta. | Тогда ты займись поиском другого маршрута."
    cefr: "A2 — название основной детали автомобиля и выражение «за рулём»."
    frequency: "Очень частое слово в разговорах об автомобиле, вождении и безопасности движения."
    collocations:
      - "estar al volante — быть за рулём"
      - "girar el volante — повернуть руль"
      - "sujetar el volante — держать руль"
      - "dormirse al volante — уснуть за рулём"
    collocation_example: "Nunca uses el móvil cuando estés al volante. — Никогда не пользуйся телефоном, когда ты за рулём."
    trap: "Руль — el volante, мужского рода. Для велосипеда обычно нужно другое слово: el manillar."
