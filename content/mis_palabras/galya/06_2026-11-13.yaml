# Шестой список Гали (18 слов и выражений). Примеры A1 / A2 / B1–B2, мини-диалог 4 строки, уровень A2–B1. Слова suspender, acontecimiento и suceder уже были в колоде, второй раз не добавлены.
lang: es
words:
- word: hacer caso
  image: art/galya/hacer_caso.png
  ru: слушаться, обращать внимание
  ipa: /aˈθeɾ ˈkaso/
  say: асэ́р ка́со
  pron: C перед e — межзубное /θ/, как в «think».
  meaning: 'Прислушаться к совету, просьбе или предупреждению и сделать так, как сказали. Всегда с предлогом a: hacer caso a alguien. Без предлога (hacer caso) — «обратить внимание».'
  examples:
  - Hazme caso, por favor. — Послушайся меня, пожалуйста.
  - Cuando le digo que se acueste, mi hijo nunca me hace caso. — Когда я говорю ему ложиться спать, мой сын никогда меня не слушается.
  - Si me hubieras hecho caso desde el principio, ahora no tendríamos tantos problemas. — Если бы ты послушался меня с самого начала, у нас сейчас не было бы стольких проблем.
  origin: Caso — от латинского casus «случай»; hacer caso буквально «делать случай из чего-то», то есть принимать во внимание.
  register: Нейтральное, очень частое в разговоре.
  synonyms: []
  analogs:
  - to pay attention to, to listen to — слушаться, обращать внимание
  dialogue:
  - 'Ana: ¿Por qué no te pusiste el abrigo? | Почему ты не надела пальто?'
  - 'Luis: No te hice caso y ahora tengo frío. | Я тебя не послушался, и теперь мне холодно.'
  - 'Ana: Siempre me pasa lo mismo contigo. | Со мной с тобой всегда одно и то же.'
  - 'Luis: Tienes razón, la próxima vez te haré caso. | Ты права, в следующий раз я тебя послушаюсь.'
  cefr: A2–B1.
  frequency: Очень частое.
  collocations:
  - hacer caso a alguien — слушаться кого-то
  - no hacer caso — не обращать внимания
  - hacer caso omiso — игнорировать
  collocation_example: No hagas caso de lo que dicen. — Не обращай внимания на то, что говорят.
  trap: 'Нельзя сказать «hacer caso alguien» без предлога: нужен a — hacer caso a mi madre.'
- word: atrevido
  image: art/galya/atrevido.png
  ru: смелый, дерзкий
  ipa: /atɾeˈβiðo/
  say: атреби́до
  pron: B и V звучат одинаково; d между гласными — мягкая.
  meaning: 'Человек или поступок, который не боится рисковать или нарушать правила. Может быть и похвалой («смелый»), и упрёком («дерзкий, нахальный»). Меняется по роду: atrevido, atrevida.'
  examples:
  - Mi amiga es muy atrevida. — Моя подруга очень смелая.
  - Fue un comentario atrevido y todos se quedaron callados. — Это было дерзкое замечание, и все замолчали.
  - Su estilo atrevido siempre llama la atención, aunque a algunos les parece demasiado provocador. — Его смелый стиль всегда привлекает внимание, хотя некоторым кажется слишком вызывающим.
  origin: Причастие от atreverse «осмелиться»; родственное слово — atrevimiento «смелость, дерзость».
  register: Нейтральное.
  synonyms: []
  analogs:
  - daring, bold — смелый; cheeky — дерзкий, нахальный
  dialogue:
  - 'Ana: ¿Has visto el vestido de Marta? | Ты видела платье Марты?'
  - 'Luis: Sí, es muy atrevido. | Да, оно очень смелое.'
  - 'Ana: A mí me gusta, es diferente. | Мне нравится, оно необычное.'
  - 'Luis: Ella siempre es atrevida con la ropa. | Она всегда смелая в одежде.'
  cefr: B1.
  frequency: Частое.
  collocations:
  - una pregunta atrevida — дерзкий вопрос
  - un diseño atrevido — смелый дизайн
  - ser atrevido — быть смелым
  collocation_example: Fue una propuesta muy atrevida. — Это было очень смелое предложение.
  trap: 'Atrevido часто звучит как упрёк («нахал»): Qué atrevido eres! — «Какой ты наглец!». Для похвалы лучше valiente.'
- word: trascendental
  image: art/galya/trascendental.png
  ru: очень важный, судьбоносный
  ipa: /tɾasθendenˈtal/
  say: трасендента́ль
  pron: 'Начало tras-: s звучит слабо; C перед e — /θ/. Допустимо и написание transcendental.'
  meaning: 'Настолько важный, что последствия будут большими и надолго: решение, событие, открытие. Слово книжное, звучит серьёзно.'
  examples:
  - Hoy es un día trascendental. — Сегодня судьбоносный день.
  - Tomó una decisión trascendental para su familia. — Он принял важное для своей семьи решение.
  - El descubrimiento resultó trascendental, porque cambió la forma de entender la enfermedad. — Открытие оказалось судьбоносным, потому что изменило взгляд на болезнь.
  origin: 'От латинского transcendere «переходить за пределы»: то, что выходит за рамки обычного. Родственные: trascender «выходить за пределы; становиться известным».'
  register: Книжное, формальное.
  synonyms: []
  analogs:
  - momentous, crucial — судьбоносный, переломный
  dialogue:
  - 'Ana: Mañana tengo una reunión trascendental. | Завтра у меня судьбоносная встреча.'
  - 'Luis: ¿Es sobre el nuevo trabajo? | Это про новую работу?'
  - 'Ana: Sí, de ella depende mi futuro. | Да, от неё зависит моё будущее.'
  - 'Luis: Te deseo mucha suerte. | Желаю тебе большой удачи.'
  cefr: B2.
  frequency: Менее частое, в новостях и речах.
  collocations:
  - una decisión trascendental — важное решение
  - un momento trascendental — переломный момент
  - un acontecimiento trascendental — важное событие
  collocation_example: Es un paso trascendental en su carrera. — Это важный шаг в его карьере.
  trap: Это не «трансцендентальный» из философии; в обычной речи значит просто «чрезвычайно важный».
- word: motín
  image: art/galya/motin.png
  ru: мятеж, бунт
  ipa: /moˈtin/
  say: моти́н
  pron: 'Ударение на последнем слоге, поэтому стоит чёрточка: motín.'
  meaning: 'Шумное восстание группы людей против власти или начальства: солдат, заключённых, экипажа корабля, толпы. Во множественном числе motines.'
  examples:
  - Hay un motín en la cárcel. — В тюрьме бунт.
  - Los marineros organizaron un motín contra el capitán. — Матросы устроили мятеж против капитана.
  - El motín empezó por la mala comida y terminó con varios heridos y cambios en la dirección. — Бунт начался из-за плохой еды и закончился несколькими ранеными и сменой руководства.
  origin: 'От motivar и mover «двигать, приводить в движение»: motín — когда люди приходят в движение и поднимаются.'
  register: Нейтральное, журналистское.
  synonyms: []
  analogs:
  - mutiny, riot — мятеж, бунт
  dialogue:
  - 'Ana: Estoy leyendo una novela de piratas. | Я читаю роман про пиратов.'
  - 'Luis: ¿Y qué pasa? | И что происходит?'
  - 'Ana: Los marineros preparan un motín. | Матросы готовят мятеж.'
  - 'Luis: Seguro que el capitán lo descubre. | Наверняка капитан это обнаружит.'
  cefr: B2.
  frequency: Менее частое.
  collocations:
  - un motín a bordo — мятеж на борту
  - sofocar un motín — подавить бунт
  - motín de presos — тюремный бунт
  collocation_example: Sofocaron el motín en pocas horas. — Бунт подавили за несколько часов.
  trap: 'Не путайте с mitin «митинг»: motín — это насильственное восстание, а mitin — публичное собрание.'
- word: atreverse
  image: art/galya/atreverse.png
  ru: осмелиться, решиться
  ipa: /atɾeˈβeɾse/
  say: атрэ́берсе
  pron: B и V одинаково; ударение на предпоследнем слоге.
  meaning: 'Набраться смелости сделать то, что страшно, трудно или неприлично. Возвратный глагол; после него идёт a + инфинитив: atreverse a hablar. Можно сказать и без a в вопросах: ¿Te atreves?'
  examples:
  - No me atrevo a hablar. — Я не решаюсь говорить.
  - Ayer me atreví a pedirle ayuda a mi jefe. — Вчера я осмелилась попросить помощи у начальника.
  - Aunque tenía miedo, se atrevió a decirle la verdad delante de todos. — Хотя ей было страшно, она осмелилась сказать ему правду перед всеми.
  origin: 'От латинского audere «осмеливаться» через старое atrever; родственные: atrevido, atrevimiento.'
  register: Нейтральное.
  synonyms: []
  analogs:
  - to dare — осмелиться
  dialogue:
  - 'Ana: ¿Te atreves a saltar al agua? | Ты решишься прыгнуть в воду?'
  - 'Luis: No, está muy fría. | Нет, она очень холодная.'
  - 'Ana: Yo me atrevo si tú me ayudas. | Я решусь, если ты мне поможешь.'
  - 'Luis: Vale, vamos juntos. | Ладно, пойдём вместе.'
  cefr: B1.
  frequency: Частое.
  collocations:
  - atreverse a + инфинитив — осмелиться сделать
  - ¿Cómo te atreves? — Как ты смеешь?
  - no atreverse — не решаться
  collocation_example: No me atrevo a preguntarle. — Я не решаюсь у него спросить.
  trap: 'Не забывайте a и местоимение: se atreve a decir, а не «atrever decir».'
- word: consecuencia
  image: art/galya/consecuencia.png
  ru: последствие, следствие
  ipa: /konseˈkwenθja/
  say: консекуэ́нсья
  pron: Cue читается «куэ»; C перед i — /θ/.
  meaning: 'То, что получается в результате какого-то действия или события. Слово женского рода: la consecuencia. Чаще во множественном числе: las consecuencias.'
  examples:
  - Tiene consecuencias. — У этого есть последствия.
  - Si no estudias, habrá consecuencias en los exámenes. — Если не будешь учиться, будут последствия на экзаменах.
  - Como consecuencia de la lluvia, cancelaron el partido y devolvieron el dinero de las entradas. — Из-за дождя матч отменили и вернули деньги за билеты.
  origin: 'От латинского consequentia «следование»: con- + sequi «следовать». Родственные: consecuente, consiguiente.'
  register: Нейтральное.
  synonyms: []
  analogs:
  - consequence, result — последствие, результат
  dialogue:
  - 'Ana: ¿Por qué llegaste tan tarde? | Почему ты так поздно пришёл?'
  - 'Luis: Hubo un accidente en la carretera. | На шоссе была авария.'
  - 'Ana: ¿Y cuál fue la consecuencia? | И каково было последствие?'
  - 'Luis: Perdí la primera clase. | Я пропустил первую пару.'
  cefr: B1.
  frequency: Очень частое.
  collocations:
  - como consecuencia de — в результате
  - traer consecuencias — иметь последствия
  - en consecuencia — следовательно, соответственно
  collocation_example: Esa decisión tendrá consecuencias graves. — У этого решения будут серьёзные последствия.
  trap: 'Consecuencia — не «consequence»: пишется con-se-cuen-cia, с буквой u после c.'
- word: darse cuenta
  image: art/galya/darse_cuenta.png
  ru: осознать, заметить
  ipa: /ˈdaɾse ˈkwenta/
  say: дáрсе куэ́нта
  pron: Cuenta читается «куэнта».
  meaning: 'Понять или заметить что-то, чего раньше не видел. Возвратный глагол; предлог de или de que: me doy cuenta de eso, me di cuenta de que… Без «de» нельзя.'
  examples:
  - No me di cuenta. — Я не заметила.
  - Me di cuenta de que había olvidado el móvil en el autobús. — Я поняла, что забыла телефон в автобусе.
  - Cuando llegué a casa, me di cuenta de que llevaba los zapatos de mi hermana. — Когда я пришла домой, то заметила, что на мне туфли сестры.
  origin: 'Буквально «дать себе счёт» (cuenta — «счёт, отчёт»): отдать себе отчёт в чём-то.'
  register: Нейтральное, очень частое.
  synonyms: []
  analogs:
  - to realize, to notice — осознать, заметить
  dialogue:
  - 'Ana: ¿Te diste cuenta de lo que dijo? | Ты заметил, что он сказал?'
  - 'Luis: No, estaba distraído. | Нет, я отвлёкся.'
  - 'Ana: Dijo que se va a vivir a otro país. | Он сказал, что уезжает жить в другую страну.'
  - 'Luis: Ahora me doy cuenta de por qué estaba tan serio. | Теперь я понимаю, почему он был таким серьёзным.'
  cefr: B1.
  frequency: Очень частое.
  collocations:
  - darse cuenta de algo — заметить что-то
  - darse cuenta de que — осознать, что
  - sin darse cuenta — не замечая
  collocation_example: Lo hizo sin darse cuenta. — Он сделал это, сам того не замечая.
  trap: 'Нужен предлог de: «me di cuenta que» — частая ошибка (queísmo); правильно me di cuenta de que.'
- word: decidir
  image: art/galya/decidir.png
  ru: решать, принимать решение
  ipa: /deθiˈðiɾ/
  say: десиди́р
  pron: C перед i — /θ/; d между гласными мягкая.
  meaning: Выбрать, как поступить, после раздумий. Можно decidir + инфинитив (decidir viajar) или decidir que + предложение. Возвратная форма decidirse — «решиться».
  examples:
  - Decido hoy. — Я решаю сегодня.
  - El año pasado, por motivos de dinero, mi madre decidió vender la casa. — В прошлом году из-за денег моя мама решила продать дом.
  - Después de pensarlo mucho, decidieron mudarse a una ciudad más tranquila para vivir mejor. — Долго подумав, они решили переехать в более тихий город, чтобы жить лучше.
  origin: 'От латинского decidere «отрезать, решить»: de- + caedere «рубить». Родственные: decisión, decisivo.'
  register: Нейтральное.
  synonyms: []
  analogs:
  - to decide — решать
  dialogue:
  - 'Ana: ¿Ya decidiste adónde vas de vacaciones? | Ты уже решил, куда едешь в отпуск?'
  - 'Luis: Todavía no, estoy pensando. | Ещё нет, я думаю.'
  - 'Ana: Decide pronto, los vuelos suben de precio. | Решай скорее, билеты дорожают.'
  - 'Luis: Tienes razón, decido esta noche. | Ты права, решу сегодня вечером.'
  cefr: A2.
  frequency: Очень частое.
  collocations:
  - decidir hacer algo — решить сделать
  - decidirse por — выбрать
  - decidir entre — выбирать между
  collocation_example: Decidimos quedarnos en casa. — Мы решили остаться дома.
  trap: 'После decidir инфинитив идёт без предлога: decidió salir, а не «decidió a salir».'
- word: destruir
  image: art/galya/destruir.png
  ru: разрушать, уничтожать
  ipa: /destɾuˈiɾ/
  say: дэструи́р
  pron: 'Ударение на последнем слоге; ui читается как отдельные «у-и»: des-tru-ír.'
  meaning: 'Полностью сломать, разрушить или уничтожить что-то: здание, вещь, отношения, надежду. Неправильный глагол, как construir: destruyo, destruyes, destruye.'
  examples:
  - El fuego destruye todo. — Огонь уничтожает всё.
  - La tormenta destruyó el techo de la casa. — Буря разрушила крышу дома.
  - Una mentira puede destruir una amistad de muchos años en solo un minuto. — Одна ложь может разрушить многолетнюю дружбу за одну минуту.
  origin: 'От латинского destruere: de- + struere «строить»: противоположность construir.'
  register: Нейтральное.
  synonyms: []
  analogs:
  - to destroy — разрушать
  dialogue:
  - 'Ana: ¿Viste el edificio después del incendio? | Ты видела здание после пожара?'
  - 'Luis: Sí, el fuego lo destruyó casi todo. | Да, огонь разрушил почти всё.'
  - 'Ana: ¡Qué pena! | Как жаль!'
  - 'Luis: Van a construir uno nuevo. | Построят новое.'
  cefr: B1.
  frequency: Частое.
  collocations:
  - destruir una prueba — уничтожить улики
  - destruir la confianza — разрушить доверие
  - destruido — разрушенный
  collocation_example: El terremoto destruyó el puente. — Землетрясение разрушило мост.
  trap: 'Формы: destruyo, destruyes, destruye (y вместо i): не «destruío».'
- word: escala
  image: art/galya/escala.png
  ru: масштаб, шкала; остановка в пути
  ipa: /esˈkala/
  say: эска́ла
  pron: 'Ударение на первом слоге: ЭС-ка-ла.'
  meaning: 'Слово с несколькими смыслами: 1) шкала или лестница; 2) масштаб карты или явления: a gran escala — «в большом масштабе»; 3) промежуточная остановка самолёта или корабля: hacer escala.'
  examples:
  - El vuelo hace escala. — Рейс с пересадкой.
  - Tenemos una escala de tres horas en Madrid. — У нас пересадка на три часа в Мадриде.
  - El mapa está dibujado a escala, así que cada centímetro representa un kilómetro de camino. — Карта нарисована в масштабе, поэтому каждый сантиметр равен километру пути.
  origin: 'От латинского scala «лестница»: сначала ступени, потом шкала и деления на карте.'
  register: Нейтральное.
  synonyms: []
  analogs:
  - scale — шкала, масштаб; stopover, layover — пересадка
  dialogue:
  - 'Ana: ¿Tu vuelo es directo? | Твой рейс прямой?'
  - 'Luis: No, hace escala en París. | Нет, с пересадкой в Париже.'
  - 'Ana: ¿Cuánto dura la escala? | Сколько длится пересадка?'
  - 'Luis: Solo dos horas. | Всего два часа.'
  cefr: B1.
  frequency: Частое.
  collocations:
  - hacer escala — делать остановку, пересадку
  - a gran escala — в большом масштабе
  - escala de valores — система ценностей
  collocation_example: El avión hará escala en Lisboa. — Самолёт сделает посадку в Лиссабоне.
  trap: 'Escala — не обязательно «лестница»: в путешествиях это почти всегда пересадка.'
- word: evitar
  image: art/galya/evitar.png
  ru: избегать, предотвращать
  ipa: /eβiˈtaɾ/
  say: эбита́р
  pron: B и V одинаково; ударение на последнем слоге.
  meaning: 'Постараться не допустить чего-то или держаться подальше от человека или места. После evitar идёт существительное или инфинитив без предлога: evitar el tráfico, evitar hablar.'
  examples:
  - Evito el café. — Я избегаю кофе.
  - Porque siempre hay mucho tráfico, vamos por otro camino y evitamos la autopista. — Потому что там всегда много машин, мы едем другой дорогой и объезжаем автостраду.
  - Hizo todo lo posible por evitar una discusión con su hermano durante la cena. — Он сделал всё возможное, чтобы избежать ссоры с братом за ужином.
  origin: 'От латинского evitare «избегать»: родственное слово — inevitable «неизбежный».'
  register: Нейтральное.
  synonyms: []
  analogs:
  - to avoid — избегать
  dialogue:
  - 'Ana: ¿Por qué no vas por el centro? | Почему ты не едешь через центр?'
  - 'Luis: Quiero evitar el tráfico. | Хочу избежать пробок.'
  - 'Ana: Es mejor salir temprano. | Лучше выехать пораньше.'
  - 'Luis: Sí, así evito problemas. | Да, так я избегу проблем.'
  cefr: B1.
  frequency: Очень частое.
  collocations:
  - evitar problemas — избегать проблем
  - evitar a alguien — сторониться кого-то
  - evitar el contacto — избегать контакта
  collocation_example: Hay que evitar los errores. — Нужно избегать ошибок.
  trap: 'После evitar нельзя ставить «de»: evitar hablar, а не «evitar de hablar».'
- word: extremadamente
  image: art/galya/extremadamente.png
  ru: крайне, чрезвычайно
  ipa: /ekstɾemaðaˈmente/
  say: экстремадаме́нте
  pron: 'Два ударения: сильное на -men-, слабое на -da-; x звучит как «кс».'
  meaning: 'Наречие, которое усиливает слово: прилагательное, наречие. Значит «в самой высокой степени», сильнее, чем muy. Образовано от extremada + -mente.'
  examples:
  - Estoy extremadamente cansada. — Я крайне устала.
  - Para todos los estudiantes, el examen fue extremadamente difícil. — Для всех студентов экзамен был крайне трудным.
  - Es una persona extremadamente generosa, aunque nunca habla de lo que hace por los demás. — Это чрезвычайно щедрый человек, хотя он никогда не говорит о том, что делает для других.
  origin: 'От extremo «крайний» + суффикс наречий -mente: «в крайней степени».'
  register: Нейтральное, слегка книжное.
  synonyms: []
  analogs:
  - extremely — крайне
  dialogue:
  - 'Ana: ¿Qué tal la película? | Как тебе фильм?'
  - 'Luis: Extremadamente aburrida. | Крайне скучный.'
  - 'Ana: ¿En serio? A mí me gustó. | Правда? А мне понравился.'
  - 'Luis: Entonces somos extremadamente diferentes. | Значит, мы крайне разные.'
  cefr: B1.
  frequency: Частое.
  collocations:
  - extremadamente difícil — крайне трудный
  - extremadamente importante — чрезвычайно важный
  - extremadamente rápido — крайне быстро
  collocation_example: Hace un calor extremadamente fuerte. — Стоит чрезвычайно сильная жара.
  trap: 'У наречий на -mente один суффикс, но в произношении два ударения: extremadaménte.'
- word: fijo
  image: art/galya/fijo.png
  ru: постоянный, неподвижный, фиксированный
  ipa: /ˈfixo/
  say: фи́хо
  pron: 'Ф-и-хо: j читается как русская «х», ударение на первом слоге.'
  meaning: 'То, что не меняется и не двигается: цена, время, работа, место. Меняется по роду: fijo, fija. Teléfono fijo — стационарный телефон.'
  examples:
  - Tengo un teléfono fijo. — У меня есть стационарный телефон.
  - Mi hermana busca un trabajo fijo con horario normal. — Моя сестра ищет постоянную работу с нормальным графиком.
  - El precio es fijo y no se puede negociar, aunque ofrecen un descuento si pagas en efectivo. — Цена фиксированная, и торговаться нельзя, хотя дают скидку при оплате наличными.
  origin: 'От латинского fixus «прикреплённый» (от figere «прикреплять»). Родственные: fijar, fijarse en «обращать внимание».'
  register: Нейтральное.
  synonyms: []
  analogs:
  - fixed, permanent — постоянный, фиксированный
  dialogue:
  - 'Ana: ¿Tienes un trabajo fijo? | У тебя постоянная работа?'
  - 'Luis: No, es temporal. | Нет, временная.'
  - 'Ana: ¿Y quieres uno fijo? | А хочешь постоянную?'
  - 'Luis: Claro, así tengo un sueldo fijo. | Конечно, тогда у меня будет фиксированная зарплата.'
  cefr: B1.
  frequency: Очень частое.
  collocations:
  - un trabajo fijo — постоянная работа
  - un teléfono fijo — стационарный телефон
  - mirar fijamente — пристально смотреть
  collocation_example: Necesito una fecha fija. — Мне нужна точная дата.
  trap: 'Fijo ≠ fijar(se) en: fijarse en = «обратить внимание», а не «зафиксироваться».'
- word: negarse a
  image: art/galya/negarse_a.png
  ru: отказываться
  ipa: /neˈɣaɾse a/
  say: негáрсе а
  pron: G между гласными звучит мягко.
  meaning: 'Решительно не соглашаться что-то делать. Возвратный глагол + a + инфинитив: negarse a hacer algo. Меняет e на ie: me niego, te niegas, se niega.'
  examples:
  - Me niego a ir. — Я отказываюсь идти.
  - Mi hijo se niega a comer verduras desde pequeño. — Мой сын с детства отказывается есть овощи.
  - La empresa se negó a pagar los daños, así que tuvimos que ir a un abogado. — Компания отказалась платить за ущерб, поэтому нам пришлось идти к адвокату.
  origin: 'От латинского negare «отрицать»: родственные negar, negativo.'
  register: Нейтральное.
  synonyms: []
  analogs:
  - to refuse — отказываться
  dialogue:
  - 'Ana: ¿Por qué no hablas con tu jefe? | Почему ты не поговоришь с начальником?'
  - 'Luis: Me niego a pedirle perdón. | Я отказываюсь просить у него прощения.'
  - 'Ana: No es tan difícil. | Это не так уж трудно.'
  - 'Luis: Para mí sí, y no cambio de idea. | Для меня трудно, и я не передумаю.'
  cefr: B1.
  frequency: Частое.
  collocations:
  - negarse a + инфинитив — отказываться делать
  - negarse rotundamente — наотрез отказаться
  - se niega a escuchar — не хочет слушать
  collocation_example: Se niega a aceptar la realidad. — Он отказывается принять реальность.
  trap: 'Не «negar a»: нужен возвратный глагол negarse, и e → ie: me niego, а не «me nego».'
- word: nombrar
  image: art/galya/nombrar.png
  ru: называть, назначать
  ipa: /nomˈbɾaɾ/
  say: номбра́р
  pron: 'Ударение на последнем слоге: nom-BRAR.'
  meaning: '1) назвать по имени, упомянуть; 2) назначить на должность: nombrar a alguien director. Родственное существительное — nombre «имя».'
  examples:
  - No nombres a nadie. — Никого не называй.
  - En la escuela, a mi tío lo nombraron director el año pasado. — В школе моего дядю в прошлом году назначили директором.
  - No quiero nombrar a nadie, pero todos sabemos quién dejó la puerta abierta. — Не хочу называть имён, но все знают, кто оставил дверь открытой.
  origin: 'От nombre «имя»: латинское nomen. Родственные: nombramiento «назначение», nominar.'
  register: Нейтральное.
  synonyms: []
  analogs:
  - to name, to appoint — назвать, назначить
  dialogue:
  - 'Ana: ¿Quién es el nuevo jefe? | Кто новый начальник?'
  - 'Luis: Han nombrado a Carlos. | Назначили Карлоса.'
  - 'Ana: No lo conozco. | Я его не знаю.'
  - 'Luis: Es el que nombró el director en la reunión. | Это тот, кого директор назвал на собрании.'
  cefr: B1.
  frequency: Частое.
  collocations:
  - nombrar a alguien — назначить кого-то
  - nombrar un cargo — назначить на должность
  - sin nombrar — не называя имени
  collocation_example: Lo nombraron presidente del club. — Его назначили президентом клуба.
  trap: 'Nombrar — не «dar un nombre» ребёнку: для имени при рождении говорят poner nombre, llamar.'
- word: occidental
  image: art/galya/occidental.png
  ru: западный
  ipa: /okθiðenˈtal/
  say: оксиденталь
  pron: 'Cc читается как «кс»: ок-си-ден-таль. C перед i — /θ/.'
  meaning: 'Относящийся к Западу: к западной части мира, страны или Европе. Одинаков для мужского и женского рода: cultura occidental. Противоположность — oriental.'
  examples:
  - Es una ciudad occidental. — Это западный город.
  - La cultura occidental influyó mucho en este país. — Западная культура сильно повлияла на эту страну.
  - Aunque vive en Asia, tiene costumbres occidentales y prefiere comer con cuchillo y tenedor. — Хотя он живёт в Азии, у него западные привычки, и он предпочитает есть ножом и вилкой.
  origin: 'От латинского occidere «заходить (о солнце)»: occidens «закат; запад» — там, где солнце садится.'
  register: Нейтральное, книжное.
  synonyms: []
  analogs:
  - western — западный
  dialogue:
  - 'Ana: ¿Te gusta la comida oriental? | Тебе нравится восточная кухня?'
  - 'Luis: Sí, pero prefiero la occidental. | Да, но я предпочитаю западную.'
  - 'Ana: ¿Por qué? | Почему?'
  - 'Luis: Estoy más acostumbrado a ella. | Я больше к ней привык.'
  cefr: B2.
  frequency: Менее частое.
  collocations:
  - cultura occidental — западная культура
  - mundo occidental — западный мир
  - Europa occidental — Западная Европа
  collocation_example: La parte occidental del país es más seca. — Западная часть страны суше.
  trap: 'Две c: oc-ci-den-tal; не «ocidental». Для «западный» в быту чаще oeste: costa oeste.'
- word: pasto
  image: art/galya/pasto.png
  ru: трава, пастбище, корм
  ipa: /ˈpasto/
  say: па́сто
  pron: Ударение на первом слоге.
  meaning: Трава, которую едят животные, или место, где они пасутся. Часто — в сельской жизни. В Латинской Америке pasto — ещё и «газон».
  examples:
  - La vaca come pasto. — Корова ест траву.
  - Los caballos comen pasto en el campo todo el día. — Лошади весь день едят траву на лугу.
  - En primavera el pasto crece rápido y los pastores llevan las ovejas a la montaña. — Весной трава быстро растёт, и пастухи уводят овец в горы.
  origin: 'От латинского pastus «корм, пища»; родственные: pastar «пастись», pastor «пастух».'
  register: Нейтральное.
  synonyms: []
  analogs:
  - pasture, grass — пастбище, трава
  dialogue:
  - 'Ana: ¿Dónde están las vacas? | Где коровы?'
  - 'Luis: En el campo, comiendo pasto. | В поле, едят траву.'
  - 'Ana: ¿Y los caballos? | А лошади?'
  - 'Luis: También, hay mucho pasto fresco. | Тоже, там много свежей травы.'
  cefr: B1.
  frequency: Менее частое.
  collocations:
  - comer pasto — есть траву
  - pasto seco — сухая трава
  - tierra de pasto — пастбище
  collocation_example: Las ovejas buscan pasto en la montaña. — Овцы ищут пастбище в горах.
  trap: Pasto — трава для животных; обычную траву на газоне в Испании чаще называют césped.
- word: rocío
  image: art/galya/rocio.png
  ru: роса
  ipa: /roˈθio/
  say: роси́о
  pron: 'C перед i — /θ/, ударение на i: ro-CÍ-o (отсюда чёрточка).'
  meaning: 'Маленькие капли воды, которые утром лежат на траве и листьях. Слово мужского рода: el rocío.'
  examples:
  - Hay rocío en la hierba. — На траве роса.
  - Por la mañana el rocío moja los zapatos. — Утром роса мочит ботинки.
  - Cuando salió el sol, las gotas de rocío brillaron en las hojas como pequeñas estrellas. — Когда взошло солнце, капли росы засверкали на листьях, как маленькие звёзды.
  origin: 'От латинского ros, roris «роса»; родственные: rociar «обрызгивать», rociada.'
  register: Нейтральное, поэтичное.
  synonyms: []
  analogs:
  - dew — роса
  dialogue:
  - 'Ana: ¿Por qué están mojadas las flores? | Почему цветы мокрые?'
  - 'Luis: Es el rocío de la mañana. | Это утренняя роса.'
  - 'Ana: Qué bonito se ve con el sol. | Как красиво смотрится на солнце.'
  - 'Luis: Sí, parece que brillan. | Да, будто они сияют.'
  cefr: B1.
  frequency: Менее частое.
  collocations:
  - el rocío de la mañana — утренняя роса
  - gotas de rocío — капли росы
  - cubierto de rocío — покрытый росой
  collocation_example: La hierba estaba llena de rocío. — Трава была вся в росе.
  trap: 'Ударение падает на í, поэтому чёрточка обязательна: rocío, а не «rocio». Rocío — ещё и женское имя.'
