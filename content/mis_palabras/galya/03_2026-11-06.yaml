# Третий список Гали (10 слов и выражений). Примеры A1 / A2 / B1–B2, мини-диалог 4 строки, уровень A2–B1.
lang: es
words:
  - word: despistado
    ru: рассеянный
    ipa: /despisˈtaðo/
    say: десписта́до
    pron: "d между гласными звучит мягко, ударение на предпоследнем слоге."
    meaning: "Человек, который легко отвлекается, забывает вещи или не замечает, что происходит вокруг. Меняется по роду: despistado (он), despistada (она)."
    examples:
      - "Mi hermano es muy despistado y siempre pierde las llaves de casa. — Мой брат очень рассеянный и всегда теряет ключи от дома."
      - "Estaba tan despistada que se bajó del tren una estación antes. — Она была так рассеяна, что вышла из поезда на одну станцию раньше."
      - "Aunque es un gran profesor, es tan despistado que olvida dónde deja las gafas. — Хотя он прекрасный преподаватель, он так рассеян, что забывает, куда кладёт очки."
    origin: "От despistar «сбить со следа»: des- + pista «след». Родственные: despistarse, despiste «рассеянность, оплошность»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: distraído
        pair: ["Es un niño muy despistado.", "Es un niño muy distraído."]
        diff:
          - "despistado — рассеянный по характеру, часто забывает и путает вещи"
          - "distraído — отвлечённый, невнимательный в данный момент; ещё «развлекательный»"
    analogs:
      - "absent-minded — рассеянный, витающий в облаках; scatterbrained — несобранный"
    dialogue:
      - "Ana: ¿Has visto mis llaves? Otra vez no las encuentro. | Ты не видел мои ключи? Опять не могу их найти."
      - "Luis: Estás muy despistada últimamente. | Ты в последнее время очень рассеянная."
      - "Ana: Es que ayer no conseguí dormir bien. | Просто вчера мне не удалось нормально поспать."
      - "Luis: Mira, las tienes en la mano. | Смотри, они у тебя в руке."
    cefr: "B1."
    frequency: "Частое в разговорной речи."
    collocations:
      - "ser despistado — быть рассеянным по натуре"
      - "estar despistado — быть не в курсе, потерять ориентацию"
      - "un profesor despistado — рассеянный преподаватель"
      - "hacerse el despistado — делать вид, что не заметил"
    collocation_example: "Se hizo el despistado cuando le pedí el dinero. — Он сделал вид, что не расслышал, когда я попросила денег."
    trap: "Это не «рассеянный» в смысле «разбросанный» (disperso). Estar despistado ещё значит «не понимать, что происходит»: «Estoy despistado con este tema»."

  - word: despistarse
    ru: быть рассеянным, отвлекаться, сбиться с пути
    ipa: /despisˈtaɾse/
    say: десписта́рсе
    pron: "s перед t слабая, ударение на предпоследнем слоге."
    meaning: "Перестать следить за чем-то из-за невнимательности: отвлечься, потерять нить разговора, пропустить остановку или свернуть не туда. Возвратный глагол."
    examples:
      - "Me despisto cuando hay mucho ruido en la clase de música. — Я отвлекаюсь, когда на уроке музыки очень шумно."
      - "Me despisté con el móvil y perdí el último autobús a casa. — Я отвлеклась на телефон и упустила последний автобус домой."
      - "Si te despistas un segundo en la autopista, puedes perder la salida correcta. — Если отвлечься на секунду на трассе, можно пропустить нужный съезд."
    origin: "От despistar «сбить со следа»: des- + pista «след». Родственные: despistado, despiste."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: distraerse
        pair: ["Me despisto en clase.", "Me distraigo en clase."]
        diff:
          - "distraerse — отвлечься (в том числе развлечься): «distraerse con un libro»"
          - "despistarse — отвлечься и из-за этого сбиться: потерять дорогу, пропустить остановку, забыть"
    analogs:
      - "to get distracted — отвлечься; to lose track — потерять нить"
    dialogue:
      - "Pablo: ¿Por qué llegas tan tarde? | Почему ты так поздно?"
      - "Lucía: Me despisté y bajé del metro una parada después. | Я отвлеклась и вышла из метро на одну остановку позже."
      - "Pablo: Tienes que estar más atenta. | Тебе надо быть внимательнее."
      - "Lucía: Lo sé, pero estaba leyendo un informe y no miraba nada más. | Знаю, но я читала доклад и ничего вокруг не замечала."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "despistarse un momento — отвлечься на минуту"
      - "despistarse con algo — отвлечься на что-то"
      - "despistarse en el camino — сбиться с дороги"
      - "no te despistes — не отвлекайся, будь внимателен"
    collocation_example: "No te despistes, que la salida está cerca. — Не отвлекайся, съезд уже близко."
    trap: "Без se слово despistar — переходный глагол «сбить с толку»: «Me despistó su pregunta» — «Его вопрос сбил меня с толку»."

  - word: en cambio
    ru: зато, напротив
    ipa: /en ˈkambjo/
    say: эн ка́мбьо
    pron: "n перед b звучит как m: «эм камбьо»; ударение на ca-."
    meaning: "Вводное выражение противопоставления: то, что сказано дальше, контрастирует с предыдущим. Часто переводится «зато» (плюс после минуса) или «а, напротив»."
    examples:
      - "Yo hablo español, en cambio mi hermano habla francés. — Я говорю по-испански, а мой брат, напротив, говорит по-французски."
      - "El piso es pequeño; en cambio, está muy cerca del centro. — Квартира маленькая, зато очень близко к центру."
      - "Mi madre prefiere pasar el verano en el campo; mi padre, en cambio, se va siempre a la playa. — Мама предпочитает проводить лето в деревне, а отец, наоборот, всегда уезжает на пляж."
    origin: "Предлог en + cambio «обмен, перемена»: буквально «взамен»; отсюда оттенок «наоборот, зато»."
    register: "Нейтральное, подходит и для речи, и для письма."
    synonyms:
      - word: por el contrario
        pair: ["Ella es tímida; él, en cambio, es muy abierto.", "Ella es tímida; él, por el contrario, es muy abierto."]
        diff:
          - "por el contrario — книжнее, прямое «наоборот»"
          - "en cambio — обычное, может значить и «зато» (компенсация)"
    analogs:
      - "on the other hand — с другой стороны; whereas — тогда как"
    dialogue:
      - "Ana: ¿Qué tal el hotel? | Как отель?"
      - "Luis: La habitación es pequeña; en cambio, el desayuno es exquisito. | Номер маленький, зато завтрак превосходный."
      - "Ana: ¿Y el ambiente? | А атмосфера?"
      - "Luis: Tranquilo. Mi hermano, en cambio, prefiere un sitio más animado. | Спокойная. А мой брат, напротив, предпочитает место поживее."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "A; en cambio, B — А, зато Б"
      - "yo, en cambio, … — а я, напротив, …"
      - "dar algo en cambio — дать что-то взамен"
      - "a cambio de — в обмен на"
    collocation_example: "No tengo coche; en cambio, tengo una bicicleta muy buena. — У меня нет машины, зато есть очень хороший велосипед."
    trap: "Не путайте с a cambio de «в обмен на»: «Te doy esto a cambio de tu ayuda». En cambio всегда стоит между двумя противопоставленными частями."

  - word: mientras
    ru: пока, в то время как
    ipa: /ˈmjentɾas/
    say: мье́нтрас
    pron: "ie читается как «ье», ударение на первом слоге."
    meaning: "Союз: два действия идут одновременно («пока») или противопоставляются («в то время как»). С subjuntivo в будущем: mientras no + subj. — «пока не»."
    examples:
      - "Mi madre cocina mientras yo pongo la mesa para la cena. — Мама готовит, пока я накрываю на стол к ужину."
      - "Mientras esperaba el autobús, leí casi un capítulo entero del libro. — Пока я ждал автобус, я прочитал почти целую главу книги."
      - "Mientras no consigas el visado, no podremos reservar los billetes de avión. — Пока ты не получишь визу, мы не сможем забронировать билеты на самолёт."
    origin: "От лат. dum interim «пока тем временем»: dum + interim. Родственное выражение: mientras tanto «тем временем»."
    register: "Нейтральное."
    synonyms:
      - word: mientras que
        pair: ["Ella estudia mientras él duerme.", "Ella estudia mientras que él duerme."]
        diff:
          - "mientras — просто одновременность («пока»)"
          - "mientras que — подчёркивает контраст: «в то время как, тогда как»"
    analogs:
      - "while — пока, в то время как; as long as — пока, при условии"
    dialogue:
      - "Luis: ¿Qué haces ahí tan callada? | Что ты там делаешь так тихо?"
      - "Ana: Preparo el informe mientras tú ves la tele. | Готовлю доклад, пока ты смотришь телевизор."
      - "Luis: Mientras no termines, no te molesto. | Пока ты не закончишь, не буду тебе мешать."
      - "Ana: Gracias. Mientras tanto, pon la mesa. | Спасибо. А пока накрой на стол."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "mientras tanto — тем временем"
      - "mientras que — в то время как"
      - "mientras no + subjuntivo — пока не"
      - "mientras más… más… — чем больше… тем больше…"
    collocation_example: "Mientras tanto, nosotros preparamos la comida. — А мы тем временем готовим еду."
    trap: "С прошедшим и настоящим — indicativo (mientras duerme), а для будущего — subjuntivo: «Mientras no llegues, no empezamos». Это не «пока не» в смысле hasta que: mientras no — «пока ты не пришёл (не придёшь)»."

  - word: encargarse de
    ru: заниматься (чем-то), отвечать за
    ipa: /eŋkaɾˈɣaɾse ðe/
    say: энкарга́рсе дэ
    pron: "g между гласными звучит мягко, ударение на предпоследнем слоге."
    meaning: "Взять на себя задачу или ответственность. Возвратный глагол всегда с предлогом de: encargarse de algo или de + инфинитив. Спрягается: me encargo, te encargas, se encarga."
    examples:
      - "Yo me encargo de la comida y tú te encargas de la música. — Я занимаюсь едой, а ты — музыкой."
      - "Mi hermana se encarga de cuidar a los niños por las tardes. — Моя сестра по вечерам присматривает за детьми."
      - "Necesitamos a alguien que se encargue de que todos los papeles estén listos antes del viaje. — Нам нужен кто-то, кто возьмёт на себя заботу о том, чтобы все бумаги были готовы до поездки."
    origin: "От encargar «поручать»: en- + cargo «поручение, должность». Родственные: encargo «заказ, поручение», encargado «ответственный, управляющий»."
    register: "Нейтральное."
    synonyms:
      - word: ocuparse de
        pair: ["Ella se encarga de las cuentas.", "Ella se ocupa de las cuentas."]
        diff:
          - "ocuparse de — «заниматься» в широком смысле (делом, ребёнком, вопросом)"
          - "encargarse de — «взять на себя, отвечать за»: акцент на поручении и ответственности"
    analogs:
      - "to take care of — позаботиться о; to be in charge of — отвечать за"
    dialogue:
      - "Pablo: ¿Quién se encarga del viaje? | Кто занимается поездкой?"
      - "Lucía: Yo me encargo de los billetes. | Я занимаюсь билетами."
      - "Pablo: Entonces yo me encargo del hotel. | Тогда я займусь отелем."
      - "Lucía: Perfecto. Y el visado lo consigue Ana. | Отлично. А визу достанет Ана."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "encargarse de todo — заняться всем"
      - "encargarse de + инфинитив — взять на себя (сделать)"
      - "encargarse de que + subjuntivo — позаботиться, чтобы"
      - "yo me encargo — я займусь"
    collocation_example: "Tranquilo, yo me encargo de que todo salga bien. — Не волнуйся, я позабочусь, чтобы всё прошло хорошо."
    trap: "Предлог de обязателен: не «encargarse algo». Без se глагол encargar значит «заказать, поручить»: «Encargué una tarta» — «Я заказала торт»."

  - word: temer
    ru: бояться, опасаться
    ipa: /teˈmeɾ/
    say: тэме́р
    meaning: "Испытывать страх перед кем-то или чем-то, а также опасаться, что произойдёт плохое. Конструкции: temer algo, temer a alguien, temer + инфинитив, temer que + subjuntivo."
    examples:
      - "Mi perro teme los truenos y se esconde debajo de la cama. — Моя собака боится грома и прячется под кровать."
      - "Los niños temen al profesor porque siempre grita en clase. — Дети боятся учителя, потому что он всегда кричит на уроке."
      - "Temo que no lleguemos a tiempo si el tren sale con retraso. — Боюсь, что мы не успеем, если поезд выйдет с опозданием."
    origin: "Лат. timere «бояться». Родственные: temor «страх», temeroso «боязливый», temible «грозный»."
    register: "Нейтральное, чуть книжное: в разговоре чаще tener miedo."
    synonyms:
      - word: tener miedo
        pair: ["Temo la oscuridad.", "Tengo miedo de la oscuridad."]
        diff:
          - "tener miedo (de) — обычное разговорное «бояться»"
          - "temer — чуть книжнее, часто «опасаться, что…»"
    analogs:
      - "to fear — бояться, опасаться; to be afraid of — бояться чего-то"
    dialogue:
      - "Ana: ¿Por qué no sales a presentar el informe? | Почему ты не выходишь представить доклад?"
      - "Luis: Temo equivocarme delante de todos. | Боюсь ошибиться перед всеми."
      - "Ana: No pasa nada. Yo asistí a tu ensayo y salió muy bien. | Ничего. Я была на твоей репетиции, всё вышло очень хорошо."
      - "Luis: Aun así, temo que me quede en blanco. | Всё равно боюсь, что у меня в голове станет пусто."
    cefr: "B1."
    frequency: "Средней частоты; чаще в письменной речи и новостях."
    collocations:
      - "temer por alguien — бояться за кого-то"
      - "temer lo peor — опасаться худшего"
      - "temer que + subjuntivo — бояться, что…"
      - "no hay nada que temer — нечего бояться"
    collocation_example: "Temo por mi hijo cuando viaja solo. — Я боюсь за сына, когда он путешествует один."
    trap: "После temer que идёт subjuntivo: «Temo que llueva», не «llueve». Фраза «Me temo que sí» — вежливое «боюсь, что да» (о плохой новости)."

  - word: hueco
    ru: пробел, пустое место, свободное окно
    ipa: /ˈweko/
    say: уэ́ко
    pron: "hue читается как «уэ»: h не звучит, ударение на первом слоге."
    meaning: "El hueco — пустое место внутри чего-то или между предметами: свободное место, ниша, пробел. Ещё «окошко» в расписании: свободное время."
    examples:
      - "Hay un hueco en el armario para tus zapatos. — В шкафу есть свободное место для твоей обуви."
      - "No encuentro ningún hueco libre para dejar el coche cerca. — Не нахожу ни одного свободного места, чтобы поставить машину рядом."
      - "Si tienes un hueco esta semana, podemos quedar para hablar del informe. — Если у тебя на этой неделе есть окошко, можем встретиться и обсудить доклад."
    origin: "Происхождение окончательно не установлено. Родственные: ahuecar «сделать полым, взбить», hueco как прилагательное «пустой, полый»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: espacio
        pair: ["Hay un hueco en la estantería.", "Hay un espacio en la estantería."]
        diff:
          - "espacio — общее «пространство, место», без привязки к соседним предметам"
          - "hueco — конкретная пустота между предметами или внутри чего-то"
    analogs:
      - "gap — просвет, пробел; slot — окошко в расписании; space — место"
    dialogue:
      - "Lucía: ¿Tienes un hueco hoy para reunirnos? | У тебя есть сегодня окошко, чтобы встретиться?"
      - "Pablo: Solo a las cinco. Antes estoy en una reunión. | Только в пять. Раньше я на совещании."
      - "Lucía: Vale. Mientras tanto busco un hueco para aparcar. | Хорошо. А пока поищу место, где припарковаться."
      - "Pablo: Buena suerte, aquí no hay ni un hueco. | Удачи, здесь нет ни одного свободного места."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "hacer un hueco — найти место или время"
      - "un hueco libre — свободное место, свободное окно"
      - "un hueco en la agenda — окно в расписании"
      - "tapar un hueco — закрыть пробел"
    collocation_example: "Siempre hace un hueco para sus amigos. — Он всегда находит время для друзей."
    trap: "Слово мужского рода: el hueco. Как прилагательное hueco значит «пустой внутри, полый»: «un árbol hueco». Это не vacío — «пустой, ничем не заполненный»."

  - word: ración
    ru: порция
    ipa: /raˈθjon/
    say: расьо́н
    pron: "c перед i — [θ] в Испании (кончик языка между зубами), в Америке — «с»; ударение на последнем слоге."
    meaning: "Количество еды на одного или на компанию, особенно в баре и ресторане: una ración de jamón, de croquetas. Порция больше, чем tapa."
    examples:
      - "Quiero una ración de patatas bravas para compartir. — Хочу порцию пататас бравас на двоих."
      - "Pedimos tres raciones de tortilla porque éramos seis amigos con hambre. — Мы заказали три порции тортильи, потому что нас было шестеро голодных друзей."
      - "Aunque la ración era grande, entre los cuatro no dejamos ni una migaja. — Хотя порция была большая, вчетвером мы не оставили ни крошки."
    origin: "Лат. ratio «расчёт, мера»: «отмеренная доля». Родственные: racionar «выдавать по норме», racional, razón."
    register: "Нейтральное; слово из жизни баров и кафе."
    synonyms:
      - word: porción
        pair: ["Una ración de tarta, por favor.", "Una porción de tarta, por favor."]
        diff:
          - "porción — часть целого, кусок (торта, пиццы)"
          - "ración — порция блюда, которую подают в заведении"
    analogs:
      - "portion; serving — порция; ration — паёк, норма (ложный друг: чаще о лимите еды)"
    dialogue:
      - "Ana: ¿Pedimos una ración de croquetas? | Закажем порцию крокет?"
      - "Luis: Mejor dos. En este bar las raciones son pequeñas. | Лучше две. В этом баре порции маленькие."
      - "Ana: Por lo visto, antes eran más grandes. | Судя по всему, раньше они были больше."
      - "Luis: Sí, pero el ambiente sigue siendo genial. | Да, но атмосфера всё равно отличная."
    cefr: "A2."
    frequency: "Очень частое в барах и ресторанах Испании."
    collocations:
      - "una ración de + продукт — порция чего-то"
      - "media ración — половина порции"
      - "tapa o ración — маленькая закуска или большая порция"
      - "compartir una ración — разделить порцию на всех"
    collocation_example: "Pedimos media ración de jamón y una de queso. — Мы взяли полпорции хамона и порцию сыра."
    trap: "В барах Испании tapa — маленькая закуска, media ración — средняя, ración — большая для компании. Это не «рацион питания»: для него — dieta или régimen."

  - word: región
    ru: область, регион
    ipa: /reˈxjon/
    say: рэхьо́н
    pron: "g перед i звучит как русское «х»; ударение на последнем слоге."
    meaning: "Часть страны или территории, выделенная по географическим, климатическим или культурным признакам; иногда административная единица."
    examples:
      - "Esta región es famosa por su queso y su vino. — Этот регион знаменит своим сыром и вином."
      - "Vivo en una región del norte de España donde llueve mucho. — Я живу в регионе на севере Испании, где много дождей."
      - "Esta región, que antes era pobre, se ha convertido en un destino turístico muy popular. — Этот регион, раньше бедный, стал очень популярным туристическим направлением."
    origin: "Лат. regio «направление, область» от regere «направлять, управлять». Родственные: regional, regir, regla."
    register: "Нейтральное."
    synonyms:
      - word: zona
        pair: ["Es una región turística.", "Es una zona turística."]
        diff:
          - "zona — любое место с общими признаками, меньше и менее формально"
          - "región — большая территория, часто с названием и особой культурой"
    analogs:
      - "region — то же значение; area — зона, район"
    dialogue:
      - "Ana: ¿De qué región eres? | Из какого ты региона?"
      - "Luis: De una región con muchas montañas y poca población. | Из региона, где много гор и мало жителей."
      - "Ana: ¿Hay alguna cordillera cerca? | Там рядом есть горная цепь?"
      - "Luis: Sí, y en invierno se esquía muy bien. | Да, и зимой там отлично катаются на лыжах."
    cefr: "A2."
    frequency: "Очень частое в новостях и путешествиях."
    collocations:
      - "región vinícola — винодельческий регион"
      - "en toda la región — по всему региону"
      - "regiones del país — регионы страны"
      - "región montañosa — горный регион"
    collocation_example: "Esta región produce el mejor aceite del país. — Этот регион производит лучшее в стране масло."
    trap: "Region — это большая территория. Район города — barrio или distrito, а «область в составе страны» в Испании чаще называют comunidad autónoma."

  - word: visado
    ru: виза
    ipa: /biˈsaðo/
    say: биса́до
    pron: "v читается как «б», d между гласными звучит мягко; ударение на предпоследнем слоге."
    meaning: "El visado — отметка в паспорте или документ, разрешающий въезд и пребывание в стране на определённый срок. Слово мужского рода."
    examples:
      - "Necesito un visado para viajar a Estados Unidos. — Мне нужна виза, чтобы поехать в США."
      - "Mi amiga pidió el visado hace dos meses y todavía no lo ha recibido. — Моя подруга подала на визу два месяца назад и до сих пор её не получила."
      - "Si quieres conseguir el visado a tiempo, tienes que entregar los documentos esta semana. — Если хочешь получить визу вовремя, нужно сдать документы на этой неделе."
    origin: "От visar «ставить визу, визировать»: лат. visus «увиденный». Родственные: visa (вариант в Латинской Америке), visar, visto bueno."
    register: "Нейтральное, официальное."
    synonyms:
      - word: visa
        pair: ["Necesito un visado.", "Necesito una visa."]
        diff:
          - "visado — стандартное слово в Испании"
          - "visa — вариант Латинской Америки (женского рода); в Испании visa ещё значит карту Visa"
    analogs:
      - "visa — то же значение (в английском та же основа)"
    dialogue:
      - "Pablo: ¿Ya tienes el visado para el viaje? | У тебя уже есть виза для поездки?"
      - "Lucía: Todavía no. Ayer fui a la embajada y me pidieron otro documento. | Ещё нет. Вчера я ходила в посольство, и у меня попросили ещё один документ."
      - "Pablo: Ojo, no te despistes con los plazos. | Осторожно, не забудь про сроки."
      - "Lucía: Tranquilo, me encargo yo hoy mismo. | Не волнуйся, я займусь этим сегодня же."
    cefr: "B1."
    frequency: "Частое при поездках за границу."
    collocations:
      - "pedir un visado — подать на визу"
      - "conseguir un visado — получить визу"
      - "visado de turista / de estudiante — туристическая / студенческая виза"
      - "visado caducado — просроченная виза"
    collocation_example: "Me han concedido el visado por seis meses. — Мне выдали визу на шесть месяцев."
    trap: "Слово мужского рода: el visado, не «la visado». Слово visa в Испании чаще означает банковскую карту Visa; для документа лучше visado."
