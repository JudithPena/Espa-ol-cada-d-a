# Пятый список автора, часть 7 — «Desconcierto en el hospital 6» (слова 1–11).
lang: es
words:
  - word: calmante
    ru: успокоительное
    ipa: /kalˈmante/
    say: кальма́нтэ
    meaning: "Лекарство, которое снимает боль или волнение. Как прилагательное — «успокаивающий»."
    examples:
      - "Tomó un calmante antes de dormir. — Он принял успокоительное перед сном."
      - "Antes de operarle la rodilla, le dieron un calmante para el dolor. — Перед операцией на колене ему дали обезболивающее."
      - "Esta infusión es un calmante natural que ayuda a relajarse después de un día de trabajo. — Этот отвар – натуральное успокоительное, которое помогает расслабиться после рабочего дня."
    origin: "Причастие настоящего времени от calmar «успокаивать» (calma «покой»; греч. kauma «зной, полуденный отдых»). Родственные: calma «спокойствие», calmar."
    register: "Нейтральное, медицинское."
    synonyms:
      - word: sedante
        pair: ["Le dieron un calmante.", "Le dieron un sedante."]
        diff:
          - "sedante — «седативное», врачебный термин, сильнее"
          - "calmante — обиходное «успокоительное, обезболивающее»"
    analogs:
      - "painkiller — обезболивающее"
      - "sedative — успокоительное"
    dialogue:
      - "Ana: ¿Te duele mucho? | Тебе очень больно?"
      - "Pablo: Sí, necesito un calmante. | Да, мне нужно болеутоляющее."
      - "Ana: Toma, un comprimido. Con un vaso de agua. | Держи, таблетка. Со стаканом воды."
      - "Pablo: Gracias. Y si me duele más tarde, ¿puedo tomar otro? | Спасибо. А если позже заболит сильнее, можно принять ещё?"
      - "Ana: Cada ocho horas, no antes. Lee la advertencia. | Каждые восемь часов, не раньше. Прочитай предупреждение."
      - "Pablo: Ya, no conviene ingerir más de la cuenta. | Да, принимать больше нормы не стоит."
      - "Ana: Descansa un rato. Vigilo yo por si empeoras. | Отдохни немного. Я присмотрю, вдруг станет хуже."
      - "Pablo: Gracias, de verdad. Contigo me siento muy tranquilo. | Спасибо, правда. С тобой я чувствую себя очень спокойно."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "tomar un calmante — принять успокоительное"
      - "un calmante natural — натуральное успокоительное"
      - "calmar el dolor — унять боль"
    collocation_example: "Esta infusión es un calmante natural. — Этот отвар — натуральное успокоительное."
    trap: "Calmante — и «успокоительное», и «обезболивающее» (дословно: «то, что успокаивает боль»). Не путайте с calmar «успокаивать» (глагол)."

  - word: destapado
    ru: раскрытый, не накрытый
    ipa: /destaˈpaðo/
    say: дэстапа́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О том, что осталось без крышки или одеяла: открытое. О человеке в постели — «раскрывшийся»."
    examples:
      - "La olla quedó destapada toda la noche. — Кастрюля всю ночь простояла открытой."
      - "Dejó el frasco sobre la mesa, destapado, y por la mañana olía a medicina. — Он оставил флакон на столе открытым, и утром пахло лекарством."
      - "Se quedó destapado toda la noche, y por la mañana tenía los pies helados y la nariz tapada. — Он всю ночь пролежал раскрытым, и утром у него были ледяные ноги и заложенный нос."
    origin: "Причастие от destapar «открывать» (des- «не» + tapar «закрывать, накрывать»). Родственные: tapa «крышка», tapón «пробка», tapar «накрыть»."
    register: "Нейтральное."
    synonyms:
      - word: descubierto
        pair: ["Dormía destapado.", "Dormía descubierto."]
        diff:
          - "descubierto — «раскрытый, без покрова»; и «обнаруженный»"
          - "destapado — «без крышки, не накрытый» предмет или человек в постели"
    analogs:
      - "uncovered — не накрытый"
      - "open — открытый"
    dialogue:
      - "Ana: ¿Por qué tienes frío? | Почему тебе холодно?"
      - "Pablo: Dormí destapado. | Я спал раскрытым."
      - "Ana: ¿Sin manta? | Без одеяла?"
      - "Pablo: Se me cayó al suelo en mitad de la noche y no me di cuenta. Me desperté encogido. | Она упала на пол посреди ночи, и я не заметил. Проснулся, съёжившись."
      - "Ana: Con razón estás resfriado. | Неудивительно, что ты простужен."
      - "Pablo: Sí, y con la sábana destapada ni siquiera me cubría. | Да, и простыня была сбита, так что я даже не был ничем укрыт."
      - "Ana: Ponte una colcha gruesa esta noche. Y un calcetín, por si acaso. | Накройся сегодня толстым покрывалом. И надень носки, на всякий случай."
      - "Pablo: Buen consejo. No quiero otro resfriado. | Хороший совет. Мне не нужна ещё одна простуда."
    cefr: "B1."
    frequency: "Частое в быту."
    collocations:
      - "destapar la olla — открыть кастрюлю"
      - "destaparse en la cama — раскрыться во сне"
      - "destapar un escándalo — разоблачить скандал"
    collocation_example: "El periódico destapó un escándalo político. — Газета разоблачила политический скандал."
    trap: "Destapar — ещё «разоблачить»: destapar un caso. Причастие согласуется: destapada, destapados. Не путайте с destacar «выделять»."

  - word: encogido
    ru: сжавшийся, свернувшийся
    ipa: /eŋkoˈxiðo/
    say: энкохи́до
    pron: "n перед k звучит как носовое [ŋ]; g перед i — «х»."
    meaning: "О позе человека: съёжившийся, подтянувший колени, спрятавшийся в комок. Ещё — «севший» (о ткани)."
    examples:
      - "El perro dormía encogido junto a la puerta. — Собака спала, свернувшись у двери."
      - "Esperando a que dejara de llover, se quedó en un rincón del portal, encogido. — Ожидая, пока перестанет дождь, он остался в углу подъезда, сжавшись."
      - "Dormía encogido en el sofá, con las rodillas contra el pecho, porque hacía mucho frío en la habitación. — Он спал, свернувшись на диване, с коленями у груди, потому что в комнате было очень холодно."
    origin: "Причастие от encoger «сжимать» (лат. *incollige: in- + coger «собирать»). Родственные: coger «брать», recoger «собирать»."
    register: "Нейтральное."
    synonyms:
      - word: acurrucado
        pair: ["Dormía encogido.", "Dormía acurrucado."]
        diff:
          - "acurrucado — «свернувшийся уютно, как кошка», тепло и мягко"
          - "encogido — «съёжившийся, сжавшийся», может быть от холода или страха"
    analogs:
      - "curled up — свернувшийся"
      - "shrunk — севший"
    dialogue:
      - "Ana: ¿Cómo estaba el niño? | Как был ребёнок?"
      - "Pablo: Encogido en la cama, con frío. | Съёжившийся на кровати, замёрзший."
      - "Ana: Pobrecito. ¿Tenía fiebre? | Бедняжка. У него была температура?"
      - "Pablo: Un poco. Estaba pálido y encogido bajo la sábana, temblando. | Небольшая. Он был бледен и свернулся под простынёй, дрожа."
      - "Ana: ¿Le diste un calmante? | Ты дал ему успокоительное?"
      - "Pablo: Sí, y lo tapé con una colcha. Poco a poco se despejó. | Да, и накрыл покрывалом. Понемногу ему стало лучше."
      - "Ana: Menos mal. ¿Y ahora? | Слава богу. А теперь?"
      - "Pablo: Duerme tranquilo, sumido en un sueño profundo. | Спит спокойно, в глубоком сне."
    cefr: "B2."
    frequency: "Частое в описаниях."
    collocations:
      - "encogerse de hombros — пожать плечами"
      - "encogerse de miedo — съёжиться от страха"
      - "encoger la ropa — сесть (об одежде)"
    collocation_example: "Se encogió de hombros y no dijo nada. — Он пожал плечами и ничего не сказал."
    trap: "Encoger спрягается: encojo (j перед o), encoges. Не путайте с recoger «подобрать» и coger «брать»."

  - word: como un ovillo
    ru: клубочком
    ipa: /ˈkomo un oˈβiʎo/
    say: ко́мо ун оби́йо
    pron: "ll в большинстве регионов — как «й»; v/b между гласными мягкая [β]."
    meaning: "Образ: свернувшись, как клубок. Ovillo — «клубок (ниток, шерсти)»."
    examples:
      - "La niña dormía como un ovillo. — Девочка спала свернувшись клубочком."
      - "El gato dormía hecho un ovillo en el sillón del salón. — Кот спал клубочком в кресле в гостиной."
      - "Se acurrucó como un ovillo en la cama y se tapó hasta la cabeza para no oír la tormenta. — Она свернулась клубочком на кровати и укрылась с головой, чтобы не слышать грозу."
    origin: "От лат. globellus «шарик», уменьшительное от globus «шар». Родственные: globo «шар; воздушный шарик», glóbulo «шарик»."
    register: "Нейтральное, образное."
    synonyms:
      - word: hecho un ovillo
        pair: ["Dormía como un ovillo.", "Dormía hecho un ovillo."]
        diff:
          - "hecho un ovillo — «превратившись в клубок», обычное сочетание"
          - "como un ovillo — «как клубок», сравнение"
    analogs:
      - "curled up in a ball — свернувшись клубком"
      - "in a heap — сжавшись комом"
    dialogue:
      - "Ana: ¿Dónde está el gato? | Где кот?"
      - "Pablo: Durmiendo hecho un ovillo. | Спит, свернувшись клубочком."
      - "Ana: ¿Dónde? | Где?"
      - "Pablo: En el sillón, junto a la ventana, donde da el sol. Parece una bola de pelo rojizo. | В кресле у окна, где светит солнце. Похож на комок рыжеватой шерсти."
      - "Ana: Qué ternura. Siempre elige el sitio más acogedor. | Какая нежность. Он всегда выбирает самое уютное место."
      - "Pablo: Sí, y no hay manera de despertarlo. Duerme de un tirón hasta la tarde. | Да, и разбудить его невозможно. Спит без перерыва до вечера."
      - "Ana: Qué envidia. Yo duermo hecha un ovillo con el frío. | Какая зависть. А я зимой сплю клубочком от холода."
      - "Pablo: Pues no te destapes, que si no, te resfrías. | Тогда не раскрывайся, а то простудишься."
    cefr: "C1."
    frequency: "Частое в описаниях."
    collocations:
      - "hecho un ovillo — свернувшись клубком"
      - "un ovillo de lana — клубок шерсти"
      - "enredarse como un ovillo — запутаться клубком"
    collocation_example: "Compró un ovillo de lana roja para tejer. — Она купила клубок красной шерсти для вязания."
    trap: "Ovillo — клубок ниток. Не путайте с ovillar «сматывать» и oruga «гусеница». Часто: hacerse un ovillo — «свернуться клубком»."

  - word: sábana
    ru: простыня
    ipa: /ˈsaβana/
    say: са́бана
    pron: "b между гласными мягкая [β]; ударение на первом слоге."
    meaning: "Тонкое полотно, на котором спят или которым накрываются. Estar pegado a las sábanas — «залежаться в постели»."
    examples:
      - "Cambié las sábanas de la cama. — Я поменял простыни на кровати."
      - "Para que se secaran antes de la noche, tendió al sol las sábanas blancas. — Чтобы они высохли до ночи, она развесила на солнце белые простыни."
      - "Se tapó con la sábana hasta la cabeza, porque en verano no se aguanta ni una manta. — Он накрылся простынёй с головой, потому что летом даже одеяло не терпишь."
    origin: "Через лат. sabana из греч. sabanon «полотенце» (из арабского). В испанском закрепилось как «простыня»."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "sheet — простыня"
      - "bed sheet — постельная простыня"
    dialogue:
      - "Ana: ¿Qué hay en la lavadora? | Что в стиральной машине?"
      - "Pablo: Las sábanas de la cama. | Простыни с кровати."
      - "Ana: ¿Ya? Las cambiaste hace poco. | Уже? Ты менял их недавно."
      - "Pablo: Sí, pero el niño se resfrió y sudó mucho. Es mejor cambiar las sábanas cuanto antes. | Да, но ребёнок простудился и сильно вспотел. Лучше поменять простыни как можно скорее."
      - "Ana: ¿Y la colcha? | А покрывало?"
      - "Pablo: También la lavé. Ahora está en la terraza, secándose al sol. | Тоже постирал. Теперь оно на террасе, сохнет на солнце."
      - "Ana: Qué eficaz. Yo no sabría ni cómo poner una sábana bajera. | Какой ты расторопный. Я бы даже не знала, как постелить нижнюю простыню."
      - "Pablo: Es cuestión de práctica. Con paciencia se aprende. | Вопрос практики. С терпением всему учатся."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "cambiar las sábanas — поменять простыни"
      - "pegársele las sábanas — залежаться в постели"
      - "sábana bajera — нижняя простыня"
    collocation_example: "Se me pegaron las sábanas y llegué tarde. — Я проспал и опоздал."
    trap: "Sábana — простыня, а «одеяло» — manta или edredón. Не путайте с sabana «саванна» (без знака ударения)."

  - word: colcha
    ru: покрывало
    ipa: /ˈkoltʃa/
    say: ко́льча
    pron: "ch — «ч»."
    meaning: "Красивое покрывало, которым застилают кровать сверху. Ещё — «стёганое одеяло»."
    examples:
      - "Cubrió la cama con una colcha. — Она накрыла кровать покрывалом."
      - "La colcha era azul, con flores pequeñas, y combinaba muy bien con las cortinas. — Покрывало было синим, с маленькими цветочками, и хорошо сочеталось со шторами."
      - "Se sentó en el borde de la cama y alisó la colcha con la mano antes de salir de la habitación. — Она села на край кровати и разгладила покрывало рукой, прежде чем выйти из комнаты."
    origin: "Из лат. culcita «матрас, подушка». Родственное: colchón «матрас», acolchado «стёганый»."
    register: "Нейтральное."
    synonyms:
      - word: cubrecama
        pair: ["Puso una colcha.", "Puso un cubrecama."]
        diff:
          - "cubrecama — «покрывало» буквально «накрыватель кровати»"
          - "colcha — привычное слово, и нарядное покрывало"
    analogs:
      - "bedspread — покрывало"
      - "quilt — стёганое одеяло"
    dialogue:
      - "Ana: ¿Qué compraste para el cuarto? | Что ты купила для комнаты?"
      - "Pablo: Una colcha nueva y cortinas. | Новое покрывало и шторы."
      - "Ana: ¿De qué color? | Какого цвета?"
      - "Pablo: Una colcha rojiza, con flores pequeñas. Me gustó porque no es nada hortera. | Рыжеватое покрывало с маленькими цветами. Мне понравилось, потому что оно совсем не безвкусное."
      - "Ana: Suena bonito. ¿Y las cortinas? | Звучит красиво. А шторы?"
      - "Pablo: Blancas, sobrias, para que entre mucha luz y todo parezca más acogedor. | Белые, строгие, чтобы входило много света и всё казалось уютнее."
      - "Ana: ¿Y cuánto te costó todo? | И сколько всё стоило?"
      - "Pablo: No demasiado. Con IVA incluido, unos cincuenta euros. | Не слишком много. С НДС около пятидесяти евро."
    cefr: "B2."
    frequency: "Частое в быту."
    collocations:
      - "colcha de lana — шерстяное покрывало"
      - "cama con colcha — застеленная кровать"
      - "colchón y colcha — матрас и покрывало"
    collocation_example: "La colcha de mi abuela está hecha a mano. — Покрывало моей бабушки сделано вручную."
    trap: "Colcha — покрывало поверх, colchón — матрас. Не путайте colcha с colchón, хотя слова одного корня."

  - word: turno entrante
    ru: новая смена, которая заступает
    ipa: /ˈtuɾno enˈtɾante/
    say: ту́рно энтра́нтэ
    meaning: "Смена, которая приходит работать: ночная после дневной, утренняя после ночной. Entrante — «входящий, наступающий»."
    examples:
      - "El turno de noche llega a las diez. — Ночная смена приходит в десять."
      - "Por fin pudieron irse a descansar los médicos exhaustos cuando llegó el turno entrante. — Наконец измотанные врачи смогли пойти отдыхать, когда пришла заступающая смена."
      - "El turno saliente informó al turno entrante de todo lo ocurrido durante la noche en la planta. — Уходящая смена рассказала заступающей обо всём, что случилось ночью на этаже."
    origin: "turno — «смена, очередь»; entrante — причастие настоящего от entrar «входить». Противоположное — turno saliente."
    register: "Формальное, рабочее."
    synonyms:
      - word: relevo
        pair: ["Espera al turno entrante.", "Espera al relevo."]
        diff:
          - "relevo — «смена, сменщик» вообще, разговорное"
          - "turno entrante — формальное «заступающая смена»"
    analogs:
      - "incoming shift — заступающая смена"
      - "the next shift — следующая смена"
    dialogue:
      - "Ana: ¿Quién se queda esta noche? | Кто остаётся на эту ночь?"
      - "Pablo: El turno entrante, a las nueve. | Заступающая смена, в девять."
      - "Ana: ¿Cuántos son? | Сколько их?"
      - "Pablo: Cinco enfermeras, dos médicos y un celador. Cuando llega el relevo, los demás se retiran. | Пять медсестёр, два врача и один санитар. Когда приходит смена, остальные уходят."
      - "Ana: ¿Y no dan abasto de noche? | И ночью не справляются?"
      - "Pablo: A veces sí, sobre todo cuando hay una afluencia grande de urgencias. | Иногда да, особенно когда большой наплыв срочных случаев."
      - "Ana: Qué trabajo tan duro. | Какая тяжёлая работа."
      - "Pablo: Sí, pero el turno entrante llega con ganas y el turno saliente puede descansar. | Да, но заступающая смена приходит с желанием, а уходящая может отдохнуть."
    cefr: "C1."
    frequency: "Нечастое: рабочая лексика."
    collocations:
      - "turno saliente — уходящая смена"
      - "el año entrante — наступающий год"
      - "el mes entrante — наступающий месяц"
    collocation_example: "Les deseamos lo mejor para el año entrante. — Желаем вам всего лучшего в наступающем году."
    trap: "Entrante — ещё «следующий, наступающий»: el mes entrante. Не путайте с entrada «вход» и entrante «закуска» (существительное в Испании)."

  - word: tumulto de gente
    ru: толпа, столпотворение
    ipa: /tuˈmulto de ˈxente/
    say: туму́льто дэ хэ́нтэ
    pron: "g перед e — «х»; ударение на mu: tumulto."
    meaning: "Беспорядочная, шумная толпа: давка, суматоха. Tumulto — «шумное скопление»."
    examples:
      - "Se formó un tumulto de gente. — Образовалась толпа людей."
      - "Entre el tumulto de gente que salía del estadio, perdí a mi hermano. — В толпе, выходившей со стадиона, я потерял брата."
      - "Un tumulto de gente rodeaba al cantante a la salida del hotel, y la policía no podía abrir paso. — Толпа окружила певца при выходе из отеля, и полиция не могла проложить путь."
    origin: "Из лат. tumultus «волнение, смятение». Родственные: tumultuoso «шумный», tumor «опухоль» (тот же корень tumere «набухать»)."
    register: "Нейтральное, литературное."
    synonyms:
      - word: multitud
        pair: ["Había un tumulto de gente.", "Había una multitud."]
        diff:
          - "multitud — просто «много людей»"
          - "tumulto — «шумная, беспорядочная толпа», давка"
    analogs:
      - "crowd — толпа"
      - "commotion — суматоха"
    dialogue:
      - "Ana: ¿Qué pasa en la puerta? | Что происходит у двери?"
      - "Pablo: Hay un tumulto de gente. | Там столпотворение."
      - "Ana: ¿Por qué? Hay muchísimos. | Почему? Там очень много людей."
      - "Pablo: Se prevé que lleguen los jugadores y todos quieren hacerse una foto. | Ожидается приезд игроков, и все хотят сфотографироваться."
      - "Ana: ¿Hay policía? | Полиция есть?"
      - "Pablo: Sí, ha desplegado efectivos para controlar el flujo de gente. | Да, развернула силы, чтобы контролировать поток людей."
      - "Ana: Qué agobio. ¿Entramos por otra puerta? | Какая теснота. Зайдём через другую дверь?"
      - "Pablo: Mejor, no vaya a ser que nos pille el tumulto. | Лучше, чтобы нас не затянуло в толпу."
    cefr: "C1."
    frequency: "Нечастое: в прозе и новостях."
    collocations:
      - "un tumulto de gente — толпа"
      - "en medio del tumulto — посреди суматохи"
      - "provocar un tumulto — вызвать беспорядки"
    collocation_example: "El anuncio provocó un tumulto en la plaza. — Объявление вызвало беспорядок на площади."
    trap: "Tumulto — мужского рода: el tumulto. Не путайте с tumor «опухоль» и tumba «могила»."

  - word: desapercibido
    ru: незамеченный
    ipa: /desapeɾθiˈβiðo/
    say: дэсапэрсиби́до
    pron: "c перед i в Испании — [θ]; v читается как b."
    meaning: "О человеке или событии: никто не обратил внимания. Чаще в сочетании pasar desapercibido."
    examples:
      - "Su error no pasó desapercibido. — Его ошибка не осталась незамеченной."
      - "Su ausencia no pasó desapercibida, y varios compañeros preguntaron por él durante la reunión. — Его отсутствие не прошло незамеченным, и несколько коллег спрашивали о нём на собрании."
      - "Pasó desapercibido entre la multitud, con su gorra gris y su chaqueta oscura, y nadie lo reconoció. — Он остался незамеченным в толпе, в серой кепке и тёмной куртке, и никто его не узнал."
    origin: "des- «не» + apercibido «замеченный» (от apercibirse «замечать», it. apercepire). Родственные: percibir «воспринимать», percepción «восприятие»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: inadvertido
        pair: ["Pasó desapercibido.", "Pasó inadvertido."]
        diff:
          - "inadvertido — тот же смысл, чуть книжнее"
          - "desapercibido — привычнее в Испании и в Латинской Америке"
    analogs:
      - "unnoticed — незамеченный"
      - "unobserved — ненаблюдаемый"
    dialogue:
      - "Ana: ¿Te vio alguien? | Тебя кто-нибудь видел?"
      - "Pablo: No, pasé desapercibido. | Нет, я остался незамеченным."
      - "Ana: ¿Seguro? | Уверен?"
      - "Pablo: Sí. Entré por la puerta de atrás, con una gorra, y nadie se fijó. | Да. Вошёл через заднюю дверь, в кепке, и никто не обратил внимания."
      - "Ana: ¿Y por qué querías pasar desapercibido? | А почему ты хотел остаться незамеченным?"
      - "Pablo: Porque el inspector me había hecho saber que no era conveniente que me vieran allí. | Потому что инспектор дал понять, что мне не стоит показываться там."
      - "Ana: Qué misterio. ¿Conseguiste la información? | Какая загадка. Ты раздобыл информацию?"
      - "Pablo: Sí, y pasé desapercibido. Ni una sola persona me vio. | Да, и остался незамеченным. Ни один человек меня не увидел."
    cefr: "C1."
    frequency: "Частое."
    collocations:
      - "pasar desapercibido — остаться незамеченным"
      - "no pasar desapercibido — не остаться без внимания"
      - "pasar inadvertido — пройти незамеченным"
    collocation_example: "Su llegada no pasó desapercibida. — Его приход не остался незамеченным."
    trap: "Причастие согласуется: desapercibida, desapercibidos. Ложный друг: не «неготовый» (desprevenido). Устойчивое: pasar desapercibido."

  - word: cortar de un plumazo
    ru: одним махом прервать
    ipa: /koɾˈtaɾ de un pluˈmaθo/
    say: корта́р дэ ун плума́со
    pron: "z в Испании — [θ]; ударение на ma."
    meaning: "Быстро и решительно покончить с чем-то: разговором, спором, надеждой. Plumazo — «росчерк пера»."
    examples:
      - "Cortó la conversación de un plumazo. — Он одним махом оборвал разговор."
      - "Con una sola frase, el jefe cortó la discusión de un plumazo y nadie siguió hablando. — Одной фразой начальник оборвал спор, и никто не продолжил говорить."
      - "Con una sola firma, el ministro cortó de un plumazo las ayudas que recibían miles de familias. — Одной подписью министр разом прекратил выплаты, которые получали тысячи семей."
    origin: "pluma «перо» + суффикс -azo «удар»: «взмах пера». Образ: одним росчерком вычеркнуть. Родственные: pluma «перо», plumero «метёлка»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: de golpe
        pair: ["Lo cortó de un plumazo.", "Lo cortó de golpe."]
        diff:
          - "de golpe — «внезапно, разом»"
          - "de un plumazo — «одним росчерком», с оттенком решения сверху"
    analogs:
      - "with a stroke of the pen — одним росчерком пера"
      - "in one fell swoop — одним махом"
    dialogue:
      - "Ana: ¿Qué hizo el director? | Что сделал директор?"
      - "Pablo: Canceló el proyecto de un plumazo. | Отменил проект одним росчерком."
      - "Ana: ¿Sin consultar a nadie? | Ни с кем не посоветовавшись?"
      - "Pablo: Sin previo aviso. Se retiró a su despacho y, a los diez minutos, nos mandó un correo. | Без предупреждения. Ушёл в кабинет и через десять минут прислал нам письмо."
      - "Ana: Qué falta de respeto. Llevábamos meses trabajando. | Какое неуважение. Мы работали месяцами."
      - "Pablo: Lo sé. Cortó de un plumazo todo nuestro esfuerzo y no atendió a razones. | Знаю. Одним махом перечеркнул все наши усилия и не слушал доводов."
      - "Ana: ¿Y qué vamos a hacer? | И что нам делать?"
      - "Pablo: Pedir una reunión y reivindicar lo que corresponde. No pienso ceder ni un ápice. | Просить встречи и отстаивать то, что причитается. Я не собираюсь уступать ни на йоту."
    cefr: "C1."
    frequency: "Частое в новостях и разговоре."
    collocations:
      - "de un plumazo — одним махом"
      - "borrar de un plumazo — стереть одним росчерком"
      - "eliminar de un plumazo — упразднить разом"
    collocation_example: "Borró de un plumazo todo lo que habíamos hecho. — Он одним росчерком перечеркнул всё, что мы сделали."
    trap: "Plumazo — не «перо», а «взмах пера»: суффикс -azo. Не путайте с plumón «пух» и plumaje «оперение»."

  - word: impacientarse
    ru: терять терпение
    ipa: /impaθjenˈtaɾse/
    say: импасьента́рсэ
    pron: "c перед i в Испании — [θ]; ie — один слог «ье»."
    meaning: "Начать нервничать оттого, что приходится ждать: «лопнуло терпение»."
    examples:
      - "Se impacienta si tiene que esperar. — Он теряет терпение, если приходится ждать."
      - "El tren solo lleva diez minutos de retraso: no te impacientes, ya llegan. — Поезд опаздывает всего на десять минут: не нервничай, они уже подъезжают."
      - "Los pasajeros empezaron a impacientarse al ver que nadie les daba información sobre el vuelo. — Пассажиры начали терять терпение, видя, что никто не даёт им информации о рейсе."
    origin: "От impaciente «нетерпеливый»: in- «не» + paciente «терпеливый» (лат. patiens, от pati «терпеть»). Родственные: paciencia «терпение», paciente «пациент»."
    register: "Нейтральное."
    synonyms:
      - word: perder la paciencia
        pair: ["Se impacientó.", "Perdió la paciencia."]
        diff:
          - "perder la paciencia — «потерять терпение» окончательно"
          - "impacientarse — «начать терять, нервничать», процесс"
    analogs:
      - "to get impatient — терять терпение"
      - "to grow restless — начать нервничать"
    dialogue:
      - "Ana: ¿Por qué estás tan inquieto? | Почему ты такой беспокойный?"
      - "Pablo: Me impaciento esperando al médico. | Я теряю терпение, ожидая врача."
      - "Ana: Llevamos solo veinte minutos. | Мы ждём всего двадцать минут."
      - "Pablo: Ya, pero estoy nervioso. Doy vueltas, miro el reloj y me impaciento cada vez más. | Знаю, но я нервничаю. Хожу кругами, смотрю на часы и теряю терпение всё больше."
      - "Ana: Respira hondo. Armarse de paciencia es lo único que podemos hacer. | Дыши глубже. Запастись терпением — единственное, что мы можем сделать."
      - "Pablo: Lo sé, pero no es fácil. Tengo para rato y me impaciento. | Знаю, но это непросто. Мне ещё долго ждать, и я теряю терпение."
      - "Ana: Toma, un kleenex y un chicle. Mastica un poco y relájate. | Держи, платок и жвачку. Пожуй немного и расслабься."
      - "Pablo: Gracias. Contigo hasta esperar es más llevadero. | Спасибо. С тобой даже ждать легче."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "impacientarse con alguien — потерять терпение с кем-то"
      - "perder la paciencia — потерять терпение"
      - "armarse de paciencia — запастись терпением"
    collocation_example: "No te impacientes, todo saldrá bien. — Не теряй терпения, всё будет хорошо."
    trap: "Возвратный глагол: me impaciento, te impacientas. Не путайте с impactar «поразить» и paciente «терпеливый; больной»."

  - word: dar cuenta del hecho
    ru: сообщить о случившемся
    ipa: /ˈdaɾ ˈkwenta del ˈetʃo/
    say: дар куэ́нта дэль э́чо
    pron: "ue — один слог «уэ»; h не читается; ch — «ч»."
    meaning: "Официально рассказать, что произошло: полиции, начальству, суду. «Dar cuenta de» — «отчитаться»."
    examples:
      - "El testigo dio cuenta del hecho. — Свидетель сообщил о случившемся."
      - "Los medios dieron cuenta del suceso en las ediciones de la tarde del jueves. — СМИ сообщили о случившемся в вечерних выпусках четверга."
      - "Dio cuenta del hecho a la policía en cuanto se dio cuenta de que le habían robado el coche. — Он сообщил о случившемся в полицию, как только понял, что у него украли машину."
    origin: "dar «давать» + cuenta «счёт, отчёт» (от contar «считать») + hecho «факт»: «дать отчёт о факте». Родственные: contar, cuenta, recuento."
    register: "Формальное, новостное."
    synonyms:
      - word: informar de
        pair: ["Dio cuenta del hecho.", "Informó del hecho."]
        diff:
          - "informar de — «сообщить», проще"
          - "dar cuenta de — «отчитаться, доложить», официальнее"
    analogs:
      - "to report — сообщить, доложить"
      - "to give an account of — дать отчёт"
    dialogue:
      - "Ana: ¿Avisaron a las autoridades? | Власти были уведомлены?"
      - "Pablo: Sí, dieron cuenta del hecho ayer. | Да, о случившемся сообщили вчера."
      - "Ana: ¿Quién lo hizo? | Кто это сделал?"
      - "Pablo: El propio testigo, que se personó en comisaría y prestó declaración. | Сам свидетель, который лично явился в комиссариат и дал показания."
      - "Ana: ¿Y qué dijo? | И что он сказал?"
      - "Pablo: Dio cuenta del hecho con todo detalle: la hora, el lugar y las personas implicadas. | Подробно сообщил о случившемся: время, место и причастных лиц."
      - "Ana: ¿Y la policía tomó nota? | И полиция записала?"
      - "Pablo: Sí, y ya ha convocado a los sospechosos. | Да, и уже вызвала подозреваемых."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "dar cuenta de — сообщить о"
      - "darse cuenta de — осознать"
      - "tener en cuenta — принять во внимание"
    collocation_example: "El periódico dio cuenta de la noticia en portada. — Газета сообщила новость на первой полосе."
    trap: "Dar cuenta de — «отчитаться», а darse cuenta de — «осознать»: разные выражения. Hecho — «факт», не «сделанный»."

  - word: encargarse de
    ru: заняться чем-то, взять на себя
    ipa: /eŋkaɾˈɣaɾse de/
    say: энкарга́рсэ дэ
    pron: "n перед k звучит как [ŋ]; g перед a — [ɣ]; перед e g → gu: me encargué."
    meaning: "Взять ответственность за дело: «я займусь», «это на мне»."
    examples:
      - "Yo me encargo de la comida. — Я займусь едой."
      - "Después de la fiesta, de la limpieza de las calles se encargará el ayuntamiento. — После праздника уборкой улиц займётся мэрия."
      - "Ella se encarga de las cuentas de la casa porque a su marido no le gustan los números. — Она занимается домашними счетами, потому что её муж не любит цифры."
    origin: "От encargar «поручать» (en- + cargar «нагружать», cargo «груз, должность»). Возвратное «взять поручение на себя». Родственные: cargo «должность», cargar «грузить»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: ocuparse de
        pair: ["Me encargo de la cena.", "Me ocupo de la cena."]
        diff:
          - "ocuparse de — «заняться», тоже обычное слово"
          - "encargarse de — «взять ответственность», с оттенком поручения"
    analogs:
      - "to take care of — позаботиться, заняться"
      - "to be in charge of — отвечать за"
    dialogue:
      - "Ana: ¿Quién compra el pan? | Кто купит хлеб?"
      - "Pablo: Yo me encargo. | Я займусь."
      - "Ana: ¿Y la bebida? | А напитки?"
      - "Pablo: De eso se encarga Luis. Y la tarta, mi madre. Cada uno se encarga de algo. | Этим займётся Луис. А тортом — моя мама. Каждый берёт на себя что-то своё."
      - "Ana: Entonces yo me encargo de la música y de los platos. | Тогда я займусь музыкой и посудой."
      - "Pablo: Perfecto. Y de la limpieza, al final, nos encargamos todos. | Отлично. А уборкой в конце займёмся все вместе."
      - "Ana: Trato hecho. Será una fiesta estupenda. | Договорились. Это будет замечательный праздник."
      - "Pablo: Eso espero. Con tanta organización, tiene que salir bien. | Надеюсь. При такой организации всё должно получиться."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "encargarse de + что-то — заняться"
      - "encargarse de + инфинитив — взять на себя"
      - "yo me encargo — я займусь"
    collocation_example: "No te preocupes, yo me encargo de todo. — Не волнуйся, я всем займусь."
    trap: "Возвратный глагол с de: me encargo de. Без se encargar — «заказать, поручить»: encargar un libro. Перед e g → gu: me encargué."
