# Пятый список автора, часть 7 — «Desconcierto en el hospital 6» (слова 1–11).
lang: es
words:
  - word: calmante
    ru: успокоительное
    ipa: /kalˈmante/
    say: кальма́нтэ
    meaning: "Лекарство, которое снимает боль или волнение. Как прилагательное — «успокаивающий»."
    examples:
      - "Le dieron un calmante para el dolor. — Ему дали обезболивающее."
      - "Tomó un calmante antes de dormir. — Он принял успокоительное перед сном."
    origin: "Причастие настоящего времени от calmar «успокаивать» (calma «покой»; греч. kauma «зной, полуденный отдых»). Родственные: calma «спокойствие», calmar."
    register: "Нейтральное, медицинское."
    synonyms:
      - word: sedante
        pair: ["Le dieron un calmante.", "Le dieron un sedante."]
        diff:
          - "sedante — «седативное», врачебный термин, сильнее"
          - "calmante — обиходное «успокоительное, обезболивающее»"
    analogs:
      - "painkiller — обезболивающее"
      - "sedative — успокоительное"
    dialogue:
      - "Ana: ¿Te duele mucho? | Тебе очень больно?"
      - "Pablo: Sí, necesito un calmante. | Да, мне нужно обезболивающее."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "tomar un calmante — принять успокоительное"
      - "un calmante natural — натуральное успокоительное"
      - "calmar el dolor — унять боль"
    collocation_example: "Esta infusión es un calmante natural. — Этот отвар — натуральное успокоительное."
    trap: "Calmante — и «успокоительное», и «обезболивающее» (дословно: «то, что успокаивает боль»). Не путайте с calmar «успокаивать» (глагол)."

  - word: destapado
    ru: раскрытый, не накрытый
    ipa: /destaˈpaðo/
    say: дэстапа́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О том, что осталось без крышки или одеяла: открытое. О человеке в постели — «раскрывшийся»."
    examples:
      - "Se quedó destapado toda la noche. — Он всю ночь остался раскрытым."
      - "La olla está destapada. — Кастрюля открыта."
    origin: "Причастие от destapar «открывать» (des- «не» + tapar «закрывать, накрывать»). Родственные: tapa «крышка», tapón «пробка», tapar «накрыть»."
    register: "Нейтральное."
    synonyms:
      - word: descubierto
        pair: ["Dormía destapado.", "Dormía descubierto."]
        diff:
          - "descubierto — «раскрытый, без покрова»; и «обнаруженный»"
          - "destapado — «без крышки, не накрытый» предмет или человек в постели"
    analogs:
      - "uncovered — не накрытый"
      - "open — открытый"
    dialogue:
      - "Ana: ¿Por qué tienes frío? | Почему ты мёрзнешь?"
      - "Pablo: Dormí destapado. | Спал раскрытым."
    cefr: "B1."
    frequency: "Частое в быту."
    collocations:
      - "destapar la olla — открыть кастрюлю"
      - "destaparse en la cama — раскрыться во сне"
      - "destapar un escándalo — разоблачить скандал"
    collocation_example: "El periódico destapó un escándalo político. — Газета разоблачила политический скандал."
    trap: "Destapar — ещё «разоблачить»: destapar un caso. Причастие согласуется: destapada, destapados. Не путайте с destacar «выделять»."

  - word: encogido
    ru: сжавшийся, свернувшийся
    ipa: /eŋkoˈxiðo/
    say: энкохи́до
    pron: "n перед k звучит как носовое [ŋ]; g перед i — «х»."
    meaning: "О позе человека: съёжившийся, подтянувший колени, спрятавшийся в комок. Ещё — «севший» (о ткани)."
    examples:
      - "Dormía encogido en el sofá. — Он спал, свернувшись на диване."
      - "El jersey se ha quedado encogido. — Свитер сел после стирки."
    origin: "Причастие от encoger «сжимать» (лат. *incollige: in- + coger «собирать»). Родственные: coger «брать», recoger «собирать»."
    register: "Нейтральное."
    synonyms:
      - word: acurrucado
        pair: ["Dormía encogido.", "Dormía acurrucado."]
        diff:
          - "acurrucado — «свернувшийся уютно, как кошка», тепло и мягко"
          - "encogido — «съёжившийся, сжавшийся», может быть от холода или страха"
    analogs:
      - "curled up — свернувшийся"
      - "shrunk — севший"
    dialogue:
      - "Ana: ¿Cómo estaba el niño? | Как был мальчик?"
      - "Pablo: Encogido en la cama, con frío. | Съёжившийся в постели, замёрзший."
    cefr: "B2."
    frequency: "Частое в описаниях."
    collocations:
      - "encogerse de hombros — пожать плечами"
      - "encogerse de miedo — съёжиться от страха"
      - "encoger la ropa — сесть (об одежде)"
    collocation_example: "Se encogió de hombros y no dijo nada. — Он пожал плечами и ничего не сказал."
    trap: "Encoger спрягается: encojo (j перед o), encoges. Не путайте с recoger «подобрать» и coger «брать»."

  - word: como un ovillo
    ru: клубочком
    ipa: /ˈkomo un oˈβiʎo/
    say: ко́мо ун оби́йо
    pron: "ll в большинстве регионов — как «й»; v/b между гласными мягкая [β]."
    meaning: "Образ: свернувшись, как клубок. Ovillo — «клубок (ниток, шерсти)»."
    examples:
      - "El gato dormía hecho un ovillo. — Кот спал свернувшись клубком."
      - "Se acurrucó como un ovillo en la cama. — Она свернулась клубочком в постели."
    origin: "От лат. globellus «шарик», уменьшительное от globus «шар». Родственные: globo «шар; воздушный шарик», glóbulo «шарик»."
    register: "Нейтральное, образное."
    synonyms:
      - word: hecho un ovillo
        pair: ["Dormía como un ovillo.", "Dormía hecho un ovillo."]
        diff:
          - "hecho un ovillo — «превратившись в клубок», обычное сочетание"
          - "como un ovillo — «как клубок», сравнение"
    analogs:
      - "curled up in a ball — свернувшись клубком"
      - "in a heap — сжавшись комом"
    dialogue:
      - "Ana: ¿Dónde está el gato? | Где кот?"
      - "Pablo: Durmiendo hecho un ovillo. | Спит клубком."
    cefr: "C1."
    frequency: "Частое в описаниях."
    collocations:
      - "hecho un ovillo — свернувшись клубком"
      - "un ovillo de lana — клубок шерсти"
      - "enredarse como un ovillo — запутаться клубком"
    collocation_example: "Compró un ovillo de lana roja para tejer. — Она купила клубок красной шерсти для вязания."
    trap: "Ovillo — клубок ниток. Не путайте с ovillar «сматывать» и oruga «гусеница». Часто: hacerse un ovillo — «свернуться клубком»."

  - word: sábana
    ru: простыня
    ipa: /ˈsaβana/
    say: са́бана
    pron: "b между гласными мягкая [β]; ударение на первом слоге."
    meaning: "Тонкое полотно, на котором спят или которым накрываются. Estar pegado a las sábanas — «залежаться в постели»."
    examples:
      - "Cambié las sábanas de la cama. — Я поменял простыни на кровати."
      - "Se tapó con la sábana hasta la cabeza. — Он накрылся простынёй с головой."
    origin: "Через лат. sabana из греч. sabanon «полотенце» (из арабского). В испанском закрепилось как «простыня»."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "sheet — простыня"
      - "bed sheet — постельная простыня"
    dialogue:
      - "Ana: ¿Qué hay en la lavadora? | Что в стиральной машине?"
      - "Pablo: Las sábanas de la cama. | Простыни с кровати."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "cambiar las sábanas — поменять простыни"
      - "pegársele las sábanas — залежаться в постели"
      - "sábana bajera — нижняя простыня"
    collocation_example: "Se me pegaron las sábanas y llegué tarde. — Я проспал и опоздал."
    trap: "Sábana — простыня, а «одеяло» — manta или edredón. Не путайте с sabana «саванна» (без знака ударения)."

  - word: colcha
    ru: покрывало
    ipa: /ˈkoltʃa/
    say: ко́льча
    pron: "ch — «ч»."
    meaning: "Красивое покрывало, которым застилают кровать сверху. Ещё — «стёганое одеяло»."
    examples:
      - "Cubrió la cama con una colcha bordada. — Она накрыла кровать вышитым покрывалом."
      - "La colcha era de color azul. — Покрывало было синим."
    origin: "Из лат. culcita «матрас, подушка». Родственное: colchón «матрас», acolchado «стёганый»."
    register: "Нейтральное."
    synonyms:
      - word: cubrecama
        pair: ["Puso una colcha.", "Puso un cubrecama."]
        diff:
          - "cubrecama — «покрывало» буквально «накрыватель кровати»"
          - "colcha — привычное слово, и нарядное покрывало"
    analogs:
      - "bedspread — покрывало"
      - "quilt — стёганое одеяло"
    dialogue:
      - "Ana: ¿Qué compraste para el cuarto? | Что купила для комнаты?"
      - "Pablo: Una colcha nueva y cortinas. | Новое покрывало и шторы."
    cefr: "B2."
    frequency: "Частое в быту."
    collocations:
      - "colcha de lana — шерстяное покрывало"
      - "cama con colcha — застеленная кровать"
      - "colchón y colcha — матрас и покрывало"
    collocation_example: "La colcha de mi abuela está hecha a mano. — Покрывало моей бабушки сделано вручную."
    trap: "Colcha — покрывало поверх, colchón — матрас. Не путайте colcha с colchón, хотя слова одного корня."

  - word: turno entrante
    ru: новая смена, которая заступает
    ipa: /ˈtuɾno enˈtɾante/
    say: ту́рно энтра́нтэ
    meaning: "Смена, которая приходит работать: ночная после дневной, утренняя после ночной. Entrante — «входящий, наступающий»."
    examples:
      - "El turno entrante llega a las diez. — Новая смена приходит в десять."
      - "El turno saliente informó al entrante. — Уходящая смена передала дела заступающей."
    origin: "turno — «смена, очередь»; entrante — причастие настоящего от entrar «входить». Противоположное — turno saliente."
    register: "Формальное, рабочее."
    synonyms:
      - word: relevo
        pair: ["Espera al turno entrante.", "Espera al relevo."]
        diff:
          - "relevo — «смена, сменщик» вообще, разговорное"
          - "turno entrante — формальное «заступающая смена»"
    analogs:
      - "incoming shift — заступающая смена"
      - "the next shift — следующая смена"
    dialogue:
      - "Ana: ¿Quién se queda esta noche? | Кто останется на ночь?"
      - "Pablo: El turno entrante, a las nueve. | Заступающая смена, в девять."
    cefr: "C1."
    frequency: "Нечастое: рабочая лексика."
    collocations:
      - "turno saliente — уходящая смена"
      - "el año entrante — наступающий год"
      - "el mes entrante — наступающий месяц"
    collocation_example: "Les deseamos lo mejor para el año entrante. — Желаем вам всего лучшего в наступающем году."
    trap: "Entrante — ещё «следующий, наступающий»: el mes entrante. Не путайте с entrada «вход» и entrante «закуска» (существительное в Испании)."

  - word: tumulto de gente
    ru: толпа, столпотворение
    ipa: /tuˈmulto de ˈxente/
    say: туму́льто дэ хэ́нтэ
    pron: "g перед e — «х»; ударение на mu: tumulto."
    meaning: "Беспорядочная, шумная толпа: давка, суматоха. Tumulto — «шумное скопление»."
    examples:
      - "Se formó un tumulto de gente en la entrada. — У входа образовалось столпотворение."
      - "Entre el tumulto, perdí a mi hermano. — В толчее я потерял брата."
    origin: "Из лат. tumultus «волнение, смятение». Родственные: tumultuoso «шумный», tumor «опухоль» (тот же корень tumere «набухать»)."
    register: "Нейтральное, литературное."
    synonyms:
      - word: multitud
        pair: ["Había un tumulto de gente.", "Había una multitud."]
        diff:
          - "multitud — просто «много людей»"
          - "tumulto — «шумная, беспорядочная толпа», давка"
    analogs:
      - "crowd — толпа"
      - "commotion — суматоха"
    dialogue:
      - "Ana: ¿Qué pasa en la puerta? | Что у двери?"
      - "Pablo: Hay un tumulto de gente. | Там толпа людей."
    cefr: "C1."
    frequency: "Нечастое: в прозе и новостях."
    collocations:
      - "un tumulto de gente — толпа"
      - "en medio del tumulto — посреди суматохи"
      - "provocar un tumulto — вызвать беспорядки"
    collocation_example: "El anuncio provocó un tumulto en la plaza. — Объявление вызвало беспорядок на площади."
    trap: "Tumulto — мужского рода: el tumulto. Не путайте с tumor «опухоль» и tumba «могила»."

  - word: desapercibido
    ru: незамеченный
    ipa: /desapeɾθiˈβiðo/
    say: дэсапэрсиби́до
    pron: "c перед i в Испании — [θ]; v читается как b."
    meaning: "О человеке или событии: никто не обратил внимания. Чаще в сочетании pasar desapercibido."
    examples:
      - "Pasó desapercibido entre la multitud. — Он остался незамеченным в толпе."
      - "El error no pasó desapercibido. — Ошибку заметили."
    origin: "des- «не» + apercibido «замеченный» (от apercibirse «замечать», it. apercepire). Родственные: percibir «воспринимать», percepción «восприятие»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: inadvertido
        pair: ["Pasó desapercibido.", "Pasó inadvertido."]
        diff:
          - "inadvertido — тот же смысл, чуть книжнее"
          - "desapercibido — привычнее в Испании и в Латинской Америке"
    analogs:
      - "unnoticed — незамеченный"
      - "unobserved — ненаблюдаемый"
    dialogue:
      - "Ana: ¿Te vio alguien? | Тебя кто-нибудь видел?"
      - "Pablo: No, pasé desapercibido. | Нет, я остался незамеченным."
    cefr: "C1."
    frequency: "Частое."
    collocations:
      - "pasar desapercibido — остаться незамеченным"
      - "no pasar desapercibido — не остаться без внимания"
      - "pasar inadvertido — пройти незамеченным"
    collocation_example: "Su llegada no pasó desapercibida. — Его приход не остался незамеченным."
    trap: "Причастие согласуется: desapercibida, desapercibidos. Ложный друг: не «неготовый» (desprevenido). Устойчивое: pasar desapercibido."

  - word: cortar de un plumazo
    ru: одним махом прервать
    ipa: /koɾˈtaɾ de un pluˈmaθo/
    say: корта́р дэ ун плума́со
    pron: "z в Испании — [θ]; ударение на ma."
    meaning: "Быстро и решительно покончить с чем-то: разговором, спором, надеждой. Plumazo — «росчерк пера»."
    examples:
      - "Cortó la discusión de un plumazo. — Он одним махом прекратил спор."
      - "El nuevo jefe eliminó varios puestos de un plumazo. — Новый начальник одним росчерком упразднил несколько должностей."
    origin: "pluma «перо» + суффикс -azo «удар»: «взмах пера». Образ: одним росчерком вычеркнуть. Родственные: pluma «перо», plumero «метёлка»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: de golpe
        pair: ["Lo cortó de un plumazo.", "Lo cortó de golpe."]
        diff:
          - "de golpe — «внезапно, разом»"
          - "de un plumazo — «одним росчерком», с оттенком решения сверху"
    analogs:
      - "with a stroke of the pen — одним росчерком пера"
      - "in one fell swoop — одним махом"
    dialogue:
      - "Ana: ¿Qué hizo el director? | Что сделал директор?"
      - "Pablo: Canceló el proyecto de un plumazo. | Одним росчерком отменил проект."
    cefr: "C1."
    frequency: "Частое в новостях и разговоре."
    collocations:
      - "de un plumazo — одним махом"
      - "borrar de un plumazo — стереть одним росчерком"
      - "eliminar de un plumazo — упразднить разом"
    collocation_example: "Borró de un plumazo todo lo que habíamos hecho. — Он одним росчерком перечеркнул всё, что мы сделали."
    trap: "Plumazo — не «перо», а «взмах пера»: суффикс -azo. Не путайте с plumón «пух» и plumaje «оперение»."

  - word: impacientarse
    ru: терять терпение
    ipa: /impaθjenˈtaɾse/
    say: импасьента́рсэ
    pron: "c перед i в Испании — [θ]; ie — один слог «ье»."
    meaning: "Начать нервничать оттого, что приходится ждать: «лопнуло терпение»."
    examples:
      - "Se impacientó esperando en la cola. — Он стал терять терпение, ожидая в очереди."
      - "No te impacientes, ya llegan. — Не нервничай, они уже подходят."
    origin: "От impaciente «нетерпеливый»: in- «не» + paciente «терпеливый» (лат. patiens, от pati «терпеть»). Родственные: paciencia «терпение», paciente «пациент»."
    register: "Нейтральное."
    synonyms:
      - word: perder la paciencia
        pair: ["Se impacientó.", "Perdió la paciencia."]
        diff:
          - "perder la paciencia — «потерять терпение» окончательно"
          - "impacientarse — «начать терять, нервничать», процесс"
    analogs:
      - "to get impatient — терять терпение"
      - "to grow restless — начать нервничать"
    dialogue:
      - "Ana: ¿Por qué estás tan inquieto? | Почему ты такой беспокойный?"
      - "Pablo: Me impaciento esperando al médico. | Я теряю терпение, ожидая врача."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "impacientarse con alguien — потерять терпение с кем-то"
      - "perder la paciencia — потерять терпение"
      - "armarse de paciencia — запастись терпением"
    collocation_example: "No te impacientes, todo saldrá bien. — Не теряй терпения, всё будет хорошо."
    trap: "Возвратный глагол: me impaciento, te impacientas. Не путайте с impactar «поразить» и paciente «терпеливый; больной»."

  - word: dar cuenta del hecho
    ru: сообщить о случившемся
    ipa: /ˈdaɾ ˈkwenta del ˈetʃo/
    say: дар куэ́нта дэль э́чо
    pron: "ue — один слог «уэ»; h не читается; ch — «ч»."
    meaning: "Официально рассказать, что произошло: полиции, начальству, суду. «Dar cuenta de» — «отчитаться»."
    examples:
      - "Dio cuenta del hecho a la policía. — Он сообщил о случившемся в полицию."
      - "Los medios dieron cuenta del suceso. — СМИ сообщили о происшествии."
    origin: "dar «давать» + cuenta «счёт, отчёт» (от contar «считать») + hecho «факт»: «дать отчёт о факте». Родственные: contar, cuenta, recuento."
    register: "Формальное, новостное."
    synonyms:
      - word: informar de
        pair: ["Dio cuenta del hecho.", "Informó del hecho."]
        diff:
