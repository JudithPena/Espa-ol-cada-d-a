      - "Se fue dolido de la reunión, aunque intentó que no se le notara en la cara. — Он ушёл со встречи обиженным, хотя старался, чтобы это не было заметно по лицу."
    origin: "Причастие от doler «болеть». Родственное: dolor."
    register: "Нейтральное."
    synonyms:
      - word: ofendido
        pair: ["Está dolido.", "Está ofendido."]
        diff:
          - "ofendido — оскорблённый, с гневом"
          - "dolido — с грустью и болью"
    analogs:
      - "hurt — задетый"
    dialogue:
      - "Lucía: Marcos, llevas toda la tarde callado y con mala cara. | Маркос, ты весь вечер молчишь и ходишь хмурый."
      - "Marcos: No pasa nada, de verdad. | Ничего, правда."
      - "Lucía: Sí que pasa. Estás dolido conmigo, ¿verdad? | Нет, не ничего. Ты на меня обижен, да?"
      - "Marcos: Un poco. Me ocultaste la verdad sobre el despido de Pablo. | Немного. Ты скрыла от меня правду об увольнении Пабло."
      - "Lucía: Tenía miedo de que te alteraras y dijeras algo que no querías decir. | Я боялась, что ты разнервничаешься и скажешь то, чего не хотел."
      - "Marcos: Quizá tengas razón, pero me enteré por un cotilleo de la oficina. | Может, ты и права, но я узнал об этом из офисных сплетен."
      - "Lucía: Lo siento. Me arrepiento de no haberte llamado. | Прости. Я жалею, что не позвонила тебе."
      - "Marcos: Vale, tampoco quiero seguir con este resentimiento. Tomamos un café y lo olvidamos. | Ладно, я тоже не хочу, чтобы эта обида тянулась. Выпьем кофе и забудем."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar dolido con alguien — обидеться на кого-то"
      - "sentirse dolido — чувствовать себя задетым"
      - "dolido por algo — задетый чем-то"
    collocation_example: "Se sintió dolido por su actitud. — Его задело её поведение."
    trap: "С estar: está dolido. На кого — con: dolido **con** alguien."

  - word: herido
    ru: раненый, задетый
    ipa: /eˈɾiðo/
    say: эри́до
    pron: "h не читается: «эридо»."
    meaning: "Раненый; в переносном смысле — задетый, уязвлённый. Как существительное: los heridos — раненые."
    examples:
      - "Hay dos heridos en el accidente. — В аварии двое раненых."
      - "En un helicóptero, al hospital militar fue trasladado el soldado herido. — На вертолёте в военный госпиталь перевезли раненого солдата."
      - "Se sintió herido en su orgullo cuando el jefe lo corrigió delante de todos. — Он почувствовал себя уязвлённым в своей гордости, когда начальник поправил его при всех."
    origin: "Причастие от herir «ранить» (лат. ferire «бить»). Родственное: herida «рана»."
    register: "Нейтральное."
    synonyms:
      - word: lesionado
        pair: ["Está herido.", "Está lesionado."]
        diff:
          - "lesionado — с травмой (спорт)"
          - "herido — с раной"
    analogs:
      - "wounded / injured — раненый"
      - "hurt — задетый"
    dialogue:
      - "Inspectora: Cuénteme qué pasó, Marcos. ¿Hay heridos? | Расскажите, что случилось, Маркос. Есть раненые?"
      - "Marcos: Uno, el guardaespaldas. Está rodeado de médicos. | Один — телохранитель. Вокруг него врачи."
      - "Inspectora: ¿Es grave? | Это серьёзно?"
      - "Marcos: Perdió mucha sangre, pero está herido en el brazo, no en el pecho. | Он потерял много крови, но ранен в руку, а не в грудь."
      - "Inspectora: ¿Y el testigo? ¿Ha dicho algo? | А свидетель? Он что-нибудь сказал?"
      - "Marcos: Nada. Se quedó quieto, sin atreverse a hablar. | Ничего. Замер и не решался заговорить."
      - "Inspectora: Es normal. Cualquiera se estremecería con una escena así. | Это нормально. Любой вздрогнул бы от такой сцены."
      - "Marcos: Pues sí. Esta noche no voy a dormir. | Ещё бы. Сегодня ночью я не усну."
    cefr: "B1."
    frequency: "Частое в новостях."
    collocations:
      - "resultar herido — получить ранение"
      - "herido grave — тяжелораненый"
      - "orgullo herido — уязвлённая гордость"
    collocation_example: "Tres personas resultaron heridas. — Три человека получили ранения."
    trap: "h не читается. В новостях — resultar herido, а не ser herido."

  - word: profundo
    ru: глубокий
    ipa: /pɾoˈfundo/
    say: профу́ндо
    meaning: "Глубокий — о воде, сне, чувстве, мысли."
    examples:
      - "Habló con una voz profunda y grave. — Он говорил глубоким и низким голосом."
      - "Siento un dolor profundo cada vez que recuerdo los años que pasamos separados. — Я чувствую глубокую боль каждый раз, когда вспоминаю годы, что мы провели порознь."
      - "El lago es muy profundo en el centro y no se puede nadar sin chaleco. — Озеро очень глубокое в центре, и там нельзя плавать без жилета."
    origin: "Лат. profundus: pro «вперёд» + fundus «дно». Родственное: profundidad «глубина», fondo."
    register: "Нейтральное."
    synonyms:
      - word: hondo
        pair: ["Un pozo profundo.", "Un pozo hondo."]
        diff:
          - "hondo — разговорнее, чаще о физической глубине"
    analogs:
      - "deep — глубокий"
      - "profound — глубокий (о мысли, чувстве)"
    dialogue:
      - "Ana: ¿Qué tal has dormido? Tienes mejor cara hoy. | Как ты спал? У тебя сегодня лучше вид."
      - "Pablo: Muy bien. Tengo un sueño profundo desde que me mudé a la sierra. | Очень хорошо. У меня глубокий сон с тех пор, как я переехал в горы."
      - "Ana: Será por el silencio. En la ciudad siempre hay algún murmullo. | Наверное, из-за тишины. В городе всегда какой-то гул."
      - "Pablo: Eso también. Pero lo más profundo que noté fue otra cosa: la paciencia. | И это тоже. Но самое глубокое, что я заметил, — это другое: терпение."
      - "Ana: ¿La paciencia? | Терпение?"
      - "Pablo: Sí. Antes tenía prisa por todo. Ahora me siento en el jardín y reflexiono sobre mi vida. | Да. Раньше я торопился всюду. Теперь сажусь в саду и размышляю о своей жизни."
      - "Ana: Qué envidia. Yo ando siempre con mil cosas en la cabeza. | Вот завидую. А у меня вечно тысяча дел в голове."
      - "Pablo: Pues ven este fin de semana. Te presto mi hamaca. | Тогда приезжай в эти выходные. Одолжу тебе гамак."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "sueño profundo — крепкий сон"
      - "respirar profundo — глубоко дышать"
      - "en lo más profundo — в глубине души"
    collocation_example: "Respira profundo y cálmate. — Глубоко вдохни и успокойся."
    trap: "«Глубоко вдохнуть» часто говорят respirar hondo или respirar profundo. Глубина — profundidad."

  - word: fatal
    ru: роковой; ужасный (разг.)
    ipa: /faˈtal/
    say: фата́ль
    pron: "Ударение на последнем слоге."
    meaning: "Роковой, смертельный; в разговоре в Испании — «ужасный, отвратительный» (как наречие: fatal — ужасно)."
    examples:
      - "Fue una decisión fatal para la empresa. — Это было роковое решение для компании."
      - "Salir de casa sin mirar el pronóstico del tiempo fue un error fatal. — Выйти из дома, не посмотрев прогноз погоды, было роковой ошибкой."
      - "Me encuentro fatal desde esta mañana y creo que tengo fiebre, así que me quedo en casa. — Мне ужасно плохо с утра, кажется, у меня температура, так что остаюсь дома."
    origin: "Лат. fatalis, от fatum «судьба, рок». Родственное: fatalidad «злой рок»."
    register: "В значении «ужасный» — разговорное и очень частое в Испании."
    synonyms:
      - word: horrible
        pair: ["El examen me salió fatal.", "El examen me salió horrible."]
        diff:
          - "horrible — нейтральнее"
          - "fatal — разговорное, очень испанское"
    analogs:
      - "fatal — роковой, смертельный"
      - "awful / terrible — ужасный (разговорное значение)"
    dialogue:
      - "Lucía: ¿Qué tal el examen? | Как экзамен?"
      - "Marcos: Fatal. Me equivoqué en todo. | Ужасно. Я во всём ошибся."
      - "Lucía: No digas eso. Seguro que no es para tanto. | Не говори так. Наверняка не всё так плохо."
      - "Marcos: Sí lo es. Me puse nervioso y olvidé la fecha más importante. | Всё так. Я разнервничался и забыл самую важную дату."
      - "Lucía: Eso le pasa a cualquiera. ¿Y la última pregunta? | Это бывает с кем угодно. А последний вопрос?"
      - "Marcos: Fatal también. Escribí algo que no tenía sentido. | Тоже ужасно. Я написал то, в чём не было смысла."
      - "Lucía: Bueno, el fracaso de hoy no es una tragedia. Puedes repetirlo en septiembre. | Что ж, сегодняшняя неудача — не трагедия. Можно пересдать в сентябре."
      - "Marcos: Tienes razón. Lo único fatal sería rendirme. | Ты права. Ужасным было бы только сдаться."
    cefr: "B1."
    frequency: "Очень частое в разговоре в Испании."
    collocations:
      - "pasarlo fatal — ужасно провести время"
      - "encontrarse fatal — ужасно себя чувствовать"
      - "un accidente fatal — смертельная авария"
    collocation_example: "Me encuentro fatal, me voy a casa. — Я ужасно себя чувствую, пойду домой."
    trap: "В разговоре fatal почти всегда «ужасно», а не «смертельно»: Lo pasé fatal — «мне было плохо», никто не умер."

  - word: inodoro
    ru: без запаха
    ipa: /inoˈðoɾo/
    say: инодо́ро
    pron: "d между гласными мягкое [ð]."
    meaning: "Без запаха. Как существительное el inodoro — унитаз (то, что «не пахнет»)."
    examples:
      - "Es un gas inodoro y muy peligroso. — Это газ без запаха и очень опасный."
      - "Arreglaron también la cisterna que perdía agua cuando cambiaron el inodoro del baño. — Когда меняли унитаз в ванной, починили и бачок, из которого текла вода."
      - "El veneno era inodoro e incoloro, y nadie notó nada raro en el vaso. — Яд был без запаха и без цвета, и никто не заметил в стакане ничего странного."
    origin: "in- «без» + olor «запах» (лат. odor). Унитаз так назвали, потому что он «убирает запах»."
    register: "Нейтральное, научное; значение «унитаз» — бытовое."
    synonyms:
      - word: sin olor
        pair: ["Un líquido inodoro.", "Un líquido sin olor."]
        diff:
          - "sin olor — разговорнее"
    analogs:
      - "odourless — без запаха"
      - "toilet — унитаз"
    dialogue:
      - "Inspectora: Nadie notó el veneno en la comida. ¿Cómo es posible? | Никто не заметил яд в еде. Как такое возможно?"
      - "Forense: Es normal. Es un veneno inodoro e incoloro. | Это нормально. Это яд без запаха и цвета."
      - "Inspectora: Entonces el culpable lo eligió con cuidado. | Значит, виновный выбрал его не случайно."
      - "Forense: Exacto. Conoce bien la química o tuvo ayuda de alguien. | Именно. Он хорошо знает химию или ему кто-то помог."
      - "Inspectora: La autopsia confirma que fue un asesinato, ¿no? | Вскрытие подтверждает, что это было убийство, да?"
      - "Forense: Sin duda. Y no fue un delito improvisado. | Без сомнения. И это не было спонтанное преступление."
      - "Inspectora: ¿Se puede averiguar dónde lo compró? | Можно выяснить, где он его купил?"
      - "Forense: Quizá. Hay una pista en la etiqueta del frasco. | Возможно. На этикетке флакона есть зацепка."
    cefr: "C1."
    frequency: "Редкое как прилагательное, частое как «унитаз»."
    collocations:
      - "inodoro e incoloro — без запаха и цвета"
      - "un gas inodoro — газ без запаха"
      - "limpiar el inodoro — чистить унитаз"
    collocation_example: "El agua es inodora e incolora. — Вода без запаха и цвета."
    trap: "Как существительное el inodoro — это унитаз! «Туалет» как комната — el baño, el servicio."

  - word: imperdonable
    ru: непростительный
    ipa: /imperðoˈnaβle/
    say: импэрдона́блэ
    pron: "d после r мягкое [ð], b между гласными мягкое [β]."
    meaning: "Непростительный. Одна форма для обоих родов."
    examples:
      - "Su traición es simplemente imperdonable. — Его предательство попросту непростительно."
      - "Es un error imperdonable haber olvidado el aniversario de boda de tus padres. — Это непростительная ошибка – забыть годовщину свадьбы родителей."
      - "Lo que hizo es imperdonable, y no creo que pueda volver a confiar en él. — То, что он сделал, непростительно, и я не думаю, что смогу снова ему доверять."
    origin: "in- «не» + perdonar «прощать» + -able «можно»."
    register: "Нейтральное."
    synonyms:
      - word: inexcusable
        pair: ["Es imperdonable.", "Es inexcusable."]
        diff:
          - "inexcusable — официальнее, «не имеющий оправдания»"
    analogs:
      - "unforgivable — непростительный"
    dialogue:
      - "Ana: Olvidé el cumpleaños de mi madre. | Я забыла про день рождения мамы."
      - "Pablo: ¡Imperdonable! Cómprale un ramo de flores ahora mismo. | Непростительно! Купи ей букет прямо сейчас."
      - "Ana: Ya es tarde, la florería cerró. Seguro que está dolida. | Уже поздно, цветочный закрылся. Наверняка она обиделась."
      - "Pablo: Entonces llámala y pídele perdón. Sé sincera, no finjas que lo recordabas. | Тогда позвони и попроси прощения. Будь искренней, не притворяйся, что помнила."
      - "Ana: Tienes razón. Mi comportamiento fue egoísta. | Ты прав. Моё поведение было эгоистичным."
      - "Pablo: No pasa nada, tu madre tiene mucha paciencia contigo. | Ничего страшного, у твоей мамы к тебе много терпения."
      - "Ana: Lo sé, pero esta vez voy a compensarla. | Знаю, но в этот раз я всё исправлю."
      - "Pablo: Pues empieza por una buena cena. | Тогда начни с хорошего ужина."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "un error imperdonable — непростительная ошибка"
      - "es imperdonable que… — непростительно, что…"
      - "perdonar a alguien — простить кого-то"
    collocation_example: "Es imperdonable que no avisaras. — Непростительно, что ты не предупредил."
    trap: "n перед p пишется как m: imperdonable. После es imperdonable que — subjuntivo."

  - word: delicado
    ru: деликатный, тонкий
    ipa: /deliˈkaðo/
    say: дэлика́до
    pron: "d в -ado мягкое, почти пропадает."
    meaning: "Деликатный (о теме, ситуации); хрупкий, нежный; слабый здоровьем."
    examples:
      - "Es una situación muy delicada para todos. — Это очень деликатная ситуация для всех."
      - "Tiene la piel muy delicada y se le irrita con cualquier jabón. — У неё очень нежная кожа, и она раздражается от любого мыла."
      - "Mi abuelo está delicado de salud desde el invierno y no puede salir mucho de casa. — Мой дед слаб здоровьем с зимы и не может часто выходить из дома."
    origin: "Лат. delicatus «изнеженный», от deliciae «наслаждения»."
    register: "Нейтральное."
    synonyms:
      - word: frágil
        pair: ["Un objeto delicado.", "Un objeto frágil."]
        diff:
          - "frágil — хрупкий, легко сломать"
          - "delicado — ещё и о теме, ситуации, вкусе"
    analogs:
      - "delicate / sensitive — деликатный"
      - "fragile — хрупкий"
    dialogue:
      - "Lucía: ¿Le pregunto a Ricardo por su despido? | Спросить мне Рикардо про его увольнение?"
      - "Marcos: Mejor no. Es un tema delicado y todavía está resentido. | Лучше не надо. Это деликатная тема, и он ещё обижен."
      - "Lucía: Pero tengo curiosidad. Dicen que fue por una mala gestión. | Но мне любопытно. Говорят, всё из-за плохого управления."
      - "Marcos: Eso dicen, pero nadie sabe la verdad. Es una situación muy delicada para todos. | Так говорят, но правды никто не знает. Для всех это очень деликатная ситуация."
      - "Lucía: ¿Y si lo invitamos a cenar sin hablar del trabajo? | А если пригласить его на ужин и не говорить о работе?"
      - "Marcos: Buena idea. Eso demuestra respeto y ternura, que es lo que necesita. | Хорошая мысль. Это показывает уважение и нежность — то, что ему нужно."
      - "Lucía: Lo llamo mañana. Y prometo no cotillear. | Позвоню завтра. И обещаю не сплетничать."
      - "Marcos: Eso sí que sería un milagro. | Вот это было бы чудо."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "un tema delicado — деликатная тема"
      - "una situación delicada — щекотливая ситуация"
      - "estar delicado de salud — иметь слабое здоровье"
    collocation_example: "Estamos en una situación delicada. — Мы в щекотливой ситуации."
    trap: "О человеке «деликатный, тактичный» чаще — discreto или educado; delicado о человеке — хрупкий или капризный."

  - word: contemporáneo
    ru: современный
    ipa: /kontempoˈɾane.o/
    say: контэмпора́нэо
    pron: "Ударение на ra (тильда), eo — два слога."
    meaning: "Современный (об искусстве, истории); современник."
    examples:
      - "Me gusta el arte contemporáneo. — Мне нравится современное искусство."
      - "Fue contemporáneo de Picasso y juntos expusieron en una galería de París. — Он был современником Пикассо, и они вместе выставлялись в парижской галерее."
      - "Es un edificio contemporáneo, con mucho cristal, que contrasta con las casas antiguas de la calle. — Это современное здание с большим количеством стекла, которое контрастирует со старыми домами на улице."
    origin: "Лат. con «вместе» + tempus «время»: «одного времени»."
    register: "Книжное, нейтральное."
    synonyms:
      - word: moderno
        pair: ["Arte contemporáneo.", "Arte moderno."]
        diff:
          - "moderno — «модерн», в искусстве — конец XIX — середина XX века"
          - "contemporáneo — сегодняшнее, нашего времени"
    analogs:
      - "contemporary — современный"
    dialogue:
      - "Ana: ¿Vamos al museo esta tarde? | Пойдём в музей сегодня днём?"
      - "Pablo: Vale, pero de arte contemporáneo, no de arte antiguo. | Ладно, но современного искусства, а не старого."
      - "Ana: ¿Por qué? A mí me encanta lo clásico. | Почему? Мне очень нравится классика."
      - "Pablo: Porque el arte contemporáneo te hace reflexionar. A veces no tiene sentido, pero eso es lo bueno. | Потому что современное искусство заставляет задуматься. Иногда в нём нет смысла, но в этом и прелесть."
      - "Ana: La verdad es que no me convence. | По правде говоря, меня это не убеждает."
      - "Pablo: Pues prueba una vez. Hay una sala con una obra enorme y no me atrevo a contarte cómo es. | Просто попробуй. Там есть зал с огромной работой, и я не решаюсь рассказать какая."
      - "Ana: Ahora sí me das curiosidad. | Теперь ты разжёг моё любопытство."
      - "Pablo: ¡Ese es el espíritu! | Вот это настрой!"
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "arte contemporáneo — современное искусство"
      - "historia contemporánea — новейшая история"
      - "ser contemporáneo de alguien — быть чьим-то современником"
    collocation_example: "Estudio historia contemporánea. — Я изучаю новейшую историю."
    trap: "Ударение и тильда: contemporáneo. В быту «современный (новый, модный)» — moderno."

  - word: irreconocible
    ru: неузнаваемый
    ipa: /irekonoˈθiβle/
    say: ирэконоси́блэ
    pron: "rr — раскатистое, c перед i — [θ], b мягкое [β]."
    meaning: "Неузнаваемый — так изменился, что не узнать. Одна форма для обоих родов."
    examples:
      - "El pueblo está irreconocible desde la riada. — Село неузнаваемо после паводка."
      - "Tras el incendio, la fachada del edificio quedó irreconocible y llena de humo. — После пожара фасад здания стал неузнаваемым и был весь в копоти."
      - "Con la barba tan larga estás irreconocible, casi no te he reconocido en la estación. — С такой длинной бородой ты неузнаваем, я почти не узнал тебя на вокзале."
    origin: "in- «не» + reconocer «узнать» + -ible «можно»."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "unrecognizable — неузнаваемый"
    dialogue:
      - "Inspectora: ¿Reconoce al hombre del vídeo? | Вы узнаёте человека на видео?"
      - "Testigo: No. Con ese disfraz está irreconocible. | Нет. В этом костюме его не узнать."
      - "Inspectora: Mire bien cómo anda. Parece que cojea. | Посмотрите, как он идёт. Кажется, хромает."
      - "Testigo: Es verdad, pero tampoco puedo estar seguro de que sea él. | Правда, но я всё равно не могу быть уверен, что это он."
      - "Inspectora: Entiendo. ¿Y la voz? ¿La reconocería? | Понимаю. А голос? Вы бы его узнали?"
      - "Testigo: Quizá. Era una voz amenazante y muy grave. | Возможно. Голос был угрожающим и очень низким."
      - "Inspectora: Con eso nos basta para seguir. Gracias por su paciencia. | Нам этого достаточно, чтобы продолжать. Спасибо за терпение."
      - "Testigo: ¿Puedo irme? Tengo prisa, mi hija me espera. | Можно мне идти? Я спешу, меня ждёт дочь."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar irreconocible — быть неузнаваемым"
      - "quedar irreconocible — стать неузнаваемым"
      - "reconocer a alguien — узнать кого-то"
    collocation_example: "Después del incendio la casa quedó irreconocible. — После пожара дом стал неузнаваем."
    trap: "Пишется с rr: irreconocible. С estar: estás irreconocible."

  - word: soleado
    ru: солнечный
    ipa: /soleˈaðo/
    say: солэа́до
    pron: "d в -ado мягкое, почти пропадает."
    meaning: "Солнечный — о дне, месте, комнате."
    examples:
      - "Prefiero un cuarto soleado y tranquilo. — Я предпочитаю солнечную и тихую комнату."
      - "El piso es muy soleado, porque tiene ventanas grandes que dan al sur. — Квартира очень солнечная, потому что в ней большие окна на юг."
      - "Hoy hace un día soleado y perfecto para comer en la terraza con los amigos. — Сегодня солнечный день, идеальный, чтобы пообедать на террасе с друзьями."
    origin: "От sol «солнце»."
    register: "Нейтральное."
    synonyms:
      - word: despejado
        pair: ["Un día soleado.", "Un día despejado."]
        diff:
          - "despejado — безоблачный, ясный"
    analogs:
      - "sunny — солнечный"
    dialogue:
      - "Lucía: ¿Qué tiempo hace mañana? Quiero ir a la playa. | Какая завтра погода? Я хочу на пляж."
      - "Marcos: Soleado, sin tormentas. Será un día perfecto. | Солнечно, без гроз. День будет идеальным."
      - "Lucía: ¡Qué bien! La semana pasada la tormenta arruinó nuestros planes. | Как здорово! На прошлой неделе гроза испортила наши планы."
      - "Marcos: Y acabamos en un bar, de mal humor y con frío. | И мы оказались в баре, злые и замёрзшие."
      - "Lucía: Esta vez llevo crema solar y un sombrero. | В этот раз беру солнцезащитный крем и шляпу."
      - "Marcos: Yo preparo una tortilla y algo de fruta. | Я приготовлю тортилью и фрукты."
      - "Lucía: ¿Te apetece salir temprano? Quiero un sitio con sombra. | Хочешь выехать пораньше? Мне нужно место в тени."
      - "Marcos: Vale, a las ocho. Y no te alborotes si hay tráfico. | Хорошо, в восемь. И не нервничай, если будут пробки."
    cefr: "A2."
    frequency: "Частое в прогнозах погоды."
    collocations:
      - "un día soleado — солнечный день"
      - "un piso soleado — солнечная квартира"
      - "tomar el sol — загорать"
    collocation_example: "Nos encanta tomar el sol. — Мы обожаем загорать."
    trap: "«Солнечно» о погоде — hace sol или está soleado, не es soleado."

  - word: mojado
    ru: мокрый
    ipa: /moˈxaðo/
    say: моха́до
    pron: "j — хриплое [x], d в -ado почти пропадает."
    meaning: "Мокрый, промокший."
    examples:
      - "Dejé la toalla mojada en el suelo. — Я оставил мокрое полотенце на полу."
      - "Salí corriendo sin paraguas, empezó a diluviar y ahora tengo el pelo mojado. — Я выбежал без зонта, начался ливень, и теперь у меня мокрые волосы."
      - "Llegué a casa mojado hasta los huesos después de esperar una hora el autobús. — Я пришёл домой промокшим до костей после часового ожидания автобуса."
    origin: "Причастие от mojar «мочить» (лат. molliare «смягчать»)."
    register: "Нейтральное."
    synonyms:
      - word: húmedo
        pair: ["La ropa está mojada.", "La ropa está húmeda."]
        diff:
          - "húmedo — влажный, слегка"
          - "mojado — мокрый насквозь"
    analogs:
      - "wet — мокрый"
    dialogue:
      - "Ana: ¡Estás mojado! ¿Qué te pasó? | Ты мокрый! Что с тобой случилось?"
      - "Pablo: Me pilló la tormenta cuando volvía a casa. | Меня застала гроза по дороге домой."
      - "Ana: ¿Y no llevabas paraguas? | И у тебя не было зонта?"
      - "Pablo: Lo dejé en la oficina. Estaba distraído y con mucha prisa. | Я оставил его в офисе. Я был рассеян и сильно торопился."
      - "Ana: Pues quítate esa chaqueta mojada antes de que te enfríes. | Тогда снимай эту мокрую куртку, пока не замёрз."
      - "Pablo: Ya tengo frío y un poco de mareo. | Мне уже холодно и немного кружится голова."
      - "Ana: Te preparo un té caliente. No es nada grave. | Заварю тебе горячий чай. Ничего серьёзного."
      - "Pablo: Gracias. Mañana te lo agradezco con una cena. | Спасибо. Завтра отблагодарю тебя ужином."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "estar mojado — быть мокрым"
      - "suelo mojado — мокрый пол"
      - "mojarse — промокнуть"
    collocation_example: "Cuidado, el suelo está mojado. — Осторожно, мокрый пол."
    trap: "С estar: está mojado. «Промокнуть» — mojarse: me mojé."

  - word: protegido
    ru: защищённый
    ipa: /pɾoteˈxiðo/
    say: протэхи́до
    pron: "g перед i — хриплое [x]."
    meaning: "Защищённый, под защитой; как существительное — протеже, подопечный."
    examples:
      - "Aquí estás protegido del viento y la lluvia. — Здесь ты защищён от ветра и дождя."
      - "Está prohibido cazarla en todo el país porque es una especie protegida. — На неё запрещена охота по всей стране, потому что это охраняемый вид."
      - "Se sentía protegido junto a su hermano mayor, que siempre lo defendía en el colegio. — Он чувствовал себя под защитой рядом со старшим братом, который всегда заступался за него в школе."
    origin: "Причастие от proteger «защищать» (лат. protegere «прикрывать»)."
    register: "Нейтральное."
    synonyms:
      - word: seguro
        pair: ["Aquí estás protegido.", "Aquí estás seguro."]
        diff:
          - "seguro — в безопасности вообще"
          - "protegido — кто-то или что-то защищает"
    analogs:
      - "protected — защищённый"
    dialogue:
      - "Lucía: ¿El testigo está protegido? | Свидетель под защитой?"
      - "Inspectora: Sí, tiene dos guardaespaldas y una casa segura. | Да, у него два телохранителя и безопасный дом."
      - "Lucía: ¿Y no teme una venganza? | И он не боится мести?"
      - "Inspectora: Claro que sí. Por eso está tan callado y receloso. | Конечно боится. Потому и такой молчаливый и осторожный."
      - "Lucía: ¿Cree que el asesino sabe dónde vive? | Вы думаете, убийца знает, где он живёт?"
      - "Inspectora: No lo sé. Tampoco puedo estar segura de que actúe solo. | Не знаю. И не могу быть уверена, что он действует один."
      - "Lucía: Entonces habrá que protegerlo hasta que declare. | Тогда придётся защищать его, пока он не даст показания."
      - "Inspectora: Así es. Hasta entonces, aquí estará protegido de cualquier amenaza. | Именно. До тех пор здесь он будет защищён от любой угрозы."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "especie protegida — охраняемый вид"
      - "sentirse protegido — чувствовать себя защищённым"
      - "proteger a alguien — защищать кого-то"
    collocation_example: "Con él me siento protegida. — С ним я чувствую себя защищённой."
    trap: "Форма «я» — protejo, с j: proteger → protejo."

  - word: arrepentido
    ru: раскаявшийся
    ipa: /arepenˈtiðo/
    say: арэпэнти́до
    pron: "rr — раскатистое [r]."
    meaning: "Раскаявшийся, сожалеющий о сделанном."
    examples:
      - "Estoy arrepentida de lo que dije. — Я жалею о том, что сказала."
      - "Ante el juez, el acusado confesó arrepentido y devolvió el dinero robado. — Перед судьёй обвиняемый признался с раскаянием и вернул украденные деньги."
      - "Está muy arrepentido de lo que hizo y quiere pedir perdón a toda su familia. — Он глубоко раскаивается в том, что сделал, и хочет попросить прощения у всей семьи."
    origin: "Причастие от arrepentirse «раскаиваться»."
    register: "Нейтральное."
    synonyms:
      - word: avergonzado
        pair: ["Está arrepentido.", "Está avergonzado."]
        diff:
          - "avergonzado — стыдно"
          - "arrepentido — жалеет о поступке"
    analogs:
      - "sorry / regretful — раскаявшийся"
      - "repentant — раскаявшийся (книжное)"
    dialogue:
      - "Inspectora: ¿El culpable está arrepentido? | Виновный раскаивается?"
      - "Marcos: Parece que no. No ha dicho ni una palabra desde que lo detuvieron. | Похоже, нет. Он не сказал ни слова с момента задержания."
      - "Inspectora: A veces el silencio esconde un gran resentimiento. | Иногда молчание скрывает глубокую обиду."
      - "Marcos: O una gran soberbia. Se cree superior a todos. | Или большую гордыню. Он считает себя выше всех."
      - "Inspectora: ¿Y la familia de la víctima? ¿Lo perdonará algún día? | А семья жертвы? Простит ли она его когда-нибудь?"
      - "Marcos: Es difícil. El dolor es demasiado grande y el luto aún es reciente. | Трудно. Боль слишком велика, и траур ещё свеж."
      - "Inspectora: Lo sé. Pero un culpable arrepentido puede cambiar una sentencia. | Знаю. Но раскаявшийся виновный может изменить приговор."
      - "Marcos: Entonces esperemos que reflexione antes del juicio. | Тогда будем надеяться, что он подумает до суда."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar arrepentido de algo — раскаиваться в чём-то"
      - "un delincuente arrepentido — раскаявшийся преступник"
      - "arrepentirse de algo — жалеть о чём-то"
    collocation_example: "Estoy arrepentido de no haber ido. — Жалею, что не пошёл."
    trap: "О чём — de: arrepentido **de** algo. С estar: está arrepentido."

  - word: valioso
    ru: ценный
    ipa: /baˈljoso/
    say: бальо́со
    pron: "v читается как b: «бальёсо»."
    meaning: "Ценный — дорогой или важный, полезный."
    examples:
      - "Guarda ese libro valioso en la vitrina. — Убери эту ценную книгу в витрину."
      - "Lo voy a recordar toda la vida: es un consejo muy valioso. — Я буду помнить это всю жизнь: это очень ценный совет."
      - "Tu ayuda ha sido muy valiosa para terminar el proyecto en la fecha que pidió el cliente. — Твоя помощь была очень ценной для завершения проекта к дате, которую назвал клиент."
    origin: "От valor «ценность». Родственные: valorar «ценить», valer «стоить»."
    register: "Нейтральное."
    synonyms:
      - word: precioso
        pair: ["Un tiempo valioso.", "Un tiempo precioso."]
        diff:
          - "precioso — чаще «прелестный, красивый»; «драгоценный» — книжно"
    analogs:
      - "valuable — ценный"
      - "precious — драгоценный"
    dialogue:
      - "Ana: ¿Por qué ocultas esa caja debajo de la cama? | Почему ты прячешь эту коробку под кроватью?"
      - "Pablo: Porque es muy valiosa. Era de mi abuela. | Потому что она очень ценная. Она принадлежала бабушке."
      - "Ana: ¿Qué guarda? ¿Joyas? | Что в ней? Украшения?"
      - "Pablo: Algo mejor: cartas y fotos. Para mí lo más valioso es la memoria. | Кое-что получше: письма и фото. Для меня самое ценное — память."
      - "Ana: Qué ternura. ¿Puedo verlas? | Какая нежность. Можно посмотреть?"
      - "Pablo: Claro, pero con cuidado. Las hojas están muy delicadas. | Конечно, но осторожно. Страницы очень хрупкие."
      - "Ana: Prometo tratarlas con paciencia. | Обещаю обращаться с ними терпеливо."
      - "Pablo: Entonces siéntate, que tenemos para rato. | Тогда садись, нам тут надолго."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "un objeto valioso — ценная вещь"
      - "información valiosa — ценная информация"
      - "tiempo valioso — драгоценное время"
    collocation_example: "Gracias por tu valiosa ayuda. — Спасибо за твою ценную помощь."
    trap: "Пишется с v. precioso обычно «красивый», а «ценный» — valioso."
