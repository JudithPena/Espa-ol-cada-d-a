          - "inexcusable — официальнее, «не имеющий оправдания»"
    analogs:
      - "unforgivable — непростительный"
    dialogue:
      - "Ana: Olvidé su cumpleaños. | Я забыла про её день рождения."
      - "Pablo: ¡Imperdonable! Cómprale un ramo de flores. | Непростительно! Купи ей букет."
