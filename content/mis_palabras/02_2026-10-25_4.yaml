      - "Estoy desilusionado con el resultado, porque esperaba mucho más después de tanto esfuerzo. — Я разочарован результатом, потому что ждал гораздо большего после стольких усилий."
    origin: "des- + ilusión «надежда, мечта»: «лишённый надежд». Родственное: desilusión «разочарование»."
