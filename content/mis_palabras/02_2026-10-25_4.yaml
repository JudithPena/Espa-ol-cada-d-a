  - word: fatal
    ru: роковой; ужасный (разг.)
    ipa: /faˈtal/
    say: фата́ль
    pron: "Ударение на последнем слоге."
    meaning: "Роковой, смертельный; в разговоре в Испании — «ужасный, отвратительный» (как наречие: fatal — ужасно)."
    examples:
      - "Lo pasé fatal. — Мне было ужасно."
      - "Fue un error fatal dejar la puerta sin cerrar justo la noche en que llovió tanto. — Это была роковая ошибка – оставить дверь незапертой именно в ту ночь, когда был такой ливень."
      - "Me encuentro fatal desde esta mañana y creo que tengo fiebre, así que me quedo en casa. — Мне ужасно плохо с утра, кажется, у меня температура, так что остаюсь дома."
    origin: "Лат. fatalis, от fatum «судьба, рок». Родственное: fatalidad «злой рок»."
    register: "В значении «ужасный» — разговорное и очень частое в Испании."
    synonyms:
      - word: horrible
        pair: ["El examen me salió fatal.", "El examen me salió horrible."]
        diff:
          - "horrible — нейтральнее"
          - "fatal — разговорное, очень испанское"
    analogs:
      - "fatal — роковой, смертельный"
      - "awful / terrible — ужасный (разговорное значение)"
    dialogue:
      - "Lucía: ¿Qué tal el examen? | Как экзамен?"
      - "Marcos: Fatal. Me equivoqué en todo. | Ужасно. Я во всём ошибся."
    cefr: "B1."
    frequency: "Очень частое в разговоре в Испании."
    collocations:
      - "pasarlo fatal — ужасно провести время"
      - "encontrarse fatal — ужасно себя чувствовать"
      - "un accidente fatal — смертельная авария"
    collocation_example: "Me encuentro fatal, me voy a casa. — Я ужасно себя чувствую, пойду домой."
    trap: "В разговоре fatal почти всегда «ужасно», а не «смертельно»: Lo pasé fatal — «мне было плохо», никто не умер."

  - word: inodoro
    ru: без запаха
    ipa: /inoˈðoɾo/
    say: инодо́ро
    pron: "d между гласными мягкое [ð]."
    meaning: "Без запаха. Как существительное el inodoro — унитаз (то, что «не пахнет»)."
    examples:
      - "Es un gas inodoro. — Это газ без запаха."
      - "El veneno era inodoro e incoloro, y nadie notó nada raro en el vaso. — Яд был без запаха и без цвета, и никто не заметил в стакане ничего странного."
      - "Cambiaron el inodoro del baño y arreglaron también la cisterna que perdía agua. — В ванной поменяли унитаз и починили заодно бачок, из которого текла вода."
    origin: "in- «без» + olor «запах» (лат. odor). Унитаз так назвали, потому что он «убирает запах»."
    register: "Нейтральное, научное; значение «унитаз» — бытовое."
    synonyms:
      - word: sin olor
        pair: ["Un líquido inodoro.", "Un líquido sin olor."]
        diff:
          - "sin olor — разговорнее"
    analogs:
      - "odourless — без запаха"
      - "toilet — унитаз"
    dialogue:
      - "Inspectora: Nadie notó el veneno. | Никто не заметил яд."
      - "Forense: Normal, es inodoro e incoloro. | Ещё бы: он без запаха и цвета."
    cefr: "C1."
    frequency: "Редкое как прилагательное, частое как «унитаз»."
    collocations:
      - "inodoro e incoloro — без запаха и цвета"
      - "un gas inodoro — газ без запаха"
      - "limpiar el inodoro — чистить унитаз"
    collocation_example: "El agua es inodora e incolora. — Вода без запаха и цвета."
    trap: "Как существительное el inodoro — это унитаз! «Туалет» как комната — el baño, el servicio."

  - word: imperdonable
    ru: непростительный
    ipa: /imperðoˈnaβle/
    say: импэрдона́блэ
    pron: "d после r мягкое [ð], b между гласными мягкое [β]."
