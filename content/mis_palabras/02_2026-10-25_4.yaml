    frequency: "Средняя."
    collocations:
      - "sentirse rechazado — чувствовать себя отвергнутым"
      - "rechazar una oferta — отклонить предложение"
      - "el rechazo — отказ"
    collocation_example: "Rechazó la oferta de trabajo. — Он отклонил предложение о работе."
    trap: "Пишется с z: rechazado, rechazar. Отклонить «звонок» — rechazar la llamada, тоже этим словом."

  - word: molesto
