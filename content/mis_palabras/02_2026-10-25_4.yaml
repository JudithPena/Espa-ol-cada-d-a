    analogs:
      - "delicate / sensitive — деликатный"
      - "fragile — хрупкий"
    dialogue:
      - "Lucía: ¿Le pregunto por su despido? | Спросить его об увольнении?"
      - "Marcos: Mejor no. Es un tema delicado. | Лучше не надо. Это деликатная тема."
