      - "Hay dos heridos en el accidente, pero ninguno de ellos está en estado grave. — В аварии двое раненых, но ни один из них не в тяжёлом состоянии."
    origin: "Причастие от herir «ранить» (лат. ferire «бить»). Родственное: herida «рана»."
    register: "Нейтральное."
    synonyms:
      - word: lesionado
        pair: ["Está herido.", "Está lesionado."]
        diff:
          - "lesionado — с травмой (спорт)"
          - "herido — с раной"
    analogs:
      - "wounded / injured — раненый"
      - "hurt — задетый"
    dialogue:
      - "Inspectora: ¿Hay heridos? | Есть раненые?"
