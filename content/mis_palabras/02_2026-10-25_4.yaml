      - "disappointed — разочарованный"
      - "disillusioned — потерявший иллюзии"
    dialogue:
      - "Ana: ¿Qué tal la entrevista? | Как собеседование?"
      - "Pablo: Mal. Estoy desilusionado, el sueldo es bajísimo. | Плохо. Я разочарован, зарплата очень низкая."
