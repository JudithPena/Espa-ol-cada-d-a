    say: бальо́со
    pron: "v читается как b: «бальёсо»."
    meaning: "Ценный — дорогой или важный, полезный."
    examples:
      - "Es un consejo muy valioso. — Это очень ценный совет."
      - "Es un consejo muy valioso y lo voy a recordar toda la vida. — Это очень ценный совет, и я буду помнить его всю жизнь."
      - "Tu ayuda ha sido muy valiosa para terminar el proyecto en la fecha que pidió el cliente. — Твоя помощь была очень ценной для завершения проекта к дате, которую назвал клиент."
    origin: "От valor «ценность». Родственные: valorar «ценить», valer «стоить»."
    register: "Нейтральное."
    synonyms:
      - word: precioso
        pair: ["Un tiempo valioso.", "Un tiempo precioso."]
        diff:
          - "precioso — чаще «прелестный, красивый»; «драгоценный» — книжно"
    analogs:
      - "valuable — ценный"
      - "precious — драгоценный"
    dialogue:
      - "Ana: ¿Por qué ocultas esa caja? | Почему ты прячешь эту коробку?"
      - "Pablo: Porque es muy valiosa. Era de mi abuela. | Потому что она очень ценная. Она была бабушкина."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "un objeto valioso — ценная вещь"
      - "información valiosa — ценная информация"
      - "tiempo valioso — драгоценное время"
    collocation_example: "Gracias por tu valiosa ayuda. — Спасибо за твою ценную помощь."
    trap: "Пишется с v. precioso обычно «красивый», а «ценный» — valioso."
