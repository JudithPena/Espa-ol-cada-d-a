      - "distant / absent-minded — отстранённый"
    dialogue:
      - "Ana: Desde el entierro está muy ausente. | После похорон он очень отрешённый."
      - "Pablo: Es normal. Está de luto. | Это нормально. Он в трауре."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
