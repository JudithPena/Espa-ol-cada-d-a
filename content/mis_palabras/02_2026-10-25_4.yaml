# Второй список автора, часть 4 — прилагательные.
lang: es
words:
  - word: alborotado
    ru: взволнованный, переполошенный
    ipa: /alβoɾoˈtaðo/
    say: альборота́до
    pron: "b после l мягкое [β], d в -ado почти пропадает: «альборота́о»."
    meaning: "Взволнованный, шумный, взбудораженный; о волосах — растрёпанный. Согласуется: alborotada, alborotados."
    examples:
      - "Estaba alborotado el pelo del niño. — У мальчика были растрёпаны волосы."
      - "Mañana empiezan las vacaciones, y por eso los niños están muy alborotados hoy. — Завтра начинаются каникулы, поэтому дети сегодня очень возбуждены."
      - "La plaza estaba alborotada con la llegada de los músicos que venían de la capital. — Площадь гудела от приезда музыкантов из столицы."
    origin: "Причастие от alborotar «будоражить», от alboroto «шум, суматоха»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: agitado
        pair: ["El público está alborotado.", "El público está agitado."]
        diff:
          - "agitado — взволнованный, неспокойный, без шума"
    analogs:
      - "excited / rowdy — взбудораженный, шумный"
      - "messy (hair) — растрёпанный"
    dialogue:
      - "Lucía: ¿Por qué está todo el mundo tan alborotado? | Почему все так взбудоражены?"
      - "Marcos: Han encontrado una pista. | Нашли зацепку."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar alborotado — быть взбудораженным"
      - "pelo alborotado — растрёпанные волосы"
      - "un barrio alborotado — шумный район"
    collocation_example: "Se levantó con el pelo alborotado. — Он встал с растрёпанными волосами."
    trap: "С estar, а не ser: está alborotado (состояние). Глагол — alborotarse."

  - word: torpe
    ru: неуклюжий
    ipa: /ˈtoɾpe/
    say: то́рпэ
    meaning: "Неуклюжий, неловкий; ещё — несообразительный, бестолковый. Одна форма для обоих родов."
    examples:
      - "¡Qué torpe soy con los números! — Какой я неловкий с числами!"
      - "Siempre rompo algún vaso en casa porque soy muy torpe con las manos. — Я всегда бью дома какой-нибудь стакан, потому что очень неловок руками."
      - "No es que sea torpe, solo es que aún no le han explicado cómo funciona la máquina. — Дело не в том, что он бестолковый, просто ему ещё не объяснили, как работает машина."
    origin: "Лат. turpis «уродливый, постыдный». Родственное: torpeza «неуклюжесть»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: patoso
        pair: ["Es muy torpe.", "Es muy patoso."]
        diff:
          - "patoso — разговорное испанское «растяпа», только о движениях"
    analogs:
      - "clumsy — неуклюжий"
      - "awkward — неловкий"
    dialogue:
      - "Ana: ¡Ay! Se me ha caído el café. | Ой! Я уронила кофе."
      - "Pablo: No pasa nada. Yo soy más torpe que tú. | Ничего страшного. Я ещё неуклюжее тебя."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ser torpe — быть неуклюжим"
      - "torpe con las manos — неловкий руками"
      - "un movimiento torpe — неловкое движение"
    collocation_example: "Soy torpe con las manos. — У меня руки не из того места."
    trap: "Одна форма: él es torpe, ella es torpe. С ser — черта характера, с estar — сейчас неловкий: hoy estoy torpe."

  - word: discreto
    ru: сдержанный, осторожный
    ipa: /disˈkɾeto/
    say: дискрэ́то
    meaning: "Сдержанный, тактичный, умеющий хранить секреты; неброский (о цвете, одежде)."
    examples:
      - "Mi hermano es muy discreto y no habla. — Мой брат очень сдержан и не болтает."
      - "Llevaba un abrigo discreto, gris y sin adornos, para no llamar la atención. — На нём было неброское серое пальто без украшений, чтобы не привлекать внимания."
      - "Es muy discreto, así que puedes contarle lo que quieras: no se lo dirá a nadie. — Он очень сдержан, так что можешь рассказывать ему что хочешь: он никому не скажет."
    origin: "Лат. discretus «отделённый, различающий» от discernere «различать»: умеющий различать, что можно говорить."
    register: "Нейтральное."
    synonyms:
      - word: reservado
        pair: ["Es una persona discreta.", "Es una persona reservada."]
        diff:
          - "reservado — замкнутый, мало говорит о себе"
          - "discreto — тактичный, не разбалтывает чужое"
    analogs:
      - "discreet — сдержанный, тактичный"
      - "low-key — неброский"
    dialogue:
      - "Lucía: ¿Le cuento el secreto a Marta? | Рассказать секрет Марте?"
      - "Marcos: Sí, es muy discreta. Es una tumba. | Да, она очень сдержанная. Как могила."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "ser discreto — быть сдержанным"
      - "un color discreto — неброский цвет"
      - "con discreción — тактично"
    collocation_example: "Actuó con mucha discreción. — Он действовал очень тактично."
    trap: "Это не «дискретный» в математике. Обычно — «тактичный, неболтливый»."

  - word: amenazante
    ru: угрожающий
    ipa: /amenaˈθante/
    say: амэнаса́нтэ
    pron: "z в Испании — [θ]."
    meaning: "Угрожающий, грозный. Одна форма для обоих родов."
    examples:
      - "Tenía una voz amenazante y fría. — У него был угрожающий и холодный голос."
      - "Me miró con una cara amenazante, y entendí que era mejor no seguir discutiendo. — Он посмотрел на меня с угрожающим лицом, и я понял, что лучше не продолжать спор."
      - "El cielo estaba gris y amenazante, y todos sabían que iba a caer una gran tormenta. — Небо было серым и грозным, и все знали, что скоро разразится сильная гроза."
    origin: "От amenazar «угрожать», amenaza «угроза»."
    register: "Нейтральное."
    synonyms:
      - word: intimidante
        pair: ["Tiene una voz amenazante.", "Tiene una voz intimidante."]
        diff:
          - "intimidante — пугающий, давящий, без прямой угрозы"
    analogs:
      - "threatening — угрожающий"
      - "menacing — зловещий"
    dialogue:
      - "Inspectora: ¿El remitente de la carta? | Отправитель письма?"
      - "Testigo: Desconocido. Pero el mensaje era amenazante. | Неизвестен. Но сообщение было угрожающим."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "un tono amenazante — угрожающий тон"
      - "una carta amenazante — письмо с угрозами"
      - "amenazar a alguien — угрожать кому-то"
    collocation_example: "Me habló en un tono amenazante. — Он говорил со мной угрожающим тоном."
    trap: "Одна форма: tono amenazante, mirada amenazante. «Угрожать» — amenazar **a** alguien, с a."

  - word: macabro
    ru: мрачный, жуткий
    ipa: /maˈkaβɾo/
    say: мака́бро
    pron: "b между гласными мягкое [β]."
    meaning: "Жуткий, связанный со смертью; мрачный до ужаса."
    examples:
      - "Contó una historia macabra de fantasmas. — Он рассказал жуткую историю о призраках."
      - "Tiene un sentido del humor macabro y le encanta contar chistes sobre cementerios. — У него мрачное чувство юмора, и он любит рассказывать шутки про кладбища."
      - "Fue un crimen macabro, y los vecinos todavía no se atreven a hablar de él. — Это было жуткое преступление, и соседи до сих пор не решаются о нём говорить."
    origin: "Из французского danse macabre «пляска смерти» — средневековый сюжет о том, что смерть уравнивает всех."
    register: "Нейтральное, частое в новостях и детективах."
    synonyms:
      - word: siniestro
        pair: ["Un lugar macabro.", "Un lugar siniestro."]
        diff:
          - "siniestro — зловещий, недобрый"
          - "macabro — связанный со смертью"
    analogs:
      - "macabre — жуткий"
      - "gruesome — ужасающий"
    dialogue:
      - "Lucía: ¿Viste las fotos del crimen? | Ты видел фото преступления?"
      - "Marcos: Sí. Es todo muy macabro. Me dio escalofríos. | Да. Всё очень жутко. Меня аж передёрнуло."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "un hallazgo macabro — жуткая находка"
      - "humor macabro — мрачный юмор"
      - "un crimen macabro — жуткое преступление"
    collocation_example: "La policía hizo un hallazgo macabro. — Полиция сделала жуткую находку."
    trap: "Ударение на ca: macabro. Это не просто «грустный» (triste), а именно жуткий."

  - word: repentino
    ru: внезапный
    ipa: /repenˈtino/
    say: рэпэнти́но
    pron: "r в начале — раскатистое."
    meaning: "Внезапный, неожиданный."
    examples:
      - "Hubo un cambio repentino en el clima. — Произошла внезапная перемена погоды."
      - "Nadie en la oficina entendió el motivo del cambio repentino de actitud que tuvo. — Никто в офисе не понял причины его внезапной перемены отношения."
      - "Fue una muerte repentina, y la familia no tuvo tiempo ni de despedirse de él. — Это была внезапная смерть, и у семьи не было времени даже попрощаться с ним."
    origin: "Лат. repentinus, от repente «вдруг». Родственное: de repente «вдруг»."
    register: "Нейтральное."
    synonyms:
      - word: súbito
        pair: ["Un dolor repentino.", "Un dolor súbito."]
        diff:
          - "súbito — книжнее"
    analogs:
      - "sudden — внезапный"
    dialogue:
      - "Ana: ¿Cómo falleció? | Как он скончался?"
      - "Pablo: De forma repentina. Por eso hicieron la autopsia. | Внезапно. Поэтому сделали вскрытие."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "muerte repentina — внезапная смерть"
      - "un cambio repentino — внезапная перемена"
      - "de repente — вдруг"
    collocation_example: "De repente se fue la luz. — Вдруг отключился свет."
    trap: "«Вдруг» — de repente, а не repentino. repentino — прилагательное: un ruido repentino."

  - word: prudente
    ru: осторожный, благоразумный
    ipa: /pɾuˈðente/
    say: прудэ́нтэ
    pron: "d между гласными мягкое [ð]."
    meaning: "Осторожный, благоразумный, рассудительный. Одна форма для обоих родов."
    examples:
      - "Sé prudente y no cuentes nada todavía. — Будь осторожен и пока ничего не рассказывай."
      - "No corras con lluvia, que las carreteras resbalan: sé prudente al conducir. — Не гони в дождь, дороги скользкие: будь осторожен за рулём."
      - "Fue prudente al no contar nada a la prensa hasta tener todos los datos en la mano. — Он поступил благоразумно, ничего не рассказав прессе, пока не получил все данные."
    origin: "Лат. prudens «предусмотрительный». Родственное: prudencia «благоразумие»."
    register: "Нейтральное."
    synonyms:
      - word: cuidadoso
        pair: ["Es muy prudente.", "Es muy cuidadoso."]
        diff:
          - "cuidadoso — аккуратный, внимательный к деталям"
          - "prudente — думает о последствиях"
    analogs:
      - "prudent / sensible — благоразумный"
      - "careful — осторожный"
    dialogue:
      - "Lucía: ¿Denunciamos ya? | Заявляем уже?"
      - "Marcos: No. Lo más prudente es buscar más pruebas. | Нет. Самое разумное — поискать ещё доказательства."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "lo más prudente — самое разумное"
      - "una distancia prudente — безопасное расстояние"
      - "con prudencia — осторожно"
    collocation_example: "Mantén una distancia prudente. — Держи безопасную дистанцию."
    trap: "Это не «прудный» и не «педантичный»: prudente — благоразумный. Одна форма: ella es prudente."

  - word: soberbio
    ru: высокомерный, надменный
    ipa: /soˈβeɾβjo/
    say: собэ́рбьо
    pron: "b после о и после r мягкое [β]."
    meaning: "Высокомерный, надменный; второе значение — великолепный (una vista soberbia)."
    examples:
      - "No seas soberbio y pide perdón. — Не будь высокомерным и попроси прощения."
      - "El consejo de los que más sabían del tema lo rechazó con aire soberbio. — Совет тех, кто лучше всех разбирался в теме, он отверг с надменным видом."
      - "Desde aquí hay una vista soberbia de todo el valle y de las montañas del fondo. — Отсюда открывается великолепный вид на всю долину и на горы вдали."
    origin: "Лат. superbus «гордый», от super «над». Родственное: soberbia «гордыня» — один из семи смертных грехов."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: arrogante
        pair: ["Es muy soberbio.", "Es muy arrogante."]
        diff:
          - "arrogante — обычнее в разговоре"
          - "soberbio — книжнее, «гордыня»"
    analogs:
      - "arrogant / haughty — надменный"
      - "superb — великолепный"
    dialogue:
      - "Ana: El nuevo jefe desprecia a todos. | Новый начальник всех презирает."
      - "Pablo: Sí, es muy soberbio. | Да, он очень надменный."
    cefr: "C1."
    frequency: "Средняя в книгах."
    collocations:
      - "una actitud soberbia — высокомерное поведение"
      - "una vista soberbia — великолепный вид"
      - "la soberbia — гордыня"
    collocation_example: "La soberbia es su peor defecto. — Гордыня — его худший недостаток."
    trap: "Два значения: о человеке — «надменный», о вещи — «великолепный». Не путайте с sobrio «трезвый, умеренный»."

  - word: tacaño
    ru: жадный, скупой
    ipa: /taˈkaɲo/
    say: така́ньо
    pron: "ñ — «нь»."
    meaning: "Скупой, жадный на деньги."
    examples:
      - "Es tan tacaño que nunca invita. — Он такой жадный, что никогда не угощает."
      - "Compra ya las entradas para toda la familia, ¡y no seas tacaña! — Купи наконец билеты для всей семьи и не будь скупой!"
      - "Mi tío era tan tacaño que apagaba la luz cada vez que alguien salía de una habitación. — Мой дядя был таким скупым, что выключал свет каждый раз, когда кто-то выходил из комнаты."
    origin: "Возможно, от tacaño в старом значении «подлый, мошенник». Родственное: tacañería «скупость»."
    register: "Разговорное и нейтральное."
    synonyms:
      - word: avaro
        pair: ["Es muy tacaño.", "Es muy avaro."]
        diff:
          - "avaro — книжнее, «скупец», копит ради денег"
          - "tacaño — бытовое, жалеет потратить"
    analogs:
      - "stingy / mean — жадный"
      - "tight-fisted — скупой"
    dialogue:
      - "Lucía: Tiene una fortuna y nunca paga el café. | У него целое состояние, а он никогда не платит за кофе."
      - "Marcos: Es un tacaño. | Он скупердяй."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ser tacaño — быть жадным"
      - "un tacaño — скупердяй"
      - "no seas tacaño — не жадничай"
    collocation_example: "No seas tacaño y paga tú. — Не жадничай, заплати ты."
    trap: "Только о деньгах. «Жадный до еды» — glotón. «Ты жадный» — Eres tacaño, с ser."

  - word: resentido
    ru: обиженный
    ipa: /resenˈtiðo/
    say: рэсэнти́до
    pron: "r в начале — раскатистое, d между гласными мягкое [ð]."
    meaning: "Обиженный, затаивший злость. Как существительное — un resentido, «обиженный на весь мир»."
    examples:
      - "Está resentido porque no lo invitaron. — Он обижен, потому что его не пригласили."
      - "Por no haberle ayudado cuando más lo necesitaba, está resentido con su familia. — Из-за того что ему не помогли, когда он больше всего в этом нуждался, он обижен на семью."
      - "Es un resentido, siempre se queja de la gente que ha tenido más suerte que él. — Он человек, обиженный на весь мир: вечно жалуется на тех, кому повезло больше."
    origin: "Причастие от resentirse «обидеться». Родственное: resentimiento."
    register: "Нейтральное."
    synonyms:
      - word: dolido
        pair: ["Está resentido.", "Está dolido."]
        diff:
          - "dolido — задетый, сейчас больно"
          - "resentido — обида затаилась надолго"
    analogs:
      - "resentful — обиженный"
      - "bitter — озлобленный"
    dialogue:
      - "Ana: ¿Por qué no habla con su hermano? | Почему он не разговаривает с братом?"
      - "Pablo: Está resentido por la herencia. | Он обижен из-за наследства."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar resentido con alguien — быть в обиде на кого-то"
      - "un resentido social — обиженный на общество"
      - "resentirse de algo — пострадать от чего-то"
    collocation_example: "Está resentido con todo el mundo. — Он обижен на весь мир."
    trap: "На кого — con: resentido **con** alguien. Не путайте с sentido «смысл»."

  - word: receloso
    ru: настороженный, недоверчивый
    ipa: /reθeˈloso/
    say: рэсэло́со
    pron: "r в начале — раскатистое, c перед e — [θ]."
    meaning: "Настороженный, подозрительный к кому-то или чему-то."
    examples:
      - "Está receloso de los nuevos vecinos. — Он настороженно относится к новым соседям."
      - "Nadie me explica por qué cambiaron las condiciones del contrato, y estoy receloso. — Никто не объясняет мне, почему изменили условия договора, и я настороженно к этому отношусь."
      - "Los clientes son recelosos con las ofertas que llegan por teléfono de números desconocidos. — Клиенты с недоверием относятся к предложениям, которые поступают по телефону с незнакомых номеров."
    origin: "От recelo «подозрение, опасение»; recelar — «опасаться»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: suspicaz
        pair: ["Es muy receloso.", "Es muy suspicaz."]
        diff:
          - "suspicaz — склонный всех подозревать"
    analogs:
      - "wary — настороженный"
      - "suspicious — подозрительный"
    dialogue:
      - "Inspectora: El testigo parece receloso. | Свидетель кажется настороженным."
      - "Marcos: Normal. Tiene miedo del asesino. | Ещё бы. Он боится убийцы."
    cefr: "C1."
    frequency: "Средняя в книгах."
    collocations:
      - "estar receloso de algo — опасаться чего-то"
      - "una mirada recelosa — настороженный взгляд"
      - "sentir recelo — испытывать опасение"
    collocation_example: "Siento cierto recelo. — Я испытываю некоторое опасение."
    trap: "Ударение на lo: receloso. Это настороженность, а не «ревнивый» (celoso), хотя слова похожи."

  - word: desconfiado
    ru: недоверчивый
    ipa: /deskomˈfjaðo/
    say: дэскомфья́до
    pron: "n перед f почти как [m], d в -ado мягкое и почти пропадает."
    meaning: "Недоверчивый — по характеру никому не доверяет."
    examples:
      - "Es una persona muy desconfiada. — Это очень недоверчивый человек."
      - "Desde que lo estafaron una vez, se ha vuelto desconfiado con cualquier desconocido. — С тех пор как его однажды обманули, он стал недоверчив к любому незнакомцу."
      - "No seas tan desconfiado, que aquí todos somos amigos y nadie va a engañarte. — Не будь таким недоверчивым: здесь мы все друзья, и никто тебя не обманет."
    origin: "От desconfiar «не доверять»: des- + confiar."
    register: "Нейтральное."
    synonyms:
      - word: receloso
        pair: ["Es desconfiado.", "Es receloso."]
        diff:
          - "receloso — насторожен к конкретному"
          - "desconfiado — вообще по характеру"
    analogs:
      - "distrustful — недоверчивый"
    dialogue:
      - "Lucía: ¿Por qué no me dejas tu contraseña? | Почему ты не даёшь мне свой пароль?"
      - "Marcos: Soy desconfiado, lo siento. | Я недоверчивый, прости."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "ser desconfiado — быть недоверчивым"
      - "mirar con desconfianza — смотреть с недоверием"
      - "desconfiar de todo — никому не верить"
    collocation_example: "Me miró con desconfianza. — Он посмотрел на меня с недоверием."
    trap: "С ser — черта характера: es desconfiado. Не путайте с confiado «доверчивый, беспечный»."

  - word: desilusionado
    ru: разочарованный
    ipa: /desilusjoˈnaðo/
    say: дэсилусьона́до
    meaning: "Разочарованный, потерявший надежды."
    examples:
      - "Quedó desilusionado con la nota final. — Он разочаровался в итоговой оценке."
      - "Esperaba mucho más después de tanto esfuerzo, y estoy desilusionado con el resultado. — Я ждал гораздо большего после стольких усилий и разочарован результатом."
      - "Volvió del viaje desilusionado: el hotel no era como en las fotos de internet. — Он вернулся из поездки разочарованным: отель оказался не таким, как на фотографиях в интернете."
    origin: "des- + ilusión «надежда, мечта»: «лишённый надежд». Родственное: desilusión «разочарование»."
    register: "Нейтральное."
    synonyms:
      - word: decepcionado
        pair: ["Estoy desilusionado.", "Estoy decepcionado."]
        diff:
          - "decepcionado — чаще в разговоре, почти то же"
    analogs:
      - "disappointed — разочарованный"
      - "disillusioned — потерявший иллюзии"
    dialogue:
      - "Ana: ¿Qué tal la entrevista? | Как собеседование?"
      - "Pablo: Mal. Estoy desilusionado, el sueldo es bajísimo. | Плохо. Я разочарован, зарплата очень низкая."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "estar desilusionado con algo — быть разочарованным чем-то"
      - "llevarse una desilusión — разочароваться"
      - "sentirse desilusionado — чувствовать разочарование"
    collocation_example: "Me llevé una gran desilusión. — Я сильно разочаровался."
    trap: "ilusión по-испански — «радость, надежда», а не «иллюзия»: me hace ilusión — «я так жду этого». Поэтому desilusión — разочарование."

  - word: rechazado
    ru: отвергнутый
    ipa: /retʃaˈθaðo/
    say: рэчаса́до
    pron: "r в начале — раскатистое, ch — «ч», z — [θ]."
    meaning: "Отвергнутый, отклонённый — о человеке или о предложении."
    examples:
      - "Se siente rechazado por sus amigos. — Он чувствует себя отвергнутым друзьями."
      - "Con las razones de la decisión, recibieron una carta los candidatos rechazados. — Письмо с причинами решения получили отклонённые кандидаты."
      - "Su propuesta fue rechazada por la mayoría, aunque la había preparado con mucho cuidado. — Его предложение отклонило большинство, хотя он готовил его очень тщательно."
    origin: "Причастие от rechazar «отвергать», из старофранцузского «отбрасывать». Родственное: rechazo «отказ»."
    register: "Нейтральное."
    synonyms:
      - word: excluido
        pair: ["Se siente rechazado.", "Se siente excluido."]
        diff:
          - "excluido — исключённый, не принятый в группу"
    analogs:
      - "rejected — отвергнутый"
    dialogue:
      - "Lucía: ¿Por qué está tan triste? | Почему он такой грустный?"
      - "Marcos: Se siente rechazado. Ella no quiso salir con él. | Чувствует себя отвергнутым. Она не захотела с ним встречаться."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "sentirse rechazado — чувствовать себя отвергнутым"
      - "rechazar una oferta — отклонить предложение"
      - "el rechazo — отказ"
    collocation_example: "Rechazó la oferta de trabajo. — Он отклонил предложение о работе."
    trap: "Пишется с z: rechazado, rechazar. Отклонить «звонок» — rechazar la llamada, тоже этим словом."

  - word: molesto
    ru: недовольный, раздражённый
    ipa: /moˈlesto/
    say: молэ́сто
    meaning: "С estar — недовольный, раздосадованный; с ser — надоедливый, неудобный."
    examples:
      - "El calor es muy molesto hoy. — Жара сегодня очень неприятна."
      - "Me molesta que la gente hable por teléfono en voz alta dentro del tren. — Меня раздражает, когда люди громко разговаривают по телефону в поезде."
      - "Este ruido de las obras es muy molesto, sobre todo cuando intento trabajar en casa. — Этот шум от стройки очень раздражает, особенно когда я пытаюсь работать дома."
    origin: "Лат. molestus «тягостный». Родственные: molestar «мешать, беспокоить», molestia «неудобство»."
    register: "Нейтральное, вежливее, чем enfadado."
    synonyms:
      - word: enfadado
        pair: ["Está molesto.", "Está enfadado."]
        diff:
          - "enfadado — сердитый, сильнее"
          - "molesto — слегка раздражён, недоволен"
    analogs:
      - "annoyed / upset — раздражённый"
      - "annoying — надоедливый"
    dialogue:
      - "Ana: ¿Estás molesto por lo de ayer? | Ты недоволен из-за вчерашнего?"
      - "Pablo: Un poco. Sinceramente, me dolió. | Немного. Честно говоря, мне было больно."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "estar molesto con alguien — сердиться на кого-то"
      - "ser molesto — быть надоедливым"
      - "perdón por la molestia — простите за беспокойство"
    collocation_example: "Perdone la molestia. — Простите за беспокойство."
    trap: "Не путайте с «молестировать»: molestar — просто «мешать, беспокоить». ¿Te molesta? — «Тебе мешает?»."

  - word: incómodo
    ru: неловкий, неудобный
    ipa: /iŋˈkomoðo/
    say: инко́модо
    pron: "Ударение на co (есть тильда). n перед c — носовое [ŋ]."
    meaning: "Неудобный (стул, обувь); неловкий (ситуация, молчание); чувствующий себя не в своей тарелке."
    examples:
      - "Esta cama es muy incómoda para dormir. — Эта кровать очень неудобна для сна."
      - "Me siento incómodo aquí, porque no conozco a nadie y todos me miran. — Мне здесь неловко, потому что я никого не знаю, и все на меня смотрят."
      - "Esta silla es muy incómoda, y después de una hora tengo dolor de espalda. — Этот стул очень неудобный, и через час у меня болит спина."
    origin: "in- «не» + cómodo «удобный» (лат. commodus). Родственное: incomodidad."
    register: "Нейтральное."
    synonyms:
      - word: violento
        pair: ["Fue un momento incómodo.", "Fue un momento violento."]
        diff:
          - "violento в Испании — ещё и «неловкий» о ситуации, разговорно"
    analogs:
      - "uncomfortable — неудобный"
      - "awkward — неловкий"
    dialogue:
      - "Lucía: Hubo un silencio incómodo. | Повисло неловкое молчание."
      - "Marcos: Sí, nadie se atrevía a hablar. | Да, никто не решался заговорить."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "un silencio incómodo — неловкое молчание"
      - "sentirse incómodo — чувствовать себя неловко"
      - "una situación incómoda — неловкая ситуация"
    collocation_example: "Fue una situación muy incómoda. — Это была очень неловкая ситуация."
    trap: "Ударение и тильда: incómodo. Ситуация — es incómoda, человек — está incómodo."

  - word: pensativo
    ru: задумчивый
    ipa: /pensaˈtiβo/
    say: пэнсати́во
    pron: "v между гласными мягкое [β]."
    meaning: "Задумчивый, погружённый в мысли."
    examples:
      - "Te veo pensativo, ¿te pasa algo? — Ты выглядишь задумчивым, у тебя что-то случилось?"
      - "Mirando por la ventana, antes de contestar se quedó un momento pensativa. — Глядя в окно, она на мгновение задумалась, прежде чем ответить."
      - "Salió de la reunión pensativo, con la sensación de que algo no iba bien. — Он вышел из собрания задумчивым, с ощущением, что что-то идёт не так."
    origin: "От pensar «думать»."
    register: "Нейтральное."
    synonyms:
      - word: absorto
        pair: ["Estaba pensativo.", "Estaba absorto."]
        diff:
          - "absorto — полностью поглощённый мыслями, не слышит"
    analogs:
      - "thoughtful / pensive — задумчивый"
    dialogue:
      - "Ana: ¿En qué piensas? Estás muy pensativo. | О чём думаешь? Ты такой задумчивый."
      - "Pablo: Estoy reflexionando sobre el despido. | Размышляю об увольнении."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "quedarse pensativo — задуматься"
      - "estar pensativo — быть задумчивым"
      - "una mirada pensativa — задумчивый взгляд"
    collocation_example: "Se quedó pensativo un momento. — Он на минуту задумался."
    trap: "С estar: está pensativo (сейчас). «Задуматься» — quedarse pensativo."

  - word: distraído
    ru: рассеянный
    ipa: /distɾaˈi.ðo/
    say: дистраи́до
    pron: "Ударение на í, ai — два слога: dis-tra-í-do."
    meaning: "Рассеянный, отвлёкшийся. С ser — рассеянный по характеру, с estar — отвлёкся сейчас."
    examples:
      - "Es tan distraído que olvida su paraguas. — Он такой рассеянный, что забывает зонт."
      - "No me he enterado de lo que decías: perdona, estaba distraído. — Я не расслышал, что ты говорил: прости, я отвлёкся."
      - "Es muy distraído, siempre pierde las llaves y se olvida de dónde ha dejado el móvil. — Он очень рассеянный, вечно теряет ключи и забывает, где оставил телефон."
    origin: "Причастие от distraer «отвлекать» (лат. distrahere «растаскивать»)."
    register: "Нейтральное."
    synonyms:
      - word: despistado
        pair: ["Soy muy distraído.", "Soy muy despistado."]
        diff:
          - "despistado — разговорное испанское «растеряша»"
    analogs:
      - "absent-minded — рассеянный"
      - "distracted — отвлёкшийся"
    dialogue:
      - "Lucía: ¿Me estás prestando atención? | Ты меня слушаешь?"
      - "Marcos: Perdona, estaba distraído. | Прости, отвлёкся."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "estar distraído — отвлечься"
      - "ser distraído — быть рассеянным"
      - "distraerse con algo — отвлекаться на что-то"
    collocation_example: "Me distraigo con el móvil. — Я отвлекаюсь на телефон."
    trap: "Ударение на í: distraído. Не путайте с «дистрофик»: это просто «отвлёкшийся»."

  - word: ausente
    ru: отстранённый
    ipa: /awˈsente/
    say: аусэ́нтэ
    pron: "au — один слог «ау»."
    meaning: "Отсутствующий; в переносном смысле — отстранённый, витающий в облаках."
    examples:
      - "Mi madre estaba ausente y pensativa. — Моя мать была отстранённой и задумчивой."
      - "Hoy estás muy ausente, ¿en qué estás pensando que no me escuchas? — Сегодня ты как будто отсутствуешь: о чём ты думаешь, что не слушаешь меня?"
      - "Tenía una mirada ausente, como si estuviera en otro lugar muy lejos de allí. — У него был отсутствующий взгляд, словно он был где-то далеко отсюда."
    origin: "Лат. absens «отсутствующий». Родственное: ausencia «отсутствие»."
    register: "Нейтральное."
    synonyms:
      - word: distraído
        pair: ["Estaba ausente.", "Estaba distraído."]
        diff:
          - "distraído — на минуту отвлёкся"
          - "ausente — мыслями где-то далеко, отрешённый"
    analogs:
      - "absent — отсутствующий"
      - "distant / absent-minded — отстранённый"
    dialogue:
      - "Ana: Desde el entierro está muy ausente. | После похорон он очень отрешённый."
      - "Pablo: Es normal. Está de luto. | Это нормально. Он в трауре."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "mirada ausente — отсутствующий взгляд"
      - "estar ausente — отсутствовать"
      - "en ausencia de — в отсутствие"
    collocation_example: "Tenía la mirada ausente. — У него был отсутствующий взгляд."
    trap: "Два смысла: физически нет (está ausente) и мыслями далеко. Одна форма: ella está ausente."

  - word: extrañado
    ru: озадаченный
    ipa: /ekstɾaˈɲaðo/
    say: экстранья́до
    pron: "x — «кс», ñ — «нь»."
    meaning: "Удивлённый, озадаченный чем-то странным."
    examples:
      - "Estoy extrañado de que no haya llamado. — Странно, что он не позвонил."
      - "Cuando le pregunté por la reunión que había cancelado, me miró extrañado. — Когда я спросил про отменённую им встречу, он посмотрел на меня озадаченно."
      - "Se quedó extrañada al ver la puerta abierta y todas las luces encendidas. — Она удивилась, увидев открытую дверь и включённый везде свет."
    origin: "От extraño «странный» (лат. extraneus «чужой»). Родственное: extrañar «удивлять; скучать»."
