      - word: loco
        pair: ["Está enloquecido.", "Está loco."]
        diff:
          - "loco — сумасшедший вообще"
          - "enloquecido — обезумел от чего-то сейчас"
    analogs:
      - "crazed / maddened — обезумевший"
    dialogue:
      - "Inspectora: ¿Cómo estaba el viudo? | Каким был вдовец?"
      - "Testigo: Enloquecido. Gritaba y lloraba. | Обезумевшим. Кричал и плакал."
