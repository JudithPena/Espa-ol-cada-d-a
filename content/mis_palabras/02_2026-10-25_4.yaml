      - "puzzled — озадаченный"
      - "surprised — удивлённый"
    dialogue:
      - "Lucía: ¿Por qué me miras tan extrañado? | Почему ты смотришь так озадаченно?"
      - "Marcos: Porque estás irreconocible con ese pelo. | Потому что ты неузнаваема с этой причёской."
