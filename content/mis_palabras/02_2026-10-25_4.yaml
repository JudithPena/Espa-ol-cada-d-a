    ipa: /moˈlesto/
    say: молэ́сто
    meaning: "С estar — недовольный, раздосадованный; с ser — надоедливый, неудобный."
    examples:
      - "Está molesto conmigo. — Он на меня сердится."
      - "Me molesta que la gente hable por teléfono en voz alta dentro del tren. — Меня раздражает, когда люди громко разговаривают по телефону в поезде."
      - "Este ruido de las obras es muy molesto, sobre todo cuando intento trabajar en casa. — Этот шум от стройки очень раздражает, особенно когда я пытаюсь работать дома."
    origin: "Лат. molestus «тягостный». Родственные: molestar «мешать, беспокоить», molestia «неудобство»."
    register: "Нейтральное, вежливее, чем enfadado."
    synonyms:
      - word: enfadado
        pair: ["Está molesto.", "Está enfadado."]
        diff:
          - "enfadado — сердитый, сильнее"
          - "molesto — слегка раздражён, недоволен"
    analogs:
      - "annoyed / upset — раздражённый"
      - "annoying — надоедливый"
    dialogue:
      - "Ana: ¿Estás molesto por lo de ayer? | Ты недоволен из-за вчерашнего?"
