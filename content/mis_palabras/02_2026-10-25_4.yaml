    frequency: "Частое в новостях."
    collocations:
      - "resultar herido — получить ранение"
      - "herido grave — тяжелораненый"
      - "orgullo herido — уязвлённая гордость"
    collocation_example: "Tres personas resultaron heridas. — Три человека получили ранения."
    trap: "h не читается. В новостях — resultar herido, а не ser herido."

  - word: profundo
