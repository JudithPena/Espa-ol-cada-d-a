# Второй список автора, часть 4 — прилагательные.
lang: es
words:
  - word: alborotado
    ru: взволнованный, переполошенный
    ipa: /alβoɾoˈtaðo/
    say: альборота́до
    pron: "b после l мягкое [β], d в -ado почти пропадает: «альборота́о»."
    meaning: "Взволнованный, шумный, взбудораженный; о волосах — растрёпанный. Согласуется: alborotada, alborotados."
    examples:
      - "Los niños están muy alborotados hoy. — Дети сегодня очень разошлись."
      - "Llevas el pelo alborotado. — У тебя растрёпаны волосы."
    origin: "Причастие от alborotar «будоражить», от alboroto «шум, суматоха»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: agitado
        pair: ["El público está alborotado.", "El público está agitado."]
        diff:
          - "agitado — взволнованный, неспокойный, без шума"
    analogs:
      - "excited / rowdy — взбудораженный, шумный"
      - "messy (hair) — растрёпанный"
    dialogue:
      - "Lucía: ¿Por qué está todo el mundo tan alborotado? | Почему все так взбудоражены?"
      - "Marcos: Han encontrado una pista. | Нашли зацепку."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar alborotado — быть взбудораженным"
      - "pelo alborotado — растрёпанные волосы"
      - "un barrio alborotado — шумный район"
    collocation_example: "Se levantó con el pelo alborotado. — Он встал с растрёпанными волосами."
    trap: "С estar, а не ser: está alborotado (состояние). Глагол — alborotarse."

  - word: torpe
    ru: неуклюжий
    ipa: /ˈtoɾpe/
    say: то́рпэ
    meaning: "Неуклюжий, неловкий; ещё — несообразительный, бестолковый. Одна форма для обоих родов."
    examples:
      - "Soy muy torpe, siempre rompo algo. — Я очень неуклюжий, всегда что-то разбиваю."
      - "¡Qué torpe soy! — Какой я растяпа!"
    origin: "Лат. turpis «уродливый, постыдный». Родственное: torpeza «неуклюжесть»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: patoso
        pair: ["Es muy torpe.", "Es muy patoso."]
        diff:
          - "patoso — разговорное испанское «растяпа», только о движениях"
    analogs:
      - "clumsy — неуклюжий"
      - "awkward — неловкий"
    dialogue:
      - "Ana: ¡Ay! Se me ha caído el café. | Ой! Я уронила кофе."
      - "Pablo: No pasa nada. Yo soy más torpe que tú. | Ничего страшного. Я ещё неуклюжее тебя."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ser torpe — быть неуклюжим"
      - "torpe con las manos — неловкий руками"
      - "un movimiento torpe — неловкое движение"
    collocation_example: "Soy torpe con las manos. — У меня руки не из того места."
    trap: "Одна форма: él es torpe, ella es torpe. С ser — черта характера, с estar — сейчас неловкий: hoy estoy torpe."

  - word: discreto
    ru: сдержанный, осторожный
    ipa: /disˈkɾeto/
    say: дискрэ́то
    meaning: "Сдержанный, тактичный, умеющий хранить секреты; неброский (о цвете, одежде)."
    examples:
      - "Es muy discreto, no le cuenta nada a nadie. — Он очень сдержанный, никому ничего не рассказывает."
      - "Llevaba un vestido discreto. — На ней было скромное платье."
    origin: "Лат. discretus «отделённый, различающий» от discernere «различать»: умеющий различать, что можно говорить."
    register: "Нейтральное."
    synonyms:
      - word: reservado
        pair: ["Es una persona discreta.", "Es una persona reservada."]
        diff:
          - "reservado — замкнутый, мало говорит о себе"
          - "discreto — тактичный, не разбалтывает чужое"
    analogs:
      - "discreet — сдержанный, тактичный"
      - "low-key — неброский"
    dialogue:
      - "Lucía: ¿Le cuento el secreto a Marta? | Рассказать секрет Марте?"
      - "Marcos: Sí, es muy discreta. Es una tumba. | Да, она очень сдержанная. Как могила."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "ser discreto — быть сдержанным"
      - "un color discreto — неброский цвет"
      - "con discreción — тактично"
    collocation_example: "Actuó con mucha discreción. — Он действовал очень тактично."
    trap: "Это не «дискретный» в математике. Обычно — «тактичный, неболтливый»."

  - word: amenazante
    ru: угрожающий
    ipa: /amenaˈθante/
    say: амэнаса́нтэ
    pron: "z в Испании — [θ]."
    meaning: "Угрожающий, грозный. Одна форма для обоих родов."
    examples:
      - "Me miró con una cara amenazante. — Он посмотрел на меня с угрожающим видом."
      - "Recibió una carta amenazante. — Он получил письмо с угрозами."
    origin: "От amenazar «угрожать», amenaza «угроза»."
    register: "Нейтральное."
    synonyms:
      - word: intimidante
        pair: ["Tiene una voz amenazante.", "Tiene una voz intimidante."]
        diff:
          - "intimidante — пугающий, давящий, без прямой угрозы"
    analogs:
      - "threatening — угрожающий"
      - "menacing — зловещий"
    dialogue:
      - "Inspectora: ¿El remitente de la carta? | Отправитель письма?"
      - "Testigo: Desconocido. Pero el mensaje era amenazante. | Неизвестен. Но сообщение было угрожающим."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "un tono amenazante — угрожающий тон"
      - "una carta amenazante — письмо с угрозами"
      - "amenazar a alguien — угрожать кому-то"
    collocation_example: "Me habló en un tono amenazante. — Он говорил со мной угрожающим тоном."
    trap: "Одна форма: tono amenazante, mirada amenazante. «Угрожать» — amenazar **a** alguien, с a."

  - word: macabro
    ru: мрачный, жуткий
    ipa: /maˈkaβɾo/
    say: мака́бро
    pron: "b между гласными мягкое [β]."
    meaning: "Жуткий, связанный со смертью; мрачный до ужаса."
    examples:
      - "Fue un crimen macabro. — Это было жуткое преступление."
      - "Tiene un sentido del humor macabro. — У него мрачное чувство юмора."
    origin: "Из французского danse macabre «пляска смерти» — средневековый сюжет о том, что смерть уравнивает всех."
    register: "Нейтральное, частое в новостях и детективах."
    synonyms:
      - word: siniestro
        pair: ["Un lugar macabro.", "Un lugar siniestro."]
        diff:
          - "siniestro — зловещий, недобрый"
          - "macabro — связанный со смертью"
    analogs:
      - "macabre — жуткий"
      - "gruesome — ужасающий"
    dialogue:
      - "Lucía: ¿Viste las fotos del crimen? | Ты видел фото преступления?"
      - "Marcos: Sí. Es todo muy macabro. Me dio escalofríos. | Да. Всё очень жутко. Меня аж передёрнуло."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "un hallazgo macabro — жуткая находка"
      - "humor macabro — мрачный юмор"
      - "un crimen macabro — жуткое преступление"
    collocation_example: "La policía hizo un hallazgo macabro. — Полиция сделала жуткую находку."
    trap: "Ударение на ca: macabro. Это не просто «грустный» (triste), а именно жуткий."

  - word: repentino
    ru: внезапный
    ipa: /repenˈtino/
    say: рэпэнти́но
    pron: "r в начале — раскатистое."
    meaning: "Внезапный, неожиданный."
    examples:
      - "Fue una muerte repentina. — Это была внезапная смерть."
      - "Tuvo un cambio repentino de actitud. — У него внезапно изменилось отношение."
    origin: "Лат. repentinus, от repente «вдруг». Родственное: de repente «вдруг»."
    register: "Нейтральное."
    synonyms:
      - word: súbito
        pair: ["Un dolor repentino.", "Un dolor súbito."]
        diff:
          - "súbito — книжнее"
    analogs:
      - "sudden — внезапный"
    dialogue:
      - "Ana: ¿Cómo falleció? | Как он скончался?"
      - "Pablo: De forma repentina. Por eso hicieron la autopsia. | Внезапно. Поэтому сделали вскрытие."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "muerte repentina — внезапная смерть"
      - "un cambio repentino — внезапная перемена"
      - "de repente — вдруг"
    collocation_example: "De repente se fue la luz. — Вдруг отключился свет."
    trap: "«Вдруг» — de repente, а не repentino. repentino — прилагательное: un ruido repentino."

  - word: prudente
    ru: осторожный, благоразумный
    ipa: /pɾuˈðente/
    say: прудэ́нтэ
    pron: "d между гласными мягкое [ð]."
    meaning: "Осторожный, благоразумный, рассудительный. Одна форма для обоих родов."
    examples:
      - "Sé prudente al conducir. — Будь осторожен за рулём."
      - "Lo más prudente es esperar. — Самое разумное — подождать."
    origin: "Лат. prudens «предусмотрительный». Родственное: prudencia «благоразумие»."
    register: "Нейтральное."
    synonyms:
      - word: cuidadoso
        pair: ["Es muy prudente.", "Es muy cuidadoso."]
        diff:
          - "cuidadoso — аккуратный, внимательный к деталям"
          - "prudente — думает о последствиях"
    analogs:
      - "prudent / sensible — благоразумный"
      - "careful — осторожный"
    dialogue:
      - "Lucía: ¿Denunciamos ya? | Заявляем уже?"
      - "Marcos: No. Lo más prudente es buscar más pruebas. | Нет. Самое разумное — поискать ещё доказательства."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "lo más prudente — самое разумное"
      - "una distancia prudente — безопасное расстояние"
      - "con prudencia — осторожно"
    collocation_example: "Mantén una distancia prudente. — Держи безопасную дистанцию."
    trap: "Это не «прудный» и не «педантичный»: prudente — благоразумный. Одна форма: ella es prudente."

  - word: soberbio
    ru: высокомерный, надменный
    ipa: /soˈβeɾβjo/
    say: собэ́рбьо
    pron: "b после о и после r мягкое [β]."
    meaning: "Высокомерный, надменный; второе значение — великолепный (una vista soberbia)."
    examples:
      - "Es tan soberbio que no escucha a nadie. — Он такой высокомерный, что никого не слушает."
      - "Desde aquí hay una vista soberbia. — Отсюда великолепный вид."
    origin: "Лат. superbus «гордый», от super «над». Родственное: soberbia «гордыня» — один из семи смертных грехов."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: arrogante
        pair: ["Es muy soberbio.", "Es muy arrogante."]
        diff:
          - "arrogante — обычнее в разговоре"
          - "soberbio — книжнее, «гордыня»"
    analogs:
      - "arrogant / haughty — надменный"
      - "superb — великолепный"
    dialogue:
      - "Ana: El nuevo jefe desprecia a todos. | Новый начальник всех презирает."
      - "Pablo: Sí, es muy soberbio. | Да, он очень надменный."
    cefr: "C1."
    frequency: "Средняя в книгах."
    collocations:
      - "una actitud soberbia — высокомерное поведение"
      - "una vista soberbia — великолепный вид"
      - "la soberbia — гордыня"
    collocation_example: "La soberbia es su peor defecto. — Гордыня — его худший недостаток."
    trap: "Два значения: о человеке — «надменный», о вещи — «великолепный». Не путайте с sobrio «трезвый, умеренный»."

  - word: tacaño
    ru: жадный, скупой
    ipa: /taˈkaɲo/
    say: така́ньо
    pron: "ñ — «нь»."
    meaning: "Скупой, жадный на деньги."
    examples:
      - "Es tan tacaño que nunca invita. — Он такой жадный, что никогда не угощает."
      - "¡No seas tacaña! — Не жадничай!"
    origin: "Возможно, от tacaño в старом значении «подлый, мошенник». Родственное: tacañería «скупость»."
    register: "Разговорное и нейтральное."
    synonyms:
      - word: avaro
        pair: ["Es muy tacaño.", "Es muy avaro."]
        diff:
          - "avaro — книжнее, «скупец», копит ради денег"
          - "tacaño — бытовое, жалеет потратить"
    analogs:
      - "stingy / mean — жадный"
      - "tight-fisted — скупой"
    dialogue:
      - "Lucía: Tiene una fortuna y nunca paga el café. | У него целое состояние, а он никогда не платит за кофе."
      - "Marcos: Es un tacaño. | Он скупердяй."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "ser tacaño — быть жадным"
      - "un tacaño — скупердяй"
      - "no seas tacaño — не жадничай"
    collocation_example: "No seas tacaño y paga tú. — Не жадничай, заплати ты."
    trap: "Только о деньгах. «Жадный до еды» — glotón. «Ты жадный» — Eres tacaño, с ser."

  - word: resentido
    ru: обиженный
    ipa: /resenˈtiðo/
    say: рэсэнти́до
    pron: "r в начале — раскатистое, d между гласными мягкое [ð]."
    meaning: "Обиженный, затаивший злость. Как существительное — un resentido, «обиженный на весь мир»."
    examples:
      - "Está resentido con su familia. — Он в обиде на семью."
      - "Es un resentido. — Он вечно на всех обижен."
    origin: "Причастие от resentirse «обидеться». Родственное: resentimiento."
    register: "Нейтральное."
    synonyms:
      - word: dolido
        pair: ["Está resentido.", "Está dolido."]
        diff:
          - "dolido — задетый, сейчас больно"
          - "resentido — обида затаилась надолго"
    analogs:
      - "resentful — обиженный"
      - "bitter — озлобленный"
    dialogue:
      - "Ana: ¿Por qué no habla con su hermano? | Почему он не разговаривает с братом?"
      - "Pablo: Está resentido por la herencia. | Он обижен из-за наследства."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar resentido con alguien — быть в обиде на кого-то"
      - "un resentido social — обиженный на общество"
      - "resentirse de algo — пострадать от чего-то"
    collocation_example: "Está resentido con todo el mundo. — Он обижен на весь мир."
    trap: "На кого — con: resentido **con** alguien. Не путайте с sentido «смысл»."

  - word: receloso
    ru: настороженный, недоверчивый
    ipa: /reθeˈloso/
    say: рэсэло́со
    pron: "r в начале — раскатистое, c перед e — [θ]."
    meaning: "Настороженный, подозрительный к кому-то или чему-то."
    examples:
      - "Está receloso de los nuevos vecinos. — Он настороженно относится к новым соседям."
      - "Me miró receloso. — Он посмотрел на меня с подозрением."
    origin: "От recelo «подозрение, опасение»; recelar — «опасаться»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: suspicaz
        pair: ["Es muy receloso.", "Es muy suspicaz."]
        diff:
          - "suspicaz — склонный всех подозревать"
    analogs:
      - "wary — настороженный"
      - "suspicious — подозрительный"
    dialogue:
      - "Inspectora: El testigo parece receloso. | Свидетель кажется настороженным."
      - "Marcos: Normal. Tiene miedo del asesino. | Ещё бы. Он боится убийцы."
    cefr: "C1."
    frequency: "Средняя в книгах."
    collocations:
      - "estar receloso de algo — опасаться чего-то"
      - "una mirada recelosa — настороженный взгляд"
      - "sentir recelo — испытывать опасение"
    collocation_example: "Siento cierto recelo. — Я испытываю некоторое опасение."
    trap: "Ударение на lo: receloso. Это настороженность, а не «ревнивый» (celoso), хотя слова похожи."

  - word: desconfiado
    ru: недоверчивый
    ipa: /deskomˈfjaðo/
    say: дэскомфья́до
    pron: "n перед f почти как [m], d в -ado мягкое и почти пропадает."
    meaning: "Недоверчивый — по характеру никому не доверяет."
    examples:
      - "Es una persona muy desconfiada. — Это очень недоверчивый человек."
      - "No seas tan desconfiado. — Не будь таким недоверчивым."
    origin: "От desconfiar «не доверять»: des- + confiar."
    register: "Нейтральное."
    synonyms:
      - word: receloso
        pair: ["Es desconfiado.", "Es receloso."]
        diff:
          - "receloso — насторожен к конкретному"
          - "desconfiado — вообще по характеру"
    analogs:
      - "distrustful — недоверчивый"
    dialogue:
      - "Lucía: ¿Por qué no me dejas tu contraseña? | Почему ты не даёшь мне свой пароль?"
      - "Marcos: Soy desconfiado, lo siento. | Я недоверчивый, прости."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "ser desconfiado — быть недоверчивым"
      - "mirar con desconfianza — смотреть с недоверием"
      - "desconfiar de todo — никому не верить"
    collocation_example: "Me miró con desconfianza. — Он посмотрел на меня с недоверием."
    trap: "С ser — черта характера: es desconfiado. Не путайте с confiado «доверчивый, беспечный»."

  - word: desilusionado
    ru: разочарованный
    ipa: /desilusjoˈnaðo/
    say: дэсилусьона́до
    meaning: "Разочарованный, потерявший надежды."
    examples:
      - "Estoy desilusionado con el resultado. — Я разочарован результатом."
      - "Volvió del viaje desilusionado. — Он вернулся из поездки разочарованным."
    origin: "des- + ilusión «надежда, мечта»: «лишённый надежд». Родственное: desilusión «разочарование»."
    register: "Нейтральное."
    synonyms:
      - word: decepcionado
        pair: ["Estoy desilusionado.", "Estoy decepcionado."]
        diff:
          - "decepcionado — чаще в разговоре, почти то же"
    analogs:
      - "disappointed — разочарованный"
      - "disillusioned — потерявший иллюзии"
    dialogue:
      - "Ana: ¿Qué tal la entrevista? | Как собеседование?"
      - "Pablo: Mal. Estoy desilusionado, el sueldo es bajísimo. | Плохо. Я разочарован, зарплата очень низкая."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "estar desilusionado con algo — быть разочарованным чем-то"
      - "llevarse una desilusión — разочароваться"
      - "sentirse desilusionado — чувствовать разочарование"
    collocation_example: "Me llevé una gran desilusión. — Я сильно разочаровался."
    trap: "ilusión по-испански — «радость, надежда», а не «иллюзия»: me hace ilusión — «я так жду этого». Поэтому desilusión — разочарование."

  - word: rechazado
    ru: отвергнутый
    ipa: /retʃaˈθaðo/
    say: рэчаса́до
    pron: "r в начале — раскатистое, ch — «ч», z — [θ]."
    meaning: "Отвергнутый, отклонённый — о человеке или о предложении."
    examples:
      - "Se siente rechazado por sus amigos. — Он чувствует себя отвергнутым друзьями."
      - "Su propuesta fue rechazada. — Его предложение отклонили."
    origin: "Причастие от rechazar «отвергать», из старофранцузского «отбрасывать». Родственное: rechazo «отказ»."
    register: "Нейтральное."
    synonyms:
