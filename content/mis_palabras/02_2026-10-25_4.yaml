      - "volverse loco — сойти с ума"
    collocation_example: "Me voy a volver loco. — Я сойду с ума."
    trap: "От чего — de: enloquecido **de** dolor. В быту чаще говорят volverse loco."

  - word: destrozado
    ru: раздавленный, убитый горем
    ipa: /destɾoˈθaðo/
    say: дэстроса́до
    pron: "z — [θ], d в -ado почти пропадает."
    meaning: "Убитый горем; ещё — разбитый, сломанный, сильно уставший."
    examples:
      - "Se sintió destrozado tras la derrota. — Он почувствовал себя раздавленным после поражения."
      - "Después del accidente, el conductor salió ileso, pero el coche quedó destrozado. — После аварии водитель остался невредимым, но машина была разбита."
      - "Está destrozado por la muerte de su mujer y no es capaz de volver a trabajar. — Он убит горем из-за смерти жены и не в состоянии вернуться к работе."
    origin: "От destrozar «разбить вдребезги», trozo «кусок»: «разбить на куски»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: hundido
        pair: ["Está destrozado.", "Está hundido."]
        diff:
          - "hundido — подавленный, «утонувший» в горе"
    analogs:
      - "devastated / heartbroken — убитый горем"
      - "wrecked — разбитый"
    dialogue:
      - "Ana: ¿Cómo está la viuda? | Как вдова?"
      - "Pablo: Destrozada. Es una desgracia terrible. | Убита горем. Это страшное несчастье."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "estar destrozado — быть убитым горем, измотанным"
      - "quedar destrozado — разбиться вдребезги"
      - "destrozar algo — разнести что-то"
    collocation_example: "Después del viaje estoy destrozado. — После поездки я без сил."
    trap: "С estar: está destrozado. В разговоре часто значит просто «очень устал»."

  - word: dolido
    ru: задетый, испытывающий боль
    ipa: /doˈliðo/
    say: доли́до
    pron: "d между гласными мягкое [ð]."
    meaning: "Обиженный, задетый — когда чьи-то слова или поступок причинили боль."
    examples:
      - "Está dolido por tus palabras. — Его задели твои слова."
