      - "quedarse extrañado — озадачиться"
      - "me extraña que… — странно, что…"
    collocation_example: "Me extraña que no haya venido. — Странно, что он не пришёл."
    trap: "Не путайте с extrañar «скучать» (в Латинской Америке): extrañado — «озадаченный»."

  - word: enloquecido
    ru: обезумевший
    ipa: /enlokeˈθiðo/
    say: энлокэси́до
    pron: "qu — «к», c перед i — [θ]."
    meaning: "Обезумевший, потерявший голову от чувства или ситуации."
    examples:
      - "Corrió enloquecido hacia la salida. — Он как безумный бросился к выходу."
      - "Cuando sonó la alarma de incendio, la gente corría por la plaza enloquecida. — Когда сработала пожарная сигнализация, люди бегали по площади как безумные."
      - "Estaba enloquecido de celos y no le importaba nada de lo que dijeran los demás. — Он обезумел от ревности, и ему было безразлично, что говорят остальные."
    origin: "От enloquecer «сойти с ума», loco «сумасшедший»."
    register: "Нейтральное, выразительное."
