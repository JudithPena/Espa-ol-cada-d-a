# Четвёртый список автора, часть 12 — «Poderoso caballero» (слова 31–45).
lang: es
words:
  - word: caja fuerte
    ru: сейф
    ipa: /ˈkaxa ˈfweɾte/
    say: ка́ха фуэ́ртэ
    pron: "j — «х»; ue — один слог «уэ»."
    meaning: "Прочный металлический шкаф или ящик с замком для денег, документов, драгоценностей."
    examples:
      - "Alguien abrió la caja fuerte. — Кто-то вскрыл сейф."
      - "Guarda el dinero y los documentos importantes en una caja fuerte de su casa. — Он хранит деньги и важные документы в сейфе у себя дома."
      - "El banco alquila cajas fuertes a los clientes que quieren guardar joyas o papeles muy valiosos. — Банк сдаёт в аренду сейфы клиентам, которые хотят хранить драгоценности или очень ценные бумаги."
    origin: "caja «ящик» (лат. capsa «коробка») + fuerte «крепкий, прочный» (лат. fortis). Дословно «крепкий ящик»."
    register: "Нейтральное."
    synonyms:
      - word: caja de seguridad
        pair: ["Tiene una caja fuerte.", "Tiene una caja de seguridad."]
        diff:
          - "caja de seguridad — ячейка в банке, которую арендуют"
          - "caja fuerte — сейф дома или в офисе"
    analogs:
      - "safe — сейф"
      - "strongbox — несгораемый ящик"
    dialogue:
      - "Ana: ¿Dónde están las joyas? | Где драгоценности?"
      - "Pablo: En la caja fuerte del despacho. | В сейфе в кабинете."
      - "Ana: ¿Y quién tiene la llave? | А у кого ключ?"
      - "Pablo: Solo el dueño y su socio. Pero alguien abrió la caja fuerte sin forzarla. | Только у хозяина и его партнёра. Но кто-то открыл сейф, не взламывая его."
      - "Ana: Entonces conocía la combinación. | Значит, знал комбинацию."
      - "Pablo: Eso parece. La policía sospecha de alguien de dentro. | Похоже на то. Полиция подозревает кого-то из своих."
      - "Ana: Qué espeluznante. ¿Y faltaba mucho? | Как жутко. И многого не хватало?"
      - "Pablo: Casi todo. Quedó vacía, salvo una nota suelta con una sola palabra: «Perdón». | Почти всего. Осталась пустая, кроме отдельного листка с одним словом: «Прости»."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "abrir la caja fuerte — открыть сейф"
      - "forzar la caja fuerte — взломать сейф"
      - "combinación de la caja fuerte — код сейфа"
    collocation_example: "El ladrón no logró forzar la caja fuerte. — Вор не смог взломать сейф."
    trap: "Caja fuerte — «сейф», а caja — «касса» и «коробка». Fuerte согласуется: la caja fuerte, las cajas fuertes."

  - word: marco
    ru: рама; рамка
    ipa: /ˈmaɾko/
    say: ма́рко
    meaning: "Рамка для картины, фото или окна. Ещё — «рамки, контекст»: en el marco de."
    examples:
      - "Compré un marco para la foto. — Я купил рамку для фотографии."
      - "En el marco de este proyecto, se firmó un acuerdo entre las dos universidades. — В рамках этого проекта было подписано соглашение между двумя университетами."
      - "El marco de la ventana está podrido por la humedad y habrá que cambiarlo antes del invierno. — Оконная рама прогнила от сырости, и её придётся поменять до зимы."
    origin: "Возможно, из германского mark «граница, знак». Образ: рамка — граница картины. Родственное: marcar «отмечать»."
    register: "Нейтральное."
    synonyms:
      - word: cuadro
        pair: ["Colgó el marco en la pared.", "Colgó el cuadro en la pared."]
        diff:
          - "cuadro — картина целиком"
          - "marco — только рамка вокруг неё"
    analogs:
      - "frame — рамка"
      - "framework — рамки, структура"
    dialogue:
      - "Ana: ¿Qué compraste? | Что ты купил?"
      - "Pablo: Un marco de madera para la foto. | Деревянную рамку для фото."
      - "Ana: ¿La del viaje a la bahía? | Ту, с поездки в бухту?"
      - "Pablo: Sí, la mejor de todas. Salimos los dos, rojizos del sol, con la muralla de fondo. | Да, лучшую из всех. Мы вдвоём, красные от солнца, а на фоне стена."
      - "Ana: Qué recuerdo tan bonito. ¿Dónde la vas a poner? | Какое прекрасное воспоминание. Куда ты её поставишь?"
      - "Pablo: En el salón, sobre la chimenea. Me da ternura verla. | В гостиной, над камином. Мне нежно смотреть на неё."
      - "Ana: Entonces cuélgala con cuidado, con una chincheta no vale. | Тогда повесь аккуратно, кнопкой не получится."
      - "Pablo: Claro. Con un clavo bien fuerte, por si se cae. | Конечно. На крепкий гвоздь, вдруг упадёт."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "marco de la ventana — оконная рама"
      - "en el marco de — в рамках"
      - "marco legal — правовые рамки"
    collocation_example: "Se firmó en el marco de un acuerdo más amplio. — Подписано в рамках более широкого соглашения."
    trap: "Marco — ещё мужское имя и немецкая марка. «В рамках» — en el marco de. Не путайте с marca «марка, бренд»."

  - word: ocurrirse una idea
    ru: прийти в голову
    ipa: /okuˈrirse ˈuna iˈðea/
    say: окури́рсэ у́на иде́а
    pron: "d между гласными мягкое [ð]; ударение на rí: ocurrírse."
    meaning: "О мысли или идее: внезапно появиться. Конструкция как gustar: «мне пришла мысль»: se me ocurre una idea."
    examples:
      - "¿Se te ocurre algo mejor? — Тебе приходит что-нибудь лучше в голову?"
      - "Se le ocurrió una idea genial mientras esperaba el autobús bajo la lluvia. — Ему пришла в голову гениальная идея, пока он ждал автобус под дождём."
      - "Se me ocurre una idea: podríamos pedir ayuda a los vecinos para organizar la fiesta. — Мне пришла в голову мысль: можно попросить соседей помочь организовать праздник."
    origin: "ocurrir «происходить» (лат. occurrere «бежать навстречу»): мысль «выбегает навстречу». Родственное: ocurrencia «выдумка»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: venir a la cabeza
        pair: ["Se me ocurrió una idea.", "Me vino una idea a la cabeza."]
        diff:
          - "venirse a la cabeza — «прийти в голову», более образно"
          - "ocurrírsele — безличное, коротко и привычно"
    analogs:
      - "it occurs to me — мне приходит в голову"
      - "to come up with an idea — придумать идею"
    dialogue:
      - "Ana: ¿Qué hacemos? | Что делаем?"
      - "Pablo: Se me ocurre una idea. | Мне приходит в голову одна мысль."
      - "Ana: Cuéntame. Llevamos una hora dando vueltas. | Расскажи. Мы уже час ходим кругами."
      - "Pablo: ¿Y si llamamos a la fiscalía y les hacemos saber lo que sabemos? | А что, если позвонить в прокуратуру и сообщить им то, что мы знаем?"
      - "Ana: Es arriesgado. Aún no tenemos constancia de nada. | Это рискованно. У нас пока нет подтверждений."
      - "Pablo: Pero si esperamos más, quizá sea tarde. No se me ocurre otra cosa. | Но если ждать дольше, возможно, будет поздно. Больше ничего в голову не приходит."
      - "Ana: Vale, pero primero reunamos todas las pruebas. | Хорошо, но сначала соберём все улики."
      - "Pablo: De acuerdo. Una vez que lo tengamos, llamamos cuanto antes. | Согласен. Когда всё будет, позвоним как можно скорее."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "se me ocurre — мне приходит в голову"
      - "no se me ocurre nada — мне ничего не приходит в голову"
      - "ocurrírsele una idea — прийти идее"
    collocation_example: "De repente se me ocurrió una solución. — Вдруг мне пришло в голову решение."
    trap: "Человек стоит в me/te/le: se me ocurre, а не yo ocurro. Идея — подлежащее: me ocurrió una idea, me ocurrieron dos ideas."

  - word: aspirador
    ru: пылесос
    ipa: /aspiɾaˈðoɾ/
    say: аспирадо́р
    pron: "d между гласными мягкое [ð]; ударение на последнем слоге."
    meaning: "Бытовой прибор для уборки пыли. Ещё — «аспиратор» (в медицине)."
    examples:
      - "Pasó el aspirador por toda la casa. — Она пропылесосила весь дом."
      - "Compramos un aspirador sin cable que funciona con batería y es muy cómodo. — Мы купили беспроводной пылесос, который работает от аккумулятора и очень удобен."
      - "El aspirador hace mucho ruido, y por eso solo lo uso cuando los niños no están en casa. — Пылесос очень шумит, и поэтому я включаю его, только когда детей нет дома."
    origin: "От aspirar «втягивать, вдыхать» (лат. aspirare «дышать на, вдыхать») + суффикс -dor. Родственное: aspiración «стремление; вдох»."
    register: "Нейтральное."
    synonyms:
      - word: aspiradora
        pair: ["Pasé el aspirador.", "Pasé la aspiradora."]
        diff:
          - "aspiradora — женский род, привычное в Латинской Америке"
          - "aspirador — мужской род, в Испании"
    analogs:
      - "vacuum cleaner — пылесос"
      - "hoover — пылесос (британское)"
    dialogue:
      - "Ayer limpié la casa de arriba abajo, porque venían mis suegros. | Вчера я вычистил дом сверху донизу, потому что приезжали тёща и тесть."
      - "Primero pasé el aspirador por todas las habitaciones y debajo del sofá. | Сначала я прошёлся пылесосом по всем комнатам и под диваном."
      - "Luego usé un trapo húmedo para quitar el polvo de las estanterías. | Потом влажной тряпкой стёр пыль с полок."
      - "Mi mujer, mientras tanto, se arreglaba las uñas y vigilaba el horno. | Жена тем временем делала маникюр и присматривала за духовкой."
      - "Cuando llegaron, la casa brillaba, y mi suegra asintió con aprobación. | Когда они приехали, дом сиял, и тёща одобрительно кивнула."
      - "Estaba agotado, pero pese a todo, merecía la pena. | Я был выжат, но всё же оно того стоило."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "pasar el aspirador — пропылесосить"
      - "aspirador sin cable — беспроводной пылесос"
      - "bolsa del aspirador — мешок пылесоса"
    collocation_example: "Pasé el aspirador por toda la casa. — Я пропылесосил весь дом."
    trap: "В Испании — el aspirador (м.р.), в Латинской Америке — la aspiradora (ж.р.). «Пропылесосить» — pasar el aspirador, не «limpiar el aspirador»."

  - word: heredero universal
    ru: единственный законный наследник
    ipa: /eɾeˈðeɾo uniβeɾˈsal/
    say: эрэдэ́ро унибэрса́ль
    pron: "h не читается; d между гласными мягкое [ð]; v читается как b."
    meaning: "Человек, которому по завещанию достаётся всё имущество: не часть, а всё целиком."
    examples:
      - "Su hija es la heredera universal. — Его дочь – единственная наследница."
      - "Nombró heredera universal a su hija, y los demás parientes se quedaron sin nada. — Она назначила единственной наследницей дочь, и остальные родственники остались ни с чем."
      - "Su sobrino es el heredero universal y recibirá la casa, las cuentas y todos los muebles. — Его племянник – единственный наследник и получит дом, счета и всю мебель."
    origin: "heredero — от heredar «наследовать» (лат. hereditare, от heres «наследник»); universal — «всеобщий» (лат. universalis). «Наследник всего»."
    register: "Формальное, юридическое."
    synonyms:
      - word: único heredero
        pair: ["Es el heredero universal.", "Es el único heredero."]
        diff:
          - "único heredero — «единственный наследник» просто"
          - "heredero universal — юридический термин: наследует всё имущество по завещанию"
    analogs:
      - "sole heir — единственный наследник"
      - "residuary heir — наследник остатка"
    dialogue:
      - "Ana: ¿Quién heredará la casa? | Кто унаследует дом?"
      - "Pablo: Su hijo, es el heredero universal. | Его сын, он единственный наследник."
      - "Ana: ¿Y la finca? | А усадьба?"
      - "Pablo: También. Según el testamento, todo pasa a él, incluso las joyas. | Тоже. Согласно завещанию, всё переходит к нему, даже драгоценности."
      - "Ana: ¿Y los demás familiares? | А остальные родственники?"
      - "Pablo: Están furiosos. Dicen que el viudo fue engañado y que el testamento no es verosímil. | Они в ярости. Говорят, что вдовца обманули и завещание недостоверно."
      - "Ana: ¿Habrá juicio? | Будет суд?"
      - "Pablo: Seguro. Cuando hay un heredero universal y mucho dinero, siempre hay consecuencias nefastas. | Наверняка. Когда есть единственный наследник и много денег, всегда бывают пагубные последствия."
    cefr: "C1."
    frequency: "Частое в новостях и юридических текстах."
    collocations:
      - "nombrar heredero — назначить наследником"
      - "heredero universal — наследник всего"
      - "dejar en herencia — оставить в наследство"
    collocation_example: "Lo nombró heredero universal de todos sus bienes. — Он назначил его единственным наследником всего своего имущества."
    trap: "Universal — «всеобщий» и «единственный» в юридическом смысле: heredero universal получает всё. Женский род — heredera universal."

  - word: el Rastro
    ru: Эль Растро (блошиный рынок в Мадриде)
    ipa: /el ˈrastɾo/
    say: эль ра́стро
    pron: "r в начале — раскатистое."
    meaning: "Знаменитый воскресный блошиный рынок в центре Мадрида. rastro — ещё «след» и «рынок старых вещей»."
    examples:
      - "Los domingos vamos al Rastro. — По воскресеньям мы ходим на Растро."
      - "El Rastro de Madrid se llena de gente cada domingo desde las nueve. — Мадридский Растро наполняется людьми каждое воскресенье с девяти утра."
      - "Compró un libro antiguo en el Rastro por muy poco dinero, y resultó ser una primera edición. — Он купил старую книгу на Растро за очень маленькие деньги, и она оказалась первым изданием."
    origin: "Название связано с rastro «след; бойня» (по крови, оставлявшейся на земле, когда здесь были бойни). Родственное: rastrear «следить»."
    register: "Нейтральное, собственное название."
    synonyms:
      - word: mercadillo
        pair: ["Vamos al Rastro.", "Vamos al mercadillo."]
        diff:
          - "mercadillo — любой небольшой рынок или блошиный рынок"
          - "el Rastro — именно мадридский рынок, с большой буквы"
    analogs:
      - "flea market — блошиный рынок"
      - "El Rastro — известный рынок Мадрида"
    dialogue:
      - "Todos los domingos por la mañana, Ana va al Rastro de Madrid. | Каждое воскресенье утром Ана ходит на Растро в Мадриде."
      - "Le gusta pasear entre los puestos, rodeada de gente que busca gangas. | Ей нравится гулять между лавками, среди людей, ищущих выгодные покупки."
      - "Allí hay de todo: libros viejos, discos, ropa, lámparas y hasta joyas antiguas. | Там есть всё: старые книги, пластинки, одежда, лампы и даже старинные драгоценности."
      - "Regatear forma parte de la diversión, y casi nadie paga el precio inicial. | Торговаться — часть удовольствия, и почти никто не платит первоначальную цену."
      - "A mediodía, se toma una caña con unos boquerones en una de las terrazas. | В полдень она пьёт кружку пива с анчоусами на одной из террас."
      - "Vuelve a casa con alguna cosa curiosa y una sonrisa de oreja a oreja. | Домой она возвращается с каким-нибудь любопытным предметом и улыбкой до ушей."
    cefr: "B2."
    frequency: "Частое в рассказах о Мадриде."
    collocations:
      - "ir al Rastro — пойти на Растро"
      - "perder el rastro — потерять след"
      - "seguir el rastro — идти по следу"
    collocation_example: "La policía perdió el rastro del ladrón. — Полиция потеряла след вора."
    trap: "С большой буквы el Rastro — рынок; rastro — «след» (perder el rastro). Не путайте с rasgo «черта» и rastrillo «грабли»."

  - word: localizar
    ru: найти, разыскать; определить место
    ipa: /lokaliˈθaɾ/
    say: локалиса́р
    pron: "z в Испании — [θ]; перед e z меняется на c: localicé."
    meaning: "Определить, где находится человек или вещь, и найти. Ещё — «ограничить очаг» (о пожаре, болезни)."
    examples:
      - "Localizaron al excursionista perdido en la montaña. — Заблудившегося в горах туриста нашли."
      - "La policía localizó el coche robado en un aparcamiento a las afueras. — Полиция обнаружила украденную машину на парковке на окраине."
      - "No logro localizar a Luis desde esta mañana: tiene el móvil apagado y no contesta a los mensajes. — Я не могу найти Луиса с утра: у него выключен телефон, и он не отвечает на сообщения."
    origin: "От local «местный; место» (лат. localis, от locus «место») + суффикс -izar «делать». «Определить место»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: encontrar
        pair: ["Localizaron al testigo.", "Encontraron al testigo."]
        diff:
          - "encontrar — «найти» вообще, и случайно"
          - "localizar — «выяснить место и найти», обычно после поиска"
    analogs:
      - "to locate — найти, определить местонахождение"
      - "to track down — выследить"
    dialogue:
      - "Ana: ¿Lo has encontrado? | Ты его нашёл?"
      - "Pablo: No, no consigo localizarlo. | Нет, не получается его найти."
      - "Ana: ¿Has probado en su domicilio? | Ты пробовал по его домашнему адресу?"
      - "Pablo: Sí, pero nadie abre. Y el móvil siempre comunica. | Да, но никто не открывает. И мобильный всегда занят."
      - "Ana: ¿Y la policía? ¿Tiene alguna pista de su paradero? | А полиция? Есть зацепка по его местонахождению?"
      - "Pablo: Aún no. Han intentado localizarlo mediante su tarjeta, pero lleva días sin usarla. | Пока нет. Они пытались найти его по карте, но он уже несколько дней ею не пользуется."
      - "Ana: Qué raro. ¿Se habrá ido sin previo aviso? | Как странно. Неужели он уехал без предупреждения?"
      - "Pablo: Eso parece. Ando buscando cualquier indicio que ayude a localizarlo. | Похоже на то. Я ищу любой признак, который поможет его найти."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "localizar a alguien — разыскать кого-то"
      - "localizar un error — найти ошибку"
      - "localizar en el mapa — найти на карте"
    collocation_example: "Intenté localizarlo por teléfono sin éxito. — Я пытался дозвониться до него, но безуспешно."
    trap: "Перед e z → c: localicé. Перед человеком нужен a: localizar a alguien. Не путайте с localidad «населённый пункт» и localizador «определитель»."

  - word: jet set
    ru: элита, высшее общество
    ipa: /ˈdʒet ˈset/
    say: джет сэт
    pron: "Заимствовано из английского: читается «джет сэт». Звук «дж» не типичен для испанского."
    meaning: "Богатые и знаменитые люди, которые много путешествуют и живут роскошно."
    examples:
      - "Los famosos se ven en Marbella. — Знаменитости встречаются в Марбелье."
      - "La revista publica cada semana fotos de los personajes del jet set internacional. — Журнал каждую неделю публикует фотографии героев международной элиты."
      - "Es una fiesta del jet set, con invitados que llegan en yate y en helicóptero. — Это вечеринка для высшего света, и гости прибывают на яхтах и вертолётах."
    origin: "Из английского jet set: jet «реактивный самолёт» + set «компания, круг»: «люди, летающие на частных самолётах». Слово появилось в 1950-е."
    register: "Нейтральное, журналистское."
    synonyms:
      - word: alta sociedad
        pair: ["Es del jet set.", "Es de la alta sociedad."]
        diff:
          - "alta sociedad — аристократия и богатые в целом"
          - "jet set — именно «модная богатая публика», связанная с путешествиями и звёздами"
    analogs:
      - "jet set — тот же термин"
      - "high society — высшее общество"
    dialogue:
      - "En la ciudad, todos conocen la fiesta de verano del jet set. | В городе все знают летний праздник бомонда."
      - "Se celebra en una finca junto al mar, con músicos, camareros y mucho champán. | Он проходит в усадьбе у моря, с музыкантами, официантами и множеством шампанского."
      - "Asisten empresarios, concejales, famosos y algún que otro estafador. | Приходят предприниматели, советники, знаменитости и кое-какой мошенник."
      - "Las invitaciones son muy cotizadas, y la gente hace lo que sea por conseguirlas. | Приглашения очень ценятся, и люди идут на всё, чтобы их получить."
      - "Los camareros comentan que, tras las sonrisas, hay mucho cotilleo y mucha envidia. | Официанты говорят, что за улыбками скрывается много сплетен и зависти."
      - "Pese a todo, nadie quiere perderse la fiesta del año. | Несмотря ни на что, никто не хочет пропустить праздник года."
    cefr: "C1."
    frequency: "Частое в светской хронике."
    collocations:
      - "el jet set internacional — международная элита"
      - "pertenecer al jet set — принадлежать к элите"
      - "una fiesta del jet set — светская вечеринка"
    collocation_example: "Esa playa es famosa por su jet set. — Этот пляж знаменит своей светской публикой."
    trap: "Слово английское и не склоняется: el jet set. Пишется раздельно, а не «jetset»."

  - word: heredero
    ru: наследник
    ipa: /eɾeˈðeɾo/
    say: эрэдэ́ро
    pron: "h не читается; d между гласными мягкое [ð]."
    meaning: "Человек, который получает имущество или титул после смерти другого. Женский род — heredera."
    examples:
      - "El heredero vendió la casa familiar. — Наследник продал семейный дом."
      - "Los herederos se repartieron la finca después de una larga discusión con el abogado. — Наследники поделили усадьбу после долгого спора с адвокатом."
      - "Es el heredero del trono, y desde niño le han enseñado cómo debe comportarse en público. — Он наследник престола, и с детства его учили, как нужно вести себя на людях."
    origin: "От лат. heres, heredis «наследник». Родственные: heredar «наследовать», herencia «наследство», hereditario «наследственный»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: sucesor
        pair: ["Es su heredero.", "Es su sucesor."]
        diff:
          - "sucesor — «преемник» (в должности, власти)"
          - "heredero — «наследник» имущества или титула"
    analogs:
      - "heir — наследник"
      - "successor — преемник"
    dialogue:
      - "Ana: ¿Quién se queda con la empresa? | Кто получит фирму?"
      - "Pablo: Su hijo, el único heredero. | Его сын, единственный наследник."
      - "Ana: ¿Y está preparado? | И он готов к этому?"
      - "Pablo: Eso dicen. Aunque aparenta menos edad de la que tiene y muchos no lo toman en serio. | Так говорят. Хотя он выглядит моложе своих лет, и многие не воспринимают его всерьёз."
      - "Ana: Pues tendrá que demostrar su valía. | Тогда ему придётся доказать свою ценность."
      - "Pablo: Ya se lo hicieron saber. Los socios exigen cuanto antes un plan de gestión. | Ему уже дали понять. Партнёры требуют как можно скорее план управления."
      - "Ana: Menudo compromiso para un chaval. | Ну и обязательство для парня."
      - "Pablo: Sí, pero el heredero tiene ahínco y buenas ideas. | Да, но у наследника есть усердие и хорошие идеи."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "heredero al trono — наследник престола"
      - "nombrar heredero — назначить наследником"
      - "heredero legítimo — законный наследник"
    collocation_example: "El príncipe es el heredero al trono. — Принц — наследник престола."
    trap: "Не путайте heredero «наследник» с herido «раненый»: слова разные, но похожи. Женский род — heredera."

  - word: echar de
    ru: выгонять из
    ipa: /eˈtʃaɾ de/
    say: эча́р дэ
    pron: "ch — «ч»; d между гласными мягкое [ð]."
    meaning: "Заставить человека уйти откуда-то: из дома, из работы, из школы."
    examples:
      - "Lo echaron de la discoteca. — Его выгнали из дискотеки."
      - "Me echaron del trabajo sin ninguna explicación, después de diez años en la empresa. — Меня уволили с работы без всяких объяснений после десяти лет в компании."
      - "El profesor echó de clase a los alumnos que no dejaban de hablar y de reírse. — Преподаватель выгнал с урока учеников, которые не переставали разговаривать и смеяться."
    origin: "echar «бросать» (лат. iactare «бросать») + de «из»: «выбросить откуда-то». Родственные: echar de menos «скучать», echar a perder «испортить»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: expulsar
        pair: ["Lo echaron del colegio.", "Lo expulsaron del colegio."]
        diff:
          - "expulsar — официальное «исключить, изгнать»"
          - "echar — разговорное «выгнать»"
    analogs:
      - "to throw out — выгонять"
      - "to kick out — вышвырнуть"
    dialogue:
      - "Se corrió la voz en el barrio de que habían echado a Luis del bar. | По району разнёсся слух, что Луиса выгнали из бара."
      - "Según el dueño, Luis había armado un jaleo tremendo por culpa de una discusión. | По словам хозяина, Луис устроил ужасный скандал из-за спора."
      - "Otros decían que solo había defendido a un amigo y que lo echaron sin motivo. | Другие говорили, что он всего лишь защищал друга, и его выгнали без причины."
      - "Luis, avergonzado, agachó la cabeza y salió sin decir nada. | Луис, пристыженный, опустил голову и вышел, ничего не сказав."
      - "Al día siguiente, el dueño se arrepintió y le hizo saber que podía volver. | На следующий день хозяин пожалел и дал понять, что тот может вернуться."
      - "Luis no volvió nunca, pese a todo. | Но Луис так никогда и не вернулся."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "echar a alguien de casa — выгнать из дома"
      - "echar del trabajo — уволить"
      - "echar de menos — скучать"
    collocation_example: "Me echaron de casa a los dieciocho años. — Меня выгнали из дома в восемнадцать лет."
    trap: "Echar de + место: echar a alguien de un lugar. Не путайте с echar de menos «скучать»: там de menos не меняется."

  - word: vicio
    ru: порок; дурная привычка
    ipa: /ˈbiθjo/
    say: би́сьо
    pron: "v читается как b; c перед i в Испании — [θ]."
    meaning: "Дурная привычка или слабость, от которой трудно отказаться: азартные игры, курение. Ещё — «изъян»."
    examples:
      - "Su gran vicio es el juego. — Его большая слабость – азартные игры."
      - "Tiene el vicio de morderse las uñas cuando está nervioso, y no consigue quitárselo. — У него дурная привычка грызть ногти, когда он нервничает, и он не может от неё избавиться."
      - "Fumar es un vicio muy caro, y además perjudica a la salud de todos los que están cerca. — Курить – очень дорогая привычка, к тому же она вредит здоровью всех, кто рядом."
    origin: "Из лат. vitium «изъян, порок». Родственные: vicioso «порочный», viciarse «пристраститься»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: mala costumbre
        pair: ["Es un vicio.", "Es una mala costumbre."]
        diff:
          - "mala costumbre — просто «дурная привычка»"
          - "vicio — «порок», зависимость, привычка со вкусом"
    analogs:
      - "vice — порок"
      - "bad habit — дурная привычка"
    dialogue:
      - "Pablo: Es mi único vicio. | Это мой единственный порок."
      - "Pablo: Llevo años jugando a las cartas los viernes por la noche con mis amigos. | Уже годы я играю в карты по пятницам вечером с друзьями."
      - "Pablo: No apostamos mucho dinero, pero la emoción me engancha. | Мы не ставим много денег, но азарт затягивает."
      - "Pablo: Mi mujer dice que es un vicio feo, aunque lo tolera con paciencia. | Жена говорит, что это дурная привычка, хотя терпит её с терпением."
      - "Pablo: Lo cierto es que prefiero eso a otros vicios más peligrosos. | Правда в том, что я предпочитаю это более опасным порокам."
      - "Pablo: Por eso, hasta que no se me agote la paciencia, seguiré jugando. | Поэтому, пока у меня не иссякнет терпение, буду продолжать играть."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "tener el vicio de — иметь привычку"
      - "de vicio — «просто отлично» (разг.)"
      - "quitarse el vicio — отучиться"
    collocation_example: "Esta serie es de vicio, no puedes parar de verla. — Этот сериал затягивает, не можешь оторваться."
    trap: "В разговоре «de vicio» значит «отлично, затягивает». Не путайте vicio «порок» с vivir «жить» и viso «блеск»."

  - word: ser chulo
    ru: быть наглым, развязным; быть классным
    ipa: /seɾ ˈtʃulo/
    say: сэр чу́ло
    pron: "ch — «ч»."
    meaning: "В Испании chulo — «наглый, дерзкий»; в разговоре ещё «классный, красивый» (Es muy chulo)."
    examples:
      - "No seas chulo conmigo, por favor. — Не будь со мной наглым, пожалуйста."
      - "Qué chulo tu abrigo: ¿dónde lo has comprado? Me encantan los botones tan grandes. — Какое классное у тебя пальто: где ты его купил? Мне очень нравятся такие большие пуговицы."
      - "Es un chulo, siempre habla de sí mismo y mira por encima del hombro a todos los demás. — Он наглец: всегда говорит о себе и смотрит свысока на всех остальных."
    origin: "Происхождение неясно; возможно, из арабского или цыганского. Chulo — в Мадриде XIX века «ловкий, дерзкий молодчик». Позже смысл смягчился до «классный»."
    register: "Разговорное."
    synonyms:
      - word: descarado
        pair: ["Es muy chulo.", "Es muy descarado."]
        diff:
          - "descarado — «бесстыжий, нахальный»"
          - "chulo — «наглый, с понтами»; и «классный» о вещах"
    analogs:
      - "cocky — самоуверенный, наглый"
      - "cool — классный"
    dialogue:
      - "Ana: ¿Cómo es tu nuevo jefe? | Какой твой новый начальник?"
      - "Pablo: Un poco chulo, la verdad. | Немного наглый, по правде говоря."
      - "Ana: ¿Por qué lo dices? | Почему ты так говоришь?"
      - "Pablo: Porque entra en la oficina sin saludar y se cree un poderoso caballero. | Потому что заходит в офис, не поздоровавшись, и считает себя могущественным господином."
      - "Ana: Qué descaro. ¿Y a los demás qué les parece? | Какая наглость. А что думают остальные?"
      - "Pablo: Hay a quienes les cae simpático, pero casi nadie se atreve a contradecirlo. | Есть те, кому он нравится, но почти никто не решается ему возразить."
      - "Ana: Pues no seas chulo tú también. | Тогда ты сам не будь наглым."
      - "Pablo: Qué va, yo agacho la cabeza y espero a que se le pase. | Что ты, я опускаю голову и жду, пока пройдёт."
    cefr: "B2."
    frequency: "Очень частое в Испании."
    collocations:
      - "ponerse chulo — зарваться, стать наглым"
      - "qué chulo — как классно"
      - "un chulo de barrio — районный хулиган"
    collocation_example: "Se puso chulo conmigo y me contestó mal. — Он зарвался и ответил мне грубо."
    trap: "Два значения: о человеке — «наглый» (отрицательное), о вещи — «классный» (положительное). В Испании chulo ещё — «сутенёр» в грубом смысле, поэтому осторожно."

  - word: Bolsa
    ru: фондовая биржа
    ipa: /ˈbolsa/
    say: бо́льса
    pron: "ударение на первом слоге: bolsa."
    meaning: "Рынок, где торгуют акциями. С маленькой буквы bolsa — «сумка, пакет»."
    examples:
      - "La Bolsa cerró hoy con pérdidas. — Биржа сегодня закрылась с убытками."
      - "Ha invertido en la Bolsa todos sus ahorros y ahora mira los gráficos. — Он вложил на бирже все сбережения и теперь смотрит на графики."
      - "Los precios de la Bolsa suben y bajan cada día según las noticias de las grandes empresas. — Цены на бирже растут и падают каждый день в зависимости от новостей о крупных компаниях."
    origin: "От bolsa «сумка, кошелёк»: по легенде, торговцы собирались в Брюгге у дома семьи ван дер Бурсе, на фасаде которого были три кошелька. Родственное: bolso «сумка»."
    register: "Формальное, финансовое."
    synonyms:
      - word: mercado de valores
        pair: ["Invierte en la Bolsa.", "Invierte en el mercado de valores."]
        diff:
          - "mercado de valores — более общее название «рынок ценных бумаг»"
          - "Bolsa — конкретная биржа, пишется с большой буквы"
    analogs:
      - "stock exchange — фондовая биржа"
      - "stock market — фондовый рынок"
    dialogue:
      - "Ana: ¿Cómo va la Bolsa? | Как дела на бирже?"
      - "Pablo: Hoy ha bajado mucho. | Сегодня сильно упала."
      - "Ana: ¡Qué desastre! ¿Y qué ha pasado? | Какая катастрофа! И что случилось?"
      - "Pablo: Una cadena multinacional anunció pérdidas y se vino abajo todo el sector. | Транснациональная сеть объявила о потерях, и рухнул весь сектор."
      - "Ana: ¿Y tú tenías acciones? | А у тебя были акции?"
      - "Pablo: Unas pocas. Estoy deprimido, aunque no reviste ninguna gravedad. | Несколько. Я подавлен, хотя ничего серьёзного нет."
      - "Ana: ¿Vas a vender? | Будешь продавать?"
      - "Pablo: No, no conviene precipitarse. La Bolsa sube y baja, y hay que armarse de paciencia. | Нет, торопиться не стоит. Биржа то растёт, то падает, и надо запастись терпением."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "jugar en Bolsa — играть на бирже"
      - "bolsa de trabajo — биржа труда"
      - "bolsa de basura — мусорный пакет"
    collocation_example: "Perdió mucho dinero jugando en Bolsa. — Он потерял много денег, играя на бирже."
    trap: "Bolsa — «биржа» (с большой буквы), «сумка» и «пакет». Не путайте с bolso «сумка (женская)»."

  - word: trozo
    ru: кусок
    ipa: /ˈtɾoθo/
    say: тро́со
    pron: "z в Испании — [θ]."
    meaning: "Часть, отделённая от целого: кусок хлеба, торта, бумаги. Больше, чем «крошка»."
    examples:
      - "Me dio un trozo de pan. — Он дал мне кусок хлеба."
      - "Quiero un trozo de pastel de chocolate, pero pequeño, que acabo de comer. — Я хочу кусочек шоколадного торта, но небольшой, потому что только что поел."
      - "Dame un trozo de papel para apuntar el número de teléfono antes de que se me olvide. — Дай мне клочок бумаги, чтобы записать номер телефона, пока я не забыл."
    origin: "Происхождение неясно; возможно, из позднелат. trociare. Родственное: trozar «разрезать»."
    register: "Нейтральное."
    synonyms:
      - word: pedazo
        pair: ["Dame un trozo de pan.", "Dame un pedazo de pan."]
        diff:
          - "pedazo — то же самое, чуть разговорнее"
          - "trozo — нейтральное, общее"
    analogs:
      - "piece — кусок"
      - "chunk — большой кусок"
    dialogue:
      - "Ana: ¿Quieres tarta? | Хочешь торт?"
      - "Pablo: Un trozo pequeño, por favor. | Маленький кусочек, пожалуйста."
      - "Ana: ¿De chocolate o de limón? | Шоколадный или лимонный?"
      - "Pablo: De limón. El de chocolate me parece demasiado dulce, casi cursi. | Лимонный. Шоколадный кажется слишком сладким, почти слащавым."
      - "Ana: Aquí tienes. ¿Y un café para acompañar? | Держи. И кофе в придачу?"
      - "Pablo: Sí, con un poco de leche. Hoy aprovecho para picar algo. | Да, с немного молока. Сегодня воспользуюсь случаем и перекушу."
      - "Ana: ¿Quieres otro trozo? | Хочешь ещё кусочек?"
      - "Pablo: Mejor no. Aún no he probado bocado de verdad, pero con esto me basta. | Лучше нет. Нормально я ещё не ел, но этого мне достаточно."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "un trozo de pan — кусок хлеба"
      - "cortar en trozos — нарезать кусками"
      - "hacerse trozos — разбиться вдребезги"
    collocation_example: "Corta la carne en trozos pequeños. — Нарежь мясо мелкими кусками."
    trap: "Trozo — просто «кусок», а pedazo — тоже «кусок», но может быть и «ты красавчик»: ¡Qué pedazo de coche! — «Какая машина!»."

  - word: estar hundido
    ru: быть морально раздавленным
    ipa: /esˈtaɾ unˈdiðo/
    say: эста́р унди́до
    pron: "h не читается; d между гласными мягкое [ð]."
    meaning: "О человеке: быть в глубоком горе или в подавленном состоянии, «пасть духом». Hundido — «потонувший»."
    examples:
      - "Está hundido tras la muerte de su perro. — Он подавлен после смерти собаки."
      - "Después de la derrota, todo el equipo estaba hundido en el vestuario. — После поражения вся команда сидела в раздевалке подавленной."
      - "Está hundido desde que perdió el trabajo y casi no sale de casa ni habla con los amigos. — Он подавлен с тех пор, как потерял работу, и почти не выходит из дома и не разговаривает с друзьями."
    origin: "Причастие от hundir «топить, погружать» (лат. fundere «лить», затем «погружать»). Родственные: hundirse «тонуть», hondo «глубокий»."
    register: "Нейтральное."
    synonyms:
      - word: estar destrozado
        pair: ["Está hundido por la noticia.", "Está destrozado por la noticia."]
        diff:
          - "destrozado — «раздавленный, убитый горем», сильнее и эмоциональнее"
          - "hundido — «подавленный, в упадке», чуть тише"
    analogs:
      - "to be devastated — быть опустошённым"
      - "to be crushed — быть раздавленным"
    dialogue:
      - "Cuando murió su perro, Pablo se hundió por completo. | Когда умерла его собака, Пабло полностью сломался."
      - "Durante días no quiso salir de casa y apenas probó bocado. | Несколько дней он не хотел выходить из дома и почти ничего не ел."
      - "Su hermana lo llamaba cada tarde, pero él no contestaba. | Сестра звонила ему каждый вечер, но он не отвечал."
      - "Estaba sumido en una tristeza profunda y no acertaba a consolarse. | Он был погружён в глубокую печаль и не мог утешиться."
      - "Un día, ella se presentó en su casa con un setter irlandés cachorro. | Однажды она пришла к нему домой с щенком ирландского сеттера."
      - "Pablo lo miró fijamente, sollozó y, poco a poco, empezó a sonreír. | Пабло пристально посмотрел на него, всхлипнул и понемногу начал улыбаться."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "estar hundido — быть подавленным"
      - "hundirse en la miseria — погрузиться в нищету"
      - "un barco hundido — затонувший корабль"
    collocation_example: "Después de la derrota, el equipo estaba hundido. — После поражения команда была подавлена."
    trap: "Hundido — причастие: hundida, hundidos. С estar, не с ser. Про корабль — «затонувший»: un barco hundido."
