# Пятый список автора, часть 5 — «Desconcierto en el hospital 5» (слова 1–11).
lang: es
words:
  - word: divisar
    ru: заметить издалека, разглядеть
    ipa: /diβiˈsaɾ/
    say: дибиса́р
    pron: "v читается как b; ударение на последнем слоге."
    meaning: "Увидеть что-то далеко или в плохом освещении: вдали, в темноте, в тумане."
    examples:
      - "Divisó un barco en el horizonte. — Он разглядел корабль на горизонте."
      - "Entre los árboles, los excursionistas divisaron una luz y se dirigieron hacia ella. — Между деревьями туристы заметили свет и направились к нему."
      - "Desde la ventana se divisa el mar, y en los días claros se ve incluso la isla. — Из окна виднеется море, а в ясные дни видно даже остров."
    origin: "Из лат. dividere «разделять»: «различить» вдали отдельный предмет. Родственные: dividir «делить», división «деление», divisa «валюта; эмблема»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: avistar
        pair: ["Divisó la costa.", "Avistó la costa."]
        diff:
          - "avistar — «заметить издалека», слово моряков и охотников"
          - "divisar — «разглядеть» вдали или в темноте, шире"
    analogs:
      - "to spot — заметить"
      - "to make out — разглядеть"
    dialogue:
      - "Ana: ¿Ves algo? | Ты что-нибудь видишь?"
      - "Pablo: Divisé una luz a lo lejos. | Я заметил вдалеке свет."
      - "Ana: ¿Un barco? | Корабль?"
      - "Pablo: Creo que sí. Se divisa apenas en el horizonte, entre la bruma. | Кажется, да. Его едва видно на горизонте, в дымке."
      - "Ana: ¿Y hacia dónde va? | И куда он идёт?"
      - "Pablo: Hacia la bahía. Dentro de una hora lo divisaremos mejor desde el puerto. | К бухте. Через час мы разглядим его лучше из порта."
      - "Ana: Vamos al puerto, entonces. | Тогда пойдём в порт."
      - "Pablo: Vale, pero llevemos un abrigo, que refresca. | Хорошо, но возьмём пальто, холодает."
    cefr: "C1."
    frequency: "Частое в прозе."
    collocations:
      - "divisar en el horizonte — разглядеть на горизонте"
      - "divisar a lo lejos — заметить вдали"
      - "divisar una luz — заметить огонёк"
    collocation_example: "Desde lo alto se divisaba toda la ciudad. — С высоты виднелся весь город."
    trap: "Divisar — «разглядеть вдали», а dividir — «делить»: разные слова. Divisa — ещё «валюта»: divisas extranjeras."

  - word: exigir que
    ru: требовать, чтобы...
    ipa: /ekˈsixiɾ ke/
    say: эксихи́р кэ
    pron: "x в начале слога — «кс»; g перед i — «х»; перед a, o g → j: exijo."
    meaning: "Настаивать, что нужно сделать: категорически просить. После exigir que — subjuntivo."
    examples:
      - "Exigió que le devolvieran su maleta. — Он потребовал вернуть ему чемодан."
      - "Me insultaste sin ningún motivo, y por eso exijo que me pidas perdón delante de todos. — Ты оскорбил меня без всякой причины, и поэтому я требую, чтобы ты извинился передо мной при всех."
      - "Los vecinos exigen que el ayuntamiento arregle la calle antes de que empiece la lluvia. — Жители требуют, чтобы мэрия починила улицу до начала дождей."
    origin: "Из лат. exigere «требовать»: ex- «из» + agere «гнать, делать». Родственные: exigencia «требование», exigente «требовательный»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: pedir que
        pair: ["Exigió que se fueran.", "Pidió que se fueran."]
        diff:
          - "pedir que — «просить, чтобы»"
          - "exigir que — «требовать, чтобы», без права отказа"
    analogs:
      - "to demand that — требовать, чтобы"
      - "to insist that — настаивать, чтобы"
    dialogue:
      - "Ana: ¿Qué quiere el cliente? | Чего хочет клиент?"
      - "Pablo: Exige que le devolvamos el dinero. | Требует, чтобы мы вернули ему деньги."
      - "Ana: ¿Por qué? | Почему?"
      - "Pablo: Dice que lo engañaron con el precio y se siente estafado. | Говорит, что его обманули с ценой, и он чувствует себя обманутым."
      - "Ana: ¿Y tiene razón? | И он прав?"
      - "Pablo: Parcialmente. Hubo un error, pero no fue mala fe. Hay que matizarlo. | Отчасти. Была ошибка, но не по злому умыслу. Это нужно уточнить."
      - "Ana: ¿Y qué le vais a decir? | И что вы ему скажете?"
      - "Pablo: Que lo comprendemos, pero exigimos que presente una prueba. Es lo correcto. | Что мы его понимаем, но требуем, чтобы он предоставил доказательство. Это правильно."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "exigir que + subjuntivo — требовать, чтобы"
      - "exigir una explicación — требовать объяснений"
      - "exigir responsabilidades — потребовать ответственности"
    collocation_example: "Los vecinos exigen que arreglen la calle. — Жители требуют, чтобы починили улицу."
    trap: "После exigir que — subjuntivo: exijo que vengas. Перед a, o g → j: exijo, exija. Не путайте с exigente «требовательный» и exiliar «изгнать»."

  - word: de una vez por todas
    ru: раз и навсегда; наконец уже
    ipa: /de ˈuna ˈβeθ poɾ ˈtoðas/
    say: дэ у́на бэс пор то́дас
    pron: "v читается как b; z на конце в Испании — [θ]."
    meaning: "Окончательно, больше не возвращаясь к вопросу. В разговоре ещё — раздражённое «наконец-то»."
    examples:
      - "Decide de una vez por todas. — Реши уже наконец раз и навсегда."
      - "Llevo toda la tarde oyéndote repetir lo mismo: ¡cállate de una vez por todas! — Я весь вечер слушаю, как ты повторяешь одно и то же: замолчи уже наконец!"
      - "Hay que resolver esto de una vez por todas, porque no podemos seguir discutiendo cada semana. — Нужно решить это раз и навсегда, потому что мы не можем продолжать спорить каждую неделю."
    origin: "una vez «один раз» + por todas «ради всех»: «один раз и для всех случаев». Образ: больше не повторится."
    register: "Нейтральное, эмоциональное."
    synonyms:
      - word: definitivamente
        pair: ["Lo dejó de una vez por todas.", "Lo dejó definitivamente."]
        diff:
          - "definitivamente — «окончательно», спокойно и нейтрально"
          - "de una vez por todas — «раз и навсегда», с нажимом и эмоцией"
    analogs:
      - "once and for all — раз и навсегда"
      - "for good — навсегда"
    dialogue:
      - "Ana: ¿Vas a dejar de fumar? | Ты бросишь курить?"
      - "Pablo: Sí, de una vez por todas. | Да, раз и навсегда."
      - "Ana: Eso dijiste el año pasado. | Ты то же самое говорил в прошлом году."
      - "Pablo: Lo sé, pero ahora me lo prometí a mí mismo, y no pienso ceder ni un ápice. | Знаю, но теперь я пообещал это самому себе и не собираюсь уступать ни на йоту."
      - "Ana: ¿Y qué te ha hecho cambiar? | И что заставило тебя измениться?"
      - "Pablo: El médico me hizo una advertencia clara. Y me cansé de toser. | Врач чётко меня предостерёг. И мне надоело кашлять."
      - "Ana: Pues te apoyo. Decídelo de una vez por todas. | Тогда я тебя поддерживаю. Реши это раз и навсегда."
      - "Pablo: Gracias. Contar contigo lo hace más fácil. | Спасибо. Рассчитывать на тебя — значит, облегчать задачу."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "de una vez — сразу, наконец"
      - "de una vez por todas — раз и навсегда"
      - "de vez en cuando — время от времени"
    collocation_example: "Quiero acabar con esto de una vez por todas. — Я хочу покончить с этим раз и навсегда."
    trap: "Выражение неизменно: «de una vez por todas». Не путайте с de vez en cuando «время от времени» и a la vez «одновременно»."

  - word: contraído
    ru: напряжённый, сжатый
    ipa: /kontɾaˈiðo/
    say: контраи́до
    pron: "aí — два слога: кон-тра-и́-до; d между гласными мягкое [ð]."
    meaning: "О мышцах, лице, голосе: сведённый, напряжённый. Причастие от contraer «сжимать; заразиться»."
    examples:
      - "Tenía el rostro contraído por el dolor. — Лицо у него было искажено от боли."
      - "Después de la carrera necesitó un masaje, porque tenía los músculos contraídos. — После бега ему понадобился массаж, потому что мышцы были сжаты."
      - "Habló con la voz contraída por los nervios, y apenas se le oyó en el fondo de la sala. — Он говорил напряжённым от волнения голосом, и его едва было слышно в глубине зала."
    origin: "Причастие от contraer «сжимать» (лат. contrahere: con- «вместе» + trahere «тянуть»). Родственные: contracción «сокращение», contrato «договор», atraer «притягивать»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: tenso
        pair: ["Tenía el gesto contraído.", "Tenía el gesto tenso."]
        diff:
          - "tenso — «напряжённый» вообще, и о ситуации"
          - "contraído — «сжатый, стянутый» именно физически: лицо, мышцы"
    analogs:
      - "tense — напряжённый"
      - "contracted — сжатый"
    dialogue:
      - "Ana: ¿Cómo estaba el paciente? | Как был пациент?"
      - "Pablo: Con el rostro contraído por el dolor. | С лицом, искажённым от боли."
      - "Ana: ¿Gritaba? | Кричал?"
      - "Pablo: No, solo balbuceaba. Tenía los puños apretados y las cejas contraídas. | Нет, только бормотал. Кулаки были сжаты, а брови сведены."
      - "Ana: ¿Se le ha pasado ya? | Уже прошло?"
      - "Pablo: Un poco, tras el comprimido. El médico dice que no reviste ninguna gravedad. | Немного, после таблетки. Врач говорит, что опасности нет."
      - "Ana: Qué susto. | Какой испуг."
      - "Pablo: Sí, estaba tan contraído que parecía una estatua. | Да, он так напрягся, что был похож на статую."
    cefr: "C1."
    frequency: "Нечастое: в описаниях и медицине."
    collocations:
      - "rostro contraído — искажённое лицо"
      - "contraer un músculo — напрячь мышцу"
      - "contraer una enfermedad — заразиться болезнью"
    collocation_example: "Contrajo una enfermedad durante el viaje. — Он заразился болезнью во время поездки."
    trap: "Contraer — ещё «заразиться» и «заключить»: contraer matrimonio. Причастие согласуется: contraída, contraídos. Не путайте с contratar «нанимать»."

  - word: acertar a decir
    ru: суметь сказать, подобрать слова
    ipa: /aθeɾˈtaɾ a ðeˈθiɾ/
    say: асэрта́р а дэси́р
    pron: "c/z в Испании — [θ]; спрягается e → ie: acierto, aciertas."
    homonym: "Уже было: acertar a — суметь, удаться. Здесь — оборот acertar a decir: подобрать слова."
    id: acertar-a-decir
    meaning: "Найти нужные слова в трудный момент: чаще с отрицанием: «не смог ничего сказать»."
    examples:
      - "Acertó a decir solo una palabra. — Ему удалось сказать лишь одно слово."
      - "Delante de los jueces, tan nervioso estaba que apenas acertó a decir su nombre. — Перед судьями он так волновался, что едва сумел назвать своё имя."
      - "No acertó a decir ni una palabra cuando vio a su padre en la puerta después de tantos años. — Он не смог произнести ни слова, когда увидел отца в дверях после стольких лет."
    origin: "acertar «попасть в цель, угадать» (a- + cierto «верный») + decir «сказать». Образ: «попасть словом в цель»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: encontrar las palabras
        pair: ["No acertó a decir nada.", "No encontró las palabras."]
        diff:
          - "encontrar las palabras — «найти слова», разговорное"
          - "acertar a decir — книжнее, о том, что словами выразить трудно"
    analogs:
      - "to find the words — найти слова"
      - "to manage to say — суметь сказать"
    dialogue:
      - "Ana: ¿Qué dijo cuando te vio? | Что он сказал, когда тебя увидел?"
      - "Pablo: No acertó a decir nada. | Он не смог сказать ни слова."
      - "Ana: ¿Tan sorprendido estaba? | Он был так удивлён?"
      - "Pablo: Muy. Se quedó con la boca abierta, aturdido. Apenas acertó a decir mi nombre. | Очень. Остался с открытым ртом, ошеломлённый. Едва смог произнести моё имя."
      - "Ana: Qué emoción. ¿Hacía mucho que no os veíais? | Какое волнение. Вы давно не виделись?"
      - "Pablo: Quince años. No aparentaba los años que tiene, pero cambió mucho. | Пятнадцать лет. Он выглядел моложе своих лет, но сильно изменился."
      - "Ana: ¿Y luego? | А потом?"
      - "Pablo: Nos abrazamos y acertamos a hablar, entre lágrimas, de todo lo vivido. | Мы обнялись и сумели поговорить, сквозь слёзы, обо всём пережитом."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "no acertar a decir — не найти что сказать"
      - "no acertar a explicar — не суметь объяснить"
      - "acertar a responder — суметь ответить"
    collocation_example: "No acertaba a explicar lo que sentía. — Он не мог объяснить, что чувствует."
    trap: "Acertar a + инфинитив. Спрягается e → ie: acierto. Не путайте с acertar «угадать»: acertó la respuesta."

  - word: retraso
    ru: задержка, опоздание
    ipa: /reˈtɾaso/
    say: рэтра́со
    pron: "r в начале — раскатистое."
    meaning: "Поздний приход или поздний результат: опоздание поезда, отставание в работе."
    examples:
      - "El vuelo salió con una hora de retraso. — Рейс вылетел с опозданием на час."
      - "Pido disculpas por el retraso: había mucho tráfico y no encontré aparcamiento. — Прошу прощения за опоздание: было много машин, и я не нашёл парковку."
      - "El tren llega con retraso por un problema en la vía, y los pasajeros esperan en el andén. — Поезд прибывает с опозданием из-за проблемы на путях, и пассажиры ждут на платформе."
    origin: "От retrasar «замедлять» (re- + trasar «тащить»; лат. trans). Родственные: atraso «отставание», atrás «позади»."
    register: "Нейтральное."
    synonyms:
      - word: demora
        pair: ["Hubo un retraso en la entrega.", "Hubo una demora en la entrega."]
        diff:
          - "demora — «промедление», в Латинской Америке чаще"
          - "retraso — «опоздание, отставание» в Испании"
    analogs:
      - "delay — задержка"
      - "lateness — опоздание"
    dialogue:
      - "Ana: ¿Dónde está el vuelo? | Где рейс?"
      - "Pablo: Lleva dos horas de retraso. | Задерживается на два часа."
      - "Ana: ¡Qué fastidio! ¿Por qué? | Какая досада! Почему?"
      - "Pablo: Por una avería. Los pasajeros se han arremolinado en el mostrador a pedir información. | Из-за неисправности. Пассажиры столпились у стойки, требуя информацию."
      - "Ana: ¿Y la azafata qué dice? | А что говорит стюардесса?"
      - "Pablo: Que hay que armarse de paciencia y aguardar. Pero no tiene más datos. | Что нужно запастись терпением и ждать. Но других сведений у неё нет."
      - "Ana: Pues me siento a picar algo. | Тогда я сяду что-нибудь перекусить."
      - "Pablo: Buena idea. Con este retraso, tienes para rato. | Хорошая мысль. С такой задержкой ждать тебе долго."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "con retraso — с опозданием"
      - "llevar retraso — отставать, опаздывать"
      - "un retraso de dos horas — опоздание на два часа"
    collocation_example: "El vuelo sufrió un retraso de tres horas. — Рейс задержали на три часа."
    trap: "Retraso — и «опоздание», и «отставание в развитии»: retraso mental — устаревшее. Не путайте с atraso «отсталость» и retrato «портрет»."

  - word: detenidamente
    ru: подробно, обстоятельно
    ipa: /detenidaˈmente/
    say: дэтэнидаме́нтэ
    pron: "Ударение на me: detenidamente."
    meaning: "Не торопясь, уделяя время деталям: читать, смотреть, думать обстоятельно."
    examples:
      - "Lo observó detenidamente desde la ventana. — Он внимательно наблюдал за ним из окна."
      - "Antes de decidir cómo curarla, miró la herida con una lupa y la examinó detenidamente. — Прежде чем решить, как её лечить, он взял лупу и тщательно осмотрел рану."
      - "Lee el contrato detenidamente antes de firmar, porque luego será muy difícil cambiar algo. — Прочитай договор внимательно, прежде чем подписывать, потому что потом будет очень трудно что-то изменить."
    origin: "Наречие от detenido «задержанный, подробный» (от detener «останавливать») + -mente. Образ: остановиться и рассмотреть."
    register: "Нейтральное."
    synonyms:
      - word: con detalle
        pair: ["Lo explicó detenidamente.", "Lo explicó con detalle."]
        diff:
          - "con detalle — «с подробностями»"
          - "detenidamente — «не торопясь», подчёркивает внимание"
    analogs:
      - "carefully — внимательно"
      - "thoroughly — тщательно"
    dialogue:
      - "Ana: ¿Leíste el documento? | Ты прочитал документ?"
      - "Pablo: Sí, lo revisé detenidamente. | Да, я изучил его внимательно."
      - "Ana: ¿Y encontraste algo raro? | И нашёл что-нибудь странное?"
      - "Pablo: Sí. Al leerlo detenidamente, noté que faltaba una cláusula importante. | Да. Читая внимательно, заметил, что не хватает важного пункта."
      - "Ana: ¿Cuál? | Какого?"
      - "Pablo: La que dice quién corresponde pagar los gastos. No se hace mención alguna. | Того, где говорится, кто должен оплатить расходы. О нём не упоминается вовсе."
      - "Ana: Menuda papeleta. ¿Se lo has hecho saber? | Ну и неприятность. Ты им сообщил?"
      - "Pablo: Aún no. Primero quiero estudiarlo más detenidamente. | Пока нет. Сначала хочу изучить его ещё внимательнее."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "leer detenidamente — читать внимательно"
      - "examinar detenidamente — рассмотреть подробно"
      - "pensar detenidamente — обдумать"
    collocation_example: "Piénsalo detenidamente antes de decidir. — Обдумай это как следует, прежде чем решать."
    trap: "Detenidamente — наречие: не меняется. Не путайте с detenido «задержанный» (существительное): «un detenido» — «арестованный»."

  - word: disponerse a
    ru: приготовиться, собраться что-то сделать
    ipa: /dispoˈneɾse a/
    say: диспонэ́рсэ а
    pron: "Спрягается как poner: me dispongo, te dispones; причастие — dispuesto."
    meaning: "Начать готовиться к действию и вот-вот приступить: «собрался сделать». После a — инфинитив."
    examples:
      - "Mi hermano se dispone a viajar. — Мой брат собирается в поездку."
      - "Me dispongo a empezar el trabajo, pero antes necesito un café bien fuerte. — Я собираюсь приступить к работе, но сначала мне нужен очень крепкий кофе."
      - "Se disponía a salir cuando sonó el teléfono, y tuvo que volver a quitarse el abrigo. — Он собирался выходить, когда зазвонил телефон, и ему пришлось снова снимать пальто."
    origin: "dis- «врозь, по порядку» + poner «класть»: «разложить всё по местам». Родственные: disposición «готовность, расположение», dispuesto «готовый»."
    register: "Формальное, литературное."
    synonyms:
      - word: prepararse para
        pair: ["Se disponía a cenar.", "Se preparaba para cenar."]
        diff:
          - "prepararse para — «готовиться» к чему-то"
          - "disponerse a — «вот-вот приступить», к действию"
    analogs:
      - "to be about to — собираться сделать"
      - "to get ready to — приготовиться"
    dialogue:
      - "Ana: ¿Qué hacías? | Чем ты занимался?"
      - "Pablo: Me disponía a salir. | Я собирался выходить."
      - "Ana: ¿Adónde? | Куда?"
      - "Pablo: A hacer unos recados. Estaba a punto de cerrar la puerta cuando sonó el auricular. | Делать кое-какие дела. Я уже собирался закрыть дверь, когда зазвонил телефон."
      - "Ana: ¿Quién llamaba? | Кто звонил?"
      - "Pablo: Mi madre. Quería que fuera a buscarla al aeropuerto. | Мама. Хотела, чтобы я забрал её из аэропорта."
      - "Ana: Qué oportuna. | Как вовремя."
      - "Pablo: Sí, y se disponía a coger un taxi, pero le dije que no. Voy yo. | Да, и она собиралась взять такси, но я сказал, что нет. Поеду сам."
    cefr: "C1."
    frequency: "Частое в прозе."
    collocations:
      - "disponerse a + инфинитив — собраться сделать"
      - "estar dispuesto a — быть готовым к"
      - "disponer de — располагать"
    collocation_example: "Estaba dispuesto a ayudarnos. — Он был готов нам помочь."
    trap: "Нужен a перед инфинитивом: se dispuso a hablar. Не путайте disponerse a «собраться сделать» с disponer de «располагать»."

  - word: vislumbrarse una pista
    ru: забрезжила, появилась зацепка
    ipa: /bizlumˈbɾaɾse ˈuna ˈpista/
    say: бислумбра́рсэ у́на пи́ста
    pron: "v читается как b; sl — «зл», b мягкая [β]."
    meaning: "О слабом, но реальном шансе: стало видно след, намёк. Vislumbrar — «различить, увидеть смутно»."
    examples:
      - "No se vislumbra ninguna solución. — Не видно никакого решения."
      - "En el horizonte se vislumbraba una esperanza, aunque nadie se atrevía todavía a celebrarla. — На горизонте мерцала надежда, хотя никто ещё не решался её праздновать."
      - "Por fin se vislumbra una pista, y la policía cree que podrá detener al culpable en pocos días. — Наконец забрезжила зацепка, и полиция думает, что сможет задержать виновного через несколько дней."
    origin: "Из лат. vix «едва» + lumbre «свет, огонь»: «едва различить свет». Родственные: lumbre «огонь», luz «свет», alumbrar «освещать»."
    register: "Формальное, литературное."
    synonyms:
      - word: entreverse
        pair: ["Se vislumbra una solución.", "Se entrevé una solución."]
        diff:
          - "entrever — «смутно увидеть», тоже книжное"
          - "vislumbrar — «различить слабый свет»; чаще о надежде и разгадке"
    analogs:
      - "to glimpse — мельком увидеть"
      - "to see a glimmer of — разглядеть проблеск"
    dialogue:
      - "La inspectora llevaba semanas con el caso del secuestro y no tenía ningún indicio. | Инспектор уже несколько недель вела дело о похищении и не имела ни одной зацепки."
      - "Las pesquisas avanzaban despacio, y la familia del empresario estaba cada vez más desesperada. | Расследование шло медленно, а семья предпринимателя была всё более отчаявшейся."
      - "Una mañana, un vecino le hizo saber que había visto una furgoneta rojiza en la glorieta. | Однажды утром сосед сообщил ей, что видел рыжеватый фургон на кольце."
      - "Por primera vez, se vislumbraba una pista. | Впервые появилась зацепка."
      - "La inspectora contuvo la emoción y pidió las grabaciones de las cámaras cuanto antes. | Инспектор сдержала волнение и как можно скорее запросила записи камер."
      - "«Quizá este sea el hilo que necesitábamos», murmuró. | «Возможно, это та нить, что нам была нужна», — пробормотала она."
    cefr: "C1."
    frequency: "Частое в газетах."
    collocations:
      - "vislumbrar una salida — увидеть выход"
      - "vislumbrar una esperanza — увидеть проблеск надежды"
      - "una pista falsa — ложная зацепка"
    collocation_example: "La policía sigue una pista que puede resolver el caso. — Полиция идёт по следу, который может раскрыть дело."
    trap: "Vislumbrar — «разглядеть слабо»; pista — «след, зацепка» и «трасса, дорожка»: pista de baile — «танцпол»."

  - word: prescindir de alguien
    ru: обойтись без кого-то
    ipa: /pɾesθinˈdiɾ de ˈalɣjen/
    say: прэсинди́р дэ а́льгьен
    pron: "sc читается [sθ]: prescindir — «прэс-син-ди́р»; c перед i в Испании — [θ]."
    meaning: "Отказаться от помощи или присутствия человека или вещи: обойтись без них. Часто — «уволить» (о сотрудниках)."
    examples:
      - "Prescindió de la ayuda de su padre. — Он обошёлся без помощи отца."
      - "Para reducir gastos tras la caída de ventas, la empresa prescindió de diez empleados. — Чтобы сократить расходы после падения продаж, компания избавилась от десяти сотрудников."
      - "No puedo prescindir de mi móvil ni un solo día, porque lo uso para el trabajo y para casi todo. — Я не могу обойтись без телефона ни одного дня, потому что пользуюсь им для работы и почти для всего."
    origin: "Из лат. praescindere «отрезать заранее»: prae- «перед» + scindere «отрезать». Родственные: imprescindible «необходимый», escisión «раскол»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: renunciar a
        pair: ["Prescindió de su ayuda.", "Renunció a su ayuda."]
        diff:
          - "renunciar a — «отказаться» от права или возможности"
          - "prescindir de — «обойтись без», как будто «отрезать» ненужное"
    analogs:
      - "to do without — обойтись без"
      - "to dispense with — отказаться от"
    dialogue:
      - "Ana: ¿Puedes trabajar sin ordenador? | Ты можешь работать без компьютера?"
      - "Pablo: No, no puedo prescindir de él. | Нет, я не могу без него обойтись."
      - "Ana: ¿Ni un día? | Ни одного дня?"
      - "Pablo: Ni medio. Lo uso para el correo, las cuentas y los informes. Sin él, estoy perdido. | Ни половины. Я пользуюсь им для почты, счетов и отчётов. Без него я пропал."
      - "Ana: Yo llevo semanas sin el móvil y sobrevivo. | Я уже несколько недель без телефона и выживаю."
      - "Pablo: Eso es lo que me cuesta creer. ¿Y cómo te organizas? | В это мне трудно поверить. И как ты организуешься?"
      - "Ana: Con una agenda de papel y mucha paciencia. Se puede prescindir de casi todo. | С бумажным ежедневником и большим терпением. Можно обойтись почти без всего."
      - "Pablo: Salvo de las personas queridas. De ellas no se puede prescindir. | Кроме дорогих людей. Без них обойтись нельзя."
    cefr: "C1."
    frequency: "Частое."
    collocations:
      - "prescindir de algo — обойтись без чего-то"
      - "prescindir de alguien — обойтись без кого-то"
      - "prescindir de los servicios de — отказаться от услуг"
    collocation_example: "La empresa prescindió de sus servicios. — Компания отказалась от его услуг."
    trap: "С предлогом de: prescindir DE algo. Не путайте с imprescindible «необходимый» (противоположное). О человеке «prescindir de alguien» может значить «уволить»."

  - word: pesquisas
    ru: поиски, расследование, расспросы
    ipa: /pesˈkisas/
    say: пэски́сас
    pron: "qu перед i — [k]: pesquisas — «пэски́сас»."
    meaning: "Тщательный сбор сведений: полиция, следователь или журналист ведут расследование. Обычно во множественном."
    examples:
      - "Las pesquisas continúan sin resultados. — Поиски продолжаются без результатов."
      - "Después de varios días de pesquisas, los investigadores encontraron el documento que buscaban. — После нескольких дней поисков следователи нашли документ, который искали."
      - "Hizo algunas pesquisas por su cuenta y descubrió que el edificio había pertenecido a una familia noble. — Он провёл собственные разыскания и выяснил, что здание принадлежало знатной семье."
    origin: "От лат. perquirere «тщательно искать» (per- «насквозь» + quaerere «искать»). Родственные: pesquisa, inquirir «разузнавать»."
    register: "Формальное, литературное."
    synonyms:
      - word: investigaciones
        pair: ["Continúan las pesquisas.", "Continúan las investigaciones."]
        diff:
          - "investigaciones — «расследования» и «научные исследования»"
          - "pesquisas — «поиски, розыск», именно полицейские и частные"
    analogs:
      - "inquiries — расспросы, расследования"
      - "investigation — расследование"
    dialogue:
      - "Ana: ¿Qué sabe la policía? | Что знает полиция?"
      - "Pablo: Siguen con las pesquisas. | Продолжают расследование."
      - "Ana: ¿Y hay algo nuevo? | И есть что-нибудь новое?"
      - "Pablo: Poco. Interrogaron a los vecinos, revisaron las cámaras y registraron el almacén. | Мало. Допросили соседей, просмотрели камеры и обыскали склад."
      - "Ana: ¿Ni una pista de su paradero? | Ни одной зацепки о его местонахождении?"
      - "Pablo: Todavía no. Pero las pesquisas continúan y la inspectora no se rinde. | Пока нет. Но расследование продолжается, и инспектор не сдаётся."
      - "Ana: Espero que lo localicen pronto. | Надеюсь, его скоро найдут."
      - "Pablo: Yo también. Cada hora que pasa hace la situación más preocupante. | Я тоже. С каждым часом ситуация всё тревожнее."
    cefr: "C1."
    frequency: "Нечастое: в прозе и новостях."
    collocations:
      - "hacer pesquisas — вести расследование"
      - "las pesquisas policiales — полицейский розыск"
      - "continuar las pesquisas — продолжить поиски"
    collocation_example: "Hizo pesquisas para averiguar quién lo había denunciado. — Он навёл справки, чтобы выяснить, кто на него донёс."
    trap: "Почти всегда во множественном: las pesquisas. Не путайте с pesca «рыбалка» и pesquera «рыбацкий»."
