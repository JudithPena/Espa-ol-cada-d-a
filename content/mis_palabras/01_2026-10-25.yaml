      - "Van a hacer la autopsia mañana. — Вскрытие сделают завтра."
    origin: "Греч. autopsía — «увидеть своими глазами»: autós «сам» + ópsis «зрение». Родственные: óptica, autógrafo."
    register: "Нейтральное, медицинское и юридическое."
    synonyms:
      - word: necropsia
        pair: ["Hicieron la autopsia.", "Hicieron la necropsia."]
        diff:
          - "necropsia — научный термин, чаще о животных"
          - "autopsia — обычное слово"
    analogs:
      - "autopsy / post-mortem — вскрытие"
    dialogue:
      - "Marcos: ¿Qué dice la autopsia? | Что показало вскрытие?"
      - "Forense: Veneno. Sin embargo, todavía no sabemos quién lo puso. | Яд. Однако мы пока не знаем, кто его подсыпал."
    cefr: "B2 — узкое слово из медицины и детективов."
    frequency: "Редкое в быту, частое в детективах и новостях."
    collocations:
      - "hacer la autopsia — проводить вскрытие"
      - "los resultados de la autopsia — результаты вскрытия"
      - "el informe de la autopsia — заключение о вскрытии"
    collocation_example: "El informe de la autopsia llega mañana. — Заключение о вскрытии придёт завтра."
    trap: "autopsia — женского рода: la autopsia. Глагол — hacer или practicar, а не abrir."

  - word: entierro
