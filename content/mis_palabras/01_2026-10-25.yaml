# Первый список автора, 25 октября 2026. Правила — docs/mis_palabras_guide.md.
lang: es
words:
  - word: darse cuenta de
    ru: понять, осознать, заметить
    ipa: /ˈdaɾse ˈkwenta ðe/
    say: да́рсе куэ́нта де
    pron: "ue в cuenta — одним слогом «уэ». d в de после гласной мягкое [ð], почти как th в английском _this_."
    meaning: "Вдруг понять или заметить то, чего раньше не видели. Это возвратный глагол: se меняется по лицам (me doy cuenta, te das cuenta), а перед тем, что заметили, ставится de."
    examples:
      - "Me di cuenta de mi error. — Я понял свою ошибку."
      - "¿Te das cuenta de lo que dices? — Ты понимаешь, что говоришь?"
      - "No se dio cuenta de que la puerta estaba abierta. — Он не заметил, что дверь была открыта."
    origin: "cuenta — «счёт», от contar «считать». Буквально «отдать себе отчёт», как и в русском выражении."
    register: "Нейтральное: подходит и для разговора, и для письма."
    synonyms:
      - word: notar
        pair: ["Me di cuenta de que llovía.", "Noté que llovía."]
        diff:
          - "notar — заметить глазами или на ощупь, без предлога de"
          - "darse cuenta — ещё и «осознать», понять смысл"
    analogs:
      - "to realize — осознать"
      - "to notice — заметить"
    dialogue:
      - "Lucía: ¿Te has dado cuenta de la hora? | Ты заметил, который час?"
      - "Marcos: ¡Uy, no! Tengo que irme. | Ой, нет! Мне пора."
    cefr: "A2 — нужно с первых разговоров, но это возвратный глагол с предлогом."
    frequency: "Одно из самых частых выражений разговорного испанского."
    collocations:
      - "darse cuenta de algo — заметить что-то"
      - "darse cuenta de que… — понять, что…"
      - "sin darse cuenta — сам того не замечая"
      - "¿te das cuenta? — представляешь?"
    collocation_example: "Lo hice sin darme cuenta. — Я сделал это, сам того не заметив."
    trap: "Перед que тоже нужен de: Me di cuenta **de** que… Без de часто говорят, но это ошибка. И не путайте с realizar: это «осуществлять», а не «осознавать»."

  - word: fijarse en
    ru: обратить внимание на, присмотреться
    ipa: /fiˈxaɾse en/
    say: фиха́рсе эн
    pron: "j — хриплое [x], как русское «х», но глубже в горле."
    meaning: "Присмотреться, заметить детали. Повелительное ¡Fíjate! значит ещё «Смотри-ка! Представляешь!»."
    examples:
      - "Fíjate en ese coche. — Посмотри на ту машину."
      - "No me fijé en su cara. — Я не обратил внимания на его лицо."
      - "¡Fíjate, ya son las diez! — Представляешь, уже десять!"
    origin: "От fijar — «закреплять» (лат. fixus «закреплённый»), отсюда же fijo «постоянный». Буквально «закрепить взгляд на чём-то»."
    register: "Нейтральное, очень частое в разговоре. Fíjate или вежливое Fíjese — обычное начало фразы, чтобы привлечь внимание."
    synonyms:
      - word: prestar atención
        pair: ["Fíjate en la pronunciación.", "Presta atención a la pronunciación."]
        diff:
          - "fijarse — присмотреться к детали, коротко"
          - "prestar atención — сосредоточиться надолго, звучит строже"
    analogs:
      - "to notice — заметить"
      - "to pay attention to — быть внимательным к"
    dialogue:
      - "Ana: Fíjate en ese hombre. | Посмотри на того мужчину."
      - "Pablo: ¿Por qué? | Почему?"
      - "Ana: ¿No te das cuenta? ¡Es mi profesor! | Ты что, не видишь? Это мой преподаватель!"
    cefr: "B1 — значение «присматриваться» и управление с en не очевидны для начинающих."
    frequency: "Очень частое в речи, особенно ¡Fíjate!"
    collocations:
      - "fijarse en los detalles — обращать внимание на детали"
      - "fijarse bien — хорошенько присмотреться"
      - "¡fíjate! — представляешь!"
    collocation_example: "Fíjate bien antes de firmar. — Хорошенько посмотри, прежде чем подписывать."
    trap: "Предлог en, а не a: fijarse **en** algo. Не путайте с fijar без se — «закреплять, назначать»: fijar una fecha — назначить дату."

  - word: reconocer a alguien
    ru: узнать кого-то
    ipa: /rekonoˈθeɾ a alˈɣjen/
    say: рэконосэ́р а альгье́н
    pron: "c перед e в Испании — [θ], как th в английском _think_; в Латинской Америке — [s]. r в начале слова раскатистое. В alguien u не читается, а g мягкое [ɣ]."
    meaning: "Узнать знакомого человека, голос или место. Второе значение — признать: ошибку, вину, правду. Форма «я» — reconozco."
    examples:
      - "No te he reconocido con gafas. — Я не узнал тебя в очках."
      - "¿Me reconoces? — Ты меня узнаёшь?"
      - "Reconozco que me equivoqué. — Признаю, что я ошибся."
    origin: "re- «снова» + conocer «знать»: снова узнать того, кого уже знал. Родственные: conocido «знакомый», reconocimiento «узнавание, признание»."
    register: "Нейтральное, годится в любой ситуации."
    synonyms:
      - word: identificar
        pair: ["Reconocí su voz.", "Identifiqué su voz."]
        diff:
          - "identificar — официальнее: «опознать», как в полиции"
          - "reconocer — обычное бытовое «узнать»"
    analogs:
      - "to recognize — узнать"
      - "to admit — признать"
    dialogue:
      - "Lucía: ¿No me reconoces? | Ты меня не узнаёшь?"
      - "Marcos: ¡Perdona! No me había dado cuenta. ¡Lucía! | Прости! Я не сообразил. Лусия!"
    cefr: "A2 — частый глагол, но с неправильной формой reconozco."
    frequency: "Частое и в речи, и в текстах."
    collocations:
      - "reconocer la voz — узнать голос"
      - "reconocer un error — признать ошибку"
      - "reconocer que… — признать, что…"
    collocation_example: "Es difícil reconocer un error. — Трудно признать ошибку."
    trap: "Перед человеком нужен предлог a: Reconocí **a** María. Форма «я» — reconozco, с z, а не reconoco."

  - word: confundirse
    ru: перепутать, ошибиться
    ipa: /koɱfunˈdiɾse/
    say: конфунди́рсе
    meaning: "Ошибиться, перепутать одно с другим. Чем ошиблись, говорят с de: confundirse de número, de calle."
    examples:
      - "Perdón, me he confundido de número. — Простите, я ошибся номером."
      - "Me confundí de calle. — Я перепутал улицу."
      - "Si te confundes, no pasa nada. — Если ошибёшься, ничего страшного."
    origin: "Лат. confundere — «сливать вместе»: con «вместе» + fundere «лить». Отсюда confusión «путаница»; русское «конфуз» — того же корня."
    register: "Нейтральное. Me he confundido звучит мягче, чем He cometido un error."
    synonyms:
      - word: equivocarse
        pair: ["Me he confundido de día.", "Me he equivocado de día."]
        diff:
          - "equivocarse — шире: любая ошибка, в том числе в решении"
          - "confundirse — именно перепутать похожие вещи"
    analogs:
      - "to mix up — перепутать"
      - "to make a mistake — ошибиться"
    dialogue:
      - "A: ¿Diga? | Алло?"
      - "B: ¿Está Carmen? | Кармен дома?"
      - "A: No, se ha confundido de número. | Нет, вы ошиблись номером."
    cefr: "A2 — нужно в быту, но это возвратный глагол с предлогом."
    frequency: "Очень частое в повседневной речи."
    collocations:
      - "confundirse de número — ошибиться номером"
      - "confundirse de persona — обознаться"
      - "confundir A con B — путать A с B"
    collocation_example: "Siempre confundo a los dos hermanos. — Я всегда путаю двух братьев."
    trap: "Без se глагол значит «путать что-то с чем-то»: confundir A **con** B. С se — «ошибиться»: me confundí. Предлог de, а не en: confundirse **de** calle."

  - word: tener sentido
    ru: иметь смысл
    ipa: /teˈneɾ senˈtiðo/
    say: тэнэ́р сэнти́до
    pron: "d между гласными мягкое [ð], почти как th в английском _this_."
    meaning: "Быть логичным и понятным, иметь цель. С инфинитивом — «есть смысл что-то делать»."
    examples:
      - "Ahora todo tiene sentido. — Теперь всё понятно."
      - "Tu idea tiene sentido. — В твоей идее есть смысл."
      - "¿Tiene sentido esperar? — Есть смысл ждать?"
    origin: "sentido — «чувство, смысл», от sentir «чувствовать» (лат. sensus). Родственные: sentimiento «чувство», sensato «благоразумный»."
    register: "Нейтральное."
    synonyms:
      - word: ser lógico
        pair: ["Tiene sentido.", "Es lógico."]
        diff:
          - "ser lógico — суше, только о логике"
          - "tener sentido — ещё и о цели и пользе"
    analogs:
      - "to make sense — иметь смысл (в английском make, а не have)"
    dialogue:
      - "Marcos: ¿Por qué se fue sin decir nada? | Почему он ушёл, ничего не сказав?"
      - "Lucía: No lo sé, pero me he dado cuenta de algo. | Не знаю, но я кое-что заметила."
      - "Marcos: Dime, a ver si tiene sentido. | Скажи, посмотрим, есть ли в этом смысл."
    cefr: "B1 — абстрактное выражение для рассуждений."
    frequency: "Частое в разговоре и в текстах."
    collocations:
      - "tener mucho sentido — быть очень логичным"
      - "tener sentido del humor — иметь чувство юмора"
      - "¿qué sentido tiene? — какой смысл?"
      - "en sentido literal — в буквальном смысле"
    collocation_example: "Mi padre tiene un gran sentido del humor. — У моего отца отличное чувство юмора."
    trap: "Калька с английского hacer sentido — ошибка, правильно tener sentido. И sentido значит ещё «направление»: calle de sentido único — улица с односторонним движением."

  - word: no tener sentido
    ru: не иметь смысла
    ipa: /no teˈneɾ senˈtiðo/
    say: но тэнэ́р сэнти́до
    pron: "d между гласными мягкое [ð], почти как th в английском _this_."
    meaning: "Быть бессмысленным, нелогичным. Это отрицание tener sentido; с инфинитивом — «нет смысла что-то делать»."
    examples:
      - "Esto no tiene sentido. — Это бессмыслица."
      - "No tiene sentido discutir. — Нет смысла спорить."
      - "Lo que dices no tiene ningún sentido. — В том, что ты говоришь, нет никакого смысла."
    origin: "То же sentido. Близкие слова: sin sentido «бессмысленный» и un sinsentido «бессмыслица»."
    register: "Нейтральное. В споре ¡No tiene sentido! звучит резко."
    synonyms:
      - word: ser absurdo
        pair: ["Esto no tiene sentido.", "Esto es absurdo."]
        diff:
          - "ser absurdo — сильнее, с оценкой «нелепо»"
          - "no tener sentido — спокойнее, просто «нелогично»"
    analogs:
      - "it doesn't make sense — это не имеет смысла"
      - "there's no point in… — нет смысла…"
    dialogue:
      - "Lucía: ¿Lo llamo otra vez? | Позвонить ему ещё раз?"
      - "Marcos: No tiene sentido, no va a contestar. | Нет смысла, он не ответит."
    cefr: "B1 — как и tener sentido."
    frequency: "Частое, особенно в спорах и рассуждениях."
    collocations:
      - "no tener ningún sentido — не иметь никакого смысла"
      - "no tiene sentido + инфинитив — нет смысла…"
      - "ya no tiene sentido — уже нет смысла"
    collocation_example: "Ya no tiene sentido esperar. — Уже нет смысла ждать."
    trap: "Двойное отрицание в испанском — норма: No tiene **ningún** sentido, а не No tiene algún sentido."

  - word: parecerse a
    ru: быть похожим на
    ipa: /paɾeˈθeɾse a/
    say: парэсэ́рсэ а
    pron: "c перед e в Испании — [θ], как th в английском _think_; в Латинской Америке — [s]."
    meaning: "Быть похожим на кого-то внешне или характером. Возвратный глагол: me parezco, te pareces. Без se parecer значит «казаться»."
    examples:
      - "Te pareces mucho a tu madre. — Ты очень похож на маму."
      - "Los dos hermanos se parecen. — Братья похожи друг на друга."
      - "Esta ciudad se parece a Barcelona. — Этот город похож на Барселону."
    origin: "Лат. parere — «появляться, показываться». Родственные: aparecer «появляться», parecido «похожий; сходство»."
    register: "Нейтральное."
    synonyms:
      - word: ser parecido a
        pair: ["Se parece a su padre.", "Es parecido a su padre."]
        diff:
          - "ser parecido a — чаще о вещах; о людях звучит книжнее"
    analogs:
      - "to look like — быть похожим внешне"
      - "to take after — пойти в кого-то из родителей"
    dialogue:
      - "Ana: ¿Ese es tu hermano? Os parecéis mucho. | Это твой брат? Вы очень похожи."
      - "Pablo: ¿Tú crees? Yo no me doy cuenta. | Думаешь? Я не замечаю."
    cefr: "A2 — нужно, чтобы описывать людей."
    frequency: "Очень частое."
    collocations:
      - "parecerse mucho a — быть очень похожим на"
      - "no parecerse en nada — совсем не быть похожими"
      - "parecerse en el carácter — быть похожими характером"
    collocation_example: "No nos parecemos en nada. — Мы совсем не похожи."
    trap: "Не путайте с parecer: Me parece bien — «по-моему, хорошо», а Me parezco a ti — «я похож на тебя». Форма «я» — parezco, с z."

  - word: estar seguro de que
    ru: быть уверенным, что
    ipa: /esˈtaɾ seˈɣuɾo ðe ke/
    say: эста́р сэгу́ро дэ кэ
    pron: "g между гласными мягкое [ɣ], почти без смычки. В que u не читается: «кэ»."
    meaning: "Быть уверенным в чём-то. seguro согласуется: estoy segura (о женщине), estamos seguros. Перед существительным — estar seguro de algo."
    examples:
      - "Estoy seguro de que viene. — Я уверен, что он придёт."
      - "¿Estás segura? — Ты уверена?"
      - "No estoy seguro de nada. — Я ни в чём не уверен."
    origin: "Лат. securus: se- «без» + cura «забота», то есть «беззаботный». Поэтому seguro — ещё и «безопасный» и «страховка»."
    register: "Нейтральное."
    synonyms:
      - word: estar convencido de que
        pair: ["Estoy seguro de que tienes razón.", "Estoy convencido de que tienes razón."]
        diff:
          - "convencido — сильнее: «убеждён» после размышлений"
    analogs:
      - "to be sure that — быть уверенным, что"
      - "to be certain — то же, книжнее"
    dialogue:
      - "Marcos: ¿Estás seguro de que es aquí? | Ты уверен, что это здесь?"
      - "Pablo: Sí, me fijé en el número. | Да, я обратил внимание на номер."
      - "Marcos: Pues no tiene sentido, está cerrado. | Тогда странно: закрыто."
    cefr: "A2 — частая конструкция для разговора."
    frequency: "Очень частое."
    collocations:
      - "estar completamente seguro — быть абсолютно уверенным"
      - "no estar seguro de algo — сомневаться в чём-то"
      - "¿seguro? — точно?"
    collocation_example: "¿Seguro que no quieres venir? — Точно не хочешь пойти?"
    trap: "Правильно Estoy seguro **de** que…; без de часто говорят, но это ошибка. Глагол — estar: es seguro значит «это безопасно»."

  - word: tener relación con
    ru: иметь отношение к
    ipa: /teˈneɾ relaˈθjon kon/
    say: тэнэ́р рэласьо́н кон
    pron: "c перед i в Испании — [θ], как th в английском _think_. Ударение в relación — на последнем слоге."
    meaning: "Быть связанным с чем-то или с кем-то. relación — ещё и «отношения» между людьми."
    examples:
      - "Esto no tiene relación con el problema. — Это не имеет отношения к проблеме."
      - "¿Qué relación tiene con la víctima? — Какое отношение он имеет к жертве?"
      - "Tengo buena relación con mis vecinos. — У меня хорошие отношения с соседями."
    origin: "Лат. relatio от referre — «относить, сообщать». Родственные: relacionar «связывать», relato «рассказ»."
    register: "Нейтральное, частое в новостях и детективах."
    synonyms:
      - word: tener que ver con
        pair: ["No tiene relación con el caso.", "No tiene que ver con el caso."]
        diff:
          - "tener que ver — разговорнее и встречается чаще"
          - "tener relación — точнее и официальнее"
    analogs:
      - "to be related to — быть связанным с"
      - "to have to do with — иметь отношение к (разговорное)"
    dialogue:
      - "Inspectora: ¿Usted tiene relación con este hombre? | Вы имеете отношение к этому человеку?"
      - "Testigo: No, no lo reconozco. | Нет, я его не узнаю."
      - "Inspectora: ¿Está seguro? | Вы уверены?"
    cefr: "B1 — абстрактная связь, язык новостей."
    frequency: "Частое в новостях, документах и детективах."
    collocations:
      - "estar relacionado con — быть связанным с"
      - "en relación con — в связи с, относительно"
      - "una relación de pareja — отношения в паре"
    collocation_example: "El robo está relacionado con el crimen. — Кража связана с преступлением."
    trap: "Предлог con, а не a: tener relación **con**. Русское «отношение к» сбивает на ошибку tener relación a."

  - word: prestar atención
    ru: обращать внимание
    ipa: /pɾesˈtaɾ atenˈθjon/
    say: прэста́р атэнсьо́н
    pron: "c перед i в Испании — [θ], как th в английском _think_. Ударение в atención — на последнем слоге."
    meaning: "Внимательно слушать или смотреть, сосредоточиться. На что обращают внимание, говорят с a: prestar atención a algo."
    examples:
      - "Presta atención, por favor. — Будь внимателен, пожалуйста."
      - "No presté atención a la hora. — Я не следил за временем."
      - "Los niños prestan atención al profesor. — Дети внимательно слушают учителя."
    origin: "prestar — «давать взаймы» (лат. praestare): буквально «одолжить внимание». Похоже на английское pay attention — «заплатить вниманием»."
    register: "Нейтральное, чуть строже, чем fijarse; так говорят учителя и пишут в инструкциях."
    synonyms:
      - word: fijarse en
        pair: ["Presta atención a los detalles.", "Fíjate en los detalles."]
        diff:
          - "fijarse — присмотреться к детали, коротко"
          - "prestar atención — сосредоточиться надолго"
    analogs:
      - "to pay attention — обращать внимание"
      - "to listen carefully — внимательно слушать"
    dialogue:
      - "Profesora: ¡Marcos! ¿Me estás prestando atención? | Маркос! Ты меня слушаешь?"
      - "Marcos: Sí, sí. Perdón, me he confundido de página. | Да-да. Простите, я перепутал страницу."
    cefr: "A2 — частое выражение на уроках и в быту."
    frequency: "Частое."
    collocations:
      - "prestar mucha atención — быть очень внимательным"
      - "prestar atención a algo — обращать внимание на что-то"
      - "llamar la atención — привлекать внимание, бросаться в глаза"
    collocation_example: "Ese vestido llama mucho la atención. — Это платье очень бросается в глаза."
    trap: "Предлог a, а не en, как у fijarse en: prestar atención **a** algo. Не говорите dar atención."

  - word: quedarse quieto
    ru: замереть, не двигаться
    ipa: /keˈðaɾse ˈkjeto/
    say: кэда́рсэ кье́то
    pron: "qu читается как «к», u не читается. d в quedarse мягкое [ð]. ie в quieto — одним слогом: «кье»."
    meaning: "Перестать двигаться, застыть. quieto согласуется: quédate quieta (девочке), quedaos quietos (нескольким)."
    examples:
      - "¡Quédate quieto! — Замри!"
      - "El gato se quedó quieto. — Кот замер."
      - "No puedo quedarme quieto. — Я не могу усидеть на месте."
    origin: "quieto — от лат. quietus «спокойный», родственно английскому quiet. Любопытно, что и quedar происходит от лат. quietare «успокаивать». Родственные: inquieto «беспокойный»."
    register: "Нейтральное. Короткое ¡Quieto! — приказ: так говорят полицейские, родители или хозяева собаке."
    synonyms:
      - word: no moverse
        pair: ["Quédate quieto.", "No te muevas."]
        diff:
          - "no te muevas — прямой запрет, частая фраза полиции"
          - "quedarse quieto — ещё и «застыть» от страха или удивления"
    analogs:
      - "to keep still — не двигаться"
      - "to freeze — замереть"
    dialogue:
      - "Lucía: ¡Quédate quieto! Hay una abeja. | Замри! Тут пчела."
      - "Marcos: ¿Dónde? No me he dado cuenta. | Где? Я не заметил."
    cefr: "B1 — возвратный глагол с согласуемым прилагательным."
    frequency: "Частое в быту и в детективах."
    collocations:
      - "quedarse quieto como una estatua — замереть, как статуя"
      - "¡quieto ahí! — стой, где стоишь!"
      - "estarse quieto — сидеть спокойно (о детях)"
    collocation_example: "Niños, estaos quietos un momento. — Дети, посидите спокойно минутку."
    trap: "quieto — «неподвижный», а не «тихий»: тихий — tranquilo или silencioso. Не путайте с quedarse callado — «замолчать»."

  - word: de todas formas
    ru: в любом случае, всё равно
    ipa: /de ˈtoðas ˈfoɾmas/
    say: дэ то́дас фо́рмас
    pron: "d в todas мягкое [ð], почти как th в английском _this_."
    meaning: "Всё равно, в любом случае. Так подводят итог или возвращаются к главному после отступления."
    examples:
      - "De todas formas, gracias. — В любом случае спасибо."
      - "No sé si puedo, pero de todas formas te llamo. — Не знаю, смогу ли, но всё равно тебе позвоню."
    origin: "forma — «способ»: буквально «всеми способами». Те же значения у de todas maneras и de todos modos."
    register: "Разговорное и нейтральное."
    synonyms:
      - word: de todos modos
        pair: ["De todas formas, te llamo.", "De todos modos, te llamo."]
        diff:
          - "de todos modos — то же самое, чуть книжнее"
          - "de todas maneras — тоже полный синоним"
    analogs:
      - "anyway — в любом случае"
      - "in any case — то же, книжнее"
    dialogue:
      - "Ana: No sé si llego a tiempo. | Не знаю, успею ли."
      - "Pablo: No pasa nada. De todas formas, avísame. | Ничего страшного. В любом случае предупреди меня."
    cefr: "B1 — связка для разговора и рассуждений."
    frequency: "Очень частое в разговоре."
    collocations:
      - "pero de todas formas — но всё равно"
      - "gracias de todas formas — всё равно спасибо"
      - "de cualquier forma — так или иначе"
    collocation_example: "Gracias de todas formas. — Всё равно спасибо."
    trap: "Нельзя en todas formas — только de. И не путайте с sin embargo: sin embargo противопоставляет («однако»), а de todas formas значит «всё равно»."

  - word: sin embargo
    ru: однако
    ipa: /sin emˈbaɾɣo/
    say: син эмба́рго
    pron: "Слова сливаются: «синэмба́рго». g после r мягкое [ɣ]."
    meaning: "Однако, тем не менее. Противопоставляет вторую мысль первой."
    examples:
      - "Es caro; sin embargo, lo compro. — Это дорого, однако я это покупаю."
      - "Estudió mucho y, sin embargo, suspendió. — Он много занимался и тем не менее провалился."
    origin: "embargo — «помеха, запрет» (отсюда и «эмбарго»), от embargar «препятствовать». Буквально «без помехи»: сказанное раньше не мешает тому, что дальше."
    register: "Нейтральное, немного книжное. В разговоре чаще говорят просто pero."
    synonyms:
      - word: no obstante
        pair: ["Llovía; sin embargo, salimos.", "Llovía; no obstante, salimos."]
        diff:
          - "no obstante — ещё книжнее, в официальных текстах"
          - "pero — проще и разговорнее"
    analogs:
      - "however — однако"
      - "nevertheless — тем не менее"
    dialogue:
      - "Marcos: El plan tiene sentido. | План логичный."
      - "Lucía: Sí; sin embargo, no estoy segura de que funcione. | Да, однако я не уверена, что он сработает."
    cefr: "A2 — главная связка «однако», её учат рано."
    frequency: "Очень частое в письменной речи и новостях, в разговоре реже."
    collocations:
      - "y, sin embargo, … — и тем не менее…"
      - "sin embargo, hay que… — однако нужно…"
      - "pero, sin embargo — (разговорное, лишнее) но однако"
    collocation_example: "Llovía; sin embargo, salimos a pasear. — Шёл дождь, однако мы пошли гулять."
    trap: "Пишется раздельно: sin embargo. После него ставится запятая. Pero sin embargo — повтор, лучше одно из двух."

  - word: quizá
    ru: возможно (tal vez)
    ipa: /kiˈθa/
    say: киса́
    pron: "qu читается как «к». z в Испании — [θ], как th в английском _think_. Ударение на последнем слоге. Вариант quizás (с s) тоже правильный."
    meaning: "Возможно, может быть. То же значит tal vez. Если сомнение большое, после них ставят subjuntivo: Quizá venga."
    examples:
      - "Quizá llueva mañana. — Возможно, завтра будет дождь."
      - "Tal vez tienes razón. — Может быть, ты прав."
      - "¿Vienes? Quizás. — Придёшь? Может быть."
    origin: "От старинного qui sabe — «кто знает». tal vez — буквально «такой раз»."
    register: "Нейтральное. tal vez чуть книжнее; в разговоре часто говорят a lo mejor."
    synonyms:
      - word: a lo mejor
        pair: ["Quizá viene mañana.", "A lo mejor viene mañana."]
        diff:
          - "a lo mejor — разговорное, и после него всегда обычный индикатив"
    analogs:
      - "maybe — может быть (разговорное)"
      - "perhaps — возможно (книжнее)"
    dialogue:
      - "Ana: ¿Vamos al cine esta noche? | Пойдём сегодня вечером в кино?"
      - "Pablo: Quizá. De todas formas, te llamo luego. | Может быть. В любом случае позвоню тебе позже."
    cefr: "A2 — частое слово, но с тонкостью про subjuntivo."
    frequency: "Очень частое."
    collocations:
      - "quizá sí, quizá no — может, да, может, нет"
      - "quizá más tarde — может, позже"
      - "tal vez otro día — может, в другой день"
    collocation_example: "Hoy no puedo, tal vez otro día. — Сегодня не могу, может, в другой день."
    trap: "tal vez пишется раздельно, не talvez. После quizá subjuntivo показывает больше сомнения: Quizá venga — «может, и придёт»; Quizá viene — «наверное, придёт»."

  - word: cualquiera
    ru: кто угодно, любой
    ipa: /kwalˈkjeɾa/
    say: куалькье́ра
    pron: "cu читается «ку» [kw], а в qu u не читается [k]. Ударение на ie."
    meaning: "Кто угодно, любой. Перед существительным сокращается до cualquier: cualquier persona, cualquier día. После существительного — «заурядный»: un día cualquiera."
    examples:
      - "Cualquiera puede hacerlo. — Это может сделать кто угодно."
      - "Ven cualquier día. — Приходи в любой день."
      - "No es un libro cualquiera. — Это не какая-нибудь обычная книга."
    origin: "cual «какой» + quiera от querer «хотеть»: «какой захочешь». Множественное — cualesquiera, редкое и книжное."
    register: "Нейтральное. ¡Cualquiera sabe! — разговорное «кто его знает!»."
    synonyms:
      - word: todo el mundo
        pair: ["Cualquiera lo sabe.", "Todo el mundo lo sabe."]
        diff:
          - "todo el mundo — все без исключения"
          - "cualquiera — любой, неважно кто"
    analogs:
      - "anyone — кто угодно"
      - "any — любой"
    dialogue:
      - "Marcos: ¿Quién ha podido hacer esto? | Кто мог это сделать?"
      - "Inspectora: Cualquiera. Por eso hay que prestar atención a todo. | Кто угодно. Поэтому нужно обращать внимание на всё."
    cefr: "A2 — частое слово с сокращённой формой cualquier."
    frequency: "Частое."
    collocations:
      - "cualquier cosa — что угодно"
      - "en cualquier caso — в любом случае"
      - "cualquier día — в любой день"
    collocation_example: "Si necesitas cualquier cosa, llámame. — Если что-нибудь понадобится, звони."
    trap: "Перед существительным — без a: cualquier persona, а не cualquiera persona. Ударение на ie, а не на a."

  - word: por cierto
    ru: кстати
    ipa: /poɾ ˈθjeɾto/
    say: пор сье́рто
    pron: "c перед i в Испании — [θ], как th в английском _think_; в Латинской Америке — [s]."
    meaning: "Кстати, между прочим. Так вводят новую тему или деталь, которая вдруг вспомнилась."
    examples:
      - "Por cierto, ¿has visto a Ana? — Кстати, ты видел Ану?"
      - "Me encanta tu casa. Por cierto, ¿dónde está el baño? — Мне нравится твой дом. Кстати, где туалет?"
    origin: "cierto — «верный, точный» (лат. certus). Буквально «наверняка», но значение давно сместилось к «кстати». Родственные: certeza «уверенность», acertar «угадать»."
    register: "Разговорное и нейтральное, годится и в письме."
    synonyms:
      - word: a propósito
        pair: ["Por cierto, ¿qué hora es?", "A propósito, ¿qué hora es?"]
        diff:
          - "a propósito — чуть формальнее"
          - "у a propósito есть второе значение — «нарочно»: Lo hizo a propósito."
    analogs:
      - "by the way — кстати"
      - "incidentally — то же, книжнее"
    dialogue:
      - "Ana: Me encantó la fiesta. | Мне очень понравилась вечеринка."
      - "Pablo: Me alegro. Por cierto, ¿quién era ese chico? | Рад. Кстати, кто был тот парень?"
    cefr: "A2 — частое вводное слово."
    frequency: "Очень частое в разговоре и переписке."
    collocations:
      - "¡ah, por cierto! — ах да, кстати!"
      - "es cierto — это правда"
      - "lo cierto es que… — дело в том, что…"
    collocation_example: "Lo cierto es que no me acuerdo. — Дело в том, что я не помню."
    trap: "Не путайте с por supuesto — «конечно». И cierto перед существительным значит «некий»: cierto día — «однажды»."

  - word: no pasa nada
    ru: ничего страшного
    ipa: /no ˈpasa ˈnaða/
    say: но па́са на́да
    pron: "d в nada мягкое [ð]; в быстрой речи в Испании оно почти пропадает: «на́а»."
    meaning: "Ничего страшного, всё в порядке. Это ответ на извинение или способ успокоить. Буквально «ничего не происходит»."
    examples:
      - "«Perdona, llego tarde». «No pasa nada». — «Прости, я опоздал». «Ничего страшного»."
      - "Tranquila, no pasa nada. — Спокойно, всё в порядке."
      - "¿Qué pasa si no voy? — Что будет, если я не пойду?"
    origin: "pasar — «проходить, происходить», от paso «шаг». Двойное отрицание no… nada — норма испанского."
    register: "Разговорное, очень естественное в Испании."
    synonyms:
      - word: no importa
        pair: ["Perdón. No pasa nada.", "Perdón. No importa."]
        diff:
          - "no importa — «неважно», может звучать чуть холоднее"
          - "no pasa nada — теплее, успокаивает"
    analogs:
      - "no worries / it's okay — ничего страшного"
      - "never mind — неважно"
    dialogue:
      - "Marcos: ¡Uy! Me he confundido de taza. | Ой! Я перепутал чашку."
      - "Lucía: No pasa nada, es igual. | Ничего страшного, без разницы."
    cefr: "A2 — живая разговорная фраза."
    frequency: "Одна из самых частых фраз в Испании."
    collocations:
      - "aquí no pasa nada — тут всё нормально"
      - "¿qué pasa? — что случилось? или «как дела?» между друзьями"
      - "no pasa nada si… — ничего страшного, если…"
    collocation_example: "No pasa nada si llegas un poco tarde. — Ничего страшного, если немного опоздаешь."
    trap: "Порядок слов — no pasa nada, без no фраза Nada pasa звучит книжно. ¿Qué pasa? между друзьями — не тревога, а приветствие «как дела?»."

  - word: "¿Te apetece?"
    ru: хочешь? (тебе хочется?)
    ipa: /te apeˈteθe/
    say: тэ апэтэ́сэ
    pron: "c перед e в Испании — [θ], как th в английском _think_."
    meaning: "Хочется ли тебе? Устроено как gustar: «тебе (te) хочется (apetece) что-то». Если хочется нескольких вещей — apetecen."
    examples:
      - "¿Te apetece un café? — Хочешь кофе?"
      - "No me apetece salir hoy. — Мне не хочется сегодня выходить."
      - "¿Os apetece ir a la playa? — Вам хочется пойти на пляж?"
    origin: "Лат. appetere — «стремиться к» (ad + petere «просить»). Родственные: apetito «аппетит», apetecible «заманчивый»."
    register: "Разговорное, очень типичное для Испании. В Латинской Америке так почти не говорят: там ¿Quieres…? или в Мексике ¿Se te antoja?"
    synonyms:
      - word: "¿Quieres?"
        pair: ["¿Te apetece un té?", "¿Quieres un té?"]
        diff:
          - "quieres — прямее"
          - "te apetece — мягче: «есть ли настроение»"
    analogs:
      - "do you fancy…? — точный британский аналог"
      - "would you like…? — вежливее"
    dialogue:
      - "Pablo: ¿Te apetece cenar fuera? | Хочешь поужинать где-нибудь?"
      - "Ana: ¡Sí! Por cierto, ¿invitas tú? | Да! Кстати, ты угощаешь?"
    cefr: "A2 — частая фраза, устроенная как gustar."
    frequency: "Очень частое в Испании."
    collocations:
      - "me apetece mucho — мне очень хочется"
      - "no me apetece nada — мне совсем не хочется"
      - "¿te apetece + инфинитив? — хочешь…?"
      - "lo que te apetezca — что захочешь"
    collocation_example: "Haz lo que te apetezca. — Делай, что хочешь."
    trap: "Это как gustar: me apetece — «мне хочется», а не yo apetezco. Если хочется нескольких вещей — apetecen: Me apetecen unas patatas."

  - word: pasarlo bien
    ru: хорошо провести время
    ipa: /paˈsaɾlo ˈβjen/
    say: паса́рло бье́н
    pron: "b после гласной мягкое [β]: губы смыкаются не полностью."
    meaning: "Хорошо провести время, повеселиться. lo не меняется: lo pasé bien, lo pasamos genial. Обратное — pasarlo mal."
    examples:
      - "¡Que lo pases bien! — Хорошо тебе провести время!"
      - "Lo pasamos genial en la fiesta. — Мы отлично повеселились на вечеринке."
      - "Lo pasé fatal en el examen. — На экзамене мне было ужасно."
    origin: "pasar «проводить время» + lo, то есть «это время». Как русское «провести время»."
    register: "Разговорное, очень типичное для Испании. В Латинской Америке говорят pasarla bien — с la."
    synonyms:
      - word: divertirse
        pair: ["Lo pasé bien.", "Me divertí."]
        diff:
          - "divertirse — именно «веселиться»"
          - "pasarlo bien — шире: «было хорошо, приятно»"
    analogs:
      - "to have a good time — хорошо провести время"
      - "to have fun — веселиться"
    dialogue:
      - "Lucía: ¿Qué tal el viaje? | Как поездка?"
      - "Marcos: Lo pasamos muy bien. Por cierto, te he traído algo. | Мы отлично провели время. Кстати, я тебе кое-что привёз."
    cefr: "A2 — частое разговорное выражение."
    frequency: "Очень частое."
    collocations:
      - "pasarlo genial — отлично провести время"
      - "pasarlo fatal — ужасно провести время"
      - "¡que lo pases bien! — желаю хорошо провести время!"
    collocation_example: "¡Que lo paséis bien en Madrid! — Хорошо вам провести время в Мадриде!"
    trap: "Не забывайте lo: Lo pasé bien, а не Pasé bien. lo ни с чем не согласуется: всегда lo."

  - word: tener prisa
    ru: спешить
    ipa: /teˈneɾ ˈpɾisa/
    say: тэнэ́р при́са
    meaning: "Торопиться. Буквально «иметь спешку». «Поторопись!» — ¡Date prisa!"
    examples:
      - "Lo siento, tengo prisa. — Простите, я спешу."
      - "No tengo prisa. — Я не тороплюсь."
      - "¡Date prisa, que perdemos el tren! — Поторопись, а то опоздаем на поезд!"
    origin: "prisa — от старинного prieto «сжатый, тесный» (лат. pressus «прижатый»): спешка — когда времени тесно."
    register: "Нейтральное."
    synonyms:
      - word: estar apurado
        pair: ["Tengo prisa.", "Estoy apurado."]
        diff:
          - "estar apurado — так говорят в Латинской Америке"
          - "в Испании apurado значит «в затруднении, смущённый»"
    analogs:
      - "to be in a hurry — спешить"
      - "to rush — мчаться, торопить"
    dialogue:
      - "Ana: ¿Te apetece un café? | Хочешь кофе?"
      - "Pablo: Hoy no, tengo mucha prisa. De todas formas, gracias. | Сегодня нет, очень спешу. Всё равно спасибо."
    cefr: "A2 — бытовое выражение с tener."
    frequency: "Очень частое."
    collocations:
      - "tener mucha prisa — очень спешить"
      - "darse prisa — поторопиться"
      - "sin prisa — не спеша"
      - "a toda prisa — второпях"
    collocation_example: "Lo hice a toda prisa. — Я сделал это второпях."
    trap: "prisa — женского рода, поэтому tengo **mucha** prisa, а не mucho. Нельзя estoy prisa: только tener prisa."

  - word: estar lleno de
    ru: быть полным (чего-то)
    ipa: /esˈtaɾ ˈʎeno ðe/
    say: эста́р йе́но дэ
    pron: "ll почти во всей Испании звучит как «й» [ʝ]; старое произношение [ʎ] — как мягкое «ль». В Аргентине — «ш»."
    meaning: "Быть полным чего-то, заполненным. lleno согласуется: la sala está llena. После еды Estoy lleno значит «Я наелся»."
    examples:
      - "La calle está llena de gente. — Улица полна людей."
      - "El vaso está lleno. — Стакан полный."
      - "¿Más? No, gracias, estoy llena. — Ещё? Нет, спасибо, я наелась."
