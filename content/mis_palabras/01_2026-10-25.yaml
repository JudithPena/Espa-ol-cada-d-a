    trap: "de — для состояния (rodeado de árboles), por — когда кто-то окружил действием (rodeado por la policía). Не говорите rodeado con."

  - word: cometer un crimen
    ru: совершить преступление
    ipa: /komeˈteɾ un ˈkɾimen/
    say: комэтэ́р ун кри́мэн
    pron: "Ударение в crimen — на первом слоге. Во множественном числе появляется знак ударения: crímenes."
    meaning: "Совершить тяжкое преступление, обычно убийство. Лёгкое правонарушение — delito."
    examples:
      - "Nadie sabe quién cometió el crimen. — Никто не знает, кто совершил преступление."
      - "La policía busca al hombre que cometió el crimen. — Полиция ищет человека, который совершил преступление."
    origin: "cometer — от лат. committere «соединять, совершать», отсюда же «комитет». crimen — лат. «обвинение, преступление». Родственные: criminal, criminalidad."
    register: "Нейтральное, язык новостей и детективов."
    synonyms:
      - word: cometer un delito
        pair: ["Cometió un crimen.", "Cometió un delito."]
        diff:
          - "delito — любое правонарушение, например кража"
          - "crimen — тяжкое, обычно убийство"
    analogs:
      - "to commit a crime — совершить преступление"
      - "murder — если речь именно об убийстве"
    dialogue:
      - "Inspectora: ¿Dónde estaba usted cuando se cometió el crimen? | Где вы были, когда было совершено преступление?"
      - "Testigo: En casa. No tengo ninguna relación con esto. | Дома. Я не имею к этому никакого отношения."
    cefr: "B1 — тема новостей и детективов."
    frequency: "Частое в новостях, сериалах и детективах."
    collocations:
      - "cometer un error — совершить ошибку"
      - "el lugar del crimen — место преступления"
      - "un crimen perfecto — идеальное преступление"
    collocation_example: "La policía vuelve al lugar del crimen. — Полиция возвращается на место преступления."
    trap: "Глагол cometer, а не hacer: cometer un crimen, cometer un error. И crimen — это тяжкое преступление; «преступность» вообще — la delincuencia."

  - word: veneno
    ru: яд
    ipa: /beˈneno/
    say: бэнэ́но
    pron: "v в испанском читается как b: «бэнэ́но», а не «вэнэно»."
    meaning: "Яд, отрава: в химии, у змей и в переносном смысле. Прилагательное — venenoso «ядовитый»."
    examples:
      - "El veneno estaba en el café. — Яд был в кофе."
      - "Esta serpiente tiene mucho veneno. — У этой змеи много яда."
      - "Para mí el azúcar es un veneno. — Для меня сахар просто отрава."
    origin: "Лат. venenum — сначала «любовное зелье», связано с Venus. Родственные: envenenar «отравить», venenoso «ядовитый»."
    register: "Нейтральное."
    synonyms:
      - word: sustancia tóxica
        pair: ["Había veneno en el vaso.", "Había una sustancia tóxica en el vaso."]
        diff:
          - "sustancia tóxica — научно, в новостях и инструкциях"
          - "veneno — бытовое, часто с намерением отравить"
    analogs:
      - "poison — яд вообще"
      - "venom — яд змей и насекомых"
    dialogue:
      - "Inspectora: Fíjese en la taza. | Обратите внимание на чашку."
      - "Forense: Sí, aquí hay veneno. Lo veremos en la autopsia. | Да, тут яд. Посмотрим на вскрытии."
    cefr: "B1 — тематическое слово."
    frequency: "Средняя: детективы, природа, новости."
    collocations:
      - "veneno de serpiente — змеиный яд"
      - "envenenar a alguien — отравить кого-то"
      - "una seta venenosa — ядовитый гриб"
    collocation_example: "Lo envenenaron con arsénico. — Его отравили мышьяком."
    trap: "veneno — мужского рода: el veneno. Пишется с v, хотя звучит как b."

  - word: autopsia
    ru: вскрытие
    ipa: /awˈtopsja/
    say: ауто́псья
    pron: "au — один слог «ау». Ударение на o, а ia в конце — одним слогом «сья»."
    meaning: "Медицинское исследование тела умершего, чтобы узнать причину смерти."
    examples:
