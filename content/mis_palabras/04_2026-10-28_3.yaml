# Третий список автора, часть 6 — «Desconcierto en el hospital», глава 2 (слова 29–41).
lang: es
words:
  - word: traba
    ru: препятствие, помеха
    ipa: /ˈtɾaβa/
    say: тра́ба
    pron: "b между гласными мягкая [β]."
    meaning: "То, что мешает или тормозит дело: бюрократическое препятствие, условие, запрет. Обычно во множественном: trabas."
    examples:
      - "No hay trabas para entrar. — Для входа нет препятствий."
      - "Para darme el permiso de obra en la casa, me pusieron muchas trabas. — Чтобы выдать мне разрешение на ремонт в доме, мне чинили много препятствий."
      - "La falta de dinero fue la mayor traba para abrir el negocio en el centro de la ciudad. — Нехватка денег была главным препятствием для открытия бизнеса в центре города."
    origin: "От trabar «скреплять, мешать» (лат. trabs «балка»): «то, что перегораживает путь, как балка»."
    register: "Нейтральное."
    synonyms:
      - word: obstáculo
        pair: ["Había muchas trabas.", "Había muchos obstáculos."]
        diff:
          - "obstáculo — любая преграда, и физическая, и нет"
          - "traba — чаще искусственное препятствие: правила, бюрократия"
    analogs:
      - "obstacle — препятствие"
      - "hurdle — барьер, помеха"
    dialogue:
      - "Ana: ¿Ya tienes el permiso? | У тебя уже есть разрешение?"
      - "Pablo: No, ponen muchas trabas. | Нет, ставят много препятствий."
      - "Ana: ¿Qué te piden ahora? | Что они требуют теперь?"
      - "Pablo: Un papel que no existe. Cuando lo consigo, me piden otro. | Бумагу, которой не существует. Только достану — просят другую."
      - "Ana: Qué trámite burocrático tan pesado. | Какая тяжёлая бюрократическая волокита."
      - "Pablo: Lo peor es que cada funcionario dice una cosa distinta. Es un follón. | Хуже всего, что каждый чиновник говорит своё. Сплошная неразбериха."
      - "Ana: ¿No hay otra forma? | Другого пути нет?"
      - "Pablo: Quizá mediante un abogado, pero sale caro. | Возможно, через адвоката, но это дорого."
    cefr: "C1."
    frequency: "Частое в новостях и деловых текстах."
    collocations:
      - "poner trabas — чинить препятствия"
      - "sin trabas — без препятствий"
      - "trabas burocráticas — бюрократические препоны"
    collocation_example: "El proyecto avanza sin trabas. — Проект продвигается без препятствий."
    trap: "Почти всегда во множественном: poner trabas, а не «poner traba». Не путайте с trabajo «работа»: слова близки по звучанию, но разные."

  - word: esgrimir
    ru: выдвигать как аргумент; размахивать
    ipa: /esɣɾiˈmiɾ/
    say: эсгрими́р
    pron: "g перед r — мягкое [ɣ]: es-gri-mir."
    meaning: "Привести довод в защиту своей позиции. Буквально — «размахивать оружием, шпагой»."
    examples:
      - "Esgrimió un argumento muy convincente. — Он выдвинул очень убедительный довод."
      - "Nadie pudo contradecirlo en la reunión, porque esgrimió razones de peso para negarse. — Никто не смог ему возразить на собрании, потому что он привёл веские доводы для отказа."
      - "El caballero esgrimió la espada y se preparó para el combate frente al castillo. — Рыцарь взмахнул мечом и приготовился к бою перед замком."
    origin: "От германского skermjan «защищать»; через итальянское schermire «фехтовать». Родственное: esgrima «фехтование»."
    register: "Формальное, книжное."
    synonyms:
      - word: alegar
        pair: ["Esgrimió su edad para no ir.", "Alegó su edad para no ir."]
        diff:
          - "alegar — «приводить в оправдание», нейтральное слово из права"
          - "esgrimir — «использовать как оружие в споре», образнее"
    analogs:
      - "to wield — держать, размахивать"
      - "to put forward an argument — выдвигать довод"
    dialogue:
      - "Ana: ¿Qué argumento usó? | Какой аргумент он использовал?"
      - "Pablo: Esgrimió la falta de tiempo. | Он сослался на нехватку времени."
      - "Ana: ¿Y le creíste? | И ты ему поверил?"
      - "Pablo: No mucho. Tiempo tiene, pero no quiere ayudarnos. | Не очень. Время у него есть, но помогать нам он не хочет."
      - "Ana: ¿Y qué esgrimiste tú? | А что привёл ты?"
      - "Pablo: Que, una vez que el trabajo esté hecho, todos saldremos ganando. | Что когда работа будет сделана, выиграем мы все."
      - "Ana: Un argumento sensato. ¿Asintió? | Разумный довод. Он кивнул?"
      - "Pablo: Ni siquiera me miró. Se retiró a su despacho sin decir nada. | Даже не посмотрел. Ушёл к себе в кабинет, ничего не сказав."
    cefr: "C1."
    frequency: "Частое в газетах и политике."
    collocations:
      - "esgrimir un argumento — выдвинуть довод"
      - "esgrimir razones — приводить причины"
      - "esgrimir una excusa — привести отговорку"
    collocation_example: "Esgrimió una excusa poco creíble. — Он привёл малоправдоподобную отговорку."
    trap: "Слово чаще в газетном языке: в разговоре скажут «dar como excusa», «decir que». Корень один с esgrima «фехтование»."

  - word: carácter absorbente
    ru: властный, подавляющий характер
    ipa: /kaˈɾakteɾ aβsoɾˈβente/
    say: кара́ктэр абсорбэ́нтэ
    pron: "Ударение на ra: carácter; но во множественном — caracteres, с ударением на te."
    meaning: "Характер человека, который отнимает много внимания и времени у других и не оставляет им свободы."
    examples:
      - "Su madre era absorbente y controladora. — Её мать была властной и всё контролировала."
      - "No soporta que salgas sin él, porque tiene un carácter absorbente. — Он не выносит, когда ты выходишь без него, потому что у него властный характер."
      - "Una pareja de carácter absorbente puede acabar con la libertad y los amigos de la otra persona. — Партнёр с подавляющим характером может лишить другого свободы и друзей."
    origin: "carácter — от греч. kharakter «отпечаток, особенность». absorbente — от absorber «впитывать»: человек как губка, который «впитывает» время и силы других."
    register: "Нейтральное, из психологии и литературы."
    synonyms:
      - word: posesivo
        pair: ["Es un hombre absorbente.", "Es un hombre posesivo."]
        diff:
          - "posesivo — «собственник», который ревнует и считает человека своим"
          - "absorbente — отнимает силы и время, не оставляя места другим"
    analogs:
      - "overbearing — властный, подавляющий"
      - "clingy — «прилипчивый», слишком зависимый"
    dialogue:
      - "Ana: ¿Por qué se separaron los vecinos? | Почему расстались соседи?"
      - "Pablo: Ella tenía un carácter absorbente. | У неё был властный характер."
      - "Ana: ¿Qué quieres decir? | Что ты имеешь в виду?"
      - "Pablo: Que quería controlarlo todo: su horario, sus amigos, hasta su agenda. | Что она хотела контролировать всё: его график, друзей, даже его ежедневник."
      - "Ana: Qué agobio. | Какая духота."
      - "Pablo: Sí. Él se sentía sin aire y poco a poco dejó de contestar sus llamadas. | Да. Он чувствовал, что задыхается, и понемногу перестал отвечать на её звонки."
      - "Ana: ¿Y ella no lo vio venir? | А она не предвидела?"
      - "Pablo: Nunca. Ahora dice que él la abandonó sin motivo. | Никогда. Теперь говорит, что он бросил её без причины."
    cefr: "C1."
    frequency: "Нечастое: в описаниях людей и психологии."
    collocations:
      - "un trabajo absorbente — работа, отнимающая всё время"
      - "una madre absorbente — властная мать"
      - "personalidad absorbente — подавляющая личность"
    collocation_example: "Su trabajo es muy absorbente y casi no tiene tiempo libre. — Его работа отнимает всё время, и у него почти нет свободного времени."
    trap: "Absorbente — и «впитывающий» (papel absorbente — «бумажное полотенце»), и «властный» (о человеке, о работе). Carácter — мужского рода: el carácter."

  - word: consecuencia nefasta
    ru: пагубное последствие
    ipa: /konseˈkwenθja neˈfasta/
    say: консэкуэ́нсья нэфа́ста
    pron: "ue — один слог «уэ»; c перед i в Испании — [θ]."
    meaning: "Очень плохое, вредное последствие. Nefasto — «зловещий, пагубный»."
    examples:
      - "Fue una consecuencia nefasta para todos. — Это было пагубное последствие для всех."
      - "Fue una decisión nefasta, y todavía hoy sufrimos las consecuencias en la economía. — Это было пагубное решение, и до сих пор мы расплачиваемся за него в экономике."
      - "El abandono tuvo consecuencias nefastas para toda la comarca, que perdió la mitad de sus habitantes. — Запустение имело пагубные последствия для всего района, который потерял половину жителей."
    origin: "consecuencia — от лат. consequentia «последствие» (con- + sequi «следовать»). nefasto — от лат. nefastus «нечестивый, несчастливый»: дни, когда нельзя было вершить дела."
    register: "Формальное, книжное."
    synonyms:
      - word: funesto
        pair: ["Tuvo un efecto nefasto.", "Tuvo un efecto funesto."]
        diff:
          - "funesto — ещё мрачнее, почти «роковой», связан со смертью"
          - "nefasto — пагубный, очень вредный"
    analogs:
      - "dire consequence — тяжёлое последствие"
      - "disastrous — катастрофический, пагубный"
    dialogue:
      - "Ana: ¿Qué pasó después? | Что было потом?"
      - "Pablo: Hubo consecuencias nefastas para todos. | Были пагубные последствия для всех."
      - "Ana: ¿Como cuáles? | Какие, например?"
      - "Pablo: La empresa perdió a sus mejores clientes y mucha gente se quedó sin sueldo. | Фирма потеряла лучших клиентов, и многие остались без зарплаты."
      - "Ana: ¡Qué desgracia! ¿Por culpa de qué? | Какое несчастье! Из-за чего?"
      - "Pablo: De una mala gestión y de varias decisiones precipitadas. | Из-за плохого управления и нескольких поспешных решений."
      - "Ana: Una sola decisión fatal puede tener consecuencias nefastas. | Одно роковое решение может иметь пагубные последствия."
      - "Pablo: Exacto. Por eso hay que reflexionar antes de actuar. | Именно. Поэтому надо думать, прежде чем действовать."
    cefr: "C1."
    frequency: "Частое в новостях и прозе."
    collocations:
      - "tener consecuencias nefastas — иметь пагубные последствия"
      - "un efecto nefasto — пагубный эффект"
      - "una influencia nefasta — дурное влияние"
    collocation_example: "Esa política tuvo efectos nefastos para la economía. — Эта политика пагубно повлияла на экономику."
    trap: "Consecuencia — женского рода: la consecuencia, поэтому nefasta, а не nefasto. Не путайте с consecuente «последовательный»."

  - word: de hecho
    ru: на самом деле, фактически
    ipa: /de ˈetʃo/
    say: дэ э́чо
    pron: "h не читается; ch — «ч»: hecho — «э́чо»."
    meaning: "Подтверждает или уточняет сказанное: «и правда», «собственно говоря». Часто вводит факт, который усиливает мысль."
    examples:
      - "De hecho, ya lo sabía. — На самом деле, я уже знал."
      - "Me ayuda a concentrarme cuando estudio; no me molesta el ruido, de hecho. — Он помогает мне сосредоточиться, когда я учусь; шум мне, по правде говоря, не мешает."
      - "Es muy tranquilo; de hecho, casi no habla en las reuniones y casi nadie lo nota. — Он очень спокойный: на самом деле почти не говорит на собраниях, и почти никто этого не замечает."
    origin: "hecho — причастие от hacer «делать», в значении «факт, свершившееся». Дословно «из факта»: «исходя из того, что есть»."
    register: "Нейтральное, годится везде."
    synonyms:
      - word: en realidad
        pair: ["De hecho, no vino.", "En realidad, no vino."]
        diff:
          - "en realidad — часто противопоставляет: «а вот на самом деле»"
          - "de hecho — подтверждает и усиливает: «действительно, и вот что»"
    analogs:
      - "in fact — на самом деле"
      - "actually — на самом деле (чаще с оттенком поправки)"
    dialogue:
      - "Ana: ¿Conoces a Marta? | Ты знаешь Марту?"
      - "Pablo: Sí, de hecho, trabajamos juntos. | Да, на самом деле мы работаем вместе."
      - "Ana: ¡Qué casualidad! ¿Desde cuándo? | Какое совпадение! С каких пор?"
      - "Pablo: Desde hace dos años. De hecho, fue ella quien me recomendó para el puesto. | Уже два года. Более того, именно она порекомендовала меня на эту должность."
      - "Ana: ¿Y cómo es? | А какая она?"
      - "Pablo: Muy concienzuda y de carácter fuerte. Sin embargo, tiene mucha ternura. | Очень добросовестная и с сильным характером. Но при этом очень нежная."
      - "Ana: Me cae bien solo por lo que cuentas. | Она мне нравится уже по твоим рассказам."
      - "Pablo: Pues, de hecho, el sábado hay una cena en su casa. ¿Te apetece venir? | Ну, на самом деле в субботу ужин у неё дома. Хочешь прийти?"
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "de hecho — на самом деле"
      - "de hecho y de derecho — фактически и юридически"
      - "un hecho — факт"
    collocation_example: "De hecho, ayer hablé con él. — Я как раз вчера с ним разговаривал."
    trap: "Ложный друг английского actually: англ. actually часто поправляет («а на самом деле — нет»), а de hecho чаще подтверждает: «и действительно»."

  - word: obedecer
    ru: слушаться, повиноваться
    ipa: /oβeðeˈθeɾ/
    say: обэдэсэ́р
    pron: "c перед e в Испании — [θ]; после -ec- в yo — obedezco: c → zc."
    meaning: "Делать то, что велят: родителям, закону, приказу. Obedecer a alguien — «слушаться кого-то»."
    examples:
      - "Los soldados obedecen las órdenes del capitán. — Солдаты выполняют приказы капитана."
      - "Aunque a veces parezcan exageradas, hay que obedecer las normas de seguridad. — Даже если иногда они кажутся преувеличенными, нужно соблюдать правила безопасности."
      - "El perro obedeció la orden de su dueño y se sentó sin mover un solo músculo. — Собака выполнила команду хозяина и села, не шевельнув ни мускулом."
    origin: "Из лат. oboedire «слушаться»: ob- «к» + audire «слышать». Родственные: obediencia «послушание», audio «звук»."
    register: "Нейтральное."
    synonyms:
      - word: acatar
        pair: ["Obedeció la orden.", "Acató la orden."]
        diff:
          - "acatar — «подчиниться власти или закону», формальнее"
          - "obedecer — общее «слушаться»"
    analogs:
      - "to obey — слушаться"
      - "to comply with — выполнять, соблюдать"
    dialogue:
      - "Ana: ¿Tu hijo te hace caso? | Твой сын тебя слушается?"
      - "Pablo: Casi nunca me obedece. | Почти никогда не слушается."
      - "Ana: ¿Y con su madre? | А с мамой?"
      - "Pablo: Con ella tampoco. Aunque con su abuelo sí, y es el único que lo regaña. | И с ней нет. Но дедушку слушается, и тот единственный, кто ругает."
      - "Ana: Siempre pasa lo mismo. Los abuelos tienen autoridad sin esfuerzo. | Всегда так. У дедушек авторитет без усилий."
      - "Pablo: Y mucha paciencia. Yo me pongo nervioso enseguida. | И много терпения. А я сразу нервничаю."
      - "Ana: Haz como él: sin gritos, con firmeza. | Делай как он: без криков, но твёрдо."
      - "Pablo: Lo intento. Pero obedecer no es su fuerte. | Пытаюсь. Но послушание — не его сильная сторона."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "obedecer a alguien — слушаться кого-то"
      - "obedecer una orden — выполнить приказ"
      - "obedecer a una causa — быть вызванным причиной"
    collocation_example: "El perro obedece cuando lo llamas. — Собака слушается, когда ты её зовёшь."
    trap: "Нужен предлог a перед человеком: obedecer a mi madre. Спрягается как conocer: obedezco, obedeces. Ещё «obedecer a» — «быть вызванным чем-то»: El retraso obedece a la lluvia."

  - word: ni siquiera
    ru: даже не
    ipa: /ni siˈkjeɾa/
    say: ни сикье́ра
    pron: "qu перед i — [k]; ie — один слог «ье»."
    meaning: "Усиливает отрицание: «не только не… но и… даже не». Ставится перед тем, чего не произошло."
    examples:
      - "No tengo ni siquiera un euro. — У меня нет даже одного евро."
      - "Ayer, cuando salió de la oficina, no me dijo ni siquiera adiós. — Вчера, когда он выходил из офиса, он даже не попрощался со мной."
      - "Ni siquiera lo intentó, y por eso nadie entiende por qué se queja ahora de los resultados. — Он даже не пытался, и поэтому никто не понимает, почему он теперь жалуется на результаты."
    origin: "ni «ни» + siquiera «хотя бы». От si «если» + quiera (subjuntivo от querer): «если даже ты хочешь»."
    register: "Нейтральное."
    synonyms:
      - word: ni tan solo
        pair: ["Ni siquiera llamó.", "Ni tan solo llamó."]
        diff:
          - "ni tan solo — более книжный, редкий вариант"
    analogs:
      - "not even — даже не"
      - "not so much as — даже не"
    dialogue:
      - "Ana: ¿Te dio las gracias? | Он тебя поблагодарил?"
      - "Pablo: Ni siquiera me miró. | Даже не посмотрел на меня."
      - "Ana: ¡Qué falta de educación! ¿Y eso que le ayudaste todo el día? | Какая невоспитанность! И это после того, как ты помогал ему целый день?"
      - "Pablo: Ni siquiera se despidió. Se retiró a su cuarto y cerró la puerta. | Он даже не попрощался. Ушёл к себе и закрыл дверь."
      - "Ana: A mí me daría rabia. | Меня бы это разозлило."
      - "Pablo: Al principio sí. Pero luego pensé: quizá tenía problemas. | Сначала да. Но потом я подумал: возможно, у него проблемы."
      - "Ana: Eres muy comprensivo. Yo no tendría tanta paciencia. | Ты очень понимающий. У меня бы не хватило терпения."
      - "Pablo: Pues ni siquiera se lo voy a reprochar. | Так что я даже не буду его упрекать."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "ni siquiera + глагол — даже не…"
      - "ni siquiera uno — даже ни одного"
      - "ni siquiera un poco — даже немного"
    collocation_example: "No sabe ni siquiera su dirección. — Он не знает даже свой адрес."
    trap: "Если ni siquiera стоит перед глаголом, no не нужен: Ni siquiera llamó. Если после глагола — no нужен: No llamó ni siquiera una vez."

  - word: echar de menos
    ru: скучать, ощущать нехватку
    ipa: /eˈtʃaɾ de ˈmenos/
    say: эча́р дэ ме́нос
    pron: "ch — «ч»; d между гласными мягкое [ð]."
    meaning: "Скучать по кому-то, чему-то: очень хотеть, чтобы человек или вещь были рядом. Спрягается только echar, de menos не меняется."
    examples:
      - "¿Me has echado de menos? — Ты по мне скучал?"
      - "Los domingos por la tarde, sobre todo, echo de menos a mis padres. — Особенно по воскресным вечерам я скучаю по родителям."
      - "En Madrid echo de menos el mar, y cada verano vuelvo a la costa para pasear por la playa. — В Мадриде мне не хватает моря, и каждое лето я возвращаюсь на побережье погулять по пляжу."
    origin: "Буквально «счесть недостающим»: echar «бросать», de menos «меньше, в недостаче». Отсюда и второе значение — «заметить, что чего-то нет»: Eché de menos las llaves."
    register: "Нейтральное, годится и для разговора, и для письма. Типично для Испании."
    synonyms:
      - word: extrañar
        pair: ["Echo de menos mi casa.", "Extraño mi casa."]
        diff:
          - "extrañar — обычное слово в Латинской Америке"
          - "в Испании extrañar чаще значит «удивлять»: Me extraña. — Меня удивляет."
    analogs:
      - "to miss — то же значение, но miss ещё и «опоздать, промахнуться»"
      - "to long for — сильнее: «тосковать»"
    dialogue:
      - "Ana: ¿Qué tal en Londres? | Как тебе в Лондоне?"
      - "Pablo: Bien, pero echo de menos el sol. | Хорошо, но скучаю по солнцу."
      - "Ana: Aquí hace calor, ¿sabes? De hecho, hoy está soleado. | Тут жарко, знаешь? Вообще-то сегодня солнечно."
      - "Pablo: Qué envidia. Allí llueve cada día y la gente es muy sobria. | Завидую. Там дождь каждый день, а люди очень сдержанные."
      - "Ana: ¿Y echas de menos a la familia? | А по семье скучаешь?"
      - "Pablo: Muchísimo. Sobre todo a mi madre y sus bollos de los domingos. | Очень. Особенно по маме и её воскресным булочкам."
      - "Ana: ¡Y nosotros te echamos de menos a ti! | А мы скучаем по тебе!"
      - "Pablo: Pronto vuelvo. Quedamos en vernos en agosto, ¿vale? | Скоро вернусь. Давай договоримся увидеться в августе, хорошо?"
    cefr: "A2."
    frequency: "Очень частое в разговоре и переписке, особенно в Испании."
    collocations:
      - "echar mucho de menos — очень скучать"
      - "echar de menos a alguien — скучать по кому-то"
      - "se te echa de menos — по тебе скучают"
    collocation_example: "Te echo mucho de menos. — Я очень по тебе скучаю."
    trap: "Перед человеком нужен предлог a: Echo de menos **a** mi madre. Не путайте с echar a perder — «испортить»."

  - word: quedar en
    ru: договориться о чём-то (встретиться, сделать)
    ipa: /keˈdaɾ en/
    say: кэда́р эн
    pron: "qu перед e — [k]; d между гласными мягкое [ð]."
    meaning: "Прийти к договорённости: quedar en hacer algo, quedar en encontrarse. Не путайте с quedar «встретиться» и «оставаться»."
    examples:
      - "Quedamos en vernos a las ocho. — Мы договорились встретиться в восемь."
      - "Para confirmar la hora de la reunión de mañana, esta tarde quedó en llamarme. — Чтобы подтвердить время завтрашней встречи, он договорился позвонить мне сегодня днём."
      - "¿En qué quedamos? Primero dices que sí y luego dices que no, y así no se puede. — Так о чём мы договорились? Сначала ты говоришь «да», потом «нет», так нельзя."
    origin: "От quedar «оставаться» (лат. quietare «успокоить»): «остаться при определённом решении». Родственное — quieto «неподвижный»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: acordar
        pair: ["Quedaron en venir pronto.", "Acordaron venir pronto."]
        diff:
          - "acordar — формальное «договориться, постановить»"
          - "quedar en — разговорное, обычное в жизни"
    analogs:
      - "to agree to — договориться о чём-то"
      - "to arrange to — условиться"
    dialogue:
      - "Ana: ¿Quedaste en algo con él? | Вы с ним о чём-то договорились?"
      - "Pablo: Sí, quedamos en llamarnos mañana. | Да, договорились созвониться завтра."
      - "Ana: ¿A qué hora? | В какое время?"
      - "Pablo: Por la tarde, una vez que acabe mi reunión. | Во второй половине дня, когда закончится моя встреча."
      - "Ana: Apúntalo en la agenda, no se te olvide. | Запиши в ежедневник, чтобы не забыть."
      - "Pablo: Ya lo hice. Y quedamos en llevar los papeles, por si hacen falta. | Уже записал. И мы договорились захватить бумаги, на случай если понадобятся."
      - "Ana: Pues entonces, ya está todo claro. | Тогда всё ясно."
      - "Pablo: Sí, aunque con él nunca se sabe. A veces se despista. | Да, хотя с ним никогда не знаешь. Иногда он забывает."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "quedar en hacer algo — договориться что-то сделать"
      - "quedar en que… — договориться, что…"
      - "¿en qué quedamos? — так о чём договоримся?"
    collocation_example: "Quedamos en que yo llamaría primero. — Мы договорились, что сначала позвоню я."
    trap: "С предлогом en: quedar en hacer, quedar en que. Это не то же, что quedar con alguien «встретиться»: quedé con Ana — «я договорился встретиться с Аной»."

  - word: apresurarse a responder
    ru: поспешить ответить
    ipa: /apɾesuˈɾaɾse a responˈdeɾ/
    say: апрэсура́рсэ а рэспондэ́р
    pron: "r в начале responder — раскатистое."
    meaning: "Поспешно, сразу ответить, не раздумывая. Apresurarse a + инфинитив — «поспешить сделать»."
    examples:
      - "Se apresuró a responder al correo. — Он поспешил ответить на письмо."
      - "No te apresures a decidir, que tienes tiempo hasta el viernes para pensarlo bien. — Не торопись с решением, у тебя есть время до пятницы, чтобы хорошо подумать."
      - "El ministro se apresuró a responder a las críticas con una nota de prensa por la tarde. — Министр поспешил ответить на критику пресс-релизом во второй половине дня."
    origin: "От apresurar «ускорять» (из a- + presura «спешка», от prisa «спешка»): «подгонять себя». Родственное: prisa «спешка»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: darse prisa en
        pair: ["Se apresuró a contestar.", "Se dio prisa en contestar."]
        diff:
          - "darse prisa — обычный разговорный вариант: «поторопиться»"
          - "apresurarse a — чуть литературнее, часто «поспешил сделать»"
    analogs:
      - "to hasten to — поспешить сделать"
      - "to rush to — броситься делать"
    dialogue:
      - "Ana: ¿Qué dijo cuando le preguntaste por el dinero? | Что он сказал, когда ты спросил про деньги?"
      - "Pablo: Se apresuró a responder que no. | Он поспешил ответить, что нет."
      - "Ana: ¿Sin pensarlo? | Не подумав?"
      - "Pablo: Sin pensarlo. Y sin mirarme fijamente, que es raro en él. | Не подумав. И не глядя мне в глаза, что на него не похоже."
      - "Ana: Entonces algo oculta. | Значит, что-то скрывает."
      - "Pablo: Eso creo. Cuando alguien se apresura a negar, suele estar nervioso. | Мне тоже так кажется. Кто торопится отрицать, обычно нервничает."
      - "Ana: ¿Y ahora qué hacemos? | И что теперь делаем?"
      - "Pablo: Esperar. Quizá mediante otra pregunta, más tarde, se delate solo. | Ждать. Возможно, при другом вопросе позже он сам себя выдаст."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "apresurarse a + инфинитив — поспешить сделать"
      - "apresurarse a decir — поспешить сказать"
      - "sin apresurarse — не торопясь"
    collocation_example: "Ella se apresuró a aclarar el malentendido. — Она поспешила прояснить недоразумение."
    trap: "После apresurarse всегда a: apresurarse a hacer. Не говорите «apresurarse de»: предлог de здесь ошибка."

  - word: sumido en un sueño
    ru: погружённый в сон
    ipa: /suˈmiðo en un ˈsweɲo/
    say: суми́до эн ун суэ́ньо
    pron: "ue — один слог «уэ», ñ — «нь»: sueño — «суэ́ньо»."
    meaning: "В глубоком сне, как будто «утонул» в нём. Sumido — «погружённый» в сон, мысли, тишину."
    examples:
      - "Estaba sumido en sus pensamientos. — Он был погружён в свои мысли."
      - "No oyó llamar a la puerta, porque dormía sumido en un sueño profundo. — Он не слышал стука в дверь, потому что спал глубоким сном."
      - "El pueblo, sumido en un sueño tranquilo, no se enteró de la tormenta que pasó por la noche. — Селение, погружённое в тихий сон, не заметило грозы, которая прошла ночью."
    origin: "Причастие от sumir «погружать» (лат. sumere «брать, поглощать»). Родственные: sumergir «погружать в воду», consumir «потреблять»."
    register: "Литературное, книжное."
    synonyms:
      - word: dormido
        pair: ["Estaba sumido en un sueño.", "Estaba dormido."]
        diff:
          - "dormido — просто «спящий»"
          - "sumido en un sueño — образно, «погрузившийся в сон»"
    analogs:
      - "lost in sleep — погружённый в сон"
      - "immersed — погружённый"
    dialogue:
      - "Marcos llegó a casa a las tres de la madrugada, muerto de cansancio. | Маркос пришёл домой в три часа ночи, смертельно усталый."
      - "En el salón encontró a su abuelo sumido en un sueño profundo. | В гостиной он застал дедушку, погружённого в глубокий сон."
      - "La tele seguía encendida, con el sonido muy bajo. | Телевизор был включён, с очень тихим звуком."
      - "Marcos no se atrevió a despertarlo y apagó la tele suavemente. | Маркос не решился его будить и тихо выключил телевизор."
      - "Después, cubrió al abuelo con una manta y se retiró a su cuarto. | Потом накрыл дедушку пледом и ушёл к себе в комнату."
      - "Antes de dormirse, pensó en lo poco que valoramos a la familia. | Перед сном он подумал о том, как мало мы ценим семью."
      - "Esa noche, sumido en sus pensamientos, tardó mucho en conciliar el sueño. | В ту ночь, погружённый в мысли, он долго не мог уснуть."
    cefr: "C1."
    frequency: "Редкое: в литературе."
    collocations:
      - "sumido en el sueño — погружённый в сон"
      - "sumido en pensamientos — погружённый в мысли"
      - "sumido en la tristeza — погружённый в печаль"
    collocation_example: "El pueblo estaba sumido en el silencio. — Посёлок был погружён в тишину."
    trap: "Sumido согласуется по роду и числу: sumida, sumidos, sumidas. Не путайте с sumiso «покорный» и sumar «складывать»."

  - word: a la vez
    ru: одновременно
    ipa: /a la ˈβes/
    say: а ла бэс
    pron: "v читается как b; z на конце в Испании — [θ], как th в английском _think_."
    meaning: "В одно и то же время: делать две вещи вместе или быть двумя вещами сразу."
    examples:
      - "No hables todos a la vez. — Не говорите все одновременно."
      - "Intentó estudiar y trabajar a la vez durante dos años, y terminó agotado. — Он два года пытался одновременно учиться и работать и закончил полностью измотанным."
      - "Es amable y serio a la vez, y por eso los alumnos lo respetan y lo quieren. — Он одновременно приветлив и строг, и поэтому ученики его уважают и любят."
    origin: "vez «раз, время» (лат. vicem «очередь, смена»). Дословно «в одну очередь»."
    register: "Нейтральное."
    synonyms:
      - word: al mismo tiempo
        pair: ["Hacía dos cosas a la vez.", "Hacía dos cosas al mismo tiempo."]
        diff:
          - "al mismo tiempo — чуть длиннее и подчёркнутее"
          - "a la vez — короче, очень частое в речи"
    analogs:
      - "at the same time — одновременно"
      - "simultaneously — одновременно (формально)"
    dialogue:
      - "Ana: ¿Cómo puedes hacer todo? | Как ты всё успеваешь?"
      - "Pablo: No puedo. No se puede hacer todo a la vez. | Не могу. Всё сразу сделать нельзя."
      - "Ana: Pues tú trabajas, estudias y cuidas de tu madre. | Но ты работаешь, учишься и ухаживаешь за мамой."
      - "Pablo: Sí, pero poco a poco. Si intento hacerlo todo a la vez, me alboroto y no termino nada. | Да, но понемногу. Если пытаюсь делать всё сразу, теряюсь и ничего не заканчиваю."
      - "Ana: ¿Y cómo te organizas? | И как ты организуешься?"
      - "Pablo: Con la agenda. Apunto una cosa a la vez y la hago con calma. | С ежедневником. Записываю одно дело за раз и делаю спокойно."
      - "Ana: Debería imitarte. Yo hablo, como y escribo a la vez. | Мне стоит у тебя поучиться. Я говорю, ем и пишу одновременно."
      - "Pablo: Entonces no es raro que estés agotada. | Тогда неудивительно, что ты измотана."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "todo a la vez — всё сразу"
      - "a la vez que — в то же время как"
      - "dos cosas a la vez — две вещи сразу"
    collocation_example: "Canta y toca la guitarra a la vez. — Он поёт и играет на гитаре одновременно."
    trap: "Не путайте a la vez «одновременно» с a veces «иногда» и otra vez «ещё раз»: разные слова с одним корнем."

  - word: tirarse de la cama
    ru: вскочить, соскочить с кровати
    ipa: /tiˈɾaɾse de la ˈkama/
    say: тира́рсэ дэ ла ка́ма
    meaning: "Резко вскочить с постели, чаще чтобы быстро что-то сделать. Дословно «бросить себя с кровати»."
    examples:
      - "Se tiró de la cama enseguida. — Он сразу вскочил с кровати."
      - "Mi hermano pequeño se tira de la cama cada sábado por la mañana. — Мой младший брат каждую субботу утром вскакивает с кровати."
      - "Los niños se tiran de la cama el día de Reyes para ir a ver los regalos. — Дети вскакивают с кровати в день Королей, чтобы бежать смотреть подарки."
    origin: "tirar «бросать, тянуть» + возвратное se: «бросить себя». Образ: вылетает из постели, как брошенный."
    register: "Разговорное."
    synonyms:
      - word: levantarse de un salto
        pair: ["Se tiró de la cama.", "Se levantó de un salto."]
        diff:
          - "levantarse de un salto — вскочить прыжком, нейтральное"
          - "tirarse de la cama — разговорное и образнее"
    analogs:
      - "to jump out of bed — вскочить с кровати"
      - "to leap out of bed — выпрыгнуть из постели"
    dialogue:
      - "Ana: ¿Qué hiciste al oír la alarma? | Что ты сделал, когда услышал сигнал?"
      - "Pablo: Me tiré de la cama enseguida. | Я тут же вскочил с кровати."
      - "Ana: ¿Estabas dormido? | Ты спал?"
      - "Pablo: Sí, estaba sumido en un sueño profundo. Pero el ruido era enorme. | Да, я был погружён в глубокий сон. Но шум был огромный."
      - "Ana: ¿Y qué pasaba? | И что происходило?"
      - "Pablo: Un vecino había olvidado apagar el horno y el humo llenaba el rellano. | Сосед забыл выключить духовку, и дым заполнил лестничную площадку."
      - "Ana: ¡Qué susto! ¿Llamaste a alguien? | Какой испуг! Ты кому-нибудь позвонил?"
      - "Pablo: Primero abrí las ventanas y luego avisé a los bomberos, por si acaso. | Сначала открыл окна, потом вызвал пожарных на всякий случай."
    cefr: "B2."
    frequency: "Нечастое: в рассказах, разговорное."
    collocations:
      - "tirarse de la cama — вскочить с постели"
      - "tirarse al suelo — броситься на пол"
      - "tirarse a la piscina — прыгнуть в бассейн"
    collocation_example: "Se tiró a la piscina sin pensarlo. — Он прыгнул в бассейн, не раздумывая."
    trap: "Tirarse из постели — в смысле «вскочить», а не «упасть»: упасть — caerse de la cama. В других выражениях tirarse бывает грубым, поэтому на другие ситуации оборот не переносите."
