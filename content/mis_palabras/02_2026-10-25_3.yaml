# Второй список автора, часть 3 — существительные (чувства, смерть, люди, быт).
lang: es
words:
  - word: dolor
    ru: боль
    ipa: /doˈloɾ/
    say: доло́р
    meaning: "Боль — физическая или душевная. Где болит — dolor de: dolor de cabeza."
    examples:
      - "Tengo dolor de cabeza. — У меня болит голова."
      - "Tengo dolor de cabeza desde esta mañana y no se me pasa con las pastillas. — У меня с утра болит голова, и таблетки не помогают."
      - "Sintió un dolor profundo al recordar los años que pasó lejos de su familia. — Он почувствовал глубокую боль, вспомнив годы, проведённые вдали от семьи."
    origin: "Лат. dolor «боль». Родственные: doler «болеть», dolido «задетый», doloroso «болезненный»."
    register: "Нейтральное."
    synonyms:
      - word: sufrimiento
        pair: ["Siente mucho dolor.", "Siente mucho sufrimiento."]
        diff:
          - "sufrimiento — страдание, дольше и тяжелее"
    analogs:
      - "pain — боль"
      - "ache — ноющая боль"
    dialogue:
      - "Ana: ¿Qué te pasa? | Что с тобой?"
      - "Pablo: Tengo un dolor de muelas horrible. | У меня ужасно болит зуб."
    cefr: "A2."
    frequency: "Очень частое."
    collocations:
      - "dolor de cabeza — головная боль"
      - "dolor de estómago — боль в животе"
      - "un dolor agudo — острая боль"
    collocation_example: "Tomé algo para el dolor de estómago. — Я выпил что-то от боли в животе."
    trap: "Мужского рода: el dolor. «У меня болит голова» чаще — Me duele la cabeza, с глаголом doler, как gustar."

  - word: resentimiento
    ru: обида, затаённая злость
    ipa: /resentiˈmjento/
    say: рэсэнтимье́нто
    pron: "r в начале — раскатистое."
    meaning: "Затаённая обида, злость, которая долго не проходит."
    examples:
      - "Lo dijo sin resentimiento. — Он сказал это без обиды."
      - "Lo dijo sin resentimiento, como quien ya ha perdonado todo lo que pasó. — Он сказал это без злобы, как человек, который уже простил всё, что произошло."
      - "Años después, el resentimiento seguía vivo y ninguno de los dos quería dar el primer paso. — Спустя годы обида всё ещё была жива, и никто из них не хотел сделать первый шаг."
    origin: "re- «снова» + sentir «чувствовать»: «чувствовать снова и снова». Родственное: resentido «обиженный»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: rencor
        pair: ["Le guarda resentimiento.", "Le guarda rencor."]
        diff:
          - "rencor — злее, ближе к мстительности"
    analogs:
      - "resentment — обида"
      - "grudge — затаённая злость"
    dialogue:
      - "Lucía: ¿Aún le tienes resentimiento? | Ты всё ещё на него в обиде?"
      - "Marcos: Un poco. Lo que hizo es imperdonable. | Немного. То, что он сделал, непростительно."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "sentir resentimiento — испытывать обиду"
      - "resentimiento hacia alguien — обида на кого-то"
      - "guardar rencor — держать зло"
    collocation_example: "No le guardo rencor. — Я не держу на него зла."
    trap: "Это не «чувство» вообще (sentimiento), а именно обида. На кого — hacia: resentimiento **hacia** alguien."

  - word: firmeza
    ru: твёрдость, решимость
    ipa: /fiɾˈmeθa/
    say: фирмэ́са
    pron: "z в Испании — [θ]."
    meaning: "Твёрдость характера, решительность; прочность."
    examples:
      - "Habló con firmeza. — Он говорил твёрдо."
      - "Habló con firmeza delante de todos y dijo que no cambiaría de opinión. — Он говорил твёрдо перед всеми и сказал, что своё мнение не изменит."
      - "La firmeza de los cimientos permitió que el edificio resistiera el terremoto. — Прочность фундамента позволила зданию выдержать землетрясение."
    origin: "От firme «твёрдый» (лат. firmus). Родственные: firmar «подписывать», firma."
    register: "Нейтральное."
    synonyms:
      - word: determinación
        pair: ["Actuó con firmeza.", "Actuó con determinación."]
        diff:
          - "determinación — решимость сделать что-то"
          - "firmeza — твёрдость, неуступчивость"
    analogs:
      - "firmness — твёрдость"
      - "resolve — решимость"
    dialogue:
      - "Ana: ¿Cómo convenciste al jefe? | Как ты убедил начальника?"
      - "Pablo: Con firmeza y mucha paciencia. | Твёрдостью и большим терпением."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "con firmeza — твёрдо"
      - "mostrar firmeza — проявить твёрдость"
      - "mantenerse firme — стоять на своём"
    collocation_example: "Me mantuve firme. — Я стоял на своём."
    trap: "Не путайте с firma «подпись»: firmeza — твёрдость."

  - word: paciencia
    ru: терпение
    ipa: /paˈθjenθja/
    say: пасье́нсья
    pron: "Обе c в Испании — [θ], как th в английском _think_."
    meaning: "Терпение."
    examples:
      - "Ten paciencia. — Наберись терпения."
      - "Ten paciencia, que el médico enseguida te atiende y no tardará mucho. — Потерпи, врач сейчас тебя примет, и это не займёт много времени."
      - "Se me acaba la paciencia con estos vecinos que ponen música a todas horas. — Моё терпение кончается из-за этих соседей, которые включают музыку в любое время."
    origin: "Лат. patientia, от pati «терпеть». Родственные: paciente «терпеливый; пациент» (тот, кто терпит)."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "patience — терпение"
    dialogue:
      - "Lucía: ¿Cuándo llega? | Когда он приедет?"
      - "Marcos: Paciencia. Llegará pronto. | Терпение. Скоро приедет."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "tener paciencia — быть терпеливым"
      - "perder la paciencia — потерять терпение"
      - "con paciencia — терпеливо"
    collocation_example: "Al final perdí la paciencia. — В конце концов я потерял терпение."
    trap: "Пишется с c: paciencia. «Терпеливый» и «пациент» — одно слово paciente."

  - word: generosidad
    ru: великодушие, щедрость
    ipa: /xeneɾosiˈðað/
    say: хэнэросида́д
    pron: "g перед e — хриплое [x]. Конечное d почти не слышно."
    meaning: "Щедрость, великодушие."
    examples:
      - "Actuó con generosidad. — Он поступил великодушно."
      - "Gracias por tu generosidad: sin tu ayuda no habríamos podido pagar la operación. — Спасибо за твою щедрость: без твоей помощи мы бы не смогли оплатить операцию."
      - "Todos hablan de la generosidad de esa familia, que da comida a los vecinos cada Navidad. — Все говорят о щедрости этой семьи, которая каждое Рождество раздаёт еду соседям."
    origin: "От generoso (лат. generosus «благородного рода»): щедрость считалась качеством знати."
    register: "Нейтральное."
    synonyms: []
    analogs:
      - "generosity — щедрость"
    dialogue:
      - "Ana: Nos ha invitado a todos. | Он всех нас угостил."
      - "Pablo: Sí, su generosidad no tiene límites. | Да, его щедрость не знает границ."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "con generosidad — щедро"
      - "ser generoso con alguien — быть щедрым с кем-то"
      - "un gesto de generosidad — жест великодушия"
    collocation_example: "Fue un gesto de generosidad. — Это был жест великодушия."
    trap: "g читается [x]: «хэнэросидад», а не «гэнэросидад». Женского рода: la generosidad."

  - word: ternura
    ru: нежность
    ipa: /teɾˈnuɾa/
    say: тэрну́ра
    meaning: "Нежность, ласка."
    examples:
      - "¡Qué ternura! — Какая прелесть! (о ребёнке, животном)"
      - "La miró con ternura mientras ella dormía tranquilamente en el sofá. — Он посмотрел на неё с нежностью, пока она спокойно спала на диване."
      - "En sus cartas había una ternura que no mostraba nunca cuando hablaba en persona. — В его письмах была нежность, которую он никогда не проявлял при личном разговоре."
    origin: "От tierno «нежный, мягкий» (лат. tener). Родственное: tierno — ещё и «мягкий» о мясе и хлебе."
    register: "Нейтральное."
    synonyms:
      - word: cariño
        pair: ["Lo trata con ternura.", "Lo trata con cariño."]
        diff:
          - "cariño — привязанность, любовь, шире"
    analogs:
      - "tenderness — нежность"
    dialogue:
      - "Lucía: Mira el bebé. ¡Qué ternura! | Посмотри на малыша. Какая прелесть!"
      - "Marcos: Se parece a su madre. | Он похож на маму."
    cefr: "B1."
    frequency: "Средняя."
    collocations:
      - "con ternura — нежно"
      - "¡qué ternura! — какая прелесть!"
      - "sentir ternura — испытывать нежность"
    collocation_example: "Me da mucha ternura. — Это меня очень трогает."
    trap: "¡Qué ternura! — это восклицание «какая прелесть», а не буквально «какая нежность»."

  - word: intimidad
    ru: личное пространство
    ipa: /intimiˈðað/
    say: интимида́д
    pron: "Конечное d почти не слышно."
    meaning: "Личная жизнь, частное пространство; близость между людьми."
    examples:
      - "Respeta mi intimidad. — Уважай моё личное пространство."
      - "Lo hablamos en la intimidad de la familia, sin que nadie de fuera lo supiera. — Мы обсудили это в узком семейном кругу, чтобы никто посторонний не знал."
      - "La revista publicó fotos de la intimidad de la actriz y ella presentó una denuncia. — Журнал опубликовал фотографии из личной жизни актрисы, и она подала заявление в полицию."
    origin: "От íntimo «сокровенный, близкий» (лат. intimus «самый внутренний»)."
    register: "Нейтральное."
    synonyms:
      - word: privacidad
        pair: ["Quiero intimidad.", "Quiero privacidad."]
        diff:
          - "privacidad — частная информация, приватность в интернете"
    analogs:
      - "privacy — личное пространство"
      - "intimacy — близость"
    dialogue:
      - "Ana: ¿Por qué cotilleas mi móvil? | Зачем ты лазишь в мой телефон?"
      - "Pablo: Perdona, tienes derecho a tu intimidad. | Прости, у тебя есть право на личное."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "respetar la intimidad — уважать личное пространство"
      - "en la intimidad — наедине, в узком кругу"
      - "derecho a la intimidad — право на частную жизнь"
    collocation_example: "Se casaron en la intimidad. — Они поженились в узком кругу."
    trap: "Не всегда «интимность»: чаще всего это частная жизнь и личное пространство."

  - word: melancolía
    ru: меланхолия
    ipa: /melaŋkoˈli.a/
    say: мэланколи́я
    pron: "Ударение на í, ía — два слога."
    meaning: "Меланхолия, тихая грусть."
    examples:
      - "El otoño me da melancolía. — Осень навевает на меня грусть."
      - "Esa canción lenta le trajo una melancolía suave, casi agradable. — Эта медленная песня навеяла на неё тихую, почти приятную грусть."
      - "Habló con melancolía de su infancia en el pueblo, donde no volvió nunca más. — Он с грустью говорил о детстве в деревне, куда больше никогда не вернулся."
    origin: "Греч. melancholía «чёрная желчь»: по старой медицине, от неё бывает грусть."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: nostalgia
        pair: ["Siento melancolía.", "Siento nostalgia."]
        diff:
          - "nostalgia — тоска по прошлому или родине"
    analogs:
      - "melancholy — меланхолия"
    dialogue:
      - "Lucía: ¿Por qué estás tan pensativo? | Почему ты такой задумчивый?"
      - "Marcos: La lluvia me da melancolía. | Дождь навевает на меня грусть."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "dar melancolía — навевать грусть"
      - "con melancolía — с грустью"
      - "ser melancólico — быть меланхоличным"
    collocation_example: "Es una persona muy melancólica. — Он очень меланхоличный человек."
    trap: "Ударение на í: melancolía, а прилагательное — melancólico."

  - word: escalofrío
    ru: дрожь, мурашки
    ipa: /eskaloˈfɾi.o/
    say: эскалофри́о
    pron: "Ударение на í, ío — два слога."
    meaning: "Озноб, дрожь от холода, страха или болезни; мурашки."
    examples:
      - "Tengo escalofríos. — Меня знобит."
      - "Tengo escalofríos desde por la tarde y creo que me va a subir la fiebre. — У меня озноб с вечера, и, кажется, поднимется температура."
      - "Sintió un escalofrío al entrar en la habitación donde había ocurrido el crimen. — Его пробрал озноб, когда он вошёл в комнату, где было совершено преступление."
    origin: "От caliente «горячий» + frío «холодный»: когда бросает то в жар, то в холод."
    register: "Нейтральное."
    synonyms:
      - word: piel de gallina
        pair: ["Me dio un escalofrío.", "Se me puso la piel de gallina."]
        diff:
          - "piel de gallina — «гусиная кожа», мурашки на коже"
    analogs:
      - "shiver / chill — дрожь, озноб"
      - "goosebumps — мурашки"
    dialogue:
      - "Ana: El cementerio de noche me da escalofríos. | Ночное кладбище вызывает у меня мурашки."
      - "Pablo: A mí también. Es macabro. | У меня тоже. Это жутко."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "tener escalofríos — знобить"
      - "dar escalofríos — бросать в дрожь"
      - "un escalofrío de miedo — дрожь от страха"
    collocation_example: "Esa película da escalofríos. — От этого фильма мороз по коже."
    trap: "Ударение на í: escalofrío. Чаще говорят во множественном: tengo escalofríos."

  - word: asombro
    ru: изумление
    ipa: /aˈsombɾo/
    say: асо́мбро
    meaning: "Изумление, удивление."
    examples:
      - "Me miró con asombro. — Он посмотрел на меня с изумлением."
      - "El público escuchó con asombro la historia de aquel viaje por el desierto. — Зрители с изумлением слушали историю о том путешествии через пустыню."
      - "Para mi asombro, ganó la carrera sin haber entrenado casi nada durante el año. — К моему удивлению, он выиграл гонку, почти не тренируясь в течение года."
    origin: "От asombrar «изумлять», буквально «бросить тень» (sombra «тень»): удивление «затеняет» разум."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: sorpresa
        pair: ["Con gran asombro.", "Con gran sorpresa."]
        diff:
          - "sorpresa — обычное удивление"
          - "asombro — сильнее, «остолбенеть»"
    analogs:
      - "amazement / astonishment — изумление"
    dialogue:
      - "Lucía: ¿Qué cara puso? | Какое у него было лицо?"
      - "Marcos: De asombro total. No se lo esperaba. | Полное изумление. Он такого не ожидал."
    cefr: "B2."
    frequency: "Средняя."
    collocations:
      - "con asombro — с изумлением"
      - "para mi asombro — к моему изумлению"
      - "asombrarse de algo — изумляться чему-то"
    collocation_example: "Me asombra tu paciencia. — Меня поражает твоё терпение."
    trap: "Глагол asombrar устроен как gustar: me asombra — «меня поражает»."

  - word: desgracia
    ru: несчастье, трагедия
    ipa: /desˈɣɾaθja/
    say: дэсгра́сья
    pron: "g мягкое [ɣ], c перед i — [θ]."
    meaning: "Несчастье, беда. por desgracia — «к сожалению»."
    examples:
      - "Fue una desgracia terrible. — Это было страшное несчастье."
      - "La desgracia llegó sin avisar y en una sola noche la familia lo perdió todo. — Беда пришла без предупреждения, и за одну ночь семья потеряла всё."
      - "Por desgracia, no puedo ir a la boda, porque ese día tengo que viajar por trabajo. — К сожалению, я не могу пойти на свадьбу, потому что в тот день должен ехать в командировку."
    origin: "des- «не» + gracia «милость, удача»: «немилость судьбы»."
    register: "Нейтральное."
    synonyms:
      - word: tragedia
        pair: ["Fue una desgracia.", "Fue una tragedia."]
        diff:
          - "tragedia — сильнее, крупная беда"
    analogs:
      - "misfortune — несчастье"
      - "unfortunately — к сожалению (por desgracia)"
    dialogue:
      - "Ana: ¿Te has enterado de la desgracia? | Слышал о несчастье?"
      - "Pablo: Sí, el entierro es el lunes. | Да, похороны в понедельник."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "por desgracia — к сожалению"
      - "una desgracia familiar — семейная трагедия"
      - "caer en desgracia — попасть в немилость"
    collocation_example: "Por desgracia, llegamos tarde. — К сожалению, мы опоздали."
    trap: "Не путайте с disgrace в английском (позор): desgracia — несчастье. Позор — vergüenza."

  - word: glorificación
    ru: прославление
    ipa: /gloɾifikaˈθjon/
    say: глорификасьо́н
    pron: "c перед i — [θ], ударение на последнем слоге."
    meaning: "Прославление, возвеличивание; часто критично: glorificación de la violencia."
    examples:
      - "Es una glorificación de la guerra. — Это прославление войны."
      - "La película es una glorificación del héroe, y apenas muestra sus errores. — Фильм – это возвеличивание героя, и в нём почти не показаны его ошибки."
      - "Es una glorificación de la guerra, y a mucha gente le molesta esa manera de contar la historia. — Это прославление войны, и многих раздражает такой способ рассказывать историю."
    origin: "Лат. glorificare: gloria «слава» + facere «делать». Родственные: glorioso, gloria."
    register: "Книжное, публицистическое."
    synonyms:
      - word: exaltación
        pair: ["La glorificación del héroe.", "La exaltación del héroe."]
        diff:
          - "exaltación — восторженное восхваление"
    analogs:
      - "glorification — прославление"
    dialogue:
      - "Lucía: ¿Te gustó la película? | Тебе понравился фильм?"
      - "Marcos: No mucho. Es una glorificación del crimen. | Не очень. Это прославление преступности."
    cefr: "C1 — книжное слово."
    frequency: "Редкое, в публицистике."
    collocations:
      - "glorificación de la violencia — прославление насилия"
      - "glorificar a alguien — прославлять кого-то"
      - "la gloria — слава"
    collocation_example: "No hay que glorificar la violencia. — Не надо прославлять насилие."
    trap: "Ударение на последнем слоге: glorificación. Женского рода, как все слова на -ción."

  - word: dimensión
    ru: измерение, сторона
    ipa: /dimenˈsjon/
    say: димэнсьо́н
    meaning: "Измерение, размер; масштаб; сторона, аспект проблемы."
    examples:
      - "Tiene una dimensión humana. — У этого есть человеческая сторона."
