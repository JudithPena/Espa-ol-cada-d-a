# Пятый список автора, часть 3 — «La situación está fuera de control. Ceuta» (слова 1–12).
lang: es
words:
  - word: estar fuera de control
    ru: быть вне контроля
    ipa: /esˈtaɾ ˈfweɾa de konˈtɾol/
    say: эста́р фуэ́ра дэ контро́ль
    pron: "ue — один слог «уэ»; ударение на последнем слоге: control."
    meaning: "О ситуации или человеке: выйти из-под власти, не поддаваться управлению."
    examples:
      - "La situación está fuera de control. — Ситуация вышла из-под контроля."
      - "El incendio está fuera de control y los bomberos piden ayuda a otras provincias. — Пожар вышел из-под контроля, и пожарные просят помощи у других провинций."
      - "Su hijo está fuera de control desde que empezó el instituto, y ya no sabe qué hacer con él. — Её сын вышел из-под контроля с тех пор, как пошёл в лицей, и она уже не знает, что с ним делать."
    origin: "estar «быть» + fuera de «вне» + control (франц. contrôle «проверка», от contre-rôle «встречный список»). Дословно «быть за пределами контроля»."
    register: "Нейтральное, из новостей."
    synonyms:
      - word: descontrolarse
        pair: ["La situación está fuera de control.", "La situación se ha descontrolado."]
        diff:
          - "descontrolarse — «выйти из-под контроля» как процесс"
          - "estar fuera de control — как состояние, «уже вышло»"
    analogs:
      - "to be out of control — быть вне контроля"
      - "to get out of hand — выйти из-под контроля"
    dialogue:
      - "Ana: ¿Cómo está la situación? | Как ситуация?"
      - "Pablo: Fuera de control, hay mucha gente. | Вышла из-под контроля, там много людей."
      - "Ana: ¿Dónde? | Где?"
      - "Pablo: En la plaza. Se han congregado miles de personas y la policía no da abasto. | На площади. Собрались тысячи людей, и полиция не справляется."
      - "Ana: ¿Hay peligro? | Есть опасность?"
      - "Pablo: Mucho. Cualquier chispa puede avivar el conflicto y desembocar en violencia. | Большая. Любая искра может разжечь конфликт и привести к насилию."
      - "Ana: Qué agobio. ¿Y los organizadores? | Какая напряжённость. А организаторы?"
      - "Pablo: Piden calma, pero la multitud está alterada y no los escucha. | Просят спокойствия, но толпа взвинчена и их не слушает."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "fuera de control — вне контроля"
      - "bajo control — под контролем"
      - "perder el control — потерять контроль"
    collocation_example: "El incendio sigue fuera de control. — Пожар по-прежнему вне контроля."
    trap: "Противоположное — estar bajo control. Не путайте control «контроль» с controlador «диспетчер»."

  - word: desplegar efectivos
    ru: развернуть силы, направить силы
    ipa: /desˈpleɣaɾ efekˈtiβos/
    say: дэспльега́р эфэкти́бос
    pron: "Спрягается e → ie: despliego, despliegas; перед e g → gu: desplegué."
    meaning: "Направить на место людей: полицию, военных, спасателей. Efectivos — «личный состав, силы»."
    examples:
      - "La policía desplegó efectivos en la plaza. — Полиция направила силы на площадь."
      - "El ejército desplegó efectivos en la frontera tras los ataques de la semana pasada. — Армия развернула силы на границе после нападений прошлой недели."
      - "Se desplegaron cien efectivos policiales en el centro de la ciudad para evitar incidentes durante la manifestación. — Сто полицейских были направлены в центр города, чтобы избежать инцидентов во время демонстрации."
    origin: "desplegar «разворачивать» (лат. displicare «развёртывать») + efectivos — «действующие силы» (от efectivo «действенный»)."
    register: "Формальное, военное и новостное."
    synonyms:
      - word: movilizar
        pair: ["Desplegaron efectivos en la zona.", "Movilizaron efectivos en la zona."]
        diff:
          - "movilizar — «поднять, привести в движение» силы"
          - "desplegar — «разместить, расставить» по территории"
    analogs:
      - "to deploy forces — разворачивать силы"
      - "to send in — направить"
    dialogue:
      - "Ana: ¿Qué hizo la policía? | Что сделала полиция?"
      - "Pablo: Desplegó más efectivos en la plaza. | Развернула больше сил на площади."
      - "Ana: ¿Cuántos? | Сколько?"
      - "Pablo: Unos quinientos, con furgonetas y caballos. Sus jefes no quieren que se repita el desorden del otro día. | Около пятисот, с фургонами и лошадьми. Руководство не хочет повторения беспорядков того дня."
      - "Ana: ¿Y la gente cómo reacciona? | И как реагируют люди?"
      - "Pablo: Algunos se retiran, otros reivindican su derecho a manifestarse. Hay tensión. | Одни уходят, другие отстаивают право на демонстрацию. Напряжение."
      - "Ana: Espero que no desemboque en otro enfrentamiento. | Надеюсь, это не выльется в очередное столкновение."
      - "Pablo: Yo también. Con tanto efectivo desplegado, cualquier malentendido sería grave. | Я тоже. При стольких развёрнутых силах любое недоразумение будет серьёзным."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "desplegar efectivos — направить силы"
      - "un amplio despliegue policial — масштабное полицейское присутствие"
      - "desplegar una bandera — развернуть флаг"
    collocation_example: "Se desplegó un gran dispositivo de seguridad. — Развернули крупные силы безопасности."
    trap: "Efectivos — только во множественном и значит «личный состав»; не путайте с efectivo «наличные». Desplegar спрягается как cerrar: despliego."

  - word: fronterizo
    ru: пограничный
    ipa: /fɾonteˈɾiθo/
    say: фронтэри́со
    pron: "z в Испании — [θ]."
    meaning: "Связанный с границей: город, зона, контроль. Фронтера — «граница»."
    examples:
      - "Cruzó la zona fronteriza a pie. — Он пересёк приграничную зону пешком."
      - "El control fronterizo es muy estricto y revisan todos los documentos de cada viajero. — Пограничный контроль очень строгий, и проверяют все документы каждого путешественника."
      - "Viven en una ciudad fronteriza, y cada mañana medio pueblo cruza al otro país para trabajar. — Они живут в пограничном городе, и каждое утро половина жителей переезжает в соседнюю страну на работу."
    origin: "От frontera «граница» (от frente «лоб, передняя линия»: линия фронта). Родственные: frontera, afrontar, enfrentar."
    register: "Формальное, нейтральное."
    synonyms:
      - word: limítrofe
        pair: ["Es una zona fronteriza.", "Es una zona limítrofe."]
        diff:
          - "limítrofe — «граничащий» (о странах, районах рядом)"
          - "fronterizo — «пограничный», связанный с самой границей"
    analogs:
      - "border — пограничный"
      - "frontier — граничный"
    dialogue:
      - "Mi familia vive en un pueblo fronterizo, a pocos kilómetros del río. | Моя семья живёт в приграничном городке, в нескольких километрах от реки."
      - "Desde allí, se divisa en el horizonte el pueblo del otro lado. | Оттуда на горизонте виден городок на другой стороне."
      - "Los fines de semana, mucha gente cruza para comprar o visitar a familiares. | По выходным многие пересекают границу, чтобы делать покупки или навещать родственников."
      - "Los vecinos se llevan bien con los del otro lado, a pesar de las diferencias. | Соседи ладят с жителями другой стороны, несмотря на различия."
      - "Sin embargo, cuando hay una crisis, el ambiente se pone tenso. | Но когда случается кризис, атмосфера накаляется."
      - "Entonces, todos albergan la esperanza de que reine la concordia. | Тогда все надеются, что воцарится согласие."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "ciudad fronteriza — пограничный город"
      - "control fronterizo — пограничный контроль"
      - "paso fronterizo — пограничный переход"
    collocation_example: "Cruzamos el paso fronterizo a las nueve. — Мы пересекли границу в девять."
    trap: "Прилагательное согласуется: fronteriza, fronterizos. Не путайте с frontera «граница» (существительное) и frente «лоб»."

  - word: aguardar
    ru: ожидать, дожидаться
    ipa: /aɣwaɾˈðaɾ/
    say: агуарда́р
    pron: "gua читается «гуа»; d между гласными мягкое [ð]."
    meaning: "Ждать чего-то: чаще более официально или торжественно, чем esperar. Aguardar noticias — «ждать вестей»."
    examples:
      - "Aguardamos tu llamada desde esta mañana. — Мы ждём твоего звонка с самого утра."
      - "Le aguarda un futuro brillante si sigue trabajando con tanto esfuerzo como hasta ahora. — Его ждёт блестящее будущее, если он продолжит работать с тем же усердием."
      - "Los pasajeros aguardaban noticias en la sala de espera mientras se resolvía el problema técnico. — Пассажиры ожидали известий в зале ожидания, пока решалась техническая проблема."
    origin: "От guardar «стеречь, ждать» (германск. wardōn «стеречь»). a- — усилительная приставка. Родственные: guardia «охрана», guardar «хранить»."
    register: "Формальное, книжное."
    synonyms:
      - word: esperar
        pair: ["Aguardamos su llegada.", "Esperamos su llegada."]
        diff:
          - "esperar — «ждать» и «надеяться», разговорное"
          - "aguardar — только «ждать», более торжественно"
    analogs:
      - "to await — ожидать"
      - "to wait for — ждать"
    dialogue:
      - "Ana: ¿Qué hacen ahora? | Что они делают сейчас?"
      - "Pablo: Aguardan noticias del Gobierno. | Ждут новостей от правительства."
      - "Ana: ¿Desde cuándo esperan? | С каких пор ждут?"
      - "Pablo: Desde la mañana. Se han congregado frente al ministerio y nadie sabe cuánto tendrán que aguardar. | С утра. Собрались перед министерством, и никто не знает, сколько им придётся ждать."
      - "Ana: Qué paciencia. | Какое терпение."
      - "Pablo: No les queda otra. Han hecho una huelga de hambre y aguardan una respuesta. | У них нет выбора. Они объявили голодовку и ждут ответа."
      - "Ana: ¿Y si no hay respuesta? | А если ответа не будет?"
      - "Pablo: Entonces convocarán otra protesta más grande. No cederán ni un ápice. | Тогда объявят ещё более крупный протест. Не уступят ни на йоту."
    cefr: "C1."
    frequency: "Частое в письменной речи."
    collocations:
      - "aguardar su turno — дожидаться очереди"
      - "aguardar noticias — ждать вестей"
      - "a la espera de — в ожидании"
    collocation_example: "Aguardaba en silencio la llegada del tren. — Он молча ждал прихода поезда."
    trap: "Aguardar — переходный, без предлога: aguardar algo. Для людей нужен a: aguardar a alguien. Не путайте с guardar «хранить»."

  - word: estar saturado
    ru: быть переполненным, перегруженным
    ipa: /esˈtaɾ satuˈɾaðo/
    say: эста́р сатура́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О месте или системе: заполнено до предела, больше принять нельзя. Ещё — «устать от чего-то»: estar saturado de noticias."
    examples:
      - "El centro de salud está saturado hoy. — Поликлиника сегодня переполнена."
      - "Las líneas telefónicas estaban saturadas y nadie conseguía hablar con los servicios de emergencia. — Телефонные линии были перегружены, и никто не мог дозвониться до экстренных служб."
      - "Los hospitales están saturados desde que llegó el invierno y la gripe se extendió por toda la región. — Больницы переполнены с тех пор, как наступила зима и грипп распространился по всему региону."
    origin: "Причастие от saturar «насыщать» (лат. saturare, от satur «сытый»). Родственные: saturación «перенасыщение», satisfacer «удовлетворять»."
    register: "Нейтральное."
    synonyms:
      - word: estar colapsado
        pair: ["Las urgencias están saturadas.", "Las urgencias están colapsadas."]
        diff:
          - "colapsado — «коллапс», совсем перестало работать"
          - "saturado — «заполнено до предела», работает с трудом"
    analogs:
      - "to be overwhelmed — быть перегруженным"
      - "to be at capacity — быть заполненным"
    dialogue:
      - "Ana: ¿Hay sitio en el hospital? | В больнице есть место?"
      - "Pablo: No, está saturado. | Нет, он переполнен."
      - "Ana: ¿Tanto? | Настолько?"
      - "Pablo: Los pasillos están llenos de camillas y los celadores no dan abasto. La afluencia de enfermos ha desbordado los recursos. | Коридоры забиты носилками, а санитары не справляются. Наплыв больных превысил ресурсы."
      - "Ana: ¿Y qué hacen? | И что они делают?"
      - "Pablo: Derivan a los casos menos graves a otros centros. Los demás tienen para rato. | Направляют менее тяжёлые случаи в другие центры. Остальным ждать долго."
      - "Ana: Qué desesperación. | Какое отчаяние."
      - "Pablo: Sí, y el sistema sigue sin reforzarse. | Да, а систему всё не усиливают."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "saturado de trabajo — завален работой"
      - "línea saturada — линия перегружена"
      - "mercado saturado — насыщенный рынок"
    collocation_example: "Las líneas telefónicas están saturadas. — Телефонные линии перегружены."
    trap: "Причастие согласуется: saturada, saturados. С estar: estar saturado. Не путайте с saturar «насыщать» и saturno «Сатурн»."

  - word: acudir en masa a
    ru: массово стекаться куда-либо
    ipa: /akuˈðiɾ en ˈmasa a/
    say: акуди́р эн ма́са а
    pron: "d между гласными мягкое [ð]."
    meaning: "О людях: прийти куда-то толпой, в большом числе. Acudir — «прийти по зову, откликнуться»."
    examples:
      - "Los vecinos acudieron en masa a la reunión. — Жители пришли на собрание в большом количестве."
      - "Miles de personas acudieron en masa a la plaza para escuchar al presidente. — Тысячи людей массово пришли на площадь послушать президента."
      - "Los aficionados acudieron en masa al estadio, y media hora antes ya no quedaban entradas. — Болельщики толпой пришли на стадион, и за полчаса до начала билетов уже не осталось."
    origin: "acudir — от лат. acurrere «подбегать» (ad- + currere «бежать»). Masa — «масса, тесто» (греч. maza). Образ: толпа, как единая масса."
    register: "Формальное, новостное."
    synonyms:
      - word: afluir
        pair: ["Acudieron en masa.", "Afluyeron en masa."]
        diff:
          - "afluir — «хлынуть потоком», книжное"
          - "acudir en masa — «прийти толпой», проще"
    analogs:
      - "to flock to — стекаться"
      - "to turn up in droves — прийти толпами"
    dialogue:
      - "Ana: ¿Hay mucha gente en el concierto? | На концерте много народу?"
      - "Pablo: Sí, acudieron en masa. | Да, пришли массово."
      - "Ana: ¿Se agotaron las entradas? | Билеты закончились?"
      - "Pablo: En una hora. Los fans acudieron en masa desde todas partes y el estadio estaba hasta los topes. | За час. Фанаты стекались со всех сторон, и стадион был забит до отказа."
      - "Ana: ¡Qué suerte haber ido! ¿Qué tal fue? | Повезло, что ты был! Как всё прошло?"
      - "Pablo: Espectacular. Cantamos, bailamos y nos reímos de un tirón. | Потрясающе. Мы пели, танцевали и смеялись без остановки."
      - "Ana: Yo no pude ir. Tuve un compromiso. | Я не смогла пойти. У меня было обязательство."
      - "Pablo: Pues la próxima vez, acude con nosotros. No te lo pierdas. | Тогда в следующий раз приходи с нами. Не упусти."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "acudir a una cita — прийти на встречу"
      - "acudir en ayuda — прийти на помощь"
      - "acudir en masa — прийти толпой"
    collocation_example: "Los fans acudieron en masa al estadio. — Болельщики толпой пришли на стадион."
    trap: "Acudir — с a: acudir a un lugar; в значении «прибегнуть» — acudir a alguien. Спрягается: acudo, acudes. Не путайте с acordar «договориться»."

  - word: congregarse
    ru: собираться, скапливаться
    ipa: /koŋɡɾeˈɣaɾse/
    say: конгрэга́рсэ
    pron: "n перед g звучит как носовое [ŋ]; g перед a — [ɣ]; перед e g → gu: me congregué."
    meaning: "О людях: собраться вместе в одном месте, часто для события. Книжное слово."
    examples:
      - "Los turistas se congregaron frente a la catedral. — Туристы собрались перед собором."
      - "Los estudiantes se congregaron en la entrada de la universidad para exigir mejores condiciones. — Студенты собрались у входа в университет, чтобы потребовать лучших условий."
      - "Los fieles se congregaron en la plaza para asistir a la misa que oficiaba el obispo. — Верующие собрались на площади, чтобы присутствовать на мессе, которую вёл епископ."
    origin: "Из лат. congregare «собирать в стадо»: con- «вместе» + grex «стадо». Родственные: grupo «группа», congregación «собрание»."
    register: "Формальное, книжное."
    synonyms:
      - word: reunirse
        pair: ["Se congregaron en la plaza.", "Se reunieron en la plaza."]
        diff:
          - "reunirse — «встретиться, собраться» обычно по договорённости"
          - "congregarse — «собраться» в одном месте, часто толпой, спонтанно"
    analogs:
      - "to gather — собираться"
      - "to congregate — скапливаться"
    dialogue:
      - "Ana: ¿Qué hace esa gente? | Что делают эти люди?"
      - "Pablo: Se han congregado frente al ayuntamiento. | Собрались перед мэрией."
      - "Ana: ¿Por qué? | Зачем?"
      - "Pablo: Para reivindicar mejores salarios. Los trabajadores se congregaron a eso de las ocho con pancartas. | Чтобы добиваться более высоких зарплат. Рабочие собрались около восьми с плакатами."
      - "Ana: ¿Hay muchos? | Много их?"
      - "Pablo: Unos trescientos. Aguardan a que salga el concejal para plantearle sus peticiones. | Около трёхсот. Ждут, когда выйдет советник, чтобы изложить ему свои просьбы."
      - "Ana: ¿Y la policía? | А полиция?"
      - "Pablo: Está atenta, pero por ahora todo es pacífico y reina la concordia. | Наготове, но пока всё мирно и царит согласие."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "congregarse en la plaza — собраться на площади"
      - "la congregación — собрание верующих"
      - "congregar a la multitud — собрать толпу"
    collocation_example: "El acto congregó a miles de personas. — Мероприятие собрало тысячи людей."
    trap: "Возвратный: se congregaron. Без se: congregar a la gente — «собрать людей» (о событии). Не путайте с congratular «поздравлять»."

  - word: prever
    ru: предвидеть; планировать, предполагать
    ipa: /pɾeˈβeɾ/
    say: прэбэ́р
    pron: "Спрягается как ver: preveo, prevés, prevé; причастие — previsto."
    meaning: "Знать заранее или готовиться: учитывать, что произойдёт. «Se prevé que…» — «ожидается, что…»."
    examples:
      - "No previó ningún problema con el viaje. — Он не предвидел никаких проблем с поездкой."
      - "No previó las consecuencias de sus palabras y ahora tiene que dar muchas explicaciones. — Он не предвидел последствий своих слов, и теперь ему приходится давать много объяснений."
      - "Se prevé que llueva mañana por la tarde en todo el norte, con vientos fuertes en la costa. — Ожидается, что завтра днём на всём севере пройдёт дождь, с сильным ветром на побережье."
    origin: "pre- «заранее» + ver «видеть» (лат. videre). Родственные: previsión «прогноз», previsto «ожидаемый», ver «видеть»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: anticipar
        pair: ["Previó el problema.", "Anticipó el problema."]
        diff:
          - "anticipar — «предвосхитить, сказать заранее»"
          - "prever — «увидеть заранее и подготовиться»"
    analogs:
      - "to foresee — предвидеть"
      - "to expect — ожидать"
    dialogue:
      - "Ana: ¿Cuándo llegarán? | Когда они приедут?"
      - "Pablo: Se prevé que lleguen a las nueve. | Предполагается, что они приедут к девяти."
      - "Ana: ¿Y no puede haber retraso? | А задержки не может быть?"
      - "Pablo: Quizá, con este tráfico. Nadie previó que habría obras en la carretera. | Возможно, при таком движении. Никто не предвидел, что на дороге будут работы."
      - "Ana: Siempre pasa algo. | Всегда что-то случается."
      - "Pablo: Por eso conviene prever un margen. Yo siempre cuento con media hora de más. | Поэтому стоит закладывать запас. Я всегда рассчитываю на лишние полчаса."
      - "Ana: Qué previsor. Yo salgo siempre a eso de la hora justa. | Какой ты предусмотрительный. А я всегда выхожу в самый последний момент."
      - "Pablo: Por eso llegas tarde. Aprende a prever. | Поэтому ты и опаздываешь. Учись предвидеть."
    cefr: "B2."
    frequency: "Очень частое в новостях и прогнозах."
    collocations:
      - "se prevé que + subjuntivo — ожидается, что"
      - "como estaba previsto — как и ожидалось"
      - "prever un problema — предвидеть проблему"
    collocation_example: "El tiempo previsto para la obra es de seis meses. — Ожидаемый срок работ — шесть месяцев."
    trap: "Prever пишется без знака ударения в инфинитиве (prever), но в форме prevé — со знаком. Причастие — previsto. Не путайте с prevenir «предотвращать»."

  - word: la afluencia de
    ru: наплыв, приток чего-либо
    ipa: /la aˈfluenθja de/
    say: ла афлуэ́нсья дэ
    pron: "ue — один слог «уэ»; c перед i в Испании — [θ]."
    meaning: "Большое число людей или вещей, которые прибывают разом: наплыв туристов, приток денег."
    examples:
      - "Aumenta la afluencia de turistas en agosto. — В августе растёт наплыв туристов."
      - "La afluencia de inmigrantes cambió el carácter del barrio en pocos años. — Приток иммигрантов изменил характер района за несколько лет."
      - "La afluencia de público fue masiva y la organización tuvo que abrir tres puertas más. — Наплыв публики был огромным, и организаторам пришлось открыть ещё три двери."
    origin: "Из лат. affluentia «приток»: ad- «к» + fluere «течь». Родственные: fluir «течь», flujo «поток», influencia «влияние»."
    register: "Формальное, новостное."
    synonyms:
      - word: llegada masiva
        pair: ["Se esperaba mucha afluencia.", "Se esperaba una llegada masiva."]
        diff:
          - "llegada masiva — «массовое прибытие», проще"
          - "afluencia — «приток, наплыв», как поток"
    analogs:
      - "influx — приток"
      - "turnout — явка, наплыв"
    dialogue:
      - "Ana: ¿Cómo está el museo? | Как музей?"
      - "Pablo: Hay mucha afluencia de visitantes. | Там большой наплыв посетителей."
      - "Ana: ¿Por qué? | Почему?"
      - "Pablo: Por la nueva exposición. La afluencia de público es enorme desde que se anunció en los medios. | Из-за новой выставки. Приток публики огромный с тех пор, как о ней объявили в СМИ."
      - "Ana: ¿Hay colas? | Есть очереди?"
      - "Pablo: Sí, y hay que armarse de paciencia. Se calcula una espera de una hora. | Да, и нужно запастись терпением. Ожидание около часа."
      - "Ana: Voy temprano, entonces. | Тогда пойду пораньше."
      - "Pablo: Buena idea. A primera hora no hay tanta afluencia. | Хорошая мысль. С утра такого наплыва нет."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "afluencia de público — наплыв публики"
      - "gran afluencia — большой наплыв"
      - "afluencia masiva — массовый приток"
    collocation_example: "La afluencia de turistas ha aumentado este año. — Наплыв туристов в этом году вырос."
    trap: "Afluencia — «приток», а influencia — «влияние»: слова похожи, значения разные. Предлог de: afluencia DE turistas."

  - word: desbordar los recursos
    ru: превысить возможности, переполнить ресурсы
    ipa: /desβoɾˈðaɾ los reˈkuɾsos/
    say: дэсборда́р лос рэку́рсос
    pron: "v читается как b; r в начале recursos — раскатистое."
    meaning: "О ситуации: стать больше, чем можно вместить или обеспечить. Desbordar — «переливаться через край»."
    examples:
      - "La lluvia desbordó los recursos de la ciudad. — Дождь превысил возможности города."
      - "La emoción desbordó a todos los presentes cuando el equipo marcó el último gol. — Эмоции захлестнули всех присутствующих, когда команда забила последний гол."
      - "El río desbordó el cauce tras tres días de lluvia y cubrió los campos de cultivo. — Река вышла из берегов после трёх дней дождя и затопила поля."
    origin: "des- + borde «край»: «выйти за край». Родственные: borde «край», desbordamiento «переполнение»."
    register: "Формальное, новостное."
    synonyms:
      - word: sobrepasar
        pair: ["La crisis desbordó los recursos.", "La crisis sobrepasó los recursos."]
        diff:
          - "sobrepasar — «превысить» нейтрально"
          - "desbordar — «перелиться через край», образно: сил уже нет"
    analogs:
      - "to overwhelm resources — исчерпать ресурсы"
      - "to overflow — переполнить"
    dialogue:
      - "Ana: ¿Pueden atender a todos? | Они могут принять всех?"
      - "Pablo: No, la situación desbordó los recursos. | Нет, ситуация превысила ресурсы."
      - "Ana: ¿Qué quieres decir? | Что ты имеешь в виду?"
      - "Pablo: Que llegaron más enfermos de los que podían atender. Los quirófanos están ocupados y hay pacientes esperando en el pasillo. | Что поступило больше больных, чем они могли принять. Операционные заняты, а пациенты ждут в коридоре."
      - "Ana: ¿Y qué solución hay? | И какое решение?"
      - "Pablo: Pedir refuerzos y derivar casos. Pero la envergadura del problema supera todo lo previsto. | Просить подкрепление и перенаправлять случаи. Но масштаб проблемы превышает всё предусмотренное."
      - "Ana: Qué angustia. | Какая тревога."
      - "Pablo: Sí, los médicos están agotados y a punto de venirse abajo. | Да, врачи измотаны и вот-вот сломаются."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "desbordar la capacidad — превысить вместимость"
      - "desbordarse un río — выйти из берегов"
      - "desbordar de alegría — переполниться радостью"
    collocation_example: "La noticia desbordó de alegría a toda la familia. — Новость переполнила радостью всю семью."
    trap: "Desbordar бывает переходным (desbordar algo) и возвратным (desbordarse): «река вышла из берегов». Не путайте с desbordante «безудержный»."

  - word: instar a
    ru: настоятельно призывать, побуждать
    ipa: /insˈtaɾ a/
    say: инста́р а
    pron: "Ударение на последнем слоге: instar."
    meaning: "Настойчиво просить или требовать сделать что-то: «призвать». После a — инфинитив."
    examples:
      - "Instó a todos a mantener la calma. — Он призвал всех сохранять спокойствие."
      - "Los vecinos instan a las autoridades a actuar antes de que ocurra una desgracia. — Жители призывают власти действовать, пока не случилась беда."
      - "El ministro instó a la calma a los ciudadanos y pidió que no salieran de casa esa noche. — Министр призвал граждан к спокойствию и попросил не выходить из дома этой ночью."
    origin: "Из лат. instare «настаивать, стоять вплотную»: in- «на» + stare «стоять». Родственные: instante «момент», insistir «настаивать»."
    register: "Формальное, новостное."
    synonyms:
      - word: exhortar
        pair: ["Insta a todos a colaborar.", "Exhorta a todos a colaborar."]
        diff:
          - "exhortar — «убеждать, увещевать», мягче и торжественнее"
          - "instar — «настаивать, требовать», твёрже"
    analogs:
      - "to urge — настоятельно призывать"
      - "to call on — призвать"
    dialogue:
      - "Ana: ¿Qué pide el Gobierno? | Что просит правительство?"
      - "Pablo: Insta a los ciudadanos a mantener la calma. | Настоятельно призывает граждан сохранять спокойствие."
      - "Ana: ¿Y la gente le hace caso? | И люди слушаются?"
      - "Pablo: Algunos sí, otros no. Mucha gente desconfía y exige que se aclare todo. | Одни да, другие нет. Многие не доверяют и требуют всё прояснить."
      - "Ana: Es comprensible. | Это понятно."
      - "Pablo: El ministro instó también a no difundir rumores. Pero los cotilleos corren por las redes. | Министр также призвал не распространять слухи. Но сплетни гуляют по сети."
      - "Ana: Siempre es igual. | Всегда одно и то же."
      - "Pablo: Sí. Conviene verificar la información antes de compartirla. | Да. Стоит проверять информацию, прежде чем делиться ею."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "instar a alguien a + инфинитив — призвать кого-то сделать"
      - "instar a la calma — призвать к спокойствию"
      - "a instancias de — по настоянию"
    collocation_example: "Instó a las partes a negociar. — Он призвал стороны вести переговоры."
    trap: "Нужен a перед тем, кого призывают, и ещё a перед инфинитивом: instar A alguien A hacer algo. Не путайте с instalar «устанавливать» и estar."

  - word: el flujo
    ru: поток
    ipa: /el ˈfluxo/
    say: эль флу́хо
    pron: "j — «х»: flujo — «флу́хо»."
    meaning: "Непрерывное движение: людей, воды, денег, данных. Flujo de caja — «денежный поток»."
    examples:
      - "Controlan el flujo de visitantes con cuidado. — Они внимательно следят за потоком посетителей."
      - "Hay un flujo constante de información entre los dos departamentos de la empresa. — Между двумя отделами компании идёт постоянный поток информации."
      - "Si el flujo de agua es muy fuerte, hay que cerrar un poco el grifo para no salpicar todo. — Если поток воды очень сильный, нужно немного прикрыть кран, чтобы всё не обрызгать."
    origin: "Из лат. fluxus «течение», от fluere «течь». Родственные: fluir «течь», influjo «влияние», flujo."
    register: "Нейтральное, формальное."
    synonyms:
      - word: la corriente
        pair: ["Un flujo de agua.", "Una corriente de agua."]
        diff:
          - "corriente — «течение» и «ток», направленное движение"
          - "flujo — «поток» как объём, который проходит"
    analogs:
      - "flow — поток"
      - "stream — поток, струя"
    dialogue:
      - "Ana: ¿Cómo está el tráfico? | Как движение?"
      - "Pablo: Hay un flujo constante de coches. | Идёт постоянный поток машин."
      - "Ana: ¿Hay atascos? | Пробки есть?"
      - "Pablo: En la glorieta sí, un poco. Pero el flujo avanza, no está parado. | На кольце да, небольшие. Но поток движется, не стоит."
      - "Ana: Menos mal. Esta mañana tardé una hora por culpa de las obras. | Слава богу. Сегодня утром я потратила час из-за ремонта."
      - "Pablo: Me lo imagino. Con el flujo tan grande, cualquier obra causa follón. | Представляю. При таком потоке любой ремонт вызывает суматоху."
      - "Ana: ¿Hay algún camino alternativo? | Есть какой-нибудь объездной путь?"
      - "Pablo: Sí, desvíate por la avenida, aunque el flujo es mayor allí. | Да, свернуть на проспект, хотя там поток больше."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "flujo de personas — поток людей"
      - "flujo migratorio — миграционный поток"
      - "flujo de caja — денежный поток"
    collocation_example: "El flujo migratorio ha crecido en los últimos años. — Миграционный поток вырос за последние годы."
    trap: "El flujo — мужского рода. Не путайте с fluyo (форма fluir) и fluir «течь»; ещё flujo — медицинский термин «выделения»."

  - word: la envergadura del problema
    ru: масштаб проблемы
    ipa: /la embeɾɣaˈðuɾa del pɾoˈβlema/
    say: ла эмбэргаду́ра дэль проблэ́ма
    pron: "g перед a — [ɣ]; d между гласными мягкое [ð]; ударение на du."
    meaning: "Размер и серьёзность проблемы: насколько она велика. Envergadura — «размах» (крыльев, дела)."
    examples:
      - "No vio la envergadura del problema. — Он не увидел масштаба проблемы."
      - "Nadie imaginaba la envergadura del problema hasta que se publicaron los datos completos. — Никто не представлял масштаба проблемы, пока не опубликовали полные данные."
      - "Los expertos advirtieron de la envergadura del problema, pero el gobierno tardó meses en reaccionar. — Эксперты предупреждали о масштабе проблемы, но правительство месяцами медлило с реакцией."
    origin: "От envergar «натягивать парус на рею» (verga «рея, мачта»): размах паруса. Затем — «размах крыльев» и «масштаб»."
    register: "Формальное, книжное."
    synonyms:
      - word: la magnitud
        pair: ["Comprendió la envergadura del problema.", "Comprendió la magnitud del problema."]
        diff:
          - "magnitud — «величина», нейтральное и более общее"
          - "envergadura — «размах, масштаб», с оттенком серьёзности"
    analogs:
      - "scale — масштаб"
      - "magnitude — величина"
    dialogue:
      - "Ana: ¿Es un problema grave? | Это серьёзная проблема?"
      - "Pablo: Nadie conoce su envergadura. | Никто не знает её масштаба."
      - "Ana: ¿Ni siquiera los expertos? | Даже эксперты?"
      - "Pablo: Ni ellos. Cada día surge algo nuevo y se evidencia que es más grande de lo previsto. | Даже они. Каждый день появляется что-то новое, и становится очевидно, что она больше, чем предполагалось."
      - "Ana: Qué inquietante. | Как тревожно."
      - "Pablo: Sí, y hasta que no se conozca la envergadura del problema, no se podrá actuar con precisión. | Да, и пока масштаб не станет известен, точно действовать не получится."
      - "Ana: ¿Y mientras tanto? | А пока?"
      - "Pablo: Prudencia y paciencia. No hay que precipitarse. | Осторожность и терпение. Торопиться не надо."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "de gran envergadura — большого масштаба"
      - "una obra de envergadura — масштабная работа"
      - "la envergadura de un avión — размах крыльев самолёта"
    collocation_example: "Es un proyecto de gran envergadura. — Это проект большого масштаба."
    trap: "Envergadura — женского рода: la envergadura. Не путайте с envergar «натянуть парус» и enverdecer «позеленеть»."

  - word: el recurso
    ru: средство, ресурс; жалоба (юридическая)
    ipa: /el reˈkuɾso/
    say: эль рэку́рсо
    pron: "r в начале — раскатистое."
    meaning: "Что-то, чем можно воспользоваться: деньги, запас, способ. В праве — «апелляция, жалоба»: presentar un recurso."
    examples:
      - "El abogado presentó un recurso. — Адвокат подал апелляцию."
      - "Tienen pocos recursos económicos, así que no pueden permitirse ni un seguro médico privado. — У них мало денежных средств, так что они не могут позволить себе даже частную медицинскую страховку."
      - "Un buen recurso para aprender idiomas es ver series con subtítulos en el idioma original. — Хороший способ учить языки – смотреть сериалы с субтитрами на языке оригинала."
    origin: "Из лат. recursus «возвращение, прибегание»: re- + currere «бежать». Образ: «прибегнуть к чему-то». Родственные: recurrir «прибегать», curso «курс»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: medio
        pair: ["No tiene recursos.", "No tiene medios."]
        diff:
          - "medio — «способ, средство» вообще"
          - "recurso — «то, что можно использовать», особенно деньги и ресурсы"
    analogs:
      - "resource — ресурс"
      - "appeal — апелляция"
    dialogue:
      - "Ana: ¿Por qué no pueden ayudar? | Почему они не могут помочь?"
      - "Pablo: No tienen recursos suficientes. | У них недостаточно ресурсов."
      - "Ana: ¿Ni siquiera personal? | Даже персонала?"
      - "Pablo: Ni personal ni dinero. Cuentan con pocos recursos y mucha demanda. | Ни персонала, ни денег. У них мало ресурсов и много спроса."
      - "Ana: Entonces el abogado tendrá que presentar un recurso. | Значит, адвокату придётся подать жалобу."
      - "Pablo: Eso hizo. Presentó un recurso ante el tribunal, aunque lo desestimaron. | Именно так и сделал. Подал апелляцию в суд, хотя её отклонили."
      - "Ana: ¿Y no queda ningún otro recurso? | И больше нет никаких средств?"
      - "Pablo: Solo uno: apelar ante un tribunal superior. | Только одно: обратиться в вышестоящий суд."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "recursos naturales — природные ресурсы"
      - "recursos humanos — кадры"
      - "recurso de apelación — апелляционная жалоба"
    collocation_example: "La empresa cuenta con pocos recursos humanos. — В компании мало кадров."
    trap: "Recurso — «ресурс» и «апелляция»: в юридическом тексте — второе. Чаще во множественном: los recursos. Не путайте с recurrir «прибегать»."
