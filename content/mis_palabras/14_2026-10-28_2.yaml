# Пятый список автора, часть 8 — «Desconcierto en el hospital 6» (слова 14–21).
lang: es
words:
  - word: semblante
    ru: выражение лица, вид
    ipa: /semˈblante/
    say: сэмбла́нтэ
    pron: "mb — слитно: «сэмбла́нтэ»."
    meaning: "Как выглядит лицо: по нему видно настроение или состояние человека. Слово чуть торжественное."
    examples:
      - "Tenía un semblante cansado y pálido. — У него был усталый и бледный вид."
      - "Su semblante cambió al oír la noticia: se puso pálido y tuvo que sentarse. — Выражение его лица изменилось, когда он услышал новость: он побледнел и вынужден был сесть."
      - "Tenía el semblante serio y los ojos clavados en el suelo cuando entró en la sala. — У него было серьёзное лицо и взгляд, устремлённый в пол, когда он вошёл в зал."
    origin: "Из франц. semblant «вид, подобие», от sembler «казаться» (лат. similare «уподоблять»). Родственные: semejante «подобный», parecer «казаться»."
    register: "Формальное, литературное."
    synonyms:
      - word: expresión
        pair: ["Su semblante era triste.", "Su expresión era triste."]
        diff:
          - "expresión — «выражение» вообще, и слов, и лица"
          - "semblante — именно «вид лица», как оно выглядит"
    analogs:
      - "countenance — выражение лица"
      - "look — взгляд, вид"
    dialogue:
      - "Ana: ¿Cómo estaba él? | Как он выглядел?"
      - "Pablo: Con el semblante pálido y serio. | С бледным и серьёзным лицом."
      - "Ana: ¿Había recibido alguna mala noticia? | Он получил какую-то плохую новость?"
      - "Pablo: Sí, el médico le hizo saber que la operación era inevitable. Tenía el semblante contraído. | Да, врач дал понять, что операция неизбежна. Лицо у него было напряжённым."
      - "Ana: Pobre. ¿Y la familia? | Бедняга. А семья?"
      - "Pablo: Todos estaban a su lado, con el semblante preocupado, pero intentando sonreír. | Все были рядом, с озабоченными лицами, но пытались улыбаться."
      - "Ana: Qué ternura. | Какая нежность."
      - "Pablo: Sí, y al final su semblante se relajó. Se sintió respaldado. | Да, и в конце его лицо расслабилось. Он почувствовал поддержку."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "un semblante serio — серьёзное лицо"
      - "cambiar el semblante — измениться в лице"
      - "semblante pálido — бледное лицо"
    collocation_example: "Su semblante se ensombreció de repente. — Его лицо вдруг потемнело."
    trap: "Semblante — мужского рода: el semblante. Не путайте с semblanza «биографический очерк» и sembrar «сеять»."

  - word: proporcionar
    ru: предоставлять, выдавать
    ipa: /pɾopoɾθjoˈnaɾ/
    say: пропорсьона́р
    pron: "c перед i в Испании — [θ]; ударение на последнем слоге."
    meaning: "Дать то, что нужно: информацию, помощь, материалы. Чуть формальнее, чем dar."
    examples:
      - "Nos proporcionó mapas y comida. — Он снабдил нас картами и едой."
      - "Me proporcionó toda la información que necesitaba para terminar el informe a tiempo. — Он предоставил мне всю информацию, нужную, чтобы вовремя закончить отчёт."
      - "El hotel proporciona toallas y jabón a todos los clientes, sin ningún coste adicional. — Отель предоставляет полотенца и мыло всем клиентам без дополнительной платы."
    origin: "От proporción «соотношение» (лат. proportio, от pro portione «по доле»). «Снабжать в нужной мере». Родственные: porción «доля», parte «часть»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: facilitar
        pair: ["Nos proporcionó los datos.", "Nos facilitó los datos."]
        diff:
          - "facilitar — «предоставить, облегчить доступ»"
          - "proporcionar — «снабдить нужным», более общее"
    analogs:
      - "to provide — предоставлять"
      - "to supply — снабжать"
    dialogue:
      - "Ana: ¿Quién te dio el documento? | Кто дал тебе документ?"
      - "Pablo: Me lo proporcionó la secretaria. | Мне его предоставила секретарь."
      - "Ana: ¿Sin problemas? | Без проблем?"
      - "Pablo: Ninguno. Fue muy amable y me proporcionó también una copia y un sobre. | Никаких. Она была очень любезна и также предоставила мне копию и конверт."
      - "Ana: Qué eficacia. ¿Y la información? | Какая эффективность. А информация?"
      - "Pablo: También me la proporcionó ella, sin que yo se lo pidiera. | Тоже предоставила она, хотя я не просил."
      - "Ana: Entonces, habrá que agradecérselo. | Тогда придётся её поблагодарить."
      - "Pablo: Sí, le llevaré unos bollos mañana. | Да, завтра принесу ей булочек."
    cefr: "B2."
    frequency: "Частое в официальных текстах."
    collocations:
      - "proporcionar información — предоставить информацию"
      - "proporcionar ayuda — оказать помощь"
      - "proporcionar un servicio — предоставить услугу"
    collocation_example: "La empresa proporciona formación a todos sus empleados. — Компания обеспечивает обучением всех сотрудников."
    trap: "Proporcionar — «предоставить», а не «пропорционировать». Не путайте с proporción «соотношение» и proporcional «пропорциональный»."

  - word: desechar la idea
    ru: отбросить мысль
    ipa: /deseˈtʃaɾ la iˈðea/
    say: дэсэча́р ла иде́а
    pron: "ch — «ч»; d между гласными мягкое [ð]."
    meaning: "Решительно отказаться от мысли или плана: выбросить из головы. Desechar — «выбрасывать, отвергать»."
    examples:
      - "Desechó la idea de viajar. — Он отбросил мысль о поездке."
      - "Los ingenieros desecharon la idea original porque era demasiado cara y arriesgada. — Инженеры отказались от первоначальной идеи, потому что она была слишком дорогой и рискованной."
      - "Desecha esos pensamientos negativos y piensa en todo lo bueno que has conseguido este año. — Отбрось эти негативные мысли и подумай обо всём хорошем, чего ты добился в этом году."
    origin: "От des- + echar «бросать» (лат. iactare): «выбросить прочь». Родственные: echar «бросать», desecho «отбросы»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: descartar
        pair: ["Desechó la idea.", "Descartó la idea."]
        diff:
          - "descartar — «исключить из вариантов», как отбросить карту"
          - "desechar — «выбросить как негодное»"
    analogs:
      - "to discard — отбросить"
      - "to dismiss — отбросить, отвергнуть"
    dialogue:
      - "Ana: ¿Sigues pensando en irte? | Ты всё ещё думаешь уехать?"
      - "Pablo: No, ya desecho esa idea. | Нет, я уже отбрасываю эту мысль."
      - "Ana: ¿Qué te ha hecho cambiar? | Что тебя заставило передумать?"
      - "Pablo: Me hablé a mí mismo con calma. Pensé en mi familia y en mis amigos, y desistí. | Я спокойно поговорил сам с собой. Подумал о семье и друзьях и отказался."
      - "Ana: Me alegro. Te echaría de menos. | Рада. Я бы по тебе скучала."
      - "Pablo: Y yo a vosotros. Además, la oferta era una tomadura de pelo. | И я по вам. К тому же предложение было издевательством."
      - "Ana: ¿Y qué piensas hacer ahora? | И что ты теперь планируешь?"
      - "Pablo: Quedarme y seguir buscando algo mejor aquí. Desechar la idea ha sido un alivio. | Остаться и продолжить искать что-то лучшее здесь. Отказ от идеи стал облегчением."
    cefr: "C1."
    frequency: "Частое."
    collocations:
      - "desechar una idea — отбросить идею"
      - "desechar un plan — отказаться от плана"
      - "material desechable — одноразовый материал"
    collocation_example: "Tuvimos que desechar el plan por falta de dinero. — Нам пришлось отказаться от плана из-за нехватки денег."
    trap: "Не путайте desechar «выбросить» с desecar «высушить» и deshacer «разобрать»."

  - word: lo que sí
    ru: а вот что действительно...
    ipa: /lo ke ˈsi/
    say: ло кэ си
    pron: "sí со знаком ударения — «да»; произносится протяжно, с нажимом."
    meaning: "Оборот для противопоставления: «чего не было — то не было, зато вот что было». Подчёркивает утвердительный пример."
    examples:
      - "Lo que sí quiero es dormir. — А вот чего я действительно хочу, так это спать."
      - "No me interesa su opinión; lo que sí me interesa son sus datos. — Мне не интересно его мнение, а вот что мне интересно – это его данные."
      - "Lo que sí sé es que él no estaba allí aquella noche, porque lo vi en el restaurante. — Что я знаю точно, так это то, что его там в ту ночь не было, потому что я видел его в ресторане."
    origin: "lo que «то, что» + sí «да, именно». Дословно «то, что именно (да)»: утвердительное усиление."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: eso sí
        pair: ["Lo que sí necesito es descansar.", "Lo que necesito, eso sí, es descansar."]
        diff:
          - "eso sí — «но вот это уж точно»"
          - "lo que sí — вводит конкретный факт после отрицания"
    analogs:
      - "what I do know is — а вот что я точно знаю"
      - "what I do have is — а вот что у меня есть"
    dialogue:
      - "Ana: ¿Tienes planes para hoy? | У тебя есть планы на сегодня?"
      - "Pablo: Lo que sí tengo es mucho sueño. | Зато у меня много сонливости."
      - "Ana: ¿No has dormido bien? | Ты плохо спал?"
      - "Pablo: Apenas. Lo que sí hice anoche fue dar vueltas en la cama hasta las cuatro. | Почти нет. Зато вчера ночью я ворочался в постели до четырёх."
      - "Ana: Qué agotamiento. Lo que sí podrías hacer es tomar una siesta. | Какая усталость. А вот что ты мог бы сделать — вздремнуть."
      - "Pablo: Eso sí. Lo que no quiero es tomar más café. | Это да. А вот чего я не хочу, так это ещё кофе."
      - "Ana: Pues descansa un rato, y luego ya vemos. | Тогда отдохни немного, а потом посмотрим."
      - "Pablo: Hecho. Lo que sí te pido es que no me despiertes antes de las cinco. | Договорились. Одно я прошу: не буди меня раньше пяти."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "lo que sí — а вот что именно"
      - "eso sí — но это уж точно"
      - "pues sí — да, конечно"
    collocation_example: "No sé qué hacer, lo que sí sé es que no puedo esperar. — Не знаю, что делать, но точно знаю, что ждать не могу."
    trap: "Sí со знаком ударения — «да»; si без знака — «если». В «lo que sí» — именно с ударением."

  - word: recriminar
    ru: упрекать
    ipa: /rekɾimiˈnaɾ/
    say: рэкримина́р
    pron: "r в начале — раскатистое."
    meaning: "Сказать человеку, что он поступил плохо: корить, ставить в вину. Чаще укоризной, не криком."
    examples:
      - "Le recriminó su falta de interés. — Он упрекнул её в отсутствии интереса."
      - "Su padre le recriminaba que nunca llamara a casa, aunque lo hacía con cariño. — Отец упрекал его, что он никогда не звонит домой, хотя делал это с любовью."
      - "No me recrimines por lo que pasó: yo hice lo que me pidió el jefe y nada más. — Не упрекай меня в том, что случилось: я сделал то, что просил начальник, и ничего больше."
    origin: "Из лат. recriminari «обвинять в ответ»: re- «в ответ» + criminari «обвинять» (crimen «обвинение»). Родственные: crimen «преступление», criminal."
    register: "Формальное, книжное."
    synonyms:
      - word: reprochar
        pair: ["Le recriminó su actitud.", "Le reprochó su actitud."]
        diff:
          - "reprochar — «упрекнуть», обычное слово"
          - "recriminar — «упрекать, ставить в вину», чуть строже"
    analogs:
      - "to reproach — упрекать"
      - "to blame — винить"
    dialogue:
      - "Ana: ¿Qué te dijo? | Что он тебе сказал?"
      - "Pablo: Me recriminó haber llegado tarde. | Упрекнул меня за опоздание."
      - "Ana: ¿Delante de todos? | При всех?"
      - "Pablo: Sí, y con un tono muy chulo. Me sentí humillado y agaché la cabeza. | Да, и очень наглым тоном. Я почувствовал себя униженным и опустил голову."
      - "Ana: ¿Y le explicaste lo del neumático? | И ты объяснил ему про шину?"
      - "Pablo: No me dejó. Me recriminó una y otra vez sin atender a razones. | Он не дал мне. Упрекал снова и снова, не слушая доводов."
      - "Ana: Qué injusto. Deberías hablar con él en privado. | Какая несправедливость. Тебе стоило бы поговорить с ним наедине."
      - "Pablo: Lo haré. Prefiero abordar el tema con calma, cuando se le pase la cólera. | Поговорю. Предпочитаю заговорить об этом спокойно, когда его гнев пройдёт."
    cefr: "C1."
    frequency: "Частое в прозе."
    collocations:
      - "recriminar algo a alguien — упрекнуть кого-то в чём-то"
      - "recriminarse a sí mismo — корить себя"
      - "una recriminación — упрёк"
    collocation_example: "Se recriminaba no haber ayudado antes. — Он корил себя за то, что не помог раньше."
    trap: "Recriminar algo A alguien: упрёк (что) — прямое дополнение, человек — a. Не путайте с incriminar «инкриминировать» и criminal «преступный»."

  - word: acostado
    ru: лежащий
    ipa: /akosˈtaðo/
    say: акоста́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О человеке: лежащий в постели или на чём-то. Чаще estar acostado."
    examples:
      - "Estaba acostado en el sofá. — Он лежал на диване."
      - "El niño ya está acostado, así que habla bajo para no despertarlo. — Мальчик уже лежит в постели, так что говори тихо, чтобы его не разбудить."
      - "Pasó el día entero acostado en la cama, con fiebre y sin fuerzas para levantarse. — Он провёл весь день в постели, с температурой и без сил встать."
    origin: "Причастие от acostar «укладывать»: от costado «бок», то есть «положить на бок». Родственные: costado «бок», acostarse «лечь»."
    register: "Нейтральное."
    synonyms:
      - word: tumbado
        pair: ["Estaba acostado en la cama.", "Estaba tumbado en la cama."]
        diff:
          - "tumbado — «лежащий», чаще в Испании: на траве, на диване"
          - "acostado — «лежащий (в постели)», чаще в Латинской Америке"
    analogs:
      - "lying down — лежащий"
      - "in bed — в постели"
    dialogue:
      - "Ana: ¿Dónde está Luis? | Где Луис?"
      - "Pablo: Acostado, no se siente bien. | Лежит, ему нехорошо."
      - "Ana: ¿Qué le pasa? | Что с ним?"
      - "Pablo: Está resfriado, con fiebre y encogido bajo la colcha. Se acostó a eso de las seis. | Простужен, с температурой, свернулся под покрывалом. Лёг около шести."
      - "Ana: Pobre. ¿Le llevo algo? | Бедняга. Принести ему что-нибудь?"
      - "Pablo: Un té caliente y un kleenex, por favor. Y que no se destape. | Горячий чай и платок, пожалуйста. И чтобы он не раскрывался."
      - "Ana: ¿Está dormido? | Он спит?"
      - "Pablo: No, acostado pero despierto, esperando que se le pase. | Нет, лежит, но не спит, ждёт, пока пройдёт."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "estar acostado — лежать"
      - "acostarse — лечь спать"
      - "acostar a un niño — уложить ребёнка"
    collocation_example: "Acosté a los niños a las nueve. — Я уложил детей в девять."
    trap: "Acostado — причастие: acostada, acostados. Спрягается o → ue: me acuesto, te acuestas. Не путайте с acostumbrado «привыкший»."

  - word: dar un disgusto
    ru: огорчить, расстроить
    ipa: /ˈdaɾ un disˈɣusto/
    say: дар ун дисгу́сто
    pron: "sg — слитно: «дис-гу́сто»; ударение на gus."
    meaning: "Причинить человеку неприятность или горе: «ты меня расстроил». Disgusto — «огорчение, досада»."
    examples:
      - "Perdona, no quería darte un disgusto. — Прости, я не хотел тебя огорчать."
      - "Si sigues sacando esas notas, vas a dar un disgusto a tus padres. — Если будешь и дальше получать такие оценки, ты огорчишь родителей."
      - "No quiero darle un disgusto a mi madre, así que no le voy a contar lo que ha pasado. — Я не хочу огорчать маму, так что не буду рассказывать ей о том, что случилось."
    origin: "dis- «не» + gusto «вкус, удовольствие» (лат. gustus): «лишение удовольствия». Родственные: gusto «вкус», disgustar «не нравиться»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: dar una pena
        pair: ["Me dio un disgusto.", "Me dio una pena."]
        diff:
          - "dar pena — «причинить грусть, вызвать жалость»"
          - "dar un disgusto — «огорчить, расстроить», поступком или новостью"
    analogs:
      - "to upset — расстроить"
      - "to give someone a shock — огорчить"
    dialogue:
      - "Ana: ¿Por qué lloras? | Почему ты плачешь?"
      - "Pablo: Mi hijo me ha dado un disgusto. | Сын меня расстроил."
      - "Ana: ¿Qué ha pasado? | Что случилось?"
      - "Pablo: Ha suspendido tres asignaturas y lo ha escondido. Me enteré por un cotilleo de otra madre. | Он провалил три предмета и скрыл это. Я узнал из сплетни другой мамы."
      - "Ana: ¡Vaya! ¿Y qué le dijiste? | Ого! И что ты ему сказал?"
      - "Pablo: Le hice saber que no me enfadaba por las notas, sino por la mentira. Me dio un disgusto enorme. | Дал понять, что злюсь не из-за оценок, а из-за обмана. Он очень меня расстроил."
      - "Ana: Habla con él con ternura. A su edad, es normal equivocarse. | Поговори с ним нежно. В его возрасте ошибаться нормально."
      - "Pablo: Lo sé. Pero me quitó un peso de encima ver que se arrepiente. | Знаю. Но с души упал груз, когда увидел, что он раскаивается."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "llevarse un disgusto — расстроиться"
      - "dar un disgusto — огорчить"
      - "disgusto — недовольство"
    collocation_example: "Se llevó un disgusto al ver sus notas. — Он расстроился, увидев свои оценки."
    trap: "Disgusto — «огорчение», а не «отвращение» (asco). Для «расстроиться» — llevarse un disgusto. Не путайте disgustar с gustar «нравиться»."

  - word: prestar declaración
    ru: дать показания
    ipa: /pɾesˈtaɾ deklaɾaˈθjon/
    say: прэста́р дэкларасьо́н
    pron: "c перед i в Испании — [θ]; ударение на последнем слоге."
    meaning: "Рассказать суду или полиции, что известно: свидетель, подозреваемый. Declaración — «показание, заявление»."
    examples:
      - "Tuvo que prestar declaración en comisaría. — Ему пришлось дать показания в участке."
      - "Los dos sospechosos prestaron declaración por separado y sus versiones no coincidían. — Двое подозреваемых давали показания по отдельности, и их версии не совпали."
      - "El testigo prestó declaración ante el juez durante más de dos horas, con un abogado a su lado. — Свидетель давал показания перед судьёй больше двух часов, с адвокатом рядом."
