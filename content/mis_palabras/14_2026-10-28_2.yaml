# Пятый список автора, часть 8 — «Desconcierto en el hospital 6» (слова 14–21).
lang: es
words:
  - word: semblante
    ru: выражение лица, вид
    ipa: /semˈblante/
    say: сэмбла́нтэ
    pron: "mb — слитно: «сэмбла́нтэ»."
    meaning: "Как выглядит лицо: по нему видно настроение или состояние человека. Слово чуть торжественное."
    examples:
      - "Tenía el semblante serio. — У него было серьёзное лицо."
      - "Su semblante cambió al oír la noticia. — Выражение его лица изменилось, когда он услышал новость."
    origin: "Из франц. semblant «вид, подобие», от sembler «казаться» (лат. similare «уподоблять»). Родственные: semejante «подобный», parecer «казаться»."
    register: "Формальное, литературное."
    synonyms:
      - word: expresión
        pair: ["Su semblante era triste.", "Su expresión era triste."]
        diff:
          - "expresión — «выражение» вообще, и слов, и лица"
          - "semblante — именно «вид лица», как оно выглядит"
    analogs:
      - "countenance — выражение лица"
      - "look — взгляд, вид"
    dialogue:
      - "Ana: ¿Cómo estaba él? | Каким он был?"
      - "Pablo: Con el semblante pálido y serio. | С бледным и серьёзным лицом."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "un semblante serio — серьёзное лицо"
      - "cambiar el semblante — измениться в лице"
      - "semblante pálido — бледное лицо"
    collocation_example: "Su semblante se ensombreció de repente. — Его лицо вдруг потемнело."
    trap: "Semblante — мужского рода: el semblante. Не путайте с semblanza «биографический очерк» и sembrar «сеять»."

  - word: proporcionar
    ru: предоставлять, выдавать
    ipa: /pɾopoɾθjoˈnaɾ/
    say: пропорсьона́р
    pron: "c перед i в Испании — [θ]; ударение на последнем слоге."
    meaning: "Дать то, что нужно: информацию, помощь, материалы. Чуть формальнее, чем dar."
    examples:
      - "El hotel proporciona toallas y jabón. — Отель предоставляет полотенца и мыло."
      - "Me proporcionó toda la información. — Он предоставил мне всю информацию."
    origin: "От proporción «соотношение» (лат. proportio, от pro portione «по доле»). «Снабжать в нужной мере». Родственные: porción «доля», parte «часть»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: facilitar
        pair: ["Nos proporcionó los datos.", "Nos facilitó los datos."]
        diff:
          - "facilitar — «предоставить, облегчить доступ»"
          - "proporcionar — «снабдить нужным», более общее"
    analogs:
      - "to provide — предоставлять"
      - "to supply — снабжать"
    dialogue:
      - "Ana: ¿Quién te dio el documento? | Кто дал тебе документ?"
      - "Pablo: Me lo proporcionó la secretaria. | Мне его выдала секретарь."
    cefr: "B2."
    frequency: "Частое в официальных текстах."
    collocations:
      - "proporcionar información — предоставить информацию"
      - "proporcionar ayuda — оказать помощь"
      - "proporcionar un servicio — предоставить услугу"
    collocation_example: "La empresa proporciona formación a todos sus empleados. — Компания обеспечивает обучением всех сотрудников."
    trap: "Proporcionar — «предоставить», а не «пропорционировать». Не путайте с proporción «соотношение» и proporcional «пропорциональный»."

  - word: desechar la idea
    ru: отбросить мысль
    ipa: /deseˈtʃaɾ la iˈðea/
    say: дэсэча́р ла иде́а
    pron: "ch — «ч»; d между гласными мягкое [ð]."
    meaning: "Решительно отказаться от мысли или плана: выбросить из головы. Desechar — «выбрасывать, отвергать»."
    examples:
      - "Desechó la idea de viajar. — Он отбросил мысль о поездке."
      - "Desecha esos pensamientos negativos. — Выброси из головы эти мрачные мысли."
    origin: "От des- + echar «бросать» (лат. iactare): «выбросить прочь». Родственные: echar «бросать», desecho «отбросы»."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: descartar
        pair: ["Desechó la idea.", "Descartó la idea."]
        diff:
          - "descartar — «исключить из вариантов», как отбросить карту"
          - "desechar — «выбросить как негодное»"
    analogs:
      - "to discard — отбросить"
      - "to dismiss — отбросить, отвергнуть"
    dialogue:
      - "Ana: ¿Sigues pensando en irte? | Ты всё ещё думаешь уехать?"
      - "Pablo: No, ya desecho esa idea. | Нет, уже оставил эту мысль."
    cefr: "C1."
    frequency: "Частое."
    collocations:
      - "desechar una idea — отбросить идею"
      - "desechar un plan — отказаться от плана"
      - "material desechable — одноразовый материал"
    collocation_example: "Tuvimos que desechar el plan por falta de dinero. — Нам пришлось отказаться от плана из-за нехватки денег."
    trap: "Не путайте desechar «выбросить» с desecar «высушить» и deshacer «разобрать»."

  - word: lo que sí
    ru: а вот что действительно...
    ipa: /lo ke ˈsi/
    say: ло кэ си
    pron: "sí со знаком ударения — «да»; произносится протяжно, с нажимом."
    meaning: "Оборот для противопоставления: «чего не было — то не было, зато вот что было». Подчёркивает утвердительный пример."
    examples:
      - "No tenía dinero, pero lo que sí tenía era tiempo. — Денег у него не было, зато времени было достаточно."
      - "Lo que sí sé es que él no estaba allí. — Что я точно знаю, так это что его там не было."
    origin: "lo que «то, что» + sí «да, именно». Дословно «то, что именно (да)»: утвердительное усиление."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: eso sí
        pair: ["Lo que sí necesito es descansar.", "Lo que necesito, eso sí, es descansar."]
        diff:
          - "eso sí — «но вот это уж точно»"
          - "lo que sí — вводит конкретный факт после отрицания"
    analogs:
      - "what I do know is — а вот что я точно знаю"
      - "what I do have is — а вот что у меня есть"
    dialogue:
      - "Ana: ¿Tienes planes para hoy? | У тебя есть планы на сегодня?"
      - "Pablo: Lo que sí tengo es mucho sueño. | Что у меня точно есть, так это сильное желание спать."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "lo que sí — а вот что именно"
      - "eso sí — но это уж точно"
      - "pues sí — да, конечно"
    collocation_example: "No sé qué hacer, lo que sí sé es que no puedo esperar. — Не знаю, что делать, но точно знаю, что ждать не могу."
    trap: "Sí со знаком ударения — «да»; si без знака — «если». В «lo que sí» — именно с ударением."

  - word: recriminar
    ru: упрекать
    ipa: /rekɾimiˈnaɾ/
    say: рэкримина́р
    pron: "r в начале — раскатистое."
    meaning: "Сказать человеку, что он поступил плохо: корить, ставить в вину. Чаще укоризной, не криком."
    examples:
      - "Le recriminó su falta de interés. — Он упрекнул её в отсутствии интереса."
      - "No me recrimines por lo que pasó. — Не упрекай меня в том, что случилось."
    origin: "Из лат. recriminari «обвинять в ответ»: re- «в ответ» + criminari «обвинять» (crimen «обвинение»). Родственные: crimen «преступление», criminal."
    register: "Формальное, книжное."
    synonyms:
      - word: reprochar
        pair: ["Le recriminó su actitud.", "Le reprochó su actitud."]
        diff:
          - "reprochar — «упрекнуть», обычное слово"
          - "recriminar — «упрекать, ставить в вину», чуть строже"
    analogs:
      - "to reproach — упрекать"
      - "to blame — винить"
    dialogue:
      - "Ana: ¿Qué te dijo? | Что он тебе сказал?"
      - "Pablo: Me recriminó haber llegado tarde. | Он упрекнул меня за опоздание."
    cefr: "C1."
    frequency: "Частое в прозе."
    collocations:
      - "recriminar algo a alguien — упрекнуть кого-то в чём-то"
      - "recriminarse a sí mismo — корить себя"
      - "una recriminación — упрёк"
    collocation_example: "Se recriminaba no haber ayudado antes. — Он корил себя за то, что не помог раньше."
    trap: "Recriminar algo A alguien: упрёк (что) — прямое дополнение, человек — a. Не путайте с incriminar «инкриминировать» и criminal «преступный»."

  - word: acostado
    ru: лежащий
    ipa: /akosˈtaðo/
    say: акоста́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О человеке: лежащий в постели или на чём-то. Чаще estar acostado."
    examples:
      - "Estaba acostado en el sofá. — Он лежал на диване."
      - "El niño ya está acostado. — Мальчик уже лежит в постели."
    origin: "Причастие от acostar «укладывать»: от costado «бок», то есть «положить на бок». Родственные: costado «бок», acostarse «лечь»."
    register: "Нейтральное."
    synonyms:
      - word: tumbado
        pair: ["Estaba acostado en la cama.", "Estaba tumbado en la cama."]
        diff:
          - "tumbado — «лежащий», чаще в Испании: на траве, на диване"
          - "acostado — «лежащий (в постели)», чаще в Латинской Америке"
    analogs:
      - "lying down — лежащий"
      - "in bed — в постели"
    dialogue:
      - "Ana: ¿Dónde está Luis? | Где Луис?"
      - "Pablo: Acostado, no se siente bien. | Лежит, плохо себя чувствует."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "estar acostado — лежать"
      - "acostarse — лечь спать"
      - "acostar a un niño — уложить ребёнка"
    collocation_example: "Acosté a los niños a las nueve. — Я уложил детей в девять."
    trap: "Acostado — причастие: acostada, acostados. Спрягается o → ue: me acuesto, te acuestas. Не путайте с acostumbrado «привыкший»."

  - word: dar un disgusto
    ru: огорчить, расстроить
    ipa: /ˈdaɾ un disˈɣusto/
    say: дар ун дисгу́сто
    pron: "sg — слитно: «дис-гу́сто»; ударение на gus."
    meaning: "Причинить человеку неприятность или горе: «ты меня расстроил». Disgusto — «огорчение, досада»."
    examples:
      - "No quiero darle un disgusto a mi madre. — Не хочу огорчать маму."
      - "Me dio un buen disgusto con la noticia. — Он сильно расстроил меня этой новостью."
    origin: "dis- «не» + gusto «вкус, удовольствие» (лат. gustus): «лишение удовольствия». Родственные: gusto «вкус», disgustar «не нравиться»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: dar una pena
        pair: ["Me dio un disgusto.", "Me dio una pena."]
        diff:
          - "dar pena — «причинить грусть, вызвать жалость»"
          - "dar un disgusto — «огорчить, расстроить», поступком или новостью"
    analogs:
      - "to upset — расстроить"
      - "to give someone a shock — огорчить"
    dialogue:
      - "Ana: ¿Por qué lloras? | Почему ты плачешь?"
      - "Pablo: Mi hijo me ha dado un disgusto. | Сын меня расстроил."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "llevarse un disgusto — расстроиться"
      - "dar un disgusto — огорчить"
      - "disgusto — недовольство"
    collocation_example: "Se llevó un disgusto al ver sus notas. — Он расстроился, увидев свои оценки."
    trap: "Disgusto — «огорчение», а не «отвращение» (asco). Для «расстроиться» — llevarse un disgusto. Не путайте disgustar с gustar «нравиться»."

  - word: prestar declaración
    ru: дать показания
    ipa: /pɾesˈtaɾ deklaɾaˈθjon/
    say: прэста́р дэкларасьо́н
    pron: "c перед i в Испании — [θ]; ударение на последнем слоге."
    meaning: "Рассказать суду или полиции, что известно: свидетель, подозреваемый. Declaración — «показание, заявление»."
    examples:
      - "El testigo prestó declaración ante el juez. — Свидетель дал показания судье."
      - "Tuvo que prestar declaración en comisaría. — Ему пришлось дать показания в участке."
    origin: "prestar «давать, одалживать» (лат. praestare «обеспечивать») + declaración «заявление» (лат. declaratio «разъяснение»). «Дать» показания."
    register: "Формальное, юридическое."
    synonyms:
      - word: declarar
        pair: ["Prestó declaración.", "Declaró."]
        diff:
          - "declarar — короткий глагол «дать показания, заявить»"
          - "prestar declaración — устойчивое официальное выражение"
    analogs:
      - "to testify — давать показания"
      - "to give a statement — дать показание"
    dialogue:
      - "Ana: ¿Qué hizo el testigo? | Что сделал свидетель?"
      - "Pablo: Prestó declaración durante dos horas. | Давал показания два часа."
    cefr: "C1."
    frequency: "Частое в юридических новостях."
    collocations:
      - "prestar declaración — дать показания"
      - "declaración jurada — показание под присягой"
      - "tomar declaración — допросить"
    collocation_example: "La policía le tomó declaración durante horas. — Полиция допрашивала его несколько часов."
    trap: "С глаголом prestar, не «dar»: prestar declaración. Prestar ещё «одолжить»: prestar dinero. Не путайте с prestar atención «обращать внимание»."
