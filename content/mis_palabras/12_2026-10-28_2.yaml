# Пятый список автора, часть 4 — «La situación está fuera de control. Ceuta» (слова 15–24).
lang: es
words:
  - word: sortear
    ru: обходить, избегать; жеребьёвка
    ipa: /soɾteˈaɾ/
    say: сортеа́р
    pron: "ea — два слога: sor-te-ar."
    meaning: "Обойти препятствие или опасность. Ещё — «разыграть по жребию»: sortear un premio."
    examples:
      - "Sorteó el bache con un giro rápido. — Он объехал яму быстрым поворотом."
      - "El conductor sorteó el camión parado en la carretera con un giro rápido. — Водитель объехал остановившийся на дороге грузовик резким поворотом."
      - "Logró sortear todos los obstáculos del camino y llegó a la cima antes que los demás. — Ему удалось обойти все препятствия на пути, и он добрался до вершины раньше остальных."
    origin: "От suerte «судьба, жребий» (лат. sors, sortis): «бросать жребий»; затем — «ловко обойти» (о препятствии, как бык, уворачиваясь). Родственные: suerte «удача», sorteo «розыгрыш»."
    register: "Нейтральное."
    synonyms:
      - word: esquivar
        pair: ["Sorteó el control.", "Esquivó el control."]
        diff:
          - "esquivar — «увернуться» быстро, физически"
          - "sortear — «обойти» препятствие умело, часто с хитростью"
    analogs:
      - "to get around — обойти"
      - "to draw lots — тянуть жребий"
    dialogue:
      - "Ana: ¿Cómo evitaron los problemas? | Как они избежали проблем?"
      - "Pablo: Lograron sortear las dificultades. | Им удалось обойти трудности."
      - "Ana: ¿Cómo? | Как?"
      - "Pablo: Con mucha sagacidad. Se anticiparon, desviaron la ruta y evitaron el choque. | С большой проницательностью. Они предвидели, изменили маршрут и избежали столкновения."
      - "Ana: Qué suerte. ¿Y el sorteo? | Повезло. А жеребьёвка?"
      - "Pablo: Se hizo ayer. Salió elegido un chaval del barrio. Se llevó una gran sorpresa. | Прошла вчера. Выбрали парня из нашего района. Он был очень удивлён."
      - "Ana: ¡Qué ilusión! | Какая радость!"
      - "Pablo: Sí, le embargó la ilusión. Y no podía parar de sonreír. | Да, его охватила радость. И он не мог перестать улыбаться."
    cefr: "C1."
    frequency: "Частое."
    collocations:
      - "sortear un obstáculo — обойти препятствие"
      - "sortear la ley — обойти закон"
      - "sorteo de lotería — лотерейный розыгрыш"
    collocation_example: "Sortearon la ley para evitar pagar impuestos. — Они обошли закон, чтобы не платить налоги."
    trap: "Sortear — «обойти» и «разыграть»: контекст подскажет. Sorteo — «розыгрыш, жеребьёвка». Не путайте с sorprender «удивлять»."

  - word: por vía marítima
    ru: морским путём
    ipa: /poɾ ˈbia maˈɾitima/
    say: пор би́а мари́тима
    pron: "ударение на ri: marítima; v читается как b."
    meaning: "Устойчивое сочетание: «по морю», «морским транспортом». Vía — «путь, дорога»."
    examples:
      - "Enviamos el paquete por vía marítima. — Мы отправили посылку морем."
      - "Cruzaron el estrecho por vía marítima, porque el puente estaba cerrado por obras. — Они пересекли пролив морем, потому что мост был закрыт на ремонт."
      - "Las mercancías llegan por vía marítima desde Asia y tardan casi cuarenta días en el puerto. — Товары прибывают морским путём из Азии и идут до порта почти сорок дней."
    origin: "vía «путь» (лат. via) + marítima «морская» (лат. maritimus, от mare «море»). Родственные: mar «море», marinero «моряк», viaje «поездка»."
    register: "Формальное, официальное."
    synonyms:
      - word: por mar
        pair: ["Viajan por vía marítima.", "Viajan por mar."]
        diff:
          - "por mar — просто «по морю», разговорное"
          - "por vía marítima — официальный термин о перевозках и маршрутах"
    analogs:
      - "by sea — морем"
      - "by sea route — морским путём"
    dialogue:
      - "Ana: ¿Cómo enviaron el paquete? | Как отправили посылку?"
      - "Pablo: Por vía marítima, tarda un mes. | Морским путём, идёт месяц."
      - "Ana: ¿Un mes? ¿Y por qué no por avión? | Месяц? А почему не самолётом?"
      - "Pablo: Porque es mucho más barato. Con tanta pasta en juego, prefieren ahorrar. | Потому что намного дешевле. Когда на кону столько денег, они предпочитают экономить."
      - "Ana: Pero hay riesgo de retraso. | Но есть риск задержки."
      - "Pablo: Sí. A veces el paquete se queda esperando en un almacén del puerto. | Да. Иногда посылка простаивает на складе в порту."
      - "Ana: Qué agobio. | Какая нервотрёпка."
      - "Pablo: Hay que armarse de paciencia. Lo que llega por vía marítima nunca llega con prisas. | Нужно запастись терпением. То, что приходит морем, никогда не приходит впопыхах."
    cefr: "B2."
    frequency: "Частое в новостях о перевозках и миграции."
    collocations:
      - "por vía aérea — по воздуху"
      - "por vía terrestre — по суше"
      - "por vía postal — почтой"
    collocation_example: "El envío llegará por vía aérea en dos días. — Отправление придёт самолётом за два дня."
    trap: "Vía пишется со знаком ударения. Формула: por vía + прилагательное: por vía aérea, por vía terrestre."

  - word: dictaminar
    ru: выносить постановление, вердикт
    ipa: /diktamiˈnaɾ/
    say: диктамина́р
    pron: "Ударение на последнем слоге: dictaminar."
    meaning: "Официально решить, как поступить: суд, эксперт, комиссия. Dictamen — «заключение»."
    examples:
      - "El juez dictaminó el cierre del local. — Судья постановил закрыть заведение."
      - "Los expertos dictaminaron el cierre del edificio por riesgo de derrumbe. — Эксперты вынесли заключение о закрытии здания из-за риска обрушения."
      - "El tribunal dictaminó que el acusado era culpable y lo condenó a siete años de cárcel. — Суд вынес решение, что обвиняемый виновен, и приговорил его к семи годам тюрьмы."
    origin: "От dictamen «мнение, заключение» (лат. dictamen, от dictare «диктовать»). Родственные: dictar «диктовать; выносить», dictador «диктатор»."
    register: "Формальное, юридическое."
    synonyms:
      - word: dictar sentencia
        pair: ["El juez dictaminó.", "El juez dictó sentencia."]
        diff:
          - "dictar sentencia — «вынести приговор»"
          - "dictaminar — «вынести заключение или решение» шире, и экспертам"
    analogs:
      - "to rule — постановить"
      - "to pronounce — огласить"
    dialogue:
      - "Ana: ¿Qué decidió el juez? | Что решил судья?"
      - "Pablo: Dictaminó que el contrato era nulo. | Постановил, что договор недействителен."
      - "Ana: ¡Madre mía! ¿Por qué? | Боже мой! Почему?"
      - "Pablo: Porque se había firmado bajo presión. Se evidenció que la firma estaba falsificada. | Потому что он был подписан под давлением. Стало очевидно, что подпись подделана."
      - "Ana: ¿Y quién la falsificó? | И кто подделал?"
      - "Pablo: Aún lo están investigando. El juez dictaminó también que se abra otra causa. | Это ещё расследуют. Судья также постановил завести ещё одно дело."
      - "Ana: Y la fiscalía, ¿qué dice? | А прокуратура что говорит?"
      - "Pablo: Respalda la decisión y ha convocado a los implicados. | Поддерживает решение и вызвала причастных."
    cefr: "C1."
    frequency: "Частое в юридических новостях."
    collocations:
      - "dictaminar la sentencia — вынести приговор"
      - "dictamen pericial — заключение эксперта"
      - "dictaminar que… — постановить, что…"
    collocation_example: "El tribunal dictaminó que la ley era inconstitucional. — Суд постановил, что закон неконституционен."
    trap: "Dictaminar — «вынести решение», dictar — «диктовать» и «продиктовать закон». Не путайте с dictadura «диктатура»."

  - word: reforzar
    ru: подкреплять, усиливать
    ipa: /refoɾˈθaɾ/
    say: рэфорса́р
    pron: "z в Испании — [θ]; спрягается o → ue: refuerzo, refuerzas; перед e z → c: reforcé."
    meaning: "Сделать сильнее: прочнее, многочисленнее, убедительнее. Reforzar la seguridad — «усилить охрану»."
    examples:
      - "Reforzaron la puerta con una barra. — Дверь укрепили железным прутом."
      - "Este resultado refuerza mi opinión de que deberíamos cambiar de proveedor cuanto antes. — Этот результат укрепляет моё мнение, что нам нужно как можно скорее сменить поставщика."
      - "Reforzaron el techo con vigas de hierro para que aguantara el peso de la nieve. — Крышу укрепили железными балками, чтобы она выдержала вес снега."
    origin: "re- «снова, ещё» + forzar «усиливать» (лат. fortiare, от fortis «сильный»). Родственные: fuerza «сила», esfuerzo «усилие», refuerzo «подкрепление»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: fortalecer
        pair: ["Refuerza la defensa.", "Fortalece la defensa."]
        diff:
          - "fortalecer — «укрепить, сделать сильным» вообще"
          - "reforzar — «усилить добавкой»: людей, материала, довода"
    analogs:
      - "to reinforce — усиливать"
      - "to strengthen — укреплять"
    dialogue:
      - "Ana: ¿Qué hizo la policía? | Что сделала полиция?"
      - "Pablo: Reforzó la vigilancia. | Усилила наблюдение."
      - "Ana: ¿Dónde? | Где?"
      - "Pablo: En el centro, tras el escándalo. Desplegó efectivos y reforzó los controles en las calles. | В центре, после скандала. Развернула силы и усилила контроль на улицах."
      - "Ana: ¿Y sirve de algo? | И это помогает?"
      - "Pablo: Quizá, pero solo si se refuerza también la confianza de la gente. | Возможно, но только если усиливается и доверие людей."
      - "Ana: Tienes razón. Sin confianza, no hay concordia. | Ты прав. Без доверия нет согласия."
      - "Pablo: Exacto. Reforzar la seguridad es solo una parte de la solución. | Именно. Усиление безопасности — лишь часть решения."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "reforzar la seguridad — усилить охрану"
      - "reforzar un argumento — подкрепить довод"
      - "reforzar a alguien — поддержать кого-то"
    collocation_example: "Quiero reforzar mi inglés este verano. — Хочу подтянуть английский этим летом."
    trap: "Спрягается o → ue: refuerzo, refuerzas. Перед e z → c: reforcé. Не путайте с forzar «принуждать» и esfuerzo «усилие»."

  - word: desmentido por la realidad
    ru: опровергнутый действительностью
    ipa: /desmenˈtiðo poɾ la rrealiˈðað/
    say: дэсмэнти́до пор ла рреалида́д
    pron: "d между гласными мягкое [ð]; rr на стыке слов — раскатистое."
    meaning: "О заявлении или надежде: на деле оказалось неправдой. Desmentir — «опровергать»."
    examples:
      - "Su optimismo fue desmentido por la realidad. — Его оптимизм опроверг реальный ход событий."
      - "Aquellas promesas de crecimiento fueron desmentidas por la realidad en menos de seis meses. — Те обещания роста были опровергнуты реальностью меньше чем за полгода."
      - "Su teoría fue desmentida por la realidad cuando los datos del último año no coincidieron con nada. — Его теория была опровергнута действительностью, когда данные за последний год ни с чем не совпали."
    origin: "desmentido — причастие от desmentir «опровергать» (des- «не» + mentir «лгать»). Realidad — «действительность» (лат. realis, от res «вещь»)."
    register: "Формальное, книжное."
    synonyms:
      - word: refutado por los hechos
        pair: ["La promesa fue desmentida por la realidad.", "La promesa fue refutada por los hechos."]
        diff:
          - "refutado por los hechos — «опровергнутый фактами»"
          - "desmentido — «объявленный ложью», слово шире: и официальное опровержение"
    analogs:
      - "belied by reality — опровергнутый реальностью"
      - "contradicted by the facts — противоречащий фактам"
    dialogue:
      - "Ana: ¿Funcionó el plan? | План сработал?"
      - "Pablo: No, fue desmentido por la realidad. | Нет, действительность его опровергла."
      - "Ana: ¿Qué falló? | Что не получилось?"
      - "Pablo: Todo se había calculado con optimismo, pero la afluencia fue mucho mayor y se desbordaron los recursos. | Всё было рассчитано оптимистично, но наплыв оказался гораздо больше, и ресурсы были превышены."
      - "Ana: Una lección más. | Ещё один урок."
      - "Pablo: Sí. Los políticos prometen mucho, y luego la realidad los desmiente. | Да. Политики много обещают, а потом действительность их опровергает."
      - "Ana: ¿Y qué van a hacer ahora? | И что они теперь будут делать?"
      - "Pablo: Plantear otro plan, más realista. Eso espero. | Предложить другой план, более реалистичный. Надеюсь."
    cefr: "C1."
    frequency: "Нечастое: в публицистике."
    collocations:
      - "desmentir una noticia — опровергнуть новость"
      - "desmentir un rumor — опровергнуть слух"
      - "ser desmentido — быть опровергнутым"
    collocation_example: "El ministro desmintió los rumores de dimisión. — Министр опроверг слухи об отставке."
    trap: "Desmentir спрягается как sentir: desmiento, desmintió. Не путайте с desmentido (существительное «опровержение»): un desmentido oficial."

  - word: difundirse
    ru: распространяться
    ipa: /difunˈdiɾse/
    say: дифунди́рсэ
    pron: "Ударение на di: difundirse."
    meaning: "О новости, слухе, идее: разойтись среди людей. Difundir — «распространять»."
    examples:
      - "El rumor se difundió muy rápido. — Слух распространился очень быстро."
      - "El virus se difundió por todo el país antes de que las autoridades reaccionaran. — Вирус распространился по всей стране раньше, чем власти отреагировали."
      - "La noticia se difundió rápidamente por las redes sociales, y en una hora la conocía todo el país. — Новость быстро распространилась по социальным сетям, и за час о ней знала вся страна."
    origin: "Из лат. diffundere «разливать»: dis- «врозь» + fundere «лить». Родственные: fundir «плавить», confundir «путать», difusión «распространение»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: propagarse
        pair: ["La noticia se difundió.", "La noticia se propagó."]
        diff:
          - "propagarse — «распространяться» как волна, болезнь, огонь"
          - "difundirse — «разойтись» среди людей, о новостях и идеях"
    analogs:
      - "to spread — распространяться"
      - "to circulate — циркулировать"
    dialogue:
      - "Ana: ¿Cómo lo supiste? | Как ты узнал?"
      - "Pablo: Se difundió por las redes. | Это разошлось по сетям."
      - "Ana: ¿Tan rápido? | Так быстро?"
      - "Pablo: En menos de una hora. El rumor se difundió y la gente se hizo eco sin comprobarlo. | Меньше чем за час. Слух разошёлся, и люди подхватили его, не проверяя."
      - "Ana: Ahí está el peligro. | В этом и опасность."
      - "Pablo: Sí. Una noticia falsa que se difunde puede avivar un conflicto entero. | Да. Ложная новость, которая распространяется, может разжечь целый конфликт."
      - "Ana: ¿Y cómo se evita? | И как этого избежать?"
      - "Pablo: Verificando y no difundiendo nada sin tener constancia. | Проверяя и не распространяя ничего без подтверждения."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "difundir una noticia — распространить новость"
      - "difundirse por las redes — разойтись по соцсетям"
      - "la difusión — распространение"
    collocation_example: "El vídeo se difundió por las redes en pocas horas. — Видео разошлось по соцсетям за несколько часов."
    trap: "Difundir — «распространять информацию», а divulgar — «популяризировать». Не путайте с difuso «расплывчатый»."

  - word: regir
    ru: действовать, регулировать (о законе)
    ipa: /reˈxiɾ/
    say: рэхи́р
    pron: "g перед i — «х»; спрягается как pedir: rijo, riges, rige."
    meaning: "О законе, правиле, порядке: быть в силе, действовать. Ещё — «управлять»."
    examples:
      - "Estas reglas rigen en toda la escuela. — Эти правила действуют во всей школе."
      - "La ley que rige la industria es muy antigua y necesita una reforma urgente. — Закон, регулирующий отрасль, очень старый и нуждается в срочной реформе."
      - "Estas normas rigen en todo el país desde hace más de veinte años, aunque pocos las conocen. — Эти нормы действуют по всей стране уже больше двадцати лет, хотя мало кто их знает."
    origin: "Из лат. regere «править, управлять». Родственные: régimen «режим», rey «король», regla «правило», dirigir «направлять»."
    register: "Формальное, юридическое."
    synonyms:
      - word: estar vigente
        pair: ["La ley rige desde enero.", "La ley está vigente desde enero."]
        diff:
          - "estar vigente — «быть в силе», о законах и документах"
          - "regir — «действовать, регулировать», шире"
    analogs:
      - "to govern — регулировать"
      - "to be in force — действовать"
    dialogue:
      - "Ana: ¿Desde cuándo es válida la norma? | С каких пор действует норма?"
      - "Pablo: Rige desde el uno de enero. | Действует с первого января."
      - "Ana: ¿Para todos? | Для всех?"
      - "Pablo: Para todos los ciudadanos. Rige también para las empresas, que tendrán que declarar el IVA con más detalle. | Для всех граждан. Действует и для компаний, которым придётся подробнее декларировать НДС."
      - "Ana: ¿Y hay excepciones? | И есть исключения?"
      - "Pablo: Pocas. Lo que rige en la ley es claro: hay que cumplirla sin excusas. | Немного. То, что предписано законом, ясно: его нужно соблюдать без отговорок."
      - "Ana: Qué estricto. | Как строго."
      - "Pablo: Sí, pero así rige el sistema. | Да, но так устроена система."
    cefr: "C1."
    frequency: "Частое в юридических текстах."
    collocations:
      - "regir las normas — действовать нормам"
      - "regirse por — руководствоваться"
      - "el régimen que rige — действующий режим"
    collocation_example: "El contrato se rige por la ley española. — Договор регулируется испанским законодательством."
    trap: "Спрягается как pedir: rijo (с j перед o), rige. Не путайте regir «управлять, действовать» с regar «поливать»."

  - word: convocar a
    ru: вызывать, созывать кого-либо
    ipa: /komboˈkaɾ a/
    say: комбока́р а
    pron: "v читается как b; перед e c → qu: convoqué."
    meaning: "Официально позвать людей прийти: на собрание, в суд, на экзамен. Convocar a alguien."
    examples:
      - "El juez convocó a los testigos. — Судья вызвал свидетелей."
      - "Convocaron a los vecinos a una reunión para hablar de las obras del parque. — Жителей созвали на собрание, чтобы поговорить о работах в парке."
      - "El sindicato convocó a todos los trabajadores a una asamblea extraordinaria en el patio de la fábrica. — Профсоюз созвал всех рабочих на экстренное собрание во дворе фабрики."
    origin: "Из лат. convocare: con- «вместе» + vocare «звать». Родственные: voz «голос», vocación «призвание», convocatoria «созыв»."
    register: "Формальное."
    synonyms:
      - word: citar
        pair: ["Convocaron a los testigos.", "Citaron a los testigos."]
        diff:
          - "citar — «вызвать на конкретное время», суд, врач"
          - "convocar — «созвать» многих, на собрание, экзамен"
    analogs:
      - "to summon — вызвать"
      - "to convene — созвать"
    dialogue:
      - "Ana: ¿Para qué te llaman? | Зачем тебя вызывают?"
      - "Pablo: Me han convocado a una reunión. | Меня вызвали на встречу."
      - "Ana: ¿Cuándo? | Когда?"
      - "Pablo: Mañana a las diez, en el despacho del jefe. Sin previo aviso, como siempre. | Завтра в десять, в кабинете начальника. Без предупреждения, как всегда."
      - "Ana: ¿Y sabes de qué se trata? | И ты знаешь, о чём речь?"
      - "Pablo: Ni idea. Presiento que es algo importante. Ya me convocaron la semana pasada, y todo salió bien. | Понятия не имею. Предчувствую, что это что-то важное. На прошлой неделе уже вызывали, и всё прошло хорошо."
      - "Ana: Pues buena suerte. | Тогда удачи."
      - "Pablo: Gracias. Si me convocan otra vez, me pongo nervioso. | Спасибо. Если вызовут ещё раз, я начну нервничать."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "convocar a alguien — вызвать кого-то"
      - "convocar a elecciones — назначить выборы"
      - "una convocatoria — созыв, объявление"
    collocation_example: "El presidente convocó a los ministros de urgencia. — Президент срочно созвал министров."
    trap: "Для людей нужен a: convocar a alguien. Для событий без a: convocar elecciones. Не путайте с convencer «убеждать»."

  - word: no ceder ni un ápice
    ru: не уступить ни на йоту
    ipa: /no θeˈðeɾ ni un ˈapiθe/
    say: но сэдэ́р ни ун а́писэ
    pron: "c перед e в Испании — [θ]; ápice — «а́писэ», ударение на a."
    meaning: "Ни на каплю не поступиться своей позицией. Ápice — «кончик, крошка»."
    examples:
      - "No cedió ni un ápice en la discusión. — Он не уступил ни на йоту в споре."
      - "Ninguna de las dos partes quiso ceder ni un ápice en la negociación. — Ни одна из сторон не захотела уступить ни на йоту на переговорах."
      - "No voy a ceder ni un ápice, porque sé que tengo la razón y que los datos me respaldan. — Я не уступлю ни на йоту, потому что знаю, что прав и что данные на моей стороне."
    origin: "ceder «уступать» (лат. cedere «отходить») + ápice «крошечная частица» (лат. apex «верхушка, остриё»). Родственные: apex, ceder."
    register: "Формальное, книжное."
    synonyms:
      - word: no dar su brazo a torcer
        pair: ["No cedió ni un ápice.", "No dio su brazo a torcer."]
        diff:
          - "no dar el brazo a torcer — разговорное «не сдаться, не поступиться»"
          - "no ceder ni un ápice — книжное, «ни на йоту»"
    analogs:
      - "not to give an inch — не уступить ни дюйма"
      - "not to budge — не сдвинуться"
    dialogue:
      - "Ana: ¿Aceptó el trato? | Он принял сделку?"
      - "Pablo: No, no cedió ni un ápice. | Нет, не уступил ни на йоту."
      - "Ana: Qué cabezota. | Какой упрямый."
      - "Pablo: Sí, el trato era bueno, pero él quería más. Tiene un carácter absorbente. | Да, сделка была хорошей, но он хотел большего. У него властный характер."
      - "Ana: ¿Y los otros? | А остальные?"
      - "Pablo: Tampoco cedieron. Estaban todos tensos y nadie quiso agachar la cabeza. | Тоже не уступили. Все были напряжены, и никто не хотел опускать голову."
      - "Ana: Así no hay concordia posible. | Так согласия не добиться."
      - "Pablo: Lo sé. Hará falta mucha paciencia para desbloquear esto. | Знаю. Понадобится много терпения, чтобы сдвинуть это с мёртвой точки."
    cefr: "C1."
    frequency: "Частое в новостях и политике."
    collocations:
      - "ni un ápice — ни на йоту"
      - "ceder terreno — уступить позиции"
      - "ceder el paso — уступить дорогу"
    collocation_example: "Cedió el paso a una señora mayor. — Он уступил дорогу пожилой даме."
    trap: "Ápice — мужского рода: un ápice, со знаком ударения. Ceder спрягается регулярно: cedo, cedes. Знак ударения в ápice обязателен."

  - word: poner el foco en
    ru: сделать акцент на чём-либо
    ipa: /poˈneɾ el ˈfoko en/
    say: понэ́р эль фо́ко эн
    pron: "Спрягается: pongo, pones, pone; причастие — puesto."
    meaning: "Обратить внимание на что-то конкретное: сфокусироваться. Foco — «прожектор, фокус»."
    examples:
      - "Pongamos el foco en lo esencial. — Сосредоточимся на главном."
      - "La directora puso el foco en la educación de los más pequeños. — Директор сделала акцент на образовании самых маленьких."
      - "El informe pone el foco en la seguridad de los trabajadores y deja de lado el tema del salario. — В отчёте акцент делается на безопасности работников, а тема зарплаты оставлена в стороне."
    origin: "poner «класть» + foco «прожектор» (лат. focus «очаг»). Образ: направить свет прожектора на нужное место. Родственные: enfocar «наводить фокус»."
    register: "Нейтральное, публицистическое."
    synonyms:
      - word: centrarse en
        pair: ["Pone el foco en el problema.", "Se centra en el problema."]
        diff:
          - "centrarse en — «сосредоточиться», нейтрально"
          - "poner el foco en — образное «осветить прожектором», подчёркнуто обратить внимание"
    analogs:
      - "to put the spotlight on — направить свет на"
      - "to focus on — сосредоточиться на"
    dialogue:
      - "Ana: ¿Sobre qué trata el informe? | О чём доклад?"
      - "Pablo: Pone el foco en la educación. | Делает акцент на образовании."
      - "Ana: ¿Y no habla de la sanidad? | А о здравоохранении не говорит?"
      - "Pablo: Apenas. El autor quiso poner el foco en las escuelas y en la falta de recursos. | Едва. Автор хотел сосредоточиться на школах и нехватке ресурсов."
      - "Ana: Entiendo. Tiene sentido concentrarse en un tema. | Понимаю. Есть смысл сосредоточиться на одной теме."
      - "Pablo: Sí. Con tantos asuntos, conviene poner el foco en lo esencial. | Да. При таком количестве вопросов стоит сосредоточиться на главном."
      - "Ana: ¿Y qué propone? | И что он предлагает?"
      - "Pablo: Reforzar la plantilla y atender a las necesidades reales de los alumnos. | Усилить штат и учитывать реальные нужды учеников."
    cefr: "C1."
    frequency: "Частое в журналистике."
    collocations:
      - "poner el foco en — акцентировать"
      - "en el foco de atención — в центре внимания"
      - "enfocar el problema — рассмотреть проблему"
    collocation_example: "El documental pone el foco en la vida de los pescadores. — Документальный фильм акцентирует жизнь рыбаков."
    trap: "Не путайте foco «прожектор; очаг» с foca «тюлень»."
