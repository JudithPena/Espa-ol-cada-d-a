# Четвёртый список автора, часть 3 — «Desconcierto en el hospital 3» (слова 25–36).
lang: es
words:
  - word: carné de identidad
    ru: удостоверение личности
    ipa: /kaɾˈne de iðentiˈðað/
    say: карне́ дэ идэнтида́д
    pron: "d между гласными и на конце мягкое [ð]. Ударение на последнем слоге: identidad."
    meaning: "Документ, подтверждающий, кто вы: с фото, именем, номером. В Испании чаще DNI."
    examples:
      - "Enséñame tu carné de identidad. — Покажи мне своё удостоверение личности."
      - "Para entrar en la oficina hay que enseñar el carné de identidad. — Чтобы войти в офис, нужно показать удостоверение личности."
      - "Perdí el carné de identidad en el viaje y tuve que pedir un duplicado en la comisaría. — Я потерял удостоверение личности в поездке и должен был запросить дубликат в участке."
    origin: "carné — из франц. carnet «записная книжка, книжечка»; identidad — от лат. idem «тот же самый»: «тождество личности»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: DNI
        pair: ["Enséñame el carné de identidad.", "Enséñame el DNI."]
        diff:
          - "DNI — Documento Nacional de Identidad: как называют удостоверение в Испании в быту"
          - "carné de identidad — полное название, и в Латинской Америке"
    analogs:
      - "ID card — удостоверение личности"
      - "identity card — то же, полнее"
    dialogue:
      - "Ana: ¿Llevas el carné? | У тебя с собой удостоверение?"
      - "Pablo: Sí, el carné de identidad está en la cartera. | Да, удостоверение личности в кошельке."
      - "Ana: Enséñamelo, por favor. Tengo que anotar los datos. | Покажи, пожалуйста. Мне нужно записать данные."
      - "Pablo: Aquí tienes. Oye, la foto sale irreconocible. | Вот. Слушай, на фото меня не узнать."
      - "Ana: Pareces otra persona. ¿Cuántos años tenías? | Ты как другой человек. Сколько тебе тогда было?"
      - "Pablo: Dieciocho. Aparentaba menos, con esa melena. | Восемнадцать. Выглядел младше, с такой гривой."
      - "Ana: Pues vale, el carné está en vigor. Puedes guardarlo. | Ладно, удостоверение действительно. Можешь убрать."
      - "Pablo: Gracias. Y no lo pierdas de vista, que cualquiera podría suplantar mi personalidad. | Спасибо. И не выпускай его из виду, а то кто угодно может выдать себя за меня."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "renovar el carné — обновить документ"
      - "carné de conducir — водительские права"
      - "carné de socio — членский билет"
    collocation_example: "Necesito renovar el carné de identidad. — Мне нужно обновить удостоверение личности."
    trap: "Carné пишется со знаком ударения и без t в конце: carné, а не «carnet» (так во Франции). Права — carné de conducir."

  - word: engañar
    ru: обманывать
    ipa: /eŋɡaˈɲaɾ/
    say: энганья́р
    pron: "ñ — «нь»; n перед g звучит как носовое [ŋ]."
    meaning: "Говорить или делать неправду, чтобы человек поверил в ложное. Ещё — изменять партнёру: engañar a su pareja."
    examples:
      - "Me engañaron con el precio del billete. — Меня обманули с ценой билета."
      - "Ya sé lo que pasó realmente aquella noche, así que no intentes engañarme. — Я уже знаю, что на самом деле случилось той ночью, так что не пытайся меня обмануть."
      - "Me engañaron en la tienda, porque el reloj que compré no era de oro, como decían. — Меня обманули в магазине, потому что часы, которые я купил, были не из золота, как говорили."
    origin: "Вероятно, из позднелат. ingannare «обманывать»: слово пришло из народной латыни. Родственные: engaño «обман», engañoso «обманчивый»."
    register: "Нейтральное."
    synonyms:
      - word: mentir
        pair: ["Me engañó con el precio.", "Me mintió con el precio."]
        diff:
          - "mentir — «лгать», говорить неправду"
          - "engañar — шире: и словом, и действием, чтобы поверили в ложное"
    analogs:
      - "to deceive — обманывать"
      - "to cheat — обманывать; изменять"
    dialogue:
      - "Ana: ¿Por qué estás tan enfadado? | Почему ты так зол?"
      - "Pablo: Porque me engañaron con el precio. | Потому что меня обманули с ценой."
      - "Ana: ¿Cómo fue? | Как это было?"
      - "Pablo: Me dijeron cien euros más IVA, y en caja eran ciento cincuenta. | Мне сказали сто евро плюс НДС, а на кассе вышло сто пятьдесят."
      - "Ana: ¿Y dijiste algo? | И ты что-нибудь сказал?"
      - "Pablo: Claro. Pero esgrimieron un cargo oculto que ni siquiera constaba en la factura. | Конечно. Но они сослались на скрытый платёж, которого даже не было в счёте."
      - "Ana: ¡Qué estafa! Hay que reclamar. | Какое мошенничество! Надо подавать жалобу."
      - "Pablo: Eso voy a hacer. No pienso dejar que me engañen otra vez. | Именно так и сделаю. Не позволю, чтобы меня обманули снова."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "engañar a alguien — обмануть кого-то"
      - "engañar al fisco — обмануть налоговую"
      - "dejarse engañar — дать себя обмануть"
    collocation_example: "No te dejes engañar por las apariencias. — Не дай внешности тебя обмануть."
    trap: "Engañar — «обмануть, ввести в заблуждение», а mentir — «лгать». Перед человеком нужен a: engañar a mi amigo."

  - word: sollozar
    ru: всхлипывать
    ipa: /soʎoˈθaɾ/
    say: сойоса́р
    pron: "ll в большинстве регионов — как «й»; z в Испании — [θ]; перед e z меняется на c: sollocé."
    meaning: "Плакать, часто прерывисто, со всхлипами, с трудом."
    examples:
      - "Sollozaba junto a la ventana, sola. — Она всхлипывала у окна одна."
      - "Abrazado a su oso de peluche, el niño sollozó hasta quedarse dormido. — Обнимая своего плюшевого мишку, мальчик всхлипывал, пока не уснул."
      - "Sollozaba en silencio, con la cara entre las manos, para que los niños no la oyeran. — Она тихо всхлипывала, закрыв лицо руками, чтобы дети её не услышали."
    origin: "Из лат. singultiare «икать, захлёбываться». Родственное: sollozo «всхлип», hipo «икота»."
    register: "Нейтральное, литературное."
    synonyms:
      - word: llorar
        pair: ["Sollozaba desesperada.", "Lloraba desesperada."]
        diff:
          - "llorar — просто «плакать»"
          - "sollozar — «плакать со всхлипами», тише и прерывистее"
    analogs:
      - "to sob — всхлипывать"
      - "to weep — плакать"
    dialogue:
      - "Ana: ¿Dónde está la niña? | Где девочка?"
      - "Pablo: En su cuarto, sollozando. | В своей комнате, всхлипывает."
      - "Ana: ¿Qué le ha pasado? | Что с ней случилось?"
      - "Pablo: Se enteró de que su amiga se muda. Estaba alterada y ni siquiera quiso cenar. | Она узнала, что подруга переезжает. Была расстроена и даже ужинать не стала."
      - "Ana: Pobrecita. ¿Has hablado con ella? | Бедняжка. Ты с ней говорил?"
      - "Pablo: Un poco. Pero cuando está así, solo balbucea y solloza sin parar. | Немного. Но когда она такая, только бормочет и всхлипывает без остановки."
      - "Ana: Déjame entrar a mí. Con ternura suele calmarse. | Позволь мне зайти. С нежностью она обычно успокаивается."
      - "Pablo: Vale. Yo mientras preparo algo caliente. | Хорошо. А я пока приготовлю что-нибудь горячее."
    cefr: "C1."
    frequency: "Нечастое: в прозе."
    collocations:
      - "sollozar de pena — всхлипывать от горя"
      - "un sollozo — всхлип"
      - "entre sollozos — сквозь всхлипы"
    collocation_example: "Habló entre sollozos. — Она говорила сквозь всхлипы."
    trap: "Перед e z меняется на c: sollocé. Не путайте sollozar «всхлипывать» с solucionar «решать»: слова похожи по звучанию."

  - word: suplantar la personalidad de alguien
    ru: выдавать себя за другого человека
    ipa: /suplanˈtaɾ la peɾsonaliˈðað de ˈalɣjen/
    say: супланта́р ла пэрсоналида́д дэ а́льгьен
    pron: "Ударение на последних слогах: suplantar, personalidad."
    meaning: "Присвоить чужое имя или роль, чтобы действовать от его имени: подделать личность. Юридический термин: suplantación de identidad."
    examples:
      - "Suplantó la personalidad de su compañero. — Он выдал себя за своего коллегу."
      - "En internet y con mis fotos, abrieron cuentas falsas cuando suplantaron mi identidad. — В интернете и с моими фотографиями создали фальшивые аккаунты, когда кто-то выдал себя за меня."
      - "Lo acusan de suplantar la personalidad de su hermano para cobrar una pensión que no le correspondía. — Его обвиняют в том, что он выдавал себя за брата, чтобы получать пенсию, которая ему не полагалась."
    origin: "suplantar — из лат. supplantare «подставлять подножку»: sub- «под» + planta «подошва». Образ: человека «подсекли» и заняли его место."
    register: "Формальное, юридическое."
    synonyms:
      - word: hacerse pasar por
        pair: ["Suplantó a su hermano.", "Se hizo pasar por su hermano."]
        diff:
          - "hacerse pasar por — обычное разговорное «выдать себя за»"
          - "suplantar — юридическое, о присвоении личности"
    analogs:
      - "to impersonate — выдавать себя за кого-то"
      - "identity theft — кража личности"
    dialogue:
      - "Ana: ¿De qué lo acusan? | В чём его обвиняют?"
      - "Pablo: De suplantar la personalidad de otro. | В том, что он выдавал себя за другого."
      - "Ana: ¿Y cómo lo hizo? | И как он это делал?"
      - "Pablo: Usó el carné de identidad de un conocido y abrió una cuenta falsa. | Использовал удостоверение личности знакомого и открыл поддельный счёт."
      - "Ana: ¿Con qué fin? | С какой целью?"
      - "Pablo: Mediante esa cuenta desvió fondos durante meses. Nadie se dio cuenta. | Через этот счёт он месяцами выводил средства. Никто не замечал."
      - "Ana: ¿Y cómo lo descubrieron? | И как раскрыли?"
      - "Pablo: Un inspector con mucha sagacidad notó que la firma cambiaba cada vez. | Один инспектор с большой проницательностью заметил, что подпись каждый раз менялась."
    cefr: "C1."
    frequency: "Частое в новостях о мошенничестве."
    collocations:
      - "suplantación de identidad — кража личности"
      - "suplantar a alguien — выдавать себя за кого-то"
      - "delito de suplantación — преступление подмены личности"
    collocation_example: "La suplantación de identidad es un delito. — Выдавать себя за другого — преступление."
    trap: "Часто говорят suplantar a alguien без «la personalidad»: «Suplantó a su primo». Не путайте с suplir «заменять» и sustituir «заменять»: те — без обмана."

  - word: salir la verdad a relucir
    ru: правда выйдет наружу
    ipa: /saˈliɾ la beɾˈðað a reluˈθiɾ/
    say: сали́р ла бэрда́д а рэлуси́р
    pron: "c перед i в Испании — [θ]; v читается как b."
    meaning: "Скрытое становится известным: «шила в мешке не утаишь». Relucir — «блестеть, сиять»: правда «выходит на свет»."
    examples:
      - "Con el tiempo salió todo a relucir. — Со временем всё вышло наружу."
      - "Por mucho que lo intenten esconder, tarde o temprano saldrá la verdad a relucir. — Как бы они ни пытались это скрыть, рано или поздно правда выйдет наружу."
      - "En cuanto empezó el juicio, empezaron a salir a relucir los secretos de la familia. — Как только начался суд, на свет стали выходить семейные тайны."
    origin: "relucir — «блестеть» (лат. relucere: re- + lucere «светить»). Образ: правда выходит на свет и сверкает, и её уже нельзя скрыть."
    register: "Нейтральное, чуть книжное."
    synonyms:
      - word: salir a la luz
        pair: ["Salió la verdad a relucir.", "La verdad salió a la luz."]
        diff:
          - "salir a la luz — нейтральнее и привычнее"
          - "salir a relucir — образнее, «выплыло на свет»"
    analogs:
      - "the truth will out — правда выйдет наружу"
      - "to come to light — выйти на свет"
    dialogue:
      - "Ana: ¿Crees que lo sabrán? | Ты думаешь, они узнают?"
      - "Pablo: Algún día saldrá la verdad a relucir. | Когда-нибудь правда выйдет наружу."
      - "Ana: Ojalá. Llevan años ocultándolo. | Хорошо бы. Они скрывают это годами."
      - "Pablo: Siempre pasa. Un testigo habla, aparece una prueba, y todo se descubre. | Так всегда бывает. Свидетель заговорит, найдётся улика, и всё раскроется."
      - "Ana: Y cuando salga la verdad a relucir, habrá consecuencias nefastas. | А когда правда выйдет наружу, будут пагубные последствия."
      - "Pablo: Para los culpables, sí. Para el resto será un alivio. | Для виновных да. Для остальных это будет облегчением."
      - "Ana: Pues yo me quitaría un peso de encima. | Я бы точно сняла с души груз."
      - "Pablo: Y yo también. La verdad siempre acaba apareciendo. | И я тоже. Правда всегда в конце концов появляется."
    cefr: "C1."
    frequency: "Нечастое: фразеологизм."
    collocations:
      - "salir a relucir — всплыть"
      - "sacar a relucir — припомнить, выложить"
      - "salir a la luz — стать известным"
    collocation_example: "En la discusión sacó a relucir viejos problemas. — В споре он припомнил старые проблемы."
    trap: "Не путайте salir a relucir «всплыть» с sacar a relucir «припомнить, вытащить»: в первом правда выходит сама, во втором кто-то её достаёт."

  - word: agachar la cabeza
    ru: опустить голову
    ipa: /aɡaˈtʃaɾ la kaˈβeθa/
    say: агача́р ла кабэ́са
    pron: "ch — «ч»; z/c в Испании — [θ]."
    meaning: "Наклонить голову вниз: от стыда, покорности, чтобы спрятаться. Ещё — «покориться, смириться»."
    examples:
      - "No pienso agachar la cabeza ante nadie. — Я ни перед кем не склоню голову."
      - "Sin decir nada más, los obreros volvieron al trabajo y agacharon la cabeza. — Больше ничего не сказав, рабочие вернулись к работе, опустив головы."
      - "Agachó la cabeza avergonzado cuando el profesor leyó su nombre en voz alta delante de todos. — Он опустил голову от стыда, когда учитель прочитал его имя вслух перед всеми."
    origin: "Происхождение неясно; слово связывают с gacho «наклонённый, пригнутый». Родственное: agacharse «пригнуться»."
    register: "Нейтральное."
    synonyms:
      - word: bajar la cabeza
        pair: ["Agachó la cabeza.", "Bajó la cabeza."]
        diff:
          - "bajar la cabeza — «опустить голову», более нейтрально"
          - "agachar la cabeza — чуть образнее, часто со смыслом «покориться»"
    analogs:
      - "to bow one's head — склонить голову"
      - "to hang one's head — повесить голову"
    dialogue:
      - "Ana: ¿Qué hizo cuando lo regañaron? | Что он сделал, когда его отругали?"
      - "Pablo: Agachó la cabeza y no dijo nada. | Опустил голову и ничего не сказал."
      - "Ana: ¿Ni siquiera se defendió? | Даже не защищался?"
      - "Pablo: No, estaba muy avergonzado. Sabía que se había equivocado. | Нет, ему было очень стыдно. Он знал, что ошибся."
      - "Ana: Eso demuestra madurez. | Это показывает зрелость."
      - "Pablo: Sí. Otro habría montado en cólera; él prefirió reflexionar. | Да. Другой бы пришёл в ярость. Он предпочёл подумать."
      - "Ana: Pues yo no agacharía la cabeza si tuviera razón. | А я бы не опустила голову, если бы была права."
      - "Pablo: Yo tampoco. Pero él sabía que no la tenía. | Я тоже. Но он знал, что прав не был."
    cefr: "B2."
    frequency: "Частое в прозе."
    collocations:
      - "agachar la cabeza — опустить голову, смириться"
      - "agacharse — пригнуться"
      - "no agachar la cabeza — не сдаваться"
    collocation_example: "Se agachó para recoger las llaves. — Он пригнулся, чтобы подобрать ключи."
    trap: "Agachar — переходный (agachar la cabeza), agacharse — возвратный («пригнуться»). Не путайте с agarrar «хватать»."

  - word: metedura de pata
    ru: оплошность, ляп
    ipa: /meteˈðuɾa de ˈpata/
    say: мэтэду́ра дэ па́та
    pron: "d между гласными мягкое [ð]."
    meaning: "Неловкая ошибка, сказанное или сделанное не вовремя: «накосячил, ляпнул». Pata — «лапа»: «влезть лапой»."
    examples:
      - "Fue una metedura de pata enorme. — Это был огромный ляп."
      - "Con un comunicado de prensa, el político intentó corregir su metedura de pata. — Пресс-релизом политик попытался исправить свою оплошность."
      - "Menuda metedura de pata la mía: le mandé el mensaje al jefe en lugar de a mi hermana. — Какой я допустил ляп: отправил сообщение начальнику вместо сестры."
    origin: "meter la pata «сунуть лапу» (в капкан, не туда, куда надо): meter «класть внутрь» + pata «лапа». Metedura — существительное от meter."
    register: "Разговорное."
    synonyms:
      - word: error
        pair: ["Fue una metedura de pata.", "Fue un error."]
        diff:
          - "error — нейтральное и серьёзное: «ошибка»"
          - "metedura de pata — бытовое «ляпнул, вляпался», обычно неловкий поступок или фраза"
    analogs:
      - "blunder — грубая ошибка"
      - "faux pas — неловкость, бестактность"
    dialogue:
      - "Ana: ¿Qué le dijiste? | Что ты ему сказал?"
      - "Pablo: Una metedura de pata. No sabía que estaba enfermo. | Допустил оплошность. Я не знал, что он болен."
      - "Ana: ¿Qué le dijiste exactamente? | Что именно ты сказал?"
      - "Pablo: Que parecía cansado, aparentando más años de los que tiene. Quise matarme. | Что он выглядит усталым и кажется старше, чем есть. Мне хотелось провалиться сквозь землю."
      - "Ana: ¡Qué metedura de pata! ¿Y él cómo reaccionó? | Какая оплошность! И как он отреагировал?"
      - "Pablo: Se quedó callado y luego asintió. Fue un momento muy embarazoso. | Промолчал, а потом кивнул. Момент был очень неловким."
      - "Ana: Pídele perdón. Todos metemos la pata alguna vez. | Попроси прощения. Все иногда попадают впросак."
      - "Pablo: Eso haré, sin falta. | Так и сделаю, обязательно."
    cefr: "B2."
    frequency: "Частое в разговоре."
    collocations:
      - "meter la pata — ляпнуть, ошибиться"
      - "una metedura de pata — промах"
      - "menuda metedura de pata — вот это ляп"
    collocation_example: "Metí la pata al preguntarle por su exmarido. — Я ляпнул, спросив её о бывшем муже."
    trap: "Глагольная форма — meter la pata («ляпнуть»), а metedura de pata — существительное. Выражение разговорное, в официальных текстах не используется."

  - word: embarazoso
    ru: неловкий, затруднительный
    ipa: /embaɾaˈθoso/
    say: эмбарасо́со
    pron: "z в Испании — [θ]; mb читается слитно."
    meaning: "О ситуации, вопросе, разговоре: такой, что чувствуешь неловкость. Ложный друг: не «связанный с беременностью»."
    examples:
      - "Fue un momento muy embarazoso. — Это была очень неловкая минута."
      - "Resulta embarazoso hablar de estos temas con los padres cuando uno es adolescente. — Неловко говорить на такие темы с родителями, когда ты подросток."
      - "Me hizo una pregunta embarazosa sobre mi sueldo, y no supe cómo salir del paso. — Он задал мне неловкий вопрос о моей зарплате, и я не знал, как выкрутиться."
    origin: "От embarazo «затруднение; беременность» (того же корня, что embarazar «затруднять»). Первое значение — «помеха, неловкость»."
    register: "Нейтральное, книжное."
    synonyms:
      - word: incómodo
        pair: ["Fue una situación embarazosa.", "Fue una situación incómoda."]
        diff:
          - "incómodo — «неудобный, неприятный» вообще"
          - "embarazoso — именно «неловкий» из-за стыда или смущения"
    analogs:
      - "embarrassing — неловкий (англ. embarrassed: смущённый)"
      - "awkward — неловкий"
    dialogue:
      - "Ana: ¿Cómo fue la reunión? | Как прошла встреча?"
      - "Pablo: Embarazosa, nadie sabía qué decir. | Неловко, никто не знал, что сказать."
      - "Ana: ¿Por qué? | Почему?"
      - "Pablo: Porque el jefe montó en cólera delante de todos y luego se retiró. | Потому что начальник при всех пришёл в ярость и потом ушёл."
      - "Ana: Qué momento más embarazoso. | Какой неловкий момент."
      - "Pablo: Sí. Todos bajamos la mirada, algunos agacharon la cabeza y otros miraban el móvil. | Да. Мы все опустили глаза, кто-то склонил голову, а кто-то смотрел в телефон."
      - "Ana: ¿Y después? | А потом?"
      - "Pablo: Una vez que se fue, empezaron los cotilleos. Pese a todo, la reunión continuó. | Когда он ушёл, начались сплетни. Несмотря ни на что, встреча продолжилась."
    cefr: "C1."
    frequency: "Нечастое."
    collocations:
      - "una situación embarazosa — неловкая ситуация"
      - "una pregunta embarazosa — неловкий вопрос"
      - "un momento embarazoso — неловкая минута"
    collocation_example: "Fue un silencio embarazoso. — Было неловкое молчание."
    trap: "Ложный друг: estar embarazada — «быть беременной», а embarazoso — «неловкий». Об ощущении «мне неловко» — me da vergüenza или estoy avergonzado."

  - word: sagacidad
    ru: проницательность
    ipa: /saɣaθiˈðað/
    say: сагасида́д
    pron: "c перед i в Испании — [θ]; d на конце мягкое [ð]; ударение на последнем слоге."
    meaning: "Умение быстро замечать скрытое и понимать людей: чутьё, сообразительность."
    examples:
      - "Admiró la sagacidad del detective. — Он восхитился проницательностью сыщика."
      - "Antes que nadie, gracias a su sagacidad en los negocios, pudo prever la crisis. — Раньше всех, благодаря своей деловой проницательности, он смог предвидеть кризис."
      - "Respondió con gran sagacidad y evitó contestar a la pregunta más incómoda del periodista. — Он ответил очень находчиво и сумел не отвечать на самый неудобный вопрос журналиста."
    origin: "Из лат. sagacitas «острота чутья», от sagax «проницательный» (изначально — о собаке, которая берёт след). Родственное: sagaz «проницательный»."
    register: "Формальное, книжное."
    synonyms:
      - word: perspicacia
        pair: ["Destacó por su sagacidad.", "Destacó por su perspicacia."]
        diff:
          - "perspicacia — «острый ум, зоркость»"
          - "sagacidad — чуть хитрее, «сообразительность, чутьё»"
    analogs:
      - "sagacity — проницательность (тот же корень)"
      - "shrewdness — расчётливая хитрость"
    dialogue:
      - "Ana: ¿Cómo lo descubrió? | Как он это обнаружил?"
      - "Pablo: Con mucha sagacidad. | С большой проницательностью."
      - "Ana: ¿Quién es el detective? | Кто этот детектив?"
      - "Pablo: Un hombre mayor, muy concienzudo. No se apresura a sacar conclusiones, pero no se le escapa ni un detalle. | Пожилой мужчина, очень дотошный. Не спешит с выводами, но от него не ускользает ни одна деталь."
      - "Ana: ¿Y cómo dio con el culpable? | И как он вышел на виновного?"
      - "Pablo: Mediante una pista tonta: la contraseña del móvil era la fecha del crimen. | По глупой зацепке: пароль телефона оказался датой преступления."
      - "Ana: ¡Qué sagacidad! Yo ni lo habría notado. | Какая проницательность! Я бы даже не заметила."
      - "Pablo: Por eso es el mejor. Todos admiran su sagacidad. | Поэтому он лучший. Все восхищаются его проницательностью."
    cefr: "C1."
    frequency: "Нечастое: в литературе."
    collocations:
      - "una gran sagacidad — большая проницательность"
      - "sagacidad política — политическое чутьё"
      - "con sagacidad — проницательно"
    collocation_example: "Resolvió el caso con gran sagacidad. — Он раскрыл дело с большой проницательностью."
    trap: "Прилагательное — sagaz (мн. sagaces): z меняется на c. Слово женского рода: la sagacidad."

  - word: saborear el éxito
    ru: наслаждаться успехом
    ipa: /saβoɾeˈaɾ el ˈeksito/
    say: сабореа́р эль э́ксито
    pron: "b между гласными мягкая [β]; x в éxito читается «кс»."
    meaning: "Радоваться достигнутому и не спешить: «смаковать победу». Saborear — «пробовать на вкус, смаковать»."
    examples:
      - "Saboreó el éxito con toda su familia. — Он насладился успехом вместе со всей семьёй."
      - "Después de tantos años de esfuerzo, se detuvo a saborear el éxito. — После стольких лет усилий он остановился насладиться успехом."
      - "Todavía no es hora de saborear el éxito, porque falta lo más difícil del proyecto. — Ещё не время наслаждаться успехом, потому что впереди самая трудная часть проекта."
    origin: "saborear — от sabor «вкус» + суффикс -ear, образующий глагол. Образ: успех, как лакомство, который пробуют по крупице."
    register: "Нейтральное, образное."
    synonyms:
      - word: disfrutar del éxito
        pair: ["Saboreó el éxito.", "Disfrutó del éxito."]
        diff:
          - "disfrutar de — просто «радоваться, пользоваться»"
          - "saborear — «смаковать, растягивать удовольствие»"
    analogs:
      - "to savour success — смаковать успех"
      - "to bask in success — греться в лучах успеха"
    dialogue:
      - "Ana: ¿Qué hace el equipo ahora? | Что сейчас делает команда?"
      - "Pablo: Saborea el éxito en el vestuario. | Наслаждается успехом в раздевалке."
      - "Ana: ¿Ganaron al final? | В итоге они выиграли?"
      - "Pablo: Sí, pese a todo. Iban perdiendo, pero acertaron a remontar en el último minuto. | Да, несмотря ни на что. Они проигрывали, но сумели отыграться на последней минуте."
      - "Ana: ¡Qué alegría! ¿Y el entrenador? | Какая радость! А тренер?"
      - "Pablo: Se retiró a su despacho. Dice que prefiere saborear el éxito en silencio. | Ушёл к себе в кабинет. Говорит, что предпочитает наслаждаться успехом в тишине."
      - "Ana: Qué sobrio. | Какой сдержанный."
      - "Pablo: Sí, pero ya verás cómo lo celebran esta noche. | Да, но увидишь, как они сегодня вечером будут праздновать."
    cefr: "C1."
    frequency: "Нечастое: в прессе и прозе."
    collocations:
      - "saborear la victoria — смаковать победу"
      - "saborear el éxito — наслаждаться успехом"
      - "saborear un café — не спеша пить кофе"
    collocation_example: "Se sentó a saborear el café despacio. — Он сел и не спеша смаковал кофе."
    trap: "Saborear — переходный: saborear algo. Не путайте с sabor «вкус» и sabroso «вкусный»: saborear — действие."

  - word: echar un rapapolvo
    ru: устроить взбучку, отчитать
    ipa: /eˈtʃaɾ un rapaˈpolβo/
    say: эча́р ун рапапо́льбо
    pron: "ch — «ч»; r в начале — раскатистое; ударение на po."
    meaning: "Строго отругать, сделать выговор. Rapapolvo — «выговор, нагоняй»."
    examples:
      - "Lo echaron un rapapolvo en el colegio. — Его отчитали в школе."
      - "Por llegar tarde a casa anoche, mi madre me echó un rapapolvo. — За то, что вчера я поздно пришёл домой, мама меня отчитала."
      - "El jefe me echó un buen rapapolvo por haber perdido el contrato con el cliente más importante. — Начальник устроил мне хорошую взбучку за то, что я потерял контракт с самым важным клиентом."
    origin: "Возможно, от rapar «брить, обдирать» + polvo «пыль»: «снять пыль, отряхнуть». Образ: как отряхивают пыль с провинившегося. Родственное: rapar «стричь налысо»."
    register: "Разговорное."
    synonyms:
      - word: regañar
        pair: ["Me echó un rapapolvo.", "Me regañó."]
        diff:
          - "regañar — обычный глагол «ругать»"
          - "echar un rapapolvo — разговорное, о сильном нагоняе, чаще от старшего или начальника"
    analogs:
      - "to give someone a telling-off — устроить нагоняй"
      - "to tell off — отчитать"
    dialogue:
      - "Ana: ¿Qué te dijo el director? | Что тебе сказал директор?"
      - "Pablo: Me echó un rapapolvo por llegar tarde. | Устроил мне взбучку за опоздание."
      - "Ana: ¿Y tenías excusa? | У тебя было оправдание?"
      - "Pablo: Sí, un neumático pinchado. Pero ni siquiera me dejó explicarme. | Да, прокололась шина. Но он даже не дал мне объясниться."
      - "Ana: Qué injusto. ¿Montó en cólera? | Какая несправедливость. Он пришёл в ярость?"
      - "Pablo: No, fue un rapapolvo sobrio, pero frío. Agaché la cabeza y esperé a que acabara. | Нет, взбучка была строгой, но холодной. Я опустил голову и ждал, пока он закончит."
      - "Ana: A mí me habría dado rabia. | Меня бы это разозлило."
      - "Pablo: A mí también, pero no era el momento conveniente para discutir. | Меня тоже, но момент для спора был неподходящий."
    cefr: "C1."
    frequency: "Нечастое: разговорное."
    collocations:
      - "echar un rapapolvo — устроить нагоняй"
      - "recibir un rapapolvo — получить нагоняй"
      - "un buen rapapolvo — хороший нагоняй"
    collocation_example: "Recibí un rapapolvo por olvidar la cita. — Я получил нагоняй за то, что забыл о встрече."
    trap: "Выражение разговорное: в официальной речи — amonestar, reprender. Не путайте rapapolvo с rapaz «хищная птица; паренёк»."

  - word: ahínco
    ru: усердие, старание
    ipa: /aˈiŋko/
    say: аи́нко
    pron: "h не читается; ahí — два слога: а-и́; ударение на í. Читается «аи́нко»."
    meaning: "Большое рвение, с которым что-то делают: упорство, настойчивая работа."
    examples:
      - "Estudia con ahínco desde hace años. — Она усердно учится уже много лет."
      - "Ante el consejo, aunque todos se oponían, defendió su proyecto con ahínco. — Перед советом, хотя все были против, он упорно защищал свой проект."
      - "Trabajó con ahínco durante meses para aprobar el examen y lo consiguió a la primera. — Он упорно работал несколько месяцев, чтобы сдать экзамен, и сдал с первого раза."
    origin: "От глагола ahincar «настаивать, стараться» (a- + hincar «вонзать»): «вбивать, прилагать усилия». Родственные: hincar «вонзать», ahincado «настойчивый»."
    register: "Формальное, книжное."
    synonyms:
      - word: empeño
        pair: ["Trabaja con ahínco.", "Trabaja con empeño."]
        diff:
          - "empeño — «рвение, решимость добиться»"
          - "ahínco — «старательность, упорство в труде», звучит литературнее"
    analogs:
      - "zeal — рвение"
      - "diligence — прилежание"
    dialogue:
      - "Ana: ¿Cómo prepara el examen? | Как он готовится к экзамену?"
      - "Pablo: Con mucho ahínco, todos los días. | Очень усердно, каждый день."
      - "Ana: ¿Cuántas horas estudia? | Сколько часов он занимается?"
      - "Pablo: Unas seis, sin tomarse ni un respiro. Se levanta temprano y se despeja con un café. | Часов шесть, без передышки. Встаёт рано и бодрится кофе."
      - "Ana: Qué ahínco. ¿Y no se agota? | Какое усердие. И он не выматывается?"
      - "Pablo: Claro, pero dice que merece la pena. Quiere saborear el éxito. | Конечно, но говорит, что оно того стоит. Хочет насладиться успехом."
      - "Ana: Pues le deseo mucha suerte. | Тогда желаю ему удачи."
      - "Pablo: La necesita. El examen consta de tres pruebas difíciles. | Она ему нужна. Экзамен состоит из трёх трудных испытаний."
    cefr: "C1."
    frequency: "Нечастое: в письменной речи."
    collocations:
      - "con ahínco — усердно"
      - "trabajar con ahínco — работать усердно"
      - "luchar con ahínco — упорно бороться"
    collocation_example: "Luchó con ahínco por su sueño. — Он упорно боролся за свою мечту."
    trap: "Слово всегда после con: con ahínco. Ударение на í: ahínco. Не путайте с anhelo «страстное желание» (пишется с nh)."
