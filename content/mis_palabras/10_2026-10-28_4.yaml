# Четвёртый список автора, часть 13 — «Poderoso caballero» (слова 46–61).
lang: es
words:
  - word: deprimido
    ru: подавленный
    ipa: /depɾiˈmiðo/
    say: дэприми́до
    pron: "d между гласными мягкое [ð]."
    meaning: "О человеке: грустный, без сил и желаний, в тоске. Более лёгкая форма — «bajo de ánimo»."
    examples:
      - "Ana está deprimida desde que cambió de trabajo. — Ана в депрессии с тех пор, как сменила работу."
      - "Su familia ha decidido llevarlo a un especialista, porque lleva semanas deprimido. — Семья решила отвести его к специалисту, потому что он уже несколько недель в депрессии."
      - "Me siento deprimida con este tiempo gris, y lo único que quiero es quedarme en la cama. — Мне грустно от этой серой погоды, и единственное, чего я хочу, – оставаться в постели."
    origin: "Причастие от deprimir «угнетать» (лат. deprimere «давить вниз»). Родственные: depresión «депрессия», presión «давление»."
    register: "Нейтральное."
    synonyms:
      - word: abatido
        pair: ["Está deprimido.", "Está abatido."]
        diff:
          - "abatido — «упавший духом» после неудачи, на время"
          - "deprimido — «подавленный» дольше, ближе к болезненному состоянию"
    analogs:
      - "depressed — подавленный"
      - "down — унылый"
    dialogue:
      - "Ana: ¿Cómo está tu hermano? | Как твой брат?"
      - "Pablo: Deprimido, no sale de casa. | Подавлен, не выходит из дома."
      - "Ana: ¿Desde cuándo? | С каких пор?"
      - "Pablo: Desde que lo despidieron. Estaba convencido de que lo iban a ascender y se llevó una gran sorpresa. | С тех пор как его уволили. Он был уверен, что его повысят, и сильно удивился."
      - "Ana: Pobre. ¿Ha ido al médico? | Бедняга. Он был у врача?"
      - "Pablo: Sí, le recetó un comprimido y le recomendó hablar con alguien. | Да, тот выписал таблетку и посоветовал с кем-нибудь поговорить."
      - "Ana: ¿Y hablas tú con él? | И ты с ним разговариваешь?"
      - "Pablo: Cada día. Intento consolarlo, aunque no es fácil. Está muy hundido. | Каждый день. Пытаюсь утешить, хотя это непросто. Он очень подавлен."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "estar deprimido — быть подавленным"
      - "sentirse deprimido — чувствовать себя подавленным"
      - "una persona deprimida — подавленный человек"
    collocation_example: "Se sentía deprimido después del divorcio. — После развода он чувствовал себя подавленным."
    trap: "Причастие согласуется: deprimida, deprimidos. С estar: estoy deprimido. Не путайте с reprimido «подавленный (о чувствах)»."

  - word: muñeca
    ru: кукла; запястье
    ipa: /muˈɲeka/
    say: муньэ́ка
    pron: "ñ — «нь»."
    meaning: "Детская игрушка в виде человечка. Ещё — «запястье» (часть руки у кисти)."
    examples:
      - "La niña juega con su muñeca. — Девочка играет со своей куклой."
      - "Me duele la muñeca de tanto escribir en el ordenador durante todo el día. — У меня болит запястье от долгой работы на компьютере целый день."
      - "Llevaba un reloj muy grande en la muñeca izquierda y una pulsera de cuero en la derecha. — На левом запястье у него были очень большие часы, а на правом кожаный браслет."
    origin: "Происхождение неясно. Значение «запястье» — по сходству с кукольной ручкой."
    register: "Нейтральное."
    synonyms:
      - word: juguete
        pair: ["Le regalaron una muñeca.", "Le regalaron un juguete."]
        diff:
          - "juguete — любая игрушка"
          - "muñeca — именно кукла"
    analogs:
      - "doll — кукла"
      - "wrist — запястье"
    dialogue:
      - "La niña, Lucía, tenía una muñeca vieja que no soltaba nunca. | У девочки, Лусии, была старая кукла, с которой она никогда не расставалась."
      - "La había heredado de su abuela, y el vestido estaba ya muy gastado. | Она унаследовала её от бабушки, и платье уже сильно истёрлось."
      - "Un día, su tío le regaló una muñeca nueva, enorme, con ojos que se abrían y se cerraban. | Однажды дядя подарил ей новую куклу, огромную, с глазами, которые открывались и закрывались."
      - "Lucía la miró con curiosidad, pero enseguida volvió a su muñeca vieja. | Лусия посмотрела на неё с любопытством, но тут же вернулась к старой кукле."
      - "«Esta no me abandona nunca», dijo, abrazándola fuerte. | «Эта меня никогда не бросит», — сказала она, крепко обнимая её."
      - "Su tío asintió, conmovido, y no insistió más. | Дядя кивнул, растроганный, и больше не настаивал."
    cefr: "A2."
    frequency: "Частое."
    collocations:
      - "muñeca de trapo — тряпичная кукла"
      - "torcerse la muñeca — подвернуть запястье"
      - "reloj de muñeca — наручные часы"
    collocation_example: "Se torció la muñeca al caer. — Он подвернул запястье, упав."
    trap: "Muñeca — и «кукла», и «запястье»: обе части в одном слове. Не путайте с muñón «культя» и moneda «монета»."

  - word: matizar
    ru: уточнять, подбирать оттенки
    ipa: /matiˈθaɾ/
    say: матиса́р
    pron: "z в Испании — [θ]; перед e z → c: matice."
    meaning: "Добавить уточнение, чтобы сказанное звучало точнее: «хочу уточнить». Matiz — «оттенок»."
    examples:
      - "Quiero matizar lo que dije antes. — Я хочу уточнить то, что сказал раньше."
      - "En el segundo capítulo, el autor matiza su opinión y reconoce algunos errores. — Во второй главе автор уточняет своё мнение и признаёт некоторые ошибки."
      - "Hay que matizar esa afirmación: no todos los jóvenes pasan tantas horas delante del móvil. — Это утверждение нужно уточнить: не все молодые люди проводят столько часов перед телефоном."
    origin: "От matiz «оттенок» (из франц. matiser «давать оттенки»): уточнить тон. Родственное: matiz «оттенок»."
    register: "Формальное, книжное."
    synonyms:
      - word: precisar
        pair: ["Quiero matizar esa idea.", "Quiero precisar esa idea."]
        diff:
          - "precisar — «уточнить, сделать точным»"
          - "matizar — «добавить оттенки», смягчить или сделать тоньше"
    analogs:
      - "to qualify — уточнить, оговорить"
      - "to nuance — оттенить"
    dialogue:
      - "Ana: ¿Estás de acuerdo con él? | Ты с ним согласен?"
      - "Pablo: Sí, aunque quiero matizar un punto. | Да, хотя хочу уточнить один пункт."
      - "Ana: Dime. | Говори."
      - "Pablo: Dice que el proyecto es un fracaso. Yo diría que no ha cumplido su cometido del todo, pero no es un fracaso. | Он говорит, что проект провалился. Я бы сказал, что он не полностью выполнил свою задачу, но это не провал."
      - "Ana: Es una diferencia importante. | Это важное различие."
      - "Pablo: Sí, hay que matizar. Si no, la gente se precipita en pensar lo peor. | Да, нужно уточнять. Иначе люди спешат думать о худшем."
      - "Ana: ¿Se lo has hecho saber? | Ты дал ему об этом знать?"
      - "Pablo: Todavía no, pero lo haré cuanto antes. Con tacto, claro. | Пока нет, но сделаю как можно скорее. Разумеется, деликатно."
    cefr: "C1."
    frequency: "Частое в интервью и текстах."
    collocations:
      - "matizar una opinión — уточнить мнение"
      - "matizar una afirmación — сделать оговорку"
      - "con matices — с нюансами"
    collocation_example: "Hay que matizar esa afirmación. — Это утверждение нужно уточнить."
    trap: "Перед e z → c: matice. Не путайте matizar «уточнять» с matar «убивать»: звучит похоже, смысл разный."

  - word: imprescindible
    ru: крайне необходимый
    ipa: /impɾesθinˈdiβle/
    say: импрэсинди́блэ
    pron: "c перед i в Испании — [θ]; ударение на di: imprescindible."
    meaning: "Такой, без которого нельзя обойтись: «обязательно нужен». Сильнее, чем necesario."
    examples:
      - "El agua es imprescindible para vivir. — Вода необходима для жизни."
      - "Para este viaje de montaña es imprescindible llevar buenas botas y ropa de abrigo. — Для этого горного похода необходимо взять хорошие ботинки и тёплую одежду."
      - "El pasaporte es imprescindible para viajar a otro país, aunque sea solo un fin de semana. — Паспорт необходим для поездки в другую страну, даже на одни выходные."
    origin: "im- «не» + prescindir «обходиться без» (лат. praescindere «отрезать заранее») + -ible «можно»: «без чего нельзя обойтись»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: indispensable
        pair: ["Es un documento imprescindible.", "Es un documento indispensable."]
        diff:
          - "indispensable — то же значение, чуть чаще в Латинской Америке"
          - "imprescindible — привычнее в Испании"
    analogs:
      - "essential — крайне необходимый"
      - "indispensable — незаменимый"
    dialogue:
      - "Ana: ¿Qué debo llevar? | Что мне взять с собой?"
      - "Pablo: El carné es imprescindible. | Удостоверение личности обязательно."
      - "Ana: ¿Y qué más? | А что ещё?"
      - "Pablo: También es imprescindible el volante y una copia del informe. Lo demás es conveniente, pero no obligatorio. | Также необходимо направление и копия заключения. Остальное желательно, но не обязательно."
      - "Ana: ¿Y dinero? | А деньги?"
      - "Pablo: Un poco en efectivo, por si hace falta pagar el parking. | Немного наличными, вдруг придётся платить за парковку."
      - "Ana: Vale. ¿Y ropa cómoda? | Хорошо. А удобная одежда?"
      - "Pablo: Sí, aunque lo imprescindible es llegar con tiempo. Si no, tendrás para rato. | Да, но самое необходимое — приехать заранее. Иначе придётся долго ждать."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "es imprescindible + инфинитив — необходимо"
      - "es imprescindible que + subjuntivo — необходимо, чтобы"
      - "una pieza imprescindible — незаменимая деталь"
    collocation_example: "Es imprescindible reservar con antelación. — Необходимо бронировать заранее."
    trap: "После es imprescindible que — subjuntivo: es imprescindible que lo hagas. Не путайте с prescindir «обойтись без»: prescindir de algo."

  - word: testamento
    ru: завещание
    ipa: /testaˈmento/
    say: тестаме́нто
    meaning: "Документ, в котором человек пишет, кому достанется его имущество после смерти. Ещё: Antiguo/Nuevo Testamento — части Библии."
    examples:
      - "Mi abuelo escribió su testamento ayer. — Мой дед вчера написал завещание."
      - "Leyeron el testamento delante de toda la familia, y hubo gritos y lágrimas. — Завещание прочитали перед всей семьёй, и были крики и слёзы."
      - "Hizo testamento antes de morir y dejó la casa a su hija y el dinero a sus nietos. — Он составил завещание перед смертью и оставил дом дочери, а деньги внукам."
    origin: "Из лат. testamentum «завещание, договор»: от testari «свидетельствовать». Родственные: testigo «свидетель», testimonio «свидетельство»."
    register: "Формальное, юридическое."
    synonyms:
      - word: última voluntad
        pair: ["Respetó su testamento.", "Respetó su última voluntad."]
        diff:
          - "última voluntad — «последняя воля», более общее и торжественное"
          - "testamento — именно юридический документ"
    analogs:
      - "will — завещание"
      - "last will and testament — полное название"
    dialogue:
      - "Mi abuelo escribió su testamento hace unos días, sin decírselo a nadie. | Мой дедушка написал завещание несколько дней назад, никому не сказав."
      - "Lo guardó en un sobre y lo escondió en el joyero de mi abuela. | Он положил его в конверт и спрятал в шкатулке бабушки."
      - "Cuando murió, mis tíos se arremolinaron en el salón para escuchar la lectura. | Когда он умер, мои дяди столпились в гостиной, чтобы послушать чтение."
      - "Todos esperaban recibir una buena parte, pero el testamento fue sorprendente. | Все ждали, что получат большую часть, но завещание оказалось неожиданным."
      - "Mi abuelo dejó la finca a mi madre, porque era la única que lo cuidó con ternura. | Дедушка оставил усадьбу моей маме, потому что она единственная ухаживала за ним с нежностью."
      - "Los demás se quedaron callados, y algunos agacharon la cabeza, avergonzados. | Остальные замолчали, и некоторые опустили головы от стыда."
    cefr: "B2."
    frequency: "Частое в новостях и юридических текстах."
    collocations:
      - "hacer testamento — составить завещание"
      - "abrir el testamento — вскрыть завещание"
      - "dejar en testamento — оставить по завещанию"
    collocation_example: "Dejó la casa a su hija en el testamento. — В завещании он оставил дом дочери."
    trap: "Testamento — мужского рода: el testamento. Не путайте testamento «завещание» с testimonio «показание» и testigo «свидетель»."

  - word: arruinado
    ru: разорённый
    ipa: /aruiˈnaðo/
    say: аруина́до
    pron: "ui — два слога: a-ru-i-na-do; ударение на na."
    meaning: "О человеке или фирме: потерявший все деньги, обанкротившийся. Ещё — «испорченный» (о вещи)."
    examples:
      - "Quedó arruinado tras la crisis. — Он разорился после кризиса."
      - "Con tantas deudas y sin saber a quién pedir ayuda, estaba arruinado. — С такими долгами и не зная, к кому обратиться за помощью, он был разорён."
      - "La cosecha quedó arruinada por el granizo, y los agricultores perdieron todo el trabajo del año. — Урожай погиб от града, и фермеры потеряли всю работу за год."
    origin: "Причастие от arruinar «разорять» (от ruina «развалины, крах»). Родственные: ruina, ruinoso «разорительный»."
    register: "Нейтральное."
    synonyms:
      - word: en quiebra
        pair: ["La empresa quedó arruinada.", "La empresa está en quiebra."]
        diff:
          - "en quiebra — «в банкротстве» юридически"
          - "arruinado — «разорённый» без денег, и о человеке"
    analogs:
      - "ruined — разорённый"
      - "bankrupt — банкрот"
    dialogue:
      - "Ana: ¿Qué pasó con su negocio? | Что случилось с его бизнесом?"
      - "Pablo: Está arruinado, perdió todo. | Он разорён, потерял всё."
      - "Ana: ¿Cómo? Si iba tan bien. | Как? Ведь всё шло так хорошо."
      - "Pablo: Se fió de un socio que resultó ser un estafador y desvió los fondos. | Он доверился партнёру, который оказался мошенником и вывел средства."
      - "Ana: Qué consecuencia nefasta. ¿Y ahora? | Какое пагубное последствие. А теперь?"
      - "Pablo: Ha tenido que vender la finca y mudarse a un piso pequeño. | Ему пришлось продать усадьбу и переехать в маленькую квартиру."
      - "Ana: Pobre. ¿Y lo lleva bien? | Бедняга. И как он это переносит?"
      - "Pablo: Con dignidad, aunque a veces se viene abajo. Dice que fue una buena papeleta. | С достоинством, хотя иногда ломается. Говорит, что это была трудная ситуация."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "quedar arruinado — разориться"
      - "estar arruinado — быть разорённым"
      - "arruinar la vida — разрушить жизнь"
    collocation_example: "El juego lo dejó arruinado. — Азартные игры оставили его без гроша."
    trap: "Причастие согласуется: arruinada, arruinados. С estar и quedar: estar arruinado. Не путайте arruinado «разорённый» с ruina «развалины»."

  - word: desesperado
    ru: отчаявшийся
    ipa: /desespeˈɾaðo/
    say: дэсэспэра́до
    pron: "d между гласными мягкое [ð]."
    meaning: "Потерявший надежду: «в отчаянии». Ещё — «отчаянный»: una situación desesperada."
    examples:
      - "Estaba desesperado y no sabía qué hacer. — Он был в отчаянии и не знал, что делать."
      - "Antes de cerrar, hizo un último intento desesperado por salvar el negocio. — Перед закрытием он предпринял последнюю отчаянную попытку спасти бизнес."
      - "La madre, desesperada, buscó a su hijo por todas las calles del barrio durante toda la noche. — Мать в отчаянии всю ночь искала сына на всех улицах района."
    origin: "Причастие от desesperar «терять надежду» (des- «не» + esperar «надеяться»). Родственные: esperanza «надежда», esperar «ждать»."
    register: "Нейтральное."
    synonyms:
      - word: desolado
        pair: ["Estaba desesperado.", "Estaba desolado."]
        diff:
          - "desolado — «опустошённый, убитый горем»"
          - "desesperado — «потерявший надежду», готов на любые шаги"
    analogs:
      - "desperate — отчаявшийся"
      - "hopeless — безнадёжный"
    dialogue:
      - "Marcos: Mi amigo está desesperado. | Мой друг в отчаянии."
      - "Marcos: Lleva seis meses parado y no encuentra trabajo en ninguna parte. | Он уже полгода без работы и нигде не находит места."
      - "Marcos: Ha mandado cientos de currículums y apenas le han contestado. | Разослал сотни резюме, и почти никто не ответил."
      - "Marcos: Está deprimido, agotado y sin ilusión, aunque intenta no demostrarlo. | Он подавлен, измотан и без энтузиазма, хотя старается этого не показывать."
      - "Marcos: Yo lo consuelo como puedo y le digo que no se precipite. | Я утешаю его как могу и говорю, чтобы не торопился."
      - "Marcos: Pese a todo, albergo esperanzas de que pronto salga algo. | Несмотря ни на что, я питаю надежды, что скоро что-то найдётся."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "desesperado por — отчаянно желающий"
      - "una situación desesperada — отчаянная ситуация"
      - "un intento desesperado — отчаянная попытка"
    collocation_example: "Estaba desesperada por encontrar a su hijo. — Она отчаянно пыталась найти сына."
    trap: "Desesperado — «отчаявшийся» и «отчаянный»: в первом о человеке, во втором о поступке. С предлогом por: desesperado por algo — «жаждущий»."

  - word: razonamiento
    ru: рассуждение
    ipa: /raθonaˈmjento/
    say: расонамье́нто
    pron: "z в Испании — [θ]; r в начале — раскатистое."
    meaning: "Ход мыслей: как человек приходит к выводу, шаг за шагом."
    examples:
      - "Su razonamiento es muy lógico. — Его рассуждение очень логично."
      - "No entiendo tu razonamiento: primero dices que es peligroso y luego quieres hacerlo igual. — Я не понимаю твоих рассуждений: сначала ты говоришь, что это опасно, а потом всё равно хочешь это сделать."
      - "El profesor pidió a los alumnos que explicaran su razonamiento paso a paso en la pizarra. — Преподаватель попросил учеников объяснить ход мысли шаг за шагом на доске."
    origin: "От razonar «рассуждать» (razón «разум, довод», лат. ratio) + суффикс -miento. Родственные: razón «разум, правота», razonable «разумный»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: argumento
        pair: ["Explicó su razonamiento.", "Explicó su argumento."]
        diff:
          - "argumento — один довод в споре"
          - "razonamiento — вся цепочка рассуждений"
    analogs:
      - "reasoning — рассуждение"
      - "line of thought — ход мысли"
    dialogue:
      - "Ana: ¿Por qué piensas eso? | Почему ты так думаешь?"
      - "Pablo: Es un razonamiento sencillo. | Это простое рассуждение."
      - "Ana: A ver, explícamelo. | Ну-ка, объясни."
      - "Pablo: Si el testigo dice que no vio a nadie, pero había un abrigo rojizo en la entrada, es que mintió. | Если свидетель говорит, что никого не видел, но на входе висело рыжеватое пальто, значит, он солгал."
      - "Ana: Puede que no se diera cuenta. | Возможно, он не заметил."
      - "Pablo: No es verosímil. Un abrigo así no pasa desapercibido. | Это неправдоподобно. Такое пальто не остаётся незамеченным."
      - "Ana: Tu razonamiento tiene lógica. | В твоём рассуждении есть логика."
      - "Pablo: Gracias. Ahora falta una prueba que lo confirme. | Спасибо. Теперь не хватает улики, которая это подтвердит."
    cefr: "B2."
    frequency: "Частое в текстах и спорах."
    collocations:
      - "un razonamiento lógico — логическое рассуждение"
      - "seguir un razonamiento — следовать за рассуждением"
      - "falta de razonamiento — отсутствие логики"
    collocation_example: "No logro seguir tu razonamiento. — Мне не удаётся следовать твоему рассуждению."
    trap: "Razonamiento — мужского рода: el razonamiento. Не путайте с razón «разум; правота»: tener razón — «быть правым»."

  - word: kleenex
    ru: бумажный платок
    ipa: /ˈklineks/
    say: кли́нэкс
    pron: "Заимствовано из английского: «кли́нэкс»; x читается «кс»."
    meaning: "Бумажный носовой платок. По названию марки Kleenex, как «ксерокс»: так говорят про любые салфетки."
    examples:
      - "Dame un kleenex, por favor. — Дай мне салфетку, пожалуйста."
      - "Para cuando alguien se emociona en una película, llevo kleenex en el bolso. — На случай, если кто-то растрогается на фильме, я ношу в сумке бумажные платочки."
      - "Se secó las lágrimas con un kleenex arrugado que encontró en el bolsillo del abrigo. — Она вытерла слёзы смятым бумажным платочком, который нашла в кармане пальто."
    origin: "Из англ. Kleenex — марка бумажных платков с 1924 года. В испанском стало общим названием, как «xerox» для копии."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: pañuelo de papel
        pair: ["Necesito un kleenex.", "Necesito un pañuelo de papel."]
        diff:
          - "pañuelo de papel — нейтральное название без бренда"
          - "kleenex — короче, по марке, в разговоре"
    analogs:
      - "tissue — салфетка"
      - "Kleenex — бренд, ставший общим словом"
    dialogue:
      - "Ana: ¿Tienes un pañuelo? | У тебя есть платок?"
      - "Pablo: Sí, un kleenex. | Да, бумажный платок."
      - "Ana: Gracias. Estoy resfriada y no paro de estornudar. | Спасибо. Я простужена и всё время чихаю."
      - "Pablo: Quédate el paquete. Llevo otro en la mochila, por si acaso. | Оставь пачку себе. У меня есть ещё одна в рюкзаке, на всякий случай."
      - "Ana: Qué previsor eres. Yo siempre me los olvido. | Какой ты предусмотрительный. Я всегда их забываю."
      - "Pablo: Es la costumbre. Con una madre afectiva, siempre te lleva un kleenex en el bolsillo. | Это привычка. У ласковой мамы всегда в кармане лежит платок."
      - "Ana: Pues dale las gracias de mi parte. | Тогда поблагодари её от меня."
      - "Pablo: Lo haré. Y tómate un té caliente. | Передам. И выпей горячего чаю."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "un paquete de kleenex — пачка салфеток"
      - "sonarse con un kleenex — высморкаться в салфетку"
      - "caja de kleenex — коробка салфеток"
    collocation_example: "Se secó las lágrimas con un kleenex. — Она вытерла слёзы бумажным платком."
    trap: "Слово пишется как бренд Kleenex, но во многих странах — «kleenex» с маленькой: как общее слово. Не путайте с pañuelo «платок» из ткани."

  - word: lo juro
    ru: клянусь
    ipa: /lo ˈxuɾo/
    say: ло ху́ро
    pron: "j — «х»: juro — «ху́ро»."
    meaning: "Горячее заверение: «клянусь, это правда». Juro — первое лицо от jurar «клясться»."
    examples:
      - "Lo juro, no fui yo. — Клянусь, это не я."
      - "Nunca le conté nada a nadie: te lo juro por mi madre. — Я никогда никому ничего не рассказывал: клянусь матерью."
      - "Lo juro ante Dios y ante todos vosotros: voy a decir toda la verdad y nada más que la verdad. — Клянусь перед Богом и перед всеми вами: я скажу всю правду и ничего, кроме правды."
    origin: "От jurar «клясться» (лат. iurare «давать клятву»; ius «право»). Родственные: juez «судья», justicia «справедливость», jurado «присяжный»."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: te lo prometo
        pair: ["Lo juro, no miento.", "Te lo prometo, no miento."]
        diff:
          - "prometer — «обещать» о будущем"
          - "jurar — «клясться» в том, что правда, или торжественно обещать"
    analogs:
      - "I swear — клянусь"
      - "cross my heart — честное слово"
    dialogue:
      - "Ana: ¿Seguro que no lo sabías? | Ты уверен, что не знал?"
      - "Pablo: Lo juro, no sabía nada. | Клянусь, я ничего не знал."
      - "Ana: Pero tu nombre aparece en el expediente. | Но твоё имя фигурирует в деле."
      - "Pablo: Alguien lo puso sin mi permiso. Quizá mediante mi contraseña. | Кто-то вписал его без моего разрешения. Возможно, через мой пароль."
      - "Ana: ¿Y quién pudo hacerlo? | И кто мог это сделать?"
      - "Pablo: Me hago una idea, pero aún no tengo constancia. Lo juro por mi madre. | Я догадываюсь, но подтверждений у меня пока нет. Клянусь мамой."
      - "Ana: Te creo. Pero tendrás que declarar ante el fiscal. | Я тебе верю. Но тебе придётся дать показания прокурору."
      - "Pablo: Lo haré. No tengo nada que ocultar. | Дам. Мне нечего скрывать."
    cefr: "B1."
    frequency: "Очень частое в разговоре."
    collocations:
      - "te lo juro — клянусь тебе"
      - "jurar por Dios — клясться Богом"
      - "jurar lealtad — присягнуть на верность"
    collocation_example: "Juró que nunca volvería a mentir. — Он поклялся, что больше никогда не будет лгать."
    trap: "Lo juro — «клянусь (в этом)»: lo — прямое дополнение. Не путайте jurar «клясться» с jugar «играть»: juro и juego."

  - word: contrariamente
    ru: вопреки, в отличие от
    ipa: /kontɾaɾjaˈmente/
    say: контрарьяме́нтэ
    pron: "Ударение на me: contrariamente."
    meaning: "Наречие: «в противоположность чему-то». Обычно с предлогом a: contrariamente a lo que dicen."
    examples:
      - "Contrariamente a lo que dicen, es amable. — Вопреки тому, что говорят, он любезен."
      - "El tren llegó a la hora y no esperamos nada, contrariamente a lo previsto. — Поезд прибыл вовремя, и нам не пришлось ждать, вопреки ожиданиям."
      - "Contrariamente a mí, ella prefiere el campo a la ciudad y vive feliz en un pueblo pequeño. — В отличие от меня, она предпочитает село городу и счастливо живёт в маленьком посёлке."
    origin: "От contrario «противоположный» (лат. contrarius, от contra «против») + -mente. Родственные: contra «против», contradecir «противоречить»."
    register: "Формальное, книжное."
    synonyms:
      - word: al contrario de
        pair: ["Contrariamente a lo esperado, ganó.", "Al contrario de lo esperado, ganó."]
        diff:
          - "al contrario de — разговорный вариант"
          - "contrariamente a — книжнее"
    analogs:
      - "contrary to — вопреки"
      - "unlike — в отличие от"
    dialogue:
      - "Ana: Dicen que es antipático. | Говорят, он неприятный."
      - "Pablo: Contrariamente a lo que dicen, es muy amable. | Вопреки тому, что говорят, он очень любезный."
      - "Ana: ¿Lo conoces bien? | Ты хорошо его знаешь?"
      - "Pablo: Trabajamos juntos hace años. Parece chulo, pero es solo timidez. | Мы работали вместе несколько лет. Кажется наглым, но это просто застенчивость."
      - "Ana: Contrariamente a lo que pensaba, me cayó simpático cuando lo conocí. | Вопреки тому, что я думала, он мне понравился, когда я с ним познакомилась."
      - "Pablo: ¿Ves? Muchas veces los cotilleos se equivocan. | Видишь? Сплетни часто ошибаются."
      - "Ana: Tienes razón. No hay que precipitarse en pensar mal de nadie. | Ты прав. Не стоит спешить думать плохо о ком-либо."
      - "Pablo: Exacto. Contrariamente a la fama, es un hombre muy afectivo. | Именно. Вопреки репутации, это очень душевный человек."
    cefr: "C1."
    frequency: "Частое в письменной речи."
    collocations:
      - "contrariamente a — вопреки"
      - "al contrario — наоборот"
      - "lo contrario — противоположное"
    collocation_example: "Contrariamente a lo previsto, la reunión duró poco. — Вопреки ожиданиям, собрание продлилось недолго."
    trap: "Нужно a: contrariamente a. Не пишите «contrariamente de». Не путайте с «al contrario» — это самостоятельное «наоборот»."

  - word: almacén
    ru: склад; универмаг
    ipa: /almaˈθen/
    say: альмасэ́н
    pron: "c перед e в Испании — [θ]; ударение на последнем слоге."
    meaning: "Помещение для хранения товаров: склад. В Латинской Америке — «магазин смешанных товаров, универмаг»."
    examples:
      - "Guardamos las cajas en el almacén. — Мы храним коробки на складе."
      - "Compramos pan y leche en el almacén del barrio, que lleva abierto cincuenta años. — Мы купили хлеб и молоко в районной лавке, которая работает пятьдесят лет."
      - "El almacén de la empresa está a las afueras, y de allí salen los camiones cada mañana. — Склад компании находится на окраине, и оттуда каждое утро выезжают грузовики."
    origin: "Из арабского al-maḫzan «склад, хранилище». Родственные: almacenar «хранить», grandes almacenes «универмаг»."
    register: "Нейтральное."
    synonyms:
      - word: depósito
        pair: ["Está en el almacén.", "Está en el depósito."]
        diff:
          - "depósito — «хранилище», в том числе цистерна и банковский вклад"
          - "almacén — склад товаров"
    analogs:
      - "warehouse — склад"
      - "department store — универмаг (grandes almacenes)"
    dialogue:
      - "Ana: ¿Dónde guardan los productos? | Где они хранят товары?"
      - "Pablo: En el almacén de atrás. | На складе позади."
      - "Ana: ¿Está lejos? | Это далеко?"
      - "Pablo: No, a eso de cien metros. Lo vigila un guardia veinticuatro horas al día. | Нет, около ста метров. За ним круглосуточно следит охранник."
      - "Ana: ¿Y quién tiene la llave? | А у кого ключ?"
      - "Pablo: El encargado y su ayudante. Cada vez que alguien entra, lo apuntan en una agenda. | У управляющего и его помощника. Каждый раз, когда кто-то входит, это записывают в журнал."
      - "Ana: Muy concienzudo. | Очень добросовестно."
      - "Pablo: Sí, después del robo del año pasado, no quieren arriesgarse. | Да, после прошлогодней кражи они не хотят рисковать."
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "grandes almacenes — универмаг"
      - "almacén de mercancías — склад товаров"
      - "jefe de almacén — заведующий складом"
    collocation_example: "Trabaja como jefe de almacén en una fábrica. — Он работает заведующим складом на фабрике."
    trap: "Во множественном — almacenes (ударение переходит). «Универмаг» в Испании — grandes almacenes, в Латинской Америке almacén — «лавка». Мужского рода: el almacén."

  - word: parcela
    ru: участок земли
    ipa: /paɾˈθela/
    say: парсэ́ла
    pron: "c перед e в Испании — [θ]."
    meaning: "Небольшой кусок земли, отмеренный для постройки или огорода."
    examples:
      - "Compraron una parcela para construir una casa. — Они купили участок, чтобы построить дом."
      - "En las afueras, detrás del polideportivo, los vecinos cultivan sus propias parcelas de huerta. — На окраине, за спорткомплексом, соседи выращивают овощи на своих участках."
      - "La parcela mide mil metros cuadrados y está justo al lado de un pequeño río. — Участок занимает тысячу квадратных метров и находится рядом с небольшой рекой."
    origin: "От лат. particella «частичка», уменьшительное от pars «часть». Родственные: parte «часть», partir «делить», partícula."
    register: "Нейтральное, юридическое."
    synonyms:
      - word: terreno
        pair: ["Compró una parcela.", "Compró un terreno."]
        diff:
          - "terreno — любой земельный участок, и большой"
          - "parcela — выделенный участок, с границами и кадастровым номером"
    analogs:
      - "plot — участок земли"
      - "lot — участок под застройку"
    dialogue:
      - "Mis tíos compraron una parcela cerca del lago para construir una casa. | Мои дядя и тётя купили участок земли у озера, чтобы построить дом."
      - "Era un terreno llano, con encinas y vistas a la montaña. | Это был ровный участок с дубами и видом на горы."
      - "Tardaron meses en conseguir los permisos, porque hubo muchos trámites burocráticos. | Им понадобились месяцы, чтобы получить разрешения, потому что было много бюрократических формальностей."
      - "Mi tío, muy concienzudo, vigilaba cada paso de las obras. | Мой дядя, очень добросовестный, следил за каждым шагом строительства."
      - "Mi tía, en cambio, soñaba con el jardín y con las barbacoas de verano. | А тётя мечтала о саде и летних барбекю."
      - "Hoy la casa está terminada y la parcela se ha convertido en su rincón favorito. | Сегодня дом достроен, а участок стал их любимым уголком."
    cefr: "B2."
    frequency: "Частое в недвижимости."
    collocations:
      - "comprar una parcela — купить участок"
      - "parcela urbana — городской участок"
      - "parcela catastral — кадастровый участок"
    collocation_example: "Esta parcela tiene mil metros cuadrados. — Этот участок площадью тысяча квадратных метров."
    trap: "Parcela — женского рода: la parcela. Ещё — «часть, область»: una parcela de poder — «сфера влияния». Не путайте с particular «частный»."

  - word: pasta
    ru: деньги (разг.); макароны; паста
    ipa: /ˈpasta/
    say: па́ста
    meaning: "В разговоре — «деньги» (Испания): tener mucha pasta. Ещё — «макаронные изделия» и «тесто, паста»."
    examples:
      - "Compré pasta y tomate para cenar. — Я купил макароны и томаты на ужин."
      - "Antes de meterla en el horno, hay que dejar reposar una hora en la nevera la pasta del pastel. — Перед тем как поставить в духовку, нужно оставить тесто для пирога на час в холодильнике."
      - "Hoy comemos pasta con tomate y un poco de queso rallado por encima, que es lo más fácil. — Сегодня мы едим макароны с томатом и тёртым сыром сверху, это самое простое."
    origin: "От позднелат. pasta «тесто» (греч. pastē «ячменная каша»). Из значения «тесто» вышли «паста» и разговорное «деньги»."
    register: "Разговорное в значении «деньги»."
    synonyms:
      - word: dinero
        pair: ["Tiene mucha pasta.", "Tiene mucho dinero."]
        diff:
          - "dinero — нейтральное «деньги»"
          - "pasta — разговорное, на уровне «бабки»"
    analogs:
      - "dough — деньги (разг.); тесто"
      - "cash — наличные"
    dialogue:
      - "Ana: ¿Cuánto cuesta ese coche? | Сколько стоит эта машина?"
      - "Pablo: Mucha pasta. | Куча денег."
      - "Ana: ¿Cuánto es «mucha»? | Сколько это — «куча»?"
      - "Pablo: Más de cuarenta mil euros. Pero no es un coche corriente: es un modelo de lujo. | Больше сорока тысяч евро. Но это не обычная машина, а модель класса люкс."
      - "Ana: Para mí, eso es una fortuna. Yo prefiero gastar la pasta en viajes. | Для меня это целое состояние. Я предпочитаю тратить деньги на путешествия."
      - "Pablo: Yo también. Aunque anoche me preparé una pasta con tomate buenísima. | Я тоже. Хотя вчера вечером приготовил очень вкусную пасту с помидорами."
      - "Ana: Ja, ja, ¡dos pastas distintas! Una barata y otra cara. | Ха-ха, два разных «пасты»! Одна дешёвая, а другая дорогая."
      - "Pablo: Y la barata es la mejor. | И дешёвая — самая лучшая."
    cefr: "B2."
    frequency: "Частое в Испании."
    collocations:
      - "soltar la pasta — выложить деньги"
      - "ganar pasta — зарабатывать деньги"
      - "pasta de dientes — зубная паста"
    collocation_example: "Ha ganado mucha pasta con su negocio. — Он заработал много денег на своём деле."
    trap: "Слово многозначно: «деньги» (разг.), «макароны», «паста» (pasta de dientes). Контекст подскажет. Грубовато в официальной речи."

  - word: niño bien
    ru: богатый сынок
    ipa: /ˈniɲo ˈβjen/
    say: ни́ньо бьен
    pron: "ñ — «нь»."
    meaning: "Молодой человек из богатой семьи, избалованный и привыкший к хорошей жизни. Часто с оттенком презрения."
    examples:
      - "Es un niño bien que nunca ha trabajado. — Это богатый сынок, который никогда не работал."
      - "En el colegio privado, aquel niño bien se creía mejor que sus compañeros de clase. — В частной школе тот богатенький мальчик считал себя лучше одноклассников."
      - "Los niños bien salen a los locales caros del centro y gastan en una noche lo que otros ganan en un mes. — Золотая молодёжь ходит по дорогим заведениям в центре и тратит за ночь столько, сколько другие зарабатывают за месяц."
    origin: "niño «мальчик» + bien «хорошо»: «из хорошей семьи». Женский род — niña bien. Выражение возникло в XX веке."
    register: "Разговорное, пренебрежительное."
    synonyms:
      - word: pijo
        pair: ["Es un niño bien.", "Es un pijo."]
        diff:
          - "pijo — Испания: «франт, мажор» с оттенком высокомерия"
          - "niño bien — «мальчик из хорошей семьи», слегка мягче, в Латинской Америке"
    analogs:
      - "rich kid — богатый ребёнок"
      - "posh boy — мажор"
    dialogue:
      - "Ana: ¿Quién es ese chico? | Кто этот парень?"
      - "Pablo: Un niño bien, hijo de un empresario. | Богатый сынок, сын предпринимателя."
      - "Ana: ¿Cómo lo sabes? | Откуда ты знаешь?"
