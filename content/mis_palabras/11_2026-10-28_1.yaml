# Пятый список автора, часть 1 — «Por qué Ceuta y Melilla pertenecen a España si están en África» (слова 1–14).
lang: es
words:
  - word: el foco de
    ru: очаг, центр чего-либо
    ipa: /el ˈfoko de/
    say: эль фо́ко дэ
    meaning: "Место, откуда что-то исходит или где сосредоточено: источник света, центр конфликта или болезни."
    examples:
      - "La ciudad fue el foco de la protesta. — Город стал центром протеста."
      - "Hay un foco de infección en el hospital, y los médicos intentan aislarlo. — В больнице обнаружен очаг инфекции, и врачи пытаются его изолировать."
      - "El foco de atención de todos los periodistas estaba en la sala donde se celebraba el juicio. — Центр внимания всех журналистов находился в зале, где шёл суд."
    origin: "Из лат. focus «очаг, огонь»: место, где горит огонь и куда собираются люди. Родственные: fuego «огонь», hogar «домашний очаг», hoguera «костёр»."
    register: "Нейтральное, формальное; часто в новостях."
    synonyms:
      - word: el centro de
        pair: ["Fue el foco de la crisis.", "Fue el centro de la crisis."]
        diff:
          - "el centro de — просто «середина, центр»"
          - "el foco de — «очаг», место, откуда нечто распространяется"
    analogs:
      - "the focus of — центр, средоточие"
      - "hotspot — очаг"
    dialogue:
      - "Ana: ¿Dónde empezó el problema? | Где началась проблема?"
      - "Pablo: En el barrio, que fue el foco del conflicto. | В районе, который стал очагом конфликта."
      - "Ana: ¿Por qué ahí? | Почему именно там?"
      - "Pablo: Porque allí se acumularon el paro, las deudas y el resentimiento. | Потому что там накопились безработица, долги и обида."
      - "Ana: ¿Y cómo se extendió? | И как это распространилось?"
      - "Pablo: Mediante las redes, y las noticias avivaron el fuego. En una semana, el foco se hizo enorme. | Через соцсети, и новости подлили масла в огонь. За неделю очаг стал огромным."
      - "Ana: Qué consecuencia nefasta. | Какое пагубное последствие."
      - "Pablo: Sí, y todo por una chispa tonta. | Да, и всё из-за глупой искры."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "un foco de infección — очаг инфекции"
      - "un foco de tensión — очаг напряжения"
      - "estar en el foco de atención — быть в центре внимания"
    collocation_example: "El presidente está en el foco de las críticas. — Президент оказался в центре критики."
    trap: "Foco — ещё «прожектор» и «лампа»: apagar el foco. Не путайте с foca «тюлень»."

  - word: respaldar
    ru: поддерживать, подтверждать
    ipa: /respalˈdaɾ/
    say: рэспальда́р
    pron: "r в начале — раскатистое; ударение на последнем слоге."
    meaning: "Встать на чью-то сторону и подтвердить своим авторитетом: поддержать решение, мнение, документ."
    examples:
      - "El director respaldó mi decisión ayer. — Директор вчера поддержал моё решение."
      - "El presidente respaldó la propuesta de los sindicatos y prometió ayudarlos en el parlamento. — Президент поддержал предложение профсоюзов и пообещал помогать им в парламенте."
      - "Los datos respaldan su teoría, y por eso los demás científicos han empezado a tomarla en serio. — Данные подтверждают его теорию, и поэтому остальные учёные начали воспринимать её всерьёз."
    origin: "От respaldo «спинка, поддержка» (re- + espalda «спина»): тот, кто стоит за спиной. Родственные: espalda «спина», respaldo «поддержка»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: apoyar
        pair: ["Respaldó la decisión.", "Apoyó la decisión."]
        diff:
          - "apoyar — обычная поддержка, и физическая «прислонить»"
          - "respaldar — поддержка с подтверждением, часто официальная, документом или фактами"
    analogs:
      - "to back — поддерживать"
      - "to endorse — одобрять, подтверждать"
    dialogue:
      - "Ana: ¿Quién apoya el plan? | Кто поддерживает план?"
      - "Pablo: Lo respalda toda la dirección. | Его поддерживает всё руководство."
      - "Ana: ¿Hasta los más críticos? | Даже самые критичные?"
      - "Pablo: Hasta ellos. Una vez que vieron los números, no tardaron en asentir. | Даже они. Когда увидели цифры, скоро кивнули."
      - "Ana: ¿Y los trabajadores? | А работники?"
      - "Pablo: Aún dudan. Quieren que alguien respalde sus condiciones por escrito. | Пока сомневаются. Хотят, чтобы кто-то письменно подтвердил их условия."
      - "Ana: Es lógico. Sin papeles no hay garantía. | Это логично. Без бумаг гарантии нет."
      - "Pablo: Pues sí. Por eso el sindicato también respalda esa petición. | Вот именно. Поэтому профсоюз тоже поддерживает эту просьбу."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "respaldar una decisión — поддержать решение"
      - "respaldar con pruebas — подтвердить доказательствами"
      - "respaldo legal — юридическая поддержка"
    collocation_example: "Los estudios respaldan esta conclusión. — Исследования подтверждают этот вывод."
    trap: "Respaldar — переходный, без предлога: respaldar algo. Не путайте с respirar «дышать» и respaldo «спинка стула»."

  - word: reivindicar
    ru: требовать признания чего-либо своим, добиваться
    ipa: /reiβindiˈkaɾ/
    say: рэйбиндика́р
    pron: "r в начале — раскатистое; v читается как b; перед e c меняется на qu: reivindique."
    meaning: "Громко заявить о своём праве на что-то: на землю, права, память о человеке. Часто — требование справедливости."
    examples:
      - "Los trabajadores reivindican mejores salarios. — Работники требуют более высоких зарплат."
      - "El movimiento reivindica la memoria de las víctimas que nunca recibieron justicia. — Движение отстаивает память жертв, которые так и не получили справедливости."
      - "Reivindicó la obra como suya después de años en los que otro hombre se llevó todo el mérito. — Он заявил, что произведение его, после многих лет, когда всю заслугу приписывал себе другой человек."
    origin: "Из лат. rei vindicare «требовать вещь как свою» (res «вещь» + vindicare «защищать право»). Родственное: reivindicación «требование»."
    register: "Формальное, политическое и публицистическое."
    synonyms:
      - word: reclamar
        pair: ["Reivindican sus derechos.", "Reclaman sus derechos."]
        diff:
          - "reclamar — «требовать» то, что положено, обращаясь к кому-то"
          - "reivindicar — «отстаивать, требовать признания» права, часто публично и громко"
    analogs:
      - "to claim — заявлять права"
      - "to demand — требовать"
    dialogue:
      - "Ana: ¿Qué piden los estudiantes? | Чего требуют студенты?"
      - "Pablo: Reivindican becas y mejores aulas. | Добиваются стипендий и лучших аудиторий."
      - "Ana: ¿Han convocado una huelga? | Они объявили забастовку?"
      - "Pablo: Sí, y se han arremolinado frente al rectorado con pancartas. | Да, и столпились перед ректоратом с плакатами."
      - "Ana: ¿Y el rector qué dice? | И что говорит ректор?"
      - "Pablo: Que no disponen de fondos, pero que está abierto a negociar. | Что у них нет средств, но он готов вести переговоры."
      - "Ana: Entonces habrá que esperar. | Тогда придётся ждать."
      - "Pablo: Pese a todo, siguen reivindicando con ahínco. Quieren que se les escuche. | Несмотря ни на что, они упорно добиваются своего. Хотят, чтобы их услышали."
    cefr: "C1."
    frequency: "Частое в новостях."
    collocations:
      - "reivindicar un derecho — требовать права"
      - "reivindicar la autoría — заявить о своём авторстве"
      - "reivindicar la memoria — отстаивать память"
    collocation_example: "El grupo reivindicó el atentado. — Группа взяла на себя ответственность за теракт."
    trap: "Reivindicar — не «отомстить»: venganza — месть. Перед e c → qu: reivindiqué. В новостях: «reivindicar un atentado» — взять на себя ответственность."

  - word: la concordia
    ru: согласие, примирение
    ipa: /la konˈkoɾðja/
    say: ла конко́рдья
    pron: "d между гласными мягкое [ð]; ударение на co: concordia."
    meaning: "Мирное согласие между людьми или сторонами: когда нет вражды. Слово торжественное."
    examples:
      - "Quiero concordia entre mis dos hermanos. — Я хочу согласия между моими двумя братьями."
      - "Reinaba la concordia en la familia, y por eso las fiestas eran siempre alegres. — В семье царило согласие, и поэтому праздники всегда были радостными."
      - "Buscan la concordia entre los dos países después de una guerra que duró más de diez años. — Они ищут согласия между двумя странами после войны, которая длилась больше десяти лет."
    origin: "Из лат. concordia: con- «вместе» + cor «сердце»: «сердцем вместе». Родственные: acuerdo «соглашение», cordial «сердечный»."
    register: "Формальное, книжное."
    synonyms:
      - word: armonía
        pair: ["Viven en concordia.", "Viven en armonía."]
        diff:
          - "armonía — «гармония» в отношениях и в искусстве"
          - "concordia — именно мирное согласие, особенно после разногласий"
    analogs:
      - "concord — согласие"
      - "harmony — гармония"
    dialogue:
      - "Ana: ¿Hay paz entre ellos? | Между ними мир?"
      - "Pablo: Sí, reina la concordia. | Да, царит согласие."
      - "Ana: ¡Qué alivio! Antes se llevaban muy mal. | Какое облегчение! Раньше они очень плохо ладили."
      - "Pablo: Mi madre hizo de mediadora. Habló con cada uno, con ternura y paciencia. | Моя мама выступила посредником. Говорила с каждым, с нежностью и терпением."
      - "Ana: ¿Y cómo lo logró? | И как у неё получилось?"
      - "Pablo: Les hizo saber que el rencor no lleva a ninguna parte. Una vez que lo entendieron, firmaron la paz. | Дала им понять, что обида никуда не ведёт. Когда они это поняли, заключили мир."
      - "Ana: Qué sabia. | Какая мудрая."
      - "Pablo: Sí. Quiere concordia en la familia, y siempre acaba consiguiéndola. | Да. Хочет согласия в семье и всегда в итоге добивается."
    cefr: "C1."
    frequency: "Нечастое: торжественная и политическая речь."
    collocations:
      - "reinar la concordia — царить согласию"
      - "la concordia entre pueblos — согласие между народами"
      - "en concordia — в согласии"
    collocation_example: "La concordia entre los vecinos es esencial. — Согласие между соседями необходимо."
    trap: "Concordia — женского рода: la concordia. Не путайте с concordancia «соответствие, согласование» (грамматика) и cordero «ягнёнок»."

  - word: avivar
    ru: разжигать, подпитывать
    ipa: /aβiˈβaɾ/
    say: абиба́р
    pron: "v читается как b."
    meaning: "Сделать сильнее: огонь, чувство, спор. Avivar el fuego — «раздуть огонь»; avivar el debate — «подлить масла в спор»."
    examples:
      - "El viento avivó el fuego del campamento. — Ветер раздул огонь в лагере."
      - "Sus palabras avivaron la polémica, y durante días no se habló de otra cosa. — Его слова разожгли полемику, и несколько дней ни о чём другом не говорили."
      - "Avivó el fuego con un poco de leña seca para que la casa se calentara antes de la noche. — Он подкинул в огонь немного сухих дров, чтобы дом прогрелся до ночи."
    origin: "От vivo «живой» (лат. vivus) + приставка a-: «сделать живее». Родственные: vivir «жить», vida «жизнь», avispado «шустрый»."
    register: "Нейтральное, книжное."
    synonyms:
      - word: atizar
        pair: ["Avivó el fuego.", "Atizó el fuego."]
        diff:
          - "atizar — буквально «поворошить» огонь; и о ссорах, чувствах"
          - "avivar — «сделать ярче, сильнее», шире"
    analogs:
      - "to fan the flames — раздувать пламя"
      - "to stoke — разжигать"
    dialogue:
      - "Ana: ¿Por qué se pelean más? | Почему они стали ссориться больше?"
      - "Pablo: Las noticias avivaron el conflicto. | Новости разожгли конфликт."
      - "Ana: ¿Qué decían? | Что в них говорилось?"
      - "Pablo: Que el dueño había desviado fondos. Aunque no hay constancia, el cotilleo corrió como la pólvora. | Что хозяин вывел средства. Хотя подтверждений нет, сплетни разошлись как порох."
      - "Ana: Qué irresponsabilidad. | Какая безответственность."
      - "Pablo: Y para colmo, un periodista avivó el fuego con un titular exagerado. | И в довершение журналист подлил масла в огонь преувеличенным заголовком."
      - "Ana: Así no se ayuda a la concordia. | Так согласие не укрепишь."
      - "Pablo: No. Hace falta serenidad, no morbo. | Нет. Нужно спокойствие, а не нездоровое любопытство."
    cefr: "C1."
    frequency: "Частое в газетах."
    collocations:
      - "avivar el fuego — раздуть огонь"
      - "avivar el debate — подогреть дискуссию"
      - "avivar el interés — усилить интерес"
    collocation_example: "El anuncio avivó el interés del público. — Объявление усилило интерес публики."
    trap: "Не путайте avivar «разжигать» с vivir «жить» и avisar «предупреждать»: слова разные, хотя похожи."

  - word: una vez + participio
    ru: как только, после того как (с причастием)
    ipa: /ˈuna ˈβeθ/
    say: у́на бэс
    pron: "v читается как b; z на конце в Испании — [θ]."
    meaning: "Конструкция «una vez + причастие»: «когда уже сделано». Una vez terminado el trabajo — «когда работа закончена»."
    examples:
      - "Una vez terminado el trabajo, descansamos. — Закончив работу, мы отдохнули."
      - "Una vez presentada la denuncia, la policía abrió una investigación sobre lo ocurrido. — После подачи заявления полиция начала расследование случившегося."
      - "Una vez terminada la reunión, salimos todos juntos a tomar algo en el bar de la esquina. — Когда собрание закончилось, мы все вместе вышли выпить что-нибудь в бар на углу."
    origin: "una vez «один раз» + причастие: «после того, как однажды сделано». Сокращённая форма от una vez que + глагол."
    register: "Формальное, книжное."
    synonyms:
      - word: una vez que + глагол
        pair: ["Una vez terminado el trabajo, descansó.", "Una vez que terminó el trabajo, descansó."]
        diff:
          - "una vez que — с личной формой глагола, разговорнее"
          - "una vez + причастие — короче, согласуется с существительным"
    analogs:
      - "once + past participle — как только (сделано)"
      - "after — после того как"
    dialogue:
      - "Ana: ¿Cuándo salimos? | Когда выходим?"
      - "Pablo: Una vez terminada la reunión. | Как только закончится встреча."
      - "Ana: ¿Cuánto falta? | Сколько ещё?"
      - "Pablo: Una hora, más o menos. Una vez firmado el acta, nos vamos. | Примерно час. Как только подпишут протокол, уходим."
      - "Ana: ¿Y los papeles? | А бумаги?"
      - "Pablo: Una vez entregados los papeles al concejal, no habrá más trámites. | Когда бумаги будут сданы советнику, больше формальностей не будет."
      - "Ana: Menos mal. Estoy agotada. | Слава богу. Я измотана."
      - "Pablo: Una vez hecho todo, te invito a cenar. Te lo mereces. | Когда всё будет сделано, приглашу тебя на ужин. Ты это заслужила."
    cefr: "C1."
    frequency: "Частое в письменной речи."
    collocations:
      - "una vez terminado — когда закончено"
      - "una vez aprobado — когда одобрено"
      - "una vez resuelto el problema — когда проблема решена"
    collocation_example: "Una vez aprobada la ley, entrará en vigor. — Когда закон будет принят, он вступит в силу."
    trap: "Причастие согласуется с существительным: una vez terminada la reunión, una vez cerrados los bancos. Не путайте с una vez que + глагол: там причастия нет."

  - word: disuelto
    ru: распущенный; растворённый
    ipa: /disˈwelto/
    say: дисуэ́льто
    pron: "ue — один слог «уэ»."
    meaning: "О собрании, организации: закрытый, расформированный. О веществе — «растворённый»."
    examples:
      - "El Parlamento fue disuelto ayer. — Парламент был распущен вчера."
      - "La manifestación fue disuelta por la policía, que usó pelotas de goma. — Демонстрацию разогнала полиция, применив резиновые пули."
      - "El azúcar está disuelto en el agua, así que ya puedes añadir la leche y remover bien. — Сахар растворён в воде, так что теперь можешь добавить молоко и хорошо размешать."
    origin: "Причастие от disolver «растворять; распускать» (лат. dissolvere: dis- «врозь» + solvere «развязывать»). Родственные: solución «решение; раствор», disolución."
    register: "Нейтральное, формальное."
    synonyms:
      - word: disgregado
        pair: ["El grupo fue disuelto.", "El grupo fue disgregado."]
        diff:
          - "disgregado — «рассеянный», распавшийся постепенно"
          - "disuelto — «официально распущенный» или «растворённый»"
    analogs:
      - "dissolved — распущенный, растворённый"
      - "disbanded — расформированный"
    dialogue:
      - "Ana: ¿Qué pasó con la asociación? | Что случилось с ассоциацией?"
      - "Pablo: Fue disuelta hace un año. | Её распустили год назад."
      - "Ana: ¿Por qué? | Почему?"
      - "Pablo: Por falta de fondos y por los conflictos internos. Hubo un follón enorme en la asamblea. | Из-за нехватки средств и внутренних конфликтов. На собрании была огромная суматоха."
      - "Ana: ¿Y los socios? | А члены?"
      - "Pablo: Algunos se retiraron, otros fundaron una nueva. Disuelta la antigua, empezó otra etapa. | Некоторые ушли, другие основали новую. После роспуска прежней началась другая эпоха."
      - "Ana: ¿Y la nueva funciona? | И новая работает?"
      - "Pablo: De momento sí. Hay más fluidez y menos peleas. | Пока да. Больше слаженности и меньше ссор."
    cefr: "C1."
    frequency: "Частое в новостях и химии."
    collocations:
      - "disolver el Parlamento — распустить парламент"
      - "disolver en agua — растворить в воде"
      - "disolver una manifestación — разогнать демонстрацию"
    collocation_example: "La policía disolvió la manifestación. — Полиция разогнала демонстрацию."
    trap: "Причастие неправильное: disuelto (не «disolvido»). Глагол disolver спрягается как volver: disuelvo, disuelves."

  - word: brindar
    ru: предоставлять, давать; пить за здоровье
    ipa: /bɾinˈdaɾ/
    say: бринда́р
    meaning: "Дать возможность или помощь: brindar apoyo, brindar una oportunidad. Ещё — «поднять тост»: brindar por alguien."
    examples:
      - "La ciudad brinda muchas oportunidades. — Город предоставляет много возможностей."
      - "La empresa brindó apoyo a las familias afectadas por la inundación del río. — Компания оказала поддержку семьям, пострадавшим от наводнения."
      - "Brindemos por el éxito del nuevo proyecto y por todos los que han trabajado tanto para conseguirlo. — Выпьем за успех нового проекта и за всех, кто так много трудился ради него."
    origin: "От brindis «тост» (из нем. bring dir's «подношу тебе»). Родственное: brindis «тост»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: ofrecer
        pair: ["Nos brindó su ayuda.", "Nos ofreció su ayuda."]
        diff:
          - "ofrecer — просто «предложить»"
          - "brindar — «щедро предоставить», звучит торжественнее"
    analogs:
      - "to offer — предложить"
      - "to toast — произнести тост"
    dialogue:
      - "Ana: ¿Qué os ofrece la ciudad? | Что вам предлагает город?"
      - "Pablo: Nos brinda muchas oportunidades. | Предоставляет нам много возможностей."
      - "Ana: ¿De trabajo? | Работы?"
      - "Pablo: Sí, y de estudio. Hay cursillos, talleres y becas. | Да, и учёбы. Есть курсы, мастерские и стипендии."
      - "Ana: Qué suerte. En mi pueblo no se brinda casi nada. | Повезло. В моём городке почти ничего не предлагается."
      - "Pablo: Pues ven aquí. Te brindo mi casa hasta que encuentres piso. | Тогда приезжай сюда. Предлагаю тебе мой дом, пока не найдёшь квартиру."
      - "Ana: ¿De verdad? Gracias. Brindo por ti. | Правда? Спасибо. Пью за тебя."
      - "Pablo: Y yo por ti. Que sea el comienzo de algo bueno. | А я за тебя. Пусть это станет началом чего-то хорошего."
    cefr: "C1."
    frequency: "Частое."
    collocations:
      - "brindar apoyo — оказать поддержку"
      - "brindar una oportunidad — предоставить возможность"
      - "brindar por — поднять тост за"
    collocation_example: "Brindamos por el nuevo año. — Мы подняли тост за Новый год."
    trap: "Brindar — «щедро предоставить» и «поднять тост»: оба значения нужно различать по контексту. «Brindar por algo» — «выпить за»."

  - word: atender a
    ru: учитывать, откликаться на (потребности)
    ipa: /atenˈdeɾ a/
    say: атэндэ́р а
    pron: "Спрягается e → ie: atiendo, atiendes."
    homonym: "Уже было: atender — принять, обслужить. Здесь — atender a algo: учитывать, откликаться на потребности."
    id: atender-a
    meaning: "С предлогом a: учесть, прислушаться, удовлетворить: atender a las necesidades — «отвечать на потребности»."
    examples:
      - "Atiende a los clientes con paciencia. — Он терпеливо обслуживает клиентов."
      - "No atendió a razones y siguió adelante con su plan hasta el final. — Он не внял доводам и продолжал свой план до конца."
      - "Hay que atender a las necesidades de los vecinos antes de empezar con las obras del parque. — Нужно учесть нужды жителей, прежде чем начинать работы в парке."
    origin: "Из лат. attendere «направлять внимание» (ad- «к» + tendere «тянуть»). Родственные: atención «внимание», atento «внимательный»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: tener en cuenta
        pair: ["Atendió a sus peticiones.", "Tuvo en cuenta sus peticiones."]
        diff:
          - "tener en cuenta — «принять во внимание»"
          - "atender a — «откликнуться на», удовлетворить просьбу"
    analogs:
      - "to heed — прислушаться"
      - "to cater to — удовлетворять потребности"
    dialogue:
      - "Ana: ¿Escucharon sus quejas? | Вашим жалобам внимали?"
      - "Pablo: No, no atendieron a razones. | Нет, они не слушали доводов."
      - "Ana: ¿Ni siquiera con pruebas? | Даже с доказательствами?"
      - "Pablo: Ni siquiera. Esgrimieron que el trámite estaba cerrado y se retiraron. | Даже с ними. Сослались на то, что процедура закрыта, и ушли."
      - "Ana: Qué falta de respeto. | Какое неуважение."
      - "Pablo: Mi abogado dice que hay que atender a la ley, no a las excusas. | Мой адвокат говорит, что надо считаться с законом, а не с отговорками."
      - "Ana: Y tiene razón. ¿Qué vais a hacer? | И он прав. Что вы будете делать?"
      - "Pablo: Reclamar de nuevo, con mucha paciencia y ahínco. | Подадим жалобу снова, с большим терпением и упорством."
    cefr: "C1."
    frequency: "Частое в официальной речи."
    collocations:
      - "atender a razones — внять доводам"
      - "atender a las necesidades — отвечать на потребности"
      - "atender a la llamada — откликнуться на призыв"
    collocation_example: "El Gobierno debe atender a las necesidades de la población. — Правительство должно учитывать потребности населения."
    trap: "Без a — «обслужить человека» (atender a un cliente), с a перед неодушевлённым — «учесть, откликнуться»: atender a las necesidades. Смысл зависит от дополнения."

  - word: contar con
    ru: располагать, иметь в наличии; рассчитывать на
    ipa: /konˈtaɾ kon/
    say: конта́р кон
    pron: "Спрягается o → ue: cuento, cuentas."
    meaning: "Иметь что-то в своём распоряжении: людей, ресурсы. Ещё — «рассчитывать на кого-то»: contar contigo."
    examples:
      - "El piso cuenta con dos balcones. — В квартире есть два балкона."
      - "La universidad cuenta con una biblioteca enorme, abierta las veinticuatro horas. — В университете огромная библиотека, открытая круглосуточно."
      - "El hospital cuenta con cien camas y con un equipo de médicos jóvenes que viene de varios países. — В больнице сто коек и команда молодых врачей, приехавших из нескольких стран."
    origin: "contar «считать; рассказывать» (лат. computare «подсчитывать») + con «с». Образ: «считать вместе с кем-то», включать в расчёт."
    register: "Нейтральное, формальное."
    synonyms:
      - word: disponer de
        pair: ["Cuenta con mucho dinero.", "Dispone de mucho dinero."]
        diff:
          - "disponer de — формальнее, «иметь в распоряжении»"
          - "contar con — шире: ещё и «рассчитывать на человека»"
    analogs:
      - "to have — иметь, располагать"
      - "to count on — рассчитывать на"
    dialogue:
      - "Ana: ¿Puedo contar contigo? | Могу на тебя рассчитывать?"
      - "Pablo: Por supuesto, cuenta conmigo. | Разумеется, рассчитывай на меня."
      - "Ana: Gracias. Necesito ayuda con la mudanza. | Спасибо. Мне нужна помощь с переездом."
      - "Pablo: ¿Cuándo es? ¿Cuentas con alguien más? | Когда это? У тебя есть кто-то ещё?"
      - "Ana: Con mi hermano y un amigo. El piso nuevo cuenta con dos balcones y una cocina enorme. | С братом и другом. В новой квартире два балкона и огромная кухня."
      - "Pablo: Qué bien. Yo llevo mi furgoneta, por si hace falta. | Здорово. Я привезу свой фургон, если понадобится."
      - "Ana: Eres un tesoro. Sabía que podía contar contigo. | Ты сокровище. Я знала, что могу на тебя рассчитывать."
      - "Pablo: Siempre. Aunque con un bollo de premio, mejor. | Всегда. Хотя с булочкой в награду было бы лучше."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "contar con alguien — рассчитывать на кого-то"
      - "contar con recursos — располагать ресурсами"
      - "no contar con — не учитывать, не иметь"
    collocation_example: "La empresa cuenta con diez empleados. — В компании десять сотрудников."
    trap: "С предлогом con: contar con algo. После con местоимения особые: contar conmigo, contigo, con él. Не путайте с contar «рассказывать» и «считать»."

  - word: corresponder a
    ru: доставаться, причитаться кому-либо
    ipa: /koɾesponˈdeɾ a/
    say: коррэспондэ́р а
    pron: "rr — раскатистое."
    meaning: "Быть чьей-то долей, обязанностью или правом: «это положено ему». Ещё — «отвечать взаимностью»."
    examples:
      - "Esta parte corresponde a mi hermano. — Эта часть положена моему брату."
      - "Le correspondió limpiar la casa porque ayer lo hizo su hermano. — Уборка дома досталась ему, потому что вчера её делал брат."
      - "No le correspondía a él decidir, porque el contrato dice que es el consejo quien aprueba los gastos. — Не ему принадлежало решение, потому что в договоре сказано, что расходы утверждает совет."
    origin: "Из лат. correspondere: con- «вместе» + respondere «отвечать». Родственные: respuesta «ответ», correspondencia «переписка»."
    register: "Формальное, нейтральное."
    synonyms:
      - word: tocar
        pair: ["Me corresponde un tercio.", "Me toca un tercio."]
        diff:
          - "tocar — разговорное «выпадать, доставаться»"
          - "corresponder — официальное «причитаться по праву»"
    analogs:
      - "to be due — причитаться"
      - "to fall to — выпадать на долю"
    dialogue:
      - "Ana: ¿Quién debe pagar? | Кто должен платить?"
      - "Pablo: Le corresponde al propietario. | Это обязанность владельца."
      - "Ana: ¿Y el inquilino? | А жильца?"
      - "Pablo: A él solo le corresponde pagar la luz y el agua. Las reparaciones del taller, el techo y demás, son cosa del dueño. | С него только свет и вода. Ремонт, крыша и прочее — дело хозяина."
      - "Ana: Entonces el recibo de la caldera... | Тогда счёт за котёл..."
      - "Pablo: Corresponde al propietario. Hazle saber que lo pague cuanto antes. | Это на хозяине. Дай ему знать, чтобы оплатил как можно скорее."
      - "Ana: Vale, le mando un mensaje hoy mismo. | Хорошо, отправлю ему сообщение сегодня же."
      - "Pablo: Y guarda una copia, por si acaso. | И сохрани копию, на всякий случай."
    cefr: "B2."
    frequency: "Частое."
    collocations:
      - "corresponder a alguien — причитаться кому-то"
      - "como corresponde — как положено"
      - "corresponder al amor — ответить взаимностью"
    collocation_example: "Hizo lo que le correspondía y se marchó. — Он сделал то, что ему положено, и ушёл."
    trap: "Человек стоит в dativo: me corresponde, le corresponde. Не путайте corresponder «причитаться» с corresponsal «корреспондент»."

  - word: estallar
    ru: вспыхнуть, разразиться
    ipa: /estaˈʎaɾ/
    say: эстайа́р
    pron: "ll в большинстве регионов — как «й»."
    meaning: "Внезапно начаться со взрывом: война, скандал, гнев. О предметах — «взорваться»."
    examples:
      - "El escándalo estalló en pocas horas. — Скандал разразился за несколько часов."
      - "La bomba estalló a las ocho de la mañana, cuando las calles estaban vacías. — Бомба взорвалась в восемь утра, когда улицы были пусты."
      - "Estalló una guerra en la región que nadie había visto venir y que cambió la vida de miles de familias. — В регионе вспыхнула война, которую никто не ждал и которая изменила жизнь тысяч семей."
    origin: "Слово звукоподражательное: передаёт хлопок. Родственные: estallido «взрыв, вспышка»."
    register: "Нейтральное, из новостей."
    synonyms:
      - word: explotar
        pair: ["El conflicto estalló.", "El conflicto explotó."]
        diff:
          - "explotar — «взорваться» буквально; и «эксплуатировать»"
          - "estallar — «вспыхнуть»: о войне, скандале, смехе, гневе"
    analogs:
      - "to break out — разразиться"
      - "to burst — лопнуть, взорваться"
    dialogue:
      - "Ana: ¿Cuándo empezó el escándalo? | Когда начался скандал?"
      - "Pablo: Estalló la semana pasada. | Разразился на прошлой неделе."
      - "Ana: ¿Qué lo provocó? | Что его вызвало?"
      - "Pablo: Una filtración. Alguien publicó unos documentos que probaban que el concejal había recibido dinero. | Утечка. Кто-то опубликовал документы, доказывающие, что советник получал деньги."
      - "Ana: ¡No me digas! ¿Y cómo reaccionó? | Не может быть! И как он отреагировал?"
      - "Pablo: Montó en cólera y lo negó todo. Pero el escándalo estalló y los periódicos se hicieron eco enseguida. | Пришёл в ярость и всё отрицал. Но скандал разразился, и газеты сразу его подхватили."
      - "Ana: Y ahora estará a punto de dimitir. | И теперь он, видимо, вот-вот уйдёт в отставку."
      - "Pablo: Eso espero. Ya no puede esgrimir inocencia. | Надеюсь. Он больше не может ссылаться на невиновность."
    cefr: "B2."
    frequency: "Частое в новостях."
    collocations:
      - "estallar la guerra — разразиться войне"
      - "estallar en lágrimas — расплакаться"
      - "estallar de risa — взорваться смехом"
    collocation_example: "Estalló en carcajadas al oír el chiste. — Он расхохотался, услышав шутку."
    trap: "Не путайте estallar «взорваться» с estar «быть» и estallido «взрыв» (существительное). Не путайте с explotar «эксплуатировать»."

  - word: surgir
    ru: возникнуть, появиться
    ipa: /suɾˈxiɾ/
    say: сурхи́р
    pron: "g перед i — «х»; перед a, o g меняется на j: surja."
    meaning: "Внезапно появиться: вопрос, проблема, идея, человек. Ещё — «вынырнуть» из воды."
    examples:
      - "Ha surgido un imprevisto en el trabajo. — На работе возникла непредвиденная ситуация."
      - "Surgió un problema inesperado en el último momento y tuvimos que posponer la salida. — В последний момент возникла неожиданная проблема, и нам пришлось отложить выезд."
      - "Han surgido nuevas dudas sobre el caso desde que apareció el testigo que nadie conocía. — Появились новые сомнения по этому делу с тех пор, как возник свидетель, о котором никто не знал."
    origin: "Из лат. surgere «подниматься» (sub- + regere «направлять»). Родственные: resurgir «возродиться», insurgente «повстанец»."
    register: "Нейтральное, формальное."
    synonyms:
      - word: aparecer
        pair: ["Surgió un problema.", "Apareció un problema."]
        diff:
          - "aparecer — просто «появиться, показаться»"
          - "surgir — «возникнуть, возникнуть вдруг», о проблемах и вопросах"
    analogs:
      - "to arise — возникнуть"
      - "to emerge — появиться"
    dialogue:
      - "Ana: ¿Por qué cancelaron la reunión? | Почему отменили встречу?"
      - "Pablo: Surgió un imprevisto. | Возникла непредвиденная ситуация."
      - "Ana: ¿Algo grave? | Что-то серьёзное?"
      - "Pablo: No lo sé. Dicen que surgió un problema con unos papeles y hubo que revisarlos cuanto antes. | Не знаю. Говорят, что возникла проблема с бумагами, и их пришлось срочно проверять."
      - "Ana: Qué fastidio. Yo ya había quedado con mi jefe. | Какая досада. Я уже договорилась с начальником."
      - "Pablo: A mí también me surgió otro compromiso. Es increíble cómo surgen las cosas. | У меня тоже возникло ещё одно дело. Невероятно, как всё сразу появляется."
      - "Ana: ¿Y la volverán a convocar? | И её назначат снова?"
      - "Pablo: Seguro. En cuanto surja un hueco, nos avisarán. | Конечно. Как только появится окно, нас предупредят."
    cefr: "B2."
    frequency: "Очень частое."
    collocations:
      - "surgir un problema — возникнуть проблеме"
      - "surgir una duda — появиться сомнению"
      - "si surge algo — если что-то возникнет"
    collocation_example: "Si surge algún problema, llámame. — Если возникнет проблема, позвони мне."
    trap: "Перед a, o, u g меняется на j: surja, surjo. Surgir — непереходный: surgió un problema, а не «surgió un problema algo». Не путайте с surtir «поставлять»."

  - word: desestimar
    ru: отклонить, отвергнуть
    ipa: /desestiˈmaɾ/
    say: дэсэстима́р
    meaning: "Не принять во внимание: заявление, иск, предложение. В юриспруденции — «отклонить жалобу»."
    examples:
      - "El tribunal desestimó su recurso ayer. — Суд вчера отклонил его апелляцию."
      - "Desestimaron mi solicitud de ayuda porque la presenté fuera de plazo. — Мою заявку на помощь отклонили, потому что я подал её с опозданием."
      - "El juez desestimó la demanda por falta de pruebas y condenó al demandante a pagar las costas. — Судья отклонил иск из-за отсутствия доказательств и обязал истца оплатить судебные издержки."
    origin: "des- «не» + estimar «оценивать, уважать» (лат. aestimare). Родственные: estima «уважение», estimación «оценка», subestimar «недооценить»."
    register: "Формальное, юридическое."
    synonyms:
      - word: rechazar
        pair: ["Desestimaron el recurso.", "Rechazaron el recurso."]
        diff:
          - "rechazar — общее «отвергнуть»"
          - "desestimar — «признать необоснованным и не принять», официально"
    analogs:
      - "to dismiss — отклонить (иск)"
      - "to reject — отвергнуть"
    dialogue:
      - "Ana: ¿Qué dijo el tribunal? | Что сказал суд?"
      - "Pablo: Desestimó el recurso. | Отклонил апелляцию."
      - "Ana: ¡Qué pena! ¿Y por qué? | Как жаль! И почему?"
      - "Pablo: Porque no había suficiente constancia ni pruebas nuevas. Los jueces no atendieron a los argumentos. | Потому что не было достаточных подтверждений и новых доказательств. Судьи не учли доводов."
      - "Ana: ¿Y ahora qué? | И что теперь?"
      - "Pablo: El abogado dice que no hay otro remedio que aceptar. Aunque se puede presentar otro recurso. | Адвокат говорит, что нет другого выхода, кроме как принять. Хотя можно подать ещё одну апелляцию."
      - "Ana: Qué agotador. | Как утомительно."
      - "Pablo: Sí, pero no pienso agachar la cabeza. | Да, но опускать голову я не собираюсь."
    cefr: "C1."
    frequency: "Частое в правовых и новостных текстах."
    collocations:
      - "desestimar un recurso — отклонить жалобу"
      - "desestimar una demanda — отклонить иск"
      - "desestimar una propuesta — отклонить предложение"
    collocation_example: "El tribunal desestimó la apelación. — Суд отклонил апелляцию."
    trap: "Не путайте desestimar «отклонить» с subestimar «недооценить» и estimar «оценить, считать»: слова одного корня, смысл разный."

  - word: actuar de buena fe
    ru: действовать добросовестно
    ipa: /akˈtwaɾ de ˈbwena fe/
    say: актуа́р дэ буэ́на фэ
    pron: "ua — один слог в actuar: ak-tuar; ue — «уэ»."
    meaning: "Поступать честно, без умысла навредить: даже если вышла ошибка. Buena fe — «добросовестность»."
    examples:
      - "Lo hizo de buena fe, créeme. — Он сделал это добросовестно, поверь мне."
      - "Compré el coche de buena fe, y solo después descubrí que tenía una deuda. — Я купил машину добросовестно и лишь потом обнаружил на ней долг."
      - "Actuó de buena fe y no sabía nada del fraude que se estaba preparando a su alrededor. — Он действовал добросовестно и ничего не знал о мошенничестве, которое готовилось вокруг него."
    origin: "actuar «действовать» (лат. actuare) + de buena fe «в доброй вере»: fe — «вера, доверие» (лат. fides). Родственные: confianza «доверие», fiel «верный»."
    register: "Формальное, юридическое."
    synonyms:
      - word: con buena intención
        pair: ["Actuó de buena fe.", "Actuó con buena intención."]
        diff:
          - "con buena intención — «с добрыми намерениями», не обязательно по закону"
          - "de buena fe — юридический термин: «добросовестно, не зная о нарушении»"
    analogs:
      - "to act in good faith — действовать добросовестно"
      - "bona fide — добросовестный"
    dialogue:
      - "Ana: ¿Sabía que era robado? | Он знал, что это краденое?"
      - "Pablo: No, actuó de buena fe. | Нет, он действовал добросовестно."
      - "Ana: ¿Y cómo lo compró? | И как он его купил?"
      - "Pablo: En el Rastro, a un vendedor que parecía honrado. Pagó en efectivo y no pidió recibo. | На Растро, у продавца, который казался честным. Заплатил наличными и не взял чек."
      - "Ana: Qué ingenuo. | Какой наивный."
      - "Pablo: Quizá, pero actuó de buena fe. La policía lo ha comprendido. | Возможно, но он действовал добросовестно. Полиция это поняла."
      - "Ana: ¿Y tendrá consecuencias? | И будут ли последствия?"
      - "Pablo: Tendrá que devolverlo. Pero, contrariamente a lo que temía, no habrá multa. | Придётся вернуть. Но, вопреки его опасениям, штрафа не будет."
    cefr: "C1."
    frequency: "Частое в юридических текстах."
    collocations:
      - "de buena fe — добросовестно"
      - "de mala fe — недобросовестно"
      - "actuar de buena fe — действовать добросовестно"
    collocation_example: "Firmó el contrato de buena fe. — Он подписал договор добросовестно."
    trap: "Fe — женского рода: la fe, поэтому buena fe, а не «buen fe». Противоположное — de mala fe."
