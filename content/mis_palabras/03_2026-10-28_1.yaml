# Третий список автора, часть 1 — «Desconcierto en el hospital», глава 1 (слова 1–16).
lang: es
words:
  - word: desconcierto
    ru: замешательство, растерянность
    ipa: /deskonˈθjerto/
    say: дэсконсье́рто
    pron: "c перед i в Испании — [θ], как th в английском _think_; ie — один слог «ье»."
    meaning: "Состояние, когда человек не понимает, что происходит, и не знает, как поступить."
    examples:
      - "Hubo desconcierto entre todos los pasajeros. — Среди всех пассажиров была растерянность."
      - "En las declaraciones del ministro se notó el desconcierto del gobierno ante la crisis. — В заявлениях министра была заметна растерянность правительства перед кризисом."
      - "Reinaba el desconcierto en la sala de espera, porque nadie sabía quién nos iba a atender. — В зале ожидания царила растерянность, потому что никто не знал, кто нас примет."
    origin: "Отглагольное существительное от desconcertar: des- «не» + concertar «согласовать, привести в порядок». То есть «нарушенный порядок»."
    register: "Нейтральное, чаще в письменной речи и рассказах."
    synonyms:
      - word: confusión
        pair: ["Sintió desconcierto al oír la noticia.", "Sintió confusión al oír la noticia."]
        diff:
          - "confusión — путаница в голове или в ситуации вообще, и в мыслях, и в вещах"
          - "desconcierto — именно растерянность человека перед неожиданным"
    analogs:
      - "bewilderment — почти то же, но книжное"
      - "confusion — шире: ещё и «путаница»"
    dialogue:
      - "Ana: ¿Qué cara tenía el médico cuando vio los resultados? | Какое лицо было у врача, когда он увидел результаты?"
      - "Pablo: De desconcierto. No entendía nada. | Растерянное. Он ничего не понимал."
      - "Ana: ¿Y tú cómo reaccionaste? | А как отреагировал ты?"
      - "Pablo: Me quedé quieto, mirándolo fijamente. Hubo un silencio incómodo. | Я замер и пристально смотрел на него. Повисла неловкая тишина."
      - "Ana: Qué situación tan delicada. | Какая деликатная ситуация."
      - "Pablo: Al final dijo que repetiría todo, porque quizá se había equivocado. | В конце он сказал, что повторит всё, потому что, возможно, ошибся."
      - "Ana: Menos mal. A veces hasta los médicos se equivocan. | Слава богу. Иногда и врачи ошибаются."
      - "Pablo: Sí, pero mi desconcierto no se me pasó en toda la noche. | Да, но моя растерянность не прошла за всю ночь."
    cefr: "C1 — абстрактное слово из художественных текстов."
    frequency: "Средней частоты: в прессе и литературе, в разговоре его заменяют проще."
    collocations:
      - "causar desconcierto — вызвать растерянность"
      - "un momento de desconcierto — минута растерянности"
      - "reinar el desconcierto — царит растерянность"
    collocation_example: "La noticia causó desconcierto entre los vecinos. — Новость вызвала растерянность среди соседей."
    trap: "Не путайте с concierto «концерт»: там одна c и нет приставки des-. Глагол — desconcertar (e → ie): me desconcierta."

  - word: celador
    ru: санитар, больничный служащий
    ipa: /θelaˈðoɾ/
    say: сэладо́р
    pron: "c перед e в Испании — [θ]; d между гласными мягкое [ð]."
    meaning: "Работник больницы или другого учреждения без медицинского образования: возит каталки, помогает переносить больных, следит за порядком."
    examples:
      - "Pregunta al celador dónde está radiología. — Спроси у санитара, где рентген."
      - "Mientras la enfermera sujetaba el suero, el celador empujó la camilla hasta urgencias. — Пока медсестра держала капельницу, санитар довёз каталку до приёмного отделения."
      - "Mi primo trabaja de celador en el hospital del pueblo y hace turnos de noche. — Мой двоюродный брат работает санитаром в сельской больнице и дежурит по ночам."
    origin: "От celar «присматривать, надзирать» + суффикс -dor, обозначающий того, кто делает. Родственные: celo «рвение», celoso «ревнивый, усердный»."
    register: "Нейтральное, слово из испанской больницы."
    synonyms:
      - word: camillero
        pair: ["El celador llevó al paciente.", "El camillero llevó al paciente."]
        diff:
          - "camillero — тот, кто носит носилки (camilla), уже по задаче"
          - "celador — шире: ещё присматривает за порядком"
    analogs:
      - "orderly — санитар в больнице"
      - "porter — тот, кто возит больных (в Британии)"
    dialogue:
      - "Ana: ¿Quién lleva al abuelo a radiología? | Кто отвезёт дедушку на рентген?"
      - "Pablo: El celador. Ya viene por el pasillo. | Санитар. Он уже идёт по коридору."
      - "Ana: Qué amable. Ayer otro celador nos trató con mucha frialdad. | Какой любезный. Вчера другой санитар встретил нас очень холодно."
      - "Pablo: Será que tenía mucho trabajo. En los hospitales siempre se va con prisa. | Наверное, у него было много работы. В больницах вечно спешка."
      - "Ana: Aun así, la paciencia y la ternura no cuestan nada. | И всё же терпение и нежность ничего не стоят."
      - "Pablo: Tienes razón. Mira, ya trae la silla de ruedas. | Ты права. Смотри, он уже везёт коляску."
      - "Ana: Abuelo, no te alteres, todo va a salir bien. | Дедушка, не волнуйся, всё будет хорошо."
      - "Pablo: Yo voy con él. Tú quédate con la abuela. | Я пойду с ним. Ты оставайся с бабушкой."
    cefr: "B2 — узкое профессиональное слово."
    frequency: "Редкое в обычной речи, частое в рассказах про больницу и тюрьму."
    collocations:
      - "el celador del hospital — больничный санитар"
      - "el celador de la prisión — надзиратель"
      - "el celador de noche — ночной сторож"
    collocation_example: "El celador de noche me dejó pasar. — Ночной сторож пропустил меня."
    trap: "В русском «celador» не сводится к «охраннику»: в больнице это санитар, в тюрьме — надзиратель, в музее — смотритель. Не путайте с celoso «ревнивый»."

  - word: hacer falta
    ru: быть нужным, понадобиться
    ipa: /aˈθeɾ ˈfalta/
    say: асэ́р фа́льта
    pron: "h не читается; z/c в Испании — [θ]."
    meaning: "Быть необходимым. Устроен как gustar: нужное — подлежащее, кому нужно — me, te, le: me hace falta tiempo, me hacen falta dos horas."
    examples:
      - "Hace falta más tiempo para terminarlo. — Нужно больше времени, чтобы это закончить."
      - "Desde anoche el niño tiene mucha fiebre y me hace falta un médico urgentemente. — С вечера у ребёнка сильный жар, и мне срочно нужен врач."
      - "No hace falta que vengas hasta aquí, que yo puedo ir a recoger los papeles. — Тебе не нужно приезжать сюда, я могу сам забрать бумаги."
    origin: "hacer «делать» + falta «нехватка» (от faltar «не хватать»). Буквально «делать нехватку», то есть «создавать недостачу»."
    register: "Нейтральное, обычно в разговоре."
    synonyms:
      - word: necesitar
        pair: ["Me hace falta dinero.", "Necesito dinero."]
        diff:
          - "necesitar — обычный глагол: Necesito, Necesitas…"
          - "hacer falta — безлично: нужное стоит подлежащим, а человек — me, te"
    analogs:
      - "to need — с обычным подлежащим: I need time"
      - "to be necessary — Hace falta ≈ It is necessary"
    dialogue:
      - "Voy a pasar una semana en el hospital con mi madre. | Я проведу неделю в больнице с мамой."
      - "Hace falta llevar ropa cómoda, un cargador y algo para leer. | Нужно взять удобную одежду, зарядку и что-нибудь почитать."
      - "También hace falta mucha paciencia: aquí todo va despacio. | Ещё нужно много терпения: здесь всё идёт медленно."
      - "No hace falta traer dinero, pero sí algo de calderilla para la máquina de café. | Деньги брать не нужно, но немного мелочи для кофейного автомата пригодится."
      - "Mi hermano dice que no hace falta que me quede de noche. | Брат говорит, что мне не нужно оставаться на ночь."
      - "Sin embargo, no quiero que mi madre se sienta sola. | И всё же я не хочу, чтобы мама чувствовала себя одинокой."
      - "Si hace falta, dormiré en el sillón, rodeada de cables y máquinas. | Если понадобится, буду спать в кресле, среди проводов и аппаратов."
      - "Lo importante es que ella sepa que estoy a su lado. | Главное, чтобы она знала, что я рядом."
    cefr: "A2 — частое, но с необычным устройством."
    frequency: "Очень частое в разговоре."
    collocations:
      - "no hace falta — не нужно"
      - "hace falta + инфинитив — нужно сделать"
      - "hace falta que + subjuntivo — нужно, чтобы…"
    collocation_example: "Hace falta que alguien hable con él. — Нужно, чтобы кто-то с ним поговорил."
    trap: "Человек стоит в me/te/le, а не в подлежащем: Me hacen falta zapatos, а не Hago falta zapatos. После hace falta que — subjuntivo."

  - word: por si
    ru: на случай если
    ipa: /poɾ si/
    say: пор си
    meaning: "На случай, если вдруг что-то произойдёт. Самый частый вариант — por si acaso."
    examples:
      - "Llévate el paraguas por si llueve. — Возьми зонт на случай дождя."
      - "Te llamo por si acaso no has visto mi mensaje, porque es urgente. — Звоню тебе на всякий случай, вдруг ты не видел моего сообщения, оно срочное."
      - "Guarda una copia de los documentos por si pierdes los originales durante el viaje. — Храни копию документов на случай, если потеряешь оригиналы во время поездки."
    origin: "Предлог por «из-за, ради» + союз si «если». Дословно «ради «если»»: действуем заранее из-за возможности."
    register: "Нейтральное, разговорное."
    synonyms:
      - word: en caso de que
        pair: ["Lleva dinero por si lo necesitas.", "Lleva dinero en caso de que lo necesites."]
        diff:
          - "en caso de que — книжнее и после него — subjuntivo"
          - "por si — проще, и после него можно indicativo: por si llueve"
    analogs:
      - "just in case — полный аналог"
      - "in case — in case it rains"
    dialogue:
      - "Ana: ¿Por qué traes tantos papeles? | Зачем ты принёс столько бумаг?"
      - "Pablo: Por si hacen falta. Mejor que sobren a que falten. | На случай, если понадобятся. Лучше пусть будет с запасом."
      - "Ana: Yo traje agua y un jersey, por si hace frío en la sala de espera. | А я взяла воду и свитер — вдруг в зале ожидания холодно."
      - "Pablo: Siempre tan previsora. Yo olvidé hasta el móvil. | Вечно ты предусмотрительна. А я даже телефон забыл."
      - "Ana: ¿Y cómo vas a avisar a tu hermano? | И как ты предупредишь брата?"
      - "Pablo: Le dejé una nota en casa, por si me llama. | Я оставил ему записку дома — вдруг позвонит."
      - "Ana: Qué despiste. ¡Tienes la cabeza en las nubes! | Какая рассеянность. У тебя голова в облаках!"
      - "Pablo: Estoy distraído, lo sé. Es que me preocupa el abuelo. | Я рассеян, знаю. Просто беспокоюсь за дедушку."
    cefr: "A2."
    frequency: "Очень частое в разговоре."
    collocations:
      - "por si acaso — на всякий случай"
      - "por si las moscas — на всякий пожарный (разг.)"
      - "por si fuera poco — как будто мало"
    collocation_example: "Tengo una copia, por si acaso. — У меня есть копия, на всякий случай."
    trap: "После por si обычно indicativo в настоящем (por si llueve), а если рассказ в прошлом — imperfecto de subjuntivo (por si llovía/lloviera). Не путайте с porque si «просто так»."

  - word: prueba
    id: prueba-2
    homonym: "Уже было: prueba — доказательство. Здесь — анализ, обследование."
    ru: анализ, обследование, тест
    ipa: /ˈpɾweβa/
    say: пруэ́ба
    pron: "ue — один слог «уэ»; b между гласными мягкая [β]."
    meaning: "В медицине — анализ или обследование, которое назначает врач: прикладывают прибор, берут кровь. Во множественном — pruebas — все обследования сразу."
    examples:
      - "Los resultados de la prueba salen mañana. — Результаты анализа будут завтра."
      - "Le hicieron una prueba de sangre para saber qué le pasaba exactamente. — Ему сделали анализ крови, чтобы узнать, что именно с ним происходит."
      - "Antes de operar, el cirujano pidió una prueba de imagen para ver bien la zona. — Перед операцией хирург назначил снимок, чтобы хорошо рассмотреть эту область."
    origin: "От probar «пробовать, проверять» (лат. probare «испытывать»). Тот же корень в aprobar «одобрить, сдать», comprobar «проверить»."
    register: "Нейтральное; в медицине — стандартное слово."
    synonyms:
      - word: análisis
        pair: ["Me han hecho una prueba de sangre.", "Me han hecho un análisis de sangre."]
        diff:
          - "análisis — чаще именно лабораторный анализ"
          - "prueba — любое обследование, и тест, и проба"
    analogs:
      - "test — анализ, обследование: blood test"
      - "exam — осмотр или экзамен"
    dialogue:
      - "Ana: ¿Cuándo te hacen las pruebas? | Когда тебе делают анализы?"
      - "Pablo: Mañana en ayunas, a las ocho. | Завтра натощак, в восемь."
      - "Ana: ¿Y te da miedo? | И тебе страшно?"
      - "Pablo: Un poco. Es normal sentir un escalofrío antes de una prueba así. | Немного. Это нормально — чувствовать озноб перед таким анализом."
      - "Ana: Piensa que solo es una prueba, no una sentencia. | Думай, что это лишь анализ, а не приговор."
      - "Pablo: Tienes razón. Además, el médico parece muy prudente. | Ты права. К тому же врач кажется очень осмотрительным."
      - "Ana: Te acompaño, ¿vale? Así no te sientes solo. | Я пойду с тобой, хорошо? Так ты не будешь один."
      - "Pablo: Gracias. Y después te invito a desayunar. | Спасибо. А потом я угощу тебя завтраком."
    cefr: "B1 — значение «обследование» нужно в больнице."
    frequency: "Частое в медицинской речи."
    collocations:
      - "hacer una prueba — сделать анализ"
      - "una prueba de sangre — анализ крови"
      - "pruebas médicas — медицинские обследования"
    collocation_example: "Esperamos los resultados de las pruebas. — Мы ждём результатов обследований."
    trap: "У слова три значения: «доказательство», «обследование» и «испытание, проба». Смысл подсказывает контекст: в больнице — «обследование»."

  - word: la conveniencia o no de
    ru: целесообразность того, стоит ли...
    ipa: /la kombeˈnjenθja o no ðe/
    say: ла комбэнье́нсья о но дэ
    pron: "c перед i в Испании — [θ]; v читается как b."
    meaning: "Оборот из официальной речи: стоит ли что-то делать. Сначала называют «пользу», потом через «o no» напоминают, что решение может быть и отрицательным."
    examples:
      - "Discutieron la conveniencia o no de operar. — Они обсуждали, стоит ли оперировать."
      - "Antes de cambiar el horario de las clases, el comité estudiará la conveniencia o no de hacerlo. — Прежде чем менять расписание занятий, комитет рассмотрит, целесообразно ли это."
      - "Hay dudas sobre la conveniencia o no de esperar a los resultados antes de decidir. — Есть сомнения, стоит ли ждать результатов, прежде чем принимать решение."
    origin: "conveniencia — от convenir «подходить, годиться» (лат. convenire «сходиться»). Отсюда и conveniente «подходящий, выгодный»."
    register: "Формальное, книжное, язык документов и медицинских консилиумов."
    synonyms:
      - word: la oportunidad de
        pair: ["Valoraron la conveniencia de operar.", "Valoraron la oportunidad de operar."]
        diff:
          - "oportunidad de — «своевременность, уместность» — решение с точки зрения времени"
    analogs:
      - "the advisability of — осторожное «целесообразность»"
      - "whether or not to — обычное «стоит ли»"
    dialogue:
      - "Los médicos se reunieron en una sala pequeña, rodeados de informes. | Врачи собрались в маленькой комнате, окружённые отчётами."
      - "El tema era delicado: debatían la conveniencia o no de operar al abuelo. | Тема была деликатной: они обсуждали, стоит ли оперировать дедушку."
      - "Unos pensaban que la operación era un riesgo demasiado grande. | Одни считали, что операция — слишком большой риск."
      - "Otros opinaban que, sin ella, su estado empeoraría. | Другие считали, что без неё его состояние ухудшится."
      - "Nadie quería cometer un error. | Никто не хотел совершить ошибку."
      - "Al final decidieron esperar un día más y repetir las pruebas. | В конце концов решили подождать ещё день и повторить анализы."
      - "Mientras tanto, la familia esperaba fuera, entre el desconcierto y la preocupación. | А семья тем временем ждала снаружи, в растерянности и тревоге."
    cefr: "C1 — формула из письменной речи."
    frequency: "Редкая в разговоре, частая в документах и новостях."
    collocations:
      - "valorar la conveniencia de — оценить целесообразность"
      - "cuestionar la conveniencia de — ставить под сомнение целесообразность"
      - "por razones de conveniencia — из соображений удобства"
    collocation_example: "El comité valoró la conveniencia de abrir otra sala. — Комитет оценил целесообразность открытия ещё одной палаты."
    trap: "Обычно пишут «la conveniencia de + инфинитив»: de не пропускают. Не путайте conveniencia «целесообразность, удобство» с convivencia «совместная жизнь»."

  - word: choque
    ru: столкновение, авария
    ipa: /ˈtʃoke/
    say: чо́кэ
    pron: "ch — «ч»; qu перед e — «к»: choque читается «чо́кэ»."
    meaning: "Столкновение двух предметов, в первую очередь машин. Ещё — потрясение, шок."
    examples:
      - "Hubo un choque entre dos camiones. — Произошло столкновение двух грузовиков."
      - "Por suerte los dos conductores llevaban cinturón, aunque el choque fue muy fuerte. — К счастью, оба водителя были пристёгнуты, хотя столкновение было очень сильным."
      - "Sufrió un choque emocional al ver las imágenes y no pudo hablar durante un rato. — Он пережил эмоциональный шок, увидев эти кадры, и какое-то время не мог говорить."
    origin: "Из французского choc, того же корня, что в английском shock. Глагол — chocar «сталкиваться»."
    register: "Нейтральное."
    synonyms:
      - word: colisión
        pair: ["Hubo un choque entre dos coches.", "Hubo una colisión entre dos coches."]
        diff:
          - "colisión — формальное слово, из протоколов и новостей"
    analogs:
      - "crash — авария, особенно машин"
      - "collision — формально"
    dialogue:
      - "Ana: ¿Qué ha pasado? Hay una cola enorme. | Что случилось? Огромная пробка."
      - "Pablo: Un choque en el cruce. Dicen que hay dos coches destrozados. | Авария на перекрёстке. Говорят, два разбитых автомобиля."
      - "Ana: ¡Qué horror! ¿Hay heridos? | Какой ужас! Есть раненые?"
      - "Pablo: Eso parece. Se oyen las ambulancias desde aquí. | Похоже на то. Отсюда слышно скорые."
      - "Ana: Menos mal que no vamos con prisa. | Хорошо, что мы никуда не спешим."
      - "Pablo: Yo sí, tengo cita en el hospital. Pero de todas formas no podemos hacer nada. | А я спешу, у меня приём в больнице. Но мы всё равно ничего не можем сделать."
      - "Ana: Respira hondo y ten paciencia. Seguro que desvían el tráfico pronto. | Дыши глубже и наберись терпения. Наверняка скоро пустят объезд."
      - "Pablo: Eso espero. Odio llegar tarde. | Надеюсь. Ненавижу опаздывать."
    cefr: "B1."
    frequency: "Частое в новостях и дорожных историях."
    collocations:
      - "un choque frontal — лобовое столкновение"
      - "un choque de trenes — столкновение поездов"
      - "un choque cultural — культурный шок"
    collocation_example: "Tuvo un choque frontal con un camión. — У него было лобовое столкновение с грузовиком."
    trap: "Choque — и «авария», и «шок»: «culture shock» — choque cultural, «электрошок» — choque eléctrico. Не путайте с chocolate."

  - word: carril
    ru: полоса движения
    ipa: /kaˈrril/
    say: каррил
    pron: "rr — раскатистое."
    meaning: "Полоса на дороге, по которой движутся машины. Ещё — рельс, колея."
    examples:
      - "Usa el carril de la derecha ahora. — Сейчас езжай по правой полосе."
      - "Casi provoca un accidente porque cambió de carril sin mirar por el retrovisor. — Он чуть не вызвал аварию, потому что перестроился в другую полосу, не посмотрев в зеркало."
      - "En muchas ciudades hay un carril bici que va desde la estación hasta el centro. — Во многих городах есть велодорожка, которая идёт от вокзала до центра."
    origin: "От carro «повозка» (лат. carrus): исходно колея для повозки. Отсюда и «рельс», и «полоса движения»."
    register: "Нейтральное; при вождении слышишь постоянно."
    synonyms: []
    analogs:
      - "lane — полоса движения"
      - "rail — рельс, значение «колея» у carril тоже есть"
    dialogue:
      - "Ana: ¿Por qué frenas de golpe? | Почему ты резко тормозишь?"
      - "Pablo: Un coche cambió de carril sin avisar. | Машина перестроилась в другой ряд без предупреждения."
      - "Ana: ¡Qué imprudente! Casi provoca un choque. | Какой неосторожный! Чуть не устроил аварию."
      - "Pablo: Por eso voy por el carril de la derecha. Es más tranquilo. | Поэтому я еду по правой полосе. Там спокойнее."
      - "Ana: Yo prefiero el de la izquierda, pero hoy estoy un poco distraída. | Я люблю левую, но сегодня я немного рассеяна."
      - "Pablo: Pues no te distraigas, que el tráfico es un peligro. | Тогда не отвлекайся, движение опасно."
      - "Ana: Tienes razón. Mira, hay una señal: se acaba el carril. | Ты прав. Смотри, знак: полоса заканчивается."
      - "Pablo: Sin embargo, el coche de delante no la ha visto. ¡Cuidado! | А машина впереди его не заметила. Осторожно!"
    cefr: "B1."
    frequency: "Частое в разговорах о дороге."
    collocations:
      - "el carril izquierdo — левая полоса"
      - "cambiar de carril — перестроиться"
      - "el carril bici — велодорожка"
    collocation_example: "Voy por el carril de la derecha. — Я еду по правой полосе."
    trap: "Не путайте с cuneta «кювет» и arcén «обочина»: carril — полоса, по которой едут. Ударение на последнем слоге, как в papel: el carril."

  - word: caer de bruces
    ru: упасть лицом вниз
    ipa: /kaˈeɾ de ˈbɾuθes/
    say: каэ́р дэ бру́сэс
    pron: "z/c в Испании — [θ], как th в английском _think_. Ударение на ru: «бру́сес»."
    meaning: "Упасть так, чтобы удариться лицом об землю, вытянувшись вперёд. От bruces — «лицом вниз»."
    examples:
      - "La anciana cayó de bruces en la acera. — Пожилая женщина упала лицом вниз на тротуар."
      - "Tropezó con un escalón y cayó de bruces delante de todos los invitados. — Он споткнулся о ступеньку и упал лицом вниз перед всеми гостями."
      - "El niño resbaló con el suelo mojado y cayó de bruces, pero no se hizo daño. — Мальчик поскользнулся на мокром полу и упал ничком, но не ушибся."
    origin: "Слово bruces встречается только в оборотах caer de bruces и dar de bruces, само по себе не употребляется. Происхождение неясно."
    register: "Нейтральное, из рассказов."
    synonyms: []
    analogs:
      - "to fall flat on one's face — то же, и в прямом, и в переносном смысле"
    dialogue:
      - "Ana: ¿Qué te ha pasado en la cara? | Что у тебя с лицом?"
      - "Pablo: Me caí de bruces en la calle. | Я упал лицом вниз на улице."
      - "Ana: ¡Qué mala suerte! ¿Fue por la lluvia? | Вот не повезло! Из-за дождя?"
      - "Pablo: No, tropecé con un bordillo mientras corría. Tenía prisa. | Нет, споткнулся о бордюр на бегу. Я торопился."
      - "Ana: Siempre tienes prisa. ¿Te dolió mucho? | Ты вечно торопишься. Было очень больно?"
      - "Pablo: Más el orgullo que el cuerpo. Un señor se acercó asustado. | Больше самолюбию, чем телу. Один сеньор испуганно подбежал."
      - "Ana: ¿Estás seguro de que no te has roto nada? | Ты уверен, что ничего не сломал?"
      - "Pablo: Sí, solo me duele la barbilla. No pasa nada. | Да, болит только подбородок. Ничего страшного."
    cefr: "C1 — фразеологизм."
    frequency: "Нечастое: встречается в рассказах и новостях."
    collocations:
      - "caerse de bruces — упасть лицом вниз"
      - "dar de bruces con — наткнуться на, столкнуться лицом к лицу с"
      - "de bruces — лицом вниз"
    collocation_example: "Al abrir la puerta, di de bruces con mi vecino. — Открыв дверь, я столкнулся лицом к лицу с соседом."
    trap: "Слово bruces отдельно не используют: только de bruces. Пишется с c перед es, а не z: bruces. Ещё и «dar de bruces con» значит «столкнуться с кем-то неожиданно»."

  - word: aturdido
    ru: оглушённый, ошеломлённый
    ipa: /atuɾˈðiðo/
    say: атурди́до
    pron: "d между гласными мягкое [ð]; rd — р и мягкое д."
    meaning: "Человек, который растерян и плохо соображает после удара, шума или неожиданной новости."
    examples:
      - "Estaba aturdido por el golpe en la cabeza. — Он был оглушён ударом по голове."
      - "Tardé varios minutos en poder contestar porque la noticia me dejó aturdido. — Я несколько минут не мог ответить, потому что новость меня ошеломила."
      - "Con tanto ruido de la fiesta, salí aturdido y necesité aire fresco durante un rato. — От такого шума на празднике я вышел оглушённым и какое-то время нуждался в свежем воздухе."
    origin: "Причастие от aturdir «оглушать, ошеломлять». По одной из версий, слово связано с tordo «дрозд»: считалось, что дрозд, наевшись винограда, хмелеет и ничего не соображает."
    register: "Нейтральное, из рассказов."
    synonyms:
      - word: atontado
        pair: ["Estaba aturdido tras el golpe.", "Estaba atontado tras el golpe."]
        diff:
          - "atontado — «одурманенный», разговорнее и грубее"
          - "aturdido — нейтральное, от удара или шума"
    analogs:
      - "dazed — ошеломлённый"
      - "stunned — оглушённый, поражённый"
    dialogue:
      - "Después del choque, Marcos salió del coche con las piernas temblando. | После аварии Маркос вылез из машины с дрожащими ногами."
      - "Estaba aturdido: oía un murmullo lejano y no sabía dónde estaba. | Он был оглушён: слышал далёкий гул и не понимал, где находится."
      - "Una mujer se le acercó y le preguntó si estaba herido. | Женщина подошла к нему и спросила, не ранен ли он."
      - "Él se quedó quieto, mirándola fijamente, sin saber qué contestar. | Он замер, пристально глядя на неё, не зная, что ответить."
      - "Poco a poco, el desconcierto se fue pasando. | Мало-помалу растерянность прошла."
      - "Entonces se dio cuenta de que le sangraba la frente. | Тогда он заметил, что у него идёт кровь из лба."
      - "La ambulancia llegó enseguida y un médico le dijo: «Tranquilo, respire hondo». | Скорая приехала сразу, и врач сказал: «Спокойно, дышите глубже»."
    cefr: "C1."
    frequency: "Средней частоты: в рассказах и новостях."
    collocations:
      - "quedarse aturdido — остаться ошеломлённым"
      - "sentirse aturdido — чувствовать себя оглушённым"
      - "aturdido por el golpe — оглушённый ударом"
    collocation_example: "Me sentí aturdido tras la caída. — Я почувствовал себя оглушённым после падения."
    trap: "Это причастие, поэтому согласуется: aturdido/aturdida/aturdidos. С estar и quedarse, но не с ser: estar aturdido."

  - word: rasguño
    ru: царапина
    ipa: /rasˈɣuɲo/
    say: расгу́ньо
    pron: "r в начале — раскатистое; gu перед u читается «гу» — [ɣu]; ñ — «нь»."
    meaning: "Небольшая поверхностная ранка на коже, которую оставили ногти, ветка или острый предмет."
    examples:
      - "Me hice un rasguño en la rodilla. — Я поцарапал колено."
      - "Aunque el coche quedó completamente destrozado, él salió del accidente sin un rasguño. — Хотя машина была полностью разбита, он вышел из аварии без единой царапины."
      - "Solo tiene un rasguño en la mano, así que con un poco de agua y una tirita basta. — У него только царапина на руке, так что достаточно немного воды и пластыря."
    origin: "От rasguñar «царапать»: от rasgar «рвать, раздирать» + суффикс -uñar от uña «ноготь». То есть «поцарапать ногтем»."
    register: "Нейтральное."
    synonyms:
      - word: arañazo
        pair: ["El gato me hizo un rasguño.", "El gato me hizo un arañazo."]
        diff:
          - "arañazo — чаще от когтей или ногтей животного или человека"
          - "rasguño — любая поверхностная ранка, и от ветки, и от металла"
    analogs:
      - "scratch — царапина"
      - "graze — ссадина, содранная кожа"
    dialogue:
      - "Ana: ¿Estás herido? | Ты ранен?"
      - "Pablo: No, solo un rasguño. No es nada. | Нет, только царапина. Ничего страшного."
      - "Ana: Déjame verlo. Te sale un poco de sangre. | Дай посмотрю. У тебя немного идёт кровь."
      - "Pablo: De verdad, no hace falta que te preocupes. | Правда, не нужно беспокоиться."
      - "Ana: Te limpio la herida y te pongo una tirita, por si se infecta. | Я обработаю рану и наклею пластырь — вдруг будет заражение."
      - "Pablo: Eres muy prudente. A mí nunca se me ocurre. | Ты очень осмотрительна. Мне такое никогда в голову не приходит."
      - "Ana: Por eso me tienes a mí. Quédate quieto, que escuece un poco. | Для этого у тебя есть я. Не двигайся, будет немного щипать."
      - "Pablo: ¡Ay! Me alboroto con cualquier cosa. | Ай! Я теряю голову от любой мелочи."
      - "Ana: Ya está. Un rasguño sin importancia. | Готово. Пустяковая царапина."
    cefr: "B2."
    frequency: "Частое в бытовой речи, особенно в выражении «sin un rasguño»."
    collocations:
      - "sin un rasguño — без единой царапины"
      - "hacerse un rasguño — поцарапаться"
      - "un pequeño rasguño — небольшая царапина"
    collocation_example: "Se cayó de la bici y se hizo un rasguño. — Он упал с велосипеда и поцарапался."
    trap: "Не путайте с arañazo (от когтей) и rascar «чесать»: rasguño — результат, а rascar — действие. gu перед u: u читается, но g звучит мягко."

  - word: hemorragia
    ru: кровотечение
    ipa: /emoˈraxja/
    say: эмора́хья
    pron: "h не читается; rr нет — одна r между гласными; j — «х»."
    meaning: "Сильное кровотечение, особенно внутреннее или опасное для жизни. Для небольшой ранки используют sangrar «кровоточить»."
    examples:
      - "Los médicos pararon la hemorragia. — Врачи остановили кровотечение."
      - "Tenía una hemorragia interna que no se vio en las primeras pruebas del hospital. — У него было внутреннее кровотечение, которое не обнаружили при первых обследованиях в больнице."
      - "Si la hemorragia no se detiene con la presión, hay que llamar a una ambulancia. — Если кровотечение не останавливается от нажатия, нужно вызывать скорую."
    origin: "Из греческого haima «кровь» + rhagia «прорыв, хлынуть». Родственные: hemoglobina, hemofilia, hematoma."
    register: "Медицинское, нейтральное."
    synonyms: []
    analogs:
      - "hemorrhage — то же слово, тот же корень"
      - "bleeding — «кровотечение» в обычной речи"
    dialogue:
      - "Lucía: Doctor, ¿es grave? | Доктор, это серьёзно?"
      - "Médico: Sí, hay hemorragia interna. Hay que operar ya. | Да, внутреннее кровотечение. Нужно оперировать сейчас же."
      - "Lucía: ¿Cuánto tiempo tardará? | Сколько это займёт?"
      - "Médico: Dos horas, quizá tres. No puedo asegurarlo. | Два часа, может, три. Гарантировать не могу."
      - "Lucía: ¿Hay riesgo? | Есть риск?"
      - "Médico: Siempre lo hay, pero actuamos rápido y la hemorragia aún no es profunda. | Он всегда есть, но мы действуем быстро, и кровотечение ещё не глубокое."
      - "Lucía: Haga todo lo posible, por favor. Es mi marido. | Сделайте всё возможное, пожалуйста. Это мой муж."
      - "Médico: Tenga paciencia. En cuanto sepamos algo, se lo diremos. | Наберитесь терпения. Как только что-то узнаем, сообщим."
    cefr: "B2 — медицинская лексика."
    frequency: "Частое в новостях и при разговоре о здоровье."
    collocations:
      - "hemorragia interna — внутреннее кровотечение"
      - "parar la hemorragia — остановить кровотечение"
      - "hemorragia cerebral — кровоизлияние в мозг"
    collocation_example: "El cirujano detuvo la hemorragia. — Хирург остановил кровотечение."
    trap: "Не путайте с hemorroides «геморрой»: корень тот же (haima «кровь»), но слова разные. Буква h не читается."

  - word: cansancio
    ru: усталость
    ipa: /kanˈsanθjo/
    say: канса́нсьо
    pron: "c перед i в Испании — [θ]; ancio — «ансьо»."
    meaning: "Состояние, когда нет сил после работы, дороги или бессонной ночи."
    examples:
      - "Siento un cansancio enorme después del viaje. — Я чувствую огромную усталость после поездки."
      - "Creo que necesito unas vacaciones, porque desde hace semanas siento mucho cansancio. — Думаю, мне нужен отпуск, потому что уже несколько недель я чувствую сильную усталость."
      - "Se durmió de cansancio en el sofá, todavía con la ropa del trabajo puesta. — Он уснул от усталости на диване, ещё в рабочей одежде."
    origin: "Существительное от cansar «утомлять» (из лат. campsare «огибать, обходить», то есть идти долгим путём). Родственные: cansado «усталый», incansable «неутомимый»."
    register: "Нейтральное."
    synonyms:
      - word: fatiga
        pair: ["Sufre cansancio constante.", "Sufre fatiga constante."]
        diff:
          - "fatiga — медицинское и более сильное слово: усталость как симптом"
    analogs:
      - "tiredness — усталость"
      - "fatigue — изнеможение, как симптом"
    dialogue:
      - "Marcos: Llevo tres días sin dormir y siento un cansancio enorme. | Я три дня не сплю и чувствую огромную усталость."
      - "Marcos: Los ojos se me cierran, pero no puedo dejar de pensar en el accidente. | Глаза слипаются, но я не могу перестать думать об аварии."
      - "Marcos: Cada vez que cierro los ojos, vuelvo a ver el choque. | Каждый раз, закрывая глаза, я снова вижу столкновение."
      - "Marcos: No es solo cansancio físico; también estoy agotado por dentro, lleno de dudas. | Это не только физическая усталость: я измотан и внутри, полон сомнений."
      - "Marcos: Mi madre dice que debo reflexionar menos y descansar más. | Мама говорит, что мне нужно меньше размышлять и больше отдыхать."
      - "Marcos: Quizá tenga razón. Hoy me acuesto pronto, sin móvil y sin pensar en nada. | Возможно, она права. Сегодня лягу пораньше — без телефона и ни о чём не думая."
      - "Marcos: Mañana, con la cabeza despejada, hablaré con la inspectora. | Завтра, на свежую голову, поговорю с инспектором."
    cefr: "B1."
    frequency: "Очень частое."
    collocations:
      - "morirse de cansancio — умирать от усталости"
      - "caerse de cansancio — валиться с ног"
      - "sentir cansancio — чувствовать усталость"
    collocation_example: "Se caía de cansancio después del viaje. — Он валился с ног после поездки."
    trap: "Cansancio — существительное, а «усталый» — cansado. Говорят «Estoy cansado», а не «Tengo cansado»: но можно «Tengo mucho cansancio»."

  - word: enseres
    ru: вещи, пожитки
    ipa: /enˈseɾes/
    say: энсэ́рэс
    meaning: "Личные вещи, утварь, нужные в доме или в дороге. Почти всегда во множественном числе."
    examples:
      - "Dejó todos sus enseres en la casa vieja. — Он оставил все свои вещи в старом доме."
      - "Sin despedirse de nadie, se marchó de la casa y se llevó sus enseres. — Ни с кем не простившись, он ушёл из дома и забрал свои вещи."
      - "Los enseres domésticos estaban en cajas, listas para cargar en el camión de la mudanza. — Домашняя утварь лежала в коробках, готовая к погрузке в грузовик для переезда."
    origin: "По словарю, от en- «в» и ser в старом значении «имущество, достояние». Точная история слова неясна."
    register: "Книжное, формальное. В разговоре говорят cosas."
    synonyms:
      - word: pertenencias
        pair: ["Guardó sus enseres en una bolsa.", "Guardó sus pertenencias en una bolsa."]
        diff:
          - "pertenencias — то, что принадлежит человеку, личные вещи"
          - "enseres — предметы, нужные в хозяйстве и быту"
    analogs:
      - "belongings — личные вещи"
      - "utensils — утварь"
    dialogue:
      - "Cuando Ana se mudó, dejó casi todos sus enseres en la casa vieja. | Когда Ана переезжала, она оставила почти все вещи в старом доме."
      - "Solo se llevó dos maletas, una caja de libros y su guitarra. | Взяла только два чемодана, коробку книг и гитару."
      - "Los demás enseres —platos, sillas, cortinas— ya no tenían sentido en un piso tan pequeño. | Остальные вещи — тарелки, стулья, шторы — уже не имели смысла в такой маленькой квартире."
      - "Los vecinos se quedaron con algunos y el resto lo regaló. | Часть вещей забрали соседи, остальное она раздала."
      - "Al principio sintió melancolía, pero pronto se dio cuenta de que no los necesitaba. | Сначала она почувствовала грусть, но вскоре поняла, что они ей не нужны."
      - "Hoy su casa está casi vacía y, sin embargo, se siente más libre que nunca. | Сегодня её дом почти пуст, и всё же она чувствует себя свободнее, чем когда-либо."
    cefr: "C1."
    frequency: "Редкое: в официальных текстах и рассказах."
    collocations:
      - "enseres personales — личные вещи"
      - "enseres domésticos — домашняя утварь"
      - "enseres de pesca — рыболовные снасти"
    collocation_example: "Los enseres personales se guardan en la taquilla. — Личные вещи хранятся в шкафчике."
    trap: "Слово почти не употребляют в единственном числе. В разговоре вместо него лучше cosas: «mis cosas»."

  - word: agenda
    ru: ежедневник, записная книжка
    ipa: /aˈxenda/
    say: ахэ́нда
    pron: "g перед e — «х»: [x]."
    meaning: "Блокнот с датами, в который записывают встречи и дела. Ещё — «список дел на день или период»."
    examples:
      - "Apunta la cita en la agenda. — Запиши встречу в ежедневник."
      - "Tengo la agenda llena esta semana, así que podemos vernos el lunes que viene. — У меня на этой неделе плотный график, так что давай встретимся в следующий понедельник."
      - "El ministro tiene una agenda muy apretada: tres reuniones y un viaje en el mismo día. — У министра очень плотное расписание: три встречи и поездка в один день."
    origin: "От лат. agenda «то, что нужно делать» (множественное число от agendum, от agere «делать»). Исходно — «дела»."
    register: "Нейтральное."
    synonyms:
      - word: calendario
        pair: ["Miro mi agenda.", "Miro mi calendario."]
        diff:
          - "calendario — просто календарь, сетка дат"
          - "agenda — календарь, в который вы записываете свои дела"
    analogs:
      - "diary — в британском английском тоже «ежедневник»"
      - "agenda — в английском это «повестка дня», а не блокнот"
    dialogue:
      - "Ana: ¿Cuándo nos vemos? | Когда увидимся?"
      - "Pablo: Déjame mirar la agenda. Mañana tengo mucho lío. | Дай посмотрю ежедневник. Завтра у меня много дел."
      - "Ana: ¿Todavía usas agenda de papel? | Ты до сих пор пользуешься бумажным ежедневником?"
      - "Pablo: Sí, me da más seguridad que el móvil. Aquí apunto las citas y las contraseñas. | Да, так надёжнее, чем в телефоне. Тут записаны встречи и пароли."
      - "Ana: ¿Las contraseñas? ¡Eso es peligroso! | Пароли? Это опасно!"
      - "Pablo: No me pasa nada. La llevo siempre en el bolsillo y nunca la pierdo. | Ничего не случится. Я всегда ношу её в кармане и не теряю."
      - "Ana: Bueno, mira si tienes hueco el jueves. | Ладно, посмотри, свободен ли ты в четверг."
      - "Pablo: El jueves por la tarde sí. ¿Te apetece ir al cine? | В четверг вечером да. Хочешь сходить в кино?"
    cefr: "B1."
    frequency: "Частое."
    collocations:
      - "tener la agenda llena — иметь плотное расписание"
      - "apuntar en la agenda — записать в ежедневник"
      - "agenda de contactos — записная книжка с контактами"
    collocation_example: "Apunté tu número en mi agenda. — Я записал твой номер в записную книжку."
    trap: "Ложный друг: английское agenda — «повестка дня», а испанское agenda — «ежедневник». «Повестка дня» по-испански — orden del día."

  - word: bolsita de aseo
    ru: косметичка, несессер
    ipa: /bolˈsita ðe aˈseo/
    say: больси́та дэ асэ́о
    pron: "d между гласными мягкое [ð]; ea — два слога «э-о»: aseo."
    meaning: "Маленькая сумочка с зубной щёткой, мылом, расчёской и другими предметами, нужными в дороге или в больнице."
    examples:
      - "Pon la bolsita de aseo en la mochila. — Положи косметичку в рюкзак."
      - "Con la toalla pequeña metió en la maleta la bolsita de aseo. — Вместе с маленьким полотенцем он положил в чемодан косметичку."
      - "Se olvidó la bolsita de aseo en el hotel y tuvo que comprar todo de nuevo. — Он забыл косметичку в отеле и ему пришлось всё покупать заново."
    origin: "bolsa «сумка» + уменьшительный суффикс -ita + aseo «гигиена, опрятность» (от asear «приводить в порядок»). То есть «сумочка для гигиены»."
    register: "Нейтральное."
    synonyms:
      - word: neceser
        pair: ["Metió el cepillo en la bolsita de aseo.", "Metió el cepillo en el neceser."]
        diff:
          - "neceser — более привычное название такой сумочки в обычной речи"
    analogs:
      - "toiletry bag — косметичка для поездок"
      - "washbag — британское название"
    dialogue:
      - "Ana: ¿Qué llevas al hospital? | Что ты берёшь с собой в больницу?"
      - "Pablo: Ropa cómoda y mi bolsita de aseo. | Удобную одежду и косметичку."
      - "Ana: ¿Qué metes en la bolsita? | Что кладёшь в косметичку?"
      - "Pablo: Cepillo de dientes, jabón, peine y un poco de colonia. | Зубную щётку, мыло, расчёску и немного одеколона."
      - "Ana: ¿Colonia en un hospital? ¿Para qué? | Одеколон в больнице? Зачем?"
      - "Pablo: Porque el olor a desinfectante me marea. | Потому что запах дезинфекции вызывает у меня головокружение."
      - "Ana: Pues guárdalo en un sitio discreto. Hay gente con alergias. | Тогда спрячь его в неприметном месте. Бывают люди с аллергией."
      - "Pablo: Tienes razón. Por cierto, ¿me prestas tu cargador? | Ты права. Кстати, одолжишь зарядку?"
    cefr: "B1."
    frequency: "Нечастое: бытовая лексика для поездок."
    collocations:
      - "una bolsa de aseo — несессер"
      - "artículos de aseo — туалетные принадлежности"
      - "el cuarto de aseo — санузел"
    collocation_example: "No olvides los artículos de aseo. — Не забудь туалетные принадлежности."
    trap: "Aseo — не «ассе́о», а «асэ́о»: два отдельных слога. Aseo — «гигиена, опрятность»; а туалет или санузел в Испании тоже называют aseos."

  - word: nota suelta
    ru: отдельная заметка, листок
    ipa: /ˈnota ˈswelta/
    say: но́та суэ́льта
    pron: "ue — один слог «уэ»: suelta читается «суэ́льта»."
    meaning: "Листок с записью, который не вклеен в блокнот и не сшит с другими. Suelto — «свободный, отдельный»."
    examples:
      - "Tengo una nota suelta con su dirección. — У меня есть отдельный листок с его адресом."
      - "Para pasarlas luego al ordenador, guardo en una carpeta las notas sueltas. — Чтобы потом перенести их в компьютер, я храню в папке отдельные листки."
      - "Encontré una nota suelta en el cajón, con un número de teléfono y un nombre que no conocía. — Я нашёл в ящике отдельный листок с номером телефона и незнакомым именем."
    origin: "nota «заметка» (лат. nota «знак») + suelta, женский род от suelto «свободный, не связанный» (от soltar «отпускать»)."
    register: "Нейтральное, бытовое."
    synonyms: []
    analogs:
      - "loose note — отдельная записка"
      - "scrap of paper — клочок бумаги"
    dialogue:
      - "Marcos buscó el número de la clínica en todos los cajones. | Маркос искал номер клиники во всех ящиках."
      - "Lo había apuntado en una nota suelta, pero la nota había desaparecido. | Он записал его на отдельном листке, но листок исчез."
      - "Revolvió la agenda, el escritorio y hasta el bolsillo de la chaqueta. | Он перерыл ежедневник, стол и даже карман куртки."
      - "Al final la encontró detrás de un cuadro, donde la había dejado su mujer. | В конце концов нашёл её за картиной — туда её положила жена."
      - "Se sintió tonto, pero también aliviado. | Он почувствовал себя глупо, но и облегчённо."
      - "Desde ese día, apunta todo en la agenda y no confía en las notas sueltas. | С тех пор он записывает всё в ежедневник и не доверяет отдельным листкам."
    cefr: "B1."
    frequency: "Нечастое: сочетание из описаний."
    collocations:
      - "un papel suelto — отдельный листок"
      - "dejar una nota — оставить записку"
      - "tomar notas — делать заметки"
    collocation_example: "Dejé una nota para mi madre. — Я оставил записку матери."
    trap: "Прилагательное suelto согласуется с существительным: nota suelta, papel suelto, notas sueltas. Не путайте nota «заметка» и nota «оценка»: Saqué buena nota — «получил хорошую оценку»."

  - word: chincheta
    ru: кнопка (канцелярская)
    ipa: /tʃinˈtʃeta/
    say: чинче́та
    pron: "ch — «ч»: чинче́та."
    meaning: "Короткий гвоздик с широкой шляпкой, которым прикрепляют бумагу к стене или доске."
    examples:
      - "Clavó el cartel con una chincheta roja. — Он прикрепил плакат красной кнопкой."
      - "Pisé una chincheta descalzo y tuve que sentarme a sacármela del pie. — Я наступил на кнопку босиком и должен был сесть, чтобы вытащить её из ноги."
      - "Clavó la nota en el corcho con una chincheta para que todos la vieran al entrar. — Он прикрепил записку к пробковой доске кнопкой, чтобы все видели её при входе."
    origin: "От chinche «клоп» (лат. cimex): шляпка похожа на круглое тельце клопа. Так в испанском называют и канцелярскую кнопку."
    register: "Нейтральное."
    synonyms:
      - word: tachuela
        pair: ["Clavó la lista con una chincheta.", "Clavó la lista con una tachuela."]
        diff:
          - "tachuela — гвоздик с широкой шляпкой, но более крупный, для ткани и кожи"
          - "chincheta — канцелярская кнопка, которую вдавливают пальцем"
    analogs:
      - "drawing pin — канцелярская кнопка (британский английский)"
      - "thumbtack — американский вариант"
    dialogue:
      - "Ana: ¿Cómo colgaste el cartel? | Как ты повесил плакат?"
      - "Pablo: Con cuatro chinchetas, una en cada esquina. | Четырьмя кнопками, по одной на каждый угол."
      - "Ana: ¿No estropea la pared? | Это не портит стену?"
      - "Pablo: Un poco, pero deja agujeros pequeños. No son nada comparados con los de un clavo. | Немного, но дырки остаются маленькие. Они пустяк по сравнению с гвоздём."
      - "Ana: ¿Y si se cae? | А если упадёт?"
      - "Pablo: Entonces pegaré cinta adhesiva, por si acaso. | Тогда приклею скотч, на всякий случай."
      - "Ana: Qué práctico eres. Yo me pincho siempre con las chinchetas. | Какой ты практичный. А я вечно колюсь о кнопки."
      - "Pablo: Pues ten cuidado y no te hagas un rasguño. | Тогда будь осторожна и не оцарапайся."
    cefr: "B1."
    frequency: "Нечастое: бытовое слово."
    collocations:
      - "clavar una chincheta — воткнуть кнопку"
      - "tablón con chinchetas — доска с кнопками"
      - "sujetar con chinchetas — прикрепить кнопками"
    collocation_example: "Sujetó el mapa con cuatro chinchetas. — Он прикрепил карту четырьмя кнопками."
    trap: "Не путайте chincheta «кнопка» с chinche «клоп» и chinchar «досаждать». Кнопка на пульте или в одежде — совсем другие слова: botón."

  - word: billetero
    ru: кошелёк (для купюр)
    ipa: /biʎeˈteɾo/
    say: бийэте́ро
    pron: "ll в большинстве регионов — как «й»; в Испании встречается и [ʎ] «льй»."
    meaning: "Небольшой кошелёк или бумажник, в котором носят банкноты и карточки."
    examples:
      - "Se le cayó el billetero en el taxi. — У него выпал кошелёк в такси."
      - "Perdí el billetero en el metro con todos mis documentos y unos cincuenta euros. — Я потерял кошелёк в метро со всеми документами и пятьюдесятью евро."
      - "Saqué el billetero para pagar, pero no encontré la tarjeta, que se me había caído. — Я достал кошелёк, чтобы заплатить, но не нашёл карточку, которая выпала."
    origin: "От billete «банкнота, билет» + суффикс -ero, обозначающий предмет для хранения (как en cenicero «пепельница»). То есть «то, где лежат купюры»."
    register: "Нейтральное; в Испании чаще cartera."
    synonyms:
      - word: cartera
        pair: ["Guardó el dinero en el billetero.", "Guardó el dinero en la cartera."]
        diff:
          - "cartera — самое обычное слово в Испании: бумажник и ещё портфель"
          - "billetero — именно для купюр, чуть реже"
    analogs:
      - "wallet — кошелёк, бумажник"
      - "billfold — американский «бумажник для купюр»"
    dialogue:
      - "Ana: ¿Llevas dinero? | У тебя есть деньги?"
      - "Pablo: Sí, está en el billetero. ¡Un momento! ¿Dónde está? | Да, в кошельке. Минутку! Где он?"
      - "Ana: ¿Lo dejaste en el taxi? | Ты оставил его в такси?"
      - "Pablo: No lo sé. Estoy distraído desde el accidente. | Не знаю. Я рассеян после аварии."
      - "Ana: Llama a la compañía. Quizá lo encontró el conductor. | Позвони в компанию. Может, водитель нашёл."
      - "Pablo: Dentro tenía mi agenda... no, la agenda está aquí. Menos mal. | Там был мой ежедневник... нет, ежедневник здесь. Слава богу."
      - "Ana: ¿Y las tarjetas? Habrá que anularlas por si acaso. | А карты? Придётся заблокировать их на всякий случай."
      - "Pablo: Sí, y cambiar la contraseña del banco. | Да, и сменить пароль в банке."
    cefr: "B1."
    frequency: "Средней частоты: чаще говорят cartera."
    collocations:
      - "sacar el billetero — достать кошелёк"
      - "perder el billetero — потерять кошелёк"
      - "billetero de cuero — кожаный кошелёк"
    collocation_example: "Me robaron el billetero en la plaza. — У меня украли кошелёк на площади."
    trap: "Кошелёк для монет — monedero, а billetero — для купюр. В Мексике и некоторых странах cartera значит «женская сумка»."

  - word: restar importancia a
    ru: преуменьшать значение
    ipa: /resˈtaɾ impoɾˈtanθja a/
    say: рэста́р импорта́нсья а
    pron: "r в начале — раскатистое; c перед i в Испании — [θ]."
    meaning: "Говорить о чём-то серьёзном так, будто это пустяк: «ничего страшного». Часто делают, чтобы успокоить других."
    examples:
      - "No quiso restar importancia al accidente. — Он не захотел преуменьшать значение аварии."
      - "Puede tener consecuencias que ahora no ves, así que no le restes importancia. — У этого могут быть последствия, которых ты сейчас не видишь, так что не преуменьшай этого."
      - "El médico restó importancia al golpe y dijo que con unos días de reposo bastaría. — Врач преуменьшил значение удара и сказал, что хватит нескольких дней покоя."
    origin: "restar «вычитать, отнимать» (из лат. restare «оставаться») + importancia «важность». Дословно «вычесть важность»."
    register: "Нейтральное, чуть формальное; частое в новостях."
    synonyms:
      - word: quitar importancia
        pair: ["Le restó importancia al problema.", "Le quitó importancia al problema."]
        diff:
          - "quitar importancia — проще, разговорное"
          - "restar importancia — чуть литературнее"
    analogs:
      - "to play down — преуменьшать"
      - "to downplay — то же, американское"
    dialogue:
      - "Inspectora: ¿Fue grave el accidente? | Авария была серьёзной?"
      - "Marcos: Él le resta importancia, pero se asustó mucho. | Он преуменьшает значение, но сильно испугался."
      - "Inspectora: A veces la gente finge estar bien para no preocupar. | Иногда люди делают вид, что всё хорошо, чтобы не волновать других."
      - "Marcos: Exacto. Dice que fue un simple choque, pero aún está aturdido. | Именно. Говорит, что это простое столкновение, но всё ещё оглушён."
      - "Inspectora: ¿Y su familia qué opina? | А что думает его семья?"
      - "Marcos: Su mujer no quiere restar importancia a nada. Quiere que se haga todas las pruebas. | Его жена не хочет ничего преуменьшать. Хочет, чтобы он сдал все анализы."
      - "Inspectora: Hace bien. Una hemorragia puede pasar desapercibida. | Правильно делает. Кровотечение можно не заметить."
      - "Marcos: Se lo diré. Seguro que me hará caso. | Передам ему. Уверен, он послушает."
    cefr: "C1."
    frequency: "Частое в новостях и интервью."
    collocations:
      - "restar importancia a un problema — преуменьшать проблему"
      - "no restar importancia — не недооценивать"
      - "restarle importancia al asunto — не придавать делу значения"
    collocation_example: "Quiso restarle importancia al incidente. — Он хотел преуменьшить значение происшествия."
    trap: "Нужен предлог a перед тем, что преуменьшают: restar importancia a algo. Без a — ошибка. Не путайте с sumar importancia, такого выражения нет: противоположное — dar importancia."

  - word: estar hasta los topes de gente
    ru: быть забитым людьми до отказа
    ipa: /esˈtaɾ ˈasta los ˈtopes de ˈxente/
    say: эста́р а́ста лос то́пэс дэ хэ́нтэ
    pron: "h не читается; g перед e — «х»: gente — «хэ́нте»."
    meaning: "О помещении, где так много людей, что некуда встать. Estar hasta los topes — «быть заполненным до предела»."
    examples:
      - "Las urgencias están hasta los topes. — Приёмное отделение переполнено."
      - "A esa hora el autobús estaba hasta los topes de gente. — В это время автобус был забит людьми до отказа."
      - "El tren iba hasta los topes de gente y tuve que viajar de pie las tres horas. — Поезд был забит людьми, и мне пришлось ехать стоя все три часа."
    origin: "tope — «предел, ограничитель» (от topar «упираться»). Estar hasta los topes — «быть заполненным до самого ограничителя»."
    register: "Разговорное."
    synonyms:
      - word: estar lleno hasta arriba
        pair: ["La sala estaba hasta los topes.", "La sala estaba llena hasta arriba."]
        diff:
          - "llena hasta arriba — общее «полный до верха»"
          - "hasta los topes — разговорнее, подчёркивает переполненность"
    analogs:
      - "to be packed — быть набитым"
      - "to be jam-packed — битком"
    dialogue:
      - "Aquella noche, las urgencias estaban hasta los topes de gente. | В ту ночь отделение скорой помощи было забито людьми до отказа."
      - "Había enfermos en las sillas, en los pasillos e incluso en el suelo. | Больные сидели на стульях, в коридорах и даже на полу."
