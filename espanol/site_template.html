/* ================================================================ перевод по нажатию на слово */
const WORD_RE = /(?<![\p{L}\d-])[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]+(?![\p{L}\d-])/gu;
// Фразы курса ищем раньше отдельных слов, самые длинные первыми: «buenos días» — одна фраза.
const PHRASE_ES = new Map((COURSE.phrases || []).map(([ws, es]) => [ws.join(" "), es]));
const PHRASE_RE = PHRASE_ES.size ? new RegExp("(?<![\\p{L}\\d-])(?:" + (COURSE.phrases || [])
  .map(([ws]) => ws.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("[\\s,]+")).join("|") + ")(?![\\p{L}\\d-])", "giu") : null;
// Куски текста: [кусок, слово курса или null].
function lookupParts(text) {
  const parts = []; let last = 0;
  const words = chunk => {
    let at = 0;
    for (const m of chunk.matchAll(WORD_RE)) {
      const es = FORMS[m[0].toLowerCase()];
      if (!es || !WORDS.has(es)) continue;
      parts.push([chunk.slice(at, m.index), null], [m[0], es]); at = m.index + m[0].length;
    }
    parts.push([chunk.slice(at), null]);
  };
  if (PHRASE_RE) for (const m of text.matchAll(PHRASE_RE)) {
    const es = PHRASE_ES.get(m[0].toLowerCase().split(/[\s,]+/).join(" "));
    if (!es || !WORDS.has(es)) continue;
    words(text.slice(last, m.index)); parts.push([m[0], es]); last = m.index + m[0].length;
  }
  words(text.slice(last));
  return parts;
}
function wrapWords(root) {
  if (!root) return;
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
    acceptNode: n => n.parentElement.closest("code, .lw, .play, .btn, .kicker, .lbl, h3, .word, .who, .dlg-head, .dlg-panel, .lplay") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
  for (const node of nodes) {
    const parts = lookupParts(node.nodeValue);
    if (!parts.some(([, es]) => es)) continue;
    const box = document.createElement("span");
    box.innerHTML = parts.map(([t, es]) => es ? `<span class="lw" data-w="${esc(es)}">${esc(t)}</span>` : esc(t)).join("");
    node.replaceWith(...box.childNodes);
  }
}
/* ================================================================ «Я уже учусь в канале» */
// Уроки до выбранного отмечаются пройденными, а их слова встают в повторение не все сразу:
// по 12 слов в день, сначала слова самых свежих уроков. Иначе в первый же день набралось бы несколько сотен.
const JOIN_PER_DAY = 12;
function joinFrom(n) {
  const at = LESSONS.findIndex(L => L.n === n);
  if (at < 1) return { lessons: 0, words: 0 };
  let lessons = 0, queue = [];
  for (let i = 0; i < at; i++) {
    const L = LESSONS[i];
    if (!P.done[L.id]) { P.done[L.id] = { stars: 1, acc: 0, at: dayStr(), joined: true }; lessons++; }
    L.words.filter(w => w.srs && !P.words[w.es]).forEach(w => queue.push(w));
  }
  queue.reverse().forEach((w, k) => { P.words[w.es] = { s: 1, due: dayNum() + 1 + Math.floor(k / JOIN_PER_DAY) }; });
  P.joined = true; save();
  return { lessons, words: queue.length };
}

  if (d.say != null) return say(d.say, { slow: "slow" in d });
  if ("dlgAll" in d) return dlgMain();
  if ("dlgPick" in d) return dlgPick(el.closest("[data-dlg]"));
  if ("dlgTr" in d) return dlgTranslate(el);
  if (d.dlgRate) return dlgSetRate(+d.dlgRate);
  if (d.line != null) return dlgSolo(el.closest("[data-dlg]"), +d.line);
  if ("toggleTr" in d) {
    const box = el.closest("[data-dlg]"), hidden = box.querySelector("[data-hidden-text]");
    if (hidden && hidden.hidden) { hidden.hidden = false; el.textContent = "Перевод"; return; }
    el.setAttribute("aria-pressed", box.classList.contains("hide-tr"));
    box.classList.toggle("hide-tr"); return;
  }
  if (d.level) { view.level = d.level; view.tab = "course"; render(); window.scrollTo(0, 0); return; }
  if (d.video) { view.video = d.video; view.tab = "video"; render(); window.scrollTo(0, 0); return; }
  if (d.tab) { if (d.tab === "course") view.level = null; if (d.tab === "grammar") view.grammar = null; view.tab = d.tab; view.confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (d.lesson != null) {
    const i = +d.lesson;
    if (unitClosed(i)) return toast("Эта тема скоро откроется");
    if (!isOpen(i) && !("free" in d)) return toast(`Сначала пройдите урок ${LESSONS[i - 1].n}`);
    return startLesson(i);
  }
  if (d.review) {
    const all = Object.keys(P.words).filter(es => WORDS.has(es)).map(es => WORDS.get(es));
    return startReview(d.review === "due" ? dueWords() : d.review === "weak" ? all.filter(w => (P.words[w.es].s || 0) <= 1) : all);
  }
  if ("home" in d) { S = null; view.tab = "course"; view.level = null; render(); const c = $(`#unit-${LESSONS[currentIndex()].unit}`); if (c) c.scrollIntoView({ block: "start" }); return; }
  if ("quit" in d) { clearTimeout(autoTimer); stopSpeech(); S = null; render(); return; }
  if (d.goal) { P.goal = +d.goal; save(); render(); return; }
  if ("sync" in d) { push(true).then(() => toast("Сохранено")); return; }
  if ("logout" in d) { logout("Вы вышли, прогресс остался в этом браузере"); render(); return; }
  if ("autoDlg" in d) { P.autoDlg = P.autoDlg === false; save(); render(); return; }
  if ("sound" in d) { P.sound = P.sound === false; save(); render(); if (P.sound) sfx(true); return; }
  if ("openall" in d) { P.openAll = !P.openAll; save(); render(); return; }
  if (d.reset) {
    if (d.reset === "ask") view.confirmReset = true;
    else { if (d.reset === "yes") { P = fresh(); grammarAttempts.clear(); grammarDrafts.clear(); store.set(G_SESSION_KEY, ""); store.set(G_ATTEMPTS_KEY, ""); save(); toast("Прогресс сброшен"); } view.confirmReset = false; }
    return render();
  }
  if (!S || S.kind === "result") return;
  if ("prev" in d) return prev();
  const st = S.steps[S.at], s = S.state;
  if (d.opt != null && !s.result) { s.pick = +d.opt; return answer(s.pick === st.correct, st); }
  if (d.pick != null && !s.result) return buildPick(+d.pick);
  if ("hint" in d && !s.result) return hint();
  if ("primary" in d || "next" in d) return primary();
});
document.addEventListener("input", e => {
  if (e.target.dataset.ggap != null && G) {
    const response = gResponse(G.steps[G.at]);
    if (!response.checked) {
      response.gapValues = [...document.querySelectorAll('[data-ggap]')].map(input=>input.value.trim());
      response.value = response.gapValues.every(Boolean) ? response.gapValues.join(' ') : '';
      gSave(); const check = $('[data-gcheck]'); if(check) check.disabled = !response.value;
    }
    return;
  }
  if (e.target.id === "g-answer" && G) {
    const response = gResponse(G.steps[G.at]);
    if (!response.checked) { response.value = e.target.value; gSave(); const check = $("[data-gcheck]"); if (check) check.disabled = !response.value.trim(); document.querySelector('[data-gno-article]')?.setAttribute('aria-pressed',String(grammarNormalize(response.value)==='без артикля')); }
    return;
  }
  const grammarForm = e.target.closest("[data-grammar-form]");
  if (grammarForm) {
    const key = `${view.grammar}/${grammarForm.dataset.grammarForm}`, values = grammarDrafts.get(key) || [];
    if (/^q\d+$/.test(e.target.name)) { values[+e.target.name.slice(1)] = e.target.value; grammarDrafts.set(key, values); }
    return;
  }
  if (e.target.id === "letter") { const v = e.target.value; e.target.value = ""; return mfLetter(v.slice(-1)); }
  if (e.target.id === "wsearch") {
    view.q = e.target.value; const pos = e.target.selectionStart; render();
    const f = $("#wsearch"); f.focus(); f.setSelectionRange(pos, pos);
  }
});
document.addEventListener("focusout", () => { if(G) setTimeout(gSyncViewport,0); });
document.addEventListener("focusin", e => { if(G) { gSyncViewport(); setTimeout(gSyncViewport,0); } if(G && e.target.dataset?.ggap != null) G.gapIndex = +e.target.dataset.ggap; });
document.addEventListener("keydown", e => {
  if (document.querySelector('#g-art-modal[open]')) return;
  if (e.key === "Escape") closeSheet();
  if (G && !G.ended) {
    if(e.key === 'Enter' && e.target.dataset?.ggap === '0' && !e.shiftKey) { e.preventDefault(); $('[data-ggap="1"]')?.focus(); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.target.closest("summary,button")) { e.preventDefault(); const s = G.steps[G.at]; return s.type === "question" && !gResponse(s).checked ? gCheck() : gMove(1); }
    if (!["INPUT","TEXTAREA"].includes(e.target.tagName) && /^[1-9]$/.test(e.key)) { const option = $(`[data-gposition="${+e.key - 1}"]`); if (option && !option.disabled) option.click(); }
    return;
  }
  if (!S || S.kind === "result") return;
  const st = S.steps[S.at], s = S.state;
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const btn = $("[data-primary], [data-next]"); if (btn && !btn.disabled) primary();
    return;
  }
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (st.type === "mc" && !s.result && /^[1-9]$/.test(e.key) && +e.key <= st.options.length) { s.pick = +e.key - 1; answer(s.pick === st.correct, st); }
});

document.addEventListener("toggle", e => {
  if (G && e.target.classList?.contains("gplay-family")) { G.treeOpen = e.target.open; gSave(); }
}, true);
render();
</script>
