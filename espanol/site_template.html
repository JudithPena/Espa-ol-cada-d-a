<title>Español cada día</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;600;700&display=swap">
<style>
/* Макет: одна колонка для телефона; карта тем — дорожка уроков под плиткой-азулехо;
   урок — экран за экраном с панелью ответа внизу, как в Busuu. */
:root {
  --bg: #f4f6fb;
  --surface: #ffffff;
  --sunken: #e9edf6;
  --ink: #18203d;
  --muted: #5b6585;
  --line: #d9dfec;
  --accent: #2346c4;        /* кобальт азулехо */
  --accent-soft: #e3e9ff;
  --on-accent: #ffffff;
  --sun: #e59a0c;           /* шафран: опыт, серия дней */
  --sun-soft: #fff1d3;
  --good: #158a5c;
  --good-soft: #dcf5e9;
  --bad: #c9392f;
  --bad-soft: #fde4e1;
  --tile-a: #2346c4;
  --tile-b: #f0f3ff;
  --shadow: 0 1px 2px rgb(24 32 61 / .06), 0 4px 14px rgb(24 32 61 / .06);
  --display: "Unbounded", "Segoe UI", system-ui, sans-serif;
  --body: "Manrope", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1225; --surface: #171d35; --sunken: #20284a; --ink: #e8ecfa; --muted: #9ba5c8;
    --line: #2b3458; --accent: #8aa2ff; --accent-soft: #232e5c; --on-accent: #0e1225;
    --sun: #ffbe3b; --sun-soft: #3a2f14; --good: #3fcf90; --good-soft: #123a2a;
    --bad: #ff7a6e; --bad-soft: #43201d; --tile-a: #5c78f0; --tile-b: #1b2242;
    --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1225; --surface: #171d35; --sunken: #20284a; --ink: #e8ecfa; --muted: #9ba5c8;
  --line: #2b3458; --accent: #8aa2ff; --accent-soft: #232e5c; --on-accent: #0e1225;
  --sun: #ffbe3b; --sun-soft: #3a2f14; --good: #3fcf90; --good-soft: #123a2a;
  --bad: #ff7a6e; --bad-soft: #43201d; --tile-a: #5c78f0; --tile-b: #1b2242;
  --shadow: 0 1px 2px rgb(0 0 0 / .3); color-scheme: dark;
}

html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 500 16px/1.55 var(--body); -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; line-height: 1.2; text-wrap: balance; margin: 0; }
b, strong { font-weight: 800; }
code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .9em; background: var(--sunken); padding: 0 .3em; border-radius: 5px; }
a { color: var(--accent); }
.wrap { max-width: 640px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.muted { color: var(--muted); }
.levels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 10px; }
.lvl { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 8px 12px; display: grid; gap: 4px; justify-items: center; text-align: center; color: var(--ink); box-shadow: var(--shadow); }
.lvl b { font-family: var(--display); font-size: 28px; line-height: 1; color: var(--accent); }
.lvl small { color: var(--muted); font-size: 12px; font-weight: 700; }
.lvl .bar { width: 100%; margin-top: 4px; }
.lvl.soon { background: var(--sunken); box-shadow: none; opacity: .75; }
.lvl.soon b { color: var(--muted); }
.menu { display: grid; gap: 10px; margin-top: 10px; }
.mcard { display: grid; grid-template-columns: auto 1fr auto; gap: 14px; align-items: center; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; color: var(--ink); box-shadow: var(--shadow); width: 100%; }
.mcard .mi { font-size: 34px; line-height: 1; }
.mcard b { display: block; font-size: 17px; }
.mcard small { color: var(--muted); font-size: 14px; }
.sech { margin: 22px 0 0; font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.back { margin-bottom: 12px; }
.tag { display: inline-block; vertical-align: 2px; margin-left: 6px; padding: 2px 8px; border-radius: 99px; background: var(--sun-soft); color: var(--ink); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; }
.wip { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; margin: 12px 0 4px; padding: 14px 16px; border-radius: 16px; background: var(--sun-soft); border: 1px dashed var(--sun); }
.wip .wi { font-size: 28px; line-height: 1; }
.wip b { display: block; font-size: 16px; }
.wip small { color: var(--muted); font-size: 14px; display: block; margin-top: 2px; }
h2 + .btn.wide, h2 + .muted { margin-top: 10px; display: flex; }
.vseg { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px 16px; display: grid; gap: 10px; margin-top: 12px; }
.vseg .es { font-size: 17px; font-weight: 600; }
.vseg details { background: var(--sunken); border-radius: 10px; padding: 8px 12px; }
.vseg summary { cursor: pointer; font-weight: 700; color: var(--accent); }
.vseg ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 4px; font-size: 15px; }
.book-block { line-height: 1.65; }
.book-block p { white-space: pre-line; }
.book-term-link { display: inline; border: 0; border-radius: 5px; padding: 3px 2px; margin: -3px -2px; background: transparent; color: inherit; font: inherit; line-height: inherit; text-align: inherit; vertical-align: baseline; touch-action: manipulation; }
.book-term-link:hover, .book-note-index:hover { background: var(--accent-soft); }
.book-term-link:focus-visible, .book-note-index:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.book-number { position: relative; top: -.1em; color: var(--accent); font-size: .68em; font-weight: 800; padding-left: .12em; line-height: 0; }
.book-note-item { padding: 4px 5px; margin-left: -5px; border-radius: 8px; }
.book-note-item:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.book-note-index { display: inline-block; min-width: 28px; min-height: 28px; border: 0; border-radius: 7px; padding: 2px 5px; margin: -3px 5px -3px -4px; vertical-align: baseline; background: transparent; color: var(--accent); font: 800 .87em/1.4 var(--body); text-align: center; touch-action: manipulation; }
.book-jump-highlight { animation: book-jump-highlight 1.7s ease-out; }
@keyframes book-jump-highlight { 0%, 25% { background: var(--accent-soft); box-shadow: 0 0 0 3px var(--accent-soft); } 100% { background: transparent; box-shadow: none; } }
@media (prefers-reduced-motion: reduce) { .book-jump-highlight { animation: none; background: var(--accent-soft); } }
.book-part { display: block; font-size: 13px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.book-figure { margin: 14px 0; }
.book-figure img { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 12px; }
.book-block ul { list-style: disc; padding-left: 1.3em; }
.book-pronouns summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; list-style: none; }
.book-pronouns summary::-webkit-details-marker { display: none; }
.book-pronouns summary::after { content: '›'; flex: none; font-size: 22px; line-height: 1; transform: rotate(90deg); }
.book-pronouns[open] summary::after { transform: rotate(-90deg); }
.book-pronoun-list { margin-top: 10px; }
.book-pronoun-item + .book-pronoun-item { border-top: 1px solid var(--line); margin-top: 10px; padding-top: 10px; }
.book-pronoun-item p { margin: 4px 0 0; overflow-wrap: anywhere; }
.book-exercise { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; margin-top: 12px; padding: 16px; }
.book-question { border: 0; padding: 0; margin: 16px 0; min-width: 0; }
.book-question legend { font-weight: 700; margin-bottom: 8px; }
.book-reflection { box-sizing: border-box; width: 100%; min-height: 110px; padding: 10px; margin: 8px 0; border: 1px solid var(--line); border-radius: 10px; font: inherit; resize: vertical; }
.book-choices { display: grid; gap: 8px; }
.book-choices button { text-align: left; white-space: normal; }
.book-feedback { min-height: 1.5em; margin-top: 6px; color: var(--muted); }
.book-tabs { display: flex; gap: 8px; margin: 16px 0; }
.book-tabs .btn { flex: 1; min-height: 46px; }
.book-tabs .btn[aria-selected="true"] { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
.book-panel[hidden] { display: none !important; }
.book-choices .btn { border: 2px solid var(--line); background: var(--surface); color: var(--ink); min-height: 48px; justify-content: space-between; }
.book-choices .btn[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.book-choices .btn.book-correct { border-color: #237445; background: #e6f5eb; color: #15522e; }
.book-choices .btn.book-incorrect { border-color: #b32636; background: #fff0f1; color: #85202b; }
.book-choice-status { font-size: 13px; flex-shrink: 0; }
.book-tabs button:focus-visible, .book-exercise button:focus-visible, .book-reflection:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.book-exercise .book-check { margin-top: 10px; }
.book-feedback[data-result="correct"] { color: #15522e; }
.book-feedback[data-result="incorrect"] { color: #85202b; }

.mcard.book-chapter-card { grid-template-columns: 40px minmax(0, 1fr) 40px; gap: 10px; min-height: 76px; }
.book-chapter-card .mi { text-align: center; font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; font-size: 30px; }
.book-chapter-label { min-width: 0; text-align: center; overflow-wrap: anywhere; }
.book-chapter-arrow { text-align: right; font-size: 24px; }
.book-chapter-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.mcard.book-chapter-card:disabled { opacity: 1; cursor: default; color: var(--muted); background: var(--bg); border-color: var(--line); box-shadow: none; transform: none; }
.book-chapter-soon { display: block; margin-top: 6px; font-size: 13px; font-weight: 400; }
.book-overview { margin: 24px 0 28px; text-align: center; }
.book-intro { display: grid; gap: 18px; justify-items: center; align-items: center; }
.book-intro-copy { min-width: 0; overflow-wrap: anywhere; }
.book-cover-large { display: block; width: min(230px, 100%); height: auto; aspect-ratio: 2 / 3; object-fit: contain; margin: 0; border-radius: 10px; box-shadow: 0 10px 28px #15244326; }
.book-overview h2 { overflow-wrap: anywhere; }
.book-overview p { margin: 10px 0 0; }
.book-overview .muted { display: block; }
.book-overview .book-annotation { color: var(--ink); font-size: 14px; font-weight: 500; line-height: 1.7; margin-top: 16px; text-wrap: pretty; }
@media (min-width: 530px) {
  .book-intro:has(.book-cover-large) { grid-template-columns: minmax(0, 220px) minmax(0, 1fr); justify-items: stretch; gap: 24px; text-align: left; }
  .book-intro:has(.book-cover-large) .book-cover-large { width: 100%; }
}
.book-series { margin: 20px 0; }
.book-series-list { display: grid; gap: 8px; margin-top: 12px; }
.book-series-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--ink); text-align: left; font: inherit; }
button.book-series-item { cursor: pointer; }
button.book-series-item:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.book-series-item span { min-width: 0; overflow-wrap: anywhere; }
.book-series-item small { flex: none; color: var(--accent); font-weight: 700; }
.book-series-item[aria-current="page"] { background: var(--accent-soft); border-color: var(--accent); }
.mcard.book-card { grid-template-columns: 80px minmax(0, 1fr) 18px; }
.book-card > span { min-width: 0; }
.book-card small { display: block; margin-top: 6px; line-height: 1.45; }
.book-cover { width: 80px; height: 120px; object-fit: contain; border-radius: 6px; flex: none; box-shadow: 0 3px 10px #15244318; }
.vseg .nt { font-size: 14px; color: var(--muted); }
.es { font-weight: 700; }

/* ---------- верхняя панель */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { background: none; border: 0; padding: 0; margin: 0; color: inherit; text-align: left; cursor: pointer; font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .01em; flex: 1; min-width: 0; line-height: 1.2; }
.brand span { color: var(--accent); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-weight: 800; font-variant-numeric: tabular-nums; font-size: 14px; padding: 4px 10px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); }
.chip.fire { color: var(--sun); }
.chip.off { color: var(--muted); }
.ring { width: 30px; height: 30px; flex: none; }
.ring circle { fill: none; stroke-width: 4; }
.ring .bgc { stroke: var(--line); }
.ring .fg { stroke: var(--sun); stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dasharray .4s; }

/* ---------- нижние вкладки */
main { padding-block: 16px 110px; }
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs .wrap { display: grid; grid-template-columns: repeat(5, 1fr); }
.tab { background: none; border: 0; padding: 8px 0 10px; display: grid; justify-items: center; gap: 2px; font-size: 12px; font-weight: 700; color: var(--muted); position: relative; }
.tab .ico { font-size: 20px; line-height: 1.2; filter: grayscale(1); opacity: .7; }
.tab[aria-current="page"] { color: var(--accent); }
.tab[aria-current="page"] .ico { filter: none; opacity: 1; }
.badge { position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--bad); color: #fff; font-size: 11px; line-height: 18px; text-align: center; }

/* ---------- кнопки */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 13px 20px; font-weight: 800; font-size: 16px; background: var(--accent); color: var(--on-accent); box-shadow: 0 3px 0 rgb(0 0 0 / .18); transition: transform .08s; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 rgb(0 0 0 / .18); }
.btn[disabled] { background: var(--sunken); color: var(--muted); box-shadow: none; cursor: default; }
.btn.wide { width: 100%; }
.btn.sm { padding: 6px 12px; font-size: 14px; border-radius: 10px; }
.btn.ghost { background: var(--surface); color: var(--ink); border: 1px solid var(--line); box-shadow: none; }
.btn.good { background: var(--good); color: var(--on-accent); }
.btn.bad { background: var(--bad); color: var(--on-accent); }
.play { flex: none; width: 38px; height: 38px; border-radius: 50%; border: 0; background: var(--accent-soft); color: var(--accent); display: inline-grid; place-items: center; font-size: 16px; }
.play.big { width: 72px; height: 72px; font-size: 28px; }
.play.slow { width: 38px; height: 38px; font-size: 15px; }
.no-tts .play { display: none; }

/* ---------- главная: «продолжить» */
.hero { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.hero .eyebrow { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.hero h2 { font-size: 20px; }
.hero .meta { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px; color: var(--muted); }
.level-bar { display: grid; gap: 6px; }
.level-bar .lb { display: flex; justify-content: space-between; font-size: 13px; font-weight: 700; color: var(--muted); }
.bar { height: 10px; border-radius: 6px; background: var(--sunken); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); border-radius: 6px; transition: width .4s; }
.bar.sun i { background: var(--sun); }
.notice { margin-top: 12px; display: flex; gap: 12px; align-items: center; padding: 12px 14px; border-radius: var(--r); background: var(--sun-soft); font-weight: 600; font-size: 15px; }
.notice .btn { padding: 8px 14px; font-size: 14px; margin-left: auto; flex: none; }

/* ---------- карта курса */
.unit { margin-top: 28px; }
.unit-head { position: relative; overflow: hidden; border-radius: 18px; padding: 16px 18px 16px 92px; min-height: 92px; background: var(--surface); border: 1px solid var(--line); display: grid; align-content: center; gap: 4px; }
.tile { position: absolute; left: 0; top: 0; bottom: 0; width: 76px;
  background:
    radial-gradient(circle at 50% 50%, var(--tile-b) 0 7px, transparent 8px),
    radial-gradient(circle at 0 0, var(--tile-a) 0 13px, transparent 14px),
    radial-gradient(circle at 100% 0, var(--tile-a) 0 13px, transparent 14px),
    radial-gradient(circle at 0 100%, var(--tile-a) 0 13px, transparent 14px),
    radial-gradient(circle at 100% 100%, var(--tile-a) 0 13px, transparent 14px),
    conic-gradient(from 45deg, var(--tile-a) 0 25%, var(--tile-b) 0 50%, var(--tile-a) 0 75%, var(--tile-b) 0);
  background-size: 38px 38px; opacity: .9; }
.unit.locked .tile { filter: grayscale(1); opacity: .35; }
.unit-head .num { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.unit-head h3 { font-size: 17px; }
.unit-head .prog { font-size: 13px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.goals { margin: 10px 4px 0; padding: 0; list-style: none; font-size: 14px; color: var(--muted); display: grid; gap: 2px; }
.goals li::before { content: "→ "; color: var(--accent); font-weight: 800; }
.path { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 0; }
.step { position: relative; display: grid; grid-template-columns: 52px 1fr auto; align-items: center; gap: 12px; padding: 8px 6px; border-radius: var(--r); background: none; border: 0; width: 100%; text-align: left; }
.step:not(:last-child)::after { content: ""; position: absolute; left: 31px; top: 56px; bottom: -8px; width: 3px; border-radius: 2px; background: var(--line); }
.step.done:not(:last-child)::after { background: var(--accent); }
.node { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; font-size: 22px; background: var(--sunken); border: 3px solid var(--line); position: relative; z-index: 1; }
.step.done .node { background: var(--accent-soft); border-color: var(--accent); }
.step.current .node { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 6px var(--accent-soft); }
.step.locked .node { filter: grayscale(1); opacity: .5; }
.step .t { min-width: 0; }
.step .t b { display: block; font-weight: 700; font-size: 15px; line-height: 1.3; }
.step.locked .t b { color: var(--muted); }
.step .t small { color: var(--muted); font-size: 13px; font-weight: 600; }
.step .stars { font-size: 13px; color: var(--sun); letter-spacing: 1px; white-space: nowrap; }
.step .go { font-size: 13px; font-weight: 800; color: var(--on-accent); background: var(--accent); padding: 6px 12px; border-radius: 99px; }
.step:hover:not(.locked) { background: var(--surface); }

/* ---------- вкладки: повторение, слова, прогресс */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: grid; gap: 12px; }
.panel + .panel { margin-top: 14px; }
.panel h2 { font-size: 18px; }
.big-num { font-family: var(--display); font-size: 40px; font-weight: 700; line-height: 1; color: var(--accent); font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--sunken); border-radius: var(--r); padding: 12px 14px; }
.stat b { display: block; font-family: var(--display); font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 13px; color: var(--muted); font-weight: 600; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; align-items: end; height: 120px; }
.week .col { display: grid; gap: 4px; justify-items: center; align-self: stretch; grid-template-rows: 1fr auto auto; }
.week .col i { width: 100%; max-width: 30px; align-self: end; border-radius: 6px 6px 2px 2px; background: var(--sun); min-height: 3px; }
.week .col.zero i { background: var(--line); }
.week .col span { font-size: 11px; color: var(--muted); font-weight: 700; font-variant-numeric: tabular-nums; }
.search { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font: inherit; color: var(--ink); }
.wordlist { list-style: none; margin: 0; padding: 0; display: grid; }
.wordlist li { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
.wordlist li:last-child { border-bottom: 0; }
.wordlist .w { min-width: 0; }
.wordlist .w .es { display: block; }
.wordlist .w small { color: var(--muted); }
.strength { display: flex; gap: 3px; }
.strength i { width: 7px; height: 16px; border-radius: 2px; background: var(--line); }
.strength i.on { background: var(--good); }
.settings { display: grid; gap: 10px; }
.row { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-weight: 700; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.switch { width: 46px; height: 28px; border-radius: 14px; border: 0; background: var(--line); position: relative; flex: none; }
.switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: var(--surface); transition: left .15s; }
.switch[aria-pressed="true"] { background: var(--accent); }
.switch[aria-pressed="true"]::after { left: 21px; }
.empty { text-align: center; padding: 26px 10px; color: var(--muted); display: grid; gap: 10px; justify-items: center; }
.empty .e { font-size: 40px; }

/* ---------- урок */
.player { position: fixed; inset: 0; z-index: 6; background: var(--bg); padding-top: env(safe-area-inset-top, 0px); display: grid; grid-template-rows: auto 1fr auto; }
.ptop .wrap { display: flex; align-items: center; gap: 14px; padding-block: 12px; }
.x { border: 0; background: none; font-size: 26px; line-height: 1; color: var(--muted); padding: 4px; }
.x.prev { font-size: 22px; margin-left: -6px; }
.ptop .bar { flex: 1; height: 14px; border-radius: 8px; }
.ptop .bar i { background: var(--good); }
.pcount { font-size: 13px; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.pbody { overflow-y: auto; -webkit-overflow-scrolling: touch; }
.pbody .wrap { padding-block: 10px 28px; display: grid; gap: 16px; align-content: start; }
.kicker { font-size: 13px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
.pbody h2 { font-size: 22px; }
.pfoot { border-top: 1px solid var(--line); background: var(--surface); padding-bottom: env(safe-area-inset-bottom, 0px); }
.pfoot .wrap { padding-block: 14px; display: grid; gap: 12px; }
.pfoot.good { background: var(--good-soft); border-color: transparent; }
.pfoot.bad { background: var(--bad-soft); border-color: transparent; }
.fb { display: grid; gap: 4px; }
.fb h3 { font-size: 18px; }
.pfoot.good .fb h3 { color: var(--good); }
.pfoot.bad .fb h3 { color: var(--bad); }
.fb .ans { font-weight: 700; }
.fb .ex { font-size: 14px; color: var(--muted); }
.gerror-analysis { margin-top: 24px; padding: 20px; border: 1px solid var(--line); border-radius: 18px; background: var(--surface); overflow-wrap: anywhere; }
.gerror-item + .gerror-item { border-top: 1px solid var(--line); margin-top: 24px; padding-top: 8px; }
.gerror-analysis h3 { color: var(--bad); margin-top: 0; }
.gerror-analysis h4 { margin: 20px 0 8px; }
.gerror-entered { padding: 12px; background: var(--bad-soft); border-radius: 10px; white-space: pre-wrap; }
.gerror-answers { padding-left: 22px; color: var(--good); }
.gerror-answers li { padding: 4px 0; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

/* карточка слова */
/* Композиция по типу слова (ТЗ автора 5 ноября): предмет или человек с картинкой — картинка 96 px рядом со словом;
   действие и выражение с картинкой — картинка крупнее, над словом; без картинки — значок слева. */
.wcard { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; display: grid; gap: 12px; box-shadow: var(--shadow); }
.whead { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; }
.wcard.big .whead { grid-template-columns: minmax(0, 1fr); }
.wcard .emo { font-size: 42px; line-height: 1; width: 56px; text-align: center; }
.wcard .wpic { width: 96px; height: 96px; border-radius: 16px; background: #f9f4ea; object-fit: cover; display: block; }
.wcard.big .pic { max-width: 180px; }
.wbody { display: grid; gap: 2px; min-width: 0; }
.wcard .word.long { font-size: 21px; }
.aud { display: flex; gap: 6px; flex-wrap: wrap; margin-top: -2px; }
.aud button { height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--accent-soft); color: var(--accent); font: 800 13px var(--body); }
.no-tts .aud { display: none; }
.wcard .more { font-size: 15px; color: var(--muted); }
.wcard .more summary { cursor: pointer; font-weight: 800; font-size: 13px; list-style: none; display: inline-flex; gap: 6px; align-items: center; padding: 4px 0; }
.wcard .more summary::-webkit-details-marker { display: none; }
.wcard .more summary::before { content: "ⓘ"; font-size: 15px; }
.wcard .more[open] summary { color: var(--ink); }
.wcard .more p { margin: 6px 0 0; color: var(--ink); }
.wcard .more p b { color: var(--muted); font-weight: 800; }
.pic { display: block; width: 100%; max-width: 220px; aspect-ratio: 1; margin: 0 auto; border-radius: 18px; background: #f9f4ea; }
.sheet .pic { max-width: 150px; }
.wcard .word { font-family: var(--display); font-size: 26px; font-weight: 600; line-height: 1.15; overflow-wrap: break-word; text-wrap: balance; }
.wcard .pron { color: var(--muted); font-size: 15px; font-weight: 600; }
.wcard .tr { font-size: 19px; font-weight: 700; padding-top: 12px; border-top: 1px dashed var(--line); }
.wcard .sec { font-size: 15px; display: grid; gap: 4px; }
.wcard .sec > b { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.wcard .trap { background: var(--sun-soft); padding: 10px 12px; border-radius: 10px; }
.exl { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.exl li { display: grid; grid-template-columns: auto 1fr; gap: 10px; align-items: center; }
.exl .play { width: 30px; height: 30px; font-size: 12px; }
.exl small { display: block; color: var(--muted); font-size: 14px; }

/* теория */
.theory { display: grid; gap: 14px; font-size: 16px; }
.theory p { margin: 0; }
.theory h3 { font-size: 18px; margin-top: 6px; }
.box { border-radius: var(--r); padding: 12px 14px; background: var(--surface); border: 1px solid var(--line); }
.box > .lbl { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 4px; color: var(--muted); }
.box.rule { background: var(--accent-soft); border-color: transparent; }
.box.rule > .lbl { color: var(--accent); }
.box.tip, .box.culture { background: var(--sun-soft); border-color: transparent; }
.box.latam { border-style: dashed; }
.theory code { font-size: 1.05em; font-weight: 800; background: var(--accent-soft); color: var(--accent); padding: .05em .45em; border-radius: 7px; }
.theory ol.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: st; }
.theory ol.steps li { counter-increment: st; background: var(--surface); border-radius: 12px; padding: 9px 12px 9px 44px; position: relative; display: grid; gap: 6px; }
.theory ol.steps li::before { content: counter(st); position: absolute; left: 12px; top: 10px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-weight: 800; font-size: 13px; display: grid; place-items: center; }
.exs { display: flex; flex-wrap: wrap; gap: 8px; }
.exw.wide { justify-items: start; text-align: left; }
.theory .lead { font-size: 19px; font-weight: 700; line-height: 1.35; margin: 2px 2px 2px; }
.pair .pw.long { font-size: 20px; text-align: center; }
.pair .pn { font-size: 12.5px; text-align: center; }
.cmp { display: grid; gap: 10px; }
.cmp h4 { margin: 4px 0 0; font-size: 17px; }
.cmp-lead, .cmp-note { margin: 0; color: var(--muted); font-size: 15px; }
.cmp-row { display: grid; gap: 10px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cmp-row.n1 { grid-template-columns: 1fr; }
.cmp.small .cmp-row.n3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.cmp-card { display: grid; gap: 6px; align-content: start; padding: 12px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.cmp-card.blue { background: var(--accent-soft); box-shadow: none; }
.cmp-card.sun { background: var(--sun-soft); box-shadow: none; }
.cmp-card.mint { background: var(--good-soft); box-shadow: none; }
.cmp-card.rose { background: var(--bad-soft); box-shadow: none; }
.cmp-card.gray { background: var(--sunken); box-shadow: none; }
.cmp-head { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.15; color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.cmp-label { font-size: 15px; }
.cmp-text { font-size: 14.5px; line-height: 1.4; }
.cmp.big .cmp-row.n1 .cmp-head { font-size: 28px; }
.cmp-head { overflow-wrap: anywhere; }
.cmp.big .cmp-row:not(.n1) .cmp-head.long { font-size: 19px; }
.cmp .exs { gap: 6px; }
.cmp .exw { font-size: 15px; padding: 3px 8px; }
.cmp.small .cmp-card { justify-items: center; text-align: center; padding: 10px 6px; gap: 2px; background: var(--sunken); box-shadow: none; }
.cmp.small .cmp-head { font-size: 24px; text-align: center; }
.cmp.small .cmp-head.long { font-size: 18px; }
/* Карточки с примерами на телефоне — друг под другом во всю ширину, иначе фразы ломаются по слову в строке. */
@media (max-width: 560px) { .cmp.big .cmp-row.hasex { grid-template-columns: 1fr; } }
.cmp.small .cmp-label { font-weight: 500; color: var(--muted); }
.tline { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; position: relative; }
.tline li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; position: relative; padding-bottom: 14px; }
.tline li:not(:last-child)::before { content: ""; position: absolute; left: 21px; top: 44px; bottom: 0; width: 2px; background: var(--line); }
.tline .ti { width: 44px; height: 44px; border-radius: 50%; background: var(--accent-soft); display: grid; place-items: center; font-size: 22px; }
.tline li.noicon .ti { width: 12px; height: 12px; margin: 8px 16px; background: var(--accent); }
.tline .tb { display: grid; gap: 8px; padding: 9px 12px; background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.exw { font-family: var(--display); font-weight: 600; font-size: 17px; padding: 3px 10px; border-radius: 9px; background: var(--sunken); color: var(--ink); border: 0; cursor: pointer; }
.exw b { color: var(--accent); background: var(--accent-soft); border-radius: 5px; padding: 0 3px; }
.rowpic { display: block; width: 64px; height: 64px; object-fit: contain; border-radius: 12px; margin-bottom: 6px; background: #fff; }
.cards { display: grid; gap: 10px; }
.cardsbox { display: grid; gap: 8px; }
.cardsbox > .lbl { font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.cardsbox.tip .sent { background: var(--sun-soft); box-shadow: none; }
.pairs { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pair { display: grid; justify-items: center; gap: 2px; padding: 12px 8px; border-radius: 12px; border: 0; background: var(--sunken); color: var(--ink); cursor: pointer; }
.pair .pw { font-family: var(--display); font-weight: 700; font-size: 26px; color: var(--accent); }
.pair small { font-size: 13px; color: var(--muted); }
.pair .pr { font-weight: 800; font-size: 17px; }
.leadin .sent { font-size: 18px; padding: 16px 18px; background: var(--accent-soft); box-shadow: none; }
.sent { padding: 11px 14px; background: var(--surface); border-radius: 12px; display: grid; gap: 8px; box-shadow: var(--shadow); }
.sent.key { background: var(--accent-soft); box-shadow: none; }
.sent.key b { color: var(--accent); }
.sent code { font-size: 1.25em; }
.exw { display: inline-grid; justify-items: center; line-height: 1.25; }
.exw small { font-family: var(--body); font-size: 13px; font-weight: 500; color: var(--muted); }
.theory ul { margin: 0; padding-left: 20px; display: grid; gap: 6px; }
.cando { list-style: none; padding: 0 !important; }
.cando li::before { content: "✓ "; color: var(--good); font-weight: 800; }
.tbl { overflow-x: auto; }
.tbl table { border-collapse: collapse; width: 100%; font-size: 15px; background: var(--surface); border-radius: 12px; overflow: hidden; }
.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl th { text-align: left; padding: 9px 12px; vertical-align: top; background: var(--accent-soft); }
.tbl tr:last-child td { border-bottom: 0; }
.tbl caption { text-align: left; font-weight: 800; padding-bottom: 6px; }
/* диалог: реплики-сообщения без аватаров, ▶ внутри реплики; над диалогами экрана — одна общая панель */
.dlg-panel { position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 8px; padding: 2px 0; background: var(--bg); }
.dlg-panel button { height: 36px; border-radius: 18px; font: 800 14px var(--body); }
.dlg-play { border: 0; padding: 0 14px; background: var(--accent-soft); color: var(--accent); }
.dlg-play.on { background: var(--accent); color: var(--on-accent); }
.dlg-speed { display: inline-flex; border: 1px solid var(--line); border-radius: 18px; overflow: hidden; background: var(--surface); }
.dlg-speed button { border: 0; border-radius: 0; background: none; color: var(--muted); padding: 0 10px; font-size: 13px; }
.dlg-speed button[aria-pressed="true"] { background: var(--sunken); color: var(--ink); }
.dlg-tr { margin-left: auto; border: 1px solid var(--line); padding: 0 12px; background: var(--surface); color: var(--ink); }
.dlg-tr[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.dlg { display: grid; gap: 4px; border-radius: 14px; }
.theory.multi .dlg { padding: 4px 8px 8px; border: 2px solid transparent; }
.theory.multi .dlg.sel { border-color: var(--accent); background: var(--surface); }
.dlg-head { display: flex; align-items: baseline; gap: 8px; border: 0; background: none; padding: 0; color: var(--ink); text-align: left; }
.dlg-head .ttl { font-weight: 800; font-size: 15px; }
.theory.multi .dlg:not(.sel) .dlg-head .ttl { color: var(--muted); }
.theory.multi .dlg:not(.sel) .dlg-head .ttl::after { content: " · выбрать"; font-weight: 600; font-size: 13px; }
.dlg-now { font-size: 13px; font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.dlg [hidden] { display: none; }   /* иначе display: grid у .dlg-lines показывает скрытый текст задания на слух */
.dlg-lines { display: grid; gap: 4px; }
.msg { display: grid; grid-template-columns: 34px minmax(0, 1fr); column-gap: 6px; row-gap: 1px; max-width: 92%; justify-self: start; }
.msg.r { justify-self: end; grid-template-columns: minmax(0, 1fr) 34px; }
.msg > .who, .msg > .bubble { grid-column: 2; }
.msg.r > .who, .msg.r > .bubble { grid-column: 1; }
/* аватар персонажа (content/art/avatars) или нейтральная иконка; у правого собеседника — справа */
.ava { grid-column: 1; grid-row: 1 / span 2; align-self: end; width: 34px; height: 34px; border-radius: 50%; overflow: hidden;
  display: grid; place-items: center; background: var(--accent-soft); color: var(--accent); }
.msg.r > .ava { grid-column: 2; }
.ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ava svg { width: 22px; height: 22px; margin-top: 6px; opacity: .75; }
.msg.t1 .ava { background: var(--sun-soft); color: color-mix(in srgb, var(--sun) 70%, var(--ink)); }
.msg.t2 .ava { background: var(--good-soft); color: var(--good); }
.msg.t3 .ava { background: var(--bad-soft); color: var(--bad); }
.msg.on .ava { box-shadow: 0 0 0 2px var(--accent); }
.msg .who { font-size: 12px; font-weight: 800; color: var(--accent); padding-inline: 4px; }
.msg.r .who { text-align: right; }
.msg.t1 .who { color: color-mix(in srgb, var(--sun) 70%, var(--ink)); } .msg.t2 .who { color: var(--good); } .msg.t3 .who { color: var(--bad); }
.bubble { display: grid; grid-template-columns: 1fr auto; column-gap: 6px; align-items: start; padding: 6px 6px 6px 11px; background: var(--surface);
  border: 1.5px solid var(--line); border-radius: 14px 14px 14px 4px; text-align: left; cursor: pointer; transition: border-color .15s; }
.msg.r .bubble { border-radius: 14px 14px 4px 14px; background: var(--sunken); border-color: transparent; }
.bubble .es { font-size: 16px; line-height: 1.4; padding-top: 2px; }
.bubble small { grid-column: 1; color: var(--muted); font-size: 14px; line-height: 1.35; }
.lplay { grid-column: 2; grid-row: 1; width: 30px; height: 30px; margin: -2px -2px -4px 0; border: 0; border-radius: 50%; background: none; color: var(--accent); font-size: 11px; display: grid; place-items: center; }
.msg.on .bubble { border-color: var(--accent); }
.msg.on .lplay { background: var(--accent); color: var(--on-accent); }
.hide-tr .bubble small, .hide-tr .reading .tr { display: none; }
.no-tts .lplay, .no-tts .dlg-play, .no-tts .dlg-speed { display: none; }
@media (prefers-reduced-motion: reduce) { .bubble { transition: none; } }
.spoiler { background: var(--ink); color: transparent; border-radius: 4px; cursor: pointer; transition: all .2s; }
.spoiler.open { background: none; color: inherit; }
.reading { display: grid; gap: 10px; }
.reading .text { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; font-size: 17px; }
.reading .tr { color: var(--muted); font-size: 15px; }

/* упражнения */
.prompt { display: grid; gap: 8px; }
.prompt .q { font-size: 22px; font-family: var(--display); font-weight: 600; line-height: 1.25; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.prompt .sub { color: var(--muted); font-weight: 700; font-size: 15px; }
.listen { display: grid; justify-items: center; gap: 10px; padding: 10px 0; }
.listen .row2 { display: flex; gap: 12px; align-items: center; }
.opts { display: grid; gap: 10px; }
.opt { display: grid; grid-template-columns: 30px 1fr; gap: 12px; align-items: center; text-align: left; padding: 14px; border-radius: var(--r); border: 2px solid var(--line); background: var(--surface); font-weight: 700; font-size: 17px; box-shadow: 0 2px 0 var(--line); }
.opt .k { width: 28px; height: 28px; border-radius: 8px; border: 2px solid var(--line); display: grid; place-items: center; font-size: 13px; color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); }
.opt.right { border-color: var(--good); background: var(--good-soft); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opts.locked .opt { cursor: default; }
.answer-line { min-height: 64px; border-bottom: 2px solid var(--line); display: flex; flex-wrap: wrap; gap: 8px; align-content: flex-start; padding-bottom: 10px; }
.bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tok { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 8px 12px; font-weight: 700; font-size: 17px; box-shadow: 0 2px 0 var(--line); }
.tok.used { visibility: hidden; }
.tok.bad { border-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
.tok.hint { border-color: var(--good); background: var(--good-soft); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
.mf { display: flex; flex-wrap: wrap; gap: 8px 10px; justify-content: center; font-size: 20px; font-weight: 700; }
.slot { padding: 6px 10px; border-radius: 10px; background: var(--sunken); color: var(--muted); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
.slot.open { background: var(--good-soft); color: var(--ink); letter-spacing: 0; }
.slot.cur { outline: 2px solid var(--accent); }
.slot.bad { outline-color: var(--bad); background: var(--bad-soft); animation: shake .3s; }
.letter { text-align: center; }

/* Сценарий урока (уроки сайта с блоками learn, choose, write, match, sort, build, mission, more). */
.player { grid-template-columns: minmax(0, 1fr); }   /* длинное название урока в .pctx не раздвигает экран */
.pbody .wrap { grid-template-columns: minmax(0, 1fr); }   /* и длинное слово на карточке (encantado/a) — тоже */
.wcard .word, .wcard .pron { overflow-wrap: anywhere; }
@media (max-width: 360px) { .wcard.compact .word { font-size: 19px; } }
.pctx { font-size: 12px; font-weight: 700; color: var(--muted); padding-bottom: 6px; margin-top: -6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prompt .q.qtext { font-family: var(--body); font-weight: 700; font-size: 20px; }
.qpic { width: 140px; height: 140px; border-radius: 18px; background: #f9f4ea; justify-self: center; object-fit: cover; }
.mini-dlg { display: grid; gap: 6px; }
.mini-dlg .msg .bubble { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.mini-dlg .msg.gap .bubble { color: var(--muted); border-style: dashed; }

<div id="app"></div>

<script>
const COURSE = /*__DATA__*/{};

/* ================================================================ утилиты */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pad = n => String(n).padStart(2, "0");
const dayStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const dayNum = (s = dayStr()) => Math.round(Date.parse(s + "T12:00:00Z") / 864e5);
const numDay = n => new Date(n * 864e5).toISOString().slice(0, 10);
const plural = (n, one, few, many) => { const m10 = n % 10, m100 = n % 100; return m10 === 1 && m100 !== 11 ? one : m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20) ? few : many; };
const words = n => `${n} ${plural(n, "слово", "слова", "слов")}`;

/* ================================================================ прогресс (в браузере ученика) */
const KEY = "espanol-cada-dia.v1";
// done — пройденные уроки (любой версии: открывают следующий урок, звёзды, опыт); ver — пройденная версия содержания
// урока (запись без неё — версия 1); skills — повторение конструкций; ctl — попытки итогов A0 и A1.
const fresh = () => ({ done: {}, ver: {}, skills: {}, ctl: {}, grammar: {}, grammarRead: {}, xp: 0, days: {}, streak: { n: 0, best: 0, last: "" }, words: {}, goal: 30, openAll: false, sound: true });
let P = fresh();
try { P = Object.assign(fresh(), JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) { /* без хранилища — прогресс только до перезагрузки */ }
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(P)); } catch (e) {} };
const save = () => { saveLocal(); markDirty(); };

/* ================================================================ вход через Telegram и копия прогресса на сервере */
// Без входа прогресс живёт только в браузере. После входа его копия лежит у бота на Cloudflare (ключ — номер
// в Telegram), поэтому очистка данных браузера и другое устройство ничего не стирают. На сервер отправляем редко
// (раз в 5 минут и при закрытии страницы): у бесплатного хранилища дневной лимит записей, общий с ботом.
const TOKEN_KEY = "espanol-cada-dia.token", NAME_KEY = "espanol-cada-dia.name";
const API = COURSE.api || "", MAIN_HOST = "espanolcadadia.pages.dev", SYNC_EVERY = 5 * 60e3;
const store = { get: k => { try { return localStorage.getItem(k) || ""; } catch (e) { return ""; } },
  set: (k, v) => { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (e) {} } };
let token = store.get(TOKEN_KEY);
const sync = { dirty: false, timer: 0, last: 0, sent: "", busy: false };

// Объединение двух копий: только «объединить» и «взять большее», поэтому повторная синхронизация ничего не раздувает.
function mergeProgress(a, b) {
  b = b || {};
  const pristine = !Object.keys(a.done || {}).length && !(a.xp > 0) && !Object.keys(a.words || {}).length;
  const out = pristine ? { ...a, ...b } : { ...b, ...a };   // настройки: в пустом браузере берём сохранённые
  out.done = { ...(b.done || {}) };
  for (const [id, d] of Object.entries(a.done || {})) if (!out.done[id] || (d.stars || 0) >= (out.done[id].stars || 0)) out.done[id] = d;
  out.words = { ...(b.words || {}) };
  for (const [w, s] of Object.entries(a.words || {})) {
    const o = out.words[w];
    if (!o || (s.s || 0) > (o.s || 0) || ((s.s || 0) === (o.s || 0) && (s.due || 0) >= (o.due || 0))) out.words[w] = s;
  }
  out.xp = Math.max(a.xp || 0, b.xp || 0);
  out.grammar = { ...(b.grammar || {}) };
  out.grammarRead = { ...(b.grammarRead || {}), ...(a.grammarRead || {}) };
  for (const [id, result] of Object.entries(a.grammar || {})) {
    if (!out.grammar[id] || result.correct >= out.grammar[id].correct) out.grammar[id] = result;
  }
  out.days = { ...(b.days || {}) };
  for (const [d, v] of Object.entries(a.days || {})) out.days[d] = Math.max(v, out.days[d] || 0);
  // Версии уроков, навыки и попытки итогов: из двух записей берём «бо́льшую», поэтому повтор ничего не меняет.
  const better = (x, y, cmp) => { const o = { ...(y || {}) }; for (const [k, v] of Object.entries(x || {})) if (!o[k] || cmp(v, o[k]) >= 0) o[k] = v; return o; };
  out.ver = better(a.ver, b.ver, (x, y) => (x.v || 0) - (y.v || 0) || (x.stars || 0) - (y.stars || 0) || String(x.at || "").localeCompare(String(y.at || "")));
  out.skills = better(a.skills, b.skills, (x, y) => (x.n || 0) - (y.n || 0) || (x.due || 0) - (y.due || 0));
  out.ctl = better(a.ctl, b.ctl, (x, y) => (x.n || 0) - (y.n || 0) || (x.best || 0) - (y.best || 0));
  const sa = a.streak || {}, sb = b.streak || {}, newer = (sa.last || "") >= (sb.last || "") ? sa : sb;
  out.streak = { n: newer.n || 0, last: newer.last || "", best: Math.max(sa.best || 0, sb.best || 0, newer.n || 0) };
  return out;
}

function logout(msg) { token = ""; store.set(TOKEN_KEY, ""); store.set(NAME_KEY, ""); if (msg) toast(msg); }
function markDirty() {
  if (!token) return;
  sync.dirty = true;
  if (!sync.timer) sync.timer = setTimeout(() => { sync.timer = 0; push(); }, SYNC_EVERY);
}
async function api(path, init = {}) {
  const r = await fetch(API + path, { ...init, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token } });
  if (r.status === 401) { logout("Войдите снова: срок входа закончился"); throw new Error("unauthorized"); }
  if (!r.ok) throw new Error("http " + r.status);
  return r.json();
}
// Забрать копию с сервера, объединить с этим браузером, при изменении записать обратно.
async function syncNow(render_ = true) {
  if (!token || sync.busy) return;
  sync.busy = true;
  try {
    const { progress } = await api("/site/progress");
    P = Object.assign(fresh(), mergeProgress(P, progress));
    saveLocal();
    sync.sent = JSON.stringify(progress || null) === JSON.stringify(P) ? JSON.stringify(P) : sync.sent;
    sync.busy = false;
    await push(true);
    if (render_ && !S) render();
  } catch (e) { /* нет сети или вход закончился: прогресс останется в браузере */ } finally { sync.busy = false; }
}
async function push(force = false, keepalive = false) {
  if (!token || (!force && !sync.dirty)) return;
  const body = JSON.stringify(P);
  if (body === sync.sent) { sync.dirty = false; return; }
  if (keepalive && body.length > 60000) keepalive = false;
  try {
    const r = await fetch(API + "/site/progress", { method: "PUT", keepalive, body, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token } });
    if (r.status === 401) return logout("Войдите снова: срок входа закончился");
    if (r.ok) { sync.sent = body; sync.dirty = false; sync.last = Date.now(); clearTimeout(sync.timer); sync.timer = 0; }
  } catch (e) { /* повторим при следующем изменении */ }
}
window.onTelegramAuth = async user => {
  try {
    const r = await fetch(API + "/site/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(user) });
    if (!r.ok) throw new Error("login");
    token = (await r.json()).token; store.set(TOKEN_KEY, token); store.set(NAME_KEY, user.first_name || user.username || "");
    await syncNow(); render(); toast("Вы вошли: прогресс сохраняется");
  } catch (e) { toast("Не удалось войти, попробуйте ещё раз"); }
};
function mountLogin() {
  const box = document.getElementById("tglogin");
  if (!box || !COURSE.bot) return;
  const s = document.createElement("script");
  s.async = true; s.src = "https://telegram.org/js/telegram-widget.js?22";
  s.dataset.telegramLogin = COURSE.bot; s.dataset.size = "large"; s.dataset.radius = "12"; s.dataset.onauth = "onTelegramAuth(user)";
  box.appendChild(s);
}
function accountPanel() {
  if (!API) return "";
  const name = store.get(NAME_KEY);
  if (token) return `<section class="panel"><h2>Аккаунт</h2><span>✅ Прогресс сохраняется в Telegram${name ? `: ${esc(name)}` : ""}</span>
    <div class="two"><button class="btn ghost" data-sync>Сохранить сейчас</button><button class="btn ghost" data-logout>Выйти</button></div></section>`;
  if (location.hostname !== MAIN_HOST) return `<section class="panel"><h2>Аккаунт</h2><span class="muted">Вход через Telegram работает на основном сайте.</span></section>`;
  return `<section class="panel"><h2>Сохранить прогресс</h2><span>Войдите через Telegram: прогресс не пропадёт, даже если очистить данные браузера.</span><div id="tglogin"></div></section>`;
}
addEventListener("pagehide", () => { push(false, true); });
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "hidden") push(false, true);
  else if (token && Date.now() - sync.last > 60e3) syncNow();
});
try { navigator.storage?.persist?.(); } catch (e) { /* не страшно */ }
if (token) setTimeout(() => syncNow(), 800);

const LESSONS = COURSE.lessons;
const INTERVALS = COURSE.intervals || [1, 3, 7, 14, 30, 60, 120];
// Все слова курса по написанию: в каком уроке слово впервые появилось.
const WORDS = new Map();
LESSONS.forEach((L, i) => L.words.forEach(w => { if (!WORDS.has(w.es)) WORDS.set(w.es, { ...w, li: i }); }));
const FORMS = COURSE.forms || {};   // форма слова → слово курса: «tengo» → «tener»

const isDone = i => !!P.done[LESSONS[i].id];
// Версия содержания: прохождение старой версии (запись без ver — версия 1) не подтверждает новые цели урока.
// Уроки, отмеченные «Я учусь в канале», на сайте не проходили — у них ни одна версия не подтверждена.
const verOf = i => { const L = LESSONS[i], d = P.done[L.id]; return P.ver?.[L.id]?.v || (d && !d.joined ? 1 : 0); };
const isCurrent = i => isDone(i) && verOf(i) >= (LESSONS[i].version || 1);
const isOutdated = i => isDone(i) && !P.done[LESSONS[i].id].joined && !isCurrent(i);
// Темы, которые ещё прорабатываются, на основном сайте закрыты для всех (site_open_units в course.yaml).
const unitClosed = i => !COURSE.preview && Array.isArray(COURSE.openUnits) && !COURSE.openUnits.includes(LESSONS[i]?.unit);
// Уровни после A1 открыты независимо: первый урок уровня доступен и тому, кто пришёл с готовым A1 (внутри уровня — по порядку).
const levelStart = i => i > 0 && levelOf(i) !== levelOf(i - 1) && !["A0", "A1"].includes(levelOf(i));
const isOpen = i => !unitClosed(i) && (COURSE.preview || P.openAll || i === 0 || isDone(i - 1) || isDone(i) || levelStart(i));
const currentIndex = () => { const i = LESSONS.findIndex((_, k) => !isDone(k)); return i < 0 ? LESSONS.length - 1 : i; };
const knownPool = upto => [...WORDS.values()].filter(w => w.li <= upto);
const dueWords = () => { const t = dayNum(); return Object.entries(P.words).filter(([es, s]) => s.due <= t && WORDS.has(es)).map(([es]) => WORDS.get(es)); };
const streakNow = () => { const s = P.streak; const t = dayNum(); return s.last && t - dayNum(s.last) <= 1 ? s.n : 0; };
const todayXP = () => P.days[dayStr()] || 0;

function addXP(x) {
  const today = dayStr();
  P.xp += x;
  P.days[today] = (P.days[today] || 0) + x;
  const s = P.streak;
  if (s.last !== today) {
    s.n = s.last && dayNum(today) - dayNum(s.last) === 1 ? s.n + 1 : 1;
    s.last = today;
    s.best = Math.max(s.best || 0, s.n);
  }
}

// Повторение по интервалам курса: верно — следующая ступень, ошибка — снова завтра.
function grade(es, ok) {
  const s = P.words[es] || { s: 0, due: 0 };
  if (ok) { s.due = dayNum() + INTERVALS[Math.min(s.s, INTERVALS.length - 1)]; s.s = Math.min(s.s + 1, INTERVALS.length); }
  else { s.s = 0; s.due = dayNum() + 1; }
  P.words[es] = s;
}

/* ================================================================ озвучка (голос браузера) */
// Озвучка: готовые записи нейроголосами (папка a/, карта COURSE.audio: текст → файл, реплика диалога — «@N|текст»).
// Голос телефона — только запасной и только если в телефоне есть испанский голос: иначе он читает
// испанский русским голосом, и лучше промолчать.
const AUDIO = COURSE.audio || {};
const HAS_AUDIO = Object.keys(AUDIO).length > 0;

const TTS = { ok: HAS_AUDIO || SPEECH, voice: null };
const clean = t => String(t ?? "").replace(/\s+/g, " ").trim();
function pickVoice() {
  if (!SPEECH) return;

}
if (SPEECH) { pickVoice(); speechSynthesis.addEventListener?.("voiceschanged", pickVoice); }
const audioId = (text, voice) => (voice && AUDIO[`@${voice}|${clean(text)}`]) || AUDIO[clean(text)] || null;
const canSay = (text, voice) => !!text && (!!audioId(text, voice) || (SPEECH && (TTS.voice || (pickVoice(), TTS.voice))));
// Один плеер на всю страницу: новая запись всегда останавливает прежнюю, две дорожки сразу не звучат.
// clipGen — номер текущей записи: обработчики остановленной записи (onended, onerror) уже ничего не делают.
let player = null, audioQueue = [], clipGen = 0;

  clipGen++;

}

}

  // Запись не загрузилась: испанский голос телефона, если он есть; иначе задание на слух покажет «Запись не
  // загрузилась» и «Попробовать снова» (ошибка ученика это не ошибка).
  player.onerror = () => { player.onerror = null; if (!speakText(next.text, next.slow)) audioTrouble(next.text, "fail"); playNext(); };
  player.src = `a/${next.id}.mp3`;
  setRate(next.slow ? 0.7 : 1);

// Звук задания на слух не включился: статус на экране задания (только если это его фраза и ответа ещё нет).
function audioTrouble(text, kind) {
  const st = S?.steps?.[S.at];
  if (!st || !S.state || S.state.result || clean(listenText(st)) !== clean(text)) return;
  if (S.state.audio === kind) return;
  S.state.audio = kind; render();
}
function speakText(text, slow = false) {
  if (!SPEECH || !TTS.voice && (pickVoice(), !TTS.voice)) return false;

    u.lang = "es-ES"; u.voice = TTS.voice; u.rate = slow ? 0.6 : 0.9;
    speechSynthesis.speak(u); return true;
  } catch (e) { return false; }
}
// Одна запись с концом и ошибкой: так играют реплики диалога. Нет записи или она не загрузилась —
// испанский голос телефона, если он есть; иначе onfail.
function playClip(text, { voice = null, gender = "f", rate = 1, onend = () => {}, onfail = () => {}, onblock = onfail } = {}) {
  hush(); audioQueue = [];
  const gen = clipGen, live = f => (...a) => { if (gen === clipGen) f(...a); };
  const viaSpeech = () => {
    if (!SPEECH || !TTS.voice && (pickVoice(), !TTS.voice)) return false;
    try {
      const u = new SpeechSynthesisUtterance(clean(text));
      u.lang = "es-ES"; u.voice = TTS.voice; u.rate = 0.9 * rate; u.pitch = gender === "m" ? 0.8 : 1.1;
      u.onend = live(onend); u.onerror = live(onfail);
      speechSynthesis.speak(u); DLG.via = "speech"; return true;
    } catch (e) { return false; }
  };
  const id = audioId(text, voice);
  if (!id) { if (!viaSpeech()) onfail(); return; }
  player = player || new Audio();
  DLG.via = "audio";
  player.onended = live(onend);
  player.onerror = live(() => { if (player) player.onerror = null; if (!viaSpeech()) onfail(); });
  player.src = `a/${id}.mp3`;

  if (id) {
    audioQueue.push({ id, slow, text });
    if (!queue || !player || player.paused || player.ended) playNext();
    return;
  }
  if (!SPEECH || !TTS.voice && (pickVoice(), !TTS.voice)) return;   // нет записи и нет испанского голоса — молчим
  try {
    const u = new SpeechSynthesisUtterance(clean(text));
    u.lang = "es-ES"; u.voice = TTS.voice;

}
const playBtn = (text, cls = "") => `<button class="play ${cls}" data-say="${esc(text)}" aria-label="Послушать">▶</button>`;
const slowBtn = text => `<button class="play slow" data-slow data-say="${esc(text)}" aria-label="Послушать медленно">🐢</button>`;

// Экран объяснения: общая панель — перед первым диалогом, он же выбран.

const dlgMsgs = box => box ? [...box.querySelectorAll(".msg")] : [];
const dlgBoxes = () => [...document.querySelectorAll(".dlg[data-dlg]")];

const dlgPanel = () => document.querySelector("[data-dlg-panel]");

// Автозапуск: при первом открытии слайда с диалогами в этом прохождении урока (S.dlgAuto), если не выключен

/* ================================================================ упражнения */
function meanings(ru) {
  return new Set(ru.toLowerCase().replace(/\([^)]*\)/g, "").split(/[,;/]/).map(s => s.replace(/^[\s.!?«»]+|[\s.!?«»]+$/g, "")).filter(Boolean));
}
function distractors(w, pool, field, n = 3) {
  const target = meanings(w.ru), seen = new Set([w[field].toLowerCase()]), same = [], other = [];
  for (const o of shuffle(pool)) {
    const t = o[field].toLowerCase();
    if (o.es === w.es || seen.has(t) || t.length > 70 || [...meanings(o.ru)].some(m => target.has(m))) continue;
    seen.add(t);
    (o.pos === w.pos ? same : other).push(o);
  }
  return same.concat(other).slice(0, n);
}
// mode: rec — «Что значит…?», prod — «Как по-испански…?», listen — на слух
function wordQuestion(w, pool, mode) {
  if (mode === "listen" && !canSay(w.say)) mode = "rec";
  const field = mode === "rec" ? "ru" : "es";
  const wrong = distractors(w, pool, field);
  if (wrong.length < 2) return null;
  const options = shuffle([w, ...wrong]);
  return { type: "mc", mode, word: w, options: options.map(o => o[field]), correct: options.indexOf(w), say: w.say,
           explain: [w.ex ? `<i>${esc(w.ex[0][0])}</i> — ${esc(w.ex[0][1])}` : "", w.noteMain || ""].filter(Boolean).join("<br>") };
}
// Упражнение урока «вопрос => ответ» становится викториной: неверные варианты — ответы
// на соседние вопросы того же упражнения, потом других упражнений урока, потом слова курса.
const isCyr = s => /[А-Яа-яЁё]/.test(s);
function exerciseSteps(L, pool, only) {
  const blocks = only ? [only] : L.blocks.filter(b => b.t === "exercise"), out = [];
  const all = L.blocks.filter(b => b.t === "exercise").flatMap(b => b.items.filter(it => it.ap));
  blocks.forEach(b => b.items.forEach(it => {
    if (!it.ap) return out.push({ type: "task", title: b.title, ...it });
    if (it.opts) {   // «Где ударение?»: то же слово с ударением на разных слогах
      const opts = shuffle(it.opts);
      return out.push({ type: "mc", mode: "ex", title: b.title, q: it.q, options: opts, plain: opts, correct: opts.indexOf(it.ap) });
    }
    // сам вопрос вариантом не бывает, и с подсказкой в скобках тоже: «¿Qué tal? (у вас всё отлично)»
    const seen = new Set([norm(it.ap), norm(it.qp), norm(String(it.qp ?? "").replace(/\([^)]*\)/g, " "))]), wrong = [];
    const take = cands => { for (const c of shuffle(cands)) {
      const k = norm(c.ap);
      if (wrong.length < 3 && k && !seen.has(k) && isCyr(c.ap) === isCyr(it.ap)) { seen.add(k); wrong.push(c); }
    } };
    take(b.items.filter(x => x.ap && x !== it));
    if (wrong.length < 3) take(all.filter(x => !b.items.includes(x)));
    if (wrong.length < 2 && !isCyr(it.ap) && it.ap.split(" ").length <= 3) take(pool.map(w => ({ a: esc(w.es), ap: w.es })));
    // Мало вариантов — слова урока, но не части ответа, вопроса и других вариантов («bien», «¿Y tú?» тоже были бы верны).
    if (wrong.length < 2 && !isCyr(it.ap)) take(L.words.map(w => ({ a: esc(w.es), ap: w.es }))
      .filter(c => ![it.ap, it.qp ?? "", ...wrong.map(x => x.ap)].some(t => ` ${norm(t)} `.includes(` ${norm(c.ap)} `))));
    if (wrong.length < 2) return;   // без двух правдоподобных вариантов вопрос не задаём
    const options = shuffle([it, ...wrong]);
    out.push({ type: "mc", mode: "ex", title: b.title, q: it.q, html: true,
               options: options.map(o => o.a), plain: options.map(o => o.ap), correct: options.indexOf(it) });
  }));
  return out;
}
// asked — ответы, которые урок уже спросил в упражнениях объяснения: их второй раз не задаём.
// Каждое слово — один вопрос: «Что значит», «Как по-испански» или на слух (двум словам).
function practiceFor(i, asked = new Set()) {
  const L = LESSONS[i], pool = knownPool(i), steps = [];
  const fresh = L.words.filter(w => w.srs && !asked.has(norm(w.es)));
  const heardWords = new Set(shuffle(fresh).slice(0, 2));
  fresh.forEach((w, k) => { const q = (heardWords.has(w) && wordQuestion(w, pool, "listen")) || wordQuestion(w, pool, k % 2 ? "prod" : "rec"); if (q) steps.push(q); });

  phrases.slice(0, heard).forEach(([es, ru]) => steps.push({ type: "mf", es, ru }));

  const vocab = shuffle(steps);
  const ex = [];   // упражнения стоят в самом объяснении, сразу после своей темы (см. startLesson)
  const quiz = L.quiz.map(q => {
    const order = q.shuffle ? shuffle(q.options.map((_, k) => k)) : q.options.map((_, k) => k);
    return { type: "mc", mode: "quiz", q: q.q, options: order.map(k => q.options[k]), correct: order.indexOf(q.correct), explain: q.explain };
  });

  if (all.filter(s => s.type !== "task").length < 6) {

    const extra = shuffle((unitPool.length >= 6 ? unitPool : pool).filter(w => !used.has(norm(w.es)))).slice(0, 8 - Math.min(all.length, 4));

}

// Сравнение без регистра, пунктуации и ¿¡; deaccent — ещё и без ударений (á → a, ñ → n).

/* ================================================================ шаги урока */
const visLen = b => JSON.stringify({ ...b, rowpics: undefined, steps: undefined }).replace(/<[^>]*>/g, "").length;

  L.blocks.forEach((b, k) => {

    const w = visLen(b);
    if (b.join && cur.length) { cur.push(b); weight += w; return; }   // «join: true» в уроке сайта — тот же экран
    // Короткое вступление («Прочитайте диалог вслух…») остаётся на одном экране с диалогом.
    const lead = ["dialogue", "reading"].includes(b.t) && weight < 400;

    const tiny = lead && cur.length === 1 && cur[0].t === "text" && String(cur[0].html || "").replace(/<[^>]+>/g, "").length < 120;
    const own = ["header", "rule", "note", "table", "conjugation", "dialogue", "reading", "examples", "compare", "mission"].includes(b.t);
    if (!onlyHeader() && !tiny && ((own && !lead) || weight + w > (b.t === "text" && w < 250 ? 1200 : 450))) flush();
    cur.push(b); weight += w;
    // После диалога — новый экран, если следующий блок не просится на этот же (два коротких разговора рядом).

// Экраны перестроенного урока (version ≥ 2) задаёт автор по карте слайдов: объяснения, примеры и картинки, которые

/* ================================================================ сценарий урока (уроки сайта с блоками learn…) */

// Задание к источнику (диалогу, тексту, миссии своего урока): без него не ответить, поэтому оно не уходит

const WIDE = matchMedia?.("(min-width: 900px)");

/* ================================================================ звук в заданиях на слух */
// Задание на слух нельзя засчитать, если его нельзя послушать. Нет записи и испанского голоса, запись не загрузилась
// или браузер не дал включить звук — понятный статус, «Попробовать снова» и «Нет возможности слушать»: явная
// альтернатива автора (noaudio) или задание откладывается до звука и не оценивается. Урок, пройденный так, — «без звука».
const listenText = st => st.type === "mf" ? st.es : st.say;
const audioOK = st => S.noAudio || st.noaudioUsed || (canSay(listenText(st)) && !["fail", "none"].includes(S.state?.audio));
function listenHTML(text) {
  const st = S.steps[S.at], s = S.state || {};
  if (!audioOK(st)) {
    const why = s.audio === "fail" ? "Запись не загрузилась. Проверьте интернет."
      : s.audio === "none" || !canSay(text) ? "Звука нет: записи этой фразы нет, и в телефоне нет испанского голоса." : "";
    return `<div class="listen off" role="status"><p>🔇 ${why}</p><div class="two">
      <button class="btn ghost" data-audio-retry>Попробовать снова</button><button class="btn ghost" data-noaudio>Нет возможности слушать</button></div></div>`;
  }
  return `<div class="listen"><div class="row2">${playBtn(text, "big")}${slowBtn(text)}</div>
    ${s.audio === "blocked" ? `<p class="muted">Браузер не дал включить звук сам — нажмите ▶.</p>` : ""}
    ${s.result ? "" : `<button class="linkbtn" data-noaudio>Нет возможности слушать</button>`}</div>`;
}
// Альтернатива заданию на слух: вопрос автора без звука (та же цель письменно) или «отложено до звука».
function altStep(st) {
  const na = st.noaudio;
  if (st.type === "mf") return st.ru ? { ...st, noaudioUsed: true, orig: st } : { type: "deferred", orig: st };
  if (!na) return { type: "deferred", orig: st };
  if (st.type === "mc") {
    const order = shuffle(na.o.map((_, k) => k));
    return { ...st, say: "", title: "", q: na.q, explain: na.explain || st.explain, options: order.map(k => na.o[k][0]), plain: order.map(k => na.o[k][1]),
             correct: order.indexOf(0), mistakes: {}, noaudioUsed: true, orig: st };
  }
  return { ...st, say: "", title: "", q: na.q, a: na.a, show: na.show, format: na.format || st.format, explain: na.explain || st.explain,

}
function useNoAudio() {
  S.noAudio = true; stopSpeech();
  const st = S.steps[S.at];
  if (isListen(st) && !st.noaudioUsed) { S.steps[S.at] = altStep(st); S.state = null; }
  render();
}
function audioBack() {   // «Звук снова есть»: текущее задание — снова на слух
  S.noAudio = false;
  const st = S.steps[S.at];
  if (st.orig) { S.steps[S.at] = st.orig; S.state = null; }
  render(); enterStep();
}
function retryAudio() {
  const st = S.steps[S.at], text = listenText(st);
  pickVoice(); player = null; S.state.audio = null;
  if (!canSay(text)) { S.state.audio = "none"; render(); return toast("Звука по-прежнему нет"); }
  render();
  playClip(text, { onfail: () => { if (S?.steps[S.at] === st) { S.state.audio = "fail"; render(); } },
                   onblock: () => { if (S?.steps[S.at] === st) { S.state.audio = "blocked"; render(); } } });
}
// Звук задания при входе на шаг: с записью — через плеер с проверкой ошибки загрузки.
function sayStep(text) {
  const st = S.steps[S.at];
  if (!canSay(text)) return;
  playClip(text, { onfail: () => { if (S?.steps[S.at] === st && S.state && !S.state.result) { S.state.audio = "fail"; render(); } },
                   onblock: () => { if (S?.steps[S.at] === st && S.state) { S.state.audio = "blocked"; render(); } } });
}
function srcPlay() {
  const st = S.steps[S.at], b = srcOf(st);
  if (!b) return;
  if (b.t === "reading") return say(b.say);
  const box = document.querySelector(".srcbox .dlg[data-dlg]");

}
function chatHTML(st) {

  return `<div class="mini-dlg">${st.lines.map(([who, es, ru, sp]) => {
