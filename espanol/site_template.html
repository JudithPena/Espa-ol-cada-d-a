const kickerOf = (st, fallback) => st.chat ? `<span class="kicker">💬 ${st.chat.title || "Разговор"} · ${Math.min(st.chat.k + 1, st.chat.n)} из ${st.chat.n}</span>`
  : `<span class="kicker">${st.noaudioUsed ? "🔇 Без звука · " : ""}${st.review ? `🔁 Повторим${SKILLS[st.reviewTag] ? ": " + esc(SKILLS[st.reviewTag].title) : ""} · ` : st.mission ? `🎯 ${st.mission} · ` : ""}${st.title || fallback}</span>`;
const wordPic = es => { const w = WORDS.get(es); return w?.img ? `<img class="qpic" src="${w.img}" alt="">` : ""; };

let S = null;   // текущее занятие
let view = { tab: "home", level: null };

function startLesson(i) {
  if (COURSE.resources && dataWait([COURSE.resources.common, LESSONS[i]._data, ...completedLevelRefs()], () => startLesson(i))) return;
  const L = LESSONS[i];
  if (L.scripted) return startScript(i);
  const screens = theoryScreens(L);
  // Короткое вступление («Давайте проверим, как вы освоили чтение») — на первом экране, а не отдельным слайдом.
  const lead = screens.length && Array.isArray(screens[0]) && screens[0].every(b => b.t === "text") && visLen(screens[0]) < 400 ? screens.shift() : [];
  const learn = [{ type: "intro", lead }];
  L.words.forEach(w => learn.push({ type: "word", word: w }));
  const pool = knownPool(i);
  screens.forEach(sc => Array.isArray(sc) ? learn.push({ type: "theory", blocks: sc }) : learn.push(...exerciseSteps(L, pool, sc.ex).slice(0, 6)));
  const asked = new Set(learn.filter(s => s.type === "mc" && s.plain).map(s => norm(s.plain[s.correct])));
  const practice = practiceFor(i, asked).map(st => st.mode === "quiz" ? { ...st, ...quizRefs(L, i, st) } : st);   // задания сразу после объяснения, без заставки
  S = newSession({ kind: "lesson", li: i, pool: knownPool(i), steps: learn.concat(practice), check: L.check || "" });
  render(); enterStep();
}
// Вопрос теста прежнего пути (уроки quiz): навык и источник — по тексту вопроса из данных урока.
function quizRefs(L, i, st) {
  const q = L.quiz.find(x => x.q === st.q);
  return q ? { li: i, src: q.src, free: !!q.free, rule: q.rule || [], skill: q.skill || [], key: `${L.id}|${norm(q.q)}` } : { li: i };
}
function startReview(list) {
  const pool = knownPool(LESSONS.length);
  const steps = shuffle(list).slice(0, 15).map(w => {
    const st = P.words[w.es]?.s || 0;
    return wordQuestion(w, pool, st >= 2 ? (Math.random() < .3 ? "listen" : "prod") : "rec");
  }).filter(Boolean);
  if (!steps.length) return toast("Пока нечего повторять");
  S = newSession({ kind: "review", pool, steps });
  render(); enterStep();
}

const isGraded = st => ["mc", "build", "mf", "write", "match", "sort", "compose"].includes(st.type);
const NEXT_MODE = { rec: "prod", prod: "listen", listen: "rec" };

// Самостоятельная ошибка возвращается в конце урока в другом виде, как в Busuu: «Что значит» → «Как по-испански»
// → на слух; у викторины перемешиваются варианты. Повтор в счёт «с первой попытки» не идёт.
// Вопрос к источнику в конец урока не уходит: он повторяется сразу после своей группы, с открытым источником.
function retryOf(st) {
  if (st.word && NEXT_MODE[st.mode]) {
    const q = wordQuestion(st.word, S.pool, NEXT_MODE[st.mode]);
    if (q) return { ...q, retry: true };
  }
  if (st.type === "mc") {
    const order = shuffle(st.options.map((_, k) => k));
    return { ...st, options: order.map(k => st.options[k]), plain: st.plain && order.map(k => st.plain[k]),
             correct: order.indexOf(st.correct), retry: true };
  }
  return { ...st, retry: true };
}
// Итог задания — то, что ученик в итоге сделал, а не первая ошибка:
//   good     — решил сам (в том числе исправив свою ошибку: зелёный, звук успеха, пометка «Исправлена 1 ошибка»);
//   helped   — решил с подсказкой (плитка, первые буквы, текст скрытого аудио): жёлтый;
//   revealed — ответ показала система: не засчитано как самостоятельное;
//   bad      — ошибка.
// ok — с первой попытки, без ошибок и подсказок: «с первой попытки» и звёзды считаются отдельно.
// Исход первой попытки (first / fixed / helped / revealed / bad) идёт в итог контроля и в повторение навыков.
function answer(ok, st, { requeue = true, solved = ok, helped = false, revealed = false } = {}) {
  const s = S.state;
  helped = helped || !!s.peek || !!s.helps;
  s.result = revealed ? "revealed" : solved ? (helped ? "helped" : "good") : "bad";
  if (ok && helped) ok = false;
  if (st.chat) { requeue = false; chatRecord(st, s); }
  const outcome = ok ? "first" : s.result === "good" ? "fixed" : s.result;
  if (!st.retry && !S.seen.has(st)) {
    S.seen.add(st); S.graded++; if (ok) S.firstTry++; if (outcome === "fixed") S.fixed++;
    if (st.noaudioUsed || (S.noAudio && srcOf(st)?.hidden)) S.noAudioUsed++;
    if (S.noAudio && srcOf(st)?.hidden) st.noaudioUsed = true;   // скрытый диалог прочитан, а не услышан
    S.outcomes.push({ outcome, skill: st.skill || [], key: st.key, ctx: isCtx(st), title: st.title, noaudio: !!st.noaudioUsed });
    if (st.word) grade(st.word.es, ok);           // расписание повторения слов меняем сразу
  }
  s.requeued = "";
  // Контроль — проверка, ошибки в нём не переспрашиваются; в тренировке ошибка возвращается один раз, не по кругу.
  if (!ok && !["good", "helped"].includes(s.result) && requeue && !st.retry && S.check !== "control") {
    const again = retryOf(st);
    if (isCtx(st)) {
      let at = S.at + 1;   // сразу после своей группы вопросов к тому же источнику
      // (повторы уже ошибочных вопросов этой группы — тоже её часть: порядок повторов совпадает с порядком вопросов)
      while (at < S.steps.length && isCtx(S.steps[at]) && S.steps[at].src === st.src && S.steps[at].li === st.li) at++;
      S.steps.splice(at, 0, { ...again, srcOpen: true });
      s.requeued = "near";
    } else { S.steps.push(again); s.requeued = "end"; }
  }
  if (s.result === "good" || s.result === "helped") say(solvedSay(st));
  render();
  sfx(s.result === "good" ? (s.almost ? "almost" : true) : s.result === "helped" ? "almost" : s.result === "revealed" ? null : false);
  // Автор просил без автоперехода: и после верного ответа — «Продолжить» и пояснение (пример, «На заметку»).
}
// Что прозвучит после верного ответа: собранная фраза, слово, введённый ответ или испанский вариант.
function solvedSay(st) {
  const s = S.state;
  if (st.type === "build") return (s.cands?.[0] || tokens(st)).join(" ");
  if (st.type === "compose") return "";
  if (st.type === "mf") return st.es;
  if (st.type === "write") return /[А-Яа-яЁё]/.test(s.match || "") ? "" : s.match || "";
  if (st.type === "mc" && st.mode === "choose") { const o = st.plain[st.correct]; return /[А-Яа-яЁё]/.test(o) ? "" : o; }
  return st.mode === "prod" || st.mode === "listen" ? st.word?.say : "";
}
let autoTimer = null;
/* ================================================================ звуки (Web Audio, без файлов) */
let audioCtx = null;
function sfx(ok) {
  if (!P.sound || ok === null) return;   // null — ответ показан системой: без звука успеха и без звука ошибки
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume().catch(() => {});
    const t0 = audioCtx.currentTime;
    // Success rises brightly, almost-correct uses two soft sine tones, errors fall low.
    const notes = ok==='almost' ? [[523,0,.13],[587,.11,.25]] : ok ? [[659, 0, .12], [988, .09, .22]] : [[196, 0, .16], [147, .12, .26]];
    for (const [freq, start, end] of notes) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = ok==='almost' ? "sine" : ok ? "triangle" : "sawtooth";
      o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0 + start);
      g.gain.exponentialRampToValueAtTime(ok==='almost' ? 0.10 : ok ? 0.25 : 0.09, t0 + start + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + end);
      o.connect(g).connect(audioCtx.destination);
      o.start(t0 + start); o.stop(t0 + end + 0.02);
    }
  } catch (e) {}
}
// Назад — к ближайшему экрану с объяснением (слово, теория): уже отвеченные вопросы не пересдаём.
function prevIndex() {
  if (!S || S.kind === "result") return -1;
  for (let k = S.at - 1; k >= 0; k--) if (!isGraded(S.steps[k]) && !["task", "deferred"].includes(S.steps[k].type)) return k;
  return -1;
}
function prev() {
  const k = prevIndex();
  if (k < 0) return;
  clearTimeout(autoTimer);
  S.at = k; S.state = null;
  render();
  window.scrollTo(0, 0);
}
function next() {
  clearTimeout(autoTimer);
  S.at++; S.state = null;
  if (S.at >= S.steps.length) return finish();
  render(); enterStep();
}
// Вход на шаг (и первый шаг урока тоже): звук карточки или задания на слух. «Нет возможности слушать» —
// задание на слух сразу заменяется альтернативой, и звук не включается.
function enterStep() {
  if (!S || S.kind === "result") return;
  const st = S.steps[S.at];
  if (!st) return;
  if (S.noAudio) { if (isListen(st) && !st.noaudioUsed) useNoAudio(); return; }
  if (!S.state) render();
  if (st.type === "word") say(st.word.say);
  if (st.chat && st.line) say(st.line[3], { voice: chatVoice(st).v });
  if (st.type === "chatlog") (st.end || []).forEach((l, k) => say(l[3], { voice: chatVoice(st).v, queue: k > 0 }));
  if (st.type === "mc" && (st.mode === "listen" || st.mode === "rec")) say(st.say);
  if (st.type === "mc" && st.mode === "choose" && st.say) sayStep(st.say);
  if (st.type === "write" && st.say) sayStep(st.say);
  if (st.type === "mf") sayStep(st.es);
}
// Итог занятия. Ноль оценённых заданий — не 100 %, а «не засчитано» (например, урок только на слух без звука).
// Контроль (check: control — итоги A0 и A1; soft — тесты тем): балл 1 / 0,5 / 0,25 / 0 за первую попытку
// (с первого раза / исправил сам / с подсказкой / показан ответ или ошибка), порог PASS. Не сдан control — урок
// не засчитан, следующий закрыт с объяснением; не сдан soft — честная оценка, но дальше пускаем.
const PASS = 0.8;
const scoreOf = outcomes => outcomes.length ? outcomes.reduce((a, o) => a + OUTCOME_SCORE[o.outcome], 0) / outcomes.length : 0;
function topics(outcomes) {
  const by = {};
  for (const o of outcomes) for (const tag of o.skill?.length ? o.skill : ["_"]) (by[tag] = by[tag] || []).push(o);
  return Object.entries(by).filter(([tag]) => tag !== "_" && SKILLS[tag]).map(([tag, list]) => ({ tag, title: SKILLS[tag].title, score: scoreOf(list), li: skillLesson(tag) }))
    .sort((a, b) => a.score - b.score);
}
function finish() {
  const n = S.outcomes.length, acc = n ? S.firstTry / n : 0, score = scoreOf(S.outcomes);
  const noaudio = S.noAudioUsed + S.steps.filter(x => x.type === "deferred").length;
  let xp = 0, learned = [], stars = acc >= .9 ? 3 : acc >= .7 ? 2 : 1, passed = n > 0;
  if (S.kind === "lesson") {
    const L = LESSONS[S.li], prev = P.done[L.id], check = S.check;
    if (check) {
      stars = score >= .9 ? 3 : score >= PASS ? 2 : 1;
      const c = P.ctl[L.id] || { n: 0, best: 0 };
      P.ctl[L.id] = { n: c.n + 1, best: Math.max(c.best || 0, Math.round(score * 100)), last: Math.round(score * 100), at: dayStr() };
      if (check === "control") passed = passed && score >= PASS;
    }
    if (passed) {
      const v = L.version || 1, pv = P.ver[L.id], fresh = !prev || prev.joined || !isCurrent(S.li);
      xp = (fresh ? 10 : 5) + S.firstTry * 2;
      P.done[L.id] = { stars: Math.max(stars, prev?.joined ? 0 : prev?.stars || 0), acc: Math.round(acc * 100), at: dayStr() };
      const keepFull = pv && pv.v === v && !pv.noaudio;   // уже пройден со звуком — пометка «без звука» не нужна
      P.ver[L.id] = { v, stars: Math.max(stars, pv && pv.v === v ? pv.stars || 0 : 0), acc: Math.round(acc * 100), at: dayStr(),
                      ...(noaudio && !keepFull ? { noaudio } : {}) };
      L.words.filter(w => w.srs).forEach(w => { if (!P.words[w.es]) { P.words[w.es] = { s: 0, due: dayNum() + INTERVALS[0] }; learned.push(w); } });
    } else if (n) xp = 5 + S.firstTry;   // попытка итога: опыт за работу, но урок не засчитан
  } else if (n) {
    xp = 5 + S.firstTry * 2;
  }
  updateSkills(S.outcomes.filter(o => !o.noaudio));
  if (xp) addXP(xp);
  save();
  S = { kind: "result", from: S.kind, li: S.li, xp, acc, stars, learned, passed, graded: n, score, check: S.check, noaudio,
        topics: topics(S.outcomes), fixed: S.fixed };
  render();
}

  if (!doneN && !P.joined) html += `<button class="btn ghost wide" style="margin-top:12px" data-join>Я уже учусь в канале</button>`;
  if (due) html += `<div class="notice">🔁 Пора повторить ${words(due)}<button class="btn" data-review="due">Повторить</button></div>`;
  // Обновлённые уроки: старое прохождение сохранено, но новые цели подтверждаются только новой версией.
  const old = LESSONS.map((_, i) => i).filter(i => levelOf(i) === lv && isOutdated(i));
  if (old.length) html += `<div class="notice">🆕 ${plural(old.length, "Обновлён", "Обновлены", "Обновлено")} ${old.length} ${plural(old.length, "урок", "урока", "уроков")}: пройдите новую версию<button class="btn" data-lesson="${old[0]}">Урок ${LESSONS[old[0]].n}</button></div>`;
  for (const U of COURSE.units) {
    const idx = LESSONS.map((L, i) => L.unit === U.number ? i : -1).filter(i => i >= 0);
    if (!idx.length || U.level !== lv) continue;
    const done = idx.filter(isDone).length, locked = !isOpen(idx[0]);
    html += `<section class="unit ${locked ? "locked" : ""}" id="unit-${U.number}">
      <div class="unit-head"><div class="tile" aria-hidden="true"></div>
        <span class="num">Тема ${U.number} · ${esc(U.level)}</span><h3>${esc(U.title)}</h3>
        <span class="prog">${unitClosed(idx[0]) ? "🔒 скоро откроется" : `${done} / ${idx.length} ${done === idx.length ? "· пройдена ✓" : ""}`}</span></div>
      ${U.goals.length && !locked ? `<ul class="goals">${U.goals.map(g => `<li>${esc(g)}</li>`).join("")}</ul>` : ""}
      <ol class="path">${idx.map(i => {
        const L = LESSONS[i], d = P.done[L.id], open = isOpen(i), cur = i === ci && !d;
        const cls = d ? "done" : cur ? "current" : open ? "open" : "locked";
        const right = d ? `<span class="stars" aria-label="${d.stars} из 3">${"★".repeat(d.stars)}${"☆".repeat(3 - d.stars)}</span>` : cur ? `<span class="go">Начать</span>` : open ? "" : "🔒";
        const prevL = LESSONS[i - 1], gate = !d && !open && prevL?.check === "control" && !P.done[prevL.id];
        const note = isOutdated(i) ? `<small class="upd">🆕 Урок обновлён — пройти новую версию</small>`
          : d && P.ver[L.id]?.noaudio ? `<small class="upd">🔇 Пройден без звука — аудирование не подтверждено</small>`
          : gate ? `<small class="upd">🔒 Откроется после итога «${esc(prevL.title)}»: нужно ${PASS * 100} %</small>`
          : L.check === "control" && !d && P.ctl[L.id] ? `<small class="upd">Лучший результат ${P.ctl[L.id].best} %, нужно ${PASS * 100} %</small>` : "";
        return `<li><button class="step ${cls}" data-lesson="${i}"><span class="node">${d ? "✓" : L.emoji}</span>
          <span class="t"><b>${L.n}. ${esc(L.title)}</b><small>${rowNote(L)}</small>${note}</span>${right}</button></li>`;
      }).join("")}</ol></section>`;
  }
  return html;
}

function reviewView() {
  const due = dueWords(), learned = Object.keys(P.words).filter(es => WORDS.has(es));
  if (!learned.length) return `<section class="panel"><div class="empty"><span class="e">🌱</span><b>Здесь появятся ваши слова</b>
    <span>Пройдите первый урок со словами, и через день курс предложит их повторить.</span><button class="btn" data-tab="course">К урокам</button></div></section>`;
  const next = Object.values(P.words).map(s => s.due).filter(d => d > dayNum()).sort((a, b) => a - b)[0];
  const weak = learned.filter(es => (P.words[es].s || 0) <= 1).map(es => WORDS.get(es));
  return `<section class="panel"><span class="kicker">Повторение по интервалам</span>
      <div class="big-num">${due.length}</div><span>${due.length ? plural(due.length, "слово ждёт", "слова ждут", "слов ждут") + " повторения сегодня" : "Сегодня всё повторено"}</span>
      ${due.length ? `<button class="btn wide" data-review="due">Повторить ${due.length > 15 ? "15 слов" : ""}</button>` : next ? `<span class="muted">Следующее повторение: ${new Date(numDay(next)).toLocaleDateString("ru", { day: "numeric", month: "long" })}</span>` : ""}
    </section>
    <section class="panel"><h2>Трудные слова</h2>
      <span class="muted">${weak.length ? `${words(weak.length)}, которые ещё не закрепились.` : "Трудных слов нет."}</span>
      ${weak.length >= 3 ? `<button class="btn ghost wide" data-review="weak">Потренировать трудные</button>` : ""}
      <button class="btn ghost wide" data-review="all">Случайные 15 из всех выученных</button>
    </section>
    ${phrasePanel()}
    ${COURSE.bot ? `<section class="panel"><h2>В Telegram</h2><span>Те же слова можно повторять с ботом <a href="https://t.me/${esc(COURSE.bot)}" target="_blank" rel="noopener">@${esc(COURSE.bot)}</a>: он сам напомнит в среду и субботу.</span></section>` : ""}`;
}

// «Фразы и конструкции»: повторение навыков по интервалам (P.skills), а не случайные задания.
function phrasePanel() {
  const started = Object.keys(P.skills).filter(t => SKILLS[t]);
  if (!started.length) return "";
  const due = dueSkills();
  const next = started.map(t => P.skills[t].due).filter(d => d > dayNum()).sort((a, b) => a - b)[0];
  return `<section class="panel"><h2>Фразы и конструкции</h2>
    <span class="muted">${due.length ? `Пора повторить: ${due.slice(0, 4).map(t => esc(SKILLS[t].title)).join(", ")}${due.length > 4 ? ` и ещё ${due.length - 4}` : ""}.`
      : next ? `Сегодня всё повторено. Следующее: ${new Date(numDay(next)).toLocaleDateString("ru", { day: "numeric", month: "long" })}.` : ""}</span>
    <button class="btn ${due.length ? "" : "ghost "}wide" data-review="phrases">${due.length ? "Повторить конструкции" : "Потренировать трудные"}</button></section>`;
}
function wordsView() {
  const list = [...WORDS.values()].filter(w => P.words[w.es]);
  if (!list.length) return `<section class="panel"><div class="empty"><span class="e">📚</span><b>Словарь пока пуст</b><span>Слова попадают сюда после урока.</span></div></section>`;
  const q = (view.q || "").toLowerCase();
  const shown = list.filter(w => !q || w.es.toLowerCase().includes(q) || w.ru.toLowerCase().includes(q));
  return `<section class="panel"><h2>Мои слова · ${list.length}</h2>
    <input class="search" id="wsearch" type="search" placeholder="Найти слово по-испански или по-русски" value="${esc(view.q || "")}" autocomplete="off">
    <ul class="wordlist">${shown.map(w => {
      const s = Math.min(P.words[w.es].s || 0, 5);
      return `<li>${playBtn(w.say)}<span class="w"><span class="es">${esc(w.emoji)} ${esc(w.es)}</span><small>${esc(w.ru)}</small></span>
        <span class="strength" aria-label="Закреплено на ${s} из 5">${[0, 1, 2, 3, 4].map(k => `<i class="${k < s ? "on" : ""}"></i>`).join("")}</span></li>`;
    }).join("") || `<li><span></span><span class="muted">Ничего не нашлось</span></li>`}</ul></section>`;
}

// Только цели, подтверждённые прохождением текущей версии урока; уроки старой версии — отдельной строкой.
function skillsPanel() {
  const units = COURSE.units.map(U => [U, LESSONS.map((L, i) => i).filter(i => LESSONS[i].unit === U.number && LESSONS[i].goal && isCurrent(i))]).filter(([, ls]) => ls.length);
  const old = LESSONS.filter((_, i) => isOutdated(i) && LESSONS[i].goal).length;
  if (!units.length && !old) return "";
  return `<section class="panel"><h2>Что вы уже умеете</h2><div class="skills">${units.map(([U, ls]) =>
    `<div><b>Тема ${U.number}. ${esc(U.title)}</b><ul>${ls.map(i => `<li>✓ ${esc(LESSONS[i].goal)}${P.ver[LESSONS[i].id]?.noaudio ? ` <small class="muted">(без звука — пройти со звуком)</small>` : ""}</li>`).join("")}</ul></div>`).join("")}</div>
    ${old ? `<span class="muted">Ещё ${old} ${plural(old, "урок обновлён", "урока обновлены", "уроков обновлены")}: эти умения подтвердятся после новой версии.</span>` : ""}</section>`;
}
function statsView() {
  const doneN = LESSONS.filter((_, i) => isDone(i)).length, learned = Object.keys(P.words).length;
  const strong = Object.values(P.words).filter(s => s.s >= 3).length, current = LESSONS.filter((_, i) => isCurrent(i)).length;
  const days = [...Array(7)].map((_, k) => numDay(dayNum() - 6 + k));
  const max = Math.max(P.goal, ...days.map(d => P.days[d] || 0));
  const wd = d => new Date(d + "T12:00:00").toLocaleDateString("ru", { weekday: "short" });
  return `<section class="panel"><h2>Ваш прогресс</h2>
    <div class="stats">
      <div class="stat"><b>${doneN}<small class="muted" style="font-size:14px"> / ${LESSONS.length}</small></b><span>уроков пройдено${current < doneN ? `, из них в новой версии ${current}` : ""}</span></div>
      <div class="stat"><b>${learned}</b><span>слов в повторении</span></div>
      <div class="stat"><b>${strong}</b><span>слов закреплено</span></div>
      <div class="stat"><b>${streakNow()} 🔥</b><span>дней подряд, рекорд ${P.streak.best || 0}</span></div>
    </div></section>
  <section class="panel"><h2>Опыт за неделю</h2>
    <div class="week">${days.map(d => { const v = P.days[d] || 0; return `<div class="col ${v ? "" : "zero"}"><span>${v || ""}</span><i style="height:${Math.max(3, v / max * 90)}px"></i><span>${wd(d)}</span></div>`; }).join("")}</div>
    <div class="level-bar"><div class="lb"><span>Сегодня</span><span>${todayXP()} из ${P.goal} опыта</span></div><div class="bar sun"><i style="width:${Math.min(100, todayXP() / P.goal * 100)}%"></i></div></div>
  </section>
  ${skillsPanel()}
  ${accountPanel()}
  <section class="panel settings"><h2>Настройки</h2>
    <div class="row"><span>Звуки ответов</span><button class="switch" data-sound aria-pressed="${P.sound !== false}" aria-label="Звуки ответов"></button></div>
    <div class="row"><span>Автовоспроизведение диалогов</span><button class="switch" data-auto-dlg aria-pressed="${P.autoDlg !== false}" aria-label="Автовоспроизведение диалогов"></button></div>
    <div class="row"><span>Цель на день</span><span class="seg">${[20, 30, 50].map(g => `<button data-goal="${g}" aria-pressed="${P.goal === g}">${g}</button>`).join("")}</span></div>
    <div class="row"><span>Сбросить прогресс</span>${view.confirmReset ? `<span class="confirm"><button class="btn bad" data-reset="yes">Да, сбросить</button><button class="btn ghost" data-reset="no">Отмена</button></span>` : `<button class="btn ghost" data-reset="ask">Сбросить</button>`}</div>
  </section>`;
}

/* ================================================================ отрисовка: занятие */
// Примеры крупными плитками: по нажатию слово звучит, под ним транскрипция.
// Плитка примера: фраза (с озвучкой), под ней транскрипция или перевод. Длинные фразы — во всю ширину.
const exChips = ex => ex?.length ? `<span class="exs">${ex.map(([h, say, pron, ru]) => `<button class="exw${say.length > 16 ? " wide" : ""}" data-say="${esc(say)}"><span>${h}</span>${pron ? `<small>[${esc(pron)}]</small>` : ""}${ru ? `<small>${esc(ru)}</small>` : ""}</button>`).join("")}</span>` : "";
const pairsHTML = ps => ps?.length ? `<div class="pairs">${ps.map(([w, say, mid, ru, note]) => `<button class="pair" data-say="${esc(say)}"><span class="pw${say.length > 9 ? " long" : ""}">${w}</span>${mid ? `<small>${mid}</small>` : ""}<span class="pr">«${esc(ru)}»</span>${note ? `<small class="pn">${note}</small>` : ""}</button>`).join("")}</div>` : "";
const cardsHTML = cs => `<div class="cards">${cs.map(c => c.lead ? `<p class="lead">${c.html}</p>`
  : `<div class="sent${c.key ? " key" : ""}">${c.html ? `<span>${c.html}</span>` : ""}${pairsHTML(c.pairs)}${exChips(c.ex)}</div>`).join("")}</div>`;
const stepsOl = items => `<ol class="steps">${items.map(it => `<li><span class="cond">${it.html}</span>${pairsHTML(it.pairs)}${exChips(it.ex)}</li>`).join("")}</ol>`;
// Сравнение карточками рядом (уроки сайта): big — крупные цветные карточки (одна — во всю ширину), small — компактные плитки.
const compareHTML = b => `<div class="cmp ${b.style === "small" ? "small" : "big"}">${b.title ? `<h4>${b.title}</h4>` : ""}${b.lead ? `<p class="cmp-lead">${b.lead}</p>` : ""}
  <div class="cmp-row n${b.cards.length}${b.cards.some(c => c.ex.some(e => e[1].length > 16)) ? " hasex" : ""}">${b.cards.map(c => `<div class="cmp-card ${esc(c.tone || "")}">
    ${c.say ? `<button class="cmp-head${c.say.length > 9 ? " long" : ""}" data-say="${esc(c.say)}">${c.head}</button>` : `<span class="cmp-head${c.head.replace(/<[^>]*>/g, "").length > 12 ? " long" : ""}">${c.head}</span>`}
    ${c.label ? `<b class="cmp-label">${c.label}</b>` : ""}${c.html ? `<span class="cmp-text">${c.html}</span>` : ""}${exChips(c.ex)}</div>`).join("")}</div>
  ${b.note ? `<p class="cmp-note">${b.note}</p>` : ""}</div>`;
// Пункты с эмодзи — шкала: значок на линии, мысль и плитки примеров рядом.
const stepsHTML = st => `<ol class="tline">${st.map(c => `<li${c.icon ? "" : ' class="noicon"'}><span class="ti" aria-hidden="true">${c.icon ? esc(c.icon) : ""}</span><div class="tb">${c.html ? `<span>${c.html}</span>` : ""}${pairsHTML(c.pairs)}${exChips(c.ex)}</div></li>`).join("")}</ol>`;
function blockHTML(b) {
  const box = (cls, lbl, html) => `<div class="box ${cls}"><span class="lbl">${lbl}</span>${html}</div>`;
  switch (b.t) {
    case "text": return b.items ? stepsOl(b.items) : b.cards ? cardsHTML(b.cards) : `<p>${b.html}</p>`;
    case "header": return `<h3>${b.html}</h3>`;
    case "rule": return b.items ? box("rule", "Правило", stepsOl(b.items)) : box("rule", "Правило", b.html);
    case "tip": return b.items ? `<div class="cardsbox tip"><span class="lbl">💡 Подсказка</span>${stepsOl(b.items)}</div>` : b.cards ? `<div class="cardsbox tip"><span class="lbl">💡 Подсказка</span>${cardsHTML(b.cards)}</div>` : box("tip", "Подсказка", b.html);
    case "note": return b.items ? `<div class="cardsbox"><span class="lbl">👀 Обратите внимание</span>${stepsOl(b.items)}</div>` : b.cards ? `<div class="cardsbox"><span class="lbl">👀 Обратите внимание</span>${cardsHTML(b.cards)}</div>` : box("note", "Обратите внимание", b.html);
    case "latam": return box("latam", "🌎 В Латинской Америке", b.html);
    case "culture": return box("culture", "Культура", b.html);
    case "task": return box("task", "Задание", b.html);
    case "compare": return compareHTML(b);
    case "mission": return `<div class="mission"><span class="lbl">🎯 Миссия</span>${b.title ? `<h3>${b.title}</h3>` : ""}<p>${b.html}</p></div>`;
    case "more": return `<details class="more-box"><summary>${b.title || "Подробнее"}</summary><div>${b.html}</div></details>`;
    case "list": return b.steps ? stepsHTML(b.steps) : `<ul>${b.items.map(x => `<li>${x}</li>`).join("")}</ul>`;
    case "cando": return box("cando-box", "Теперь вы умеете", `<ul class="cando">${b.items.map(x => `<li>${x}</li>`).join("")}</ul>`);
    case "examples": return `<div class="box">${b.title ? `<span class="lbl">${b.title}</span>` : ""}<ul class="exl">${b.items.map(([es, ru, sp]) => `<li>${playBtn(sp)}<span><span class="es">${es}</span><small>${ru}</small></span></li>`).join("")}</ul></div>`;
    case "table": return `<div class="tbl"><table>${b.title ? `<caption>${b.title}</caption>` : ""}${b.rows.map((r, ri) => `<tr>${r.map((c, ci) => `<td>${ci === 0 && b.rowpics?.[ri] ? `<img class="rowpic" src="${b.rowpics[ri]}" alt="">` : ""}${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
    case "conjugation": {
      const who = ["yo", "tú", "él / ella / usted", "nosotros", "vosotros", "ellos / ustedes"];
      return `<div class="tbl"><table><caption>${b.title || `${esc(b.verb)}${b.ru ? " — " + b.ru : ""}`}</caption>${b.forms.map((f, k) => `<tr><td class="muted">${who[k]}</td><td class="es">${esc(f)}</td><td style="width:44px">${playBtn(f)}</td></tr>`).join("")}</table></div>`;
    }
    case "dialogue": return dialogueHTML(b);
    case "reading": return `<div class="reading hide-tr" data-dlg><div class="row"><span class="ttl es">${b.title || "Текст"}</span>
        <span class="row" style="gap:8px">${playBtn(b.say)}<button class="btn ghost sm" data-toggle-tr>Перевод</button></span></div>
        <div class="text">${b.html}</div>${b.tr ? `<div class="tr">${b.tr}</div>` : ""}</div>`;
  }
  return "";
}

// Карточка слова: картинка (рядом или над словом — по типу слова) или значок, слово, транскрипция, «Слушать» и
// «Медленно», перевод. «На заметку» — только важное (noteMain), остальное свёрнуто в «Подробнее» (noteMore).
function wordCard(w) {
  const compact = w.img && !w.imgBig && ["noun", "adj", "word", "num"].includes(w.pos) && w.es.length <= 20;
  const kind = !w.img ? "emo" : compact ? "compact" : "big";
  const more = w.noteMore || [];
  return `<div class="wcard ${kind}">
    ${kind === "big" ? `<img class="pic" src="${w.img}" alt="">` : ""}
    <div class="whead">${kind === "compact" ? `<img class="wpic" src="${w.img}" alt="">` : kind === "emo" ? `<span class="emo" aria-hidden="true">${esc(w.emoji)}</span>` : ""}
      <div class="wbody"><span class="word${w.es.length > 18 ? " long" : ""}">${esc(w.es).replace(/\//g, "/<wbr>")}</span>${w.pron ? `<span class="pron">[${esc(w.pron)}]</span>` : ""}
      </div></div>
    ${canSay(w.say) ? `<div class="aud"><button data-say="${esc(w.say)}" aria-label="Послушать">▶ Слушать</button><button data-slow data-say="${esc(w.say)}" aria-label="Послушать медленно">🐢 Медленно</button></div>` : ""}
    <div class="tr">${esc(w.ru)}</div>
    ${w.noteMain ? `<div class="sec trap"><b>На заметку</b><div>${w.noteMain}</div></div>` : ""}
    ${more.length ? `<details class="more"><summary>Подробнее</summary>${more.map(([t, x]) => `<p><b>${t}.</b> ${x}</p>`).join("")}</details>` : ""}
  </div>`;
}

function stepBody(st) {
  const L = S.kind === "lesson" ? LESSONS[S.li] : null;
  switch (st.type) {
    case "intro": {
      return `<span class="kicker">Урок ${L.n} · Тема ${L.unit}</span><h2>${esc(L.title)}</h2>
        <div class="theory leadin">${st.lead.map(blockHTML).join("")}</div>`;
    }
    case "word": return `<span class="kicker">Новое слово</span>${wordCard(st.word)}`;
    case "theory": return theoryHTML(st.blocks);
    case "mc": {
      const s = S.state, locked = s.result ? "locked" : "";
      let prompt;
      if (st.mode === "quiz") prompt = `${srcPanel(st)}<span class="kicker">Тест</span><div class="q" style="font-family:var(--body);font-weight:700;font-size:20px">${esc(st.q)}</div>`;
      else if (st.mode === "ex") prompt = `<span class="kicker">${st.title || "Упражнение"}</span><div class="q" style="font-family:var(--body);font-weight:700;font-size:20px">${st.q}</div>`;
      else if (st.mode === "rec") prompt = `<span class="kicker">Что значит</span><div class="q"><span>${esc(st.word.emoji)} ${esc(st.word.es)}</span>${playBtn(st.say)}</div>`;
      else if (st.mode === "prod") prompt = `<span class="kicker">Как по-испански</span><div class="q">${esc(st.word.ru)}</div>`;
      else if (st.mode === "choose") prompt = `${srcPanel(st)}${kickerOf(st, st.say ? "Послушайте и выберите" : st.lines?.length ? "Что ответить?" : "Выберите ответ")}
        ${st.img ? wordPic(st.img) : ""}${convHTML(st)}${st.q && st.lines?.length ? `<div class="q qtext">${st.q}</div>` : ""}${st.lines?.length ? chatHTML(st) : ""}
        ${st.say ? listenHTML(st.say) : ""}
        ${st.q && !st.lines?.length ? `<div class="q qtext">${st.q}</div>` : ""}`;
      else prompt = `<span class="kicker">Послушайте и выберите</span><div class="listen"><div class="row2">${playBtn(st.say, "big")}${slowBtn(st.say)}</div></div>`;
      if (st.mode === "choose" && st.say && !audioOK(st) && !s.result) return `<div class="prompt">${prompt}</div>`;   // без звука варианты не показываем: угадывать нечего
      const long = (st.plain || st.options).some(o => o.length > 24);
      return `<div class="prompt">${prompt}</div>
        <div class="opts ${long ? "" : "grid2"} ${locked}" role="group">${st.options.map((o, k) => {
          let cls = "";
          if (s.result) cls = k === st.correct ? "right" : k === s.pick ? "wrong" : "";
          const mark = s.result && k === st.correct ? "✓" : s.result && k === s.pick ? "✗" : k + 1;
          return `<button class="opt ${cls}" data-opt="${k}" aria-pressed="${s.pick === k}" ${s.result ? "disabled" : ""}><span class="k">${mark}</span><span>${st.html ? o : esc(o)}</span></button>`;
        }).join("")}</div>`;
    }
    case "build": {
      const s = S.state;
      return `<div class="prompt">${srcPanel(st)}${kickerOf(st, "Соберите фразу")}${convHTML(st)}<div class="q" style="font-size:19px">${st.task || esc(st.ru)}</div></div>
        <div class="answer-line">${(s.cands?.[0] || tokens(st)).slice(0, s.n).map(w => `<span class="tok">${esc(w)}</span>`).join("")}</div>
        <div class="bank">${s.tiles.map((t, k) => `<button class="tok ${s.used[k] ? "used" : ""} ${s.flash === k ? "bad" : ""} ${s.hint === k ? "hint" : ""}" data-pick="${k}" ${s.result || s.used[k] ? "disabled" : ""}>${esc(t)}</button>`).join("")}</div>`;
    }
    case "mf":
      if (!st.noaudioUsed && !audioOK(st) && !S.state.result) return `<div class="prompt"><span class="kicker">Мастер фраз</span>${listenHTML(st.es)}</div>`;
      return `<div class="prompt"><span class="kicker">${st.noaudioUsed ? "🔇 Без звука · " : ""}Мастер фраз</span>${st.noaudioUsed ? `<div class="q qtext">Соберите по-испански: ${esc(st.ru)}</div>` : ""}</div>
        ${st.noaudioUsed ? "" : `<div class="listen"><div class="row2">${playBtn(st.es, "big")}${slowBtn(st.es)}</div></div>`}
        ${mfSlots(st, S.state)}
        ${S.state.result ? "" : `<input class="field letter" id="letter" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Первая буква слова" aria-label="Первая буква следующего слова">`}`;
    case "write": {
      const s = S.state, done = !!s.result, cls = done ? (s.result === "good" ? "right" : s.result === "helped" ? "almost" : "wrong") : s.flash ? "wrong" : "";
      const chars = ["á", "é", "í", "ó", "ú", "ü", "ñ"];
      const head = `${srcPanel(st)}${kickerOf(st, st.say ? "Послушайте и напишите" : "Напишите")}${st.img ? wordPic(st.img) : ""}${convHTML(st)}
          ${st.say ? listenHTML(st.say) : ""}
          ${st.q ? `<div class="q qtext">${st.q}</div>` : ""}`;
      if (st.say && !audioOK(st) && !done) return `<div class="prompt">${head}</div>`;
      return `<div class="prompt">${head}</div>
        <div class="wbox"><input class="field wfield ${cls}" id="wans" type="text" value="${esc(s.value || "")}" ${done ? "disabled" : ""}
            autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" lang="es" enterkeyhint="done"
            placeholder="${esc(st.format || "Ответ")}" aria-label="${esc(st.format || "Ответ")}">
          ${done || !st.chars ? "" : `<div class="chars" role="group" aria-label="Испанские буквы">${chars.map(c => `<button type="button" data-wchar="${c}" aria-label="Вставить ${c}">${c}</button>`).join("")}</div>`}
          ${s.why && !done ? `<div class="wwhy" role="status">${whyHTML(s.why)} Попробуйте ещё раз.</div>${ruleHTML(st)}` : ""}
          ${done ? "" : writeHintHTML(st, s)}</div>`;
    }
    case "match": {
      const s = S.state, cell = (side, k) => {
        const p = st.pairs[k], ok = s.done.includes(k), sel = s.sel?.side === side && s.sel.k === k, bad = s.bad && s.bad[side] === k;
        return `<button class="mt${ok ? " ok" : ""}${bad ? " bad" : ""}" data-m="${side}:${k}" aria-pressed="${sel}" ${ok || s.result ? "disabled" : ""}>${ok ? "✓ " : bad ? "✗ " : ""}${esc(p[side === "l" ? 0 : 1])}</button>`;
      };
      return `<div class="prompt">${srcPanel(st)}${kickerOf(st, "Соедините пары")}</div>
        <div class="match"><div class="mcol">${s.left.map(k => cell("l", k)).join("")}</div><div class="mcol">${s.right.map(k => cell("r", k)).join("")}</div></div>`;
    }
    case "sort": {
      const s = S.state, cur = s.order[s.k];
      return `<div class="prompt">${srcPanel(st)}${kickerOf(st, "Распределите по группам")}</div>
        ${cur && !s.result ? `<div class="scard"><span>${esc(cur[0][0])}</span>${cur[0][1] && canSay(cur[0][1]) ? playBtn(cur[0][1]) : ""}</div><div class="scount" role="status">${s.k + 1} из ${s.order.length}${s.flash != null ? " · ✗ не в эту группу" : ""}</div>` : ""}
        <div class="sgroups">${st.groups.map(([name], g) => `<button class="sg${s.flash === g ? " bad" : ""}${s.hint === g ? " hint" : ""}" data-sg="${g}" ${s.result ? "disabled" : ""}>
          <b>${name}${s.hint === g ? " 👈" : ""}</b><span class="sg-items">${s.placed[g].map(x => `<i>${esc(x)}</i>`).join("")}</span></button>`).join("")}</div>`;
    }
    case "compose":
      return `<div class="prompt">${srcPanel(st)}${kickerOf(st, "Напишите своими словами")}${convHTML(st)}${st.q ? `<div class="q qtext">${st.q}</div>` : ""}</div>${composeHTML(st)}`;
    case "chatlog":
      return `<div class="prompt"><span class="kicker">💬 ${st.chat.title || "Разговор"} · весь разговор</span></div>${convHTML(st, true)}
        <p class="muted">Прочитайте разговор целиком. ${(S.chats?.[st.chat.id] || []).some(r => r?.model) ? "Там, где ответ не получился, стоит образец." : "Все ответы — ваши."}</p>`;
    case "deferred":
      return `<div class="prompt"><span class="kicker">🔇 Без звука</span><div class="q qtext">Это задание проверяет понимание на слух. Оно отложено до звука и в итог урока не входит.</div></div>
        <button class="btn ghost wide" data-audio-on>🔊 Звук снова есть</button>`;
    case "task":
      return `<div class="prompt"><span class="kicker">${st.title ? st.title : "Упражнение"}</span><div class="q" style="font-family:var(--body);font-weight:700;font-size:20px">${st.q}</div></div>
        ${st.a ? `<div class="box"><span class="lbl">Ответ</span><span class="spoiler" tabindex="0">${st.a}</span></div>` : ""}`;
  }
  return "";
}

function mfSlots(st, s) {
  return `<div class="mf">${st.es.split(" ").map((t, k) => {
    if (k < s.n || s.result) return `<span class="slot open">${esc(t)}</span>`;
    const len = Math.max(2, t.replace(/[^\p{L}\d]/gu, "").length);
    const shown = k === s.n && s.hint ? firstLetter(t).toUpperCase() + "·".repeat(len - 1) : "·".repeat(len);
    return `<span class="slot ${k === s.n ? "cur" : ""} ${k === s.n && s.flash ? "bad" : ""}">${shown}</span>`;
  }).join("")}</div>`;
}
const tokens = st => st.es.split(" ");
// Пропускаем «слова» без букв и цифр (тире): их угадывать не нужно.
function mfSkip(st, s) { const t = tokens(st); while (s.n < t.length && !firstLetter(t[s.n])) s.n++; }
function mfLetter(ch) {
  const st = S.steps[S.at], s = S.state, t = tokens(st);
  if (s.result || !ch.trim()) return;
  if (deaccent(ch.toLowerCase()) === firstLetter(t[s.n])) { s.n++; s.here = 0; s.flash = false; s.hint = false; mfSkip(st, s); }
  else { s.err++; s.miss++; s.here++; s.flash = true; if (s.here >= 2 && !s.hint) { s.hint = true; s.helps++; } }
  if (s.n >= t.length) return answer(s.err === 0, st, { requeue: false, solved: true, helped: s.helps > 0 });
  $(".mf").outerHTML = mfSlots(st, s);
}
// Плитка сравнивается без регистра и знаков по краям: «En» и «en», «mesa.» и «mesa» — одна плитка.
const tileKey = t => String(t).toLowerCase().replace(/^[¿¡"«]+|[.,;:!?"»…]+$/g, "");
// Плитки задания сценария: без точек и заглавной буквы в начале, чтобы первое и последнее слово не выдавали
// себя и любой допустимый порядок (alt) собирался из тех же плиток. Имена (Pablo, España) остаются с заглавной.
const COMMON_WORDS = new Set("el la los las un una unos unas en de y o es son hay no sí está están qué cómo dónde".split(" "));
const bareTok = t => String(t).replace(/^[¿¡"«]+|[.,;:!?"»…]+$/g, "");
function buildTiles(st) {
  const show = t => { const b = bareTok(t), low = b.toLowerCase(); return b !== low && (FORMS[low] || COMMON_WORDS.has(low) || WORDS.has(low)) ? low : b; };
  return shuffle(st.es.split(" ").map(show).concat((st.extra || []).map(show)));
}
function buildPick(k) {
  const st = S.steps[S.at], s = S.state, cands = s.cands || [tokens(st)], want = cands[0][s.n];
  if (s.used[k]) return;   // уже стоит во фразе: второе касание (двойной тап) ошибкой не считаем
  const fit = cands.filter(c => tileKey(c[s.n]) === tileKey(s.tiles[k]));
  if (fit.length) {
    const raw = fit[0][s.n];
    s.cands = fit; s.used[k] = true; s.n++; s.here = 0; s.hint = null; s.flash = null;
    if (/[A-Za-zÁÉÍÓÚÜÑáéíóúüñ]/.test(raw)) say(raw);   // русскую плитку «пиво» испанским голосом не читаем
    if (s.n >= fit[0].length) return answer(s.err === 0, st, { requeue: false, solved: true, helped: s.helps > 0 });
  } else {
    s.err++; s.miss++; s.here++; s.flash = k;
    if (s.here >= 2 && s.hint == null) { s.hint = s.tiles.findIndex((w, j) => tileKey(w) === tileKey(want) && !s.used[j]); s.helps++; }
  }
  render();
}
// Нейтральная пометка к итогу задания: сколько ошибок ученик исправил сам и сколько было подсказок.
function fixNote(st, s) {
  const parts = [];
  const miss = st.type === "write" ? (s.tries > 1 ? 1 : 0) : s.miss || 0;
  if (miss) parts.push(`${st.type === "mf" ? "исправлено букв" : "исправлено ошибок"}: ${miss}`);
  if (s.helps) parts.push(`подсказок: ${s.helps}`);
  if (s.peek) parts.push("текст открыт как подсказка");
  return parts.length ? `<span class="fix">${parts.join(" · ").replace(/^./, c => c.toUpperCase())}</span>` : "";
}
function hint() {
  const st = S.steps[S.at], s = S.state;
  s.err++; s.helps++;
  if (st.type === "build") { s.hint = s.tiles.findIndex((w, j) => tileKey(w) === tileKey((s.cands || [tokens(st)])[0][s.n]) && !s.used[j]); return render(); }
  s.n++; s.opened = (s.opened || 0) + 1; s.here = 0; s.flash = false; s.hint = false; mfSkip(st, s);   // мастер фраз: открыть слово
  // Все слова открыла система — ответ показан; иначе фраза собрана с подсказкой.
  const words = tokens(st).filter(firstLetter).length;
  if (s.n >= tokens(st).length) return answer(false, st, { requeue: false, solved: true, helped: true, revealed: s.opened >= words });
  $(".mf").outerHTML = mfSlots(st, s); $("#letter")?.focus();
}

function stepFoot(st) {
  const s = S.state;
  if (s.result) {
    const good = s.result === "good", helped = s.result === "helped", shown = s.result === "revealed";
    const solved = good || helped;
    let right = "";
    if (st.type === "mc" && !solved) right = `<span class="ans">Верно: ${st.html ? st.options[st.correct] : esc(st.options[st.correct])}</span>`;
    if (["build", "mf"].includes(st.type)) right = `<span class="ans">${esc(st.type === "build" ? (s.cands?.[0] || tokens(st)).join(" ") : st.es)}</span><span class="ex">${esc(st.ru)}</span>`;
    if (st.type === "write" && (!good || s.almost)) right = `<span class="ans">${solved ? "Правильно" : "Верно"}: ${solved ? esc(s.match) : st.show}</span>${!solved && s.why && !s.gave ? `<span class="ex">${whyHTML(s.why)}</span>` : ""}`;
    if (st.type === "mc" && !solved && s.pick != null && st.mistakes?.[st.plain?.[s.pick]]) right += `<span class="ex">${st.mistakes[st.plain[s.pick]]}</span>`;
    const ex = st.explain ? `<span class="ex">${st.explain}</span>` : "";
    const praise = ["Отлично!", "Верно!", "¡Muy bien!", "¡Perfecto!"][Math.floor(Math.random() * 4)];
    const co = st.type === "compose";
    const title = good ? (s.almost ? "Почти! Не хватает знака ударения" : st.type === "write" && s.tries > 1 ? "Верно со второй попытки" : co && s.tries > 1 ? "Готово: все условия выполнены" : praise)
      : helped ? (co ? "Сравните с образцом" : "Готово с подсказкой")
      : shown ? (co ? "Образец" : "Ответ показан")
      : "Ошибка";
    const again = s.requeued === "near" ? `<span class="ex">Посмотрите ${srcOf(st)?.t === "reading" ? "текст" : "диалог"} ещё раз — вопрос повторится сразу.</span>`
      : s.requeued === "end" ? `<span class="ex">Это задание вернётся в конце урока.</span>` : "";
    const rule = !good || (["write", "compose"].includes(st.type) && s.tries > 1) ? ruleHTML(st) : "";
    const cls = good ? "good" : helped ? "almost" : shown ? "shown" : "bad";
    return `<div class="pfoot ${cls}"><div class="wrap">
      <div class="fb"><h3>${title}</h3>${solved && !co ? fixNote(st, s) : ""}${right}${ex}${again}${rule}</div>
      <button class="btn wide ${good ? "good" : solved ? "" : shown ? "" : "bad"}" data-next>Продолжить</button></div></div>`;
  }
  if (st.type === "build" || st.type === "mf") {
    return `<div class="pfoot"><div class="wrap"><button class="btn ghost wide" data-hint>${st.type === "mf" ? "Не знаю — открыть слово" : "Подсказка"}</button></div></div>`;
  }
  if (st.type === "write") {
    if (st.say && !audioOK(st)) return "";
    return `<div class="pfoot"><div class="wrap"><div class="two">
      <button class="btn ghost" data-whint>${(s.helps || 0) >= 2 ? "Показать ответ" : "Подсказка"}</button><button class="btn" data-primary ${wNorm(s.value) ? "" : "disabled"}>Проверить</button></div></div></div>`;
  }
  if (st.type === "match" || st.type === "sort") return "";
  if (st.type === "compose") return `<div class="pfoot"><div class="wrap"><div class="two">
      <button class="btn ghost" data-cosample>Показать образец</button><button class="btn" data-primary ${wNorm(s.value) ? "" : "disabled"}>Проверить</button></div></div></div>`;
  let label = "Дальше", dis = "";
  if (st.type === "intro") label = "Начать";
  if (st.type === "mc") return "";   // ответ — нажатием на вариант
  if (st.type === "task") label = "Готово";
  return `<div class="pfoot"><div class="wrap"><button class="btn wide" data-primary ${dis}>${label}</button></div></div>`;
}

function playerView() {
  const st = S.steps[S.at];
  if (!S.state) {
    S.state = { n: 0, err: 0, miss: 0, helps: 0, here: 0 };
    if (st.type === "build") Object.assign(S.state, { tiles: Array.isArray(st.alt) ? buildTiles(st) : shuffle(tokens(st)), used: [], cands: [st.es, ...(st.alt || [])].map(x => x.split(" ")) });
    if (st.type === "mf") mfSkip(st, S.state);
    if (st.type === "write" || st.type === "compose") Object.assign(S.state, { value: "", tries: 0 });
    if (st.type === "match") Object.assign(S.state, { left: shuffle(st.pairs.map((_, k) => k)), done: [], sel: null, bad: null });
    if (st.type === "match") S.state.right = matchOrder(st.pairs.length).map(k => S.state.left[k]);
    if (st.type === "sort") Object.assign(S.state, { order: shuffle(st.groups.flatMap(([, items], g) => items.map(it => [it, g]))), k: 0, placed: st.groups.map(() => []) });
    if (st.srcOpen) S.state.srcOpen = true;   // повтор вопроса к источнику — с открытым источником
  }
  const L = S.kind === "lesson" ? LESSONS[S.li] : null;
  // Шапка вместо титульного слайда: уровень, тема, номер и название урока, цель — одной-двумя строками.
  const ctx = L ? `${esc(levelOf(S.li) || "")} · Тема ${L.unit} · Урок ${L.n} · ${esc(L.title)}${L.goal ? `<span class="pgoal">🎯 ${esc(L.goal)}</span>` : ""}` : "Повторение";
  const total = S.steps.length, pct = Math.round(S.at / total * 100);
  return `<div class="player">
    <div class="ptop"><div class="wrap"><button class="x" data-quit aria-label="Выйти из урока">×</button>${prevIndex() >= 0 ? '<button class="x prev" data-prev aria-label="Назад">←</button>' : ""}<div class="bar"><i style="width:${pct}%"></i></div><span class="pcount">${S.at + 1}/${total}</span></div>
      <div class="wrap pctx">${ctx}</div></div>
    <div class="pbody"><div class="wrap">${stepBody(st)}</div></div>
    ${stepFoot(st)}
  </div>`;
}

function resultView() {
  const r = S, L = r.li != null ? LESSONS[r.li] : null, lesson = r.from === "lesson";
  const nextI = lesson && r.passed && r.li + 1 < LESSONS.length ? r.li + 1 : null;
  const pct = Math.round(r.score * 100);
  const again = lesson ? `<button class="btn ${r.passed ? "ghost " : ""}wide" data-lesson="${r.li}" data-free>Пройти ещё раз</button>` : "";
  const home = `<button class="btn ghost wide" data-home>На карту курса</button>`;
  // Ничего не оценено (все задания на слух отложены): урок не засчитан, это не ошибка ученика.
  if (!r.graded) return `<div class="wrap result"><span class="medal">🔇</span><h2>${lesson ? "Урок не засчитан" : "Повторение не засчитано"}</h2>
    <p class="muted">Здесь нечего было проверить без звука: задания на слух отложены. Пройдите урок, когда звук заработает.</p>${again}${home}</div>`;
  const control = r.check && lesson;
  const topicsHTML = control && r.topics.length ? `<div class="panel topics"><b>По темам</b><ul>${r.topics.map(t =>
    `<li class="${t.score >= PASS ? "ok" : t.score < 0.6 ? "weak" : "mid"}"><span>${t.score >= PASS ? "✓" : "↻"} ${esc(t.title)} — ${Math.round(t.score * 100)}&nbsp;%</span>${t.score < PASS && t.li >= 0 ? `<button class="btn ghost sm" data-lesson="${t.li}" data-free>Урок ${LESSONS[t.li].n}</button>` : ""}</li>`).join("")}</ul></div>` : "";
  const failed = control && r.score < PASS;   // как в finish(): по точному баллу, а не по округлённым процентам
  const title = !lesson ? "Повторение закончено!" : failed ? "Нужно повторить" : r.check === "control" ? `${esc(L.title)}: сдано!` : `Урок ${L.n} пройден!`;
  const lead = failed ? `<p class="verdict">Результат ${pct}&nbsp;% — нужно ${PASS * 100}&nbsp;%. ${r.check === "control" ? "Следующий урок откроется, когда итог будет сдан." : "Урок засчитан, но эти темы стоит повторить."}</p>`
    : control ? `<p class="verdict">Результат ${pct}&nbsp;% (нужно ${PASS * 100}&nbsp;%).</p>` : "";
  return `<div class="wrap result${failed ? " retry" : ""}">
    <span class="medal">${failed ? "💪" : r.stars === 3 ? "🏆" : r.stars === 2 ? "🎉" : "💪"}</span>
    <h2>${title}</h2>${lead}
    ${failed ? "" : `<span class="stars-big" aria-label="${r.stars} из 3">${"★".repeat(r.stars)}${"☆".repeat(3 - r.stars)}</span>`}
    <div class="cells"><div class="cell"><b>+${r.xp}</b><span>опыта</span></div><div class="cell"><b>${Math.round(r.acc * 100)}%</b><span>с первой попытки</span></div><div class="cell"><b>${streakNow()} 🔥</b><span>дней подряд</span></div></div>
    ${r.noaudio && lesson && r.passed ? `<div class="panel noaudio"><b>🔇 Пройдено без звука</b><span class="muted">Задания на слух не проверены: пройдите урок со звуком, чтобы подтвердить аудирование.</span></div>` : ""}
    ${topicsHTML}
    ${L?.goal && lesson && r.passed && !failed ? `<div class="panel goal"><b>✅ Теперь вы можете</b><span>${esc(L.goal)}</span>${L.blocks.filter(b => b.t === "mission").map(b => `<span>🎯 Миссия «${b.title}» выполнена</span>`).join("")}</div>` : ""}
    ${r.learned.length ? `<div class="panel learned"><b>Новые слова в повторении</b><span class="muted">${r.learned.map(w => esc(w.es)).join(", ")}</span></div>` : ""}
    ${failed ? again : ""}
    ${nextI != null ? `<button class="btn wide" data-lesson="${nextI}">Следующий урок: ${esc(LESSONS[nextI].title)}</button>` : ""}
    ${home}
  </div>`;
}

const dataRequests = new Map(), dataLoaded = new Set();

const DATA_CACHE = "ecd-learning-data-v1";
function dataRefs() {

  if ("grepeatExercise" in d) return gRepeatExercise();
  if (d.gslot != null) return gSelectGap(+d.gslot);
  if (d.gslotValue != null) return gSelectGapValue(+d.slot,d.gslotValue);
  if (d.gslotChoice != null) return gSelectGap(+d.slot,+d.gslotChoice);
  if (d.gadd != null) return gBuild('add',+d.gadd);
  if (d.gremove != null) return gBuild('remove',+d.gremove);
  if ("gart" in d) return gOpenArt();
  if ("gartClose" in d) return document.querySelector('#g-art-modal')?.close();
  if ("gback" in d) return gMove(-1);
  if ("gnext" in d) return gMove(1);
  if ("gcheck" in d) return gCheck();
  if ("gnoArticle" in d) return gNoArticle();
  if ("gfeedbackToggle" in d) return gToggleFeedback();
  if ("ghideKeyboard" in d) return gHideKeyboard();
  if ("gretryMistakes" in d) return gRetry();
  if (d.gvalue != null && G) return gPickValue(d.gvalue);
  if (d.gpick != null && G) return gPick(+d.gpick);
  if (d.gchar && G) return gInsertChar(el);
  if (d.grammar) { view.grammar = d.grammar; view.tab = "grammar"; render(); window.scrollTo(0, 0); return; }
  if ("grammarList" in d) { gSave(); G = null; view.grammar = null; view.tab = "grammar"; render(); window.scrollTo(0, 0); return; }
  if (d.gretry) {
    grammarAttempts.delete(`${view.grammar}/${d.gretry}`);
    grammarDrafts.delete(`${view.grammar}/${d.gretry}`);
    render();
    document.querySelector(`[data-grammar-form="${d.gretry}"] input`)?.focus();
    return;
  }
  if (d.gaccent) return gInsertChar(el);
  if (el.classList.contains("spoiler")) return el.classList.remove("open");
  if ("closeSheet" in d) return closeSheet();
  if ("join" in d) return joinSheet();
  if ("joinGo" in d) {
    const r = joinFrom(+$("#joinfrom").value); closeSheet(); view.tab = "course"; render();
    return toast(r.lessons ? `Пройдено уроков: ${r.lessons}, слов в повторении: ${r.words}` : "Начнём с первого урока");
  }
  if (d.add) { P.words[d.add] = { s: 0, due: dayNum() + INTERVALS[0] }; save(); closeSheet(); return toast("Слово добавлено: повторим завтра"); }
  if (d.say != null) return say(d.say, { slow: "slow" in d, voice: d.voice || null });
  if ("dlgAll" in d) return dlgMain();
  if ("dlgPick" in d) return dlgPick(el.closest("[data-dlg]"));
  if ("dlgTr" in d) return dlgTranslate(el);
  if (d.dlgRate) return dlgSetRate(+d.dlgRate);
  if (d.line != null) return dlgSolo(el.closest("[data-dlg]"), +d.line);
  if ("toggleTr" in d) {
    const box = el.closest("[data-dlg]"), hidden = box.querySelector("[data-hidden-text]");
    if (hidden && hidden.hidden) { hidden.hidden = false; el.textContent = "Перевод"; return; }
    el.setAttribute("aria-pressed", box.classList.contains("hide-tr"));
    box.classList.toggle("hide-tr"); return;
  }
  if (d.level) { view.level = d.level; view.tab = "course"; render(); window.scrollTo(0, 0); return; }
  if (d.bookLevel) return bookGo(d.bookLevel);
  if (d.bookId) return bookGo(view.bookLevel, d.bookId);
  if (d.bookChapter) return bookGo(view.bookLevel, view.book, d.bookChapter);
  if (d.bookNav === "levels") return bookGo();
  if (d.bookNav === "level") return bookGo(view.bookLevel);
  if (d.bookNav === "chapters") return bookGo(view.bookLevel, view.book);
  if (d.video) { view.video = d.video; view.tab = "video"; render(); window.scrollTo(0, 0); return; }
  if (d.tab) { if (d.tab === "books") return bookGo(); if (d.tab === "course") view.level = null; if (d.tab === "grammar") view.grammar = null; view.tab = d.tab; view.confirmReset = false; render(); window.scrollTo(0, 0); return; }
  if (d.lesson != null) {
    const i = +d.lesson;
    if (unitClosed(i)) return toast("Эта тема скоро откроется");
    if (!isOpen(i) && !("free" in d)) return toast(`Сначала пройдите урок ${LESSONS[i - 1].n}`);
    return startLesson(i);
  }
  if (d.review === "phrases") return startPhraseReview();
  if (d.review) {
    const all = Object.keys(P.words).filter(es => WORDS.has(es)).map(es => WORDS.get(es));
    return startReview(d.review === "due" ? dueWords() : d.review === "weak" ? all.filter(w => (P.words[w.es].s || 0) <= 1) : all);
  }
  if ("home" in d) { S = null; view.tab = "course"; view.level = null; render(); const c = $(`#unit-${LESSONS[currentIndex()].unit}`); if (c) c.scrollIntoView({ block: "start" }); return; }
  if ("quit" in d) { clearTimeout(autoTimer); stopSpeech(); S = null; render(); return; }
  if (d.goal) { P.goal = +d.goal; save(); render(); return; }
  if ("sync" in d) { push(true).then(() => toast("Сохранено")); return; }
  if ("logout" in d) { logout("Вы вышли, прогресс остался в этом браузере"); render(); return; }
  if ("autoDlg" in d) { P.autoDlg = P.autoDlg === false; save(); render(); return; }
  if ("sound" in d) { P.sound = P.sound === false; save(); render(); if (P.sound) sfx(true); return; }
  if ("openall" in d) { P.openAll = !P.openAll; save(); render(); return; }
  if (d.reset) {
    if (d.reset === "ask") view.confirmReset = true;
    else { if (d.reset === "yes") { P = fresh(); grammarAttempts.clear(); grammarDrafts.clear(); store.set(G_SESSION_KEY, ""); store.set(G_ATTEMPTS_KEY, ""); save(); toast("Прогресс сброшен"); } view.confirmReset = false; }
    return render();
  }
  if (!S || S.kind === "result") return;
  if ("prev" in d) return prev();
  if ("noaudio" in d) return useNoAudio();
  if ("audioOn" in d) return audioBack();
  if ("audioRetry" in d) return retryAudio();
  if ("srcPlay" in d) return srcPlay();
  const st = S.steps[S.at], s = S.state;
  if ("srcPeek" in d && s && !s.result) { s.peek = true; s.srcOpen = true; return render(); }
  if ("srcTr" in d) { const box = el.closest(".srcbox")?.querySelector(".dlg"); const on = el.getAttribute("aria-pressed") !== "true";
    el.setAttribute("aria-pressed", on); box?.classList.toggle("hide-tr", !on); return; }
  if ("whint" in d && s && !s.result) return writeHint();
  if ("cosample" in d && s && !s.result) return composeGive();
  if (d.opt != null && !s.result) { s.pick = +d.opt; return answer(s.pick === st.correct, st); }
  if (d.pick != null && !s.result) return buildPick(+d.pick);
  if (d.m && !s.result) { const [side, k] = d.m.split(":"); return matchPick(side, +k); }
  if (d.sg != null && !s.result) return sortPick(+d.sg);
  if (d.wchar && !s.result) return wInsert(d.wchar);
  if ("wgive" in d) return writeGive();
  if ("hint" in d && !s.result) return hint();
  if ("primary" in d || "next" in d) return primary();
});
document.addEventListener("input", e => {
  if (e.target.dataset.ggap != null && G) {
    const response = gResponse(G.steps[G.at]);
    if (!response.checked) {
      response.gapValues = [...document.querySelectorAll('[data-ggap]')].map(input=>input.value.trim());
      response.value = response.gapValues.every(Boolean) ? response.gapValues.join(' ') : '';
      gSave(); const check = $('[data-gcheck]'); if(check) check.disabled = !response.value;
    }
    return;
  }
  if (e.target.id === "g-answer" && G) {
    const response = gResponse(G.steps[G.at]);
    if (!response.checked) { response.value = e.target.value; gSave(); const check = $("[data-gcheck]"); if (check) check.disabled = !response.value.trim(); document.querySelector('[data-gno-article]')?.setAttribute('aria-pressed',String(grammarNormalize(response.value)==='без артикля')); }
    if(e.target.tagName === 'TEXTAREA') gSyncViewport();
    return;
  }
  const grammarForm = e.target.closest("[data-grammar-form]");
  if (grammarForm) {
    const key = `${view.grammar}/${grammarForm.dataset.grammarForm}`, values = grammarDrafts.get(key) || [];
    if (/^q\d+$/.test(e.target.name)) { values[+e.target.name.slice(1)] = e.target.value; grammarDrafts.set(key, values); }
    return;
  }
  if (e.target.id === "letter") { const v = e.target.value; e.target.value = ""; return mfLetter(v.slice(-1)); }
  if ((e.target.id === "wans" || e.target.id === "coans") && S?.state && !S.state.result) { S.state.value = e.target.value; S.state.flash = false; return wSync(); }
  if (e.target.id === "wsearch") {
    view.q = e.target.value; const pos = e.target.selectionStart; render();
    const f = $("#wsearch"); f.focus(); f.setSelectionRange(pos, pos);
  }
});
document.addEventListener("focusout", () => { if(G) setTimeout(gSyncViewport,0); });
document.addEventListener("focusin", e => {
  if(G && e.target.dataset?.ggap != null) {
    G.gapIndex = +e.target.dataset.ggap;
    e.target.closest?.('.gfill-sentence')?.querySelectorAll('[data-gchar]').forEach(button=>button.dataset.gfield=e.target.id);
  }
  if(G) { gSyncViewport(); setTimeout(gSyncViewport,0); }
});
document.addEventListener("keydown", e => {
  const bookTab = e.target.closest?.("[data-book-panel-tab]");
  if (bookTab && ["ArrowLeft", "ArrowRight", "Home", "End"].includes(e.key)) {
    e.preventDefault();
    const name = e.key === "Home" ? "analysis" : e.key === "End" ? "exercises" : bookTab.dataset.bookPanelTab === "analysis" ? "exercises" : "analysis";
    bookSetPanel(name, true); return;
  }
  if (document.querySelector('#g-art-modal[open]')) return;
  if (e.key === "Escape") closeSheet();
  if (G && !G.ended) {
    if(e.key === 'Enter' && e.target.dataset?.ggap === '0' && !e.shiftKey) { e.preventDefault(); $('[data-ggap="1"]')?.focus(); return; }
    if (e.key === "Enter" && !e.shiftKey && !e.target.closest("summary,button")) { e.preventDefault(); const s = G.steps[G.at]; return s.type === "question" && !gResponse(s).checked ? gCheck() : gMove(1); }
    if (!["INPUT","TEXTAREA"].includes(e.target.tagName) && /^[1-9]$/.test(e.key)) { const option = $(`[data-gposition="${+e.key - 1}"]`); if (option && !option.disabled) option.click(); }
    return;
  }
  if (!S || S.kind === "result") return;
  const st = S.steps[S.at], s = S.state;
  if (e.key === "Enter" && e.target.id === "coans") return;   // в письме Enter — новая строка
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    const btn = $("[data-primary], [data-next]"); if (btn && !btn.disabled) primary();
    return;
  }
  if (e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  if (st.type === "mc" && !s.result && /^[1-9]$/.test(e.key) && +e.key <= st.options.length) { s.pick = +e.key - 1; answer(s.pick === st.correct, st); }
});

document.addEventListener("toggle", e => {
  if (G && e.target.classList?.contains("gplay-family")) { G.treeOpen = e.target.open; gSave(); }
  if (S?.state && e.target.matches?.("details[data-src]")) S.state.srcOpen = e.target.open;   // источник открыт — так и останется после ответа
}, true);
bookSync();
render();
</script>
